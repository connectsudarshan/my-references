are's own injection at a controlled point (mid-flush, mid-program, mid-implicit flush) and run hundreds of cycles. Correlate loss with the point of injection.\n6. **Firmware evidence:** ask for the log of the flush path: when the WP was updated in the persistent map, and whether it is written before or after the NAND program completes.\n7. **Same method for Copy:** a Copy acknowledged before the destination is programmed has the same failure shape.","pitfall":"Judging by data presence alone. The verdict depends on what the device acknowledged and what it documented.","verify":"What the specification says about persistence of ZRWA contents, of a committed write pointer after Flush Explicit ZRWA, and of the NVM Flush command on zoned namespaces, and the vendor's own guarantees.","follow":[{"q":"The device documents that window data is lost on power loss, and the host lost committed data anyway. Is that a bug?","a":"Yes, unless the host skipped a durability command the device requires. Documented volatility of the window does not cover data already committed behind the write pointer."},{"q":"How would you prove it is the host's fault instead?","a":"Show a reset or reuse of the zone in the trace, or find an out-of-order overwrite of a committed LBA that the host issued."}],"mod":11},{"id":"12.01","level":"Basic","type":"Concept","fig":null,"tags":["log-structured","design","ftl","host-gc","components"],"q":"What must a host-managed log-structured store on ZNS implement that a conventional SSD's FTL did for it?","short":"The host takes over every placement job: choosing the zone for each write, remembering where objects landed, reclaiming space with its own GC, rebuilding state after a crash, and staying within the active and open zone limits. The device keeps media management: ECC, bad blocks, wear inside a zone, and the write pointer. Design the components together, because the record format and index decide whether GC and recovery are possible.","deep":"| Job on a conventional SSD (FTL) | Host equivalent on ZNS | State the host must keep |\n|---|---|---|\n| L2P mapping | Index from object or logical block to (zone, offset, length) | In memory, plus checkpoint or self-describing records |\n| Free block pool | Zone allocator with a pool of Empty zones | Derivable from Report Zones |\n| Garbage collection | Host GC: pick victim zone, copy live data, Reset | Live and dead bytes per zone |\n| Power-fail recovery | Checkpoint plus scan of each zone up to its write pointer | Sequence numbers, CRCs, checkpoint pointer |\n| No equivalent | Active and open zone budget (module 6) | Writers per stream, reserved slots for GC |\n| Bad block handling | Device does it inside a zone. The host reacts to Read Only and Offline zones | Zone health list, spare zone reserve |\n\n- **Write path:** one writer per zone with in-order Writes, or Zone Append with completion-time indexing (12.04).\n- **Placement policy:** separate streams by expected lifetime (write-ahead log, hot, cold, GC output) so zones die together. Lifetime alignment is what keeps host GC cheap (see module 1).\n- **Metadata zones:** the store needs a place for its own superblock and checkpoints. Sequential-only zones force these to be logs too (a few zones used as a ring), which is why many designs keep a small conventional zone or a second device for metadata.\n- **What the device still does:** internal parity and ECC, bad block replacement, background refresh, wear leveling across the zones it holds. The host does not see any of that (module 8).","pitfall":"Designing the write path first and bolting on GC and recovery later. The record header and index format decide whether either can be built.","verify":null,"follow":[{"q":"Which component is hardest to get right?","a":"Recovery, because it must be correct at every possible cut point. GC is second, because it couples the index update to the zone Reset (12.15)."},{"q":"Can a store skip GC?","a":"Only when data is deleted whole-zone in write order, such as a time-series ring buffer, where Reset alone reclaims space."}],"mod":12},{"id":"12.02","level":"Basic","type":"Numeric","fig":null,"tags":["capacity","zcap","zsze","op","bad-zones","planning"],"q":"A namespace reports 1,024 zones with ZSZE = 0x100000 and ZCAP = 0xE0000 on 4 KiB LBAs. How much can the host actually store, and how do you plan spare zones?","short":"Zone size is 4 GiB and capacity is 3.5 GiB, so the LBA space is 4 TiB but at most 3.5 TiB can hold data (87.5 percent). After reserving 4 metadata zones, 21 spare zones (about 2 percent for zones that go Read Only or Offline) and 8 free zones as GC headroom, 991 zones remain for live data. Sizing sellable capacity at 900 zones (3,150 GiB) leaves about 10 percent host-chosen over-provisioning.","deep":"Assumptions: 4 KiB LBAs, uniform zones, no variable zone capacity, and reserve sizes chosen by the store, not by the spec.\n1. Zone size = 0x100000 x 4,096 B = 1,048,576 x 4,096 = 4 GiB. Zone capacity = 0xE0000 x 4,096 = 917,504 x 4,096 = 3.5 GiB. Ratio = 0.875.\n2. LBA space = 1,024 x 4 GiB = 4 TiB. Writable capacity = 1,024 x 3.5 GiB = 3.5 TiB. The last 0.5 GiB of each zone is address space that can never hold data (module 3).\n3. Reserves (all host policy):\n   - Metadata and checkpoint zones: 4.\n   - Bad zone spares: 2 percent of 1,024 = 20.5, round to 21. These cover zones that turn Read Only or Offline in service (module 3).\n   - GC headroom: 8 Empty zones that foreground writers never consume, so GC always has somewhere to write.\n4. Zones for live data = 1,024 - 4 - 21 - 8 = 991 zones = 3,468.5 GiB (3.39 TiB).\n5. Sellable capacity: choose 900 zones x 3.5 GiB = 3,150 GiB (3.08 TiB). That is 76.9 percent of the LBA space and 87.9 percent of the zone count.\n6. Host-chosen OP = (991 - 900) / 900 = 10.1 percent. This buffer controls GC cost (12.10). Spare zones are separate from it, and they shrink your data zones as zones fail.\n\nConventional comparison: the device hides its OP and you cannot change it. Here the OP is explicit and yours, so it is a tunable in the capacity plan, not a constant.\n- **Tracking:** count zones by state at start-up and after every Zone Descriptor Changed event, and re-run the plan when spares drop below the reserve.\n- **Test hook:** fill the namespace to the sellable limit with a realistic overwrite pattern and confirm GC keeps the free pool above 8 zones.","pitfall":"Quoting capacity from the LBA space (ZSZE x zones). Capacity is ZCAP x zones, and then minus your own reserves.","verify":"Whether the specification requires the namespace size to be an exact multiple of the zone size, and whether spare zones are ever pre-marked Offline at format time on your product.","follow":[{"q":"What if Identify reports a variable zone capacity?","a":"Plan per zone from Report Zones, not from a single ZCAP value, and recompute after each Reset (module 3)."},{"q":"Does the drive also keep hidden spare NAND?","a":"Yes, for bad blocks and internal metadata, and that is one reason ZCAP is below ZSZE. The size of it is vendor-specific."}],"mod":12},{"id":"12.03","level":"Basic","type":"Trap","fig":null,"tags":["trap","reset","trim","delete","space-reclaim"],"q":"Trap: \"when the application deletes an object, the store just issues Reset Zone on its zone, like TRIM.\" What is wrong with this?","short":"Reset Zone works on a whole zone and discards everything in it. Objects are far smaller than a zone, so a delete rarely empties one. Resetting a zone that still holds live data destroys it. Resetting only when nothing live remains means deletes reclaim no space until a zone is entirely dead, or until GC copies the survivors out. Reset is also a NAND erase, so it is an expensive operation to batch and throttle.","deep":"- **Granularity:** TRIM (Dataset Management deallocate) frees LBA ranges of any size and the FTL's own GC pays for the compaction. On ZNS, only Reset Zone (and Finish, which does not free anything) changes space accounting, and it works on a whole zone.\n- **The correct rule:** keep a live-byte counter per zone. A delete decrements it. A zone with live = 0 is Reset immediately (after any reader referencing it has finished, see 12.15). A zone with a low live fraction becomes a GC victim.\n- **Why lifetime matters:** if objects written together die together (same TTL, same table, same compaction generation), the counter reaches zero on its own and reclaim costs one Reset and no copying. Mixed lifetimes leave zones partly live and force relocation.\n- **Cost:** a Reset erases every block of the zone (see 4.14 for the timing model). A reset storm after a bulk delete competes with foreground I/O, so queue resets and rate-limit them.\n- **Related trap:** a block-layer discard (REQ_OP_DISCARD) is not a Reset Zone. Space reclaim on zoned storage is a store or filesystem job that issues explicit zone resets. f2fs and btrfs zoned mode do this themselves, and f2fs turns its section-sized discards into resets (9.09).","pitfall":"Resetting a zone based on the counter without waiting for outstanding readers and relocations. That converts an accounting bug into data loss.","verify":"How Dataset Management deallocate behaves on zoned namespaces in the NVM Command Set Specification (ZNS 1.4 adds no deallocate-specific accounting rule), and whether your kernel forwards block-layer discard to zoned NVMe devices.","follow":[{"q":"Can a host use Dataset Management deallocate on a ZNS namespace?","a":"ZNS 1.4 adds only one rule for it: abort with Zone Is Offline if the range touches an Offline zone (3.3.3). It defines no special deallocate effect on zone space accounting or the write pointer, so do not rely on it for reclaim; that is Reset Zone's job alone."},{"q":"How do you validate the live-byte accounting?","a":"After a random delete and write workload, walk the index, sum live bytes per zone, and compare with the counters. Any drift eventually causes a wrong Reset (data loss) or a leaked zone (capacity loss)."}],"mod":12},{"id":"12.04","level":"Intermediate","type":"Scenario","fig":null,"tags":["write","append","design","queue-depth","ordering"],"q":"You are designing the write path of a log-structured store. How do you decide between Write and Zone Append, and how many zones do you keep open?","short":"Choose by who owns ordering. If one thread owns each zone and you can reach the target bandwidth with a few zones open at QD 1 each, plain Write keeps addresses predictable and the design simple. If many producers share a zone or you need QD greater than 1 per zone, use Zone Append and build the index from completions. The open zone count follows from bandwidth per zone and the resource budget, not from thread count.","deep":"| Question | Points to Write | Points to Zone Append |\n|---|---|---|\n| Who orders writes? | One owner per zone | Many producers per zone |\n| Bandwidth per zone needed | Below one zone's QD 1 rate | Above it (see 5.09) |\n| Address needed before completion? | Yes (embedded pointers, PI reference tags) | No, index at completion |\n| Zones you can afford to open | Many | Few |\n| Device support | Always | Optional command, and ZASL caps the size |\n| Recovery | Simple: WP is the append point | Needs self-describing records (5.07) |\n\nWorked sizing (assumptions): 2 GB/s target, 409.6 MB/s per zone at QD 1 (16 KiB records at 40 us, from 5.09), 8 open zone limit with 2 reserved for GC.\n1. Write path: 2,000 / 409.6 = 4.9, so 5 zones written in parallel, each with a single owner. That uses 5 of the 6 remaining open slots and splits the log into 5 lanes that no longer follow lifetimes.\n2. Append path: one hot zone at QD 5 gives about the same bandwidth. That frees 4 open slots for hot/cold separation or for more GC writers.\n\n- **Decision rule I use:** start with Write and per-zone owners. Move to Append when the open budget or a shared log forces it, and pay for it with self-describing records and an in-flight table.\n- **Keep both paths behind one interface** so the tests can run either, and so a device without append (or a kernel that emulates it, 5.08) still works.\n- **Validate at the boundary:** run the same workload in both modes and compare the final index and zone contents byte for byte.","pitfall":"Choosing Append to raise QD, then forgetting that the resource budget and PI reference tags now depend on addresses you only learn at completion.","verify":"That Zone Append is optional and how support is advertised on your product (Commands Supported and Effects log), plus the current Linux zone write plugging behavior for your kernel.","follow":[{"q":"Does Linux change the answer?","a":"The block layer serializes plain Writes per zone (zone write plugging), so ordering is safe there but adds CPU and limits per-zone QD. Passthrough and SPDK give you no such protection (5.03)."},{"q":"Which mode is easier to fault-inject?","a":"Write, because the outcome is deterministic. Append needs a completion-time oracle (5.14)."}],"mod":12},{"id":"12.05","level":"Intermediate","type":"Scenario","fig":null,"tags":["gc","victim","hot-cold","throttle","policy"],"q":"Design the garbage collection policy for a host log-structured store on ZNS. What do you decide, and what can go wrong?","short":"Decide when to start (free zone pool below a watermark), which victim (greedy by lowest live fraction, or cost-benefit that also weighs age), where to write the survivors (a separate cold stream), how fast (throttled so foreground p99 stays within budget) and how to make relocation crash-safe (copy, index update, then Reset, in that order). Keep GC's own open and active slots reserved.","deep":"1. **Trigger:** start when the free pool falls below a high watermark (for example 8 zones in 12.02), stop above a low one. A watermark based on time-to-exhaustion (free bytes / user write rate) is more robust than a fixed count.\n2. **Victim selection:**\n   - Greedy: lowest live fraction u, cheapest copy per byte freed. Bad for data that is about to die anyway.\n   - Cost-benefit: weigh (1 - u) against u and against the age of the data, so old cold zones are not left forever and hot zones get time to die.\n3. **Placement of survivors:** write them to a cold-stream zone. Data that survived a GC pass is likely long-lived, and mixing it back with hot data recreates the problem GC is fixing.\n4. **Relocation protocol:** read live objects, append or write them to a destination zone, wait for completion (and durability if your rules require it), update the index, and only then let the victim's live counter reach zero and Reset it.\n5. **Rate limit:** GC bandwidth is stolen from foreground bandwidth (12.10). Use a controller loop on the free pool level with a floor (never starve GC) and a ceiling (protect p99).\n6. **Resources:** reserve at least one open and one active slot for GC writers, or GC deadlocks the moment user writers use them all (12.12).\n7. **Failure modes:**\n   - Free pool exhaustion: writers stall or fail, and GC needs free zones to make free zones.\n   - Livelock at high utilization: victims all have u near 1, so GC moves data forever for little gain.\n   - Reset before the last reader is done (12.15).\n   - GC reading a zone that has gone Read Only: it can still read, but it must copy everything out.","pitfall":"Tuning GC on a fresh, mostly empty drive. The policy only shows its cost near the sellable capacity limit.","verify":"None for the method. Simple Copy (module 11) may offload relocation on some devices, so check its status on your product before assuming host reads and writes.","follow":[{"q":"How do you tune it?","a":"Measure the victim live-fraction distribution and the free-pool time series under a replay of the real workload, then adjust watermarks and cold-stream separation. Do not tune on uniform random writes."},{"q":"How is this different from device GC?","a":"Same idea, but the host knows object lifetimes and can align zones to them. The device cannot, which is the reason for ZNS (module 1)."}],"mod":12},{"id":"12.06","level":"Intermediate","type":"Cross-layer","fig":null,"tags":["migration","conventional","trim","random-write","assumptions"],"q":"An application runs on a conventional NVMe SSD and must move to a ZNS SSD. What breaks first, and how do you find each problem before production?","short":"Every assumption that the device accepts random overwrites and unrestricted I/O. The application overwrites in place, updates metadata at fixed addresses, relies on TRIM to free space, reads unwritten areas and expects a normal block device. On ZNS, overwrites fail with Zone Invalid Write, space returns only through Reset Zone, and Linux may not expose the namespace. Find them with an assumption inventory, an emulated zoned device and fio in zbd mode.","deep":"| Assumption on a conventional SSD | What ZNS does | How to detect it |\n|---|---|---|\n| Overwrite any LBA in place | Write must be at the write pointer: Zone Invalid Write | Run the app on an emulated zoned device (null_blk or QEMU) |\n| Random small writes (journal, superblock) | Sequential-only zones | Trace writes and look for LBA going backwards |\n| TRIM frees space at any granularity | Only Reset Zone frees, per zone (12.03) | Watch free-zone count under a delete workload |\n| Read anything, always | Reads above the WP return the DLFEAT value, and with DULBE enabled may fail with Deallocated or Unwritten Logical Block (module 3) | Sparse-file and pre-read tests |\n| Unbounded open files or streams | MAR and MOR limits (module 6) | Scale concurrency up and watch for Too Many Active or Open Zones |\n| Any I/O size | Append limited by ZASL, and MDTS applies | Sweep sizes above 128 KiB |\n| Block device always present | Namespace can be hidden or read-only if requirements are not met (2.09, 2.15) | Check sysfs and dmesg at boot |\n| Alignment of writes to 4 KiB | Same, plus zone start alignment | Fuzz odd sizes |\n\n- **Method:** (1) inventory write patterns with `blktrace` or the NVMe tracepoints, (2) run the workload on QEMU or null_blk in zoned mode to catch failures for free, (3) run on the real drive with error injection (Read Only zone, timeout mid-zone), (4) repeat under power-cycle tests.\n- **Options for the application:** move to a zoned-aware filesystem or store (f2fs, btrfs zoned, ZenFS), adopt an intermediate layer (dm-zoned era is legacy, see module 9), or keep the application unchanged behind a translation layer that costs you a host FTL.\n- **Data migration:** copy at zone granularity, verify checksums per zone, keep a rollback path, and dual-write until the first GC cycle completes.","pitfall":"Validating on a conventional SSD with zone emulation only. Emulators do not have resource limits, resets that take time, or media faults unless you add them.","verify":"Linux discard handling for zoned block devices, kernel behavior for read-above-WP through the block layer, and current filesystem zoned-mode requirements (module 9).","follow":[{"q":"Can you run the old application on a ZNS SSD unchanged?","a":"Only through a translation layer that presents a random-write block device, which reintroduces mapping tables, GC and OP on the host."},{"q":"What is the most common first failure?","a":"Metadata or journal updates at a fixed address. They appear in the first minute as Zone Invalid Write."}],"mod":12},{"id":"12.07","level":"Intermediate","type":"Scenario","fig":null,"tags":["recovery","crash","report-zones","checkpoint","tail-scan"],"q":"After a host crash or power loss, how does the store rebuild its zone map and index from Report Zones, and what does each mismatch mean?","short":"Read Identify for the limits, Report Zones for every zone, then the newest valid checkpoint. Compare each zone's device write pointer with the checkpoint's. Equal means nothing to do. A higher device pointer means records were written after the checkpoint, so scan and validate them up to the pointer. A lower pointer, an unexpected Empty zone or an unexpected state is a device or host integrity bug, not something to repair silently.","deep":"1. **Identify and sanity:** namespace identity, ZSZE, ZCAP, MAR and MOR unchanged from the superblock. A changed geometry means a different device or a reformat.\n2. **Report Zones, all zones, paged** (4.11): build a table of state, write pointer and attributes. Open zones came back Closed (3.09), so the active count is the number of Closed zones.\n3. **Checkpoint:** two alternating slots with sequence number and CRC, pick the newest valid one. It supplies the index snapshot and the expected write pointer per zone.\n4. **Reconcile each zone:**\n\n| Device vs checkpoint | Meaning | Action |\n|---|---|---|\n| WP equal | Nothing written since | Resume or Finish |\n| WP higher | Records after the checkpoint | Tail-scan from the checkpoint WP, validate header, sequence and CRC, replay valid records |\n| WP lower | Data the checkpoint called durable is gone | Integrity bug: stop, capture, report (3.15) |\n| Empty but checkpoint has data | Lost zone mapping or an external Reset | Same, and check for a second writer |\n| Read Only or Offline unexpected | Media event during the outage | Evacuate what is readable (12.15) |\n\n5. **Torn tail:** the write pointer can land inside a record or after an incomplete one. Everything after the last valid record is dead space that cannot be truncated. Count it as dead bytes, then Finish the zone or continue after it, but never assume it is data.\n6. **Half-done operations:** a relocation whose index update did not persist is harmless, because the victim was not yet Reset. A Reset that may have been in flight is re-issued if the log says the zone was retired.\n7. **Reserve:** verify active zones are within MAR before opening new writers (6.08).\n\nRecovery time is bounded by checkpoint interval times write rate. Assumption: 2 GiB written between checkpoints and a 3 GB/s scan gives about 0.7 s, independent of capacity.","pitfall":"Assuming the device write pointer is the end of valid data. It is the end of what the device accepted, and the last record may be torn.","verify":"Zone state and write pointer after a controller reset and after unexpected power loss, and the durability rules for the write pointer, in the ZNS and NVM Command Set specifications.","follow":[{"q":"How do you test recovery?","a":"Power-cut at every operation type (append, Finish, Reset, checkpoint write, GC copy) with a programmable switch, then compare the recovered index with a model of durable operations."},{"q":"Why two checkpoint slots?","a":"A torn checkpoint write must not destroy the previous good one, and sequential-only zones cannot overwrite it, so it rotates through a small zone ring."}],"mod":12},{"id":"12.08","level":"Intermediate","type":"Debug","fig":null,"tags":["write-pointer","mismatch","timeout","shadow-state","report-zones"],"q":"The store's in-memory write pointer for a zone is 8 blocks behind what Report Zones returns. How do you find out who is right?","short":"Do not guess. Quiesce all I/O, then apply one invariant: device WP must equal the start WP plus the blocks of every Write that completed successfully. Compare the device pointer with that sum. If it matches, the host shadow is wrong. If the device is higher, a command executed without a CQE the host used, or another writer touched the zone. If the device is lower, a success was returned for data not accepted.","deep":"Host log for zone at ZSLBA 0x39C00 (starting WP 0x39C00, 8-block writes):\n```\nt(ms)   event\n0.00    submit W cid=21 slba=39C00 nlb=7\n0.02    submit W cid=22 slba=39C08 nlb=7\n0.04    submit W cid=23 slba=39C10 nlb=7\n0.90    CQE cid=22 status=OK    -> completed 8 blocks\n1.10    CQE cid=23 status=OK    -> completed 16 blocks, shadow WP = 39C10\n30.00   timeout cid=21          -> no CQE ever seen, host marks it failed\n        Report Zones: WP = 39C18\n```\nSuccessful CQEs cover 16 blocks (cid 22 and 23), so the shadow says 39C10, but the device WP 39C18 is 24 blocks past the start. Cid 22 succeeded at SLBA 39C08, and a Write only succeeds when the pointer equals its SLBA, so cid 21 must already have executed. The device is right, and the missing CQE for cid 21 is a second finding to chase (lost completion, interrupt or CQ handling).\n\nRanked causes:\n1. **Timed-out or aborted command that executed**, or a CQE the host dropped. Most common by far.\n2. **Another writer** (a stale process, a second host on a shared namespace, a test tool left running) wrote to the zone.\n3. **Report Zones read while I/O was in flight**, so the pointer already includes commands whose CQE the host had not processed. Benign, and disappears when quiesced.\n4. **Host bookkeeping bug**: a failed Write (for example Zone Invalid Write) counted as advanced, or a retry counted twice, or unit confusion between 512-byte sectors and LBAs (3.12).\n5. **Firmware bug**: WP advanced by a Write that returned an error, or not advanced by one that succeeded. Rank low until the first four are excluded.\n\nDiscriminating experiment:\n1. Stop all writers and confirm nothing else has the device open (`fuser -v /dev/nvme0n1`, check other hosts).\n2. Read Report Zones twice, a second apart, and confirm the WP is stable.\n3. Log every CQE (sqid, cid, status, nlb) and compute the sum. Compare.\n4. Repeat with a single-writer, QD 1 script and an injected timeout, so the executed-but-timed-out case is reproduced on demand.\n5. If needed, capture the SQEs and CQEs on the wire or with the kernel tracepoints and check whether cid 21 executed.\n\n**Host fix:** after a timeout, treat the zone's write pointer as unknown, stop submitting to the zone, and resynchronize with Report Zones before the next write (module 7).","pitfall":"Adjusting the host shadow to match Report Zones without finding which command caused the difference. The next mismatch will then be a data loss you cannot explain.","verify":"Whether a Report Zones write pointer can include commands the host has not yet seen complete, and that a failed Write leaves the write pointer unchanged.","follow":[{"q":"Could the mismatch be a firmware bug even when a timeout happened?","a":"Yes, but the timeout explains it fully. Prove or refute it by reproducing without a timeout."},{"q":"Why is the write pointer the reliable side?","a":"It is the device's own state and it only advances when it accepted data. Host shadow state is derived from messages that can be lost."}],"mod":12},{"id":"12.09","level":"Advanced","type":"Debug","fig":null,"tags":["open","stuck","implicit-open","explicit-open","close","resources"],"q":"Report Zones shows several zones Open long after the workload stopped, and later a new writer fails. Are the zones stuck, and how do you decide whether it is a host or a firmware problem?","short":"Usually it is expected. Zone state belongs to the device, not to a process. Stopping or crashing the application leaves its zones Open until something Closes, Finishes or Resets them, until resource pressure implicitly closes an implicit one, or until a reset or power cycle that clears open state. Explicitly opened zones are never evicted, so they do hold open slots. It is a firmware bug only if state contradicts the rules, such as an Open zone with the write pointer at capacity.","deep":"Observation (illustrative, 8 open and 14 active allowed):\n```\n$ blkzone report /dev/nvme0n1 | grep -cE 'zcond: [0-9]+\\((oi|oe)\\)'   # implicit or explicit open\n6\n```\nRanked causes:\n1. **Expected persistence:** the application exited or crashed and the controller kept running, so the zones remain Open. Implicitly open zones may be closed by the controller under pressure. The base model gives the host no idle-timeout guarantee, so the absence of an automatic Close proves nothing.\n2. **Explicit opens leaked on an error path:** the host opened a zone explicitly and never closed it. Explicit zones stay Open and consume an open slot until the host acts.\n3. **Zombie writer:** a process that is stopped or hung, not dead, still owns the zones.\n4. **Firmware state bug:** the zone should have changed state and did not. Checks that identify it:\n   - WP equals ZSLBA + ZCAP but state is Open (should be Full).\n   - Zone Open after a successful Finish or Reset.\n   - Open count from a resource probe does not match Report Zones (6.16).\n\nDiscriminating experiment:\n1. Snapshot Report Zones with attributes and record each zone's state, WP and ZCAP. Apply the state rules (3.05, 3.06) and mark contradictions.\n2. Stop every process that has the device open, then issue Close to each Open zone. Expect Closed, which keeps the active slot and frees the open one.\n3. Open MOR fresh Empty zones. If it succeeds and the next open fails at exactly MOR, the counts are honest.\n4. Do a controller reset (CC.EN cycle) and check that previously Open zones are Closed, or Empty if nothing was written (3.09 marks this as unconfirmed for a controller-only reset, so a power cycle is the firm case). Compare with the model.\n\n**Host policy:** an application that stops writing to a zone for more than a few seconds should Close it. The store should also Close all its open zones on clean shutdown, and reconcile leftovers on start-up (12.07).","pitfall":"Treating Open zones after a crash as corruption and Resetting them. Their data may be the only copy. Reconcile first.","verify":"Zone condition labels printed by blkzone on your util-linux version (oi for implicit open, oe for explicit open), whether a controller-only reset closes open zones, and whether the ZNS specification requires the controller to implicitly close before returning Too Many Open Zones.","follow":[{"q":"Does Close free an active slot?","a":"No. A Closed zone stays active and holds the active resource until it is Finished or Reset (6.04)."},{"q":"Why can a stuck Open zone block a new writer that uses implicit open?","a":"It usually cannot, since the controller may close an implicit zone to make room. If it does, the firmware refuses to evict, which is worth a bug report (6.06)."}],"mod":12},{"id":"12.10","level":"Advanced","type":"Numeric","fig":null,"tags":["gc","waf","bandwidth","budget","victim","free-pool"],"q":"A store writes 500 MB/s of user data to a ZNS SSD that can sustain 2 GB/s of sequential writes. What does host GC cost at different victim utilizations, and how much user bandwidth is left?","short":"If a victim zone has live fraction u, freeing it costs u of a zone in copies for (1 - u) of a zone freed, so host write amplification is 1 / (1 - u). At u = 0.5 the drive writes 1,000 MB/s and reads 500 MB/s for GC. At u = 0.85 the store wants 3,333 MB/s of writes, more than the drive can do, so the sustainable user rate falls to 300 MB/s. Device WAF stays near 1, so this is the whole cost.","deep":"Assumptions: user write rate R = 500 MB/s, drive sequential write ceiling W = 2,000 MB/s (writes to open zones in parallel), zone capacity 3.5 GiB = 3.758 GB, device WAF about 1, reads do not compete with writes for the ceiling, victim live fraction u is constant.\n1. Per zone reclaimed: copy u x Z live bytes, free Z bytes, net gain (1 - u) x Z.\n2. Relocation per user byte = u / (1 - u). Total writes per user byte = 1 + u / (1 - u) = 1 / (1 - u).\n3. Table (computed):\n\n| u | Host WAF | Total writes at 500 MB/s | GC reads | Max user rate at W = 2,000 |\n|---|---|---|---|---|\n| 0.30 | 1.43 | 714 MB/s | 214 MB/s | 1,400 MB/s |\n| 0.50 | 2.00 | 1,000 MB/s | 500 MB/s | 1,000 MB/s |\n| 0.70 | 3.33 | 1,667 MB/s | 1,167 MB/s | 600 MB/s |\n| 0.85 | 6.67 | 3,333 MB/s | 2,833 MB/s | 300 MB/s |\n\n4. **Victim rate at u = 0.5:** each victim nets 0.5 x 3.758 GB = 1.879 GB, so 500 MB/s needs 0.266 victims/s, one Reset every 3.8 s.\n5. **Free pool runway:** if GC stops with 8 free zones (30 GB), the user drains them in 8 x 3.758 GB / 0.5 GB/s = 60 s. GC must start well before that.\n6. **What u is in practice:** it is not the same as overall space utilization. With hot and cold separation the victims are the cold-dead zones with low u. Measure the victim distribution (12.05) instead of assuming it.\n\nDevice side: verify the assumption of WAF near 1 with the drive's own counters, not the host's (see the fair-benchmark method in module 1).","pitfall":"Reporting WAF from a fresh drive. Steady-state u only appears after the sellable capacity has been filled and overwritten.","verify":"The zone capacity and write ceiling are assumptions, so replace them with values measured on the target drive, and check that the device write counters are exposed (for example in the OCP SMART log).","follow":[{"q":"What do you do when u is high?","a":"Increase host OP (fewer sellable zones, 12.02), improve stream separation, or lower the user rate. Adding GC threads only steals foreground bandwidth."},{"q":"Does Simple Copy change the bandwidth?","a":"It can remove the host PCIe and DRAM traffic for GC, but the NAND still programs the copies, so the write budget is unchanged (module 11)."}],"mod":12},{"id":"12.11","level":"Advanced","type":"Debug","fig":null,"tags":["zone-append","alba","cqe","cid","ioctl","units"],"q":"Zone Append completions carry addresses the host does not expect: one outside the zone it addressed, one duplicated, one truncated. How do you decide whether it is decoding, bookkeeping or firmware?","short":"Treat every ALBA as a claim to verify with four invariants: it lies inside the addressed zone's writable range, no two appends overlap, the zone's WP advances by the sum of successful lengths, and reading the returned LBA yields the payload you sent. Then split by evidence. A CQE that matches the right SQID and CID but breaks an invariant is firmware. A wrong SQID/CID pairing, a 32-bit result or a wrong unit is the host.","deep":"Trace, ZSZE = 0x40000, ZCAP = 0x3C000, 16-block appends (illustrative):\n```\nsqid cid  ZSLBA      CQE dw0    dw1        status\n1    0x11 0x00300000 0x00300000 0x00000000 OK\n1    0x12 0x00300000 0x00300010 0x00000000 OK\n2    0x11 0x00300000 0x00300020 0x00000000 OK\n3    0x21 0x00340000 0x00300030 0x00000000 OK      # outside zone 0x340000\n```\nRanked causes:\n1. **CQE-to-command mapping error (host):** cid is unique only within a queue. If the host keys its table on cid alone, sqid 1 and 2 collide (both 0x11). Use (sqid, cid) taken from CQE dword 2 bits 31:16 and dword 3 bits 15:0.\n2. **Truncation (host):** ALBA is 64 bits across dwords 0 and 1. A legacy 32-bit passthrough result field or a 32-bit variable loses the upper half, visible on large namespaces or 512 B LBAs. Use the 64-bit passthrough interface.\n3. **Unit confusion (host):** Linux block layer uses 512-byte sectors. On 4 KiB LBAs, sector = LBA x 8. An ALBA that is exactly one eighth or eight times the expected value is this.\n4. **Wrong namespace (host):** two namespaces on one controller can have zones at the same LBAs.\n5. **Firmware:** returns the address after the data (start + length instead of start), returns a stale address when two appends merge in the write buffer, or misroutes a completion under queue load. The last trace row is this only if causes 1 to 4 are cleared and the SQID and CID pairing checks out.\n\nDiscriminating experiments:\n1. Quiet zone, one append with a unique pattern. ALBA must equal ZSLBA. Read that LBA back and compare.\n2. Two appends: ALBAs must be ZSLBA and ZSLBA + 16 in either order, WP must be ZSLBA + 32.\n3. If the failure needs load, capture SQEs and CQEs with the kernel tracepoints (`events/nvme`) or an analyzer and check dword 2 and 3 for the failing command.\n4. Add an invariant checker to the harness (below), so every future run tests the same four properties.\n\n| Invariant | Violation implies |\n|---|---|\n| ZSLBA <= ALBA and ALBA + nlb <= ZSLBA + ZCAP | Firmware, or host decoding |\n| No two appends overlap | Firmware, or host mapping |\n| WP delta = sum of successful lengths | Lost or extra append (12.08) |\n| Read at ALBA returns the sent payload | Address correct only if this holds |","pitfall":"Concluding the firmware is at fault from the ALBA alone. First prove the CQE belongs to the command you think.","verify":"That the passthrough ioctl in use returns 64 bits, and the nvme tracepoint field names on your kernel. (The ALBA CQE layout is confirmed: dword 0 is ALBA bits 31:00, dword 1 is bits 63:32, undefined on non-success status. ZNS 1.4, 3.4.1.2.)","follow":[{"q":"Can ALBA go backwards within one queue?","a":"Yes. Placement order is not submission order across or within queues, so only overlap and containment are invariants (5.05)."},{"q":"Is an ALBA on a failed append meaningful?","a":"No. Ignore the result field on any non-success status."}],"mod":12},{"id":"12.12","level":"Advanced","type":"Debug","fig":null,"tags":["too-many-open","under-load","gc","rollover","arbiter","resources"],"q":"The store sees Too Many Open Zones only under heavy load, about once an hour, and a retry a millisecond later works. How do you find the cause and fix it?","short":"Peak demand, not steady demand, exceeds MOR. Rollover of several streams at once, GC writers and a retry that opens a second zone can briefly hold more zones open than the host thinks. Capture Report Zones at the failure instant and compare with the host's count. More open than the host thinks means a host accounting race. At most MOR minus 1 means the firmware refused, for example because a zone had commands in flight, or leaked a slot.","deep":"Setup: MOR = 8, MAR = 14. The store has 4 user streams and 2 GC writers, so 6 steady, with 2 spare. Explicit open is used so every zone is reserved (6.07).\n\nRanked causes:\n1. **Rollover overlap (host):** a stream opens its next zone before the old one has become Full or been Closed, for example because the last write to the old zone is still in flight, or the host stops early and forgets to Close. Four streams rolling together hold 8 zones, and with 2 GC writers that is 10 opens for a short window.\n2. **Timeout retry (host):** a slow write is given up on, the stream moves to a new zone, and the old zone stays open with the original write possibly still queued.\n3. **Firmware refusal to evict:** with implicit opens, the controller normally closes an idle implicit zone. If each candidate has commands in flight, a firmware may return Too Many Open Zones. Whether that is allowed depends on the spec wording (VERIFY).\n4. **Leaked open slot (firmware):** an error or abort path leaves the internal count too high (6.16).\n5. **Another user of the namespace:** a monitor, a second fio job or a second host.\n\nDiscriminating experiment:\n1. Log every open, close, finish, full transition and reset in the host with timestamps and stream ids, and compute the peak of the host's own open count over time.\n2. On the failure, immediately Report Zones filtered to open states (or unfiltered) and count, then compare with the host peak.\n3. Force a deterministic repro: set the host budget cap to MOR - 1 (a semaphore). If failures vanish, host peak was the cause. Then set it to MOR + 1 and confirm you can reproduce on demand, which also proves the firmware limit is enforced at exactly MOR.\n4. If Report Zones shows fewer than MOR open, run the leak probe (6.16) and the in-flight test: quiesce, then repeat.\n\n**Fix:** a single resource arbiter in the store that owns open and active slots: acquire before opening, release on Full, Close, Finish, Reset or Read Only, reserve slots for GC (12.05), and treat Too Many Open Zones as a retriable condition with backoff and never as a fatal error.","pitfall":"Budgeting for the steady state. Failures happen at the peak: rollover, GC bursts and retries.","verify":"Whether the specification allows or requires implicit close when an implicit zone has commands in flight, and whether Too Many Open Zones may carry DNR.","follow":[{"q":"Should Too Many Open Zones be retried?","a":"Yes with backoff, since it usually clears when another zone closes. Do not retry Too Many Active Zones without freeing a zone (6.05)."},{"q":"How do you keep the regression test cheap?","a":"Model the peak open count in the harness and inject rollovers on all streams at once."}],"mod":12},{"id":"12.13","level":"Advanced","type":"Debug","fig":null,"tags":["reset","latency","stall","erase","gc","queues"],"q":"Foreground write latency jumps from 200 us to tens of milliseconds whenever GC resets a zone, and some Reset Zone commands take 400 ms. How do you triage it?","short":"Measure before theorizing. Time Reset Zone versus zone fill level, versus concurrent I/O and versus how many resets are in flight, and log the latency of writes to other zones during each reset. Reset time growing with fill points at a synchronous erase. Neighbor stalls point at erase competing for the same dies. Stalls that disappear on a separate queue point at head-of-line blocking in the controller. Then throttle and spread resets on the host.","deep":"Ranked causes:\n1. **Synchronous erase in Reset:** the command completes only after the zone's blocks are erased, so latency is proportional to how much of the zone was written (4.14 has the timing model).\n2. **Erase and program contend for dies:** a zone striped over all dies means a reset keeps every die busy, so writes to other zones wait. Erase suspend helps but does not remove it.\n3. **Reset storm:** GC or a bulk delete issues many resets back to back, and each waits behind the previous one.\n4. **Head-of-line blocking:** Reset Zone is an I/O command, so it shares a submission queue with writes. If the controller serializes a long command, everything behind it on that queue waits.\n5. **Firmware metadata work per reset:** journaling or flushing the zone table to NAND on every reset, adding a fixed cost that does not scale with fill.\n\nExperiment matrix (one variable at a time, others idle):\n\n| Run | Vary | What a stall pattern means |\n|---|---|---|\n| A | Reset latency at fill 0, 25, 50, 100 percent, no other I/O | Growing with fill: erase time. Flat: fixed metadata cost |\n| B | Same, with a writer on another zone | Higher latency: shared die or firmware time |\n| C | Log write latency (10 ms windows) on another zone during one reset | A spike aligned with the reset: neighbors are blocked |\n| D | Resets on their own queue versus the writers' queue | Stall goes away: queue serialization |\n| E | 1, 2, 4, 8 resets in flight | Linear growth: resets are serialized in the device |\n\n```\nfio --name=nbr --filename=/dev/nvme0n1 --zonemode=zbd --rw=write --bs=64k --direct=1 \\\n    --iodepth=4 --max_open_zones=1 --write_lat_log=nbr --log_avg_msec=10\nblkzone reset -o <zone start> -c 1 /dev/nvme0n1     # timed with date +%s.%N around it\n```\n- **Host mitigations:** at most one or two resets in flight, pace them, reset from the GC queue, prefer partly-written zones later, and raise the I/O timeout if a large Reset-all is unavoidable.\n- **Firmware asks:** a bounded worst-case reset latency in the datasheet, background erase with deterministic behavior for the next write to that zone, and a counter of erase time.","pitfall":"Tuning the store's GC to avoid resets without measuring, when the stall came from queue placement or the firmware's per-reset metadata cost.","verify":"The default value of nvme_core.io_timeout on your kernel, whether Zone Management Send is allowed to execute concurrently with writes to other zones in your controller, and erase suspend behavior of your NAND.","follow":[{"q":"The Reset returns in microseconds but later writes stall. What happened?","a":"The erase was deferred, and its cost moved to the next allocation of those blocks. Measure write throughput in the minute after a reset storm, not only reset latency (4.15)."},{"q":"What is the timeout risk?","a":"A Reset-all on thousands of full zones exceeds the Linux default I/O timeout of 30 s if erase is synchronous (4.14)."}],"mod":12},{"id":"12.14","level":"Advanced","type":"Debug","fig":null,"tags":["performance","cliff","thermal","gc","slc","steady-state"],"q":"A store benchmark writes 2.6 GB/s for four minutes, then drops to 1.1 GB/s and stays there. How do you find out whether it is host GC, the device, or the platform?","short":"Line up four time series: user bytes per second, device-written bytes per second, GC bytes per second, and drive temperature with link state. Host GC predicts the number: 2.6 / 1.1 gives an implied write amplification of 2.36, so a victim live fraction of about 0.58. If the GC counters disagree, run raw zone-sequential I/O on an all-Empty drive. A cliff at the same byte count points to the device, and at a temperature crossing to the platform.","deep":"Ranked causes:\n1. **Host GC engaged:** free pool crossed the watermark at about 624 GB (2.6 GB/s x 240 s). Every user byte now costs 1/(1-u) device writes (12.10). Prediction: implied WAF = 2.6 / 1.1 = 2.36, so u = 1 - 1/2.36 = 0.58. If the store's own GC counters show 0.58 of the relocation, it is fully explained.\n2. **Device write buffer or fast-region exhaustion:** if the product uses a fast write region (for example pseudo-SLC), throughput falls once it fills, regardless of host behavior. The cliff sits at a fixed byte count.\n3. **Erase cost begins:** on a fresh drive the first pass writes Empty zones with no erase. Later zones need Reset first. The cliff appears near one full drive write.\n4. **Thermal throttling:** aligned with a temperature threshold crossing, and it recovers when the drive cools.\n5. **Fewer effective streams or a link problem:** GC took open slots from user streams (fewer zones written in parallel), or the PCIe link retrained to a lower speed. Check LnkSta and AER counters (see the PCIe page).\n\nDiscrimination:\n\n| Evidence | Points to |\n|---|---|\n| GC bytes rise exactly at the cliff, device bytes total stay at 2.6 GB/s | Host GC |\n| Raw fio zbd sequential on an all-Empty drive drops at the same byte count | Device buffer or media |\n| Cliff at about one drive fill, second pass slower than first | Erase cost (cause 3) |\n| SMART composite temperature or warning temperature time counters rise at the cliff | Thermal |\n| LnkSta shows a lower speed or width, or corrected error counts climb | Link |\n\n```\nfio --name=raw --filename=/dev/nvme0n1 --zonemode=zbd --rw=write --bs=128k --direct=1 \\\n    --ioengine=io_uring --iodepth=16 --max_open_zones=8 --write_bw_log=raw --log_avg_msec=1000\nnvme smart-log /dev/nvme0 | grep -i temp        # sample every second alongside\n```\nRun it twice: once on a freshly reset drive (all Empty) and once with a full second pass. Repeat the store benchmark with the working set held to 50 percent, so GC never starts. If the cliff disappears, GC caused it.","pitfall":"Blaming the SSD because it slowed down after four minutes. Half of these cliffs are the store's own GC arriving on schedule.","verify":"Field names for temperature time counters in nvme smart-log on your nvme-cli version, and whether your product has a fast write region and how it is reported (OCP log, vendor log).","follow":[{"q":"The drop matches GC but the device total also fell. What now?","a":"Two causes overlap. Remove GC first by shrinking the working set, then look at the device-only curve."},{"q":"How do you report it?","a":"Show the four aligned plots and the predicted-versus-measured WAF. An unexplained gap is the finding."}],"mod":12},{"id":"12.15","level":"Principal","type":"Debug","fig":null,"tags":["gc","reset","race","stale-read","epoch","corruption"],"q":"A soak test occasionally reads zeros, or another object's data, from a location the store believed was live. It happens only during GC. How do you decide whether the store or the SSD is at fault?","short":"Timestamp every step and test one ordering: was the reader's index lookup older than the index update that moved the object, and did the read execute after the Reset of the victim zone? If yes, it is the classic host race, where the zone was reset and possibly rewritten under an in-flight reader. If the index version was current when the read ran, the device returned wrong data for live blocks, for example a deferred erase destroying freshly written data.","deep":"Failing pattern: reader looks up (zone Z, offset), GC relocates the object, updates the index, resets Z, Z is reallocated and written, then the reader's read executes.\n```\nt(ms)  actor   event\n0.0    reader  index lookup obj 7 -> (Z, 0x1200), index version 41\n0.1    gc      copy obj 7 to zone Y, index update -> (Y, 0x0040), version 42\n0.5    gc      Reset Z completes\n0.6    writer  new data written into Z at 0x1000..0x1FFF\n0.9    reader  Read Z 0x1200 completes -> wrong object, CRC fails\n```\nRanked causes:\n1. **Host race (most likely):** no protection between readers of the old location and the Reset. Missing per-zone reader count, epoch or grace period.\n2. **Early Reset:** the live counter reached zero before a relocation's read finished (12.03), or the Reset was issued before the index update was visible to all threads.\n3. **Device deferred-erase race:** Reset returns, a new write lands, and a background erase then destroys it. That gives zeros in data written after the Reset, and is a firmware bug (4.15).\n4. **Device stale data:** a read of a Reset zone returns pre-Reset data that is neither the declared unwritten value nor an error. That is a data-leak defect (4.12).\n5. **Cache in the host:** a page cache or buffer holds an old copy of a location that was reused.\n\nDiscriminating analysis:\n1. For each failing read, record the index version the reader used, when the read was submitted and completed, and the Reset and rewrite times for that zone.\n2. Host race is proven when lookup version < current version for that object and the read completed after the Reset completed. Every failure fitting that pattern is the host.\n3. If a failing read used the current index version, the location was live and the zone was not reset since the object was written, so the device is at fault. Then check for zeros in a fresh write after Reset: run a targeted loop (Reset, write pattern, read back after 0, 10, 100, 1000 ms, verify) on the same drive.\n4. For a stale-data result, compare against DLFEAT and the zone state at read time (3.11).\n\n**Fixes on the host:** epoch-based reclamation or per-zone reader reference counts so a Reset waits for readers that could hold an old location. A short quarantine before a reset zone is reallocated. Put a zone generation number in every record header and reject records from an older generation.","pitfall":"Assuming the drive is at fault because it returned zeros. A returned unwritten value after a Reset is what the device is supposed to do.","verify":"The values a read returns after Reset Zone (DLFEAT), whether reads of an Empty zone above the write pointer fail or return data (DLFEAT and DULBE), and whether the specification allows deferred erase to complete after the Reset completion.","follow":[{"q":"Why does the CRC not fully protect you?","a":"It detects the wrong data but not the cause. It can also pass if a reused location holds a valid record of another object with the same size, so bind the header to the object id and generation."},{"q":"How does this differ from a conventional SSD?","a":"There, a stale read returns old data of the same LBA, which is a stable, if wrong, value. Here Reset makes the location unwritten or reuses it, so the race is louder and cheaper to catch."}],"mod":12},{"id":"12.16","level":"Principal","type":"Cross-layer","fig":null,"tags":["evidence","triage","host-logs","firmware-logs","analyzer","bug-report"],"q":"A customer reports data errors and write failures on a ZNS SSD in their store. What evidence do you collect from the host, the firmware and the analyzer, in what order, so that the firmware team can act on it?","short":"Non-intrusive and volatile first, intrusive last, and nothing before the reset that would erase it. Snapshot host state (kernel log, Identify, logs, a full Report Zones dump, per-command records with SQID, CID, status and ALBA), then pull the device's own view (telemetry, vendor logs, event log), then correlate with a bus capture on a reproduction. Package it as an invariant violated, the minimal sequence, and the environment, not as a log dump.","deep":"| Layer | Artifact | How | Why |\n|---|---|---|---|\n| Host | Kernel log, driver messages, controller resets | `dmesg`, `journalctl -k` for the run and the previous boot | Timeouts, resets, zone errors |\n| Host | Identify, zoned Identify, effects log, limits | `nvme id-ctrl`, `nvme zns id-ns`, `nvme effects-log`, sysfs `queue/` files | Geometry, MAR and MOR, ZASL, supported commands |\n| Host | Zone map with timestamp | `nvme zns report-zones` or `blkzone report`, before and after any recovery | State and WP evidence, taken before anything changes it |\n| Host | Health and error logs, Changed Zone List | `nvme smart-log`, `nvme error-log`, zone changed log | Media events, Read Only, temperature |\n| Host | Command records | store trace: SQID, CID, opcode, SLBA, length, status, ALBA, times | Ground truth for what the host asked and saw |\n| Host | Kernel tracepoints | `events/nvme` in tracefs | Ties store operations to NVMe commands |\n| Firmware | Telemetry, vendor log pages, assert dump | `nvme telemetry-log`, vendor tool | Internal zone table, resource counters, reset history |\n| Firmware | Firmware and configuration versions, feature settings | `nvme fw-log`, `nvme get-feature` | Rules out version and config drift |\n| Analyzer | PCIe capture around a triggered event | Trigger on a command with non-zero status, or a timeout | Proves what was on the wire, and detects link issues |\n\nOrder:\n1. Preserve first: copy the zone map, logs and telemetry before any controller reset, format or reboot.\n2. Read-only host commands next. Then the store's own records.\n3. Only then reproduce with the analyzer and debug firmware. Match clocks with a marker (a unique LBA or a GPIO).\n4. Save the store's shadow state at the failure too, so the model versus device diff can be reconstructed.\n\n**Report format:** (1) the invariant violated, in one sentence (\"device WP is 24 blocks past the sum of successful completions\"), (2) minimal command sequence and zone state before and after, (3) rate and conditions, (4) what was ruled out (host race, decoding, second writer), (5) attachments with checksums. Firmware acts on invariants and sequences, not on 40 GB of logs.","pitfall":"Restarting the host to \"clear\" the problem before capturing the zone map. The most valuable evidence, the device's state at failure, is gone.","verify":"nvme-cli subcommand names and options in your version (for example `zns changed-zone-list`, `telemetry-log`), which log page IDs your product supports, and the vendor tool for internal state.","follow":[{"q":"The device hung and the logs are unreadable. What now?","a":"Use the persisted or controller-initiated telemetry and the UART or debug interface, and check whether the host preserved the zone map earlier. The bus capture then says whether the device stopped responding."},{"q":"What do you refuse to send?","a":"Data without the customer's agreement. Sanitize payloads and keep addresses, lengths, states and statuses."}],"mod":12},{"id":"12.17","level":"Principal","type":"Scenario","fig":null,"tags":["validation","system-test","fault-injection","soak","oracle","exit-criteria"],"q":"Design the system-level validation campaign for a host log-structured store on a new ZNS firmware. How do you inject faults, decide host bug from device bug, and set exit criteria?","short":"Use three oracles: a zone-state model checked at every completion, the store's own invariants (index versus zones versus live counters), and end-to-end checksums per object. Cross a workload matrix with a fault matrix (power cuts at every operation type, timeouts, media faults, resets under load, resource pressure). Replay each failure on an emulated zoned device: if it reproduces there, the host is at fault. Exit on coverage plus statistical bounds.","deep":"1. **Oracles:**\n   - Device oracle: the zone model of module 3 and 10, checked against Report Zones and status codes.\n   - Store oracle: every index entry points into a zone below its write pointer, live bytes per zone match, no location is claimed twice.\n   - End-to-end oracle: each object carries id, generation and CRC, verified on every read and in a full scan after each fault.\n2. **Workloads:** append-heavy, overwrite-heavy with GC at the sellable limit, delete-heavy, mixed read/write, many small versus few large objects, single versus many streams.\n3. **Fault matrix (cross with workloads):**\n\n| Fault | Where injected | Expected outcome |\n|---|---|---|\n| Power cut | During append, Finish, Reset, checkpoint, GC copy, GC Reset | Recovery per 12.07, no acknowledged data lost |\n| Command timeout, dropped CQE | Random writes and resets | WP resync per module 7, no duplicates |\n| Media fault: zone goes Read Only or Offline | Mid-fill, during GC read | Store evacuates, capacity plan holds (12.02) |\n| Controller reset under load | With many open zones | State per 3.09, resources reconciled |\n| Resource pressure | Rollover on all streams, GC burst | Retry and backoff, no data loss (12.12) |\n| Firmware update in field | Between runs | Zones and WP preserved |\n\n4. **Host versus device:** replay the captured command trace against an emulated zoned device (QEMU or null_blk, extended with the same limits and injected errors). Reproduces on the emulator: host bug. Only on hardware: device bug, or a timing issue the emulator lacks. Then compare with a second SSD on the same host.\n5. **Exit criteria (examples):**\n   - Coverage: every operation type by every fault type, and every zone state at the cut, at least once.\n   - Statistics: with zero failures in n trials, the 95 percent upper bound is 3/n (rule of three). 300 clean power cycles bound the failure rate below 1 percent, 3,000 below 0.1 percent.\n   - Soak: 72 h at 2 GB/s writes is about 518 TB, roughly 135 fills of the 3.5 TiB writable capacity (assumed drive), with GC active.\n   - Zero silent data corruption, zero unexplained state divergence, and every failure classified host or device.\n6. **Automation:** the store's trace and the model checker are the product of the campaign. Make every failure a replayable trace, and every trace a regression test.","pitfall":"Counting hours of soak instead of covering fault points. A week of quiet writes never cuts power during a Reset.","verify":"How your power-cut rig and firmware error-injection interface work, and the NVMe zone attribute and state behavior after resets in your revision, which decide the pass criteria for those rows.","follow":[{"q":"What do you prioritize when time is short?","a":"Data integrity after power cuts, then recovery correctness, then state machine agreement, then resources, then performance."},{"q":"What does the device suite (module 10) add?","a":"Per-command conformance and boundary cases without a store on top. This campaign asks whether a real host survives the device, which finds different bugs."}],"mod":12}]};
</script>
<script>
(function(){
'use strict';
var LEVELS=['Basic','Intermediate','Advanced','Principal'];
var TYPES=['Concept','Numeric','Scenario','Debug','Cross-layer','Trap'];
var MODS=DATA.modules, Q=DATA.questions;
var byId={}; Q.forEach(function(q,i){
  q._i=i; byId[q.id]=q;
  q._hay=(q.q+' '+q.short+' '+q.deep+' '+q.follow.map(function(f){return f.q+' '+f.a;}).join(' ')+' '+(q.pitfall||'')+' '+(q.verify||'')+' '+q.tags.join(' ')).toLowerCase();
});
var modById={}; MODS.forEach(function(m){ m.qs=Q.filter(function(q){return q.mod===m.id;}); m.built=m.qs.length>0; modById[m.id]=m; });

/* ---------- storage ---------- */
var LS='znsqa.v1', storageOK=true;
function blank(){return {ratings:{},notes:{},last:null,mode:'study',rounds:[]};}
function load(){
  try{ var s=JSON.parse(localStorage.getItem(LS)); if(s&&s.ratings){ s.notes=s.notes||{}; s.rounds=s.rounds||[]; s.mode=s.mode||'study'; return s; } }catch(e){ storageOK=false; }
  return blank();
}
var store=load();
function save(){ try{ localStorage.setItem(LS,JSON.stringify(store)); }catch(e){ storageOK=false; } }

/* ---------- state ---------- */
var S={search:'',levels:new Set(LEVELS),types:new Set(TYPES),status:'all',open:new Set(MODS.filter(function(m){return m.built;}).slice(0,1).map(function(m){return m.id;})),cur:null,revealed:false,mock:null};
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function stOf(q){ var r=store.ratings[q.id]; return r?r.r:'none'; }
function fmtTime(ms){ var s=Math.floor(ms/1000),m=Math.floor(s/60); s=s%60; return m+':'+(s<10?'0':'')+s; }

/* ---------- mini markdown ---------- */
function plain(s){ return s.replace(/`/g,''); }
function inline(s){ s=esc(s); s=s.replace(/`([^`]+)`/g,'<code>$1</code>'); s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); return s; }
function mdTable(rows){
  var cells=rows.map(function(r){ return r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(c){return c.trim();}); });
  var head=cells[0], body=cells.slice(1); if(body.length&&/^[\s:|-]+$/.test(body[0].join(''))) body=body.slice(1);
  return '<table><thead><tr>'+head.map(function(c){return '<th>'+inline(c)+'</th>';}).join('')+'</tr></thead><tbody>'+
    body.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+inline(c)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';
}
var LIST_RE=/^(\s*)(-|\d+\.) (.*)$/;
function mdList(L,i,indent){
  var m=LIST_RE.exec(L[i]), tag=m[2]==='-'?'ul':'ol', start=tag==='ol'?parseInt(m[2],10):1, items=[];
  while(i<L.length){
    m=LIST_RE.exec(L[i]); if(!m) break;
    var ind=m[1].length, t=m[2]==='-'?'ul':'ol';
    if(ind<indent) break;
    if(ind>indent){
      if(!items.length) break;
      var r=mdList(L,i,ind); items[items.length-1]+=r.html; i=r.i; continue;
    }
    if(t!==tag) break;
    items.push(inline(m[3])); i++;
  }
  return {html:'<'+tag+(tag==='ol'&&start!==1?' start="'+start+'"':'')+'>'+items.map(function(x){return '<li>'+x+'</li>';}).join('')+'</'+tag+'>', i:i};
}
function md(text){
  var L=String(text||'').split('\n'), out=[], i=0, buf;
  while(i<L.length){
    var l=L[i];
    if(/^```/.test(l)){ buf=[]; i++; while(i<L.length&&!/^```/.test(L[i])){buf.push(L[i]);i++;} i++; out.push('<pre class="term"><code>'+esc(buf.join('\n'))+'</code></pre>'); continue; }
    if(/^\|/.test(l)){ buf=[]; while(i<L.length&&/^\|/.test(L[i])){buf.push(L[i]);i++;} out.push(mdTable(buf)); continue; }
    if(LIST_RE.test(l)){ var r=mdList(L,i,LIST_RE.exec(l)[1].length); out.push(r.html); i=r.i; continue; }
    if(l.trim()===''){ i++; continue; }
    buf=[l]; i++;
    while(i<L.length&&L[i].trim()!==''&&!/^(```|\||\s*(-|\d+\.) )/.test(L[i])){buf.push(L[i]);i++;}
    out.push('<p>'+inline(buf.join(' '))+'</p>');
  }
  return out.join('');
}

/* ---------- filters / sidebar ---------- */
function matches(q){
  if(!S.levels.has(q.level)||!S.types.has(q.type)) return false;
  var st=stOf(q);
  if(S.status==='unseen'&&st!=='none') return false;
  if(S.status==='weak'&&st!=='shaky'&&st!=='missed') return false;
  if(S.status==='got'&&st!=='got') return false;
  if(S.status==='flag'&&!q.verify) return false;
  if(S.search&&q._hay.indexOf(S.search.toLowerCase())<0) return false;
  return true;
}
function filtered(){ return Q.filter(matches); }

function buildFilters(){
  var f=$('filters');
  var h='<summary>FILTERS</summary>';
  h+='<div class="chip-row"><span class="chip-label">LEVEL</span>'+LEVELS.map(function(l){return '<span class="chip lv-'+l+' active" data-lv="'+l+'" role="button" tabindex="0">'+l+'</span>';}).join('')+'</div>';
  h+='<div class="chip-row"><span class="chip-label">TYPE</span>'+TYPES.map(function(t){return '<span class="chip active" data-ty="'+t+'" role="button" tabindex="0">'+t+'</span>';}).join('')+'</div>';
  h+='<div class="chip-row"><span class="chip-label">STATUS</span>'+[['all','All'],['unseen','Unseen'],['weak','Shaky + Missed'],['got','Got it'],['flag','Verify-in-spec']].map(function(s){return '<span class="chip'+(s[0]==='all'?' active':'')+'" data-st="'+s[0]+'" role="button" tabindex="0">'+s[1]+'</span>';}).join('')+'</div>';
  f.innerHTML=h;
  f.addEventListener('click',function(e){
    var c=e.target.closest('.chip'); if(!c) return;
    if(c.dataset.lv){ toggleSet(S.levels,c.dataset.lv,c); }
    else if(c.dataset.ty){ toggleSet(S.types,c.dataset.ty,c); }
    else if(c.dataset.st){ S.status=c.dataset.st; f.querySelectorAll('[data-st]').forEach(function(x){x.classList.toggle('active',x===c);}); }
    buildSidebar();
  });
  f.addEventListener('keydown',function(e){ if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('chip')){ e.preventDefault(); e.target.click(); } });
}
function toggleSet(set,v,el){ if(set.has(v)){ if(set.size>1){set.delete(v);el.classList.remove('active');} } else {set.add(v);el.classList.add('active');} }

function barHtml(qs){
  var n=qs.length||1, g=0,s=0,m=0; qs.forEach(function(q){var st=stOf(q); if(st==='got')g++; else if(st==='shaky')s++; else if(st==='missed')m++;});
  return '<i class="got" style="width:'+(g/n*100)+'%"></i><i class="shaky" style="width:'+(s/n*100)+'%"></i><i class="missed" style="width:'+(m/n*100)+'%"></i>';
}
function buildSidebar(){
  var c=$('navGroups'), html='', shown=0, curQ=S.cur?byId[S.cur]:null;
  MODS.forEach(function(m){
    if(!m.built){
      html+='<div class="grp soon"><div class="grp-h"><span class="caret"></span><span class="grp-t">'+m.id+'. '+esc(m.title)+'</span><span class="badge-soon">PHASE 2</span></div></div>';
      return;
    }
    var items=m.qs.filter(matches); shown+=items.length;
    var open=S.open.has(m.id)||(curQ&&curQ.mod===m.id)||!!S.search;
    if(!items.length&&!(curQ&&curQ.mod===m.id)) return;
    var done=m.qs.filter(function(q){return stOf(q)!=='none';}).length;
    html+='<div class="grp'+(open?' open':'')+'" data-m="'+m.id+'"><div class="grp-h" data-toggle="'+m.id+'"><span class="caret">'+(open?'▾':'▸')+'</span><span class="grp-t">'+m.id+'. '+esc(m.title)+'</span><span class="grp-c">'+done+'/'+m.qs.length+'</span></div>';
    html+='<div class="grp-bar">'+barHtml(m.qs)+'</div><div class="grp-items">';
    items.forEach(function(q){
      html+='<div class="nav-item'+(S.cur===q.id?' active':'')+'" data-id="'+q.id+'"><span class="dot r-'+stOf(q)+'"></span><span class="qnum">'+q.id+'</span><span>'+esc(plain(q.q).length>62?plain(q.q).slice(0,60)+'…':plain(q.q))+'</span></div>';
    });
    html+='</div></div>';
  });
  if(!shown) html+='<div class="nav-empty">No questions match the current filters.</div>';
  c.innerHTML=html;
  $('statShown').textContent=shown; $('statTotal').textContent=Q.length;
  $('statDone').textContent=Q.filter(function(q){return stOf(q)!=='none';}).length;
}
$('navGroups').addEventListener('click',function(e){
  var it=e.target.closest('.nav-item'); if(it){ go('q/'+it.dataset.id); return; }
  var h=e.target.closest('[data-toggle]'); if(h){ var id=Number(h.dataset.toggle); if(S.open.has(id)) S.open.delete(id); else S.open.add(id); var g=h.parentNode; g.classList.toggle('open'); h.querySelector('.caret').textContent=g.classList.contains('open')?'▾':'▸'; }
});
$('homeLink').addEventListener('click',function(){ go(''); });
$('searchInput').addEventListener('input',function(e){ S.search=e.target.value.trim(); buildSidebar(); });
$('menuBtn').addEventListener('click',function(){ $('sidebar').classList.toggle('open'); });

/* ---------- routing ---------- */
function go(h){ if(location.hash.replace(/^#\/?/,'')===h){ render(); } else location.hash='#/'+h; }
window.addEventListener('hashchange',render);
function route(){ var h=location.hash.replace(/^#\/?/,''); if(!h) return {r:'home'}; var p=h.split('/'); return {r:p[0],a:p[1]}; }

function setCrumb(parts){ $('crumb').innerHTML=parts.map(function(p,i){ return i===parts.length-1?'<span class="current">'+esc(p)+'</span>':esc(p)+'<span class="sep">/</span>'; }).join(''); }
function scrollTop(){ window.scrollTo(0,0); }

function render(){
  var r=route(), c=$('content');
  $('sidebar').classList.remove('open');
  document.querySelectorAll('#modeSeg button').forEach(function(b){b.classList.toggle('on',b.dataset.mode===store.mode);});
  if(r.r!=='run'&&r.r!=='q') S.cur=null;
  if(r.r==='q'&&byId[r.a]){ S.cur=r.a; S.revealed=(store.mode==='ref'); var q=byId[r.a]; if(!S.mock||!S.mock.active){ S.mock=null; } store.last=q.id; save(); c.innerHTML=renderQuestion(q,null); wireQuestion(q); setCrumb(['ZNS Q&A','Module '+q.mod,'Q'+q.id]); }
  else if(r.r==='m'&&modById[r.a]&&modById[r.a].built){ c.innerHTML=renderModule(modById[r.a]); wireList(); setCrumb(['ZNS Q&A','Module '+r.a]); }
  else if(r.r==='mock'){ c.innerHTML=renderMockSetup(); wireMockSetup(); setCrumb(['ZNS Q&A','Mock Round']); }
  else if(r.r==='run'){ if(!S.mock){ go('mock'); return; } renderRun(); }
  else { c.innerHTML=renderHome(); wireHome(); setCrumb(['ZNS Q&A','Overview']); }
  buildSidebar(); scrollTop();
  var act=document.querySelector('.nav-item.active'); if(act&&act.scrollIntoView) act.scrollIntoView({block:'nearest'});
}

/* ---------- home ---------- */
function counts(list){ var o={got:0,shaky:0,missed:0,none:0}; list.forEach(function(q){o[stOf(q)]++;}); return o; }
function renderHome(){
  var built=Q.length, cn=counts(Q), done=built-cn.none;
  var weak=cn.shaky+cn.missed, last=store.last&&byId[store.last]?byId[store.last]:null;
  var h='<div class="hero"><h2>ZNS Q&amp;A Study Guide</h2>'+
   '<p>Zoned Namespaces from the zoned-storage model to Principal-level firmware validation and debug scenarios, building on the NVMe page. Answer out loud first, reveal, then rate yourself. Shaky and missed questions feed the review queue and mock rounds. Switch to <b>Reference</b> mode (top right) to read like a normal Q&amp;A page.</p>';
  if(!storageOK) h+='<div class="warn">Browser storage is unavailable here, so progress will not persist after you close the page. Use Export progress to keep a copy.</div>';
  h+='<div class="stat-boxes"><div class="stat-box"><div class="n">'+built+'</div><div class="l">Questions live</div></div>'+
     '<div class="stat-box"><div class="n">'+MODS.filter(function(m){return m.built;}).length+' / '+MODS.length+'</div><div class="l">Modules live</div></div>'+
     '<div class="stat-box"><div class="n">'+Math.round(done/built*100)+'%</div><div class="l">Rated so far</div></div>'+
     '<div class="stat-box"><div class="n">'+Q.filter(function(q){return q.type==='Scenario'||q.type==='Debug';}).length+'</div><div class="l">Scenario / debug</div></div></div>';
  h+='<div class="pstack" title="Progress">'+barHtml(Q)+'</div>';
  h+='<div class="legend"><span class="g">Got it '+cn.got+'</span><span class="s">Shaky '+cn.shaky+'</span><span class="m">Missed '+cn.missed+'</span><span>Unseen '+cn.none+'</span></div>';
  h+='<div class="actions">';
  h+=last?'<button class="btn primary" data-act="continue">Continue · Q'+last.id+'</button>':'<button class="btn primary" data-act="start">Start with Q'+Q[0].id+'</button>';
  h+='<button class="btn" data-act="mock">Mock Round…</button>';
  h+='<button class="btn" data-act="weak"'+(weak?'':' disabled')+'>Review Shaky + Missed ('+weak+')</button>';
  h+='<button class="btn ghost" data-act="export">Export progress</button><button class="btn ghost" data-act="import">Import…</button><button class="btn ghost" data-act="reset">Reset</button>';
  h+='<input type="file" id="impFile" accept="application/json,.json" hidden></div>';
  h+='<div class="h-label">MODULES</div><div class="mod-grid">';
  MODS.forEach(function(m){
    if(!m.built){ h+='<div class="mod-card soon"><div class="mn">MODULE '+m.id+' · PHASE 2</div><div class="mt">'+esc(m.title)+'</div><div class="md">'+esc(m.desc)+'</div></div>'; return; }
    var c2=counts(m.qs);
    h+='<div class="mod-card" data-mod="'+m.id+'"><div class="mn">MODULE '+m.id+'</div><div class="mt">'+esc(m.title)+'</div><div class="md">'+esc(m.desc)+'</div>'+
       '<div class="pstack">'+barHtml(m.qs)+'</div><div class="mc"><span>'+m.qs.length+' questions</span><span>'+(m.qs.length-c2.none)+' rated</span></div></div>';
  });
  h+='</div>';
  if(store.rounds.length){
    h+='<div class="h-label">RECENT MOCK ROUNDS</div><table class="rounds"><thead><tr><th>WHEN</th><th>QUESTIONS</th><th>GOT IT</th><th>SHAKY</th><th>MISSED</th><th>TIME</th></tr></thead><tbody>'+
      store.rounds.slice(0,6).map(function(r){ return '<tr><td>'+new Date(r.t).toLocaleString()+'</td><td>'+r.n+'</td><td>'+r.got+'</td><td>'+r.shaky+'</td><td>'+r.missed+'</td><td>'+fmtTime(r.ms)+'</td></tr>'; }).join('')+'</tbody></table>';
  }
  return h+'</div>';
}
function wireHome(){
  var c=$('content');
  c.querySelectorAll('[data-mod]').forEach(function(el){ el.addEventListener('click',function(){ go('m/'+el.dataset.mod); }); });
  c.querySelectorAll('[data-act]').forEach(function(b){ b.addEventListener('click',function(){
    var a=b.dataset.act;
    if(a==='continue') go('q/'+store.last); else if(a==='start') go('q/'+Q[0].id);
    else if(a==='mock') go('mock'); else if(a==='weak'){ startMock({mods:new Set(MODS.filter(function(m){return m.built;}).map(function(m){return m.id;})),levels:new Set(LEVELS),types:new Set(TYPES),source:'weak',count:999}); }
    else if(a==='export') exportProgress(); else if(a==='import') $('impFile').click();
    else if(a==='reset') confirmBox('Erase all ratings, notes and mock history stored in this browser? This cannot be undone.',function(){ store=blank(); save(); toast('Progress reset'); render(); });
  }); });
  var f=$('impFile'); if(f) f.addEventListener('change',importProgress);
}

/* ---------- module page ---------- */
function renderModule(m){
  var h='<div class="hero"><div class="q-id" style="margin-bottom:6px">MODULE '+m.id+'</div><h2>'+esc(m.title)+'</h2><p>'+esc(m.desc)+'</p></div>';
  h+='<div class="actions"><button class="btn primary" data-go="q/'+m.qs[0].id+'">Start module</button><button class="btn" data-mockmod="'+m.id+'">Mock round on this module</button></div>';
  h+='<ul class="modlist">'+m.qs.map(function(q){ return '<li data-go="q/'+q.id+'"><span class="dot r-'+stOf(q)+'"></span><span class="qn">'+q.id+'</span><span class="qt">'+esc(plain(q.q))+'</span><span class="badge lv-'+q.level+'">'+q.level.toUpperCase()+'</span><span class="badge ty">'+q.type+'</span></li>'; }).join('')+'</ul>';
  return h;
}
function wireList(){
  var c=$('content');
  c.querySelectorAll('[data-go]').forEach(function(el){ el.addEventListener('click',function(){ go(el.dataset.go); }); });
  c.querySelectorAll('[data-mockmod]').forEach(function(el){ el.addEventListener('click',function(){ startMock({mods:new Set([Number(el.dataset.mockmod)]),levels:new Set(LEVELS),types:new Set(TYPES),source:'all',count:999}); }); });
}

/* ---------- question ---------- */
function figHtml(key){
  var d=(typeof DIAGRAMS!=='undefined')?DIAGRAMS[key]:null; if(!d) return '';
  return '<figure class="fig"><div class="fig-title">FIG · '+esc(d.title).toUpperCase()+'</div>'+d.svg+(d.cap?'<figcaption>'+esc(d.cap)+'</figcaption>':'')+'</figure>';
}
function answerHtml(q){
  var h='<div class="short-box">'+inline(q.short)+'</div>';
  if(q.fig) h+=figHtml(q.fig);
  if(q.deep&&q.deep.trim()) h+='<div class="sec-label">DEEP DIVE</div><div class="deep">'+md(q.deep)+'</div>';
  if(q.follow.length){ h+='<div class="sec-label">INTERVIEWER FOLLOW-UPS</div>'+q.follow.map(function(f){ return '<details class="fu"><summary>'+inline(f.q)+'</summary><div class="fa">'+inline(f.a)+'</div></details>'; }).join(''); }
  if(q.pitfall) h+='<div class="callout pit"><b>COMMON PITFALL</b>'+inline(q.pitfall)+'</div>';
  if(q.verify) h+='<div class="callout ver"><b>VERIFY IN SPEC</b>'+inline(q.verify)+'</div>';
  h+='<div class="sec-label">MY NOTES</div><textarea class="notes" id="notes" placeholder="Your own wording, mnemonics, gotchas…" aria-label="Personal notes">'+esc(store.notes[q.id]||'')+'</textarea>';
  return h;
}
function ratebar(q,ctx){
  var cur=stOf(q);
  var h='<div class="rate-bar"><span class="lbl">HOW DID YOU DO?</span>';
  ['got','shaky','missed'].forEach(function(k,i){ h+='<button class="rbtn '+k+(cur===k?' sel':'')+'" data-rate="'+k+'">'+({got:'Got it',shaky:'Shaky',missed:'Missed'})[k]+'<small>'+(i+1)+'</small></button>'; });
  h+='<span class="sp"></span>';
  if(ctx){ h+='<button class="btn ghost" data-skip="1">Skip</button>'; }
  return h+'</div>';
}
function renderQuestion(q,ctx){
  var list=ctx?null:filtered(), idx=list?list.findIndex(function(x){return x.id===q.id;}):-1;
  var prev=list&&idx>0?list[idx-1]:null, next=list&&idx>=0&&idx<list.length-1?list[idx+1]:null;
  var h='<div class="qcard"><div class="q-meta"><span class="badge lv-'+q.level+'">'+q.level.toUpperCase()+'</span><span class="badge ty">'+q.type.toUpperCase()+'</span>'+
    '<span class="q-id">Q'+q.id+' · Module '+q.mod+': '+esc(modById[q.mod].title)+'</span></div>'+
    '<h2 class="q-title">'+inline(q.q)+'</h2><div id="ans">';
  if(S.revealed) h+=answerHtml(q);
  else h+='<div class="reveal-box"><p>Answer out loud (or on paper) first. Then reveal and compare.</p><button class="btn primary" data-reveal="1">Reveal answer</button><div class="kbd"><kbd>Space</kbd> reveal &nbsp; <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> rate &nbsp; <kbd>←</kbd> <kbd>→</kbd> navigate</div></div>';
  h+='</div>';
  if(S.revealed||store.mode==='ref') h+=ratebar(q,ctx); else h+='<div id="ratewrap"></div>';
  if(!ctx) h+='<div class="footer-nav"><button class="btn" data-nav="'+(prev?prev.id:'')+'"'+(prev?'':' disabled')+'>← Prev'+(prev?' · '+prev.id:'')+'</button><button class="btn" data-nav="'+(next?next.id:'')+'"'+(next?'':' disabled')+'>Next'+(next?' · '+next.id:'')+' →</button></div>';
  return h+'</div>';
}
var noteTimer=null;
function wireQuestion(q){
  var c=$('content');
  c.querySelectorAll('[data-nav]').forEach(function(b){ b.addEventListener('click',function(){ if(b.dataset.nav) go('q/'+b.dataset.nav); }); });
  var rv=c.querySelector('[data-reveal]'); if(rv) rv.addEventListener('click',function(){ reveal(q); });
  wireAnswer(q);
}
function wireAnswer(q){
  var c=$('content');
  c.querySelectorAll('[data-rate]').forEach(function(b){ b.addEventListener('click',function(){ rate(q,b.dataset.rate); }); });
  var sk=c.querySelector('[data-skip]'); if(sk) sk.addEventListener('click',function(){ mockNext(q,null); });
  var n=$('notes'); if(n) n.addEventListener('input',function(){ clearTimeout(noteTimer); noteTimer=setTimeout(function(){ if(n.value.trim()) store.notes[q.id]=n.value; else delete store.notes[q.id]; save(); },400); });
}
function reveal(q){
  if(S.revealed) return; S.revealed=true;
  $('ans').innerHTML=answerHtml(q);
  var ctx=S.mock&&S.mock.active;
  var wrap=$('ratewrap'); var tmp=document.createElement('div'); tmp.innerHTML=ratebar(q,ctx); if(wrap) wrap.replaceWith(tmp.firstChild);
  wireAnswer(q);
  var t=document.querySelector('.q-title'); if(t&&t.scrollIntoView&&window.innerHeight<700) t.scrollIntoView({block:'start'});
}
function rate(q,r){
  var o=store.ratings[q.id]||{n:0}; o.r=r; o.t=Date.now(); o.n=(o.n||0)+1; store.ratings[q.id]=o; store.last=q.id; save();
  if(S.mock&&S.mock.active){ mockNext(q,r); return; }
  document.querySelectorAll('.rbtn').forEach(function(b){ b.classList.toggle('sel',b.dataset.rate===r); });
  buildSidebar(); toast(({got:'Marked: got it',shaky:'Marked: shaky — added to review',missed:'Marked: missed — added to review'})[r]);
}

/* ---------- mock rounds ---------- */
