low":[{"q":"Is Zone Boundary Error also used for Writes?","a":"Yes, a Write that extends past the writable capacity gets the same status."},{"q":"Where does the Full transition happen?","a":"As part of the completion of the append that brings the write pointer to the end of the zone capacity."}],"mod":5},{"id":"5.07","level":"Intermediate","type":"Cross-layer","fig":null,"tags":["host","index","mapping","recovery"],"q":"What must the host keep because of Zone Append, and how does it survive a crash?","short":"The host needs a durable map from its own object identity to the returned ALBA, because the address exists only in the completion entry. In memory that is an in-flight table plus an index updated on each CQE. For crash recovery, either persist the mapping (log or metadata zone) or make every record self-describing so a scan from a checkpoint to the write pointer rebuilds the index.","deep":"- **In-flight table:** keyed by command ID: zone, length, object identity, buffer. On CQE the host looks up the entry, publishes object to (ALBA, length) in the index, then frees the buffer. The object is not readable before that.\n- **Publish only when durable:** do not expose or journal the mapping before the data is durable under your durability rules (FUA, or a Flush after the CQE).\n- **Recovery options:**\n  1. Mapping log: after the data CQE, append (object, ALBA) to a metadata zone. Costs an extra write, recovery reads the log.\n  2. Self-describing records: header with object id, host sequence number, length and CRC. Recovery scans from a checkpoint to the write pointer.\n  3. Hybrid: periodic index checkpoint plus a scan of the tail.\n- **Header limit:** a record cannot embed its own address, since it is unknown at submit time. It can embed a zone id and a host-assigned sequence number.\n- **Sequence numbers:** ALBA order is not submission order, so replay needs the host's own sequence to know logical order.\n- **Extents:** if a record is split over several appends, the index stores extents.","pitfall":"Journaling the (object, ALBA) mapping before the data is durable, then losing the data at power loss. The index points at blocks that were never written.","verify":null,"follow":[{"q":"Why not read the write pointer with Report Zones after each append?","a":"It races with the other appends in flight. That is the exact mistake the ALBA removes."},{"q":"What does GC need from the index?","a":"Live bytes per zone, so the host can pick victims and relocate valid records (module 12)."}],"mod":5},{"id":"5.08","level":"Intermediate","type":"Cross-layer","fig":null,"tags":["linux","block-layer","emulation","zone-write-plugging"],"q":"How does Linux use Zone Append, and what happens on devices without it?","short":"The block layer has a native request op, REQ_OP_ZONE_APPEND. The NVMe driver turns it into Zone Append, limits it by ZASL, and on completion copies the 64-bit result into the request sector so upper layers see the assigned location. The driver requires append on a ZNS namespace. Devices with no native append, such as SMR HDDs, get it emulated by the block layer as a regular write at a tracked write pointer.","deep":"- **Native path:** a bio with REQ_OP_ZONE_APPEND targets the zone start sector. `nvme_setup_rw` builds opcode 7Dh. In the completion path the driver converts the 64-bit result to a sector and stores it in the request. A filesystem such as btrfs reads the actual location from the completed bio.\n- **Limit:** the queue limit for hardware append size comes from ZASL, or from the transfer limit if ZASL is 0.\n- **No append support:** if the Commands Supported and Effects log does not list Zone Append, the NVMe driver forces the namespace read-only and logs a warning.\n- **Emulation:** when a zoned queue reports no hardware append size, zone write plugging rewrites an append into a regular Write at its tracked write pointer offset, prevents merging, and restores the append type at completion. It keeps the caller's view identical but the device sees ordered writes, so the concurrency benefit is lost.\n- **No mixing:** native appends are not plugged, so the block layer does not track the write pointer for such zones. Mixing regular writes and native appends on one zone is invalid: the kernel logs \"Invalid mix of zone append and regular writes\" and aborts plugged writes.\n- **Test consequence:** to exercise device-side append concurrency use NVMe passthrough or a native-append consumer, not ordinary writes on the block device.","pitfall":"Assuming that an fio run on the block device with zonemode=zbd tested Zone Append. It issues Writes unless you go through passthrough or a user-space driver.","verify":"Kernel version where zone write plugging replaced zone write locking (Linux 6.10 as I recall), the sysfs attribute name and value for emulated devices, and which filesystems use native append.","follow":[{"q":"How can you check a system uses native append?","a":"Look at the queue attribute for maximum append bytes in sysfs, and capture a trace showing opcode 7Dh on the wire."},{"q":"Who uses append natively?","a":"Zoned btrfs uses it for data. Other filesystems and databases use regular writes with host ordering."}],"mod":5},{"id":"5.09","level":"Advanced","type":"Numeric","fig":null,"tags":["throughput","queue-depth","littles-law","fio"],"q":"One zone, 16 KiB records, 40 us command latency: how does throughput scale with queue depth for Write versus Zone Append?","short":"A Write is limited to QD 1 per zone: 1/40 us = 25,000 IOPS x 16 KiB = 409.6 MB/s. Zone Append scales about linearly with QD until the zone's internal bandwidth ceiling: QD 2 gives 819 MB/s, QD 4 gives 1.64 GB/s, which a zone capped at 1.6 GB/s cannot exceed. About four appends in flight are enough. Assumes constant latency until the knee.","deep":"1. **Assumptions:** 16 KiB = 16,384 B. Latency from submit to CQE is 40 us and stays flat with QD until saturation. The zone can absorb 1.6 GB/s because it is striped across enough dies. Host CPU and the PCIe link (Gen4 x4 is about 7.9 GB/s) are not limits.\n2. **Write at QD 1:** IOPS = 1 / 40 us = 25,000. Bandwidth = 25,000 x 16,384 = 409.6 MB/s.\n3. **Append at QD n:** bandwidth = min(n x 409.6 MB/s, 1600 MB/s).\n\n| QD | Bandwidth (MB/s) |\n|---|---|\n| 1 | 410 |\n| 2 | 819 |\n| 4 | 1600 (1638 uncapped) |\n| 8 | 1600 |\n| 16 | 1600 |\n\n4. **Little's law check:** in flight = throughput x latency / size = 1.6e9 x 40e-6 / 16,384 = 3.9, so QD 4.\n5. **Zone fill time (256 MiB):** Write QD 1 takes 268,435,456 / 409.6e6 = 0.66 s. Append QD 4 takes 268,435,456 / 1.6e9 = 0.17 s.\n6. **Alternative without append:** four zones, each written at QD 1, give the same 1.64 GB/s, but they use four open and active zone resources (module 6) and split the data into four streams.\n\nSweep it with fio through passthrough:\n```\nfio --name=zapp --filename=/dev/ng0n2 --ioengine=io_uring_cmd --cmd_type=nvme \\\n    --zonemode=zbd --write_mode=zone_append --rw=write --bs=16k --direct=1 \\\n    --iodepth=1 --max_open_zones=1\n```\nRepeat with iodepth 2, 4, 8, 16 and plot the knee.","pitfall":"Extrapolating linear scaling forever. The ceiling is the zone's media parallelism and buffer, not the queue depth.","verify":"fio option names (write_mode=zone_append, cmd_type) against the fio version in use.","follow":[{"q":"What if a zone maps to a single die?","a":"The die's program rate is the ceiling, so QD beyond one or two only adds queueing latency (module 8)."},{"q":"Do real drives stay flat at 40 us?","a":"No. Latency rises near saturation as the write buffer fills, so pick QD just past the knee."}],"mod":5},{"id":"5.10","level":"Advanced","type":"Debug","fig":null,"tags":["duplicate","lost-data","retry","timeout"],"q":"A zone scan shows one record twice and another record that the index cannot find. How do you debug an append workload?","short":"Suspect a retry of a non-idempotent command and an address the host guessed instead of reading from the CQE. First reconcile: after quiescing, the write pointer advance must equal the sum of NLB+1 over every successful CQE, including ones the host dropped. A larger pointer means orphan or duplicate appends, a smaller one means the host believes in writes that did not happen.","deep":"Host log for one zone (ZSLBA 80000h, 16-block records):\n```\nt(ms)  event\n0.00   submit rec41 cid=11\n0.02   submit rec42 cid=12\n0.04   submit rec43 cid=13\n0.90   CQE cid=11 ALBA=80010h\n1.02   app timer (1 ms) on rec42: free cid=12 context, resubmit as cid=17\n1.05   CQE cid=13 ALBA=80000h\n1.10   CQE cid=12 ALBA=80020h status=OK   (no context, dropped)\n1.60   CQE cid=17 ALBA=80030h\n```\n1. The late CQE for cid 12 proves the first attempt executed. Record 42 exists at 80020h and 80030h. The index points to the second, and the first is an orphan that wastes space and shows up as a duplicate in a scan.\n2. Reconcile: write pointer 80040h minus 80000h = 64 blocks. The host counted only 48 blocks of live data.\n3. Log every CQE (cid, sqid, status, ALBA) before discarding it. An unknown cid is the smoking gun.\n4. For \"lost\" data check how the address was obtained: from the CQE, or from Report Zones plus a running offset (5.12), or from DW0 only (5.02).\n5. Confirm with a scan by self-describing headers: duplicate ids and missing ids.\n\n**Fix:** never blind-resubmit an append. Keep the context alive until the CQE arrives or the controller is reset, then reconcile against the zone. Make record ids unique so duplicates can be discarded by rule.","pitfall":"Applying the Write mindset that a resubmit is idempotent. A resubmitted append can succeed twice.","verify":"Abort command completion semantics (Command Not Aborted bit) in the Base Specification.","follow":[{"q":"Does an Abort make a retry safe?","a":"Only if the original completes with the Command Abort Requested status. If the Abort reports the command was not aborted, the append may have executed."},{"q":"Does a controller reset resolve the ambiguity?","a":"It removes queue state but not media state. Read the zone report and scan the tail to learn what landed."}],"mod":5},{"id":"5.11","level":"Advanced","type":"Cross-layer","fig":null,"tags":["pi","piremap","reference-tag","e2e"],"q":"How does Zone Append interact with end-to-end protection information, and what is PIREMAP for?","short":"The PI reference tag is derived from the LBA, but with Append the LBA is unknown at submit time. With PIREMAP set, the host builds reference tags as if the data began at the zone start, and the controller stores ILBRT + (ALBA - ZSLBA) + block index, so later reads with normal reference tag checking pass. With PIREMAP clear, tags are written as given.","deep":"See the NVMe page (E2E Data Protection module) for PI basics. PI adds 8 bytes per block: a 16-bit guard CRC of the data, a 16-bit application tag and a 32-bit reference tag. In Type 1 the reference tag is the low 32 bits of the LBA and increments per block.\n\n- **Guard and application tag:** location independent. Append does not affect them.\n- **Reference tag:** the problem. The host cannot compute LBA-based tags without knowing the ALBA.\n\n| PIREMAP | Host supplies | Stored on media | Typical use |\n|---|---|---|---|\n| 0 | Tags as they should be stored | Unmodified | Type 2 or 3 PI, or no reference tag checking. Rejected for Type 1 (see below) |\n| 1 | ILBRT = ZSLBA (masked to the tag width) | ILBRT + (ALBA - ZSLBA) for the first LBA, then +1 per subsequent LBA | Type 1 or 2 with reference tag checks on reads. Rejected for Type 3 |\n\nExample: ZSLBA 80000h, ALBA 81200h. The offset is 1200h = 4,608 blocks. With ILBRT = 00080000h, the first stored reference tag is 00081200h.\n\nConfirmed, not vendor-specific (ZNS 1.4, 3.4.1 and Figure 26, CDW12 bit 25): if PIREMAP is cleared to 0 and the namespace is formatted for Type 1 protection, the controller shall abort the command with Invalid Protection Information (SCT 1h, SC 81h). Symmetrically, if PIREMAP is set to 1 and the namespace is formatted for Type 3 protection, the controller shall also abort with Invalid Protection Information. For Type 1 with PIREMAP set to 1, the host should set ILBRT to the low-order bits of ZSLBA sized to the reference tag width; if ILBRT does not match, the controller shall abort with Invalid Protection Information before any data is written.\n\n- **Linux:** sets the remap bit only when appending with reference tag checking enabled.\n- **Validator matrix:** PRACT 0 and 1, PRCHK bits, PIREMAP 0 and 1, PI type, and extended versus separate metadata buffers. Read back each case with reference tag checking and expect no Reference Tag Check Error (SCT 2h, SC 84h). Negative case: corrupt the host-supplied tags and expect the write-side check to fail.\n- **ZASL:** metadata counts toward the append size limit when interleaved with the logical block data (5.04).","pitfall":"Type 1 PI with PIREMAP clear. The spec requires the controller to reject this combination outright with Invalid Protection Information, not silently write tags at the guessed address.","verify":"PRACT's precise interaction with the ILBRT check when PIREMAP is set to 1 is not spelled out beyond the general PRACT behavior in the NVM Command Set Specification.","follow":[{"q":"Does PIREMAP change the guard or application tag?","a":"No. Only the reference tag values written to media."},{"q":"With PRACT=1 who generates the tags?","a":"The controller, so the host buffer carries no PI bytes; ILBRT and PIREMAP still set the reference tag base the same way."}],"mod":5},{"id":"5.12","level":"Advanced","type":"Trap","fig":null,"tags":["address-prediction","report-zones","write-pointer","coverage"],"q":"A host submits four 8-block appends to an empty zone and assumes they land at ZSLBA, +8, +16, +24. Why is that wrong, and what does Report Zones show mid-flight?","short":"Addresses are assigned by the controller in execution order, so any command can land in any slot. Only each CQE's ALBA is authoritative. A Report Zones taken during the burst is a snapshot of a moving write pointer, so it cannot stand in for the ALBA either. The bug is intermittent: it appears only when reordering happens, and then reads return valid-looking data belonging to another record.","deep":"Example with ZSLBA = Z. Assigned ALBAs: rec1 at Z+16, rec2 at Z+0, rec3 at Z+24, rec4 at Z+8. The host's guessed map (rec1 at Z+0 and so on) is wrong for all four. Reads succeed, the PI guard passes (the data is intact), and only content verification with a per-record header notices.\n\n- **Why tests hide it:** QD 1, or a single queue on a firmware that happens to process in order, gives ALBA order equal to submission order every time.\n- **Report Zones mid-flight:** the write pointer it returns may lag behind appends whose completions are still pending, and it changes between your read and your use. Whether it already includes uncompleted appends is not something to depend on. Use it only when quiesced.\n- **Right pattern:** update the index from the CQE.\n- **Coverage assertion for the validator:** count ALBA inversions (pairs where a later-submitted append got a lower ALBA). If the count is zero over a run at QD 32, the test did not exercise concurrency and its pass means little. Add multiple queues and random submit delays until inversions appear.","pitfall":"Using the write pointer from Report Zones as the address of an outstanding append.","verify":"Whether a Report Zones write pointer can include appends that are not yet completed to the host.","follow":[{"q":"Would the guess be right with one SQ and QD 4?","a":"It may hold on a given firmware, but nothing in the spec promises it."},{"q":"How can address prediction be made legal?","a":"Serialize: submit the next append only after the previous CQE. That is QD 1 and gives up the benefit."}],"mod":5},{"id":"5.13","level":"Advanced","type":"Cross-layer","fig":null,"tags":["power-loss","durability","recovery","torn-append"],"q":"What can the host conclude about completed and in-flight appends after a power loss or controller reset?","short":"After recovery, LBAs below the zone's write pointer are written and those above are not. An append whose CQE arrived is durable only if it was made so: FUA, a completed Flush, or a non-volatile cache. Appends with no CQE may or may not have persisted, and because a large append is not necessarily atomic, the pointer can land inside one. Recovery must validate the tail, not trust host bookkeeping.","deep":"1. **Durable and acknowledged:** every such append must be fully readable below the recovered write pointer with correct content. Any miss is a firmware bug: acknowledged data lost.\n2. **Not acknowledged:** three outcomes: absent, fully present, or torn (only part of its range). Persisted data forms a prefix of the zone (everything below the pointer), so a torn record can only be the last one.\n3. **Non-durable acknowledged:** may be lost. A recovered write pointer lower than the last one seen before the cut is legal.\n4. **Zone state:** open zones are expected to come back Closed after a reset (module 3), and resource counters restart (module 6).\n\n**Host recovery:** read the zone report, scan each zone from the last checkpoint to the write pointer, verify header and CRC, drop a torn tail record from the index, and decide whether to finish the zone or keep appending after the tail.\n\n**Test design:**\n- Cut power to the SSD only (programmable slot power or PDU), keeping the host alive so its journal survives. Journal: record id, ALBA, CQE time, FUA or flush status.\n- Cut at random offsets during append bursts at several queue depths, thousands of cycles.\n- Assertions: durable-acknowledged records intact; every LBA below the recovered pointer readable; content below the pointer matches journal records, with at most one torn tail; recovered pointer not below the durable high-water mark.","pitfall":"Comparing the recovered write pointer with the pointer seen just before the cut. A lower value is legal for non-durable data. Compare only with the durable high-water mark.","verify":"Zone state of open zones after a controller-level reset, that the write pointer may land inside a multi-block append, and how Flush relates to zone append durability, in the ZNS and NVM Command Set specifications.","follow":[{"q":"Should acknowledged non-FUA appends survive?","a":"Not necessarily. Only with a non-volatile write cache or a Flush issued after their CQEs."},{"q":"How do you detect a torn tail?","a":"The record header length or CRC fails, or the record extends past the recovered write pointer."}],"mod":5},{"id":"5.14","level":"Principal","type":"Scenario","fig":null,"tags":["test-design","oracle","concurrency","fault-injection"],"q":"Design a validation suite for Zone Append concurrency on new firmware. What is the oracle and what do you assert?","short":"Drive many concurrent appends of varied sizes at one zone through several queues, log every command and CQE, and check invariants offline: every ALBA inside the zone, ranges disjoint, their union contiguous from the write pointer, final pointer (or Full state) equal to the total, and every range's content matching its self-describing payload. Add limit, state, PI and fault cases, and assert that reordering was actually produced.","deep":"**Payload:** each append carries per-block headers: unique append id, block index within the append, zone id, a host sequence number, and a CRC. Nothing location dependent, since the address is unknown at submit.\n\n**Oracle (offline, from the log):**\n1. Sort all successful (ALBA, NLB+1) intervals. Assert inside the zone, no overlaps, no gaps, starting at the initial write pointer.\n2. Quiesce, then Report Zones: write pointer equals start plus total blocks (Full state if the zone filled).\n3. Read back everything: block headers give append id and index, so each range must hold exactly one append's blocks in order.\n\n**Case groups:**\n- Size: 1 block, ZASL, ZASL plus 1 (Invalid Field), mixed sizes, sizes straddling NAND page or stripe boundaries of the device.\n- Capacity: exact fill, one block over (Zone Boundary Error), tail race with several outstanding.\n- State: Empty, Closed, Explicitly Open, Full, Read Only, Offline, plus open-limit and active-limit exhaustion (module 6).\n- Concurrency: 1 to 8 queues, QD sweep, multiple zones in parallel, reads of completed ranges during appends.\n- PI: PIREMAP 0 and 1, types, metadata forms (5.11).\n- Faults: abort and timeout mid-burst (5.10), controller reset, power cut (5.13), injected media errors if the drive has an injection interface.\n\n**Coverage assertions:** ALBA inversion count above zero, queue depth actually reached, and every status code above observed at least once.\n\n**Tooling:** SPDK or fio passthrough for the load, a CQE-level logger (or analyzer capture) for the log, a Python checker for the oracle. Keep logs so a failure can be replayed and handed to firmware.\n\n**Attribution rule:** overlapping ranges, or gaps in a complete CQE log, are device faults by construction (the oracle uses CQE data only). Content mismatches need the payload capture (5.16) before blaming either side.","pitfall":"A checker that recomputes expected addresses from submission order. That encodes a guarantee the spec does not give and fails good firmware.","verify":null,"follow":[{"q":"What is not a failure?","a":"Different completion order, ALBA order differing from submission order, and Zone Boundary Error at the zone tail."},{"q":"How do you keep it from becoming flaky?","a":"Fix random seeds, log them, and bound each run by blocks, not time, so a run can be replayed."}],"mod":5},{"id":"5.15","level":"Principal","type":"Cross-layer","fig":null,"tags":["raid","mirroring","erasure-coding","design"],"q":"You are building RAID 1 or erasure coding across ZNS SSDs and want Zone Append for concurrency. What breaks, and what are your options?","short":"Each drive assigns its own ALBA, so two replicas of one write can land at different offsets in matching zones, and stripe chunks stop lining up. The host then needs per-device location metadata for every write, or must serialize per zone group and lose the concurrency. Rebuild, GC and scrub must use the map, not address arithmetic. It is a design trade-off rather than a bug.","deep":"With Write, every replica sits at the same offset, logical-to-physical is arithmetic and rebuild copies same offsets. With Append, concurrent records X, Y, Z can land on drive A as X, Y, Z and on drive B as Y, X, Z. Same bytes, different addresses.\n\n**Options:**\n1. **Serialize per mirrored zone group:** submit to both, wait for both CQEs, then the next. Simple, and back to QD 1.\n2. **Per-replica index:** record maps to (ALBA on A, ALBA on B). Costs metadata size and a journal, and each leg needs its own GC and recovery because zone contents differ.\n3. **Leader append plus ordered follower Write:** append to one leg, then Write the follower at the leader's ALBA. One address per record, but the follower's Writes must arrive in ALBA order, so ordering machinery returns on that leg.\n4. **Erasure coding:** chunk k of stripe S can land anywhere on each drive, so record a per-chunk address. Degraded reads and parity rebuild go through the map.\n\n**Failure semantics:** if one leg's append timed out and was retried (5.10), legs diverge. Scrub must compare by record id, not by offset.\n\n**Decision criteria:** first ask whether the bandwidth target can be reached with several zones at QD 1 (needs N open and active zones per stream). If yes, avoid append and keep arithmetic addressing. Use append when open-zone budget or latency at small sizes forces concurrency inside one zone.\n\n**Validation angle:** inject different completion orders on each leg, then read via each leg alone and compare contents; degrade one leg mid-run and verify reconstruction.","pitfall":"Assuming logical zone n on both drives holds identical bytes at identical offsets once appends are used.","verify":null,"follow":[{"q":"Can both drives be made to assign identical ALBAs?","a":"Not with concurrent appends. Only identical arrival order per zone, in practice QD 1, achieves it."},{"q":"Which option minimizes metadata?","a":"Leader append with follower Writes: one address per record, at the cost of ordering on the follower."}],"mod":5},{"id":"5.16","level":"Principal","type":"Debug","fig":null,"tags":["firmware-race","triage","cqe","payload-capture"],"q":"A soak test reads back another record's contents. It happens only at QD 32 over 4 queues and only on one firmware build. How do you decide whether it is a device bug or a host bug?","short":"Log every command and CQE at the lowest layer available and test the invariant on CQE data alone. If two CQEs report overlapping ALBA ranges, the device assigned overlapping space, which is a firmware bug. If the ranges are disjoint but the content is wrong, examine host buffer reuse, PRP lists and the index, then use bus captures of the payload to see what the device received.","deep":"**Cheapest check first:** sort the CQE (ALBA, NLB+1) intervals and test disjointness and contiguity. It takes seconds and needs no analyzer.\n\n**Evidence to conclusion:**\n\n| Observation | Points to |\n|---|---|\n| Overlapping ALBA ranges in CQEs, confirmed on the wire | Firmware allocation race, for example a non-atomic write pointer update across cores |\n| Disjoint ALBAs, payload on the wire correct, media read wrong | Device data path or mapping (staging buffer, NAND page merge) |\n| Disjoint ALBAs, payload already wrong on the wire | Host: buffer reused before completion, PRP or SGL error |\n| Analyzer CQE ALBA correct, host index differs | Host: 32-bit result truncation, command ID mapping bug |\n| Only with timeouts or aborts | Duplicate append from a retry (5.10) |\n\n**Method:**\n1. Minimize: one zone, fixed size, sequence markers in every block.\n2. Bisect: queues 1 to 4, QD 4 to 32, append size, and sizes that are not multiples of the NAND page (tail merging across appends).\n3. Capture: analyzer trace of SQE, CQE and payload TLPs for the failing records; correlate by command ID.\n4. Compare firmware builds and ask for the internal allocation trace for the zone.\n5. Check the reconciliation from 5.10 (write pointer versus sum of successes).\n\n**Firmware hypotheses to hand over:** race in write pointer allocation between cores, staging buffer crossing a page boundary between adjacent appends, PI remap offset wrong, implicit close or eviction while appends are outstanding.","pitfall":"Blaming firmware from a read-back mismatch without proving overlap in the CQE data, or blaming the host without a bus-level payload capture.","verify":null,"follow":[{"q":"Why capture the payload on the bus?","a":"It separates \"the device received wrong data\" from \"the device stored or mapped it wrongly\"."},{"q":"What if the failure disappears with a logger attached?","a":"Timing changed. Suspect a race and stress the same path with a lighter logger or hardware capture."}],"mod":5},{"id":"6.01","level":"Basic","type":"Concept","fig":"zoneres","tags":["active","open","resources","states"],"q":"What is the difference between an active zone and an open zone in ZNS?","short":"An open zone is one in the Implicitly Opened or Explicitly Opened state. An active zone is any open zone plus any zone in the Closed state. So open is a subset of active. The namespace enforces two independent budgets, Maximum Active Resources and Maximum Open Resources. Empty, Full, Read Only and Offline zones consume neither.","deep":"| Zone state | Counts as active | Counts as open |\n|---|---|---|\n| Empty | no | no |\n| Implicitly Opened | yes | yes |\n| Explicitly Opened | yes | yes |\n| Closed | yes | no |\n| Full | no | no |\n| Read Only | no | no |\n| Offline | no | no |\n\n- **Active means \"the controller must keep partial state for this zone\".** A Closed zone has a write pointer that is neither at the start nor at the end, so the device has already committed NAND and mapping resources to it.\n- **Open means \"the zone can accept a write right now\".** Only open zones can be written. A write to a Closed zone first moves it to Implicitly Opened, which needs a free open resource.\n- **Two limits, two failure modes.** Running out of active resources blocks new zones from being started. Running out of open resources blocks new writers, even when active resources are still free.\n- **Where the states come from:** see module 3 for the state machine. This module is about the counting.","pitfall":"Treating \"open\" and \"active\" as the same number. A host that only tracks writers can still hit Too Many Active Zones because Closed zones keep counting. Confirmed (ZNS 1.4, 2.1.1.4 and Figure 8): MAR and MOR are fields of the per-namespace Identify Namespace data structure, so the limits are per namespace. Coordinating resource use across hosts sharing one zoned namespace is explicitly out of scope of the spec.","verify":null,"follow":[{"q":"Does a Full zone hold any resource?","a":"No. Reaching capacity (or a Finish) releases both the active and the open resource. This is why finishing a zone is a way to free an active slot."},{"q":"Are limits per controller or per namespace?","a":"They are reported in the namespace's ZNS Identify data, so treat them as per namespace. VERIFY sharing rules if a subsystem has several zoned namespaces."}],"mod":6},{"id":"6.02","level":"Basic","type":"Concept","fig":null,"tags":["mar","mor","identify","encoding","nvme-cli"],"q":"Where do you read the zone resource limits, and how are MAR and MOR encoded?","short":"They are in the Zoned Namespace Command Set specific Identify Namespace data (Identify with CNS 05h and CSI 02h): MAR at byte offset 4 and MOR at offset 8, each 4 bytes. Both are 0-based, so the limit is the field value plus 1, and FFFFFFFFh means no limit. Linux exposes them as max_active_zones and max_open_zones, where 0 means no limit.","deep":"```\nnvme zns id-ns /dev/nvme0n1                  # zoc, ozcs, mar, mor, rrl, frl, lbafe zsze/zdes\ncat /sys/block/nvme0n1/queue/max_active_zones\ncat /sys/block/nvme0n1/queue/max_open_zones\n```\n- **Layout of the start of the structure:** ZOC (2 bytes at 0), OZCS (2 at 2), MAR (4 at 4), MOR (4 at 8), RRL (4 at 12), FRL (4 at 16).\n- **Decode:** mar = 0xD means 14 active zones. mar = 0xFFFFFFFF means unlimited.\n- **Linux does the arithmetic in 32 bits:** it stores mor + 1 and mar + 1. FFFFFFFFh plus 1 wraps to 0, which the block layer reads as no limit. The same trick appears in the SPDK API, where a returned 0 means no limit.\n- **Zone size and descriptor extension size** sit in the per-LBA-format extension at the end of the same structure. See module 2 for the layout.\n- **What a validator checks first:** MAR is at least MOR, and the values match the datasheet. A device that reports mar smaller than mor is a firmware bug.","pitfall":"Reading the raw field as the count. The off-by-one is why a \"14 zone\" drive shows 0xD. Confirmed (ZNS 1.4, 4.1.5.1, Figure 49): MAR is bytes 07:04 and MOR is bytes 11:08 of the I/O Command Set specific Identify Namespace data structure (CNS 05h, CSI 02h), both 0's based, and FFFFFFFFh means no limit. The spec also states MOR shall be less than or equal to MAR.","verify":null,"follow":[{"q":"A device reports mar = 0 and mor = 0. What does that mean?","a":"One active zone and one open zone, not unlimited. Only FFFFFFFFh means no limit."},{"q":"Can the limits change at runtime?","a":"They belong to the namespace, so expect a change only through a format or namespace management operation. Re-read Identify after any namespace change."}],"mod":6},{"id":"6.03","level":"Basic","type":"Concept","fig":null,"tags":["limits","firmware","plp","buffers","design"],"q":"Why does a ZNS SSD limit active and open zones at all, and why must MAR be at least MOR?","short":"Each active zone pins partly written NAND state and each open zone pins write buffering and open program units, so the controller sizes those for a bounded count. Open is a subset of active, so the active limit can never be below the open limit. The limits are what let a ZNS drive need much less DRAM and power-loss capacitance than one that could have every zone open.","deep":"- **What an open zone typically costs (firmware view):** a write buffer slice, an open NAND block or superblock stripe, partially filled program pages that are not yet safe on NAND, and mapping state. The exact recipe is vendor specific.\n- **What an active (Closed) zone typically costs:** the partially programmed NAND block must be kept, and the device must be able to resume programming at the write pointer later. It still owns NAND that cannot be reclaimed.\n- **Power-loss sizing:** the data that must be flushed on power loss grows with the number of open zones. The limit bounds the capacitor energy the design needs.\n- **Why MAR >= MOR:** every open zone is also active, so a device cannot allow more open zones than active zones. Equal values are common, and are legal.\n- **What the host pays:** it must schedule its writers against the budget. That is the price for removing the drive's internal garbage collection.","pitfall":"Assuming a larger MOR is always better for the host. If the firmware degrades latency or write amplification at high open counts, the host wants a lower operating point than the limit. The spec itself requires MOR <= MAR (ZNS 1.4, 2.1.1.4: \"The Maximum Open Resources field shall be less than or equal to the Maximum Active Resources field\"). The per-zone resource costs above are typical designs, not spec text. Confirm against the actual product architecture document.","verify":null,"follow":[{"q":"Why not just make MOR huge?","a":"More open zones means more buffer RAM, more open NAND blocks with worse program interference management, and more energy to flush on power loss. The limit is a cost decision."},{"q":"Do conventional NVMe SSDs have an equivalent?","a":"Not as a visible limit. They have hidden open blocks per stream, and the controller hides the cost behind its FTL. With ZNS it surfaces in the interface."}],"mod":6},{"id":"6.04","level":"Intermediate","type":"Concept","fig":null,"tags":["transitions","accounting","resources","state-machine"],"q":"Which zone state transitions consume or release active and open resources?","short":"Leaving Empty for an open state consumes one active and one open resource. Moving from Closed to an open state consumes one open. Closing an open zone releases an open resource but keeps the active one. Reaching Full, a Finish, a Reset or a controller-forced Read Only or Offline releases everything the zone held. Open-to-open (implicit to explicit) is free.","deep":"| Transition (trigger) | Active | Open |\n|---|---|---|\n| Empty to Implicitly Opened (Write, Append) | +1 | +1 |\n| Empty to Explicitly Opened (Open Zone) | +1 | +1 |\n| Closed to Implicitly or Explicitly Opened | 0 | +1 |\n| Implicitly Opened to Explicitly Opened (Open Zone) | 0 | 0 |\n| Opened to Closed (Close Zone, or controller implicit close) | 0 | -1 |\n| Opened to Full (write reaches capacity, or Finish) | -1 | -1 |\n| Closed to Full (Finish) | -1 | 0 |\n| Opened to Empty (Reset) | -1 | -1 |\n| Closed to Empty (Reset) | -1 | 0 |\n| Empty to Closed (Set Zone Descriptor Extension) | +1 | 0 |\n| Opened or Closed to Read Only or Offline (controller) | -1 | -1 if it was open |\n\n- **The host commands that free an active slot are Finish and Reset:** Finish gives up the unwritten capacity and Reset destroys the data. Close does not free one.\n- **The last write** to a zone that reaches its capacity moves it to Full and frees both resources with no host command.\n- **Set Zone Descriptor Extension** is easy to forget: it turns an Empty zone into a Closed one, so it is an active-resource allocation.\n- **Validation use:** this table is the oracle for a resource model in a test harness. Every row is a test.","pitfall":"Assuming Close gives back an active slot. It only gives back an open slot, so parking zones in Closed does not help against the active limit. This whole table is confirmed against the resource management rules in ZNS 1.4, 2.1.1.4.1(a)-(g), including the Set Zone Descriptor Extension row (Empty to Closed consumes one active resource, and if none is available the command is aborted per 2.1.1.4 with no state change) and the Read Only or Offline release behavior.","verify":null,"follow":[{"q":"Does reading a zone consume a resource?","a":"No. Reads work in any state that has valid data and do not change zone state or resource counts."},{"q":"Does Open Zone on an already Explicitly Opened zone change anything?","a":"It is a valid no-op for resources. See module 4 for the exact transition rules and Select All behaviour."}],"mod":6},{"id":"6.05","level":"Intermediate","type":"Concept","fig":null,"tags":["status-codes","too-many-active","too-many-open","errno"],"q":"What happens when a write or an Open Zone would exceed the limits, and which status codes come back?","short":"If no active resource is free, the command fails with Too Many Active Zones. If an active resource is free but no open resource is, and MAR is greater than MOR, the controller shall (not may) select and close one Implicitly Opened zone to make room, as long as one exists; only if no zone is Implicitly Opened does it fail with Too Many Open Zones. Both are Command Specific status codes: SC BDh and BEh in status code type 1 (ZNS 1.4, 2.1.1.4.1).","deep":"| Status | SCT | SC | Combined (Linux nvme.h) | Linux errno |\n|---|---|---|---|---|\n| Too Many Active Zones | 1 | BDh | 0x1BD | EOVERFLOW (\"active zones exceeded\") |\n| Too Many Open Zones | 1 | BEh | 0x1BE | ETOOMANYREFS (\"open zones exceeded\") |\n\n- **Order of checks for a write to an Empty zone:** active resource first, then open resource. The command needs both.\n- **Write to a Closed zone** needs only an open resource, so it can fail with Too Many Open Zones but never with Too Many Active Zones.\n- **Consequence of Open being a subset of Active:** when MAR equals MOR, the open limit can never be hit first, so a test sees only Too Many Active Zones. Reasoning: open zones are a subset of active zones, so with MAR equal to MOR the active limit is reached no later than the open limit.\n- **A failed command changes nothing:** the zone state and the resource counts must be identical before and after. That is an easy negative test.\n- **Retry policy:** these errors are not transient. A blind retry fails again until the host closes, finishes or resets something.","pitfall":"Reading the errno as a media error. EOVERFLOW and ETOOMANYREFS from a zoned block device are resource errors, not defects. The apparent \"precedence\" is really just which resource the requested transition is short of (ZNS 1.4, 2.1.1.4.1): when MAR > MOR, an Active shortfall is checked as Active, and an Open shortfall is checked as Open (with the mandatory implicit-close fallback above); when MAR equals MOR, only the Active check applies. VERIFY: Whether the DNR bit is set on these statuses (Base Specification territory, not addressed by the ZNS spec).","verify":null,"follow":[{"q":"Is the status the same for Zone Append?","a":"Append follows the same resource rules as a write, because it also opens the zone. See module 5."},{"q":"What other zone status codes sit next to these?","a":"B8h Zone Boundary Error through BFh Invalid Zone State Transition. Module 7 covers them all."}],"mod":6},{"id":"6.06","level":"Intermediate","type":"Concept","fig":null,"tags":["implicit-close","eviction","latency"],"q":"What is implicit close, and what does it mean for the host and for a validator?","short":"When a command needs an open resource and none is free, and MAR is greater than MOR, the controller shall transition one Implicitly Opened zone to Closed to make room, then process the command, as long as at least one zone is Implicitly Opened; this is mandatory, not optional. It never closes an Explicitly Opened zone. The host gets no error and no choice of victim, so the visible effects are a zone that quietly became Closed and an occasional latency spike.","deep":"- **Trigger:** a write, append or Open Zone that would push open zones past MOR while some zone is Implicitly Opened, with MAR greater than MOR.\n- **Victim choice** is up to the controller. A controller might pick the least recently written zone, but the spec does not say which one, so do not build on a specific policy.\n- **Cost:** closing a zone forces the firmware to make its buffered data safe (pad or flush partial program units). That work lands on the command that triggered it, so p99 latency on writes can spike when the host runs above MOR implicit writers.\n- **State after:** the victim is Closed, still active, write pointer unchanged. The next write to it moves it back to Implicitly Opened and may evict another zone. Round-robin writing over more than MOR zones evicts on every write.\n- **Explicit open is the opt-out:** an Explicitly Opened zone cannot be evicted, and that is why Open Zone is the tool for reserving resources.\n- **What to check in a test:** with MOR + 1 implicit writers and MAR at least MOR + 1, no error occurs, Report Zones shows exactly MOR open zones and at least one Closed zone, and no data is lost or reordered.","pitfall":"Writing to more than MOR zones and calling it fine because no error was returned. It runs, but with a hidden close and reopen on many writes.","verify":null,"follow":[{"q":"Does the host get a notification of an implicit close?","a":"No. The ZNS spec explicitly excludes \"the controller transitioning that zone to the ZSC:Closed state\" from generating a Zone Descriptor Changed event (ZNS 1.4, Figure 43 note (e)). Report Zones or a periodic sweep (6.11) is the only way to see it."},{"q":"Can a device refuse to implicitly close?","a":"Not if an Implicitly Opened zone exists and MAR is greater than MOR: the spec says the controller shall select and close one. It can return Too Many Open Zones only when no zone is Implicitly Opened (for example all open zones are Explicit) or when MAR equals MOR."}],"mod":6},{"id":"6.07","level":"Intermediate","type":"Concept","fig":null,"tags":["explicit-open","implicit-open","reservation","strategy"],"q":"Should a host open zones explicitly or rely on implicit open, and how does that change failures?","short":"Explicit open reserves the resources at Open Zone time, so a shortage shows up as a clean, early error before any data is written and the zone cannot be evicted. Implicit open takes the resources at the first write, so a shortage may appear mid-stream, or be hidden by an eviction. Choose explicit for long-lived writers with latency targets and implicit for many short-lived ones.","deep":"| | Explicit Open | Implicit Open |\n|---|---|---|\n| When resources are taken | At the Open Zone command | At the first write or append |\n| Failure point | The Open command, no data at risk | The first write, which the host may have already queued |\n| Eviction by controller | Never | Possible when open resources are short |\n| Extra commands | One per zone | None |\n| Cleans up by | Close or Finish from the host | Also the controller (implicit close) |\n\n- **Explicit open** is a pre-flight check. A writer thread opens its zone, and only then accepts work. Resource exhaustion becomes back-pressure at the resource manager rather than an I/O error on the data path.\n- **Explicit open on an empty zone still costs an active slot,** even if nothing is ever written. A leaked explicit open is a leaked active zone.\n- **Implicit open** saves a command and lets the device optimise, but the host loses control of what is open.\n- **Mixed use** works: implicit open moves to explicit with Open Zone at no resource cost.","pitfall":"Explicitly opening a spare zone \"just in case\" and forgetting it. That is a permanent active and open resource with no data.","verify":"The ZenFS open policy in the ZenFS source (zbd_zenfs.cc calls only close, finish and reset on zones).","follow":[{"q":"Which does ZenFS-style software use?","a":"ZenFS keeps its own open and active token counters. In the current source it does not send Open Zone: zones are opened implicitly by writes, and it issues explicit Close, Finish and Reset. VERIFY against the version you use."},{"q":"Does explicit open change data placement?","a":"Not by spec. It is a resource statement only. Any placement effect is firmware specific."}],"mod":6},{"id":"6.08","level":"Intermediate","type":"Trap","fig":null,"tags":["trap","closed","crash","recovery","power-cycle"],"q":"After a host crash or power cycle a restarted application gets Too Many Active Zones on its first write. Why?","short":"Zone state is persistent device state, not host state. Open zones are returned to Closed at a power cycle or NVM subsystem reset (whether a controller-level reset alone does so is unconfirmed), and Closed zones stay active. The restarted host starts counting from zero, but the device still holds every zone the previous instance left partly written. Recovery must reconcile with Report Zones, then finish, reset or resume those zones.","deep":"- **What happens at a reset or power cycle:** zones that were Implicitly or Explicitly Opened become Closed (or Empty if nothing was written), and their write pointers are kept. Open resources are freed but active resources are not.\n- **What the host believes:** its in-memory table is gone, so it thinks zero zones are active.\n- **What the device believes:** up to MAR zones are active. The first write to an Empty zone is refused.\n- **Recovery procedure:**\n  1. Identify to read MAR and MOR.\n  2. Report Zones over the whole namespace, or filter by state (one state value per report) for Implicitly Opened, Explicitly Opened and Closed if you want only active zones.\n  3. For each: resume it (it is a valid append point), Finish it, or Reset it if its data is no longer needed.\n  4. Only then start new writers.\n- **Validation angle:** power cycle in the middle of a many-zone workload and check every zone's state and write pointer against the model. A zone that lost data past the acknowledged write pointer is a data-integrity bug. A zone that changed active status unexpectedly is a state bug.","pitfall":"Tracking resource use only in RAM. After a crash, that model is wrong, and the device is the only source of truth.","verify":null,"follow":[{"q":"Should the host reset all zones at startup?","a":"Only if the data is disposable. Otherwise reconcile: resume or finish partly written zones according to the application's own log."},{"q":"Does a controller reset alone (not a power cycle) do the same?","a":"The ZNS spec only defines the post-reset initial zone state for an NVM Subsystem Reset or all controllers completing shutdown (ST=0, SHST=10b): a zone with data becomes Closed, one with none becomes Empty (ZNS 1.4, 2.1.1.3). A bare Controller Reset (CC.EN toggle) alone is not addressed by this spec; VERIFY against the vendor."}],"mod":6},{"id":"6.09","level":"Advanced","type":"Concept","fig":null,"tags":["zde","descriptor-extension","zdes","set-zone-descriptor"],"q":"What is the Zone Descriptor Extension, how big can it be, and how is it used?","short":"The Zone Descriptor Extension (ZDE) is optional host-defined metadata attached to a zone and returned with its zone descriptor by an extended Report Zones. Its size, ZDES, is per LBA format, in units of 64 bytes, and it is set with the Set Zone Descriptor Extension action, which moves an Empty zone to Closed and sets the ZDEV bit in the zone attributes.","deep":"- **Size:** ZDES is an 8-bit field in the LBA format extension of the ZNS Identify Namespace data. Bytes equals ZDES times 64, at most 255 x 64 = 16,320 bytes. A value of 0 means the format has no extension.\n- **Set:** Zone Management Send with action 10h and a data buffer of exactly ZDES x 64 bytes. It is valid on an Empty zone, and it moves that zone to Closed.\n- **Resource impact:** Closed is active. Setting an extension on many empty zones can hit MAR, and it should be planned in the budget of module 6.12. It does not use an open resource.\n- **Valid bit:** the ZDEV bit (bit 7 of the zone attributes byte in the descriptor) says an extension is present.\n- **Read:** Zone Management Receive with the extended report action returns each descriptor followed by ZDES x 64 bytes. Reports get bigger, so size the buffer for it.\n- **Use cases:** a filesystem stores a zone owner, generation number, lifetime class or checksum of a zone header, so a scan after a crash reads it in one command rather than reading data from every zone.\n- **nvme-cli:** `nvme zns set-zone-desc`, and `nvme zns report-zones` with the extended option.","pitfall":"Setting the extension on a zone that then sits Closed and empty for a long time. It permanently holds an active resource. Confirmed (ZNS 1.4, 2.1.1.3(b)): a zone's initial state after an NVM Subsystem Reset is Closed if its Zone Descriptor Extension Valid bit is set, which means the extension data persists across that reset rather than being lost.","verify":null,"follow":[{"q":"What happens to the extension on Reset Zone?","a":"Confirmed cleared: on successful Reset Zone the spec requires the Zone Descriptor Extension Valid bit to be cleared to 0 (ZNS 1.4, 3.4.3.1.5), along with FZR, RZR, ZFC and ZRWAV."},{"q":"Is it supported by Linux block layer?","a":"The mainline block layer has no interface I know of for it, so use passthrough or a user-space stack such as SPDK or xNVMe."}],"mod":6},{"id":"6.10","level":"Advanced","type":"Concept","fig":null,"tags":["zae","fzr","rzr","zfc","frl","rrl","excursion"],"q":"What are FZR, RZR, FRL, RRL and a Zone Active Excursion, and why would a device do that?","short":"A device may want zones not to stay active or Full indefinitely. It advertises time limits (FRL and RRL) and sets Finish Zone Recommended or Reset Zone Recommended in the zone attributes. If the host ignores a recommendation, a device that supports Zone Active Excursions may itself Finish the zone: the zone goes to Full, the Zone Finished by Controller bit is set, and the host is notified.","deep":"- **Capability:** ZOC bit 1 in Identify says the namespace may perform Zone Active Excursions. ZOC bit 0 is Variable Zone Capacity.\n- **Zone attributes byte in the descriptor:** bit 0 ZFC (Zone Finished by Controller), bit 1 FZR (Finish Zone Recommended), bit 2 RZR (Reset Zone Recommended), bit 7 ZDEV.\n- **Why it exists (typical):** a zone left partly written for a long time strands NAND in open blocks with retention and data-integrity exposure. A zone left Full with stale data pins capacity. Vendors want the host to close the loop.\n- **FRL:** the limit after which FZR may be set. **RRL:** the analogous limit for RZR (which zone states it applies to is in the specification). Newer revisions add FRL1 to FRL3 and RRL1 to RRL3, selected per zone. Units and start-of-timer rules are in the specification.\n- **The excursion:** the controller does a Finish itself. The zone becomes Full, ZFC is 1, resources are released, and a Zone Descriptor Changed notice is sent (module 6.11).\n- **Linux:** the NVMe driver refuses namespaces whose ZOC is nonzero (dmesg: \"zone operations:2 not supported for namespace:1\"). A ZAE device is unusable with mainline Linux, so devices meant for Linux hosts normally report ZOC of 0.","pitfall":"Treating an unexpected Zone Is Full as a firmware bug without checking ZFC in the zone descriptor. With ZAE it is the specified behaviour. Confirmed (ZNS 1.4, Figure 49, 5.4, 5.5, Figure 38): FRL/RRL and their 1/2/3 variants are in seconds, counted from when the FZR/RZR bit is set to 1; a 2-bit FZRTL/RZRTL field in the Zone Attributes Information byte selects which one applies; ZFC is bit 0, FZR is bit 1, and RZR is bit 2 of the Zone Attributes byte.","verify":null,"follow":[{"q":"Why is an excursion a concern for a host?","a":"A writer sees Zone Is Full (B9h) on a zone it thought had space. The remaining capacity is lost until Reset."},{"q":"Does FZR force the host to act?","a":"No. It is a recommendation. Only the excursion is an action by the controller."}],"mod":6},{"id":"6.11","level":"Advanced","type":"Concept","fig":null,"tags":["zone-descriptor-changed","changed-zone-list","aen","log-page"],"q":"How does the host learn that a zone changed behind its back: Zone Descriptor Changed and the Changed Zone List?","short":"The controller can send a Zone Descriptor Changed asynchronous event (notice type), and the host reads the Changed Zone List log page (LID BFh) to get the zone IDs. The log holds up to 511 zone start LBAs, and a count of FFFFh means the list overflowed and the host must rescan with Report Zones. Reading the log without RAE clears it and re-arms the event.","deep":"- **Enable:** Set Features, Asynchronous Event Configuration, bit 27 (Zone Descriptor Changed Notices). The controller advertises support in OAES bit 27. Then keep an Asynchronous Event Request outstanding.\n- **Log layout (4096 bytes):** a 2-byte count (Number of Zone Identifiers), 6 reserved bytes, then 511 entries of 8 bytes each (2 + 6 + 511 x 8 = 4096). The entries are zone start LBAs.\n- **What triggers it:** an excursion (Zone Active Excursion, which shall generate the event), a zone going Read Only or Offline, or an FZR or RZR attribute change. The spec explicitly excludes several causes from generating this event or updating the log: a Zone Management Send that named that zone or all zones, the ordinary write-caused transitions (Empty to Implicitly Opened, Implicitly Opened to Full, Explicitly Opened to Full, Closed to Implicitly Opened), a controller Full-transition from an NVM Subsystem Reset, and the controller closing a zone (implicit close, 6.06) (ZNS 1.4, Figure 43 note).\n- **Re-arm rule:** as with other notice events, no new event is sent until the log is read. RAE = 1 reads without clearing.\n- **Overflow:** if more zones changed than fit, the count is FFFFh and the entries are not valid. Rescan.\n- **Not persistent:** it is not preserved across a controller reset. After a reset, rescan.\n```\nnvme zns changed-zone-list /dev/nvme0n1        # add --rae to retain\nnvme get-feature /dev/nvme0 -f 0x0b            # Async Event Configuration\n```","pitfall":"Reading the log with RAE = 1 in a loop. The event is never re-armed and you see no more notices. Confirmed: the Asynchronous Event Information value for Zone Descriptor Changed is EFh and AEC bit 27 (ZDCN) enables it (ZNS 1.4, Figure 43, Figure 45). VERIFY: the OAES bit that advertises controller support is a NVMe Base Specification field, not defined in the ZNS spec.","verify":null,"follow":[{"q":"Does mainline Linux consume this event?","a":"Not to my knowledge. A host that needs it uses passthrough, SPDK or a periodic Report Zones. VERIFY on your kernel."},{"q":"Why keep periodic Report Zones as well?","a":"The event can be lost or overflowed, and reset clears the log. Treat the event as a hint."}],"mod":6},{"id":"6.12","level":"Advanced","type":"Numeric","fig":null,"tags":["numeric","budget","writers","lsm","capacity"],"q":"A host has 14 active and 8 open zones. How do you budget them across a WAL, data writers and compaction, and what does it cost?","short":"Take steady-state open zones first, then add one slot for zone rotation, then use what remains of the active budget for parked Closed zones. With 1 metadata, 1 WAL, 3 data and 1 compaction writer that is 6 open, 7 at peak with rotation serialized. That leaves 8 - 7 = 1 spare open slot and 14 - 7 = 7 active slots for parked zones.","deep":"Assumptions: MAR field = 13 (14 active), MOR field = 7 (8 open), zone capacity 1077 MiB, one zone sustains about 400 MB/s. All figures here are assumed, not from a datasheet.\n\n| Role | Open zones | Note |\n|---|---|---|\n| Metadata or journal | 1 | Always open |\n| WAL | 1 | Always open |\n| Data writers (3 lifetime classes) | 3 | One zone each |\n| Compaction output | 1 | One at a time |\n| Steady open | 6 | |\n| Rotation slot | 1 | Serialize rotations with a semaphore |\n| Peak open | 7 | Leaves 8 - 7 = 1 spare |\n\n1. **Active:** the peak is 7 open, and active is at least open. That leaves 14 - 7 = 7 active slots for parked Closed zones, for example cold-lifetime zones that are only written occasionally.\n2. **Throughput check:** 6 writers x 400 MB/s = 2400 MB/s. If the device can do 3 GB/s, more open zones are needed to saturate it, and the budget must be redone.\n3. **Cost of Finish instead of parking:** finishing a zone at 25 percent fill gives up 0.75 x 1077 = 808 MiB. At 50 percent fill, 538.5 MiB. Parking costs an active slot, and Finish costs capacity, so the trade is per workload.\n4. **Why a rotation slot:** when a writer fills a zone, opening the next before the old one is Full needs both an extra open and an extra active. Without the slot, rotation fails with Too Many Open Zones exactly when the load is highest.\n5. **Why serialize:** two simultaneous rotations need 2 slots. A semaphore of 1 turns a fatal race into a short wait.","pitfall":"Budgeting only steady-state writers. The peaks are at rotation and at recovery after a crash.","verify":"None for the arithmetic. Check real MAR and MOR from Identify on the target drive.","follow":[{"q":"What changes if MAR equals MOR at 8?","a":"No separate parking budget: open writers and parked Closed zones share the same 8 slots, so each parked zone takes a slot from a writer. Finish or Reset zones instead of parking them."},{"q":"What do you monitor?","a":"Open and active counts from Report Zones per second, rotation wait time, and Too Many status counts (should be zero)."}],"mod":6},{"id":"6.13","level":"Advanced","type":"Debug","fig":null,"tags":["debug","too-many-open","too-many-active","blkzone","nvme-cli"],"q":"Writes to a zoned namespace start failing after N zones. How do you find out why?","short":"Read the limits, then the actual zone states, then the status code. A failure at the open limit with implicit writers is masked by eviction, so failing at exactly MOR usually means the zones were opened explicitly. A failure at MAR with few open zones means Closed zones are eating the active budget. The errno separates the two: ETOOMANYREFS is open, EOVERFLOW is active.","deep":"Setup: a harness writes 4 KiB to the start of each of 20 empty zones in turn, on a drive with mar = 0xD and mor = 0x7 (14 active, 8 open).\n```\n$ cat /sys/block/nvme0n1/queue/max_active_zones /sys/block/nvme0n1/queue/max_open_zones\n14\n8\n$ ./write_zones.sh --mode implicit --zones 20\nzone 0..13 ok\nzone 14: write: Value too large for defined data type      # EOVERFLOW\n$ ./write_zones.sh --mode explicit --zones 20\nzone 0..7 ok\nzone 8: open: Too many references: cannot splice           # ETOOMANYREFS\n```\n1. **Implicit run, failure at zone 14:** Empty zones opened by writes go through implicit close (8 open, the rest Closed) until 14 are active. The 15th zone needs a new active slot, and no eviction can supply one, so it fails with active exceeded.\n2. **Explicit run, failure at zone 8:** explicitly opened zones cannot be evicted, so the 9th open fails with open exceeded, even though 6 active slots remain.\n3. **Confirm with Report Zones:** count zones by state. Expect 8 open and 6 Closed for the implicit run, and 8 explicit and 0 Closed for the explicit run.\n4. **Cross-check the kernel log:** `dmesg` shows \"active zones exceeded\" or \"open zones exceeded\" on the failed request. On the wire, SCT 1 with SC BDh or BEh.\n5. **Fix by evidence:** if the harness is wrong, close or finish zones and cap concurrency. If the device counts differently (fails earlier than Identify says), it is a firmware bug: file it with the Report Zones snapshot, both Identify values and the command trace.","pitfall":"Trusting the harness's own count of zones. Compare with Report Zones after every phase, because Closed zones from a previous run are still holding slots.","verify":"The exact dmesg wording and blkzone output format on your kernel version. The lines above are illustrative.","follow":[{"q":"The implicit run fails at zone 8 instead. What is the likely cause?","a":"Since MAR (14) > MOR (8) here and the run is all-implicit writers, the ZNS 1.4 spec requires the controller to implicitly close a zone instead of failing (2.1.1.4.1). Failing at zone 8 with an Implicitly Opened zone available is a firmware bug against this revision, not an implementation choice."},{"q":"The counts match but the error is on a Close command. What next?","a":"Close is only valid on an open zone. Check for Invalid Zone State Transition (BFh) rather than a resource status."}],"mod":6},{"id":"6.14","level":"Advanced","type":"Cross-layer","fig":null,"tags":["host","zenfs","rocksdb","btrfs","f2fs","accounting"],"q":"How do real host stacks account for zone resources, for example RocksDB with ZenFS, btrfs and f2fs?","short":"They budget from the Identify limits, keep a central counter of active and open zones with reservations for metadata, and acquire resources before starting a zone. ZenFS subtracts reserved zones (metadata and extent migration) from the limits and hands the rest to lifetime-classified writers. The Linux zoned block layer exports the limits but does not arbitrate them, so each consumer has to.","deep":"- **Common pattern:** read max_open_zones and max_active_zones, subtract reserved zones, and use a counting semaphore for the rest. Take the open and active slots in one fixed order (ZenFS waits for an open token first, then takes an active token if it needs a new zone), and release on Full, Finish or Reset.\n- **ZenFS (RocksDB zoned backend):** it tracks active and open I/O zones against the device limits minus 2 reserved zones (one for metadata, one for extent migration), and picks a zone by the file's write lifetime hint so data with similar death times share a zone. It finishes a zone whose remaining capacity drops below a configurable finish threshold, and finishes the cheapest zone when active tokens run out. VERIFY details and constants in the source.\n- **btrfs (zoned mode):** counts active block groups against the limit and finishes zones it no longer needs to keep active. VERIFY current behaviour.\n- **f2fs (zoned):** several log heads write concurrently, and mount checks that the device allows enough open zones for them. VERIFY the check and message.\n- **Block layer:** since zone write plugging (Linux 6.10 or later, VERIFY) it serializes writes per zone, but resource limits stay a policy issue for the filesystem or application.\n- **Startup:** reconcile with Report Zones (module 6.08) before allowing writers.\n- **Degrade, do not fail:** on Too Many Open Zones a good stack waits for a slot and retries, and logs it, rather than failing the user's I/O.","pitfall":"Coding to a fixed number from a datasheet. Use the Identify values on the drive in front of you, because two firmware versions can differ.","verify":"ZenFS reserved zone counts and selection policy, btrfs active block group handling, f2fs mount check, and the kernel version that introduced zone write plugging.","follow":[{"q":"Why take the tokens in one fixed order?","a":"Empty to open needs both, and two writers taking them in opposite orders can each hold one and wait for the other. One order avoids that deadlock."},{"q":"How does a validator emulate these hosts?","a":"With fio zbd mode and `max_open_zones`, plus a custom harness that models the same semaphore. Module 9 lists the tooling."}],"mod":6},{"id":"6.15","level":"Principal","type":"Scenario","fig":null,"tags":["test-plan","boundary","matrix","concurrency","validation"],"q":"How would you design the validation suite for zone resource limits (MAR and MOR) on a new ZNS firmware?","short":"Build a host-side model of the resource rules, then drive it across the boundary: MAR-1, MAR, MAR+1 and the same for MOR, for every transition and every command type that opens a zone. Add concurrency races for the last resource, implicit close behaviour, reset and power-cycle recovery, and error injection. Pass criteria are exact status codes plus model-equal zone states after every step.","deep":"1. **Oracle:** a small model implementing the table from 6.04 (state, active count, open count per namespace). Every command is predicted, executed, and compared on status, zone state, write pointer and counts.\n2. **Boundary matrix:** for limit L in MAR, MOR: reach L-1, L, and try L+1 using each opener (write, append, Open Zone, write to Closed, Set Zone Descriptor Extension). Expect the exact status from 6.05 and no state change on failure.\n3. **MAR versus MOR configurations:** MAR > MOR (implicit close should work), MAR equal MOR (only Too Many Active seen), MOR field value 0 (one open zone), and unlimited FFFFFFFFh (write many zones, then check that no limit error appears).\n4. **Implicit close:** MOR + 1 implicit writers, expect zero errors, exactly MOR open zones, data intact. Then mix in explicit zones and prove they are never evicted.\n5. **Races:** N threads compete for the last slot with N = 2..64. Exactly one wins, the others get the right error, and the counts stay consistent. Repeat with Append.\n6. **Release paths:** last-write-to-capacity, Finish, Reset, Select All actions, controller-forced Read Only and Offline via fault injection. After each, the slot must be reusable.\n7. **Persistence:** power cycle or reset with zones open and Closed, then check state, write pointers and that MAR can still be reached but not exceeded.\n8. **Evidence and criteria:** per-run log with the command trace, the model diff and the Report Zones snapshot. Zero unexplained mismatches over a soak (for example 72 hours with error injection) is the exit criterion.","pitfall":"Testing only sequentially. A resource counter bug that appears only under concurrency passes a single-thread suite. The oracle rules (resource-shortfall handling, the Set Zone Descriptor Extension resource cost, and each Zone Send Action's Select All behavior) are confirmed against ZNS 1.4, 2.1.1.4.1 and 3.4.3.1.1-3.4.3.1.7.","verify":null,"follow":[{"q":"What is the hardest case to get right?","a":"Concurrent races combined with reset and error injection, because it exercises rollback paths. See 6.16."},{"q":"Which behaviours are implementation-defined and must not be tested as pass or fail?","a":"Only the victim choice for implicit close. Under ZNS 1.4, whether the controller closes a zone or fails with Too Many Open Zones is not implementation-defined when an Implicitly Opened zone exists and MAR > MOR (6.06); that case is mandatory and belongs in the pass/fail oracle."}],"mod":6},{"id":"6.16","level":"Principal","type":"Debug","fig":null,"tags":["leak","accounting","soak","fault-injection","root-cause"],"q":"After a long soak with error injection, the drive returns Too Many Active Zones although Report Zones shows only 3 active zones. How do you root-cause it?","short":"Treat it as a resource accounting leak in the firmware. Prove it with a probe that measures how many zones can really be made active, quantify the leaked count, correlate the count with the injected events, then check whether a reset or power cycle heals it. The healing behaviour tells you whether the counter is runtime-only or wrongly rebuilt from persistent metadata.","deep":"1. **Capture:** Report Zones snapshot, the latest Identify, the log pages (error log, telemetry if available) and the command trace before touching anything.\n2. **Probe:** with the namespace quiet, Reset all active zones, then Explicitly Open empty zones one by one until Too Many Active Zones. If the count achieved is MAR - k, then k slots leaked. Repeat for open resources with MOR.\n3. **Correlate:** does k grow with a specific event? Typical leak paths are commands that fail after the state change (write to an Empty zone that then hits a media error or an abort), Reset racing a write, Append abort, a zone going Read Only, and recovery after an unsafe shutdown that rebuilds counts from NAND metadata.\n4. **Heal test:** after a controller reset, is k back to 0? Yes suggests a runtime counter that is not rolled back on an error path. No suggests the persisted or reconstructed state is wrong, for example a stale open flag in metadata.\n5. **Bisect:** replay the trace with one event class at a time. Reduce to the minimum sequence, for example \"write to Empty zone, inject write error, check probe\".\n6. **Report:** the sequence, k, the healing behaviour, and the model diff. The fix belongs in the firmware's error and rollback paths, and the regression test is the probe run after every injected error type.\n- **Add the probe to the suite:** run it at the end of every test, not only after this soak.","pitfall":"Fixing the symptom by resetting all zones every time. The leak returns and the underlying error path stays untested.","verify":"None for the method. Confirm the vendor tooling available to read internal resource counters, which is the fastest confirmation.","follow":[{"q":"Why not trust Report Zones as the truth?","a":"It reports zone states, not the controller's internal counters. A leak shows only as a mismatch between the two."},{"q":"What if k is negative, the device allows more than MAR?","a":"A counter underflow or double release. It is also a bug, and it may let the host exceed the buffer sizing that MAR protects."}],"mod":6},{"id":"6.17","level":"Principal","type":"Cross-layer","fig":null,"tags":["zae","policy","host","firmware","integrity"],"q":"How would you validate a device that supports Zone Active Excursions, and what host policy would you write for it?","short":"Validate that the controller only acts after the recommended limits expire, sets FZR before it acts, and afterwards reports a Full zone with ZFC set, released resources, intact acknowledged data and a Zone Descriptor Changed notice. Host policy: poll or subscribe for FZR and RZR, finish or reset before the limit, and treat Zone Is Full on a zone with ZFC as an excursion, not an error.","deep":"- **Preconditions:** ZOC bit 1 set, FRL and RRL read from Identify, and a way to shorten the limits (a vendor setting or test firmware), otherwise a test would take hours or days.\n- **Firmware validation:**\n  1. Leave a zone partly written and idle. Expect FZR clear before FRL and set after it.\n  2. Ignore FZR. The excursion happens: state Full, ZFC = 1, active and open resources released.\n  3. Every acknowledged LBA below the old write pointer reads back correct. The Finish must not lose data.\n  4. The Changed Zone List names the zone and the event is delivered once.\n  5. A write in flight at the time of the excursion gets a defined result: complete (data kept) or Zone Is Full, with no torn state.\n  6. Do it under a power cycle and under many zones at once, and check the sequence is consistent.\n  7. Host response in time (finish before FRL) prevents any excursion.\n- **Host policy:** every Report Zones interval, sweep for FZR and RZR. Prefer to keep writing or Finish, on your schedule, rather than let the device decide. Reset RZR zones when the data is dead.\n- **Compatibility:** mainline Linux refuses a ZOC nonzero namespace, so the host must be SPDK, xNVMe or a modified driver. State this in the test plan.\n- **Design point:** an excursion costs the remaining capacity of the zone. Size the zones and the FRL against the slowest writer.","pitfall":"Validating only the happy path where the host reacts in time. The excursion path is the one that has firmware-specific rollback, resource release and notification logic.","verify":"The definition and trigger of a Zone Active Excursion, the FRL and RRL timer semantics, in-flight command handling, and notification requirements in the ZNS Command Set Specification.","follow":[{"q":"How do you tell an excursion from a host bug that finished the zone?","a":"ZFC. It is set only when the controller did it."},{"q":"What does a device with ZAE change in capacity planning?","a":"Slow writers lose unwritten capacity, so plan to fill or finish every active zone within FRL."}],"mod":6},{"id":"7.01","level":"Basic","type":"Concept","fig":null,"tags":["status-codes","sct","sc","catalog","command-specific"],"q":"Which zone-specific status codes does ZNS define, and when is each one returned?","short":"The base ZNS command set adds eight Command Specific status codes (SCT 1h), SC B8h to BFh. Five describe a zone state or geometry problem on an I/O command (Zone Boundary Error, Zone Is Full, Zone Is Read Only, Zone Is Offline, Zone Invalid Write), two are resource limits (Too Many Active Zones, Too Many Open Zones), and one is a bad Zone Management Send action (Invalid Zone State Transition). In Linux they are 0x1b8 to 0x1bf. ZRWA adds B6h and B7h (see DEEP).","deep":"| SC | Name | Typical trigger |\n|---|---|---|\n| B8h | Zone Boundary Error | Write or append longer than the space left in the zone, or a read spanning two zones when Read Across Zone Boundaries is 0 |\n| B9h | Zone Is Full | Write or append to a Full zone |\n| BAh | Zone Is Read Only | Write or append to a Read Only zone |\n| BBh | Zone Is Offline | Read or write to an Offline zone |\n| BCh | Zone Invalid Write | Write whose SLBA is not the write pointer |\n| BDh | Too Many Active Zones | The command would need one active resource more than MAR allows |\n| BEh | Too Many Open Zones | It needs an open resource and none can be freed |\n| BFh | Invalid Zone State Transition | Zone Management Send action not legal from the zone's current state |\n\n- **Encoding:** the Linux value is SCT shifted left 8 plus SC, so SCT 1 and SC BCh is 0x1bc. Raw CQE decoding of a whole status field is in 4.09.\n- **Added with ZRWA (later ZNS revision):** B6h Invalid Zone Operation (for example a ZRWA request on a zone that is not Empty, or an invalid explicit flush) and B7h ZRWA Resources Unavailable. They are in libnvme and QEMU but not in Linux nvme.h. See module 11.\n- **Not on the list:** an SLBA that is not a zone start is Invalid Field in Command (SCT 0, SC 02h), an address beyond the namespace is LBA Out of Range (SCT 0, SC 80h), and NAND failures use the media error type (SCT 2: Write Fault 80h, Unrecovered Read Error 81h).\n- **Where the detail lives:** resource codes are in module 6, append cases in module 5, transitions in module 4. This module is about reading and reacting to the whole set.\n- **Triage habit:** for any of these, ask which zone state and which command produced it. The code alone rarely names the bug.","pitfall":"Memorising B8h to BFh as a flat list. In an interview or a triage, the useful skill is mapping code to cause: state problem, address problem, length problem, resource problem or media problem. Confirmed against ZNS 1.4, Figure 11 for the status names and the per-command status figures in section 3.3-3.4. B6h and B7h (ZRWA) were introduced by TP4153, which this Revision 1.4 explicitly incorporates (see the spec's front matter), so all eight codes are native to ZNS 1.4; older hosts written against ZNS 1.0-1.3 may only recognize B8h-BFh.","verify":null,"follow":[{"q":"Is Zone Invalid Write the same as writing to a Full zone?","a":"No. Zone Is Full is about the zone's state. Zone Invalid Write means the zone accepts writes but the SLBA is not the write pointer."},{"q":"Which of the eight does Linux treat specially?","a":"Only the two Too Many codes get their own block status. The rest become a generic I/O error (see 7.03)."}],"mod":7},{"id":"7.02","level":"Basic","type":"Concept","fig":null,"tags":["write","status","zone-state","invalid-write","boundary"],"q":"What does a Write return for each zone state and for each kind of bad address or length?","short":"A Write that starts exactly at the write pointer and fits succeeds in Empty, Open and Closed zones. Full returns Zone Is Full, Read Only returns Zone Is Read Only and Offline returns Zone Is Offline. In a writable zone, an SLBA that is not the write pointer returns Zone Invalid Write, and a length that runs past the space left returns Zone Boundary Error. A rejected write should leave the state and write pointer unchanged.","deep":"| Zone state | Correct write | SLBA not at WP | Runs past capacity |\n|---|---|---|---|\n| Empty | Success, zone becomes Implicitly Open | Zone Invalid Write | Zone Boundary Error |\n| Implicitly or Explicitly Open | Success | Zone Invalid Write | Zone Boundary Error |\n| Closed | Success, zone reopens implicitly | Zone Invalid Write | Zone Boundary Error |\n| Full | Zone Is Full | Zone Is Full (or Invalid Write, see 7.11) | Zone Is Full |\n| Read Only | Zone Is Read Only | Zone Is Read Only (see 7.11) | Zone Is Read Only |\n| Offline | Zone Is Offline | Zone Is Offline (see 7.11) | Zone Is Offline |\n\n- **Resources first:** a correct write to an Empty or Closed zone can still fail with Too Many Active Zones or Too Many Open Zones (module 6).\n- **The last write:** a write that ends exactly at ZSLBA + ZCAP succeeds and makes the zone Full. The next write returns Zone Is Full.\n- **Address-specific writes only:** the write pointer check applies to commands that name an LBA. Zone Append names the zone start instead, so it never returns Zone Invalid Write (5.06).\n- **Free oracle, with a caveat:** a command aborted outright (Zone Boundary Error, Zone Invalid Write, or a zone-state abort) writes nothing and leaves the write pointer unchanged. That is different from a write that starts executing and then fails partway (e.g. a media error): the spec allows the write pointer there to land inside the range, one past it, or become invalid (ZNS 1.4, 2.1.1.2.1.1). The \"no side effect\" oracle applies only to the outright-aborted cases.\n- **Gap addresses:** an SLBA between ZCAP and the end of the zone is not writable (confirmed, Annex A.5); since the write pointer can never itself sit in that gap without the zone first becoming Full, such an SLBA never equals the write pointer, so the write is aborted with Zone Invalid Write.","pitfall":"Expecting one status per bad write. A write with several faults at once can return more than one legal status (7.11).","verify":null,"follow":[{"q":"Which status means the host and the device disagree about the write pointer?","a":"Zone Invalid Write. Every other zone status is about state, length or resources."},{"q":"Does Zone Invalid Write put the zone into an error state?","a":"No. The zone stays as it was, and the next correct write succeeds."}],"mod":7},{"id":"7.03","level":"Basic","type":"Cross-layer","fig":null,"tags":["linux","block-layer","errno","dnr","nvme-cli","tracing"],"q":"How does a zone error status reach a Linux application, and what is lost on the way?","short":"The NVMe driver keeps the full status in the request, but converts it to a block status: Too Many Active and Too Many Open get their own resource statuses, Capacity Exceeded becomes no space, and every other status, including Zone Invalid Write and Zone Is Read Only, becomes a generic I/O error, which the application sees as EIO. To see the real SCT and SC use the kernel log, NVMe tracepoints, nvme-cli or passthrough.","deep":"| NVMe status | Linux block status | errno seen |\n|---|---|---|\n| Too Many Active Zones (1h/BDh) | BLK_STS_ZONE_ACTIVE_RESOURCE | EOVERFLOW |\n| Too Many Open Zones (1h/BEh) | BLK_STS_ZONE_OPEN_RESOURCE | ETOOMANYREFS |\n| Capacity Exceeded (0h/81h) | BLK_STS_NOSPC | ENOSPC |\n| Every other zone status | BLK_STS_IOERR | EIO |\n\n- **Kernel log:** recent kernels print one rate-limited line per failed I/O with the opcode, LBA, block count, status name, `sct 0x1 / sc 0xbc` and a DNR flag. That is the fastest way to see the real code. The wording depends on the kernel version.\n- **Tracing:** enable the nvme trace events (`echo 1 > /sys/kernel
