/tracing/events/nvme/enable`) to see submit and completion with status.\n- **Passthrough:** `nvme io-passthru` and the nvme-cli zns commands print the status name and value, and they skip the block layer's checks.\n- **Retries:** the driver also decides whether to retry from the status and the DNR bit (7.07), and the application never sees that.\n- **Consequence for validation:** a test that only sees EIO cannot tell Zone Invalid Write from Zone Is Read Only. Assert exact statuses at the NVMe layer (passthrough, SPDK, analyzer), and use the block layer only for end-to-end behavior.","pitfall":"Writing a test that expects a specific errno such as EIO to mean Zone Invalid Write. The mapping is many to one.","verify":"The kernel log wording and the version that added it, and the errno values, on the kernel you test. The block status mapping matches drivers/nvme/host/core.c.","follow":[{"q":"A dd to a zone returns Input/output error. What is the first step?","a":"Read dmesg for the sct and sc line, or repeat the write through nvme passthrough. Then Report Zones on that zone."},{"q":"Does the application see DNR?","a":"No. It is used inside the driver for the retry decision and printed in the log."}],"mod":7},{"id":"7.04","level":"Intermediate","type":"Concept","fig":null,"tags":["read","status","offline","boundary","dulbe","media-error"],"q":"Which reads to a zoned namespace can fail, and with what status?","short":"Very few. A read fails with Zone Is Offline in an Offline zone, with Zone Boundary Error when it spans two zones and the Read Across Zone Boundaries bit is 0, with LBA Out of Range beyond the namespace, and with a media error (Unrecovered Read Error) when the data cannot be recovered. A read at or above the write pointer normally succeeds and returns the unwritten-block value, unless DULBE is enabled and the device reports an Unwritten Logical Block error.","deep":"| Condition | Result |\n|---|---|\n| Zone Offline | Zone Is Offline (SCT 1, BBh) |\n| Zone Read Only, Full, Open, Closed or Empty | Success. Blocks at or above the WP return the unwritten value |\n| Range spans zones, Read Across Zone Boundaries = 0 | Zone Boundary Error (SCT 1, B8h) |\n| Range spans zones, bit = 1 | Success if every zone touched is readable |\n| Range beyond the namespace | LBA Out of Range (SCT 0, 80h) |\n| NAND data lost | Unrecovered Read Error (SCT 2, 81h) |\n| DULBE enabled and unwritten block read | Deallocated or Unwritten Logical Block (SCT 2, 87h) |\n\n- **No Read Only status for reads:** Zone Is Read Only exists only for writes. Reads of a Read Only zone succeed, which is how the host evacuates data.\n- **Why success above the WP:** unlike SMR drive models, ZNS allows it, and the value comes from DLFEAT (3.11 has the full state table and the encodings).\n- **Linux never spans zones:** the driver sets the request chunk size to the zone size, so the block layer splits I/O at zone boundaries. The Read Across Zone Boundaries bit matters only for passthrough, SPDK and other user-space stacks. RAZB is OZCS bit 0 (ZNS 1.4, Figure 49); OZCS bit 1 is ZRWASUP.\n- **Media error is real loss:** Unrecovered Read Error means that range is gone. The host recovers from redundancy, and does not retry in a loop.\n- **Capacity gap:** confirmed (Annex A.5): LBAs between ZCAP and the end of the zone \"behave like deallocated blocks when read\", i.e. return the unwritten-block value, with no NAND access implied.","pitfall":"Treating a read above the write pointer as an error to be asserted. It is legal and returns the unwritten value.","verify":"DLFEAT (the unwritten-block read value encoding) is an NVM Command Set field, not ZNS-specific. What a cross-zone read returns when only the second zone touched is Offline is not spelled out beyond the single-zone rule in 2.1.1.2.1.2.","follow":[{"q":"How do you test Read Across Zone Boundaries?","a":"Read Identify to learn the bit, then read across the boundary and expect success or Zone Boundary Error to match the bit. Include a case where the second zone is Offline."},{"q":"Which read status must a validator never accept in a Read Only zone?","a":"Zone Is Read Only, because it applies to writes. A valid read should succeed."}],"mod":7},{"id":"7.05","level":"Intermediate","type":"Trap","fig":null,"tags":["boundary","capacity","partial-write","write-sizing"],"q":"A 128-block write starts 100 blocks before the zone capacity. Does the device write 100 blocks and fail the rest?","short":"No. The command is aborted with Zone Boundary Error, no data is written, and the zone stays open with the same write pointer. There is no short write in ZNS, so the host never gets a partial count. Only a write that ends exactly at ZSLBA + ZCAP succeeds and makes the zone Full. The host must split or size writes itself, using capacity, not zone size.","deep":"Example: ZSLBA 0x20000, ZCAP 0xDC00, so the capacity limit is 0x2DC00. The WP is 0x2DC00 - 100 = 0x2DB9C.\n\n| Write from WP | Status | State afterwards |\n|---|---|---|\n| 99 blocks | Success | Open, 1 block left |\n| 100 blocks | Success | Full |\n| 101 blocks | Zone Boundary Error | Open, WP still 0x2DB9C |\n| 128 blocks | Zone Boundary Error | Open, WP still 0x2DB9C |\n\n- **Why hosts hit it:** they plan from Zone Size (the gap between ZCAP and ZSZE is not writable), or they run several writers and cannot know how much is left.\n- **Host options for the tail:** pad it with a filler record, Finish the zone and give up the tail, or pick a record size that divides the capacity.\n- **Same rule for Append:** an append that does not fit fails whole (5.06).\n- **Test boundaries:** with r blocks left, write r - 1, r and r + 1 (success, success and Full, Zone Boundary Error), and one write that starts at the last block.\n- **Recovery after the error:** nothing to repair. Send the smaller write and the zone becomes Full.","pitfall":"Retrying the same write. It fails the same way until the host shortens it or picks another zone. Confirmed (ZNS 1.4, 2.1.1.2.1.1 and Annex A.5, Figure 64): the length check is against zone capacity, not zone size (\"the Number of Logical blocks exceeds the remaining number of logical blocks in that zone\", with the zone's highest usable LBA defined as ZSLBA + ZCAP - 1). A command aborted outright with Zone Boundary Error leaves the zone state and write pointer unchanged.","verify":null,"follow":[{"q":"How does the host know the remaining space without Report Zones?","a":"From its shadow: ZCAP minus (WP minus ZSLBA), provided the shadow is trusted (7.12)."},{"q":"Is the error also used when the write would cross into the next zone?","a":"Yes. Any write longer than the space left in its zone gets it."}],"mod":7},{"id":"7.06","level":"Intermediate","type":"Concept","fig":null,"tags":["read-only","offline","media","evacuation","degraded"],"q":"Why does a controller move a zone to Read Only or Offline, and what does the host keep in each state?","short":"The controller does it when the media under a zone can no longer be trusted, for example after NAND program or erase failures with no spare left. Read Only keeps the written data readable and refuses writes, so the host can copy it out. Offline means the zone is not accessible and reads fail as well. Both states are entered by the controller, Reset Zone does not recover either, and the WP is not valid in either.","deep":"| | Read Only | Offline |\n|---|---|---|\n| Reads | Succeed | Zone Is Offline |\n| Writes and appends | Zone Is Read Only | Zone Is Offline |\n| Open, Close, Finish, Reset | Invalid Zone State Transition | Invalid Zone State Transition |\n| Offline Zone command | Moves to Offline | Success, no change |\n| Counts as active or open | No | No |\n| Write pointer field | Not valid | Not valid |\n\n- **Typical causes (firmware view, not spec text):** program or erase failure with no spare block for the zone's stripe, worn-out blocks, or lost redundancy. A zone can also start life Offline after a Format or namespace creation.\n- **Data promise:** data acknowledged before the fault is expected to be readable. The tail that was in flight may not be, and the WP cannot tell you where it ends, so the host uses its own record.\n- **What the failing command sees:** the write that hit the fault may complete with a media error status (SCT 2, Write Fault). Later writes see Zone Is Read Only. Which one the host sees first is device specific.\n- **Host reaction:** stop allocating to the zone, evacuate readable data, optionally send Offline Zone once the data is safe, remove the zone from capacity accounting, and raise an alert if the count crosses a threshold (7.16).\n- **Resources:** both states release active and open resources, so a fault can hide by freeing a slot.","pitfall":"Assuming Read Only means all earlier data is safe. The zone went bad because the media misbehaved, so verify readability during evacuation and keep a second copy where the data matters. The table above is confirmed against ZNS 1.4, 2.1.1.2.1.2 (reads succeed except in Offline) and 3.4.3.1.1-3.4.3.1.6 (Close/Finish/Open/Reset abort with Invalid Zone State Transition from Read Only or Offline; only Offline Zone is valid from Read Only). VERIFY: which status the write that triggers the Read Only transition itself returns, and any Read Only to Offline transition the controller makes on its own, are vendor/media-specific and not addressed by the spec.","verify":null,"follow":[{"q":"Can the host bring a Read Only zone back?","a":"Not with Zone Management commands. Recovery, if any, is vendor specific or a format."},{"q":"Should a validator require Zone Is Read Only for the write that caused the fault?","a":"No. Accept the media error or the zone status, and require the zone status from the next command on."}],"mod":7},{"id":"7.07","level":"Intermediate","type":"Concept","fig":null,"tags":["retry","dnr","policy","linux","backoff"],"q":"Which zone errors should a host retry, and how do DNR and the Linux retry logic interact with them?","short":"Almost none, at least not blindly. Zone errors describe a zone state or a host mistake, so the same command fails again until something changes. Retry only after fixing the cause: pick another zone, shorten the write, resync the write pointer, or free a resource. Linux retries a failed request up to nvme_core.max_retries times (default 5) unless DNR is set, so a device that returns these statuses without DNR causes pointless retries.","deep":"| Status | Host reaction |\n|---|---|\n| Zone Boundary Error | Shorten the write, or move to a new zone |\n| Zone Is Full | Rotate to a new zone, then confirm with Report Zones |\n| Zone Is Read Only | Stop writing, evacuate, mark the zone bad |\n| Zone Is Offline | Mark the zone dead, recover data from redundancy |\n| Zone Invalid Write | Drain, Report Zones, resync the shadow WP, find the lost or reordered write |\n| Too Many Active or Open Zones | Free a resource (Close, Finish, Reset), then retry with bounded backoff |\n| Invalid Zone State Transition | The host state model is wrong. Report the zone and re-plan |\n\n- **DNR:** it is bit 31 of CQE dword 3. It tells the host that retrying cannot succeed. Whether the ZNS spec requires it for these statuses is not something I could confirm, so a validator records it and treats it as informational.\n- **Linux logic:** the request completes without retry if DNR is set, if the request is marked no-retry, or if the retry count has reached the limit. Nothing in the driver exempts zone statuses, so a Zone Invalid Write without DNR is retried up to 5 times.\n- **Danger of a retry:** the second attempt of a Zone Invalid Write write can succeed by accident once an earlier write lands and moves the WP. That hides a reordering bug and shifts data.\n- **Unknown outcome:** never retry an append blindly (5.10). For a timed-out write, resync first (7.14).","pitfall":"Wrapping writes in a generic retry-on-EIO loop. On a zoned device most EIOs are deterministic, and a loop turns them into hangs or duplicates.","verify":"Whether the specification requires DNR for any zone status, and the nvme_core.max_retries default on your kernel (5 in the source checked).","follow":[{"q":"Which of these are worth an automatic retry with backoff?","a":"Only the two Too Many statuses, and only if another writer is expected to release a resource soon."},{"q":"Should a test assert DNR = 1 on Zone Is Full?","a":"Only if the vendor datasheet promises it. Otherwise log it."}],"mod":7},{"id":"7.08","level":"Intermediate","type":"Cross-layer","fig":null,"tags":["detection","zone-descriptor-changed","changed-zone-list","report-zones","health-log"],"q":"How does the host find out that zones have failed, and which signals can it rely on?","short":"There are four signals: the status of a command that touches the bad zone, the Zone Descriptor Changed event with the Changed Zone List log page, a periodic Report Zones sweep, and the health log. None is complete alone. An inline error appears only if the host touches the zone, the event can be lost or overflow, and the health log is not per zone. A Report Zones sweep is the ground truth.","deep":"| Signal | Sees | Blind spot |\n|---|---|---|\n| Inline status (BAh, BBh, media error) | The zones being written or read | Zones the host is not using. Reads of Read Only zones still succeed |\n| Zone Descriptor Changed event and Changed Zone List | Changes the host did not cause | Overflow (count FFFFh), reset clears it, mainline Linux does not consume it (6.11) |\n| Report Zones sweep | Every zone, with state and attributes | It is a snapshot. Costs one report per few thousand zones (4.11) |\n| SMART and vendor logs | Available Spare, Percentage Used, media errors, Critical Warning | Not zone specific |\n\n- **Sweep design:** run it on a timer, after every controller reset or timeout, and after any burst of errors. Compare with the last snapshot and log each zone whose state moved to Read Only or Offline.\n- **What to record:** zone ID, time first seen, previous state, the shadow WP, and the valid data map for the zone, so evacuation knows what to copy.\n- **Filtering:** Report Zones can filter by state, so the sweep can ask for Read Only and Offline zones only. The filter codes are in 4.08.\n- **Validation:** after injecting a media fault, assert that the event or sweep reports exactly the expected zones and no others, and that the reported state matches what commands then return.","pitfall":"Relying on the asynchronous event alone. It is a hint, and the design must still work when it is missing.","verify":"The trigger list for the Zone Descriptor Changed notice and the ZRASF values for Read Only and Offline (see the note in 4.08), in the ZNS Command Set Specification.","follow":[{"q":"Why sweep after a controller reset?","a":"The Changed Zone List does not survive a reset, and the driver's view of the namespace may have changed too."},{"q":"Can a zone go Read Only with no event at all?","a":"Yes, if the device does not support the event or the host did not enable it. A sweep is the fallback."}],"mod":7},{"id":"7.09","level":"Advanced","type":"Debug","fig":null,"tags":["debug","status-sequence","host-bug","log","triage"],"q":"Read the host log below (4 KiB LBAs, ZSZE 0x10000, ZCAP 0xDC00) and name the host bug behind each failing status.","short":"Six of eight commands fail and each points to a different host mistake. Lines 1 and 2: the write was sized from Zone Size instead of capacity, then retried. Line 4: a write into a zone that line 3 made Full. Line 5: two unordered writers on one zone. Line 6: Reset Zone on a Read Only or Offline zone. Line 7: a read of an Offline zone the allocator still trusts.","deep":"| # | Command | SLBA | NLB | Status (SCT/SC) |\n|---|---|---|---|---|\n| 1 | Write zone 2 | 0x2DB00 | 512 | 1h/B8h |\n| 2 | Write zone 2 | 0x2DB00 | 512 | 1h/B8h |\n| 3 | Write zone 2 | 0x2DB00 | 256 | 0h/00h |\n| 4 | Write zone 2 | 0x2DC00 | 8 | 1h/B9h |\n| 5a | Write zone 4 (thread B) | 0x40040 | 64 | 1h/BCh |\n| 5b | Write zone 4 (thread A) | 0x40000 | 64 | 0h/00h |\n| 6 | Reset zone 6 | 0x60000 | - | 1h/BFh |\n| 7 | Read zone 7 | 0x70400 | 16 | 1h/BBh |\n\n1. **Lines 1 and 2:** zone 2 starts at 0x20000, so its capacity ends at 0x2DC00. The WP is 0x2DB00, leaving 0x100 = 256 blocks. A 512-block write exceeds that, so Zone Boundary Error. The host planned to fill to the end of the zone (0x30000). Line 2 repeats the same command, which cannot succeed.\n2. **Line 3:** 256 blocks fits exactly, so the zone becomes Full.\n3. **Line 4:** the write sits at ZSLBA + ZCAP = 0x2DC00. The host never recorded that line 3 filled the zone. Zone Is Full (not Zone Invalid Write) shows the device checked the state first, which is legal but see 7.11.\n4. **Line 5:** thread B wrote at 0x40040 before thread A's 0x40000 executed. The WP was still 0x40000, so B got Zone Invalid Write. A then succeeded. B must be resubmitted at 0x40040. See 5.03.\n5. **Line 6:** Reset succeeds from Open, Closed and Full, so BFh on a Reset means the zone is Read Only or Offline (4.09). The host treats Reset as a universal recycle step.\n6. **Line 7:** Zone Is Offline on a read. The zone went Offline earlier, and the allocator was never told (7.08).\n\nFix list: track capacity, not size; remember Full on completion; serialize or use Append; branch on zone state before Reset; sweep for failed zones. Lines 3 and 5b are the only healthy commands.","pitfall":"Fixing each failure locally with a retry. Each status needs a change to host bookkeeping, and retries hide the cause.","verify":"The precedence between Zone Is Full and Zone Invalid Write for line 4 (see 7.11), and that the statuses on lines 6 and 7 apply as decoded, in the ZNS Command Set Specification.","follow":[{"q":"How would you confirm line 6 without looking at the device?","a":"The state of zone 6 must be Read Only or Offline in Report Zones. If it is anything else, BFh on Reset is a device bug."},{"q":"Which of the six failures could be a device bug instead?","a":"Line 4 if the zone was not Full, and line 5 only if a QD 1 replay of the same commands still fails."}],"mod":7},{"id":"7.10","level":"Advanced","type":"Numeric","fig":null,"tags":["numeric","capacity","record-size","tail","boundary","append"],"q":"Zone capacity is 0xDC00 blocks of 4 KiB and the host writes 192 KiB records. How many records fit, what happens at the tail, and what does planning from Zone Size cost?","short":"ZCAP is 56,320 blocks (220 MiB) and a record is 48 blocks, so 1,173 records fit using 56,304 blocks. The remaining 16 blocks (64 KiB, 0.028 percent) are too small for one more record, so record 1,174 gets Zone Boundary Error. A host planning from Zone Size (65,536 blocks) expects 1,365 records, which is 192 more than the zone can hold.","deep":"Assumptions: 4 KiB LBAs, ZCAP = 0xDC00, ZSZE = 0x10000, records written as ordinary Writes at the write pointer, one at a time.\n1. ZCAP = 0xDC00 = 56,320 blocks = 220 MiB.\n2. Record = 192 KiB / 4 KiB = 48 blocks.\n3. Records that fit: floor(56,320 / 48) = 1,173, using 1,173 x 48 = 56,304 = 0xDBF0 blocks.\n4. Tail: 56,320 - 56,304 = 16 blocks = 0x10 blocks = 64 KiB, which is 16 / 56,320 = 0.028 percent of the zone.\n5. Record 1,174 (48 blocks) with WP at ZSLBA + 0xDBF0: 48 > 16, so Zone Boundary Error, nothing written, zone still open.\n6. Planning from Zone Size: floor(65,536 / 48) = 1,365 records, so the host over-plans by 1,365 - 1,173 = 192 records = 9,216 blocks = 36 MiB, which is the size of the gap between ZCAP and ZSZE.\n7. Across a namespace of 4,096 zones the tails add up to 4,096 x 64 KiB = 256 MiB. Small, but it decides a state machine.\n\nOptions at the tail:\n| Option | Result | Cost |\n|---|---|---|\n| Pad 16 blocks of filler | Zone becomes Full exactly at capacity | 64 KiB written, and the filler must be recognizable |\n| Send Finish Zone | Zone becomes Full, resources released | 64 KiB unused |\n| Choose a divisor record size | For 40 blocks: 56,320 / 40 = 1,408 records, tail 0 | Fits this capacity only |\n\nWith Zone Append at queue depth 8, the appends already in flight when the tail is reached each fail whole. Up to 7 more Zone Boundary Errors arrive, and they are normal, not faults (5.06).","pitfall":"Sizing the zone tail from Zone Size. The last 36 MiB of address space never accepts data.","verify":"None for the arithmetic. Confirm the actual ZCAP and ZSZE on your drive, and whether ZCAP can vary per zone.","follow":[{"q":"What changes if the drive reports variable zone capacity?","a":"The record count differs per zone, so compute it per zone from the descriptor, and re-read ZCAP after a Reset."},{"q":"How would you assert this in a test?","a":"Fill a zone with records of every size from 1 to 64 blocks. Expect exactly floor(ZCAP / size) successes, then Zone Boundary Error on the next write if a remainder is left (Full only when the sum equals ZCAP, in which case the next write returns Zone Is Full)."}],"mod":7},{"id":"7.11","level":"Advanced","type":"Trap","fig":null,"tags":["precedence","multi-fault","allowed-set","oracle","characterization"],"q":"A write has the wrong SLBA and also hits a Full, Read Only or Offline zone, or runs past capacity. Which status does the device return, and how should a validator treat it?","short":"ZNS 1.4 does not say. It defines each error on its own and gives no precedence order for combinations, so different devices may return different legal statuses for the same command. A validator should assert an allowed set for multi-fault commands, for example Zone Is Full or Zone Invalid Write for a wrong-SLBA write to a Full zone, and an exact code only where a single fault applies.","deep":"| Command | Faults present | Statuses to allow |\n|---|---|---|\n| Write below WP, fits, zone Open | Wrong SLBA only | Zone Invalid Write exactly |\n| Write to Full zone at any SLBA | Full plus maybe wrong SLBA | Zone Is Full, Zone Invalid Write |\n| Write to Read Only zone, wrong SLBA | Read Only plus wrong SLBA | Zone Is Read Only, Zone Invalid Write |\n| Write to Offline zone, any SLBA | Offline plus others | Zone Is Offline first choice, record the rest |\n| Write at WP, longer than space | Length only | Zone Boundary Error exactly |\n| Write at wrong SLBA, longer than space | Both | Zone Invalid Write, Zone Boundary Error |\n\n- **Cross-class order:** generic checks (Invalid Field, LBA Out of Range) usually come before zone checks, but treat that as observed behavior, not a rule.\n- **Test matrix:** 6 zone states x 4 SLBA positions (at WP, below, above, in the gap) x 2 lengths (fits, exceeds) = 48 cells. Only a minority have a single fault.\n- **Characterize, do not fail:** record what each firmware build returns per cell. A change between builds is a compatibility note to raise with the vendor, because host stacks may switch on the status.\n- **Host rule that makes the question moot:** on any zone status, Report Zones and decide from the state, never from the code alone.\n- **Linux hides it anyway:** all of these become EIO through the block layer (7.03).","pitfall":"Encoding one drive's behavior as the spec. That fails a compliant second source and passes a wrong first one.","verify":"Whether the ZNS Command Set Specification or the NVMe Base Specification states an ordering between zone state checks, the write pointer check and the boundary check.","follow":[{"q":"Which cells can be asserted exactly?","a":"The single-fault ones: wrong SLBA in an Empty, Open or Closed zone with a length that fits, and a correct SLBA with a length that overruns."},{"q":"Should the vendor define an order?","a":"Ask for it in the datasheet, and record the answer as an interoperability requirement."}],"mod":7},{"id":"7.12","level":"Advanced","type":"Cross-layer","fig":null,"tags":["power-loss","write-pointer","recovery","shadow","resync"],"q":"After a power loss or controller reset, how does a host establish the real write pointer, and which error tells it that its shadow is stale?","short":"Never trust the shadow write pointer after any reset. Run Report Zones over all zones, compare each WP with the last durable and last submitted points the host recorded, and check the data between the checkpoint and the WP by header or CRC. A host that resumes from a stale shadow gets Zone Invalid Write on its first write, whether the real WP is higher or lower, or it appends after a torn tail without noticing.","deep":"1. Wait for the controller to become ready, re-Identify (limits can differ after a format), then Report Zones for every zone in chunks (4.11).\n2. Classify each zone against the host's records:\n\n| Observed WP | Meaning | Action |\n|---|---|---|\n| Equals the last durable end | Clean | Resume at the WP |\n| Between durable end and submitted end | Some non-durable tail persisted, maybe torn | Verify tail by CRC, then continue or Finish |\n| Below the durable end | Acknowledged data lost | Device bug (3.15) |\n| Above the submitted end | Data the host never wrote | Device bug, or a second writer |\n\n3. **Zone state changes:** zones that were open are Closed now. The host must reopen them, and the active count equals the Closed zones (6.08).\n4. **No rewind:** a WP cannot be moved back to discard a torn tail. The host either treats the torn record as dead in its own metadata and continues after it, Finishes the zone, or copies out and Resets.\n5. **Symptom of a stale shadow:** the first write returns Zone Invalid Write, because SLBA is above the WP (data lost) or below it (data persisted that the host did not know about). Both directions look the same in the status.\n6. **Tail check:** the WP has no record boundaries, so a torn tail is found only from content, using a length and CRC in each record header.","pitfall":"Rebuilding host state from a checkpoint file without asking the device. The device is the only source of truth for the WP.","verify":"The durability and WP-rollback guarantees after unexpected power loss, and the initial zone states after each reset type, in the ZNS and NVM Command Set Specifications.","follow":[{"q":"Does the WP alone tell you whether the last record is complete?","a":"No. The WP can land inside a multi-block write, so only the record's own length and CRC show it (5.13)."},{"q":"What do you assert in a power-cut test?","a":"No acknowledged durable data is missing, every LBA below the WP reads back, and the WP lies between the durable end and the submitted end."}],"mod":7},{"id":"7.13","level":"Advanced","type":"Cross-layer","fig":null,"tags":["linux","zone-write-plugging","wp-update","eio","fault-injection"],"q":"What does the Linux zoned block layer do when a write to a zone fails, and how do you test that path?","short":"With zone write plugging (Linux 6.10 or later), a failed write makes the block layer abort the other writes queued for that zone. In Linux 6.13 and later it also flags the write pointer as unknown, and further writes then fail in the block layer, without reaching the device, until the user runs a zone report, resets the zone or finishes it. One device error can therefore become a burst of EIO with no matching NVMe commands.","deep":"In the source of Linux 6.13 and later (the flag is BLK_ZONE_WPLUG_NEED_WP_UPDATE), a comment says the user must run a report zones, reset or finish the zone to recover a reliable write pointer position, and that writes are failed if the user did not. Kernels 6.10 to 6.12 used a different error state (BLK_ZONE_WPLUG_ERROR) with an in-kernel recovery step, so behavior differs by kernel.\n\n1. A write completes with any error. The zone write plug aborts its queued BIOs and sets the flag that the write pointer needs an update.\n2. New writes to that zone are failed by the block layer. Nothing is sent to the SSD.\n3. A report zones on the zone (blkzone report, or the kernel's own report) refreshes the tracked write pointer from the device.\n4. Writes then proceed from the device's WP.\n\n- **Counting errors:** the first failure is a device status in the trace. The EIO burst that follows has no matching commands. Count device statuses from the NVMe trace or analyzer, and application errors separately.\n- **Append:** native Zone Append requests are not plugged (5.08), so this tracking applies to regular writes and to appends the block layer emulates.\n- **Test method:** inject one failing status on a write to a chosen zone (nvme fault injection through debugfs, or a QEMU model), run a sequential writer through the block layer, and check the sequence: one device error, then EIOs, then recovery after `blkzone report`. Finally read back and verify data.\n- **Assertions:** no data lands after the failed write, the zone's WP after the report equals the device's, and other zones are unaffected.","pitfall":"Counting the EIO burst as separate device failures, or blaming the SSD for errors that never reached it.","verify":"The recovery triggers on your kernel (the NEED_WP_UPDATE model appears in v6.13 and later, the ERROR model in v6.10 to v6.12, from the kernel source), and the nvme fault injection debugfs path and parameters.","follow":[{"q":"Why not just retry the write in the block layer?","a":"The write may have partly executed, and a retry needs the WP. The layer instead asks the device."},{"q":"Does passthrough hit the same tracking?","a":"No. Passthrough goes around the block layer, so it sees the device's raw statuses."}],"mod":7},{"id":"7.14","level":"Principal","type":"Scenario","fig":null,"tags":["timeout","unknown-outcome","recovery","write-pointer","controller-reset"],"q":"A Write to a zone times out at 30 seconds, the driver resets the controller, and the host has no completion. How do you recover the zone, and what must never be done?","short":"A timed-out command has an unknown outcome: it may have executed fully, partly or not at all. After the controller is back, stop new writers, run Report Zones on the zone to get the true WP, and compare it with the write's SLBA and length: at SLBA means not landed, at SLBA plus length means landed, between means torn. Never blind-retry an append. A retried Write is fenced by the SLBA check, but still resync first.","deep":"Setup: one Write in flight per zone (SLBA s, NLB n). The driver aborts, then resets the controller (Linux default I/O timeout is 30 s, nvme_core.io_timeout).\n1. **Freeze the zone:** no new submissions. Keep the host record of the in-flight write (s, n, data, sequence).\n2. **Wait for readiness:** the controller is ready again, Identify is re-read, and a previously open zone is expected to be Closed (6.08).\n3. **Read the truth:** Report Zones for the zone gives state and WP_true.\n4. **Classify:**\n\n| WP_true | Meaning | Action |\n|---|---|---|\n| s | The write did not land | Resubmit at s |\n| s + n | The write landed | Complete it as success and verify data |\n| between | Torn write (a prefix landed) | Write the missing blocks from WP_true |\n| Zone Read Only or Offline | The fault took the zone | Evacuate (7.06) |\n\n5. **Why Write is safer than Append:** resubmitting a Write that already landed fails with Zone Invalid Write, because the WP moved, so nothing is duplicated. A duplicate append succeeds twice (5.10).\n6. **Linux angle:** the failed write also leaves the block layer's write pointer flagged as unknown (7.13), so a report is needed there too.\n7. **Durability:** a landed write is durable only under the usual rules (FUA, or Flush, or a non-volatile cache).\n8. **Root cause separately:** capture the controller's logs and telemetry before further resets. A timeout is a symptom, and a Reset-all on full zones is one known cause (4.14).","pitfall":"Assuming the WP moved by the full length or not at all. A torn write can leave it partway.","verify":"Whether the WP can land inside one Write command after a reset and the atomicity that applies (AWUPF, NAWUPF), and the driver's handling of timed-out commands on your kernel.","follow":[{"q":"Is an Abort enough to know the command did not run?","a":"Only if the original completes with Command Abort Requested. If the Abort reports that the command was not aborted, it may have run."},{"q":"What if the host used Zone Append at queue depth 8?","a":"Reconcile the zone by content (5.10, 5.13), because the in-flight appends cannot be classified from one WP value."}],"mod":7},{"id":"7.15","level":"Principal","type":"Scenario","fig":null,"tags":["test-design","conformance","error-paths","side-effects","fault-injection"],"q":"Design a validation suite for the error paths of a ZNS SSD: statuses, side effects and recovery. What does it contain and how do you decide pass?","short":"Build a table of cells (command, zone state, address condition, length condition), each with an allowed status set and a required post-state, and run every cell through raw NVMe passthrough. After each cell check the CQE and diff a full Report Zones for side effects. Add multi-fault cells as allowed sets, media fault injection for Read Only and Offline, power loss during errors and a randomized soak. Pass means no side effects and no status outside its set.","deep":"1. **Axes:** commands (Write, Append, Read, Zone Management Send actions), zone states (7), address (at WP, below, above, in the gap, not a zone start, past the namespace) and length (fits, exact, one more, spans a zone). Three commands x 7 x 6 x 4 gives 504 cells before pruning.\n2. **Cell record:** allowed statuses (7.11), whether DNR is checked, post-state of the zone, WP, resource counts, and expected data.\n3. **Side effects:** after every cell, Report Zones for all zones and diff with the model. A failed write to zone A that moves zone B is a real bug class, and single-zone checks miss it.\n4. **Recovery after error:** after each cell, do a correct write at the WP. An error must not wedge the zone. After thousands of errors, run the resource probe from 6.16 to catch leaks.\n5. **Fault injection:** NAND program and erase failures must produce Read Only or Offline in the right zones only, with the statuses of 7.06, the event or sweep signal (7.08) and released resources.\n6. **Concurrency:** run error storms next to a healthy workload and check that the healthy commands keep their latency and never fail.\n7. **Resets and power loss:** cut power and reset in the middle of error handling, then apply 7.12.\n8. **Reference:** a model with QEMU's ZNS device as a cross-check for logic errors. Differences from hardware are questions about the spec, not verdicts.\n\nExit criteria: every cell run once with pass or a written waiver, zero side-effect diffs across a long soak, statuses agreeing with the vendor's datasheet, and each firmware build's characterization data (7.11) archived.","pitfall":"Checking only the failing command's status. The bugs that escape are the side effects on other zones and the states the zone gets stuck in.","verify":"The complete list of write-like commands and status lists per command in your ZNS revision, since the cell count depends on it.","follow":[{"q":"A status is outside the set. Who is right?","a":"Read the spec text. If it supports the device, add it to the set and record the ambiguity. Otherwise file a defect with the CQE, the report and the trace."},{"q":"Why use passthrough instead of the block layer?","a":"The block layer splits, rewrites and blocks commands, and it maps most statuses to EIO (7.03)."}],"mod":7},{"id":"7.16","level":"Principal","type":"Cross-layer","fig":null,"tags":["read-only","evacuation","capacity","die-failure","fleet","numeric"],"q":"A drive with zones mapped to 4-die groups loses one die, and a quarter of its zones go Read Only. How do you size and run the host response, and how do you validate it?","short":"Read Only zones stay readable, so the host copies their live data to healthy zones, and the capacity math decides whether that is possible. With 4,096 zones of 1 GiB at 80 percent full, 1,024 Read Only zones hold 819 GiB, but the 3,072 healthy zones have only 614 GiB free, a shortfall of 205 GiB that must go to other drives. Evacuation at 1.5 GB/s takes about 10 minutes. Validate with die-level fault injection.","deep":"Assumptions (illustrative): 16 dies, zones mapped to 4-die groups (4 groups), 4,096 zones of 1 GiB capacity (4 TiB), live data spread evenly at 80 percent, evacuation reads at 1.5 GB/s.\n1. Affected zones: 4,096 / 4 = 1,024 zones, which is 25 percent.\n2. Live data in them: 1,024 x 0.8 GiB = 819.2 GiB.\n3. Healthy zones: 3,072, holding 3,072 x 0.8 = 2,457.6 GiB, so free space is 614.4 GiB.\n4. Shortfall: 819.2 - 614.4 = 204.8 GiB cannot stay on this drive. It must come from replicas or be shed.\n5. Time: 819.2 GiB x 1.0737 GB/GiB / 1.5 GB/s = about 586 s, roughly 10 minutes, assuming reads succeed and writes are not the limit.\n6. Write limits: the evacuation writers use open and active zones, so they need a budget within MOR and MAR (6.12).\n\nHost procedure:\n- Detect (7.08) and freeze allocation to Read Only zones.\n- Evacuate in priority order: data with no other replica first.\n- Expect Unrecovered Read Error on the failed die's data, and rebuild it from redundancy.\n- Send Offline Zone after the data is safe, so the zone state is settled.\n- Recompute capacity and GC thresholds, and alert fleet management. Retire the drive when the loss exceeds a policy limit.\n\nValidation: inject a die failure (vendor tool or emulator), then check that only the mapped zones change state, the statuses follow 7.06, the change is reported (7.08), surviving zones keep their data and latency, and the host completes evacuation within its bound.","pitfall":"Planning evacuation against the drive's pre-failure capacity. The healthy space is 25 percent smaller.","verify":"How many zones a media fault takes out depends on the zone-to-die mapping, which is vendor specific and not in the spec.","follow":[{"q":"How do you know which zones a die maps to?","a":"The spec does not say. Use vendor logs or observe the failure set, and check that it is stable and plausible for the design."},{"q":"What if every zone stripes across all dies?","a":"One die failure touches every zone with data, so the whole drive is effectively lost."}],"mod":7},{"id":"7.17","level":"Principal","type":"Debug","fig":null,"tags":["debug","write-fault","invalid-write","cascade","fault-injection","attribution"],"q":"In a fault-injection run, one Write Fault is followed by a burst of Zone Invalid Write completions on the same zone. How do you tell whether the device or the host is at fault?","short":"Look for the first failure and treat the rest as a possible cascade. If the write pointer after the Write Fault is still at the failed SLBA, the later writes were submitted at addresses beyond it before the host saw the error, so Zone Invalid Write is correct and the host must fence errors. It is a device bug if the WP moved past data that was never written, or if a QD 1 replay with no pipelining still fails.","deep":"Trace (4 KiB LBAs, one zone, host keeps three writes in flight):\n```\n#   t(ms)  cmd    SLBA     NLB  status\n41  10.20  Write  0x30A00  64   0h/00h\n42  10.31  Write  0x30A40  64   2h/80h  Write Fault\n43  10.33  Write  0x30A80  64   1h/BCh  Zone Invalid Write\n44  10.34  Write  0x30AC0  64   1h/BCh  Zone Invalid Write\n    Report Zones after: state 20h (Implicitly Open), WP 0x30A40\n```\n1. **Find the first error:** #42 is the root. Submit times show #43 and #44 were sent before #42's completion.\n2. **Check the WP:** 0x30A40 is the SLBA of #42, so no data landed. #43 (0x30A80) and #44 (0x30AC0) are above the WP, so Zone Invalid Write is the right status. The device behaved consistently.\n3. **Host fault:** the writer pipelined Writes to one zone, and any error turns the rest of the pipeline into failures. It also relies on in-order execution the spec does not promise (5.03). The correct reaction to #42 is to drain, Report Zones, and resubmit from WP 0x30A40.\n4. **Device suspects, from the report:**\n\n| Report after the run | Reading |\n|---|---|\n| WP 0x30A40 | Consistent. Host cascade |\n| WP 0x30A80 | The WP passed unwritten data. LBAs 0x30A40 to 0x30A7F are a hole, so the device is wrong unless the spec allows it |\n| WP between 0x30A40 and 0x30A80 | Torn write. Check the atomicity rules |\n| Zone Read Only | A Write Fault may legitimately put the zone there. #43 and #44 then allow Zone Is Read Only or Zone Invalid Write (7.11) |\n\n5. **Prove it:** replay at QD 1 per zone. If the cascade disappears, the pipeline caused it. If a single write still fails at the correct WP, the device is wrong.\n6. **Counters:** cascade length equals the writes in flight at the failure minus one, here 2, so a longer burst points to more parallelism than the host believes.","pitfall":"Counting each Zone Invalid Write in the burst as an independent device defect. They share one cause, which is the first error.","verify":"Whether the WP may advance on a write that fails with Write Fault, and what a Write Fault does to the zone state, in the ZNS and NVM Command Set Specifications.","follow":[{"q":"The report shows the zone Read Only and #43 returned Zone Invalid Write. Is that a bug?","a":"Not by itself. The combination is a multi-fault case with an allowed set (7.11). Log it and check the vendor's stated order."},{"q":"How do you rewrite the lost data?","a":"From WP_true, using the host's copy. The failed write did not land, so the sequential rule is satisfied if the zone accepts writes."}],"mod":7},{"id":"8.01","level":"Basic","type":"Concept","fig":"zns_ftl","tags":["zone-mapping","superblock","stripe","erase-block","die","channel"],"q":"How does a ZNS controller map a zone onto NAND?","short":"A zone is backed by a set of erase blocks, commonly one block per plane on each of several dies spread over the channels (a superblock or stripe). Sequential writes are striped across those blocks so one zone uses many dies in parallel, and Reset Zone erases the whole set. Inside the zone the LBA offset maps to die, plane and page by arithmetic, so the FTL keeps a short block list per zone instead of a per-LBA table. The exact layout is vendor specific.","deep":"Example used through this module (all illustrative): 6 channels x 2 dies = 12 dies, 4 planes per die, 16 MiB blocks. One zone = one block per (die, plane) = 48 blocks = 768 MiB (worked in 8.04).\n- **Write path:** data lands in the write buffer, is cut into program units, and the units go round-robin over the dies and channels. Program time of one die is hidden by working on the others.\n- **Per-zone record:** state, write pointer, capacity, attribute bits and the list of 48 block addresses, roughly 200 bytes. The whole namespace needs kilobytes, not the gigabytes of a page-level L2P (see 1.06 and 8.05).\n- **Reset:** the block list goes back to the free pool and the blocks are erased (8.06). Because the zone is exactly a whole set of erase blocks, no live data shares a block with anything else, so there is nothing to garbage-collect.\n- **Why a stripe and not one block:** one die programs a TLC wordline in hundreds of microseconds, so a zone of one block would write at a fraction of drive bandwidth. Width buys per-zone throughput and costs zone size (8.04).\n- **Conventional contrast:** a conventional FTL mixes data of many lifetimes in one superblock, so blocks need GC before erase. Zone alignment moves that decision to the host.","pitfall":"Deriving die or channel placement from the LBA and building a test that depends on it. Nothing in the interface promises the mapping.","verify":"The mapping is not defined by the NVMe ZNS specification. Confirm the layout with the vendor if a test depends on it.","follow":[{"q":"Does every zone use the same set of dies?","a":"Usually the same die set with different block numbers, so any zone can reach full bandwidth. Some designs use narrower zones on subsets of dies to trade per-zone speed for isolation."},{"q":"Can the host see the layout?","a":"No. The host sees zone start, size, capacity and state only. The interleave can change between firmware versions."}],"mod":8},{"id":"8.02","level":"Basic","type":"Concept","fig":null,"tags":["zcap","zsze","geometry","reserve","capacity"],"q":"Why is Zone Capacity smaller than Zone Size, and what in the firmware decides the value?","short":"Zone Size is chosen for cheap host address math, so in practice it is a power of two. Zone Capacity is what the NAND geometry leaves after the firmware takes its share: good pages in the zone's block set minus parity, headers and metadata the design reserves. A stripe over 12 dies is not a power of two, so a gap is normal. The gap LBAs exist in the address map but cannot be written.","deep":"- **Inputs to ZCAP:** blocks per zone (dies x planes), usable pages per block after any reserved first or last pages, any cross-die parity, and per-stripe or per-zone metadata pages.\n- **Inputs to ZSZE:** the smallest convenient power of two that is at least ZCAP. Nothing physical is wasted, only address space.\n- **Uniform or variable:** a namespace either gives every zone the same capacity or sets the Variable Zone Capacity bit in ZOC (see 3.03). Uniform is far easier for hosts, and the Linux driver refuses a zoned namespace with any ZOC bit set (see 2.09).\n- **What it means to firmware:** ZCAP is a compatibility-critical parameter. File systems and databases store zone geometry in their own metadata, so a firmware change that alters ZCAP or ZSZE for an existing namespace can invalidate existing data.\n- **Capacity accounting:** usable space is the sum of ZCAP over non-offline zones. NSZE counts ZSZE per zone, so it overstates usable space (see 3.08).","pitfall":"Treating the gap as a defect. The defect would be a write accepted in the gap, or unequal ZCAP between zones with the VZC bit clear. Confirmed (ZNS 1.4, 3.4.3.1.5): with the Variable Zone Capacity bit set, the controller may change a zone's Zone Capacity field on a successful Reset Zone, signaled by the Zone Capacity Changed bit in the completion queue entry. A write starting inside the gap gets Zone Invalid Write, since the write pointer can never sit there (7.02).","verify":null,"follow":[{"q":"Can a firmware update change ZCAP?","a":"Treat it as a breaking change. Validation should compare Identify and Report Zones output before and after an update, with data present."},{"q":"Is ZCAP equal to ZSZE ever possible?","a":"Yes, when the geometry is a power of two with nothing reserved, for example 16 dies x 4 planes x 16 MiB = 1 GiB. It is the simplest case for hosts, but rare."}],"mod":8},{"id":"8.03","level":"Basic","type":"Concept","fig":null,"tags":["write-buffer","program-unit","flush","fua","plp","mor"],"q":"What does the write buffer do in a ZNS SSD, and when can the controller complete a write?","short":"Host data is DMAed into a controller write buffer, gathered into full NAND program units and programmed across the stripe. The controller may post the CQE once data is in the buffer if the buffer is power-protected, otherwise data is durable only after the program, a Flush or a write with FUA. Every open zone needs at least one program unit of buffer, so the open-zone limit sets the buffer size. In the example that is 2.25 MiB per open zone.","deep":"Assumptions: 16 KiB page, 4 planes, a TLC wordline of 3 pages programmed as one unit, 12 dies. Unit per die = 3 x 16 KiB x 4 = 192 KiB. Unit per stripe = 12 x 192 KiB = 2.25 MiB = 576 LBAs of 4 KiB.\n- **Small writes:** 128 KiB writes need 18 of them to fill one stripe unit, so 17 of every 18 are acknowledged from the buffer with no NAND program at that moment.\n- **Buffer size:** MOR x 2.25 MiB is the minimum, so MOR 8 gives 18 MiB, and double buffering gives 36 MiB. That is the reason the open limit is small (see 6.03).\n\n| Design | CQE posted when | Flush or FUA | Loss on power cut |\n|---|---|---|---|\n| Power-protected buffer | Data in protected buffer | Cheap, data already safe | None for completed writes |\n| Volatile buffer (VWC set) | Data in buffer | Must push data to NAND | Completed but unflushed writes |\n| Write-through | After NAND program | Already durable | None, higher latency |\n\n- **The partial-unit problem:** a Flush or FUA on a volatile design arrives when a unit is only partly filled. Arithmetic mapping (8.05) cannot leave a hole mid-zone, so the firmware needs another home for the fragment, such as a small SLC or journal area, or must wait for the unit to fill. This is design specific and a rich source of latency and correctness bugs.","pitfall":"Assuming a completion means the data is on NAND. Without power-loss protection it means only that the controller accepted it.","verify":"The volatile write cache field in Identify Controller and the Volatile Write Cache feature, and the optimal write size fields (NOWS and related) in the NVM Command Set Identify Namespace.","follow":[{"q":"What does the write pointer track?","a":"Accepted writes, not programmed ones. After power loss the durable point can be lower, which 8.14 covers."},{"q":"What write size is best?","a":"Multiples of the device's optimal write size when it reports one, and of the program unit otherwise. Smaller sequential writes still work through the buffer."}],"mod":8},{"id":"8.04","level":"Intermediate","type":"Numeric","fig":null,"tags":["zone-size","geometry","parallelism","capacity","numeric"],"q":"Derive zone size, capacity and zone count from a NAND geometry, and show how dies per zone trade zone size against write speed.","short":"With 12 dies, 4 planes and 16 MiB blocks, one stripe is 48 blocks = 768 MiB. Without parity that is ZCAP = 0x30000 LBAs of 4 KiB and, rounded up to a power of two, ZSZE = 0x40000 (1 GiB). With one die's worth of parity, ZCAP is 704 MiB = 0x2C000. Fewer dies per zone make smaller zones and slower single-zone writes.","deep":"Assumptions: 6 channels x 2 dies = 12 dies, 4 planes, 1,024 pages of 16 KiB per block (16 MiB), 1,100 block positions per plane of which 60 are reserved for spares and system data, 4 KiB LBAs, TLC program of 192 KiB per die in 0.8 ms.\n1. Stripe = 12 x 4 x 16 MiB = 768 MiB, which is 196,608 LBAs = 0x30000.\n2. ZSZE = next power of two = 1 GiB = 262,144 LBAs = 0x40000. The gap is 65,536 LBAs (256 MiB), 25 percent of the address space.\n3. Zones = 1,100 - 60 = 1,040. Raw NAND = 12 x 4 x 1,100 x 16 MiB = 825 GiB. Usable = 1,040 x 768 MiB = 780 GiB (94.5 percent of raw). NSZE = 1,040 x 0x40000 = 272,629,760 LBAs = 1,040 GiB, which is 260 GiB more than can be written.\n4. With 1 of 12 dies of parity: ZCAP = 11 x 4 x 16 = 704 MiB = 180,224 LBAs = 0x2C000, usable 715 GiB (86.7 percent of raw).\n\n| Dies per zone | Zone stripe | Peak zone write rate | Notes |\n|---|---|---|---|\n| 12 | 768 MiB | 2.95 GB/s | One zone saturates the drive, big reset unit |\n| 6 | 384 MiB | 1.47 GB/s | Needs 2 open zones to fill the drive |\n| 4 | 256 MiB | 0.98 GB/s | More zones, MOR must cover more writers |\n| 2 | 128 MiB | 0.49 GB/s | Fine grained, low per-zone speed |\n\nPeak rate = dies x 192 KiB / 0.8 ms (die-limited, six 1.2 GB/s channels would allow 7.2 GB/s).\n- **Consequence:** wider zones favor a few big sequential writers and make Reset and Finish expensive. Narrow zones favor many writers and need a larger MOR and more buffer.","pitfall":"Reporting usable capacity from NSZE. Sum ZCAP instead, and expect a smaller number.","verify":"Nothing here is spec-defined geometry. Real NAND page sizes, plane counts, program times and reserved fractions come from the vendor datasheet.","follow":[{"q":"Why not size the zone to 768 MiB exactly?","a":"Confirmed: the ZSZE field definition (ZNS 1.4, Figure 50) only requires it be non-zero, with no power-of-two requirement in the spec text. A non-power-of-two zone size breaks shift-based host math and the Linux driver rejects it (see 2.11), which is a driver constraint, not a spec one."},{"q":"What changes if the drive has 16 dies?","a":"The stripe becomes 1 GiB, a power of two, and ZCAP can equal ZSZE if nothing is reserved."}],"mod":8},{"id":"8.05","level":"Intermediate","type":"Numeric","fig":null,"tags":["l2p","mapping","arithmetic","block-list","read-path"],"q":"How does a read find its NAND page without an L2P table, and what indirection remains?","short":"The zone start gives a short block list, and the offset inside the zone gives the row, die and plane by division. With 768 KiB rows (12 dies x 64 KiB), LBA offset 100,000 is byte 409,600,000, row 520, die 10, plane 0. The block list supplies the block, the row is the page index, so the read needs one small in-RAM lookup and no map read from NAND. What remains is the block list per zone, which lets firmware swap a bad or worn block without changing any LBA.","deep":"Assumptions: interleave of one 16 KiB page per plane, 4 planes per die (64 KiB), 12 dies, so one row = 768 KiB = 786,432 B, and a block holds 1,024 pages so a zone has 1,024 rows. No parity pages.\n1. Zone number = LBA / ZSZE, a shift for a power of two. Offset = LBA - ZSLBA.\n2. Byte offset = 100,000 x 4,096 = 409,600,000. Row = 409,600,000 / 786,432 = 520 remainder 655,360.\n3. Die = 655,360 / 65,536 = 10, remainder 0, so plane 0, byte 0 of the page.\n4. NAND target = block_list[zone][die 10][plane 0], page index 520. In a TLC block, page 520 is the second page type of wordline 173 if pages are ordered 3 per wordline (NAND specific).\n5. Second check: offset 5,000 gives byte 20,480,000, row 26, remainder 32,768, so die 0, plane 2.\n\nTable size: 1,040 zones x 48 blocks x 4 B = 195 KiB. A page-level table for the same 780 GiB at 4 KiB units would be 780 MiB, four thousand times larger.\n- **Above the write pointer:** the zone metadata already says the LBA was never written, so the controller can answer without a NAND read (the returned data follows the namespace's rule for unwritten blocks, see 3.11).\n- **What breaks the arithmetic:** padding holes in the middle of a zone, parity rotation, mixed SLC and TLC blocks in one zone, and any per-page relocation. Designs therefore relocate whole blocks and keep the block list mutable.\n- **Effect on reads:** no map lookup miss, so read latency is flat, which is a large part of the ZNS latency benefit (compare the DRAM-less discussion in NVMe page module 17).","pitfall":"Concluding a ZNS SSD needs no metadata reads at all. Zone state and block lists must be resident and correct, and a corrupt entry misroutes a whole slot.","verify":"Interleave, page order and row size are vendor choices. Treat the numbers as an illustration of the method.","follow":[{"q":"Where does the block list live?","a":"In RAM, backed by a NAND journal and checkpoint (8.09). At about 200 bytes per zone it is cheap to persist."},{"q":"What if a block fails in the middle of a Full zone?","a":"Firmware copies the block's pages to a spare and edits one block-list entry. LBAs and rows do not change (8.10)."}],"mod":8},{"id":"8.06","level":"Intermediate","type":"Concept","fig":null,"tags":["reset","erase","deferred-erase","free-pool","erase-count"],"q":"What does the firmware do during Reset Zone, and what design choices decide its latency?","short":"The controller validates the state, records the zone as Empty in its metadata, returns the zone's blocks to a free pool, and erases them. Completion can wait for the erase (latency grows with the blocks per die) or be posted first with the erase deferred, which moves the cost to later writes. Either way the erase count of each block rises, and an erase failure retires the block. Details differ by vendor.","deep":"1. **Validate:** state must allow Reset (Open, Closed, Full). Empty is a successful no-op, Read Only and Offline fail (see 4.05).\n2. **Journal:** record zone -> Empty (and clear the write pointer and any Zone Descriptor Extension) before any erase, so that recovery has a definite answer.\n3. **Release:** the block list goes back to the free pool. Whether the same blocks or others serve the next open is the wear policy (8.12).\n4. **Erase:** issue block erases on every die in parallel. Increment erase counts and check erase status. Failure retires the block and takes a spare (8.10).\n5. **Complete:** post the CQE.\n\n| Design | Completion | Hidden cost |\n|---|---|---|\n| Synchronous erase | After all erases finish | Long command, timeouts on Reset-all (see 4.14) |\n| Deferred erase | Right after metadata update | Blocks are dirty. A write that finds no erased block stalls |\n| Hybrid | Deferred up to a backlog limit | Stall once the backlog limit is hit |\n\n- **Ordering rule:** a block must be erased and verified before its first program. A deferred design must track dirty blocks across power loss, so recovery re-erases anything whose erase may not have finished.\n- **Data remains:** until erase, old data physically remains. Reads of an Empty zone are answered from metadata as unwritten, so it is invisible to the host but matters for secure erase and sanitize requirements.","pitfall":"Reading a fast Reset completion as a cheap Reset. In a deferred design the erase debt is paid by the next writer or reader.","verify":"Which states Reset accepts and the metadata cleared by Reset (write pointer, descriptor extension, attribute bits) in the ZNS Command Set Specification.","follow":[{"q":"How can a validator tell the designs apart?","a":"Reset latency versus fill level: flat and microseconds means deferred, growing with fill means synchronous. Then run writes right after a reset storm and watch for stalls."},{"q":"Does Reset of a half-filled zone erase the whole stripe?","a":"Design specific. Many erase only blocks that were programmed, so latency and erase wear track fill level."}],"mod":8},{"id":"8.07","level":"Intermediate","type":"Concept","fig":null,"tags":["finish","padding","partial-program","waf","open-block"],"q":"What does the firmware do at Finish Zone with a partly programmed stripe, and what does padding cost?","short":"Finish makes the zone Full without host data for the remainder. The firmware must persist what is buffered, which usually means padding the partly filled program unit with dummy data so the last wordline is completed. The unwritten rest of the zone is normally left unprogrammed. Cost is one program unit at minimum. A design that pads to the end instead spends time and NAND writes proportional to the remaining space.","deep":"Assumptions from 8.03 and 8.04: program unit per stripe 2.25 MiB, zone stripe 768 MiB, peak write rate 2.95 GB/s, tPROG 0.8 ms.\n1. **Minimal padding:** program the buffered fragment plus pad, at most one unit. Latency is about one tPROG (0.8 ms) plus queueing. NAND written is up to 2.25 MiB.\n2. **Pad-to-end:** if the design programs every remaining page to close its blocks, an almost empty zone needs 768 MiB / 2.95 GB/s = 0.27 s and 768 MiB of NAND writes.\n3. **WAF of small zones:** a host that writes 100 KiB and then Finishes causes about 2.25 MiB of NAND writes, a device write amplification of 2.25 MiB / 100 KiB = 23 for that zone. The host counters show 100 KiB, the media counters show 2.25 MiB.\n4. **Open blocks:** many NAND parts limit how long a block may stay partly programmed, because unprogrammed pages in a written block are sensitive to read disturb and retention effects. That is one reason a controller might finish a zone itself (Zone Finished by Controller) or set Finish Zone Recommended (see 6.10). Confirm limits in the NAND datasheet.\n- **Gap reads:** LBAs between the last write and ZCAP were never host-written. The mapping says unwritten, so the read returns the namespace's unwritten-block data without NAND access (4.04).\n- **Mid-zone padding is different:** padding at Finish is harmless because no later data needs that space. Padding in the middle of an open zone would create a hole in the arithmetic mapping (8.05).","pitfall":"Assuming Finish is metadata only. It can trigger a program, and a frequent Finish of small zones shows up as media writes far above host writes.","verify":"Whether your drive pads the unit, pads to end, or uses a separate area. The Finish, padding and gap-read behavior are vendor and DLFEAT dependent.","follow":[{"q":"Does Finish change ZCAP?","a":"No. The zone is Full and its capacity is unchanged, and the write pointer is no longer meaningful."},{"q":"Does Finish on an Empty zone program anything?","a":"It should not need to. A design may not even allocate blocks, which is a lazy-allocation choice worth probing."}],"mod":8},{"id":"8.08","level":"Intermediate","type":"Trap","fig":null,"tags":["background","refresh","scan","latency","assumptions","soak"],"q":"A test plan asserts that a ZNS SSD has no garbage collection, so p99.99 latency must stay within 2x the median through a long soak. Is the assertion sound?","short":"No. The large GC-driven tail is gone, but firmware still does background work: deferred erase, retention and read-disturb scans and refresh, static wear leveling, bad-block relocation, SLC fold if the design has it, journal and checkpoint writes, and thermal management. Each can put a periodic spike into the far tail. The plan should expect a much tighter, more predictable tail, then characterize what remains.","deep":"| Source | Trigger | Signature |\n|---|---|---|\n| Deferred erase backlog | Resets by host | Write stall after a reset burst |\n| Background scan and refresh | Timer, or read counts | Periodic read slowdown, worse on old data |\n| Static wear leveling | Erase-count spread | Occasional extra NAND activity |\n| Bad block replacement | Program or erase failure | Rare multi-ms outlier |\n| SLC fold | Cache fill level | Throughput step, not a spike |\n| Journal or checkpoint | Bytes written | Fixed-bytes period |\n| Thermal control | Temperature | Rate step near a threshold |\n\n- **Better test:** set per-workload targets from measured baselines: p99.99 write latency at each of QD1, QD32, and a mixed read/write load, with resets running in the background, and with the drive idle between rounds.\n- **Fingerprint the spikes:** a fixed byte interval points at journal or superblock events, a fixed time interval at timers (method in NVMe page module 17, latency spike question).\n- **Include idle:** background scan and refresh run best when the host is quiet, so measure the first I/Os after idle and monitor power draw in idle.\n- **Do not lose the win:** a ZNS drive should show a tail well below a conventional drive at the same fill. Compare, do not assert flat.","pitfall":"Using a pass criterion taken from the marketing claim of no GC. Measure the tail, then set thresholds with the firmware team.","verify":null,"follow":[{"q":"Which of these does the host see in standard logs?","a":"Almost none. Thermal state and Percentage Used appear in SMART. The rest is in vendor telemetry."},{"q":"What if spikes vanish when Reset is not issued?","a":"Then deferred erase or its interference is the cause, and the test needs a Reset-rate knob (see 8.15)."}],"mod":8},{"id":"8.09","level":"Advanced","type":"Concept","fig":null,"tags":["metadata","journal","checkpoint","state-machine","recovery","zde"],"q":"What per-zone state does the firmware keep, how is it persisted, and how is it rebuilt after power loss?","short":"Per zone the firmware keeps the state, write pointer, capacity, attribute bits, descriptor extension, block list, wear counters and open timestamps. State changes and block-list edits go into a journal in NAND, with periodic checkpoints of the table. The write pointer is usually not journaled per write: after an unsafe shutdown it is rebuilt by scanning the tail of each zone that was open or closed, using per-page metadata written with the data.","deep":"- **Table per zone (example, about 200 B):** ZSLBA is implicit, plus state, WP, ZCAP, attributes (ZFC, FZR, RZR), ZDE pointer, 48 block addresses, per-block erase and read counters, open timestamp for time limits, internal transient flags.\n- **Internal states beyond the seven:** firmware needs transient states such as Resetting, Finishing and Erase-pending. A command that arrives while a zone is in one must produce a defined outcome (queue behind it, or see the pre or post state), and races are a classic bug class.\n- **Journal:** zone state transitions, block allocation, block replacement, and erase intent (8.06). Small, so journal pages are cheap.\n- **Per-page metadata:** zone number and a sequence or offset stored with the data (spare area or stripe header). Recovery finds the end of the valid prefix from it.\n- **Recovery order:** load the newest checkpoint, replay the journal, scan the tails of zones that were open or closed to rebuild each WP, re-check dirty and erase-pending blocks, rebuild free pools and counters, then set ready.\n- **Cost:** the scan grows with the number of active zones (bounded by MAR), which is one more reason for a small active limit. With MAR 14 the firmware scans at most 14 zone tails.\n- **Descriptor extension:** persisted per zone as well (see 6.09). Whether it must survive power loss is a spec point to check.","pitfall":"Treating the WP as a stored variable. It is derived at recovery from NAND, so its post-crash value is a consequence of the scan rules, and those rules need tests.","verify":"Zone state after a controller reset or power cycle, and what the specification requires to persist (WP, descriptor extension) in the ZNS Command Set Specification.","follow":[{"q":"What state do Open zones come back in after a power cycle?","a":"Closed, or Empty if nothing was written, since open resources do not survive a reset (see 3.09). Full, Read Only and Offline zones keep their state."},{"q":"Where does the journal live?","a":"In system blocks, often in an SLC-mode area, sized to bound recovery. Layout is vendor specific."}],"mod":8},{"id":"8.10","level":"Advanced","type":"Concept","fig":null,"tags":["bad-block","spare","offline","read-only","zcap","program-fail"],"q":"How does the firmware handle factory and grown bad blocks in a zoned namespace, and when does a zone lose capacity, go Read Only or go Offline?","short":"Zones are built from good blocks, one per (die, plane) slot, so factory bad blocks only shrink the spare pool. A grown failure (program fail, erase fail, unrecoverable read) is handled by retiring the block and putting a spare from the same slot pool into the zone's block list, copying data already programmed there. Only when no spare exists does the zone lose capacity (if the design allows variable capacity), go Read Only to keep data readable, or go Offline.","deep":"| Event | Firmware action | Host-visible result |\n|---|---|---|\n| Factory bad block | Never enters the pool, spares reduced | None |\n| Erase fail at Reset | Retire block, take spare for that slot | Small extra latency, spare count falls |\n| Program fail in an open zone | Retire block, copy earlier pages to a spare, re-program the unit from the buffer | Latency outlier, possibly none else |\n| Program fail, no spare in that slot pool | Cannot complete unit | Write fails, zone Read Only or Offline |\n| Unrecoverable read in a Full zone | Data loss for that block | Media error on reads, zone may go Read Only |\n| Spare pools exhausted at Reset or open | Zone cannot be built | Zone Offline, or shorter ZCAP with VZC |\n\n- **Per-slot pools:** multi-plane operations want blocks in each plane, so a spare normally must come from the same die and plane. The drive fails locally: the first (die, plane) pool to run out decides when zones start to go Offline, whatever the average is.\n- **Read Only versus Offline:** Read Only keeps data readable (the host can copy out and then take the zone Offline), while Offline means the data is not accessible. A firmware that picks Offline when data could still be read is losing information for the host.\n- **Data already completed:** with a write-back buffer, a program failure can put previously completed writes at risk. The firmware must keep buffered data until the program is verified, and power-loss protection must cover the retry (8.14).\n- **Host signals:** a Zone Descriptor Changed event and Changed Zone List (see 6.11), plus Available Spare in SMART. Namespace-wide Critical Warning bit 3 is a different, coarser condition (see 3.16).\n- **Capacity impact:** each Offline zone removes ZCAP bytes from usable capacity. Host software must budget for it.","pitfall":"Modeling bad blocks as one percentage of the whole drive. The limit is the worst slot pool.","verify":"Which status a command that triggers a Read Only transition returns, the WP value in a Read Only zone, and the descriptor changed mechanics in the NVMe Base and ZNS specifications.","follow":[{"q":"Why keep spares per (die, plane) and not one global pool?","a":"Because a spare from another plane usually cannot join a multi-plane program, so pool exhaustion is local. Some NAND allows more freedom."},{"q":"Can a zone shrink instead of going Offline?","a":"Only where the drive sets the Variable Zone Capacity bit. Many host stacks, including the Linux driver, do not accept that, so many designs avoid it."}],"mod":8},{"id":"8.11","level":"Advanced","type":"Debug","fig":null,"tags":["program-fail","write-fault","read-only","trace","spare","telemetry"],"q":"Two zones show anomalies during a sequential write test, one with an isolated 4 ms write and no error, one with a Write Fault and then a Read Only zone. Explain both from the firmware side and say what to collect.","short":"Zone 12 behaves like a recovered event: a write that took about five times longer than its neighbours but completed with success, consistent with a program retry or block replacement absorbed by firmware, or with die contention. Zone 40 behaves like an unrecoverable one: Write Fault (0x280), then Zone Is Read Only (0x1BA), and state byte 0xD0. Confirm with vendor telemetry on grown bad blocks and spares per die and plane.","deep":"```\n# 4 KiB LBAs, ZSZE 0x40000, ZCAP 0x30000, 128 KiB sequential writes (nlb 32), QD1\nzone 12 (ZSLBA 0x300000)\nt=41.2031  W slba=0x30a1e0 nlb=32  lat=  812 us  status=0x0000\nt=41.2039  W slba=0x30a200 nlb=32  lat=4310 us  status=0x0000   <- outlier\nt=41.2083  W slba=0x30a220 nlb=32  lat=  809 us  status=0x0000\nzone 40 (ZSLBA 0xA00000)\nt=97.5510  W slba=0xa2c000 nlb=32  lat=  805 us  status=0x0000\nt=97.5518  W slba=0xa2c020 nlb=32  lat=3950 us  status=0x0280   <- Write Fault\nt=97.5559  W slba=0xa2c020 nlb=32  lat=  40 us  status=0x01BA   <- retry: Zone Is Read Only\nreport zone 40: ZS byte 0xD0 (Read Only), WP 0xa2c020\n```\n1. **Decode:** status 0x280 is SCT 2, SC 0x80 (Write Fault, media). 0x1BA is SCT 1, SC 0xBA (Zone Is Read Only). The state is the high nibble of the state byte, so 0xD0 is Read Only. Zone 12 offset 0xA200 LBAs = 162 MiB = row 216 of 1,024, zone 40 offset 0x2C020 is about 64 MiB before the end of its capacity.\n2. **Zone 12 candidates:** program retry with a spare block, background block replacement, or a die busy with an erase from a Reset in another stream (10 ms erase gives 0 to 10 ms of waiting). Discriminate: log Resets from all streams, and check whether the outlier repeats at the same offset (failures do not, contention correlates with resets).\n3. **Zone 40 candidates:** legitimate end of the spare pool in one (die, plane) slot, or a firmware bug that gives up while spares exist. Read telemetry: spares per slot at that moment.\n4. **Data check:** read back everything below the reported WP. With write-back buffering, completed writes just before the fault can be lost (the firmware must not report a WP past data it cannot read).\n5. **Host signals:** the command's DNR bit, Changed Zone List and Zone Descriptor Changed event, Error Information log, SMART Available Spare.\nVerdict rule: zone 12 passes if data reads back and grown-bad-block counters rise by exactly one. Zone 40 passes only if the fault was injected, or telemetry shows the slot pool at zero. A Write Fault with spares available is a firmware bug.","pitfall":"Blindly retrying a Write Fault to the same zone. It can be followed by a zone state change, so run Report Zones before deciding.","verify":"SCT and SC values for Write Fault and the zone status codes, which status triggers the Read Only transition, and the WP value reported for a Read Only zone.","follow":[{"q":"Can the host reset or finish zone 40?","a":"No. Both fail in Read Only. The host copies out the data, then either leaves the zone or uses the Offline action (see 4.05)."},{"q":"Why does the retry complete in 40 us?","a":"The controller rejects it from zone metadata with no NAND work. It shows Read Only is a lasting zone state and not a transient error."}],"mod":8},{"id":"8.12","level":"Advanced","type":"Scenario","fig":null,"tags":["wear-leveling","static","dynamic","erase-count","host-placement","metadata-zone"],"q":"The host decides which zones are rewritten. How does the controller keep wear even, and what happens if a host resets one metadata zone every 60 seconds?","short":"The host controls when zones are reset and refilled, so wear is driven by host behavior. The controller levels by choosing lowest-wear blocks from the free pool each time a zone is opened (dynamic leveling), and by relocating cold, rarely reset zones so their low-wear blocks re-enter circulation (static leveling). With a fixed zone-to-block mapping, a zone reset every 60 s would wear out in about 50 hours at 3,000 cycles.","deep":"Assumptions: 3,000 P/E cycles rated, 1,040 zones, 1,100 block positions per plane so a spare pool of 60 stripes, one hot zone reset every 60 s, all other zones Full and cold.\n1. **Fixed mapping (zone always uses the same blocks):** 3,000 cycles x 60 s = 180,000 s = 50 hours. Failure comes in two days.\n2. **Dynamic leveling over the free pool only:** hot zone rotates through the 60 spare stripes plus its own, 61 stripes (assuming the whole reserve joins the rotation): 3,000 x 61 x 60 s = 127 days. Cold zones pin the other 1,039 stripes.\n3. **With static leveling (all stripes take part):** 3,000 x 1,100 x 60 s = 6.3 years. The controller must copy cold zones' data into more worn blocks so the young blocks join the pool.\n4. **Cost of static leveling:** each moved zone is a background copy of up to 768 MiB, done in block units, with power-loss safety and no LBA change. That is device-side write amplification the ZNS design otherwise avoids, so it is triggered by erase-count spread, not by time.\n- **Host contribution:** a zoned host should rotate hot roles through many zones (metadata, journal) instead of one. Wear awareness at the host layer is often worth more than firmware leveling.\n- **Metrics:** min, mean and max erase counts (vendor telemetry), spread over time, and the number of static relocations. A widening max-min spread under a hot/cold workload signals a bug.\n- **Test:** drive a skewed reset workload (one hot zone, many cold) at high speed, log the spread, and confirm that it stays within the design bound and that Percentage Used does not run ahead of average wear.","pitfall":"Trusting that placement is the host's responsibility, so the controller does no leveling. The controller still owns block-level wear.","verify":"Endurance ratings (3,000 cycles here is illustrative) and any vendor telemetry field that reports erase-count spread.","follow":[{"q":"Why not level only on reset?","a":"Cold Full zones never reset, so their blocks stay young. Dynamic leveling cannot touch them."},{"q":"Does static leveling change the host's view?","a":"No LBAs move. Only the block list changes, and the copy may add latency or use media writes, visible in counters."}],"mod":8},{"id":"8.13","level":"Advanced","type":"Cross-layer","fig":null,"tags":["retention","read-disturb","scan","refresh","full-zone","open-block"],"q":"How do retention, read disturb and background scanning work at zone level, and how is a Full zone refreshed without the host?","short":"Data in Full zones sits for months, so retention loss and read disturb accumulate without any host writes. The firmware keeps read counters and error statistics per block, scans pages in the background, and when a block's margin drops it copies the block to a fresh one and edits the zone's block-list entry, leaving LBAs and rows unchanged. If the block cannot be recovered, the drive can set Reset or Finish Recommended, or the zone can go Read Only.","deep":"- **Retention:** charge leaks with time, temperature and wear. The oldest zones, and zones in high-wear blocks, are at risk first. Scan cost is a read per sampled page plus ECC.\n- **Read disturb:** reads stress neighboring wordlines. A hot read zone (an index or a read cache zone) concentrates reads on the same blocks, so counters are per block, and relocation triggers at a threshold set from the NAND spec.\n- **Refresh:** read the block with ECC, program the corrected data into a spare from the same slot pool (see 8.10), swap the entry, erase the old block. It is a copy, so it counts against media writes and endurance, and it competes with foreground I/O (8.08).\n- **Open and Closed zones:** a partly programmed block has unprogrammed pages that are sensitive. Firmware may limit how long a zone can stay in this state, and it may ask the host to finish the zone (Finish Zone Recommended), or on devices with Zone Active Excursions finish it itself (Zone Finished by Controller, see 6.10).\n- **Host visibility:** the Reset Zone Recommended attribute is a hint that the data in a Full zone is aging and should be rewritten by the host while it is still healthy. A validator should confirm the attribute does not appear without cause.\n- **Failure:** an unrecoverable read returns a media error status, and the firmware may mark the zone Read Only.\n- **Validation:** fill zones, bake at elevated temperature (an accelerated retention model), read back and compare, and separately hammer reads on one zone and watch latency, ECC counters and refresh activity. Check that LBA content is unchanged after refresh and that no ZDC event fires for an invisible block swap.","pitfall":"Assuming zoned data needs no refresh because it is never overwritten. It is more exposed to retention, since a Full zone can sit untouched for years.","verify":"The definition and trigger of Reset Zone Recommended and Finish Zone Recommended, and any time limits, in the ZNS Identify Namespace. Read-disturb thresholds come from the NAND vendor.","follow":[{"q":"Does refresh cost the host anything?","a":"Extra media writes and read latency during the copy. It should not change zone state or LBAs. Media Units Written rises without host writes."},{"q":"Why are cold zones the risk?","a":"Retention degrades with time since program. Hot zones are rewritten, so they refresh themselves through host Reset."}],"mod":8},{"id":"8.14","level":"Principal","type":"Cross-layer","fig":null,"tags":["power-loss","write-pointer","plp","multi-pass","recovery","fault-injection"],"q":"How should a ZNS firmware treat the write pointer and buffered data across power loss, and how do you test that design?","short":"A completed write is durable only if the drive says so: with power-loss protection or no volatile write cache it must survive, otherwise only Flush and FUA data must. After recovery the WP must sit between the durable end and the accepted end, at the end of a hole-free valid prefix. The design needs a dump area for the partial unit, care with multi-pass TLC, and re-erase of interrupted resets. Test it with deterministic cut points, not random ones.","deep":"1. **What can be promised:** the WP after recovery should satisfy durable_end <= WP <= accepted_end, and every LBA below it must read back the written data. Anything above it is unwritten. Open zones come back Closed, or Empty if nothing was written (see 3.09).\n2. **Buffered fragment:** with power-loss protection the capacitors program the partial unit somewhere else (a dump area, often SLC-mode). On
