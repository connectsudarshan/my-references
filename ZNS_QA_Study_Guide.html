boot the firmware reloads it into the buffer and the zone continues. Padding it inside the zone would leave a hole (8.05). Without protection the fragment is lost and the WP falls back to the last complete unit, which is allowed only for writes not flushed while the volatile write cache is on.\n3. **Multi-pass programming and torn units:** on some NAND, losing power while programming an upper page can damage lower pages of the same wordline, which held data that had already completed. Firmware must keep the earlier pass data in a protected buffer or an SLC copy until the final pass ends, or size the capacitors to finish the pass. A unit half programmed across dies is detected by per-page metadata or ECC and treated as not written. NAND specific, verify with the vendor.\n4. **Metadata operations:** Reset (erase intent journaled, half-erased block re-erased), Finish (padding), block replacement (copy interrupted), state transitions.\n5. **Cut points:** derive them from the firmware state machine, not time. Examples: last page of a unit on one die, between dies of one unit, during the dump, during a journal write, mid erase, mid replacement copy, during recovery itself, and during the recovery of a recovery.\n6. **Why deterministic:** to catch a window of width w within a cycle T at random, p = w/T and the cuts needed for 99 percent confidence are ln(0.01)/ln(1-p). A 100 us window in a 1 ms cycle needs 44 cuts, but 5 us in 10 ms needs about 9,200. Use firmware debug hooks or a trace-triggered power switch for narrow windows.\n7. **Oracle:** per zone record submitted, completed and durable ends before the cut. After boot check the bound above, read back everything below WP, check other zones are untouched, and time to ready against CAP.TO.","pitfall":"Checking only that the drive comes back. Verify content below the WP, not just its value, and repeat with cuts inside recovery.","verify":"The WP and data durability rules after unexpected power loss, and Zone state after a power cycle, in the NVMe Base and ZNS Command Set Specifications. Multi-pass behavior is NAND and vendor specific.","follow":[{"q":"What does Report Zones after a cut show for a zone that was Open?","a":"Closed with the recovered WP, or Empty if nothing survived, per the rules in 3.09 and 3.15."},{"q":"What is a good sign that the design is sound?","a":"Repeated cuts during recovery still converge to the same state, and the recovered WP never exceeds accepted_end or drops below durable_end."}],"mod":8},{"id":"8.15","level":"Principal","type":"Numeric","fig":null,"tags":["reset","erase","tail-latency","quantify","erase-suspend","pacing"],"q":"Quantify how zone resets from a host that writes 2 GB/s affect read tail latency and write throughput, and what would you do about it?","short":"With 768 MiB zones and 2 GB/s, the host resets 2.5 zones per second. Each reset ties up all 12 dies for a 10 ms multi-plane erase, so each die is erasing 2.5 percent of the time. Throughput loss is small. But 2.5 percent of reads land on a busy die, so p99 read latency rises by about 6 ms and p99.9 by about 9.6 ms unless erase suspend or pacing exists.","deep":"Assumptions: zone capacity 768 MiB, 12 dies, a multi-plane erase of 4 blocks takes 10 ms per die, all dies erase together, program per die 192 KiB in 0.8 ms, reads uniform over time and dies, no erase suspend.\n1. **Reset rate:** 2e9 B/s / 805,306,368 B = 2.48 zones/s.\n2. **Erase duty:** 2.48 x 10 ms = 24.8 ms per second, so each die is 2.48 percent erase-busy. Total erase die-time is 2.48 x 12 x 10 ms = 0.30 die-seconds per second.\n3. **Write side:** program die-time = 2e9 / 192 KiB x 0.8 ms = 8.14 die-seconds per second of 12 available, so 68 percent utilization. Erase adds 2.5 percent utilization. Throughput barely moves.\n4. **Read side:** a read hitting an erase waits uniformly 0 to 10 ms. P(wait > w) = 0.0248 x (1 - w/10 ms). For p99 set it to 0.01: w = 10 x (1 - 0.01/0.0248) = 5.97 ms. For p99.9: 9.6 ms. Compared with an 80 us read, p99 rises about 75 times.\n5. **Sensitivity:** at 1 GB/s the erase duty is 1.24 percent and p99 wait is 1.95 ms. At 3 GB/s duty is 3.7 percent and p99 wait 7.3 ms. Bursts of resets are worse than the average.\n\n| Write rate | Resets/s | Erase duty | p99 read wait | p99.9 read wait |\n|---|---|---|---|---|\n| 1 GB/s | 1.24 | 1.2 % | 1.95 ms | 9.2 ms |\n| 2 GB/s | 2.48 | 2.5 % | 6.0 ms | 9.6 ms |\n| 3 GB/s | 3.73 | 3.7 % | 7.3 ms | 9.7 ms |\n\n- **Mitigation, firmware:** erase suspend (a read interrupts the erase, cost tens to hundreds of microseconds), staggering die erases so not all 12 are busy at once, and pacing background erase.\n- **Mitigation, host:** spread resets over time, avoid reset bursts, and reset zones ahead of need.\n- **Validation:** per-I/O latency log for reads (QD1 reads over a hot region while a second stream resets zones at a set rate), compare the tail with resets off, and check that the tail scales with reset rate as the model says.","pitfall":"Watching throughput only. Erase cost is 2.5 percent of die time, so throughput hides it, and the damage is in the tail.","verify":"Erase time, suspend latency and suspend limits come from the NAND datasheet and firmware. The 10 ms figure is an assumption.","follow":[{"q":"How would you prove the read outliers come from erases?","a":"Timestamp every Reset command and every read over 1 ms. If slow reads cluster in the erase window (between Reset submission and completion for a synchronous design, shortly after completion for a deferred one), erase blocking is confirmed."},{"q":"What if suspend is present but the tail persists?","a":"Check suspend limits: a NAND may allow only a few suspends per erase, or resume with a delay. Compare p99.9 against the model."}],"mod":8},{"id":"8.16","level":"Principal","type":"Concept","fig":null,"tags":["slc","slc-cache","fold","vzc","endurance","dump-area"],"q":"You must decide how a ZNS SSD uses SLC-mode blocks. What are the options, what do they cost, and what do you have to validate?","short":"Three options: no SLC (zones program straight to TLC or QLC), an SLC buffer in front of zones with later fold, or dedicated SLC zones with a smaller capacity. A buffer absorbs bursts and small flushes, but every cached byte is written twice, hurting endurance and adding fold work. Dedicated SLC zones need a different ZCAP, which the interface allows only as Variable Zone Capacity or a separate namespace. Most designs use SLC at least for a dump and journal area.","deep":"| Option | Gains | Costs |\n|---|---|---|\n| No SLC cache | Simple, WAF near 1, uniform zones | Larger program units and buffers, hard Flush and FUA on small writes, no burst absorption |\n| SLC buffer plus fold | Fast bursts, cheap partial-unit flush | Cached data written twice (SLC then TLC), fold bandwidth, rate cliffs, power-loss complexity |\n| Dedicated SLC zones | Low latency, high endurance zone class | ZCAP is one third of the TLC stripe, needs VZC or a separate namespace |\n| SLC for journal and dump only | Cheap durability and recovery | Small capacity that also wears |\n\n- **Capacity:** a 768 MiB TLC stripe in SLC mode holds 768 / 3 = 256 MiB. That has to appear as a different ZCAP, so a mixed namespace needs VZC and the host must cope with it (see 8.02).\n- **Fold arithmetic:** a 20 GiB SLC buffer, a 3 GB/s host and a 1.2 GB/s fold: without folding it fills in 7.2 s, with concurrent folding in 11.9 s, then throughput drops to the TLC rate.\n- **Zone effects:** data still lands in zone order and folds sequentially into whole stripes, so fold is efficient. A Reset must cover both SLC and TLC copies, and a zone's block list can have mixed modes (which breaks pure arithmetic mapping if not designed for).\n- **Endurance:** SLC-mode blocks have much higher cycle ratings than TLC, but every buffered byte adds an SLC program to a TLC program. Device WAF is up to 2 for cached bytes.\n- **Validate:** rate versus fill (cliff shape), fold behavior across idle, power cut during fold (each LBA must have exactly one valid copy afterward), reset while a zone is partly folded, and endurance accounting.","pitfall":"Assuming a ZNS drive has no SLC cache. Many use one, and the performance cliff and endurance accounting still apply.","verify":"Whether the drive uses SLC for zone data, journal or dump only, is vendor specific. Ask for the design or infer it from rate-versus-fill and capacity measurements.","follow":[{"q":"Why do many ZNS designs still keep a small SLC area?","a":"For metadata, the journal and the power-loss dump area, where cheap durability matters more than capacity."},{"q":"What breaks if fold and Reset race?","a":"A reset may erase blocks the fold is reading or writing. The firmware must serialize them, and tests must cross the two operations with power cuts."}],"mod":8},{"id":"8.17","level":"Principal","type":"Scenario","fig":null,"tags":["validation","test-plan","fault-injection","telemetry","firmware-update","regression"],"q":"How would you plan the validation of the firmware and FTL side of a ZNS SSD: what must be tested, how do you observe it, and how do you decide it is enough?","short":"Map each internal mechanism to a host-visible oracle and a fault injection: geometry and mapping, write buffer and durability, Reset and Finish, bad-block and spare handling, wear, refresh, power loss, SLC, and metadata compatibility across firmware updates. Use nvme-cli, blkzone, fio zbd mode, a programmable power switch, firmware hooks and vendor telemetry. Done means every mechanism has injection coverage, a stable soak, and documented behavior at the limits.","deep":"| Mechanism | Stimulus | Oracle | Extra evidence |\n|---|---|---|---|\n| Geometry, mapping | Fill every zone with a self-describing pattern, read back | Every LBA returns its own pattern, ZCAP matches Identify | Compare Identify before and after each firmware build |\n| Buffer and durability | Writes with FUA and Flush, cut power | Data at or below the durable mark reads back | VWC setting, Flush latency |\n| Reset, Finish | Fill-level sweep, reset storms, cut during each | Empty means unwritten reads, no old generation | Reset latency vs fill, stall after storm (8.06, 8.15) |\n| Bad blocks | Inject program fail, erase fail, UECC via vendor hooks | Spare used, or defined Read Only or Offline | Telemetry spare counts per slot (8.10) |\n| Wear | Skewed reset workload | Erase spread within bound | Percentage Used vs media writes (8.12) |\n| Refresh, scan | Bake, read hammer | Data unchanged, no ZDC surprise | ECC and refresh counters (8.13) |\n| Power loss | Deterministic cut points, cuts in recovery | Bound on WP, read-back below WP | Time to ready vs CAP.TO (8.14) |\n| SLC and fold | Rate vs fill, cut during fold | One valid copy per LBA | Media writes vs host writes (8.16) |\n| Metadata compatibility | Update or downgrade with data present | Zone states, WP and data survive, or the change is documented | Journal format version |\n\n- **Order of work:** oracle first (the zone-state model from module 3), then reproducible injection, then soak. Stress runs without an oracle only find crashes.\n- **Coverage:** mechanisms covered, cut points from the firmware state machine hit at least once per build, plus a random soak of long duration with periodic power cuts. Report cut points not yet hit.\n- **Triage discipline:** every failure gets the zone-state dump, the CQEs, the Report Zones before and after, and vendor telemetry snapshot, so the firmware team can replay.\n- **Automation:** one harness (Python around nvme-cli and blkzone, fio for load) that logs every command and status and replays from a seed.\n- **Sign-off:** a table of behaviors at the limits (spare exhaustion, MAR reached, capacity 0, full zones) that the vendor has confirmed, not just observed.","pitfall":"Testing only host-visible commands. Mechanisms like refresh, wear leveling and spare handling only show up with injection and telemetry.","verify":"Which vendor commands and log pages expose grown bad blocks, spare pools, erase counts and fault injection on the drive under test.","follow":[{"q":"What is the most valuable regression test after a firmware update?","a":"Upgrade with a full and a partly written namespace, then verify all zone states, write pointers, block lists (through data) and reads. Metadata format changes hide there."},{"q":"How do you pick cut points when you lack firmware access?","a":"Use timing from latency logs to find program and erase windows, and place cuts inside them with a trace-triggered switch."}],"mod":8},{"id":"9.01","level":"Basic","type":"Concept","fig":null,"tags":["blk-zoned","ioctl","sysfs","struct-blk-zone","units"],"q":"How does Linux represent a zoned NVMe namespace, and what can user space do with it?","short":"Linux exposes a ZNS namespace as a host-managed zoned block device: a fixed zone size in 512-byte sectors, a per-zone record (start, length, write pointer, capacity, type, condition), and a small ioctl set: BLKREPORTZONE, BLKRESETZONE, BLKOPENZONE, BLKCLOSEZONE, BLKFINISHZONE, plus BLKGETZONESZ and BLKGETNRZONES. Every value is in 512-byte sectors, whatever the LBA size.","deep":"Zoned attributes live in `/sys/block/<dev>/queue/`: `zoned` (reads `host-managed` for ZNS), `chunk_sectors` (zone size), `nr_zones`, `max_open_zones` and `max_active_zones` (0 means no limit), `zone_append_max_bytes` and `zone_write_granularity`. How Identify fields become these values is in 2.14.\n\nThe per-zone record is `struct blk_zone`:\n\n| Field | Meaning |\n|---|---|\n| start, len | Zone start sector and zone size in sectors |\n| wp | Write pointer sector |\n| capacity | Zone capacity in sectors (valid when BLK_ZONE_REP_CAPACITY is set in the report flags) |\n| type | 1 conventional, 2 sequential write required, 3 sequential write preferred |\n| cond | Zone condition |\n| non_seq, reset | SMR-era hints, left at 0 by the NVMe driver |\n\nCondition codes are 0 NOT_WP (conventional), 1 EMPTY, 2 IMP_OPEN, 3 EXP_OPEN, 4 CLOSED, 0xD READONLY, 0xE FULL, 0xF OFFLINE. They match the NVMe Zone State (ZS) values in the Zone Descriptor's Zone State Attributes byte (ZNS 1.4, Figure 38: 1h Empty, 2h Implicitly Opened, 3h Explicitly Opened, 4h Closed, Dh Read Only, Eh Full, Fh Offline) because the driver copies the upper nibble of that byte.\n\n| ioctl (magic 0x12) | Number | Argument |\n|---|---|---|\n| BLKREPORTZONE | 130 | struct blk_zone_report: start sector, zone count, then the zone array |\n| BLKRESETZONE | 131 | struct blk_zone_range: sector, nr_sectors |\n| BLKGETZONESZ, BLKGETNRZONES | 132, 133 | one u32 |\n| BLKOPENZONE, BLKCLOSEZONE, BLKFINISHZONE | 134, 135, 136 | struct blk_zone_range |\n\n- **Reset all:** a whole-device reset can reach the NVMe driver as a Reset Zone with Select All set.\n- **Full zones:** the driver reports the WP of a Full zone as zone start plus zone size, ignoring the descriptor value (see 3.12).\n- **Newer kernels:** the header adds a v2 report ioctl and a cached-report flag (annotated Linux 6.19), so a report may come from the kernel's cache, not the drive.","pitfall":"Multiplying Linux values by the LBA size. Every zone address and length in the ioctls, blkzone and chunk_sectors is in 512-byte sectors, so with 4 KiB LBAs divide by 8 before comparing with nvme-cli (sysfs zone_append_max_bytes and zone_write_granularity are in bytes).","verify":"ioctl numbers and the v2 report and cached flag in include/uapi/linux/blkzoned.h for the kernel under test.","follow":[{"q":"Is `len` the Zone Size or the Zone Capacity?","a":"The Zone Size. Capacity is its own field, and writable space can be smaller."},{"q":"Which shell tool prints these fields?","a":"`blkzone report`: start, len, cap and wptr in hex 512-byte sectors, with wptr relative to the zone start."}],"mod":9},{"id":"9.02","level":"Basic","type":"Concept","fig":null,"tags":["stack","layers","responsibility","block-layer"],"q":"Which layers sit between an application and a ZNS SSD on Linux, and who keeps writes sequential at each?","short":"The application or a zone-aware filesystem, then the block layer's zone write handling, then the NVMe driver, then the device. The application or filesystem must produce sequential writes and do its own reclaim. The block layer orders writes per zone and tracks the write pointer, the driver translates geometry and commands, and the device enforces the rules with zone status codes. The device is the last line of defense, not the first.","deep":"| Layer | Examples | Job for sequential writes |\n|---|---|---|\n| Application | RocksDB with ZenFS, log engines, fio zonemode=zbd | Pick the zone, track the WP, reset, recover after a crash |\n| Filesystem | zonefs, f2fs, btrfs zoned mode | Allocate append-only and reclaim (zonefs leaves this to the application) |\n| Device mapper | dm-linear, dm-flakey, dm-crypt, dm-zoned | Some targets pass zones through; dm-zoned emulates random writes |\n| Block layer | Zone write plugging (mq-deadline on old kernels) | Order writes per zone, track WP, emulate Zone Append if absent |\n| NVMe driver | nvme | Map Identify to queue limits, parse Report Zones, force read-only if Zone Append is missing |\n| Device | Firmware | Enforce WP, state machine and MAR/MOR; return zone status codes |\n\n- **Bypass paths:** NVMe passthrough, SPDK and xNVMe skip the filesystem and the ordering logic. Then ordering is your job (9.07, 9.11).\n- **Who reports a failure:** an EIO with no NVMe command behind it came from the block layer or a filesystem. A Zone Invalid Write completion means the device saw an out-of-order write.\n- **Validation consequence:** pick the layer under test. Passthrough tests the device, the block device tests the kernel path, a filesystem tests end to end.","pitfall":"Testing device conformance through a filesystem. The layers above reorder, retry and repair things, so an illegal command never reaches the drive.","verify":"Which device-mapper targets pass zoned geometry through on your kernel (dm-linear, dm-flakey and dm-crypt as I recall).","follow":[{"q":"Where does garbage collection live?","a":"Above the block layer: filesystem reclaim (f2fs, btrfs) or the application (ZenFS resets zones when RocksDB compaction empties them). The block layer never moves data."},{"q":"Which layer decides a namespace is read-only?","a":"The NVMe driver, for example when Zone Append is not advertised (2.15)."}],"mod":9},{"id":"9.03","level":"Basic","type":"Concept","fig":null,"tags":["zonefs","f2fs","btrfs","zenfs","dm-zoned","consumers"],"q":"Which software can use a zoned namespace on Linux, and which of it hides the zone rules?","short":"They range from exposing to hiding the rules. Raw block access with libzbd or ioctls, zonefs, SPDK and xNVMe expose zones. f2fs and btrfs zoned mode hide them behind POSIX files and run their own reclaim. ZenFS puts RocksDB on zones. dm-zoned is a legacy target that emulates random writes on SMR. Choose by how much sequential-write logic the team wants to own.","deep":"| Option | Interface | Zone rules visible? | Reclaim |\n|---|---|---|---|\n| Raw block + libzbd or ioctls | pread/pwrite with direct I/O | Fully | The application |\n| zonefs | One file per zone | Yes: file size is the WP | The application (truncate to 0 resets) |\n| f2fs | POSIX | No | f2fs garbage collection |\n| btrfs zoned mode (5.12) | POSIX | No | btrfs background reclaim |\n| ZenFS | RocksDB FileSystem API | Hidden from RocksDB | Zone reset when a zone holds no live data |\n| SPDK, xNVMe | User-space NVMe | Fully | The application |\n| dm-zoned | Block device | No | dm-zoned (legacy) |\n\n- **dm-zoned:** its documentation describes conventional zones (or a second regular device) for caching and metadata. ZNS has no conventional zones, so it is an SMR-era mechanism, not the way to run ZNS.\n- **Common lesson:** somebody always does garbage collection. Zoned storage moves it out of the drive into whichever row you pick.\n- **Validation angle:** raw and passthrough for conformance, zonefs for simple file-level state checks, a filesystem or ZenFS for end-to-end churn (9.09, 9.10).","pitfall":"Assuming POSIX means no zone problems. f2fs and btrfs can still hit active-zone limits or reclaim-driven ENOSPC on a drive with small MAR.","verify":"The kernel version where zonefs appeared (5.6 as I recall) and dm-zoned behavior on ZNS in your kernel.","follow":[{"q":"Which needs the least new code for an existing application?","a":"A zoned filesystem, at the price of reclaim behavior you do not control."},{"q":"Why is zonefs handy in a lab?","a":"File operations map one to one onto zone actions (append, truncate to 0, truncate to full), and errors show up as permission changes (9.08)."}],"mod":9},{"id":"9.04","level":"Intermediate","type":"Concept","fig":null,"tags":["zone-write-plugging","mq-deadline","ordering","write-pointer"],"q":"How does Linux keep writes to a zone in order, and what changed when zone write plugging replaced zone write locking?","short":"Before, mq-deadline held a per-zone write lock so only one write per zone was in flight. Zone write plugging (Linux 6.10 as I recall) moved this into the block layer, independent of the scheduler: each zone with writes gets a plug that tracks the write pointer offset and queues later writes while one is in flight. Either way, one Write per zone reaches the device at a time, and a write not at the tracked WP fails in the block layer.","deep":"| | Zone write locking | Zone write plugging |\n|---|---|---|\n| Where | I/O scheduler dispatch | Block layer core |\n| Scheduler needed | mq-deadline (default for zoned devices) | Any |\n| Write pointer | Device is the only oracle | Tracked per zone in memory |\n| Zone Append | Native; the SCSI disk driver emulated it | Native or emulated by the block layer (5.08) |\n| Kernel | Up to 6.9 as I recall | 6.10 onward as I recall |\n\n- **Mechanism:** the first write to a zone allocates a plug. While one write is in flight, later bios for that zone wait in a list, and consecutive ones can be merged into one request. The plug is freed when the zone is empty or full and nothing is pending.\n- **Mismatch check:** a write whose start sector is not the tracked WP is failed with an I/O error by the block layer, before any NVMe command exists.\n- **Error path:** when a write fails, queued writes for that zone are aborted (a rate-limited \"Aborting plugged BIOs\" warning) and the plug is marked as needing a WP update. Further writes fail until a Report Zones, Reset or Finish resyncs it.\n- **Append:** native Zone Append is not plugged. Mixing it with regular writes on one zone is invalid and logs \"Invalid mix of zone append and regular writes\".\n- **Result:** per-zone queue depth at the device is 1 for Writes, so scale by spreading over zones or by using Zone Append.","pitfall":"Concluding the device tolerates concurrent writes because a block-device test passed. The kernel serialized them first.","verify":"The kernel that introduced zone write plugging (6.10 as I recall), whether your distribution back-ported it, and the zoned_qd1_writes attribute (documented as January 2026).","follow":[{"q":"Does plugging change what the device sees?","a":"Yes. It never sees two Writes to one zone from the block layer, so QD 32 on the block device does not test device-side reordering."},{"q":"What is zoned_qd1_writes?","a":"A recent sysfs attribute that switches write handling to a single issuer at queue depth 1. Its default is on for SMR HDDs and off for ZNS SSDs."}],"mod":9},{"id":"9.05","level":"Intermediate","type":"Concept","fig":null,"tags":["libzbd","blkzone","units","tools"],"q":"What do libzbd and its tools add over blkzone and raw ioctls, and where do units bite?","short":"libzbd is a C library over the block-layer ioctls. zbd_open checks that the device is zoned and returns geometry and limits, zbd_report_zones filters by condition, zbd_reset_zones, open, close and finish work on ranges, and macros test type and condition. blkzone from util-linux is the shell equivalent, and libzbd ships a zbd CLI. The trap is units: libzbd takes bytes, blkzone takes 512-byte sectors, and nvme-cli takes LBAs.","deep":"- **Open:** `zbd_open(path, flags, &info)` returns -ENXIO for a non-zoned device. `struct zbd_info` reports nr_zones, zone_size (bytes), zone_sectors, max_nr_open_zones, max_nr_active_zones (0 no limit, -1 unknown) and the zone model.\n- **Report:** `zbd_report_zones(fd, ofst, len, ro, zones, &nr)`. The `ro` filter values include EMPTY, IMP_OPEN, EXP_OPEN, CLOSED, FULL, RDONLY, OFFLINE and NOT_WP. Range operations take a byte offset and length, and length 0 means to the end of the device.\n- **Tests:** macros such as `zbd_zone_empty()` and `zbd_zone_is_open()` keep harness code readable.\n\n| Tool | Unit | Path | Best for |\n|---|---|---|---|\n| `blkzone report/reset/open/close/finish` (-o offset, -l length, -c count) | 512-byte sectors | Block-layer ioctls | Quick looks and scripts |\n| libzbd, `zbd report` | Bytes | Block-layer ioctls | Harnesses and applications |\n| `nvme zns report-zones` and friends | LBAs | NVMe passthrough | Device-level and illegal commands |\n| `lsblk -z` | Sysfs values | Sysfs | Inventory across a lab |\n\n- **Filter codes:** libzbd's ZBD_RO_EMPTY 1, IMP_OPEN 2, EXP_OPEN 3, CLOSED 4, FULL 5, RDONLY 6 and OFFLINE 7 equal the NVMe ZRASF state values (libnvme, SPDK and QEMU agree). libzbd also has ZBC-only values (NOT_WP 0x3f, NON_SEQ 0x11, RWP_RECOMMENDED 0x10) that mean nothing to NVMe. Linux nvme.h names 05h READONLY and 06h FULL, which is swapped against those sources, so do not copy ZRASF numbers from that header.\n- **Harness rule:** model in libzbd if you like, but always re-read the WP from the device after any error.","pitfall":"Passing sectors to libzbd or LBAs to blkzone. The call succeeds and acts on the wrong zone.","verify":"lsblk zone columns and blkzone option letters on your util-linux version, and the zbd CLI subcommands in your libzbd release. The ZRASF state values are confirmed: Full 05h, Read Only 06h (ZNS 1.4, 3.4.2, Figure 35).","follow":[{"q":"Which open flags for a write test?","a":"Pass O_DIRECT (zbd_open forwards flags to open). Buffered writes are reordered by the page cache."},{"q":"What does a range with length 0 mean?","a":"Everything from the offset to the end of the device capacity."}],"mod":9},{"id":"9.06","level":"Intermediate","type":"Concept","fig":null,"tags":["fio","zonemode-zbd","max-open-zones","zone-reset","append"],"q":"How does fio's zonemode=zbd work, and which options matter for a ZNS test?","short":"With zonemode=zbd fio reads the zone layout, keeps writes sequential within every sequential zone even for random workloads, spreads randomness across zones, limits open zones with max_open_zones, and turns trim into Reset Zone. zone_reset_threshold and zone_reset_frequency emulate host garbage collection. fio issues ordinary Writes unless you use ioengine=io_uring_cmd with write_mode=zone_append.","deep":"| Option | Meaning |\n|---|---|\n| `zonemode=zbd` | Sequential in each zone, random across zones, trim becomes reset |\n| `max_open_zones=N` | Zones written by all jobs at once. Default is the device limit and a larger value is refused |\n| `job_max_open_zones=N` | Same limit per job |\n| `ignore_zone_limits=1` | Allow max_open_zones above the device limit (negative tests) |\n| `zone_reset_threshold=F` | Reset only once the written ratio of the IO range passes F |\n| `zone_reset_frequency=F` | Once past the threshold, one reset per 1/F write requests |\n| `read_beyond_wp=1` | Allow reads above the write pointer (off by default, they return without media reads) |\n| `recover_zbd_write_error=1` | With `continue_on_error`, resync the WP after a failed write |\n| `write_mode=zone_append` | Zone Append writes, `io_uring_cmd` engine only |\n\n- **Serialization:** for host-managed devices fio serializes writes to sequential zones, so `iodepth=32` does not put 32 writes into one zone.\n- **Remainders:** if the free space in a zone is not a multiple of the block size, fio finishes the zone to free the open resource, unless `write_zone_remainders` is set.\n- **Direct I/O:** use `direct=1` so the page cache cannot reorder writes.\n\n```\nfio --name=zw --filename=/dev/nvme0n2 --direct=1 --ioengine=io_uring --zonemode=zbd \\\n    --rw=randwrite --bs=128k --iodepth=8 --numjobs=4 --group_reporting \\\n    --max_open_zones=8 --zone_reset_threshold=0.8 --zone_reset_frequency=0.01 \\\n    --time_based --runtime=600\n```","pitfall":"Reading a zonemode=zbd run on the block device as a Zone Append or multi-writer test. It issues one Write at a time per zone.","verify":"Option names and defaults in your fio version (`fio --version`, the HOWTO), and that write_mode=zone_append exists there.","follow":[{"q":"Does randwrite produce random device writes?","a":"No. Random picks the zone and inside it writes land at the write pointer."},{"q":"What if the device has MOR 14 and you ask for max_open_zones=20?","a":"fio refuses unless ignore_zone_limits is set."}],"mod":9},{"id":"9.07","level":"Intermediate","type":"Cross-layer","fig":null,"tags":["passthrough","ng","io-uring-cmd","bypass","spdk"],"q":"How do you reach a ZNS namespace without the block layer, and what do you gain and lose compared with /dev/nvme0n2?","short":"Use NVMe passthrough: nvme-cli through the controller or generic namespace character device, fio's io_uring_cmd engine on /dev/ngXnY, or a user-space driver (SPDK, xNVMe). Illegal commands, real Zone Append concurrency and exact status codes reach the drive. You lose the kernel's write ordering and write pointer tracking, so the ordering and the model are yours.","deep":"| Path | Node or API | Native Zone Append | Write ordering |\n|---|---|---|---|\n| Block device | /dev/nvme0n2 | Only from kernel users such as btrfs | Kernel serializes |\n| ioctl passthrough | /dev/nvme0 or /dev/ng0n2 with nvme-cli | Yes (`nvme zns zone-append`) | None |\n| io_uring_cmd | fio on /dev/ng0n2 | Yes (`write_mode=zone_append`) | None |\n| SPDK, xNVMe | Library calls | Yes | None |\n\n- **Gains:** a Write at the wrong LBA, an illegal state transition or a reserved ZSA byte actually arrives and returns the raw CQE status. The block layer would reject or repair those.\n- **Losses:** no plugging, no merge control, no error-to-errno mapping. Retries, timeouts and reset recovery are yours.\n- **Do not mix:** changing zones through passthrough while a filesystem or block-device writer uses the namespace can leave the kernel's write pointer tracking stale. Later failures then look like device bugs. Use a dedicated namespace.\n- **Result width:** Zone Append returns a 64-bit address, so use the 64-bit passthrough ioctl (5.02).\n- **Practice:** conformance runs use passthrough on an unmounted namespace, stack runs use the block device, and both use the same zone model.","pitfall":"Running passthrough zone actions on a namespace that a mounted filesystem also uses. The kernel's view drifts and the failures are self-inflicted.","verify":"ng device naming and the kernel that added io_uring passthrough (5.19 as I recall), fio io_uring_cmd support, and how the kernel's zone cache reacts to out-of-band zone changes.","follow":[{"q":"Why can you not provoke Zone Invalid Write from /dev/nvme0n2 on a recent kernel?","a":"The write plug fails a write that is not at the tracked WP before any command is built. Use passthrough."},{"q":"How do you see the raw status?","a":"nvme-cli prints status name and code, the ioctl returns the status, and nvme tracepoints log each completion."}],"mod":9},{"id":"9.08","level":"Intermediate","type":"Concept","fig":null,"tags":["zonefs","direct-io","errors","explicit-open","truncate"],"q":"How does zonefs expose a ZNS namespace, and how does it handle I/O errors and zone resource limits?","short":"zonefs shows every zone as a file: conventional zones under cnv/, sequential zones under seq/. A seq file's size is its write pointer, writes must be direct I/O appends at the end, truncate to 0 resets the zone and truncate to the zone capacity finishes it. The explicit-open mount option opens zones when a file is first opened for writing so writes cannot hit the active zone limit, and errors= picks the reaction to I/O errors and zone state changes.","deep":"| Operation on a seq file | Zone effect |\n|---|---|\n| Direct write at end of file | Write at the WP |\n| Buffered write or writable shared mmap | Rejected |\n| Write not at end (or end of last in-flight write) | Fails |\n| `truncate(0)` | Reset Zone |\n| Truncate up to the zone capacity | Finish Zone |\n| Read of any kind | Allowed |\n\n- **Metadata:** none beyond a fixed superblock in the first zone. The file tree is built from Report Zones at mount, so file sizes come from the device. `mkzonefs` finishes that first zone if it is sequential (always true on ZNS), so zonefs exposes one zone less than the device has.\n- **Errors:** `errors=remount-ro` (default), `zone-ro`, `zone-offline` and `repair`. A zone that turns Read Only shows as a read-only file and one that turns Offline as a file with no access and size 0. Both changes are permanent.\n- **explicit-open:** an Open Zone is sent at first write open and a Close Zone at last close if the zone is neither full nor empty. Sysfs under `/sys/fs/zonefs/<dev>/` shows limits such as the maximum active sequential files.\n- **Validation use:** file operations reach Reset, Finish and Open in a few lines of shell. Read Only and Offline injection appears as permission changes, so a test can assert on `stat`.","pitfall":"Writing a seq file with buffered I/O. It is rejected, so use O_DIRECT with block-aligned sizes.","verify":"Mount option names and the ordering note in the zonefs document for your kernel (the text mentions an elevator, which zone write plugging supersedes).","follow":[{"q":"Where does a seq file's size come from after a power cycle?","a":"It is rebuilt at mount from the write pointer the drive reports."},{"q":"Why does zonefs not hide random writes?","a":"It never tries. Any write not at the end of the file fails."}],"mod":9},{"id":"9.09","level":"Advanced","type":"Cross-layer","fig":null,"tags":["f2fs","btrfs","zoned-mode","reclaim","zone-capacity"],"q":"How do f2fs and btrfs zoned mode use a ZNS SSD, and what do they demand from the device?","short":"Both replace overwrite semantics with append-only zone allocation and run their own reclaim. btrfs zoned mode (Linux 5.12) allocates zone-sized block groups, keeps superblocks in a two-zone ring, and reclaims by relocating live extents and resetting the zone. f2fs is log-structured with several logs, does garbage collection per zone-sized section, and honors zone capacity. Both consume active and open zones, so MAR and MOR shape their behavior.","deep":"| | btrfs zoned | f2fs |\n|---|---|---|\n| Since | 5.12 | Zoned support earlier; ZNS zone capacity handled |\n| Space unit | Block group of whole zones | Section of 2 MiB segments, sized to a zone |\n| Metadata | Superblocks in a ring of 2 zones at 0, 512 GiB, 4 TiB | Needs in-place updates, so a conventional area or device |\n| Reclaim | Threshold-driven relocation then Reset Zone | Garbage collection then reset of freed sections |\n| Resource use | Device active-zone limit applies (btrfs documentation) | `active_logs` 2, 4 or 6 (default 6) open logs |\n\n- **btrfs limits:** all devices must share one zone size (4 MiB to 8 GiB, power of two). No NODATACOW, no fallocate-style preallocation, no booting from the zoned device, and only single and DUP profiles at first. Reclaim can produce intermittent ENOSPC.\n- **f2fs and capacity:** if Zone Capacity is below Zone Size, segments past the capacity are marked permanently used. A segment spanning the capacity boundary counts as partly usable.\n- **f2fs discard:** `discard_unit=section` is the default on zoned devices, so discards are section-sized, which on a zoned device ends as zone resets (as I recall).\n- **Device impact:** small MAR (for example 14) leaves few logs or block groups writable together. Expect Too Many Active Zones or stalls, and count implicit opens and closes on the wire.\n- **Validation:** run a fill-delete-refill churn and diff `blkzone report` before and after. Expect Reset and Finish traffic you did not issue.","pitfall":"Treating a filesystem run as a passive load. Its reclaim thread issues zone management on its own schedule, even under a read-mostly load.","verify":"Whether btrfs uses Zone Append for data on your kernel, whether f2fs runs on a zoned-only device without a conventional one, and the btrfs superblock offsets.","follow":[{"q":"Why does reclaim show up as resets?","a":"It copies live data to a new zone and resets the old one, so reset rate follows churn and fill level."},{"q":"What if a filesystem assumes writable space equals Zone Size?","a":"It writes past the capacity and gets Zone Boundary Error."}],"mod":9},{"id":"9.10","level":"Advanced","type":"Concept","fig":null,"tags":["zenfs","rocksdb","lifetime-hints","libzbd","metadata"],"q":"How does ZenFS place RocksDB data on zones, and what does it need from a ZNS device?","short":"ZenFS is a RocksDB FileSystem plugin that stores files as extents inside zones of a raw zoned device, using libzbd for zone operations and pread/pwrite for data. It uses RocksDB's write lifetime hints to co-locate data that dies together, so whole zones become empty and are reset without copying. It needs sequential writes at the WP, enough open and active zones for its writers, and a few zones for its metadata log.","deep":"- **Layout:** extents are block-aligned and never span zones. A zone can hold extents of several files. Metadata is a rolling log in the first zones (superblock, snapshot, incremental updates). RocksDB LOG and LOCK files live on another filesystem (`--aux_path`).\n- **Reclaim:** the README says ZenFS does no garbage collection of its own. A zone is reset when its live-byte count reaches zero. RocksDB compaction, by deleting SST files, is the reclaim engine.\n- **Requirements:** libzbd, Linux 5.4 or later for SMR and 5.9 or later for ZNS, RocksDB 6.19.3 or later. ZenFS 2.0 changed the on-disk format, so migrate with `zenfs backup` and `restore`.\n- **Backends:** a raw zoned device, or a zonefs mount (which costs one zone), which the README says should use `explicit-open`.\n- **Device demands:** WAL, flush and compaction outputs each hold an open and active zone, so the MAR and MOR budget limits compaction parallelism (6.12).\n- **Validation tools:** `db_bench --fs_uri=zenfs://dev:nvme0n2` for churn, and the modified `db_crashtest.py` scripts that kill the DB at random or fixed points and check recovery. A host kill is not a device power loss, so add a power-cycle rig for that.","pitfall":"Calling ZenFS GC-free and stopping there. Compaction does the reclaim, and wrong lifetime prediction strands live data in old zones.","verify":"Current ZenFS requirements (scheduler advice, metadata zone count, active-zone needs) in the README of the release you test.","follow":[{"q":"Where did write amplification go?","a":"The device multiplier drops toward 1 (module 8), but RocksDB's own rewriting stays and must be measured separately (9.17)."},{"q":"What breaks if lifetime hints are wrong?","a":"Zones stay partly live, few become empty, and free zones run out even though space is technically free."}],"mod":9},{"id":"9.11","level":"Advanced","type":"Concept","fig":null,"tags":["spdk","xnvme","user-space","zone-append","windows"],"q":"How do SPDK and xNVMe support ZNS, and how does validating through them differ from validating through Linux?","short":"Both are user-space. SPDK offers spdk_nvme_zns_* calls at the NVMe driver level (append, report, open, close, finish, reset, offline, set descriptor extension) and spdk_bdev_zone_* at the bdev level. xNVMe gives one C API and CLI, with a zoned command set library, over several backends (io_uring, io_uring_cmd, libaio, SPDK and others). There is no kernel write plugging, so you order writes or use Zone Append yourself, and queue-depth races are real.","deep":"- **SPDK NVMe driver:** `spdk_nvme_zns_zone_append` (plus `_with_md` and vector forms), `spdk_nvme_zns_report_zones`, `open_zone`, `close_zone`, `finish_zone`, `reset_zone`, `offline_zone`, `set_zone_desc_ext`. Geometry: `spdk_nvme_zns_ns_get_zone_size`, `get_num_zones`, `get_max_open_zones`, `get_max_active_zones`, and `spdk_nvme_zns_ctrlr_get_max_zone_append_size`.\n- **SPDK bdev:** `spdk_bdev_get_zone_size`, `get_max_open_zones`, `get_max_active_zones`, `get_optimal_open_zones`, `spdk_bdev_get_zone_info`, `spdk_bdev_zone_management`, `spdk_bdev_zone_append`, and `spdk_bdev_io_get_append_location` for the assigned LBA. The uring bdev supports zoned devices by default.\n- **xNVMe:** backends on Linux are io_uring, io_uring_cmd, libaio and block ioctls, plus SPDK. The zoned command set is `libxnvme_znd`, and CLI tools include `xnvme` and `zoned`. The same code runs on several backends, which helps isolate a kernel effect from a device effect.\n- **Windows:** xNVMe lists a Windows backend on the platform's NVMe driver, but that says nothing about ZNS. Treat Windows as unsupported for ZNS unless the vendor documents otherwise.\n- **Why validators use them:** precise control of queue depth and queue count, no kernel cache, raw status in every completion, and far more Zone Append commands per second than the kernel path. That is where device-side races show up.","pitfall":"Assuming a pass in SPDK proves the Linux path works. The kernel adds ordering, splitting, errno mapping and driver-level gating that need their own tests.","verify":"SPDK's zone_block virtual bdev and RPC names, xNVMe zoned CLI subcommands, and any Windows ZNS support statement.","follow":[{"q":"Why is SPDK good for Zone Append stress?","a":"Fine QD control, low overhead, and the completion carries the assigned LBA, so the oracle is direct."},{"q":"What do you lose?","a":"Plugging, splitting, error mapping and Identify gating of the kernel. Test those on Linux separately."}],"mod":9},{"id":"9.12","level":"Advanced","type":"Numeric","fig":null,"tags":["fio","sizing","zone-reset","host-gc","capacity"],"q":"Size a fio zonemode=zbd run on a 3,600-zone namespace that emulates host GC: how many resets per second, how long is one device pass, and which option values do you use?","short":"Zone capacity is 0x3C000 x 4 KiB = 960 MiB, so a zone takes 7,680 writes of 128 KiB. At an assumed 2.0 GB/s, one hour writes 7.2 TB, about 7,153 zone fills or 1.99 device passes, so about 2 resets per second. Steady state needs one reset per 7,680 writes: zone_reset_frequency near 1.3e-4. Keep max_open_zones at or below the device limit.","deep":"Assumptions: 4 KiB LBAs, ZSZE 0x40000, ZCAP 0x3C000, 3,600 zones, 128 KiB writes, sustained 2.0 GB/s (decimal, assumed), Linux max_open_zones 14.\n1. **Geometry:** zone size 0x40000 x 8 = 2,097,152 sectors (1 GiB). Capacity 0x3C000 = 245,760 blocks = 1,006,632,960 B = 960 MiB. Usable space 3,600 x 960 MiB = 3.30 TiB against 3.52 TiB nominal, so 6.25 percent of the LBA space can never be written.\n2. **Writes per zone:** 1,006,632,960 / 131,072 = 7,680.\n3. **Fill time:** 1,006,632,960 / 2.0e9 = 0.50 s per zone if one zone absorbed the full rate. In practice several zones share it.\n4. **Per hour:** 2.0e9 x 3,600 = 7.2e12 B. Zone fills = 7.2e12 / 1.00663e9 = 7,152.6. Resets per second = 7,152.6 / 3,600 = 1.99. Device passes per hour = 7,152.6 / 3,600 zones = 1.99 (the same number by coincidence: 3,600 seconds per hour and 3,600 zones).\n5. **Reset rate in fio:** one reset per zone of writes gives 1 / 7,680 = 1.302e-4 for `zone_reset_frequency`. The reset fires after every 1/F write requests once past `zone_reset_threshold`.\n6. **Threshold trap:** the written ratio is measured against the IO range. If that range counts zone size, the ratio tops out near 0.9375 (960/1,024), so a threshold above that never triggers.\n7. **Open zones:** default `max_open_zones` is the device limit (14). Choosing 12 leaves 2 for other host activity such as finishes.\n```\nfio --name=hostgc --filename=/dev/nvme0n2 --direct=1 --ioengine=io_uring --zonemode=zbd \\\n    --rw=randwrite --bs=128k --iodepth=8 --numjobs=4 --group_reporting --max_open_zones=12 \\\n    --zone_reset_threshold=0.8 --zone_reset_frequency=0.00013 --time_based --runtime=3600\n```","pitfall":"Setting zone_reset_threshold above the writable fraction. The trigger never fires and the run just fills the namespace and stalls.","verify":"Whether fio measures the threshold ratio against zone size or zone capacity, and how it counts the IO range across multiple jobs.","follow":[{"q":"What if the device sustains 1 GB/s?","a":"Everything halves: 3.6 TB per hour, about 1.0 reset per second, about 1 pass per hour. Writes per zone are unchanged."},{"q":"Why log reset latency next to write latency?","a":"Resets compete with writes for the same dies, so a bandwidth-only report hides their cost (module 4, module 8)."}],"mod":9},{"id":"9.13","level":"Advanced","type":"Debug","fig":null,"tags":["write-error","zone-invalid-write","triage","blkzone","trace"],"q":"A host log says \"write error at wrong LBA\" on a zoned NVMe namespace. Decode the log below and prove whether the host or the device is at fault.","short":"Two writers both believed the write pointer was 0x182000 and wrote the same LBA within a millisecond. One succeeded and moved the WP to 0x182020, and the loser failed. blkzone confirms the drive holds exactly one 32-block write, so the device is consistent and the host raced. Linux maps this failure to plain EIO, so use traces to see whether the block layer or the device rejected it.","deep":"```\napp.log 12:04:11.207 writer-3 zone 6 wp_model=0x182000 pwrite lba=0x182000 nlb=32 -> 131072 ok\napp.log 12:04:11.207 writer-5 zone 6 wp_model=0x182000 pwrite lba=0x182000 nlb=32 -> -5 EIO \"write error at wrong LBA\"\ndmesg   [ 812.440118] I/O error, dev nvme0n1, sector 12648448 op 0x1:(WRITE) ...\n# blkzone report -o 12582912 -c 1 /dev/nvme0n1\n  start: 0x000c00000, len 0x200000, cap 0x1e0000, wptr 0x010100 reset:0 non-seq:0, zcond: 2(oi) [type: 2(SEQ_WRITE_REQUIRED)]\n```\n1. **Zone 6:** 4 KiB LBAs, zone size 0x40000 blocks, so zone 6 starts at LBA 0x180000 = sector 12,582,912 (0xC00000). Matches `start`.\n2. **Failing LBA:** 0x182000 x 8 = 12,648,448, the sector in dmesg. It is 0x2000 blocks (32 MiB) into the zone.\n3. **WP check:** one 32-block write moves the WP to offset 0x2020 blocks = 0x10100 sectors. blkzone shows `wptr 0x010100`. Exactly one write landed, and the zone is implicitly open (cond 2).\n4. **Verdict:** both writers shared a stale WP model. Whichever raced second was doomed, so the device is consistent and the host is at fault.\n5. **Who rejected it:** Linux maps Zone Invalid Write to plain EIO, so the app cannot tell. With zone write plugging the block layer fails the write and no NVMe command exists for it. On older kernels or passthrough the command reaches the drive and completes with status 0x1BC (SCT 1, SC BCh). Enable nvme tracepoints or blktrace to see which.\n6. **Collateral:** after the first failure the plug wants a WP update (and a warning \"Aborting plugged BIOs\" may appear if writes were queued). Later errors in that zone are noise. Triage the first failure only.\n\n| Observation | Suspect |\n|---|---|\n| Device WP = model + acknowledged writes, two writers | Host (this case) |\n| WP ahead of everything acknowledged | Device (phantom advance) or a timed-out write that did land and was retried |\n| Zone Invalid Write on strictly serial QD 1 writes at the LBA just read from Report Zones | Device |\n| Mismatch starts right after a timeout, abort or reset | Recovery bug: resync the WP with Report Zones after any ambiguous failure |\n\nCollect: kernel version, scheduler, nvme trace events, the WP before and after, and a per-zone lock audit of the app.","pitfall":"Chasing the later errors. Once the first write to a zone fails, the tracked WP is untrusted and every following error is a consequence.","verify":"The exact dmesg wording on your kernel, the errno the application sees, and the blkzone output format on your util-linux version.","follow":[{"q":"Does it matter that the first writer succeeded and the second failed?","a":"No. Which racer wins is arbitrary. Two writers sharing one write pointer is the bug."},{"q":"What is the host fix?","a":"One owner per zone, or a lock spanning WP read to submit, or Zone Append with addresses taken from completions, plus a WP resync after any failure."}],"mod":9},{"id":"9.14","level":"Advanced","type":"Trap","fig":null,"tags":["scheduler","mq-deadline","kernel-version","zone-write-locking"],"q":"The ZenFS README and many older guides say to set the zoned device's IO scheduler to deadline. Is that still needed, and what happens if you ignore it?","short":"It depends on the kernel. Before zone write plugging, ordering of writes within a zone relied on mq-deadline's zone write lock, so another scheduler could let writes reach the device reordered and fail with Zone Invalid Write under concurrency. With plugging (Linux 6.10 as I recall) the block layer orders writes itself and the scheduler no longer decides correctness. Check the kernel, do not copy the command.","deep":"- **Old rule:** a scheduler with the zoned-write-ordering feature (mq-deadline) was the default for zoned devices, and ZenFS says `echo deadline > /sys/class/block/<dev>/queue/scheduler`, redone at every enumeration because the setting reverts.\n- **Symptom when wrong:** intermittent Zone Invalid Write under multi-threaded or QD greater than 1 writes, invisible at QD 1 in a quiet lab.\n- **New kernels:** the setting is harmless, and the ordering comes from the per-zone plug (9.04). A test that reproduces only on old kernels is evidence about the kernel, not the drive.\n- **Experiment:** run `fio --zonemode=zbd --rw=randwrite --iodepth=32 --numjobs=4 --direct=1` once per scheduler on each kernel and count Zone Invalid Write with nvme tracepoints or dmesg. Expect zero on 6.10 or later. On an old kernel, `none` may be refused or may misorder.\n- **Multiple hardware queues:** they are why ordering needs one serialization point. Writes to one zone can otherwise enter through different queues.\n- **Generalization:** treat tuning lines in old READMEs as versioned facts and record the kernel in every result.","pitfall":"Copying a tuning line from an old README into a test plan. On a new kernel it is a no-op, and on an old one skipping it produces failures that look like firmware bugs.","verify":"The kernel where zone write plugging landed (6.10 as I recall), whether your distribution kernel back-ported it, and whether scheduler changes are refused on zoned devices in the old kernel you test.","follow":[{"q":"Does native Zone Append need the deadline scheduler?","a":"No. Appends are not ordered by the host, and the lock existed for regular writes."},{"q":"How do you check what a machine does?","a":"`uname -r`, `cat /sys/block/<dev>/queue/scheduler`, and a QD 32 write test."}],"mod":9},{"id":"9.15","level":"Principal","type":"Scenario","fig":null,"tags":["emulation","null-blk","zloop","qemu","triage"],"q":"A host team's zoned stack passes on null_blk, zloop and QEMU ZNS but fails on the real drive within hours. What do the emulators not model, and how do you triage it?","short":"Emulators model geometry and write-pointer rules but not the drive's timing, background work, firmware reordering under load, real Read Only and Offline transitions, resource-accounting quirks or power loss. Triage by capturing the failing trace on hardware, classifying the failure (timing, state, resources, error path, power), and reproducing each class in QEMU with the drive's real Identify values until it either fails there (host bug) or clearly needs hardware.","deep":"| Emulator | Gives you | Lacks |\n|---|---|---|\n| null_blk (`zoned=1`, `zone_size`, `zone_nr_conv`) | Fast zoned block device inside the kernel | No NVMe path: no Identify parsing, no CQE status mapping |\n| zloop | One file per zone, a full zone state machine, optional native append | Limits and options vary by kernel; no NVMe layer |\n| QEMU `nvme-ns,zoned=on` | The real NVMe driver path, with `zoned.zone_size`, `zone_capacity`, `max_open`, `max_active`, `descr_ext_size`, `cross_read` on the namespace and `zoned.zasl` on the `nvme` controller device | Emulated NVMe 1.4 controller, no real latency, media errors or GC |\n\n1. **Capture:** an nvme trace or analyzer capture of the failing window, dmesg, Report Zones before and after.\n2. **Classify:** timing dependence (only at high QD or after hours), state (a zone left open or full), resources (MAR or MOR exhaustion), error path (Read Only or Offline), or power.\n3. **Mirror the drive:** copy ZSZE, ZCAP, MAR, MOR, ZASL and ZDES from `nvme zns id-ns` and `id-ctrl` into QEMU parameters, and run the same workload.\n4. **Compare traces:** opcode, LBA and status streams from emulator and drive. The first divergence points at what the emulator lacks.\n5. **A/B on hardware:** same host on two firmware builds, or two drives. A failure that follows the firmware is the drive.\n6. **Decide:** if QEMU with matching limits reproduces it, it is a host bug. If it needs timing, background erase, wear or power, it belongs on the hardware rig.","pitfall":"Treating an emulator as an oracle for the drive. Agreement shows the host follows the spec as the emulator implements it, not that the drive does.","verify":"QEMU parameter names in the docs for your QEMU version, and null_blk and zloop zone capacity and limit options for your kernel.","follow":[{"q":"When is the emulator authoritative?","a":"For host logic against the spec, such as expected status codes and state transitions. Not for firmware behavior."},{"q":"What common hardware-only failures appear after hours?","a":"Read Only transitions from media wear, MAR accounting drift, and latency spikes that trip host timeouts."}],"mod":9},{"id":"9.16","level":"Principal","type":"Scenario","fig":null,"tags":["regression","automation","kernel-matrix","oracle","gating"],"q":"Design the automated host-stack regression suite that gates a ZNS firmware release on Linux. What matrix, oracles and pass criteria do you use?","short":"Layer it: device conformance through passthrough, kernel-stack behavior on the block device, and end-to-end runs on zonefs, f2fs, btrfs and ZenFS, plus a fault tier. Run a small kernel matrix (one LTS before and one after zone write plugging, plus current). The oracle is a host-side zone model checked against Report Zones and fixed-seed data verification. Pass means no unexplained non-success status, WP model equal to the device WP after every quiesce, and data intact after power cycles.","deep":"| Tier | Tools | Proves | Oracle |\n|---|---|---|---|\n| 1 Device conformance | nvme-cli passthrough, SPDK | Transitions, status codes, limits | Spec table plus zone model |\n| 2 Kernel stack | fio zonemode=zbd, blkzone, libzbd | Bring-up, sysfs values, plugging, error mapping | Identify vs sysfs, WP model |\n| 3 Filesystem and app | zonefs, f2fs, btrfs, ZenFS db_bench and crashtest | Reclaim churn, resource use, recovery | fsck or data verify |\n| 4 Faults | Power-cycle rig, injected zone errors, host kill | WP after loss, Read Only and Offline handling | Invariants after recovery |\n\n- **Kernel matrix (versions to confirm):** ZNS needs 5.9 or later, btrfs zoned 5.12, plugging 6.10 as I recall, plus the current stable. Record `uname -r` in every result.\n- **Automation:** `nvme zns report-zones` with JSON output, a state-model checker (module 10), and an artifact bundle per run: dmesg, nvme traces, Identify dumps, blkzone reports, fio JSON, tool versions.\n- **Known-issue list:** keyed by kernel version, so a kernel behavior is not filed as a firmware bug.\n- **Blame split:** a 2 x 2 of old and new firmware on old and new kernels. A failure that follows the firmware is the drive.\n- **Flakes:** rerun with the same seed, then vary it. A seed-stable failure is a logic bug, a seed-sensitive one is a race.\n- **Coverage:** count transitions seen on the wire, status codes seen, MAR and MOR hits, and Zone Append concurrency reached.","pitfall":"One kernel and one workload. A suite that passes only on the newest kernel misses customers on LTS releases, where write ordering and error mapping differ.","verify":"Which kernel versions your customers run and the exact kernel cut-overs for ZNS, btrfs zoned and zone write plugging.","follow":[{"q":"Which results need the power rig?","a":"WP after unclean shutdown, zones left open or closed, and wear-driven Read Only transitions. Emulators cannot show these."},{"q":"How do you keep the suite fast?","a":"Short tier 1 and 2 on every build, tier 3 nightly with churn, tier 4 weekly with a long soak."}],"mod":9},{"id":"9.17","level":"Principal","type":"Cross-layer","fig":null,"tags":["host-gc","waf","attribution","counters","reclaim"],"q":"The host now owns garbage collection. How do you measure its cost end to end and decide whether the ZNS drive delivers the promised benefit, without blaming the wrong layer?","short":"Split write amplification by layer. Host WAF is engine or filesystem bytes written per user byte (compaction, reclaim copies). Device WAF is NAND bytes written per host byte, which should stay near 1 on ZNS. Measure host writes from block-layer counters, NAND writes from the drive's SMART or vendor log, and resets from traces. If device WAF is near 1 and latency is flat, remaining cost is host policy, not the drive.","deep":"1. **Formula:** total WAF = host WAF x device WAF. Assumed example: host WAF 3.0 and device WAF 1.05 give 3.15. ZNS removes the device multiplier but does not touch the host one.\n2. **Host counters:** application statistics (compaction bytes, reclaim relocated bytes), `/sys/block/<dev>/stat` sectors written, and `iostat`. Sectors are 512 bytes.\n3. **Device counters:** host data units written and, if the drive exposes it, physical NAND writes in the OCP SMART extension or a vendor log. Without the NAND counter you cannot separate host reclaim from device relocation.\n4. **Resets:** count Reset Zone commands (opcode 79h, ZSA 04h) in a trace, or diff Report Zones snapshots.\n5. **Steady state:** run for several device passes so free zones are consumed and reclaim is active (9.12), then compare latency percentiles during reclaim and idle.\n6. **Starvation test:** shrink the free-zone budget until the host runs out of empty zones. Expect ENOSPC or stalls at the host, and correct statuses from the drive. Add a Reset-all during churn.\n7. **Decide:** device WAF materially above 1 means the firmware is copying internally (partial-zone handling, Finish, wear leveling, data refresh), so investigate module 8 behaviors. High host WAF is fixed by host policy: lifetime hints, tiering, reclaim thresholds.","pitfall":"Dividing total bytes written to the drive by user bytes and calling it ZNS WAF. Without NAND-side counters that number is host WAF only.","verify":"Which SMART or log fields your drive exposes for NAND (physical) writes, their units, and the OCP datacenter NVMe SSD specification revision that defines them.","follow":[{"q":"What if host WAF is huge?","a":"Change placement and reclaim policy in the software. The drive is not the cause."},{"q":"Can the drive hide reset cost?","a":"Reset can complete fast with erase in the background, so watch the latency of the next writes, not only the Reset completion (module 4)."}],"mod":9},{"id":"10.01","level":"Basic","type":"Concept","fig":null,"tags":["test-plan","phases","dependencies","oracle","gating"],"q":"What does a ZNS validation plan cover, and in what order do you build and run it?","short":"Order it by dependency. Discover the drive's zoned profile first, then check static geometry, Identify data and Report Zones, then the state machine and management commands, I/O rules and boundaries, resource limits, Append, persistence across resets and power loss, data integrity and soak, media faults, performance and host-stack tests. Early phases gate later ones, because a broken Reset or Report Zones corrupts the meaning of every later result.","deep":"| Phase | Question it answers | Where in this page |\n|---|---|---|\n| 0 Profile | What does this drive claim (ZOC, OZCS, MAR, MOR, ZASL, DLFEAT, VWC)? | Modules 2 and 6 |\n| 1 Static | Is geometry consistent: ZSZE, ZCAP, zone count, descriptors well formed? | Modules 2 and 3 |\n| 2 State machine | Does every state x action give the right status and next state? | Module 4 |\n| 3 I/O rules | Write pointer, boundaries, read rules, zone status codes | Module 7 |\n| 4 Resources | MAR and MOR enforcement, implicit close | Module 6 |\n| 5 Append | Placement, ZASL, concurrency | Module 5 |\n| 6 Persistence | Reset and SPOR outcomes, WP recovery | 3.09, 3.15, 10.12 |\n| 7 Integrity and soak | Per-zone data checks over long mixed runs | 10.11 |\n| 8 Faults | Read Only and Offline transitions, aborts, timeouts | 3.16 |\n| 9 Performance | Zone bandwidth, Append scaling, reset impact | 10.08 |\n| 10 Host stack | Linux zoned block layer, fio zbd, file systems | Module 9 |\n\n- **Oracle sources, ranked:** the spec's transition and status tables as data; command completions (status, and DW0 for Append); Report Zones at quiescence; read-back of self-describing data; logs and events as corroboration. Expected values never come from the device's own report.\n- **Gate rule:** phases 0 to 3 run in minutes on every firmware build as a smoke gate. Phases 4 to 6 run nightly. Phases 7 to 10 run weekly and at the release gate.\n- **Traceability:** give each requirement an ID and link tests to it. The generic method (pyramid, traceability, statistics, metrics) is on the NVMe page, Validation Methodology module. This module covers what is specific to zones.","pitfall":"Starting with fio workloads because they are easy, then finding that setup and verification relied on a broken Reset or report.","verify":"Which optional zoned features (ZRWA, Zone Active Excursions, variable capacity) your target spec revision defines, since phases 4 to 8 depend on the profile.","follow":[{"q":"Why do Reset and Report Zones come early?","a":"Nearly every other test uses them for setup and verification, so a defect there changes the meaning of later results."},{"q":"Which phase catches the most escapes?","a":"Usually 2 to 4 for logic and 6 for recovery, so weight the effort there, not on happy-path throughput."}],"mod":10},{"id":"10.02","level":"Basic","type":"Concept","fig":null,"tags":["fixtures","known-state","reset-all","quarantine","precondition","isolation"],"q":"How do you put a zoned drive into a known starting state before a test, and why is that harder than on a conventional drive?","short":"Inventory every zone with Report Zones, quarantine Read Only and Offline zones, bring the rest to Empty with Reset (Select All only touches Open, Closed and Full zones), then report again. Fail the setup, not the test, if any healthy zone is not Empty or any zone is still active. Each test then draws zones from that pool, builds the states it needs, and a teardown returns them to Empty.","deep":"1. **Inventory:** full Report Zones, tally by state, record ZSLBA, ZCAP and attributes per zone (ZCAP can differ per zone with variable capacity).\n2. **Quarantine:** Read Only and Offline zones cannot be reset (Invalid Zone State Transition) and Reset-all skips them. Keep them out of the pool. A quarantine list that grows between tests is a finding in its own right.\n3. **Reset:** Reset-all is one command but slow on a full drive (see the Reset-all numeric question in Module 4). On a shared rig reset only the zones the run owns.\n4. **Verify preconditions:** pool zones are Empty with WP = ZSLBA, the active and open counts from the report are zero, no unread Zone Descriptor Changed event is pending, and DUT health is unchanged (critical warning, error log entry count).\n5. **Build states on demand:** use the table in 3.17 for how to reach each state, and record how many zones of each state the test needs so it can respect MAR and MOR.\n6. **Isolation:** parallel tests own disjoint zone ranges. MAR and MOR are per namespace, so concurrent tests share one budget and must be given a slice of it.\n7. **Teardown:** Reset or Finish what the test touched, re-report and check. On a failure keep the state for debug instead of cleaning up.\n\nThe contrast with a conventional drive: there, a state such as \"full and fragmented\" is reached by running a workload. Here the state is explicit and per zone, some states are unreachable by commands, and the number of zones in the active and open states is capped.","pitfall":"Assuming Reset-all yields an all-Empty namespace. It skips Read Only and Offline zones, so after a fault test part of the drive stays unusable.","verify":"The effect of Format NVM on zone state and attributes in the ZNS Command Set Specification.","follow":[{"q":"Does Format NVM put a zoned namespace back to Empty?","a":"Expected to, but it costs a full-device erase and consumes PE cycles, so prefer targeted Reset and keep Format for rig recovery."},{"q":"What if Reset-all leaves a healthy zone that is not Empty?","a":"That is a DUT defect. Stop the run rather than continue on a pool you have not verified."}],"mod":10},{"id":"10.03","level":"Basic","type":"Cross-layer","fig":null,"tags":["tools","nvme-cli","blkzone","libzbd","fio","spdk","qemu","passthrough"],"q":"Which tools do you use for what in ZNS validation, and why does the path (direct passthrough or block layer) matter?","short":"Use direct paths to test the drive and the block layer to test the host stack. nvme-cli zns and io-passthru, SPDK and custom ioctls reach the controller unchanged, including illegal commands. blkzone, libzbd and fio's zbd mode go through the Linux zoned block layer, which validates, caches and orders requests. QEMU's zoned NVMe device is the cheap target for model and framework bring-up. Reproduce a failure on two paths before blaming either.","deep":"| Tool | Path | Good for | Blind to |\n|---|---|---|---|\n| nvme zns, nvme io-passthru | Driver passthrough, no block layer checks | Illegal actions, raw CDW fields, exact status, Append | Throughput, host stack behavior |\n| SPDK (spdk_nvme_zns_* API) | User-space driver, your own queues | High QD, Append concurrency, timing, queue-level fault injection | Kernel behavior |\n| blkzone, libzbd | Block layer ioctls | The host-visible zone view, quick state changes | Illegal commands (kernel rejects or rewrites them) |\n| fio with zonemode=zbd | Block layer | Workloads, verify, respecting open zone limits | Negative tests |\n| QEMU zoned NVMe | Emulation | Model bring-up, CI, differential comparison | Timing, media faults, power loss |\n| PCIe analyzer | The wire | CQE contents and order, timing | Firmware state |\n| Python over JSON output | Glue | Model, logging, orchestration | Nothing by itself |\n\n- **Rule of two paths:** a failure seen through the block layer is reproduced with passthrough (does the SSD do it?), and one seen with passthrough is reproduced through the kernel path (does the host stack cope?).\n- **Structured output:** run nvme-cli with JSON output and parse it in Python instead of scraping text, and log raw CQE fields for every command.\n- **Kernel view:** the zoned block layer may cache zone information, so a kernel-reported zone can lag the device. Use nvme-cli report-zones for ground truth.\n- **Illegal tests:** send them only by passthrough or SPDK.","pitfall":"Drawing conclusions about the SSD from a test that went through the block layer. If Linux rejected, reordered or merged the request, the drive never saw what you think.","verify":"Subcommand and option names on your nvme-cli, libzbd and fio versions, the SPDK zns function names in spdk/nvme_zns.h, and the QEMU zoned option names (zoned.zone_size, zoned.zone_capacity, zoned.max_open, zoned.max_active, zoned.zasl).","follow":[{"q":"Why can an illegal-command test silently test Linux?","a":"The block layer checks alignment and zone state and can fail the request itself, so the SSD never sees the command."},{"q":"Which tool issues Zone Append?","a":"Passthrough (io_uring passthrough or nvme io-passthru) or SPDK. Ordinary block writes are not Appends."}],"mod":10},{"id":"10.04","level":"Intermediate","type":"Concept","fig":null,"tags":["boundary","zcap","zsze","namespace-end","status","gap"],"q":"Which boundary cases do you build for Write, Read and management commands, and what is expected at each?","short":"Put cases at every edge of one geometry: WP, ZCAP minus 1, ZCAP, ZSZE minus 1, the next zone start and the namespace end. A write ending exactly at ZCAP succeeds and makes the zone Full. One block more fails with Zone Boundary Error and writes nothing. Reads past ZCAP inside a zone return unwritten data, cross-zone reads depend on the Read Across Zone Boundaries bit, and management SLBAs must be zone starts.","deep":"Geometry: 4 KiB LBAs, ZSZE = 0x10000, ZCAP = 0xDC00, so zone 2 starts at 0x20000, its writable range ends at 0x2DC00 and zone 3 starts at 0x30000.\n\n| Case (zone 2 Open, WP = 0x2DBF8 unless noted) | Expected |\n|---|---|\n| Write 8 blocks at WP (ends at ZCAP) | Success, zone becomes Full |\n| Write 16 blocks at WP (8 too many) | Zone Boundary Error (B8h), nothing written, WP unchanged |\n| Write 1 block at WP + 1 | Zone Invalid Write (BCh) |\n| Write 1 block at 0x2DC00 (first LBA above ZCAP) | Rejected. BCh or B8h depending on check order, record which |\n| Write 1 block to a Full zone | Zone Is Full (B9h) |\n| Write 1 block at the namespace size | LBA Out of Range (generic status 80h) |\n| Read 8 blocks at 0x2DBFC (spans ZCAP, same zone) | Success, blocks at or above ZCAP return the unwritten value |\n| Read 8 blocks at 0x2FFFC (spans into zone 3) | Success if Read Across Zone Boundaries is 1 and both zones are readable, else Zone Boundary Error |\n| Read 8 blocks ending past the namespace end | LBA Out of Range |\n| Zone management with SLBA = ZSLBA + 1 | Invalid Field in Command (ZNS 1.4, 3.4.3) |\n| Zone management with SLBA at the namespace size | LBA Out of Range |\n\n- **Side effects:** after every rejected command, report the zone and read back the neighbors. Nothing may change.\n- **Repeat per state:** the same LBA gives different statuses in Empty, Closed, Full, Read Only and Offline zones.\n- **Repeat per profile:** with ZCAP = ZSZE there is no gap, and a write that runs past the last LBA of zone 2 crosses into zone 3 and gets Zone Boundary Error.\n- **Other places:** first and last zone, and 512 B and 4 KiB formats.","pitfall":"Testing boundaries only on Empty zones and only with Write. The same LBA and length can produce a different status in each state and command.","verify":"The status for a write to an LBA above ZCAP that is not at the WP, and the order of state and range checks, in the ZNS Command Set Specification. (Read Across Zone Boundaries is OZCS bit 0, ZNS 1.4, Figure 49.)","follow":[{"q":"Why test the gap between ZCAP and ZSZE?","a":"It is addressable space that must never hold data. Firmware that sizes zones by ZSZE instead of ZCAP fails only there."},{"q":"Why record which of two defensible statuses the drive returns?","a":"A later change of behavior is then flagged even though both codes are legal."}],"mod":10},{"id":"10.05","level":"Intermediate","type":"Concept","fig":null,"tags":["report-zones","filters","pagination","partial","extended","zrasf"],"q":"How do you test Report Zones itself: filters, partial reports, extended reports and pagination?","short":"Give Report Zones its own oracle. With zones in a known mix of states, check that each state filter returns exactly the model's zone set in ascending order, that the seven state filters together equal the unfiltered report, that any chunk size paginates with no lost or repeated zone, that Partial Report changes only the header count, and that undersized buffers, reserved values and odd SLBAs behave as specified. The command must also change nothing.","deep":"1. **Population:** at least one zone in every state you can reach, interleaved so filtered results are not contiguous (Empty, Open, Empty, Full, Closed, and so on).\n2. **Filter equality:** for each ZRASF value compare the returned set to the model's. The seven per-state counts must add up to the zone count, which is NSZE / ZSZE.\n3. **Pagination:** read with 1, 2, 7 (an awkward prime), 64 and MDTS-sized buffers, advancing by ZSZE from the last returned ZSLBA. Every merged result must equal one big read taken at quiescence.\n4. **Header count:** repeat with Partial Report 0 and 1 and with a header-only buffer, and compare the Number of Zones with what fits and what matches.\n5. **Extended reports:** ZDES bytes follow each descriptor. For ZDEV zones the bytes equal what was set. For the others they are not asserted.\n6. **Negative cases:** NUMD too small for a header, reserved ZRA or ZRASF values, SLBA at or past the namespace end, SLBA inside a zone (record accept or reject), and the command sent to a non-zoned namespace.\n7. **Under load:** reports are samples at some instant. On zones being written assert bounds and monotonic WP only. On idle zones assert exact equality.\n8. **No side effects:** compare state and WP before and after thousands of reports, including during writes to other zones.","pitfall":"Treating a report taken with commands in flight as an exact snapshot. It is a valid sample of some instant, so assert bounds, not equality.","verify":"Partial Report header semantics, and the status for reserved ZRA or ZRASF values and for an SLBA inside a zone (see 4.02 and 4.08). (ZRASF Full and Read Only are confirmed as 05h and 06h, ZNS 1.4, 3.4.2, Figure 35.)","follow":[{"q":"Why check that the filters add up to the unfiltered report?","a":"A filter that silently drops or double counts a state would hide inside a spot check."},{"q":"Why use awkward chunk sizes?","a":"Firmware loops over descriptors in batches, and off-by-one bugs appear when the chunk does not divide the zone count."}],"mod":10},{"id":"10.06","level":"Intermediate","type":"Concept","fig":null,"tags":["capability","profile","gating","zoc","ozcs","zdes","mar","mor"],"q":"How do you keep one ZNS suite valid across drives with different optional features, and what do you test when a feature is absent?","short":"Read the capability profile first (ZOC bits, the Read Across Zone Boundaries bit in OZCS, MAR and MOR, ZDES per LBA format, ZASL against MDTS, recommended limits, DLFEAT, volatile write cache). Give each test a requires-list and a defined expectation when the capability is absent. Absent means test the rejection or the invariant, not skip. Store the profile with every result and fail a build whose profile changed without notice.","deep":"| Capability | If present | If absent |\n|---|---|---|\n| Variable Zone Capacity | Per-zone ZCAP in the model, ZCAP may change after Reset | Every zone reports the same ZCAP and Reset never changes it |\n| Zone Active Excursions | Controller Finish sets ZFC, resources are freed, host policy is exercised (6.17) | ZFC is never set. A controller-finished zone is a defect |\n| Read Across Zone Boundaries | Cross-zone read succeeds when both zones are readable | Cross-zone read returns Zone Boundary Error |\n| Zone descriptor extensions (ZDES > 0) | Set Zone Descriptor Extension and Extended Report round trip | Command rejected, ZDEV never set |\n| Finite MAR and MOR | Limit tests, eviction, exact error codes (6.15) | No limit (FFFFFFFFh): open zones up to a large count and confirm no spurious Too Many Open or Too Many Active |\n| ZASL below MDTS | Append at ZASL passes, ZASL + 1 fails | ZASL = 0: Append limited by MDTS, test at MDTS |\n| Volatile write cache | Durability tests need Flush or FUA to define the lower bound | Completed means durable, so the oracle is stricter |\n\n- **Data-driven profile:** capture Identify Controller, the zoned Identify Namespace data and Get Features output as JSON, hash it and store the hash with each result.\n- **Drift gate:** if the hash changes between builds and nobody announced it, stop. A silently changed capability invalidates the baseline.\n- **Expectation table:** tests read expected results from the profile, they do not hard-code one drive's numbers.","pitfall":"Encoding the first drive's profile as the expected values. The suite then fails on every other drive or passes vacuously.","verify":"ZOC and OZCS bit positions (module 2), the meaning of ZASL = 0, and the variable-capacity completion bit for Reset, in the ZNS Command Set Specification.","follow":[{"q":"Why test the rejection when a feature is absent?","a":"A drive that accepts a command it does not advertise is defective, and a host that trusts Identify will misbehave."},{"q":"What if the profile claims a feature you cannot exercise, such as Active Excursions?","a":"Record it as not covered with an owner and a plan, never as a pass."}],"mod":10},{"id":"10.07","level":"Intermediate","type":"Concept","fig":null,"tags":["fuzzing","state-aware","mutation","oracle","shrinking","seed"],"q":"How do you fuzz a ZNS device so it reaches deep zone logic, and how does the oracle still judge each result?","short":"Generate commands from the model's current zone states so most are structurally valid and land in interesting cells, then mutate one field at a time toward boundaries: ZSA and ZRA values, Select All, SLBA at zone starts, gaps and the namespace end, NUMD and NLB at their limits, Append size at ZASL. The model gives the allowed status set and every case also asserts nothing else changed. Log the seed and shrink failures to a short sequence.","deep":"- **Levels:** single-command field fuzzing, sequence fuzzing (legal and illegal orders across states), and concurrency fuzzing (several queues, races between management commands and I/O).\n- **State steering:** pick the target zone by state with probability inversely proportional to how often that state has been seen, so Full, Closed-with-data and at-the-limit cases get exercised instead of endless Empty-zone writes.\n- **Fields worth attacking:**\n  - ZSA over all 256 values, with and without Select All.\n  - Reserved bits in CDW13 and reserved ZRA and ZRASF values.\n  - SLBA at zone start, plus 1, mid-zone, ZSLBA + ZCAP, last LBA, namespace size and all ones.\n  - NLB and NUMD at 0, 1, the limit and limit plus 1.\n  - Append at ZASL and ZASL + 1, Append to a non-zone-start, and zoned commands to a non-zoned namespace.\n- **Oracle:** a permitted status set from the model, an unchanged-state check (Report Zones for touched zones plus a random sample of the rest), the controller still ready, and a known-good command succeeding afterward.\n- **Shrinking:** delete commands and zones while the divergence persists. State-dependent bugs need their prefix, so shrink the prefix too and keep the smallest sequence that still fails.\n- **Safety:** Format, Sanitize and firmware commit stay out of the mutation set unless the run is on a designated DUT.","pitfall":"A fuzzer whose only oracle is \"the drive did not crash\". Wrong statuses and silent state changes pass unnoticed.","verify":"nvme-cli passthrough option names on your version, and which reserved fields the specification requires to be rejected with Invalid Field rather than ignored.","follow":[{"q":"Why not fuzz with random bytes?","a":"Almost every command dies at the first field check and zone logic is never reached. See the NVMe page, Validation Methodology module."},{"q":"How do you know the fuzzer reached deep states?","a":"Count each state x command cell and each status code observ
