ion layer or a rewrite is needed.","pitfall":"Presenting ZNS only as savings. The savings are paid for in host complexity, and some workloads never recover that cost.","verify":null,"follow":[{"q":"What is the biggest risk of moving GC to the host?","a":"Foreground I/O and GC interfering with each other, so you rebuilt the tail latency problem in software."},{"q":"Which of these does a device validator test?","a":"Enforcement of every rule: rejecting misordered writes, respecting limits, honest state reporting."}],"mod":1},{"id":"1.11","level":"Advanced","type":"Concept","fig":null,"tags":["lsm","f2fs","btrfs","rocksdb","log-structured"],"q":"Which host software fits zoned storage naturally, and why does lifetime alignment matter?","short":"Software that already writes sequentially and deletes data in large batches fits best: LSM-tree databases such as RocksDB (through the ZenFS plugin), log-structured filesystems such as F2FS, and copy-on-write filesystems such as Btrfs in zoned mode. Their files or segments die together, so if they map to the same zone, a reset frees it with almost no copying. Poor alignment turns every zone reset into a copy job.","deep":"- **LSM trees:** SSTables are written once, sequentially, and deleted whole after compaction. Files created at the same level or time have similar lifetimes.\n- **F2FS:** log-structured, with segments and its own cleaner. It has supported zoned block devices for host-managed SMR and ZNS.\n- **Btrfs:** copy-on-write allocation was extended with a zoned mode for host-managed devices (Linux 5.12).\n- **Poor fits:** ext4 has no zoned mode, and update-in-place B-tree engines have to be redesigned or placed behind a translation layer.\n- **Lifetime hints:** the deciding factor is whether the software can tell the allocator which data will die together. RocksDB gives write lifetime hints per file, and ZenFS uses them to pick zones.\n- **Validation angle:** a device test suite should mimic these patterns, such as many zones opened at once and whole-zone resets in bursts, not just a single sequential stream.","pitfall":"Assuming that any log-structured design maps well. If different lifetimes are interleaved in the same zone, host GC copies as much as device GC would have.","verify":"Kernel versions for F2FS and Btrfs zoned support and current XFS zoned support; ZenFS maintenance status. Detailed stack coverage is in the Host Software Stack module.","follow":[{"q":"What does dm-zoned do?","a":"It exposes a zoned device as a regular block device by adding a translation and GC layer, which reintroduces some of what ZNS removed."},{"q":"Why do lifetime hints have such leverage?","a":"They decide zone occupancy, which decides victim validity and therefore host WAF."}],"mod":1},{"id":"1.12","level":"Advanced","type":"Trap","fig":null,"tags":["trap","ftl","waf","firmware"],"q":"A colleague says ZNS SSDs have no FTL and no write amplification. What is wrong with that?","short":"Both claims are false. The FTL shrinks but still does zone-to-block mapping, bad block management, wear leveling, ECC, read disturb and retention refresh, write buffering with power-loss protection, and zone state persistence. Write amplification does not vanish either: it moves to the host GC, plus a device residual from padding, metadata and media management. The end-to-end figure is the product of application, host and device factors.","deep":"- **What stays in firmware:**\n  - Zone-to-erase-block allocation and mapping, including replacement of grown bad blocks, or moving a zone to Read Only or Offline when spares run out.\n  - Wear leveling across the pool of free blocks, since zone resets do not wear evenly by themselves.\n  - LDPC and read retry, read disturb management, data retention refresh.\n  - Write buffer, power-loss capacitors, recovery of write pointers and zone states after an unsafe shutdown.\n  - Zone state machine enforcement, resource accounting, and error reporting.\n- **Where WAF comes from now:**\n  - Application: compaction or cleaning inside the software.\n  - Host zone GC: copying live data before reset.\n  - Device: padding during Zone Finish or close, metadata, refresh, and internal relocation, often small.\n- **Formula:** total WAF = application x host GC x device.\n\nThe correct claim is \"ZNS removes the device GC that comes from overwrite remapping, and gives the host the means to reduce WAF\".","pitfall":"Answering \"yes, WAF is 1\" when asked about ZNS. It is device WAF that approaches 1 for well-aligned workloads, not the system's.","verify":null,"follow":[{"q":"How would a validator catch a firmware that quietly relocates zone data?","a":"Compare media-written counters against host-written bytes on a zone-aligned, whole-zone-reset workload, where the expected device WAF is close to 1."},{"q":"Why is the device firmware still complex?","a":"Media management, power-loss safety and error handling are unchanged, and the zone state machine is a new surface."}],"mod":1},{"id":"1.13","level":"Advanced","type":"Debug","fig":null,"tags":["debug","fio","waf","latency","steady-state"],"q":"Random-write p99.9 latency on a conventional SSD spikes 50x above the median every few seconds after the drive fills. How do you prove GC is responsible, and what would you compare on a ZNS drive?","short":"Precondition to steady state, run a timed fio job with per-second latency logs, and read the media-written and host-written counters before and after. If the spikes track a WAF well above 1 and disappear when the same data is written to zones and reset whole, GC is the cause. Then repeat on ZNS with zone-aware writes and compare percentile latency versus time, and total media writes, not just averages.","deep":"1. Precondition: fill the drive sequentially twice, then run random 4 KiB writes for at least one to two drive capacities, until throughput is stable. Record fill percentage.\n2. Measure, with logs:\n```\nnvme smart-log /dev/nvme0\nfio --name=rw --filename=/dev/nvme0n1 --direct=1 --ioengine=io_uring \\\n    --rw=randwrite --bs=4k --iodepth=32 --time_based --runtime=1800 \\\n    --write_lat_log=lat --log_avg_msec=1000 --percentile_list=50:99:99.9:99.99\nnvme smart-log /dev/nvme0\n```\n3. Compute WAF: media bytes written during the run divided by host bytes written. Host bytes come from Data Units Written (units of 512,000 bytes). Media bytes come from a vendor or OCP extended log.\n4. Correlate: plot the lat log against time. GC-driven spikes are periodic and scale with fill, and WAF rises as the drive fills. A single spike at time zero is a warm-up artifact, not GC.\n5. Control: repeat at 50 percent fill. If spikes vanish, GC pressure is the variable.\n6. ZNS side: check `cat /sys/block/nvme0n2/queue/zoned` shows `host-managed`, write sequentially with zone-aware fio (`--zonemode=zbd`), and reset whole zones. Expect WAF near 1, flatter latency, and reset time visible as its own event.\n\n| Illustrative result | Conventional (fill 90%) | ZNS (zone-aligned) |\n|---|---|---|\n| WAF | 3 to 5 | about 1.0 to 1.1 |\n| p99.9 / median | tens of x | a few x |\n\nThe table is illustrative, not measured data.","pitfall":"Reading a latency histogram without time. Averaged percentiles hide the periodicity that identifies GC.","verify":"The `nvme ocp smart-add-log` plugin name and the physical media written field name in the OCP log; fio option names against the installed fio version.","follow":[{"q":"What if ZNS shows spikes anyway?","a":"Suspect zone reset or finish stalls, host GC contention, too many open zones, or media retries. Correlate with timestamps of those operations."},{"q":"Why does fio need direct=1 for zonemode=zbd?","a":"Buffered I/O is reordered by the page cache and cannot honor the write pointer."}],"mod":1},{"id":"1.14","level":"Principal","type":"Cross-layer","fig":null,"tags":["fdp","zns","conventional","data-placement","comparison"],"q":"Compare conventional, FDP and ZNS as ways to place data on an SSD, and say how validation changes for each.","short":"Conventional gives full compatibility and pays in OP, DRAM and WAF. FDP keeps normal writes but lets the host tag them with a placement identifier so the device groups data by lifetime. The device still does GC, and it is backward compatible. ZNS forces sequential zones and hands GC to the host, giving the largest savings and the largest software burden. Validation shifts from a plain LBA workload, to hint behaviour, to a strict state machine.","deep":"| Aspect | Conventional | FDP | ZNS |\n|---|---|---|---|\n| Write rule | Any LBA, any order | Any LBA, plus placement hint | Sequential per zone |\n| Who does GC | Device | Device | Host |\n| Host changes needed | None | Optional tagging | Zone-aware software |\n| Compatibility | Full | Works with legacy software | Requires zone-aware host |\n| DRAM and OP savings | None | Moderate, less GC pressure | Largest |\n| Failure of host discipline | None | Falls back to normal WAF | Errors or host-side GC storm |\n\n- **FDP in brief:** specified by TP 4146 (ratified late 2022). Terms include Reclaim Unit, Reclaim Group, Reclaim Unit Handle and Placement Identifier. It has a log with host-written and media-written statistics.\n- **Design choice:** if the workload has clean lifetime groups and the team owns the software, ZNS gives the strongest gains. If software is mixed or third-party, FDP gets much of the WAF benefit with less risk.\n- **Validation implications:**\n  - ZNS: state machine and illegal-transition coverage, resource limits, Zone Append ordering, error status codes.\n  - FDP: Reclaim Unit Handle behaviour, placement identifier validation, statistics log accuracy, behaviour under hint misuse.\n  - Conventional: steady-state WAF and QoS under preconditioning.\n- **Market view, hedged:** FDP is often described as easier to adopt, but this should be confirmed against current deployments.","pitfall":"Framing this as \"best technology wins\". The right answer depends on software ownership, workload lifetimes and operational risk.","verify":"FDP TP number and ratification date, FDP log page and term names in the current NVMe Base Specification; any statement about market adoption of ZNS versus FDP.","follow":[{"q":"Can one drive offer both?","a":"Possibly as different namespaces or configurations, but treat that as vendor-specific and check Identify and configuration data."},{"q":"What does FDP lose relative to ZNS?","a":"Placement is a hint and the device still runs GC, so WAF is lower but not host-guaranteed to approach 1, and OP is not fully eliminated."}],"mod":1},{"id":"1.15","level":"Principal","type":"Scenario","fig":null,"tags":["migration","tco","decision","validation-risk"],"q":"A customer asks whether to move a storage fleet from conventional NVMe SSDs to ZNS. How do you build the case, and what do you validate first?","short":"Start from the workload: measure its overwrite pattern, data lifetimes, baseline WAF and tail latency at production fill. Prototype the zone-aware software with host GC and measure end-to-end WAF, latency and CPU cost. Build a cost model for DRAM, OP, endurance and operations. Then set go or no-go gates and validate the device rules the software will lean on, including limits, error handling and power-loss recovery.","deep":"1. **Characterize:** capture write traces (block trace or application counters) and estimate the data death-time distribution. Small random in-place updates or unpredictable lifetimes argue against ZNS. Bulk sequential, append-only or LSM patterns argue for it.\n2. **Baseline:** on the current drives at 70 to 90 percent fill, record WAF, p99 and p99.9 latency and throughput after preconditioning.\n3. **Prototype:** run the actual software (or a faithful replay) on ZNS with a real host GC. Record end-to-end WAF, GC CPU use, GC bandwidth share and tail latency.\n4. **Cost model:** exported capacity per dollar (OP), DRAM and power, drive life in years from WAF, and the engineering and operations cost of new tooling and telemetry.\n5. **Software readiness:** minimum kernel, filesystem and tool versions, firmware update and drive replacement procedures, support for multiple vendors with different zone size and limits.\n6. **Device validation gates:** vendor-to-vendor differences in open and active zone limits and zone append size; behaviour on unsafe shutdown (write pointer recovery); Read Only and Offline zone handling; reset and finish latency; long-run stress with injected errors.\n7. **Decide:** set thresholds in advance, for example a minimum cost or endurance gain at equal p99.9, and a rollback path.\n\n- **Hidden costs:** host CPU for GC, engineering time, fewer drive vendors, and smaller test coverage in the field.","pitfall":"Deciding on vendor datasheet WAF. The decision depends on the customer's workload and the customer's software.","verify":null,"follow":[{"q":"What single result would make you stop?","a":"Prototype end-to-end WAF close to the conventional baseline, because the host GC then erased the gain."},{"q":"How do you de-risk a phased rollout?","a":"Canary a small fleet slice with full telemetry on zone events, resets and media errors, and keep data restorable to conventional drives."}],"mod":1},{"id":"1.16","level":"Principal","type":"Cross-layer","fig":null,"tags":["waf","benchmark","methodology","stack"],"q":"How do you fairly quantify the benefit of ZNS for a database workload, and what does the arithmetic look like across the stack?","short":"Compare at the same exported capacity or cost, same fill, and steady state, and measure write amplification at every layer. Total WAF is application x host GC x device. With assumed factors of 10 x 3 = 30 on a conventional SSD versus 10 x 1.2 x 1.05 = 12.6 on ZNS, the media wear falls about 2.4 times. Application WAF is unchanged, so it caps the possible gain.","deep":"Assumptions (hypothetical): leveled LSM compaction gives application WAF 10; the conventional device WAF is 3; ZNS host GC WAF is 1.2 and device WAF is 1.05.\n1. Conventional: 10 x 3 = 30 NAND bytes per user byte.\n2. ZNS: 10 x 1.2 x 1.05 = 12.6 NAND bytes per user byte.\n3. Ratio: 30 / 12.6 = about 2.4 times less wear, or 2.4 times more sustained writes for the same endurance.\n4. Application WAF (the 10) is the same in both, so ZNS cannot fix it. Reducing it needs a different compaction strategy.\n\nMethod for fairness:\n- **Equal footing:** same NAND, same host-visible capacity or same cost, same fill and dataset, same CPU budget, and the same steady-state definition (for example throughput stable within 5 percent over a window).\n- **Measure each layer:** application counters (user bytes versus bytes written to files), host GC counters (bytes relocated), device counters (media versus host bytes). Do not infer one from the others.\n- **Report tails and CPU:** p99.9 over time, and host CPU per GB written.\n- **Repeat:** several runs with variance, since GC behaviour is chaotic.\n- **Sensitivity:** vary fill and lifetime alignment. The gain should degrade in a predictable way as alignment worsens.\n\n- **Pitfall in the design:** an unfair baseline, such as comparing ZNS against a conventional drive left at 7 percent OP with a tuned software stack against a stock one.","pitfall":"Attributing the whole gain to ZNS when part of it came from better software lifetime hints that would also help a conventional drive.","verify":"The example factors are assumptions, not measurements; label them as such in any presentation.","follow":[{"q":"What single metric would you present to management?","a":"Cost per user byte written over the drive lifetime at target p99.9, which combines capacity, endurance and QoS."},{"q":"How does validation feed the model?","a":"Firmware defects that add hidden relocation show up as device WAF above about 1.05 in the zone-aligned test, which directly weakens the case."}],"mod":1},{"id":"2.01","level":"Basic","type":"Concept","fig":null,"tags":["architecture","command-set","nvme-2"],"q":"Where does ZNS sit in the NVMe architecture, and is it a different kind of device?","short":"ZNS is not a different kind of drive. It is an I/O command set, the Zoned Namespace Command Set, layered on the common NVMe Base architecture. Since NVMe 2.0 the specifications are split into the Base Specification, command set specs (NVM, Zoned Namespace, Key Value), transport specs (PCIe, RDMA, TCP) and NVMe-MI. One controller can serve NVM namespaces and zoned namespaces together, because the command set is a property of each namespace.","deep":"- **Base specification:** queues, doorbells, admin commands, controller registers, status field, namespace management. All of it is unchanged for ZNS (see the NVMe page).\n- **NVM Command Set:** Read, Write, Flush and friends. The ZNS command set is built on top of it: a zoned namespace accepts most NVM commands, with changed rules, and adds Zone Append, Zone Management Send and Zone Management Receive.\n- **Transport independence:** the same zoned command set runs over PCIe, RDMA or TCP. Nothing in the zoned model is PCIe specific, so the PCIe page applies as it is.\n- **Per namespace, not per controller:** each namespace has exactly one Command Set Identifier (CSI) fixed when it is created.\n- **History:** ZNS was ratified around 2020 as a Technical Proposal against NVMe 1.4, and became a standalone command set specification when NVMe 2.0 restructured the documents in 2021.\n- **What this means for a validator:** a ZNS test plan is the Base regression plus the NVM command set regression plus the zoned deltas. Most bugs still live in the shared parts.","pitfall":"Treating ZNS as a feature bit of a conventional namespace. A namespace has one CSI from creation, and zoned behavior is not something a host toggles on an existing NVM namespace.","verify":"The technical proposal number and the NVMe revision in which ZNS was first published, in the NVMe specification history.","follow":[{"q":"Can one controller expose both conventional and zoned namespaces?","a":"Yes. The namespace CSI decides which command set governs I/O to it, and the controller advertises support through CAP.CSS and the Identify data."},{"q":"Does ZNS need a new transport or queue model?","a":"No. Same submission and completion queues, same PRP and SGL rules, same admin command set."}],"mod":2},{"id":"2.02","level":"Basic","type":"Concept","fig":null,"tags":["csi","namespace-descriptor","opcodes"],"q":"What is the Command Set Identifier (CSI), and where does it appear?","short":"CSI is an 8-bit value naming an I/O command set: 00h is NVM, 01h is Key Value and 02h is Zoned Namespace. The host reads a namespace's CSI from the Namespace Identification Descriptor list (descriptor type 04h). It also supplies a CSI in Identify to get command-set-specific data, such as the ZNS Identify Namespace structure. Opcodes are interpreted relative to the namespace's command set, so the same opcode can mean different things.","deep":"- **Namespace Identification Descriptor:** Identify with CNS 03h returns a list of descriptors (EUI-64, NGUID, UUID, CSI). The CSI descriptor has type 04h and length 1.\n- **Identify commands:** CDW11 bits 31:24 carry the CSI for the command-set-specific CNS values, so the same CNS can return NVM or ZNS structures depending on CSI.\n- **Other commands that take a CSI:** Get Log Page (the Commands Supported and Effects log is per command set) and namespace creation through Namespace Management.\n- **Not in every command:** an I/O SQE has an opcode and an NSID, not a CSI. The controller finds the command set from the namespace.\n- **Opcode overlap:** opcodes are not globally unique across command sets. The SPDK header lists the Key Value Store command at 01h, the same value as NVM Write. A trace decoder needs the CSI of the target namespace.\n- **Legacy mode:** with CC.CSS at 000b (NVM only) no CSI descriptor is needed, and every namespace is NVM.","pitfall":"Decoding a captured I/O opcode without knowing the CSI of the namespace it targeted.","verify":"Reserved and newer CSI values, and the exact status a controller returns for a zoned opcode sent to an NVM namespace (Invalid Command Opcode is what QEMU returns).","follow":[{"q":"Which CSI values does Linux act on?","a":"00h and 02h. For any other CSI the source I read logs that the block device is not supported for that command set and does not expose a usable block device."},{"q":"What if the host is in multiple-command-set mode and a namespace reports no CSI?","a":"Linux treats it as an error (\"Command set not reported for nsid\") and skips the namespace."}],"mod":2},{"id":"2.03","level":"Basic","type":"Concept","fig":"zonemodel","tags":["zone-size","zone-capacity","write-pointer","lba-space"],"q":"How is a zoned namespace's LBA space divided, and what are zone size, zone capacity and the write pointer?","short":"The LBA space is cut into equal-sized, contiguous, non-overlapping zones. Zone size (ZSZE) is the number of LBAs each zone occupies in the address space, a namespace constant. Zone capacity (ZCAP) is the number of usable LBAs counted from the start of the zone, and is at most ZSZE. Each zone has a write pointer marking the next LBA to be written, which moves only forward until the zone is reset.","deep":"- **Layout:** zone n starts at LBA n x ZSZE. The first zone starts at LBA 0, so a zone start LBA (ZSLBA) is always an exact multiple of the zone size.\n- **Zone type:** every zone in a zoned namespace is sequential-write-required (zone type 2h in the descriptor). There are no conventional zones. A host that wants random-write space uses a separate NVM namespace.\n- **Size versus capacity:** the LBAs at zone offsets ZCAP to ZSZE-1, that is above ZSLBA+ZCAP-1, are not usable. The split lets the zone size stay a round number for address math while the device picks a capacity that fits its NAND geometry.\n- **Write pointer:** an LBA inside the zone, reported in the zone descriptor. Writes land at it and advance it. Zone states and the exact WP rules are module 3.\n- **Capacity totals:** the namespace size covers all zones at ZSZE each. Usable capacity is the sum of the ZCAP values (zonedstorage.io).","pitfall":"Assuming the whole address range up to ZSZE is usable. The gap between ZCAP and ZSZE is address space with no storage behind it.","verify":"ZNS 1.4 does not state whether NSZE must be an exact multiple of ZSZE (Annex A.5 shows equal zones but does not require the total to divide evenly). WP validity per zone state is resolved in module 3 (Figure 4: valid only in Empty, Implicitly Opened, Explicitly Opened and Closed).","follow":[{"q":"Can zones in one namespace have different sizes?","a":"No. Zone size is a namespace-wide constant. Only capacity may differ per zone, and only when the Variable Zone Capacity bit in ZOC is set."},{"q":"Why is the write pointer an LBA and not a byte offset?","a":"All NVMe addressing is in logical blocks, and the size of a block depends on the LBA format in use."}],"mod":2},{"id":"2.04","level":"Intermediate","type":"Concept","fig":null,"tags":["cap-css","cc-css","command-set-selection","init"],"q":"How does a host enable zoned command sets: what do CAP.CSS and CC.CSS do?","short":"CAP.CSS (bits 44:37) says which selection modes the controller supports: bit 0 for NVM command set only, bit 6 for one or more I/O command sets, bit 7 for admin only. The host writes CC.CSS (bits 6:4) before or with the write that sets CC.EN. The value 000b selects NVM only, 110b selects all supported I/O command sets, and 111b admin only. Zoned namespaces need 110b, and Linux writes 110b whenever CAP.CSS bit 6 is set.","deep":"| CC.CSS | Mode | Effect |\n|---|---|---|\n| 000b | NVM Command Set only | Legacy behavior, only NVM namespaces are usable |\n| 110b | All supported I/O command sets | Namespaces use their own CSI, so ZNS works |\n| 111b | Admin Command Set only | No I/O command set, admin commands only |\n\n- **Init order:** read CAP, choose CSS, write CC with EN=1, wait for CSTS.RDY, then Identify Controller, the namespace lists and the namespace descriptors.\n- **Change rule:** CSS is a field the host sets while the controller is disabled. Changing the mode means a disable and re-enable, so it cannot be flipped on a running controller.\n- **I/O Command Set Profile:** Set Features feature ID 19h selects which combination of command sets is enabled. The Linux and SPDK code I read do not set it and use the controller default.\n- **Validation loop:** for every CSS value, both those advertised in CAP.CSS and those not, enable the controller and check the outcome: RDY, CFS, and which namespaces enumerate.","pitfall":"Enabling with CSS 110b on a controller whose CAP.CSS does not advertise bit 6. Read CAP first.","verify":"CAP bit range 44:37 and CC bit range 6:4, the default and semantics of the I/O Command Set Profile feature (FID 19h), and controller behavior for an unsupported CSS value.","follow":[{"q":"What does a driver stuck in 000b mode see on a ZNS drive?","a":"It cannot use the zoned namespaces. Whether they are hidden or listed but inaccessible is set by the spec, so a validator should record what the drive does."},{"q":"Why does Linux keep the CSS choice in its saved controller config?","a":"It re-writes CC on every reset and needs to know if it is in multiple-command-set mode to demand a CSI descriptor per namespace."}],"mod":2},{"id":"2.05","level":"Intermediate","type":"Concept","fig":null,"tags":["identify","cns","csi","structures"],"q":"Which Identify commands does a host use to learn about a zoned namespace, and what does each return?","short":"The generic ones are Identify Controller (CNS 01h), Identify Namespace (00h) and the descriptor list (03h, which carries the CSI). Command-set-specific ones take a CSI in CDW11: CNS 05h returns the ZNS Identify Namespace structure, CNS 06h the ZNS Identify Controller structure (ZASL), and CNS 07h lists active namespaces for one command set. CNS 08h returns an I/O-command-set-independent namespace structure.","deep":"| Identify | CNS | CSI needed | Returns |\n|---|---|---|---|\n| Namespace | 00h | no | NSZE, NCAP, NUSE, LBA formats, FLBAS |\n| Controller | 01h | no | Controller-wide capabilities |\n| Namespace descriptors | 03h | no | EUI-64, NGUID, UUID, CSI |\n| I/O CS Namespace | 05h | yes (02h) | ZOC, OZCS, MAR, MOR, RRL, FRL, per-LBAF ZSZE and ZDES |\n| I/O CS Controller | 06h | yes (02h) | ZASL |\n| Active NS list for a CSI | 07h | yes | NSIDs using that command set |\n| I/O CS Independent Namespace | 08h | no | Attributes not tied to a command set |\n\n- **Size:** every structure is 4096 bytes.\n- **Linux sequence (as of the source I read):** descriptor list first, then the independent structure (CNS 08h) when the controller reports NVMe 2.0 or later, else CNS 00h. For a zoned namespace it then reads CNS 05h with CSI 02h. The first zoned namespace also triggers CNS 06h with CSI 02h to get ZASL.\n- **Why split it:** command-set-specific data moves to CNS 05h and 06h, so NVM software keeps parsing the same generic structures unchanged.","pitfall":"Issuing CNS 05h or 06h with the wrong or missing CSI. The CSI must match the namespace or command set you ask about.","verify":"CNS 1Ch (the I/O command set combinations structure) and CNS 08h availability by revision, and the error a controller returns for a CSI mismatch.","follow":[{"q":"Is ZASL per namespace?","a":"No. It sits in the controller structure (CNS 06h, CSI 02h), so it is one value for all zoned namespaces of that controller."},{"q":"Where does the zone size live?","a":"In the ZNS Identify Namespace structure, in the LBA format extension entry that matches the LBA format in use."}],"mod":2},{"id":"2.06","level":"Intermediate","type":"Concept","fig":null,"tags":["identify-ns","zoc","ozcs","mar","mor","zdes","lbafe"],"q":"Walk through the ZNS Identify Namespace structure: what does each field tell the host?","short":"ZOC lists zone operation characteristics (bit 0 Variable Zone Capacity, bit 1 Zone Active Excursions). OZCS lists optional zoned command support (bit 0 Read Across Zone Boundaries). MAR and MOR are the maximum active and open resources, zeroes-based, where FFFFFFFFh means no limit. RRL and FRL are recommended limits for reset and finish. A per-LBA-format extension gives zone size (ZSZE) and zone descriptor extension size (ZDES).","deep":"| Field | Bytes | Meaning |\n|---|---|---|\n| ZOC | 1:0 | Bit 0 variable zone capacity, bit 1 zone active excursions |\n| OZCS | 3:2 | Bit 0 read across zone boundaries |\n| MAR | 7:4 | Max active resources, zeroes-based |\n| MOR | 11:8 | Max open resources, zeroes-based |\n| RRL | 15:12 | Reset recommended limit |\n| FRL | 19:16 | Finish recommended limit |\n| LBAF extension i | 2816 + 16i | 8-byte ZSZE, 1-byte ZDES, 7 reserved |\n\n- **Zeroes-based:** MAR=13 means 14 active zones. Linux adds 1 to both, and the 32-bit wrap of FFFFFFFFh becomes 0, meaning no limit.\n- **ZDES:** in units of 64 bytes, as nvme-cli computes `zdes << 6`. Zero means no extension. Descriptor extensions are module 11.\n- **Extension index:** the entry used is the one matching the namespace's current LBA format, as chosen by FLBAS.\n- **Newer revisions:** later revisions add further recommended-limit fields (RRL1 to RRL3, FRL1 to FRL3, SPDK shows them at bytes 20 to 43), so treat bytes after 19 as revision dependent.","pitfall":"Reading MAR or MOR as counts. They are zeroes-based, and FFFFFFFFh is a sentinel for no limit. Confirmed against ZNS 1.4, Figure 49: all byte offsets above match exactly (ZOC 01:00, OZCS 03:02, MAR 07:04, MOR 11:08, RRL 15:12, FRL 19:16, LBAFEi at 2816+16i). RRL and FRL are in seconds. OZCS also carries a ZRWA Supported (ZRWASUP) bit at bit 1, alongside RAZB at bit 0.","verify":null,"follow":[{"q":"What are MAR and MOR used for?","a":"They bound how many zones can be active and open at once, so the host must budget zones. Module 6 covers this."},{"q":"What does RAZB change?","a":"It says whether one read may span the boundary of two zones. Module 7 covers the read rules."}],"mod":2},{"id":"2.07","level":"Intermediate","type":"Numeric","fig":null,"tags":["zone-size","zone-capacity","lba-math","geometry"],"q":"A namespace reports ZSZE=0x80000, ZCAP=0x6C000 for every zone, 4 KiB LBAs and 512 zones. Work out the sizes, the start of zone 3, and where LBA 2,050,000 falls.","short":"ZSZE is 524,288 blocks, 2 GiB. ZCAP is 442,368 blocks, 1.6875 GiB, so 84.4 percent of each zone is usable. The address space is 512 x 2 GiB = 1 TiB but usable capacity is 864 GiB. Zone 3 starts at LBA 1,572,864 (0x180000), which is sector 12,582,912 in the 512-byte units Linux tools print. LBA 2,050,000 is in zone 3 at offset 477,136, above its capacity, so it is in the unusable gap.","deep":"Assumptions: all zones have the same capacity, no variable zone capacity, 4096-byte LBA format.\n1. Zone size: 0x80000 = 524,288 blocks x 4096 B = 2,147,483,648 B = 2 GiB.\n2. Zone capacity: 0x6C000 = 442,368 blocks x 4096 B = 1.6875 GiB.\n3. Usable fraction: 442,368 / 524,288 = 0.84375.\n4. Address space: 512 x 524,288 = 268,435,456 blocks = 1 TiB.\n5. Usable capacity: 512 x 1.6875 GiB = 864 GiB (927.7 GB in decimal units).\n6. Unusable gap: 512 x (2 - 1.6875) GiB = 160 GiB of address space with no storage.\n7. Zone 3 start: 3 x 524,288 = 1,572,864 = 0x180000. In 512-byte sectors, x8 = 12,582,912 = 0xC00000. Zone 3 ends at LBA 2,097,151 by size, but its last usable LBA is 1,572,864 + 442,368 - 1 = 2,015,231 (0x1EBFFF).\n8. LBA 2,050,000: zone = 2,050,000 div 524,288 = 3. Offset = 2,050,000 - 1,572,864 = 477,136, which is at least 442,368, so the LBA is above the zone capacity.\n- **Linux view:** chunk_sectors and the zone length are 524,288 x 8 = 4,194,304 sectors. Each zone reports its capacity separately, so `blkzone report` shows both.\n- **Test use:** the first LBA beyond capacity and the last LBA of the zone are the natural boundary test points.","pitfall":"Sizing a dataset from the address space (1 TiB) instead of the usable capacity (864 GiB), then running out of zones midway.","verify":"The status a controller returns for a read or write that touches LBAs between ZCAP and ZSZE (module 7).","follow":[{"q":"The device is reformatted to 512-byte LBAs and the same ZSZE block count applies. What changes?","a":"The zone becomes 256 MiB. ZSZE is reported per LBA format, so read the entry for the format in use and never assume a byte size."},{"q":"How would a host find the zone of an LBA fast?","a":"Divide by ZSZE, which is a shift when ZSZE is a power of two. That is why the zone size stays round and the capacity absorbs the odd geometry."}],"mod":2},{"id":"2.08","level":"Intermediate","type":"Concept","fig":null,"tags":["commands","nvm-command-set","zone-append","opcodes"],"q":"Which NVM commands remain valid on a zoned namespace, and which commands are new?","short":"The zoned command set includes the NVM commands and adds three: Zone Management Send (79h), Zone Management Receive (7Ah) and Zone Append (7Dh). Read, Write and Flush are the core. Compare, Verify, Write Zeroes, Dataset Management and Copy are optional in the NVM command set, and a zoned drive advertises which it supports. The write-type commands are now subject to zone rules, so they must respect the write pointer and zone boundaries.","deep":"| Command | Opcode | On a zoned namespace |\n|---|---|---|\n| Flush | 00h | Same as NVM |\n| Write | 01h | Must start at the write pointer (outside a ZRWA), cannot cross the zone capacity, advances the WP |\n| Read | 02h | Allowed, with read rules (module 7) |\n| Compare | 05h | Read-like, optional |\n| Write Zeroes | 08h | Treated as a write, so write rules apply, optional |\n| Dataset Management | 09h | Optional, semantics differ (see below) |\n| Verify | 0Ch | Read-like, optional |\n| Zone Management Send | 79h | New: open, close, finish, reset, offline, set descriptor extension |\n| Zone Management Receive | 7Ah | New: report zones |\n| Zone Append | 7Dh | New: device-chosen write location, optional |\n\n- **Discovery:** do not assume. Read the Commands Supported and Effects log for CSI 02h and check the CSUPP bit for each opcode.\n- **Zone Append is optional in the spec.** Linux requires it: if the log does not show it as supported, the namespace is forced read-only.\n- **Deallocate:** how Dataset Management deallocate interacts with the write pointer and zone state is defined by the zoned spec. A validator should test it against the spec text, not assume it acts as a Reset.\n- **Same queue rules:** these are ordinary NVMe I/O commands with PRP or SGL data and standard status codes.","pitfall":"Concluding from the opcode table that Write Zeroes or Copy work everywhere. They are optional and follow the write rules, so check the effects log. Confirmed against ZNS 1.4: Zone Management Send and Receive are Mandatory and Zone Append is Optional for a ZNS I/O controller (Figure 9). Write Zeroes carries the same zone-specific statuses as Write, so it is fully subject to the write-pointer rules (Figure 21). A Copy command aborts with Zone Boundary Error if either its source range or its destination range spans more than one zone (Figure 14). Dataset Management only marks blocks deallocated; it does not move the write pointer or change zone state the way Reset Zone does (2.1.1.5). Mandatory/optional status of the underlying NVM Command Set commands (Compare, Verify, DSM) stays with the NVM Command Set Specification.","verify":null,"follow":[{"q":"Is a normal Write still allowed on a zoned namespace?","a":"Yes. It succeeds only at the write pointer of a zone that can accept it, so the host must serialize writes to a zone."},{"q":"Which commands can move a write pointer?","a":"Write, Write Zeroes, Zone Append and a Copy destination, plus Zone Management Send actions such as Finish and Reset. Read, Compare, Verify and Flush do not."}],"mod":2},{"id":"2.09","level":"Advanced","type":"Debug","fig":null,"tags":["nvme-cli","id-ns","zoc","linux","decode"],"q":"`nvme zns id-ns` shows the values below, and Linux has no /dev/nvme0n1 block device for the namespace. Decode the output and explain why.","short":"ZOC is 0x2, meaning Zone Active Excursions is supported. The Linux nvme driver, in the source I read, rejects a zoned namespace whenever ZOC is non-zero: it logs that the zone operations are not supported and hides the block device, leaving only passthrough access. The other fields are sane: MAR and MOR of 13 mean 14 zones, and zone size 0x80000 blocks is a power of two. The fix is on the device side (clear ZOC) or a host that supports excursions.","deep":"```\n# nvme zns id-ns /dev/nvme0 -n 1     (fields simplified, formatting varies by nvme-cli version)\nzoc     : 0x2\nozcs    : 0x1\nmar     : 13\nmor     : 13\nrrl     : 0\nfrl     : 0\nlbafe  0: zsze:0x80000 zdes:0 (in use)\nlbafe  1: zsze:0x10000 zdes:0\n\n# dmesg\nnvme nvme0: zone operations:2 not supported for namespace:1\n```\n- **ZOC = 0x2:** bit 1 is Zone Active Excursions. The controller may take a zone out of the active set on its own (module 6). Bit 0, Variable Zone Capacity, is clear.\n- **OZCS = 0x1:** Read Across Zone Boundaries is supported, so a read may span two zones.\n- **MAR = MOR = 13:** zeroes-based, 14 active and 14 open. MOR must not exceed MAR, which holds here.\n- **Which zsze applies:** the LBA format in use, from FLBAS in the plain Identify Namespace. Here entry 0 (0x80000 blocks). Entry 1 is for another LBA format and does not apply.\n- **Why Linux refuses:** the driver checks `id->zoc` and fails the probe with -ENODEV if any bit is set, since it does not implement variable capacity or excursion handling. The core then marks the block device hidden, so no /dev/nvme0n1 appears. Admin and passthrough access through the controller device (and usually a generic /dev/ng0n1 character device) still works, which is why the command above uses `/dev/nvme0 -n 1`.\n- **Debug method:** read dmesg first, then the raw Identify (CNS 05h, CSI 02h) to confirm the bits, then try a host that supports the feature (QEMU-based or SPDK). Compare against the spec's meaning of each bit before calling it a firmware bug.","pitfall":"Blaming the block layer or nvme-cli. The decision was made in the driver from an Identify bit, and the log line names it.","verify":"The exact dmesg string and the ZOC rejection and hidden-disk behavior in the kernel version under test, whether /dev/ng0n1 appears, the nvme-cli display format, and the MOR versus MAR constraint.","follow":[{"q":"Is a non-zero ZOC a firmware bug?","a":"Not by itself. It is a valid capability report. It becomes a compatibility issue with hosts that do not handle it."},{"q":"How would you keep the test host and the drive aligned?","a":"Record the ZOC and OZCS bits per firmware build, and add a gate that fails the run when a build changes them unexpectedly."}],"mod":2},{"id":"2.10","level":"Advanced","type":"Numeric","fig":null,"tags":["zasl","zone-append","mdts","page-size"],"q":"ZASL is 4 and CAP.MPSMIN is 0. What is the largest Zone Append, how does it relate to MDTS, and how do you test the limit?","short":"ZASL is a power-of-two exponent in units of the minimum memory page size. With MPSMIN=0 the page is 4 KiB, so the limit is 2^4 x 4 KiB = 64 KiB, or 16 blocks with 4 KiB LBAs (NLB field value 15, since it is zeroes-based). ZASL zero means the limit is MDTS. Filling a 442,368-block zone at 64 KiB per append takes 27,648 appends. Test the limit, one block above it, and the MDTS interaction.","deep":"1. Page size: 2^(12 + MPSMIN) = 4096 B for MPSMIN=0.\n2. Limit: 2^ZASL x page size = 16 x 4096 = 65,536 B = 64 KiB.\n3. Blocks: 65,536 / 4096 = 16 blocks, so NLB (zeroes-based) is 15.\n4. Appends to fill a zone with ZCAP 442,368 blocks: 442,368 / 16 = 27,648.\n5. In Linux, the limit is stored in 512-byte sectors as `1 << (zasl + 3)`, which is 128 sectors, 64 KiB. With ZASL zero it falls back to the transfer limit derived from MDTS.\n- **Relation to MDTS:** MDTS bounds all data transfers. A ZASL above MDTS would not be usable, so a sane controller keeps ZASL at or below MDTS. Check the spec for the rule.\n- **Non-zero MPSMIN:** the unit grows with the page size. The Linux expression assumes a 4 KiB unit, so a device with MPSMIN>0 needs the formula checked against the driver.\n- **Tests:** append of exactly the limit (must pass), limit plus one block (expect rejection), a limit-sized append at the last position of the zone, and a limit-sized append that would exceed zone capacity.\n- **Queue effect:** a small ZASL forces the host to split large writes, which raises the append count per zone and shapes throughput with QD.","pitfall":"Treating ZASL as a byte count or a block count. It is an exponent in units of the minimum page size. Confirmed against ZNS 1.4, Figure 51: ZASL is in units of CAP.MPSMIN, reported as a power of two, and its value shall be less than or equal to MDTS; 0h means MDTS governs. The exact status code for an oversized append is not zone-specific in the ZNS spec (it falls to the NVMe Base Specification's data-transfer-size handling), and Linux's MPSMIN>0 handling stays an implementation detail to verify on the kernel under test.","verify":null,"follow":[{"q":"What happens when the host sends an append above ZASL?","a":"The controller should reject it as an invalid field. Confirm the status and DNR in the spec. The block layer normally splits before sending."},{"q":"Is ZASL the same as the maximum write size?","a":"No. Normal Writes are limited by MDTS only. ZASL applies to Zone Append."}],"mod":2},{"id":"2.11","level":"Advanced","type":"Trap","fig":null,"tags":["zone-size","power-of-two","lba-format","linux"],"q":"Trap: firmware wants zone size 0x60000 blocks to match a 3-die stripe. Is that legal, and what happens on Linux and on a 512B/4K reformat?","short":"The spec does not appear to require a power-of-two zone size, but the Linux nvme driver, in the source I read, rejects one (\"invalid zone size\") and hides the block device. Many host tools shift instead of divide. ZSZE is also per LBA format, so a format change can change the zone size in bytes. Keep ZSZE a power of two and hide odd NAND geometry in ZCAP, which is what zone capacity is for.","deep":"- **Spec versus host:** zonedstorage.io states zone capacity exists so zone size can stay a power of two. QEMU accepts other sizes (it only computes a shift when the size is a power of two). The strict rule lives in host software.\n- **Linux check:** `is_power_of_2(zone_size)`, otherwise a warning and the probe fails, which hides the block device. Block-layer support for other zone sizes has been discussed and may exist in newer kernels, so re-check for the kernel in use.\n- **Consequences of 0x60000:** address math needs a real division, `chunk_sectors` handling and userspace tools built on masks all break or bail.\n- **Per-format zone size:** each LBA format entry has its own ZSZE. 0x80000 blocks is 2 GiB at 4 KiB but 256 MiB at 512 B. A Format NVM to another LBA format changes the zone geometry, so a validator must re-read Identify after every format.\n- **Alignment:** ZSLBA is a multiple of ZSZE, so a non-power-of-two size still aligns, but only to that size.\n- **Test:** for each LBA format, check ZSZE is constant across zones, ZSLBA(n) equals n x ZSZE, ZCAP is at most ZSZE, and the Linux block device still appears as zoned.","pitfall":"Validating on QEMU, which accepts odd zone sizes, and concluding a Linux host will accept them too.","verify":"Whether the spec places any constraint on ZSZE, current kernel handling of non-power-of-two zone sizes, and how Format NVM interacts with zone state.","follow":[{"q":"Where should odd geometry go instead?","a":"Into ZCAP. Three-die stripes of a given size become the capacity, and the rest of the power-of-two zone is unused address space."},{"q":"Does the block layer need equal zones?","a":"It has assumed power-of-two zone sizes, with a smaller last zone tolerated. Support for other sizes may be newer, so test on the kernel you ship."}],"mod":2},{"id":"2.12","level":"Advanced","type":"Cross-layer","fig":null,"tags":["linux","sysfs","queue-limits","discovery"],"q":"How do the Identify fields turn into what Linux shows for a zoned NVMe namespace, and how do you use that in validation?","short":"The driver maps ZSZE to the zone size (chunk_sectors), MOR plus 1 to max open zones, MAR plus 1 to max active zones, ZASL to the maximum zone append size, and CSI 02h to a host-managed zoned queue. Each shows in sysfs under queue/ and in `blkzone report` and `lsblk`. Comparing the sysfs values with the raw Identify data catches both firmware reporting errors and host translation errors.","deep":"| NVMe source | Linux attribute | Where to look |\n|---|---|---|\n| CSI = 02h | zoned = host-managed | `/sys/block/nvme0n1/queue/zoned` |\n| ZSZE (in-use LBA format) | chunk_sectors, zone size | `queue/chunk_sectors`, `blkzone report` |\n| MOR + 1 | max_open_zones | `queue/max_open_zones` |\n| MAR + 1 | max_active_zones | `queue/max_active_zones` |\n| ZASL | max zone append size | `queue/zone_append_max_bytes` |\n| Zone descriptors (ZT, ZS, ZCAP, ZSLBA, WP) | zone type, condition, capacity, start, wp | `blkzone report /dev/nvme0n1` |\n\n- **Sector units:** Linux converts LBAs to 512-byte sectors, so a 4 KiB-LBA zone of 524,288 blocks shows as 4,194,304 sectors.\n- **No-limit encoding:** MOR or MAR of FFFFFFFFh plus 1 wraps to 0 in the driver, and 0 means no limit in the block layer. A drive reporting 0 or 1 by mistake shows up as a tiny limit.\n- **Full zones:** the driver reports the write pointer of a Full zone as start plus zone length, ignoring the descriptor value.\n- **Method:** dump the raw Identify (`nvme zns id-ns`, `nvme zns id-ctrl`), compute the expected numbers, compare with sysfs and `blkzone report`. A mismatch tells you which layer to debug.\n- **Tools:** `nvme zns list`, `nvme zns report-zones`, `lsblk -z`, `blkzone report`, and libzbd's `zbd report`.","pitfall":"Trusting sysfs as if it were the device. It is the driver's interpretation, after conversions and gating.","verify":"The sysfs attribute names in the target kernel, and that nvme-cli subcommand names match the version in use (newer releases move some commands under `nvme id` and `nvme log`).","follow":[{"q":"Which value is not in sysfs from Identify at all?","a":"Zone capacity per zone. It comes from Report Zones descriptors and shows in `blkzone report` output, not in a queue attribute."},{"q":"What if there is no block device, or `queue/zoned` says none?","a":"The driver hid the namespace or did not enable zoned mode, so look at dmesg for the reason (questions 2.09 and 2.15)."}],"mod":2},{"id":"2.13","level":"Advanced","type":"Concept","fig":null,"tags":["effects-log","csi","cel","conformance"],"q":"How does the Commands Supported and Effects log relate to command sets, and how do you use it in validation?","short":"Log page 05h lists, per opcode, whether a command is supported (CSUPP) and what it changes, such as logical block content (LBCC). It is per command set: the Get Log Page command carries a CSI, so ZNS opcodes 79h, 7Ah and 7Dh appear in the CSI 02h log. A validator can use it as the drive's own claim of what it implements, and test that every claim matches behavior.","deep":"- **Layout:** 4096 bytes: 256 admin opcode entries, 256 I/O opcode entries, then reserved. Each entry is 32 bits. Bit 0 is CSUPP and bit 1 is LBCC. Other bits cover namespace, controller and capability changes and command execution scope.\n- **CSI selection:** the Get Log Page command has a CSI field in CDW14 bits 31:24, so you can fetch the NVM view and the ZNS view of the I/O opcodes separately.\n- **Host use:** Linux fetches it per CSI and, for zoned namespaces, checks the Zone Append entry. No CSUPP means the namespace is forced read-only.\n- **Expected entries (QEMU as a reference implementation):** Zone Management Send and Zone Append have CSUPP and LBCC, since they change content. Zone Management Receive has CSUPP only.\n- **Conformance loop:** for each opcode with CSUPP set, send a valid command and expect success. For each opcode with CSUPP clear, send it and expect an Invalid Command Opcode style error.\n- **Regression use:** diff the log between firmware builds. An opcode disappearing, or a new one appearing without a release note, is a finding.","pitfall":"Sending a zoned opcode to an NVM namespace, getting an error, and blaming the command set log. The namespace CSI decides.","verify":"The full effects bit layout (bits above LBCC), the log page's CSI field position, and the status for an unsupported opcode.","follow":[{"q":"Is the log reliable?","a":"Only as far as you test it. Firmware sometimes advertises an optional command and returns an error on valid use."},{"q":"Does it list per-namespace behavior?","a":"No. It is per command set on the controller, so a feature limited to some namespaces needs Identify and direct testing."}],"mod":2},{"id":"2.14","level":"Principal","type":"Scenario","fig":null,"tags":["test-design","identify","conformance","automation"],"q":"Design an Identify-level conformance suite for a new ZNS SSD. What do you check, how do you automate it, and how do you decide pass or fail?","short":"Treat Identify data as a contract that everything else relies on. Read every structure across CSS modes, LBA formats and firmware builds, check internal invariants (ZSZE, ZCAP, MAR versus MOR, ZDES), cross-check against behavior (zone descriptors, the effects log, real commands) and against what Linux reports. Fail on a broken invariant or a claim that behavior contradicts. Store results per build so any change in a claimed value is visible.","deep":"1. **Enumerate:** for each CSS mode, controller and namespace, capture CNS 01h, 00h, 03h, 05h, 06h, 07h, 08h, and the effects logs for CSI 00h and 02h.\n2. **Invariants:** CSI descriptor present and equals 02h; ZSZE nonzero and identical for every zone; ZSLBA(n) equals n x ZSZE; ZCAP at most ZSZE; MOR at most MAR when both limited; ZDES consistent with the extension length returned by Report Zones; reserved fields zero; structures 4096 bytes.\n3. **Cross-checks against behavior:** Report Zones descriptors match ZSZE and ZCAP; the write pointer of an empty zone equals ZSLBA; MAR and MOR are enforced by opening zones until the limit trips; every effects-log CSUPP claim is tested.\n4. **Per LBA format:** for each LBA format that can be formatted, redo the checks, since ZSZE and ZDES are per format.\n5. **Negative tests:** unsupported CSS values, a wrong CSI in Identify, CNS 05h on an NVM namespace, and a zoned opcode on an NVM namespace, each with the expected status and DNR bit.\n6. **Host cross-check:** compare the raw values with sysfs and `blkzone report`, on at least two kernel versions.\n7. **Automation:** a script (Python with nvme-cli JSON output or ioctl passthrough) that dumps to a versioned JSON per firmware build, then a diff step. Run as a gate on every build, fast enough for pre-merge.\n8. **Decision criteria:** invariant failure is a defect. A claim that behavior contradicts is a defect. A value change between builds without a release note is a flagged regression. An allowed but unusual value (for example ZOC bits set) is a compatibility note, not a fail.","pitfall":"Checking only the default LBA format and the first namespace. Geometry bugs usually appear at the second format or the last zone.","verify":"Which invariants are stated as requirements in the spec (ZSLBA spacing, MOR and MAR, reserved fields) and the expected status codes for each negative case.","follow":[{"q":"How do you cover multiple namespaces cheaply?","a":"Iterate over the active list and per-CSI list, and check counts match between CNS 02h and 07h."},{"q":"What about SR-IOV or multi-controller drives?","a":"Run per controller, and confirm shared namespaces report the same zone geometry through every controller."}],"mod":2},{"id":"2.15","level":"Principal","type":"Debug","fig":null,"tags":["triage","linux","read-only","zone-append","firmware-update"],"q":"After a firmware update, a ZNS SSD shows up on Linux read-only, or its block device disappears. Walk through the root-cause method.","short":"Start from the driver's decision, not the workload. Read dmesg for the gating messages, then compare the Identify data, the effects log and the descriptor list before and after the update. The usual causes are: Zone Append not marked supported in the effects log (forced read-only), a non-zero ZOC or a non-power-of-two zone size (block device hidden), a missing CSI descriptor, or CC.CSS not reaching 110b. Confirm with a raw command capture, then decide firmware versus host.","deep":"1. **Collect:** dmesg since boot, `nvme list`, `nvme id-ns` and `nvme zns id-ns`, `nvme id ns-descs` (or `nvme ns-descs` on older nvme-cli), the effects log for CSI 02h, `/sys/block/nvme0n1/queue/zoned`.\n2. **Read the gating messages (strings from the source I read):**\n   - Forced read-only: a warning that Zone Append is not supported for the zoned namespace.\n   - Block device hidden or namespace skipped: \"zone operations:%x not supported\" (ZOC), \"invalid zone size\" (non power of two), or \"Command set not reported\" (no CSI descriptor in multiple-command-set mode).\n3. **Diff against the previous build:** the Identify structures and effects log. The change points to the field.\n4. **Rule out the host:** the same drive on a second kernel, and the previous firmware on the same host. If only the new build fails on both kernels, it is firmware.\n5. **Bus level if unclear:** analyzer or trace capture of the init sequence to see the actual CC write (CSS bits) and each Identify with its CSI.\n6. **Decide:** a real omission of Zone Append in the log is a firmware defect if the command works. A non-zero ZOC is a valid report that a given kernel may not accept, so the answer depends on the product's host support matrix.\n7. **Prevent:** add the identify diff and a Linux bring-up smoke test (zoned mode on, not read-only, limits match) as a gate.\n- **Evidence to keep:** raw Identify dumps, effects log, dmesg and the nvme-cli versions.","pitfall":"Fixing the symptom on the test host, such as forcing writable, instead of asking why the drive's claimed capabilities changed.","verify":"The exact kernel messages and gating conditions in the version under test, and nvme-cli command names and options for that version.","follow":[{"q":"Zone Append works if you send it by hand, but Linux still forces read-only. Why?","a":"The driver decides from the effects log entry, not from trying the command. If CSUPP is clear, it never tries."},{"q":"How do you tell a stale cached log from a real change?","a":"Reload the driver or reset the controller, and re-read the log from the device."}],"mod":2},{"id":"2.16","level":"Principal","type":"Cross-layer","fig":null,"tags":["compatibility","css","mixed-namespaces","test-matrix"],"q":"A product ships both conventional and zoned namespaces on one controller for several host types. What is the design rationale for making ZNS a separate command set, and what does it force you to test?","short":"A separate command set keeps existing NVM software working: a host that does not opt in to multiple command sets (CC.CSS not 110b) never sees zoned namespaces, and a namespace with an unknown CSI is not bound to a block driver. The cost is a compatibility matrix. You must test the opt-in path, CSI-aware discovery, mixed namespaces on one controller, opcode overlap between command sets, and how each host type behaves when it does not understand a command set.","deep":"- **Why not extend NVM:** changing Write semantics on an NVM namespace would break every existing host. A new command set with its own identify structures and opcodes isolates the change to namespaces that declare it.\n- **No conventional zones:** zoned namespaces contain only sequential-write-required zones, so a mixed workload uses two namespaces of two command sets on one controller.\n- **Test matrix:**\n  1. CC.CSS 000b, 110b and 111b enumeration on the same drive.\n  2. Identify and effects log per CSI, with NVM and ZNS namespaces both present.\n  3. Concurrent I/O on an NVM and a ZNS namespace, including Flush and Format on one while the other is busy.\n  4. Namespace create with each CSI where namespace management is supported, and attach and detach.\n  5. Opcode overlap: Write versus Key Value Store at 01h, and zoned opcodes sent to the wrong namespace type.\n  6. Host types: current kernel, an older kernel with no zoned support, a hypervisor or SPDK stack, and a Windows or vendor driver.\n- **Expected legacy behavior:** the old host either does not enable multiple command sets or skips namespaces it cannot classify, and is not affected. Verify this, do not assume it.\n- **Risk to cover:** shared controller resources (queues, cache, media bandwidth) between the two namespaces, so a zoned workload can add latency to the conventional one. Measure both together.","pitfall":"Testing only the default configuration (110b, one zoned namespace). The compatibility risks are in the other modes and the mixed case.","verify":"Exact controller behavior for zoned namespaces when CC.CSS is 000b, status codes for opcodes sent to the wrong namespace type, and whether the target product supports Namespace Management.","follow":[{"q":"How do you test the old-host case without an old kernel?","a":"A small driver script or SPDK application that writes CC.CSS as 000b and issues Identify, plus a VM with an older guest kernel."},{"q":"What is the one metric you would gate on?","a":"No unintended change to what a legacy host sees: same namespace list and Identify data as before the zoned namespaces were added."}],"mod":2},{"id":"3.01","level":"Basic","type":"Concept","fig":null,"tags":["zone","sequential-write-required","zone-type","lba-space"],"q":"What is a zone in a Zoned Namespace, and which zone types does ZNS define?","short":"A zone is a fixed-size, contiguous, non-overlapping range of LBAs. The namespace is carved into equal zones, laid out back to back from LBA 0, each Zone Size LBAs long. ZNS defines one zone type, Sequential Write Required (Zone Type 2h): the host writes each zone strictly sequentially at its write pointer, may read anywhere, and gets space back only by resetting the whole zone.","deep":"- **Layout:** zone n starts at ZSLBA = n x Zone Size. Zone Size (ZSZE) is per namespace and lives in the ZNS Identify Namespace data, so every zone has the same address span.\n- **Sequential Write Required:** a write must begin exactly at the zone's write pointer, otherwise the controller aborts it with Zone Invalid Write. There is no overwrite in place. The only host-visible \"erase\" is Reset Zone, which empties the entire zone.\n- **Zone Append:** the exception in addressing. The host names the zone and the device chooses the LBA (module 5).\n- **Only type 2h:** ZBC/ZAC SMR drives also have Conventional and Sequential Write Preferred zones. A ZNS zone descriptor carries the type in byte 0, and the Linux NVMe driver rejects any zone whose type is not 2h.\n- **Zone is logical:** a zone is an address-space contract, not an erase block. How firmware maps a zone to NAND is module 8.","pitfall":"Equating a zone with a NAND erase block. Zone Size and capacity are host-facing numbers and firmware is free to stripe a zone over many blocks and dies.","verify":"ZNS 1.4 does not say whether the namespace size must be an exact multiple of Zone Size (Annex A.5 only shows equal-size zones, with no stated multiple rule). Zone Type 2h (Sequential Write Required) is the only defined value; all others are reserved (ZNS 1.4, Figure 38).","follow":[{"q":"Can one namespace mix conventional and zoned regions?","a":"No. A zoned namespace (Command Set Identifier 2h) contains only zones. Conventional and zoned namespaces coexist as separate namespaces (module 2)."},{"q":"Must Zone Size be a power of two?","a":"Not that I could confirm in the spec text (see VERIFY), but the Linux NVMe driver source I checked rejects non-power-of-two zone sizes, so real hosts effectively assume it."}],"mod":3},{"id":"3.02","level":"Basic","type":"Concept","fig":null,"tags":["write-pointer","wp","sequential","invalid-write"],"q":"What is the write pointer, and how does it move?","short":"The write pointer (WP) is the LBA where the next write to the zone must start. It equals ZSLBA in an Empty zone and advances by the number of blocks written after every successful write. A write that does not start exactly at the WP fails with Zone Invalid Write. The WP is valid only in Empty, Implicitly Opened, Explicitly Opened and Closed zones; in Full, Read Only and Offline zones the field is invalid.","deep":"1. Empty zone: WP = ZSLBA.\n2. A successful write of N blocks at the WP moves it to WP + N.\n3. When the write reaches ZSLBA + ZCAP the zone becomes Full (see 3.05).\n4. Reset Zone puts the WP back to ZSLBA.\n\nWhile the WP is valid it satisfies ZSLBA <= WP < ZSLBA + ZCAP. Once a write reaches ZSLBA + ZCAP the zone is Full and the WP field stops being meaningful.\n- **Where the host reads it:** only Report Zones returns the WP. A normal Write completion does not carry it, so hosts keep their own shadow copy. Zone Append is the exception, because its completion returns the LBA where data landed (module 5).\n- **Related statuses:** Zone Invalid Write (SCT 1, SC BCh), Zone Boundary Error (B8h) and Zone Is Full (B9h). Linux names them NVME_SC_ZONE_INVALID_WRITE and so on, with the 0x1xx values. Module 7 covers the full set.\n- **Queue depth caveat:** with several writes in flight to one zone, the host must submit them in WP order and the device must process them in order, or the second write hits Zone Invalid Write. This is why Zone Append exists.","pitfall":"Expecting the WP in the write completion. Only Zone Append returns an LBA, so a host that does not track the WP must call Report Zones.","verify":"ZNS 1.4 gives no zone-specific durability guarantee for the WP after an Unexpected Power Loss; that is governed by the NVMe Base Specification's volatile write cache and unexpected-power-loss rules (see the NVMe page).","follow":[{"q":"Can the WP move backward?","a":"Only via Reset Zone in normal operation. After unexpected power loss it may come back lower than the host last saw if the data was not durable (see 3.15)."},{"q":"Does a Flush or FUA change the WP?","a":"No. The WP advances on successful write completion. Durability of that data follows the usual Flush and FUA rules."}],"mod":3},{"id":"3.03","level":"Basic","type":"Concept","fig":null,"tags":["zone-size","zone-capacity","zsze","zcap","vzc"],"q":"What is the difference between Zone Size and Zone Capacity?","short":"Zone Size (ZSZE) is the address span of every zone in the namespace. Zone Capacity (ZCAP) is the number of usable LBAs in a zone, counted from ZSLBA, and is less than or equal to Zone Size. LBAs from ZSLBA + ZCAP to the end of the zone exist in the address map but cannot be written. The gap lets Zone Size stay a clean power of two while capacity matches the NAND geometry.","deep":"- **Where they live:** ZSZE is per LBA format in the ZNS Identify Namespace data (the LBA Format Extension entry), ZCAP is per zone in bytes 8 to 15 of each zone descriptor.\n- **Why they differ:** capacity follows what the media can hold after bad blocks, parity and firmware reserves. Zone Size is chosen for fast address arithmetic on the host (shift instead of divide).\n- **Variable Zone Capacity:** the Zone Operation Characteristics field has a bit (VZC) that says capacity may differ from zone to zone. If it is 0, all zones have the same capacity. The Linux NVMe driver source I checked refuses namespaces with any Zone Operation Characteristics bit set.\n- **Writes past capacity:** a write that would cross ZSLBA + ZCAP is aborted (Zone Boundary Error in the QEMU model), and the zone is Full when the WP reaches ZSLBA + ZCAP.\n- **Reads in the gap:** the LBAs from offset ZCAP to ZSZE-1 behave like deallocated blocks on a read and are not allowed to be written (ZNS 1.4, Annex A.5).\n- **Capacity accounting:** usable space is the sum of ZCAP, not NSZE (worked in 3.08).","pitfall":"Filling to Zone Size in a test. The last ZSZE - ZCAP LBAs are not writable, so a host or test that plans on ZSZE hits a boundary error.","verify":"Zone Capacity can change on Reset Zone when VZC is 1 (ZNS 1.4, 3.4.3.1.5 and Annex A.5, confirmed). A write starting inside the gap fails as Zone Invalid Write (start not at WP) or Zone Is Full once the zone has reached capacity; there is no separate gap-specific status.","follow":[{"q":"Why not just make capacity equal to size?","a":"Zone Size is a power of two for host math, while capacity tracks superblock geometry, which rarely is."},{"q":"Which value decides when a zone is Full?","a":"Capacity. Reaching ZSLBA + ZCAP fills the zone even though ZSZE more addresses exist."}],"mod":3},{"id":"3.04","level":"Intermediate","type":"Concept","fig":null,"tags":["zone-descriptor","report-zones","zone-attributes","extension"],"q":"What is inside a zone descriptor, and how is a Report Zones buffer laid out?","short":"The Report Zones buffer starts with a 64-byte header whose first 8 bytes are the number of zones, then one 64-byte descriptor per zone. Byte 0 holds the Zone Type in bits 3:0, byte 1 holds the Zone State in bits 7:4, byte 2 is Zone Attributes, byte 3 is Zone Attributes Information, bytes 8-15 are ZCAP, 16-23 ZSLBA and 24-31 the WP. In an extended report each descriptor is followed by its zone descriptor extension.","deep":"| Byte | Field | Notes |\n|---|---|---|\n| 0 | Zone Type (bits 3:0) | 2h = Sequential Write Required |\n| 1 | Zone State (bits 7:4) | 1h Empty, 2h Implicit Open, 3h Explicit Open, 4h Closed, Dh Read Only, Eh Full, Fh Offline |\n| 2 | Zone Attributes | bit 0 ZFC, bit 1 FZR, bit 2 RZR, bit 3 ZRWAV (newer revisions), bit 7 ZDEV |\n| 3 | Zone Attributes Information | finish/reset recommended limit selectors (newer revisions) |\n| 8-15 | Zone Capacity | LBAs |\n| 16-23 | Zone Start LBA | lowest LBA of the zone |\n| 24-31 | Write Pointer | valid only in Empty, Open, Closed |\n| 32-63 | Reserved | |\n\n- **Descriptor n:** at offset 64 + 64 x n in a plain report. With extensions the stride is 64 + ZDES x 64 bytes, where ZDES (in 64-byte units) comes from the LBA Format Extension in the ZNS Identify Namespace data. ZDES = 0 means no extension. nvme-cli computes it as `zdes << 6`.\n- **Extension:** host-defined bytes attached to a zone, valid only when the ZDEV attribute bit is 1. Reset Zone clears them (see 3.10).\n- **Raw-byte trap:** the state is the high nibble of byte 1. A raw byte of 20h means Implicitly Opened, and the kernel decodes it as `zs >> 4`.\n- **Full report size:** 64 + 64 x zones bytes, for example 16,448 bytes for 256 zones.","pitfall":"Reading the state from the low nibble of byte 1, or decoding the filter code as a state code. Confirmed against ZNS 1.4, Figure 38: Zone Attributes Information is bits 3:2 Reset Recommended Time Limit selector, bits 1:0 Finish Recommended Time Limit selector, bits 7:4 reserved. Filter codes 5 = Full, 6 = Read Only match the spec table exactly (Figure 35; see 4.08).","verify":null,"follow":[{"q":"Do the Report Zones filter codes equal the state codes?","a":"No. The Zone Receive Action Specific Field uses 0 all, 1 Empty, 2 Implicit Open, 3 Explicit Open, 4 Closed, 5 Full, 6 Read Only, 7 Offline, so Full, Read Only and Offline are 5, 6, 7 in the filter but Eh, Dh, Fh in the state field. Linux nvme.h swaps 5 and 6 (see 4.08)."},{"q":"How does the host pick extended or plain?","a":"The Zone Receive Action: 0 is a normal report, 1 is an extended report (libnvme, SPDK and QEMU; Linux nvme.h defines only 0)."}],"mod":3},{"id":"3.05","level":"Intermediate","type":"Concept","fig":"zstates","tags":["zone-states","state-machine","open","active"],"q":"What are the seven zone states, and what can be done in each?","short":"Empty, Implicitly Opened, Explicitly Opened, Closed, Full, Read Only and Offline. Empty has WP = ZSLBA. The two Open states accept writes and hold an open resource. Closed keeps data and the WP but releases the open resource, while still counting as active. Full accepts no more writes. Read Only and Offline are controller-entered degraded states, and Offline is terminal.","deep":"| State | Code | Writes | Reads | WP field |\n|---|---|---|---|---|\n| Empty | 1h | yes | yes | valid, = ZSLBA |\n| Implicitly Opened | 2h | yes | yes | valid |\n| Explicitly Opened | 3h | yes | yes | valid |\n| Closed | 4h | yes (reopens implicitly) | yes | valid |\n| Read Only | Dh | Zone Is Read Only | yes | invalid |\n| Full | Eh | Zone Is Full | yes | invalid |\n| Offline | Fh | Zone Is Offline | Zone Is Offline | invalid |\n\n- **Open zones:** Implicitly Opened plus Explicitly Opened, limited by MOR.\n- **Active zones:** open zones plus Closed, limited by MAR. Empty and Full zones use neither (module 6).\n- **Reserved codes:** 0h and 5h to Ch are not defined states (per the Linux and SPDK headers), so a validator should flag them.\n- **Ordering trap:** the codes are 1 to 4 for the normal states, then Dh Read Only, Eh Full, Fh Offline.\n- **Offline is terminal:** the spec has no transition out of Offline.","pitfall":"Treating Closed as unusable. A Closed zone keeps its WP and data, still counts as active, and a write reopens it (needing an open resource). Confirmed against ZNS 1.4, Figure 38: 0h reserved, 1h Empty, 2h Implicitly Opened, 3h Explicitly Opened, 4h Closed, 5h to Ch reserved, Dh Read Only, Eh Full, Fh Offline.","verify":null,"follow":[{"q":"Which states count toward the active limit?","a":"Implicitly Opened, Explicitly Opened and Closed."},{"q":"Can an Empty zone become Full without any writes?","a":"Yes, through Finish Zone, or through a controller action."}],"mod":3},{"id":"3.06","level":"Intermediate","type":"Concept","fig":null,"tags":["transitions","write","open","close","finish","reset","offline"],"q":"Walk through the host-driven state transitions: what does each command do in each state?","short":"A write moves Empty or Closed to Implicitly Opened and Full when it reaches capacity. Open Zone moves Empty, Implicitly Opened or Closed to Explicitly Opened. Close Zone moves an open zone to Closed. Finish Zone moves Empty, open and Closed zones to Full. Reset Zone moves open, Closed and Full zones to Empty and sets WP = ZSLBA. Offline Zone moves Read Only to Offline. Everything else is rejected or a no-op.","deep":"| State | Write | Open | Close | Finish | Reset | Offline |\n|---|---|---|---|---|---|---|\n| Empty | Imp Open | Exp Open | err* | Full | no change | err* |\n| Imp Open | stays, Full at ZCAP | Exp Open | Closed | Full | Empty | err* |\n| Exp Open | stays, Full at ZCAP | no change* | Closed | Full | Empty | err* |\n| Closed | Imp Open | Exp Open | no change | Full | Empty | err* |\n| Full | Zone Is Full | err* | err* | no change* | Empty | err* |\n| Read Only | Zone Is Read Only | err* | err* | err* | err | Offline |\n| Offline | Zone Is Offline | err* | err* | err* | err | no change* |\n\n\"err\" is Invalid Zone State Transition (SCT 1, SC BFh). Cells marked * are expected behavior that must be confirmed against the spec text.\n- **Resources:** Empty to Imp Open needs one open and one active resource, Closed to Imp Open needs one open. Failure gives Too Many Open Zones (BEh) or Too Many Active Zones (BDh), unless the controller closes another implicitly open zone to make room (module 6).\n- **Reset side effects:** WP becomes ZSLBA and the attribute bits ZDEV, FZR, RZR, ZFC and ZRWAV are all cleared (ZNS 1.4, 3.4.3.1.5).\n- **Select All:** the Zone Management Send Select All flag applies an action to every zone it is valid for (module 4).","pitfall":"Assuming every wrong-state action fails. Reset on Empty, Close on Closed and Offline on Offline succeed as no-ops, so the oracle needs an exact expected result per cell, including \"state and WP unchanged\" for rejected ones. Confirmed against ZNS 1.4, 3.4.3.1.1 to 3.4.3.1.5: Finish on Full is a no-op, Open on Explicitly Opened is a no-op, and Close on Empty or Full is Invalid Zone State Transition, exactly as starred above.","verify":null,"follow":[{"q":"Which transition frees an open resource but keeps the active one?","a":"Close Zone (open to Closed)."},{"q":"Does Reset Zone on a Read Only zone recover the space?","a":"No. It fails with Invalid Zone State Transition, and only Offline Zone is allowed from Read Only."}],"mod":3},{"id":"3.07","level":"Intermediate","type":"Concept","fig":null,"tags":["implicit-open","explicit-open","resources","eviction"],"q":"What is the difference between an implicitly and an explicitly opened zone, and why does it matter?","short":"A zone is implicitly opened when a write reaches an Empty or Closed zone, and explicitly opened when the host sends Open Zone. Both use an open and an active resource. The difference is who may end it: when Open resources run out but Active resources are still available, the controller shall close an Implicitly Opened zone to make room; it can never do that to an Explicitly Opened one. Only the host or a fault ends an Explicitly Opened zone.","deep":"- **Why open explicitly:** Open Zone reserves the resource up front. If the limits are hit, the failure is at the Open command (Too Many Open Zones or Too Many Active Zones) instead of in the middle of a data stream.\n- **Eviction is mandatory, not best-effort:** per ZNS 1.4, 2.1.1.4.1, if MAR is greater than MOR and the unavailable resource is Open, the controller shall select one Implicitly Opened zone and transition it to Closed before proceeding, if at least one exists; only if none exists does it abort with Too Many Open Zones. If MAR equals MOR, there is no such path: Active resources run out first and the command aborts with Too Many Active Zones. Which zone is chosen when several qualify is still vendor specific.\n- **Visibility:** the host sees an eviction only by reading the zone state again (2h became 4h). No completion reports it, so a host that tracks state itself must resync.\n- **One-way:** Implicit to Explicit exists (Open Zone on an implicitly open zone). Explicit to Implicit does not. An Explicitly Opened zone leaves only through Close, Finish, Reset or a controller fault.\n- **Validation test:** with the open limit at N, open N zones explicitly and write to a fresh Empty zone. Expect Too Many Open Zones, since nothing can be evicted. Repeat with N-1 explicit and the rest implicit and expect success with one zone quietly Closed.","pitfall":"Assuming the device will always make room. Explicit opens pin their resources, so a host that opens MOR zones explicitly has no headroom for another, and eviction is only guaranteed when MAR is strictly greater than MOR.","verify":null,"follow":[{"q":"Can the host tell that the controller closed a zone?","a":"Only through Report Zones state."},{"q":"Does Close Zone release the active resource?","a":"No. Only Finish, Reset, or a transition to Read Only or Offline take the zone out of the active count."}],"mod":3},{"id":"3.08","level":"Intermediate","type":"Numeric","fig":null,"tags":["zone-count","zslba","wp","capacity","arithmetic"],"q":"A 64 GiB zoned namespace uses 4 KiB LBAs, Zone Size 0x10000 and Zone Capacity 0xDC00. How many zones are there, where does zone 100 start, and where is its WP after 40 writes of 1 MiB plus three writes of 4 KiB?","short":"NSZE is 0x1000000 LBAs, so there are 0x1000000 / 0x10000 = 256 zones. Zone 100 starts at ZSLBA = 100 x 65,536 = 0x640000. Each 1 MiB write is 256 LBAs, so the WP is 0x640000 + 40 x 256 + 3 = 0x642803. Usable capacity is 256 x 0xDC00 LBAs, which is 55 GiB, or 85.9 percent of the address space.","deep":"1. NSZE: 64 GiB / 4 KiB = 16,777,216 = 0x1000000 LBAs.\n2. Zone Size: 0x10000 = 65,536 LBAs x 4 KiB = 256 MiB. Zones = 16,777,216 / 65,536 = 256.\n3. Zone Capacity: 0xDC00 = 56,320 LBAs = 220 MiB. Gap per zone = 65,536 - 56,320 = 9,216 LBAs = 36 MiB.\n4. ZSLBA of zone 100 = 100 x 65,536 = 6,553,600 = 0x640000 (also 0x64 << 16, since Zone Size is a power of two).\n5. Written: 40 x 256 + 3 = 10,243 LBAs. WP = 6,553,600 + 10,243 = 6,563,843 = 0x642803.\n6. Remaining capacity in zone 100: 56,320 - 10,243 = 46,077 LBAs, so the zone becomes Full when WP = 0x64DC00.\n7. Usable space: 256 x 56,320 = 14,417,920 LBAs = 55 GiB, which is 55 / 64 = 85.9 percent.\n8. Lookup: LBA 0x64A000 is zone 0x64 = 100, offset 0xA000 = 40,960 < ZCAP, so it is writable range. LBA 0x65E000 is zone 101 with offset 0xE000 = 57,344 > ZCAP, so it falls in the gap.\n9. Fill count: 56,320 / 32 = 1,760 writes of 128 KiB (32 LBAs) fills a zone exactly.","pitfall":"Sizing the dataset from NSZE. A 64 GiB namespace stores 55 GiB, and a host GC or capacity plan that ignores the gap runs out of zones early.","verify":"ZNS 1.4 does not say the namespace size must be an exact multiple of Zone Size (the example assumes it for clean arithmetic; Annex A.5 does not state the requirement either way).","follow":[{"q":"How does the zone lookup change if Zone Size is not a power of two?","a":"The host divides instead of shifting: zone = LBA / ZSZE, and offset = LBA mod ZSZE."},{"q":"What does the state look like after write number 1,760 of 128 KiB?","a":"Full, and Report Zones shows state Eh."}],"mod":3},{"id":"3.09","level":"Advanced","type":"Concept","fig":null,"tags":["controller-transitions","power-cycle","reset","initial-state"],"q":"Which transitions does the controller make on its own, and what happens to open zones across a power cycle or controller reset?","short":"The controller may close an Implicitly Opened zone for resource management, and may move a zone to Read Only or Offline for media reasons. With Zone Active Excursions it can finish an active zone (ZFC set). After an NVM Subsystem Reset or power cycle, open zones come back Closed if the WP is past ZSLBA or an extension is valid, otherwise Empty. Full, Read Only and Offline stay, and a zone may also come back Full. Whether a controller-only reset does the same is unconfirmed (VERIFY).","deep":"| Zone before reset | State after reset |\n|---|---|\n| Empty | Empty |\n| Open or Closed, WP > ZSLBA | Closed |\n| Open or Closed, WP = ZSLBA, ZDEV = 0 | Empty |\n| Any of these with ZDEV = 1 | Closed |\n| Full, Read Only, Offline | unchanged |\n| Any zone the controller could not recover | may come back Full (the spec allows Full as a result of the reset) |\n\n- **Explicit opens are lost:** an Explicitly Opened zone returns as Closed, so the host must open it again before relying on reserved resources.\n- **Resource count after reset:** open count is 0, and the active count equals the number of Closed zones, which must fit within MAR.\n- **Read Only to Offline:** happens only by host command (Offline Zone). No Zone Management action returns a Read Only zone to writable.\n- **Format and creation:** on a Format or a new namespace, each zone starts Empty or Offline, so a device may ship with some Offline zones.\n- **What to test:** after every reset or power cycle, read the full zone report and compare it with the table applied to your pre-reset model. The WP itself must also be checked (see 3.15).","pitfall":"Expecting Explicitly Opened zones to survive as Explicitly Opened. A test that reserves resources and then power cycles must re-open afterwards. Confirmed against ZNS 1.4, 2.1.1.3: the initial-state rules trigger only on an NVM Subsystem Reset or on all controllers reporting shutdown processing complete (ST=0, SHST=10b); a Controller Level Reset (CC.EN 1 to 0) is explicitly not one of the listed triggers. Full-after-reset is allowed when the most recent state was already Full, or when the reset itself transitioned
