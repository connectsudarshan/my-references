<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZNS Q&amp;A — Study Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e2036; --bg-panel:#123049; --bg-sidebar:#0a1a2c;
  --line:#2f5578; --line-soft:#1c3852;
  --accent:#ffb454; --accent-dim:#c98e42;
  --text:#e7eef6; --text-dim:#8fa9c2; --text-faint:#5d7995;
  --code-bg:#081422;
  --basic:#9fdf9f; --inter:#7ec8e3; --adv:#ffd479; --prin:#ff9d9d;
  --got:#9fdf9f; --shaky:#ffd479; --missed:#ff9d9d;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
body{
  background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
  background-size:28px 28px;background-attachment:fixed;min-height:100vh;
}
::selection{background:var(--accent);color:#0e2036;}
button{font-family:inherit;}
.app{display:flex;min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{width:310px;flex-shrink:0;background:var(--bg-sidebar);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;}
.sidebar-header{padding:20px 20px 14px;border-bottom:1px solid var(--line);cursor:pointer;}
.sidebar-header .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--accent);margin:0 0 6px;}
.sidebar-header h1{font-size:17px;margin:0 0 10px;font-weight:600;line-height:1.3;}
.stat-row{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--text-dim);}
.stat-row b{color:var(--accent);}
.search-box{padding:12px 16px;border-bottom:1px solid var(--line);}
.search-box input{width:100%;background:var(--bg-panel);border:1px solid var(--line);color:var(--text);
  padding:9px 12px;border-radius:5px;font-family:var(--sans);font-size:13.5px;outline:none;}
.search-box input:focus{border-color:var(--accent);}
.search-box input::placeholder{color:var(--text-faint);}
.filters{padding:8px 16px 10px;border-bottom:1px solid var(--line);}
.filters summary{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--text-faint);cursor:pointer;padding:2px 0 6px;list-style:none;user-select:none;}
.filters summary::-webkit-details-marker{display:none;}
.filters summary::before{content:'▸ ';}
.filters[open] summary::before{content:'▾ ';}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px;}
.chip-label{font-family:var(--mono);font-size:10px;color:var(--text-faint);width:100%;letter-spacing:.06em;}
.chip{font-family:var(--mono);font-size:10.5px;padding:4px 9px;border-radius:12px;border:1px solid var(--line);
  color:var(--text-dim);cursor:pointer;user-select:none;background:transparent;}
.chip:hover{border-color:var(--text-dim);}
.chip.active{background:var(--accent);color:#0e2036;border-color:var(--accent);font-weight:600;}
.chip.lv-Basic.active{background:var(--basic);border-color:var(--basic);}
.chip.lv-Intermediate.active{background:var(--inter);border-color:var(--inter);}
.chip.lv-Advanced.active{background:var(--adv);border-color:var(--adv);}
.chip.lv-Principal.active{background:var(--prin);border-color:var(--prin);}
.nav-groups{flex:1;overflow-y:auto;padding-bottom:30px;}
.grp-h{display:flex;align-items:center;gap:8px;padding:10px 16px 4px;cursor:pointer;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.04em;color:var(--text-dim);user-select:none;}
.grp-h:hover{color:var(--text);}
.grp-h .caret{width:10px;color:var(--text-faint);}
.grp-h .grp-t{flex:1;}
.grp-h .grp-c{color:var(--text-faint);}
.grp.soon .grp-h{cursor:default;opacity:.55;}
.grp.soon .grp-h:hover{color:var(--text-dim);}
.badge-soon{font-size:9px;border:1px solid var(--line);border-radius:3px;padding:1px 5px;color:var(--text-faint);}
.grp-bar{height:3px;margin:0 16px 4px 34px;background:var(--line-soft);border-radius:2px;display:flex;overflow:hidden;}
.grp-bar i{display:block;height:100%;}
.grp-bar i.got{background:var(--got);} .grp-bar i.shaky{background:var(--shaky);} .grp-bar i.missed{background:var(--missed);}
.grp-items{display:none;}
.grp.open .grp-items{display:block;}
.nav-item{padding:6px 16px 6px 20px;cursor:pointer;font-size:12.5px;color:var(--text-dim);border-left:2px solid transparent;
  display:flex;gap:8px;align-items:baseline;line-height:1.35;}
.nav-item .qnum{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);flex-shrink:0;width:30px;}
.nav-item:hover{background:rgba(255,255,255,.03);color:var(--text);}
.nav-item.active{background:rgba(255,180,84,.1);color:var(--accent);border-left-color:var(--accent);}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--text-faint);flex-shrink:0;align-self:center;}
.dot.r-got{background:var(--got);border-color:var(--got);}
.dot.r-shaky{background:var(--shaky);border-color:var(--shaky);}
.dot.r-missed{background:var(--missed);border-color:var(--missed);}
.nav-empty{padding:18px 20px;color:var(--text-faint);font-size:13px;}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{padding:14px 40px;border-bottom:1px solid var(--line);background:rgba(14,32,54,.9);backdrop-filter:blur(6px);
  position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.crumb{font-family:var(--mono);font-size:12px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.crumb .sep{margin:0 6px;color:var(--line);}
.crumb .current{color:var(--accent);}
.tools{display:flex;gap:8px;align-items:center;}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;}
.seg button{background:var(--bg-panel);color:var(--text-dim);border:0;padding:6px 11px;cursor:pointer;font-family:var(--mono);font-size:11.5px;}
.seg button.on{background:var(--accent);color:#0e2036;font-weight:600;}
.btn{background:var(--bg-panel);border:1px solid var(--line);color:var(--text);border-radius:5px;padding:7px 14px;cursor:pointer;
  font-family:var(--mono);font-size:12px;}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.btn:disabled{opacity:.3;cursor:default;}
.btn.primary{background:var(--accent);color:#0e2036;border-color:var(--accent);font-weight:600;}
.btn.primary:hover:not(:disabled){background:#ffc474;color:#0e2036;}
.btn.ghost{background:transparent;}
.menu-btn{display:none;}
.content{padding:36px 56px 110px;max-width:940px;width:100%;}

/* ---------- Home ---------- */
.hero h2{font-size:32px;margin:0 0 8px;font-weight:700;letter-spacing:-.01em;}
.hero p{color:var(--text-dim);line-height:1.7;font-size:15.5px;margin:0 0 22px;max-width:720px;}
.stat-boxes{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px;}
.stat-box{background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:6px;padding:12px 18px;min-width:120px;}
.stat-box .n{font-family:var(--mono);font-size:24px;color:var(--accent);font-weight:600;}
.stat-box .l{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
.pstack{height:12px;border-radius:6px;background:var(--line-soft);display:flex;overflow:hidden;margin:6px 0 8px;}
.pstack i{display:block;height:100%;}
.pstack i.got{background:var(--got);} .pstack i.shaky{background:var(--shaky);} .pstack i.missed{background:var(--missed);}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-bottom:22px;}
.legend span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--text-faint);}
.legend .g::before{background:var(--got);} .legend .s::before{background:var(--shaky);} .legend .m::before{background:var(--missed);}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:34px;}
.h-label{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--accent-dim);margin:34px 0 14px;display:flex;align-items:center;gap:10px;}
.h-label::after{content:'';flex:1;height:1px;background:var(--line);}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;}
.mod-card{background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:6px;padding:14px 16px;cursor:pointer;
  transition:border-color .12s,transform .12s;}
.mod-card:hover{border-color:var(--accent);transform:translateY(-1px);}
.mod-card .mn{font-family:var(--mono);font-size:11px;color:var(--accent);margin-bottom:4px;}
.mod-card .mt{font-weight:600;font-size:14.5px;margin-bottom:6px;line-height:1.35;}
.mod-card .md{font-size:12.5px;color:var(--text-dim);line-height:1.5;margin-bottom:10px;}
.mod-card .mc{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);display:flex;justify-content:space-between;margin-top:6px;}
.mod-card.soon{border-style:dashed;opacity:.6;cursor:default;}
.mod-card.soon:hover{border-color:var(--line-soft);transform:none;}
.mod-card .pstack{height:5px;margin:0;}
.rounds{width:100%;border-collapse:collapse;font-size:13px;}
.rounds th,.rounds td{padding:7px 10px;border-bottom:1px solid var(--line-soft);text-align:left;}
.rounds th{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);letter-spacing:.06em;font-weight:500;}

/* ---------- Question ---------- */
.q-meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;padding:3px 9px;border-radius:3px;font-weight:600;}
.badge.lv-Basic{background:rgba(159,223,159,.15);color:var(--basic);}
.badge.lv-Intermediate{background:rgba(126,200,227,.15);color:var(--inter);}
.badge.lv-Advanced{background:rgba(255,212,121,.15);color:var(--adv);}
.badge.lv-Principal{background:rgba(255,157,157,.15);color:var(--prin);}
.badge.ty{border:1px solid var(--line);color:var(--text-dim);font-weight:500;}
.q-id{font-family:var(--mono);font-size:12px;color:var(--text-faint);}
.q-title{font-size:23px;font-weight:600;margin:0 0 22px;line-height:1.4;}
.reveal-box{border:1.5px dashed var(--line);border-radius:8px;padding:34px 24px;text-align:center;background:rgba(18,48,73,.5);}
.reveal-box p{margin:0 0 16px;color:var(--text-dim);font-size:14.5px;line-height:1.6;}
.reveal-box .kbd{margin-top:12px;font-family:var(--mono);font-size:11px;color:var(--text-faint);}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-radius:3px;padding:1px 5px;color:var(--text-dim);background:var(--bg-panel);}
.short-box{background:var(--bg-panel);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;padding:16px 20px;margin:0 0 6px;
  font-size:16px;line-height:1.7;}
.sec-label{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--accent-dim);margin:30px 0 12px;display:flex;align-items:center;gap:10px;}
.sec-label::after{content:'';flex:1;height:1px;background:var(--line);}
.deep{font-size:15px;line-height:1.75;}
.deep p{margin:0 0 14px;}
.deep ul,.deep ol{margin:0 0 14px;padding-left:22px;}
.deep li{margin-bottom:5px;}
.deep li>ul,.deep li>ol{margin:6px 0 4px;}
code{font-family:var(--mono);background:var(--code-bg);padding:1px 6px;border-radius:3px;font-size:.88em;color:#ffd479;}
pre.term{background:var(--code-bg);border:1px solid var(--line-soft);border-radius:6px;padding:14px 18px;overflow-x:auto;margin:0 0 16px;}
pre.term code{background:transparent;padding:0;color:var(--text);font-size:12.5px;line-height:1.6;}
.deep table{border-collapse:collapse;margin:0 0 16px;font-size:13.5px;width:100%;display:block;overflow-x:auto;}
.deep th,.deep td{border:1px solid var(--line-soft);padding:7px 11px;text-align:left;vertical-align:top;}
.deep th{background:var(--bg-panel);font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--accent-dim);white-space:nowrap;}
.fig{margin:6px 0 18px;background:rgba(8,20,34,.7);border:1px solid var(--line-soft);border-radius:8px;padding:14px 16px 10px;}
.fig-title{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--accent-dim);margin-bottom:8px;}
.fig figcaption{font-size:12.5px;color:var(--text-dim);margin-top:8px;line-height:1.55;}
.fig svg{width:100%;height:auto;display:block;}
.fig svg text{font-family:var(--mono);font-size:12px;fill:var(--text);}
.fig svg .d{fill:var(--text-dim);} .fig svg .f{fill:var(--text-faint);} .fig svg .s{font-size:10.5px;} .fig svg .xs{font-size:9.5px;} .fig svg .h{font-weight:600;}
.fig svg .lg{font-size:14px;} .fig svg .ac{fill:var(--accent);} .fig svg .gr{fill:var(--basic);} .fig svg .cy{fill:var(--inter);} .fig svg .rd{fill:var(--prin);}
.fig svg .box{fill:var(--bg-panel);stroke:var(--line);stroke-width:1.5;}
.fig svg .tl{fill:rgba(255,180,84,.14);stroke:var(--accent);stroke-width:1.5;}
.fig svg .dl{fill:rgba(126,200,227,.14);stroke:#7ec8e3;stroke-width:1.5;}
.fig svg .pl{fill:rgba(159,223,159,.14);stroke:#9fdf9f;stroke-width:1.5;}
.fig svg .er{fill:rgba(255,157,157,.14);stroke:#ff9d9d;stroke-width:1.5;}
.fig svg .grp{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4;}
.fig svg .ln{stroke:var(--line);stroke-width:1.5;fill:none;}
.fig svg .lna{stroke:var(--accent);stroke-width:2;fill:none;}
.fig svg .lnc{stroke:#7ec8e3;stroke-width:2;fill:none;}
.fig svg .lng{stroke:#9fdf9f;stroke-width:2;fill:none;}
.fig svg .lnr{stroke:#ff9d9d;stroke-width:2;fill:none;}
.fig svg .lnd{stroke:var(--text-dim);stroke-width:1.3;fill:none;stroke-dasharray:5 4;}
.fig svg .ah{fill:var(--accent);} .fig svg .ahc{fill:#7ec8e3;} .fig svg .ahd{fill:var(--text-dim);} .fig svg .ahr{fill:#ff9d9d;}
.fu{border:1px solid var(--line-soft);border-radius:6px;margin-bottom:8px;background:rgba(18,48,73,.5);}
.fu summary{padding:10px 14px;cursor:pointer;font-size:14px;line-height:1.5;list-style:none;display:flex;gap:10px;}
.fu summary::-webkit-details-marker{display:none;}
.fu summary::before{content:'?';font-family:var(--mono);color:var(--accent);font-weight:700;}
.fu[open] summary{color:var(--accent);}
.fu .fa{padding:0 14px 12px 34px;font-size:14px;line-height:1.65;color:var(--text);}
.callout{border-radius:6px;padding:13px 16px;margin:18px 0 0;font-size:14px;line-height:1.65;}
.callout b{font-family:var(--mono);font-size:11px;letter-spacing:.08em;display:block;margin-bottom:3px;}
.callout.pit{background:rgba(255,157,157,.08);border:1px solid rgba(255,157,157,.35);}
.callout.pit b{color:var(--prin);}
.callout.ver{background:rgba(255,212,121,.06);border:1px dashed rgba(255,212,121,.55);}
.callout.ver b{color:var(--adv);}
.notes{width:100%;min-height:70px;background:var(--code-bg);border:1px solid var(--line-soft);border-radius:6px;color:var(--text);
  padding:10px 12px;font-family:var(--sans);font-size:13.5px;resize:vertical;outline:none;}
.notes:focus{border-color:var(--accent);}
.rate-bar{position:sticky;bottom:0;margin:30px -56px 0;padding:14px 56px;background:rgba(10,26,44,.94);backdrop-filter:blur(6px);
  border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.rate-bar .lbl{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-right:4px;}
.rbtn{border:1.5px solid var(--line);background:var(--bg-panel);color:var(--text);border-radius:6px;padding:9px 18px;cursor:pointer;font-size:14px;font-weight:600;}
.rbtn small{font-family:var(--mono);font-weight:400;color:var(--text-faint);margin-left:6px;}
.rbtn.got:hover,.rbtn.got.sel{border-color:var(--got);background:rgba(159,223,159,.15);color:var(--got);}
.rbtn.shaky:hover,.rbtn.shaky.sel{border-color:var(--shaky);background:rgba(255,212,121,.15);color:var(--shaky);}
.rbtn.missed:hover,.rbtn.missed.sel{border-color:var(--missed);background:rgba(255,157,157,.15);color:var(--missed);}
.rate-bar .sp{flex:1;}
.footer-nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;}
.footer-nav .btn{min-width:110px;}

/* ---------- Mock ---------- */
.setup-grid{display:grid;gap:22px;}
.setup-grid .chip-row .chip{font-size:12px;padding:6px 12px;}
.mock-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-family:var(--mono);font-size:12px;color:var(--text-dim);gap:10px;flex-wrap:wrap;}
.mock-head b{color:var(--accent);}
.mock-prog{height:4px;background:var(--line-soft);border-radius:2px;margin-bottom:22px;overflow:hidden;}
.mock-prog i{display:block;height:100%;background:var(--accent);}
.sum-list{list-style:none;margin:0;padding:0;}
.sum-list li{padding:8px 12px;border:1px solid var(--line-soft);border-radius:5px;margin-bottom:6px;background:rgba(18,48,73,.5);cursor:pointer;display:flex;gap:10px;font-size:13.5px;}
.sum-list li:hover{border-color:var(--accent);}
.modlist{list-style:none;margin:0;padding:0;}
.modlist li{display:flex;gap:10px;align-items:baseline;padding:9px 12px;border:1px solid var(--line-soft);border-radius:5px;margin-bottom:6px;background:rgba(18,48,73,.5);cursor:pointer;font-size:14px;}
.modlist li:hover{border-color:var(--accent);}
.modlist .qn{font-family:var(--mono);font-size:11px;color:var(--text-faint);width:34px;flex-shrink:0;}
.modlist .qt{flex:1;}
.empty{color:var(--text-dim);padding:30px;border:1px dashed var(--line);border-radius:8px;text-align:center;line-height:1.7;}

/* ---------- Misc ---------- */
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--bg-panel);border:1px solid var(--accent);color:var(--text);
  padding:10px 18px;border-radius:6px;font-size:13px;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.4);}
.overlay{position:fixed;inset:0;background:rgba(4,10,18,.7);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--bg-sidebar);border:1px solid var(--line);border-radius:8px;padding:22px 24px;max-width:440px;width:100%;}
.modal p{margin:0 0 18px;line-height:1.6;font-size:14.5px;}
.modal .row{display:flex;gap:10px;justify-content:flex-end;}
.warn{border:1px solid rgba(255,212,121,.5);background:rgba(255,212,121,.06);padding:10px 14px;border-radius:6px;font-size:13px;color:var(--adv);margin-bottom:16px;}
::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;} ::-webkit-scrollbar-track{background:transparent;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

@media (max-width:900px){
  .sidebar{position:fixed;left:-330px;top:0;z-index:20;transition:left .2s;width:310px;}
  .sidebar.open{left:0;box-shadow:0 0 40px rgba(0,0,0,.6);}
  .menu-btn{display:inline-block;}
  .topbar{padding:12px 16px;}
  .content{padding:24px 18px 100px;}
  .rate-bar{margin:26px -18px 0;padding:12px 18px;}
  .q-title{font-size:20px;}
  .hero h2{font-size:26px;}
}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar" aria-label="Question navigation">
    <div class="sidebar-header" id="homeLink" title="Back to overview">
      <p class="kicker">ZNS · Q&amp;A STUDY GUIDE</p>
      <h1>Basics to Principal-level</h1>
      <div class="stat-row"><span><b id="statShown">0</b> shown</span><span><b id="statTotal">0</b> total</span><span><b id="statDone">0</b> rated</span></div>
    </div>
    <div class="search-box"><input id="searchInput" type="search" placeholder="Search questions &amp; answers…   ( / )" aria-label="Search questions"></div>

DIAGRAMS.conv_vs_zns={title:'Conventional versus zoned placement',cap:'Left: the device mixes hot and cold pages in the same erase blocks, so GC must copy live pages before it can erase. Right: the host puts data of one lifetime in one zone, so resetting a dead zone frees it with nothing to copy. In the top boxes amber is the host and blue is the device.',svg:`<svg viewBox="0 0 760 372" role="img" aria-label="Conventional SSD with mixed placement and garbage collection versus zoned placement with zone reset"><title>Conventional SSD with mixed placement and garbage collection versus zoned placement with zone reset</title><rect class="grp" x="10" y="32" width="360" height="304" rx="6" /><rect class="grp" x="390" y="32" width="360" height="304" rx="6" /><text class="h" x="190" y="24" text-anchor="middle">Conventional SSD</text><text class="h" x="570" y="24" text-anchor="middle">Zoned (ZNS) SSD</text><rect class="tl" x="30" y="48" width="320" height="44" rx="6" /><text class="s h" x="190" y="67" text-anchor="middle">Host: hot and cold data mixed</text><text class="xs d" x="190" y="83" text-anchor="middle">any LBA, any order, overwrite allowed</text><rect class="dl" x="30" y="112" width="320" height="44" rx="6" /><text class="s h" x="190" y="131" text-anchor="middle">Device FTL decides placement</text><text class="xs d" x="190" y="147" text-anchor="middle">page-level L2P, GC, large over-provisioning</text><rect class="box" x="30" y="182" width="93" height="30" rx="4" /><rect class="er" x="36" y="188" width="18" height="18" rx="2" /><text class="xs rd" x="45.0" y="201" text-anchor="middle">x</text><rect class="dl" x="57" y="188" width="18" height="18" rx="2" /><rect class="er" x="78" y="188" width="18" height="18" rx="2" /><text class="xs rd" x="87.0" y="201" text-anchor="middle">x</text><rect class="tl" x="99" y="188" width="18" height="18" rx="2" /><rect class="box" x="150" y="182" width="93" height="30" rx="4" /><rect class="dl" x="156" y="188" width="18" height="18" r DIAGRAMS.zonemodel={title:'Zone size, zone capacity and the write pointer',cap:'Each zone spans ZSZE LBAs but only the first ZCAP LBAs are usable. The write pointer marks the next LBA to write and only moves forward. Zone 2 has been filled to its capacity, so the zone is Full.',svg:`<svg viewBox="0 0 760 312" role="img" aria-label="LBA space divided into three zones with zone size, zone capacity and write pointer"><title>LBA space divided into three zones with zone size, zone capacity and write pointer</title><text class="xs d" x="40" y="16" text-anchor="start">LBA space of the namespace, in increasing LBA order, zones back to back</text><rect class="box" x="40" y="62" width="220" height="50" rx="3" /><rect class="box" x="260" y="62" width="220" height="50" rx="3" /><rect class="box" x="480" y="62" width="220" height="50" rx="3" /><rect class="dl" x="40" y="62" width="100" height="50" rx="3" /><rect class="grp" x="190" y="62" width="70" height="50" rx="0" /><text class="xs f" x="225.0" y="91" text-anchor="middle">not usable</text><text class="xs" x="90.0" y="91" text-anchor="middle">written</text><text class="s h" x="44" y="146" text-anchor="start">Zone 0</text><text class="xs d" x="44" y="130" text-anchor="start">ZSLBA = 0</text><line class="ln" x1="40" y1="112" x2="40" y2="120"/><rect class="dl" x="260" y="62" width="60" height="50" rx="3" /><rect class="grp" x="410" y="62" width="70" height="50" rx="0" /><text class="xs f" x="445.0" y="91" text-anchor="middle">not usable</text><text class="xs" x="290.0" y="91" text-anchor="middle">written</text><text class="s h" x="264" y="146" text-anchor="start">Zone 1</text><text class="xs d" x="264" y="130" text-anchor="start">ZSLBA = 1 x ZSZE</text><line class="ln" x1="260" y1="112" x2="260" y2="120"/><rect class="dl" x="480" y="62" width="150" height="50" rx="3" /><rect class="grp" x="630" y="62" width="70" height="50" rx="0" /><text class="xs f" x="665.0" y="91" text-anchor="middle">not usable</text><text class="xs" x="555.0" y="91" text-anchor="middle">written to capacity</text><text class="s h" x="484" y="146" text-anchor="start">Zone 2</text><text class="xs d" x="484" y="130" text-anchor="start">ZSLBA = 2 x ZSZE</text><line class="ln" x1="480" y1="112" x2="480" y2="120"/><line class="ln" x1="700" y1="112" x2="700" y2="120"/><line class="lna" x1="140" y1="34" x2="140.0" y2="54.0"/><polygon class="ah" points="140.0,62.0 135.5,53.0 144.5,53.0"/><text class="xs ac" x="148" y="32" text-anchor="start">WP of zone 0</text><line class="lna" x1="320" y1="34" x2="320.0" y2="54.0"/><polygon class="ah" points="320.0,62.0 315.5,53.0 324.5,53.0"/><text class="xs ac" x="328" y="32" text-anchor="start">WP of zone 1</text><text class="xs d" x="540" y="32" text-anchor="start">Full: WP no longer valid</text><line class="ln" x1="40" y1="178" x2="190" y2="178"/><line class="ln" x1="40" y1="172" x2="40" y2="178"/><line class="ln" x1="190" y1="172" x2="190" y2="178"/><text class="s gr" x="40" y="198" text-anchor="start">ZCAP: usable LBAs, counted from ZSLBA (at most ZSZE)</text><line class="ln" x1="40" y1="226" x2="260" y2="226"/><line class="ln" x1="40" y1="220" x2="40" y2="226"/><line class="ln" x1="260" y1="220" x2="260" y2="226"/><text class="s cy" x="40" y="246" text-anchor="start">ZSZE: LBAs the zone occupies in the address space</text><text class="xs d" x="40" y="282" text-anchor="start">Zone n starts at LBA n x ZSZE. ZSZE is the same for every zone. The write pointer moves only forward until Reset Zone.</text><text class="xs d" x="40" y="298" text-anchor="start">Blue is written, plain is writable up to ZCAP, dashed is the gap from ZCAP to ZSZE. Zone 2 is Full.</text></svg>`};
DIAGRAMS.zstates={title:'Zone state machine',cap:'Host commands are amber, controller-initiated moves are dashed. Blue states are the two open states, red states are degraded. Only transitions the question states outright are drawn; edge cases such as Close on an Empty zone are left out.',svg:`<svg viewBox="0 0 760 408" role="img" aria-label="Zone state machine with seven states and command-labelled transitions"><title>Zone state machine with seven states and command-labelled transitions</title><rect class="grp" x="10" y="96" width="610" height="196" rx="6" /><text class="xs f" x="22" y="112" text-anchor="start">Empty, open or Closed</text><rect class="grp" x="220" y="108" width="190" height="168" rx="6" /><text class="xs f" x="232" y="122" text-anchor="start">open zones</text><rect class="box" x="30" y="175" width="110" height="46" rx="6" /><text class="s h" x="85" y="203" text-anchor="middle">Empty</text><rect class="dl" x="235" y="132" width="160" height="40" rx="6" /><text class="s h" x="315" y="157" text-anchor="middle">Implicitly Opened</text><rect class="dl" x="235" y="224" width="160" height="40" rx="6" /><text class="s h" x="315" y="249" text-anchor="middle">Explicitly Opened</text><rect class="box" x="485" y="165" width="100" height="66" rx="6" /><text class="s h" x="535" y="202" text-anchor="middle">Closed</text><rect class="box" x="690" y="175" width="60" height="46" rx="6" /><text class="s h" x="720" y="203" text-anchor="middle">Full</text><rect class="er" x="140" y="12" width="130" height="44" rx="6" /><text class="s h" x="205" y="31" text-anchor="middle">Read Only</text><text class="xs d" x="205" y="46" text-anchor="middle">no writes</text><rect class="er" x="455" y="12" width="130" height="44" rx="6" /><text class="s h" x="520" y="31" text-anchor="middle">Offline</text><text class="xs d" x="520" y="46" text-anchor="middle">no reads or writes</text><line class="lna" x1="140" y1="185" x2="227.3" y2="158.3"/><polygon class="ah" points="235.0,156.0 227.7,162.9 225.1,154.3"/><text class="xs ac" x="190" y="157" text-anchor="end">Write, Append</text><line class="lna" x1="140" y1="211" x2="227.3" y2="234.0"/><polygon class="ah" points="235.0,236.0 225.2,238.1 227.4,229.4"/><text class="xs ac" x="196" y="246" text-anchor="end">Open Zone</text><line class="lna" x1="315" y1="172" x2="315.0" y2="216.0"/><polygon class="ah" points="315.0,224.0 310.5,215.0 319.5,215.0"/><text class="xs ac" x="323" y="202" text-anchor="start">Open Zone</text><line class="lna" x1="410" y1="198" x2="477.0" y2="198.0"/><polygon class="ah" points="485.0,198.0 476.0,202.5 476.0,193.5"/><text class="xs ac" x="447" y="190" text-anchor="middle">Close Zone</text><line class="lna" x1="485" y1="180" x2="402.8" y2="159.9"/><polygon class="ah" points="395.0,158.0 404.8,155.8 402.7,164.5"/><text class="xs ac" x="452" y="162" text-anchor="middle">Write</text><line class="lna" x1="485" y1="216" x2="402.8" y2="234.3"/><polygon class="ah" points="395.0,236.0 402.8,229.7 404.8,238.4"/><text class="xs ac" x="440" y="252" text-anchor="middle">Open Zone</text><line class="lna" x1="620" y1="198" x2="682.0" y2="198.0"/><polygon class="ah" points="690.0,198.0 681.0,202.5 681.0,193.5"/><text class="xs ac" x="655" y="190" text-anchor="middle">Finish Zone</text><line class="lna" x1="720" y1="221" x2="720" y2="316"/><line class="lna" x1="315" y1="276" x2="315" y2="316"/><line class="lna" x1="535" y1="231" x2="535" y2="316"/><polyline class="lna" points="720,316 85,316 85.0,229.0"/><polygon class="ah" points="85.0,221.0 89.5,230.0 80.5,230.0"/><text class="xs ac" x="400" y="338" text-anchor="middle">Reset Zone from open, Closed or Full: WP becomes ZSLBA, zone is Empty</text><line class="lna" x1="270" y1="34" x2="447.0" y2="34.0"/><polygon class="ah" points="455.0,34.0 446.0,38.5 446.0,29.5"/><text class="xs ac" x="362" y="26" text-anchor="middle">Offline Zone</text><text class="xs d" x="362" y="50" text-anchor="middle">host command</text><line class="lnd" x1="205" y1="96" x2="205.0" y2="64.0"/><polygon class="ahd" points="205.0,56.0 209.5,65.0 200.5,65.0"/><text class="xs d" x="213" y="80" text-anchor="start">controller</text><line class="lnd" x1="520" y1="96" x2="520.0" y2="64.0"/><polygon class="ahd" points="520.0,56.0 524.5,65.0 515.5,65.0"/><text class="xs d" x="528" y="80" text-anchor="start">controller</text><text class="xs d" x="20" y="366" text-anchor="start">Finish Zone works from Empty, open and Closed zones. A write that reaches ZCAP also takes an open zone to Full.</text><text class="xs d" x="20" y="381" text-anchor="start">The controller may close an Implicitly Opened zone to free an open resource. It never closes an Explicitly Opened one.</text><text class="xs d" x="20" y="396" text-anchor="start">Dashed: the controller moves a zone to Read Only or Offline for media reasons (source states not drawn). Offline is terminal.</text></svg>`};
DIAGRAMS.append={title:'Concurrent Zone Appends to one zone',cap:'Three appends to the same zone are in flight at once. The controller serializes them at the write pointer and hands each one its address in the completion entry. Amber is the host, blue is the controller and device.',svg:`<svg viewBox="0 0 760 372" role="img" aria-label="Three concurrent Zone Append commands to one zone, with the controller assigning LBAs returned in completion entries"><title>Three concurrent Zone Append commands to one zone, with the controller assigning LBAs returned in completion entries</title><rect class="tl" x="20" y="20" width="220" height="52" rx="6" /><text class="s h" x="130" y="40" text-anchor="middle">Append A</text><text class="xs d" x="130" y="58" text-anchor="middle">ZSLBA 0x1000, 8 LBAs</text><line class="lna" x1="60" y1="72" x2="60.0" y2="120.0"/><polygon class="ah" points="60.0,128.0 55.5,119.0 64.5,119.0"/><text class="xs ac" x="68" y="104" text-anchor="start">submit</text><line class="lnc" x1="140" y1="128" x2="140.0" y2="80.0"/><polygon class="ahc" points="140.0,72.0 144.5,81.0 135.5,81.0"/><text class="xs cy" x="148" y="96" text-anchor="start">CQE:</text><text class="xs cy" x="148" y="110" text-anchor="start">ALBA 0x1010</text><rect class="tl" x="270" y="20" width="220" height="52" rx="6" /><text class="s h" x="380" y="40" text-anchor="middle">Append B</text><text class="xs d" x="380" y="58" text-anchor="middle">ZSLBA 0x1000, 16 LBAs</text><line class="lna" x1="310" y1="72" x2="310.0" y2="120.0"/><polygon class="ah" points="310.0,128.0 305.5,119.0 314.5,119.0"/><text class="xs ac" x="318" y="104" text-anchor="start">submit</text><line class="lnc" x1="390" y1="128" x2="390.0" y2="80.0"/><polygon class="ahc" points="390.0,72.0 394.5,81.0 385.5,81.0"/><text class="xs cy" x="398" y="96" text-anchor="start">CQE:</text><text class="xs cy" x="398" y="110" text-anchor="start">ALBA 0x1000</text><rect class="tl" x="520" y="20" width="220" height="52" rx="6" /><text class="s h" x="630" y="40" text-anchor="middle">Append C</text><text class="xs d" x="630" y="58" text-anchor="middle">ZSLBA 0x1000, 8 LBAs</text><line class="lna" x1="560" y1="72" x2="560.0" y2="120.0"/><polygon class="ah" points="560.0,128.0 555.5,119.0 564.5,119.0"/><text class="xs ac" x="568" y="104" text-anchor="start">submit</text><line class="lnc" x1="640" y1="128" x2="640.0" y2="80.0"/><polygon class="ahc" points="640.0,72.0 644.5,81.0 635.5,81.0"/><text class="xs cy" x="648" y="96" text-anchor="start">CQE:</text><text class="xs cy" x="648" y="110" text-anchor="start">ALBA 0x1018</text><rect class="dl" x="20" y="128" width="720" height="48" rx="6" /><text class="s h" x="380" y="147" text-anchor="middle">Controller owns the write pointer: appends may arrive in any order, from any queue</text><text class="xs d" x="380" y="164" text-anchor="middle">here it happens to process B, then A, then C, and places each at the current WP</text><rect class="box" x="20" y="226" width="90" height="50" rx="3" /><text class="xs d" x="65" y="255" text-anchor="middle">earlier data</text><rect class="dl" x="110" y="226" width="180" height="50" rx="3" /><text class="s h" x="200" y="248" text-anchor="middle">B</text><text class="xs" x="200" y="265" text-anchor="middle">0x1000 - 0x100F</text><rect class="dl" x="290" y="226" width="90" height="50" rx="3" /><text class="s h" x="335" y="248" text-anchor="middle">A</text><text class="xs" x="335" y="265" text-anchor="middle">0x1010</text><rect class="dl" x="380" y="226" width="90" height="50" rx="3" /><text class="s h" x="425" y="248" text-anchor="middle">C</text><text class="xs" x="425" y="265" text-anchor="middle">0x1018</text><rect class="grp" x="470" y="226" width="270" height="50" rx="3" /><text class="xs f" x="605" y="255" text-anchor="middle">unwritten, up to ZCAP</text><line class="ln" x1="110" y1="276" x2="110" y2="284"/><text class="xs d" x="110" y="297" text-anchor="middle">0x1000</text><line class="ln" x1="290" y1="276" x2="290" y2="284"/><text class="xs d" x="290" y="297" text-anchor="middle">0x1010</text><line class="ln" x1="380" y1="276" x2="380" y2="284"/><text class="xs d" x="380" y="297" text-anchor="middle">0x1018</text><line class="ln" x1="470" y1="276" x2="470" y2="284"/><text class="xs d" x="470" y="297" text-anchor="middle">0x1020</text><text class="xs ac" x="110" y="313" text-anchor="middle">WP before</text><text class="xs ac" x="470" y="313" text-anchor="middle">WP after</text><line class="lnc" x1="200" y1="176" x2="200.0" y2="218.0"/><polygon class="ahc" points="200.0,226.0 195.5,217.0 204.5,217.0"/><text class="xs d" x="208" y="205" text-anchor="start">1st</text><line class="lnc" x1="335" y1="176" x2="335.0" y2="218.0"/><polygon class="ahc" points="335.0,226.0 330.5,217.0 339.5,217.0"/><text class="xs d" x="343" y="205" text-anchor="start">2nd</text><line class="lnc" x1="425" y1="176" x2="425.0" y2="218.0"/><polygon class="ahc" points="425.0,226.0 420.5,217.0 429.5,217.0"/><text class="xs d" x="433" y="205" text-anchor="start">3rd</text><text class="xs d" x="20" y="346" text-anchor="start">LBAs are illustrative. The host chose neither the order nor the addresses: it learns each address from the CQE.</text><text class="xs d" x="20" y="362" text-anchor="start">Every append names the zone start, not a write address, so none can fail because a peer moved the write pointer first.</text></svg>`};
DIAGRAMS.zoneres={title:'Active versus open zones',cap:'Two nested sets with two limits. Open zones (blue) are inside the active set, Closed zones are active but not open. Amber arrows show a zone moving between states and what each move takes or gives back.',svg:`<svg viewBox="0 0 760 392" role="img" aria-label="Nested active and open zone sets with MAR and MOR limits and zone state moves between them"><title>Nested active and open zone sets with MAR and MOR limits and zone state moves between them</title><rect class="grp" x="10" y="40" width="150" height="290" rx="6" /><text class="xs f" x="20" y="58" text-anchor="start">hold no resource</text><rect class="box" x="20" y="104" width="130" height="44" rx="6" /><text class="s h" x="85" y="131" text-anchor="middle">Empty</text><rect class="box" x="20" y="158" width="130" height="44" rx="6" /><text class="s h" x="85" y="185" text-anchor="middle">Full</text><rect class="er" x="20" y="212" width="130" height="44" rx="6" /><text class="s h" x="85" y="239" text-anchor="middle">Read Only</text><rect class="er" x="20" y="266" width="130" height="44" rx="6" /><text class="s h" x="85" y="293" text-anchor="middle">Offline</text><rect class="grp" x="230" y="40" width="520" height="290" rx="6" /><text class="s h ac" x="240" y="58" text-anchor="start">Active zones: count &lt;= MAR</text><rect class="grp" x="256" y="72" width="178" height="228" rx="6" /><text class="xs h cy" x="266" y="90" text-anchor="start">Open zones: count &lt;= MOR</text><rect class="dl" x="270" y="104" width="150" height="44" rx="6" /><text class="s h" x="345" y="131" text-anchor="middle">Implicitly Opened</text><rect class="dl" x="270" y="196" width="150" height="44" rx="6" /><text class="s h" x="345" y="223" text-anchor="middle">Explicitly Opened</text><rect class="box" x="620" y="140" width="115" height="90" rx="6" /><text class="s h" x="677" y="176" text-anchor="middle">Closed</text><text class="xs d" x="677" y="194" text-anchor="middle">keeps data</text><text class="xs d" x="677" y="207" text-anchor="middle">and WP</text><line class="lna" x1="150" y1="126" x2="262.0" y2="126.0"/><polygon class="ah" points="270.0,126.0 261.0,130.5 261.0,121.5"/><text class="xs ac" x="190" y="100" text-anchor="middle">Write or</text><text class="xs ac" x="190" y="111" text-anchor="middle">Open Zone</text><text class="xs d" x="190" y="141" text-anchor="middle">+1 active</text><text class="xs d" x="190" y="152" text-anchor="middle">+1 open</text><line class="lna" x1="345" y1="148" x2="345.0" y2="188.0"/><polygon class="ah" points="345.0,196.0 340.5,187.0 349.5,187.0"/><text class="xs ac" x="353" y="168" text-anchor="start">Open Zone</text><text class="xs d" x="353" y="181" text-anchor="start">(no change)</text><line class="lna" x1="434" y1="156" x2="612.0" y2="156.0"/><polygon class="ah" points="620.0,156.0 611.0,160.5 611.0,151.5"/><text class="xs ac" x="527" y="146" text-anchor="middle">Close Zone</text><text class="xs d" x="527" y="172" text-anchor="middle">frees 1 open, keeps 1 active</text><line class="lna" x1="620" y1="214" x2="442.0" y2="214.0"/><polygon class="ah" points="434.0,214.0 443.0,209.5 443.0,218.5"/><text class="xs ac" x="527" y="205" text-anchor="middle">Open Zone</text><text class="xs d" x="527" y="231" text-anchor="middle">needs 1 free open resource</text><text class="xs d" x="527" y="246" text-anchor="middle">a Write here opens it implicitly</text><text class="xs d" x="20" y="352" text-anchor="start">Open is a subset of active: every open zone also holds an active resource, and Closed zones are active but not open.</text><text class="xs d" x="20" y="367" text-anchor="start">Two independent budgets. Out of active resources blocks new zones from starting, out of open resources blocks new writers.</text><text class="xs d" x="20" y="382" text-anchor="start">Empty, Full, Read Only and Offline zones consume neither. Reaching Full, Reset or a controller fault releases what a zone held.</text></svg>`};
DIAGRAMS.zns_ftl={title:'A zone striped over dies and channels',cap:'The host sees only zone start, size, capacity, WP and state. Inside, a zone is a stripe of erase blocks over every die, so sequential writes use all channels in parallel and Reset Zone releases and erases the whole set.',svg:`<svg viewBox="0 0 760 398" role="img" aria-label="A zone mapped onto 12 dies over 6 channels as a stripe of 48 erase blocks that Reset Zone erases together"><title>A zone mapped onto 12 dies over 6 channels as a stripe of 48 erase blocks that Reset Zone erases together</title><rect class="tl" x="20" y="14" width="210" height="46" rx="6" /><text class="s h" x="125" y="33" text-anchor="middle">Zone k, as the host sees it</text><text class="xs d" x="125" y="50" text-anchor="middle">ZSLBA, ZSZE, ZCAP, WP, state</text><rect class="dl" x="290" y="14" width="230" height="46" rx="6" /><text class="s h" x="405" y="33" text-anchor="middle">Write buffer</text><text class="xs d" x="405" y="50" text-anchor="middle">cut into program units</text><rect class="dl" x="580" y="14" width="160" height="46" rx="6" /><text class="s h" x="660" y="33" text-anchor="middle">Per-zone record</text><text class="xs d" x="660" y="50" text-anchor="middle">state, WP, 48 blocks</text><line class="lna" x1="230" y1="37" x2="282.0" y2="37.0"/><polygon class="ah" points="290.0,37.0 281.0,41.5 281.0,32.5"/><line class="ln" x1="75" y1="84" x2="650" y2="84"/><line class="lnc" x1="405" y1="60" x2="405.0" y2="76.0"/><polygon class="ahc" points="405.0,84.0 400.5,75.0 409.5,75.0"/><line class="lnd" x1="660" y1="60" x2="660.0" y2="76.0"/><polygon class="ahd" points="660.0,84.0 655.5,75.0 664.5,75.0"/><line class="ln" x1="75" y1="84" x2="75" y2="96"/><rect class="dl" x="45" y="96" width="60" height="20" rx="6" /><text class="xs h" x="75" y="110" text-anchor="middle">CH0</text><line class="ln" x1="75" y1="116" x2="75" y2="256"/><line class="ln" x1="190" y1="84" x2="190" y2="96"/><rect class="dl" x="160" y="96" width="60" height="20" rx="6" /><text class="xs h" x="190" y="110" text-anchor="middle">CH1</text><line class="ln" x1="190" y1="116" x2="190" y2="256"/><line class="ln" x1="305" y1="84" x2="305" y2="96"/><rect class="dl" x="275" y="96" width="60" height="20" rx="6" /><text class="xs h" x="305" y="110" text-anchor="middle">CH2</text><line class="ln" x1="305" y1="116" x2="305" y2="256"/><line class="ln" x1="420" y1="84" x2="420" y2="96"/><rect class="dl" x="390" y="96" width="60" height="20" rx="6" /><text class="xs h" x="420" y="110" text-anchor="middle">CH3</text><line class="ln" x1="420" y1="116" x2="420" y2="256"/><line class="ln" x1="535" y1="84" x2="535" y2="96"/><rect class="dl" x="505" y="96" width="60" height="20" rx="6" /><text class="xs h" x="535" y="110" text-anchor="middle">CH4</text><line class="ln" x1="535" y1="116" x2="535" y2="256"/><line class="ln" x1="650" y1="84" x2="650" y2="96"/><rect class="dl" x="620" y="96" width="60" height="20" rx="6" /><text class="xs h" x="650" y="110" text-anchor="middle">CH5</text><line class="ln" x1="650" y1="116" x2="650" y2="256"/><rect class="box" x="25" y="126" width="100" height="58" rx="5" /><text class="xs" x="33" y="141" text-anchor="start">Die 0</text><text class="xs d" x="119" y="141" text-anchor="end">#1</text><rect class="pl" x="33" y="154" width="18" height="18" rx="2" /><rect class="pl" x="55" y="154" width="18" height="18" rx="2" /><rect class="pl" x="77" y="154" width="18" height="18" rx="2" /><rect class="pl" x="99" y="154" width="18" height="18" rx="2" /><rect class="box" x="140" y="126" width="100" height="58" rx="5" /><text class="xs" x="148" y="141" text-anchor="start">Die 0</text><text class="xs d" x="234" y="141" text-anchor="end">#2</text><rect class="pl" x="148" y="154" width="18" height="18" rx="2" /><rect class="pl" x="170" y="154" width="18" height="18" rx="2" /><rect class="pl" x="192" y="154" width="18" height="18" rx="2" /><rect class="pl" x="214" y="154" width="18" height="18" rx="2" /><rect class="box" x="255" y="126" width="100" height="58" rx="5" /><text class="xs" x="263" y="141" text-anchor="start">Die 0</text><text class="xs d" x="349" y="141" text-anchor="end">#3</text><rect class="pl" x="263" y="154" width="18" height="18" rx="2" /><rect class="pl" x="285" y="154" width="18" height="18" rx="2" /><rect class="pl" x="307" y="154" width="18" height="18" rx="2" /><rect class="pl" x="329" y="154" width="18" height="18" rx="2" /><rect class="box" x="370" y="126" width="100" height="58" rx="5" /><text class="xs" x="378" y="141" text-anchor="start">Die 0</text><text class="xs d" x="464" y="141" text-anchor="end">#4</text><rect class="pl" x="378" y="154" width="18" height="18" rx="2" /><rect class="pl" x="400" y="154" width="18" height="18" rx="2" /><rect class="pl" x="422" y="154" width="18" height="18" rx="2" /><rect class="pl" x="444" y="154" width="18" height="18" rx="2" /><rect class="box" x="485" y="126" width="100" height="58" rx="5" /><text class="xs" x="493" y="141" text-anchor="start">Die 0</text><text class="xs d" x="579" y="141" text-anchor="end">#5</text><rect class="pl" x="493" y="154" width="18" height="18" rx="2" /><rect class="pl" x="515" y="154" width="18" height="18" rx="2" /><rect class="pl" x="537" y="154" width="18" height="18" rx="2" /><rect class="pl" x="559" y="154" width="18" height="18" rx="2" /><rect class="box" x="600" y="126" width="100" height="58" rx="5" /><text class="xs" x="608" y="141" text-anchor="start">Die 0</text><text class="xs d" x="694" y="141" text-anchor="end">#6</text><rect class="pl" x="608" y="154" width="18" height="18" rx="2" /><rect class="pl" x="630" y="154" width="18" height="18" rx="2" /><rect class="pl" x="652" y="154" width="18" height="18" rx="2" /><rect class="pl" x="674" y="154" width="18" height="18" rx="2" /><rect class="box" x="25" y="198" width="100" height="58" rx="5" /><text class="xs" x="33" y="213" text-anchor="start">Die 1</text><text class="xs d" x="119" y="213" text-anchor="end">#7</text><rect class="pl" x="33" y="226" width="18" height="18" rx="2" /><rect class="pl" x="55" y="226" width="18" height="18" rx="2" /><rect class="pl" x="77" y="226" width="18" height="18" rx="2" /><rect class="pl" x="99" y="226" width="18" height="18" rx="2" /><rect class="box" x="140" y="198" width="100" height="58" rx="5" /><text class="xs" x="148" y="213" text-anchor="start">Die 1</text><text class="xs d" x="234" y="213" text-anchor="end">#8</text><rect class="pl" x="148" y="226" width="18" height="18" rx="2" /><rect class="pl" x="170" y="226" width="18" height="18" rx="2" /><rect class="pl" x="192" y="226" width="18" height="18" rx="2" /><rect class="pl" x="214" y="226" width="18" height="18" rx="2" /><rect class="box" x="255" y="198" width="100" height="58" rx="5" /><text class="xs" x="263" y="213" text-anchor="start">Die 1</text><text class="xs d" x="349" y="213" text-anchor="end">#9</text><rect class="pl" x="263" y="226" width="18" height="18" rx="2" /><rect class="pl" x="285" y="226" width="18" height="18" rx="2" /><rect class="pl" x="307" y="226" width="18" height="18" rx="2" /><rect class="pl" x="329" y="226" width="18" height="18" rx="2" /><rect class="box" x="370" y="198" width="100" height="58" rx="5" /><text class="xs" x="378" y="213" text-anchor="start">Die 1</text><text class="xs d" x="464" y="213" text-anchor="end">#10</text><rect class="pl" x="378" y="226" width="18" height="18" rx="2" /><rect class="pl" x="400" y="226" width="18" height="18" rx="2" /><rect class="pl" x="422" y="226" width="18" height="18" rx="2" /><rect class="pl" x="444" y="226" width="18" height="18" rx="2" /><rect class="box" x="485" y="198" width="100" height="58" rx="5" /><text class="xs" x="493" y="213" text-anchor="start">Die 1</text><text class="xs d" x="579" y="213" text-anchor="end">#11</text><rect class="pl" x="493" y="226" width="18" height="18" rx="2" /><rect class="pl" x="515" y="226" width="18" height="18" rx="2" /><rect class="pl" x="537" y="226" width="18" height="18" rx="2" /><rect class="pl" x="559" y="226" width="18" height="18" rx="2" /><rect class="box" x="600" y="198" width="100" height="58" rx="5" /><text class="xs" x="608" y="213" text-anchor="start">Die 1</text><text class="xs d" x="694" y="213" text-anchor="end">#12</text><rect class="pl" x="608" y="226" width="18" height="18" rx="2" /><rect class="pl" x="630" y="226" width="18" height="18" rx="2" /><rect class="pl" x="652" y="226" width="18" height="18" rx="2" /><rect class="pl" x="674" y="226" width="18" height="18" rx="2" /><line class="ln" x1="25" y1="270" x2="725" y2="270"/><line class="ln" x1="25" y1="264" x2="25" y2="270"/><line class="ln" x1="725" y1="264" x2="725" y2="270"/><text class="s gr" x="375" y="288" text-anchor="middle">One zone = one erase block per plane on every die = 12 dies x 4 planes = 48 blocks = 768 MiB</text><rect class="er" x="70" y="304" width="620" height="46" rx="6" /><text class="s h" x="380" y="324" text-anchor="middle">Reset Zone: the block list returns to the free pool and all 48 blocks are erased</text><text class="xs d" x="380" y="341" text-anchor="middle">No block holds data of any other zone, so nothing has to be copied first</text><text class="xs d" x="20" y="372" text-anchor="start">Example geometry: 6 channels x 2 dies, 4 planes per die, 16 MiB blocks. Layout and interleave are vendor specific.</text><text class="xs d" x="20" y="387" text-anchor="start">Green squares are erase blocks, four per die (one per plane). #n is the order program units visit the dies in this illustration.</text></svg>`};
DIAGRAMS.zrwa={title:'ZRWA window and write pointer',cap:'The window sits just above the committed write pointer. An explicit flush commits a range from WP up to the last LBA named, so WP moves up and the window slides with it. Amber is the writable window, blue is committed data, red is out of range.',svg:`<svg viewBox="0 0 760 372" role="img" aria-label="Zone Random Write Area window above the write pointer, before and after an explicit flush"><title>Zone Random Write Area window above the write pointer, before and after an explicit flush</title><text class="xs d" x="20" y="14" text-anchor="start">Offsets from ZSLBA increase to the right. WP is the committed write pointer.</text><text class="s h" x="20" y="38" text-anchor="start">1. Before</text><line class="ln" x1="120" y1="56" x2="320" y2="56"/><line class="ln" x1="120" y1="56" x2="120" y2="62"/><line class="ln" x1="320" y1="56" x2="320" y2="62"/><text class="xs ac" x="220.0" y="50" text-anchor="middle">ZRWASZ</text><line class="ln" x1="320" y1="56" x2="520" y2="56"/><line class="ln" x1="320" y1="56" x2="320" y2="62"/><line class="ln" x1="520" y1="56" x2="520" y2="62"/><text class="xs d" x="420.0" y="50" text-anchor="middle">second region: size VERIFY</text><rect class="dl" x="20" y="66" width="100" height="50" rx="3" /><text class="xs h" x="70.0" y="88" text-anchor="middle">committed</text><text class="xs d" x="70.0" y="104" text-anchor="middle">no overwrite</text><rect class="tl" x="120" y="66" width="200" height="50" rx="3" /><text class="s h" x="220" y="88" text-anchor="middle">ZRWA window</text><text class="xs d" x="220" y="104" text-anchor="middle">any order, overwrite ok</text><rect class="grp" x="320" y="66" width="200" height="50" rx="3" /><text class="s h" x="420" y="88" text-anchor="middle">second region</text><text class="xs d" x="420" y="104" text-anchor="middle">a write ending here flushes</text><rect class="er" x="520" y="66" width="220" height="50" rx="3" /><text class="s h" x="630.0" y="88" text-anchor="middle">beyond</text><text class="xs d" x="630.0" y="104" text-anchor="middle">Zone Invalid Write</text><line class="lna" x1="120" y1="142" x2="120.0" y2="124.0"/><polygon class="ah" points="120.0,116.0 124.5,125.0 115.5,125.0"/><text class="xs ac" x="128" y="136" text-anchor="start">WP</text><line class="lna" x1="170" y1="116" x2="170.0" y2="218.0"/><polygon class="ah" points="170.0,226.0 165.5,217.0 174.5,217.0"/><text class="xs ac" x="182" y="150" text-anchor="start">Flush Explicit ZRWA (Zone Send Action 11h)</text><text class="xs d" x="182" y="165" text-anchor="start">SLBA = last LBA to commit: [WP, SLBA] is committed,</text><text class="xs d" x="182" y="178" text-anchor="start">WP becomes SLBA + 1 and the window slides up</text><text class="s h" x="20" y="210" text-anchor="start">2. After the explicit flush</text><line class="ln" x1="200" y1="216" x2="400" y2="216"/><line class="ln" x1="200" y1="216" x2="200" y2="222"/><line class="ln" x1="400" y1="216" x2="400" y2="222"/><text class="xs ac" x="300.0" y="210" text-anchor="middle">ZRWASZ</text><line class="ln" x1="400" y1="216" x2="600" y2="216"/><line class="ln" x1="400" y1="216" x2="400" y2="222"/><line class="ln" x1="600" y1="216" x2="600" y2="222"/><text class="xs d" x="500.0" y="210" text-anchor="middle">second region: size VERIFY</text><rect class="dl" x="20" y="226" width="180" height="50" rx="3" /><text class="xs h" x="110.0" y="248" text-anchor="middle">committed</text><text class="xs d" x="110.0" y="264" text-anchor="middle">no overwrite</text><rect class="tl" x="200" y="226" width="200" height="50" rx="3" /><text class="s h" x="300" y="248" text-anchor="middle">ZRWA window</text><text class="xs d" x="300" y="264" text-anchor="middle">any order, overwrite ok</text><rect class="grp" x="400" y="226" width="200" height="50" rx="3" /><text class="s h" x="500" y="248" text-anchor="middle">second region</text><text class="xs d" x="500" y="264" text-anchor="middle">a write ending here flushes</text><rect class="er" x="600" y="226" width="140" height="50" rx="3" /><text class="s h" x="670.0" y="248" text-anchor="middle">beyond</text><text class="xs d" x="670.0" y="264" text-anchor="middle">Zone Invalid Write</text><line class="lna" x1="200" y1="302" x2="200.0" y2="284.0"/><polygon class="ah" points="200.0,276.0 204.5,285.0 195.5,285.0"/><text class="xs ac" x="208" y="296" text-anchor="start">new WP</text><text class="xs d" x="20" y="330" text-anchor="start">Committed data is sequential-only. Writes inside the window may come in any order and may overwrite until committed.</text><text class="xs d" x="20" y="345" text-anchor="start">A write that reaches into the second region also moves WP (implicit flush), with no flush command from the host.</text><text class="xs d" x="20" y="360" text-anchor="start">VERIFY: size of the second region, implicit-flush rounding (ZRWAFG units), and alignment rules for writes and flush ranges.</text></svg>`};

</script>
<script id="qdata">
var DATA={"modules":[{"id":1,"title":"Why Zoned Storage","desc":"The problem with conventional SSDs (write amplification, over-provisioning, tail latency), the zoned model, SMR heritage, host-managed vs device-managed, and what ZNS trades away."},{"id":2,"title":"ZNS Architecture & Command Set Basics","desc":"Where ZNS sits in the NVMe 2.x command-set architecture: Command Set Identifier, the Zoned Namespace Command Set, Identify structures, and how the LBA space is divided."},{"id":3,"title":"Zones, States & the Write Pointer","desc":"Zone types, the write pointer, zone descriptor contents, the state machine (Empty, Open, Closed, Full, Read Only, Offline) and every transition that matters."},{"id":4,"title":"Zone Management Commands","desc":"Zone Management Send actions (Open, Close, Finish, Reset, Offline, Set Zone Descriptor Extension, Flush) and Zone Management Receive (Report Zones, filters), including Select All semantics."},{"id":5,"title":"Zone Append","desc":"Zone Append semantics: device-chosen placement, returned LBA, ZASL, concurrency and ordering, how it removes the single-writer-per-zone constraint, and its interaction with PI and metadata."},{"id":6,"title":"Zone Resources: Active, Open & Excursions","desc":"MAR and MOR limits, implicit open eviction, zone active excursions, zone information changed events, and how the host must budget resources."},{"id":7,"title":"Errors, Status Codes & Read Rules","desc":"Zone-specific status codes, read-above-write-pointer behaviour, boundary errors, read-only/offline zones, and how the host and a validator should react."},{"id":8,"title":"ZNS Firmware & FTL Design","desc":"How a ZNS controller maps zones to NAND, buffers writes, handles zone reset, finish, power loss and wear, and how much FTL complexity remains."},{"id":9,"title":"Host Software Stack for Zoned Storage","desc":"Linux zoned block layer, zone write plugging, filesystems and databases that use zones, libzbd, nvme-cli zns support, fio zbd mode, SPDK and xNVMe."},{"id":10,"title":"ZNS Validation & Test Design","desc":"Designing a ZNS test plan: state-machine coverage, boundary and resource tests, concurrency with Zone Append, power-loss and reset testing, data integrity and tooling."},{"id":11,"title":"ZRWA, Simple Copy & Related Features","desc":"Zone Random Write Area, explicit vs implicit flush, Simple Copy, zone descriptor extensions, and how ZNS compares with FDP and conventional namespaces."},{"id":12,"title":"ZNS Scenarios & System Design","desc":"Principal-level design and debug scenarios: host GC design, capacity planning, migration from conventional, failure recovery, and full-stack triage of zoned workloads."}],"questions":[{"id":"1.01","level":"Basic","type":"Concept","fig":null,"tags":["nand","ftl","erase","program"],"q":"Why does a conventional SSD need an FTL, and what does that FTL cost?","short":"NAND is read and programmed in pages but erased only in whole blocks, and pages in a block are programmed in order, so data cannot be overwritten in place. A conventional SSD hides this behind a Flash Translation Layer that redirects every overwrite to a fresh location, tracks it in an L2P table and garbage-collects stale pages later. The costs are DRAM for the table, spare capacity, write amplification and latency variability.","deep":"- **The media rule:** program a page (for example 16 KiB), erase a block (many MiB, and larger once the firmware groups blocks across dies into a superblock). Overwrite means invalidate the old copy and write a new one elsewhere.\n- **The interface promise:** NVMe (NVM command set) lets the host overwrite any LBA at any time in any order. The FTL keeps that promise by remapping.\n- **What the FTL must do:** L2P mapping, write buffering and striping across channels and dies, garbage collection, wear leveling, bad block management, ECC and refresh.\n- **Four costs of the promise:**\n  - DRAM for the mapping table (about 1 GB per TB at 4 KiB granularity, see the numeric question later in this module).\n  - Over-provisioning (OP) so GC always has free blocks to work with.\n  - Write amplification (WAF): NAND writes greater than host writes, which burns endurance.\n  - Tail latency: GC copies share dies and channels with host I/O.\n- **Validation consequence:** behaviour depends on fill level and history. A fresh-out-of-box drive says little about steady state.","pitfall":"Treating GC as free background work. It steals die time and endurance, and its cost grows as the drive fills.","verify":null,"follow":[{"q":"What does Deallocate (TRIM) do for the FTL?","a":"It marks LBAs invalid so GC does not relocate stale data, which lowers WAF."},{"q":"Why is the erase block bigger than the program page?","a":"Erase is a whole-block electrical operation on shared substrate, so the granularity is set by the array design, not by choice."}],"mod":1},{"id":"1.02","level":"Basic","type":"Concept","fig":"conv_vs_zns","tags":["zoned-model","zones","write-pointer","host-managed"],"q":"What is the zoned storage idea, and how does it differ from a conventional block device?","short":"The LBA space is divided into fixed-size zones. Each zone must be written sequentially at its write pointer, and it can be rewritten only after the whole zone is reset. Because the device never sees overwrites, it needs no remapping or device GC. The host decides which data goes into which zone and reclaims space itself by copying live data and resetting zones. Placement and GC responsibility move from the device to the host.","deep":"| Aspect | Conventional SSD | Zoned (ZNS) SSD |\n|---|---|---|\n| Write rule | Any LBA, any order, overwrite allowed | Sequential at write pointer, per zone |\n| Reclaim | Device GC, invisible to host | Host copies live data, then resets zone |\n| Mapping | Page-level L2P, large table | Zone to erase-block mapping, tiny table |\n| Spare capacity | Large OP for GC headroom | Small reserve for bad blocks and metadata |\n| Data placement | Device guesses lifetimes | Host chooses zone, so lifetimes can align |\n| Latency source | Hidden GC and background work | Mostly visible host actions |\n\n- **Core trick:** if all data in a zone dies together, a reset frees it with zero copying, so GC moves nothing and WAF approaches 1.\n- **Contract, not magic:** the host must honor the write pointer and resource limits. See the Zones, States & the Write Pointer module for the rules.\n- **Host-managed:** the device exposes the media constraint instead of hiding it.","pitfall":"Describing zones as \"just big erase blocks\". A zone is a logical write-ordering contract, and its mapping to NAND is a firmware choice.","verify":null,"follow":[{"q":"What is the unit of reclaim?","a":"A whole zone (via reset), which maps to whole erase blocks inside the device."},{"q":"Does the host now see NAND geometry?","a":"Only coarsely: zone size and zone capacity, not pages or dies."}],"mod":1},{"id":"1.03","level":"Basic","type":"Concept","fig":null,"tags":["smr","zac","zbc","heritage"],"q":"Where does the zoned model come from, and what is the connection to SMR hard drives?","short":"Shingled magnetic recording overlaps tracks like roof shingles, so rewriting one track damages its neighbours and bands must be written sequentially. The T10 ZBC (SCSI) and T13 ZAC (ATA) standards exposed that as zones with write pointers, Report Zones and Reset Write Pointer. NVMe ZNS reuses the same host-managed zoned model for flash, so one Linux zoned block layer and the same tools serve both.","deep":"- **Why SMR needed it:** the write head is wider than the read element, so density gains come from overlapping tracks. In-place update of a middle track is impossible without rewriting the rest of the band.\n- **Zone types in ZAC and ZBC:**\n  - Conventional zones: random write, no write pointer, used for metadata.\n  - Sequential write required: only writes at the write pointer are accepted.\n  - Sequential write preferred: random writes are accepted but may be slow (host-aware drives).\n- **What ZNS kept:** write pointer, zone states, Report Zones, open, close, finish and reset semantics. The state machine is deliberately close to ZAC and ZBC.\n- **What ZNS changed:** all zones are sequential write required, zone capacity may be smaller than zone size, and Zone Append exists (see the Zone Append module).\n- **Typical sizes:** SMR zones are commonly 256 MiB. ZNS zone sizes are device-defined and often larger, so check the Identify data rather than assume.","pitfall":"Assuming ZNS inherited conventional or sequential-write-preferred zones. NVMe ZNS defines only sequential write required zones. Confirmed: ZNS 1.4 defines exactly one zone type, Sequential Write Required (2h); every other value is reserved (Figure 38). VERIFY: ZBC and ZAC zone type names and the 256 MiB typical zone size stay with the T10/T13 standards, outside the ZNS spec.","verify":null,"follow":[{"q":"Why does that matter to a firmware validator?","a":"Host tools such as blkzone and fio zonemode=zbd behave the same across SMR and ZNS, so test infrastructure is reusable."},{"q":"Does flash have SMR's overlap problem?","a":"No. Its constraint is page-order programming and block erase, but the resulting host contract looks similar."}],"mod":1},{"id":"1.04","level":"Intermediate","type":"Concept","fig":null,"tags":["host-managed","host-aware","drive-managed","models"],"q":"Compare drive-managed, host-aware and host-managed zoned devices. Where does ZNS fit?","short":"Drive-managed devices hide the sequential constraint behind their own translation layer and look like ordinary disks. Host-aware devices accept random writes but report zones and prefer sequential ones. Host-managed devices reject non-sequential writes, so the host must comply. ZNS is host-managed: every zone is sequential write required. A conventional NVMe SSD is the flash analogue of drive-managed.","deep":"| Model | Random writes | Host must know zones | Who hides the media |\n|---|---|---|---|\n| Drive-managed | Accepted | No | Device, always |\n| Host-aware | Accepted but penalised | Optional, for speed | Device, as a fallback |\n| Host-managed | Rejected (error) | Yes | Nobody; host adapts |\n\n- **Drive-managed SMR:** uses a persistent cache and its own translation layer. It behaves like a normal disk until sustained random writes exhaust the cache, then throughput collapses.\n- **Host-aware:** compatibility with legacy software, but performance is unpredictable when the host does not follow the rules, so it appears to have seen little use.\n- **Host-managed:** predictable and simple for the device, but software must be zone-aware. Linux reports it in `/sys/block/<dev>/queue/zoned` as `host-managed`.\n- **ZNS nuance:** there is no host-aware flavour. Later additions such as ZRWA give a limited random-write window inside a zone, but the namespace stays host-managed (see the ZRWA module).","pitfall":"Calling ZNS \"host-aware\". Errors on non-sequential writes are the defining host-managed behaviour.","verify":null,"follow":[{"q":"Why does the drive-managed cliff matter for SSD validation?","a":"It is the same pattern as a conventional SSD at steady state: fine until the hidden reclaim engine is overloaded."},{"q":"Can a legacy filesystem use a host-managed disk directly?","a":"No. It must be zone-aware, or sit behind a translation layer such as dm-zoned."}],"mod":1},{"id":"1.05","level":"Intermediate","type":"Concept","fig":null,"tags":["waf","gc","lifetime","mixed-placement"],"q":"Explain how garbage collection produces write amplification and why mixed data lifetimes make it worse.","short":"WAF is bytes programmed to NAND divided by bytes the host wrote. When GC reclaims a block, it must first copy the still-valid pages elsewhere. If a fraction v of the victim block is valid, freeing one block's worth of space costs v/(1-v) extra writes per host write, so WAF is 1/(1-v). Mixing short-lived and long-lived data in one block leaves blocks partly valid, which keeps v high.","deep":"1. Steady state: every host write consumes free space, so GC must free the same amount.\n2. Reclaiming a block with valid fraction v frees (1-v) of a block and costs a copy of v.\n3. Per unit of host data, the device writes 1 (host) plus v/(1-v) (relocation) = 1/(1-v).\n\n| Valid fraction v in victim | WAF = 1/(1-v) |\n|---|---|\n| 0 (all stale) | 1.0 |\n| 0.25 | 1.33 |\n| 0.50 | 2.0 |\n| 0.75 | 4.0 |\n| 0.80 | 5.0 |\n\n- **Why mixing hurts:** hot data dies quickly but sits next to cold data that stays. Blocks age into a partly valid state and GC keeps copying the cold pages again and again.\n- **Why zones help:** if the host groups by expected death time, a zone is either all valid or all stale, and reset frees it with v = 0.\n- **What OP does:** more spare capacity lowers the average v of the victims chosen, so WAF drops. See the OP numeric question below.","pitfall":"Quoting a WAF without the workload and fill level. WAF is a property of the workload, the OP and the firmware together.","verify":"Names of the media-written and host-written fields in the OCP SMART / Health Information Extended log.","follow":[{"q":"Is the v of the victim the same as average drive utilisation?","a":"No. Greedy GC picks the emptiest blocks, so victim v is lower than average valid fraction, but under uniform random writes it still rises steeply with fill."},{"q":"Where do you read WAF from a real drive?","a":"From vendor or OCP log fields for media writes versus the host-written counter in the standard SMART log."}],"mod":1},{"id":"1.06","level":"Intermediate","type":"Numeric","fig":null,"tags":["l2p","dram","mapping","capacity"],"q":"How much DRAM does a page-level L2P table need on a 4 TB SSD, and what does a zone-level mapping need instead?","short":"With 4 KiB mapping units and 4-byte entries, a 4 TiB drive needs 2^30 entries, which is 4 GiB of table, the familiar 1 GB per TB rule. A zoned device with 1 GiB zones only maps each zone to its erase blocks: 4096 zones x 64 blocks x 4 bytes is about 1 MiB, plus zone descriptors, roughly 1.25 MiB in total. That is about 3000 times smaller.","deep":"Assumptions: 4 TiB user capacity, 4 KiB mapping granularity, 4-byte physical addresses, 1 GiB zones, 16 MiB erase blocks, 64 bytes of state per zone.\n1. Page-level L2P: 4 TiB / 4 KiB = 2^42 / 2^12 = 2^30 entries. Times 4 bytes = 4 GiB.\n2. With a 16 KiB mapping unit (some large-capacity drives do this) it falls to 1 GiB, at the price of read-modify-write for small writes.\n3. Zoned: 4 TiB / 1 GiB = 4096 zones. Each zone is 1 GiB / 16 MiB = 64 blocks, at 4 bytes each = 256 bytes per zone. Total = 4096 x 256 B = 1 MiB.\n4. Zone state: 4096 x 64 B = 256 KiB. Total about 1.25 MiB. Ratio = 4 GiB / 1.25 MiB = about 3277.\n\n- **Why reads still work:** inside a zone the LBA-to-die, block and page mapping is arithmetic on the stripe layout, so no per-LBA table is needed.\n- **What does not shrink:** DRAM used for write buffers, per-block wear and validity metadata, bad block tables and firmware structures. Real ZNS drives may still carry DRAM for these, so the benefit is often lower cost and power rather than no DRAM.","pitfall":"Claiming a ZNS SSD ships with no DRAM. The mapping table shrinks by orders of magnitude, but other DRAM users remain.","verify":"Typical mapping granularity and entry width on shipping drives are vendor-specific, so present them as assumptions.","follow":[{"q":"Why is a 4-byte entry enough?","a":"2^32 units x 4 KiB = 16 TiB of addressable space, above the 4 TiB drive."},{"q":"Does the DRAM saving change the failure model?","a":"Yes. A small table can be persisted quickly, so power-loss recovery is simpler, but write-buffer contents still need capacitor-backed flushing."}],"mod":1},{"id":"1.07","level":"Intermediate","type":"Concept","fig":null,"tags":["zns","nvme","command-set","overview"],"q":"What exactly is ZNS in NVMe terms, and where does it stand in the market?","short":"ZNS is the NVMe Zoned Namespace Command Set. A namespace using it is divided into equal-size zones that are all sequential write required, each with a write pointer and a state. It adds Zone Management Send and Receive, an optional Zone Append command, and zone-specific identify data and status codes. It was standardized around 2020 and published as a command set specification with NVMe 2.0.","deep":"- **Command set model:** since NVMe 2.0, command sets are selected per namespace by a Command Set Identifier, so one controller can expose NVM and Zoned namespaces together. See the ZNS Architecture module.\n- **Core elements:** zone size and zone capacity, the write pointer, zone states, resource limits on open and active zones, and reads that follow their own rules above the write pointer.\n- **Relationship to SMR:** same host-managed model, shared software stack, flash-specific additions.\n- **Availability:** enterprise ZNS drives have shipped (for example the Western Digital Ultrastar DC ZN540 and Samsung PM1731a), and Linux gained ZNS support in the 5.x series.\n- **Market view, hedged:** ZNS needs zone-aware software, so adoption has been narrower than the original hype suggested. The backward-compatible Flexible Data Placement (FDP) specification appears to have drawn more attention. Treat this as an assessment to confirm against current vendor roadmaps.","pitfall":"Treating \"ZNS\" as a product feature switch. It is a different namespace type with different rules, not a mode of a conventional namespace.","verify":"Ratification timing (TP 4053, 2020) and inclusion in NVMe 2.0; the Zoned command set CSI value; first Linux kernel with ZNS support; which vendors currently ship ZNS drives.","follow":[{"q":"Is ZNS a new transport or a new interface?","a":"Neither. It is a command set that runs over the same queues and transports as NVM."},{"q":"Which Linux kernel introduced ZNS support?","a":"The 5.x series, around 5.9, with zone append support in the block layer."}],"mod":1},{"id":"1.08","level":"Intermediate","type":"Concept","fig":null,"tags":["latency","tail-latency","gc","reset"],"q":"Why do conventional SSDs show tail latency spikes, and what does ZNS change?","short":"In a conventional SSD, host I/O shares dies and channels with GC copies, wear leveling and refresh, and NAND program and erase operations take from hundreds of microseconds to milliseconds, so reads and writes can queue behind them. The spikes are load and fill dependent and invisible to the host. ZNS removes most device-initiated relocation, so latency is more predictable, but reset, finish, host GC and media effects like read retry remain.","deep":"- **Sources of tail in a conventional drive:**\n  - GC copy traffic and block erases.\n  - Write buffer exhaustion when the host outruns the media.\n  - Wear leveling and read-disturb refresh.\n  - Mapping table cache misses on drives with partial L2P caching.\n- **Rough scale (order of magnitude, vendor dependent):** NAND read tens of microseconds, program hundreds of microseconds to a millisecond or more, erase several milliseconds. A read stuck behind an erase gives a tail hundreds of times the median, unless program and erase suspend are used.\n- **What ZNS changes:** the host controls when data moves, so relocation can be scheduled or throttled. With zone-aligned lifetimes there may be almost none.\n- **What remains:**\n  - Zone Reset (erase) and Zone Finish can take long, so measure them as first-class operations.\n  - ECC and read retries on aged blocks.\n  - Host GC competing with foreground I/O, which is now your problem.\n  - Per-zone write concurrency limits: one writer per zone at low queue depth.","pitfall":"Claiming ZNS has no tail latency. It moves and exposes the sources rather than removing every one of them.","verify":null,"follow":[{"q":"Is a lower median latency a ZNS benefit?","a":"Not necessarily. The benefit is in the tail and its stability over time."},{"q":"What does a validator plot to show the difference?","a":"Percentile latency versus time at steady state, with fill level and media writes overlaid."}],"mod":1},{"id":"1.09","level":"Advanced","type":"Numeric","fig":null,"tags":["op","waf","endurance","capacity"],"q":"Estimate the capacity and endurance a zoned SSD gains over a conventional one with 7 percent and 28 percent OP.","short":"Using the common greedy, uniform-random approximation WAF = (1+a)/(2a) for OP ratio a, 7 percent OP gives WAF of about 7.6 and 28 percent gives about 2.3. On 4096 GiB of raw NAND that exports 3828 GiB and 3200 GiB. A zoned drive with a 3 percent reserve exports about 3973 GiB, gaining about 4 percent and 24 percent, and with WAF near 1.1 it writes about 7 times less NAND per host byte than the 7 percent case.","deep":"Assumptions: 4096 GiB raw NAND, OP ratio a = spare / user capacity, ZNS reserve of 3 percent for bad blocks and metadata, ZNS device WAF of 1.1, host GC not included.\n1. a = 0.07: WAF = 1.07 / 0.14 = 7.64. User = 4096 / 1.07 = 3828 GiB.\n2. a = 0.28: WAF = 1.28 / 0.56 = 2.29. User = 4096 / 1.28 = 3200 GiB.\n3. ZNS: user = 4096 x 0.97 = 3973 GiB. Gain = 3973/3828 - 1 = 3.8 percent, and 3973/3200 - 1 = 24.2 percent.\n4. Endurance per host byte scales as 1/WAF. Against the 7 percent case: 7.64 / 1.1 = about 6.9 times less wear. Against the 28 percent case: 2.29 / 1.1 = about 2.1 times.\n\n- **Read the result carefully:** the model is a worst-case-like uniform random workload. Real drives with hot and cold separation do better, so the gap is smaller in practice.\n- **Do not double count:** capacity gain and WAF gain are separate levers. A vendor can sell the WAF gain as endurance or trade it for capacity.\n- **Host GC moves the goalposts:** any host-side relocation adds back to total WAF. See the last question in this module.","pitfall":"Mixing GB and GiB. Raw NAND is binary while user capacity is often decimal, and this alone can add several points of apparent OP.","verify":"The (1+a)/(2a) approximation is a widely quoted greedy-GC model, so cite it as a rule of thumb, not a measured value.","follow":[{"q":"Why does WAF fall as OP rises?","a":"GC victims are drawn from a larger pool of blocks, so they hold less valid data when chosen."},{"q":"Is the 3 percent reserve a spec value?","a":"No. It is an assumption. Real reserves depend on media, bad block budget and firmware."}],"mod":1},{"id":"1.10","level":"Advanced","type":"Concept","fig":null,"tags":["host-burden","gc","resources","tradeoffs"],"q":"What does ZNS take away from the host in flexibility, and what new work does it create?","short":"The host must write each zone sequentially at the write pointer, so it cannot update in place. It must group data by lifetime, run its own GC by copying live data and resetting zones, stay within open and active zone limits, and handle zones that go Read Only or Offline. In return it gets less OP, less device DRAM, lower WAF and steadier latency.","deep":"- **Write ordering:** writes must reach the device in write-pointer order, which in practice limits each zone to one in-flight writer unless the host stack guarantees ordering. Zone Append lifts this at the price of device-chosen placement.\n- **Allocation:** choose which zone each write goes to, ideally by expected lifetime.\n- **Host GC:** pick victim zones, read live data, rewrite, update host metadata, reset. This needs CPU, bandwidth and free-zone reserve.\n- **Resource budgeting:** the device caps open and active zones (see the Zone Resources module). The software must never exceed the caps or expect automatic eviction to be free.\n- **Failure handling:** zones can become Read Only or Offline. After power loss the host must rediscover write pointers with Report Zones and recover partial writes.\n- **Metadata:** in-place updated metadata needs somewhere to live, typically a small conventional namespace or a log with checkpoints.\n- **Legacy software:** filesystems and applications that overwrite in place cannot run directly, so a translat
