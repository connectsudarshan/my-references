ed, and report the cells that stayed at zero."}],"mod":10},{"id":"10.08","level":"Intermediate","type":"Concept","fig":null,"tags":["performance","bandwidth","append","queue-depth","reset-latency","interference","steady-state"],"q":"How do you validate ZNS performance, and what does a good result look like?","short":"Measure what zoning changes: sequential write throughput per open zone and across MOR zones, Append versus Write scaling with queue depth in one zone, read latency while other zones are written or reset, and Reset, Finish and Open latency by fill level. Reach steady state first, report distributions from p50 to p99.99, and judge against the datasheet and the previous firmware with an agreed tolerance rather than against a single number.","deep":"1. **Zone-sequential write:** in Linux typically one Write per zone is in flight (zone write locking or plugging), so per-zone throughput is block size divided by latency. With 128 KiB and an assumed 250 us latency that is 131,072 B / 250 us = 524 MB/s. Four open zones give about 2.1 GB/s and eight give about 4.2 GB/s, so MOR bounds the parallelism. Sweep zones from 1 to MOR and block sizes, and check the scaling is linear until the NAND or link ceiling.\n2. **Append scaling:** queue depth 1 to 32 in one zone (arithmetic in 5.09). Find the knee and check latency past it.\n3. **Reads:** random reads over Full and Closed zones with and without concurrent writes. Percentile latency, not average.\n4. **Management latencies:** Open, Close, Finish and Reset by fill level 0, 25, 50 and 100 percent (see 4.14 and 4.15).\n5. **Interference:** a victim doing fixed-rate reads on zone set B, an aggressor doing writes, Finish or Reset on zone set A. Compare victim p99.9 with and without the aggressor.\n6. **Steady state:** repeat fill and reset cycles until throughput is stable by a stated rule (for example the slope and range windows of the SNIA Performance Test Specification), then measure.\n7. **Write amplification:** if the vendor log exposes NAND writes, compare with host writes. A zoned drive that shows a write amplification well above 1 for sequential zone writes needs an explanation.\n\nPass criteria: absolute limits from the datasheet or customer, a relative bound against the previous firmware (for example no more than an agreed percentage regression at each percentile), and no unexplained bimodal latency.","pitfall":"Comparing a zoned run at steady state with a conventional run on a fresh drive, or the reverse. Both must be at steady state and the comparison stated.","verify":"fio zbd option names on your version, and the steady-state criteria and workload definitions in the SNIA Solid State Storage Performance Test Specification.","follow":[{"q":"What limits one zone written with Write commands?","a":"One outstanding write, so block size over latency. Larger blocks, more zones or Zone Append raise it."},{"q":"What should a reset storm do to neighbors?","a":"Deferred erase competes for dies. Measure the victim tail latency and the write throughput in the minute after the storm."}],"mod":10},{"id":"10.09","level":"Advanced","type":"Trap","fig":null,"tags":["reset","concurrency","race","in-flight","legal-outcomes","stale-data"],"q":"A Reset Zone is submitted while writes and reads to the same zone are in flight. Which outcomes are legal, and which prove a bug?","short":"Concurrent commands have no defined order, so each in-flight write may run before or after the Reset. Before: it succeeds and its data is then discarded. After: its SLBA no longer equals the write pointer, so it fails with Zone Invalid Write, unless it targets ZSLBA and reopens the zone. Reads return old data or the unwritten value. Asserting one fixed outcome is the trap. Bugs are outcomes outside the legal set, such as stale data in an Empty zone.","deep":"Setup: zone Z holds X > 0 blocks with WP at ZSLBA + X. Submit write W1 at WP (8 blocks), write W2 at WP + 8, then Reset R, with a read of the old range in flight.\n\n| Interleaving | W1 | W2 | R | Final zone |\n|---|---|---|---|---|\n| Reset runs first | Zone Invalid Write (BCh) | Zone Invalid Write | Success | Empty, WP = ZSLBA |\n| W1, then Reset, then W2 | Success | Zone Invalid Write | Success | Empty |\n| W1, W2, then Reset | Success | Success | Success | Empty |\n\nWith X = 0 the zone is already Empty. If Reset runs first it is a no-op, W1 and W2 then succeed, and the zone ends Implicitly Open with WP = ZSLBA + 16. So the final state is a set, not always Empty.\n\n**Bug signatures:**\n- A write succeeds although a Reset had already completed before that write was submitted (completed-before-submitted order is real).\n- After everything drains, a read of an Empty zone returns an old generation (stale mapping or an unerased block).\n- A read returns a block that is neither its old data nor the unwritten value (foreign data).\n- Reset hangs behind the writes, or the writes to other zones are aborted.\n\n**Method:** sweep the submit delay of the Reset relative to the writes from 0 up to the Reset latency in small steps, so every interleaving occurs. Classify each run into a legal pattern using the model, and count how many times each pattern was seen. A pattern that never occurs means the race was not exercised.","pitfall":"Asserting one deterministic outcome for a race. Assert the legal set and report which members occurred.","verify":"Whether the specification requires ordering or serialization of a Reset against outstanding I/O to the same zone, and read atomicity against Reset, in the ZNS and NVM Command Set specifications.","follow":[{"q":"Do real hosts issue this?","a":"Well-behaved hosts drain zone I/O before a Reset, so this is a robustness test: the device must stay consistent, not deliver a specific order."},{"q":"Can a multi-block read see part old and part unwritten data?","a":"It may unless the device promises atomicity. Each block must be old or unwritten, never foreign, and the atomicity claim needs checking."}],"mod":10},{"id":"10.10","level":"Advanced","type":"Concept","fig":null,"tags":["reference-model","in-flight","linearization","real-time-order","unknown-outcome"],"q":"How does a host reference model handle commands in flight, out-of-order completions and unknown outcomes without becoming flaky?","short":"Update the model from completions, never from submissions, and use real-time order: if A completed before B was submitted, A precedes B, otherwise they may serialize either way. Per zone, keep the set of states consistent with the statuses seen so far and prune it as completions arrive. Check exactly at quiescent points. If an outcome is unknown after a timeout or reset, keep both branches until a Report Zones resolves them.","deep":"- **Command record:** doorbell-write time as submit, CQE-observed time as complete, plus the status and DW0. The device may have seen the command at any time in between.\n- **Precedence:** A precedes B only if A's CQE was observed before B's doorbell. Everything else overlaps.\n- **Example:** zone Empty, a Write of 8 blocks at ZSLBA and a Finish overlap.\n  - Write = Success, Finish = Success: only Write first fits. Zone Full with 8 blocks readable.\n  - Write = Zone Is Full, Finish = Success: only Finish first fits, so no data may be readable.\n  - Write = Success, Finish = Success, but read-back shows no data: neither order explains it, so it is a bug.\n  The statuses select the serialization.\n- **Cost:** k overlapping commands on one zone give up to k! orders. Keep k small in most tests, or run a dynamic program over subsets (2^k states). Zones are coupled only by shared MAR and MOR counters, so model resource counters as part of the set too. Implicit opens racing near the limit are the hard case.\n- **Unknown outcomes:** after a timeout, abort or controller reset, fork the model into the outcomes that could have happened. A later Report Zones and read-back must match at least one branch, or it is a violation.\n- **Design choices that remove ambiguity:** one management command per zone at a time, QD1 writes per zone, Append (order-free by design), and a small set of dedicated race tests that use the set model.\n- **Health metric:** log the size of the model's possible set. A set that stays above one for a long time means the test is too racy to judge.","pitfall":"Timestamping submit when the SQE is built instead of when the doorbell is written. The command may sit in the queue, and the model then claims an order the device never had.","verify":null,"follow":[{"q":"Is real-time order too strict?","a":"It is the weakest safe rule. Overlapping commands are free, and only completed-before-submitted pairs are ordered. Use one monotonic host clock for all timestamps."},{"q":"What resolves remaining ambiguity?","a":"Statuses, returned Append LBAs, and Report Zones plus read-back at quiescence."}],"mod":10},{"id":"10.11","level":"Advanced","type":"Concept","fig":null,"tags":["data-integrity","pattern","generation","ledger","stale-data","read-back"],"q":"How does the zone structure change the data pattern and checker compared with the conventional-drive design?","short":"Sequential zones let you swap the per-LBA ledger for a per-zone one: a generation number bumped at every Reset, plus completed and durable write pointers. Each block header carries zone ID, zone generation, offset in zone and a CRC, so any block verifies on its own. Read-back then separates stale data after Reset, foreign-zone data, holes below the write pointer, and data above it that should read as unwritten.","deep":"- **Block layout (4 KiB):** magic, zone ID, zone generation G, block offset in the zone, run ID, then a PRNG payload seeded from (zone, G, offset) and a trailing CRC32C. For Append, the offset is unknown at submit, so use append ID plus block index and reconcile with the returned LBA.\n- **Ledger per zone:** G, submitted end, completed end (contiguous acknowledged) and durable end (last Flush or FUA), all in blocks.\n- **Size:** a 468,843,606-LBA namespace with a 4-byte per-LBA ledger needs 1.875 GB. With ZSZE = 0x10000 there are 7,153 full zones, and 16 bytes each is about 112 KiB.\n\n| Observation at read-back | Meaning |\n|---|---|\n| Header zone differs from the zone read | Mapping error across zones |\n| G below the zone's current generation | Stale data after Reset (data-disclosure bug) |\n| Current G, offset differs from the LBA offset | Misdirected within the zone |\n| Missing or bad header below completed end | Lost or corrupted acknowledged data |\n| Block at or above WP not equal to the unwritten value | Data leaked past WP or a partial write after failure |\n| Two generations inside one write | Torn write |\n\n- **Above the write pointer:** after Finish the gap, and after Reset the whole zone, must read as the unwritten value from DLFEAT. Check it, do not assume it.\n- **Reuse cycles:** run many Reset and rewrite cycles per zone, since old generations stay in NAND until erased and stale-data bugs need reuse to show.\n- **Read path:** use direct I/O, and confirm with the SMART data units read counter that reads reached the device.","pitfall":"Verifying through the page cache or a stale zone cache in the host. The read never reached the drive and every check passes.","verify":"DLFEAT read behavior values, and whether reads above the WP may return an error when DULBE is enabled (module 7).","follow":[{"q":"Why not rely on fio verify alone?","a":"It is good for volume. A custom header names the fault class (stale, misdirected, torn) without reading a hexdump."},{"q":"Should the checker read above the WP?","a":"Yes. Unexpected data there means an unmapped or partial write leaked."}],"mod":10},{"id":"10.12","level":"Advanced","type":"Cross-layer","fig":null,"tags":["spor","power-loss","lifecycle","windows","recovery","oracle"],"q":"How do you cover sudden power-off at every point in a zone's life, and what does the oracle accept after recovery?","short":"List the phases of a zone's life (first write, steady writes, reaching ZCAP, Open, Close, Finish, Reset, descriptor extension, Append bursts, eviction, recovery itself) and cut at defined offsets inside each: before the command reaches the drive, while it runs, after media work but before the CQE, after the CQE. Each phase has an allowed set of states and write pointers after recovery, and the read-back oracle applies to every case.","deep":"| Cut during | Allowed after recovery |\n|---|---|\n| Write stream | Durable end <= WP <= submitted end. Every LBA below WP reads back a written pattern. Zone is Closed, or Empty if nothing durable was written (see 3.09) |\n| Write reaching ZCAP | Full with all data, or Closed with a lower WP. Never Full with holes |\n| Finish (no CQE seen) | Old state with all data intact, or Full. Never Full with data below the old WP lost |\n| Reset (no CQE seen) | Old zone with all old data, or Empty with nothing old readable. Never half old |\n| Reset, CQE already seen | Empty, unless the product specification says otherwise |\n| Open or Close | Zone state in the allowed set. Active count equals the number of Closed zones with data or extension |\n| Set Zone Descriptor Extension | Empty without extension, or Closed with the complete extension. Never partial bytes |\n| Append burst | Acknowledged and flushed appends below WP, no holes below WP |\n| Recovery itself (nested cut) | The same outcomes as above and bounded time to ready |\n| Controller reset without power loss | Treat like power loss for unflushed data unless the product specification says otherwise |\n\n**Post-recovery checklist:** ready within the limit, no Read Only or Offline zones appeared unexpectedly, Report Zones state in the allowed set, no zone left open, WP within the bounds from the ledger, read-back of everything below WP and of the region above it, then continue writing at WP and finally Reset the zone. The last step catches a WP that reads well but that the firmware cannot write to.\n\n**Triggers:** use firmware markers or NAND-operation triggers with a swept delay (see the NVMe page, power-loss coverage question), and confirm each cut from SMART Unexpected Power Losses (formerly Unsafe Shutdowns) and Power Cycle counts and a logged marker.","pitfall":"Judging recovery from Report Zones alone. State and WP can look right while data below the WP is a hole or an older generation.","verify":"What the ZNS and NVM Command Set specifications and the product requirements guarantee after power loss for Reset, Finish and Set Zone Descriptor Extension in progress, and how PLP is declared.","follow":[{"q":"Why keep writing after recovery?","a":"A bad open block or stale free-pool state only shows on the next program, not in the report or the read-back."},{"q":"Which windows need a NAND-level trigger?","a":"Program and erase in progress and Finish padding. Host-side timing cannot land there reliably."}],"mod":10},{"id":"10.13","level":"Advanced","type":"Numeric","fig":null,"tags":["spor","sample-size","rule-of-three","windows","random-cut","rig-time"],"q":"How many power-cut cycles does a zone SPOR campaign need, and why does random cutting not get there?","short":"Count windows, not cycles. With 14 lifecycle phases and 4 cut offsets each there are 56 windows. Showing each has a failure rate under 5 percent at 95 percent confidence needs about 59 clean targeted hits per window, so 3,304 cycles: 6.9 days on one rig or 21 hours on eight at 3 minutes per cycle. A random cut in a 60 s workload hits a 1.5 ms Finish window with probability 2.5e-5, so the same confidence takes about 2.4 million cycles.","deep":"Assumptions: cycles are independent and identical, 3 minutes per cycle including power-up and verification, and every cut is confirmed to land in its intended window.\n1. **Windows:** 14 phases x 4 offsets = 56.\n2. **Clean hits per window:** n = ln(0.05) / ln(0.95) = 58.4, so 59 (the rule of three gives 3 / 0.05 = 60).\n3. **Cycles:** 56 x 59 = 3,304. Time: 3,304 x 3 = 9,912 min = 165.2 h = 6.9 days on one rig, 20.7 h on eight.\n4. **Random cutting:** p(hit) = 1.5 ms / 60 s = 2.5e-5 per cycle. For 59 hits: 59 / 2.5e-5 = 2.36 million cycles, about 13.5 years on one rig. Even one expected hit needs 1 / p = 40,000 cycles, or 83 days.\n5. **Across drives:** with 4 drives, 15 clean hits per window per drive (59 / 4 = 14.75). The total cycle count is the same, but NAND lots and firmware images are covered.\n6. **What the 5 percent means:** it bounds the per-hit failure probability. A deterministic bug in a window fails on the first targeted hit. The 59 hits are for timing-dependent bugs.\n7. **When a window fails once in 59:** the exact 95 percent bound is 4.74 events, so 4.74 / 59 is about 8 percent. After a fix, repeat with more hits.","pitfall":"Counting scheduled cuts as coverage. Calibration drift silently moves every cut into the same window, so log the marker that was actually hit.","verify":"None for the arithmetic. Window count, window width and cycle time are assumptions to replace with your firmware's markers.","follow":[{"q":"The supply fall adds plus or minus 2 ms of jitter to the cut. What do you do?","a":"Trigger from the firmware marker with a swept delay of 0 to 3 ms in small steps, and count hits from the logged marker, not from the schedule."},{"q":"How do you shrink the 56?","a":"Weight by risk (Finish, Reset, first write, capacity boundary) and drop windows the design shows are equivalent, with the argument written down."}],"mod":10},{"id":"10.14","level":"Advanced","type":"Debug","fig":null,"tags":["spor","audit","ledger","wp","recovery","triage","stale-data"],"q":"After a power-cut run, six zones show the results below. VWC is enabled and there is no PLP. Which are legal, and which are bugs?","short":"Zones 1 and 4 are legal. Zone 2 lost flushed data (WP below the durable end). Zone 3 has a WP ahead of its data, leaving a hole. Zone 5 is Empty but returns old-generation data, which is a data-disclosure bug. Zone 6 came back Explicitly Open, which cannot survive a power cycle. Compare each zone with the bounds durable <= WP <= submitted and read back everything.","deep":"Geometry: ZSZE = 0x10000, ZCAP = 0xDC00, all values in blocks relative to ZSLBA. The ledger columns are submitted end, completed end and durable end (last Flush completion).\n\n| Zone | Cut during | Ledger (sub / comp / dur) | After recovery | Read-back |\n|---|---|---|---|---|\n| 1 | Write stream | 0x4000 / 0x3F00 / 0x3000 | Closed, WP 0x3400 | Clean below WP, unwritten above |\n| 2 | Write stream | 0x2000 / 0x2000 / 0x2000 | Closed, WP 0x1F00 | Clean below WP |\n| 3 | Write stream | 0x1000 / 0x1000 / 0x0800 | Closed, WP 0x1000 | Blocks 0x0C00 to 0x0FFF return the unwritten value |\n| 4 | Finish, no CQE seen | 0x5000 / 0x5000 / 0x5000 | Closed, WP 0x5000 | Clean |\n| 5 | Reset, no CQE seen | 0x8000 / 0x8000 / 0x8000 | Empty, WP = ZSLBA | Blocks 0 to 0xFF return generation 7, current generation is 8 |\n| 6 | Explicit Open, 0x200 blocks flushed | 0x200 / 0x200 / 0x200 | Explicitly Open, WP 0x200 | Clean |\n\n1. **Zone 1, legal:** 0x3000 <= 0x3400 <= 0x4000 and the data is clean. Unflushed blocks may be lost.\n2. **Zone 2, bug:** the drive flushed up to 0x2000 but recovered only to 0x1F00, so 0x100 flushed blocks are gone. Suspect a journal or metadata update that trails the data.\n3. **Zone 3, bug:** the WP moved to 0x1000 before the data at 0x0C00 to 0x0FFF was persisted. WP metadata was made durable ahead of the data, and reads see a hole below the WP.\n4. **Zone 4, legal:** the Finish did not take effect. Full would also be legal. Both keep the data.\n5. **Zone 5, bug and severity 1:** a half-applied Reset kept part of the old mapping. An Empty zone returned data from before the Reset. Check that other zones' data was not exposed either.\n6. **Zone 6, bug:** open state and its resources are not preserved through a power cycle, so it must return as Closed (or Empty with nothing written). Also check the active and open counts.\n\nNext steps: repeat each case at the same marker with more hits (10.13), capture the firmware's journal state, and file zones 2, 3 and 5 as data-safety defects.","pitfall":"Auditing only the Report Zones column. Zones 3 and 5 look fine there and fail only in read-back.","verify":"State of Open zones after a power cycle (Closed) and the rollback rules for WP after unexpected power loss in the ZNS and NVM Command Set specifications.","follow":[{"q":"What extra evidence separates zone 3's hypothesis?","a":"Cut at swept delays around the WP metadata write. If the hole grows with the delay, the WP is persisted first."},{"q":"Zone 4 shows Closed although the host had asked for Finish. Is that a bug?","a":"Not without a CQE. An unacknowledged Finish may be lost, so the ledger's completion column decides."}],"mod":10},{"id":"10.15","level":"Principal","type":"Scenario","fig":null,"tags":["test-plan","reference-model","architecture","exit-criteria","automation","design"],"q":"Design the full validation plan and reference model for a new ZNS SSD, from spec to exit criteria.","short":"Build three separate artifacts: spec tables as data with clause references, a reference model that turns commands and completions into allowed outcome sets, and a harness that reaches the device directly. Drive it with directed matrices, state-steered random sequences and fault schedules. Check at completion, at quiescence and by read-back. Gate release on cell coverage, targeted-window statistics, mutation kill rate and open defects.","deep":"1. **Inputs and risk ranking:** pinned spec revisions, capability profile (10.06), customer requirements. Top risks: write pointer and recovery, state machine and resources, Append, Reset and stale data, media-driven Read Only and Offline, host interop.\n2. **Model (see 3.14 and 10.10):** pure code with unit tests, no device access. Layers: geometry and profile, per-zone state, WP, attributes and ZCAP, resource counters, durability watermarks (submitted, completed, durable), data ledger with zone generations, event log. Core function: outcomes = f(state, command), returning a set of (status, next state).\n3. **Harness:** one device abstraction over passthrough, SPDK and the block layer, with power and reset control, fault hooks and analyzer triggers. It logs every SQE and CQE with timestamps as JSON lines.\n4. **Generators:** directed matrix (63 cells x resource conditions, 3.17), seeded random with steering, race tests (10.09), fault schedules (10.12, 10.13, 3.16), fuzz (10.07) and performance (10.08).\n5. **Checks:** at completion (status in the allowed set, DW0 valid only on success), at quiescence (Report Zones diff and invariants), at the end of a run (full read-back), and continuous monitors (SMART, error log, events, dmesg).\n6. **Stages:** model unit tests on spec examples, QEMU differential, firmware simulation with exhaustive cut points, FPGA and silicon, then platform (fio zbd, file systems, kernel versions). Push each bug to the lowest layer that reproduces it.\n7. **Exit criteria, measurable:**\n   - Every state x command cell per profile hit at least N times, or waived with an owner.\n   - Every zone-specific status code seen at least once.\n   - Each SPOR window with the clean-hit count from 10.13.\n   - Random soak with zero unexplained divergences across S seeds and at least 3 drives.\n   - Mutation kill rate on critical cells (10.17).\n   - No open severity 1 or 2 defect, performance within tolerance, host matrix passing.","pitfall":"Fixing the model to match each divergence without a spec citation. The suite then converges on the firmware's own bugs and reports green.","verify":"The pinned spec revisions for zoned command set behavior your customer requires, and which optional features the plan must cover.","follow":[{"q":"What do you build first with one month?","a":"Tables, model and the QEMU differential with the matrix and steered random, then SPOR windows for Reset, Finish and first write. Performance last."},{"q":"How do you keep it valid across firmware builds?","a":"Profile hash gate, a deviation register, replay of old field escapes as permanent tests, and mutants rerun on model changes."}],"mod":10},{"id":"10.16","level":"Principal","type":"Debug","fig":null,"tags":["triage","taxonomy","severity","bug-report","repro","attribution"],"q":"How do you triage ZNS-specific failures, and what goes into the bug report so firmware can act on it?","short":"Classify by signature first: stale or foreign data, holes below WP, WP or state divergence, resource accounting, Append placement, wrong status, recovery outside the allowed set, latency, or host artifact. Each class has a first evidence step and a severity. The report holds a seeded minimal repro, model prediction against device result, raw CQE status, zone reports before and after, the profile, builds, and a frequency with denominators.","deep":"| Class | Signature | First evidence | Severity |\n|---|---|---|---|\n| Stale or foreign data | Old generation or another zone's block in an Empty zone or below the WP | Header decode, zone generation, mapping trace | 1 |\n| Hole or lost data | Unwritten value or bad CRC inside a completed range | Ledger against read-back, flush points | 1 |\n| Append overlap | Overlapping ALBAs in CQEs | CQE interval check (5.14) | 1 |\n| WP divergence | Report WP not equal to the completed end | Report right after drain, per-command WP deltas | 1 or 2 |\n| State divergence | Report state outside the model's set | Model set, events, Changed Zone List | 2 |\n| Resource accounting | Spurious or missing Too Many Active or Open | Recount from report, then bisect | 2 |\n| Wrong status | Correct refusal with wrong SCT or SC, or success where refusal expected | Raw CQE decode, side-effect check | 2 or 3 |\n| Recovery | Post-cut result outside the allowed set | Ledger watermarks (10.14) | By outcome |\n| Latency | p99.9 shift, reset impact | Baseline comparison, background activity | 3 |\n| Host artifact | Appears only through the block layer | Repeat by passthrough | None until repeated |\n\n**Method:**\n1. Freeze: stop on the first divergence, keep the drive powered and the state, capture reports, error log, SMART, Changed Zone List and vendor logs before any reset.\n2. Decode raw CQEs and compare with the model's allowed set.\n3. Reproduce from the seed, then shrink the sequence, its prefix and the zone set.\n4. Attribute: repeat on a second path, cite the spec clause, and note whether the model or a deviation entry is involved.\n5. Quantify: k failures in n runs by rig, firmware and host, with a bound (see 10.13).\n\n**Report fields:** title with class, severity, DUT and firmware build, host and kernel, capability profile hash, seed and shrunk sequence, model prediction against device result, raw CQE decode, reports before and after, logs, frequency, suspected layer, and the spec clause.\n\n**Severity rule:** any path where old or foreign data is readable, or acknowledged and flushed data is lost, is severity 1 regardless of frequency.","pitfall":"Filing \"zone state wrong\" without the command history. A state divergence has meaning only with the commands and completions that led to it.","verify":"Local severity definitions and the release policy for data-safety defects.","follow":[{"q":"The failure happens 2 times in 500 runs. What now?","a":"Add stop-on-first-mismatch with a command ring buffer, raise load on the suspect window, and report with the denominator. Two in 500 has a 95 percent upper bound of about 1.3 percent (6.30 / 500)."},{"q":"Who receives a CQE-only violation?","a":"Firmware directly, because the oracle uses no host data. Content mismatches need a path check and payload capture first."}],"mod":10},{"id":"10.17","level":"Principal","type":"Trap","fig":null,"tags":["model-validation","qemu","mutation","three-way","deviation-register","false-pass"],"q":"Your model and suite are green on QEMU and on the new drive. In how many ways can that still be wrong, and how do you prove the suite can fail?","short":"The model may share a misreading of the spec with QEMU and the harness, the drive may never have reached the risky states, cells may have been skipped rather than passed, and the checker may be weak. Cite a spec clause for every model cell, compare model, QEMU and drive three ways with each discrepancy classified, and seed bugs into QEMU and the model to measure the kill rate. Unreached states must show as gaps, never as passes.","deep":"**Ways to be green and wrong:**\n- Model, harness and QEMU share an assumption (for example Close on an Empty zone, or the WP value in a Full zone).\n- The drive's profile hides rows: no Active Excursions, no Read Only injection. The cells were skipped, not passed.\n- Cells reached only from an idle, clean pool and never at the resource limits or under load.\n- The checker compares against the device's own report, or reads through a cache.\n\n**Three-way comparison:**\n\n| Model | QEMU | Drive | Classification |\n|---|---|---|---|\n| A | A | A | Agreement, still needs a spec clause |\n| A | A | B | Drive bug or a shared misreading: read the spec text |\n| B | A | A | Model bug: fix and cite |\n| A | B | A | QEMU deviation: add to the register |\n| A | B | C | Spec ambiguity: raise it, allow both, pin the drive's choice per build |\n\n**Deviation register:** cell, spec clause, behavior per implementation, decision, owner and date.\n\n**Mutation testing (ZNS-specific):** patch the QEMU zoned code or the model with realistic bugs: off-by-one at ZCAP, Reset not releasing the active resource for Closed zones, Finish not releasing the open resource, Append returning the previous append's LBA, WP not advancing for odd-length Appends, implicit close evicting an Explicitly Open zone, Select All skipping Full zones. Run the suite against each mutant. Kill rate = mutants detected / injected. Survivors are equivalent mutants, missing tests or weak oracles, so fix the last two.\n\n**Limits of QEMU:** it cannot model media faults, power loss or timing. Anything claimed on those needs a drive run, so list which claims rest only on drive evidence.","pitfall":"Treating QEMU as the specification. It is one implementation with its own choices.","verify":"QEMU's zoned NVMe behavior for the cells in question against its current hw/nvme source and the ZNS Command Set Specification.","follow":[{"q":"Who arbitrates an ambiguous spec reading?","a":"Record the interpretation, get the firmware design owner to sign it, and if needed raise a clarification. The model allows both readings with the drive's behavior pinned."},{"q":"Can you mutate real firmware?","a":"Only through test builds with hooks from the firmware team. QEMU mutants are the cheap first step and cover the logic cells."}],"mod":10},{"id":"11.01","level":"Basic","type":"Concept","fig":null,"tags":["zrwa","overwrite","motivation","zns-1.1"],"q":"What is the Zone Random Write Area (ZRWA), and why was it added to ZNS?","short":"ZRWA is an optional per-zone window just above the write pointer where the host may write in any order and overwrite the same LBAs before they are committed. Committing advances the write pointer, so everything behind it is sequential-only again. It exists because strict write-at-the-pointer is awkward for small, unaligned, out-of-order or repeatedly updated data such as metadata, parity and log tails. It is a recent addition, so treat its exact rules as revision-specific.","deep":"- **The problem:** plain ZNS requires every write to start exactly at the write pointer, one command at a time per zone. Anything that is rewritten (a journal tail, a superblock, a RAID parity block, a small record that grows) must either be appended again as a new copy, or padded out to a full write unit.\n- **What ZRWA adds:** a window of ZRWASZ blocks starting at the write pointer. Inside it the host writes at any offset, in any order, and may overwrite. The device holds the data in a buffer and commits it to media in units of ZRWAFG blocks, either when the host asks (explicit flush) or when writes run past the window (implicit flush).\n- **Typical uses:** small metadata and journal updates, parity updates for RAID or erasure coding across zones, rewriting the tail of a log record, and keeping several writes in flight to one zone without strict ordering.\n- **What it costs:** a buffer in the controller, a new resource (a limited number of zones can hold a ZRWA at once), and new state to validate.\n- **Where it comes from:** ZRWA arrived after the first ZNS release, as part of a later revision of the Zoned Namespace Command Set (my recollection is 1.1, 2021). A drive that does not report ZRWA support behaves as plain ZNS.","pitfall":"Calling ZRWA \"random writes to a zone\". It is random writes to a small, bounded window that is then flushed forward.","verify":"The ZNS Command Set revision that introduced ZRWA (1.1 by my recollection, with the ratified TP believed to be TP 4076). ZNS 1.4 does not say; it has no revision-history section, only the current rules (5.7).","follow":[{"q":"Does ZRWA turn a zone into a conventional random-write zone?","a":"No. Only the window above the write pointer is rewritable. Committed data behind the pointer is still sequential-only and needs a Reset to reuse."},{"q":"Is ZRWA mandatory in a ZNS SSD?","a":"No. It is optional and advertised in the ZNS Identify Namespace data, so a host must check before using it."}],"mod":11},{"id":"11.02","level":"Basic","type":"Concept","fig":null,"tags":["zrwa","identify","zrwasz","zrwafg","zrwacap","numzrwa","ozcs"],"q":"Which Identify and zone descriptor fields describe ZRWA, and how does a host discover support?","short":"Support is announced by a bit in OZCS. The ZNS Identify Namespace data then gives ZRWASZ (window size), ZRWAFG (flush granularity), ZRWACAP (capabilities, including whether explicit flush is supported) and NUMZRWA (how many zones can hold a ZRWA at once). A zone that currently has a ZRWA allocated shows a ZRWA-valid bit in its zone attributes.","deep":"| Field | Where | Meaning |\n|---|---|---|\n| OZCS bit 1 | ZNS Identify NS, bytes 3:2 | ZRWA supported (bit 0 is Read Across Zone Boundaries) |\n| NUMZRWA | bytes 47:44 | Number of ZRWA resources: zones that can have a ZRWA at the same time |\n| ZRWAFG | bytes 49:48 | Flush granularity, in logical blocks |\n| ZRWASZ | bytes 51:50 | ZRWA size, in logical blocks |\n| ZRWACAP | byte 52 | Bit 0: explicit flush operations supported |\n| ZRWAV | zone attributes, bit 3 | This zone currently has a ZRWA |\n\n- **Units:** ZRWASZ and ZRWAFG are in logical blocks, not bytes, and both are 16-bit, so multiply by the LBA size. ZRWASZ is normally a multiple of ZRWAFG.\n- **Why two sizes:** ZRWAFG is the unit in which the window is committed. A sensible firmware picks it to match a NAND program unit or a flush-friendly multiple of one.\n- **Host check order:** read OZCS, then the fields, then confirm that ZRWACAP bit 0 is set before ever issuing an explicit flush.\n- **Tooling:** libnvme and SPDK define the structure. Do not rely on nvme-cli's `zns id-ns` text output showing these fields, and parse the raw structure (`--output-format=binary`) when in doubt.\n- **Namespace creation:** with Namespace Management, a host can request ZRWA resources for a new zoned namespace (a create option plus a requested-number field, next to the requested active and open resources).","pitfall":"Reading ZRWASZ as bytes. A ZRWASZ of 1024 with 4 KiB blocks is 4 MiB, not 1 KiB.","verify":"Nothing left open for ZNS 1.4: all byte offsets and bit positions above are confirmed (Figure 49: OZCS bit 1, NUMZRWA 47:44, ZRWAFG 49:48, ZRWASZ 51:50, ZRWACAP byte 52 bit 0; Figure 38: ZRWAV bit 3). NUMZRWA is 0's-based with no separate no-limit sentinel, and ZRWASZ must be a multiple of ZRWAFG. Recheck only if your target revision differs.","follow":[{"q":"Is NUMZRWA related to MAR and MOR?","a":"It is a separate budget. A ZRWA is bound to an open zone (see the lifecycle question), so in practice it competes for the same zones. A test model needs all three limits."},{"q":"Where do you see ZRWAV from the host?","a":"In the zone attributes byte of a normal Report Zones descriptor, bit 3."}],"mod":11},{"id":"11.03","level":"Basic","type":"Concept","fig":null,"tags":["conventional-zones","zone-type","namespaces","metadata","f2fs"],"q":"Does ZNS have conventional (random-write) zones, and where does a host keep data that needs in-place update?","short":"No. The Zoned Namespace Command Set defines only the Sequential Write Required zone type, so every zone in a ZNS namespace is sequential. Conventional zones belong to SMR drives. In NVMe the answer is a second namespace on the same controller that uses the normal NVM command set, plus ZRWA for small bounded in-place updates. Filesystems such as f2fs use a separate conventional device for their metadata.","deep":"- **Zone type:** the zone descriptor has a type field. In the ZNS command set the only defined value is 2h, Sequential Write Required. There is no conventional type to reserve, and no ZOC bit to ask for one. The zonedstorage.io ZNS page says the same: NVMe can expose a separate namespace for conventional access instead.\n- **SMR contrast:** ZBC and ZAC drives can expose conventional zones for metadata, and Linux zoned filesystems were built around that. Module 1 covers the heritage.\n- **Option 1, second namespace:** create an NVM-command-set namespace next to the zoned one, and use it for superblocks, the mapping table checkpoint, or a journal. It has its own FTL and OP, so it costs capacity and reintroduces GC, but for a tiny metadata volume that is fine.\n- **Option 2, ZRWA:** covers small updates, but only inside the window, and only until they are committed.\n- **Option 3, log-structured metadata:** write metadata as a log across zones and reset old ones. As I recall, btrfs in zoned mode keeps its superblock this way, in a log over two zones.\n- **Validation angle:** a mixed device needs both command sets to work independently. Confirm that heavy GC in the conventional namespace does not starve the zoned one.","pitfall":"Assuming ZNS SSDs behave like SMR drives with a conventional zone region. They do not.","verify":"The exact wording of the ZOC bits (ZAE and VZC, module 2) if your target revision differs. (The Zone Type field itself is confirmed: only 2h Sequential Write Required is defined, all other values reserved, ZNS 1.4 Figure 38.)","follow":[{"q":"Can a firmware simply make the first N zones behave as random-write zones?","a":"Not as a legal ZNS zone type. A validator that finds a zone with a type other than 2h should treat it as a spec violation."},{"q":"Why does ZNS have no conventional zones?","a":"The zonedstorage.io explanation is that NVMe supports multiple namespaces, so a separate conventional namespace serves the purpose."}],"mod":11},{"id":"11.04","level":"Intermediate","type":"Concept","fig":"zrwa","tags":["zrwa","window","implicit-flush","write-pointer","ifr"],"q":"How does the ZRWA window work: where can the host write, when does the write pointer move, and what is an implicit flush?","short":"With a ZRWA allocated, writes may start anywhere from the write pointer up to just below WP + ZRWASZ, and may extend into a second region above it, the Implicit ZRWA Flush Range (IZFR, ZNS 1.4 5.7.3), another ZRWASZ blocks. Window data is uncommitted and can be overwritten. A write reaching into the IZFR forces an implicit flush: the controller commits blocks from WP forward in multiples of ZRWAFG until the write fits. Anything beyond that fails with Zone Invalid Write.","deep":"Layout for one zone (offsets from ZSLBA, WP = committed write pointer):\n\n| Region | Range | Rule |\n|---|---|---|\n| Committed | ZSLBA up to WP | Sequential-only, readable, no overwrite |\n| ZRWA | WP to WP + ZRWASZ - 1 | Random writes and overwrites, in any order |\n| IZFR (implicit flush range) | WP + ZRWASZ to WP + 2 x ZRWASZ - 1 | A write ending here commits data and moves WP (ZNS 1.4, Figure 59) |\n| Beyond | WP + 2 x ZRWASZ and above | Zone Invalid Write (ZNS 1.4, 5.7.3) |\n\n- **Reporting:** the WP in Report Zones is the committed pointer. Data sitting in the window is invisible to Report Zones, so the zone looks emptier than the host has written.\n- **Implicit flush size:** the pointer advances per the spec's ceiling formula on (Last_LBA - IZFR_Start_LBA) mod ZRWAFG (ZNS 1.4, Figure 60), always a positive multiple of ZRWAFG. The host does not choose it, so a test must recompute the expected WP after every write that touches the IZFR.\n- **Order freedom:** because writes need not land at WP, several writes to one zone may be in flight in any order, as long as they stay inside the window and do not conflict.\n- **Capacity limit:** writes still cannot go past the zone capacity. If the ZRWA sits at the end of the zone (WP >= ZCAP - ZRWASZ), there is no IZFR and no implicit flush; use Finish Zone or Flush Explicit ZRWA Range instead (ZNS 1.4, Figure 58).\n- **Reference model:** QEMU's NVMe device implements this with matching parameters (`zoned.zrwas`, `zoned.zrwafg`, `zoned.numzrwa`), useful as a cross-check, but the window/IZFR sizes and the rounding rule below are spec text, not a QEMU-only convention.","pitfall":"Modelling only the explicit flush. Any write ending past WP + ZRWASZ moves the write pointer as a side effect.","verify":"Alignment rules for writes and for the WP at ZRWA allocation. (The IZFR size of 2 x ZRWASZ total, the rounding formula, and the no-IZFR case near ZCAP are confirmed in ZNS 1.4, 5.7.3, Figures 56 to 60.)","follow":[{"q":"Does an implicit flush need any host command?","a":"No. It happens as a side effect of a write, which is why the WP can move without a flush."},{"q":"Are overlapping in-flight writes ordered?","a":"Not by the protocol. If two commands overwrite the same LBAs, the host must serialize them, exactly as it would for any NVMe writes."}],"mod":11},{"id":"11.05","level":"Intermediate","type":"Concept","fig":null,"tags":["zrwa","explicit-flush","zsa-11h","zrwafg","zrwacap"],"q":"How does the Flush Explicit ZRWA action work, and what rules does the range have to obey?","short":"Flush Explicit ZRWA is Zone Send Action 11h in Zone Management Send. Its SLBA field names the last LBA to commit rather than a zone start. The controller commits everything from the write pointer through that LBA and sets the pointer to the next LBA. The committed range must be a whole number of ZRWAFG units and must lie inside the window. It only works if ZRWACAP says explicit flush is supported.","deep":"- **Command:** Zone Management Send, ZSA 11h. The SLBA (CDW10-11) is the exception to the \"SLBA must be a zone start\" rule, and it means \"flush up to and including this LBA\". nvme-cli exposes this as `nvme zns zrwa-flush-zone <dev> --lba=<last-lba>`.\n- **Effect:** the range [WP, SLBA] becomes committed, the write pointer moves to SLBA + 1, and the window slides up by the same amount. The zone is not closed or finished.\n- **Range rules (confirmed, ZNS 1.4, 3.4.3.1.3):** the number of blocks flushed must be a multiple of ZRWAFG, or the controller aborts with Invalid Field in Command. If the range contains an LBA not inside the ZRWA (beyond the window), the controller aborts with Invalid Zone Operation Request, not Zone Boundary Error. The zone must also be Explicitly Opened, Implicitly Opened or Closed and have a ZRWA associated, or the command gets Invalid Zone Operation Request; and Select All is not allowed for this action (Invalid Field in Command).\n- **Support bit:** ZRWACAP bit 0 (EXPFLUSHSUP) says explicit flush exists. A device without it relies on implicit flush only, and the host learns nothing about commit points except from Report Zones.\n- **When to flush:** at natural commit points, such as a transaction boundary or a full parity stripe, so the drive programs full units rather than partial ones.","pitfall":"Passing the zone start LBA to a flush out of habit. The field means the last LBA to commit, so a zone start below the write pointer is rejected.","verify":"Whether the NVM Flush command has any effect on ZRWA contents (ZNS 1.4 does not say). SLBA meaning, the ZRWAFG alignment rule and the status for each invalid case above are confirmed (ZNS 1.4, 3.4.3.1.3).","follow":[{"q":"Is Flush Explicit ZRWA the same as the NVM Flush command?","a":"No. The NVM Flush command asks for volatile cache to be made durable. This action moves the ZRWA commit boundary. How the two interact is device- and spec-defined and has to be tested."},{"q":"Can I flush a zone that has no ZRWA?","a":"No. The controller rejects it."}],"mod":11},{"id":"11.06","level":"Intermediate","type":"Concept","fig":null,"tags":["zrwa","lifecycle","open","close","finish","reset","resources"],"q":"How is a ZRWA allocated and released, and how does it interact with zone states and resources?","short":"A host allocates a ZRWA via Open Zone (or Set Zone Descriptor Extension) with ZRWAA set, and NUMZRWA bounds how many zones can hold one. The ZRWA stays associated with a zone until that zone transitions to Full, Empty, Read Only or Offline (any of those four releases it and frees the resource); Close does not release it. The controller must flush the ZRWA before Full or Read Only, so committed-eligible data is not dropped. Out of resources returns ZRWA Resources Unavailable.","deep":"- **Allocate:** Open Zone (ZSA 03h) or Set Zone Descriptor Extension (ZSA 10h) with the ZRWAA bit set in the Zone Send Action Specific Features field. Allocation succeeds only if the zone is Empty and a ZRWA resource is available (ZNS 1.4, 3.4.3.1.4.1).\n- **Resource and state checks (confirmed, spec bullets in this order):** if no ZRWA resource is available, the command aborts with ZRWA Resources Unavailable (B7h) and no state transition occurs; if the zone is not Empty, it aborts with Invalid Zone Operation Request (B6h). Which fires when both are true is not stated as an explicit priority; test it.\n- **State:** the zone becomes Explicitly Open (via Open Zone) and the ZRWAV attribute bit is set. Implicit open never allocates a ZRWA, so the host must explicitly open.\n- **Release (confirmed, 5.7):** a transition to ZSF:Full, ZSE:Empty, ZSRO:Read Only or ZSO:Offline terminates the association, clears ZRWAV, and returns the resource. Close (to ZSC:Closed) is not in that list, so the ZRWA and its uncommitted data survive a Close. Reset always discards zone contents, so its release is via the Empty transition. The controller must perform a ZRWA flush before transitioning a zone to Full or Read Only, so a Finish or a controller-driven Read Only does not drop committed-eligible data; what a controller-driven Offline does to uncommitted window data is not stated.\n- **Interaction with limits:** each ZRWA zone is also an open zone and an active zone, so the budget from module 6 tightens: a host with MOR of 4 and NUMZRWA of 2 can have at most two ZRWA zones among its four open ones.","pitfall":"Assuming a ZRWA zone behaves like any explicitly open zone for Close. The ZRWA and its uncommitted data are confirmed to survive a Close; only Full, Empty, Read Only and Offline release it.","verify":"Whether the controller may drive a ZRWA zone to Read Only or Offline on its own and what that does to uncommitted window data, and the priority between ZRWA Resources Unavailable and Invalid Zone Operation Request when both conditions hold, in the ZNS Command Set Specification.","follow":[{"q":"Can I allocate a ZRWA to a zone that already has data?","a":"No: a non-Empty zone gets Invalid Zone Operation Request (ZNS 1.4, 3.4.3.1.4.1)."},{"q":"Does a ZRWA zone hold resources until the host acts?","a":"Yes. It was explicitly opened, so it keeps an open slot and a ZRWA slot until the zone reaches Full, Empty, Read Only or Offline. A host that abandons such zones exhausts NUMZRWA quickly."}],"mod":11},{"id":"11.07","level":"Intermediate","type":"Concept","fig":null,"tags":["simple-copy","copy","opcode-19h","source-range","mssrl","mcl","msrc"],"q":"What is the Simple Copy (Copy) command, and how is it built?","short":"Copy (opcode 19h, an NVM command set I/O command) copies data from one or more source LBA ranges to one contiguous destination range, entirely inside the controller, so the data never crosses PCIe. The command carries the destination start LBA (SDLBA) and a range count, and points to a list of 32-byte source range entries. Limits come from MSSRL, MCL and MSRC in the NVM Identify Namespace data and support from ONCS bit 8.","deep":"- **Command:** opcode 19h. SDLBA in CDW10-11, number of ranges NR in CDW12 bits 7:0 (zeroes-based), descriptor format in CDW12 bits 11:8. The data buffer holds NR + 1 source range entries.\n- **Source range entry (format 0h):** 32 bytes: SLBA at bytes 15:8, NLB at bytes 17:16 (zeroes-based), and fields for the expected reference tag and application tag when protection information is used.\n- **Result:** the source ranges are concatenated in order and written at SDLBA. Sources and destination must not overlap, or the command fails with Overlapping I/O Range (87h in libnvme).\n- **Limits:** MSSRL (maximum blocks in one range), MCL (maximum blocks in the whole command), MSRC (maximum number of ranges, zeroes-based). Exceeding them gives Command Size Limit Exceeded (83h).\n- **Support and options:** ONCS bit 8 says Copy is supported. Bit 9 says the write part is single-atomic, and bit 10 says all copies are fast copies. A per-range option can demand a fast copy and fail with Fast Copy Not Possible (86h) otherwise.\n- **Newer formats:** later revisions add descriptor formats with a source namespace per range (nvme-cli has `--snsids`). The original \"simple\" form copies inside one namespace.\n- **Host tooling:** `nvme copy` in nvme-cli sends it. As far as I checked, the mainline Linux `nvme.h` has no Copy opcode, and block-layer copy offload is still a patch series under review, so use passthrough, SPDK (which defines the opcode and range structure) or xNVMe.","pitfall":"Treating Copy as a data-free metadata remap. It moves real data unless the controller implements some internal shortcut.","verify":"Opcode 19h, the CDW12 field positions, range entry layout, MSSRL, MCL and MSRC fields, ONCS bits 8 to 10, status values and the descriptor formats available in the NVM Command Set Specification revision you target (TP believed to be TP 4065).","follow":[{"q":"Does Simple Copy reduce NAND traffic?","a":"No. The controller still reads the source and programs the destination. It saves host memory, host CPU and PCIe bandwidth."},{"q":"Is Copy a ZNS command?","a":"It is an NVM command set command that a zoned namespace also accepts, with the write pointer rules applied to the destination (next question)."}],"mod":11},{"id":"11.08","level":"Intermediate","type":"Concept","fig":null,"tags":["comparison","zns","fdp","conventional","smr","tradeoffs"],"q":"Compare conventional NVMe, FDP, ZNS and host-managed SMR on host burden, write amplification, over-provisioning and ecosystem.","short":"Conventional SSDs ask nothing of the host and pay in OP and write amplification. FDP keeps that interface and lets the host tag data with placement hints, so the drive still runs GC but with less amplification. ZNS moves placement and GC to the host for near-1 write amplification and little OP. Host-managed SMR has the same sequential rule as ZNS, on a hard drive, with a far older software stack.","deep":"| Aspect | Conventional | FDP | ZNS | Host-managed SMR |\n|---|---|---|---|---|\n| Write rule | Random | Random, with placement tag | Sequential per zone (or ZRWA window) | Sequential per zone, plus conventional zones |\n| Who does GC | Drive | Drive | Host | Host (rewrite zones) |\n| Write amplification | Workload dependent, often 2 to 5 at high fill | Lower with good grouping | Near 1 from the drive side | Host rewriting only |\n| Over-provisioning | 7 to 28 percent typical | Still needed | Small | None as such |\n| Drive DRAM for mapping | Full L2P | Full L2P | Coarse zone mapping | Not a concern |\n| Legacy software | Works | Works | Needs zone-aware stack | Needs zone-aware stack |\n| Host burden | None | Lifetime classifier | Log-structured design, GC, resources | Same as ZNS |\n| Ecosystem | Universal | Growing | Narrower, Linux zoned block layer | Mature in HDD |\n\n- **Placement is a hint in FDP:** the drive may ignore or reinterpret it, so WAF is reduced, not guaranteed.\n- **ZNS gives a guarantee, at a price:** no in-place update except inside a ZRWA, and every failure mode moves to the host.\n- **Numbers are indicative:** WAF and OP figures depend on workload and fill level. Quote them as ranges, and never as datasheet facts.\n- **Validation weight:** conventional needs performance and reliability testing. FDP adds placement and statistics tests. ZNS adds the whole zone state machine, resources and Append. See module 1 and the NVMe page for detail.","pitfall":"Presenting ZNS as strictly better. Its gains are real only if the application already writes in a log-structured way.","verify":"FDP and ZNS interaction rules in the current NVMe Base Specification and command set specifications, and any quoted WAF or OP figures against the workload you are comparing.","follow":[{"q":"Can one drive offer both ZNS and conventional namespaces?","a":"Yes as separate namespaces with different command sets. FDP and ZNS combined in one namespace is not something to assume."},{"q":"Which of the four has the lowest DRAM cost?","a":"ZNS and SMR, since mapping is per zone rather than per page."}],"mod":11},{"id":"11.09","level":"Advanced","type":"Numeric","fig":null,"tags":["zrwa","numeric","implicit-flush","explicit-flush","wp","alignment"],"q":"A ZRWA has ZRWASZ = 1024 and ZRWAFG = 64 blocks on 4 KiB LBAs, and the zone starts empty with a ZRWA allocated. Work out the sizes, then the write pointer after each step of the sequence below.","short":"ZRWASZ is 4 MiB and ZRWAFG is 256 KiB, so the window plus the implicit flush region spans 8 MiB. Writes at offsets 0 and 0 again leave WP at 0. A 16-block write at offset 1020 ends at 1035, 12 blocks past the window, so implicit flush advances WP by one ZRWAFG to 64. Flushing to offset 511 commits 448 blocks and moves WP to 512, while flushing to 500 would commit 437 blocks and be rejected.","deep":"Assumptions: offsets are relative to ZSLBA, WP starts at 0, the window is [WP, WP + 1023], writes up to WP + 2047 are accepted (the IZFR), and implicit flush rounds up per the spec's ceiling formula (ZNS 1.4, Figure 60) to a multiple of ZRWAFG.\n\n1. **Sizes:** 1024 x 4 KiB = 4 MiB. ZRWAFG = 64 x 4 KiB = 256 KiB. 2 x 1024 blocks = 2048 blocks = 8 MiB reachable.\n2. **Write 8 blocks at 0, then again at 0:** both inside the window, so WP stays 0. The second write overwrites the first.\n3. **Write 16 blocks at 1020:** last block is 1035. The window ends at 1023, so the excess is 1035 - 1023 = 12 blocks. Round up to a multiple of 64: one unit, 64 blocks. **WP = 64.** The window is now [64, 1087].\n4. **Flush Explicit to LBA 511:** blocks to commit = 511 - 64 + 1 = 448. 448 / 64 = 7, so it is aligned. **WP = 512.**\n5. **Flush Explicit to LBA 500 instead:** 500 - 64 + 1 = 437 blocks. 437 mod 64 = 53, so it is not a multiple of ZRWAFG and is rejected.\n6. **Write at offset 3000 when WP = 64:** the limit is 64 + 2048 - 1 = 2111, so 3000 fails with Zone Invalid Write.\n\nWhy bother: if a filesystem updates one 4 KiB bitmap block 1000 times before committing, plain ZNS needs 1000 x 4 KiB = 3.9 MiB of zone space (each update appended), while ZRWA needs one 256 KiB commit, about 15.6 times less zone space and a matching drop in later host GC.","pitfall":"Rounding the implicit flush down. The rule must push the pointer forward far enough that the write fits.","verify":"Alignment requirements at the start of a ZRWA. The 2 x ZRWASZ accepted region and the rounding formula used above are confirmed in ZNS 1.4, 5.7.3, Figure 60, not just a QEMU convention.","follow":[{"q":"What if step 3 wrote 80 blocks at 1000 instead?","a":"The last block is 1079, the excess is 56, still one unit of 64, so WP = 64. At 1000 with 100 blocks the end is 1099, excess 76, two units, WP = 128."},{"q":"Why does the reported WP in step 2 not show 8?","a":"It is the committed pointer. The window contents are not committed."}],"mod":11},{"id":"11.10","level":"Advanced","type":"Trap","fig":null,"tags":["zrwa","zone-append","trap","persistence","conventional","ordering"],"q":"Trap: a teammate says \"ZRWA gives us random writes to a zone, Zone Append still works there, and whatever we wrote is already on the media\". Which of the three claims are wrong?","short":"All three are wrong. ZRWA is random writes only inside a bounded window above the write pointer. Zone Append is rejected outright for a zone associated with a ZRWA (ZNS 1.4, 3.4.1 and status B6h). Data in the window is not committed until it is flushed, so it must not be assumed durable or even visible in the reported write pointer.","deep":"- **\"Random writes to a zone\":** wrong in scope. The rewritable area is ZRWASZ blocks (plus the IZFR) above WP. Behind WP the zone is sequential-only.\n- **\"Zone Append still works\":** wrong. The controller shall abort a Zone Append received for a zone associated with a ZRWA, with status Invalid Zone Operation Request (B6h) (ZNS 1.4, 3.4.1, Figure 31).\n- **\"It is already on the media\":** wrong to assume. Committed means behind WP. Report Zones shows only committed data. What survives a power loss for uncommitted window data is device specific, and the host should not depend on it without a documented guarantee.\n- **Other traps in the same area:**\n  - Overlapping writes in flight have no protocol ordering, so two overwrites of one LBA racing in different queues leave undefined content.\n  - The write pointer can move on its own through implicit flush.\n  - A ZRWA occupies an open resource for as long as it exists.\n- **Host rule of thumb:** treat the window as a scratch buffer with a commit operation. Recovery logic should look only at data behind the write pointer.","pitfall":"Adding ZRWA to a Zone Append based design without checking. The two placement models are confirmed mutually exclusive: Append into a ZRWA zone is always rejected.","verify":"Read behavior inside the window, and any power-loss guarantee for uncommitted ZRWA data, in the ZNS Command Set Specification and the device datasheet.","follow":[{"q":"Can I mix Write and Zone Append to the same ZRWA zone at different times?","a":"Not while a ZRWA is allocated (Append is always rejected then). After Full, Empty, Read Only or Offline releases the ZRWA (11.06), the normal rules apply again."},{"q":"Is a Read of an uncommitted window LBA legal?","a":"The device is expected to return the latest data written to the window, but confirm the exact read rule in the spec and test it."}],"mod":11},{"id":"11.11","level":"Advanced","type":"Debug","fig":null,"tags":["zrwa","debug","status","cqe","nvme-cli","invalid-write"],"q":"You run the ZRWA script below on a drive reporting ZRWASZ = 1024, ZRWAFG = 64, NUMZRWA = 2, 4 KiB LBAs. Decode each result and say which ones, if any, are firmware defects.","short":"None of these is a defect on its face. Step 4 moved WP to 0x40 by implicit flush, which the host did not ask for. Step 5 is Zone Invalid Write because 0x900 is beyond WP + 2 x ZRWASZ. Step 7 is ZRWA Resources Unavailable because both ZRWA resources are in use. Steps 8 and 9 are Invalid Zone Operation Request for an unsupported Append and a non-Empty allocation. A defect would be a different status or a pointer that is not FG-aligned.","deep":"```\n 1 open   zone0 (slba 0x0)   zrwaa=1          -> success\n 2 write  slba 0x0   nlb 8                    -> success\n 3 write  slba 0x0   nlb 8   (same data area) -> success\n 4 write  slba 0x3F0 nlb 32                    -> success  (report: wp=0x40 za=0x08 zs=0x30)\n 5 write  slba 0x900 nlb 8                    -> SCT 1 SC 0xBC\n 6 open   zone1 (slba 0x10000) zrwaa=1        -> success\n 7 open   zone2 (slba 0x20000) zrwaa=1        -> SCT 1 SC 0xB7\n 8 append zone0                               -> SCT 1 SC 0xB6\n 9 write zone3 nlb 8, then open zone3 zrwaa=1 -> SCT 1 SC 0xB6\n```\nDecode: status word (DW3 bits 31:16) is DNR << 15, SCT << 9, SC << 1, plus the phase bit. With DNR set and P = 1, SC 0xBC is 0x8379, SC 0xB7 is 0x836F and SC 0xB6 is 0x836D. nvme-cli shows the same as SCT and SC values.\n\n1. Steps 2 and 3 are in the window, so success, and Report Zones still shows WP 0.\n2. Step 4 ends at 0x3F0 + 31 = 0x40F = 1039, past the window end 1023, so the excess of 16 rounds to one 64-block unit and WP = 0x40 (ZNS 1.4, Figure 60 formula). The zone state byte 0x30 is Explicitly Open (state 3h in bits 7:4), and attribute 0x08 is ZRWAV (bit 3).\n3. Step 5: 0x900 is 2304, at or beyond IZFR_Start_LBA + ZRWASZ = 0x40 + 2048 = 0x840, so Zone Invalid Write (BCh, ZNS 1.4, 5.7.3).\n4. Step 7: NUMZRWA = 2 and zones 0 and 1 hold them. ZRWA Resources Unavailable (B7h) is checked before the zone-state check, so this is correct ahead of Too Many Open Zones (ZNS 1.4, 3.4.3.1.4.1).\n5. Step 8: Append into a ZRWA zone aborts with Invalid Zone Operation Request (B6h), confirmed spec text, not a QEMU-only choice (3.4.1, Figure 31). Step 9: allocation on a non-Empty zone is also B6h per 3.4.3.1.4.1, but note both ZRWA resources are already held by zones 0 and 1 at that point, so ZRWA Resources Unavailable (B7h) is an equally defensible reading if the resource check runs first; record which the drive returns.\n\nDefect signs: WP not a multiple of ZRWAFG after an implicit flush, B7h missing so a third ZRWA opens, or the ZRWAV bit stuck after Close.","pitfall":"Comparing the whole status word in a test. DNR, retry and phase bits differ between devices, so mask to SCT and SC.","verify":"Whether step 9 should return B6h or B7h when both the non-Empty and no-resources conditions hold; the spec bullets (3.4.3.1.4.1) do not state a priority between them.","follow":[{"q":"Step 4 succeeded but Report Zones showed WP 0x40. Is the host wrong to expect WP 0?","a":"Yes. The write ended in the IZFR, so the controller advanced the pointer. A host model must derive WP from the write, not from the flush commands alone."},{"q":"How would you tell B7h from a host bug in the zone list?","a":"Count zones with ZRWAV set from Report Zones. If it equals NUMZRWA, the error is correct. If fewer, suspect a leaked resource."}],"mod":11},{"id":"11.12","level":"Advanced","type":"Concept","fig":null,"tags":["simple-copy","zns","write-pointer","destination","resources","host-gc"],"q":"How does Simple Copy behave on a zoned namespace: what rules apply to the destination and the sources, and what does it change for host garbage collection?","short":"The destination of a Copy in a zoned namespace behaves like a write: it must land at the write pointer of one zone (or in the ZRWA window), respect zone state and capacity, and it advances the write pointer and can implicitly open the zone. Sources are read like normal reads, so zone state, boundary and read-above-WP rules apply. For host GC it removes the host read and write data movement for relocation, but the NAND work stays.","deep":"- **Destination rules (confirmed, ZNS 1.4, 3.3.2):** every one of Zone Boundary Error (B8h, destination range spans zones), Zone Is Full (B9h), Zone Is Read Only (BAh), Zone Is Offline (BBh), Zone Invalid Write (BCh, \"the write to the zone was not at the write pointer\"), Too Many Active Zones (BDh) and Too Many Open Zones (BEh) is defined for Copy exactly as for Write, so the destination is checked like a write at the WP and can implicitly open the zone.\n- **Source rules:** a source range needs the same checks as a Read; the spec confirms only Zone Is Offline (BBh) and Zone Boundary Error (a range spanning zones) for a Source Range Entry. Read-above-WP and read-across-boundary behavior for sources otherwise follow the normal read rules (module 7).\n- **Overlap:** source and destination ranges must not overlap. In host GC they are in different zones, so this only matters for tests that copy inside one zone.\n- **Ordering and completion:** a single Copy is one command with NR + 1 ranges. Partial failure semantics (which ranges were written, what the write pointer is afterwards, and what the completion reports) are spec-defined, so a validator must read the write pointer after a failed Copy and not assume all-or-nothing.\n- **Concurrency:** a Copy to a zone competes with Writes and Appends to the same zone. Treat it as another writer that must follow the single-writer or ZRWA rule.\n- **Host GC changes:** the victim-zone valid ranges become a batch of source ranges for one Copy into the target zone. The host still needs its own map update, reset of the victim, and crash handling, and PI can be used to check source data during the copy.","pitfall":"Assuming Copy is atomic or all-or-nothing. It is one command, but the state after a failure or power loss is spec- and device-defined.","verify":"Partial-completion reporting and ONCS atomicity behavior, which are NVM Command Set Specification scope, not redefined by ZNS. (The destination and source status codes above are confirmed in ZNS 1.4, 3.3.2, Figure 14, not just the QEMU model.)","follow":[{"q":"Can a Copy be used to fill a zone that has a ZRWA?","a":"Possibly, with window rules for the destination. This combination is not well documented publicly, so test it and read the spec."},{"q":"Does Copy consume open resources?","a":"Yes when it implicitly opens the destination zone, so an over-budget host can see Too Many Open Zones from a Copy."}],"mod":11},{"id":"11.13","level":"Advanced","type":"Concept","fig":null,"tags":["zde","descriptor-extension","use-cases","recovery","filesystem","design"],"q":"What are practical uses of the Zone Descriptor Extension, and what design rules keep it from causing trouble?","short":"The extension is a small host-defined blob stored with a zone descriptor, set on an Empty zone and returned by an extended Report Zones. It is useful for per-zone metadata that recovery needs quickly: owner, generation, lifetime class or a checksum. A host can rebuild its map from one report instead of scanning zone contents. The rules are that the extension is set before data, uses an active resource, and is cleared by Reset.","deep":"Mechanics live in modules 4 and 6. This answer is about how to use it.\n- **Recovery map:** after a crash, one extended Report Zones returns every zone's state, write pointer and extension. A filesystem that stores \"zone owner = file group 17, generation 42\" can rebuild its zone table without reading data from hundreds of zones.\n- **Lifetime and placement tags:** a database can keep a lifetime class or level number per zone, so GC decides victims from the report alone.\n- **Integrity anchor:** a checksum of a small header written at the zone start can live in the extension, so a torn header is detectable.\n- **Fencing and epochs:** a generation number per zone helps a restarted writer detect that a zone was reset and reused by a newer writer.\n- **Design rules:**\n  - Set it while the zone is Empty, and expect the zone to become Closed and to hold an active resource from that moment (see the budget in module 6).\n  - Size is fixed by ZDES, up to 255 x 64 bytes, so design a compact layout with a version byte and a checksum.\n  - Do not use it as a log: it cannot be updated in place, so changing it means a Reset first.\n  - Test what survives Reset, power loss and controller reset, since the host will depend on that.\n- **Availability:** support is per LBA format (ZDES nonzero). Mainline Linux has no block-layer interface that I know of, so users are SPDK, xNVMe or passthrough.","pitfall":"Filling extensions for every zone at format time. Each set zone is Closed and takes an active slot.","verify":"ZDES units and limits, persistence across power loss and controller reset, clearing on Reset and interaction with Read Only or Offline zones in the ZNS Command Set Specification.","follow":[{"q":"Why not keep the same data in a separate metadata zone?","a":"That costs an extra zone and a read, and it needs its own consistency between zone contents and the metadata. The extension travels with the descriptor."},{"q":"Should the extension hold a copy of user data?","a":"No. It is meant for a few bytes to a few KiB of metadata, and it costs report size for every zone."}],"mod":11},{"id":"11.14","level":"Principal","type":"Numeric","fig":null,"tags":["simple-copy","numeric","host-gc","pcie","offload","quantify"],"q":"A host GC relocates 4 GiB of valid data per victim batch from 4 KiB LBAs. Quantify what Simple Copy saves over read-then-write, and what it does not.","short":"With the host in the path, relocating 4 GiB moves 4 GiB up and 4 GiB down over PCIe, 8 GiB in total, plus 4 GiB of host DRAM buffers. With Copy, if valid data averages 256 KiB fragments, that is 16,384 source ranges. At 128 ranges per command that is 128 commands and 512 KiB of range descriptors, roughly 16,000 times less PCIe traffic. NAND read and program work is unchanged.","deep":"Assumptions: valid data 4 GiB = 1,048,576 blocks. Average fragment 64 blocks (256 KiB). MSRC = 128 ranges per command (a hypothetical device limit). Source range entry = 32 bytes. Full-duplex PCIe with about 6 GB/s usable per direction.\n\n1. **Host-path traffic:** 4 GiB read + 4 GiB write = 8 GiB across the link, and 4 GiB of DRAM as a bounce buffer per batch.\n2. **Ranges:** 1,048,576 / 64 = 16,384 ranges.\n3. **Commands:** 16,384 / 128 = 128 Copy commands, each with a 128 x 32 = 4096 byte descriptor list.\n4. **Descriptor traffic:** 128 x 4096 = 512 KiB, plus command and completion overhead. Ratio: 8 GiB / 512 KiB = 16,384.\n5. **PCIe time saved:** 4 GiB at 6 GB/s is about 0.72 s per direction. With reads and writes overlapping, the link is busy for about 0.7 s per batch on the host path and close to nothing on the Copy path.\n6. **Fragment size sensitivity:** with 8-block fragments there are 131,072 ranges and 1024 commands, and the descriptors are 4 MiB, still trivial. Very small fragments make the command count (and MCL and MSSRL limits) the constraint.\n7. **What stays the same:** NAND reads and programs, the L2P or zone map updates, the victim Reset, and the time to program the destination. If the device is NAND-bound, Copy does not speed up GC, it frees the host CPU and the link for foreground I/O. A test should measure foreground p99 latency during GC, not GC time alone.\n\nMethod to defend the claim: run the same GC batch with and without Copy at fixed foreground load, record link bytes (a PCIe analyzer or device counters), host CPU, GC batch time and foreground p99.9.","pitfall":"Claiming a GC speedup. The saving is on the host and link, and the media time is unchanged.","verify":"The MSSRL, MCL and MSRC values of the target device and their units in Identify Namespace, and any ZNS-specific limit on the destination size per command.","follow":[{"q":"What limits how big one Copy can be?","a":"MSRC, MSSRL, MCL and the controller's internal queue depth. Also long single commands risk host command timeouts."},{"q":"What does Copy lose relative to a host-side copy?","a":"The host cannot inspect or recompress the data, and integrity checking depends on PI in the copy."}],"mod":11},{"id":"11.15","level":"Principal","type":"Scenario","fig":null,"tags":["interview","tradeoffs","market","zns","fdp","direction"],"q":"An interviewer asks: \"What are ZNS's tradeoffs, and where is this going?\" How do you answer as a validation principal, and what do you hedge?","short":"Give the trade in one sentence: ZNS removes the drive's mapping, GC and most OP in exchange for a host that writes sequentially, resets zones and budgets resources. Then say where it wins (log-structured stores, controlled stacks), where it struggles (legacy software, mixed workloads), how FDP and ZRWA and Copy try to ease adoption, and that adoption trends should be checked against current sources. Close with what you would validate.","deep":"A structure that works in 90 seconds:\n1. **The trade:** less DRAM, OP and write amplification and better tail latency, against zone-aware software, host GC and new failure modes. See module 1.\n2. **Where it fits:** RocksDB with ZenFS or similar LSM stores, log-structured filesystems (f2fs, btrfs zoned), object stores with append-only segments.\n3. **Where it does not:** unmodified filesystems, block-device consumers, mixed random workloads, third-party software you cannot change.\n4. **The features that ease it:** ZRWA for small in-place updates, Zone Append for concurrency, Simple Copy for GC offload. All later additions, none removing the host burden.\n5. **The alternative:** FDP keeps the block interface and reduces WAF through placement hints. Public write-ups I have seen describe FDP as having broad commercial traction and hyperscaler backing, and describe ZNS as needing invasive application changes (check the source and date before quoting any). That is a reasonable reading, not a fact I would quote as market share.\n6. **The other signal:** the ZNS Command Set Specification kept getting revisions after 1.1 in 2021 (my recollection is 1.2 and later in 2024 and 2025, unverified), and the zoned block layer is well maintained in Linux because SMR needs it. So zoned interfaces are not going away, even if ZNS-specific SSD demand is narrower.\n7. **Validation view:** either way, the zone model, resource limits and durability rules need tests, and much of that reuses the SMR and ZBC tooling.\n\nWhat to hedge aloud: market numbers, vendor roadmaps, and TP-level details you have not read.","pitfall":"Dismissing ZNS as dead, or promoting it as the future. Say what the evidence supports and label the rest as opinion.","verify":"Current ZNS and FDP deployment status, the latest ZNS Command Set Specification revision and date, and any claim about hyperscaler adoption, against current public sources.","follow":[{"q":"Would you recommend ZNS for a general-purpose fleet?","a":"Only where the software is under the team's control and lifetimes cluster naturally. Otherwise FDP or better OP tuning is lower risk."},{"q":"What is your single biggest validation concern?","a":"Recovery after power loss, because host and device must agree on write pointers and uncommitted data."}],"mod":11},{"id":"11.16","level":"Principal","type":"Scenario","fig":null,"tags":["validation-plan","zrwa","simple-copy","fault-injection","oracle","automation"],"q":"Design a validation plan for a ZNS SSD that claims ZRWA and Simple Copy. What do you test, what is the oracle, and how do you decide it is enough?","short":"Extend the zone-state model from module 10 with ZRWA state (allocated, committed WP, window contents) and a Copy model, then drive it with directed boundary tests, constrained-random command streams and power-loss injection. The oracle is the model plus a data pattern that encodes LBA and generation. Pass criteria are exact statuses, exact WP after every command, and no loss of committed data. Coverage means every window boundary, every resource limit and every abort point.","deep":"1. **Capability consistency:** OZCS, ZRWACAP, ZRWASZ, ZRWAFG, NUMZRWA, ONCS, MSSRL, MCL and MSRC all agree with behavior. Reject devices whose limits are not enforced.\n2. **ZRWA directed tests:** write at WP - 1, WP, WP + ZRWASZ - 1, WP + ZRWASZ, WP + 2 x ZRWASZ - 1 and WP + 2 x ZRWASZ; overwrites with read-back; implicit flush amounts; explicit flush aligned, unaligned, empty, too large; at zone capacity.\n3. **ZRWA lifecycle:** allocate on Empty, on non-Empty, past NUMZRWA; Close, Finish, Reset with uncommitted data; controller-driven Read Only or Offline; ZRWAV in Report Zones after each.\n4. **Copy directed tests:** one range, MSRC ranges, MSRC + 1, MSSRL and MSSRL + 1, MCL and MCL + 1, overlap, source in Offline zone, destination wrong WP, full zone, resource limit, PI mismatch. Verify data content and WP.\n5. **Random and concurrent:** mix Write, Append, Copy, flush and zone management across zones at several queue depths. Serialize overlapping window writes in the host, as the protocol does not order them.\n6. **Fault injection:** power loss during window writes, during explicit flush and mid-Copy; controller reset with a ZRWA allocated; command abort and timeout on a long Copy. After each, rebuild the model from Report Zones and check the invariants.\n7. **Oracle:** for each block a record of (LBA, generation, source). A model of committed WP and window. Differential run against QEMU's ZRWA and Copy implementation for the logic, and hardware only for timing and power.\n8. **Exit criteria:** all status and WP cells reached, no unexplained model divergence, repeated power-loss runs clean at a target count, and any documented device-specific behavior captured as an explicit waiver.","pitfall":"Trusting QEMU as the specification. It is a reference model and can be wrong, so every divergence needs a spec citation.","verify":"Each expected status, the effect of Close, Finish and Reset on uncommitted ZRWA data, Copy partial-failure behavior and power-loss guarantees in the ZNS and NVM Command Set Specifications and vendor documents.","follow":[{"q":"How do you keep spec-version drift from breaking the suite?","a":"Read support bits from Identify, gate each test on them, and put revision-specific expectations in a table you can update."},{"q":"Which test finds the most bugs in practice?","a":"Usually power loss around the window and flush, and resource exhaustion paths, because they combine state."}],"mod":11},{"id":"11.17","level":"Principal","type":"Cross-layer","fig":null,"tags":["power-loss","zrwa","durability","root-cause","copy","recovery"],"q":"After sudden power loss, a filesystem finds that data it had flushed with an explicit ZRWA flush is missing, while unflushed window data is present. How do you root-cause it and decide whether it is a device bug?","short":"Separate what the host was told from what the media holds. A successful explicit flush means the range is behind the write pointer, so losing it is a defect unless the host reused the zone or the device promised nothing beyond a separate durability command. Unflushed window data being present is allowed, not a bug. Capture the last completions, the Report Zones state before and after, and the read-back of every block.","deep":"1. **Timeline:** from host logs or a trace, list for the last N commands: completion status, the WP the device reported, whether a Flush or Flush Explicit ZRWA was acknowledged, and the queue. The oracle is the last acknowledged flush.\n2. **Post-power-cycle state:** Report Zones for the zone (state, WP, ZRWAV). Read every block below the old WP and in the window.\n3. **Classify:**\n   - Data below the acknowledged flush point missing, and WP lower: device defect, since the flush was acknowledged.\n   - WP lower than the acknowledged flush but data before it good: the pointer was not persisted. Check whether the device makes the write pointer durable only on a separate NVM Flush.\n   - Window data present above WP: allowed. Its survival is device-defined unless documented.\n   - WP higher than acknowledged: allowed, for example an implicit flush that landed just before the cut.\n4. **Layers:** check whether the host relies on the NVM Flush command for durability. Check volatile write cache settings (Feature 06h) and whether the SSD has power-loss protection capacitors. A drive that acknowledges commit before it is programmed needs PLP to keep the promise.\n5. **Repeat under control:** use a programmable power switch or the firmw
