the zone to Full.","verify":null,"follow":[{"q":"Why does ZDEV = 1 force Closed even when WP = ZSLBA?","a":"Because the zone carries host data in its descriptor extension, so it is not \"nothing written\" and must not be silently emptied."},{"q":"Which resets apply?","a":"As I read the spec, the initial state is set by an NVM Subsystem Reset or when all controllers report shutdown processing complete. A Controller Level Reset (CC.EN 1 to 0) is not in that list, and QEMU closes zones only on shutdown, so record what the drive does on CC.EN and on CC.SHN separately."}],"mod":3},{"id":"3.10","level":"Advanced","type":"Concept","fig":null,"tags":["zone-attributes","zfc","fzr","rzr","zdev","excursion"],"q":"What do the zone attribute bits ZFC, FZR, RZR and ZDEV mean, and how should a host and a validator treat them?","short":"ZFC (bit 0) says the controller finished the zone itself. FZR (bit 1) and RZR (bit 2) mean the controller recommends the host Finish or Reset the zone. ZDEV (bit 7) says a zone descriptor extension is valid. FZR and RZR are advisory hints tied to media health or data-retention limits, not errors, and Reset Zone clears all of ZDEV, FZR, RZR, ZFC and ZRWAV together.","deep":"- **ZFC:** set when the controller moved an active zone to Full without a host command, a Zone Active Excursion. Data below the old WP is intact and the zone takes no more writes. The device must advertise this in Zone Operation Characteristics (ZAE), and the host should be told through a Zone Descriptor Changed asynchronous event (ZNS 1.4, Figure 43; module 6).\n- **FZR:** the controller would like the zone filled or Finished, for example because a partly written zone has been open too long for its NAND. The Identify Namespace data holds finish recommended limits (FRL and further limits).\n- **RZR:** the controller would like the zone reset, for example because stored data has aged or degraded. Reset limits (RRL and further limits) live in Identify Namespace data.\n- **Zone Attributes Information (newer revisions):** selects which of the limit fields applies to this zone.\n- **ZDEV:** cleared by Reset Zone, and it changes the post-reset state to Closed (3.09).\n- **Linux angle:** the kernel NVMe driver source I checked refuses a namespace with any Zone Operation Characteristics bit, so excursion-capable ZNS devices are not usable there without patches. That constrains where ZFC can be tested.","pitfall":"Failing a test on FZR or RZR being set. These are advisory, and a validator should log them and check only that Reset or Finish clears them. Confirmed against ZNS 1.4, 5.4 and 5.5: RRL and FRL (and RRL1-3, FRL1-3) are in seconds, and if a zone is in Read Only or Offline, RZR and FZR shall both be cleared to 0.","verify":null,"follow":[{"q":"Does FZR change the zone state?","a":"No. The zone stays in its state until the host acts, though the controller may escalate per its limits (for example by finishing it and setting ZFC)."},{"q":"How do you test FZR?","a":"Leave a zone partly written for longer than the advertised finish limit and check the bit appears. It is device-specific, so report it as informational unless the vendor defines the trigger."}],"mod":3},{"id":"3.11","level":"Advanced","type":"Trap","fig":null,"tags":["read","unwritten","dlfeat","dulbe","boundary","offline"],"q":"What does a Read return in each zone state and above the write pointer? Does reading above the WP fail?","short":"No, reads above the WP do not fail. Reads work in every state except Offline, and LBAs at or above the WP (and in the gap above ZCAP) count as unwritten blocks. The device returns the value advertised in DLFEAT (zeros or ones) or, if the host enabled DULBE, may return Deallocated or Unwritten Logical Block. Offline zones and reads that cross a zone boundary without support fail.","deep":"| Zone state | Read result |\n|---|---|\n| Empty | success, all LBAs unwritten |\n| Open or Closed | success, data below WP, unwritten value at and above WP |\n| Full, Read Only | success |\n| Offline | fails with Zone Is Offline (BBh) |\n\n- **Read across zone boundaries:** allowed only if the Read Across Zone Boundaries bit (Optional Zoned Command Support field) is 1. If it is 0, a read that spans two zones is aborted with Zone Boundary Error (B8h). When it is set, every zone the read touches has to be readable.\n- **DLFEAT:** the Read Value field in Identify Namespace is 001b for all-00h, 010b for all-FFh, 000b for not reported. Read it and do not hardcode zeros.\n- **Reads that span the WP:** legal, the written part matches, the rest is the unwritten value.\n- **After Reset Zone:** old data must no longer be returned. A test should read back and check for the unwritten value, which doubles as a data-leak check.\n- **Boundary reads to include:** WP - 1, WP, WP + 1, ZCAP - 1, ZCAP, last LBA of the zone, and a read straddling into the next zone.","pitfall":"Writing \"read above WP must fail\" into an oracle. That is a different drive class's rule and it flags a compliant ZNS device. Confirmed against ZNS 1.4: OZCS bit 0 is Read Across Zone Boundaries (Figure 49), and a read that touches an Offline zone aborts with Zone Is Offline regardless of how many zones it spans (2.1.1.2.1.2, Figure 17). Whether the unwritten-block behavior above the WP is an error or a defined read value is governed by the NVM Command Set Specification's Deallocated or Unwritten Logical Blocks section, not by ZNS itself; VERIFY that against the NVM Command Set spec.","verify":null,"follow":[{"q":"Which status does DULBE return?","a":"Deallocated or Unwritten Logical Block (SCT 2, SC 87h; NVME_SC_UNWRITTEN_BLOCK in Linux), only if the feature is enabled and supported."},{"q":"Why might a device return stale data above the WP?","a":"It is a firmware bug when a Reset did not invalidate the mapping. Reads there must give the unwritten value."}],"mod":3},{"id":"3.12","level":"Advanced","type":"Cross-layer","fig":null,"tags":["wp-invalid","full","linux","blkzone","units","report"],"q":"Report Zones on the device shows a Full zone with WP = 0x4DC00, but blkzone shows a different write pointer for the same zone. Which one is right, and what is the second difference to watch for?","short":"Both are right. The spec makes the WP field invalid in Full, Read Only and Offline zones, so the device may put any value there. The Linux NVMe driver ignores it for Full zones and reports WP as zone start plus zone length. Also, blkzone prints sectors of 512 bytes regardless of the LBA size, so every LBA number is scaled by the LBA size divided by 512.","deep":"- **Spec rule:** WP is valid in Empty, Implicit Open, Explicit Open and Closed, and invalid in Full, Read Only and Offline.\n- **Kernel code path:** in `nvme_zone_parse_entry` the driver takes the state from `zs >> 4`, and for Full it sets `wp = start + len` where len is Zone Size, not capacity. For other states it passes the raw value through.\n- **Units:** the block layer uses 512-byte sector units for start, len, wp and capacity. With 4 KiB LBAs, LBA 0x4DC00 would be sector 0x26E000 (multiply by 8), but for this Full zone (start LBA 0x40000, ZSZE 0x10000) the driver reports wp = 0x280000 sectors, the zone end.\n- **Validator rule:** assert the state, not the WP, for Full, Read Only and Offline zones. Keep a logical model value (ZSLBA + ZCAP for a Full zone) and skip raw comparison.\n- **Cross-checks:** convert units before comparing `nvme zns report-zones` with `blkzone report`, and treat the Full-zone WP override as expected.\n- **What Full still means:** the zone has no writable space left. LBAs between the last written LBA and ZCAP (for a Finished zone) read as unwritten.","pitfall":"Writing \"Full means WP = ZSLBA + ZCAP\" as a hard invariant. A zone is Full when its state says so, and a Finished or controller-finished zone can be Full with a partly written span.","verify":"Kernel behavior for Read Only and Offline WP on the version you test, and whether blkzone output units differ across util-linux versions.","follow":[{"q":"Is the WP of an Empty zone always ZSLBA?","a":"Yes, valid and equal to ZSLBA, so a mismatch there is a device bug."},{"q":"What does the block layer report for Read Only and Offline WP?","a":"The source I checked passes the raw device value, so it is undefined by the spec and must be ignored."}],"mod":3},{"id":"3.13","level":"Advanced","type":"Debug","fig":null,"tags":["report-zones","dump","invariants","triage","violation"],"q":"You get the report-zones dump below (4 KiB LBAs, ZSZE 0x10000, ZCAP 0xDC00, MOR 4, MAR 8, ZOC = 0). Which zones violate the spec, and how would you confirm each?","short":"Zones 2, 4, 7 and 8 are violations. Zone 2 is open with WP at ZSLBA + ZCAP when it must be Full. Zone 4 sets ZFC even though ZOC = 0 does not advertise Zone Active Excursions, which the spec forbids. Zone 7 is Closed with WP past ZSLBA + ZCAP. Zone 8 is Empty with WP not at ZSLBA. Zones 3, 5 and 6 are legal but need explanation.","deep":"| Zone | ZSLBA | ZCAP | WP | ZS byte | ZA |\n|---|---|---|---|---|---|\n| 0 | 0x00000 | 0xDC00 | 0x00000 | 10h | 00h |\n| 1 | 0x10000 | 0xDC00 | 0x10200 | 20h | 00h |\n| 2 | 0x20000 | 0xDC00 | 0x2DC00 | 20h | 00h |\n| 3 | 0x30000 | 0xDC00 | 0x30000 | 40h | 00h |\n| 4 | 0x40000 | 0xDC00 | 0x4DC00 | E0h | 01h |\n| 5 | 0x50000 | 0xDC00 | 0x50000 | D0h | 00h |\n| 6 | 0x60000 | 0xDC00 | 0x60000 | F0h | 00h |\n| 7 | 0x70000 | 0xDC00 | 0x7F000 | 40h | 00h |\n| 8 | 0x80000 | 0xDC00 | 0x80100 | 10h | 00h |\n\n1. Decode the state as the high nibble: 1h Empty, 2h Implicit Open, 4h Closed, Eh Full, Dh Read Only, Fh Offline.\n2. Zone 1: WP - ZSLBA = 0x200 = 512 LBAs (2 MiB). Fine.\n3. **Zone 2 (violation):** WP = ZSLBA + ZCAP = 0x2DC00 in an open state. Reaching capacity must make the zone Full.\n4. **Zone 3 (legal):** Closed with WP = ZSLBA arises from Open then Close with no data. It still counts as active, and after a reset it would return as Empty (ZDEV = 0).\n5. **Zone 4 (violation):** ZFC = 1 means the controller finished the zone via a Zone Active Excursion, which requires the ZAE bit set in ZOC; ZOC = 0 here, so ZFC shall not be set (ZNS 1.4, 5.6). WP is invalid in Full and is ignored.\n6. **Zones 5 and 6:** WP is invalid, so ignore it. Read Only rejects writes and Reset. Offline rejects reads and writes.\n7. **Zone 7 (violation):** WP 0x7F000 exceeds ZSLBA + ZCAP = 0x7DC00 by 0x1400 = 5,120 LBAs, into the unmapped gap.\n8. **Zone 8 (violation):** Empty demands WP = ZSLBA, but WP is 0x100 (256 LBAs) higher.\n9. Resource check: open = zones 1 and 2 = 2 (limit MOR 4), active = 2 open + Closed zones 3 and 7 = 4 (limit MAR 8). Fine.","pitfall":"Treating zone 3 as a bug. Closed with no data is reachable and legal, but it consumes an active resource, which is why resource tests must count it. Confirmed against ZNS 1.4, 4.1.5.1 (ZAE bit) and 5.6: if ZAE is cleared to 0 in ZOC, the controller shall not perform a Zone Active Excursion, so ZFC must never be set. Zone 4 (ZOC = 0, ZFC = 1) is therefore a genuine device defect, not merely \"suspect.\"","verify":null,"follow":[{"q":"How do you tell if zone 2 is a stale report or a real internal state?","a":"Send a 1-block write at the WP. Zone Is Full means state was Full and the report is stale, Zone Boundary Error means the state is open with WP at the end (a state-update bug), success means data past capacity was accepted (severe)."},{"q":"Zone 8 shows Empty with a WP off by 256 LBAs. What would you read?","a":"The LBAs at ZSLBA and ZSLBA + 0x100, plus the trace of the preceding Reset. Suspect a Reset that cleared state but not the WP, or a stale cache in report generation."}],"mod":3},{"id":"3.14","level":"Principal","type":"Concept","fig":null,"tags":["shadow-model","invariants","oracle","automation","coverage"],"q":"How would you design a zone-state model and invariant checker for a ZNS validation framework?","short":"Keep a per-zone shadow of state, WP, attributes and resource counts, updated only from command completions and the spec's transition rules, never from the device report. After each drained batch and on a timer, run Report Zones and diff against the shadow. Assert geometry, WP range, transition legality, resource limits and WP monotonicity, and encode the legitimate nondeterminism explicitly.","deep":"1. **Geometry:** ZSLBA(n) = n x ZSZE, ZCAP <= ZSZE, type = 2h, state is one of the seven, reserved bytes zero.\n2. **WP range:** in Empty, Open and Closed states ZSLBA <= WP < ZSLBA + ZCAP. Empty implies WP = ZSLBA, but WP = ZSLBA does not imply Empty, since an open or Closed zone with no data sits there too. Ignore WP in Full, Read Only, Offline.\n3. **Monotonic WP:** between Resets, WP never decreases, and after each completed write it equals the old WP plus blocks written (for Append, returned LBA plus length).\n4. **Transition legality:** only the table in 3.06 plus declared controller moves. Offline is terminal. Read Only never returns to writable.\n5. **Resources:** open count <= open limit and active count <= active limit (MOR and MAR are zero-based in Identify, and the kernel uses MOR + 1, so 0xFFFFFFFF means no limit).\n6. **Rejected commands:** a failed command must leave state and WP unchanged. Check by reporting the zone right after.\n\n- **Declared nondeterminism:** the controller may close any Implicitly Opened zone when resources run out, may move zones to Read Only or Offline, and after power loss the WP may lie between last durable and last submitted. The model holds an allowed set, not one value.\n- **Race handling:** compare after draining the queues, since a report can race in-flight writes.\n- **Failure output:** dump the model, the report, and the last 20 commands with completion status so the trace reproduces.","pitfall":"Asserting exact equality where the spec allows a set of outcomes, which produces flaky failures that get ignored and hide real bugs. Confirmed against ZNS 1.4, Figure 49: MAR and MOR are both 0's based, and FFFFFFFFh in either field means no limit.","verify":null,"follow":[{"q":"Why not seed the model from the device report?","a":"A device that consistently lies (state and WP both wrong the same way) would never be caught. The oracle must come from the spec and completions."},{"q":"How do you handle an unexpected but legal Closed zone?","a":"Record it as an informational eviction, resync the shadow to Closed, and check resource counts."}],"mod":3},{"id":"3.15","level":"Principal","type":"Scenario","fig":null,"tags":["power-loss","wp","durability","flush","fua","triage"],"q":"After a sudden power cut in the middle of a sequential write stream, Report Zones shows a zone Closed with a WP lower than the host last saw. Is that a bug, and how do you triage it?","short":"Not automatically. After power loss the controller rebuilds zone state from what it persisted: open zones return Closed, and WP reflects recoverable data. It is a bug if the WP is lower than the last point the host made durable (FUA or Flush completion, or any completion when there is no volatile write cache), or if data below the WP is missing or wrong. Bound the WP between the durable end and the submitted end and read back everything.","deep":"1. **Record per zone before the cut:** last submitted end LBA, last completed end LBA, last durable end (FUA write or Flush completion), and whether a volatile write cache is enabled (Identify Controller VWC, Get Features Volatile Write Cache).\n2. **After power on:** Report Zones. Expect state per 3.09 and WP_new with durable_end <= WP_new <= submitted_end.\n3. **Read back every LBA below WP_new** and compare with the written pattern. Read LBAs at and above WP_new and expect the unwritten value.\n4. **Classify failures:**\n   - WP_new > durable and holes or wrong data below WP: firmware persisted the WP before the data.\n   - WP_new < durable_end: flushed data lost, a journal or metadata bug.\n   - Zone Empty though data was durable: lost zone mapping.\n   - Zone Full without Finish or capacity reached: bad recovery rule.\n5. **Repeat** at many cut points (random, at zone boundaries, at Finish, at Reset) and plot WP_loss = submitted_end - WP_new.\n- **With PLP:** power-loss protection should flush volatile data, so completed writes are expected to survive. Any loss is a bug, and the rollback window shrinks to in-flight commands.","pitfall":"Comparing WP_new to the last completed write instead of the last durable point. Completed does not mean durable when a volatile cache is on.","verify":"The durability and WP-rollback rules the ZNS spec and NVM Command Set give for unexpected power loss, and how PLP is declared.","follow":[{"q":"How do you make the cut reproducible?","a":"Use a programmable power switch or the drive's power-fail injection and trigger on a command count or timer, logging exact command IDs and submit times. Use FUA on marker writes so the durable lower bound is known."},{"q":"What if WP_new is below durable_end on only one zone?","a":"Check whether that zone was mid-Finish or mid-Reset at the cut, which are metadata-heavy operations, and reproduce that specific sequence."}],"mod":3},{"id":"3.16","level":"Principal","type":"Scenario","fig":null,"tags":["read-only","offline","media-fault","fault-injection","triage"],"q":"During an endurance run a few zones go Read Only. How do you root-cause it, and how do you design a test for that behavior?","short":"Read Only means the controller stopped accepting writes to the zone, typically after NAND program or erase failures or lost redundancy, while data stays readable. Record when each zone changed, correlate with the SMART and health log and vendor logs, copy the data out, then send Offline Zone. For validation, inject NAND faults on chosen blocks and assert the exact state, status and resource behavior.","deep":"1. **Detect:** a write failing with Zone Is Read Only (BAh), a Zone Descriptor Changed asynchronous event (module 6), or periodic reports. The host cannot trust the WP field, so use its own record of the last completed write.\n2. **Evidence:** timestamp of first appearance, Percentage Used and Available Spare, Media and Data Integrity Errors, Critical Warning bit 3 (media in read-only mode, namespace-wide, a related but different signal), and the vendor NAND log (bad blocks, die, program-fail counts).\n3. **Causes:** program or erase failure with no spare left for the zone's stripe, wear-out, an injected fault left active, or a firmware bug that latched the state wrongly.\n4. **Validate the behavior:**\n   - Only zones mapped to the faulted block change state.\n   - Writes fail with Zone Is Read Only, Reset fails with Invalid Zone State Transition, reads below the last completed write still match.\n   - The open and active counts drop, since Read Only zones are neither.\n   - Offline Zone moves it to Offline, then reads fail with Zone Is Offline.\n5. **Host side:** evacuate valid data, mark the zone dead in the allocator and adjust capacity accounting.","pitfall":"Expecting the WP field to say how much survives in a Read Only zone. It is invalid there, so the host must keep its own bookkeeping.","verify":"Critical Warning bit 3 meaning in the NVMe Base Specification, and which log (Changed Zone List or asynchronous event) reports the change on your device.","follow":[{"q":"Can Reset Zone bring the space back?","a":"No, it fails with Invalid Zone State Transition. Only a vendor mechanism or reformat may recover the space (check the spec and vendor documents)."},{"q":"How do you know how much valid data a Read Only zone holds when WP is invalid?","a":"From the host's own record (the shadow model's last completed write), and by reading until the device returns the unwritten value."}],"mod":3},{"id":"3.17","level":"Principal","type":"Concept","fig":null,"tags":["coverage","state-machine","test-plan","fault-injection","automation"],"q":"How would you build a coverage plan for the zone state machine, and how do you reach the states that cannot be entered by commands alone?","short":"Enumerate (state x action) cells with an expected status and post-state for each: 7 states and 9 actions (Write, Append, Open, Close, Finish, Reset, Offline, Set Descriptor Extension, Read) give 63 cells, and about 190 test points once you add resource-limit variants. Reach the ordinary states with commands. Reach Read Only, Offline and controller-finished Full only with fault injection or vendor hooks, and record them as gaps if unavailable.","deep":"| Target state | How to reach it |\n|---|---|\n| Empty | Reset Zone, or a fresh Format |\n| Implicit Open | write one block to an Empty zone |\n| Explicit Open | Open Zone |\n| Closed with data | write, then Close Zone |\n| Closed, WP = ZSLBA | Open Zone, then Close Zone |\n| Full | write to ZCAP, or Finish Zone |\n| Read Only, Offline, Full by ZFC | fault injection or vendor command only |\n\n- **Size:** 7 x 9 = 63 cells. Repeating each under three resource conditions (below limits, at open limit, at active limit) gives 189 test points. Generate them from a table.\n- **Sequences:** cover single transitions first (0-switch), then consecutive pairs (1-switch), for example Closed to Implicit Open to Full.\n- **Edge writes:** end a write exactly at ZCAP, one block short, and one block over.\n- **Random walks:** run the shadow model (3.14) with seeded random commands, biased toward edges and limits, and log the seed.\n- **Metric:** count distinct (state, action, result) tuples hit. Publish the holes, and mark Read Only and Offline cells as \"needs injection\" instead of dropping them.\n- **Tooling:** nvme-cli `nvme zns` subcommands with JSON output, or SPDK and xNVMe for high queue depth.","pitfall":"Covering success paths only. Roughly half the matrix is rejected actions, and each must be checked for exact status and no side effects. Confirmed against ZNS 1.4 (Figure 40, 3.4.3.1): six state-changing Zone Send Actions exist (Close, Finish, Open, Reset, Offline, Set Zone Descriptor Extension), plus Flush Explicit ZRWA Range (module 11), which does not by itself change zone state. The 9-action matrix above also folds in Write, Zone Append and Read as non-Zone-Management-Send operations that still drive the state machine.","verify":null,"follow":[{"q":"The drive ships with no Offline zones. How do you cover Offline?","a":"Use a vendor fault or a factory-offline namespace. If neither exists, record it as an explicit coverage gap with an owner, not a silent skip."},{"q":"What is 1-switch coverage?","a":"Coverage of every sequence of two consecutive transitions, not only each single transition."}],"mod":3},{"id":"4.01","level":"Basic","type":"Concept","fig":null,"tags":["zone-mgmt-send","zsa","opcode","select-all"],"q":"What does Zone Management Send do, and which actions does it carry?","short":"Zone Management Send (opcode 79h) changes the state of a zone. CDW10-11 carry the SLBA, which must be the first LBA of the target zone. CDW13 carries the Zone Send Action (ZSA) in bits 7:0 and the Select All bit in bit 8. The actions are Close 01h, Finish 02h, Open 03h, Reset 04h, Offline 05h and Set Zone Descriptor Extension 10h. Only Set Zone Descriptor Extension moves data.","deep":"It is an I/O command of the Zoned Namespace Command Set, so it goes to an I/O queue with a valid NSID. The controller answers with a normal CQE, and the host tracks the new state by sending a Zone Management Receive afterwards.\n\n| ZSA | Action | Short effect |\n|---|---|---|\n| 01h | Close Zone | Open (implicit or explicit) to Closed |\n| 02h | Finish Zone | Empty, Open or Closed to Full |\n| 03h | Open Zone | Empty, Implicitly Open or Closed to Explicitly Open |\n| 04h | Reset Zone | Open, Closed or Full to Empty, WP back to start |\n| 05h | Offline Zone | Read Only to Offline |\n| 10h | Set Zone Descriptor Extension | Empty to Closed, attaches extension data |\n| 11h | Flush Explicit ZRWA | Commits ZRWA contents up to an LBA (see the ZRWA module) |\n\n- **SLBA rule:** for the state actions it must equal a zone's start LBA. A value inside a zone gives Invalid Field in Command. Flush is the exception, because its SLBA names the LBA to flush up to.\n- **Select All:** bit 8 makes the command act on every eligible zone and ignores SLBA (see the Select All question).\n- **Action Specific option:** bit 9 of CDW13 is used by Open to ask for a ZRWA. It belongs to the ZRWA module.\n- **Who uses what:** Linux issues Open, Close, Finish and Reset from the block layer, and uses Select All only for Reset-all.","pitfall":"Passing any LBA inside the zone and assuming the controller will round down. It rejects it. Confirmed against ZNS 1.4, Figure 40 and 3.4.3: ZSA 11h is Flush Explicit ZRWA Range, CDW13 bit 9 (ZSASO) is ZRWAA (ZRWA Allocation) for Open Zone and Set Zone Descriptor Extension, and a misaligned SLBA (not a zone start, action not Flush, Select All clear) gives Invalid Field in Command.","verify":null,"follow":[{"q":"Why does the SLBA have to be a zone start?","a":"The action applies to a whole zone. A mid-zone address is ambiguous, so the controller rejects it rather than rounding."},{"q":"Is Zone Management Send an admin command?","a":"No. It is an I/O command. Do not confuse it with nvme-cli's admin passthrough wording."}],"mod":4},{"id":"4.02","level":"Basic","type":"Concept","fig":null,"tags":["zone-mgmt-recv","report-zones","zra","zrasf","partial"],"q":"What does Zone Management Receive do, and how is a Report Zones command built?","short":"Zone Management Receive (opcode 7Ah) returns zone information to a host buffer. CDW10-11 hold the SLBA, CDW12 holds NDW (Number of Dwords, the buffer size in dwords, zero-based), and CDW13 holds the Zone Receive Action ZRA (bits 7:0, 00h Report Zones, 01h Extended Report Zones), the action specific field ZRAS (bits 15:8, the state filter) and the Partial Report bit ZRASPF (bit 16). The buffer is a 64-byte header followed by 64-byte descriptors.","deep":"- **Header:** the first 8 bytes are the Number of Zones. The remaining 56 bytes are reserved.\n- **Descriptors:** one 64-byte zone descriptor per reported zone, in ascending LBA order. Extended Report Zones appends the zone descriptor extension (ZDES bytes) to every descriptor.\n- **SLBA:** the report starts at the zone that contains SLBA (confirmed: ZNS 1.4, 3.4.2.1.1 reports zones whose ZSLBA is at or above the ZSLBA of the zone containing the given SLBA), so a host may pass any LBA in the target zone, not only its start.\n- **NDW:** a 4 KiB buffer is NDW = 1023 (4096 / 4 - 1). The buffer must fit the header, so 64 bytes is the smallest useful size. Also observe MDTS.\n- **Filter (ZRAS):** 00h reports every zone, 01h to 07h select by state (details in the descriptor question).\n- **Partial Report:** it changes what the header count means (see the batching question). Linux always sets it.\n- **No side effects:** the command changes no zone state.\n```\n/* what Linux sends for one chunk */\nopcode = 0x7a; nsid = N; slba = zone_start;\nndw = bytes/4 - 1; zra = 0; zras = 0; partial = 1;\n```","pitfall":"Setting NDW to the byte count instead of dwords minus one. The controller then reports a buffer four times too large, or you overrun your own allocation. Confirmed against ZNS 1.4, 3.4.2.1.1: SLBA may point inside a zone (the report starts at that zone). ZRA values 02h to FFh are reserved (3.4.2, Figure 35).","verify":null,"follow":[{"q":"What happens if the buffer holds fewer descriptors than zones match?","a":"The controller fills what fits. The host repeats from the next zone. See the batching question."},{"q":"Which value in the header do you trust?","a":"Number of Zones, interpreted according to the Partial Report bit you sent."}],"mod":4},{"id":"4.03","level":"Basic","type":"Concept","fig":null,"tags":["reset-zone","erase","write-pointer","empty"],"q":"What does Reset Zone do, and how is it different from an erase or a TRIM?","short":"Reset Zone (ZSA 04h) takes an Open, Closed or Full zone to Empty and moves the write pointer back to the zone's start LBA. The old data is logically gone, and the host may write the zone again from the start. It is a logical operation. The controller decides when the NAND blocks are actually erased. Unlike TRIM it is exact and whole-zone, and it is the only way to reuse a zone.","deep":"- **Result:** state Empty, WP = ZSLBA, the zone's open and active resources released, and the data treated as unwritten.\n- **Reset of an Empty zone:** a successful no-op. Reset of a Read Only or Offline zone fails with Invalid Zone State Transition.\n- **Not TRIM:** a deallocate hint may be ignored and leaves the zone's state alone, so the FTL still has to garbage-collect. Reset is a mandatory, whole-zone state change, so the device knows every block in the zone is dead and can erase without moving any data.\n- **Not an immediate erase:** the controller may return success before the NAND blocks are erased, as long as the zone now behaves as Empty. Latency therefore depends on the implementation and how much data the zone held.\n- **CQE feedback:** bit 0 of completion dword 0 is Zone Capacity Changed (ZCC), reporting whether the zone capacity changed for namespaces with variable zone capacity.\n- **Host consequence:** the write amplification of a zoned workload is decided by how often the host resets live data, not by device-side GC.","pitfall":"Assuming a reset that returned success has erased flash. The zone is logically Empty, and the erase may still be queued. Confirmed against ZNS 1.4, 3.4.3.1.5 and 3.4.3.2: Reset clears ZDEV, FZR, RZR, ZFC and ZRWAV, and bit 0 of completion dword 0 (ZCC, Zone Capacity Changed) is set only when the Variable Zone Capacity bit is 1 and the capacity actually changed.","verify":null,"follow":[{"q":"Can Reset be used as a secure erase?","a":"No. See the trap question on Reset and stale data. Use Sanitize or a crypto erase for that."},{"q":"Why is Reset on an Empty zone not an error?","a":"Idempotent actions succeed when the zone is already in the target state. That lets hosts retry safely after an unknown outcome."}],"mod":4},{"id":"4.04","level":"Intermediate","type":"Concept","fig":null,"tags":["finish-zone","full","write-pointer","resources"],"q":"What does Finish Zone do, and why would a host use it?","short":"Finish Zone (ZSA 02h) moves an Empty, Open or Closed zone to Full without writing the rest of the zone. The write pointer is no longer valid, no more writes or appends are accepted, and the zone's open and active resources are released. The unwritten LBAs between the old write pointer and the zone capacity keep their unwritten status. Finish on a Full zone succeeds as a no-op. On Read Only or Offline it fails.","deep":"- **Why finish:** the active zone limit (MAR) is small, so a host that has stopped filling a zone but does not want to wait for capacity to run out must Finish it to free an active slot. Databases and filesystems do this for partially filled zones.\n- **Empty to Full:** legal. The zone becomes Full with no data, useful to retire a zone on purpose.\n- **WP:** the Full-state WP is not meaningful. Linux computes start + length itself for Full zones. Do not read data expecting a value there.\n- **Cost:** the controller must close out the open NAND stripe, flush buffered writes, and may have to pad the last partially programmed page or wordline. The latency is proportional to what is buffered, and it is implementation-specific.\n- **Read of the gap:** the LBAs from the old WP to the zone capacity were never written. Their read data follows the namespace's rule for unwritten blocks, not host data. Never treat them as valid.\n- **Controller-initiated finish:** a controller may finish a zone itself, and then sets the Zone Finished by Controller attribute. It may also set Finish Zone Recommended to ask the host to do it.","pitfall":"Reading Finish as \"fill the zone with zeros\". The gap is never written, and its content is not host data.","verify":"The value returned when reading LBAs between the old WP and the end of capacity after Finish; the names and timing of the Finish/Reset Recommended limits and attribute bits (FZR, RZR, ZFC) in the ZNS Identify Namespace.","follow":[{"q":"Does Finish free the capacity of the zone?","a":"No. Only Reset does. A Full zone still holds its data and only its resources are freed."},{"q":"Is a Finish on a Full zone an error?","a":"No, it is a successful no-op."}],"mod":4},{"id":"4.05","level":"Intermediate","type":"Concept","fig":null,"tags":["state-machine","transitions","matrix","invalid-zone-state-transition"],"q":"For each zone management action, which source states are legal and what does the zone become?","short":"Open works from Empty, Implicitly Open and Closed. Close works from Implicitly and Explicitly Open. Finish works from Empty, Open and Closed. Reset works from Open, Closed and Full. Offline works only from Read Only. Repeating an action on a zone already in its target state succeeds. Every other combination fails with Invalid Zone State Transition, and Read Only and Offline zones accept almost nothing.","deep":"| Source state | Open | Close | Finish | Reset | Offline |\n|---|---|---|---|---|---|\n| Empty | Exp Open | error | Full | no-op | error |\n| Implicitly Open | Exp Open | Closed | Full | Empty | error |\n| Explicitly Open | no-op | Closed | Full | Empty | error |\n| Closed | Exp Open | no-op | Full | Empty | error |\n| Full | error | error | no-op | Empty | error |\n| Read Only | error | error | error | error | Offline |\n| Offline | error | error | error | error | no-op |\n\n- **Pattern 1:** an action is idempotent on its target state (Open on Explicitly Open, Close on Closed, Finish on Full, Reset on Empty, Offline on Offline).\n- **Pattern 2:** Read Only takes only Offline. Offline takes nothing. These are terminal states from the host's view.\n- **Pattern 3:** Reset is the only way out of Full. Open and Close never touch a Full zone.\n- **Resources:** Open from Empty needs both an active and an open slot, and from Closed needs an open slot. It can fail with Too Many Active Zones or Too Many Open Zones instead of a transition error. Set Zone Descriptor Extension is covered in its own question.\n- **Validator tip:** encode this table once as data, and use it as the oracle for every test.","pitfall":"Learning the matrix from Linux behavior. Linux never issues most of these on its own, so the kernel will not show you the error cases. Confirmed against ZNS 1.4, 3.4.3.1.1 to 3.4.3.1.6: every cell above matches, including Close on Empty (Invalid Zone State Transition), Open on Full (Invalid Zone State Transition), and Reset and Finish both failing on Read Only and Offline zones.","verify":null,"follow":[{"q":"Is Close on an Empty zone an error?","a":"Yes. The ZNS spec text I retrieved lists Close on Empty, Full, Read Only and Offline as Invalid Zone State Transition, and QEMU agrees. Some SMR standards treat it as a no-op, so do not port that oracle."},{"q":"What state does Open on an Implicitly Open zone give?","a":"Explicitly Open, with no resource change."}],"mod":4},{"id":"4.06","level":"Intermediate","type":"Concept","fig":null,"tags":["select-all","bulk","reset-all"],"q":"What does the Select All bit do, and which zones does each action touch?","short":"With Select All set (CDW13 bit 8), the controller applies the action to every zone in the action's source states and ignores SLBA. Open acts on Closed zones, Close on Open zones, Finish on Open and Closed zones, Reset on Open, Closed and Full zones, and Offline on Read Only zones. Zones in other states are skipped and are not an error. Set Zone Descriptor Extension does not accept Select All.","deep":"| Action | Zones affected by Select All |\n|---|---|\n| Open | Closed |\n| Close | Implicitly Open, Explicitly Open |\n| Finish | Implicitly Open, Explicitly Open, Closed |\n| Reset | Implicitly Open, Explicitly Open, Closed, Full |\n| Offline | Read Only |\n\n- **Skip, not fail:** Empty zones for Reset, Full zones for Finish, and so on are ignored. A Select All on a namespace with no eligible zone still succeeds.\n- **Empty is never selected:** Open-all does not open Empty zones, which would burn active resources. Finish-all does not fill the empty zones.\n- **Resources:** Open-all is limited by the open and active limits.\n- **Cost:** Reset-all is one command but one erase per eligible zone. It is the longest-running zone command by far (see the Reset-all numeric question).\n- **Atomicity on resource shortage:** confirmed by ZNS 1.4, 2.1.1.4: if there are insufficient Active, Open or ZRWA resources for the requested transitions, the command is aborted and no zone state transition occurs at all, for that command. So a resource-limited Open-all fails cleanly with none of the target zones changed, not with some already opened.\n- **Linux:** the block layer sets Select All only for a Reset-all request. Open-all, Close-all and Finish-all are sent as individual zone commands.","pitfall":"Expecting Select All to fail when a zone is in the wrong state. It silently skips those zones, so success does not mean every zone changed. Do not assume the reverse either: a resource-shortage failure is all-or-nothing by spec, not partial.","verify":null,"follow":[{"q":"What is in the SLBA field with Select All?","a":"It is ignored, so the host normally sends 0."},{"q":"What does a Reset-all do to zones that are Read Only?","a":"Nothing. They are skipped and stay Read Only."}],"mod":4},{"id":"4.07","level":"Intermediate","type":"Concept","fig":null,"tags":["nvme-cli","blkzone","passthru","tools"],"q":"How do you issue and read zone management commands from nvme-cli and Linux?","short":"nvme-cli has a zns plugin: nvme zns report-zones, open-zone, close-zone, finish-zone, reset-zone, offline-zone, set-zone-desc, zone-mgmt-send and zone-mgmt-recv. The state commands take -s for the zone start LBA and -a for Select All. blkzone from util-linux drives the kernel zoned block layer with report, reset, open, close and finish. For raw control, nvme io-passthru with opcode 0x79 or 0x7a lets you build any CDW13, including illegal ones.","deep":"```\nnvme zns id-ns /dev/nvme0n1                     # zone size, MAR, MOR, ZDES\nnvme zns report-zones /dev/nvme0n1 -s 0 -d 8    # first 8 zones\nnvme zns open-zone   /dev/nvme0n1 -s 0x100000\nnvme zns close-zone  /dev/nvme0n1 -s 0x100000\nnvme zns finish-zone /dev/nvme0n1 -s 0x100000\nnvme zns reset-zone  /dev/nvme0n1 -a            # Select All\nnvme zns zone-mgmt-send /dev/nvme0n1 -s 0x100000 -z 0x04   # any ZSA byte\nblkzone report -o 0 -c 4 /dev/nvme0n1\n```\n- **Illegal commands:** the state commands send what you ask without checking the zone's state. That makes them the right tool to provoke Invalid Zone State Transition.\n- **Raw ZSA:** `zone-mgmt-send -z` accepts any ZSA byte, so reserved values and Select All with Set Zone Descriptor Extension can be tested.\n- **Passthrough:** for example `nvme io-passthru /dev/nvme0n1 --opcode=0x79 --namespace-id=1 --cdw10=0x100000 --cdw13=0x104` builds a Select All Reset.\n- **Kernel path:** blkzone, filesystems and fio go through the block layer, so the kernel's cached view can differ from the device. The nvme-cli plugin talks to the device directly.\n- **Report loop:** nvme-cli's report-zones reads in chunks of up to 1024 descriptors (64 KiB) and continues from the last ZSLBA plus zone size.","pitfall":"Testing illegal transitions through blkzone. The block layer may reject or cache-fix the request before it ever reaches the SSD.","verify":"Exact subcommand names and option letters on your nvme-cli version (nvme zns help, nvme zns report-zones --help), and io-passthru flag names.","follow":[{"q":"Why use nvme-cli instead of blkzone for conformance tests?","a":"It reaches the controller without the kernel's zone state cache or command validation, so illegal actions actually arrive."},{"q":"How do you see the raw status of a failed command?","a":"Read the error nvme-cli prints (status name and code), use nvme io-passthru, or enable the kernel nvme tracepoints, which log the completion status."}],"mod":4},{"id":"4.08","level":"Intermediate","type":"Concept","fig":null,"tags":["zone-descriptor","report-zones","zrasf","write-pointer","attributes"],"q":"How do you decode a zone descriptor from Report Zones, and what do the filter values mean?","short":"A descriptor is 64 bytes. Byte 0 holds the zone type (2h = Sequential Write Required), byte 1 bits 7:4 the zone state, byte 2 the zone attributes. Bytes 8 to 15 are Zone Capacity, 16 to 23 the Zone Start LBA and 24 to 31 the Write Pointer, all in LBAs and little-endian. The ZRAS filter selects zones by state: 00h all, 01h Empty, 02h Implicitly Open, 03h Explicitly Open, 04h Closed, 05h Full, 06h Read Only, 07h Offline.","deep":"State codes in byte 1 (bits 7:4): 1 Empty, 2 Implicitly Open, 3 Explicitly Open, 4 Closed, Dh Read Only, Eh Full, Fh Offline. Attributes in byte 2: bit 0 ZFC (finished by controller), bit 1 FZR (finish recommended), bit 2 RZR (reset recommended), bit 3 ZRWAV, bit 7 ZDEV (extension valid).\n\nWorked decode, with LBA size 4 KiB:\n```\n00: 02 20 00 00 00 00 00 00  00 00 04 00 00 00 00 00\n10: 00 00 10 00 00 00 00 00  00 08 10 00 00 00 00 00\n```\n1. Byte 0 = 02h: Sequential Write Required.\n2. Byte 1 = 20h: state 2, Implicitly Open. Byte 2 = 00h: no attributes.\n3. ZCAP = 0x00040000 = 262,144 LBAs = 1 GiB.\n4. ZSLBA = 0x00100000.\n5. WP = 0x00100800, so 0x800 = 2048 LBAs written (8 MiB), and the next write must start there.\n\n- **WP validity:** the WP is meaningful for Empty, Open and Closed zones. For Full, Read Only and Offline it is not (QEMU returns all ones, and Linux substitutes start + length for Full).\n- **Filter caveat:** confirmed against ZNS 1.4, Figure 35: 05h = Full and 06h = Read Only, matching libnvme, SPDK and QEMU. Linux nvme.h names 05h Read Only and 06h Full (swapped, as of the source I read), and the Linux nvmet target filters with that enum. The Linux host only ever sends 00h, so only a target or a validator that sends 05h or 06h sees the difference.","pitfall":"Reading the state from the whole byte. The state is the top nibble, so Implicitly Open shows up as 20h, not 02h.","verify":"Whether the Linux nvme.h and nvmet swap of 05h/06h against the ZNS 1.4 table (confirmed correct at 05h=Full, 06h=Read Only) still applies on the kernel under test, and the WP byte contents actually returned for Full, Read Only and Offline zones on your device (the spec only says the field is invalid, not what value appears).","follow":[{"q":"Does ZCAP change with the zone state?","a":"Not normally. For namespaces with variable capacity it can change on a Reset."},{"q":"Why can ZSLBA plus ZCAP be less than the next zone's start?","a":"Zone size can exceed zone capacity. The LBAs in between exist but are not usable."}],"mod":4},{"id":"4.09","level":"Advanced","type":"Debug","fig":null,"tags":["status-codes","cqe","invalid-zone-state-transition","dnr","too-many-open"],"q":"A Reset Zone completes with a CQE status field of 0x837F (dword 3 bits 31:16). Decode it and say what it tells you about the zone.","short":"Bit 0 is the phase tag (1). SC = 0xBF (bits 8:1), SCT = 1 (bits 11:9, command specific), CRD = 0, More = 0 and DNR = 1 (bit 15). That is Invalid Zone State Transition with Do Not Retry. For Reset it means the zone was Read Only or Offline, since every other state can be reset. Read the descriptor with Report Zones to see which, then look for a media or firmware event that put it there.","deep":"Decode of the 16-bit status field 0x837F (the upper half of CQE dword 3, with the command ID in the lower half):\n| Bits | Field | Value |\n|---|---|---|\n| 0 | Phase tag | 1 |\n| 8:1 | Status Code | 0xBF |\n| 11:9 | Status Code Type | 1 (command specific) |\n| 13:12 | CRD | 0 |\n| 14 | More | 0 |\n| 15 | DNR | 1 |\n\nThe zone specific status codes (SCT 1) are BFh Invalid Zone State Transition, BDh Too Many Active Zones and BEh Too Many Open Zones. The I/O status codes B8h to BCh belong to reads and writes (see the Errors module).\n\nRelated failures to tell apart:\n- **Invalid Field in Command (SCT 0, SC 02h):** SLBA not at a zone start, a reserved ZSA or ZRA, or Select All with Set Zone Descriptor Extension.\n- **LBA Out of Range (SCT 0, SC 80h):** SLBA beyond the namespace.\n- **Too Many Active/Open Zones:** the transition itself was legal, but a resource limit blocked it (Open and Set Zone Descriptor Extension).\n\nTriage of the 0xBF: (1) Report the zone and check ZS. (2) If it is Read Only or Offline, this is not a bad host command. Check the SMART/health log and vendor logs for a media event. (3) If it is in any other state, a Reset must succeed, so the device is wrong. Capture the CQE, the report and a trace.\nLinux turns this status into BLK_STS_IOERR, which appears as a plain I/O error, and the too-many statuses get their own block status.","pitfall":"Reading 0x837F as a generic command failure, or reading it as all of dword 3. SCT 1 plus SC BFh names the exact reason, and it narrows the zone's state to two possibilities for Reset. Confirmed against ZNS 1.4, Figure 11: BDh Too Many Active Zones, BEh Too Many Open Zones, BFh Invalid Zone State Transition (matching Linux include/linux/nvme.h at 0x1bd to 0x1bf). VERIFY: whether the controller must set DNR for Invalid Zone State Transition is a NVMe Base Specification question (ZNS 1.4 does not itself mandate DNR).","verify":null,"follow":[{"q":"Why is DNR set?","a":"The command cannot succeed until the zone state changes, so retrying does the same thing. A host that retries in a loop is wrong."},{"q":"What would Finish return on the same zone?","a":"The same Invalid Zone State Transition, since Read Only takes only Offline."}],"mod":4},{"id":"4.10","level":"Advanced","type":"Debug","fig":null,"tags":["state-machine","sequence","prediction","select-all","oracle"],"q":"Given six zones in known states and a command sequence, predict every completion status and the final states.","short":"Walk each command against the legal-transition table. Illegal transitions fail with Invalid Zone State Transition and change nothing, idempotent actions succeed without change, and Select All skips zones outside its source set. Here the result is: six commands succeed, five fail, and at the end zones 0 to 4 are Empty and zone 5 is Offline.","deep":"Start: Z0 Empty, Z1 Implicitly Open, Z2 Explicitly Open, Z3 Closed, Z4 Full, Z5 Read Only. Resource limits are large enough not to matter.\n\n| Step | Command | Result | State afterwards |\n|---|---|---|---|\n| 1 | Close Z0 | Invalid Zone State Transition | Z0 Empty |\n| 2 | Finish Z0 | Success | Z0 Full |\n| 3 | Open Z4 | Invalid Zone State Transition | Z4 Full |\n| 4 | Reset Z4 | Success | Z4 Empty, WP = ZSLBA |\n| 5 | Offline Z4 | Invalid Zone State Transition | Z4 Empty |\n| 6 | Open Z1 | Success | Z1 Explicitly Open |\n| 7 | Close, Select All | Success | Z1, Z2 Closed. Z3 (already Closed), Z0 (Full), Z4 (Empty), Z5 skipped |\n| 8 | Finish Z5 | Invalid Zone State Transition | Z5 Read Only |\n| 9 | Reset, Select All | Success | Z0, Z1, Z2, Z3 Empty. Z5 skipped |\n| 10 | Offline Z5 | Success | Z5 Offline |\n| 11 | Reset Z5 | Invalid Zone State Transition | Z5 Offline |\n\n- **Write pointers:** the table tracks state only. In a real test, read the WP after each step: Reset returns it to ZSLBA, Finish makes it invalid, and Close and Open leave it alone.\n- **Step 7:** Close-all must not touch Full or Empty zones. A device that returns an error here is wrong.\n- **Step 9:** it must leave Z5 alone, and the command still succeeds.\n- **Use as a test:** encode the table as a model, run random sequences, and diff status and Report Zones after every command.","pitfall":"Predicting Select All by looking only at the zone the SLBA points to. The SLBA is ignored, and every eligible zone changes. Confirmed against ZNS 1.4: step 1 (Close on Empty, 3.4.3.1.1 c) and step 3 (Open on Full, 3.4.3.1.4 c) both give Invalid Zone State Transition, as predicted.","verify":null,"follow":[{"q":"Which extra step would test idempotency?","a":"Repeat step 10 (Offline on an Offline zone). It must succeed with no change."},{"q":"How would you catch a device that fails Select All half way?","a":"Compare the Report Zones state of every zone to the model after each bulk command."}],"mod":4},{"id":"4.11","level":"Advanced","type":"Numeric","fig":null,"tags":["report-zones","batching","mdts","numd","partial-report"],"q":"How many Report Zones commands are needed to read all zones of a namespace with 65,536 zones, and how do you loop safely?","short":"Assume MDTS allows 512 KiB per command. The 64-byte header leaves (524,288 - 64) / 64 = 8,191 descriptors per command, so 65,536 zones need 9 commands (about 4 MiB in total). With Extended Report Zones and a 64-byte extension each entry is 128 bytes, giving 4,095 per command and 17 commands. The loop restarts each time from the last returned ZSLBA plus the zone size.","deep":"Assumptions: 65,536 zones (for example 16 TiB with 256 MiB zones), MDTS = 512 KiB, no filter.\n1. NDW (CDW12, Number of Dwords) for 512 KiB = 524,288 / 4 - 1 = 131,071 (0x1FFFF).\n2. Descriptors per command = (524,288 - 64) / 64 = 8,191.\n3. Commands = ceil(65,536 / 8,191) = 9.\n4. Data = 65,536 x 64 B = 4 MiB, plus 9 headers.\n5. Extended, ZDES = 64 B: entry = 128 B, (524,288 - 64) / 128 = 4,095 per command, ceil(65,536 / 4,095) = 17 commands.\n6. nvme-cli uses 1,024 descriptors (64 KiB) per command, which is 64 commands.\n\nHeader count: with Partial Report = 1 the Number of Zones is how many descriptors were written into your buffer. With Partial Report = 0 it is how many zones match the filter starting from SLBA, which can exceed what fits.\n\nLoop rules:\n- Next SLBA = last returned ZSLBA + zone size (from Identify), not + zone capacity.\n- Stop when the returned count is zero or SLBA reaches the namespace size.\n- With a filter, zones are not contiguous, but the same rule still works because the report only lists zones at or after SLBA.\n- The report is not a snapshot. Zones can change between batches (see the Zone Descriptor Changed event in the resources module), so re-report suspect zones.","pitfall":"Advancing by ZCAP. When capacity is smaller than the zone size, the loop lands inside a zone and either skips or repeats one. Confirmed against ZNS 1.4, 3.4.2.2.1 and 3.4.2.1.1: with Partial Report 0, Number of Zones is the count matching the filter from SLBA onward (which can exceed the buffer); with Partial Report 1, it is the count of complete descriptors actually transferred. A Report Zones SLBA is accepted anywhere inside a zone.","verify":null,"follow":[{"q":"Why not one big buffer?","a":"MDTS limits the transfer, and a large physically contiguous buffer is harder to allocate."},{"q":"How do you get the zone count without reading every descriptor?","a":"Send one Report Zones with Partial Report = 0 and only a header-sized buffer, and read Number of Zones."}],"mod":4},{"id":"4.12","level":"Advanced","type":"Trap","fig":null,"tags":["reset-zone","dlfeat","secure-erase","stale-data","read"],"q":"After Reset Zone, a test reads the zone and expects zeros. It passes on drive A and fails on drive B. Is drive B broken?","short":"Not necessarily. Reset makes the zone Empty and its data logically unwritten, but it does not say what a read returns, and it is not a secure erase. The read data for unwritten blocks is set by the namespace's deallocated or unwritten block behavior (DLFEAT in Identify Namespace: zeroes, all ones, or not reported). A validator must check DLFEAT, and fail only on old host data or on a leak of another zone's data.","deep":"- **What Reset promises:** state Empty, WP = ZSLBA, and old host data no longer returned as valid data.\n- **What it does not promise:** zeros, or that the flash was erased. The NAND may hold the old data until the next erase, and other copies may exist in buffers or overwritten but not yet erased blocks.\n- **How to test correctly:**\n  1. Read DLFEAT from Identify Namespace. If it says zeroes, expect zeroes. If it says all ones, expect all ones. If it does not report a value, expect only that data is not the old data.\n  2. Stamp every LBA with a generation number and the zone ID before the Reset. After Reset, read every LBA and assert that no old stamp appears.\n  3. With protection information, check that the read either errors as unwritten or returns consistent protection data.\n- **What is a real bug:** stale host data after Reset (a security bug), data from another zone (a mapping bug), a hang, or a zone that reports Empty but rejects the first write at ZSLBA.\n- **Secure erase:** use Sanitize, or a Format NVM with a secure erase setting, and verify it separately. Reset is not part of that.","pitfall":"Hard-coding \"reset then read returns zeros\" in a test. It passes on one controller and fails on another for a valid reason.","verify":"DLFEAT Read Behavior encodings (001b zeroes, 010b all bytes FFh) and whether ZNS reads of Empty-zone LBAs follow DLFEAT or return an error, in the NVM Command Set and ZNS specifications.","follow":[{"q":"Should the read of an Empty zone succeed at all?","a":"Reads of unwritten LBAs within the zone are governed by the read rules in the Errors module, so cross-check both."},{"q":"How does this show up as a customer bug?","a":"A reused zone returning the previous tenant's data. That is a data confidentiality failure."}],"mod":4},{"id":"4.13","level":"Advanced","type":"Concept","fig":null,"tags":["set-zone-descriptor-extension","zdes","zdev","extended-report"],"q":"What is the Set Zone Descriptor Extension action for, and what are its rules?","short":"Set Zone Descriptor Extension (ZSA 10h) attaches host-defined metadata to a zone. It is legal only on an Empty zone. The host sends a buffer of ZDES bytes, the zone moves from Empty to Closed, and the Zone Descriptor Extension Valid attribute is set. Extended Report Zones returns the bytes after each descriptor. Because Empty to Closed takes an active zone slot, it can fail with Too Many Active Zones, and Select All is not allowed.","deep":"- **Size:** ZDES comes from the ZNS Identify Namespace, per LBA format, in units of 64 bytes. nvme-cli computes bytes as ZDES shifted left by 6. A ZDES of zero means the namespace has no extensions, so the command is invalid.\n- **State effect:** Empty to Closed. It uses an active resource (not an open one), so the host can run out of active zones with no data written.\n- **Legality:** any state other than Empty gives Invalid Zone State Transition. Select All is invalid. To change an extension, Reset the zone and set it again.\n- **Reading it back:** ZDEV (attribute bit 7) is visible in a normal Report Zones. The bytes come only with ZRA = 01h Extended Report Zones, where each descriptor is followed by ZDES x 64 bytes.\n- **Uses:** a filesystem or ZNS-aware database tags a zone with its owner, generation or stream, so recovery after a crash can rebuild its map from the device.\n- **Test ideas:** set a random pattern and read it back byte for byte, set on a non-Empty zone, set on a zone when the active limit is reached, set with a wrong length, Reset and check ZDEV clears, and check whether the extension survives a power cycle.","pitfall":"Setting extensions on many Empty zones ahead of time. Each one takes an active slot, and a host can hit the active limit before writing a byte. Confirmed against ZNS 1.4, 5.3 and 3.4.3.1.5: the extension stays associated (and ZDEV set) until the zone transitions to Empty or Offline, so it survives a power cycle that leaves the zone Closed or Full; Reset explicitly clears ZDEV and drops the association. A ZDES of 0h makes Set Zone Descriptor Extension abort with Invalid Field in Command (2.1.1.4/4.1.5.1).","verify":null,"follow":[{"q":"Does Set Zone Descriptor Extension count as writing to the zone?","a":"No. It writes no zone data and leaves WP alone. It still leaves the zone Closed."},{"q":"How does an Empty zone with an extension differ from one without?","a":"It is Closed, not Empty, so it counts as an active zone."}],"mod":4},{"id":"4.14","level":"Principal","type":"Numeric","fig":null,"tags":["reset-all","latency","timeout","nand-erase","parallelism"],"q":"Estimate how long a Reset-all takes on a full namespace, and when does it trigger a host timeout?","short":"Assume 512 MiB zones, 16 MiB NAND blocks, 16 dies and a 10 ms block erase. A zone is 32 blocks, or 2 per die, so one full zone resets in about 20 ms if every die is free. Reset-all is bounded by aggregate erase throughput, not by command count: 1,000 zones take about 20 s and 4,096 zones about 82 s. With Linux's 30 s I/O timeout, a large Reset-all on a synchronous-erase design can time out the controller.","deep":"Assumptions (all illustrative): zone capacity 512 MiB, erase unit 16 MiB per die, 16 dies, tBERS = 10 ms, erase not overlapped with other work, zones striped evenly over all dies.\n1. Blocks per zone = 512 / 16 = 32.\n2. Blocks per die per zone = 32 / 16 = 2, so one zone takes 2 x 10 ms = 20 ms.\n3. N full zones: N x 32 x 10 ms / 16 dies = N x 20 ms (all dies busy).\n4. N = 1,000: 20 s. N = 4,096 (2 TiB of zones): 81.9 s. N = 8,192 (4 TiB): 163.8 s.\n5. Linux default nvme_core.io_timeout is 30 s, so anything above about 1,500 full zones (30 s / 20 ms) exceeds it.\n\nReality check:\n- **Deferral:** a controller that only unmaps and erases in the background answers in microseconds. Then the cost moves to the next write and shows up as a write stall or a throughput dip.\n- **Multi-plane erase and erase suspend** change tBERS and the effective rate. Partially filled zones erase fewer blocks, and Empty zones cost nothing.\n- **Host side:** raise the I/O timeout for lab tools, or reset zones individually with a bounded queue depth, and time each.","pitfall":"Timing a Reset-all on a mostly empty device and extrapolating. Latency scales with the data present, so test with full zones.","verify":"The Linux default I/O timeout on your kernel (nvme_core.io_timeout), and whether your controller erases synchronously or defers.","follow":[{"q":"What is the validation metric?","a":"Reset latency versus zone fill level and versus parallel resets, and the write throughput in the minute after a reset storm."},{"q":"Why does the timeout matter?","a":"A timed-out Reset-all makes the driver abort and reset the controller, which turns a slow command into an outage and can hide the real cause."}],"mod":4},{"id":"4.15","level":"Principal","type":"Cross-layer","fig":null,"tags":["reset","ftl","power-loss","fault-injection","latency","stale-data"],"q":"How would you validate the firmware side of Reset Zone: latency, background erase and power-loss behavior?","short":"Treat Reset as a small transaction across the host state, the FTL mapping and the NAND. Measure completion latency by zone fill and concurrency. Run write and read workloads on other zones during resets to look for tail latency and starvation. Cut power at many points inside a reset and check after recovery that the zone is either fully Empty or fully intact, and that no old data ever reads back. Compare against the design's promises.","deep":"1. **Latency profile:** reset zones filled to 0, 25, 50, 100 percent, at queue depth 1 and at depth N, and record the distribution, not the mean. An Empty zone should be near free. A large jump above 100 percent fill points to synchronous erase.\n2. **Interference:** run steady random reads and sequential writes on other zones while resetting. Look for read tail latency and write stalls. Compare against the same run with no resets to quantify the impact.\n3. **Deferred erase backlog:** issue a Reset storm, then write to the reset zones at once. If free erased blocks run out, writes stall. Record how long the recovery takes.\n4. **Reuse correctness:** after each reset, write a new generation pattern and read it all. Any old generation is a bug (stale mapping or an unerased block).\n5. **Power loss:** inject power loss at points: command received, mapping updated, erase issued, erase half done, completion sent, and just after. After boot, Report Zones must show Empty (WP = ZSLBA) or the old state with all old data readable. For every reset whose CQE the host had already received, the zone must be Empty after recovery.\n6. **Other events:** thermal throttling during a reset, and a controller reset issued in the middle of a Reset. Record what the design promises for each.\n7. **Observability:** read vendor logs or telemetry for erase counts and the blocks in the free pool, and for PE-cycle wear after thousands of Reset cycles.\n\nDecision criteria to agree with the firmware team: a latency ceiling per fill level, the allowed state after power loss (which of \"old\" or \"Empty\" is acceptable, never half), and a maximum write stall after a reset storm.","pitfall":"Checking only the CQE. The bugs live in what a later read or a later write returns, so every reset test needs a read-back and a write-back.","verify":"What the ZNS specification and the product requirements say about the state of a zone after power loss during Reset, since atomicity may be vendor-defined.","follow":[{"q":"How do you inject power loss at a precise point?","a":"Use firmware debug hooks or a test build that halts at labelled points, or a programmable power switch triggered by a trace event."},{"q":"What is the worst reset bug?","a":"A zone that reports Empty but reads back a previous tenant's data."}],"mod":4},{"id":"4.16","level":"Principal","type":"Scenario","fig":null,"tags":["conformance","test-design","oracle","fault-injection","read-only","offline"],"q":"Design a conformance test suite for the zone management commands. How do you cover the state machine, reach Read Only and Offline zones, and decide it is enough?","short":"Build an executable model of zone state, write pointers, attributes and resource counts, and drive the device and the model with the same commands. Cover every source state times every action, single and Select All, plus bad-field cases. Reach Read Only and Offline through fault injection or vendor commands. After every command compare the CQE status and a full Report Zones against the model, and repeat around power cycles and under concurrent I/O.","deep":"1. **Model:** per zone: state, WP, capacity, attributes, extension. Namespace: open and active counts against MOR and MAR. The transition table in this module is its core.\n2. **Matrix:** 6 actions x 7 states for single-zone commands (42 cells), 5 Select All actions over mixed populations, and each cell checked for the exact SCT/SC and for no side effects on other zones.\n3. **Field cases:** SLBA inside a zone, at the last LBA of the namespace, past it, reserved ZSA and ZRA values, Select All with Set Zone Descriptor Extension, a wrong data length for Set Zone Descriptor Extension, and NDW too small.\n4. **Reaching Read Only and Offline:** they need media faults. Use an emulator (QEMU ZNS) for the model itself, and on real hardware use a vendor fault-injection command or NAND error injection. If neither exists, record the two rows as not covered instead of skipping them silently.\n5. **Resources:** fill up to MOR and MAR, then Open, Set Zone Descriptor Extension and implicit open by write. Check the exact errors and that a failed Open leaves no half-open state.\n6. **Sequences:** random command sequences (seeded, logged) with a diff against the model after each step, and shrink a failing sequence to a minimal one.\n7. **Environment:** repeat after power cycles (open zones are expected to come back Closed, or Empty if nothing was written) and after controller resets and shutdowns (record what the drive does, VERIFY), and with concurrent reads, writes and appends to other zones.\n8. **Data:** write patterns with a stamp, so Finish and Reset are checked by what a later read returns.\n\nDone means: every cell hit at least once with pass or a recorded waiver, no unexplained model diffs across a long randomized soak, and the injection and power-loss tests repeated across firmware builds.","pitfall":"Testing only single-zone commands with the happy states. Most escapes are in Select All side effects, resource edge cases and the Read Only and Offline rows.","verify":"The state after NVM Subsystem Reset, shutdown and Controller Level Reset for Open zones (Closed or Empty) and the per-state behavior in the ZNS specification, and confirm the model's transition table against the spec figures before using it as an oracle.","follow":[{"q":"Model and device disagree. Who is right?","a":"Neither by default. Check the specification text, decide, and record it as a model bug, a device bug or a spec ambiguity to raise with the vendor."},{"q":"How does this run in CI?","a":"The model and matrix run against QEMU or an emulator on every change, and a smaller smoke set plus randomized soak runs on real drives nightly."}],"mod":4},{"id":"5.01","level":"Basic","type":"Concept","fig":"append","tags":["append","concurrency","write-pointer"],"q":"What is Zone Append and why was it added to ZNS?","short":"Zone Append writes data to a zone without the host naming the address. The host gives the zone start LBA and a length, the controller places the data at the current write pointer, advances it, and returns the chosen LBA in the completion entry. It exists so a host can keep many writes to one zone in flight without any of them failing because a peer got to the write pointer first.","deep":"A Write must carry SLBA equal to the write pointer at the moment it executes. NVMe does not promise that commands execute in submission order (certainly not across queues), so with two or more Writes in flight to one zone a reordered command finds the write pointer moved and fails. Without append the host has two choices: queue depth 1 per zone, which is latency bound, or host-side ordering (one submitter, locks, zone write plugging), which costs CPU and parallelism.\n\nZone Append moves the serialization point into the controller, which already owns the write pointer:\n- The host submits any number of appends to the same zone, from any queue or thread, with no coordination.\n- The controller allocates each command a contiguous range at the write pointer, in whatever order it processes them.\n- Each completion entry returns the Assigned LBA (ALBA). The host records it in its index.\n- The price: the host no longer picks the address before submitting, so anything that needed the address up front (PI reference tags, replica placement, self-referencing pointers) has to change. See 5.11 and 5.15.\n\nZone Append is an optional command in the ZNS command set. A host discovers support from the Commands Supported and Effects log page, and the Linux NVMe driver forces a ZNS namespace read-only if append is missing.","pitfall":"Describing Append as \"write anywhere in the zone\". It always lands at the write pointer, and the host learns where only from the completion.","verify":null,"follow":[{"q":"Does Append make a zone randomly writable?","a":"No. Data still lands sequentially at the write pointer. Only the host's control of the address is gone."},{"q":"Is one append faster than one Write?","a":"Not per command. The gain is that many appends can be outstanding to one zone at once."}],"mod":5},{"id":"5.02","level":"Basic","type":"Concept","fig":null,"tags":["command","cdw","alba","cqe"],"q":"What are the fields of a Zone Append command, and where does the result come back?","short":"Opcode 7Dh, using the read/write command layout: the zone start LBA (ZSLBA) in CDW10-11, a zero-based NLB in the low half of CDW12, plus the usual data pointer and PI fields. The controller returns the Assigned LBA, the lowest LBA holding the data, as a 64-bit value in completion DW0 (low) and DW1 (high). A ZSLBA that is not the first LBA of a zone fails with Invalid Field in Command.","deep":"| Field | Location | Meaning |\n|---|---|---|\n| Opcode | CDW0 | 7Dh (Zone Management Send is 79h, Receive is 7Ah) |\n| NSID | CDW1 | Zoned namespace |\n| ZSLBA | CDW10, CDW11 | Lowest LBA of the target zone, not the write address |\n| NLB | CDW12 bits 15:0 | Number of blocks, zero-based |\n| PRINFO, FUA, LR, PIREMAP | CDW12 upper half | PI actions and write flags (see 5.11) |\n| ILBRT | CDW14 | Initial logical block reference tag |\n| LBAT, LBATM | CDW15 | Application tag and mask |\n| ALBA | CQE DW0 and DW1 | Result: assigned LBA |\n\n- **64-bit result:** most I/O completions leave DW1 reserved, so a driver has to be written to read both dwords for this opcode.\n- **Passthrough:** in Linux use the 64-bit ioctl (`NVME_IOCTL_IO64_CMD`); the 32-bit passthrough returns only DW0. `nvme zns zone-append` shows the assigned LBA in verbose mode (`-v`).\n- **Errors:** when the status is not success, the result field carries no valid ALBA. Do not consume it.\n- **Data transfer:** PRP or SGL and the metadata pointer work as for Write, subject to ZASL (5.04).\n- **CDW12 bits:** LR is bit 31, FUA bit 30, PRINFO bits 29:26, PIREMAP bit 25, STC bit 24, DTYPE bits 23:20, CETYPE bits 19:16, NLB bits 15:00 (ZNS 1.4, Figure 26).\n- **Reference tag fields:** the Initial Logical Block Reference Tag and Storage Tag are split: the upper bits are CDW2/3 bits 47:00 (LBTU) and the lower 32 bits are CDW14 (LBTL) (Figure 24, Figure 29). CDW15 holds LBATM (31:16) and LBAT (15:00) (Figure 30).","pitfall":"Reading only DW0. It works on small test namespaces and silently truncates once the ALBA passes 2^32.","verify":null,"follow":[{"q":"What goes in the LBA field when appending to zone 7?","a":"The first LBA of zone 7 (its ZSLBA), never a mid-zone LBA."},{"q":"How does a sector-based OS see the result?","a":"Linux converts the returned LBA to a sector and stores it in the completed request, so the bio's start sector becomes the assigned location."}],"mod":5},{"id":"5.03","level":"Basic","type":"Trap","fig":null,"tags":["write","ordering","zone-invalid-write"],"q":"Can I keep several Writes outstanding to one zone if I submit them in LBA order?","short":"Only by relying on behaviour the spec does not promise. A Write needs SLBA equal to the write pointer when it executes, and NVMe does not guarantee execution in submission order, certainly not across queues. A reordered Write finds the write pointer somewhere other than its SLBA and fails with Zone Invalid Write (SCT 1h, SC BCh). Use QD 1 per zone, host-side serialization, or Zone Append.","deep":"Example: the write pointer is 100 and the host submits W1 (LBA 100, 8 blocks) then W2 (LBA 108, 8 blocks). If the controller runs W2 first, W2's SLBA 108 does not equal the write pointer 100, so W2 fails with Zone Invalid Write and writes nothing. W1 then succeeds. The host must now resubmit W2, and any error handler that marks the zone bad turns a benign race into an outage.\n\n**Why labs miss it:** one submission queue, one core and a controller that fetches and executes in order make overlapping Writes work every time. Add a second queue, a firmware change or a busier controller and the failure appears at a low rate.\n\n| Strategy | Writes in flight per zone | Cost |\n|---|---|---|\n| QD 1 per zone | 1 | Latency-bound per zone; needs several open zones to fill bandwidth |\n| Host serialization (single owner, zone write plugging) | Effectively 1 at the device | CPU, locks, lost parallelism |\n| Zone Append | Many | Host loses address control (5.11, 5.15) |\n\nNote the other write-side status codes: a Write to a Full zone returns Zone Is Full (B9h), a Write past the zone capacity returns Zone Boundary Error (B8h). Zone Invalid Write is specifically the SLBA versus write pointer mismatch.","pitfall":"Passing a single-queue in-order test and concluding that overlapping Writes are safe.","verify":"That the Base Specification gives no execution-order guarantee even within one submission queue, and that a failed Write leaves the write pointer unchanged.","follow":[{"q":"Does a Zone Invalid Write damage the zone?","a":"No. The failed Write places no data and leaves the write pointer where it was."},{"q":"Does Linux let you issue overlapping Writes to a zone?","a":"The block layer serializes writes per zone (zone write plugging), so ordinary filesystem writes do not hit this, but raw passthrough does."}],"mod":5},{"id":"5.04","level":"Intermediate","type":"Concept","fig":null,"tags":["zasl","mdts","limits","identify"],"q":"What is ZASL and how does it limit Zone Append?","short":"Zone Append Size Limit is a one-byte field in the ZNS-specific Identify Controller structure (CNS 06h with CSI 02h). It is a power of two in units of the minimum memory page size: maximum append = 2^ZASL x 2^(12+CAP.MPSMIN) bytes. Zero means the limit is MDTS. An append larger than the limit fails with Invalid Field in Command, and unlike a Write it cannot be split without losing contiguity.","deep":"1. Read it with `nvme zns id-ctrl /dev/nvme0` (the field is reported as zasl).\n2. With MPSMIN = 0 (4 KiB pages): ZASL 0 means use MDTS, 1 is 8 KiB, 3 is 32 KiB, 5 is 128 KiB, 7 is 512 KiB.\n3. With 4 KiB LBAs, ZASL 5 allows 32 blocks, so NLB (zero-based) is at most 31.\n4. Linux computes the append limit in 512-byte sectors as `1 << (zasl + 3)` (assumes 4 KiB pages) and falls back to the transfer limit when ZASL is 0. A target such as the Linux nvmet reports the smaller of MDTS and the append limit.\n5. ZASL is a one-byte field in the ZNS-specific Identify Controller structure; the spec states it \"includes the length of metadata if metadata is interleaved with the stored logical block data\" (ZNS 1.4, 4.1.5.2), so interleaved metadata counts against the limit. Separate (non-interleaved) metadata buffers are not addressed by this wording.\n\n**Why splitting matters:** a large Write can be cut into ordered chunks and the result is one contiguous range. A large append cut into several appends comes back as several ALBAs, which need not be adjacent when other appends interleave. A record bigger than ZASL therefore needs extent-based indexing, or serialization of its chunks (submit the next after the previous CQE), or a Write path.\n\n**Validator cases:** append exactly ZASL bytes (expect success), one block more (expect Invalid Field in Command), and check that MDTS is not the bound you observe. Confirm the limit again after any firmware update or format change to a different LBA size.","pitfall":"Sizing appends by MDTS. The append limit can be far smaller, and exceeding it fails the whole command.","verify":"That an over-limit append returns Invalid Field in Command (base NVMe transfer-size behavior, not restated in the ZNS spec), and how ZASL is treated with a separate, non-interleaved metadata buffer.","follow":[{"q":"MDTS is 512 KiB and ZASL is 4. What is the largest append?","a":"64 KiB (2^4 x 4 KiB with MPSMIN 0). The smaller limit governs appends."},{"q":"What does ZASL = 0 tell you?","a":"No separate append limit is declared, so MDTS applies."}],"mod":5},{"id":"5.05","level":"Intermediate","type":"Concept","fig":null,"tags":["ordering","atomicity","alba","completion"],"q":"What ordering and placement guarantees does Zone Append give, and what does it not give?","short":"Guaranteed: each command's data lands as one contiguous range at the write pointer, ranges from different appends never overlap, and the ALBA reports where. Not guaranteed: that ranges follow submission order, that completions arrive in ALBA order, or that a multi-block append is atomic across power loss. Concurrent appends land in whatever order the controller serialized them, so the host must trust the ALBA and nothing else.","deep":"- **Per-zone serialization:** the controller allocates ranges one at a time (the ALBA of a command is the write pointer at allocation). Data transfer and media programming can overlap after that.\n- **Submission order:** no promise across queues, and none within one queue.\n- **Completion order:** CQEs can come back in any order relative to ALBA order.\n\nExample, three 4-block appends to an empty zone starting at 1000h:\n\n| Command | Submitted | Assigned ALBA | CQE arrives |\n|---|---|---|---|\n| A | 1st | 1008h | 3rd |\n| B | 2nd | 1000h | 1st |\n| C | 3rd | 1004h | 2nd |\n\nWhen all three complete, the write pointer is 100Ch.\n- **Read after append:** read the data only after the CQE, at the ALBA from that CQE.\n- **Atomicity:** power-fail write atomicity in NVMe is governed by AWUPF and NAWUPF, not by Zone Append. A multi-block append larger than the atomic size can be torn by power loss (see 5.13).\n- **Across zones:** no interaction. Ordering and allocation are per zone.","pitfall":"Deriving an ordering rule from QD 1 tests, where ALBA order trivially equals submission order. Confirmed: the ZNS spec states explicitly that the AWUN, NAWUN, NABSN, AWUPF, NAWUPF and NABSPF atomicity parameters apply to Zone Append exactly as defined in the NVM Command Set Specification (ZNS 1.4, 3.4.1); the command gets no atomicity guarantee beyond those.","verify":null,"follow":[{"q":"A is submitted before B. Can B get the lower ALBA?","a":"Yes, whenever there is any concurrency. Only waiting for A's CQE before submitting B makes the order deterministic."},{"q":"Is the ALBA the first or the last block?","a":"The first: the lowest LBA holding the data of that command. The data occupies ALBA through ALBA + NLB."}],"mod":5},{"id":"5.06","level":"Intermediate","type":"Concept","fig":null,"tags":["status","boundary","zone-state","implicit-open"],"q":"How do zone state and zone capacity affect Zone Append, and what status does each failure produce?","short":"Append is accepted in Empty, Implicitly Open, Explicitly Open and Closed zones. Empty and Closed zones open implicitly first, subject to the open and active limits. Full returns Zone Is Full, Read Only returns Zone Is Read Only, Offline returns Zone Is Offline. An append that would run past the zone capacity fails whole with Zone Boundary Error, and a ZSLBA that is not a zone start fails with Invalid Field.","deep":"| Condition | Result |\n|---|---|\n| Empty or Closed zone | Accepted; zone becomes Implicitly Open (if resources allow) |\n| Implicitly or Explicitly Open | Accepted; state kept |\n| Would pass zone capacity | Zone Boundary Error (SCT 1h, SC B8h), nothing written |\n| Full zone | Zone Is Full (B9h) |\n| Read Only or Offline zone | Zone Is Read Only (BAh), Zone Is Offline (BBh) |\n| Implicit open would exceed the open limit | Too Many Open Zones (BEh) |\n| Would exceed the active limit | Too Many Active Zones (BDh) |\n| ZSLBA not a zone start, or size above ZASL | Invalid Field in Command |\n| ZSLBA beyond the namespace | LBA Out of Range |\n\n- **All or nothing:** an append that does not fit fails completely. A smaller append issued afterwards can still succeed, so the zone tail is only discovered by trial.\n- **Filling exactly:** an append that ends exactly at the zone capacity succeeds and moves the zone to Full. This is the off-by-one to test.\n- **Concurrency consequence:** with several appends in flight the host cannot know the remaining space, so Zone Boundary Error is the ordinary \"zone filled\" signal. The host reacts by opening a new zone, not by treating it as a fault.\n- **Capacity versus size:** zone capacity can be smaller than zone size, and LBAs between them are never writable.","pitfall":"Retrying a Zone Boundary Error append on the same zone. It fails again at that size, so allocate a new zone or split the record. Confirmed (ZNS 1.4, 2.1.1.2.1.1 and 2.1.1.3.1): an append that starts in range but would run past the zone capacity gets Zone Boundary Error, and no implicit-open side effect occurs, since the Empty-to-Implicitly-Opened transition requires a write operation to actually write one or more logical blocks, which a boundary failure never does.","verify":null,"fol
