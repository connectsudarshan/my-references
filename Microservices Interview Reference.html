TOPICS.push(

// ============ INTERVIEW TOOLKIT ============
{
id:'anti-patterns', cat:'int', name:'Anti-Patterns & Common Pitfalls',
alias:'Mistakes that give you all the cost of microservices and none of the benefits.',
simple:`Splitting a house into separate flats only helps if each flat has its own kitchen and door. If everyone still shares one kitchen and must walk through each other's rooms, you've just built a very awkward house. That is a "distributed monolith".`,
intent:`<p>Interviewers often ask "what can go wrong?". Knowing anti-patterns shows real experience.</p>`,
table:{head:['Anti-pattern','Symptom','Fix'],rows:[
  ['Distributed monolith','Services must be deployed together; one change touches 5 services','Re-draw boundaries by business capability; merge chatty services; async events'],
  ['Shared database','Many services read/write the same tables; schema change breaks others','Database per service; APIs/events; CDC during migration'],
  ['Chatty services','One page makes 50 sync calls; high latency','Coarser APIs, aggregation (BFF/GraphQL), caching, local data copies via events'],
  ['Nano-services','Hundreds of tiny services, each a few functions; huge ops overhead','Merge into meaningful bounded contexts'],
  ['Sync call chains','A→B→C→D→E; one slow service stalls all','Async messaging, timeouts, circuit breakers, fewer hops'],
  ['No observability','Nobody can tell where a request failed','Correlation IDs, tracing, centralised logs, RED metrics from day one'],
  ['Shared libraries with business logic','Updating a common lib forces all services to redeploy','Share only technical utilities; duplicate small logic rather than couple'],
  ['Big-bang migration','Multi-year rewrite with frozen features','Strangler Fig, incremental extraction'],
  ['Ignoring data consistency','Lost or duplicated orders after failures','Saga, Outbox, idempotent consumers'],
  ['Microservices first','Startup with 3 devs and 25 services','Modular monolith first; extract when needed'],
]},
lang:'', code:'',
examples:[
  {title:'Segment\'s move back to a monolith', body:'Segment split its event destinations into 140+ microservices, one per integration. Shared-library changes and operational load became overwhelming, so they merged them back into one service ("Goodbye Microservices", 2018) and improved productivity.'},
  {title:'Amazon Prime Video monitoring', body:'In 2023 the Prime Video team published how moving a video-quality monitoring pipeline from distributed serverless components to a single process cut infrastructure cost by about 90%. Right-sizing matters.'},
  {title:'Shared "customers" table', body:'A retailer\'s five services all used one customers table. Adding a mandatory column for GDPR consent broke three services in production, a classic hidden coupling through the database.'}
],
useWhen:['Reviewing a design; answering "what challenges did you face?"'],
avoidWhen:['Dismissing monoliths entirely; a well-structured monolith is a valid, often better, choice'],
qa:[
  {q:'What is a distributed monolith?', a:`<p>A system split into services that are still tightly coupled (shared DB, synchronous chains, lock-step releases). It has the network complexity of microservices plus the coupling of a monolith: the worst of both worlds.</p>`},
  {q:'What challenges did you face with microservices? (behavioural)', a:`<p>Structure it with STAR: e.g. <i>Situation</i>: checkout latency spikes. <i>Task</i>: find root cause across 8 services. <i>Action</i>: added OpenTelemetry tracing, found a synchronous chain to a slow pricing service, added caching and a circuit breaker, moved non-critical calls to async events. <i>Result</i>: p99 went from 2.1 s to 450 ms. Real numbers make answers memorable.</p>`},
  {q:'Should microservices share code?', a:`<p>Share technical, stable utilities (logging setup, tracing, auth client) as versioned libraries. Avoid sharing domain/business logic or data models, because it couples release cycles. Some duplication is an acceptable price for independence ("prefer duplication over the wrong abstraction").</p>`}
]
},

{
id:'system-design', cat:'int', name:'Design Walkthrough: E-Commerce Order Platform',
alias:'Putting everything together, the way you would answer a system design interview question.',
simple:`This is the "final exam" page. We design an Amazon/Flipkart-like order flow step by step and point to each pattern you learned: gateway, services, database per service, events, saga, outbox, cache, circuit breakers, tracing and autoscaling.`,
intent:`<p><b>How to answer any microservices design question (framework):</b></p>
<p><b>1. Clarify requirements</b> – functional (browse, cart, checkout, pay, track) and non-functional (e.g. 10k orders/min at peak, 99.95% availability, p99 &lt; 500 ms, payments must never double-charge). <b>2. Identify services</b> by bounded context. <b>3. Choose communication</b> – sync for queries that need an answer now, async events for everything else. <b>4. Data</b> – database per service, pick stores. <b>5. Consistency</b> – saga for checkout, outbox for events, idempotency for payments. <b>6. Resilience</b> – timeouts, retries, circuit breakers, bulkheads. <b>7. Scale</b> – stateless + HPA, caching, CQRS read models. <b>8. Security & observability</b>. <b>9. Trade-offs</b> – always say what you gave up.</p>`,
how:['Client calls POST /checkout through the API Gateway (JWT validated, rate limited).','Order Service creates the order as PENDING in PostgreSQL and writes OrderCreated to the outbox in the same transaction. Returns 202 Accepted + order ID.','The outbox relay publishes OrderCreated to Kafka. The Checkout Saga orchestrator starts.','Saga asks Inventory to reserve stock (Redis-backed counters with DB as source of truth).','Saga asks Payment to charge, using the order ID as idempotency key; Payment calls the external gateway behind a circuit breaker.','On success: Order → CONFIRMED, event OrderConfirmed. Shipping, Notification and Analytics consume it independently.','On failure at any step: compensations run (release stock, refund), Order → CANCELLED, user notified.','Order history page is served by a CQRS read model built from order, payment and shipping events.'],
diagram:`                 [Web / Mobile]
                       |
          [CDN]   [API Gateway]  auth · rate limit · TLS
                   /    |     \\
          [Catalog]  [Cart]  [Order Svc]----(PostgreSQL + outbox)
          Mongo+ES   Redis        |
                                  v  outbox relay / Debezium
                         ===== KAFKA (orders, payments, shipments) =====
                          |            |             |            |
                [Saga Orchestrator] [Notification] [Analytics] [Order History
                   |        |                                   read model]
             [Inventory] [Payment]--circuit breaker-->[External Payment Gateway]
               MySQL      PostgreSQL
  Cross-cutting: Kubernetes + HPA · Istio mTLS · OpenTelemetry → Jaeger · Prometheus/Grafana · ELK`,
lang:'', code:'',
table:{head:['Decision','Choice','Why / trade-off'],rows:[
  ['Checkout call','Async (202 Accepted) + status polling/websocket','Survives spikes; user sees "processing" briefly'],
  ['Consistency','Orchestrated saga','Clear flow and compensation; orchestrator must be HA'],
  ['Payment safety','Idempotency key = order ID','Retries never double-charge'],
  ['Events','Transactional outbox → Kafka','No lost events; consumers must be idempotent'],
  ['Inventory','Strongly consistent reservation','Avoid overselling; small latency cost'],
  ['Catalog/search','Cache + Elasticsearch read model','Fast reads; data may lag a few seconds'],
  ['Failures','Timeouts, retries w/ jitter, breakers, bulkheads','Contain failures; fallback UX needed'],
]},
examples:[
  {title:'Flash sale spike', body:'Traffic jumps 20x. Gateway rate limits bots, Catalog is served from CDN/cache, checkout requests queue in Kafka, and HPA scales Order and Payment. Orders complete a bit slower instead of the site crashing.'},
  {title:'Payment provider outage', body:'The external gateway starts timing out. The circuit breaker opens; the saga keeps orders PENDING_PAYMENT and retries later, or offers another provider. Browsing and cart continue normally.'},
  {title:'Duplicate message', body:'Kafka redelivers PaymentCompleted after a consumer restart. The Order service sees the event ID in processed_events and ignores it; the customer gets one confirmation email, not two.'}
],
useWhen:['Any "design X using microservices" interview question: reuse this structure'],
avoidWhen:['Jumping into boxes and arrows before clarifying requirements and scale','Presenting a design without stating trade-offs'],
qa:[
  {q:'Design a food delivery system with microservices (outline).', a:`<p>Services: User, Restaurant/Menu, Cart, Order, Payment, Delivery/Dispatch (rider matching), Location (live GPS in Redis geo), Notification, Rating. Gateway + mobile BFF. Order saga (order → payment → restaurant accept → assign rider). Kafka for events; WebSockets for live tracking; ETA service; CQRS for order history; autoscaling at lunch/dinner peaks; circuit breakers for payment and maps APIs.</p>`},
  {q:'How do you prevent overselling the last item?', a:`<p>Keep inventory reservation strongly consistent in the Inventory service: atomic conditional update (<code>UPDATE stock SET qty = qty - 1 WHERE sku = ? AND qty &gt;= 1</code>) or Redis DECR with a check, reserve with a TTL during checkout, confirm on payment, release on failure/timeout via saga compensation.</p>`},
  {q:'Why return 202 Accepted for checkout?', a:`<p>The order is accepted and will be processed asynchronously through the saga. It decouples the user request from slow downstream steps (payment, inventory), absorbs spikes, and the client can poll <code>/orders/{id}</code> or receive a push/websocket update.</p>`}
]
},

{
id:'cheat-sheet', cat:'int', name:'Pattern Cheat Sheet: Problem → Solution',
alias:'A one-page map from the problem the interviewer describes to the pattern you should name.',
simple:`When an interviewer describes a pain, they are usually fishing for a pattern name. This table is your quick lookup before the interview.`,

table:{head:['Problem','Pattern / Tool','One-line reason'],rows:[
  ['Clients need one entry point, auth, rate limits','API Gateway','Centralises cross-cutting concerns'],
  ['Mobile and web need different data shapes','Backend for Frontend (BFF) / GraphQL','Tailored aggregation per client'],
  ['Service IPs keep changing','Service Discovery (K8s DNS, Eureka, Consul)','Dynamic lookup of healthy instances'],
  ['Transaction across multiple services','Saga (choreography / orchestration)','Local transactions + compensations'],
  ['Save to DB and publish event reliably','Transactional Outbox + CDC','Atomic write, at-least-once publish'],
  ['Messages may arrive twice','Idempotent consumer / Idempotency-Key','Duplicates have no extra effect'],
  ['Reads and writes need different models','CQRS','Separate, independently scaled models'],
  ['Need full audit history / time travel','Event Sourcing','State = replay of immutable events'],
  ['Join data owned by several services','API Composition / CQRS view','No shared database'],
  ['Dependency is failing, callers pile up','Circuit Breaker + Timeout','Fail fast, fallback, let it recover'],
  ['Transient network errors','Retry with exponential backoff + jitter','Recover without retry storms'],
  ['One slow dependency exhausts threads','Bulkhead','Isolate resource pools'],
  ['Too many requests / abuse','Rate limiting (token bucket)','Protect capacity, fair use'],
  ['Where did the request fail?','Distributed tracing + correlation IDs','End-to-end request view'],
  ['Is the service healthy? Ready for traffic?','Liveness / readiness probes','Auto restart and routing'],
  ['Migrating off a monolith','Strangler Fig + Anti-Corruption Layer','Incremental, low-risk'],
  ['Service-to-service trust','mTLS, service mesh, zero trust','Identity + encryption for every call'],
  ['Consistent retries/mTLS/telemetry in all languages','Service Mesh (sidecar)','Infra concerns out of app code'],
  ['Release safely','Canary / Blue-green + feature flags','Limit blast radius, fast rollback'],
  ['Prevent API breaking changes','Consumer-driven contract tests','Catch breaks in provider CI'],
  ['Slow repeated reads','Cache-aside with Redis','Lower latency and DB load'],
  ['Spiky workloads','Message queue + autoscaling (HPA/KEDA)','Buffer and scale on demand'],
]},
lang:'', code:'',
examples:[
  {title:'"Our checkout sometimes charges twice"', body:'Answer: idempotency keys on the payment API, idempotent consumers with a processed-events table, and the outbox pattern for reliable events.'},
  {title:'"When recommendations are slow, the whole product page is slow"', body:'Answer: timeouts, circuit breaker with a fallback (best sellers), bulkhead for the recommendations call, and possibly loading that widget asynchronously on the client.'},
  {title:'"We can\'t tell why an order failed"', body:'Answer: correlation IDs propagated through HTTP and Kafka headers, OpenTelemetry tracing, structured JSON logs centralised in ELK/Loki, and RED metrics with alerts.'}
],
useWhen:['Last-minute revision before the interview'],
avoidWhen:['Naming a pattern without explaining the trade-off it brings'],
qa:[
  {q:'List the most important microservice design patterns.', a:`<p><b>Decomposition:</b> by business capability, by subdomain, Strangler Fig. <b>Integration:</b> API Gateway, BFF, Aggregator. <b>Data:</b> Database per service, Saga, CQRS, Event Sourcing, Outbox. <b>Resilience:</b> Circuit Breaker, Retry, Bulkhead, Timeout, Rate Limiter. <b>Observability:</b> Log aggregation, Distributed tracing, Health check, Metrics. <b>Cross-cutting:</b> Externalized config, Service discovery, Sidecar/Service mesh. <b>Deployment:</b> Blue-green, Canary.</p>`}
]
},

{
id:'rapid-fire', cat:'int', name:'Rapid-Fire Interview Questions',
alias:'Short, crisp answers to the questions asked most often. Practise saying them out loud.',
simple:`Read each question, answer it aloud in 30 seconds, then open the card to compare. If your answer missed a key word (in bold), revisit that topic page.`,
intent:`<p>These cover the full range from junior to senior. Use the <b>Expand all</b> button for quick reading, or keep them collapsed to quiz yourself.</p>`,
lang:'', code:'', examples:[], useWhen:[], avoidWhen:[],
qa:[
  {q:'What is a microservice architecture?', a:`<p>An approach where an application is a set of <b>small, independently deployable services</b>, each owning a <b>business capability and its own data</b>, communicating via APIs or events.</p>`},
  {q:'Monolith vs microservices, in one sentence each?', a:`<p>Monolith: one codebase and deployable, simple to start, hard to scale teams. Microservices: many independent services, scalable teams and components, but <b>operationally complex</b> and distributed.</p>`},
  {q:'How do microservices communicate?', a:`<p><b>Synchronously</b> (REST, gRPC) when an immediate answer is needed, and <b>asynchronously</b> (Kafka, RabbitMQ, SQS) via events/messages for decoupling and resilience.</p>`},
  {q:'What is an API Gateway?', a:`<p>A <b>single entry point</b> that routes requests and handles auth, rate limiting, TLS, aggregation and logging.</p>`},
  {q:'What is service discovery?', a:`<p>A <b>registry</b> of live service instances so services find each other dynamically (Eureka, Consul, Kubernetes DNS). Client-side or server-side.</p>`},
  {q:'How do you handle distributed transactions?', a:`<p><b>Saga pattern</b> with compensating transactions, plus <b>Outbox</b> and <b>idempotency</b>. Avoid 2PC.</p>`},
  {q:'What is eventual consistency?', a:`<p>Data across services/replicas may be temporarily different but <b>converges</b> once updates propagate.</p>`},
  {q:'What is a circuit breaker?', a:`<p>Stops calling a failing service (<b>Closed → Open → Half-open</b>), fails fast with a fallback, and tests recovery.</p>`},
  {q:'What is CQRS?', a:`<p>Separate <b>write (command)</b> and <b>read (query)</b> models, often with different data stores, synced via events.</p>`},
  {q:'What is Event Sourcing?', a:`<p>Persist <b>every state change as an immutable event</b>; rebuild state by replaying events; snapshots for speed.</p>`},
  {q:'What is idempotency and why does it matter?', a:`<p>Repeating an operation has the <b>same effect as doing it once</b>. Needed because retries and at-least-once delivery cause duplicates.</p>`},
  {q:'What is the difference between orchestration and choreography?', a:`<p>Orchestration: a <b>central coordinator</b> directs steps. Choreography: services <b>react to events</b> with no central controller.</p>`},
  {q:'How do you secure microservices?', a:`<p><b>OAuth2/OIDC + JWT</b> at the gateway, per-service authorization, <b>mTLS</b> between services, secrets manager, network policies, least privilege.</p>`},
  {q:'How do you monitor microservices?', a:`<p>Three pillars: <b>logs</b> (ELK/Loki with correlation IDs), <b>metrics</b> (Prometheus/Grafana, RED, SLOs), <b>traces</b> (OpenTelemetry + Jaeger).</p>`},
  {q:'Why database per service?', a:`<p><b>Loose coupling</b> and independent deployment/scaling; polyglot persistence. Cost: no joins, need sagas/eventual consistency.</p>`},
  {q:'What is a sidecar?', a:`<p>A helper container in the <b>same pod</b> as the app (e.g. Envoy proxy, log shipper) adding capabilities without code changes.</p>`},
  {q:'What is a service mesh?', a:`<p>Sidecar proxies + control plane (Istio, Linkerd) providing <b>mTLS, traffic control, retries and telemetry</b> for service-to-service calls.</p>`},
  {q:'Liveness vs readiness?', a:`<p>Liveness fail → <b>restart</b>. Readiness fail → <b>stop sending traffic</b>.</p>`},
  {q:'Blue-green vs canary?', a:`<p>Blue-green: <b>switch all traffic</b> between two full environments. Canary: <b>gradually shift a small %</b> of traffic while watching metrics.</p>`},
  {q:'What is the Strangler Fig pattern?', a:`<p>Migrate a monolith <b>incrementally</b> by routing features one by one to new services until the old system can be retired.</p>`},
  {q:'What is a bounded context?', a:`<p>A DDD boundary where a model and its terms have <b>one consistent meaning</b>; typically maps to one microservice.</p>`},
  {q:'Kafka vs RabbitMQ?', a:`<p>Kafka: distributed <b>log</b>, high throughput, retention and replay, ordering per partition. RabbitMQ: <b>broker/queue</b> with flexible routing, messages removed after ack.</p>`},
  {q:'What is the CAP theorem?', a:`<p>During a <b>network partition</b>, a distributed system must choose <b>Consistency or Availability</b>.</p>`},
  {q:'How do you version APIs without breaking clients?', a:`<p>Make <b>backward-compatible</b> changes (add optional fields), version via URI or headers for breaking changes, run old and new versions side by side, use <b>contract tests</b>.</p>`},
  {q:'What is a Dead Letter Queue?', a:`<p>A queue for messages that <b>repeatedly fail</b> processing, so they don't block others and can be inspected and replayed.</p>`},
  {q:'How do you handle a slow downstream service?', a:`<p><b>Timeouts</b>, <b>circuit breaker</b> with fallback, <b>bulkhead</b>, caching, and moving the call to <b>async</b> if possible.</p>`},
  {q:'How do you do zero-downtime database migrations?', a:`<p><b>Expand and contract</b>: add new schema compatibly, dual-write, backfill, switch reads, drop old later.</p>`},
  {q:'What is the 12-factor app?', a:`<p>A methodology for cloud-native apps: <b>config in env</b>, stateless processes, logs to stdout, disposability, dev/prod parity, and more.</p>`},
  {q:'What are the biggest drawbacks of microservices?', a:`<p><b>Operational complexity</b>, network latency and failures, <b>data consistency</b>, harder testing/debugging, infrastructure cost, and the need for mature DevOps.</p>`},
  {q:'How do you decide if a feature should be its own service?', a:`<p>Is it a distinct <b>bounded context</b>? Does it need <b>independent scaling or deployment</b>? Can one team own it? Does it have its own data? If it always changes with another service, keep them together.</p>`}
]
}

);
</script>

<script id="ms-extra">
const MS_EXTRA = {"what-are-microservices": {"terms": [["Microservice", "An independently deployable service that owns one business capability and its data, and talks to others only through APIs or events."], ["Independent deployability", "The ability to release one service to production without coordinating a release of any other service. The single best test of whether you really have microservices."], ["Conway's Law", "Organizations design systems that mirror their communication structure, so service boundaries tend to follow team boundaries."], ["Two-pizza team", "Amazon's rule of thumb for a team small enough to be fed by two pizzas; each such team owns a few services end to end."]], "pitfalls": [["Starting a new product with microservices before the domain is understood.", "Start with a well-modularized monolith and extract services once boundaries and scaling needs are clear."], ["Splitting by technical layer (a UI service, a logic service, a data service).", "Split by business capability, so one feature change touches one service."], ["Counting services as a measure of progress.", "Measure deployment frequency, lead time and failure rate; fewer, well-bounded services beat many chatty ones."]], "qa": [{"q": "How do you know a microservices migration is actually working?", "a": "<p>Look at delivery and reliability metrics, not architecture diagrams: deployment frequency per team, lead time from commit to production, change failure rate and time to restore (the four DORA metrics). If teams still coordinate releases, share a database, or need a meeting to change an API, the split has not delivered independence.<\/p><p>Also check cost: cloud spend, on-call load and the number of cross-service incidents. A migration that doubles operational load without faster delivery is not working.<\/p>"}, {"q": "What organizational changes do microservices require?", "a": "<p>Teams must own services end to end (build, run, on-call), because independent deployment only works when the team that changes a service also operates it. That needs platform support (CI/CD templates, observability, service scaffolding) so each team does not rebuild infrastructure, and clear API ownership and versioning rules.<\/p><p>Without the org change you get a distributed monolith: many services, one release train.<\/p>"}]}, "monolith-soa-micro": {"terms": [["Monolith", "One deployable unit containing all modules of the application, usually sharing one database."], ["Modular monolith", "A single deployable with strict internal module boundaries (separate packages, no shared tables, explicit interfaces), often the best starting point."], ["SOA", "Service-Oriented Architecture: enterprise-wide services integrated through a central Enterprise Service Bus that often holds routing and business logic."], ["ESB", "Enterprise Service Bus: middleware that routes, transforms and orchestrates messages between services; the 'smart pipe' that microservices avoid."]], "pitfalls": [["Treating 'monolith' as a synonym for 'legacy mess'.", "A clean modular monolith is a valid, often better, architecture; the problem is poor modularity, not deployment granularity."], ["Re-creating an ESB with a shared gateway full of business rules.", "Keep gateways and brokers dumb (routing, auth, transport) and put business logic in services."], ["Migrating everything at once (big-bang rewrite).", "Extract incrementally with the strangler fig pattern, one capability at a time."]], "qa": [{"q": "Amazon Prime Video moved one system from microservices back to a monolith. What is the lesson?", "a": "<p>Their video-quality monitoring pipeline was built from many serverless functions passing data through storage, and the per-call and data-transfer costs dominated. Merging the stages into one process cut cost sharply.<\/p><p>The lesson is not that microservices are wrong, but that boundaries should follow the cost and coupling of the workload. Components that exchange large amounts of data on every request usually belong in one process.<\/p>"}, {"q": "How would you decide between a modular monolith and microservices for a new product?", "a": "<p>Default to a modular monolith when the team is small, the domain is still changing, and there is no strong independent scaling or compliance need. Choose microservices when several teams need to release independently, parts of the system have very different scaling or reliability needs, or you need technology isolation.<\/p><p>Either way, enforce module boundaries from day one (no cross-module table access), so extracting a service later is a deployment change, not a rewrite.<\/p>"}]}, "principles": {"terms": [["Loose coupling", "Services can change and deploy without changing each other, because they depend only on stable contracts."], ["High cohesion", "Code that changes together lives together, so one business change touches one service."], ["Twelve-Factor App", "A set of 12 practices for cloud-native apps, such as config in the environment, stateless processes and disposability."], ["Disposability", "Processes start fast and shut down gracefully, so they can be scaled, moved or replaced at any time."]], "pitfalls": [["Storing session state in service memory.", "Keep services stateless: put sessions in a shared store (Redis) or in signed tokens."], ["Baking environment-specific config into images.", "Build one image and inject config at deploy time (environment variables, config service, secrets manager)."], ["Ignoring graceful shutdown.", "Handle SIGTERM: stop accepting requests, finish in-flight work and close connections before exiting."]], "qa": [{"q": "What does 'design for failure' mean in practice?", "a": "<p>Assume every network call can be slow, fail or return garbage. Put timeouts on every call, retry only idempotent operations with backoff, add circuit breakers and fallbacks, and make each service degrade gracefully instead of failing completely.<\/p><p>Then prove it: chaos experiments that kill instances or inject latency should cause bounded, visible degradation, not an outage.<\/p>"}, {"q": "How does statelessness help scaling and deployments?", "a": "<p>When no request depends on which instance served the previous one, any instance can handle any request. That lets the platform add or remove instances freely (autoscaling), replace them during rolling deployments without draining user sessions, and restart crashed instances without data loss.<\/p><p>State still exists, it just lives in databases, caches and queues that are designed to be durable and shared.<\/p>"}]}, "ddd": {"terms": [["Bounded context", "A boundary within which a domain model and its language are consistent; the same word (Customer) may mean different things in different contexts."], ["Ubiquitous language", "The shared vocabulary that developers and domain experts use inside one bounded context, reflected directly in code."], ["Aggregate", "A cluster of objects treated as one unit for changes, with a single root that enforces its invariants; the unit of transactional consistency."], ["Context map", "A diagram of bounded contexts and the relationships between them (customer/supplier, conformist, anti-corruption layer)."]], "pitfalls": [["One service per entity (Customer service, Order service, Address service).", "Model around business capabilities and aggregates, not tables; entity services become chatty and tightly coupled."], ["Huge aggregates that lock too much data.", "Keep aggregates small and reference other aggregates by ID; use eventual consistency between them."], ["Letting another system's model leak into yours.", "Use an anti-corruption layer that translates at the boundary."]], "qa": [{"q": "What is the difference between a bounded context and a microservice?", "a": "<p>A bounded context is a modeling boundary: one consistent model and language. A microservice is a deployment boundary. Often one bounded context maps to one service, but a large context can be split into several services for scaling, and a small team may keep several contexts in one deployable.<\/p><p>The rule to keep: a service should not span two bounded contexts, because it would have to reconcile two meanings of the same terms.<\/p>"}, {"q": "How do you run an event storming session to find service boundaries?", "a": "<p>Bring domain experts and engineers together, and put domain events (Order Placed, Payment Captured) on a timeline in orange stickies. Add the commands that cause them, the actors, the policies that react, and the aggregates that handle commands.<\/p><p>Clusters of events and aggregates that share language and change together suggest bounded contexts; places where the language shifts or a hand-off occurs suggest boundaries between services.<\/p>"}]}, "decomposition": {"terms": [["Strangler fig", "Incrementally replacing a monolith by routing individual features to new services until the old system can be removed."], ["Decompose by business capability", "Split services along what the business does (billing, shipping) rather than technical layers."], ["Decompose by subdomain", "Split along DDD subdomains: core (competitive advantage), supporting and generic."], ["Change Data Capture (CDC)", "Streaming row-level changes from a database's transaction log (for example with Debezium) to keep other systems in sync."]], "pitfalls": [["Extracting the service but leaving it on the monolith's database.", "Move data ownership too: give the new service its own schema and sync legacy consumers through events or CDC."], ["Starting with the most central, most coupled module.", "Start with an edge capability that has few dependencies and clear value, to learn the process safely."], ["No way to roll back routing.", "Put a routing layer (gateway or proxy) in front so traffic can switch back to the monolith instantly."]], "qa": [{"q": "Walk through extracting one feature from a monolith safely.", "a": "<p>1. Put a proxy or gateway in front of the monolith. 2. Build the new service behind a feature flag, with its own data store. 3. Sync data: backfill history, then keep it current with CDC or dual reads. 4. Shadow traffic to compare responses without affecting users. 5. Shift a small percentage of real traffic, watch metrics, then ramp up. 6. Make the new service the source of truth and remove the old code and tables.<\/p><p>Each step is reversible until the last one, which is what makes the migration safe.<\/p>"}, {"q": "How do you handle a feature that needs data from both the monolith and the new service during migration?", "a": "<p>Prefer having one side own the data and expose it through an API or events, never both writing the same table. During the transition the new service can call the monolith through an anti-corruption layer, or the monolith can consume events from the new service.<\/p><p>Avoid distributed transactions; use sagas or reconcile asynchronously, and make the temporary coupling explicit so it can be removed later.<\/p>"}]}, "rest-grpc": {"terms": [["REST", "Resource-oriented HTTP APIs using standard verbs (GET, POST, PUT, DELETE), status codes and usually JSON."], ["gRPC", "An RPC framework using HTTP/2 and Protocol Buffers, with generated clients, streaming and deadlines built in."], ["Protocol Buffers", "A compact binary, schema-first serialization format; fields are identified by numbers, which enables backward-compatible evolution."], ["Deadline", "In gRPC, the absolute time by which a call must finish; propagated to downstream calls so the whole chain respects one budget."]], "pitfalls": [["Exposing gRPC directly to browsers.", "Browsers cannot speak native gRPC; use gRPC-Web, a REST or GraphQL gateway, or keep gRPC for internal traffic."], ["Reusing or renumbering protobuf field numbers.", "Never reuse a field number; mark removed fields as reserved."], ["Chatty APIs that need many calls to render one page.", "Design coarse-grained endpoints or add an aggregation layer (BFF)."]], "qa": [{"q": "How do you evolve a gRPC or protobuf API without breaking clients?", "a": "<p>Only make additive changes: add new fields with new numbers, add new RPC methods, and keep old ones until clients migrate. Never change a field's number or type, and mark deleted fields as reserved so they are not reused.<\/p><p>For breaking changes, create a new package version (v2) and run both side by side. Old clients ignore unknown fields, which is what makes additive changes safe.<\/p>"}, {"q": "What is HTTP/2 multiplexing and why does it matter for gRPC?", "a": "<p>HTTP/2 carries many concurrent request and response streams over one TCP connection, interleaving their frames. gRPC relies on it to run many calls and long-lived streams without opening a connection per call.<\/p><p>A side effect is that connection-level (L4) load balancing does not spread load well, because one connection carries all of a client's calls; gRPC needs request-level (L7) load balancing, via a proxy, service mesh or client-side balancing.<\/p>"}]}, "async-messaging": {"terms": [["Message broker", "Middleware that stores and delivers messages between producers and consumers (Kafka, RabbitMQ, SQS)."], ["Topic and partition", "In Kafka, a topic is a named stream split into partitions; order is guaranteed only within a partition."], ["Consumer group", "A set of consumers that share the work of a topic; each partition is read by one consumer in the group."], ["At-least-once delivery", "Every message is delivered one or more times; duplicates are possible, so consumers must be idempotent."]], "pitfalls": [["Assuming messages arrive exactly once and in global order.", "Design idempotent consumers and choose a partition key that orders what really needs ordering (for example the order ID)."], ["Poison messages blocking a queue forever.", "Retry a bounded number of times, then move the message to a dead letter queue and alert."], ["Putting large payloads on the bus.", "Send a reference (URL or ID) to data in object storage, keeping messages small."]], "qa": [{"q": "What is consumer lag and how do you act on it?", "a": "<p>Consumer lag is how far a consumer group is behind the latest offset in each partition. Rising lag means consumers process slower than producers write.<\/p><p>Responses: scale out consumers (up to the number of partitions), increase partitions for future throughput, speed up processing (batching, fewer synchronous calls), and alert on lag in time rather than messages, because '10 minutes behind' is what the business cares about.<\/p>"}, {"q": "Events vs commands: what is the difference?", "a": "<p>A command asks one specific service to do something (ChargePayment) and can be rejected. An event states a fact that already happened (PaymentCharged), is published to anyone interested, and cannot be rejected.<\/p><p>Events give loose coupling because the publisher does not know its consumers; commands make responsibility explicit. Naming reflects this: commands are imperative, events are past tense.<\/p>"}]}, "api-gateway": {"terms": [["API gateway", "A single entry point that routes external requests to services and handles cross-cutting concerns like authentication, rate limiting and TLS."], ["Edge service", "Any component at the boundary between the internet and internal services (gateway, CDN, WAF, load balancer)."], ["Request aggregation", "Combining calls to several services into one response for the client."], ["WAF", "Web Application Firewall: filters malicious HTTP traffic such as SQL injection or bot attacks before it reaches services."]], "pitfalls": [["Putting business logic in the gateway.", "Keep the gateway to routing, auth, limits and translation; business rules belong in services."], ["One gateway team as a bottleneck for every route change.", "Use declarative, self-service route configuration owned by service teams, or per-domain gateways."], ["Gateway timeouts longer than the client's.", "Set gateway timeouts slightly below client timeouts and propagate deadlines downstream."]], "qa": [{"q": "How does authentication typically work at the gateway?", "a": "<p>The gateway validates the incoming credential (usually a JWT from an identity provider): signature, issuer, audience and expiry. It rejects invalid requests early and forwards the verified identity to services, either the original token or a trimmed internal token with the claims services need.<\/p><p>Services still enforce authorization for their own resources, because the gateway cannot know every business rule (zero trust: do not rely only on the perimeter).<\/p>"}, {"q": "How do you scale and operate a gateway for high traffic?", "a": "<p>Run it stateless behind a load balancer across availability zones, autoscale on CPU and connections, and keep shared state (rate-limit counters) in a fast store like Redis.<\/p><p>Put a CDN in front for cacheable content, enable connection reuse to backends, and monitor its own p99 latency and error rate separately from services, since a slow gateway looks like every service being slow.<\/p>"}]}, "bff": {"terms": [["Backend for Frontend (BFF)", "A backend built for one specific client type (web, mobile, partner) that shapes APIs for that client's needs."], ["Over-fetching", "Receiving more data than the client needs, wasting bandwidth, especially on mobile."], ["Under-fetching", "Needing several calls to get enough data for one screen."], ["GraphQL", "A query language that lets clients request exactly the fields they need from a schema, often used as a BFF layer."]], "pitfalls": [["A BFF per client that duplicates business logic.", "Keep BFFs to composition and formatting; put business rules in domain services."], ["One shared 'BFF' that serves every client.", "That is a general gateway again; create a BFF per client experience and let the owning frontend team maintain it."], ["BFF calling services sequentially.", "Fan out calls in parallel with timeouts and partial-response fallbacks."]], "qa": [{"q": "Who should own a BFF?", "a": "<p>The team that owns the frontend it serves. The point of a BFF is that the web team can change the web API shape at the same speed as the web UI, without waiting on a central backend team.<\/p><p>Domain services stay owned by backend teams, and the BFF depends on their stable contracts.<\/p>"}, {"q": "How does a BFF handle a slow or failing downstream service?", "a": "<p>Call downstream services in parallel with per-call timeouts, and design the response so optional parts can be missing: the product page still renders if recommendations time out.<\/p><p>Use circuit breakers and cached fallbacks for non-critical data, and return clear partial-content markers so the client can show placeholders instead of an error page.<\/p>"}]}, "service-discovery": {"terms": [["Service registry", "A database of available service instances and their network locations (Consul, Eureka, etcd, Kubernetes API)."], ["Self-registration", "Each instance registers itself with the registry on start-up and deregisters on shutdown."], ["Third-party registration", "The platform (for example Kubernetes) registers and removes instances automatically."], ["DNS-based discovery", "Resolving a service name to instance addresses via DNS, as Kubernetes Services do."]], "pitfalls": [["Caching resolved addresses forever.", "Respect TTLs and refresh; stale addresses send traffic to terminated instances."], ["Registering instances before they are ready.", "Register or mark ready only after readiness checks pass."], ["Hard-coding hostnames in configuration.", "Use logical service names resolved by discovery."]], "qa": [{"q": "How does service discovery work in Kubernetes?", "a": "<p>A Service object gives a stable virtual IP and DNS name (orders.default.svc.cluster.local). The control plane tracks the pods matching the Service's label selector in EndpointSlices, and kube-proxy (or a CNI like Cilium) routes traffic to the ready pods.<\/p><p>Pods that fail readiness probes are removed from the endpoints automatically, so discovery and health are linked.<\/p>"}, {"q": "What is a headless service and when is it used?", "a": "<p>A Kubernetes Service with no cluster IP (clusterIP: None). DNS returns the individual pod IPs instead of one virtual IP.<\/p><p>It is used when clients need to reach specific pods, for example StatefulSet members of a database cluster (kafka-0, kafka-1), or when the client does its own load balancing, as some gRPC clients do.<\/p>"}]}, "load-balancing": {"terms": [["L4 load balancer", "Balances at the transport layer (TCP or UDP connections) without looking at HTTP content."], ["L7 load balancer", "Balances individual HTTP requests and can route on path, headers or cookies."], ["Least connections", "Sends each new request to the instance with the fewest active connections."], ["Power of two choices", "Pick two instances at random and send to the less loaded one; nearly as good as global least-loaded with far less coordination."]], "pitfalls": [["Round-robin across instances of very different capacity.", "Use weighted or least-connections balancing."], ["Balancing long-lived connections (gRPC, WebSocket) at L4.", "Balance at L7 per request, or periodically recycle connections."], ["No health checks, so dead instances keep receiving traffic.", "Combine active health checks with passive outlier detection (eject instances that return errors)."]], "qa": [{"q": "What is outlier detection?", "a": "<p>Passive health checking: the load balancer watches real responses and temporarily ejects an instance that returns too many errors or is too slow, then gradually lets traffic back.<\/p><p>It catches problems active health checks miss (an instance that passes /health but fails real requests), and is available in Envoy, Istio and many cloud load balancers.<\/p>"}, {"q": "Where does load balancing happen in a typical microservices request?", "a": "<p>Usually at several layers: DNS or anycast spreads traffic across regions, a cloud L4/L7 load balancer spreads it across gateway instances, the gateway or ingress balances to services, and inside the cluster kube-proxy or a sidecar proxy balances between pods.<\/p><p>Each layer needs its own health checks and timeouts, and client-side balancing is common for internal gRPC traffic.<\/p>"}]}, "db-per-service": {"terms": [["Database per service", "Each service owns its data store, and no other service reads or writes it directly."], ["Polyglot persistence", "Choosing different database types per service (relational, document, key-value, search) to fit each workload."], ["API composition", "Answering a query by calling several services and joining the results in memory."], ["Materialized view", "A read-optimized copy of data from several services, kept up to date by consuming their events."]], "pitfalls": [["Reporting jobs that read every service's database directly.", "Feed a data warehouse or lake through events or CDC, and keep service databases private."], ["Foreign keys across service boundaries.", "Reference other services' entities by ID and validate through APIs or events."], ["Splitting the database before splitting the code.", "Separate schemas and ownership first, move to physically separate databases once access patterns are clean."]], "qa": [{"q": "How do you keep reference data (like product names) available to many services?", "a": "<p>Let the owning service publish change events, and have consumers keep a local read-only copy of the fields they need. This avoids a synchronous call on every request and survives the owner being down.<\/p><p>Accept that copies are eventually consistent, and include version numbers or timestamps so consumers ignore out-of-order updates.<\/p>"}, {"q": "What are the operational costs of database per service?", "a": "<p>More databases to provision, back up, patch, monitor and secure; harder cross-service queries and reporting; eventual consistency to handle in code; and more complex local development and testing.<\/p><p>Managed database services, standard templates and a shared data platform for analytics reduce the cost, and a shared database server with separate schemas and credentials is a reasonable middle step.<\/p>"}]}, "saga": {"terms": [["Saga", "A sequence of local transactions across services, where each step publishes an event or command that triggers the next, and failures trigger compensating steps."], ["Compensating transaction", "A business action that semantically undoes an earlier step (refund a payment), not a database rollback."], ["Choreography", "Services react to each other's events with no central coordinator."], ["Orchestration", "A central orchestrator tells each service what to do and tracks the saga's state."]], "pitfalls": [["Forgetting that intermediate states are visible.", "Model explicit states (PENDING, CONFIRMED, CANCELLED) and use semantic locks or checks so other operations do not act on half-finished sagas."], ["Compensations that can fail with no plan.", "Make compensations idempotent and retryable, and route persistent failures to a manual-handling queue."], ["Long choreographed chains nobody can follow.", "Switch to orchestration (for example Temporal or AWS Step Functions) once a flow involves more than a few steps."]], "qa": [{"q": "What is a pivot transaction in a saga?", "a": "<p>The step after which the saga can no longer be compensated and must complete, for example shipping the parcel or sending money to an external bank. Steps before it are compensatable; steps after it must be retryable until they succeed.<\/p><p>Ordering matters: put risky, compensatable checks (reserve stock, authorize payment) before the pivot, and guaranteed-to-succeed steps after it.<\/p>"}, {"q": "How does a workflow engine like Temporal help implement sagas?", "a": "<p>It persists the orchestration state durably, so the workflow code survives crashes and resumes where it stopped. Retries, timeouts and compensation logic are written as ordinary code, and every step is recorded for audit and debugging.<\/p><p>The trade-off is a new piece of infrastructure and the need to write deterministic workflow code, but it removes most hand-rolled state-machine and retry logic.<\/p>"}]}, "cqrs": {"terms": [["CQRS", "Command Query Responsibility Segregation: separate models (and often stores) for writes and for reads."], ["Command model", "The write side, which validates and applies changes while enforcing business rules."], ["Read model / projection", "A denormalized view built for specific queries, updated from write-side events."], ["Projection lag", "The time between a write and its appearance in the read model."]], "pitfalls": [["Applying CQRS to simple CRUD screens.", "Use it only where read and write needs clearly differ; otherwise it adds complexity for no gain."], ["Users not seeing their own change right after saving.", "Return the updated data from the command, read your own writes from the write store, or wait on a version number."], ["No way to rebuild a broken read model.", "Keep events or a change log so projections can be rebuilt from scratch."]], "qa": [{"q": "How do you rebuild or add a new read model in production?", "a": "<p>Create the new projection alongside the old one, replay historical events (or a CDC snapshot plus log) into it, let it catch up with live events, verify counts and samples, then switch queries to it and drop the old one.<\/p><p>This only works if the event history is retained and projections are idempotent, which is why those are design requirements from the start.<\/p>"}, {"q": "How do you choose storage for read models?", "a": "<p>Pick per query pattern: a search engine (Elasticsearch, OpenSearch) for full-text and faceted search, a key-value or document store for 'get by ID' views, a columnar store for analytics, a cache for hot data.<\/p><p>The freedom to choose different stores per view is one of the main benefits of CQRS.<\/p>"}]}, "event-sourcing": {"terms": [["Event sourcing", "Storing the sequence of state-changing events as the source of truth and deriving current state by replaying them."], ["Event store", "An append-only store of events per aggregate stream, with optimistic concurrency on the stream version."], ["Snapshot", "A saved state at some version, so replay starts from the snapshot instead of the first event."], ["Upcasting", "Converting old event versions into the current schema when reading them."]], "pitfalls": [["Changing or deleting past events to fix bugs.", "Events are immutable; append correcting events instead."], ["Storing personal data in events and then needing to erase it (GDPR).", "Keep personal data outside the events, or encrypt it per user and delete the key (crypto-shredding)."], ["No schema versioning for events.", "Version event types and upcast old versions on read."]], "qa": [{"q": "How do you handle concurrent updates to the same aggregate?", "a": "<p>With optimistic concurrency: the command handler loads the stream at version N, decides, and appends new events with 'expected version N'. If someone else appended first, the store rejects the write and the handler reloads and retries or reports a conflict.<\/p><p>This gives consistency within one aggregate without locks; consistency across aggregates is handled with sagas and eventual consistency.<\/p>"}, {"q": "What are the main costs of event sourcing?", "a": "<p>A learning curve, event schema evolution forever (old events never go away), eventual consistency for queries (it almost always comes with CQRS), more complex debugging and data fixes, and privacy handling for immutable data.<\/p><p>It pays off where the history itself has business value: audit, finance, bookings, or domains where you need to answer 'what was the state at time T'.<\/p>"}]}, "outbox-idempotency": {"terms": [["Dual-write problem", "Writing to a database and publishing a message are two separate operations, and one can succeed while the other fails."], ["Transactional outbox", "Writing the outgoing message into an outbox table in the same database transaction as the business change, and publishing it afterwards."], ["Message relay", "The process that reads the outbox (by polling or CDC) and publishes to the broker."], ["Idempotency key", "A unique ID sent with a request or message so repeated deliveries are processed only once."]], "pitfalls": [["Publishing the event before committing the transaction.", "Only publish from the outbox after commit, or the event may describe a change that was rolled back."], ["Letting the outbox table grow forever.", "Delete or archive published rows and index the table for the relay's query."], ["Idempotency keys with no expiry or scope.", "Store keys with the result and a retention period, scoped per client or operation."]], "qa": [{"q": "How do you implement idempotency for a payment API like Stripe's?", "a": "<p>The client sends an Idempotency-Key header. The server stores the key with the request fingerprint and the eventual response. A retry with the same key returns the stored response without charging again; a request with the same key but different parameters is rejected.<\/p><p>The key record and the business change must be written atomically, or a crash between them breaks the guarantee.<\/p>"}, {"q": "Polling relay vs CDC for the outbox: trade-offs?", "a": "<p>Polling is simple and needs no extra infrastructure, but adds query load and some latency. CDC (for example Debezium reading the write-ahead log) gives low latency and no polling load, but adds a connector to operate and depends on database log access.<\/p><p>Both deliver at least once, so consumers must be idempotent either way.<\/p>"}]}, "cap": {"terms": [["Consistency (CAP)", "Every read returns the most recent write or an error (linearizability)."], ["Availability (CAP)", "Every request to a non-failing node receives a non-error response."], ["Partition tolerance", "The system keeps working even when the network drops messages between nodes."], ["PACELC", "Extends CAP: if Partitioned, choose Availability or Consistency; Else (normal operation), choose Latency or Consistency."]], "pitfalls": [["Saying a distributed system can choose 'CA'.", "Partitions happen, so the real choice is what to do during one: stay consistent (refuse some requests) or stay available (accept stale or conflicting data)."], ["Treating consistency as all-or-nothing per system.", "Choose per operation: strong consistency for payments and stock, eventual consistency for feeds and counters."], ["Ignoring latency in normal operation.", "Use PACELC thinking: strong consistency across regions costs latency even without partitions."]], "qa": [{"q": "What does PACELC add to CAP, and how do real databases fit?", "a": "<p>CAP only describes behaviour during a partition. PACELC adds the everyday trade-off: without partitions, you still trade latency against consistency.<\/p><p>DynamoDB and Cassandra are usually described as PA/EL (available and low-latency, eventually consistent by default, with tunable stronger reads), while Spanner and traditional single-leader databases lean PC/EC (consistent, paying latency).<\/p>"}, {"q": "What is read-your-writes consistency and how do you provide it?", "a": "<p>A guarantee that after a user writes, their own subsequent reads see that write, even if other users may still see older data.<\/p><p>Options: route that user's reads to the leader for a short time, read from a replica only if it has caught up to the write's version or timestamp, or return the written data directly from the write request.<\/p>"}]}, "caching": {"terms": [["Cache-aside", "The application reads from the cache, loads from the database on a miss, and populates the cache itself."], ["TTL", "Time to live: how long a cache entry stays valid before expiring."], ["Cache stampede", "Many requests missing the same key at once and all hitting the database."], ["Hit ratio", "The share of reads served from the cache; the main measure of cache effectiveness."]], "pitfalls": [["Caching without an invalidation plan.", "Decide per key: TTL, delete on write, or event-driven invalidation."], ["All keys expiring at the same moment.", "Add random jitter to TTLs."], ["Treating the cache as the source of truth.", "The system must work, more slowly, with an empty cache."]], "qa": [{"q": "What are the main cache eviction policies?", "a": "<p>LRU (least recently used) evicts the item not accessed for the longest time and suits most workloads. LFU (least frequently used) keeps popular items even if not accessed recently. TTL-based expiry removes items by age.<\/p><p>Redis offers approximated LRU and LFU policies (allkeys-lru, allkeys-lfu, volatile-*); pick based on whether popularity or recency predicts future reads.<\/p>"}, {"q": "How do you handle a hot key that overloads one cache node?", "a": "<p>Replicate the hot key under several suffixed names and pick one at random on reads, add a small in-process (local) cache in front of the distributed cache, or use read replicas.<\/p><p>Detect hot keys with the cache's own tooling (for example redis-cli --hotkeys) or client-side metrics, because they often appear suddenly with traffic spikes.<\/p>"}]}, "circuit-breaker": {"terms": [["Circuit breaker", "A proxy that stops calling a failing dependency for a while, failing fast instead of waiting on timeouts."], ["Closed / Open / Half-open", "Closed passes calls through; Open rejects immediately; Half-open lets a few trial calls test recovery."], ["Failure-rate threshold", "The share of failed or slow calls in a sliding window that trips the breaker."], ["Fallback", "The alternative response returned when the call is rejected or fails (cached data, default value, graceful error)."]], "pitfalls": [["One breaker for all endpoints of a dependency.", "Use breakers per dependency and per critical operation, so one bad endpoint does not block healthy ones."], ["Thresholds evaluated on too few calls.", "Set a minimum number of calls in the window before the breaker can trip."], ["Counting client errors (400s) as failures.", "Count timeouts, 5xx and connection errors, not caller mistakes."]], "qa": [{"q": "How would you tune a circuit breaker?", "a": "<p>Start from measured behaviour: the dependency's normal error rate and p99 latency. Set the failure threshold well above normal (for example 50 percent in a window of the last 100 calls, with a minimum of 20), treat calls slower than a slow-call threshold as failures, and choose an open duration long enough for recovery (tens of seconds).<\/p><p>Then test with fault injection and watch breaker state metrics in production, adjusting to avoid both flapping and slow detection.<\/p>"}, {"q": "What is the difference between a circuit breaker in the application and in a service mesh?", "a": "<p>A library breaker (Resilience4j, Polly) runs in the caller's code, can use business-aware fallbacks, and sees exceptions. A mesh breaker (Envoy outlier detection and connection limits) needs no code changes and applies uniformly across languages, but can only see network-level signals and cannot return a business fallback.<\/p><p>Many systems use both: the mesh for uniform protection, the library where a meaningful fallback exists.<\/p>"}]}, "retry-timeout": {"terms": [["Timeout", "The maximum time a caller waits for a response before giving up."], ["Exponential backoff", "Increasing the wait between retries (for example 100 ms, 200 ms, 400 ms) to give the dependency time to recover."], ["Jitter", "Randomizing retry delays so many clients do not retry in synchronized waves."], ["Retry budget", "A cap on retries as a share of total requests (for example 10 percent), limiting how much retries can amplify load."]], "pitfalls": [["Retrying at every layer of a call chain.", "Retry at one layer (usually closest to the failure or the edge) to avoid multiplicative retry storms."], ["Retrying non-idempotent operations.", "Retry only idempotent calls, or add idempotency keys first."], ["No overall deadline.", "Propagate a deadline so retries stop when the caller no longer needs the answer."]], "qa": [{"q": "Why are nested retries dangerous? Give numbers.", "a": "<p>If each of four layers retries a failing call 3 times (4 attempts each), the bottom service receives up to 4 x 4 x 4 x 4 = 256 attempts for one user request. During an outage that multiplies load exactly when the service is weakest and prevents recovery.<\/p><p>Retry at one layer, use budgets, and let circuit breakers stop retries when a dependency is clearly down.<\/p>"}, {"q": "What is hedging and when is it useful?", "a": "<p>Sending a duplicate request to another replica if the first has not answered within a short delay (for example the p95 latency), and using whichever response arrives first.<\/p><p>It cuts tail latency for idempotent reads, as described in Google's 'The Tail at Scale', at the cost of a few percent extra load. It must not be used for non-idempotent writes.<\/p>"}]}, "bulkhead": {"terms": [["Bulkhead", "Isolating resources per dependency or workload so one failure cannot exhaust shared resources."], ["Thread-pool bulkhead", "A dedicated, bounded executor for calls to one dependency."], ["Semaphore bulkhead", "A limit on concurrent calls to a dependency, without separate threads."], ["Load shedding", "Rejecting excess requests early (with 503 or 429) instead of queuing them until everything is slow."]], "pitfalls": [["Unbounded queues in front of bounded pools.", "Bound queues too; a full queue should fail fast, not grow latency without limit."], ["Sizing pools by guesswork.", "Size from Little's law: concurrency = throughput x latency, plus headroom, then verify under load."], ["Bulkheads without timeouts.", "A stuck call still holds its slot; always pair bulkheads with timeouts."]], "qa": [{"q": "How do you size a bulkhead using Little's law?", "a": "<p>Required concurrency is roughly throughput times latency. If the Payment dependency handles 200 requests per second at a p99 of 250 ms, you need about 200 x 0.25 = 50 concurrent slots, plus headroom for spikes, say 60 to 70.<\/p><p>If the pool fills anyway, that signals the dependency's latency has grown, which is exactly the situation the bulkhead should contain.<\/p>"}, {"q": "How do bulkheads apply beyond thread pools?", "a": "<p>At the infrastructure level: separate Kubernetes node pools or namespaces with resource quotas for critical and batch workloads, dedicated clusters or cells for large tenants, separate connection pools per database, and separate queues per priority.<\/p><p>The principle is the same: a failure or overload in one compartment must not consume resources the others need.<\/p>"}]}, "rate-limiting": {"terms": [["Rate limiting", "Restricting how many requests a client can make in a period."], ["Token bucket", "Tokens refill at a fixed rate up to a capacity; each request spends a token, allowing short bursts."], ["Sliding window", "Counting requests over a rolling time window to avoid the burst at fixed-window boundaries."], ["Throttling", "Slowing or rejecting requests once a limit is reached; often used interchangeably with rate limiting."]], "pitfalls": [["Per-instance limits behind a load balancer.", "Use a shared store (Redis with atomic scripts) or divide the global limit by instance count."], ["Returning 500 instead of 429.", "Return 429 Too Many Requests with a Retry-After header so clients can back off correctly."], ["Limiting only by IP.", "Limit by API key, user or tenant as well; many users can share an IP behind NAT."]], "qa": [{"q": "How would you design a distributed rate limiter?", "a": "<p>Keep counters in Redis keyed by client and window, updated atomically with a Lua script (for example a sliding-window log or token bucket). The gateway calls it on each request, with a small local cache or approximate counting to cut latency.<\/p><p>Decide the failure mode explicitly: fail open (allow traffic if Redis is down) for availability, or fail closed for protection-critical APIs, and monitor the limiter's own latency.<\/p>"}, {"q": "Rate limiting vs load shedding vs backpressure?", "a": "<p>Rate limiting enforces per-client quotas (fairness and abuse protection). Load shedding drops work when the service itself is overloaded, regardless of which client sent it. Backpressure signals upstream producers to slow down (for example a full queue or reactive streams demand).<\/p><p>A robust system uses all three: quotas at the edge, shedding in services, and backpressure in pipelines.<\/p>"}]}, "health-checks": {"terms": [["Liveness probe", "Checks whether the process is alive; failing it makes Kubernetes restart the container."], ["Readiness probe", "Checks whether the instance can serve traffic; failing it removes the pod from load balancing without restarting it."], ["Startup probe", "Gives slow-starting containers time to start before liveness checks begin."], ["Graceful degradation", "Continuing to serve reduced functionality when a dependency is unhealthy."]], "pitfalls": [["Liveness probes that check the database.", "A database outage then restarts every pod in a loop; keep liveness to the process itself."], ["Readiness that fails on every dependency blip.", "Fail readiness only for dependencies without which the instance cannot serve anything useful."], ["Probes with timeouts shorter than a GC pause.", "Tune timeouts and failure thresholds so one slow response does not trigger a restart."]], "qa": [{"q": "What is a startup probe and when do you need one?", "a": "<p>A probe that runs first and disables liveness and readiness checks until it succeeds. It is for applications that take a long time to start (JVM warm-up, cache loading, migrations).<\/p><p>Without it you must make the liveness initial delay very long, which also delays detecting real hangs; with it, liveness can stay aggressive after start-up.<\/p>"}, {"q": "How does a readiness probe interact with a rolling deployment?", "a": "<p>Kubernetes only counts a new pod as available once it passes readiness, and only then continues terminating old pods (governed by maxUnavailable and maxSurge). A broken new version that never becomes ready stalls the rollout instead of replacing healthy pods.<\/p><p>That makes a meaningful readiness check a deployment safety feature, not just a load-balancing one.<\/p>"}]}, "logging": {"terms": [["Structured logging", "Emitting logs as key-value records (usually JSON) instead of free text, so they can be filtered and aggregated."], ["Correlation ID", "An ID attached to a request at the edge and passed to every service, so all its log lines can be found together."], ["Log aggregation", "Shipping logs from all instances to a central store (Elasticsearch, Loki, CloudWatch) for search."], ["Log level", "Severity of a log line (DEBUG, INFO, WARN, ERROR), used to control volume and alerting."]], "pitfalls": [["Logging personal data, tokens or passwords.", "Mask or drop sensitive fields at the logging library, and audit log output."], ["Writing logs to local files inside containers.", "Log to stdout and let the platform collect and ship logs."], ["DEBUG logging everywhere in production.", "Log at INFO by default, sample high-volume events, and allow dynamic level changes for troubleshooting."]], "qa": [{"q": "How do you control logging costs at scale?", "a": "<p>Log less but better: structured events with useful fields, no per-item logs inside hot loops, sampling for successful high-volume requests, shorter retention for verbose data, and tiered storage for older logs.<\/p><p>Move numeric signals into metrics (much cheaper) and use traces for request-level detail; logs should explain what metrics and traces cannot.<\/p>"}, {"q": "How do logs, metrics and traces work together during an incident?", "a": "<p>Metrics tell you something is wrong (error rate or p99 alert). Traces show where in the call chain the time or errors are. Logs from the specific spans explain why (the exception, the bad input).<\/p><p>Linking them is key: put trace IDs in log lines and use exemplars that attach trace IDs to metric samples, so you can jump from a latency spike to example traces to their logs.<\/p>"}]}, "tracing": {"terms": [["Trace", "The complete record of one request's path through the system, made of spans."], ["Span", "One timed operation within a trace (an HTTP call, a database query), with a parent span, attributes and status."], ["W3C Trace Context", "The standard traceparent and tracestate headers for propagating trace IDs across services."], ["OpenTelemetry", "The vendor-neutral standard and SDKs for generating traces, metrics and logs."]], "pitfalls": [["Losing trace context across async hops (queues, thread pools).", "Propagate context in message headers and use instrumented executors."], ["Sampling so aggressively that errors are never kept.", "Use tail-based sampling that keeps all errors and slow traces while sampling normal ones."], ["High-cardinality span names (with IDs in them).", "Use route templates (GET /orders/{id}) as names and put IDs in attributes."]], "qa": [{"q": "Head-based vs tail-based sampling?", "a": "<p>Head-based sampling decides at the start of a trace (for example keep 1 percent), which is cheap but may drop the interesting failing requests. Tail-based sampling buffers complete traces in a collector and decides after seeing them, so it can keep all errors and slow traces.<\/p><p>Tail sampling needs more collector memory and all spans of a trace routed to the same collector, but gives far better debugging value per stored trace.<\/p>"}, {"q": "What does an OpenTelemetry Collector do?", "a": "<p>It receives telemetry from applications, processes it (batching, filtering, sampling, attribute redaction, enrichment with Kubernetes metadata) and exports it to one or more back ends.<\/p><p>It decouples applications from vendors: switching from Jaeger to another back end is a collector config change, not an application change.<\/p>"}]}, "metrics": {"terms": [["SLI", "Service Level Indicator: a measured quantity of service health, such as the share of requests under 300 ms."], ["SLO", "Service Level Objective: the target for an SLI over a window, such as 99.9 percent of requests under 300 ms over 30 days."], ["Error budget", "The allowed amount of unreliability (100 percent minus the SLO), spent on releases and experiments."], ["RED and USE", "RED (Rate, Errors, Duration) for services; USE (Utilization, Saturation, Errors) for resources."]], "pitfalls": [["Alerting on every CPU spike.", "Alert on symptoms users feel (SLO burn rate), and use resource metrics for diagnosis."], ["Metrics labels with unbounded values (user ID, order ID).", "Keep label cardinality bounded; put IDs in logs and traces."], ["Averaging percentiles across instances.", "Aggregate histograms, then compute percentiles."]], "qa": [{"q": "What is burn-rate alerting?", "a": "<p>Alerting on how fast the error budget is being consumed rather than on raw error rates. A burn rate of 1 uses the budget exactly over the SLO window; a burn rate of 14 would exhaust a 30-day budget in about 2 days.<\/p><p>Google's SRE workbook recommends multi-window alerts, for example page when both the 1-hour and 5-minute burn rates exceed 14, which catches fast outages quickly and ignores short blips.<\/p>"}, {"q": "How much downtime does 99.9 percent availability allow?", "a": "<p>About 43 minutes per 30-day month (0.1 percent of 43,200 minutes) or about 8.8 hours per year. 99.99 percent allows about 4.3 minutes per month.<\/p><p>The numbers show why each extra nine is expensive: 99.99 percent leaves no room for manual recovery, so it requires automated failover and very safe deployments.<\/p>"}]}, "auth": {"terms": [["Authentication (AuthN)", "Verifying who the caller is."], ["Authorization (AuthZ)", "Deciding what the verified caller may do."], ["OAuth 2.0", "A framework for delegated authorization using access tokens issued by an authorization server."], ["OpenID Connect (OIDC)", "An identity layer on top of OAuth 2.0 that adds an ID token describing the authenticated user."]], "pitfalls": [["Accepting JWTs without checking the algorithm, issuer or audience.", "Pin allowed algorithms, and validate signature, iss, aud and exp on every request."], ["Long-lived access tokens.", "Keep access tokens short (minutes) and use refresh tokens with rotation."], ["Doing all authorization at the gateway.", "Check coarse access at the edge and fine-grained permissions inside each service."]], "qa": [{"q": "What is the token exchange or token relay pattern?", "a": "<p>When service A calls service B on behalf of a user, it should not simply forward a broad user token everywhere. With token exchange (RFC 8693) A trades the incoming token for a new one scoped to B's audience and the needed permissions.<\/p><p>This limits the damage of a leaked token and lets B verify it was meant for B, not for some other service.<\/p>"}, {"q": "Where should fine-grained authorization logic live?", "a": "<p>Close to the data it protects, inside the owning service, because only it knows ownership rules (can this user edit this order). Centralized policy engines such as Open Policy Agent can hold the rules while services call them with context, keeping policies consistent and auditable.<\/p><p>The gateway handles only coarse checks such as 'is authenticated' and 'has scope orders:read'.<\/p>"}]}, "service-security": {"terms": [["mTLS", "Mutual TLS: both client and server present certificates, so each side authenticates the other and traffic is encrypted."], ["Zero trust", "Never trusting a request because of its network location; every call is authenticated and authorized."], ["SPIFFE", "A standard for workload identity (spiffe://domain/workload) used to issue certificates to services."], ["Secrets manager", "A system (Vault, AWS Secrets Manager) that stores, rotates and audits credentials."]], "pitfalls": [["Secrets in environment variables baked into images or Git.", "Inject secrets at runtime from a secrets manager and scan repositories for leaks."], ["Long-lived static certificates.", "Issue short-lived certificates automatically (mesh or SPIFFE) and rotate them."], ["Flat networks where any pod can call any pod.", "Add network policies and service-level authorization, not just encryption."]], "qa": [{"q": "How does a service mesh provide mTLS automatically?", "a": "<p>The mesh control plane acts as a certificate authority and issues each workload a short-lived certificate tied to its identity (for example its Kubernetes service account). Sidecar or node proxies use these certificates for mTLS on every connection and rotate them automatically.<\/p><p>Policies can then allow or deny calls by workload identity (orders may call payments) instead of by IP address.<\/p>"}, {"q": "What are dynamic secrets?", "a": "<p>Credentials generated on demand for each client with a short lease, for example Vault creating a database user that expires in an hour. If a secret leaks it becomes useless quickly, and each credential can be traced to one workload.<\/p><p>This replaces long-lived shared passwords, which are hard to rotate and impossible to attribute.<\/p>"}]}, "docker": {"terms": [["Image", "An immutable, layered file-system snapshot plus metadata, used to start containers."], ["Container", "A running process isolated with Linux namespaces and limited with cgroups, started from an image."], ["Layer", "Each Dockerfile instruction creates a cached layer; unchanged layers are reused between builds."], ["Registry", "A service that stores and distributes images (Docker Hub, ECR, GCR, Harbor)."]], "pitfalls": [["Running containers as root.", "Add a non-root USER, drop Linux capabilities and use a read-only root file system where possible."], ["Using the latest tag in production.", "Pin versions or image digests so deployments are reproducible."], ["Large images with build tools and secrets inside.", "Use multi-stage builds, minimal base images, and never copy secrets into layers."]], "qa": [{"q": "How do you make Docker builds fast and cache-friendly?", "a": "<p>Order instructions from least to most frequently changing: copy dependency manifests (package.json, requirements.txt) and install dependencies before copying source code, so code changes do not invalidate the dependency layer. Use a .dockerignore to keep the build context small, and BuildKit cache mounts for package caches.<\/p><p>In CI, push and reuse cache layers from the registry so every build does not start cold.<\/p>"}, {"q": "How do you secure the container supply chain?", "a": "<p>Use trusted minimal base images, scan images for vulnerabilities (Trivy, Grype) in CI, generate an SBOM, sign images (Sigstore cosign) and enforce signature and policy checks at admission in the cluster.<\/p><p>Rebuild images regularly to pick up base-image patches, not only when code changes.<\/p>"}]}, "kubernetes": {"terms": [["Pod", "The smallest deployable unit: one or more containers sharing network and storage."], ["Deployment", "Manages a ReplicaSet of stateless pods and performs rolling updates."], ["Service", "A stable virtual IP and DNS name that load-balances to matching pods."], ["Requests and limits", "Requests reserve CPU and memory for scheduling; limits cap what a container can use."]], "pitfalls": [["No resource requests, so the scheduler overpacks nodes.", "Set requests from measured usage and limits that protect the node, especially for memory."], ["Single-replica deployments for important services.", "Run at least two replicas across zones with a PodDisruptionBudget."], ["Tight CPU limits causing throttling latency.", "Watch CPU throttling metrics; many teams set CPU requests but no CPU limit."]], "qa": [{"q": "What happens when a container exceeds its memory limit versus its CPU limit?", "a": "<p>Memory is not compressible: exceeding the memory limit gets the container OOM-killed and restarted. CPU is compressible: exceeding the CPU limit makes the kernel throttle the container, which shows up as latency, not crashes.<\/p><p>That difference is why memory limits are essential while CPU limits need care to avoid hidden latency.<\/p>"}, {"q": "What is a PodDisruptionBudget?", "a": "<p>A policy stating how many pods of an application may be down at once during voluntary disruptions such as node drains and cluster upgrades (for example minAvailable: 2).<\/p><p>It stops maintenance from taking down all replicas at the same time; it does not protect against involuntary failures such as a node crash.<\/p>"}]}, "service-mesh": {"terms": [["Service mesh", "An infrastructure layer that handles service-to-service traffic: mTLS, retries, timeouts, routing and telemetry."], ["Data plane", "The proxies (for example Envoy) that carry the actual traffic."], ["Control plane", "The component that configures the proxies and issues certificates (for example istiod)."], ["Sidecar", "A proxy container running next to each application container in the same pod."]], "pitfalls": [["Adopting a mesh before having the problems it solves.", "Start with libraries and platform basics; adopt a mesh when many services need uniform mTLS, traffic policy and telemetry."], ["Configuring retries in both the application and the mesh.", "Choose one layer for retries to avoid multiplied attempts."], ["Ignoring the sidecar's resource and latency cost.", "Budget CPU and memory for proxies and measure the added latency (typically sub-millisecond to a few milliseconds per hop)."]], "qa": [{"q": "What is sidecar-less (ambient) mesh?", "a": "<p>Istio's ambient mode moves the per-pod sidecar out: a shared per-node proxy (ztunnel) handles mTLS and L4 traffic, and optional waypoint proxies handle L7 features for services that need them. Cilium offers a similar eBPF-based approach.<\/p><p>The benefit is lower resource overhead and no sidecar injection or restarts; the trade-off is a newer model and different failure domains.<\/p>"}, {"q":
