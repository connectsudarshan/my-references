TOPICS.push(

// ============ FUNDAMENTALS ============
{
id:'what-are-microservices', cat:'fund', name:'What Are Microservices?',
alias:'An architecture where one application is built as a set of small, independently deployable services.',
simple:`Think of a restaurant. In a <b>monolith</b>, one chef cooks every dish. If the chef is sick, the restaurant closes. With <b>microservices</b>, there are stations (grill, salad, desserts), each with its own cook. They pass order tickets to each other. If the dessert station is slow, you still get your burger.`,
intent:`<p>A <b>microservice</b> is a small service that owns <b>one business capability</b> (orders, payments, users), runs in its own process, stores its own data, and talks to other services over the network (HTTP/gRPC or messages).</p>
<p>A <b>monolith</b> is one codebase, one build, one deployable and usually one database. It is simple to start with, but as the team and codebase grow, every change needs a full redeploy, one bug can crash everything, and you must scale the whole app even if only one part is busy.</p>
<p>Microservices trade that <b>code complexity</b> for <b>operational complexity</b>: you get independent deploys, independent scaling and team autonomy, but you now deal with network failures, distributed data and many moving parts.</p>`,
diagram:`MONOLITH                              MICROSERVICES
+-----------------------------+       +---------+   +---------+   +---------+
|  UI                         |       |  User   |   |  Order  |   | Payment |
|  User | Order | Payment     |       | Service |   | Service |   | Service |
|  Inventory | Notification   |       +----+----+   +----+----+   +----+----+
+--------------+--------------+            |             |             |
               |                        [User DB]    [Order DB]   [Payment DB]
        [ One big DB ]
                                      Each box: own code, own DB, own deploy,
One deploy. Scale everything.         own team. Talk via REST / gRPC / events.`,
lang:'python', codeLabel:'PYTHON · FLASK',
code:`# order_service.py  -- one tiny service that only knows about ORDERS
from flask import Flask, jsonify, request
import requests

app = Flask(__name__)
orders = {}   # in real life: this service's OWN database

@app.post("/orders")
def create_order():
    body = request.json
    # Ask another service over the network instead of calling a local function
    user = requests.get(f"http://user-service/users/{body['user_id']}", timeout=2).json()
    order_id = len(orders) + 1
    orders[order_id] = {"id": order_id, "user": user["name"], "items": body["items"]}
    return jsonify(orders[order_id]), 201

@app.get("/orders/<int:oid>")
def get_order(oid):
    return jsonify(orders.get(oid, {})), (200 if oid in orders else 404)

if __name__ == "__main__":
    app.run(port=8081)   # runs as its own process, deployed on its own`,
examples:[
  {title:'Netflix', body:'After a major database corruption in 2008 stopped DVD shipping for three days, Netflix moved from a monolith to hundreds of microservices on AWS. Today a failure in, say, the "recommendations" service just shows a generic row; playback keeps working.'},
  {title:'Amazon', body:'Around 2002 Amazon required every team to expose its data only through service interfaces. This "two-pizza team" model (each team small enough to feed with two pizzas) owns one service end to end and deploys it many times a day.'},
  {title:'Uber', body:'Uber started as a monolith in one city. Expanding to hundreds of cities forced a split into thousands of services (trips, pricing, payments, maps). Later they grouped related services into "domains" (DOMA) to tame the sprawl, a good lesson that more services is not always better.'}
],
useWhen:['Large product with many teams that step on each other in one codebase','Parts of the system have very different scaling needs (search vs. checkout)','You need independent, frequent deployments and fault isolation'],
avoidWhen:['Small team or early-stage product: start with a well-structured (modular) monolith','Domain boundaries are still unclear; wrong splits are expensive to undo','No DevOps maturity yet (CI/CD, monitoring, containers)'],
qa:[
  {q:'What is a microservice, in one line?', a:`<p>A small, independently deployable service that owns a single business capability and its own data, and communicates with others over well-defined APIs.</p>`},
  {q:'What are the main advantages and disadvantages of microservices?', a:`<p><b>Pros:</b> independent deployment, independent scaling, fault isolation, freedom of tech stack per service, small focused teams, faster release cycles.</p><p><b>Cons:</b> network latency and failures, distributed transactions and data consistency, harder debugging (need tracing), more infrastructure (gateway, discovery, monitoring), operational cost.</p>`},
  {q:'When would you NOT use microservices?', a:`<p>For an MVP, a small team (under ~10 engineers), a simple domain, or when the business boundaries are still changing. Martin Fowler's advice is "Monolith First": build a modular monolith, find stable boundaries, and extract services when there is real pain.</p>`},
  {q:'How small should a microservice be?', a:`<p>Size is not measured in lines of code. A service should map to one <b>bounded context</b> / business capability, be ownable by one small team, and be deployable without coordinating with other teams. If two services always change and deploy together, they should probably be one.</p>`}
]
},

{
id:'monolith-soa-micro', cat:'fund', name:'Monolith vs SOA vs Microservices',
alias:'Three generations of architecture: one big app, shared-bus services, and small autonomous services.',
simple:`Monolith = one big department store. SOA = a mall where every shop must route customers through one central help desk (the ESB). Microservices = a street of independent shops, each with its own door, stock room and staff.`,
intent:`<p><b>SOA (Service-Oriented Architecture)</b> came before microservices. It also split systems into services, but services were usually large, shared databases, and communicated through a heavy central <b>Enterprise Service Bus (ESB)</b> that held routing and business logic. The ESB became a bottleneck and a single point of failure.</p>
<p><b>Microservices</b> keep the "services" idea but follow <b>"smart endpoints, dumb pipes"</b>: logic lives in the services, and the network (HTTP, Kafka) only carries messages. Each service owns its data.</p>
<p>A popular middle ground is the <b>Modular Monolith</b>: one deployable, but with strict internal module boundaries. It is often the best starting point and makes a later split easy.</p>`,
table:{head:['Aspect','Monolith','SOA','Microservices'],rows:[
  ['Deployment','Single unit','Several large services','Many small services, independent'],
  ['Data','One shared DB','Often shared DB','Database per service'],
  ['Communication','In-process function calls','ESB, SOAP/XML','REST, gRPC, events (lightweight)'],
  ['Logic location','Inside app','Much of it in the ESB','Inside services ("smart endpoints")'],
  ['Scaling','Whole app','Per service (coarse)','Per service (fine-grained)'],
  ['Team model','Layered teams (UI, DB)','Shared integration team','Cross-functional team per service'],
  ['Failure impact','Whole app can go down','ESB failure hurts all','Isolated if designed with resilience']
]},
lang:'', code:'',
examples:[
  {title:'Shopify: modular monolith', body:'Shopify runs one of the largest Ruby on Rails monoliths in the world. Instead of splitting into microservices, they enforced module boundaries inside the monolith ("componentization"), getting most of the team benefits without network overhead.'},
  {title:'Banks and telecoms: SOA with an ESB', body:'Many banks built SOA in the 2000s using IBM or Oracle ESB products. Core banking, cards and loans were services, but all messages were transformed and routed through the bus, making every change a ticket to the central integration team.'},
  {title:'Spotify: microservices with squads', body:'Spotify organises into "squads", each owning a set of microservices (playlists, search, ads). Squads deploy on their own schedule because services only share APIs, not databases.'}
],
useWhen:['Monolith: new product, small team, fast iteration','Modular monolith: growing team that wants boundaries without distributed-systems cost','Microservices: many teams, clear domains, different scaling needs'],
avoidWhen:['Do not pick SOA+ESB for new systems; logic in the pipe becomes a bottleneck','Do not pick microservices just because it is trendy or "Netflix does it"'],
qa:[
  {q:'What is the difference between SOA and microservices?', a:`<p>Both split systems into services. SOA services are typically larger, share databases and rely on a central ESB with smart routing and transformation logic. Microservices are smaller, own their data, deploy independently and use lightweight protocols with "dumb pipes". Microservices can be seen as a refined, decentralised form of SOA.</p>`},
  {q:'What is a modular monolith and why is it popular?', a:`<p>A single deployable application divided into modules with strict boundaries (separate packages, no reaching into another module's tables, communication through public interfaces). You get clean ownership and easy future extraction, without network calls, distributed transactions or extra infrastructure.</p>`},
  {q:'What does "smart endpoints, dumb pipes" mean?', a:`<p>Business logic lives in the services (endpoints). The communication layer (HTTP, a message broker) just delivers messages and does not contain routing rules or transformations. This avoids the ESB problem where the bus becomes a hidden monolith.</p>`}
]
},

{
id:'principles', cat:'fund', name:'Core Principles & 12-Factor App',
alias:'The design rules that make a service truly independent, portable and cloud-ready.',
simple:`Each service should be like a good tenant in an apartment building: it has its own key (API), its own fridge (database), doesn't borrow the neighbour's stuff, and can move to another building (server) without rewiring the walls.`,
intent:`<p>The key microservice principles are:</p>
<p><b>1. Single Responsibility</b> – one service, one business capability. <b>2. Loose coupling, high cohesion</b> – change one service without changing others. <b>3. Decentralised data</b> – each service owns its database. <b>4. Independent deployability</b> – deploy one service without redeploying others. <b>5. Design for failure</b> – assume the network and other services will fail. <b>6. Automation</b> – CI/CD, infrastructure as code. <b>7. Observability</b> – logs, metrics and traces from day one. <b>8. API-first and versioned contracts</b>.</p>
<p>The <b>12-Factor App</b> methodology (from Heroku) is a checklist for building services that run well in the cloud. Interviewers love it.</p>`,
table:{head:['#','Factor','Meaning in plain words'],rows:[
  ['1','Codebase','One repo per service, many deploys (dev, staging, prod)'],
  ['2','Dependencies','Declare all libs explicitly (requirements.txt, pom.xml)'],
  ['3','Config','Keep config in environment variables, not in code'],
  ['4','Backing services','DB, cache, queue are attached resources swappable by URL'],
  ['5','Build, release, run','Strictly separate the three stages'],
  ['6','Processes','Run as stateless processes; state goes to a DB or cache'],
  ['7','Port binding','Service exposes itself on a port (self-contained)'],
  ['8','Concurrency','Scale out by running more processes'],
  ['9','Disposability','Fast start, graceful shutdown'],
  ['10','Dev/prod parity','Keep environments as similar as possible'],
  ['11','Logs','Write logs to stdout as an event stream'],
  ['12','Admin processes','Run one-off tasks (migrations) as separate processes']
]},
lang:'python', codeLabel:'PYTHON · 12-FACTOR CONFIG',
code:`import os, logging, sys

# Factor 3: config from environment, never hard-coded
DB_URL      = os.environ["DATABASE_URL"]          # e.g. postgres://orders-db:5432/orders
KAFKA_URL   = os.environ.get("KAFKA_BROKERS", "kafka:9092")
PORT        = int(os.environ.get("PORT", 8080))   # Factor 7: port binding

# Factor 11: logs as a stream to stdout (the platform collects them)
logging.basicConfig(stream=sys.stdout, level=logging.INFO,
                    format='{"ts":"%(asctime)s","level":"%(levelname)s","msg":"%(message)s"}')

# Factor 6: no in-memory session state; anything shared goes to Redis/DB
# Factor 9: handle SIGTERM for graceful shutdown
import signal
def shutdown(signum, frame):
    logging.info("SIGTERM received, finishing in-flight requests")
    sys.exit(0)
signal.signal(signal.SIGTERM, shutdown)`,
examples:[
  {title:'Heroku / Cloud Foundry apps', body:'The 12-factor rules were written by Heroku engineers after watching thousands of apps. Apps that follow them can be scaled with one command ("heroku ps:scale web=10") because they are stateless and configured by env vars.'},
  {title:'Kubernetes-native services', body:'Kubernetes assumes 12-factor behaviour: it injects config via ConfigMaps/env vars, collects stdout logs, kills pods with SIGTERM and expects them to shut down gracefully, and scales by adding pods.'},
  {title:'Same Docker image, three environments', body:'A payment service image built once is promoted from dev to staging to prod unchanged. Only the env vars (DB URL, API keys) differ. This is factors 3, 5 and 10 working together.'}
],
useWhen:['Always, for any service meant to run in containers or the cloud'],
avoidWhen:['Do not store secrets in plain env files in git; use a secrets manager and inject at runtime'],
qa:[
  {q:'Why should microservices be stateless?', a:`<p>So that any instance can handle any request. This allows horizontal scaling (add instances behind a load balancer), easy restarts and rolling deploys. State such as sessions or carts goes to an external store like Redis or a database.</p>`},
  {q:'Explain loose coupling and high cohesion.', a:`<p><b>High cohesion:</b> things that change together live together (all order logic in the Order service). <b>Loose coupling:</b> services depend on each other only through stable APIs or events, so changing one does not force changes in another. Shared databases and shared libraries with business logic break loose coupling.</p>`},
  {q:'Name a few of the 12 factors and why they matter.', a:`<p>Config in env vars (same build everywhere), stateless processes (easy scaling), logs to stdout (platform handles aggregation), disposability (fast restarts for autoscaling and deploys), dev/prod parity (fewer "works on my machine" bugs).</p>`}
]
},

{
id:'ddd', cat:'fund', name:'Domain-Driven Design & Bounded Context',
alias:'Using the business domain, not technical layers, to decide where one service ends and another begins.',
simple:`The word "Product" means different things to different departments. For the <b>Catalog</b> team it's a name, photo and description. For the <b>Warehouse</b> it's a weight and shelf location. For <b>Shipping</b> it's a box size. Each department is a "bounded context" and should get its own service with its own idea of "Product".`,
intent:`<p><b>Domain-Driven Design (DDD)</b> is the most common way to find service boundaries. Key terms:</p>
<p><b>Domain</b> – the business area (e-commerce). <b>Subdomain</b> – a part of it: <i>core</i> (your competitive edge, e.g. pricing), <i>supporting</i> (inventory), <i>generic</i> (auth, email; buy it).</p>
<p><b>Bounded Context</b> – a boundary inside which a model and its terms have one clear meaning. <b>One bounded context ≈ one microservice</b> (sometimes a few).</p>
<p><b>Ubiquitous Language</b> – developers and business people use the same words in code and conversation. <b>Aggregate</b> – a cluster of objects treated as one unit for changes (an Order with its OrderLines); transactions should not cross aggregates. <b>Context Map</b> – shows how contexts relate (upstream/downstream, anti-corruption layer).</p>`,
diagram:`             E-COMMERCE DOMAIN
+----------------+   +-----------------+   +----------------+
|  CATALOG       |   |  INVENTORY      |   |  SHIPPING      |
|  Product:      |   |  Product:       |   |  Product:      |
|   - name       |   |   - sku         |   |   - sku        |
|   - images     |   |   - qty_on_hand |   |   - weight_kg  |
|   - price      |   |   - warehouse   |   |   - dimensions |
+-------+--------+   +--------+--------+   +--------+-------+
        |   "ProductPublished" |  "StockReserved"    |
        +---------- events ----+---------------------+
 Same real-world thing, three different models, three services.`,
lang:'python', codeLabel:'PYTHON · SAME CONCEPT, DIFFERENT CONTEXTS',
code:`# catalog_service/models.py
@dataclass
class Product:
    sku: str
    title: str
    description: str
    images: list[str]
    price: Decimal

# inventory_service/models.py
@dataclass
class StockItem:          # inventory calls it StockItem, not Product
    sku: str
    warehouse_id: str
    quantity_on_hand: int
    def reserve(self, qty: int):
        if qty > self.quantity_on_hand:
            raise OutOfStock(self.sku)
        self.quantity_on_hand -= qty

# order_service/models.py  -- Order is an AGGREGATE ROOT
@dataclass
class Order:
    id: str
    lines: list["OrderLine"]
    status: str = "PENDING"
    def add_line(self, sku, qty, price):     # all changes go through the root
        if self.status != "PENDING":
            raise ValueError("Cannot modify a confirmed order")
        self.lines.append(OrderLine(sku, qty, price))`,
examples:[
  {title:'Online retail', body:'"Customer" in the Sales context has a cart and loyalty points; in the Support context it has tickets and a satisfaction score; in Billing it has invoices and a tax ID. Three bounded contexts, three services, linked only by customer ID.'},
  {title:'Banking', body:'A bank splits into Accounts, Payments, Loans, Cards and KYC (Know Your Customer). "Transaction" in Payments is a transfer instruction; in Accounts it is a ledger entry. Treating them as one model created huge tightly-coupled cores in legacy banks.'},
  {title:'Ride-hailing', body:'Trip management, driver onboarding, pricing (surge), payments and maps are separate bounded contexts. Pricing is a core subdomain (competitive edge), while email/SMS notifications is generic and often bought from a vendor like Twilio.'}
],
useWhen:['Deciding how to split a monolith or design a new system','Complex business domains with many rules and experts'],
avoidWhen:['Simple CRUD apps with little business logic; full DDD tactical patterns are overkill there'],
qa:[
  {q:'How do you decide the boundaries of a microservice?', a:`<p>Use DDD: talk to domain experts, identify subdomains and <b>bounded contexts</b> (where a term has one meaning), and map each to a service. Also check: can one team own it? Can it be deployed alone? Does it need its own data? Techniques like <b>Event Storming</b> (sticky notes of domain events on a wall) help discover these boundaries.</p>`},
  {q:'What is an Aggregate?', a:`<p>A group of related objects treated as a single unit for data changes, accessed through one root entity. Example: <code>Order</code> (root) with <code>OrderLine</code>s. You only modify lines through the Order, and one transaction changes only one aggregate. Across aggregates (and services), you use eventual consistency via events.</p>`},
  {q:'What is an Anti-Corruption Layer (ACL)?', a:`<p>A translation layer between your service and another system (often a legacy one) so that the other system's model does not "leak" into yours. For example, a new Orders service calls the old ERP through an adapter that converts ERP's cryptic fields into your clean domain objects.</p>`}
]
},

{
id:'decomposition', cat:'fund', name:'Decomposition & Strangler Fig Migration',
alias:'How to break a system into services, and how to move from a monolith safely, piece by piece.',
simple:`A strangler fig is a vine that grows around an old tree until the tree is fully replaced. You do the same with a monolith: put a router in front, build one new service at a time, send that feature's traffic to the new service, and slowly the old app has nothing left to do.`,
intent:`<p><b>Ways to decompose:</b></p>
<p><b>By business capability</b> – what the business does: Order Management, Billing, Shipping. <b>By subdomain (DDD)</b> – core/supporting/generic subdomains. <b>By transaction/volatility</b> – split parts that change often or scale very differently. Avoid splitting by technical layer (a "database service", a "UI service") – that creates tight coupling.</p>
<p><b>Strangler Fig pattern</b> for migration: never do a big-bang rewrite. Put a facade (API gateway / reverse proxy) in front of the monolith, extract one capability, route its URLs to the new service, keep the rest going to the monolith, repeat. Start with a feature that is fairly independent and low-risk (notifications, search) to learn.</p>
<p>Data is the hardest part: the new service needs its own DB, so you often sync data with Change Data Capture (CDC) during the transition.</p>`,
how:['Put a reverse proxy / API gateway in front of the monolith (all traffic still goes to the monolith).','Pick one bounded context with few dependencies (e.g. Notifications).','Build it as a new service with its own database; sync data from the monolith (CDC or events).','Route that feature\'s URLs to the new service. Keep a quick rollback path.','Remove the dead code from the monolith. Repeat with the next capability.'],
diagram:`Phase 1                Phase 2                         Phase 3
Client                 Client                          Client
  |                      |                               |
[Proxy]                [Proxy]---/notify-->[Notify Svc] [Proxy]--> Notify Svc
  |                      |                               |-----> Order Svc
[MONOLITH]             [MONOLITH (smaller)]              |-----> User Svc
                                                         '-----> [tiny legacy]`,
lang:'nginx', codeLabel:'NGINX · STRANGLER ROUTING',
code:`# The proxy is the "strangler": new paths go to new services
upstream monolith        { server legacy-app:8080; }
upstream notification_ms { server notification-service:8080; }
upstream search_ms       { server search-service:8080; }

server {
  listen 80;

  # Extracted already -> new microservices
  location /api/notifications/ { proxy_pass http://notification_ms; }
  location /api/search/        { proxy_pass http://search_ms; }

  # Everything else still handled by the monolith
  location / { proxy_pass http://monolith; }
}`,
examples:[
  {title:'Amazon.com', body:'Amazon moved from its "Obidos" monolith to services gradually over years, extracting capabilities while the site stayed live. No big-bang rewrite.'},
  {title:'Airbnb', body:'Airbnb migrated from its Rails monolith ("Monorail") to services in stages, first extracting data services and then product services behind a routing layer, keeping the monolith running throughout.'},
  {title:'Typical enterprise path', body:'A retailer extracts Search first (read-only, easy to scale with Elasticsearch), then Notifications, then Payments, leaving the tightly-knit Order logic for last once the team has learned the new tooling.'}
],
useWhen:['Migrating a live production monolith with low risk','You need to deliver business value during the migration, not after'],
avoidWhen:['Big-bang rewrites: they almost always take longer than planned and freeze feature work','Extracting the most tangled core module first'],
qa:[
  {q:'How would you migrate a monolith to microservices?', a:`<p>Incrementally using the <b>Strangler Fig</b> pattern: add a routing layer, identify bounded contexts, extract the least-coupled capability first, give it its own data store (sync via CDC or events during transition), route traffic, remove the old code, repeat. Invest in CI/CD, monitoring and tracing first. Measure and keep a rollback plan for every step.</p>`},
  {q:'What are the ways to decompose an application?', a:`<ul><li>By business capability (Orders, Billing)</li><li>By DDD subdomain / bounded context</li><li>By scaling or change-frequency needs</li></ul><p>Avoid splitting by technical layer, which creates services that must always change together.</p>`},
  {q:'What is Change Data Capture (CDC)?', a:`<p>Reading a database's transaction log (e.g. MySQL binlog, Postgres WAL) and publishing each row change as an event, usually with <b>Debezium</b> into Kafka. It lets a new service stay in sync with the monolith's tables without changing monolith code.</p>`}
]
}

);

// ============ COMMUNICATION ============
{
id:'rest-grpc', cat:'comm', name:'Synchronous: REST vs gRPC',
alias:'Request/response calls where the caller waits for the answer.',
simple:`Synchronous communication is like a <b>phone call</b>: you ask a question and wait on the line until you get an answer. REST is like speaking plain English (easy for everyone, a bit wordy). gRPC is like speaking in agreed short codes (very fast, but both sides need the codebook, the .proto file).`,
intent:`<p><b>REST</b> uses HTTP verbs (GET, POST, PUT, PATCH, DELETE) on resources (<code>/orders/42</code>) with JSON bodies. It is human-readable, works in every browser and language, and is the default for public APIs.</p>
<p><b>gRPC</b> (from Google) uses <b>HTTP/2</b> and <b>Protocol Buffers</b> (binary). You define the service in a <code>.proto</code> file and generate client/server code. It is 5–10x smaller on the wire, supports streaming (client, server and bidirectional) and strong typing. It is ideal for internal service-to-service calls.</p>
<p>Downside of any sync call: <b>temporal coupling</b>. If the called service is slow or down, the caller is slow or fails too. Chains of sync calls (A→B→C→D) multiply latency and failure probability, so always add timeouts, retries and circuit breakers.</p>`,
table:{head:['Aspect','REST','gRPC'],rows:[
  ['Transport','HTTP/1.1 or 2','HTTP/2 only'],
  ['Payload','JSON (text)','Protobuf (binary, compact)'],
  ['Contract','OpenAPI/Swagger (optional)','.proto file (required, code generated)'],
  ['Streaming','Not native (use SSE/WebSocket)','Client, server & bidirectional'],
  ['Browser support','Native','Needs gRPC-Web proxy'],
  ['Best for','Public/external APIs, simple CRUD','Internal high-throughput, low-latency calls']
]},
lang:'protobuf', codeLabel:'PROTOBUF · gRPC CONTRACT',
code:`// inventory.proto  -- the shared "codebook" for both sides
syntax = "proto3";
package inventory;

service InventoryService {
  rpc CheckStock (StockRequest) returns (StockReply);            // unary
  rpc WatchStock (StockRequest) returns (stream StockReply);     // server streaming
}

message StockRequest { string sku = 1; }
message StockReply   { string sku = 1; int32 available = 2; }

// ---- The same call as REST would be ----
// GET /inventory/SKU-123   ->  200 {"sku":"SKU-123","available":17}`,
examples:[
  {title:'Public APIs use REST', body:'Stripe, GitHub and Twitter/X expose REST+JSON because every developer, language and tool (curl, Postman, browsers) can use it without generated code.'},
  {title:'Internal calls use gRPC', body:'Google uses Stubby/gRPC internally for billions of calls per second. Netflix, Square and Dropbox use gRPC between backend services for lower latency and strict contracts.'},
  {title:'Checkout flow', body:'On checkout, the Order service synchronously calls Inventory ("is SKU-123 in stock?") because it needs the answer before it can continue. That is a good fit for sync; sending the confirmation email is not, and should be async.'}
],
useWhen:['The caller needs an immediate answer to continue (validation, reads)','Public APIs (REST) or internal high-performance APIs (gRPC)'],
avoidWhen:['Long chains of sync calls across many services','Work that can happen later (emails, analytics): use async messaging'],
qa:[
  {q:'REST vs gRPC: when would you choose which?', a:`<p>REST for public/external APIs, browser clients and simple CRUD where readability and wide compatibility matter. gRPC for internal service-to-service calls needing low latency, high throughput, streaming and strict typed contracts.</p>`},
  {q:'What is idempotency in REST? Which methods are idempotent?', a:`<p>An operation is idempotent if doing it many times has the same effect as doing it once. GET, PUT, DELETE, HEAD, OPTIONS are idempotent; POST is not (two POSTs create two orders). To make POST safe to retry, clients send an <code>Idempotency-Key</code> header and the server remembers processed keys.</p>`},
  {q:'How do you version APIs?', a:`<p>URI versioning (<code>/v1/orders</code>), header versioning (<code>Accept: application/vnd.shop.v2+json</code>) or query param. Prefer backward-compatible changes (only add optional fields). In protobuf, never reuse field numbers; add new fields with new numbers.</p>`},
  {q:'What is the problem with long synchronous call chains?', a:`<p>Latency adds up and availability multiplies down: if 5 services each have 99.9% availability, the chain is about 99.5%. One slow service blocks threads in all callers and can cascade into a full outage. Mitigate with timeouts, circuit breakers, caching, and async events.</p>`}
]
},

{
id:'async-messaging', cat:'comm', name:'Asynchronous Messaging & Event-Driven',
alias:'Services communicate by sending messages/events through a broker, without waiting for a reply.',
simple:`Async is like <b>WhatsApp instead of a phone call</b>. You send the message and continue with your day. The other person reads it when they are free. If their phone is off, the message waits and is delivered later. Nobody is blocked.`,
intent:`<p>A <b>message broker</b> (Kafka, RabbitMQ, AWS SQS/SNS) sits between services. The producer publishes a message; consumers process it when ready. This gives <b>loose coupling</b> (producer does not know who consumes), <b>resilience</b> (messages wait if a consumer is down) and <b>load levelling</b> (spikes are buffered).</p>
<p><b>Two styles:</b> <b>Point-to-point queue</b> – each message is processed by exactly one consumer (task queue: "resize this image"). <b>Publish/Subscribe</b> – each event goes to every subscriber ("OrderPlaced" is consumed by Inventory, Email and Analytics).</p>
<p><b>Commands vs Events:</b> a command asks for something ("ChargeCard"); an event states a fact that already happened ("PaymentCompleted", past tense).</p>
<p><b>Delivery guarantees:</b> <i>at-most-once</i> (may lose), <i>at-least-once</i> (may duplicate; most common, so consumers must be idempotent), <i>exactly-once</i> (hard; Kafka supports it within Kafka via transactions).</p>`,
diagram:`                         +--> [Inventory Svc]  reserve stock
[Order Svc] --OrderPlaced-->  KAFKA topic "orders"  --+--> [Email Svc]      send confirmation
   (producer, returns 202     (durable log,           +--> [Analytics Svc]  update dashboards
    immediately)               partitions)             (each is its own consumer group)`,
lang:'python', codeLabel:'PYTHON · KAFKA PRODUCER / CONSUMER',
code:`# producer -- order service
from kafka import KafkaProducer
import json
producer = KafkaProducer(bootstrap_servers="kafka:9092",
                         value_serializer=lambda v: json.dumps(v).encode(),
                         acks="all")   # wait for replicas: no data loss

producer.send("orders", key=b"order-42",   # same key -> same partition -> ordered
              value={"type": "OrderPlaced", "order_id": 42, "total": 999})

# consumer -- email service (its own consumer group)
from kafka import KafkaConsumer
consumer = KafkaConsumer("orders", bootstrap_servers="kafka:9092",
                         group_id="email-service", enable_auto_commit=False)
for msg in consumer:
    event = json.loads(msg.value)
    if already_processed(event["order_id"]):   # idempotent consumer
        consumer.commit(); continue
    send_confirmation_email(event)
    mark_processed(event["order_id"])
    consumer.commit()                           # commit offset only after success`,
examples:[
  {title:'LinkedIn and Kafka', body:'Kafka was created at LinkedIn to move activity events (page views, likes, connections) to dozens of downstream systems. It now handles trillions of messages per day there.'},
  {title:'Uber trip events', body:'When a trip ends, a "TripCompleted" event is published. Payments charges the rider, driver earnings are updated, receipts are emailed, and fraud checks run, all in parallel and independently.'},
  {title:'Flipkart/Amazon flash sales', body:'During Big Billion Days-style sales, orders are accepted quickly and pushed to queues. Downstream fulfilment processes them at its own pace, so a spike of 10x traffic does not crash warehouse systems.'}
],
useWhen:['The caller does not need the result immediately','One event must fan out to many consumers','You need to absorb traffic spikes or decouple availability'],
avoidWhen:['User needs an instant answer (e.g. login check)','Simple systems where a broker adds more ops cost than value'],
qa:[
  {q:'Kafka vs RabbitMQ?', a:`<p><b>Kafka</b> is a distributed, partitioned, append-only <b>log</b>. Messages are kept for a retention period and can be replayed; consumers track offsets. Great for high-throughput event streaming, event sourcing and analytics. <b>RabbitMQ</b> is a traditional <b>message broker</b> with flexible routing (exchanges, routing keys); messages are removed once acknowledged. Great for task queues and complex routing with lower volume.</p>`},
  {q:'How do you guarantee message ordering in Kafka?', a:`<p>Ordering is guaranteed only <b>within a partition</b>. Use a message key (e.g. <code>order_id</code>) so all events of one entity go to the same partition. Within a consumer group, each partition is read by one consumer, preserving order.</p>`},
  {q:'What is an idempotent consumer and why do we need it?', a:`<p>With at-least-once delivery, a message can arrive twice (e.g. consumer crashed after processing but before committing the offset). An idempotent consumer records processed message IDs (or uses upserts) so processing the same message again has no extra effect, e.g. the customer is not charged twice.</p>`},
  {q:'What is a Dead Letter Queue (DLQ)?', a:`<p>A separate queue where messages go after failing processing N times (bad format, bug). This stops one "poison" message from blocking the queue forever. Teams monitor the DLQ, fix the issue and replay the messages.</p>`}
]
},

{
id:'api-gateway', cat:'comm', name:'API Gateway',
alias:'A single entry point that routes client requests to the right service and handles cross-cutting concerns.',
simple:`An API Gateway is the <b>hotel reception desk</b>. Guests don't wander into the kitchen or laundry; they go to reception, which checks their room key (auth), and forwards the request to housekeeping, room service or the spa.`,
intent:`<p>Without a gateway, a mobile app would need to know the address of every service, handle auth with each, and make many calls. The gateway gives clients <b>one URL</b> and takes care of <b>cross-cutting concerns</b> in one place:</p>
<p>• <b>Routing</b> (<code>/orders/**</code> → Order Service) • <b>Authentication</b> (validate JWT once) • <b>Rate limiting & throttling</b> • <b>SSL/TLS termination</b> • <b>Request aggregation</b> (combine 3 service calls into 1 response) • <b>Protocol translation</b> (REST outside, gRPC inside) • <b>Caching, logging, metrics, CORS</b>.</p>
<p>Risk: it can become a <b>single point of failure</b> and a bottleneck, so run multiple instances behind a load balancer and keep business logic out of it.</p>`,
diagram:`  Mobile / Web / Partner
           |
     [ API GATEWAY ]  auth · rate-limit · TLS · routing · logging
       /     |      \\
  /users  /orders  /payments
     |       |        |
 [User]  [Order]  [Payment]   (internal network, not exposed)`,
lang:'yaml', codeLabel:'YAML · SPRING CLOUD GATEWAY',
code:`spring:
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: lb://ORDER-SERVICE          # lb:// = load-balanced via service discovery
          predicates:
            - Path=/api/orders/**

  {title:'Netflix Zuul', body:'Netflix built Zuul as the front door for all streaming devices. It handles routing, auth, dynamic traffic shifting for canary tests and load shedding when a region is under stress.'},
  {title:'AWS API Gateway + Lambda', body:'Many serverless apps put AWS API Gateway in front of Lambda functions. It provides API keys, usage plans (rate limits per customer), request validation and throttling without any servers.'},
  {title:'Kong / NGINX at enterprises', body:'Banks and telecoms use Kong or NGINX as a gateway to expose internal services to partners with OAuth2, per-partner quotas and audit logs configured as plugins.'}
],
useWhen:['Multiple client types calling many backend services','You want auth, rate limiting and TLS handled in one consistent place'],

qa:[
  {q:'What is the role of an API Gateway?', a:`<p>Single entry point for clients. It routes requests to services and handles cross-cutting concerns: authentication, rate limiting, TLS termination, request aggregation, protocol translation, caching, logging and monitoring. It hides the internal service structure from clients.</p>`},
  {q:'API Gateway vs Load Balancer vs Service Mesh?', a:`<p><b>Load balancer</b>: spreads traffic across instances of one service (L4/L7). <b>API Gateway</b>: north-south traffic (client → system), app-level concerns like auth, routing by path, rate limits. <b>Service mesh</b>: east-west traffic (service → service), handled by sidecar proxies: mTLS, retries, traffic splitting, telemetry.</p>`},
  {q:'How do you avoid the gateway being a single point of failure?', a:`<p>Run several stateless gateway instances across availability zones behind a cloud load balancer, keep rate-limit state in a shared store (Redis), use health checks and autoscaling, and keep the gateway thin.</p>`}
]
},

{
id:'bff', cat:'comm', name:'Backend for Frontend (BFF)',
alias:'A separate, tailored gateway/backend for each type of client (web, mobile, TV).',
simple:`A restaurant has one kitchen but different menus: a kids' menu, a full dinner menu and a room-service menu. Each menu (BFF) is designed for its audience, but all orders go to the same kitchen (microservices).`,
intent:`<p>A single generic API often fits nobody well: the mobile app wants small payloads (slow network, small screen), the web app wants rich data, and a smart TV wants something else. A <b>BFF</b> is a thin backend per client type that calls the downstream services, <b>aggregates and shapes</b> the data exactly as that UI needs it, and is usually owned by the <b>same team that builds the frontend</b>.</p>
<p>Benefits: fewer round trips from the device, client-specific optimisations, and frontend teams can change their API without negotiating with every other client team. Cost: some duplicated logic across BFFs, so keep them thin and put shared business logic in services.</p>`,
diagram:`[iOS/Android]      [Web Browser]       [Smart TV]
      |                   |                   |
 [Mobile BFF]         [Web BFF]           [TV BFF]
 small JSON,          rich pages,         10-foot UI,
 fewer fields         SEO data            big images
      \\                   |                  /
       +--------+---------+---------+-------+
                |         |         |
            [Catalog] [Profile] [Recommendations]`,
lang:'javascript', codeLabel:'NODE.JS · MOBILE BFF',
code:`// mobile-bff/routes/home.js
// One call from the phone -> 3 parallel calls inside the data centre
app.get("/mobile/home", async (req, res) => {
  const userId = req.user.id;
  const [profile, recs, cart] = await Promise.all([
    fetch("http://profile-svc/users/" + userId).then(r => r.json()),
    fetch("http://reco-svc/recommendations?user=" + userId + "&limit=10").then(r => r.json()),
    fetch("http://cart-svc/carts/" + userId).then(r => r.json()),

  // Shape the response for a small screen: only what the app shows
  res.json({

  });
});`,
examples:[
  {title:'SoundCloud', body:'SoundCloud popularised the BFF term. Their mobile apps needed different data shapes than the web app, so each client got its own backend layer maintained by the client team.'},
  {title:'Netflix device adapters', body:'Netflix supports thousands of device types. Device teams write adapter scripts on the API layer that fetch and shape data specifically for TVs, phones or game consoles.'},
  {title:'Banking apps', body:'A bank\'s mobile BFF returns a compact dashboard (balance + last 5 transactions) in one call, while the internet-banking web BFF returns full statements, charts and PDF links.'}
],
useWhen:['Clients with clearly different needs (mobile vs web vs partner)','Separate frontend teams wanting API autonomy'],
avoidWhen:['Only one client type','BFFs start duplicating business rules; move those into services'],
qa:[
  {q:'What is the BFF pattern and why use it?', a:`<p>A dedicated backend layer per frontend type that aggregates and tailors data from microservices. It reduces chatty calls from devices, optimises payload size for each client, and lets frontend teams evolve their API independently.</p>`},
  {q:'BFF vs API Gateway?', a:`<p>A generic API gateway is one entry point for all clients and handles cross-cutting concerns. BFFs are client-specific and handle aggregation/shaping. They are often combined: gateway (auth, rate limiting) in front of several BFFs.</p>`},
  {q:'Could GraphQL replace BFFs?', a:`<p>Partly. GraphQL lets each client ask for exactly the fields it needs from one endpoint, which removes a lot of BFF work. Many companies use a GraphQL gateway (e.g. Apollo Federation) instead of per-client BFFs, though BFFs are still used for client-specific orchestration and security.</p>`}
]
},

{
id:'service-discovery', cat:'comm', name:'Service Discovery & Registry',
alias:'How services find each other\'s network address when instances come and go dynamically.',
simple:`In the cloud, service instances are like food trucks: they move around and their number changes every hour. A <b>service registry</b> is the live map app that tells you where every truck is right now. You ask "where is the payment truck?" and get a current address.`,
intent:`<p>With autoscaling and containers, IP addresses change constantly, so you can't hard-code them. A <b>Service Registry</b> (Eureka, Consul, etcd, ZooKeeper, or Kubernetes' own API) stores the live list of instances. Instances <b>register</b> on startup, send <b>heartbeats</b>, and are removed when they stop.</p>
<p><b>Client-side discovery:</b> the client asks the registry for instances and picks one itself (load balances locally). Example: Netflix Eureka + Ribbon/Spring Cloud LoadBalancer. Fewer hops, but discovery logic in every client.</p>
<p><b>Server-side discovery:</b> the client calls a router/load balancer, which looks up the registry. Example: AWS ALB, Kubernetes Service (kube-proxy). Clients stay simple.</p>
<p>In Kubernetes you usually just call <code>http://payment-service</code>: the cluster DNS resolves it to a stable virtual IP and kube-proxy spreads traffic across healthy pods.</p>`,
diagram:`CLIENT-SIDE                          SERVER-SIDE
[Order Svc] --1.where is payment?--> [Registry]     [Order Svc] --> [Load Balancer] --> [Registry]
     |      <--2.[10.0.1.5, 10.0.1.9]--                                  |
     '--3.call 10.0.1.9 directly--> [Payment #2]                         '--> [Payment #1/#2/#3]
Instances register + heartbeat to the registry on startup.`,
lang:'yaml', codeLabel:'YAML · KUBERNETES SERVICE (BUILT-IN DISCOVERY)',
code:`apiVersion: v1
kind: Service
metadata:
  name: payment-service        # DNS name: payment-service.default.svc.cluster.local
spec:
  selector:
    app: payment               # all healthy pods with this label are endpoints
  ports:
    - port: 80
      targetPort: 8080
---
# Any other pod simply calls:  http://payment-service/charge
# Kubernetes DNS + kube-proxy do discovery and load balancing.
# Only pods passing their readinessProbe receive traffic.`,
examples:[
  {title:'Netflix Eureka', body:'Netflix built Eureka for AWS, where instances were constantly replaced. Each service registers itself, and clients cache the registry so calls still work even if Eureka is briefly unavailable (favouring availability, AP in CAP terms).'},
  {title:'HashiCorp Consul', body:'Companies running across VMs and multiple data centres use Consul for discovery plus health checks and a key/value store for config. It is also used as a registry for non-Kubernetes workloads.'},
  {title:'Kubernetes DNS', body:'In Kubernetes, discovery is built in. A team deploying a new version of "cart-service" does not update any config in callers; the Service name stays the same while pods behind it change.'}
],
useWhen:['Instances scale up/down or move (containers, autoscaling groups)','Any system with more than a handful of services'],
avoidWhen:['Hard-coding IPs or hostnames in config files','Building your own registry when your platform (Kubernetes, cloud LB) already provides one'],
qa:[
  {q:'What is service discovery and why is it needed?', a:`<p>A mechanism for services to find the current network locations of other services. It is needed because in dynamic environments (containers, autoscaling) instances start, stop and move all the time, so static IPs don't work.</p>`},
  {q:'Client-side vs server-side discovery?', a:`<p>Client-side: the client queries the registry and chooses an instance (e.g. Eureka + client load balancer); fewer network hops but logic in each client/language. Server-side: the client calls a load balancer/router which queries the registry (e.g. Kubernetes Service, AWS ALB); simpler clients, extra hop.</p>`},
  {q:'What happens if the service registry goes down?', a:`<p>Well-designed clients cache the last known registry data and keep working. Registries themselves run as clusters (Eureka peers, Consul with Raft consensus, etcd) so one node failing is fine.</p>`}
]
},

{
id:'load-balancing', cat:'comm', name:'Load Balancing',
alias:'Spreading incoming requests across multiple healthy instances of a service.',
simple:`At a supermarket with 6 checkout counters, a staff member directs each new customer to a free counter. That person is the load balancer. If a counter closes (instance dies), nobody gets sent there.`,
intent:`<p>A load balancer distributes traffic so no instance is overloaded, and removes unhealthy instances using <b>health checks</b>.</p>
<p><b>L4 (transport)</b> balancers route by IP/port (TCP/UDP) – very fast, no content awareness (AWS NLB). <b>L7 (application)</b> balancers understand HTTP – route by path, header, cookie; can do TLS termination (AWS ALB, NGINX, Envoy).</p>
<p><b>Algorithms:</b> Round Robin (take turns), Weighted Round Robin (bigger servers get more), Least Connections (send to the least busy), Least Response Time, IP Hash / <b>Consistent Hashing</b> (same client/key → same server, useful for caches and sticky sessions), Random with two choices (pick 2, use the less loaded).</p>`,
table:{head:['Algorithm','How it works','Good for'],rows:[
  ['Round Robin','1 → 2 → 3 → 1 …','Identical instances, similar requests'],
  ['Weighted RR','Instance with weight 3 gets 3x traffic','Mixed instance sizes, canary (95/5)'],
  ['Least Connections','Pick instance with fewest active connections','Long-lived or uneven requests'],
  ['IP / Consistent Hash','hash(key) → instance on a ring','Cache affinity, sticky sessions, sharding'],
]},
lang:'nginx', codeLabel:'NGINX · L7 LOAD BALANCER',
code:`upstream order_service {
    least_conn;                             # algorithm
    server 10.0.1.11:8080 weight=3;         # bigger machine
    server 10.0.1.12:8080;
    server 10.0.1.13:8080 max_fails=3 fail_timeout=30s;   # passive health check
    server 10.0.1.14:8080 backup;           # only used if others are down
}

server {
    listen 443 ssl;                         # TLS terminated here (L7)
    location /api/orders/ {
        proxy_pass http://order_service;
        proxy_next_upstream error timeout http_503;   # try another instance
    }
}`,
examples:[
  {title:'AWS ALB + Auto Scaling', body:'An e-commerce site runs 4 to 40 instances of the Product service. The Application Load Balancer health-checks /health every 10 seconds and automatically sends traffic to new instances as autoscaling adds them.'},
  {title:'Consistent hashing in caches', body:'Memcached/Redis client libraries and Amazon DynamoDB use consistent hashing so that adding a node only moves a small fraction of keys instead of reshuffling everything.'},
  {title:'Weighted canary release', body:'A team routes 95% of traffic to v1 and 5% to v2 using weighted load balancing. If v2 error rate stays low, weights shift to 50/50 and then 0/100.'}
],
useWhen:['Any service with more than one instance','Need zero-downtime deploys and automatic removal of bad instances'],
avoidWhen:['Relying on sticky sessions for correctness; make services stateless instead'],
qa:[
  {q:'L4 vs L7 load balancer?', a:`<p>L4 works on TCP/UDP (IP + port), is extremely fast and protocol-agnostic but cannot see URLs or headers. L7 understands HTTP/gRPC, so it can route by path/host/header, terminate TLS, do retries and canary splits, at slightly higher cost.</p>`},
  {q:'What is consistent hashing?', a:`<p>Keys and servers are placed on a hash ring; a key goes to the next server clockwise. When a server is added or removed, only keys in its neighbouring segment move (about 1/N), instead of almost all keys as with <code>hash % N</code>. Virtual nodes smooth out uneven distribution.</p>`},
  {q:'Why are sticky sessions discouraged?', a:`<p>They tie a user to one instance, causing uneven load, and the user loses the session if that instance dies. Better: stateless services with session data in Redis or in a signed token (JWT).</p>`}
]
}

);
