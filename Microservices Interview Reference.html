avoidWhen:['Putting sensitive data in JWT payloads (it is only Base64, readable by anyone)','Long-lived access tokens without a revocation strategy','Each service implementing its own login/password storage'],
qa:[
  {q:'How do you secure microservices?', a:`<p>Centralised identity provider with OAuth2/OIDC; JWT validation at the gateway; fine-grained authorization in each service; mTLS for service-to-service traffic; least-privilege service accounts; secrets in a vault; network policies; input validation; rate limiting; audit logging; dependency and image scanning in CI.</p>`},
  {q:'What is a JWT and how is it validated?', a:`<p>A compact token with header, payload (claims) and signature. Validation: check the signature using the issuer's public key (RS256) or shared secret (HS256), check <code>exp</code>/<code>nbf</code>, <code>iss</code> and <code>aud</code>, and reject the <code>none</code> algorithm. No call to the auth server is needed.</p>`},
  {q:'How do you revoke a JWT?', a:`<p>JWTs are valid until expiry, so keep access tokens short-lived (5–15 min) and revoke the refresh token. For immediate revocation, keep a small deny-list of token IDs (<code>jti</code>) in Redis checked at the gateway, or use opaque tokens with introspection for high-risk operations.</p>`},
  {q:'OAuth2 vs OpenID Connect?', a:`<p>OAuth2 is about <b>authorization</b>: granting an app limited access to resources via access tokens. OIDC adds <b>authentication</b> on top: an ID token (JWT) with the user's identity, plus a standard userinfo endpoint.</p>`}
]
},

{
id:'service-security', cat:'sec', name:'Service-to-Service Security (mTLS, Zero Trust, Secrets)',
alias:'Never trust the internal network: every service proves its identity, traffic is encrypted, secrets are managed.',
simple:`Old model: a castle with a moat. Once inside the walls, anyone can go anywhere. <b>Zero trust</b>: every room has its own lock and guard, and even staff show their badge at every door. mTLS is both sides showing badges to each other.`,
intent:`<p><b>Zero Trust</b>: don't assume internal traffic is safe. An attacker who gets into one pod shouldn't be able to call every other service.</p>
<p><b>mTLS (mutual TLS)</b>: in normal TLS only the server shows a certificate; in mTLS <b>both</b> client and server present certificates, so each verifies the other's identity and all traffic is encrypted. Managing certificates by hand is painful, so a <b>service mesh</b> (Istio, Linkerd) issues and rotates them automatically (SPIFFE identities).</p>
<p><b>Authorization policies</b>: "only order-service may call payment-service on POST /charge". <b>Kubernetes NetworkPolicies</b> restrict which pods can talk at the network level.</p>
<p><b>Secrets management</b>: never store passwords/API keys in code or images. Use <b>HashiCorp Vault</b>, AWS Secrets Manager, Azure Key Vault, or Kubernetes Secrets (encrypted at rest). Prefer short-lived, dynamic credentials and rotation.</p>`,
lang:'yaml', codeLabel:'YAML · ISTIO mTLS + AUTHORIZATION POLICY',
code:`# 1) Require mTLS for every service in the namespace
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata: { name: default, namespace: shop }
spec:
  mtls: { mode: STRICT }
---
# 2) Only the order-service identity may call payment-service's /charge
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata: { name: payment-allow-order, namespace: shop }
spec:
  selector: { matchLabels: { app: payment } }
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/shop/sa/order-service"]
      to:
        - operation: { methods: ["POST"], paths: ["/charge"] }`,
examples:[
  {title:'Google BeyondCorp', body:'Google moved to a zero-trust model (BeyondCorp) after the 2009 "Operation Aurora" attacks: access decisions are based on device and user identity, not on being inside the corporate network.'},
  {title:'Service mesh in fintech', body:'Payment companies must encrypt cardholder data in transit (PCI DSS). Using Istio with STRICT mTLS gives encryption and identity on every internal call without changing application code.'},
  {title:'Vault dynamic DB credentials', body:'With HashiCorp Vault, each service instance gets a unique database username/password valid for 1 hour. If a pod is compromised, the leaked credentials expire quickly and can be traced to that instance.'}
],
useWhen:['Any production microservice system, especially with sensitive data','Compliance requirements (PCI DSS, HIPAA, SOC 2)'],
avoidWhen:['Relying only on "it\'s inside the VPC" for security','Secrets in environment files committed to git or baked into Docker images'],
qa:[
  {q:'What is mTLS and why use it between services?', a:`<p>Mutual TLS: both client and server present and verify certificates. It provides encryption in transit and strong service identity, which is the basis for authorization policies like "only service A may call service B". Service meshes automate certificate issuance and rotation.</p>`},
  {q:'How do you manage secrets in microservices?', a:`<p>Use a secrets manager (Vault, AWS Secrets Manager, Kubernetes Secrets with encryption at rest, sealed-secrets/External Secrets operator). Inject at runtime as env vars or mounted files, grant least-privilege access per service, rotate regularly, audit access, and never commit secrets to git.</p>`}
]
},

// ============ DEPLOYMENT & OPERATIONS ============
{
id:'docker', cat:'ops', name:'Containers & Docker',
alias:'Package a service with everything it needs so it runs the same everywhere.',
simple:`Before shipping containers, every port loaded sacks, barrels and boxes differently. Standard containers made cargo fit any ship, train or truck. A Docker container does the same for software: your service plus its runtime and libraries in one standard box that runs on any machine.`,
intent:`<p>A <b>Docker image</b> is a read-only template (built from a <code>Dockerfile</code>) containing the app, runtime and dependencies. A <b>container</b> is a running instance of an image, isolated using Linux namespaces and cgroups. Unlike VMs, containers share the host kernel, so they start in seconds and use far less memory.</p>
<p>Why it matters for microservices: each service can use a different language/version, dev = test = prod ("works on my machine" disappears), fast startup enables autoscaling, and images are immutable, versioned artifacts.</p>
<p><b>Best practices:</b> multi-stage builds (small images), minimal base images (distroless/alpine), run as non-root, one process per container, pin versions, scan images for vulnerabilities, use <code>.dockerignore</code>.</p>`,
table:{head:['Aspect','Virtual Machine','Container'],rows:[
  ['Isolation','Full guest OS per VM (hypervisor)','Shares host kernel (namespaces, cgroups)'],
  ['Size','GBs','MBs'],
  ['Startup','Minutes','Seconds or less'],
  ['Density','Few per host','Dozens to hundreds per host'],
]},
lang:'dockerfile', codeLabel:'DOCKERFILE · MULTI-STAGE BUILD',
code:`# ---- Stage 1: build (has compilers, dev deps) ----
FROM python:3.12-slim AS build
WORKDIR /app
COPY requirements.txt .
RUN pip install --no-cache-dir --prefix=/install -r requirements.txt
COPY src/ ./src

# ---- Stage 2: runtime (small, no build tools) ----
FROM python:3.12-slim
WORKDIR /app
COPY --from=build /install /usr/local
COPY --from=build /app/src ./src
RUN useradd -r -u 1001 appuser
USER appuser                          # never run as root
ENV PORT=8080
EXPOSE 8080
HEALTHCHECK CMD python -c "import urllib.request;urllib.request.urlopen('http://localhost:8080/health/live')"
CMD ["gunicorn", "-w", "4", "-b", "0.0.0.0:8080", "src.app:app"]

# docker build -t shop/order-service:2.4.1 .
# docker run -e DATABASE_URL=postgres://... -p 8080:8080 shop/order-service:2.4.1`,
examples:[
  {title:'Local development with docker-compose', body:'A developer runs "docker compose up" and gets the order service, PostgreSQL, Redis and Kafka running locally in the same versions as production, in under a minute.'},
  {title:'Spotify and Google', body:'Google has run everything in containers for over a decade (Borg). Spotify moved its backend services to containers and then Kubernetes to standardise deployment across hundreds of teams.'},
  {title:'Immutable release artifacts', body:'CI builds image order-service:2.4.1 once, scans it, and promotes that exact image through staging to production. Rollback = redeploy image 2.4.0.'}
],
useWhen:['Packaging and shipping any microservice'],
avoidWhen:['Storing data inside the container filesystem (it disappears on restart; use volumes/managed DBs)','Huge images with build tools and secrets baked in'],
qa:[
  {q:'Container vs Virtual Machine?', a:`<p>VMs virtualise hardware and run a full guest OS each; strong isolation but heavy. Containers virtualise the OS: they share the host kernel and isolate processes with namespaces and cgroups, so they are lightweight, start fast and allow high density.</p>`},
  {q:'What is a multi-stage Docker build?', a:`<p>A Dockerfile with several FROM stages; you compile/build in one stage and copy only the final artifacts into a slim runtime stage. The result is a much smaller and more secure image without compilers or source code.</p>`},
  {q:'Image vs container?', a:`<p>An image is an immutable, layered template. A container is a running (or stopped) instance of an image with its own writable layer, like a class vs an object.</p>`}
]
},

{
id:'kubernetes', cat:'ops', name:'Kubernetes (Container Orchestration)',
alias:'The platform that runs, heals, scales and connects containers across a cluster of machines.',
simple:`If containers are shipping boxes, Kubernetes is the <b>port authority</b>. You say "I want 5 boxes of the order service running at all times". It decides which ship (node) each goes on, replaces any box that falls into the sea, and adds more boxes when it gets busy.`,
intent:`<p>Kubernetes (K8s) is <b>declarative</b>: you describe the desired state in YAML, and controllers continuously work to make reality match (<b>reconciliation loop</b>).</p>
<p><b>Key objects:</b> <b>Pod</b> – smallest unit, one or more containers sharing network/storage. <b>Deployment</b> – manages ReplicaSets, rolling updates and rollbacks for stateless apps. <b>Service</b> – stable DNS name + virtual IP load-balancing across pods. <b>Ingress</b> – HTTP routing from outside into Services. <b>ConfigMap / Secret</b> – configuration. <b>StatefulSet</b> – stable identity/storage for databases, Kafka. <b>HPA</b> – Horizontal Pod Autoscaler. <b>Namespace</b> – logical isolation.</p>
<p><b>Architecture:</b> Control plane (API server, etcd, scheduler, controller manager) + worker nodes (kubelet, kube-proxy, container runtime).</p>
<p>What K8s gives microservices for free: service discovery, load balancing, self-healing (restart failed pods), rolling deploys, autoscaling, config and secret injection, resource limits.</p>`,
lang:'yaml', codeLabel:'YAML · DEPLOYMENT + HPA',
code:`apiVersion: apps/v1
kind: Deployment
metadata: { name: order-service }
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # zero-downtime deploy
  selector: { matchLabels: { app: order } }
  template:
    metadata: { labels: { app: order } }
    spec:
      containers:
        - name: order
          image: shop/order-service:2.4.1
          envFrom: [{ configMapRef: { name: order-config } }]
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "512Mi" }
          readinessProbe: { httpGet: { path: /health/ready, port: 8080 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: order-service }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: order-service }
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }`,
examples:[
  {title:'Google Borg to Kubernetes', body:'Kubernetes was open-sourced by Google in 2014 based on lessons from Borg, which ran billions of containers per week inside Google.'},
  {title:'Festival sale autoscaling', body:'An online retailer\'s HPA scales the checkout service from 5 to 60 pods as CPU rises during a midnight sale, and the Cluster Autoscaler adds nodes when pods can\'t be scheduled.'},
  {title:'Self-healing at night', body:'A node crashes at 3 a.m. Kubernetes notices the pods are gone and reschedules them onto healthy nodes within a minute. Nobody gets paged.'}
],
useWhen:['Running many containerised services that need scaling, healing and standard deploys'],
avoidWhen:['Very small systems where a PaaS (Heroku, Cloud Run, App Service) or plain VMs are simpler','Teams without capacity to operate it (consider managed EKS/GKE/AKS)'],
qa:[
  {q:'What is a Pod? Why not just a container?', a:`<p>A Pod is the smallest deployable unit: one or more tightly coupled containers sharing the same network namespace (localhost, IP) and volumes, scheduled together. It allows patterns like sidecars (a proxy or log shipper next to the app).</p>`},
  {q:'Deployment vs StatefulSet?', a:`<p>Deployment is for stateless apps: pods are interchangeable with random names. StatefulSet gives each pod a stable name (db-0, db-1), stable network identity and its own persistent volume, with ordered startup, for databases, Kafka, ZooKeeper.</p>`},
  {q:'How does a rolling update work in Kubernetes?', a:`<p>The Deployment creates a new ReplicaSet with the new image and gradually scales it up while scaling the old one down, respecting maxSurge/maxUnavailable. New pods get traffic only when readiness passes. <code>kubectl rollout undo</code> rolls back.</p>`}
]
},

{
id:'service-mesh', cat:'ops', name:'Service Mesh & Sidecar',
alias:'A dedicated infrastructure layer (proxies next to each service) that handles service-to-service networking.',
simple:`Every diplomat (service) gets a personal interpreter and bodyguard (the <b>sidecar proxy</b>) who handles translation, security checks and keeps notes of every conversation. The diplomat just talks; the helpers deal with the rest. The mesh control plane is the embassy that gives all helpers their instructions.`,
intent:`<p>Retries, timeouts, circuit breaking, mTLS, and tracing are needed by every service. Implementing them in each language's library is repetitive. A <b>service mesh</b> moves them out of application code into a <b>sidecar proxy</b> (usually <b>Envoy</b>) injected into every pod. All traffic in and out of the service goes through its sidecar.</p>
<p><b>Data plane</b> = the proxies that carry traffic. <b>Control plane</b> (Istio's istiod, Linkerd's control plane) = configures all proxies, issues certificates, collects telemetry.</p>
<p><b>Features:</b> mTLS and identity, traffic splitting (canary, A/B), retries/timeouts/circuit breaking, fault injection for testing, uniform metrics and tracing, authorization policies.</p>
<p><b>Costs:</b> extra latency (~1–3 ms per hop), memory per sidecar, operational complexity. Newer "sidecar-less" modes (Istio Ambient, Cilium) reduce the overhead.</p>`,
diagram:`  Pod: order-service                    Pod: payment-service
 +----------------------------+         +----------------------------+
 | [order app] <-> [Envoy] ===|==mTLS===|=> [Envoy] <-> [payment app] |
 +----------------------------+         +----------------------------+
          ^ config, certs, policies               ^
          '------------ [ Control plane: istiod ]--'`,
lang:'yaml', codeLabel:'YAML · ISTIO CANARY + RETRIES',
code:`apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata: { name: payment }
spec:
  hosts: [payment-service]
  http:
    - route:
        - destination: { host: payment-service, subset: v1 }
          weight: 90
        - destination: { host: payment-service, subset: v2 }   # canary
          weight: 10
      timeout: 2s
      retries: { attempts: 3, perTryTimeout: 500ms, retryOn: "5xx,connect-failure" }
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata: { name: payment }
spec:
  host: payment-service
  subsets:
    - { name: v1, labels: { version: v1 } }
    - { name: v2, labels: { version: v2 } }
  trafficPolicy:
    outlierDetection:            # circuit breaking: eject bad pods
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s`,
examples:[
  {title:'Lyft and Envoy', body:'Lyft created Envoy to solve inconsistent networking behaviour across its polyglot services. Envoy became the data plane for Istio and many API gateways.'},
  {title:'Canary without code changes', body:'A team sends 10% of traffic to payment v2 by changing only the VirtualService weights; if Grafana shows error rate rising, they set weight back to 0 in seconds.'},
  {title:'Chaos testing with fault injection', body:'Teams use Istio fault injection to add 2-second delays to the inventory service in staging and confirm the checkout\'s timeouts and fallbacks behave correctly.'}
],
useWhen:['Many services in multiple languages needing consistent security, traffic control and telemetry','Zero-trust requirements (mTLS everywhere)'],
avoidWhen:['A handful of services where libraries or the gateway are enough','Teams not ready for the operational complexity'],
qa:[
  {q:'What is a service mesh and what problems does it solve?', a:`<p>An infrastructure layer of sidecar proxies plus a control plane that manages service-to-service communication. It provides mTLS, traffic management (canary, retries, timeouts, circuit breaking), observability and policies consistently, without changing application code.</p>`},
  {q:'What is the sidecar pattern?', a:`<p>Deploying a helper container alongside the main application container in the same pod, sharing its network and lifecycle, to add capabilities like proxying, log shipping or config reloading without modifying the app.</p>`},
  {q:'Service mesh vs API gateway?', a:`<p>The gateway manages north-south traffic (external clients entering), focusing on auth, rate limiting, API management. The mesh manages east-west traffic (between services), focusing on mTLS, reliability and telemetry. They are complementary.</p>`}
]
},

{
id:'config', cat:'ops', name:'Externalized Configuration & Feature Flags',
alias:'Keep configuration outside the code so the same build runs in every environment and can change without redeploying.',
simple:`A TV remote's settings (volume, channel) aren't soldered into the TV at the factory. You change them at home. Likewise, database URLs, limits and on/off switches for features should be set from outside the app, per environment.`,
intent:`<p><b>Externalized configuration</b>: the same image uses different config in dev/staging/prod via env vars, config files mounted at runtime, or a <b>config server</b> (Spring Cloud Config backed by git, Consul KV, AWS AppConfig/Parameter Store, Kubernetes ConfigMaps).</p>
<p>Benefits: no rebuild for config changes, central management and audit, some systems support live refresh without restart.</p>
<p><b>Feature flags</b> (LaunchDarkly, Unleash, Flagsmith) are runtime switches: deploy code dark, then turn a feature on for 1% of users, internal staff or one country. This separates <b>deployment</b> (shipping code) from <b>release</b> (exposing features), and gives an instant "kill switch".</p>`,
lang:'yaml', codeLabel:'YAML · CONFIGMAP + SECRET',
code:`apiVersion: v1
kind: ConfigMap
metadata: { name: order-config }
data:
  PAYMENT_URL: "http://payment-service"
  MAX_ITEMS_PER_ORDER: "50"
  FEATURE_EXPRESS_CHECKOUT: "false"     # simple flag; flip + restart / or use a flag service
---
apiVersion: v1
kind: Secret
metadata: { name: order-secrets }
type: Opaque
stringData:
  DATABASE_URL: "postgres://order:***@orders-db:5432/orders"   # injected by Vault/ESO in practice

# Python: read at startup
# MAX_ITEMS = int(os.environ["MAX_ITEMS_PER_ORDER"])
# if flags.is_enabled("express-checkout", user_id=user.id): show_express_button()`,
examples:[
  {title:'Facebook Gatekeeper', body:'Facebook ships code to production continuously with features hidden behind Gatekeeper flags, then gradually enables them for employees, a small percentage of users and finally everyone.'},
  {title:'Kill switch during an incident', body:'A new recommendation widget overloads the database on launch day. Ops turns off the feature flag in seconds, with no rollback or redeploy needed.'},
  {title:'Environment-specific config', body:'The same payment-service image points at the payment provider\'s sandbox URL in staging and live URL in production, only via configuration.'}
],
useWhen:['Always for environment-specific values','Gradual rollouts, A/B tests and kill switches (feature flags)'],
avoidWhen:['Hard-coding URLs or credentials in code','Leaving hundreds of stale feature flags in the code (clean them up)'],
qa:[
  {q:'How do you manage configuration across many microservices?', a:`<p>Externalize it: env vars / ConfigMaps for simple settings, a central config server or parameter store for shared and versioned config, a secrets manager for credentials, and feature flag service for runtime toggles. Keep config in version control (GitOps) with audit and review.</p>`},
  {q:'What is the difference between deployment and release?', a:`<p>Deployment is putting new code on production servers. Release is making a feature available to users. Feature flags decouple them, so you can deploy anytime and release gradually or instantly roll back behaviour.</p>`}
]
},

{
id:'deploy-strategies', cat:'ops', name:'CI/CD & Deployment Strategies',
alias:'Automated pipelines plus rolling, blue-green and canary releases for safe, frequent deploys.',
simple:`Changing a restaurant's menu: <b>rolling</b> – change one table's menu at a time. <b>Blue-green</b> – set up a whole new dining room, then move everyone over at once (and move back if the food is bad). <b>Canary</b> – let a few regulars taste the new dish first before offering it to everyone.`,
intent:`<p><b>CI (Continuous Integration)</b>: every commit is built and tested automatically. <b>CD (Continuous Delivery/Deployment)</b>: every passing build is deployable (delivery) or deployed automatically (deployment). Each microservice has its <b>own pipeline</b>: build → unit tests → contract tests → image build + scan → deploy to staging → integration/smoke tests → production rollout.</p>
<p><b>GitOps</b> (Argo CD, Flux): the desired state of the cluster lives in git; a controller syncs the cluster to match. Changes = pull requests.</p>`,
table:{head:['Strategy','How it works','Pros','Cons'],rows:[
  ['Rolling','Replace instances a few at a time','Default in K8s, no extra infra','Old and new run together; slower rollback'],
  ['Blue-Green','Run full new env (green) beside old (blue); switch traffic at once','Instant switch and rollback','Double infrastructure during release'],
  ['Canary','Send small % of traffic to new version, increase if metrics are good','Real users, limited blast radius','Needs good metrics and traffic control'],
  ['Shadow / Dark launch','Copy live traffic to new version, discard its responses','Zero user impact testing','Side effects must be disabled; cost'],
  ['A/B testing','Route by user segment to compare business metrics','Product experiments','Not mainly a safety mechanism'],
]},
lang:'yaml', codeLabel:'YAML · GITHUB ACTIONS PIPELINE (PER SERVICE)',
code:`name: order-service
on:
  push:
    paths: ["services/order/**"]        # only this service's pipeline runs
jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r services/order/requirements.txt
      - run: pytest services/order/tests/unit
      - run: pytest services/order/tests/contract       # Pact consumer/provider checks
      - run: docker build -t registry/shop/order:SHA services/order
      - run: trivy image registry/shop/order:SHA         # vulnerability scan
      - run: docker push registry/shop/order:SHA
      - run: ./deploy.sh staging SHA && ./smoke-test.sh staging
      - run: ./deploy.sh prod SHA --canary=10            # then auto-promote if SLOs hold`,
examples:[
  {title:'Amazon deployments', body:'Amazon reported deploying to production every 11.7 seconds on average (2011), possible only because each service has its own automated pipeline and deploys independently.'},
  {title:'Netflix Spinnaker canary analysis', body:'Netflix\'s Spinnaker with Kayenta compares metrics of the canary against a baseline cluster and automatically promotes or rolls back the release.'},
  {title:'Blue-green for a bank', body:'A bank deploys its new statement service to the "green" environment, runs smoke tests, then switches the load balancer. When an issue appears, switching back to "blue" takes seconds.'}
],
useWhen:['Every service should have its own automated pipeline','Canary/blue-green for critical, high-traffic services'],
avoidWhen:['Coordinated "release trains" where all services must deploy together (sign of a distributed monolith)','Canary without metrics to judge it'],
qa:[
  {q:'Blue-green vs canary deployment?', a:`<p>Blue-green runs two full environments and switches all traffic at once, with instant rollback, but needs double capacity. Canary gradually shifts a small percentage of real traffic to the new version while monitoring metrics, limiting the blast radius, but needs traffic splitting and good observability.</p>`},
  {q:'How do you handle database schema changes with zero downtime?', a:`<p>Use the <b>expand and contract</b> (parallel change) approach: 1) add new column/table (backward compatible), 2) deploy code that writes both and reads new, 3) backfill data, 4) switch reads fully, 5) remove the old column in a later release. Never make a breaking schema change in the same deploy as the code change.</p>`},
  {q:'What is GitOps?', a:`<p>Using git as the single source of truth for infrastructure and deployments. A controller (Argo CD/Flux) continuously reconciles the cluster to match the git repo. Deploys and rollbacks become git commits and reverts, with full audit history.</p>`}
]
},

{
id:'testing', cat:'ops', name:'Testing Microservices',
alias:'Test pyramid, contract testing and chaos engineering for systems of independent services.',
simple:`Two companies make a plug and a socket separately. Instead of meeting every time to test, they agree on a written spec ("3 pins, 5 mm apart"). Each tests its own product against the spec. That's contract testing: services test against the agreed API, not against each other's live systems.`,
intent:`<p><b>Test pyramid</b> (many at the bottom, few at the top): <b>Unit</b> tests (fast, business logic) → <b>Integration</b> tests (service + its real DB/queue via Testcontainers) → <b>Component</b> tests (one service with dependencies mocked, e.g. WireMock) → <b>Contract</b> tests → a few <b>end-to-end</b> tests (slow, flaky, expensive).</p>
<p><b>Consumer-Driven Contract testing</b> (Pact, Spring Cloud Contract): the consumer writes what it expects from the provider (request + response shape). This generates a contract file. The provider's CI verifies it still satisfies all consumer contracts. A breaking change fails the provider's build before deploy, without needing a shared test environment.</p>
<p><b>Chaos engineering</b>: deliberately inject failures (kill pods, add latency) in controlled experiments to prove resilience (Netflix Chaos Monkey, Gremlin, LitmusChaos).</p>`,
lang:'python', codeLabel:'PYTHON · PACT CONSUMER TEST',
code:`# In ORDER service (consumer): what we expect from USER service (provider)
from pact import Consumer, Provider

pact = Consumer("order-service").has_pact_with(Provider("user-service"), port=1234)

def test_get_user_for_order():
    (pact
     .given("user 7 exists")
     .upon_receiving("a request for user 7")
     .with_request("GET", "/users/7")
     .will_respond_with(200, body={"id": 7, "name": "Riya", "tier": "GOLD"}))

    with pact:                                   # runs a mock provider on :1234
        user = UserClient("http://localhost:1234").get(7)
        assert user.tier == "GOLD"

# -> writes order-service-user-service.json (the contract) to the Pact Broker.
# USER service CI then replays it against the real provider:
#   pact-verifier --provider-base-url=http://localhost:8080 --pact-url=<broker>/...
# If user-service renames "tier" -> "level", ITS build fails before release.`,
examples:[
  {title:'Netflix Chaos Monkey', body:'Chaos Monkey randomly terminates production instances during business hours, forcing every team to build services that survive instance loss. The Simian Army later added latency and region-failure tests.'},
  {title:'Contract tests replace shared staging', body:'A company with 80 services had a constantly broken shared staging environment. Moving to Pact contracts let each team verify compatibility in their own pipeline and cut release blockers dramatically.'},
  {title:'Testcontainers', body:'Integration tests spin up real PostgreSQL and Kafka in throwaway Docker containers, so tests match production behaviour instead of relying on in-memory fakes.'}
],
useWhen:['Many services owned by different teams with API dependencies','Critical systems that must prove resilience (chaos testing)'],
avoidWhen:['Relying mainly on large end-to-end test suites (slow, flaky, hard to debug)'],
qa:[
  {q:'How do you test microservices?', a:`<p>Follow the test pyramid: many unit tests, integration tests with real infrastructure in containers, component tests with mocked dependencies, consumer-driven contract tests between services, a small number of end-to-end tests for critical journeys, plus canary releases, synthetic monitoring and chaos experiments in production.</p>`},
  {q:'What is consumer-driven contract testing?', a:`<p>Consumers define their expectations of a provider's API in contracts; providers verify all contracts in their CI. It catches breaking API changes early and independently, without deploying all services together.</p>`},
  {q:'What is chaos engineering?', a:`<p>Running controlled experiments that inject failures (killing instances, network latency, dependency outages) to verify the system behaves as expected and to find weaknesses before real incidents do. Start small, in staging, with a clear hypothesis and abort conditions.</p>`}
]
},

{
id:'scaling', cat:'ops', name:'Scalability & Autoscaling',
alias:'Handling more load by adding instances (horizontal) rather than bigger machines (vertical).',
simple:`A busy bank can hire a faster cashier (<b>vertical scaling</b>: there's a limit to how fast one person can be) or open more counters (<b>horizontal scaling</b>: add as many as needed). Microservices let you open more counters only for the busy queue, e.g. more "deposit" counters on salary day.`,
intent:`<p><b>Vertical scaling (scale up)</b>: bigger CPU/RAM. Simple, but has a ceiling and a single point of failure. <b>Horizontal scaling (scale out)</b>: more instances behind a load balancer. Needs <b>stateless</b> services.</p>
<p>Microservices allow <b>independent scaling</b>: scale Search to 50 instances and Admin to 2.</p>
<p><b>Scale Cube</b> (from "The Art of Scalability"): <b>X-axis</b> – clone instances (horizontal duplication). <b>Y-axis</b> – split by function (microservices). <b>Z-axis</b> – split by data (sharding by customer/region).</p>
<p><b>Autoscaling</b>: Kubernetes HPA (pods by CPU/memory/custom metrics like queue length), KEDA (event-driven scaling, even to zero), Cluster Autoscaler/Karpenter (nodes), cloud Auto Scaling Groups.</p>
<p><b>Database scaling</b> is usually the real bottleneck: read replicas, caching, sharding/partitioning, CQRS, moving to horizontally scalable stores.</p>`,
diagram:`            Z-axis: split by DATA (shard by customer/region)
             ^
             |
             |
             +--------------> X-axis: CLONE instances (more copies behind LB)
            /
           /
          v
 Y-axis: split by FUNCTION (microservices: orders, users, search)`,
lang:'yaml', codeLabel:'YAML · KEDA SCALE ON KAFKA LAG',
code:`apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: email-worker }
spec:
  scaleTargetRef: { name: email-worker }    # a Deployment
  minReplicaCount: 0                        # scale to zero when idle
  maxReplicaCount: 50
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: email-service
        topic: orders
        lagThreshold: "100"                 # ~1 pod per 100 pending messages`,
examples:[
  {title:'Flash sale independent scaling', body:'During a sale, Product Search and Checkout scale to 10x while the Seller Admin service stays at 2 instances, a big cost saving compared to scaling a monolith 10x.'},
  {title:'Sharding by region (Z-axis)', body:'A ride-hailing company partitions trip data by city, so the Bengaluru and Mumbai shards scale and fail independently.'},
  {title:'Queue-based worker autoscaling', body:'An image-processing service scales workers based on the number of pending jobs using KEDA, from 0 at night to 40 when users upload photos in the evening.'}
],
useWhen:['Variable or growing traffic','Different components with very different load patterns'],
avoidWhen:['Scaling stateless services while the shared database stays the bottleneck (fix the data layer too)','Autoscaling without max limits (runaway cost) or without load testing'],
qa:[
  {q:'Horizontal vs vertical scaling?', a:`<p>Vertical: add CPU/RAM to one machine, simple but limited and a single point of failure. Horizontal: add more machines/instances, nearly unlimited and fault tolerant, but requires stateless design, load balancing and distributed data handling.</p>`},
  {q:'How would you scale a microservice that is slow under load?', a:`<p>First measure (tracing/metrics) to find the bottleneck. Then: make it stateless and scale out with HPA, add caching, optimise DB queries/indexes, add read replicas, move slow work to async queues, use connection pooling, and shard data if the DB is the limit.</p>`},
  {q:'What is the Scale Cube?', a:`<p>A model with three scaling axes: X (clone instances behind a load balancer), Y (functional decomposition into services), Z (data partitioning/sharding). Microservices are Y-axis scaling; they are usually combined with X and sometimes Z.</p>`}
]
}

);
</script>
<script>
TOPICS.push(

// ============ INTERVIEW TOOLKIT ============
{
id:'anti-patterns', cat:'int', name:'Anti-Patterns & Common Pitfalls',
alias:'Mistakes that give you all the cost of microservices and none of the benefits.',
simple:`Splitting a house into separate flats only helps if each flat has its own kitchen and door. If everyone still shares one kitchen and must walk through each other's rooms, you've just built a very awkward house. That is a "distributed monolith".`,
intent:`<p>Interviewers often ask "what can go wrong?". Knowing anti-patterns shows real experience.</p>`,
table:{head:['Anti-pattern','Symptom','Fix'],rows:[
  ['Distributed monolith','Services must be deployed together; one change touches 5 services','Re-draw boundaries by business capability; merge chatty services; async events'],
  ['Shared database','Many services read/write the same tables; schema change breaks others','Database per service; APIs/events; CDC during migration'],
  ['Chatty services','One page makes 50 sync calls; high latency','Coarser APIs, aggregation (BFF/GraphQL), caching, local data copies via events'],
  ['Nano-services','Hundreds of tiny services, each a few functions; huge ops overhead','Merge into meaningful bounded contexts'],
  ['Sync call chains','A→B→C→D→E; one slow service stalls all','Async messaging, timeouts, circuit breakers, fewer hops'],
  ['No observability','Nobody can tell where a request failed','Correlation IDs, tracing, centralised logs, RED metrics from day one'],
  ['Shared libraries with business logic','Updating a common lib forces all services to redeploy','Share only technical utilities; duplicate small logic rather than couple'],
  ['Big-bang migration','Multi-year rewrite with frozen features','Strangler Fig, incremental extraction'],
  ['Ignoring data consistency','Lost or duplicated orders after failures','Saga, Outbox, idempotent consumers'],
  ['Microservices first','Startup with 3 devs and 25 services','Modular monolith first; extract when needed'],
]},
lang:'', code:'',
examples:[
  {title:'Segment\'s move back to a monolith', body:'Segment split its event destinations into 140+ microservices, one per integration. Shared-library changes and operational load became overwhelming, so they merged them back into one service ("Goodbye Microservices", 2018) and improved productivity.'},
  {title:'Amazon Prime Video monitoring', body:'In 2023 the Prime Video team published how moving a video-quality monitoring pipeline from distributed serverless components to a single process cut infrastructure cost by about 90%. Right-sizing matters.'},
  {title:'Shared "customers" table', body:'A retailer\'s five services all used one customers table. Adding a mandatory column for GDPR consent broke three services in production, a classic hidden coupling through the database.'}
],
useWhen:['Reviewing a design; answering "what challenges did you face?"'],
avoidWhen:['Dismissing monoliths entirely; a well-structured monolith is a valid, often better, choice'],
qa:[
  {q:'What is a distributed monolith?', a:`<p>A system split into services that are still tightly coupled (shared DB, synchronous chains, lock-step releases). It has the network complexity of microservices plus the coupling of a monolith: the worst of both worlds.</p>`},
  {q:'What challenges did you face with microservices? (behavioural)', a:`<p>Structure it with STAR: e.g. <i>Situation</i>: checkout latency spikes. <i>Task</i>: find root cause across 8 services. <i>Action</i>: added OpenTelemetry tracing, found a synchronous chain to a slow pricing service, added caching and a circuit breaker, moved non-critical calls to async events. <i>Result</i>: p99 went from 2.1 s to 450 ms. Real numbers make answers memorable.</p>`},
  {q:'Should microservices share code?', a:`<p>Share technical, stable utilities (logging setup, tracing, auth client) as versioned libraries. Avoid sharing domain/business logic or data models, because it couples release cycles. Some duplication is an acceptable price for independence ("prefer duplication over the wrong abstraction").</p>`}
]
},

{
id:'system-design', cat:'int', name:'Design Walkthrough: E-Commerce Order Platform',
alias:'Putting everything together, the way you would answer a system design interview question.',
simple:`This is the "final exam" page. We design an Amazon/Flipkart-like order flow step by step and point to each pattern you learned: gateway, services, database per service, events, saga, outbox, cache, circuit breakers, tracing and autoscaling.`,
intent:`<p><b>How to answer any microservices design question (framework):</b></p>
<p><b>1. Clarify requirements</b> – functional (browse, cart, checkout, pay, track) and non-functional (e.g. 10k orders/min at peak, 99.95% availability, p99 &lt; 500 ms, payments must never double-charge). <b>2. Identify services</b> by bounded context. <b>3. Choose communication</b> – sync for queries that need an answer now, async events for everything else. <b>4. Data</b> – database per service, pick stores. <b>5. Consistency</b> – saga for checkout, outbox for events, idempotency for payments. <b>6. Resilience</b> – timeouts, retries, circuit breakers, bulkheads. <b>7. Scale</b> – stateless + HPA, caching, CQRS read models. <b>8. Security & observability</b>. <b>9. Trade-offs</b> – always say what you gave up.</p>`,
how:['Client calls POST /checkout through the API Gateway (JWT validated, rate limited).','Order Service creates the order as PENDING in PostgreSQL and writes OrderCreated to the outbox in the same transaction. Returns 202 Accepted + order ID.','The outbox relay publishes OrderCreated to Kafka. The Checkout Saga orchestrator starts.','Saga asks Inventory to reserve stock (Redis-backed counters with DB as source of truth).','Saga asks Payment to charge, using the order ID as idempotency key; Payment calls the external gateway behind a circuit breaker.','On success: Order → CONFIRMED, event OrderConfirmed. Shipping, Notification and Analytics consume it independently.','On failure at any step: compensations run (release stock, refund), Order → CANCELLED, user notified.','Order history page is served by a CQRS read model built from order, payment and shipping events.'],
diagram:`                 [Web / Mobile]
                       |
          [CDN]   [API Gateway]  auth · rate limit · TLS
                   /    |     \\
          [Catalog]  [Cart]  [Order Svc]----(PostgreSQL + outbox)
          Mongo+ES   Redis        |
                                  v  outbox relay / Debezium
                         ===== KAFKA (orders, payments, shipments) =====
                          |            |             |            |
                [Saga Orchestrator] [Notification] [Analytics] [Order History
                   |        |                                   read model]
             [Inventory] [Payment]--circuit breaker-->[External Payment Gateway]
               MySQL      PostgreSQL
  Cross-cutting: Kubernetes + HPA · Istio mTLS · OpenTelemetry → Jaeger · Prometheus/Grafana · ELK`,
lang:'', code:'',
table:{head:['Decision','Choice','Why / trade-off'],rows:[
  ['Checkout call','Async (202 Accepted) + status polling/websocket','Survives spikes; user sees "processing" briefly'],
  ['Consistency','Orchestrated saga','Clear flow and compensation; orchestrator must be HA'],
  ['Payment safety','Idempotency key = order ID','Retries never double-charge'],
  ['Events','Transactional outbox → Kafka','No lost events; consumers must be idempotent'],
  ['Inventory','Strongly consistent reservation','Avoid overselling; small latency cost'],
  ['Catalog/search','Cache + Elasticsearch read model','Fast reads; data may lag a few seconds'],
  ['Failures','Timeouts, retries w/ jitter, breakers, bulkheads','Contain failures; fallback UX needed'],
]},
examples:[
  {title:'Flash sale spike', body:'Traffic jumps 20x. Gateway rate limits bots, Catalog is served from CDN/cache, checkout requests queue in Kafka, and HPA scales Order and Payment. Orders complete a bit slower instead of the site crashing.'},
  {title:'Payment provider outage', body:'The external gateway starts timing out. The circuit breaker opens; the saga keeps orders PENDING_PAYMENT and retries later, or offers another provider. Browsing and cart continue normally.'},
  {title:'Duplicate message', body:'Kafka redelivers PaymentCompleted after a consumer restart. The Order service sees the event ID in processed_events and ignores it; the customer gets one confirmation email, not two.'}
],
useWhen:['Any "design X using microservices" interview question: reuse this structure'],
avoidWhen:['Jumping into boxes and arrows before clarifying requirements and scale','Presenting a design without stating trade-offs'],
qa:[
  {q:'Design a food delivery system with microservices (outline).', a:`<p>Services: User, Restaurant/Menu, Cart, Order, Payment, Delivery/Dispatch (rider matching), Location (live GPS in Redis geo), Notification, Rating. Gateway + mobile BFF. Order saga (order → payment → restaurant accept → assign rider). Kafka for events; WebSockets for live tracking; ETA service; CQRS for order history; autoscaling at lunch/dinner peaks; circuit breakers for payment and maps APIs.</p>`},
  {q:'How do you prevent overselling the last item?', a:`<p>Keep inventory reservation strongly consistent in the Inventory service: atomic conditional update (<code>UPDATE stock SET qty = qty - 1 WHERE sku = ? AND qty &gt;= 1</code>) or Redis DECR with a check, reserve with a TTL during checkout, confirm on payment, release on failure/timeout via saga compensation.</p>`},
  {q:'Why return 202 Accepted for checkout?', a:`<p>The order is accepted and will be processed asynchronously through the saga. It decouples the user request from slow downstream steps (payment, inventory), absorbs spikes, and the client can poll <code>/orders/{id}</code> or receive a push/websocket update.</p>`}
]
},

{
id:'cheat-sheet', cat:'int', name:'Pattern Cheat Sheet: Problem → Solution',
alias:'A one-page map from the problem the interviewer describes to the pattern you should name.',
simple:`When an interviewer describes a pain, they are usually fishing for a pattern name. This table is your quick lookup before the interview.`,
intent:`<p>Read the left column as the question, and answer with the pattern plus one sentence of why. Click a topic in the sidebar for the full explanation.</p>`,
table:{head:['Problem','Pattern / Tool','One-line reason'],rows:[
  ['Clients need one entry point, auth, rate limits','API Gateway','Centralises cross-cutting concerns'],
  ['Mobile and web need different data shapes','Backend for Frontend (BFF) / GraphQL','Tailored aggregation per client'],
  ['Service IPs keep changing','Service Discovery (K8s DNS, Eureka, Consul)','Dynamic lookup of healthy instances'],
  ['Transaction across multiple services','Saga (choreography / orchestration)','Local transactions + compensations'],
  ['Save to DB and publish event reliably','Transactional Outbox + CDC','Atomic write, at-least-once publish'],
  ['Messages may arrive twice','Idempotent consumer / Idempotency-Key','Duplicates have no extra effect'],
  ['Reads and writes need different models','CQRS','Separate, independently scaled models'],
  ['Need full audit history / time travel','Event Sourcing','State = replay of immutable events'],
  ['Join data owned by several services','API Composition / CQRS view','No shared database'],
  ['Dependency is failing, callers pile up','Circuit Breaker + Timeout','Fail fast, fallback, let it recover'],
  ['Transient network errors','Retry with exponential backoff + jitter','Recover without retry storms'],
  ['One slow dependency exhausts threads','Bulkhead','Isolate resource pools'],
  ['Too many requests / abuse','Rate limiting (token bucket)','Protect capacity, fair use'],
  ['Where did the request fail?','Distributed tracing + correlation IDs','End-to-end request view'],
  ['Is the service healthy? Ready for traffic?','Liveness / readiness probes','Auto restart and routing'],
  ['Migrating off a monolith','Strangler Fig + Anti-Corruption Layer','Incremental, low-risk'],
  ['Service-to-service trust','mTLS, service mesh, zero trust','Identity + encryption for every call'],
  ['Consistent retries/mTLS/telemetry in all languages','Service Mesh (sidecar)','Infra concerns out of app code'],
  ['Release safely','Canary / Blue-green + feature flags','Limit blast radius, fast rollback'],
  ['Prevent API breaking changes','Consumer-driven contract tests','Catch breaks in provider CI'],
  ['Slow repeated reads','Cache-aside with Redis','Lower latency and DB load'],
  ['Spiky workloads','Message queue + autoscaling (HPA/KEDA)','Buffer and scale on demand'],
]},
lang:'', code:'',
examples:[
  {title:'"Our checkout sometimes charges twice"', body:'Answer: idempotency keys on the payment API, idempotent consumers with a processed-events table, and the outbox pattern for reliable events.'},
  {title:'"When recommendations are slow, the whole product page is slow"', body:'Answer: timeouts, circuit breaker with a fallback (best sellers), bulkhead for the recommendations call, and possibly loading that widget asynchronously on the client.'},
  {title:'"We can\'t tell why an order failed"', body:'Answer: correlation IDs propagated through HTTP and Kafka headers, OpenTelemetry tracing, structured JSON logs centralised in ELK/Loki, and RED metrics with alerts.'}
],
useWhen:['Last-minute revision before the interview'],
avoidWhen:['Naming a pattern without explaining the trade-off it brings'],
qa:[
  {q:'List the most important microservice design patterns.', a:`<p><b>Decomposition:</b> by business capability, by subdomain, Strangler Fig. <b>Integration:</b> API Gateway, BFF, Aggregator. <b>Data:</b> Database per service, Saga, CQRS, Event Sourcing, Outbox. <b>Resilience:</b> Circuit Breaker, Retry, Bulkhead, Timeout, Rate Limiter. <b>Observability:</b> Log aggregation, Distributed tracing, Health check, Metrics. <b>Cross-cutting:</b> Externalized config, Service discovery, Sidecar/Service mesh. <b>Deployment:</b> Blue-green, Canary.</p>`}
]
},

{
id:'rapid-fire', cat:'int', name:'Rapid-Fire Interview Questions',
alias:'Short, crisp answers to the questions asked most often. Practise saying them out loud.',
simple:`Read each question, answer it aloud in 30 seconds, then open the card to compare. If your answer missed a key word (in bold), revisit that topic page.`,
intent:`<p>These cover the full range from junior to senior. Use the <b>Expand all</b> button for quick reading, or keep them collapsed to quiz yourself.</p>`,
lang:'', code:'', examples:[], useWhen:[], avoidWhen:[],
qa:[
  {q:'What is a microservice architecture?', a:`<p>An approach where an application is a set of <b>small, independently deployable services</b>, each owning a <b>business capability and its own data</b>, communicating via APIs or events.</p>`},
  {q:'Monolith vs microservices, in one sentence each?', a:`<p>Monolith: one codebase and deployable, simple to start, hard to scale teams. Microservices: many independent services, scalable teams and components, but <b>operationally complex</b> and distributed.</p>`},
  {q:'How do microservices communicate?', a:`<p><b>Synchronously</b> (REST, gRPC) when an immediate answer is needed, and <b>asynchronously</b> (Kafka, RabbitMQ, SQS) via events/messages for decoupling and resilience.</p>`},
  {q:'What is an API Gateway?', a:`<p>A <b>single entry point</b> that routes requests and handles auth, rate limiting, TLS, aggregation and logging.</p>`},
  {q:'What is service discovery?', a:`<p>A <b>registry</b> of live service instances so services find each other dynamically (Eureka, Consul, Kubernetes DNS). Client-side or server-side.</p>`},
  {q:'How do you handle distributed transactions?', a:`<p><b>Saga pattern</b> with compensating transactions, plus <b>Outbox</b> and <b>idempotency</b>. Avoid 2PC.</p>`},
  {q:'What is eventual consistency?', a:`<p>Data across services/replicas may be temporarily different but <b>converges</b> once updates propagate.</p>`},
  {q:'What is a circuit breaker?', a:`<p>Stops calling a failing service (<b>Closed → Open → Half-open</b>), fails fast with a fallback, and tests recovery.</p>`},
  {q:'What is CQRS?', a:`<p>Separate <b>write (command)</b> and <b>read (query)</b> models, often with different data stores, synced via events.</p>`},
  {q:'What is Event Sourcing?', a:`<p>Persist <b>every state change as an immutable event</b>; rebuild state by replaying events; snapshots for speed.</p>`},
  {q:'What is idempotency and why does it matter?', a:`<p>Repeating an operation has the <b>same effect as doing it once</b>. Needed because retries and at-least-once delivery cause duplicates.</p>`},
  {q:'What is the difference between orchestration and choreography?', a:`<p>Orchestration: a <b>central coordinator</b> directs steps. Choreography: services <b>react to events</b> with no central controller.</p>`},
  {q:'How do you secure microservices?', a:`<p><b>OAuth2/OIDC + JWT</b> at the gateway, per-service authorization, <b>mTLS</b> between services, secrets manager, network policies, least privilege.</p>`},
  {q:'How do you monitor microservices?', a:`<p>Three pillars: <b>logs</b> (ELK/Loki with correlation IDs), <b>metrics</b> (Prometheus/Grafana, RED, SLOs), <b>traces</b> (OpenTelemetry + Jaeger).</p>`},
  {q:'Why database per service?', a:`<p><b>Loose coupling</b> and independent deployment/scaling; polyglot persistence. Cost: no joins, need sagas/eventual consistency.</p>`},
  {q:'What is a sidecar?', a:`<p>A helper container in the <b>same pod</b> as the app (e.g. Envoy proxy, log shipper) adding capabilities without code changes.</p>`},
  {q:'What is a service mesh?', a:`<p>Sidecar proxies + control plane (Istio, Linkerd) providing <b>mTLS, traffic control, retries and telemetry</b> for service-to-service calls.</p>`},
  {q:'Liveness vs readiness?', a:`<p>Liveness fail → <b>restart</b>. Readiness fail → <b>stop sending traffic</b>.</p>`},
  {q:'Blue-green vs canary?', a:`<p>Blue-green: <b>switch all traffic</b> between two full environments. Canary: <b>gradually shift a small %</b> of traffic while watching metrics.</p>`},
  {q:'What is the Strangler Fig pattern?', a:`<p>Migrate a monolith <b>incrementally</b> by routing features one by one to new services until the old system can be retired.</p>`},
  {q:'What is a bounded context?', a:`<p>A DDD boundary where a model and its terms have <b>one consistent meaning</b>; typically maps to one microservice.</p>`},
  {q:'Kafka vs RabbitMQ?', a:`<p>Kafka: distributed <b>log</b>, high throughput, retention and replay, ordering per partition. RabbitMQ: <b>broker/queue</b> with flexible routing, messages removed after ack.</p>`},
  {q:'What is the CAP theorem?', a:`<p>During a <b>network partition</b>, a distributed system must choose <b>Consistency or Availability</b>.</p>`},
  {q:'How do you version APIs without breaking clients?', a:`<p>Make <b>backward-compatible</b> changes (add optional fields), version via URI or headers for breaking changes, run old and new versions side by side, use <b>contract tests</b>.</p>`},
  {q:'What is a Dead Letter Queue?', a:`<p>A queue for messages that <b>repeatedly fail</b> processing, so they don't block others and can be inspected and replayed.</p>`},
  {q:'How do you handle a slow downstream service?', a:`<p><b>Timeouts</b>, <b>circuit breaker</b> with fallback, <b>bulkhead</b>, caching, and moving the call to <b>async</b> if possible.</p>`},
  {q:'How do you do zero-downtime database migrations?', a:`<p><b>Expand and contract</b>: add new schema compatibly, dual-write, backfill, switch reads, drop old later.</p>`},
  {q:'What is the 12-factor app?', a:`<p>A methodology for cloud-native apps: <b>config in env</b>, stateless processes, logs to stdout, disposability, dev/prod parity, and more.</p>`},
  {q:'What are the biggest drawbacks of microservices?', a:`<p><b>Operational complexity</b>, network latency and failures, <b>data consistency</b>, harder testing/debugging, infrastructure cost, and the need for mature DevOps.</p>`},
  {q:'How do you decide if a feature should be its own service?', a:`<p>Is it a distinct <b>bounded context</b>? Does it need <b>independent scaling or deployment</b>? Can one team own it? Does it have its own data? If it always changes with another service, keep them together.</p>`}
]
}

);
</script>

<script>
const CATS = {
  fund: {label:'Fundamentals',       color:'var(--c-fund)'},
  comm: {label:'Communication',      color:'var(--c-comm)'},
  data: {label:'Data Management',    color:'var(--c-data)'},
  res:  {label:'Resilience',         color:'var(--c-res)'},
  obs:  {label:'Observability',      color:'var(--c-obs)'},
  sec:  {label:'Security',           color:'var(--c-sec)'},
  ops:  {label:'Deployment & Ops',   color:'var(--c-ops)'},
  int:  {label:'Interview Toolkit',  color:'var(--c-int)'}
};
const ORDER = ['fund','comm','data','res','obs','sec','ops','int'];
TOPICS.sort((a,b)=>ORDER.indexOf(a.cat)-ORDER.indexOf(b.cat));

const STORE_KEY = 'ms-ref-revised';
let revised = new Set();
try { revised = new Set(JSON.parse(localStorage.getItem(STORE_KEY) || '[]')); } catch(e) {}
function saveRevised(){ try { localStorage.setItem(STORE_KEY, JSON.stringify([...revised])); } catch(e) {} }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function strip(s){ return String(s).replace(/<[^>]+>/g,''); }

function buildSidebar(filter){
  const q = (filter||'').trim().toLowerCase();
  const container = document.getElementById('navGroups');
  container.innerHTML = '';
  let shown = 0;
  ORDER.forEach(catKey=>{
    const items = TOPICS.filter(t=>t.cat===catKey);
    const matches = items.filter(t=> !q ||
      (t.name+' '+t.alias+' '+strip(t.intent)+' '+t.qa.map(x=>x.q).join(' ')).toLowerCase().includes(q));
    if(!matches.length) return;
    shown += matches.length;
    const group = document.createElement('div');
    group.className='nav-group';
    group.innerHTML = '<div class="nav-group-label"><span class="dot" style="background:'+CATS[catKey].color+'"></span>'+CATS[catKey].label.toUpperCase()+' ('+items.length+')</div>';
    matches.forEach(t=>{
      const el = document.createElement('div');
      el.className='nav-item';
      el.id='nav-'+t.id;
      el.tabIndex = 0;
      el.setAttribute('role','link');
      el.innerHTML = '<span class="num">'+String(items.indexOf(t)+1).padStart(2,'0')+'</span><span>'+t.name+'</span>'+(revised.has(t.id)?'<span class="tick" title="Revised">✓</span>':'');
      el.onclick = ()=>navigate(t.id);
      el.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); navigate(t.id);} };
      group.appendChild(el);
    });
    container.appendChild(group);
  });
  if(!shown) container.innerHTML = '<div class="empty">No topics match "'+esc(filter)+'".</div>';
  const cur = location.hash.replace('#','');
  const active = document.getElementById('nav-'+cur);
  if(active) active.classList.add('active');
  updateProgress();
}

function updateProgress(){
  const n = TOPICS.filter(t=>revised.has(t.id)).length;
  document.getElementById('progressText').textContent = n+' / '+TOPICS.length+' topics revised';
  document.getElementById('progressBar').style.width = (100*n/TOPICS.length)+'%';
}

function renderHome(){
  let html = '<div class="page">'+
    '<div class="cat-tag"><span class="dot" style="background:var(--accent)"></span>OVERVIEW</div>'+
    '<h2>Microservices Field Reference</h2>'+
    '<p class="alias">'+TOPICS.length+' topics · simple analogy · detailed explanation · diagram or code · 2–3 real examples · interview Q&amp;A</p>'+
    '<p class="home-intro">Each topic starts with a plain-language analogy, then goes deeper with how it works, a diagram or working code, where real companies use it, when to use or avoid it, and the interview questions you are most likely to get. Mark topics as revised to track your progress.</p>'+
    '<div class="section-label">SUGGESTED STUDY PATH</div><div class="path">'+
      '<div><b style="color:var(--c-fund)">DAY 1</b><span>Fundamentals + Communication: what, why, how services talk.</span></div>'+
      '<div><b style="color:var(--c-data)">DAY 2</b><span>Data Management: the hardest and most-asked area (Saga, CQRS, Outbox).</span></div>'+
      '<div><b style="color:var(--c-res)">DAY 3</b><span>Resilience, Observability and Security.</span></div>'+
      '<div><b style="color:var(--c-int)">DAY 4</b><span>Deployment & Ops, then the design walkthrough and rapid-fire drill.</span></div>'+
    '</div>';
  ORDER.forEach(catKey=>{
    const items = TOPICS.filter(t=>t.cat===catKey);
    html += '<div class="section-label">'+CATS[catKey].label.toUpperCase()+'</div><div class="home-grid">';
    items.forEach(t=>{
      html += '<button class="home-card" onclick="navigate(\''+t.id+'\')">'+
        '<span class="hc-cat" style="color:'+CATS[t.cat].color+'">'+CATS[t.cat].label.toUpperCase()+'</span>'+
        '<h3>'+t.name+(revised.has(t.id)?'<span class="tick">✓</span>':'')+'</h3>'+
        '<p>'+t.alias+'</p></button>';
    });
    html += '</div>';
  });
  return html+'</div>';
}

function codeBlock(code, lang, label, cls){
  const hl = lang && window.hljs && hljs.getLanguage(lang);
  const cl = hl ? 'language-'+lang : 'nohighlight';
  return '<div class="code-wrap '+(cls||'')+'"><span class="code-label">'+label+'</span><pre><code class="'+cl+'">'+esc(code)+'</code></pre></div>';
}

function renderTopic(t){
  const cat = CATS[t.cat];
  const idx = TOPICS.findIndex(x=>x.id===t.id);
  const prev = TOPICS[idx-1], next = TOPICS[idx+1];
  let h = '<div class="page">'+
    '<div class="cat-tag"><span class="dot" style="background:'+cat.color+'"></span>'+cat.label.toUpperCase()+'</div>'+
    '<h2>'+t.name+'</h2><p class="alias">'+t.alias+'</p>'+
    '<div class="simple"><span class="lbl">IN SIMPLE WORDS</span><p>'+t.simple+'</p></div>'+
    '<div class="section-label">DETAILED EXPLANATION</div><div class="intent">'+t.intent+'</div>';

  if(t.how && t.how.length){
    h += '<div class="section-label">HOW IT WORKS, STEP BY STEP</div><ol class="steps">'+t.how.map(s=>'<li><span>'+s+'</span></li>').join('')+'</ol>';
  }
  if(t.diagram){
    h += '<div class="section-label">DIAGRAM</div><div class="diagram">'+codeBlock(t.diagram,'','ARCHITECTURE','diagram')+'</div>';
  }
  if(t.table){
    h += '<div class="section-label">COMPARISON</div><div class="table-wrap"><table><thead><tr>'+
      t.table.head.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+
      t.table.rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  }
  if(t.code){
    h += '<div class="section-label">CODE EXAMPLE</div>'+codeBlock(t.code,t.lang,t.codeLabel||'CODE');
  }
  if(t.examples && t.examples.length){
    h += '<div class="section-label">REAL-WORLD EXAMPLES</div><ul class="examples">'+
      t.examples.map((ex,i)=>'<li><span class="ex-num">'+String(i+1).padStart(2,'0')+'</span><div><p class="ex-title">'+ex.title+'</p><p class="ex-body">'+ex.body+'</p></div></li>').join('')+'</ul>';
  }
  if((t.useWhen&&t.useWhen.length)||(t.avoidWhen&&t.avoidWhen.length)){
    h += '<div class="section-label">WHEN TO USE / WHEN TO AVOID</div><div class="tradeoffs">'+
      '<div class="tradeoff-box use"><h4>USE WHEN</h4><ul>'+t.useWhen.map(u=>'<li>'+u+'</li>').join('')+'</ul></div>'+
      '<div class="tradeoff-box avoid"><h4>AVOID WHEN</h4><ul>'+t.avoidWhen.map(a=>'<li>'+a+'</li>').join('')+'</ul></div></div>';
  }
  if(t.qa && t.qa.length){
    h += '<div class="section-label">INTERVIEW QUESTIONS ('+t.qa.length+')</div>'+
      '<div class="qa-tools"><button class="btn" id="qaToggle" onclick="toggleQA()">Expand all answers</button></div><div class="qa">'+
      t.qa.map((x,i)=>'<details><summary><span class="q">Q'+(i+1)+'</span><span>'+x.q+'</span><span class="chev">›</span></summary><div class="ans">'+x.a+'</div></details>').join('')+'</div>';
  }
  const done = revised.has(t.id);
  h += '<div class="page-actions"><button class="btn'+(done?' done':'')+'" id="revBtn" onclick="toggleRevised(\''+t.id+'\')">'+(done?'✓ Revised':'Mark as revised')+'</button></div>';
  h += '<div class="footer-nav">'+
    (prev?'<button onclick="navigate(\''+prev.id+'\')"><span class="dir">← PREV</span>'+prev.name+'</button>':'<span></span>')+
    (next?'<button onclick="navigate(\''+next.id+'\')" style="text-align:right"><span class="dir">NEXT →</span>'+next.name+'</button>':'<span></span>')+
    '</div></div>';
  return h;
}

function toggleQA(){
  const all = [...document.querySelectorAll('.qa details')];
  const anyClosed = all.some(d=>!d.open);
  all.forEach(d=>d.open = anyClosed);
  document.getElementById('qaToggle').textContent = anyClosed ? 'Collapse all answers' : 'Expand all answers';
}

function toggleRevised(id){
  if(revised.has(id)) revised.delete(id); else revised.add(id);
  saveRevised();
  const b = document.getElementById('revBtn');
  const done = revised.has(id);
  b.textContent = done ? '✓ Revised' : 'Mark as revised';
  b.classList.toggle('done', done);
  buildSidebar(document.getElementById('search').value);
}

function navigate(id){
  const content = document.getElementById('content');
  const t = TOPICS.find(x=>x.id===id);
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  if(!t){
    content.innerHTML = renderHome();
    document.getElementById('crumbCurrent').textContent = 'Overview';
    if(location.hash) history.replaceState(null,'',location.pathname+location.search);
  } else {
    content.innerHTML = renderTopic(t);
    const navEl = document.getElementById('nav-'+id);
    if(navEl) navEl.classList.add('active');
    document.getElementById('crumbCurrent').textContent = t.name;
    if(location.hash !== '#'+id) history.replaceState(null,'','#'+id);
    if(window.hljs) content.querySelectorAll('pre code:not(.nohighlight)').forEach(el=>hljs.highlightElement(el));
  }
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', ()=>navigate(location.hash.replace('#','')));
document.getElementById('search').addEventListener('input', e=>buildSidebar(e.target.value));

buildSidebar();
navigate(location.hash.replace('#',''));
</script>

</body></html>
