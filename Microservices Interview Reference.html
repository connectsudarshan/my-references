 "How does a mesh enable canary releases?", "a": "<p>The mesh routes traffic by weights or headers between versions of the same service, for example 95 percent to v1 and 5 percent to v2, or all requests with a test header to v2. Tools like Flagger or Argo Rollouts shift weights automatically based on metrics and roll back on errors.<\/p><p>Because routing is done by proxies, the application code does not change.<\/p>"}]}, "config": {"terms": [["Externalized configuration", "Keeping configuration outside the code and image, supplied at deploy or run time."], ["ConfigMap", "A Kubernetes object holding non-secret configuration, mounted as files or environment variables."], ["Feature flag", "A runtime switch that turns functionality on or off without redeploying."], ["Dynamic configuration", "Configuration changes picked up by running services without a restart."]], "pitfalls": [["Feature flags that are never removed.", "Give each flag an owner and an expiry, and delete it after full rollout."], ["Configuration changes with no review or rollback.", "Treat config as code: version it, review it and deploy it through a pipeline."], ["Secrets stored in ConfigMaps.", "Use Secrets or a secrets manager with encryption and access control."]], "qa": [{"q": "Why are configuration changes a common cause of outages, and how do you make them safe?", "a": "<p>They often bypass the testing and staged rollout that code changes get, and one bad value can affect every instance at once. Make them safe the same way as code: validation (schemas), review, staged rollout (one region or canary first), automatic health checks and fast rollback.<\/p><p>Many major cloud outages have been triggered by global configuration pushes, which is why progressive config rollout matters.<\/p>"}, {"q": "What kinds of feature flags exist?", "a": "<p>Release flags (hide unfinished features, short-lived), experiment flags (A/B tests), ops flags or kill switches (turn off expensive features under load) and permission flags (enable features per customer or plan).<\/p><p>They have different lifetimes and owners, so tracking the kind helps keep flag debt under control.<\/p>"}]}, "deploy-strategies": {"terms": [["Rolling update", "Gradually replacing old instances with new ones."], ["Blue-green deployment", "Running two full environments and switching traffic from the old (blue) to the new (green) at once."], ["Canary release", "Sending a small share of traffic to the new version and increasing it while metrics stay healthy."], ["Expand and contract", "Making backward-compatible schema changes in steps: add the new, migrate, then remove the old."]], "pitfalls": [["Deploying code and a breaking schema change together.", "Use expand and contract so old and new versions work with the schema during the rollout."], ["Canary judged by eye.", "Define automated success metrics (error rate, latency, business KPIs) and roll back automatically."], ["Blue-green without handling in-flight work and caches.", "Drain connections, warm caches and plan for long-running jobs before switching."]], "qa": [{"q": "What are the DORA metrics?", "a": "<p>Four measures of delivery performance from the DevOps Research and Assessment research: deployment frequency, lead time for changes, change failure rate and time to restore service.<\/p><p>They balance speed and stability, and they are a good way to judge whether a microservices setup is actually improving delivery.<\/p>"}, {"q": "How do you roll back when a release included a database migration?", "a": "<p>Design so you rarely need to: with expand and contract, the old code version still works with the expanded schema, so rolling back is just redeploying the old code. Destructive steps (dropping columns) happen only in a later release, after the new version has proven stable.<\/p><p>If data was transformed, keep the old data until the contract step, or have a tested forward-fix plan.<\/p>"}]}, "testing": {"terms": [["Test pyramid", "Many fast unit tests, fewer integration tests, and very few end-to-end tests."], ["Contract test", "A test that checks a provider still satisfies the expectations (contract) recorded by its consumers, for example with Pact."], ["Test double", "A stand-in for a real dependency: stub, mock, fake or spy."], ["Testcontainers", "A library that starts real dependencies (databases, brokers) in containers for integration tests."]], "pitfalls": [["Relying mainly on end-to-end tests across all services.", "They are slow and flaky; push most checks down to unit, component and contract tests."], ["Mocks that drift from the real service.", "Use consumer-driven contracts or run the real dependency in Testcontainers."], ["No testing in production at all.", "Add synthetic monitoring, canaries and feature-flagged dark launches."]], "qa": [{"q": "What is a component test in microservices?", "a": "<p>A test of one service in isolation, running as a real process with its real database (often via Testcontainers) but with other services replaced by stubs. It checks the service's behaviour through its API without the cost and flakiness of a full environment.<\/p><p>Together with contract tests it gives most of the confidence of end-to-end tests at a fraction of the cost.<\/p>"}, {"q": "How do you test asynchronous, event-driven flows?", "a": "<p>Publish an event into a real or containerized broker, then assert on the outcome with a polling wait (for example Awaitility) rather than fixed sleeps. Use contract tests for event schemas too (Pact supports message contracts), and test idempotency by delivering the same event twice.<\/p><p>In production, trace IDs across events make it possible to verify that flows complete end to end.<\/p>"}]}, "scaling": {"terms": [["Horizontal scaling", "Adding more instances of a service."], ["Vertical scaling", "Giving an instance more CPU or memory."], ["HPA", "Horizontal Pod Autoscaler: scales pod counts in Kubernetes based on CPU, memory or custom metrics."], ["Sharding", "Splitting data across several databases or partitions by a key so each holds a part."]], "pitfalls": [["Autoscaling stateless services while the database is the bottleneck.", "Find the real bottleneck first; adding app instances can overload a shared database further."], ["Scaling on CPU for I/O-bound or queue-driven workloads.", "Scale on queue length, lag or request rate (for example with KEDA)."], ["No scale-down stabilization.", "Use cooldowns or stabilization windows to avoid flapping."]], "qa": [{"q": "What is KEDA and when would you use it?", "a": "<p>Kubernetes Event-Driven Autoscaling: it scales deployments on external signals such as Kafka consumer lag, queue depth or cron schedules, and can scale to zero when there is no work.<\/p><p>It suits consumers and batch workers, whose load is better described by pending work than by CPU.<\/p>"}, {"q": "How do you scale the database layer in a microservices system?", "a": "<p>In order of effort: optimize queries and indexes, add caching, use read replicas for read-heavy workloads, split data by service (which microservices already do), partition large tables, and finally shard by a key or move to a distributed database.<\/p><p>Writes are the hard part; reads scale much more easily with replicas and caches.<\/p>"}]}, "anti-patterns": {"terms": [["Distributed monolith", "Services that must be deployed together because they are tightly coupled, combining the costs of both styles."], ["Chatty services", "Services that exchange many small synchronous calls to complete one operation."], ["Shared database anti-pattern", "Several services reading and writing the same tables, coupling their schemas and releases."], ["Nanoservices", "Services so small that their overhead outweighs their usefulness."]], "pitfalls": [["Fixing a distributed monolith by adding more services.", "Merge tightly coupled services back together, then re-split along real business boundaries."], ["A shared 'common' library containing domain models.", "Share only technical utilities; each service owns its own domain model."], ["Synchronous call chains five or more services deep.", "Collapse the chain, use asynchronous events, or keep local copies of needed data."]], "qa": [{"q": "How do you detect a distributed monolith?", "a": "<p>Signs: services must be released in a specific order or together; one feature change touches many services; services share database tables; an outage in one service takes down most others; and teams need cross-team meetings for routine changes.<\/p><p>The fix is usually to redraw boundaries around business capabilities and merge services that always change together.<\/p>"}, {"q": "What is the 'entity service' anti-pattern?", "a": "<p>Creating one service per database entity (CustomerService, AddressService, OrderLineService) that only offers CRUD. Every business operation then needs several synchronous calls, and business logic ends up in the callers.<\/p><p>Services should own business capabilities with behaviour (Checkout, Billing), not thin wrappers around tables.<\/p>"}]}, "system-design": {"terms": [["Idempotent checkout", "A checkout endpoint that uses an idempotency key so double clicks or retries create only one order."], ["Reservation", "Temporarily holding stock for an order with an expiry, released if payment fails or times out."], ["Back-of-the-envelope estimate", "Quick sizing (requests per second, storage, bandwidth) to justify design choices."], ["Read path vs write path", "Designing the high-volume browsing (read) path separately from the correctness-critical ordering (write) path."]], "pitfalls": [["Jumping to a service list before clarifying requirements.", "Start with functional and non-functional requirements, scale numbers and consistency needs."], ["Synchronous calls from checkout to every downstream service.", "Accept the order, return 202, and complete payment, stock and notifications through a saga."], ["No story for failure.", "For each component, say what happens when it is slow or down, and how data is reconciled."]], "qa": [{"q": "Do a back-of-the-envelope estimate for the order platform.", "a": "<p>Assume 10 million daily users, 20 page views each, and 2 percent placing an order. Reads: 200 million page views per day, about 2,300 per second on average and perhaps 10 times that at peak (around 23,000 per second), which calls for CDN and caching. Writes: 200,000 orders per day, about 2.3 per second on average, maybe 50 per second at a flash-sale peak, easily handled by a partitioned relational database.<\/p><p>The numbers show the design priority: the read path needs horizontal scale and caching, the write path needs correctness (idempotency, sagas) more than raw throughput.<\/p>"}, {"q": "How do you handle a flash sale where demand far exceeds stock?", "a": "<p>Put a queue or virtual waiting room in front of checkout to admit users at a controlled rate, keep stock counters in a fast atomic store (Redis DECR or conditional database updates) to prevent overselling, reserve stock with an expiry, and serve the product page from cache.<\/p><p>Rate limit per user to stop bots, and scale the read path ahead of time based on the known event date.<\/p>"}]}};
TOPICS.forEach(t => { const e = MS_EXTRA[t.id]; if (!e) return;
  t.terms = e.terms; t.pitfalls = e.pitfalls; t.qa = (t.qa || []).concat(e.qa); });
</script>
<script>
const CATS = {
  fund: {label:'Fundamentals',       color:'var(--c-fund)'},
  comm: {label:'Communication',      color:'var(--c-comm)'},
  data: {label:'Data Management',    color:'var(--c-data)'},
  res:  {label:'Resilience',         color:'var(--c-res)'},
  obs:  {label:'Observability',      color:'var(--c-obs)'},
  sec:  {label:'Security',           color:'var(--c-sec)'},
  ops:  {label:'Deployment & Ops',   color:'var(--c-ops)'},
  int:  {label:'Interview Toolkit',  color:'var(--c-int)'}
};
const ORDER = ['fund','comm','data','res','obs','sec','ops','int'];
TOPICS.sort((a,b)=>ORDER.indexOf(a.cat)-ORDER.indexOf(b.cat));

const STORE_KEY = 'ms-ref-revised';
let revised = new Set();
try { revised = new Set(JSON.parse(localStorage.getItem(STORE_KEY) || '[]')); } catch(e) {}
function saveRevised(){ try { localStorage.setItem(STORE_KEY, JSON.stringify([...revised])); } catch(e) {} }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function strip(s){ return String(s).replace(/<[^>]+>/g,''); }

function buildSidebar(filter){
  const q = (filter||'').trim().toLowerCase();
  const container = document.getElementById('navGroups');
  container.innerHTML = '';
  let shown = 0;
  ORDER.forEach(catKey=>{
    const items = TOPICS.filter(t=>t.cat===catKey);
    const matches = items.filter(t=> !q ||
      (t.name+' '+t.alias+' '+strip(t.intent)+' '+t.qa.map(x=>x.q).join(' ')).toLowerCase().includes(q));
    if(!matches.length) return;
    shown += matches.length;
    const group = document.createElement('div');
    group.className='nav-group';
    group.innerHTML = '<div class="nav-group-label"><span class="dot" style="background:'+CATS[catKey].color+'"></span>'+CATS[catKey].label.toUpperCase()+' ('+items.length+')</div>';
    matches.forEach(t=>{
      const el = document.createElement('div');
      el.className='nav-item';
      el.id='nav-'+t.id;
      el.tabIndex = 0;
      el.setAttribute('role','link');
      el.innerHTML = '<span class="num">'+String(items.indexOf(t)+1).padStart(2,'0')+'</span><span>'+t.name+'</span>'+(revised.has(t.id)?'<span class="tick" title="Revised">✓</span>':'');
      el.onclick = ()=>navigate(t.id);
      el.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); navigate(t.id);} };
      group.appendChild(el);
    });
    container.appendChild(group);
  });
  if(!shown) container.innerHTML = '<div class="empty">No topics match "'+esc(filter)+'".</div>';
  const cur = location.hash.replace('#','');
  const active = document.getElementById('nav-'+cur);
  if(active) active.classList.add('active');
  updateProgress();
}

function updateProgress(){
  const n = TOPICS.filter(t=>revised.has(t.id)).length;
  document.getElementById('progressText').textContent = n+' / '+TOPICS.length+' topics revised';
  document.getElementById('progressBar').style.width = (100*n/TOPICS.length)+'%';
}

function renderHome(){
  let html = '<div class="page">'+
    '<div class="cat-tag"><span class="dot" style="background:var(--accent)"></span>OVERVIEW</div>'+
    '<h2>Microservices Field Reference</h2>'+
    '<p class="alias">'+TOPICS.length+' topics · simple analogy · detailed explanation · diagram or code · 2–3 real examples · interview Q&amp;A</p>'+
    '<p class="home-intro">Each topic starts with a plain-language analogy, then goes deeper with how it works, a diagram or working code, where real companies use it, when to use or avoid it, and the interview questions you are most likely to get. Mark topics as revised to track your progress.</p>'+
    '<div class="section-label">SUGGESTED STUDY PATH</div><div class="path">'+
      '<div><b style="color:var(--c-fund)">DAY 1</b><span>Fundamentals + Communication: what, why, how services talk.</span></div>'+
      '<div><b style="color:var(--c-data)">DAY 2</b><span>Data Management: the hardest and most-asked area (Saga, CQRS, Outbox).</span></div>'+
      '<div><b style="color:var(--c-res)">DAY 3</b><span>Resilience, Observability and Security.</span></div>'+
      '<div><b style="color:var(--c-int)">DAY 4</b><span>Deployment & Ops, then the design walkthrough and rapid-fire drill.</span></div>'+
    '</div>';
  ORDER.forEach(catKey=>{
    const items = TOPICS.filter(t=>t.cat===catKey);
    html += '<div class="section-label">'+CATS[catKey].label.toUpperCase()+'</div><div class="home-grid">';
    items.forEach(t=>{
      html += '<button class="home-card" onclick="navigate(\''+t.id+'\')">'+
        '<span class="hc-cat" style="color:'+CATS[t.cat].color+'">'+CATS[t.cat].label.toUpperCase()+'</span>'+
        '<h3>'+t.name+(revised.has(t.id)?'<span class="tick">✓</span>':'')+'</h3>'+
        '<p>'+t.alias+'</p></button>';
    });
    html += '</div>';
  });
  return html+'</div>';
}

function codeBlock(code, lang, label, cls){
  const hl = lang && window.hljs && hljs.getLanguage(lang);
  const cl = hl ? 'language-'+lang : 'nohighlight';
  return '<div class="code-wrap '+(cls||'')+'"><span class="code-label">'+label+'</span><pre><code class="'+cl+'">'+esc(code)+'</code></pre></div>';
}

function renderTopic(t){
  const cat = CATS[t.cat];
  const idx = TOPICS.findIndex(x=>x.id===t.id);
  const prev = TOPICS[idx-1], next = TOPICS[idx+1];
  let h = '<div class="page">'+
    '<div class="cat-tag"><span class="dot" style="background:'+cat.color+'"></span>'+cat.label.toUpperCase()+'</div>'+
    '<h2>'+t.name+'</h2><p class="alias">'+t.alias+'</p>'+
    '<div class="simple"><span class="lbl">IN SIMPLE WORDS</span><p>'+t.simple+'</p></div>'+
    '<div class="section-label">DETAILED EXPLANATION</div><div class="intent">'+t.intent+'</div>';

  /*ms-extra-terms*/if(t.terms&&t.terms.length){h+='<div class="section-label">KEY TERMS</div><div class="terms">'+t.terms.map(x=>'<div class="term"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')+'</div>';}
  if(t.how && t.how.length){
    h += '<div class="section-label">HOW IT WORKS, STEP BY STEP</div><ol class="steps">'+t.how.map(s=>'<li><span>'+s+'</span></li>').join('')+'</ol>';
  }
  if(t.diagram){
    h += '<div class="section-label">DIAGRAM</div><div class="diagram">'+codeBlock(t.diagram,'','ARCHITECTURE','diagram')+'</div>';
  }
  if(t.table){
    h += '<div class="section-label">COMPARISON</div><div class="table-wrap"><table><thead><tr>'+
      t.table.head.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+
      t.table.rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  }
  if(t.code){
    h += '<div class="section-label">CODE EXAMPLE</div>'+codeBlock(t.code,t.lang,t.codeLabel||'CODE');
  }
  if(t.examples && t.examples.length){
    h += '<div class="section-label">REAL-WORLD EXAMPLES</div><ul class="examples">'+
      t.examples.map((ex,i)=>'<li><span class="ex-num">'+String(i+1).padStart(2,'0')+'</span><div><p class="ex-title">'+ex.title+'</p><p class="ex-body">'+ex.body+'</p></div></li>').join('')+'</ul>';
  }
  if((t.useWhen&&t.useWhen.length)||(t.avoidWhen&&t.avoidWhen.length)){
    h += '<div class="section-label">WHEN TO USE / WHEN TO AVOID</div><div class="tradeoffs">'+
      '<div class="tradeoff-box use"><h4>USE WHEN</h4><ul>'+t.useWhen.map(u=>'<li>'+u+'</li>').join('')+'</ul></div>'+
      '<div class="tradeoff-box avoid"><h4>AVOID WHEN</h4><ul>'+t.avoidWhen.map(a=>'<li>'+a+'</li>').join('')+'</ul></div></div>';
  }
  /*ms-extra-pitfalls*/if(t.pitfalls&&t.pitfalls.length){h+='<div class="section-label">COMMON PITFALLS</div><ul class="pitfalls">'+t.pitfalls.map(x=>'<li><p class="pm">'+x[0]+'</p><p class="pf">'+x[1]+'</p></li>').join('')+'</ul>';}
  if(t.qa && t.qa.length){
    h += '<div class="section-label">INTERVIEW QUESTIONS ('+t.qa.length+')</div>'+
      '<div class="qa-tools"><button class="btn" id="qaToggle" onclick="toggleQA()">Expand all answers</button></div><div class="qa">'+
      t.qa.map((x,i)=>'<details><summary><span class="q">Q'+(i+1)+'</span><span>'+x.q+'</span><span class="chev">›</span></summary><div class="ans">'+x.a+'</div></details>').join('')+'</div>';
  }
  const done = revised.has(t.id);
  h += '<div class="page-actions"><button class="btn'+(done?' done':'')+'" id="revBtn" onclick="toggleRevised(\''+t.id+'\')">'+(done?'✓ Revised':'Mark as revised')+'</button></div>';
  h += '<div class="footer-nav">'+
    (prev?'<button onclick="navigate(\''+prev.id+'\')"><span class="dir">← PREV</span>'+prev.name+'</button>':'<span></span>')+
    (next?'<button onclick="navigate(\''+next.id+'\')" style="text-align:right"><span class="dir">NEXT →</span>'+next.name+'</button>':'<span></span>')+
    '</div></div>';
  return h;
}

function toggleQA(){
  const all = [...document.querySelectorAll('.qa details')];
  const anyClosed = all.some(d=>!d.open);
  all.forEach(d=>d.open = anyClosed);
  document.getElementById('qaToggle').textContent = anyClosed ? 'Collapse all answers' : 'Expand all answers';
}

function toggleRevised(id){
  if(revised.has(id)) revised.delete(id); else revised.add(id);
  saveRevised();
  const b = document.getElementById('revBtn');
  const done = revised.has(id);
  b.textContent = done ? '✓ Revised' : 'Mark as revised';
  b.classList.toggle('done', done);
  buildSidebar(document.getElementById('search').value);
}

function navigate(id){
  const content = document.getElementById('content');
  const t = TOPICS.find(x=>x.id===id);
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  if(!t){
    content.innerHTML = renderHome();
    document.getElementById('crumbCurrent').textContent = 'Overview';
    if(location.hash) history.replaceState(null,'',location.pathname+location.search);
  } else {
    content.innerHTML = renderTopic(t);
    const navEl = document.getElementById('nav-'+id);
    if(navEl) navEl.classList.add('active');
    document.getElementById('crumbCurrent').textContent = t.name;
    if(location.hash !== '#'+id) history.replaceState(null,'','#'+id);
    if(window.hljs) content.querySelectorAll('pre code:not(.nohighlight)').forEach(el=>hljs.highlightElement(el));
  }
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', ()=>navigate(location.hash.replace('#','')));
document.getElementById('search').addEventListener('input', e=>buildSidebar(e.target.value));

buildSidebar();
navigate(location.hash.replace('#',''));
</script>

</body></html>
