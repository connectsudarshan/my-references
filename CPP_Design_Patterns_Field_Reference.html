n <code>build()<\/code>: check required fields and cross-field rules once, then produce a complete, preferably immutable object."}]}, "prototype": {"participants": ["<b>Prototype<\/b>: interface declaring <code>clone()<\/code>", "<b>ConcretePrototype<\/b>: implements <code>clone()<\/code> by copying itself (often via the copy constructor)", "<b>Client<\/b>: creates objects by cloning a configured prototype"], "consequences": ["Copy objects without knowing their concrete type (virtual constructor idiom)", "Cheap creation when setup is expensive", "Deep vs shallow copy must be decided carefully for pointer members"], "moreExamples": [{"title": "Game engines: spawning from templates", "body": "A configured enemy prototype (mesh handle, stats, AI state) is cloned for each spawn, far cheaper than loading and configuring from scratch."}, {"title": "Test pattern templates", "body": "A storage test keeps a configured 4 KiB data-pattern buffer object and clones it per I/O, then stamps the LBA into each clone, avoiding regenerating the whole pattern."}], "modern": "Implement <code>clone()<\/code> with the copy constructor and return <code>std::unique_ptr&lt;Base&gt;<\/code>. A CRTP helper (<code>template&lt;class D&gt; struct Cloneable : Base { std::unique_ptr&lt;Base&gt; clone() const override { return std::make_unique&lt;D&gt;(static_cast&lt;const D&amp;&gt;(*this)); } };<\/code>) removes the boilerplate from every class.", "qa": [{"q": "Why can't you just use the copy constructor?", "a": "The copy constructor needs the static type; through a <code>Base*<\/code> you don't know the concrete type. A virtual <code>clone()<\/code> dispatches to the right one."}, {"q": "Shallow vs deep copy in `clone()`?", "a": "Raw owning pointers must be deep-copied or both clones free the same memory; with <code>unique_ptr<\/code> members the compiler forces you to decide."}, {"q": "What is covariant return type and does it work with smart pointers?", "a": "Covariant returns let an override return <code>Derived*<\/code> instead of <code>Base*<\/code>, but they don't work with <code>std::unique_ptr<\/code>; return <code>unique_ptr&lt;Base&gt;<\/code>."}]}, "adapter": {"participants": ["<b>Target<\/b>: the interface the client expects", "<b>Adaptee<\/b>: existing class with an incompatible interface", "<b>Adapter<\/b>: implements Target and translates calls to the Adaptee (by composition or private inheritance)"], "consequences": ["Reuse existing or third-party code without modifying it", "Object adapters (composition) are more flexible than class adapters (inheritance)", "Adds an indirection layer; keep adapters thin (translation only)"], "moreExamples": [{"title": "Wrapping vendor SDKs", "body": "A vendor's C API for a PCIe analyzer (<code>vnd_capture_start(handle, flags)<\/code>) is wrapped by an adapter implementing your <code>ITraceCapture<\/code> interface, so switching vendors touches one class."}, {"title": "STL iterator adapters", "body": "<code>std::back_inserter<\/code>, <code>std::reverse_iterator<\/code> and <code>std::stack<\/code>/<code>std::queue<\/code> (container adapters over <code>std::deque<\/code>) are adapters in the standard library itself."}], "modern": "For simple one-off adaptations, a lambda or <code>std::function<\/code> often suffices: <code>std::function&lt;double()&gt; readC = [&amp;]{ return (legacy.readF() - 32) * 5 / 9; };<\/code>.", "qa": [{"q": "Object adapter vs class adapter?", "a": "Object adapter holds the adaptee (composition) and can adapt any subclass instance; class adapter inherits from the adaptee (often privately) and can override its behaviour but is tied to one class."}, {"q": "Adapter vs Facade vs Decorator?", "a": "Adapter changes an interface to match another; Facade simplifies a subsystem with a new interface; Decorator keeps the same interface and adds behaviour."}, {"q": "Name adapters in the C++ standard library.", "a": "<code>std::stack<\/code>, <code>std::queue<\/code>, <code>std::priority_queue<\/code> (container adapters), and iterator adapters like <code>std::reverse_iterator<\/code> and <code>std::back_insert_iterator<\/code>."}]}, "bridge": {"participants": ["<b>Abstraction<\/b>: high-level interface holding a pointer to an Implementor", "<b>RefinedAbstraction<\/b>: variants of the abstraction", "<b>Implementor<\/b>: low-level interface (platform, device, renderer)", "<b>ConcreteImplementor<\/b>: platform-specific implementations"], "consequences": ["Abstraction and implementation vary independently (M + N classes instead of M x N)", "Implementation can be switched at runtime", "The <b>pImpl idiom<\/b> is a special case that also hides implementation details and cuts compile times"], "moreExamples": [{"title": "pImpl in large C++ libraries", "body": "Qt uses d-pointers (a form of pImpl/Bridge) so the public class layout stays binary-compatible while private implementation changes between releases."}, {"title": "Logging frameworks", "body": "Loggers (what and at which level) are separate from sinks (console, file, syslog, ring buffer in firmware), so any logger works with any sink."}], "modern": "The <b>pImpl<\/b> idiom: <code>class Widget { struct Impl; std::unique_ptr&lt;Impl&gt; p_; public: ~Widget(); };<\/code> with the destructor defined in the .cpp where <code>Impl<\/code> is complete.", "qa": [{"q": "What is the pImpl idiom and why use it?", "a": "A class holds a pointer to a private implementation struct defined only in the .cpp: it hides details, keeps ABI stable, and reduces rebuilds when implementation changes."}, {"q": "Why must the destructor of a pImpl class be defined in the .cpp?", "a": "<code>unique_ptr&lt;Impl&gt;<\/code>'s deleter needs the complete type; if the destructor is implicitly defined in the header, <code>Impl<\/code> is incomplete there and compilation fails."}, {"q": "Bridge vs Strategy?", "a": "Both use composition; Strategy swaps one algorithm, Bridge separates two whole hierarchies that both keep growing."}]}, "composite": {"participants": ["<b>Component<\/b>: common interface for leaves and containers (<code>FileSystemNode<\/code>)", "<b>Leaf<\/b>: element with no children (<code>File<\/code>)", "<b>Composite<\/b>: element holding children and forwarding operations to them (<code>Directory<\/code>)"], "consequences": ["Clients treat single objects and groups uniformly", "Recursive operations (size, render, run) are written once", "Harder to restrict which child types are allowed; deep trees risk stack depth in recursion"], "moreExamples": [{"title": "Scene graphs in game engines", "body": "Nodes contain meshes, lights and other nodes; transforms and rendering propagate recursively down the tree."}, {"title": "Test suites and command sequences", "body": "A test suite contains test cases and nested suites, all with <code>run()<\/code>; a firmware update sequence can be a composite of steps and sub-sequences."}], "modern": "Watch the default-argument trap shown in this example: default arguments are bound to the <b>static<\/b> type. The base declared <code>print(int indent = 0)<\/code> but the overrides don't, so <code>root-&gt;print()<\/code> on a <code>unique_ptr&lt;Directory&gt;<\/code> doesn't compile; call <code>print(0)<\/code> or avoid defaults on virtual functions (or use a non-virtual public wrapper).", "qa": [{"q": "How do you implement Composite with smart pointers?", "a": "Children as <code>std::vector&lt;std::unique_ptr&lt;Component&gt;&gt;<\/code>, giving clear ownership and automatic cleanup of the whole tree."}, {"q": "Why are default arguments on virtual functions dangerous?", "a": "The default comes from the static type of the expression, while the function body comes from the dynamic type, so the same call can use different defaults depending on the pointer type."}, {"q": "Which pattern adds new operations over a Composite tree?", "a": "Visitor (or <code>std::visit<\/code> over a variant-based tree), so operations like export or validation don't require editing each node class."}]}, "decorator": {"participants": ["<b>Component<\/b>: the interface (<code>DataStream<\/code>)", "<b>ConcreteComponent<\/b>: the base object (<code>FileStream<\/code>)", "<b>Decorator<\/b>: holds a Component and implements the same interface, adding behaviour before/after delegating"], "consequences": ["Add responsibilities at runtime and combine them freely", "Avoids a subclass for every combination", "Many small wrapper objects; order of wrapping matters"], "moreExamples": [{"title": "I/O stacks", "body": "Compression, encryption and buffering layers wrapped around a raw file or socket stream, each with the same read/write interface (as in Boost.Iostreams filters)."}, {"title": "Instrumenting device drivers in tests", "body": "A <code>TracingDevice<\/code> decorator wraps a real <code>BlockDevice<\/code> and logs every command with latency, while a <code>FaultInjectingDevice<\/code> decorator corrupts selected reads for negative testing."}], "modern": "For functions, higher-order wrappers with lambdas: <code>auto timed = [f](auto&amp;&amp;... a){ auto t0 = std::chrono::steady_clock::now(); auto r = f(std::forward&lt;decltype(a)&gt;(a)...); /* log */ return r; };<\/code>", "qa": [{"q": "Decorator vs inheritance?", "a": "Inheritance fixes behaviour at compile time and multiplies subclasses for combinations; decorators compose behaviour at runtime."}, {"q": "Decorator vs Proxy?", "a": "Both wrap with the same interface; decorators add behaviour and are stacked by the client, proxies control access (lazy loading, remote, permissions)."}, {"q": "What is a common bug when writing decorators?", "a": "Forgetting to forward some interface methods (or making them non-virtual), so calls bypass the decorator or hit an unimplemented function."}]}, "facade": {"participants": ["<b>Facade<\/b>: simple interface for common tasks", "<b>Subsystem classes<\/b>: do the real work; unaware of the facade", "<b>Client<\/b>: uses the facade (and may still use subsystems directly)"], "consequences": ["Simplifies use and reduces coupling to subsystem details", "Can become a god object if it accumulates everything", "Does not prevent direct access for advanced users"], "moreExamples": [{"title": "SDK entry points", "body": "Libraries like libcurl's \"easy\" interface wrap a complex multi-handle subsystem behind a small set of calls for the common case."}, {"title": "Device bring-up sequence", "body": "A <code>DeviceSession::open()<\/code> facade powers the device, waits for link-up, enables the controller, creates I/O queues and reads identify data, replacing 40 lines of setup in every test."}], "modern": "Namespaces with free functions often make a lighter facade than a class: <code>namespace nvme::easy { Result writeVerify(Device&amp;, Lba, std::span&lt;const std::byte&gt;); }<\/code>.", "qa": [{"q": "Facade vs Adapter?", "a": "Facade defines a new simplified interface over many objects; Adapter makes one existing interface match another expected interface."}, {"q": "How do you stop a facade becoming a god object?", "a": "Split it by use case (bring-up, I/O, diagnostics), keep business logic in subsystems, and keep the facade as orchestration only."}, {"q": "Give a facade from your experience.", "a": "Describe a real subsystem and what the facade hid: ordering constraints, error handling, and cleanup, plus how it simplified callers."}]}, "flyweight": {"participants": ["<b>Flyweight<\/b>: shared object holding intrinsic (context-independent) state", "<b>FlyweightFactory<\/b>: creates and caches flyweights, returning shared instances", "<b>Client<\/b>: stores extrinsic state (position, size) and passes it when needed"], "consequences": ["Large memory savings when many objects share state", "Intrinsic state must be immutable, or all users see changes", "Extra complexity: separating intrinsic and extrinsic state"], "moreExamples": [{"title": "Text rendering glyph caches", "body": "One glyph bitmap per (font, size, character) shared by every occurrence on the page; each occurrence stores only its position."}, {"title": "String interning in compilers", "body": "Compilers intern identifiers (e.g. LLVM's string pools) so each distinct name is stored once and compared by pointer."}], "modern": "Share immutable state with <code>std::shared_ptr&lt;const T&gt;<\/code> from a factory cache (<code>std::unordered_map&lt;Key, std::weak_ptr&lt;const T&gt;&gt;<\/code> lets unused flyweights be freed), or store small integer IDs into a table.", "qa": [{"q": "Intrinsic vs extrinsic state?", "a": "Intrinsic state is shared and context-independent (glyph shape); extrinsic state depends on context and is supplied by the client (glyph position)."}, {"q": "Why store `weak_ptr` in the flyweight cache?", "a": "So flyweights nobody uses anymore can be destroyed; the cache doesn't keep them alive forever."}, {"q": "How is Flyweight different from Singleton?", "a": "Singleton has one instance of a class; Flyweight has one instance <b>per distinct intrinsic state<\/b>, possibly many in total."}]}, "proxy": {"participants": ["<b>Subject<\/b>: common interface", "<b>RealSubject<\/b>: the real object", "<b>Proxy<\/b>: implements Subject, controls access to RealSubject (lazy creation, permission checks, remote calls, caching)"], "consequences": ["Adds control without changing the real object", "Can hide latency (remote proxy) that callers should be aware of", "Smart pointers are proxies for memory ownership"], "moreExamples": [{"title": "Smart pointers", "body": "<code>std::shared_ptr<\/code> and <code>std::unique_ptr<\/code> act as proxies around raw pointers, adding ownership and lifetime management behind <code>operator-&gt;<\/code> and <code>operator*<\/code>."}, {"title": "Remote device access in labs", "body": "A <code>RemoteDeviceProxy<\/code> implements the <code>BlockDevice<\/code> interface but forwards commands over gRPC to a lab host, so tests run the same code against a local or remote drive."}], "modern": "Overload <code>operator-&gt;<\/code> for transparent proxies: it is applied repeatedly (drill-down) until a raw pointer is returned, which is how smart pointers and lock-guarding proxies work.", "qa": [{"q": "Types of proxy?", "a": "Virtual (lazy creation), protection (access checks), remote (another process/machine), caching/logging, and smart reference (reference counting)."}, {"q": "How is `std::shared_ptr` a proxy?", "a": "It controls access to the managed object via <code>operator-&gt;<\/code> and manages its lifetime with a reference-counted control block."}, {"q": "Proxy vs Decorator?", "a": "Same structure; intent differs: proxy controls access and often manages the real object's lifecycle, decorator adds responsibilities."}]}, "chain-of-responsibility": {"participants": ["<b>Handler<\/b>: interface for handling a request and holding the next handler", "<b>ConcreteHandler<\/b>: handles what it can, otherwise forwards", "<b>Client<\/b>: sends the request to the first handler"], "consequences": ["Decouples sender from receiver; handlers can be reordered or added", "No guarantee a request is handled unless a default handler exists", "Debugging can be harder: which handler acted?"], "moreExamples": [{"title": "Interrupt / event dispatch in firmware", "body": "A chain of handlers checks an error event: the retry handler, then the error-recovery handler, then the logger, then a fatal handler that asserts."}, {"title": "HTTP middleware (e.g. in C++ web frameworks)", "body": "Authentication, rate limiting and compression handlers wrap the request pipeline; each can respond early or pass the request on."}], "modern": "A <code>std::vector&lt;std::function&lt;bool(Request&amp;)&gt;&gt;<\/code> iterated until one returns true is often simpler than linked handler objects.", "qa": [{"q": "When does Chain of Responsibility fit?", "a": "When several independent handlers may process a request, the set or order should be configurable, and a handler may stop further processing."}, {"q": "What happens if no handler handles the request?", "a": "It must be defined: a default terminal handler, an error, or explicit ignore; leaving it undefined is a bug."}, {"q": "Real example in exception handling?", "a": "C++ exceptions propagate up the call stack through catch handlers until one matches: a language-level chain of responsibility."}]}, "command": {"participants": ["<b>Command<\/b>: interface with <code>execute()<\/code> (and often <code>undo()<\/code>)", "<b>ConcreteCommand<\/b>: binds a receiver and parameters", "<b>Invoker<\/b>: triggers commands, may queue or log them", "<b>Receiver<\/b>: the object that does the actual work"], "consequences": ["Requests become objects: queue, log, retry, undo, send across threads", "Undo requires storing enough state to reverse", "Many small classes, unless you use callables"], "moreExamples": [{"title": "Thread pools and task queues", "body": "Work items submitted to a thread pool are commands (<code>std::function&lt;void()&gt;<\/code> or <code>std::packaged_task<\/code>) executed later by worker threads."}, {"title": "NVMe submission queues", "body": "Each 64-byte submission queue entry is literally a command object: opcode plus parameters, queued by the host and executed later by the controller, with the completion reported separately."}], "modern": "Use <code>std::function&lt;void()&gt;<\/code> or lambdas capturing their arguments for simple commands; <code>std::packaged_task<\/code> when a result must be returned through a <code>std::future<\/code>.", "qa": [{"q": "How do you implement undo/redo?", "a": "Commands with <code>execute()<\/code> and <code>undo()<\/code>, an undo stack and a redo stack; executing a new command clears the redo stack."}, {"q": "Command vs Strategy?", "a": "Command encapsulates a request (what to do and on what), often executed later; Strategy encapsulates an interchangeable algorithm used by a context now."}, {"q": "Why is `std::function` a command?", "a": "It stores any callable with bound state behind a uniform <code>operator()<\/code>, so invokers can store, queue and execute it without knowing the concrete type."}]}, "interpreter": {"participants": ["<b>AbstractExpression<\/b>: interface with <code>interpret(context)<\/code>", "<b>TerminalExpression<\/b>: literals and variables", "<b>NonterminalExpression<\/b>: operators combining sub-expressions", "<b>Context<\/b>: variable values and global information"], "consequences": ["Easy to extend a small grammar with new expression classes", "Complex grammars become unmanageable: use a parser generator", "Evaluation by tree walking is slower than compiled code"], "moreExamples": [{"title": "Test-script DSLs", "body": "Validation teams define mini-languages for test sequences (<code>write lba=0 len=8; verify; power_cycle<\/code>) interpreted by the framework, so non-programmers can compose tests."}, {"title": "Expression evaluators and filters", "body": "Packet filters (BPF-like), log query languages and spreadsheet formulas are parsed into trees and evaluated with interpreter-style nodes."}], "modern": "Represent the AST with <code>std::variant<\/code> of node types and evaluate with <code>std::visit<\/code>, avoiding a class hierarchy and virtual calls.", "qa": [{"q": "When is the Interpreter pattern appropriate?", "a": "For small, stable languages (rules, filters, simple scripts) where readability and extensibility matter more than raw speed."}, {"q": "How does Interpreter relate to Composite?", "a": "The expression tree is a Composite: nonterminal nodes contain child expressions."}, {"q": "What do you use for a bigger language?", "a": "A parser generator or hand-written recursive-descent parser producing an AST, then a separate evaluator or compiler (Visitor), rather than growing interpreter classes."}]}, "iterator": {"participants": ["<b>Iterator<\/b>: provides sequential access (increment, dereference, compare)", "<b>Aggregate<\/b>: the collection, providing <code>begin()<\/code>/<code>end()<\/code>", "<b>Client<\/b>: traverses without knowing the internal structure"], "consequences": ["Uniform traversal across containers and algorithms", "Iterator invalidation rules must be respected (e.g. <code>vector<\/code> reallocation)", "Enables the whole STL algorithm library"], "moreExamples": [{"title": "The STL", "body": "Every STL container exposes iterators, and algorithms like <code>std::sort<\/code> and <code>std::find<\/code> work on iterator ranges, not containers: the most famous Iterator implementation."}, {"title": "Paging through device logs", "body": "An iterator over an NVMe telemetry or error log fetches the next page with a Get Log Page command only when the loop reaches it, hiding offsets and page sizes."}], "modern": "C++20 <b>ranges<\/b> and views (<code>std::views::filter<\/code>, <code>std::views::transform<\/code>) compose lazy iteration; <code>std::generator<\/code> (C++23) lets a coroutine produce values like a Python generator.", "qa": [{"q": "What is iterator invalidation?", "a": "Operations that change a container's storage can make existing iterators dangling, e.g. <code>push_back<\/code> on a <code>vector<\/code> that reallocates, or <code>erase<\/code> on the erased element."}, {"q": "What do you need to make a class usable in a range-for loop?", "a": "<code>begin()<\/code> and <code>end()<\/code> (member or free) returning iterators that support <code>!=<\/code>, prefix <code>++<\/code> and unary <code>*<\/code>."}, {"q": "What are iterator categories?", "a": "Input, output, forward, bidirectional, random access and (C++20) contiguous; algorithms require minimum categories (e.g. <code>std::sort<\/code> needs random access)."}]}, "mediator": {"participants": ["<b>Mediator<\/b>: interface for communication between colleagues", "<b>ConcreteMediator<\/b>: coordinates colleagues and holds the interaction logic", "<b>Colleague<\/b>: components that talk only to the mediator"], "consequences": ["Reduces many-to-many dependencies to one-to-many", "Colleagues become reusable", "The mediator can grow into a complex god object"], "moreExamples": [{"title": "GUI dialogs (Qt)", "body": "A dialog class wires widget signals to slots and decides how widgets affect each other, so widgets stay independent and reusable."}, {"title": "Test orchestrators", "body": "Device workers, the power controller and the results collector don't call each other; an orchestrator mediates: when a test finishes, it tells the collector, then asks the power controller to cycle the device."}], "modern": "Signal/slot libraries (Qt, Boost.Signals2) or a small event bus provide the plumbing; keep the coordination rules in one mediator class.", "qa": [{"q": "Mediator vs Observer?", "a": "Observer broadcasts changes to subscribers without deciding what they do; Mediator actively coordinates a group and encapsulates their interaction rules."}, {"q": "Mediator vs Facade?", "a": "Facade simplifies access to a subsystem for outside clients; Mediator coordinates peers that know and talk to it."}, {"q": "Main risk of Mediator?", "a": "Centralizing so much logic that the mediator becomes a hard-to-test god object; split by use case."}]}, "memento": {"participants": ["<b>Originator<\/b>: creates a memento of its state and restores from it", "<b>Memento<\/b>: opaque snapshot of the originator's state", "<b>Caretaker<\/b>: stores mementos without inspecting them"], "consequences": ["Undo/rollback without exposing internals", "Snapshots can be memory-expensive for large state", "Encapsulation can be enforced with a private nested class plus <code>friend<\/code>"], "moreExamples": [{"title": "Editors and CAD tools", "body": "Undo history stores snapshots (or diffs) of document state before each edit."}, {"title": "Firmware configuration rollback", "body": "Before applying a new feature configuration to a drive, the test saves the current settings snapshot and restores it in teardown so later tests start from defaults."}], "modern": "Make the memento a nested class with a private constructor and declare the originator a <code>friend<\/code>, so only the originator can read it; for large states store diffs or use copy-on-write.", "qa": [{"q": "Memento vs Command for undo?", "a": "Memento stores state snapshots (simple, memory-heavy); Command stores the operation and its inverse (light, but every command needs correct undo)."}, {"q": "How does C++ enforce memento encapsulation?", "a": "Private nested memento type with the originator as <code>friend<\/code>, exposing no public accessors to the caretaker."}, {"q": "How do you limit memory for long undo histories?", "a": "Cap the history length, store diffs instead of full snapshots, or share unchanged data with copy-on-write."}]}, "observer": {"participants": ["<b>Subject<\/b>: keeps a list of observers and notifies them", "<b>Observer<\/b>: interface with <code>update()<\/code> / callback", "<b>ConcreteObserver<\/b>: reacts to notifications"], "consequences": ["Loose coupling between event source and reactions", "Lifetime issues: dangling observers if not unsubscribed", "Notification order is usually unspecified"], "moreExamples": [{"title": "GUI frameworks", "body": "Qt signals/slots and model/view updates notify views when the model changes."}, {"title": "Hardware event monitoring", "body": "A temperature monitor subject notifies a throttling policy, a logger and a test-abort guard when the drive crosses a thermal threshold."}], "modern": "Store <code>std::weak_ptr<\/code> to observers (skip expired ones) or return an RAII subscription handle that unsubscribes in its destructor; Boost.Signals2 provides thread-safe signals with scoped connections.", "qa": [{"q": "How do you avoid dangling observers?", "a": "RAII subscription tokens that unsubscribe on destruction, or storing <code>weak_ptr<\/code> and pruning expired entries."}, {"q": "Observer vs Pub/Sub?", "a": "Observer registers directly with the subject; pub/sub uses a broker so publishers and subscribers don't know each other and delivery can be asynchronous."}, {"q": "Thread-safety concerns?", "a": "Notifying while another thread subscribes or unsubscribes; copy the observer list under a lock and notify outside the lock to avoid deadlocks."}]}, "state": {"participants": ["<b>Context<\/b>: holds the current state and delegates behaviour to it", "<b>State<\/b>: interface for state-specific behaviour", "<b>ConcreteState<\/b>: implements behaviour and decides transitions"], "consequences": ["Removes large switch statements on a state variable", "Transitions are explicit and localized", "More classes; a table-driven FSM may be simpler for small machines"], "moreExamples": [{"title": "Protocol stacks", "body": "TCP connection handling (LISTEN, SYN_RCVD, ESTABLISHED, ...) is the textbook State example; each state accepts different events."}, {"title": "Device power and link states", "body": "An NVMe or PCIe device model in a test framework moves through power states (PS0 to PS4) or link states (L0, L1, L2), with commands allowed or rejected per state."}], "modern": "Use <code>std::variant&lt;Idle, Running, Error&gt;<\/code> for states and <code>std::visit<\/code> for transitions: states are values, invalid transitions can be compile-time errors, and there's no heap allocation.", "qa": [{"q": "State vs Strategy?", "a": "Same structure; Strategy is chosen by the client and rarely changes, State objects change themselves as the context moves through its lifecycle."}, {"q": "When is a switch statement fine?", "a": "Few states and simple behaviour; switch to State (or a variant FSM) when the same switch repeats across many methods."}, {"q": "How do you model a finite state machine without inheritance?", "a": "A transition table (<code>std::map&lt;std::pair&lt;State, Event&gt;, State&gt;<\/code>) or <code>std::variant<\/code> states with <code>std::visit<\/code>."}]}, "strategy": {"participants": ["<b>Strategy<\/b>: interface for an algorithm", "<b>ConcreteStrategy<\/b>: interchangeable implementations", "<b>Context<\/b>: uses a strategy and can switch it"], "consequences": ["Algorithms swap at runtime without changing the context", "Clients must know which strategy to choose", "Callables (<code>std::function<\/code>, lambdas, templates) often replace class hierarchies"], "moreExamples": [{"title": "STL algorithms with comparators and hashers", "body": "<code>std::sort(v.begin(), v.end(), cmp)<\/code>, <code>std::unordered_map&lt;K, V, Hash&gt;<\/code> and allocators are compile-time strategies."}, {"title": "I/O workload generators", "body": "A workload engine takes an access-pattern strategy (sequential, random, zipfian, hot-spot) to generate LBAs, so the same engine drives every test profile."}], "modern": "Compile-time strategy via templates (policy-based design): <code>template&lt;class Compare&gt; class Sorter { Compare cmp_; };<\/code> gives zero overhead; runtime strategy via <code>std::function<\/code> when choice happens at runtime.", "qa": [{"q": "Runtime vs compile-time strategies in C++?", "a": "Runtime: virtual interface or <code>std::function<\/code>, chosen dynamically. Compile-time: template parameters (policies), inlined with no overhead but fixed at compile time."}, {"q": "What is policy-based design?", "a": "Composing class behaviour from template parameters (policies) such as allocation, threading or checking, as popularized by Alexandrescu's Modern C++ Design."}, {"q": "Strategy vs Template Method?", "a": "Strategy uses composition to swap a whole algorithm; Template Method uses inheritance to vary steps of a fixed algorithm."}]}, "template-method": {"participants": ["<b>AbstractClass<\/b>: defines the template method (fixed algorithm) and primitive operations", "<b>ConcreteClass<\/b>: implements the primitive operations / hooks"], "consequences": ["Enforces an invariant sequence while allowing customization", "Inheritance couples subclasses to the base", "The <b>Non-Virtual Interface (NVI)<\/b> idiom is the C++ form: public non-virtual method, private virtual hooks"], "moreExamples": [{"title": "Test fixtures", "body": "Google Test's <code>SetUp()<\/code>/<code>TearDown()<\/code> hooks are called by the framework around each test body."}, {"title": "Firmware update flows", "body": "A base <code>FirmwareUpdater::run()<\/code> fixes download, verify, commit and reset steps; vendor subclasses override only the transport or activation step."}], "modern": "Use the <b>NVI idiom<\/b>: <code>public: void process() { read(); transform(); write(); } private: virtual void transform() = 0;<\/code>, so derived classes customize steps but can't change the order. CRTP gives a compile-time version without virtual calls.", "qa": [{"q": "What is the Non-Virtual Interface idiom?", "a": "Public functions are non-virtual and call private (or protected) virtual hooks, letting the base enforce pre/post-conditions and ordering."}, {"q": "Template Method vs Strategy?", "a": "Template Method varies steps via inheritance with a fixed skeleton; Strategy swaps the whole algorithm via composition."}, {"q": "How can CRTP implement Template Method?", "a": "The base template calls <code>static_cast&lt;Derived*&gt;(this)-&gt;step()<\/code>, resolving steps at compile time without virtual dispatch."}]}, "visitor": {"participants": ["<b>Visitor<\/b>: interface with a <code>visit()<\/code> overload per element type", "<b>ConcreteVisitor<\/b>: one operation across all element types", "<b>Element<\/b>: interface with <code>accept(Visitor&amp;)<\/code>", "<b>ConcreteElement<\/b>: calls <code>visitor.visit(*this)<\/code> (double dispatch)"], "consequences": ["Adding operations is easy (new visitor)", "Adding element types is hard (every visitor changes)", "Can break encapsulation if visitors need internals"], "moreExamples": [{"title": "Clang AST tools", "body": "Clang's <code>RecursiveASTVisitor<\/code> lets tools implement <code>VisitCallExpr<\/code>, <code>VisitFunctionDecl<\/code> and so on, used by clang-tidy checks and refactoring tools."}, {"title": "Exporting test results", "body": "Result nodes (suite, test case, step, measurement) are visited by a JUnit exporter, an HTML report exporter and a database writer without changing the node classes."}], "modern": "<code>std::variant&lt;Circle, Square&gt;<\/code> plus <code>std::visit<\/code> with an overloaded lambda set (<code>template&lt;class... Ts&gt; struct overloaded : Ts... { using Ts::operator()...; };<\/code>) gives visitor behaviour with value semantics and exhaustiveness checking by the compiler.", "qa": [{"q": "What is double dispatch?", "a": "Choosing the function based on two runtime types: <code>element.accept(visitor)<\/code> dispatches on the element, then <code>visitor.visit(*this)<\/code> on the visitor via overload resolution."}, {"q": "When would you use `std::variant` + `std::visit` instead?", "a": "When the set of types is closed and known; you get value semantics, no heap allocation, and a compile error if a visitor misses a type."}, {"q": "Main trade-off of Visitor?", "a": "Easy to add operations, hard to add element types; choose it when types are stable and operations grow."}]}};
PATTERNS.forEach(p => {
  const x = EXTRAS[p.id]; if (!x) return;
  p.participants = x.participants; p.consequences = x.consequences; p.modern = x.modern; p.qa = x.qa;
  p.examples = p.examples.concat(x.moreExamples);
});
function mdInline(s){ return String(s).replace(/`([^`]+)`/g, (m, c) => '<code>' + c.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</code>'); }
function renderDefinition(p){
  if (!p.participants) return '';
  return `<div class="section-label">DEFINITION: PARTICIPANTS AND CONSEQUENCES</div>
    <div class="defn"><div class="defn-box"><h4>PARTICIPANTS</h4><ul>${p.participants.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="defn-box"><h4>CONSEQUENCES</h4><ul>${p.consequences.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`;
}
function renderModern(p){
  return p.modern ? `<div class="section-label">MODERN C++ ALTERNATIVE</div><div class="modern">${mdInline(p.modern)}</div>` : '';
}
function renderQA(p){
  if (!p.qa) return '';
  return `<div class="section-label">INTERVIEW QUESTIONS (${p.qa.length})</div><div class="qa-list">` +
    p.qa.map(x => `<details><summary>${mdInline(x.q)}</summary><div class="qa-a">${mdInline(x.a)}</div></details>`).join('') + '</div>';
}

};

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildSidebar(){
  const order = ['creational','structural','behavioral'];
  const container = document.getElementById('navGroups');
  order.forEach(catKey=>{
    const items = PATTERNS.filter(p=>p.category===catKey);
    const group = document.createElement('div');
    group.className='nav-group';
    group.innerHTML = `<div class="nav-group-label"><span class="dot" style="background:${CATS[catKey].color}"></span>${CATS[catKey].label} (${items.length})</div>`;
    items.forEach((p,i)=>{
      const el = document.createElement('div');
      el.className='nav-item';
      el.id='nav-'+p.id;
      el.innerHTML = `<span class="num">${String(items.indexOf(p)+1).padStart(2,'0')}</span>${p.name}`;
      el.onclick = ()=>navigate(p.id);
      group.appendChild(el);
    });
    container.appendChild(group);
  });
}

function renderHome(){
  let html = `
    <div class="cat-tag"><span class="dot" style="background:var(--accent)"></span>OVERVIEW</div>
    <h2>C++ Design Patterns Field Reference</h2>
    <p class="intent">23 Gang-of-Four patterns, each with a working C++17 implementation (compile-checked with g++), a formal definition (participants and consequences), 5 real production examples, the modern C++ alternative and interview questions — not the toy Animal/Shape examples. Pick one from the sidebar, or jump in below.</p>
    <div class="section-label">ALL PATTERNS</div>
    <div class="home-grid">`;
  PATTERNS.forEach((p,i)=>{
    html += `<div class="home-card" onclick="navigate('${p.id}')">
      <span class="hc-num" style="color:${CATS[p.category].color}">${CATS[p.category].label.toUpperCase()}</span>
      <h3>${p.name}</h3>
      <p>${p.intent.slice(0,90)}${p.intent.length>90?'…':''}</p>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function renderPattern(p, idx){
  const cat = CATS[p.category];
  let examplesHtml = p.examples.map((ex,i)=>`
    <li><span class="ex-num">${String(i+1).padStart(2,'0')}</span>
      <div><p class="ex-title">${ex.title}</p><p class="ex-body">${ex.body}</p></div>
    </li>`).join('');

  let useHtml = p.useWhen.map(u=>`<li>${u}</li>`).join('');
  let avoidHtml = p.avoidWhen.map(a=>`<li>${a}</li>`).join('');

  const prevNext = getPrevNext(p.id);

  return `
    <div class="cat-tag"><span class="dot" style="background:${cat.color}"></span>${cat.label.toUpperCase()} PATTERN</div>
    <h2>${p.name}</h2>
    <p class="pattern-alias">${p.alias}</p>
    <p class="intent">${p.intent}</p>
    ${renderDefinition(p)}

    <div class="section-label">C++ IMPLEMENTATION</div>
    <div class="code-wrap">
      <span class="code-label">C++17</span>
      <pre><code class="language-cpp">${escapeHtml(p.code)}</code></pre>
    </div>
    ${renderModern(p)}

    <div class="section-label">WHERE THIS SHOWS UP IN THE REAL WORLD</div>
    <ul class="examples">${examplesHtml}</ul>

    <div class="section-label">WHEN TO USE / WHEN TO AVOID</div>
    <div class="tradeoffs">
      <div class="tradeoff-box use"><h4>USE WHEN</h4><ul>${useHtml}</ul></div>
      <div class="tradeoff-box avoid"><h4>AVOID WHEN</h4><ul>${avoidHtml}</ul></div>
    </div>

    ${renderQA(p)}

    <div class="footer-nav">
      <button onclick="navigate('${prevNext.prev ? prevNext.prev.id : ''}')" ${!prevNext.prev?'style="visibility:hidden"':''}>
        <span><span class="dir">← PREV</span>${prevNext.prev?prevNext.prev.name:''}</span>
      </button>
      <button onclick="navigate('${prevNext.next ? prevNext.next.id : ''}')" ${!prevNext.next?'style="visibility:hidden"':''}>
        <span style="text-align:right"><span class="dir">NEXT →</span>${prevNext.next?prevNext.next.name:''}</span>
      </button>
    </div>
  `;
}

function getPrevNext(id){
  const idx = PATTERNS.findIndex(p=>p.id===id);
  return {
    prev: idx>0 ? PATTERNS[idx-1] : null,
    next: idx<PATTERNS.length-1 ? PATTERNS[idx+1] : null
  };
}

function navigate(id){
  const content = document.getElementById('content');
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  if(!id || id==='home'){
    content.innerHTML = renderHome();
    document.getElementById('crumbCurrent').textContent = 'Overview';
    window.location.hash = '';
  } else {
    const p = PATTERNS.find(x=>x.id===id);
    if(!p) return;
    content.innerHTML = renderPattern(p);
    const navEl = document.getElementById('nav-'+id);
    if(navEl) navEl.classList.add('active');
    document.getElementById('crumbCurrent').textContent = p.name;
    window.location.hash = id;
    hljs.highlightAll();
  }
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', ()=>{
  const id = window.location.hash.replace('#','');
  navigate(id || 'home');
});

buildSidebar();
navigate(window.location.hash.replace('#','') || 'home');

</script>
</body>
</html>
