question:`What is the scope resolution operator (\`::\`)?`,
answer:`It qualifies a name with its namespace or class, e.g., \`std::cout\`, or accesses a global variable shadowed by a local one (\`::x\`).`,

num:7, section:1, sectionTitle:`C++ Basics & Syntax`,
level:`Easy`,
question:`What are the storage classes in C++?`,
answer:`Modern C++ has \`static\`, \`extern\`, \`thread_local\` (C++11) and \`mutable\` (class members only). They control **storage duration** (automatic, static, thread) and **linkage** (internal, external). History: \`auto\` was a storage class before C++11 and now means type deduction; \`register\` was deprecated in C++11 and removed in C++17.`,
code:`static int counter = 0;        // static storage duration; internal linkage at namespace scope
extern int sharedFlag;         // declaration only: defined in another translation unit
thread_local int perThread;    // C++11: one instance per thread

level:`Easy`,
question:`What is the difference between \`static\` and \`extern\`?`,
answer:`\`static\` limits a variable/function's linkage to its translation unit; \`extern\` declares that a variable/function is defined elsewhere, giving it external linkage.`,

static int hidden = 5;     // only visible in file1.cpp
int shared = 10;           // visible to other files (external linkage)

// file2.cpp

},
{

level:`Easy`,

{
num:10, section:1, sectionTitle:`C++ Basics & Syntax`,
level:`Easy`,
question:`What is the difference between \`#define\` and \`const\`?`,
answer:`\`#define\` is a text-substitution preprocessor macro with no type checking or scope; \`const\` creates a typed, scoped, compiler-checked constant.`,

num:12, section:1, sectionTitle:`C++ Basics & Syntax`,
level:`Moderate`,
question:`What are the differences between pass-by-value, pass-by-pointer, and pass-by-reference?`,
answer:`Pass-by-value copies the argument (no side effects on caller); pass-by-pointer passes an address (can modify caller's data, allows null and reassignment); pass-by-reference is an alias to the caller's variable (can modify caller's data, cannot be null or rebound).`,
code:`void byValue(int x)   { x = 99; }              // caller's value unchanged
void byPointer(int* x){ *x = 99; }             // caller's value changed
void byRef(int& x)    { x = 99; }              // caller's value changed

int a = 1;
byValue(a);   // a == 1
byPointer(&a);// a == 99
byRef(a);     // a == 99`,
},
{
num:13, section:1, sectionTitle:`C++ Basics & Syntax`,
level:`Moderate`,
question:`What is function overloading? What are its rules?`,
answer:`Defining multiple functions with the same name but different parameter lists (type/number/order). Return type alone cannot differentiate overloads; the compiler resolves calls at compile time based on argument types (static/early binding).`,
code:`void print(int x)     { std::cout << "int: " << x; }
void print(double x)  { std::cout << "double: " << x; }
void print(std::string x){ std::cout << "string: " << x; }
print(5); print(5.0); print("hi");  // compiler picks the right overload`,
},
{

level:`Moderate`,

num:15, section:1, sectionTitle:`C++ Basics & Syntax`,
level:`Moderate`,

Widget* w1 = new Widget{1};      // new/delete call ctor/dtor, type-safe
delete w1;
Widget* w2 = (Widget*)malloc(sizeof(Widget)); // no constructor called
free(w2);                                     // no destructor called`,

question:`What is the difference between a shallow copy and a deep copy?`,

global shadowed by a local makes code hard to read; rename instead of shadowing.", "f": ["How do you call the base-class implementation from an override? => Qualify it: `Base::method();` inside the derived method.", "What does `::operator new(n)` do? => Calls the global allocation function directly, allocating raw memory without constructing an object."]}, "6": {"d": "`struct` and `class` define the same kind of type; the only differences are the default member access and default inheritance access (`public` for `struct`, `private` for `class`).", "x": "Both can have constructors, virtual functions, templates, access specifiers and inheritance. By convention, `struct` is used for simple data aggregates with public members (plain data, protocol headers), and `class` for types with invariants protected by private members.\n\nDefault inheritance: `struct D : B` means public inheritance, `class D : B` means private inheritance, a frequent surprise.\n\nAggregate initialization (`Point p{1, 2};`) works only for types with no user-declared constructors, no private or protected non-static members and no virtual functions, whichever keyword you use.", "p": "Writing `class Derived : Base {}` and expecting public inheritance; it is private, so `Base` members become inaccessible to users of `Derived`.", "f": ["When would you use `struct`? => For passive data with no invariants, like a packed protocol header or a configuration record.", "Can a struct have private members and virtual functions? => Yes; only the default access differs."]}, "7": {"d": "Storage-class and duration specifiers decide how long an object lives and which translation units can see its name.", "x": "Storage duration kinds: **automatic** (block-scope locals, destroyed at the end of the block), **static** (namespace-scope objects and `static` locals, alive for the whole program), **thread** (`thread_local`, one per thread), and **dynamic** (created with `new`, lifetime controlled manually or by smart pointers variables? => Variables that may be defined in several translation units (e.g. in a header) and are merged into one entity by the linker."]}, "9": {"d": "A namespace is a named scope that groups declarations so the same identifier can exist in different libraries without collisions.", "x": "Namespaces can be reopened across files, nested (`namespace a::b { }` since C++17), aliased (`namespace fs = std::filesystem;`) and anonymous (internal linkage).\n\n**Argument-dependent lookup (ADL)** means an unqualified call like `swap(a, b)` also searches the namespaces of the arguments' types, which is why `std::cout << x` finds `std::operator<<`.\n\n`inline namespace` is used for library versioning: members of `namespace lib { inline namespace v2 { } }` are accessible as `lib::name` while the ABI can distinguish versions.", "p": "`using namespace std;` in headers or at global scope: it pulls hundreds of names into every includer and causes ambiguous calls (e.g. a user function named `count` or `distance`).", "f": ["What is argument-dependent lookup? => Unqualified function names are also looked up in the namespaces associated with the argument types.", "What is a namespace alias? => A shorter name for a long namespace: `namespace chrono = std::chrono;`."]}, "10": {"d": "`#define` is textual substitution by the preprocessor with no type or scope; `const` (and `constexpr`) declares a typed, scoped object the compiler understands.", "x": "Macros are replaced before compilation, so errors show up in expanded code, they ignore namespaces, they can't be inspected in a debugger, and function-like macros evaluate arguments multiple times (`#define SQ(x) x*x` breaks for `SQ(a+1)` and `SQ(i++)`).\n\nPrefer `constexpr` for compile-time constants (`constexpr int kQueueDepth = 64;`), `enum class` for related constants, and `inline`/`constexpr` functions or templates instead of function-like macros.\n\nMacros are still legitimate for include guards, conditional compilation (`#ifdef DEBUG`), and cases needing `__FILE__`/`__LINE__` (though C++20 `std::source_location` covers the latter).", "p": "`#define MAX(a, b) a > b ? a : b` without parentheses: `MAX(x, y) * 2` expands to `x > y ? x : y * 2`.", "f": ["`const` vs `constexpr`? => `const` means read-only after initialization (possibly at runtime); `constexpr` requires a compile-time constant usable in array sizes and templates.", "How does C++20 `std::source_location` replace macros? => It captures file, line and function name as a default argument, without `__FILE__` / `__LINE__` macros."]}, "11": {"d": "`inline` is primarily a linkage rule: an inline function (or variable) may be defined in multiple translation units, as long as all definitions are identical; inlining the code is only a hint.", "x": "Modern compilers decide what to inline based on their own heuristics, regardless of the keyword. The keyword's real job is allowing definitions in headers without violating the One Definition Rule.\n\nImplicitly inline: functions defined inside a class body, `constexpr` functions, and function templates (effectively).\n\nTo force or prevent inlining use compiler attributes (`[[gnu::always_inline]]`, `__forceinline`, `[[gnu::noinline]]`), and only after profiling. Excessive inlining increases code size and instruction-cache pressure, which can make code slower.", "p": "Marking large functions `inline` expecting a speed-up: the compiler usually ignores the hint, and if it does inline, code bloat can hurt performance.", "f": ["Why can an inline function be defined in a header without link errors? => The ODR explicitly allows one identical definition per translation unit for inline functions; the linker merges them.", "Are member functions defined inside the class body inline? => Yes, implicitly."]}, "12": {"d": "By value copies the argument; by pointer passes an address that may be null; by reference passes an alias that must refer to a valid object.", "x": "Guidelines (C++ Core Guidelines F.15-F.18):\n\n- Cheap-to-copy types (built-ins, small structs, `std::string_view`, `std::span`): pass by value.\n- Read-only access to larger objects: `const T&`.\n- Output or in-out parameters: `T&` (or better, return the value).\n- Optional arguments where \"no object\" is valid: pointer (`T*`, possibly null) or `std::optional`.\n- \"Sink\" parameters the function keeps: pass by value and `std::move` into place.\n\nReferences can't be reseated or null, which makes interfaces clearer; pointers make optionality explicit.", "p": "Passing `std::vector<T>` or `std::string` by value in hot paths, causing a full copy on each call when a `const&` would do.", "f": ["When is pass-by-value better than `const&`? => For small types and for sink parameters that will be moved into storage anyway.", "How do you express an optional in-parameter in modern C++? => `const T*` (nullable) or `std::optional<T>`; never a reference that might be \"invalid\"."]}, "13": {"d": "Function overloading is declaring several functions with the same name in the same scope that differ in their parameter types, count or qualifiers; the compiler picks one by overload resolution.", "x": "Overload resolution ranks candidates by conversion quality: exact match beats promotion (e.g. `char` to `int`), which beats standard conversion, which beats user-defined conversion; ambiguity is a compile error.\n\nWhat distinguishes overloads: parameter types and count, `const`/`volatile` and ref-qualifiers on member functions (`void f() &` vs `void f() &&`). What doesn't: return type alone, or top-level `const` on by-value parameters (`void f(int)` and `void f(const int)` are the same function).\n\nOverloads are resolved at compile time (static polymorphism), unlike virtual functions.", "p": "Overloading `f(int)` and `f(double)` then calling `f(5L)`: `long` converts equally well to both, so the call is ambiguous.", "f": ["Can two functions differ only by return type? => No, calls couldn't be resolved; it's a redeclaration error.", "What is the difference between overloading and overriding? => Overloading: same name, different parameters, resolved at compile time. Overriding: same signature in a derived class, resolved at runtime through virtual dispatch."]}, "14": {"d": "A default argument is a value the compiler substitutes at the call site when the caller omits trailing arguments.", "x": "Rules: defaults must be trailing parameters; they are specified once (usually in the header declaration, not repeated in the definition); and they are evaluated at each call.\n\nBecause defaults are inserted at the **call site**, changing a default in a library header requires recompiling callers.\n\nWith virtual functions, default arguments are bound by the **static type** of the expression, while the function body is chosen by the dynamic type, so a call through a base pointer uses the base's default even if the derived override declares a different one. Prefer overloads or non-virtual wrappers for virtual functions with defaults.", "p": "Declaring different default arguments on a base virtual function and its override: calls through base pointers use the base default with the derived body.", "f": ["Where should default arguments be declared? => Once, in the declaration visible to callers (the header), not again in the definition.", "Why are defaults on virtual functions risky? => Defaults come from the static type, bodies from the dynamic type, so behaviour depends on the pointer type used."]}, "15": {"d": "`new`/`delete` allocate memory **and** construct/destroy objects, returning typed pointers; `malloc`/`free` only allocate raw bytes from the C heap.", "x": "`new T(args)` calls `operator new` then the constructor; on failure it throws `std::bad_alloc` (or returns null with `new (std::nothrow)`). `malloc` returns `void*` and signals failure with null; it never runs constructors.\n\nPairs must match: `new`/`delete`, `new[]`/`delete[]`, `malloc`/`free`. Mixing them is undefined behaviour.\n\nIn modern C++ you rarely call either directly: use `std::make_unique`, `std::make_shared` and containers. `malloc` still appears when interfacing with C APIs; objects placed in such memory need placement `new` (or C++20 implicit object creation rules for trivial types).", "p": "Allocating with `new[]` and releasing with `delete` (without `[]`), which is undefined behaviour and may skip destructors or corrupt the heap.", "f": ["What is placement new? => `new (address) T(args)` constructs an object in pre-allocated memory without allocating, used by pools and containers.", "Why prefer `std::make_unique` over `new`? => Exception safety and automatic cleanup: ownership is captured immediately, and no `delete` is needed."]}, "16": {"d": "`const` expresses that something must not be modified through a given name: a variable, the object a pointer points to, the pointer itself, or `*this` inside a member function.", "x": "Read declarations right to left: `const int* p` is a pointer to const int (can't change `*p`); `int* const p` is a const pointer to int (can't reseat `p`); `const int* const p` is both.\n\nA `const` member function (`int size() const;`) promises not to modify observable state and is the only kind callable on const objects; `mutable` members are the exception for caches and mutexes.\n\nConst correctness propagates: taking parameters as `const T&` documents intent, enables calls with temporaries, and lets the compiler catch accidental writes. Casting away const with `const_cast` and then modifying an object that was originally const is undefined behaviour.", "p": "Forgetting `const` on member functions that don't modify state: the class then can't be used through `const&` parameters, forcing const to be removed everywhere else.", "f": ["What is the difference between `const int*` and `int* const`? => The first protects the pointee, the second protects the pointer itself.", "Why do mutexes in classes often need `mutable`? => Const member functions still need to lock them, and locking modifies the mutex."]}, "17": {"d": "A reference is an alias for an existing object; it must be initialized, cannot be reseated to another object, and a valid program can never have a null reference.", "x": "Under the hood a reference is usually implemented as a pointer, but the language guarantees it refers to an object, which is why functions taking `T&` don't need null checks.\n\nA **dangling** reference is possible, though: returning a reference to a local variable, or keeping a reference into a `std::vector` element after the vector reallocates.\n\n`const T&` can bind to temporaries and extends the temporary's lifetime to that of the reference (only for references bound directly in a local declaration). Rvalue references (`T&&`) bind to temporaries and enable move semantics.", "p": "Returning `const std::string&` to a local string or to a temporary: the reference dangles as soon as the function returns.", "f": ["How can a reference end up \"null\"? => Only through undefined behaviour, such as dereferencing a null pointer to initialize it; a valid program never has one.", "What is lifetime extension? => A temporary bound directly to a `const T&` (or `T&&`) local lives as long as that reference."]}, "18": {"d": "Name mangling is the compiler's encoding of a function's name, namespace, class and parameter types into a unique linker symbol, which makes overloading possible.", "x": "Example with the Itanium ABI (GCC/Clang): `void ns::f(int)` becomes `_ZN2ns1fEi`. MSVC uses a different scheme (`?f@ns@@YAXH@Z`), which is one reason C++ libraries built by different compilers usually can't be linked together.\n\nConsequences: link errors show mangled names (use `c++filt` or `-C` in `nm` to demangle); C code can't call mangled symbols, hence `extern \"C\"`; and exported symbols in shared libraries form part of the ABI.", "p": "Declaring a C library's functions without `extern \"C\"` in C++: the linker looks for mangled names and reports undefined references.", "f": ["How do you demangle a symbol? => `c++filt _ZN2ns1fEi` or `nm -C lib.a`.", "Why can't you overload `extern \"C\"` functions? => C linkage uses the plain name, so two overloads would produce the same symbol."]}, "19": {"d": "A declaration introduces a name and its type; a definition is a declaration that also creates the entity (allocates storage for variables or provides the body of a function or the members of a class).", "x": "Examples: `extern int x;` and `void f(int);` and `class Widget;` are declarations; `int x = 0;`, `void f(int) { }` and `class Widget { ... };` are definitions.\n\nA name can be declared many times but (with exceptions for inline entities, templates and classes across translation units) defined only once: the One Definition Rule.\n\nForward declarations (`class Widget;`) let headers refer to pointers and references to a type without including its full definition, which cuts compile times and breaks include cycles.", "p": "Using a forward-declared (incomplete) type by value or calling its members in a header; the compiler needs the full definition for size and member access.", "f": ["When is a forward declaration enough? => When you only use pointers or references to the type, or declare functions taking or returning it.", "Is `class Widget;` a declaration or definition? => A declaration (it introduces an incomplete type)."]}, "20": {"d": "A translation unit is one source file after preprocessing (all includes expanded and macros replaced); it is the unit the compiler turns into one object file.", "x": "Each `.cpp` becomes an independent translation unit; the compiler sees nothing from other `.cpp` files except what headers declare. The linker then combines object files and resolves external symbols.\n\nThis model explains many rules: internal linkage (`static`, unnamed namespaces) is per translation unit; templates must usually be defined in headers because each unit instantiates them; and inline functions may be defined once per unit.\n\nLarge headers included by hundreds of units dominate build time; precompiled headers, forward declarations, pImpl and C++20 modules reduce that cost.", "p": "Putting non-inline definitions in headers: each translation unit that includes them defines the entity again, and the link fails.", "f": ["Why must templates usually be defined in headers? => Each translation unit instantiates templates for the types it uses, so it needs the full definition.", "What does unity (jumbo) build mean? => Concatenating many `.cpp` files into one translation unit to reduce repeated header parsing."]}, "21": {"d": "Building C++ is four stages: preprocessing (includes, macros), compilation (to assembly/IR), assembly (to object files) and linking (combining objects and libraries into an executable or library).", "x": "1. **Preprocess**: `g++ -E` shows the expanded source; includes and macros vanish here.\n2. **Compile**: parsing, semantic analysis, template instantiation and optimization produce assembly (`-S`).\n3. **Assemble**: machine code into an object file with a symbol table (`-c`).\n4. **Link**: resolves symbols across object files and static libraries; with shared libraries some resolution happens at load time.\n\nLink-time optimization (`-flto`) lets the optimizer see across translation units. Knowing which stage failed speeds up debugging: a missing header is a preprocessor error, a type error is compilation, \"undefined reference\" is linking.", "p": "Treating \"undefined reference to foo\" as a compiler problem; it's the linker: a definition wasn't compiled, a library wasn't linked, or link order/mangling is wrong.", "f": ["How do you see the preprocessed output? => `g++ -E file.cpp`.", "What does LTO do? => Delays optimization to link time so the compiler can inline and optimize across translation units."]}, "22": {"d": "`.h` and `.hpp` are only naming conventions; the compiler treats included files identically regardless of extension.", "x": "Teams use `.hpp` to signal a C++-only header (classes, templates, namespaces) and `.h` for headers usable from C or shared C/C++ interfaces. Some projects use `.hxx`, `.hh` or `.inl` (inline/template implementation files included from the header).\n\nWhat matters is consistency within a codebase and the content: headers meant to be consumed by C must avoid C++ features and wrap declarations in `extern \"C\"` guarded by `#ifdef __cplusplus`.", "p": "Including a C++-only header (templates, namespaces) from a `.c` file because it is named `.h`.", "f": ["How do you write a header usable from both C and C++? => Use only C constructs and wrap declarations in `#ifdef __cplusplus extern \"C\" { #endif ... }`.", "What is an `.inl` or `.tpp` file? => A file holding inline or template definitions, included at the end of the header to keep the interface readable."]}, "23": {"d": "The One Definition Rule requires that every non-inline function and variable has exactly one definition in the whole program, and that inline entities, classes and templates defined in several translation units have identical definitions.", "x": "Two flavours: within a translation unit, nothing may be defined twice; across the program, non-inline functions and variables are defined once, while classes, inline functions, templates and inline variables may appear in several translation units if the token sequences (and meanings) are identical.\n\nODR violations across translation units are often **not diagnosed**: two different `struct Config` definitions in different `.cpp` files can link fine and then crash at runtime, because the linker silently picks one inline member function. Tools: `-fsanitize=address` with ODR detection, `-Wodr` with LTO, and unique namespaces.", "p": "Defining two different helper classes with the same name (e.g. `Helper`) at global scope in two `.cpp` files: an undiagnosed ODR violation. Put them in unnamed namespaces.", "f": ["Why is an ODR violation dangerous? => The program can link without error and behave incorrectly, since the linker keeps only one of the differing inline definitions.", "How do unnamed namespaces prevent ODR problems? => They give internal linkage, so identically named entities in different translation units are distinct."]}, "24": {"d": "A shallow copy copies member values as they are (so pointers share the same pointee); a deep copy duplicates the owned resources so each object owns its own.", "x": "The implicitly generated copy constructor and assignment copy each member. For a raw owning pointer that means two objects point to the same buffer, and both destructors free it: a double free.\n\nSolutions, in order of preference: don't own raw resources (use `std::vector`, `std::string`, `std::unique_ptr`, which copy correctly or are move-only); if you must, implement the **Rule of Three/Five** (destructor, copy constructor, copy assignment, and move operations), typically with copy-and-swap.\n\n`std::shared_ptr` members give shared ownership, which is a deliberate shallow copy, not a deep one.", "p": "Writing a destructor that deletes a raw pointer member but relying on the default copy constructor: copies share the pointer and the program double-frees.", "f": ["What is the Rule of Zero? => Design classes so they need none of the special member functions, by holding resources in RAII members.", "What is copy-and-swap? => Implement assignment by copying the argument (by value) and swapping it with `*this`, giving strong exception safety."]}, "25": {"d": "Every expression has a value category: an **lvalue** designates an object with identity (you can take its address), a **prvalue** is a pure temporary value, and an **xvalue** is an expiring object (e.g. the result of `std::move`).", "x": "Rough test: if you can take its address with `&`, it's an lvalue (`x`, `*p`, `arr[i]`, a function returning `T&`). Literals and expressions like `x + 1` or `f()` returning by value are prvalues. `std::move(x)` yields an xvalue: it still refers to `x`, but marks it as movable.\n\n**glvalue** = lvalue or xvalue (has identity); **rvalue** = prvalue or xvalue (can be moved from).\n\nWhy it matters: overload resolution uses value categories. `T&` binds to lvalues, `T&&` to rvalues, `const T&` to both. That's how move constructors are chosen for temporaries and copy constructors for named objects.", "p": "Believing a named rvalue reference is an rvalue: inside `void f(Widget&& w)`, `w` is an lvalue, so passing it on requires `std::move(w)` (or `std::forward` in templates).", "f": ["Is `std::move` a move? => No, it's a cast to an xvalue (`static_cast<T&&>`); the actual move happens when a move constructor or assignment is selected.", "What category is a string literal? => An lvalue (an array of const char with static storage); other literals like `42` are prvalues."]}, "26": {"d": "Undefined behaviour is program behaviour for which the C++ standard imposes no requirements, so the compiler may assume it never happens and the result can be anything.", "x": "Common sources: out-of-bounds access, dereferencing null or dangling pointers, use after free, signed integer overflow, data races, reading uninitialized variables, violating strict aliasing, and modifying an object through a pointer after casting away its original `const`.\n\nOptimizers exploit the \"UB never happens\" assumption: a null check after a dereference can be deleted, and a loop with signed overflow can be turned into an infinite loop. So UB can appear to work in debug builds and break in release builds.\n\nTools: `-fsanitize=address,undefined`, `-fsanitize=thread` for races, compiler warnings (`-Wall -Wextra`), static analysers, and `constexpr` evaluation (UB in constant expressions is a compile error).", "p": "Testing that code \"works\" instead of proving it has no UB: behaviour can change with compiler version, optimization level or unrelated edits.", "f": ["How is UB different from unspecified behaviour? => Unspecified behaviour picks one of several valid outcomes (e.g. argument evaluation order); UB imposes no requirements at all.", "How do you catch UB at runtime? => Build tests with sanitizers: `-fsanitize=address,undefined` (and `thread` for races)."]}, "27": {"d": "The four named casts separate intentions: `static_cast` for well-defined conversions, `dynamic_cast` for checked polymorphic downcasts, `const_cast` to add or remove const/volatile, and `reinterpret_cast` to reinterpret bits between unrelated types.", "x": "- `static_cast`: numeric conversions, `void*` to typed pointer, up/down casts in a hierarchy without runtime checks (downcasting to the wrong type is UB).\n- `dynamic_cast`: requires a polymorphic base (a virtual function); returns `nullptr` for pointers or throws `std::bad_cast` for references on failure; has runtime cost (RTTI).\n- `const_cast`: for calling legacy APIs that aren't const-correct; modifying an originally const object is UB.\n- `reinterpret_cast`: pointer to integer, unrelated pointer types; almost always implementation-specific, and accessing an object through an incompatible type violates strict aliasing. For type punning use `std::memcpy` or C++20 `std::bit_cast`.\n\nAvoid C-style casts `(T)x`: they silently try all of the above, including the dangerous ones.", "p": "Using `reinterpret_cast<float*>(&some_int)` to read the bits of an int as a float: undefined behaviour under strict aliasing; use `std::bit_cast<float>(some_int)`.", "f": ["Why are named casts better than C-style casts? => They state intent, are searchable, and the compiler rejects casts that don't fit that intent.", "What does `dynamic_cast` need to work? => A polymorphic type (at least one virtual function) and RTTI enabled."]}, "28": {"d": "Header-only libraries place all definitions in headers (inline or templates), while compiled libraries keep declarations in headers and definitions in `.cpp` files built into object code.", "x": "Header-only: easy to integrate (just include), required for templates anyway, allows inlining across the boundary. Costs: longer compile times (every translation unit parses everything) and every change rebuilds all users.\n\nSeparate `.h`/`.cpp`: faster incremental builds, implementation hidden, stable ABI possible with techniques like pImpl, but consumers must link the library and ABI compatibility matters.\n\nMany libraries mix both: templates in headers, heavy non-template code compiled (Boost offers both modes for some libraries; fmt and spdlog can be header-only or compiled).", "p": "Making a large non-template library header-only for convenience, then paying for it with minutes of extra compile time across hundreds of files.", "f": ["Why are template libraries usually header-only? => Templates are instantiated per translation unit and need their full definition there (unless explicitly instantiated).", "What is explicit instantiation used for? => Compiling a template once for known types in a `.cpp` (`template class Foo<int>;`) to cut compile times and keep definitions out of headers."]}, "29": {"d": "RVO (return value optimization) constructs a returned temporary directly in the caller's storage; NRVO does the same for a named local variable; both remove the copy or move.", "x": "Since C++17, eliding the copy for a **prvalue** return (`return Widget{...};`) is guaranteed, so it works even for types that aren't copyable or movable. NRVO (`Widget w; ...; return w;`) is still an optimization the compiler may skip, for example when different branches return different named objects.\n\nWhen elision doesn't happen, returning a local by value still moves automatically (implicit move), so there's no need to write `return std::move(w);`, and doing so actually **prevents** NRVO.\n\nThis is why returning large objects by value (vectors, strings) is the idiomatic, efficient choice.", "p": "Writing `return std::move(local);`: it disables NRVO and forces a move where no operation would have been needed.", "f": ["Is RVO guaranteed? => For prvalues since C++17, yes (mandatory copy elision); NRVO remains optional.", "What happens if NRVO doesn't apply? => The returned local is treated as an rvalue and moved (or copied if it has no move constructor)."]}, "30": {"d": "C++ is statically typed (types are checked at compile time) and fairly strongly typed, but it allows several implicit conversions inherited from C, so it is weaker than languages like Rust or Haskell.", "x": "Static vs dynamic typing is about **when** types are checked (compile time vs runtime); strong vs weak is about how freely the language converts between types.\n\nC++ weak spots: implicit numeric conversions and narrowing (`int i = 3.7;`), integer promotions, array-to-pointer decay, implicit bool conversions, and user-defined implicit conversions.\n\nWays to strengthen it: brace initialization (narrowing becomes an error), `explicit` constructors and conversion operators, `enum class`, strong typedefs (wrapper types like `struct Lba { uint64_t v; };`), and warnings such as `-Wconversion`.", "p": "Declaring single-argument constructors without `explicit`, allowing surprising implicit conversions like passing `42` where a `Buffer` was expected.", "f": ["How does brace initialization help type safety? => Narrowing conversions (like double to int) inside `{}` are compile errors.", "What is a strong typedef? => A small wrapper type (e.g. `struct Lba`) so values with different meanings can't be mixed accidentally, at zero runtime cost."]}, "31": {"d": "The four pillars of OOP are encapsulation (hide state behind an interface), abstraction (expose what, not how), inheritance (derive specialized types) and polymorphism (one interface, many implementations).", "x": "In C++ they map to concrete features: encapsulation to access specifiers and invariants maintained by member functions; abstraction to abstract classes and well-chosen interfaces; inheritance to derived classes; polymorphism to virtual functions (runtime) and overloading/templates (compile time).\n\nModern C++ design leans on composition over inheritance, and on static polymorphism (templates, concepts) where runtime flexibility isn't needed, because virtual dispatch has costs (indirect calls, no inlining, heap-allocated objects).\n\nA strong interview answer ties each pillar to a design benefit: encapsulation protects invariants, abstraction reduces coupling, inheritance enables reuse of interfaces, polymorphism lets code work with types written later.", "p": "Reciting the four words without examples. Interviewers expect how C++ implements each and when not to use inheritance.", "f": ["What is static vs dynamic polymorphism in C++? => Static: overloading and templates resolved at compile time. Dynamic: virtual functions resolved at runtime through the vtable.", "Which pillar is most often misused? => Inheritance, when used for code reuse instead of modelling an is-a relationship; composition is usually better."]}, "32": {"d": "Encapsulation is bundling data with the functions that operate on it and restricting direct access, so the class can guarantee its invariants.", "x": "An **invariant** is a condition that must always hold, e.g. a `Buffer`'s size never exceeds its capacity. Making data `private` and changing it only through member functions means every change passes through code that maintains the invariant.\n\nEncapsulation also enables changing the representation later (switch a `std::vector` to a ring buffer) without breaking users.\n\nIt's not the same as writing getters and setters for every field: a class whose members all have trivial get/set pairs has no real encapsulation. Expose operations with meaning (`deposit`, `withdraw`), not raw fields.", "p": "Adding a public setter for every private member, which lets any caller break the invariants the class exists to protect.", "f": ["What is a class invariant? => A property that holds after construction and after every public member function returns, such as `size() <= capacity()`.", "When is a plain struct with public fields fine? => When there is no invariant to protect, e.g. a coordinate or a protocol header record."]}, "33": {"d": "Abstraction is exposing only the essential behaviour of a component through an interface while hiding implementation details.", "x": "In C++ abstraction appears as abstract base classes (pure virtual functions), well-designed class interfaces, function signatures, and concepts that describe requirements for templates.\n\nExample: a `BlockDevice` interface with `read(lba, buf)` and `write(lba, buf)` hides whether the implementation talks NVMe, SATA, a RAM disk or a simulator. Test code written against the abstraction runs against all of them.\n\nAbstraction and encapsulation are related but distinct: abstraction decides **what** is exposed; encapsulation enforces **how** access is restricted.", "p": "Leaky abstractions: an interface exposing implementation details (like NVMe-specific error codes in a generic `BlockDevice`), which couples every user to one implementation.", "f": ["Abstraction vs encapsulation? => Abstraction chooses the interface (what users see); encapsulation hides and protects the implementation behind it.", "How do C++20 concepts provide abstraction? => They state the requirements a template argument must meet, like an interface checked at compile time."]}, "34": {"d": "A class is a user-defined type describing data and behaviour; an object is an instance of that type occupying storage with a lifetime.", "x": "A class definition specifies members (data and functions), access control, and special members (constructors, destructor, copy and move operations). Objects are created with automatic storage (on the stack), static storage, dynamically (`new` / smart pointers), or as members and array elements of other objects.\n\nAn object's size is at least the sum of its non-static data members plus padding for alignment, plus a vptr if the class has virtual functions. Member functions don't take space in each object; they're shared code, and static members exist once per class.\n\nObject lifetime begins when construction completes and ends when the destructor starts; accessing an object outside its lifetime is undefined behaviour.", "p": "Assuming `sizeof(obj)` equals the sum of member sizes; padding and a vptr often make it larger.", "f": ["Does a member function increase object size? => No; only data members, padding and (for polymorphic classes) the vptr do.", "What is the size of an empty class? => At least 1 byte, so distinct objects have distinct addresses."]}, "35": {"d": "Access specifiers `public`, `protected` and `private` control which code may name a class member: everyone, the class and its derived classes, or only the class itself (plus friends).", "x": "Access is checked at compile time and applies to names, not objects: a member function can access private members of **other objects** of the same class (which is how copy constructors work).\n\nIn inheritance, the base-specifier (`public`, `protected`, `private` inheritance) caps the access of inherited members: with private inheritance, base public members become private in the derived class.\n\nAccess control is not a security boundary: it's a compile-time design tool. Protected data members are generally discouraged because derived classes then depend on base internals.", "p": "Believing `private` means \"private per object\": a member function can read another instance's private members of the same class.", "f": ["Can a member function access private members of another object of the same class? => Yes; access is per class, not per object.", "Why are protected data members discouraged? => Every derived class can modify them, so the base can't maintain its invariants."]}, "36": {"d": "A friend function is a non-member function (or class) declared with `friend` inside a class, granting it access to the class's private and protected members.", "x": "Friendship is granted by the class, not taken; it isn't inherited and isn't transitive.\n\nLegitimate uses: symmetric operators like `operator<<` and `operator==` that need private data but shouldn't be members (so conversions apply to both operands); tightly coupled helper classes (an iterator of a container); and the \"hidden friend\" idiom, where a friend defined inside the class is only found by ADL, reducing overload-set pollution.\n\nOverusing friends breaks encapsulation; prefer adding a proper public member when many outsiders need the same access.", "p": "Making a whole test class or unrelated module a friend to get at private data, which couples them tightly to implementation details.", "f": ["Why is `operator<<` usually a friend rather than a member? => Its left operand is `std::ostream`, so it can't be a member of your class; being a friend gives it access to private data.", "What is a hidden friend? => A friend function defined inside the class body; it isn't visible to ordinary lookup, only through ADL on arguments of that class."]}, "37": {"d": "A static member belongs to the class itself rather than to any object: static data exists once for all instances, and static member functions have no `this` pointer.", "x": "Static data members need a definition in exactly one translation unit, unless declared `inline static` (C++17) or `static constexpr`, which can be defined in the class body.\n\nStatic member functions can be called without an object (`Registry::instance()`), can access static members, and have ordinary function pointer types (so they work as C callbacks).\n\nStatic data members are initialized before `main` (for constant initialization) or dynamically in unspecified order across translation units; wrap them in a function-local static when initialization order matters.", "p": "Declaring `static int count;` in a class and forgetting the out-of-class definition, producing an \"undefined reference\" link error (fixed in C++17 with `inline static`).", "f": ["Why can a static member function be used as a C callback? => It has no hidden `this` parameter, so its type is an ordinary function pointer.", "How do you define a static data member in a header since C++17? => `inline static int count = 0;` inside the class."]}, "38": {"d": "A member function is part of the class and receives an implicit `this`; a friend function is a non-member that has been granted access to the class's private members.", "x": "Differences: member functions are called on an object (`obj.f()`), can be virtual, and have the object as an implicit first argument; friends are called like free functions, can't be virtual, and take all operands explicitly.\n\nA key reason to prefer friend (or free) functions for binary operators: implicit conversions apply to **both** operands only for non-members. With `Money operator+(const Money&) const` as a member, `m + 5` may work but `5 + m` won't.\n\nScott Meyers' guideline: prefer non-member non-friend functions where possible; they increase encapsulation because they can use only the public interface.", "p": "Implementing `operator==` or `operator+` as members and discovering that `5 + m` fails to compile while `m + 5` works.", "f": ["Can a friend function be virtual? => No; virtual applies only to non-static member functions.", "Why prefer non-member non-friend functions? => They can only use the public interface, so fewer functions depend on private data."]}, "39": {"d": "No: a static member function has no `this` pointer, so it can access non-static members only through an explicit object (reference or pointer) passed to it.", "x": "Inside a static member function, `x` (a non-static data member) has no object to refer to, so it's a compile error. You can still access private non-static members **of an object you are given**, because access control is per class: `static void reset(Counter& c) { c.value_ = 0; }` is legal.\n\nThis is common for factory functions (`static Widget create(...)` constructing and configuring a new object) and C-style callbacks that receive a `void* user_data` which is cast back to the object.", "p": "Trying to call a non-static member function from a static callback without an object, instead of passing the object through the callback's user-data pointer.", "f": ["How do you call a member function from a C callback? => Register a static member function and pass `this` as the `void*` user data; cast it back inside the callback.", "Can a static member function be const or virtual? => Neither; both qualifiers need a `this` object."]}, "40": {"d": "`this` is a prvalue pointer to the object on which a non-static member function was called; its type is `T*` or `const T*` in a const member function.", "x": "Uses: disambiguating members from parameters (`this->size = size`), returning `*this` for chaining (`Builder& set(...) { ...; return *this; }`), passing the current object to other functions, and accessing dependent base-class members in templates (`this->member` makes the name dependent so it is found in the base).\n\nC++23 adds **explicit object parameters** (\"deducing this\"): `void f(this Self&& self)` lets one function handle const/non-const and lvalue/rvalue objects, and simplifies CRTP.\n\n`delete this` is legal only if the object was allocated with `new` and is never touched afterward.", "p": "Capturing `this` in a lambda stored for later (e.g. an async callback) and calling it after the object was destroyed, producing a dangling pointer.", "f": ["Why do you need `this->` in class templates with dependent bases? => Names from a dependent base aren't looked up by default; `this->` makes the name dependent so it's found at instantiation.", "What does C++23 deducing this change? => Member functions can take the object as an explicit, deduced parameter, removing duplicated const/non-const overloads and CRTP boilerplate."]}, "41": {"d": "Composition builds a type from member objects (\"has-a\"); inheritance derives a type from a base (\"is-a\"). Prefer composition unless you need substitutability through a common interface.", "x": "Inheritance couples the derived class to the base's implementation (the fragile base class problem) and is fixed at compile time. Composition keeps components independent, lets you swap implementations (pass a different strategy object), and hides the component's interface unless you choose to forward it.\n\nUse public inheritance when the derived type genuinely **is** a base type and should be usable wherever the base is expected (Liskov substitution), usually through a small abstract interface.\n\nA good pattern is \"inherit interfaces, compose implementations\": classes implement abstract interfaces and delegate work to member objects.", "p": "Inheriting from `std::vector` to get a container with extra methods: `std::vector` has no virtual destructor, and the derived class exposes every vector operation, including ones that break its invariants.", "f": ["Why shouldn't you publicly inherit from STL containers? => They lack virtual destructors and weren't designed as bases; wrap them as members instead.", "What is the fragile base class problem? => Changes inside a base class can break derived classes that depend on its implementation details."]}, "42": {"d": "An abstract class is a class with at least one pure virtual function (`= 0`); it cannot be instantiated and serves as a base defining an interface.", "x": "Derived classes must override all pure virtual functions to become concrete. An abstract class can still have data members, constructors and non-pure member functions providing shared behaviour.\n\nA pure virtual function may even have a definition, which derived classes can call explicitly (`Base::f()`). A pure virtual destructor must have a definition, because derived destructors always call it.\n\nAbstract classes are used through pointers or references (`std::unique_ptr<Shape>`, `const Shape&`); you can't pass or return them by value.", "p": "Forgetting to implement one pure virtual function in a derived class: the derived class silently stays abstract and fails only when someone tries to instantiate it.", "f": ["Can an abstract class have a constructor? => Yes; it initializes base state and runs when derived objects are constructed.", "Can a pure virtual function have a body? => Yes; derived classes can call it explicitly, and a pure virtual destructor must have one."]}, "43": {"d": "C++ has no `interface` keyword; an interface is conventionally a class containing only pure virtual functions and a virtual destructor (often with protected or defaulted special members).", "x": "Typical interface: `struct ILogger { virtual ~ILogger() = default; virtual void log(std::string_view) = 0; };`.\n\nClasses implement several interfaces through multiple inheritance, which is safe when the interfaces have no data members (no diamond data duplication).\n\nAlternatives: C++20 **concepts** give compile-time interfaces for templates without virtual dispatch; type erasure (`std::function`, custom type-erased wrappers) gives runtime polymorphism without inheritance.", "p": "Omitting the virtual destructor in an interface, so deleting an implementation through an interface pointer is undefined behaviour.", "f": ["Interface via abstract class vs concept? => Abstract classes give runtime polymorphism with virtual calls; concepts constrain templates at compile time with no runtime cost.", "Is multiple inheritance of interfaces problematic? => Not usually; pure interfaces have no data, so the diamond data problem doesn't arise."]}, "44": {"d": "Overloading is multiple functions with the same name but different parameters in the same scope, resolved at compile time; overriding is a derived class redefining a base class virtual function with the same signature, resolved at runtime.", "x": "Mark overrides with `override`: the compiler then errors if the signature doesn't match a base virtual function (e.g. a missing `const`, a different parameter type). Without it, a mismatch silently creates a new function that hides the base one.\n\nA derived class declaring a function with the same name as a base function **hides** all base overloads of that name, even with different parameters; bring them back with `using Base::f;`.\n\n`final` prevents further overriding of a function or derivation from a class, and can let the compiler devirtualize calls.", "p": "Changing a base virtual function's signature (adding `const`) while derived classes lack `override`: they stop overriding, and calls quietly go to the base version.", "f": ["What does `override` protect against? => Signature mismatches that would otherwise create a new, non-overriding function.", "What is name hiding? => Declaring `f` in a derived class hides every base-class `f` overload; `using Base::f;` brings them back."]}, "45": {"d": "No. A constructor can't be virtual because virtual dispatch needs an existing object with an initialized vptr, and the constructor is what creates that object; the caller must know the exact type.", "x": "When you write `new Circle(...)`, the type is fixed at the call site, so there's nothing to dispatch on. During construction, the vptr is set to each class's vtable in turn as base and member construction proceeds.\n\nWhen you need \"virtual construction\" (creating an object whose type is chosen at runtime, or copying through a base pointer), use the **virtual constructor idiom**: a virtual `clone()` for copies and factory functions or registries for creation.", "p": "Trying to get polymorphic copying via the copy constructor of a base class, which slices; use a virtual `clone()` returning `std::unique_ptr<Base>`.", "f": ["How do you copy an object through a base pointer? => Add `virtual std::unique_ptr<Base> clone() const = 0;` and implement it in each derived class.", "What does the vptr point to during base-class construction? => The base class's vtable; it's updated to the derived vtable when the derived constructor body starts."]}, "46": {"d": "Destructors can and often must be virtual: if an object is deleted through a pointer to its base class, the base destructor must be virtual, otherwise behaviour is undefined (typically the derived destructor never runs).", "x": "With a virtual destructor, `delete basePtr;` calls the most-derived destructor first, then each base destructor in reverse order of construction. Without it, only the base destructor runs (derived resources leak), and formally the behaviour is undefined.\n\nRule of thumb (Herb Sutter): a base class destructor should be either **public and virtual** (polymorphic deletion allowed) or **protected and non-virtual** (deletion through the base is prevented at compile time).\n\n`std::shared_ptr<Base>(new Derived)` captures the correct deleter even without a virtual destructor; `std::unique_ptr<Base>` does not.", "p": "Deleting derived objects through `std::unique_ptr<Base>` when `Base` has no virtual destructor: the derived part is never destroyed.", "f": ["When should a destructor not be virtual? => In classes not meant to be used polymorphically, or bases with a protected non-virtual destructor, to avoid the vptr overhead.", "Why does `shared_ptr<Base>` work without a virtual destructor? => It stores a deleter for the actual type at construction; `unique_ptr<Base>` uses `default_delete<Base>`."]}, "47": {"d": "A pure virtual function is a virtual function declared with `= 0`; it has no required implementation in the base, makes the class abstract, and must be overridden by concrete derived classes.", "x": "Syntax: `virtual double area() const = 0;`. The vtable slot for it points to a runtime handler (`__cxa_pure_virtual` in GCC/Clang) that aborts if it's ever called, which can only happen during construction or destruction of the base.\n\nPure virtual functions may still have a definition outside the class, callable explicitly; this is used to provide default behaviour that derived classes must opt into.", "p": "Calling a pure virtual function indirectly from a base constructor or destructor, leading to a \"pure virtual function called\" abort at runtime.", "f": ["What happens if a pure virtual function is called during construction? => It resolves to the base (pure) version and the program aborts with \"pure virtual function called\".", "Why give a pure virtual function a body? => To offer default behaviour that derived classes must explicitly choose to reuse by calling `Base::f()`."]}, "48": {"d": "With `struct` the default inheritance is `public`; with `class` it is `private`. The keyword of the **derived** class decides the default.", "x": "`struct D : B {}` is public inheritance; `class D : B {}` is private inheritance. Default member access follows the same rule (public for struct, private for class).\n\nPrivate inheritance means \"implemented in terms of\": base public members become private in the derived class, and a `D*` can't be implicitly converted to `B*` outside `D`. It's rarely needed; composition usually expresses the same thing more clearly, except when you need to override a base virtual function or use the empty base optimization.\n\nAlways write the access specifier explicitly (`class D : public B`) to avoid relying on defaults.", "p": "Omitting `public` in `class Derived : Base`, then getting \"Base is an inaccessible base of Derived\" when passing `Derived*` to a function taking `Base*`.", "f": ["When is private inheritance useful? => To override a virtual function of a base you don't want to expose, or to benefit from empty base optimization; otherwise prefer composition.", "Which keyword decides the default: the base's or the derived's? => The derived class's keyword."]}, "49": {"d": "\"Is-a\" means a type is a specialized kind of another type (modelled with public inheritance); \"has-a\" means a type contains another as a part (modelled with composition, i.e. a data member).", "x": "Test for is-a: can the derived object be used anywhere the base is expected without surprising behaviour (Liskov substitution)? A `Car` is a `Vehicle`; a `Car` has an `Engine`.\n\nWrong is-a relationships cause trouble: a `Square` inheriting from `Rectangle` breaks code that sets width and height independently. When in doubt, choose has-a: it's easier to change later.\n\nHas-a also covers weaker relationships: aggregation (a part that can exist independently, often a pointer or reference) versus composition (the part's lifetime is owned by the whole).", "p": "Using inheritance to reuse code (\"Stack is-a vector\") when the relationship is really has-a; the derived class then exposes operations that break its semantics.", "f": ["How do you decide between is-a and has-a? => If substitutability through the base interface makes sense, is-a; otherwise has-a.", "Why is Square-inherits-Rectangle a classic LSP violation? => Code that sets width and height independently breaks for a Square, so it isn't substitutable."]}, "50": {"d": "Overriding replaces a base class **virtual** function with the same signature, selected at runtime; hiding happens when a derived class declares a name that makes base members with that name invisible, selected at compile time by static type.", "x": "Hiding occurs for non-virtual functions with the same name, and for any same-named function with different parameters (even if the base one is virtual). Calls through a base pointer then use the base function; calls through a derived object see only the derived name.\n\nFixes: `using Base::f;` in the derived class to re-expose base overloads; `override` to confirm an intended override; and avoid redefining non-virtual base functions entirely (Effective C++, Item 36).", "p": "Adding `void f(double)` in a derived class and finding that `derived.f(42)` no longer calls the base's `f(int)`, because the base overload is hidden.", "f": ["How do you bring hidden base overloads back? => `using Base::f;` inside the derived class.", "Why is redefining a non-virtual base function a bad idea? => Behaviour then depends on the static type of the pointer or reference used, which surprises readers."]}, "51": {"d": "Most compilers implement virtual functions with a per-class **vtable** (a table of function pointers) and a hidden per-object **vptr** that points to the vtable of the object's dynamic type.", "x": "A virtual call `p->f()` loads the vptr from the object, loads the function pointer from a fixed slot in the vtable, and calls it indirectly. Cost: one or two memory loads plus an indirect call, and more importantly the lost opportunity to inline.\n\nEach polymorphic object grows by one pointer (per base subobject with virtual functions in multiple inheritance). The vtable also usually holds RTTI (type info) and offsets used for multiple and virtual inheritance.\n\nThe standard doesn't require vtables; they are the universal implementation strategy (specified by the Itanium C++ ABI on Linux, and by MSVC's ABI on Windows). Compilers can devirtualize calls when the dynamic type is known (e.g. `final` classes or objects of known type).", "p": "Assuming virtual calls are always \"slow\": the indirect call is cheap; the real cost is lost inlining in hot loops. Measure before replacing virtual dispatch with templates.", "f": ["Where is the vptr set? => In each constructor (and destructor) of the hierarchy, so it reflects the class currently being constructed or destroyed.", "What does `final` enable? => The compiler knows no further override exists, so it can devirtualize and inline calls."]}, "52": {"d": "Calling a virtual function from a constructor or destructor dispatches to the version of the class currently being constructed or destroyed, not to the most-derived override.", "x": "During `Base`'s constructor, the `Derived` part doesn't exist yet (its members are uninitialized), so the language deliberately treats the object as a `Base`: the vptr points to `Base`'s vtable. The same applies in reverse during destruction, where the derived part has already been destroyed.\n\nIf the function is pure virtual in `Base`, the call is undefined behaviour, typically aborting with \"pure virtual function called\".\n\nFix: move polymorphic initialization into a separate `init()` called after construction, use a factory function that constructs and then initializes, or pass the needed information to the base constructor as parameters.", "p": "Expecting a base constructor's call to `virtual void setup()` to run the derived override; it runs the base version, so derived setup silently never happens.", "f": ["Why doesn't C++ dispatch to the derived override during base construction? => The derived members aren't initialized yet, so calling derived code would use uninitialized state.", "How do you run derived-specific initialization after construction? => Two-phase construction via a factory function, or pass the data up through base constructor parameters."]}, "53": {"d": "Object slicing occurs when a derived object is copied into a base-class object by value: only the base subobject is copied, and the derived data and dynamic type are lost.", "x": "Examples: passing a `Derived` to a function taking `Base` by value, assigning `Base b = derived;`, or storing derived objects in `std::vector<Base>`. After slicing, virtual calls on the copy run the base implementation.\n\nA subtler form is **partial assignment**: `Base& r = d1; r = d2;` copies only the base part of `d2` into `d1`, leaving a mixed object.\n\nSlicing is the reason polymorphic types are handled through pointers or references (`std::unique_ptr<Base>`, `const Base&`).", "p": "Storing polymorphic objects in `std::vector<Shape>`: every element is sliced to a plain `Shape`, and virtual calls no longer reach the derived overrides.", "f": ["How do you store heterogeneous derived objects in a container? => `std::vector<std::unique_ptr<Base>>`, or `std::vector<std::variant<A, B>>` for a closed set of types.", "What is partial assignment? => Assigning through a base reference copies only the base subobject, leaving the target half old, half new."]}, "54": {"d": "Prevent slicing by handling polymorphic objects through references or pointers and by making it impossible to copy the base class by value.", "x": "Techniques:\n\n- Pass and store by `const Base&`, `Base*` or smart pointers.\n- In polymorphic bases, delete or protect copy operations: `Base(const Base&) = delete; Base& operator=(const Base&) = delete;` (C++ Core Guidelines C.67). Then accidental by-value copies are compile errors.\n- Provide a virtual `clone()` when copies are genuinely needed.\n- Make bases abstract so they can't be instantiated by value at all.\n- For closed sets of types, use `std::variant` instead of inheritance: values then carry their full type.", "p": "Leaving the implicitly generated copy constructor public in a polymorphic base, so slicing compiles silently wherever someone passes by value.", "f": ["What does C++ Core Guideline C.67 recommend? => A polymorphic class should suppress public copy/move to prevent slicing.", "How does `std::variant` avoid slicing? => The variant stores the complete object of whichever alternative it holds, by value."]}, "55": {"d": "The diamond problem arises when a class inherits from two classes that share a common base: without special handling the final object contains two copies of that base, making member access ambiguous. C++ solves it with **virtual inheritance**.", "x": "With `class A {}; class B : public A {}; class C : public A {}; class D : public B, public C {};`, a `D` holds two `A` subobjects, so `d.x` (a member of `A`) is ambiguous, and converting `D*` to `A*` is ambiguous.\n\nDeclaring `class B : virtual public A` and `class C : virtual public A` makes `D` contain a single shared `A` subobject. The **most-derived class** (`D`) is then responsible for constructing `A`; `B`'s and `C`'s initializations of `A` are ignored.\n\nVirtual inheritance has costs (extra pointers or offsets, slower access to base members), so it's used mostly for interface-like bases (e.g. `std::iostream` from `std::istream` and `std::ostream`).", "p": "Expecting `B`'s constructor call `A(1)` to initialize the shared virtual base when constructing a `D`; the most-derived class's initializer (or `A`'s default constructor) is used instead.", "f": ["Who constructs a virtual base class? => The most-derived class, before any non-virtual bases.", "Where does the standard library use virtual inheritance? => `std::basic_iostream` derives from `basic_istream` and `basic_ostream`, which virtually inherit `basic_ios`."]}, "56": {"d": "With normal inheritance a base subobject sits at a fixed offset inside each derived object; with virtual inheritance the shared base's position varies with the most-derived type, so it is reached through extra indirection (a virtual base offset stored via the vtable or a virtual base pointer).", "x": "Consequences of virtual inheritance: objects grow (additional pointers), casting from derived to virtual base needs a runtime offset lookup, `static_cast` from a virtual base down to a derived class is not allowed (use `dynamic_cast`), and construction order changes (virtual bases first, by the most-derived class).\n\nExact layout is ABI-specific (Itanium C++ ABI stores virtual base offsets in the vtable; MSVC uses a separate virtual base table pointer). You can inspect it with `clang -Xclang -fdump-record-layouts` or MSVC's `/d1reportSingleClassLayout`.", "p": "Using `static_cast` to downcast from a virtual base class: it's ill-formed; only `dynamic_cast` can navigate from a virtual base.", "f": ["Why can't `static_cast` downcast from a virtual base? => The offset of the virtual base inside the derived object isn't known at compile time.", "How can you view a class's memory layout? => Clang's `-fdump-record-layouts`, MSVC's `/d1reportSingleClassLayout`, or `offsetof`/`sizeof` experiments."]}, "57": {"d": "Yes. A private (or protected) destructor prevents objects from being created on the stack or deleted by outsiders, forcing a controlled lifetime such as heap-only objects destroyed through a member function or a friend.", "x": "Use cases:\n\n- **Heap-only objects** with reference counting or self-management: clients call `release()`, which does `delete this` when the count hits zero (COM-style interfaces).\n- **Singletons or registries** that must control destruction.\n- Preventing deletion through a base pointer: a **protected** non-virtual destructor in a base class makes `delete basePtr` a compile error while allowing derived classes to destroy normally.\n\nWith a private destructor, automatic (stack) objects and `std::unique_ptr` with the default deleter won't compile; provide a custom deleter or a friend that destroys.", "p": "Making the destructor private and then wondering why `std::make_unique<T>()` fails: the default deleter can't call it; supply a custom deleter or friend.", "f": ["How do you force heap-only allocation? => Private or protected destructor plus a static factory and a `destroy()`/`release()` member.", "Why use a protected non-virtual base destructor? => It prevents polymorphic deletion through the base at compile time without the cost of a vtable."]}, "58": {"d": "A covariant return type allows an overriding virtual function to return a pointer or reference to a class derived from the base function's return type.", "x": "Example: `Base* Base::clone() const` can be overridden as `Derived* Derived::clone() const`. Callers using the derived type get the precise type without casting; callers through the base still receive a `Base*`.\n\nCovariance only works with raw pointers and references, not with smart pointers: `std::unique_ptr<Derived>` is unrelated to `std::unique_ptr<Base>` as a return type for overriding. The usual workaround is a non-virtual public function returning `unique_ptr<Derived>` that calls a private virtual `clone_impl()` returning `Base*`.", "p": "Trying to override `std::unique_ptr<Base> clone()` with `std::unique_ptr<Derived> clone()`: it's a compile error, not covariance.", "f": ["Why doesn't covariance work with `unique_ptr`? => The two `unique_ptr` specializations are unrelated types; covariance is defined only for pointers and references to classes.", "What's the workaround for covariant smart-pointer clones? => A public non-virtual wrapper returning `unique_ptr<Derived>` around a private virtual function returning a raw pointer."]}, "59": {"d": "CRTP is a pattern where a class template takes the deriving class as a template argument (`class Derived : Base<Derived>`), letting the base call derived functions at compile time: static polymorphism without virtual calls.", "x": "The base does `static_cast<Derived*>(this)->impl()`; the call is resolved at compile time and can be inlined, with no vptr or vtable.\n\nUses: mixins that add functionality (comparison operators from one `compare`, `enable_shared_from_this`, counters of live instances), compile-time interfaces with zero overhead, and expression templates.\n\nLimits: each `Base<Derived>` is a different type, so you can't store heterogeneous objects in one container through the base; C++20 concepts and C++23 deducing `this` replace many CRTP uses more simply.", "p": "Writing `class B : public Base<A>` by copy-paste mistake: the base then casts `this` to the wrong type, which is undefined behaviour. Guard with a private base constructor and `friend Derived;`.", "f": ["CRTP vs virtual functions? => CRTP dispatches at compile time (inlinable, no vptr) but can't provide runtime polymorphism across a heterogeneous collection.", "Which standard library class uses CRTP? => `std::enable_shared_from_this<T>`."]}, "60": {"d": "Early (static) binding resolves a function call at compile time from the static type; late (dynamic) binding resolves it at runtime from the object's dynamic type through virtual dispatch.", "x": "Early binding applies to non-virtual functions, overloads, templates and calls on objects (not pointers or references) of known type; it allows inlining. Late binding applies to virtual functions called through a pointer or reference.\n\nA virtual function called with explicit qualification (`obj.Base::f()`) or on an object by value is also bound early.\n\nCompilers turn late binding into early binding when they can prove the dynamic type (devirtualization), e.g. with `final` classes, local objects of known type, or link-time optimization.", "p": "Expecting virtual behaviour from calls on objects passed by value; the copy has the static type, so the call is bound early to that type's function.", "f": ["Is a virtual call through an object (not a pointer) late-bound? => No; the object's type is known, so it's bound at compile time.", "What is devirtualization? => The compiler proves the dynamic type and replaces the indirect virtual call with a direct (often inlined) call."]}, "61": {"d": "A static member function has no object and therefore no vptr to dispatch through, so it can't be virtual; virtual dispatch depends on the dynamic type of an object.", "x": "Virtual means \"choose the implementation based on the object's dynamic type\". A static function is called on the class (`Widget::create()`), not on an object, so there is nothing whose dynamic type could choose.\n\nIf you need per-type behaviour without an object, options are: a virtual non-static function that returns per-type information (e.g. `virtual std::string_view typeName() const`), a registry mapping type IDs to factory functions, or templates/CRTP for compile-time per-type behaviour.", "p": "Trying to override a static function in a derived class expecting polymorphism: it only hides the base static function.", "f": ["How can you get \"virtual static\" behaviour? => A virtual instance function returning per-class data, or a registry keyed by type.", "What happens if a derived class declares a static function with the same name? => It hides the base function; calls resolve by static type."]}, "62": {"d": "When two base classes both provide a member with the same name, using it through the derived class is ambiguous; without virtual inheritance you resolve it by qualifying the name or by declaring a disambiguating member in the derived class.", "x": "Options:\n\n- Qualify the call: `d.Printer::start()` or `d.Scanner::start()`.\n- Add `using Printer::start;` in the derived class to choose one.\n- Override the function in the derived class and call one or both bases explicitly, which is often the clearest.\n\nAmbiguity is detected at the point of use, not at class definition, so a class can compile fine until someone calls the ambiguous member.", "p": "Assuming the compiler will pick the \"first\" base in the base list; it never does, the call is simply ambiguous.", "f": ["When is the ambiguity reported? => At the point where the ambiguous name is used, not when the class is defined.", "Can a `using` declaration resolve the ambiguity? => Yes: `using Base1::f;` in the derived class selects that version."]}, "63": {"d": "The empty base optimization (EBO) lets an empty base class subobject occupy zero bytes inside the derived object, even though a standalone empty object has size at least 1.", "x": "Empty classes (no non-static data members, no virtual functions) are common as policies, allocators, comparators and tag types. Storing them as data members would cost at least one byte plus padding; inheriting from them usually costs nothing.\n\nThis is why `std::unique_ptr<T, Deleter>` with a stateless deleter is the same size as a raw pointer, and why STL containers store allocators via EBO.\n\nC++20 adds `[[no_unique_address]]`, which applies the same optimization to data members without inheritance: `[[no_unique_address]] Deleter d_;`.", "p": "Storing stateless comparators or allocators as plain members in space-critical types, adding bytes (and padding) to every object.", "f": ["Why is `sizeof(std::unique_ptr<T>)` equal to `sizeof(T*)`? => The default deleter is empty and stored via EBO (or `[[no_unique_address]]`).", "What does `[[no_unique_address]]` do? => Allows an empty data member to share storage with other members, giving EBO without inheritance."]}, "64": {"d": "Inheritance is an is-a relationship between types; composition is a has-a relationship where the whole owns the part's lifetime; aggregation is a has-a relationship where the part exists independently and is only referenced.", "x": "In C++ terms: composition is usually a data member or a `std::unique_ptr` member (destroyed with the owner); aggregation is a reference, raw non-owning pointer, `std::weak_ptr` or a shared pointer to something whose lifetime is managed elsewhere; inheritance is a base class.\n\nExample: a `Car` composes its `Engine` (destroyed with the car) but aggregates a `Driver` (who exists before and after the car). In UML, composition is a filled diamond and aggregation a hollow one.\n\nGetting ownership right avoids leaks and dangling pointers: owners hold `unique_ptr`, observers hold references or raw pointers with documented lifetimes.", "p": "Modelling aggregation with `std::shared_ptr` everywhere \"to be safe\", which blurs ownership and can create reference cycles that leak.", "f": ["How do you express a non-owning reference to an aggregated part? => A reference, a raw pointer documented as non-owning, or `std::weak_ptr` when the part is shared-owned.", "What's the ownership difference between composition and aggregation? => Composition owns the part's lifetime; aggregation only refers to a part owned elsewhere."]}, "65": {"d": "The Liskov Substitution Principle states that objects of a derived class must be usable wherever the base class is expected without breaking the program's correctness.", "x": "Formally: derived classes may not **strengthen preconditions**, **weaken postconditions**, or violate the base's invariants; they must also not throw new kinds of exceptions callers don't expect.\n\nClassic violations: `Square` derived from `Rectangle` (setting width changes height), a `ReadOnlyFile` derived from `File` whose `write()` throws, or an override that ignores part of the base contract.\n\nIn C++ design this means: keep base interfaces small and precise, document contracts, prefer composition when behaviour differs, and write tests against the base interface that every implementation must pass (contract tests).", "p": "Overriding a method to throw `std::logic_error(\"not supported\")` in a derived class: callers written against the base contract break.", "f": ["What is a precondition strengthening example? => A base `setSpeed(int)` accepting any value, overridden to reject values above 100 in a derived class.", "How do you enforce LSP in practice? => Contract tests: one test suite written against the base interface that every derived implementation must pass."]}, "66": {"d": "A constructor is a special member function with the class's name and no return type that initializes a new object and establishes its invariants.", "x": "Constructors run automatically when an object is created: for locals at their declaration, for members and bases before the owning constructor's body, and for `new` after memory is allocated. If a constructor completes, the object's lifetime has begun and its destructor will run; if it throws, the object never existed.\n\nInitialize members in the member initializer list, validate arguments, and acquire resources (RAII). Keep constructors cheap and free of virtual calls.", "p": "Doing two-phase initialization (`Widget w; w.init();`) out of habit, leaving objects in half-constructed states; initialize fully in the constructor or use a factory function.", "f": ["Does a constructor return a value? => No; failures are reported by throwing, which is why exceptions matter for RAII.", "What makes a constructor `constexpr`? => It can be evaluated at compile time for constant arguments, letting objects be compile-time constants."]}, "67": {"d": "A destructor (`~ClassName()`) is called automatically when an object's lifetime ends and releases the resources the object owns.", "x": "Destructors run at scope exit for locals (in reverse order of construction), on `delete`, when containers destroy elements, and during stack unwinding after an exception. This deterministic timing is what makes **RAII** work: files, locks, sockets and memory are released without explicit cleanup code.\n\nDestructors are implicitly `noexcept`; they should never let exceptions escape. Polymorphic base classes need a virtual destructor. Members are destroyed after the destructor body, in reverse declaration order.", "p": "Calling a destructor explicitly on an automatic object (`obj.~T()`); it will be destroyed again at scope exit, which is undefined behaviour. Explicit destructor calls are only for placement-new objects.", "f": ["In what order are members destroyed? => In reverse order of declaration, after the destructor body runs.", "When is an explicit destructor call legitimate? => For objects created with placement new in manually managed storage."]}, "68": {"d": "A default constructor is one that can be called with no arguments, either because it has no parameters or all have defaults.", "x": "The compiler generates one implicitly only if you declare **no** constructors at all; declaring any constructor (including a copy constructor) removes it, which is why `Buffer a;` fails after adding `Buffer(const Buffer&)`. Bring it back with `Widget() = default;`.\n\nThe implicit default constructor leaves built-in members (ints, pointers) **uninitialized** in default-initialization. Use default member initializers (`int count = 0;`) so every constructor starts from sane values.\n\n`T()` or `T{}` value-initializes, which zeroes built-in members for classes without a user-provided default constructor; `T t;` does not.", "p": "Relying on the implicit default constructor to zero-initialize `int` and pointer members: `Widget w;` leaves them with indeterminate values.", "f": ["Why did adding a copy constructor
