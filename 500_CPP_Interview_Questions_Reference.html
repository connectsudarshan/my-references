implicit converting constructor from `int` and an implicit conversion to `int`, making nearly every mixed arithmetic expression ambiguous.", "f": ["How many user-defined conversions can one implicit conversion sequence use? => One; two chained user-defined conversions are never applied implicitly.", "What's the simplest fix for these ambiguities? => Make conversions `explicit` and add targeted overloads."]}, "140": {"d": "You can overload `operator&&` and `operator||`, but the overloaded versions are ordinary function calls: **both operands are always evaluated**, so the short-circuit behaviour of the built-ins is lost.", "x": "Code like `if (ptr && ptr->valid())` relies on short-circuiting; with an overloaded `&&` on some wrapper type, `ptr->valid()` would run even when `ptr` is null.\n\nSince C++17 the left operand is still evaluated before the right, but evaluation of both happens regardless. Expression-template libraries (Boost.Proto, some query DSLs) overload them deliberately to build expression trees rather than evaluate.\n\nGuideline: don't overload `&&`, `||` or `,` for everyday types.", "p": "Overloading `&&` on a condition wrapper and breaking null-check idioms that depend on short-circuit evaluation.", "f": ["Why can't an overloaded `&&` short-circuit? => Both arguments must be evaluated before calling the function.", "When is overloading `&&` legitimate? => In DSLs or expression templates that build an expression tree instead of evaluating immediately."]}, "141": {"d": "A pointer is an object that holds the address of another object or function (or a null value), and whose type tells the compiler what it points to.", "x": "Pointers support dereference (`*p`), member access (`p->x`), arithmetic within arrays, comparison and reassignment. The pointed-to type controls arithmetic scaling and what `*p` yields.\n\nIn modern C++, raw pointers should be **non-owning** (observers). Ownership belongs to smart pointers or containers; if something can't be null, prefer a reference; for arrays prefer `std::span`.\n\nOn embedded and driver code, pointers to `volatile` memory-mapped registers are a legitimate raw-pointer use.", "p": "Using raw owning pointers (`T* p = new T;`) in application code, making leaks and double deletes easy.", "f": ["What is a non-owning pointer? => A pointer used only to observe an object whose lifetime is managed elsewhere.", "When should you use a pointer instead of a reference? => When the target is optional (may be null) or must be reseated."]}, "142": {"d": "A null pointer is a pointer value that points to no object; in C++11 and later it is written `nullptr`, of type `std::nullptr_t`.", "x": "`nullptr` replaced `NULL` and `0` because those are integers: with overloads `f(int)` and `f(char*)`, `f(NULL)` calls the `int` version, while `f(nullptr)` correctly calls the pointer version. `nullptr` converts to any pointer and pointer-to-member type but not to integers.\n\nDereferencing a null pointer is undefined behaviour. Deleting a null pointer is a safe no-op, so `if (p) delete p;` is unnecessary.", "p": "Using `NULL` or `0` in overloaded calls or templates, where they deduce as integers instead of pointers.", "f": ["Why was `nullptr` introduced? => To have a null pointer constant with its own type that never converts to integers, fixing overload and template deduction problems.", "Is `delete nullptr` safe? => Yes, deleting a null pointer does nothing."]}, "143": {"d": "A dangling pointer points to memory that is no longer a valid object: freed heap memory, a destroyed local variable, or an element of a container that reallocated.", "x": "Common causes: using a pointer after `delete`, returning the address of a local, keeping pointers into a `std::vector` across `push_back`, storing `std::string_view` or `span` of temporaries, or capturing `this` in a callback that outlives the object.\n\nDereferencing a dangling pointer is undefined behaviour; it may appear to work until memory is reused. Detection: AddressSanitizer (heap-use-after-free, stack-use-after-return), static analysers, and lifetime-aware code review.\n\nPrevention: clear ownership with smart pointers, `std::weak_ptr` for observers of shared objects, indices instead of pointers into growing containers.", "p": "Setting `p = nullptr` after `delete p` and believing all dangling pointers are gone, while other copies of the pointer still refer to freed memory.", "f": ["Which tool catches use-after-free? => AddressSanitizer (`-fsanitize=address`).", "How do you safely observe an object owned by a `shared_ptr`? => Hold a `std::weak_ptr` and `lock()` it before use."]}, "144": {"d": "Pointer arithmetic adds or subtracts integers to move a pointer by whole elements of its pointed-to type, and subtracts two pointers into the same array to get the element distance (`std::ptrdiff_t`).", "x": "`p + n` advances by `n * sizeof(*p)` bytes. It's defined only within the same array object (including one past the end); going beyond, or subtracting pointers from different arrays, is undefined behaviour.\n\nArithmetic isn't allowed on `void*` in standard C++ (GCC allows it as an extension); cast to `std::byte*` or `char*` for byte offsets.\n\nPrefer iterators, indices, and `std::span` subranges (`s.subspan(off, len)`), which express the same thing with bounds information.", "p": "Computing `p + len` beyond the one-past-the-end position \"just to compare\"; merely forming such a pointer is undefined behaviour.", "f": ["What type is the difference of two pointers? => `std::ptrdiff_t`, a signed integer type.", "How do you do byte-offset arithmetic safely? => Use `std::byte*` / `unsigned char*`, or better `std::span<std::byte>` with `subspan`."]}, "145": {"d": "A `void*` is a pointer to an object of unknown type; any object pointer converts to it implicitly, but it must be cast back to the correct type before dereferencing.", "x": "Uses: C APIs (`memcpy`, `malloc`, callback user data), type-erased storage in low-level code.\n\nIn C++, converting `void*` back requires an explicit `static_cast<T*>`, and casting to the wrong type is undefined behaviour. You can't dereference it, do arithmetic on it, or `delete` it meaningfully (the destructor isn't known).\n\nModern alternatives: templates, `std::any`, `std::variant`, `std::span<std::byte>` for raw buffers, and typed callbacks (`std::function`).", "p": "Casting a `void*` user-data pointer back to a base class when it was stored as a derived pointer (or vice versa) in multiple inheritance, landing on the wrong address.", "f": ["Why can't you `delete` a `void*` safely? => The compiler doesn't know the type, so no destructor runs; it's undefined behaviour.", "What's the type-safe replacement for `void*` user data? => A capturing lambda stored in `std::function`, or templates."]}, "146": {"d": "A reference is an alias that must be bound to an object at initialization and can't be reseated or null; a pointer is an object holding an address that can be null, reassigned and used for arithmetic.", "x": "Syntax: references are used like the object itself (`r.x`), pointers need `*` or `->`. A reference has no identity of its own (you can't take its address or make arrays of references); a pointer is a first-class object.\n\nUse references for parameters and return values that always refer to a valid object; pointers when \"no object\" is valid or rebinding is needed. `std::reference_wrapper<T>` provides a copyable, reseatable reference for containers.", "p": "Returning a reference from a function that might have nothing to return, forcing callers to trust a hidden precondition; return a pointer or `std::optional`.", "f": ["How do you store references in a container? => Use `std::reference_wrapper<T>` (via `std::ref`).", "Is `sizeof` a reference equal to `sizeof` a pointer? => `sizeof(T&)` is `sizeof(T)`; references aren't objects, though implementations often use pointers internally."]}, "147": {"d": "A pointer to a pointer (`T**`) stores the address of a pointer, allowing a function to change which object the caller's pointer refers to, or to represent arrays of pointers.", "x": "Classic uses: C APIs that return allocated objects through an out-parameter (`int create(Device** out)`), `char** argv`, and arrays of strings.\n\nIn C++ prefer a reference to a pointer (`T*&`), returning the pointer (or `std::unique_ptr`), or containers (`std::vector<std::string>` instead of `char**`). Jagged 2D data should be `std::vector<std::vector<T>>` or a flat vector with index math.", "p": "Allocating 2D arrays as `int**` with a separate `new` per row, which fragments memory and complicates cleanup; use a single contiguous buffer.", "f": ["Why does a C API take `Device**`? => To write the created pointer back into the caller's variable.", "What's the C++ equivalent of an out-pointer parameter? => Return `std::unique_ptr<Device>` (or `std::expected`), or take `Device*&`."]}, "148": {"d": "A function pointer stores the address of a function with a specific signature, e.g. `int (*cmp)(const void*, const void*);`, and can be called like the function.", "x": "Readability helpers: `using Handler = void(*)(int);` or `std::add_pointer_t<void(int)>`.\n\nFunction pointers can't capture state; stateless lambdas convert to them, which is how C callbacks are fed from C++. For stateful callbacks, use `std::function` (type-erased, may allocate) or a template parameter (inlinable).\n\nIn firmware, arrays of function pointers implement dispatch tables and interrupt vector tables.", "p": "Passing a capturing lambda where a C function pointer is required; only captureless lambdas convert. Pass state through a `void*` user-data argument instead.", "f": ["How do you make a function-pointer type readable? => A type alias: `using Callback = void(*)(int status);`.", "`std::function` vs function pointer? => `std::function` can hold stateful callables but has type-erasure overhead; function pointers are lightweight but stateless."]}, "149": {"d": "A pointer to member function (`R (C::*pmf)(Args)`) identifies a member function independent of any object; you call it with an object using `.*` or `->*`, e.g. `(obj.*pmf)(args)`.", "x": "Declaration: `void (Device::*action)(int) = &Device::reset;` then `(dev.*action)(3);` or `(ptr->*action)(3);`. Parentheses are required because `.*` binds weaker than the call operator.\n\nMember function pointers may be larger than ordinary pointers (they can encode virtual function offsets and `this` adjustments for multiple inheritance), so they can't be converted to `void*`.\n\nModern code often uses `std::invoke(pmf, obj, args...)`, `std::mem_fn`, or lambdas instead.", "p": "Writing `obj.*pmf(args)` without parentheses, which parses as `obj.*(pmf(args))` and fails to compile.", "f": ["Why can a member function pointer be bigger than a normal pointer? => It may store a vtable offset and a `this` adjustment for multiple/virtual inheritance.", "What does `std::invoke` do with a member pointer? => Calls it on the given object uniformly, like `(obj.*pmf)(args...)`."]}, "150": {"d": "`const int* p` (same as `int const* p`) is a pointer to const int; `int* const p` is a const pointer to int; `const int* const p` is a const pointer to const int.", "x": "Read declarations from right to left: \"`p` is a const pointer to int\" for `int* const p`.\n\n- `const int* p`: `*p = 1` is an error; `p = &other` is fine.\n- `int* const p`: `*p = 1` is fine; `p = &other` is an error.\n- `const int* const p`: neither is allowed.\n\n`const int*` doesn't make the pointee immutable; it only forbids changing it **through this pointer**. Another non-const alias can still modify it, which is why the compiler must reload values after writes through other pointers.", "p": "Assuming `const T*` guarantees the object never changes; other aliases can modify it while you hold the pointer.", "f": ["What does \"east const\" mean? => Writing `int const*` so const always applies to what's on its left.", "Can you convert `int*` to `const int*` implicitly? => Yes; adding const is safe. The reverse needs `const_cast`."]}, "151": {"d": "References can't be reseated because the language defines a reference as a permanent alias for the object it was initialized with; assignment through a reference assigns to that object.", "x": "`int& r = a; r = b;` copies `b`'s value into `a`; it doesn't make `r` refer to `b`. This design guarantees that a reference always refers to the same valid object, which simplifies reasoning and optimization.\n\nWhen rebinding is needed, use a pointer, `std::reference_wrapper` (whose assignment rebinds), or `std::optional<std::reference_wrapper<T>>` for an optional rebindable reference. Classes with reference members can't be copy-assigned (the implicit assignment is deleted) for the same reason.", "p": "Adding a reference member to a class and then being surprised that it isn't assignable, breaking use in containers that require assignment.", "f": ["What does `r = b;` do for a reference `r`? => Assigns `b`'s value to the object `r` refers to.", "Why are classes with reference members not copy-assignable? => References can't be reseated, so the implicit assignment operator is deleted."]}, "152": {"d": "Array-to-pointer decay is the implicit conversion of an array expression to a pointer to its first element, which loses the array's size information.", "x": "Arrays decay when passed to functions (`void f(int* p)` or `void f(int p[])`, both the same), in most expressions, and when assigned to pointers. Exceptions: `sizeof(arr)`, `&arr`, `decltype(arr)`, and binding to a reference to array (`int (&r)[5] = arr;`).\n\nThe consequence is the classic bug of `sizeof(p)` inside a function returning the pointer size, not the array size.\n\nAvoid decay with `std::array` (value semantics, knows its size), `std::span` (pointer plus size), or passing arrays by reference to a template (`template<std::size_t N> void f(int (&a)[N])`).", "p": "Computing `sizeof(arr) / sizeof(arr[0])` inside a function that received the array as a parameter; it divides pointer size by element size.", "f": ["How can a function receive an array without decay? => By reference: `template<std::size_t N> void f(int (&a)[N])`, or take `std::span<int>`.", "What's `std::size(arr)`? => A C++17 function returning the number of elements of an array (and containers), failing to compile for pointers."]}, "153": {"d": "A wild pointer is an uninitialized pointer whose value is indeterminate, so it points to an arbitrary location; using it is undefined behaviour.", "x": "Wild pointers come from declaring `T* p;` without initialization (automatic storage). Unlike dangling pointers, they never pointed to a valid object.\n\nPrevention: always initialize pointers (to a valid address or `nullptr`), declare variables at the point where they can be initialized, enable warnings (`-Wuninitialized`, `-Wmaybe-uninitialized`), and use sanitizers (MemorySanitizer for uninitialized reads).", "p": "Declaring `Device* dev;` at the top of a function and assigning it in only some branches, then using it on a path where it was never set.", "f": ["Wild vs dangling pointer? => Wild was never initialized; dangling was valid once but its object is gone.", "Which sanitizer finds uses of uninitialized values? => MemorySanitizer (Clang `-fsanitize=memory`)."]}, "154": {"d": "To pass a 2D array, the function must know all dimensions except the first: `void f(int a[][4], int rows)` or `void f(int (*a)[4], int rows)`; modern C++ prefers a flat buffer with index math or `std::mdspan` (C++23).", "x": "Built-in 2D arrays are contiguous rows; decay produces a pointer to the first row (`int (*)[4]`), so the column count must be a compile-time constant in the parameter type. Templates can deduce both: `template<std::size_t R, std::size_t C> void f(int (&a)[R][C])`.\n\nFor runtime sizes, use `std::vector<T>` of size `rows * cols` with `a[r * cols + c]`, or `std::vector<std::vector<T>>` for jagged data. C++23 `std::mdspan` provides a multi-dimensional view over contiguous memory with runtime extents.", "p": "Passing a `int[3][4]` array to a function taking `int**`: the types are incompatible, and forcing it with a cast reads garbage.", "f": ["Why must the column count be known? => Row-major indexing `a[r][c]` computes `r * cols + c`, so `cols` must be part of the type.", "What does `std::mdspan` add? => A non-owning multi-dimensional view with configurable layout and runtime extents (C++23)."]}, "155": {"d": "`int* p = arr;` points to the first element (type `int*`, stepping by one `int`); `int (*p)[SIZE] = &arr;` points to the whole array (type pointer-to-array, stepping by `SIZE` ints).", "x": "Both hold the same address value, but their types differ: `p + 1` in the first case moves 4 bytes (one int), in the second case `SIZE * 4` bytes (one whole array). Dereferencing the pointer-to-array gives the array itself (`(*p)[i]`), and `sizeof(*p)` is the full array size.\n\nPointers to arrays appear naturally with 2D arrays (a row pointer) and are how array size can be preserved in function parameters.", "p": "Assuming `arr` and `&arr` are interchangeable because they print the same address; their types and arithmetic are different.", "f": ["What is `sizeof(*p)` for `int (*p)[10]`? => `10 * sizeof(int)`.", "Where do pointers to arrays appear naturally? => As the decayed type of 2D arrays: `int m[3][4]` decays to `int (*)[4]`."]}, "156": {"d": "Yes: a reference to a pointer (`T*&`) lets a function modify the caller's pointer variable itself, for example to allocate or advance it.", "x": "Example: `void advance(const char*& cursor) { while (*cursor == ' ') ++cursor; }` moves the caller's cursor. Another: `void reset(Node*& head) { delete head; head = nullptr; }`.\n\nIt's the C++ alternative to C's pointer-to-pointer out-parameters, with cleaner syntax. Note the order: `T*&` is a reference to a pointer; a \"pointer to a reference\" (`T&*`) doesn't exist.", "p": "Writing `T&*` expecting a reference to a pointer; that's ill-formed because pointers to references aren't allowed.", "f": ["Can you have a pointer to a reference? => No; references aren't objects, so they have no address of their own.", "When is `T*&` preferable to returning a new pointer? => When the function updates a cursor or head pointer in place, e.g. in parsers or linked lists."]}, "157": {"d": "Passing a pointer by value copies the address, so the function can modify the pointee but not the caller's pointer; passing a pointer by reference (`T*&`) or pointer-to-pointer lets the function change the caller's pointer.", "x": "Example bug: `void allocate(int* p) { p = new int(5); }` changes only the local copy, and the caller's pointer stays null (and the allocation leaks). With `void allocate(int*& p)`, the caller's variable is updated.\n\nIn modern C++ it's cleaner to return the new pointer, ideally as `std::unique_ptr`, than to use out-parameters.", "p": "Writing `init(buffer)` expecting the function to allocate into the caller's pointer when the parameter is taken by value; the caller's pointer is unchanged and memory leaks.", "f": ["Why does assigning to a by-value pointer parameter not affect the caller? => The parameter is a copy of the address.", "What's the modern replacement for pointer out-parameters? => Return values (`std::unique_ptr`, `std::optional`, structured bindings)."]}, "158": {"d": "Arrays and pointers are different types: an array is a contiguous block of elements with a size known to the type, while a pointer holds one address; arrays decay to pointers to their first element in most expressions, which makes them look similar.", "x": "Where they coincide: `a[i]` is defined as `*(a + i)` for both; arrays passed to functions arrive as pointers.\n\nWhere they differ: `sizeof(array)` gives the whole size, `sizeof(pointer)` gives 4 or 8; arrays can't be assigned or returned by value; `&array` has type pointer-to-array; string literals are arrays of const char; a pointer can be reseated, an array name cannot.\n\n`std::array` fixes most array quirks: it's copyable, returnable and doesn't decay.", "p": "Declaring `extern char* name;` in one file for `char name[] = \"x\";` defined in another: types mismatch and the program misreads memory.", "f": ["Why does `a[i]` work for pointers too? => The subscript operator is defined as `*(a + i)`.", "Can you return a C array from a function? => Not by value; return `std::array` instead."]}, "159": {"d": "A smart pointer is a class that owns a dynamically allocated object and releases it automatically (RAII), preventing leaks and making ownership explicit.", "x": "`std::unique_ptr<T>`: exclusive ownership, move-only, zero overhead compared with a raw pointer; destroys the object when it goes out of scope.\n\n`std::shared_ptr<T>`: shared ownership via a reference-counted control block; the object is destroyed when the last owner goes away. Costs atomic counter updates and an extra allocation (reduced with `make_shared`).\n\n`std::weak_ptr<T>`: non-owning observer of a `shared_ptr`-managed object; `lock()` gives a temporary `shared_ptr` or empty if the object is gone, which avoids dangling access and breaks reference cycles.\n\nSmart pointers prevent leaks and double deletes, but not all dangling: a raw pointer obtained with `.get()` can still outlive the object.", "p": "Creating two `shared_ptr`s from the same raw pointer (`shared_ptr<T> a(p), b(p);`): two control blocks, and the object is deleted twice.", "f": ["Which smart pointer should be the default? => `std::unique_ptr`; switch to `shared_ptr` only for genuinely shared ownership.", "How does `weak_ptr` break cycles? => It doesn't increase the reference count, so cyclic structures can still be destroyed."]}, "160": {"d": "`const T&` means \"a valid object I will read but not modify\"; `const T*` means \"an object I will read, or possibly nothing (null)\", and makes the address-taking visible at the call site.", "x": "References communicate non-optional input and allow calls with temporaries (`f(T{})`); pointers communicate optionality and may be stored for later (though storing either raises lifetime questions).\n\nGuideline: use `const T&` for required inputs, `const T*` (or `std::optional<std::reference_wrapper<const T>>`, or an overload) for optional ones. Neither transfers ownership; pass `std::unique_ptr` by value to transfer ownership.", "p": "Taking `const T*` for a required parameter, forcing every caller to write `&obj` and every implementation to check for null.", "f": ["Can a `const T&` parameter bind to a temporary? => Yes; a `const T*` parameter needs an addressable object.", "How do you signal ownership transfer in a signature? => Take `std::unique_ptr<T>` by value."]}, "161": {"d": "Inside a `const` member function of class `C`, `this` has type `const C*` (a prvalue, so it can't be reassigned), which is why non-mutable members can't be modified there.", "x": "Every member access `x` means `this->x`, so writing to a member through a `const C*` is a compile error, except for members declared `mutable`. Calling another member function from a const one is only allowed if that function is also const.\n\nIn a `volatile` or `const volatile` member function, `this` is `volatile C*` or `const volatile C*` accordingly. C++23's explicit object parameter makes this visible: `void f(this const C& self)`.", "p": "Using `const_cast<C*>(this)` inside a const function to modify state, which is undefined behaviour if the object itself was declared const.", "f": ["What is `this` in a non-const member function? => `C*`.", "How do you allow modification of a cache in a const function? => Declare the cache member `mutable` (and protect it if accessed from threads)."]}, "162": {"d": "Returning a pointer or reference to a local variable produces a dangling pointer or reference: the local is destroyed when the function returns, so any use afterwards is undefined behaviour.", "x": "Examples: `int* f() { int x = 5; return &x; }`, `const std::string& name() { std::string s = ...; return s; }`, or returning `std::string_view` of a local `std::string`.\n\nIt may seem to work in tests because the stack memory isn't overwritten yet. Compilers warn (`-Wreturn-local-addr`, `-Wdangling`) in simple cases, and AddressSanitizer's `detect_stack_use_after_return` catches it at runtime.\n\nReturn by value instead; move semantics and copy elision make it cheap.", "p": "Returning `std::string_view` or `std::span` into a local container; the view compiles fine and dangles immediately.", "f": ["Why can the bug appear to work? => The stack memory still holds the old value until another call overwrites it.", "What should you return instead? => The object by value; copy elision and moves make it efficient."]}, "163": {"d": "Pointer aliasing means two or more pointers (or references) may refer to the same memory; because writes through one could change what another reads, the compiler must be conservative, which limits optimization.", "x": "Example: in `void add(int* a, int* b, int n) { for (...) a[i] += *b; }`, the compiler must reload `*b` every iteration because `a[i]` might alias `*b`.\n\nThe **strict aliasing rule** lets compilers assume that pointers to different types (e.g. `int*` and `float*`) don't alias, except for `char`, `unsigned char` and `std::byte`, which may alias anything. Violating it (type punning through casts) is undefined behaviour and breaks under optimization.\n\nHints: the non-standard `__restrict` extension, copying values into locals, and `std::bit_cast` or `memcpy` for type punning.", "p": "Reading a `float` through an `int*` obtained by `reinterpret_cast` to inspect its bits; with optimizations the compiler may reorder or remove the access. Use `std::bit_cast`.", "f": ["Which types may alias any object? => `char`, `unsigned char` and `std::byte`.", "How do you tell the compiler pointers don't alias? => The `__restrict` extension (GCC, Clang, MSVC), or restructure code to use local copies."]}, "164": {"d": "`std::addressof(x)` always returns the real address of `x`, even if its type overloads unary `operator&`; `&x` calls that overload if one exists.", "x": "Some types overload `operator&` (COM smart pointers like `CComPtr`, proxy and expression types), so `&x` may return something other than the object's address. Generic code (containers, allocators, `std::construct_at`) therefore uses `std::addressof`. It's also `constexpr` since C++17.\n\nIn everyday non-generic code with ordinary types, `&x` is fine.", "p": "Using `&x` inside a template that stores addresses of arbitrary types; a type with overloaded `operator&` breaks it.", "f": ["Why would a type overload `operator&`? => To return an interface pointer or proxy (e.g. COM wrappers), which is rare and usually discouraged.", "Where does the standard library use `std::addressof`? => In containers, allocators and algorithms that need real object addresses in generic code."]}, "165": {"d": "Deleting through a `void*` is undefined behaviour: the compiler doesn't know the object's type, so it can't call the destructor or know the correct size and deallocation function.", "x": "Compilers usually warn (\"deleting 'void*' is undefined\"). Even for trivial types where no destructor is needed, it's formally undefined.\n\nWhen type-erased storage must be freed, keep the type information: store a deleter function along with the pointer (`std::unique_ptr<void, void(*)(void*)>` with a correct deleter), or use `std::any`/`std::shared_ptr<void>` (which captures the right deleter when constructed from a typed pointer).", "p": "Storing objects of various types as `void*` in a registry and deleting them as `void*` at shutdown; destructors never run and behaviour is undefined.", "f": ["How does `std::shared_ptr<void>` delete correctly? => It captures the real deleter from the original typed pointer at construction.", "What's the correct way to free a type-erased object? => Store a deleter that knows the real type alongside the pointer."]}, "166": {"d": "A fat pointer carries extra information alongside the address, such as a length, a vtable pointer or a `this` adjustment; in C++ the concept appears in `std::span`, `std::string_view`, member function pointers and type-erased callables.", "x": "Examples:\n\n- `std::span<T>` and `std::string_view`: pointer plus length (two words), enabling bounds-aware views.\n- Pointers to member functions: may encode a virtual function offset and `this` adjustment.\n- `std::function`, `std::any`: store the object plus operations (manual vtable).\n\nContrast with C++ polymorphism, where the vtable pointer lives inside the object (thin pointer), whereas Rust's trait objects and Go's interfaces use fat pointers (data plus vtable).", "p": "Passing `(T* data, size_t len)` pairs manually through many functions instead of a single `std::span`, inviting mismatched lengths.", "f": ["Why is `std::span` a fat pointer? => It stores both the data pointer and the element count.", "Where does C++ put the vtable pointer for polymorphic objects? => Inside the object (vptr), so ordinary pointers stay thin."]}, "167": {"d": "`static_cast` between pointer types only allows well-defined conversions (to and from `void*`, and up/down a class hierarchy, adjusting the address when needed); `reinterpret_cast` converts between unrelated pointer types by reinterpreting the address, without any adjustment or checking.", "x": "In multiple inheritance, `static_cast<Base2*>(derivedPtr)` adds the correct offset; `reinterpret_cast<Base2*>(derivedPtr)` keeps the same address, which is wrong.\n\n`reinterpret_cast` is for low-level tasks: pointer-to-integer conversions (`std::uintptr_t`), memory-mapped register addresses (`reinterpret_cast<volatile uint32_t*>(0x40021000)`), and serialization buffers viewed as `std::byte*`. Accessing an object through an unrelated type obtained this way usually violates strict aliasing.", "p": "Using `reinterpret_cast` to move between classes in a hierarchy, skipping the pointer adjustment that multiple inheritance requires.", "f": ["Which cast is used for memory-mapped hardware registers? => `reinterpret_cast` from an integer address to a `volatile` pointer type.", "Does `static_cast` check downcasts at runtime? => No; only `dynamic_cast` does. A wrong `static_cast` downcast is undefined behaviour."]}, "168": {"d": "Relational comparison (`<`, `>`) of pointers to unrelated objects is not defined by the language ordering rules: in C++ the result is **unspecified** (in C it's undefined), because objects may live in unrelated memory regions without a meaningful order.", "x": "Pointer ordering is defined only within the same array (or members of the same object). Across unrelated objects, implementations may use segmented or tagged address spaces, so no consistent order is guaranteed by `<`.\n\nWhen you need a consistent total order (e.g. to use pointers as keys in `std::map` or to lock mutexes in address order), use `std::less<T*>`, which the standard guarantees provides a strict total order over all pointers, or compare `std::uintptr_t` values.\n\nEquality comparison (`==`, `!=`) of any two pointers of compatible type is always well-defined.", "p": "Ordering unrelated pointers with `<` in a custom comparator for a lock-ordering scheme; use `std::less<>` for a guaranteed total order.", "f": ["What gives a guaranteed total order over pointers? => `std::less<T*>` (and `std::ranges::less`).", "Is `p == q` always valid for unrelated pointers? => Yes, equality comparison is always defined."]}, "169": {"d": "Dereferencing a null pointer is undefined behaviour, not a guaranteed crash: the standard imposes no requirements, and compilers assume it never happens when optimizing.", "x": "On typical desktop OSes page zero is unmapped, so a raw dereference usually faults. But: some embedded systems map valid memory at address 0 (reads succeed silently); accessing a member at a large offset (`p->big_array[100000]`) may land in mapped memory; and optimizers can delete a later null check because \"the pointer was already dereferenced, so it can't be null\" (a known Linux kernel bug class).\n\nTreat null-pointer bugs as logic errors: check at boundaries, use references or `gsl::not_null` for non-null parameters, and test with UBSan (`-fsanitize=null`).", "p": "Relying on a segfault to detect null dereferences in firmware where address 0 is valid flash or RAM; the bug silently reads or corrupts data.", "f": ["How can the optimizer remove a null check? => If the pointer was dereferenced earlier, the compiler may assume it's non-null and drop the later check.", "Which tool catches null dereferences reliably? => UBSan with `-fsanitize=null` (part of `-fsanitize=undefined`)."]}, "170": {"d": "Shallow pointer equality compares addresses (do both pointers refer to the same object?); deep equality compares the pointed-to objects' values (are the objects equivalent?).", "x": "`p == q` is shallow: two distinct objects with equal contents compare unequal. Deep equality is `*p == *q` (after null checks), or a custom comparator for containers of pointers.\n\nSmart pointers follow the same rule: `shared_ptr` and `unique_ptr` compare the stored addresses. So `std::set<std::shared_ptr<T>>` orders by address, not by value; pass a comparator that dereferences if value semantics are wanted.", "p": "Using `std::find(v.begin(), v.end(), ptr)` on a vector of pointers to look for an equal value; it compares addresses. Use `find_if` with a dereferencing predicate.", "f": ["How do you find a value in a vector of `unique_ptr`? => `std::find_if(v.begin(), v.end(), [&](auto& p){ return *p == target; })`.", "Do `shared_ptr` comparisons compare the objects? => No, they compare the stored pointers."]}, "171": {"d": "A typical C++ process has a text segment (code), read-only data (constants, string literals), initialized data (`.data`), zero-initialized data (`.bss`), the heap (dynamic allocations) and one stack per thread.", "x": "- **Text**: machine code, read-only and shareable between processes.\n- **Rodata**: string literals, `const` tables, vtables.\n- **Data / BSS**: globals and statics; `.bss` holds zero-initialized ones and takes no space in the executable file.\n- **Heap**: memory from `operator new`/`malloc`, managed by the allocator; grows as needed.\n- **Stack**: function frames (locals, return addresses, saved registers), fixed size per thread (often 1-8 MB on desktops, a few KB on microcontrollers).\n\nAlso present: memory-mapped files, shared libraries and thread-local storage. In firmware, the linker script defines where each section lives (flash vs RAM).", "p": "Modifying a string literal through a `char*` cast; it lives in read-only memory and the write crashes or is undefined behaviour.", "f": ["Why does `.bss` not take space in the binary? => It's only recorded as a size; the loader zero-fills it at startup.", "Where do vtables live? => Usually in read-only data."]}, "172": {"d": "Stack memory holds automatic (local) variables in frames that are pushed and popped with function calls; heap memory holds dynamically allocated objects whose lifetime is controlled explicitly or by owners like smart pointers.", "x": "Stack: allocation is just moving the stack pointer (nearly free), memory is cache-hot, lifetime is tied to scope, size is limited and fixed per thread.\n\nHeap: allocation goes through an allocator (locks or thread caches, bookkeeping), objects can outlive the function and be any size, but it risks fragmentation, leaks and use-after-free.\n\nGuideline: prefer stack (or member) objects; use heap allocation for large data, data with dynamic lifetime or size, and polymorphic objects. Containers allocate their elements on the heap even when the container object itself is on the stack.", "p": "Placing large arrays (e.g. `char buf[8 * 1024 * 1024];`) on the stack, which overflows threads with small stacks.", "f": ["Why is stack allocation so fast? => It's a pointer adjustment with no bookkeeping, and the memory is usually already in cache.", "Where are a `std::vector`'s elements stored if the vector is a local? => On the heap; only the small vector object (pointers) is on the stack."]}, "173": {"d": "A memory leak is dynamically allocated memory that is no longer reachable (or no longer needed) but is never freed, so the process's memory usage grows.", "x": "Causes: raw `new` without matching `delete` (especially on early returns and exceptions), reference cycles of `shared_ptr`, unbounded caches, containers that keep growing, and callbacks registered and never removed.\n\nEffects matter most for long-running processes (services, test orchestrators, firmware that runs for months): gradual growth leads to out-of-memory failures.\n\nPrevention: RAII and smart pointers, clear ownership, bounded caches; detection with LeakSanitizer, Valgrind, heap profilers (heaptrack, massif), and trend monitoring of process memory.", "p": "Calling `new` and then `return` early on an error path before `delete`; RAII avoids having to remember every path.", "f": ["Can a garbage-collected program leak memory? => Yes, when objects remain reachable but unused (unbounded caches, listeners), the same as with `shared_ptr` holding references.", "Why do leaks matter less in short-lived tools? => The OS reclaims everything at process exit, though leaks still hide real bugs."]}, "174": {"d": "`new T` allocates and constructs one object; `new T[n]` allocates an array of `n` objects, constructing each, and must be released with `delete[]`.", "x": "For arrays of types with non-trivial destructors, `new[]` typically stores the element count in a hidden header before the array so `delete[]` knows how many destructors to call.\n\nModern C++ rarely needs `new[]`: use `std::vector<T>` for dynamic arrays, `std::array` for fixed sizes, and `std::make_unique<T[]>(n)` when you need a heap array with unique ownership.", "p": "Using `new T[n]` and releasing with `delete`, or storing it in `std::unique_ptr<T>` instead of `std::unique_ptr<T[]>`.", "f": ["Where does `delete[]` get the element count? => Typically from a hidden cookie stored just before the array by `new[]`.", "What's the smart-pointer form for arrays? => `std::unique_ptr<T[]>` created with `std::make_unique<T[]>(n)`."]}, "175": {"d": "Using `delete` on memory from `new[]` is undefined behaviour: typically only the first element's destructor runs and the wrong pointer (not the start of the allocation with its count header) is passed to the deallocator, corrupting the heap.", "x": "For trivial types it may appear to work on some implementations, which hides the bug until the type gains a destructor or the allocator changes.\n\nRule: match `new`/`delete`, `new[]`/`delete[]`, `malloc`/`free`. Tools like AddressSanitizer report \"alloc-dealloc-mismatch\". The real fix is to avoid manual arrays altogether.", "p": "Assuming the mismatch is harmless because the element type is `char` or `int`; it's still undefined behaviour and tooling will flag it.", "f": ["What does AddressSanitizer report for this bug? => alloc-dealloc-mismatch (operator new[] vs operator delete).", "How do you avoid the issue entirely? => Use `std::vector` or `std::unique_ptr<T[]>`."]}, "176": {"d": "A dangling pointer refers to an object whose lifetime has ended; you avoid creating one by making ownership and lifetimes explicit so no observer outlives the object it points to.", "x": "Common creators: deleting through one pointer while others remain, returning addresses of locals, pointers or iterators into containers that reallocate, `string_view`/`span` of temporaries, lambdas capturing locals by reference that run later.\n\nAvoidance techniques: single owner (`unique_ptr`) with clearly scoped observers; `weak_ptr` for observers of shared objects; indices or handles (generation-checked IDs) instead of raw pointers into pools; don't store views beyond the statement unless the source clearly outlives them; and rely on AddressSanitizer in tests.", "p": "Capturing local variables by reference (`[&]`) in a callback or thread that runs after the function returns.", "f": ["What's a generational handle? => An index plus a generation counter; stale handles are detected because the slot's generation changed.", "Why are views like `string_view` risky? => They don't own data, so they dangle if the source is destroyed or modified."]}, "177": {"d": "RAII (Resource Acquisition Is Initialization) ties a resource's lifetime to an object's lifetime: the constructor acquires the resource and the destructor releases it, so cleanup happens automatically when the object goes out of scope.", "x": "Because destructors run on normal scope exit, early returns and exceptions (stack unwinding), RAII gives leak-free and exception-safe code without explicit cleanup paths.\n\nStandard RAII types: `std::unique_ptr`, `std::vector`, `std::fstream`, `std::lock_guard`/`std::scoped_lock`, `std::jthread`. For custom resources (file descriptors, DMA buffers, device handles), write a small move-only wrapper, or use `std::unique_ptr` with a custom deleter.\n\nIt's the foundation of modern C++ and the reason C++ doesn't need `finally` blocks.", "p": "Manually pairing `lock()`/`unlock()` calls: an exception or early return between them leaves the mutex locked forever. Use `std::lock_guard`.", "f": ["How do you wrap a C handle with RAII quickly? => `std::unique_ptr<FILE, decltype(&fclose)> f(fopen(...), &fclose);` or a small wrapper class.", "Why doesn't C++ need `finally`? => Destructors of local RAII objects run during unwinding, providing the same guarantee."]}, "178": {"d": "A double free is releasing the same allocation twice; it corrupts the allocator's internal structures and is undefined behaviour, often exploitable as a security vulnerability.", "x": "After the first free, the block may be reused; the second free can insert it twice into free lists, so two later allocations receive the same memory, letting an attacker overwrite live objects.\n\nTypical causes: shallow copies of classes owning raw pointers (Rule of Three violations), two `shared_ptr`s created from the same raw pointer, and error paths that free and then fall through to common cleanup.\n\nDetection: AddressSanitizer (\"attempting double-free\"), glibc's `free(): double free detected` abort; prevention via single ownership and smart pointers.", "p": "Copying an object that owns a raw buffer with the default copy constructor; both destructors free the same buffer.", "f": ["Why is double free a security issue? => It corrupts allocator metadata, which attackers can turn into arbitrary memory writes.", "How can two `shared_ptr` cause a double free? => Constructing both from the same raw pointer creates two independent control blocks."]}, "179": {"d": "A memory pool (or custom allocator) pre-allocates a large block and hands out pieces of it itself, avoiding general-purpose heap allocation for specific workloads.", "x": "Reasons: deterministic timing (real-time and firmware code can't tolerate `malloc` latency spikes), speed (bump or free-list allocation is a few instructions), reduced fragmentation, better cache locality, and easy bulk release (reset an arena after each frame or request).\n\nKinds: fixed-size pools (free list of equal blocks), arenas/monotonic buffers (bump pointer, free everything at once), and slab allocators. The standard library offers `std::pmr::monotonic_buffer_resource`, `unsynchronized_pool_resource` and `synchronized_pool_resource` (C++17), usable with `std::pmr::vector` and friends.", "p": "Writing a custom allocator before measuring; general-purpose allocators (glibc, jemalloc, mimalloc) are very good, and custom pools add complexity and bugs.", "f": ["What does `std::pmr::monotonic_buffer_resource` do? => Bump-allocates from a buffer and frees everything only when the resource is destroyed.", "Why do real-time systems avoid `malloc` at runtime? => Its latency is unbounded and it may lock, so they allocate up front or use pools."]}, "180": {"d": "Heap fragmentation is when free memory is split into many small non-contiguous blocks, so a large allocation can fail (or grow the heap) even though enough total memory is free.", "x": "External fragmentation comes from interleaving allocations of different sizes and lifetimes; internal fragmentation is wasted space inside allocated blocks due to rounding and alignment.\n\nIt hurts long-running and memory-constrained systems (embedded devices, servers running for months): memory usage creeps up without a leak.\n\nMitigations: allocate up front, use pools for same-sized objects, group allocations with similar lifetimes (arenas), reserve container capacity, and prefer modern allocators (jemalloc, mimalloc, tcmalloc) that segregate size classes.", "p": "Diagnosing growing memory as a leak when it's fragmentation; heap profilers show freed but unusable memory, and pooled allocation is the fix rather than hunting leaks.", "f": ["External vs internal fragmentation? => External: free space split into unusable pieces between blocks. Internal: unused space inside allocated blocks.", "How do arenas reduce fragmentation? => Objects with the same lifetime are allocated together and freed together."]}, "181": {"d": "`malloc(n)` allocates `n` uninitialized bytes; `calloc(count, size)` allocates and zero-fills `count*size` bytes (checking multiplication overflow); `realloc(p, n)` resizes a block, possibly moving it; `free(p)` releases memory from any of them.", "x": "All return `void*` and signal failure with null (never throw). They don't run constructors or destructors, so in C++ they're only suitable for trivially copyable data or C interop.\n\n`realloc` pitfalls: on failure it returns null and leaves the original block alive, so `p = realloc(p, n)` leaks on failure; and it copies bytes, which is wrong for non-trivially copyable C++ objects. `std::vector` handles growth correctly with moves.", "p": "Writing `p = realloc(p, n);` without keeping the old pointer: if `realloc` fails, the original block leaks.", "f": ["Why is `calloc` safer than `malloc(count * size)`? => It checks for multiplication overflow and zero-initializes memory.", "Can you `realloc` memory holding `std::string` objects? => No; byte-wise moves break non-trivially copyable objects."]}, "182": {"d": "`malloc`/`free` and `new`/`delete` are different allocation systems: releasing memory with the wrong one is undefined behaviour, and `malloc` never runs constructors while `free` never runs destructors.", "x": "`new` may use a different heap, add headers (for arrays), or be replaced by the program; `free` on such memory corrupts heaps. Similarly, `delete` on `malloc` memory calls a destructor on an object that was never constructed.\n\nKeep each allocation's allocate/release pair together, ideally wrapped in RAII (`std::unique_ptr` with a `free` deleter for C-allocated buffers returned by C libraries).", "p": "Freeing a buffer returned by a C library with `delete`, or passing `new`-allocated memory to a C function that calls `free` on it.", "f": ["How do you own memory returned by `malloc` from a C API? => `std::unique_ptr<char, decltype(&std::free)> p(ptr, &std::free);`.", "Can `operator new` be implemented with `malloc`? => Yes, commonly, but that's an internal detail; you still must release with `delete`."]}, "183": {"d": "A stack overflow happens when a thread uses more stack than it was given, typically through deep or unbounded recursion or very large local variables.", "x": "Symptoms: segmentation fault or access violation at a seemingly random point, often in a function prologue; on microcontrollers, silent corruption of adjacent memory unless there's a stack guard or MPU region.\n\nCauses: recursion without a proper base case, recursion depth proportional to input size (deep trees, recursive descent on large input), large arrays or structs on the stack, `alloca`/VLAs, and small default stacks for worker threads.\n\nFixes: iterative algorithms with an explicit container, moving large buffers to the heap or static storage, increasing thread stack size where appropriate, and compiler warnings like `-Wstack-usage=N` / `-Wframe-larger-than=N`.", "p": "Recursive tree traversal on a degenerate (linked-list-shaped) tree of a million nodes, which overflows the stack; use an explicit stack.", "f": ["How do you find functions with large stack frames? => GCC's `-fstack-usage` and `-Wframe-larger-than=N`.", "How is stack overflow detected on microcontrollers? => Stack canaries/painting, MPU guard regions, or high-water-mark checks."]}, "184": {"d": "Automatic storage duration lasts until the end of the enclosing block (locals); dynamic storage duration lasts from `new` until `delete` (or until the owning smart pointer releases it); static storage duration lasts for the whole program (globals, `static` locals and members).", "x": "A fourth kind, **thread** storage duration (`thread_local`), lasts for the lifetime of a thread.\n\nStatic objects are zero- or constant-initialized before any code runs, then dynamically initialized before `main` (namespace scope) or on first use (function-local statics, thread-safely). They are destroyed after `main` returns, in reverse order of construction.\n\nStorage duration is about when memory exists; object lifetime (between constructor completion and destructor start) is related but narrower.", "p": "Global objects whose destructors use other globals from different translation units; destruction order across units is unspecified, so shutdown crashes.", "f": ["When are function-local statics initialized? => The first time control passes through their declaration, thread-safely since C++11.", "What is the difference between storage duration and lifetime? => Storage duration is how long the memory exists; lifetime is when a constructed object occupies it."]}, "185": {"d": "Common leak-detection tools are LeakSanitizer/AddressSanitizer, Valgrind Memcheck, heap profilers (heaptrack, Massif, Instruments, Visual Studio diagnostics), and the MSVC CRT debug heap.", "x": "- **AddressSanitizer + LeakSanitizer** (`-fsanitize=address`): fast (about 2x slowdown), reports leaks at exit with allocation stack traces; ideal in CI.\n- **Valgrind Memcheck**: no recompilation needed, very thorough (also uninitialized reads), but 20-50x slower; Linux mainly.\n- **Heap profilers**: heaptrack, Massif, jemalloc/tcmalloc profiling show where memory grows over time (\"leaks\" that are still reachable).\n- **Windows**: CRT debug heap (`_CrtDumpMemoryLeaks`), Visual Studio diagnostic tools, UMDH.\n\nComplement tools with design: RAII and ownership rules prevent most leaks.", "p": "Running leak checks only on short unit tests; many leaks appear only in long-running paths, so also monitor memory trends in soak tests.", "f": ["ASan vs Valgrind? => ASan needs recompilation and is much faster; Valgrind works on existing binaries but is far slower.", "How do you find growth that isn't technically a leak? => Heap profilers over time (heaptrack, Massif) to see which call sites keep reachable memory growing."]}, "186": {"d": "Regular `new` allocates memory **and** constructs an object; placement new (`new (address) T(args)`) only constructs an object in memory you supply, without allocating.", "x": "Use cases: containers that manage capacity separately from elements (`std::vector`), object pools and arenas, fixed buffers in embedded systems without a heap, `std::optional`/`std::variant` implementations that construct in internal storage, and objects in shared or memory-mapped regions.\n\nRequirements: suitable size and alignment, and manual destruction (`p->~T()` or `std::destroy_at(p)`). C++20 `std::construct_at` offers a safer, constexpr-friendly form.", "p": "Reusing a placement-new buffer for a new object without destroying the previous one first, skipping its destructor and possibly leaking resources.", "f": ["Does placement new ever throw? => The allocation can't fail, but the constructor can still throw.", "Which standard types use placement new internally? => `std::vector`, `std::optional`, `std::variant` and other containers managing raw storage."]}, "187": {"d": "Call the destructor explicitly on the object (`p->~T();` or `std::destroy_at(p);`), which ends its lifetime but leaves the memory allocated; you then reuse or free the storage separately.", "x": "Typical sequence: `void* mem = pool.allocate(sizeof(T), alignof(T)); T* p = new (mem) T(args); ... p->~T(); pool.deallocate(mem);`.\n\nFor ranges use `std::destroy(first, last)` or `std::destroy_n`. Never call `delete` on a placement-new object unless the memory itself came from `new`, and never call the destructor explicitly on automatic objects (they'll be destroyed again).", "p": "Calling `delete p` on an object placed in a static buffer; `delete` tries to release memory that was never heap-allocated.", "f": ["What does `std::destroy_at` do? => Calls the object's destructor at the given address (C++17), handling arrays in C++20.", "Why is explicitly destroying an automatic object dangerous? => Its destructor runs again at scope exit, causing a double destruction."]}, "188": {"d": "Small object optimization stores small values inside the object itself instead of allocating on the heap; for `std::string` (SSO), short strings (typically up to 15 characters in libstdc++ and MSVC, 22 in libc++ on 64-bit) live in an internal buffer.", "x": "Benefits: no heap allocation for common short strings, better cache locality, cheaper copies. The same idea appears in `std::function` and `std::any` (small callables stored inline) and in custom `SmallVector` types (LLVM, Boost.Container `small_vector`).\n\nConsequences: moving a short string copies its characters (there's no heap pointer to steal), so moves of SSO strings aren't free; `sizeof(std::string)` is 24-32 bytes; `data()` pointers change when a string moves between SSO and heap mode.", "p": "Assuming moving a `std::string` never copies characters; for short (SSO) strings, move copies the inline buffer.", "f": ["Why is `sizeof(std::string)` 32 on some platforms? => It holds a pointer, size, and capacity or an inline SSO buffer.", "Which other standard types use small-buffer optimization? => `std::function` and `std::any` for small objects (implementation-dependent)."]}, "189": {"d": "A memory leak loses heap memory; a resource leak loses any limited resource (file descriptors, sockets, mutex locks, threads, GPU buffers, device handles) by failing to release it.", "x": "Resource leaks often bite sooner than memory leaks: a process may hit the file-descriptor limit (commonly 1024) or leave a device locked long before running out of memory.\n\nRAII solves both the same way: wrap every resource in an object whose destructor releases it (`std::fstream`, `std::lock_guard`, `std::jthread`, custom handles).\n\nDetection: `lsof`/`/proc/<pid>/fd` for descriptors, handle counts on Windows, lock contention monitoring, and tests that check resource counts before and after.", "p": "Closing files only on the success path, so each failed parse leaks a descriptor until the tool fails with \"too many open files\".", "f": ["How do you detect file-descriptor leaks on Linux? => Count entries in `/proc/<pid>/fd` or use `lsof` during a long test.", "Is a locked-and-never-unlocked mutex a leak? => Yes, a resource leak that typically shows up as a deadlock."]}, "190": {"d": "Use-after-free is accessing an object after its memory has been released; it's undefined behaviour and a major security vulnerability because freed memory is soon reused for attacker-influenced data.", "x": "Exploitation pattern: an object with a vtable is freed, attacker-controlled data is allocated in the same slot, and a later virtual call through the stale pointer jumps to an attacker-chosen address. A large share of critical browser and OS vulnerabilities are use-after-free bugs.\n\nPrevention: clear ownership (`unique_ptr`), `weak_ptr` for observers, avoiding raw pointers into containers across modifications, and testing with AddressSanitizer. Hardened allocators and memory tagging (ARM MTE) help detect it in production.", "p": "Keeping an iterator or pointer to a `std::vector` element across `push_back`, then writing through it after reallocation freed the old buffer.", "f": ["Why is use-after-free exploitable? => Freed memory is reused for other data, so stale pointers read or write attacker-controlled contents.", "What hardware feature helps detect it? => Memory tagging, e.g. ARM MTE, which checks pointer tags against memory tags."]}, "191": {"d": "Copy-on-write shares one buffer between copies and duplicates it only when one copy is modified; C++11 effectively banned it for `std::string` by requiring that operations like `operator[]` not invalidate references and forbidding reference-counted sharing semantics.", "x": "COW made copies cheap but had costs: every potentially mutating access (even non-const `operator[]`) needed a check and possible copy; reference counts needed atomic operations in multithreaded programs; and references/pointers into a string could be invalidated unexpectedly.\n\nC++11's requirements on iterator and reference invalidation, plus move semantics making copies avoidable, led libstdc++ to switch from COW to SSO (with a new ABI, `_GLIBCXX_USE_CXX11_ABI`). COW is still useful in immutable-data designs and some other libraries (Qt's implicitly shared classes).", "p": "Mixing libraries built with the old and new libstdc++ string ABI, producing link errors mentioning `std::__cxx11::basic_string`.", "f": ["Why does COW hurt multithreaded code? => Reference counts need atomic updates, and mutation checks add synchronization cost.", "What is `_GLIBCXX_USE_CXX11_ABI`? => A libstdc++ macro selecting the new (SSO, non-COW) or old string and list ABI."]}, "192": {"d": "The `new` expression (`new T(args)`) calls an allocation function `operator new(sizeof(T))` to get raw memory and then constructs the object; `operator new` itself is just an allocation function, like `malloc` but throwing on failure.", "x": "You can call `operator new(size)` directly to get raw memory (no constructor), and replace or overload it globally or per class. You can't change what the `new` expression does as a whole, only the allocation step.\n\nLikewise, the `delete` expression calls the destructor and then `operator delete`. Variants include array forms, `nothrow` forms, aligned forms (`std::align_val_t`, C++17) and sized deallocation.", "p": "Overloading `operator new` expecting to control construction; it only controls where memory comes from.", "f": ["Can you call `operator new` directly? => Yes, to get raw uninitialized memory, then construct with placement new.", "What did C++17 add for over-aligned types? => Aligned `operator new`/`delete` taking `std::align_val_t`."]}, "193": {"d": "Alignment is the requirement that objects of a type start at addresses that are multiples of `alignof(T)`; violating it is undefined behaviour and can crash or slow down memory access.", "x": "Many CPUs (and SIMD instructions) fault or split accesses on misaligned addresses; x86 tolerates most misalignment but with a performance penalty, while some ARM cores and DMA engines require strict alignment.\n\nTools: `alignof(T)`, `alignas(64)` for cache-line or SIMD alignment, `std::aligned_alloc`, `std::align`, and aligned `new` in C++17. Struct padding exists to keep members aligned; reorder members from largest to smallest to reduce padding.\n\nFor binary protocols, don't cast byte buffers to struct pointers (alignment and aliasing issues); use `memcpy` into a local or `std::bit_cast`.", "p": "`reinterpret_cast<uint32_t*>(buffer + 1)` to read a 32-bit field from a packet buffer: misaligned and an aliasing violation. Use `std::memcpy`.", "f": ["How do you reduce struct padding? => Order members by decreasing alignment, or check with `sizeof` and `offsetof`.", "Why align data to 64 bytes? => To match cache-line size, avoiding false sharing and improving SIMD loads."]}, "194": {"d": "A buffer overflow writes (or reads) past the end of a buffer, corrupting adjacent memory; it's undefined behaviour and historically one of the most exploited memory-safety bugs in C and C++.", "x": "Causes: unchecked `strcpy`/`sprintf`/`memcpy` lengths, off-by-one loop bounds, trusting length fields from input (packets, files), and pointer arithmetic errors.\n\nStack overflows of this kind can overwrite return addresses (mitigated by stack canaries, ASLR, non-executable stacks and control-flow integrity); heap overflows corrupt allocator metadata or neighbouring objects.\n\nC++ mitigations: `std::string`, `std::vector`, `std::array` with `at()` or hardened library modes (`_GLIBCXX_ASSERTIONS`, libc++ hardening), `std::span` with bounds, `std::format` instead of `sprintf`, and fuzzing with sanitizers for input parsers.", "p": "Copying a device-reported length field straight into `memcpy(dst, src, len)` without checking it against the destination size.", "f": ["Which compile flags help catch overflows? => `-fsanitize=address` in testing, `-D_GLIBCXX_ASSERTIONS` / `-D_FORTIFY_SOURCE=2` and stack protectors in builds.", "Why is fuzzing effective for parsers? => It generates malformed inputs automatically, and sanitizers turn silent overflows into crashes with stack traces."]}, "195": {"d": "In Valgrind's leak summary, \"definitely lost\" means no pointer to the block remains (a true leak), while \"still reachable\" means memory is still pointed to at exit but was never freed.", "x": "Categories: **definitely lost** (fix these), **indirectly lost** (reachable only through lost blocks; fixing the definite leak usually fixes them), **possibly lost** (only interior pointers remain; investigate), **still reachable** (often global caches or singletons intentionally not freed at exit).\n\nStill-reachable memory isn't necessarily a bug for a program about to exit, but in long-running services the same pattern (ever-growing reachable caches) is effectively a leak that heap profilers reveal over time.", "p": "Ignoring \"still reachable\" growth in a daemon because Valgrind doesn't call it a leak; an unbounded cache will still exhaust memory.", "f": ["What does \"indirectly lost\" mean? => Blocks only reachable from definitely lost blocks, e.g. nodes of a leaked list.", "Should you free singletons at exit to silence \"still reachable\"? => Optional; it's usually harmless, but freeing makes leak reports cleaner in CI."]}, "196": {"d": "Standard containers take an allocator template parameter (default `std::allocator<T>`) that they use for all element storage; a custom allocator lets you change where and how that memory is obtained without changing container logic.", "x": "Containers call the allocator (via `std::allocator_traits`) to allocate raw storage, then construct elements in place. Custom allocators enable memory pools, arenas, shared-memory containers (Boost.Interprocess), tracking allocations per subsystem, and alignment control.\n\nClassic allocators are part of the container's type (`std::vector<int, PoolAlloc<int>>`), which makes interfaces awkward. C++17 **polymorphic allocators** (`std::pmr::vector<int>` with a `std::pmr::memory_resource*`) keep a single container type and choose the resource at runtime.", "p": "Writing a stateful classic allocator and forgetting `operator==` or propagation traits, so moving or swapping containers frees memory into the wrong pool.", "f": ["Why were pmr allocators added? => So containers using different memory resources still share one type, e.g. `std::pmr::vector<int>`.", "What does `std::allocator_traits` do? => Supplies defaults for optional allocator members so custom allocators only implement the essentials."]}, "197": {"d": "Memory ownership means deciding which part of the code is responsible for releasing each resource; modern C++ encodes ownership in types so the compiler helps enforce it.", "x": "Conventions: `std::unique_ptr<T>` owns exclusively; `std::shared_ptr<T>` shares ownership; raw pointers and references are non-owning observers; containers own their elements; `std::span`/`std::string_view` are non-owning views.\n\nFunction signatures then document intent: taking `unique_ptr<T>` by value transfers ownership in; returning `unique_ptr<T>` transfers ownership out; taking `T&` or `T*` borrows. This removes whole bug classes (leaks, double frees) and makes APIs self-documenting.\n\nThe C++ Core Guidelines (R.1-R.37) formalize these rules; tools like clang-tidy check many of them.", "p": "APIs that return raw `T*` from factories without documenting who deletes it, so some callers leak and others double-delete.", "f": ["How do you transfer ownership into a function? => Take `std::unique_ptr<T>` by value and call it with `std::move(ptr)`.", "Is a raw pointer parameter owning in modern C++? => By convention no; it's an observer (possibly null)."]}, "198": {"d": "A moved-from object is left in a **valid but unspecified state**: its invariants still hold, so it can be destroyed, assigned to and have state-independent operations called, but its value shouldn't be relied upon.", "x": "For standard library types, the guarantee is exactly that (with some types specifying more: a moved-from `std::unique_ptr` is null; moved-from `std::vector` is in practice empty but not guaranteed by the standard).\n\nFor your own types, keep moved-from objects valid (e.g. set pointers to null so the destructor is safe) and document what state they're in. Using a moved-from object's value is a logic bug; clang-tidy's `bugprone-use-after-move` catches many cases.", "p": "Reading from a string after `std::move(s)` into a container and assuming it's still the original text (or definitely empty).", "f": ["What operations are safe on a moved-from object? => Destruction, assignment of a new value, and operations without preconditions (like `clear()` or `size()` for containers).", "Which moved-from standard type has a specified state? => `std::unique_ptr` (null) and `std::shared_ptr` (empty)."]}, "199": {"d": "C++ doesn't mandate garbage collection because it values deterministic destruction, predictable performance and zero-overhead abstractions; RAII, smart pointers and containers fill the role instead.", "x": "A tracing GC would make destructor timing unpredictable (bad for locks, files, hardware handles), add pauses (bad for real-time and firmware), and conflict with low-level pointer tricks.\n\nC++11 added minimal \"garbage collection support\" APIs (`std::declare_reachable` etc.) that no major implementation used; they were removed in C++23.\n\nInstead: automatic storage and RAII for most objects, `unique_ptr` for exclusive ownership, `shared_ptr`/`weak_ptr` for shared ownership (reference counting, deterministic), and arenas/pools for bulk lifetime management.", "p": "Using `shared_ptr` everywhere to imitate garbage collection, which adds atomic overhead, obscures ownership, and still leaks with reference cycles.", "f": ["What's the downside of reference counting vs tracing GC? => It can't collect cycles on its own and adds counter updates on every copy.", "What happened to C++11's GC support APIs? => They were never implemented meaningfully and were removed in C++23."]}, "200": {"d": "False sharing is when threads on different cores modify different variables that happen to share a cache line, forcing the line to bounce between cores and severely slowing both, even though no data is actually shared.", "x": "Cache coherence works per cache line (typically 64 bytes). Two per-thread counters placed next to each other in a struct or array cause constant invalidations.\n\nFixes: pad or align per-thread data to cache-line size (`alignas(std::hardware_destructive_interference_size)` in C++17, or `alignas(64)`), keep per-thread data in thread-local storage and combine results at the end, and group data by which thread writes it.\n\nDetection: profilers (`perf c2c` on Linux, Intel VTune) show heavy cache-line contention (HITM events).", "p": "An array of per-thread statistics counters (`std::atomic<uint64_t> stats[N]`) updated in a hot loop; adjacent entries share cache lines and scalability collapses.", "f": ["What is `std::hardware_destructive_interference_size`? => A C++17 constant for the minimum offset that avoids false sharing (typically 64).", "How do you detect false sharing on Linux? => `perf c2c` reports cache lines with cross-core contention."]}, "201": {"d": "The STL's main components are containers (store data), iterators (traverse it), algorithms (operate on ranges), and function objects (customize behaviour), plus adaptors and allocators.", "x": "The key design idea is that **algorithms work on iterator ranges, not on containers**: `std::sort`, `std::find`, `std::transform` don't know which container they operate on. So N algorithms times M containers needs N + M implementations, not N x M.\n\nContainers: sequence (`vector`, `deque`, `list`, `forward_list`, `array`), associative (`set`, `map`, multi variants), unordered (hash-based), and adaptors (`stack`, `queue`, `priority_queue`). C++20 ranges build on the same ideas with composable views.", "p": "Writing hand-rolled loops for tasks the algorithms already express (find, count, transform, partition), which is longer and more error-prone.", "f": ["Why do algorithms take iterators instead of containers? => To decouple them, so one algorithm works with every container and even raw arrays.", "What do C++20 ranges add? => Algorithms taking whole ranges, projections, and lazy composable views."]}, "202": {"d": "A container is a class template that owns a collection of elements and manages their storage, offering a standard interface (iterators, `size()`, `empty()`, insertion and removal).", "x": "Categories and when to use them:\n\n- **Sequence containers**: `vector` (default choice, contiguous), `array` (fixed size), `deque` (fast at both ends), `list`/`forward_list` (stable iterators, cheap splicing).\n- **Ordered associative**: `set`, `map` and multi versions (red-black trees, sorted, O(log n)).\n- **Unordered associative**: `unordered_set`, `unordered_map` (hash tables, average O(1)).\n- **Adaptors**: `stack`, `queue`, `priority_queue` restrict an underlying container's interface.\n- C++23 adds flat containers (`std::flat_map`, `std::flat_set`) backed by sorted vectors.", "p": "Choosing `std::list` for performance by Big-O reasoning; `std::vector` is usually faster in practice because of cache locality.", "f": ["What should be your default container? => `std::vector`, unless measurements or requirements say otherwise.", "What are C++23 flat containers? => Sorted-vector-backed maps and sets: faster lookup and iteration, slower insertion."]}, "203": {"d": "`std::vector` is a dynamic array whose size can change at runtime and whose elements live on the heap; `std::array<T, N>` is a fixed-size array whose size is part of the type and whose elements live inside the object.", "x": "`std::array` has no allocation, can live on the stack or in static memory, is an aggregate (`std::array<int, 3> a{1, 2, 3};`), works in `constexpr` code and doesn't decay to a pointer. It's ideal for small fixed tables, e.g. register maps or lookup tables in firmware.\n\n`std::vector` grows dynamically with amortized O(1) `push_back`, can be moved in O(1) (pointer steal), and is the default for variable-length data. Moving a `std::array` moves each element (O(N)).", "p": "Using `std::vector` for small fixed-size data in hot paths (like a 4-element coordinate) and paying for a heap allocation each time.", "f": ["Can `std::array` be used in constexpr code? => Yes, it's a literal type usable at compile time.", "Why is moving a `std::vector` O(1) but moving a `std::array` O(N)? => The vector swaps its heap pointer; the array must move each element stored inline."]}, "204": {"d": "`std::pair<A, B>` holds exactly two values (`first`, `second`); `std::tuple<Ts...>` holds a fixed number of values of possibly different types, accessed with `std::get<I>` or `std::get<T>`.", "x": "Both support comparison (lexicographic), `std::make_pair`/`std::make_tuple`, class template argument deduction (`std::pair p{1, 2.0};`), and C++17 structured bindings (`auto [key, value] = *it;`).\n\n`std::tie` creates a tuple of references, handy for multiple assignment and lexicographic comparisons in `operator<`.\n\nFor public APIs prefer a small named struct over tuples: `result.lba` is clearer than `std::get<2>(result)`.", "p": "Returning `std::tuple<int, int, bool>` from public functions; callers mix up which element means what. Use a named struct.", "f": ["How do structured bindings work with pairs? => `auto [a, b] = pair;` introduces names bound to `first` and `second`.", "What does `std::tie` return? => A tuple of lvalue references to its arguments."]}, "205": {"d": "An iterator is an object that points to an element in a range and supports moving to the next element and accessing the current one; it generalizes a pointer.", "x": "Every container provides `begin()`/`end()` (end is one past the last element), and algorithms take iterator pairs. Iterator capabilities differ by category (input, forward, bidirectional, random access, contiguous), and algorithms require minimum categories.\n\nIterators can be invalidated by container modifications; each container documents when. C++20 ranges add **sentinels** (end markers of a different type) and range-based algorithms that accept whole containers.", "p": "Dereferencing `end()` or using an iterator after the container was modified in a way that invalidates it.", "f": ["Why is `end()` one past the last element? => Half-open ranges make empty ranges (`begin == end`) and length (`end - begin`) natural.", "What is a sentinel in C++20 ranges? => An end marker whose type may differ from the iterator, e.g. for null-terminated strings."]}, "206": {"d": "`std::vector` stores elements contiguously with fast random access and cache-friendly iteration; `std::list` is a doubly linked list with O(1) insertion and removal anywhere given an iterator, and stable iterators, but no random access.", "x": "In practice `vector` wins most workloads, even with middle insertions, because traversal of contiguous memory is far faster than pointer chasing and each list node is a separate allocation (with two pointers of overhead).\n\nChoose `list` when: you need iterators and references that stay valid across insertions and removals, you frequently splice sublists between lists (O(1)), or elements are very expensive or impossible to move.", "p": "Picking `std::list` because \"insertion is O(1)\" while the code first searches linearly for the position, making the operation O(n) with poor locality anyway.", "f": ["What does `std::list::splice` do? => Moves nodes between lists in O(1) without copying or reallocating.", "Why is vector faster for middle insertion than theory suggests? => Shifting contiguous memory is very fast, and finding the position in a list is slow."]}, "207": {"d": "`std::map` is an ordered associative container implemented as a balanced binary search tree (O(log n) operations, keys sorted); `std::unordered_map` is a hash table (average O(1), worst case O(n), no ordering).", "x": "Choose `map` when you need sorted iteration, range queries (`lower_bound`, `upper_bound`), stable performance without hashing, or keys that are easy to compare but hard to hash. Choose `unordered_map` for fast lookups by key when order doesn't matter.\n\nBoth allocate a node per element; `unordered_map` also has a bucket array. For small maps, a sorted `std::vector` or C++23 `std::flat_map` can outperform both.", "p": "Using `unordered_map` with a poor hash function (or attacker-controlled keys), degrading to O(n) lookups.", "f": ["When is `std::map` better than `unordered_map`? => When you need ordering, range queries, or predictable worst-case performance.", "What's a faster alternative for small, rarely modified maps? => A sorted `std::vector` of pairs or `std::flat_map`."]}, "208": {"d": "`std::set` stores unique keys in sorted order; `std::multiset` allows duplicate keys, keeping equal keys adjacent.", "x": "With `multiset`, `insert` always succeeds, `count(k)` may exceed 1, `equal_range(k)` returns all equal elements, and `erase(k)` removes **all** of them (use `erase(it)` to remove one).\n\nBoth are ordered by a strict weak ordering (default `std::less<Key>`); elements are const through iterators because modifying them would break the ordering. C++17 `extract` lets you take a node out, modify it, and reinsert without reallocation.", "p": "Calling `ms.erase(value)` on a multiset to remove one occurrence, which removes every equal element.", "f": ["How do you remove a single element from a multiset? => `ms.erase(ms.find(value))` (after checking it isn't `end()`).", "How can you modify a key in a set without reallocation? => C++17 `extract` the node, change it, and `insert` it back."]}, "209": {"d": "`std::vector::push_back` is **amortized** O(1): usually constant time, but occasionally O(n) when capacity runs out and all elements are moved to a larger buffer.", "x": "Capacity grows geometrically (by a factor of 1.5 or 2 depending on the implementation), so the total cost of n pushes is O(n), averaging O(1) each.\n\nIf elements have a `noexcept` move constructor, reallocation moves them; otherwise it copies (to preserve the strong exception guarantee). Use `reserve(n)` when the final size is known to avoid reallocations entirely, which also keeps pointers and iterators valid.", "p": "Pushing millions of elements without `reserve` in a latency-sensitive path, causing multiple large reallocations and copies at unpredictable moments.", "f": ["Why must the growth be geometric? => Growing by a constant amount would make n pushes cost O(n²).", "What decides whether reallocation moves or copies elements? => Whether the move constructor is `noexcept` (`std::move_if_noexcept`)."]}, "210": {"d": "`size()` is the number of elements currently in the vector; `capacity()` is how many elements fit in the allocated storage before a reallocation is needed.", "x": "`capacity() >= size()` always. Growing past capacity triggers reallocation (and iterator invalidation). `clear()` and `erase()` reduce size but not capacity; `shrink_to_fit()` is a non-binding request to release excess capacity; the swap trick (`std::vector<T>(v).swap(v)`) forces it.\n\nUnderstanding the difference matters for memory usage: a vector that once held a million elements keeps that capacity after `clear()`.", "p": "Expecting `v.clear()` to free the vector's memory; capacity stays the same until `shrink_to_fit()` or destruction.", "f": ["Is `shrink_to_fit` guaranteed to free memory? => No, it's a non-binding request, though major implementations honour it.", "Does `reserve` change `size()`? => No, only capacity; `resize` changes size."]}, "211": {"d": "`reserve(n)` ensures the vector's capacity is at least `n` without changing its size, pre-allocating storage to avoid repeated reallocations.", "x": "Benefits: fewer allocations and element moves, predictable performance, and pointers/iterators that stay valid while pushing up to `n` elements.\n\n`reserve` vs `resize`: `resize(n)` creates `n` elements (default-constructed or copies), `reserve(n)` only allocates. Calling `reserve` repeatedly with small increments (e.g. `reserve(size() + 1)` in a loop) defeats geometric growth and makes insertion quadratic.", "p": "Calling `v.reserve(n)` and then assigning `v[i] = x` for `i < n`; the elements don't exist yet (size is still 0). Use `push_back` or `resize`.", "f": ["What's the danger of `reserve(size() + 1)` before each push? => It prevents geometric growth, making the loop O(n²).", "Does `reserve` construct elements? => No, only `resize` or insertion
