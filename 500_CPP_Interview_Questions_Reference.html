 does."]}, "212": {"d": "When a `std::vector` reallocates, all iterators, pointers and references to its elements are invalidated, because the elements move to new storage.", "x": "Reallocation happens when an insertion exceeds `capacity()` (`push_back`, `emplace_back`, `insert`, `resize`, `reserve` above capacity). Without reallocation, insertions still invalidate iterators at and after the insertion point.\n\nSafe patterns: use indices instead of iterators or pointers during insertion loops, `reserve` enough capacity up front, or re-obtain iterators after modifications. Debug modes (`_GLIBCXX_DEBUG`, MSVC iterator debugging) and AddressSanitizer catch many of these bugs.", "p": "`for (auto& x : v) if (cond(x)) v.push_back(transform(x));`, where the range-for iterators dangle after the first reallocation.", "f": ["Does `push_back` without reallocation invalidate existing iterators? => No, only the `end()` iterator is invalidated.", "How do you catch invalidated-iterator bugs? => Debug STL modes (`_GLIBCXX_DEBUG`, MSVC checked iterators) and sanitizers."]}, "213": {"d": "`std::deque` is a double-ended queue with O(1) insertion and removal at both ends, implemented as a sequence of fixed-size blocks; `std::vector` is one contiguous block with fast insertion only at the back.", "x": "Deque advantages: `push_front` is O(1), growing never moves existing elements (references to elements stay valid on push at either end, though iterators are invalidated), and no huge contiguous reallocations.\n\nDisadvantages: elements are not contiguous (no `data()`, can't pass to C APIs), slightly slower indexing (two-level lookup), and more memory overhead for small sizes. `std::queue` uses `deque` by default.", "p": "Passing `&dq[0]` to an API expecting contiguous memory; deque storage is split into blocks.", "f": ["Does `deque::push_back` invalidate references to existing elements? => No, references stay valid (iterators are invalidated).", "What's the default underlying container of `std::queue` and `std::stack`? => `std::deque`."]}, "214": {"d": "The classic iterator categories are input, output, forward, bidirectional and random access; C++20 adds contiguous iterators as a refinement of random access.", "x": "- **Input**: single-pass read (`istream_iterator`).\n- **Output**: single-pass write (`back_insert_iterator`, `ostream_iterator`).\n- **Forward**: multi-pass read/write (`forward_list`, unordered containers).\n- **Bidirectional**: plus `--` (`list`, `set`, `map`).\n- **Random access**: plus `+ n`, `[]`, `<` (`deque`).\n- **Contiguous** (C++20): elements adjacent in memory (`vector`, `array`, `string`, raw pointers).\n\nAlgorithms state requirements: `std::sort` needs random access (so `std::list` has its own `sort`), `std::reverse` needs bidirectional. C++20 expresses them as concepts (`std::random_access_iterator`).", "p": "Calling `std::sort` on `std::list` iterators, which fails to compile with a long error because list iterators are only bidirectional.", "f": ["Why can't `std::sort` work on `std::list`? => It needs random-access iterators for efficient partitioning; lists provide only bidirectional.", "Which category do `std::vector` iterators belong to? => Contiguous (and therefore random access)."]}, "215": {"d": "`std::find` does a linear search on any input range and returns an iterator to the element (O(n)); `std::binary_search` requires a sorted range and only returns `bool` (O(log n) comparisons).", "x": "To locate the element in a sorted range use `std::lower_bound` (first element not less than the value), `upper_bound`, or `equal_range`. `binary_search` alone doesn't tell you where the element is.\n\nOn a non-sorted range, `binary_search` gives meaningless results (undefined behaviour in terms of correctness). For associative containers use their member `find`, which is O(log n) or O(1).", "p": "Calling `std::binary_search` on unsorted data, or using `std::find` on a `std::set` instead of `set::find` (O(n) instead of O(log n)).", "f": ["How do you get the position of a value in a sorted vector? => `std::lower_bound`, then check the element equals the value.", "Why prefer `set.find(x)` over `std::find(set.begin(), set.end(), x)`? => The member function uses the tree (O(log n)); the algorithm scans linearly."]}, "216": {"d": "`std::map` guarantees elements are iterated in ascending key order (by its comparator); `std::unordered_map` guarantees no particular order, and the order can change after insertions that trigger rehashing.", "x": "Code that prints or serializes an `unordered_map` directly produces nondeterministic output across runs, platforms or library versions, which breaks golden-file tests and reproducible builds.\n\nIf you need deterministic output from an unordered container, copy the keys into a vector and sort them before iterating, or use `std::map` from the start.", "p": "Writing test reports by iterating an `unordered_map`, then seeing different line orders between Linux and Windows runs.", "f": ["Can iteration order of `unordered_map` change without modifying elements' values? => Yes, after inserts that trigger rehashing.", "How do you print an unordered_map deterministically? => Collect and sort the keys, then iterate in sorted order."]}, "217": {"d": "A functor is an object of a class that overloads `operator()`, so it can be called like a function while carrying state; STL algorithms and containers accept functors to customize behaviour.", "x": "Examples: comparators (`std::greater<>`), hash functions, predicates for `std::count_if`, and stateful callables (a counter or a threshold). Because the functor type is a template parameter, calls can be inlined, which often makes functors faster than function pointers.\n\nLambdas are the concise way to write functors; the standard library provides many (`std::plus`, `std::less`, `std::equal_to`), and transparent ones (`std::less<>`) that enable heterogeneous lookup.", "p": "Relying on a functor's internal state being shared across calls in algorithms that may copy it (e.g. `std::for_each` returns the final copy; others don't).", "f": ["What is a transparent comparator? => One like `std::less<>` that can compare different types, enabling `set.find(\"key\")` without creating a `std::string`.", "How do you share functor state with algorithms that copy it? => Keep state outside and capture it by reference, or use `std::ref`."]}, "218": {"d": "`std::stack`, `std::queue` and `std::priority_queue` are container **adaptors**: they wrap an underlying container (by default `deque`, `deque` and `vector`) and expose only a restricted interface (LIFO, FIFO, or highest-priority-first).", "x": "Adaptors provide no iterators, so you can't traverse or search them; they enforce the intended access pattern. You can change the underlying container (`std::stack<int, std::vector<int>>`).\n\nIf you need both queue behaviour and iteration or random access, use `std::deque` directly.", "p": "Trying to iterate over a `std::queue` to print it; adaptors deliberately don't provide iterators.", "f": ["Why don't adaptors have iterators? => They restrict access to their semantic operations (push/pop/top/front).", "What's the underlying container of `std::priority_queue`? => `std::vector` by default, organized as a binary heap."]}, "219": {"d": "Use the erase-remove idiom (`v.erase(std::remove_if(v.begin(), v.end(), pred), v.end());`) or C++20 `std::erase_if(v, pred)`; if you must erase in a loop, use the iterator returned by `erase`.", "x": "`std::remove_if` moves the kept elements to the front and returns the new logical end; `erase` then truncates. This is O(n) overall, versus O(n²) for erasing elements one by one.\n\nManual loop form: `for (auto it = v.begin(); it != v.end(); ) { if (pred(*it)) it = v.erase(it); else ++it; }`. Never increment an iterator after erasing it.\n\nC++20 `std::erase(v, value)` and `std::erase_if` work for all standard containers.", "p": "Calling `v.erase(it)` inside a range-for loop, or incrementing `it` after erasing it, which uses an invalidated iterator.", "f": ["Why is erase-remove O(n) while erasing in a loop is O(n²)? => `remove_if` shifts each element once; repeated `erase` shifts the tail each time.", "What does `std::remove_if` return? => An iterator to the new logical end; elements after it are in a valid but unspecified state."]}, "220": {"d": "`std::string` is a class managing a dynamically sized, null-terminated sequence of characters with automatic memory management; a C-style string is a `char` array or pointer terminated by `'\\0'`, with manual memory and length handling.", "x": "`std::string` knows its length (O(1) `size()`), grows automatically, can contain embedded null characters, copies and compares by value, and cleans up automatically. `c_str()` provides a null-terminated `const char*` for C APIs.\n\nC strings require manual buffer sizing (source of overflows), `strlen` is O(n), and ownership is unclear. Use `std::string_view` for read-only non-owning parameters.", "p": "Keeping the pointer from `s.c_str()` after modifying or destroying `s`; it dangles.", "f": ["Can `std::string` contain `'\\0'` characters? => Yes; its length is tracked separately, though `c_str()` users will stop at the first null.", "When should a parameter be `std::string_view`? => For read-only access to string data without needing ownership or null termination."]}, "221": {"d": "`push_back` takes an existing object (copying or moving it into the container); `emplace_back` constructs the element in place from constructor arguments, avoiding a temporary.", "x": "`v.emplace_back(\"dev\", 4096)` constructs `Device(\"dev\", 4096)` directly in the vector's storage. With an existing object, `push_back(std::move(x))` and `emplace_back(std::move(x))` are equivalent.\n\nCaveat: `emplace_back` can call **explicit** constructors, so `std::vector<std::unique_ptr<T>> v; v.emplace_back(rawPtr);` compiles and takes ownership silently, whereas `push_back(rawPtr)` wouldn't compile. Since C++17, `emplace_back` returns a reference to the new element.", "p": "Using `emplace_back` everywhere by habit; it can invoke explicit constructors unexpectedly. Use `push_back` for existing objects and `emplace_back` when constructing.", "f": ["When does `emplace_back` give a real benefit? => When constructing from arguments, avoiding a temporary that would then be moved.", "What does `emplace_back` return since C++17? => A reference to the inserted element."]}, "222": {"d": "`std::priority_queue` is a container adaptor that always gives access to the largest element (by default, using `std::less` and a max-heap over a `std::vector`).", "x": "`push` and `pop` are O(log n), `top` is O(1). For a min-heap use `std::priority_queue<T, std::vector<T>, std::greater<T>>` or a custom comparator.\n\nIt doesn't support decrease-key or iteration; for algorithms like Dijkstra, push duplicates and skip stale entries, or use `std::set` as an updatable priority queue. The heap algorithms (`std::make_heap`, `push_heap`, `pop_heap`) work directly on vectors if you need more control.", "p": "Expecting the smallest element on top with the default comparator; the default is a max-heap.", "f": ["How do you make a min-heap? => Use `std::greater<T>` as the comparator.", "How do you handle decrease-key in Dijkstra with `priority_queue`? => Push a new entry and ignore outdated ones when they're popped."]}, "223": {"d": "`std::unordered_map` needs a hash function to choose a bucket for each key and `operator==` (or a key-equality predicate) to distinguish different keys within the same bucket.", "x": "Hash collisions are unavoidable, so equality decides whether a key already exists. The two must be consistent: keys that compare equal must produce equal hashes, otherwise duplicates appear and lookups fail.\n\nFor custom keys, specialize `std::hash<Key>` or pass a hasher type, and combine member hashes well (e.g. boost-style `hash_combine`). Hash quality matters: poor hashes cluster keys in few buckets, degrading to O(n).", "p": "Defining `operator==` on some fields but hashing all fields (or vice versa), breaking the equal-keys-equal-hashes contract.", "f": ["What happens if equal keys have different hashes? => They land in different buckets, so lookups miss and duplicates are inserted.", "How do you hash a struct with several fields? => Combine field hashes with a mixing function (like `hash_combine`), or hash a tuple of the fields."]}, "224": {"d": "Iterator invalidation means iterators, pointers or references become unusable after a container modification; the rules depend on how each container stores elements.", "x": "Summary:\n\n- `vector`/`string`: reallocation invalidates everything; insert/erase invalidates at and after the position.\n- `deque`: insertion in the middle invalidates everything; at the ends invalidates iterators but not references.\n- `list`/`forward_list`/`set`/`map`: only erased elements' iterators are invalidated (node-based).\n- `unordered_*`: rehashing invalidates iterators but not references or pointers to elements; erase invalidates only the erased element.\n\nConsult cppreference's invalidation table when writing loops that modify containers.", "p": "Holding a pointer to an `unordered_map` value and assuming iterators stay valid after inserts; rehashing invalidates iterators (though pointers to elements survive).", "f": ["Which containers keep references valid across insertion? => Node-based ones (`list`, `set`, `map`, unordered containers for references).", "Does erasing from a `std::map` invalidate other iterators? => No, only the erased element's iterators."]}, "225": {"d": "`std::map::find` is O(log n) (tree search); `std::unordered_map::find` is O(1) on average but O(n) in the worst case (many keys in one bucket).", "x": "Average vs worst case matters when keys come from untrusted input: crafted keys can collide deliberately (hash flooding), making lookups linear. Randomized or keyed hashes mitigate this.\n\nConstant factors also matter: hashing a long string key may cost more than a few comparisons in a small map, and tree nodes vs hash buckets both involve pointer chasing. Benchmark with real data.", "p": "Assuming `unordered_map` is always faster; for small maps or expensive hashes, `map` or a sorted vector can be quicker.", "f": ["What is hash flooding? => An attack using keys that collide in the same bucket to force O(n) lookups.", "When can `std::map` beat `unordered_map`? => Small sizes, expensive hashing, or when ordered iteration is also needed."]}, "226": {"d": "`std::move` doesn't move anything: it's a cast to an rvalue reference (`static_cast<T&&>`) that makes an object eligible for a move constructor or move assignment, which do the actual transfer.", "x": "If the type has no move constructor, `std::move` results in a copy (the rvalue binds to `const T&`). Moving a `const` object also copies, since `const T&&` can't bind to the move constructor's `T&&`.\n\nThe real move (stealing a heap buffer, nulling the source pointer) is implemented by the class's move operations. After a move, the source is in a valid but unspecified state.", "p": "Writing `std::move(constObj)` and expecting a cheap move; const objects are copied.", "f": ["Why does moving a const object copy? => `const T&&` can't bind to `T&&`, so overload resolution chooses the copy constructor.", "Is `std::move` free at runtime? => Yes, it's just a cast; the cost is in the move constructor or assignment that follows."]}, "227": {"d": "`std::span<T>` (C++20) is a non-owning view over a contiguous sequence of elements (pointer plus length), usable for arrays, vectors, `std::array` and raw buffers alike.", "x": "It replaces `(T* data, size_t n)` parameter pairs: `void checksum(std::span<const std::byte> data)` accepts any contiguous buffer, knows its size, and offers `subspan`, `first`, `last` without copying.\n\nSpans can have a static extent (`std::span<int, 4>`) or dynamic extent. They don't own data, so they must not outlive the buffer; like other views, they're cheap to pass by value. Note `std::span::operator[]` doesn't check bounds (C++26 adds `at()`).", "p": "Returning a `std::span` into a local vector, or keeping a span after the vector reallocates.", "f": ["Why pass a span by value? => It's two words (pointer and size), cheap to copy, like `string_view`.", "How do you view a struct as bytes? => `std::as_bytes(std::span{&obj, 1})` gives `std::span<const std::byte>`."]}, "228": {"d": "`std::sort` guarantees O(n log n) comparisons (since C++11) and is typically implemented as **introsort**: quicksort, switching to heapsort if recursion gets too deep, and insertion sort for small partitions.", "x": "Quicksort is fast on average but O(n²) in the worst case; tracking recursion depth and falling back to heapsort bounds the worst case at O(n log n). Insertion sort finishes small subranges efficiently. libc++ and libstdc++ both use variations; some newer implementations use pattern-defeating quicksort (pdqsort) ideas.\n\n`std::sort` is not stable and requires random-access iterators and a strict weak ordering comparator.", "p": "Passing a comparator that isn't a strict weak ordering (e.g. using `<=`), which can make `std::sort` read out of bounds and crash.", "f": ["Why does introsort switch to heapsort? => To guarantee O(n log n) when quicksort's partitioning degenerates.", "Is `std::sort` stable? => No; use `std::stable_sort` if equal elements must keep their order."]}, "229": {"d": "`std::stable_sort` preserves the relative order of equal elements; `std::sort` doesn't.", "x": "Stability matters when sorting by one key after another (sort by name, then stable-sort by department to get departments with names ordered within), or when equal elements carry other data whose order is meaningful (timestamps of log entries with equal priority).\n\n`stable_sort` is typically a merge sort: O(n log n) with extra O(n) memory, or O(n log² n) if memory can't be allocated. It's usually somewhat slower than `std::sort`.", "p": "Sorting records by a secondary key and then by a primary key with `std::sort`, losing the secondary order.", "f": ["How does `stable_sort` behave without extra memory? => It falls back to an in-place algorithm with O(n log² n) complexity.", "How do you sort by multiple keys in one pass? => Use a comparator that compares tuples of keys (`std::tie`)."]}, "230": {"d": "`std::vector<bool>` is a space-optimized specialization that packs bits (1 bit per element) instead of storing `bool` objects, so it isn't a real container of `bool`.", "x": "Consequences: `operator[]` returns a proxy object, not `bool&`; you can't take `&v[0]` or get a `bool*`; `auto x = v[0];` captures a proxy; generic code expecting `T&` breaks; and concurrent writes to different elements race because they may share a byte.\n\nAlternatives: `std::vector<char>` or `std::vector<std::uint8_t>` for a real container, `std::bitset<N>` for fixed-size bit sets, or `boost::dynamic_bitset` for dynamic ones.", "p": "Writing a template that takes `std::vector<T>&` and returns `T&` from it; it fails for `T = bool`, whose `operator[]` returns a proxy.", "f": ["Why can't two threads safely write different elements of `vector<bool>`? => Elements share storage words, so writes are read-modify-write of the same memory.", "What should you use instead? => `std::vector<char>`, `std::bitset`, or `boost::dynamic_bitset`."]}, "231": {"d": "`std::initializer_list<T>` is a lightweight view over a compiler-created array of const elements, used for brace-initialization like `std::vector<int> v{1, 2, 3};`; brace initialization strongly prefers constructors taking an `initializer_list`.", "x": "The famous surprise: `std::vector<int> a(3, 0);` creates three zeros, but `std::vector<int> b{3, 0};` creates two elements, 3 and 0, because the `initializer_list` constructor wins overload resolution whenever it's viable.\n\nElements are const and copied into the container (can't move from them, so `std::vector<std::unique_ptr<T>>{...}` with `initializer_list` doesn't compile). The underlying array lives only as long as the `initializer_list` object in most contexts, so don't store it.", "p": "Writing `std::vector<int> v{n}` expecting `n` elements; you get one element with value `n`.", "f": ["Why doesn't `vector<unique_ptr<T>>{make_unique<T>()}` compile? => `initializer_list` elements are const, so they can only be copied, and `unique_ptr` isn't copyable.", "How do you choose the non-initializer-list constructor? => Use parentheses: `std::vector<int>(3, 0)`."]}, "232": {"d": "`std::multimap<K, V>` stores each key-value pair as a separate node with duplicate keys allowed; `std::map<K, std::vector<V>>` stores one node per key with all values grouped in a vector.", "x": "`map<K, vector<V>>` is usually more convenient and faster to iterate per key (values contiguous, one tree node per key) and makes \"all values for key\" a direct lookup. `multimap` keeps insertion order among equal keys, supports erasing individual pairs by iterator cheaply, and avoids a vector per key when most keys have one value.\n\nChoose based on access pattern; for grouping and batch processing, map-of-vectors typically wins.", "p": "Using `multimap` and then repeatedly calling `equal_range` to process groups, when a map of vectors would give direct access and better locality.", "f": ["How do you get all values for a key in a multimap? => `equal_range(key)` returns the range of matching pairs.", "Does multimap keep insertion order among equal keys? => Yes, since C++11 equal keys keep insertion order."]}, "233": {"d": "The standard specifies complexity guarantees for algorithms (usually as a maximum number of operations such as comparisons or applications of a function), and algorithms like `std::for_each` and `std::transform` apply their function exactly once per element in the range.", "x": "Examples: `std::sort` O(n log n) comparisons; `std::find` at most n comparisons; `std::nth_element` O(n) on average; `std::for_each` exactly n applications. These guarantees make performance predictable across implementations.\n\n`std::for_each` guarantees in-order application (it returns the function object); `std::transform` doesn't guarantee order of application (so functions shouldn't rely on sequencing side effects). The parallel overloads (C++17 execution policies) relax ordering further.", "p": "Passing a stateful function with side effects to `std::transform` and relying on the order of application.", "f": ["Does `std::transform` guarantee left-to-right application? => No; only `std::for_each` (sequential) guarantees order.", "What complexity does `std::nth_element` have? => Linear on average."]}, "234": {"d": "`std::any` (C++17) holds a single value of **any** copyable type, checked at runtime with `std::any_cast`; `std::variant<Ts...>` holds a value of one of a **fixed set** of types, checked at compile time and accessed with `std::visit`, `std::get` or `std::get_if`.", "x": "`variant` is a type-safe union: no heap allocation, size equals the largest alternative plus a discriminator, and `std::visit` enforces handling of every alternative. It's ideal for closed sets (messages, AST nodes, results).\n\n`any` is a type-erased container: flexible (plugin data, heterogeneous property bags), but requires knowing the type to extract, may allocate for large types, and errors surface only at runtime (`std::bad_any_cast`).", "p": "Using `std::any` where the set of types is known; `std::variant` gives compile-time checking and better performance.", "f": ["What happens when `std::get<T>` is used on a variant holding another type? => It throws `std::bad_variant_access`.", "Does `std::any` allocate? => Possibly; implementations use a small-buffer optimization for small types and allocate for larger ones."]}, "235": {"d": "`std::optional<T>` (C++17) represents a value that may or may not be present, storing it inline without heap allocation, instead of using sentinel values, null pointers or out-parameters.", "x": "Typical use: return types for lookups or parsing that can fail (`std::optional<int> parsePort(std::string_view)`). Access with `has_value()` / `if (opt)`, `*opt` (unchecked), `value()` (throws `std::bad_optional_access`), or `value_or(default)`. C++23 adds monadic operations `and_then`, `transform`, `or_else`.\n\nFor failures that need a reason, C++23's `std::expected<T, E>` carries either a value or an error.", "p": "Dereferencing an empty optional with `*opt` (undefined behaviour) instead of checking or using `value_or`.", "f": ["When would you use `std::expected` instead of `std::optional`? => When callers need to know why the operation failed.", "Does `std::optional` allocate memory? => No, the value is stored inside the optional object."]}, "236": {"d": "`erase` removes the specified elements and `clear` removes all elements; neither reduces `capacity()`, so the allocated memory stays until `shrink_to_fit()`, a swap, or destruction.", "x": "This is intentional: keeping capacity makes refilling the vector cheap. Destructors of the removed elements do run.\n\nTo actually free memory: `v.clear(); v.shrink_to_fit();` (non-binding but honoured by major implementations) or `std::vector<T>().swap(v);` (guaranteed).", "p": "Clearing a large buffer vector in a long-running process and assuming memory usage drops.", "f": ["Does `clear()` call element destructors? => Yes, it destroys all elements but keeps the storage.", "How do you guarantee releasing a vector's memory? => Swap it with an empty temporary: `std::vector<T>().swap(v);`."]}, "237": {"d": "`std::list::sort` is a member function because the generic `std::sort` requires random-access iterators, which linked lists can't provide efficiently; the member version sorts by relinking nodes (typically merge sort) in O(n log n).", "x": "Relinking nodes also means no elements are copied or moved and iterators and references remain valid, which a generic algorithm couldn't guarantee.\n\nThe same reasoning applies to `list::merge`, `list::remove`, `list::unique` and `list::reverse`: members exploit the node structure. For associative containers, member `find`, `count` and `lower_bound` exist for the same reason.", "p": "Copying a list into a vector to sort it and back, when `lst.sort()` sorts in place without moving elements.", "f": ["Does `list::sort` invalidate iterators? => No; nodes are relinked, so iterators and references stay valid.", "Why do associative containers have member `find`? => It uses the tree or hash structure (O(log n) or O(1)) instead of a linear scan."]}, "238": {"d": "A hint iterator passed to `std::map::insert(hint, value)` (or `emplace_hint`) tells the container where the new element probably belongs; if correct, insertion is amortized O(1) instead of O(log n).", "x": "The hint should be the position just after where the element will go (C++11 semantics). The classic use is inserting already-sorted data: pass `end()` (or the iterator returned by the previous insert) so each insertion is constant time.\n\nA wrong hint is harmless for correctness; the container falls back to a normal search.", "p": "Passing `begin()` as the hint while inserting ascending keys; the hint is wrong every time, so there's no speedup.", "f": ["What hint should you use when inserting sorted keys in ascending order? => `end()` (or the result of the previous insert).", "What happens with a bad hint? => Insertion still works correctly, just at normal O(log n) cost."]}, "239": {"d": "The bucket count is the number of hash buckets; the load factor is the average number of elements per bucket (`size() / bucket_count()`); when it would exceed `max_load_factor()` (default 1.0), the container rehashes into more buckets.", "x": "Rehashing costs O(n) and invalidates iterators (not references). Lower load factors mean fewer collisions and faster lookups but more memory.\n\nTune with `reserve(n)` (enough buckets for n elements without rehashing), `rehash(buckets)`, and `max_load_factor(f)`. Reserving up front avoids repeated rehashing when bulk-loading a map.", "p": "Bulk-inserting millions of entries into an `unordered_map` without `reserve`, causing many O(n) rehashes along the way.", "f": ["What does `unordered_map::reserve(n)` do? => Sets the bucket count so `n` elements fit without exceeding the max load factor.", "What does rehashing invalidate? => Iterators, but not pointers or references to elements."]}, "240": {"d": "C++20 ranges provide algorithms that take whole ranges (`std::ranges::sort(v)`), support projections, use concepts for clearer errors, and add lazy, composable **views** (`std::views::filter`, `transform`, `take`) combined with `|`.", "x": "Example: `for (int x : readings | std::views::filter(isValid) | std::views::transform(toCelsius) | std::views::take(10))` processes lazily without temporary vectors.\n\nProjections: `std::ranges::sort(devices, {}, &Device::temperature)` sorts by a member without writing a comparator lambda. Algorithms return richer results (e.g. iterator plus sentinel), and sentinels allow ranges without a real end iterator.\n\nC++23 adds more views (`zip`, `enumerate`, `chunk`, `slide`) and `std::ranges::to` to materialize views into containers.", "p": "Storing a view that refers to a temporary container (`auto v = getVec() | views::filter(f);`), which dangles.", "f": ["What is a projection? => A function applied to each element before the comparison or predicate, e.g. sorting by a member.", "How do you turn a view into a vector in C++23? => `std::ranges::to<std::vector>()`."]}, "241": {"d": "`std::unique` removes **consecutive** duplicate elements by shifting later unique elements forward and returns the new logical end; it only removes all duplicates if equal elements are adjacent, which sorting guarantees.", "x": "Pattern: `std::sort(v.begin(), v.end()); v.erase(std::unique(v.begin(), v.end()), v.end());`. Like `remove`, `unique` doesn't change the container's size; you must `erase` the tail.\n\nIf order must be preserved, use a seen-set approach or `std::unordered_set` to filter while keeping the first occurrence.", "p": "Calling `std::unique` without sorting and without `erase`, then being surprised that duplicates remain and the vector size is unchanged.", "f": ["Why doesn't `std::unique` shrink the vector? => Algorithms work on iterators and can't change a container's size; use `erase`.", "How do you dedupe while keeping original order? => Track seen values in a set and keep only first occurrences."]}, "242": {"d": "`std::accumulate` folds a range into a single value using an initial value and a binary operation (default `+`), expressing sums, products, concatenations and other reductions generically.", "x": "Pitfalls: the result type is the type of the **initial value**, so `std::accumulate(v.begin(), v.end(), 0)` on doubles truncates to int; use `0.0`. It's strictly left-to-right and sequential.\n\n`std::reduce` (C++17) allows reordering and parallel execution (with an associative, commutative operation), and `std::transform_reduce` combines mapping and reduction. C++23 adds `std::ranges::fold_left`.", "p": "Summing doubles with an initial value of `0` (an int), silently truncating the result.", "f": ["What decides `accumulate`'s result type? => The type of the initial value argument.", "How does `std::reduce` differ? => It may reorder operations and run in parallel, so the operation should be associative and commutative."]}, "243": {"d": "Inserting into the middle of a `std::vector` is O(n) because all elements after the position must shift by one (and a reallocation may copy everything); inserting at the end is amortized O(1) because nothing needs to shift.", "x": "Middle insertion calls move assignments or moves for each subsequent element; for large vectors of expensive-to-move elements, this dominates. Still, contiguous shifting is fast in practice (memmove-like for trivially copyable types), so vectors often beat linked lists even with some middle insertions.\n\nIf you insert many elements in the middle, batch them: append then `std::sort`, or build a new vector, rather than inserting one by one.", "p": "Inserting elements one by one at the front of a large vector in a loop, turning the whole operation into O(n²).", "f": ["How do you insert many elements efficiently? => Insert a whole range at once (`v.insert(pos, first, last)`) or append and sort.", "Why can vector still beat list for middle insertions? => Shifting contiguous memory is cache-friendly, while finding a position in a list is slow."]}, "244": {"d": "`std::forward_list` (C++11) is a singly linked list with minimal overhead (one pointer per node, no size member), while `std::list` is doubly linked with bidirectional iteration and O(1) `size()`.", "x": "Because nodes only know their successor, `forward_list` operations are expressed \"after\" a position: `insert_after`, `erase_after`, `emplace_after`, and `before_begin()` for inserting at the front. It has no `push_back` or `size()`.\n\nIt's meant to match a hand-written C singly linked list in space and speed. Use it only when the memory savings matter; otherwise `std::vector` (or `list` for stable iterators) is simpler.", "p": "Trying to erase the current element of a `forward_list` while iterating with a single iterator; you must track the previous position and use `erase_after`.", "f": ["Why doesn't `forward_list` have `size()`? => Maintaining a size would add space and time overhead that the container is designed to avoid.", "What is `before_begin()` for? => A position before the first element, allowing `insert_after` and `erase_after` at the front."]}, "245": {"d": "Separating algorithms from containers through iterators lets each algorithm be written once and work with every container (and arrays, streams, custom types), reducing N x M implementations to N + M.", "x": "This is **generic programming** as designed by Alexander Stepanov: algorithms specify requirements on iterators (concepts), containers provide iterators meeting them, and the compiler generates efficient specialized code through templates.\n\nBenefits: reuse, consistency, and zero abstraction cost. Your own containers gain the whole algorithm library by providing standard-conforming iterators. C++20 concepts and ranges make the requirements explicit and errors readable.", "p": "Implementing custom containers without standard iterators, forcing users to write manual loops instead of using `std::` algorithms.", "f": ["What must a custom container provide to use STL algorithms? => Iterators meeting the relevant category requirements, via `begin()` and `end()`.", "Who designed the STL's generic approach? => Alexander Stepanov (with Meng Lee), based on generic programming principles."]}, "246": {"d": "A template is a blueprint for generating functions, classes, variables or aliases parameterized by types, values or other templates; the compiler instantiates concrete code for each set of arguments used.", "x": "Templates are C++'s mechanism for generic programming and compile-time polymorphism: `std::vector<T>`, `std::sort`, `std::max` are all templates. The generated code is as efficient as hand-written type-specific code.\n\nKinds: function templates, class templates, variable templates (C++14), alias templates (C++11), and C++20 concepts to constrain them. Parameters can be types, non-type values (integers, pointers, and in C++20 floating point and literal class types), or templates.", "p": "Expecting templates to be \"compiled once\" like normal functions; each distinct argument set produces separate code, which affects build time and binary size.", "f": ["What kinds of template parameters exist? => Type, non-type (value) and template template parameters.", "Are templates resolved at runtime? => No; instantiation and dispatch happen at compile time."]}, "247": {"d": "A function template generates functions (`template<class T> T max(T a, T b)`) and its arguments are usually deduced from the call; a class template generates classes (`template<class T> class Stack`) whose arguments are specified or deduced via CTAD.", "x": "Function templates can be overloaded with other templates and non-templates, and participate in overload resolution. Class templates can be partially specialized; function templates can't (overload them instead).\n\nMember functions of class templates are instantiated only if used, so a `Stack<T>` whose `print()` requires `operator<<` still works for types without it as long as `print()` isn't called.", "p": "Trying to partially specialize a function template; that's not allowed, and full specializations of function templates don't participate in overload resolution the way people expect. Use overloading.", "f": ["Why prefer overloading over specializing function templates? => Specializations don't take part in overload resolution; overloads do, which gives more predictable results.", "When are member functions of a class template instantiated? => Only when they're used."]}, "248": {"d": "Template argument deduction is the process by which the compiler infers template parameters from the types of function call arguments, following specific rules for references, const and arrays.", "x": "Key rules for `template<class T> void f(P param)`:\n\n- `P = T` (by value): references and top-level const are dropped; arrays and functions decay to pointers.\n- `P = T&`: const is kept in `T`; arrays keep their size.\n- `P = T&&` (forwarding reference): lvalues deduce `T` as `X&`, rvalues as `X`, enabling perfect forwarding.\n\nDeduction fails if parameters conflict (`max(1, 2.0)` deduces `int` and `double` for the same `T`). `auto` variables follow the same rules (except braced initializers).", "p": "Calling `std::max(n, 10L)` with an `int` and a `long`: deduction conflicts and compilation fails; use `std::max<long>(n, 10L)`.", "f": ["What is a forwarding reference? => A `T&&` parameter where `T` is deduced; it binds to both lvalues and rvalues.", "Why does `auto x = arr;` give a pointer? => `auto` uses by-value deduction rules, under which arrays decay."]}, "249": {"d": "Yes: template parameters can have default arguments, e.g. `template<class T, class Alloc = std::allocator<T>> class vector;`, and since C++11 function templates can too.", "x": "Defaults are used when arguments aren't specified or deduced. For class templates, defaults must be trailing (like function default arguments); for function templates, a defaulted parameter can come before others if the later ones are deduced.\n\nDefaults are common for allocators, comparators (`std::less<Key>`), hashers and policies, letting typical users write `std::map<K, V>` while experts customize.", "p": "Changing a default template argument in a library and breaking ABI, since the default becomes part of every user's instantiated type.", "f": ["Can function templates have default template arguments? => Yes, since C++11.", "Where does the STL use defaults heavily? => Allocators, comparators and hash functions in containers."]}, "250": {"d": "Template specialization provides a custom implementation of a template for specific template arguments, replacing the generic version for those arguments.", "x": "Full specialization: `template<> struct Hash<Device> { ... };` for exactly one argument set. Partial specialization (class templates only): `template<class T> struct IsPointer<T*> : std::true_type {};` for a pattern of arguments.\n\nUses: optimized implementations (`std::vector<bool>`), traits (`std::hash<MyType>`), and handling special cases. Specializations must be declared before first use that would instantiate the primary template with those arguments.", "p": "Declaring a specialization after code has already used (and instantiated) the primary template for those arguments, which is ill-formed, no diagnostic required.", "f": ["How do you make a custom type hashable for unordered containers? => Specialize `std::hash<MyType>` (or pass a hasher).", "Can you specialize a member function of a class template? => Yes, a full specialization of a member of a specific instantiation."]}, "251": {"d": "A full (explicit) specialization fixes all template arguments (`template<> class Buffer<char>`); a partial specialization fixes only some or matches a pattern (`template<class T> class Buffer<T*>`) and is allowed only for class and variable templates.", "x": "The compiler picks the most specialized matching partial specialization; ambiguity between two equally specialized ones is an error.\n\nFunction templates can't be partially specialized; instead overload them or dispatch to a class template (tag dispatching, `if constexpr`, or concepts).", "p": "Trying to write `template<class T> void f<T*>(T*)`; it's ill-formed. Write an overload `template<class T> void f(T*)` instead.", "f": ["How is the best partial specialization chosen? => By partial ordering: the most specialized match wins.", "How do you emulate partial specialization for functions? => Overloading, or forwarding to a partially specialized class template."]}, "252": {"d": "A non-type template parameter is a compile-time value (integer, enum, pointer, reference; since C++20 also floating-point and structural class types) used as a template argument, e.g. `std::array<int, 16>`.", "x": "Values become part of the type, so `Buffer<256>` and `Buffer<512>` are different types, and the compiler can optimize with the constant (unroll loops, size arrays).\n\nC++17 allows `template<auto N>` to deduce the type; C++20 allows class types with public members (e.g. fixed strings as template arguments). Uses: fixed-size buffers, compile-time register addresses and bit widths in firmware, unit systems.", "p": "Using many distinct non-type values (e.g. every buffer size) as template arguments, generating a separate instantiation for each and bloating the binary.", "f": ["What does `template<auto N>` do? => Deduces the type of the non-type parameter from the argument (C++17).", "Can a string be a template argument? => In C++20, via a structural class type wrapping a fixed-size char array."]}, "253": {"d": "SFINAE (Substitution Failure Is Not An Error) means that if substituting template arguments into a function template's signature produces an invalid type or expression, that overload is silently removed from the candidate set instead of causing a compile error.", "x": "It enables constraining templates: `template<class T, std::enable_if_t<std::is_integral_v<T>, int> = 0> void f(T)` only participates for integral types. Only errors in the **immediate context** (the signature) are SFINAE; errors inside the function body are hard errors.\n\nC++20 concepts and `requires` clauses replace most SFINAE with clearer syntax and far better error messages.", "p": "Expecting an error inside a function template's body to be SFINAE; body errors are hard errors after the overload is chosen.", "f": ["What is the immediate context? => The function's signature and template parameters, where substitution failures are soft errors.", "What replaced SFINAE in modern C++? => Concepts and `requires` clauses (C++20)."]}, "254": {"d": "Inside a template, `typename` tells the compiler that a **dependent qualified name** (a name depending on a template parameter, like `T::value_type`) refers to a type.", "x": "Without it, the compiler assumes `T::value_type` is a value, so `T::value_type x;` fails to parse. Write `typename T::value_type x;` or use an alias `using V = typename T::value_type;`.\n\nC++20 relaxes the requirement in contexts where only a type can appear (e.g. return types, alias declarations, member types). Similarly, `template` is needed to call a dependent member template: `obj.template get<0>()`.", "p": "Omitting `typename` before `T::iterator` in older code or unusual contexts, producing cryptic \"expected primary-expression\" errors.", "f": ["Why can't the compiler figure it out itself? => Until instantiation, `T::name` might be a type or a value, and parsing needs to know which.", "When do you need the `template` keyword in a call? => When calling a member template on a dependent object: `x.template f<int>()`."]}, "255": {"d": "Variadic templates (C++11) take any number of template arguments through a parameter pack (`template<class... Ts>`), enabling type-safe functions and classes with arbitrary arity.", "x": "They power `std::tuple`, `std::variant`, `std::make_unique(args...)`, `std::thread(f, args...)`, `emplace_back(args...)` and `std::format`.\n\nPacks are expanded with `...` (`f(args...)`, `std::forward<Ts>(args)...`), processed recursively (head/tail), with C++17 fold expressions (`(args + ...)`), or with `if constexpr`. `sizeof...(Ts)` gives the pack size. Unlike C varargs (`...` with `va_list`), variadic templates are fully type-checked.", "p": "Writing deep recursive instantiations to process packs where a C++17 fold expression would be simpler and compile faster.", "f": ["How do you perfect-forward a pack? => `f(std::forward<Args>(args)...)` with `Args&&... args` parameters.", "What does `sizeof...(Args)` return? => The number of elements in the pack."]}, "256": {"d": "A template is part of the language, type-checked and scoped, generating code at compile time; a macro is textual substitution by the preprocessor with no types, scopes or evaluation rules.", "x": "Templates respect namespaces, access control and overload resolution, evaluate arguments once, can be debugged and stepped through, and give (with concepts) meaningful errors. Macros ignore all of that: `#define MAX(a,b) ((a)>(b)?(a):(b))` evaluates an argument twice (`MAX(i++, j)`), pollutes every scope, and hides errors.\n\nMacros remain useful for conditional compilation, include guards and capturing `__FILE__`/`__LINE__` (partly replaced by `std::source_location`).", "p": "Writing a function-like macro for a generic helper (`SWAP`, `MIN`) when a function template is safer and just as fast.", "f": ["Why do macros evaluate arguments multiple times? => Each occurrence of the parameter is textually replaced by the argument expression.", "What remains a legitimate use for macros? => Conditional compilation, include guards, and some logging/assert helpers."]}, "257": {"d": "Instantiation is the compiler generating a concrete function or class from a template for specific arguments; implicit instantiation happens when the template is used with those arguments in a way that requires its definition.", "x": "Using `std::vector<Device>` instantiates the class (its declarations), and each member function is instantiated only when used. Function templates are instantiated when called (or their address taken).\n\nEach translation unit instantiates what it uses; the linker then deduplicates identical instantiations (they're emitted as weak/COMDAT symbols). Explicit instantiation (`template class Foo<int>;`) forces it, and `extern template` suppresses it in other units.", "p": "Assuming an error in a member function will appear as soon as the class template is used; it appears only when that member is instantiated.", "f": ["How does the linker handle the same instantiation in many object files? => They're weak/COMDAT symbols, and it keeps one copy.", "What does `extern template class Foo<int>;` do? => Tells this translation unit not to instantiate it, relying on an explicit instantiation elsewhere."]}, "258": {"d": "Templates must usually be defined in headers because the compiler needs the full definition in every translation unit that instantiates them with new arguments; a separately compiled `.cpp` can't know which instantiations other files will need.", "x": "If the definition is only in `foo.cpp`, other files can declare and call `f<int>`, but nothing generates `f<int>`, causing \"undefined reference\" link errors.\n\nAlternatives: explicit instantiation in the `.cpp` for a known set of types (`template void f<int>(int);`), which keeps definitions private and speeds builds; or C++20 modules, which export templates without textual headers.", "p": "Moving template definitions into a `.cpp` for tidiness and getting link errors for every new type used.", "f": ["When can template definitions live in a `.cpp`? => When you explicitly instantiate all needed argument combinations there.", "How do modules change this? => A module interface can export templates; importers get them without textual inclusion."]}, "259": {"d": "`std::enable_if<Cond, T>` has a nested `type` only when `Cond` is true, so using `std::enable_if_t<Cond>` in a template's signature removes that overload via SFINAE when the condition is false.", "x": "Typical forms: as a return type (`std::enable_if_t<std::is_integral_v<T>, T> f(T)`), a defaulted template parameter (`std::enable_if_t<cond, int> = 0`), or a function parameter default. It's used to select overloads by type properties or to disable constructors (e.g. perfect-forwarding constructors that would hijack copies).\n\nIn C++20 prefer concepts: `template<std::integral T> T f(T)` or `requires std::integral<T>`, which read better and produce better errors.", "p": "Putting `enable_if` in a defaulted template type parameter (`typename = enable_if_t<...>`) for two overloads that differ only in that default: they're redeclarations, not overloads.", "f": ["Why use `std::enable_if_t<cond, int> = 0` instead of `typename = ...`? => Non-type parameters make the conditions part of the signature, so overloads differing only in the condition don't clash.", "What's the C++20 replacement? => Concepts and `requires` clauses."]}, "260": {"d": "A template template parameter is a template parameter that itself accepts a template (not a type), e.g. `template<template<class...> class Container> class Registry` which can be instantiated as `Registry<std::vector>`.", "x": "It lets a class decide the element type while the user chooses the container kind: inside `Registry`, `Container<Device>` is used. Declaring it variadic (`template<class...> class C`) makes it accept templates with extra defaulted parameters like allocators.\n\nMany uses can be replaced by passing a fully specified type or by traits/rebinding (as allocators do), which is often simpler.", "p": "Declaring `template<template<class> class C>` and then failing to pass `std::vector`, whose template has two parameters (with a default); use `template<class...> class C`.", "f": ["Why use a variadic template template parameter? => To accept templates that have additional (often defaulted) parameters.", "What's an alternative to template template parameters? => Passing a concrete type or a metafunction/trait that produces the type."]}, "261": {"d": "CTAD (class template argument deduction, C++17) lets the compiler deduce class template arguments from constructor arguments, so you can write `std::pair p{1, 2.5};` or `std::vector v{1, 2, 3};` without spelling out the types.", "x": "Deduction uses the constructors (implicit guides) plus user-written **deduction guides**, e.g. `template<class It> Buffer(It, It) -> Buffer<typename std::iterator_traits<It>::value_type>;`.\n\nIt simplifies code with lock guards (`std::lock_guard lk(mtx);`) and containers, but beware surprises: `std::vector v{v2};` copies (deduces `vector<int>` from a vector) rather than creating a vector of vectors, and string literals deduce `const char*` rather than `std::string`.", "p": "Writing `std::vector v{\"a\", \"b\"};` expecting `vector<std::string>`; CTAD deduces `vector<const char*>`.", "f": ["What is a deduction guide? => A declaration telling CTAD how to deduce template arguments from constructor arguments.", "Does CTAD work for aggregates? => Yes, since C++20 aggregates get implicit deduction guides."]}, "262": {"d": "C++20 concepts are named compile-time predicates on template arguments (e.g. `std::integral`, `std::ranges::range`) used in `requires` clauses or constrained parameters, replacing SFINAE tricks with readable constraints and clear error messages.", "x": "Example: `template<std::floating_point T> T mean(std::span<const T>)`. A custom concept: `template<class D> concept BlockDevice = requires(D d, std::uint64_t lba, std::span<std::byte> buf) { d.read(lba, buf); d.write(lba, buf); };`.\n\nBenefits over SFINAE: constraints are part of the interface and documentation; errors say which requirement failed; overloads can be ordered by subsumption (more constrained wins); and syntax is shorter (`void f(std::integral auto x)`).", "p": "Writing concepts that only check syntax (\"has a `read` method\") while ignoring semantics (what `read` must do); concepts can't enforce semantics, so document them.", "f": ["What is subsumption? => When one concept's constraints imply another's, the more constrained overload is preferred.", "How do you write a constrained parameter concisely? => `void f(std::integral auto x)` (abbreviated function template)."]}, "263": {"d": "Expression SFINAE removes an overload when an **expression** in its signature is invalid for the given types (e.g. `decltype(t.begin())`), whereas classic type SFINAE fails on an invalid **type** (e.g. a missing nested `type`).", "x": "Expression SFINAE (fully supported since C++11) lets you test for capabilities directly: `template<class T> auto size(const T& t) -> decltype(t.size())` exists only for types with a `size()` member. `std::void_t<decltype(...)>` builds detection traits on the same idea.\n\nC++20 `requires` expressions express this cleanly: `requires(T t) { t.size(); }`.", "p": "Writing a detection trait that checks for a member but uses it in the function body instead of the signature; the check then isn't SFINAE-friendly.", "f": ["What is `std::void_t` used for? => Building detection idioms: it maps any valid types to `void`, failing via SFINAE if an expression is invalid.", "How does C++20 express the same check? => A `requires` expression inside a concept or `requires` clause."]}, "264": {"d": "Variable templates (C++14) are variables parameterized by template arguments, e.g. `template<class T> constexpr T pi = T(3.14159265358979323846L);`, used as `pi<float>`.", "x": "They're the idiom behind the `_v` type-trait helpers (`std::is_integral_v<T>` is `std::is_integral<T>::value`), and useful for per-type constants (maximum register widths, default timeouts per device class).\n\nThey can be specialized like class templates and are usually `constexpr` or `inline` to avoid ODR issues.", "p": "Defining a non-constexpr, non-inline variable template in a header and running into multiple-definition problems.", "f": ["What are the `_v` helpers? => Variable templates providing a trait's `::value`, e.g. `std::is_same_v<A, B>`.", "Can variable templates be specialized? => Yes, fully and partially."]}, "265": {"d": "`if constexpr` (C++17) evaluates its condition at compile time and discards the branch not taken, so the discarded code isn't instantiated and may contain code that would be invalid for the current template arguments.", "x": "Example: `if constexpr (std::is_integral_v<T>) return x % 2; else return std::fmod(x, 2.0);` compiles for both ints and doubles, whereas a regular `if` would need both branches valid for every `T`.\n\nIt replaces many uses of tag dispatch and SFINAE overload sets. The discarding only happens inside templates; in non-template code, both branches must still be well-formed.", "p": "Using a regular `if` with a type-trait condition inside a template and getting compile errors from the branch that should never run.", "f": ["Is the discarded branch type-checked? => Only for things independent of template parameters; dependent code isn't instantiated.", "Does `if constexpr` discard code outside templates? => No; the discarded statement must still be valid there."]}, "266": {"d": "Template metaprogramming computes with types and values through template instantiation (recursive templates, specializations); `constexpr` functions compute values at compile time using ordinary C++ syntax.", "x": "TMP was the only compile-time computation tool before C++11: factorials as recursive class templates, type lists and traits. It's powerful for **type** computations but hard to read and slow to compile.\n\n`constexpr` (C++11, greatly expanded in C++14/17/20) handles value computations naturally with loops, variables, and even `std::vector` and `std::string` inside constant evaluation (C++20). `consteval` forces compile-time evaluation. Modern rule: use constexpr for values, templates/traits/concepts for types.", "p": "Writing recursive template metaprograms for numeric calculations (lookup tables, CRCs) that a `constexpr` function would express in a few readable lines.", "f": ["What does `consteval` add? => Functions that must be evaluated at compile time (immediate functions).", "Can you use `std::vector` in constexpr code? => Yes, since C++20, as long as allocations are freed within the constant evaluation."]}, "267": {"d": "A fold expression (C++17) reduces a parameter pack with a binary operator in one expression, e.g. `(args + ...)` or `(std::cout << ... << args)`, replacing recursive template functions.", "x": "Forms: unary right `(pack op ...)`, unary left `(... op pack)`, and binary forms with an initial value `(init op ... op pack)`. Empty packs are only allowed for `&&` (true), `||` (false) and `,` (void).\n\nCommon idioms: `(f(args), ...)` to call a function for each argument in order; `(std::is_integral_v<Ts> && ...)` for checks; `((sum += args), ...)`.", "p": "Using an empty-pack unary fold with `+`, which is ill-formed; add an initial value (`(0 + ... + args)`).", "f": ["How do you call a function for each pack element in order? => A comma fold: `(f(args), ...);`.", "Which operators allow empty unary folds? => `&&`, `||` and the comma operator."]}, "268": {"d": "Two-phase lookup checks template code twice: non-dependent names are looked up when the template is defined, dependent names (those depending on template parameters) when it's instantiated; this is why `typename` and `template` disambiguators are needed for dependent names.", "x": "Consequences:\n\n- Names from a **dependent base class** aren't found by unqualified lookup in phase one; use `this->member` or `Base<T>::member`.\n- A dependent qualified name is assumed to be a value unless prefixed with `typename`.\n- A dependent member template needs `template` before its name when explicit arguments are given (`obj.template get<0>()`).\n\nMSVC historically deferred all lookup (accepting code other compilers reject); `/permissive-` enables conforming two-phase lookup.", "p": "Calling a member of a templated base class without `this->` and getting \"not declared in this scope\" on GCC/Clang while it compiled on old MSVC.", "f": ["Why do you need `this->` for dependent base members? => Unqualified names aren't looked up in dependent bases during the first phase.", "What does MSVC's `/permissive-` do here? => Enables standard two-phase lookup, catching code that only non-conforming MSVC accepted."]}, "269": {"d": "Template bloat is excessive machine code from instantiating templates for many argument combinations, increasing binary size, instruction-cache pressure and build times.", "x": "Mitigations:\n\n- **Thin template / type erasure**: move type-independent code into a non-template base (e.g. a `void*`-based container core with thin typed wrappers).\n- **Explicit instantiation** with `extern template` to instantiate common cases once.\n- Avoid unnecessary non-type parameters (e.g. buffer sizes as runtime values).\n- Linker identical code folding (`--icf=all`, MSVC `/OPT:ICF`) merges identical instantiations.\n- Measure with tools like `bloaty` or `nm --size-sort`.\n\nIn embedded firmware, flash size makes this especially important.", "p": "Making buffer size a template parameter throughout a firmware stack, creating a separate copy of every function for each size used.", "f": ["What is identical code folding? => A linker optimization merging functions with identical machine code.", "How does the thin template idiom work? => A non-template base implements the logic on untyped data; templated wrappers only add type safety."]}, "270": {"d": "Policy-based design composes behaviour from template parameters (policies) chosen at compile time; runtime polymorphism composes behaviour through virtual interfaces chosen at runtime.", "x": "Policies (e.g. `template<class Locking, class Checking> class Buffer`) give zero-overhead customization, inlining and compile-time errors, but every combination is a distinct type (no single container of mixed buffers) and choices can't change at runtime. Popularized by Andrei Alexandrescu's *Modern C++ Design*; the STL's allocators and comparators are policies.\n\nRuntime polymorphism (strategy objects behind interfaces) allows configuration-driven choices and heterogeneous collections, at the cost of indirect calls and allocation.", "p": "Using policies for choices that actually come from configuration files at runtime, forcing awkward switch statements to pick among instantiated types.", "f": ["When is policy-based design a good fit? => When behaviour is known at compile time and performance matters, e.g. locking or bounds-checking policies.", "Can you store `Buffer<LockPolicy, NoCheck>` and `Buffer<NoLock, Check>` in one container? => Not directly; they're unrelated types without a common base."]}, "271": {"d": "C++20 abbreviated function templates let you declare a template using `auto` in parameter types: `auto add(auto a, auto b)` is shorthand for a function template with one invented type parameter per `auto`.", "x": "Each `auto` parameter is a separate template parameter, so `add(1, 2.5)` works (int and double). Constrained forms read naturally: `void log(std::integral auto value)` or `void save(const std::ranges::range auto& r)`.\n\nIt's the function counterpart of generic lambdas (`[](auto x) {}`, C++14). Because these are templates, their definitions must be visible where they're used (headers).", "p": "Assuming `auto add(auto a, auto b)` forces both arguments to the same type; each `auto` is an independent template parameter.", "f": ["Is an abbreviated function template still a template? => Yes; it must be defined where visible and is instantiated per argument types.", "How do you constrain an `auto` parameter? => Put a concept before it: `std::integral auto x`."]}, "272": {"d": "A type trait is a template that answers a compile-time question about a type (`std::is_integral<T>`, `std::is_trivially_copyable<T>`) or transforms one (`std::remove_cvref<T>`, `std::make_unsigned<T>`), exposing the result as `::value` or `::type`.", "x": "Traits are typically implemented with specializations (`is_pointer<T*>` is true) or compiler intrinsics. Helpers `_v` and `_t` shorten usage.\n\nThey drive `if constexpr`, `static_assert`, SFINAE and concepts: e.g. using `memcpy` for trivially copyable types, or `static_assert(std::is_standard_layout_v<RegBlock>)` for structs mapped onto hardware registers. You can write your own traits for your types (`is_device_handle<T>`).", "p": "Adding specializations to most standard type traits for your own types: it's undefined behaviour for traits the standard says must not be specialized (e.g. `std::is_integral`).", "f": ["What does `std::remove_cvref_t<T>` do? => Removes references and const/volatile qualifiers (C++20).", "Why check `std::is_trivially_copyable_v` before `memcpy`? => Byte-copying non-trivially-copyable objects is undefined behaviour."]}, "273": {"d": "`std::declval<T>()` produces a (fake) rvalue reference to `T` usable only in unevaluated contexts like `decltype` and `noexcept`, so you can reason about expressions involving `T` even if `T` isn't default-constructible.", "x": "Example: `using R = decltype(std::declval<F>()(std::declval<Args>()...));` computes the result type of calling `F` with `Args`, which is how `std::invoke_result` works.\n\nIt has no definition; odr-using it (calling it in evaluated code) is a compile error. In C++20, `requires` expressions often express the same idea with declared parameters.", "p": "Calling `std::declval<T>()` in normal code; it's only declared, so using it outside `decltype`/`sizeof`/`noexcept` fails.", "f": ["Why not use `T()` in `decltype`? => `T` might not be default-constructible; `declval` works for any type.", "Which standard trait relies on `declval`? => `std::invoke_result` (and `std::common_type`, among others)."]}, "274": {"d": "The most vexing parse is a C++ grammar rule by which a statement that could be read as a function declaration is treated as one, e.g. `Timer t(Clock());` declares a function `t` instead of an object.", "x": "`std::vector<int> v(std::istream_iterator<int>(file), std::istream_iterator<int>());` is the classic example: it declares a function. In generic code this can hide inside templates where arguments are types.\n\nFixes: brace initialization (`Timer t{Clock{}};`), extra parentheses around arguments, or `auto t = Timer(Clock());`. Compilers warn (`-Wvexing-parse` in Clang).", "p": "Writing `Widget w();` to call the default constructor; it declares a function returning `Widget`.", "f": ["How does brace initialization avoid the vexing parse? => Braces can't form a function declaration, so it's always an object definition.", "Is `Widget w();` an object? => No, it's a function declaration; use `Widget w;` or `Widget w{};`."]}, "275": {"d": "Explicit instantiation (`template class Stack<int>;` or `template void f<int>(int);`) forces the compiler to generate a template's code for specific arguments in one translation unit.", "x": "Combined with `extern template class Stack<int>;` in a header, other translation units skip instantiating it and link to the single copy, cutting compile time and object size for heavily used instantiations.\n\nIt also lets template definitions live in a `.cpp` (hidden implementation) when the set of supported types is known, e.g. a numeric library supporting `float` and `double` only. The standard library uses it for common cases like `std::basic_string<char>`.", "p": "Declaring `extern template` in headers but forgetting the explicit instantiation in exactly one `.cpp`, causing link errors.", "f": ["What does `extern template` do? => Suppresses implicit instantiation in the current translation unit, relying on an explicit instantiation elsewhere.", "Where does the standard library use explicit instantiation? => For common specializations like `std::string` (`basic_string<char>`) to reduce compile time."]}};
QUESTIONS.forEach(q => { if (DEEP[q.num]) q.deep = DEEP[q.num]; });
function deepInline(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
}
function deepParas(s){ return String(s).split(/\n\s*\n/).map(p => '<p>' + deepInline(p.replace(/\n/g,' ')) + '</p>').join(''); }
function renderDeepTop(q){
  return q.deep ? `<div class="deep-def"><span class="deep-lbl">DEFINITION</span>${deepInline(q.deep.d)}</div>` : '';
}
function renderDeepBottom(q){
  if (!q.deep) return '';
  const f = q.deep.f.map(x => { const [a, b] = x.split('=>'); return `<details><summary>${deepInline(a.trim())}</summary><div class="fa">${deepInline(b.trim())}</div></details>`; }).join('');
  return `<div class="deep-x"><span class="deep-lbl">DEEP DIVE</span>${deepParas(q.deep.x)}</div>` +
         `<div class="deep-pit"><span class="deep-lbl">COMMON PITFALL</span>${deepInline(q.deep.p)}</div>` +
         `<div class="deep-f"><span class="deep-lbl">LIKELY FOLLOW-UPS</span>${f}</div>`;
}
</script>
<script>
const SECTIONS = {};
QUESTIONS.forEach(q => { SECTIONS[q.section] = q.sectionTitle; });
const SECTION_ORDER = Object.keys(SECTIONS).map(Number).sort((a,b)=>a-b);

let activeLevels = new Set(['Easy','Moderate','Difficult']);
let searchQuery = '';
let currentQ = null;

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Render simple markdown-ish answer text: **bold**, `code`, backtick-fenced blocks already stripped (code shown separately)
function renderAnswer(text){
  let html = esc(text);
  html = html.replace(/```cpp\n([\s\S]*?)```/g, (m, code) => {
    return `<div class="code-wrap"><span class="code-label">C++</span><pre><code class="language-cpp">${code}</code></pre></div>`;
  });
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return html;
}

function matchesFilters(q){
  if (!activeLevels.has(q.level)) return false;
  if (searchQuery) {
    const hay = (q.question + ' ' + q.answer).toLowerCase();
    if (!hay.includes(searchQuery.toLowerCase())) return false;
  }
  return true;
}

function buildLevelFilters(){
  const container = document.getElementById('levelFilters');
  ['Easy','Moderate','Difficult'].forEach(lvl=>{
    const chip = document.createElement('span');
    chip.className = 'filter-chip active';
    chip.textContent = lvl;
    chip.onclick = () => {
      if (activeLevels.has(lvl)) { activeLevels.delete(lvl); chip.classList.remove('active'); }
      else { activeLevels.add(lvl); chip.classList.add('active'); }
      buildSidebar();
    };
    container.appendChild(chip);
  });
}

function buildSidebar(){
  const container = document.getElementById('navGroups');
  container.innerHTML = '';
  let visibleCount = 0;
  SECTION_ORDER.forEach(secNum=>{
    const items = QUESTIONS.filter(q=>q.section===secNum && matchesFilters(q));
    if (items.length === 0) return;
    visibleCount += items.length;
    const group = document.createElement('div');
    const label = document.createElement('div');
    label.className = 'nav-group-label';
    label.textContent = `${secNum}. ${SECTIONS[secNum]} (${items.length})`;
    group.appendChild(label);
    items.forEach(q=>{
      const el = document.createElement('div');
      el.className = 'nav-item';
      el.id = 'nav-' + q.num;
      el.innerHTML = `<span class="qnum">Q${q.num}</span><span>${esc(q.question.slice(0,60))}${q.question.length>60?'…':''}</span>`;
      el.onclick = () => navigate(q.num);
      group.appendChild(el);
    });
    container.appendChild(group);
  });
  document.getElementById('statTotal').textContent = visibleCount;
}

function renderHome(){
  const totalWithCode = QUESTIONS.filter(q=>q.code).length;
  let html = `
    <div class="home-hero">
      <h2>500 C++ Interview Questions</h2>
      <p>Search, filter by difficulty, or browse by topic. ${totalWithCode} of 500 questions include a working C++ code example. Click any question in the sidebar, or a section below, to dive in.</p>
      <div class="home-stats">
        <div class="stat-box"><div class="n">500</div><div class="l">Total questions</div></div>
        <div class="stat-box"><div class="n">${totalWithCode}</div><div class="l">With C++ code</div></div>
        <div class="stat-box"><div class="n">${SECTION_ORDER.length}</div><div class="l">Topic sections</div></div>
      </div>
    </div>
    <div class="section-list">`;
  SECTION_ORDER.forEach(s=>{
    const count = QUESTIONS.filter(q=>q.section===s).length;
    const firstQ = QUESTIONS.find(q=>q.section===s);
    html += `<div class="section-card" onclick="navigate(${firstQ.num})">
      <div class="sc-title">${s}. ${esc(SECTIONS[s])}</div>
      <div class="sc-count">${count} questions</div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function getFilteredList(){
  return QUESTIONS.filter(matchesFilters);
}

function renderQuestion(q){
  const list = getFilteredList();
  const idx = list.findIndex(x=>x.num===q.num);
  const prev = idx > 0 ? list[idx-1] : null;
  const next = idx < list.length-1 ? list[idx+1] : null;

  let codeHtml = '';
  if (q.code && !q.answer.includes('```cpp')) {
    codeHtml = `<div class="code-wrap"><span class="code-label">C++</span><pre><code class="language-cpp">${esc(q.code)}</code></pre></div>`;
  }

  return `
    <div class="qcard">
      <div class="q-meta">
        <span class="level-badge ${q.level}">${q.level.toUpperCase()}</span>
        <span class="q-num">Q${q.num} · Section ${q.section}: ${esc(q.sectionTitle)}</span>
      </div>
      <h2 class="q-title">${esc(q.question)}</h2>
      ${renderDeepTop(q)}
      <div class="q-answer">${renderAnswer(q.answer)}</div>
      ${codeHtml}
      ${renderDeepBottom(q)}
      <div class="footer-nav">
        <button onclick="${prev?`navigate(${prev.num})`:''}" ${!prev?'disabled':''}>
          <span class="dir">← PREV</span>${prev?('Q'+prev.num):''}
        </button>
        <button onclick="${next?`navigate(${next.num})`:''}" ${!next?'disabled':''}>
          <span class="dir" style="text-align:right">NEXT →</span>${next?('Q'+next.num):''}
        </button>
      </div>
    </div>
  `;
}

function navigate(num){
  const content = document.getElementById('content');
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  document.getElementById('navArrows').style.display = num ? 'flex' : 'none';

  if (!num) {
    currentQ = null;
    content.innerHTML = renderHome();
    document.getElementById('crumbCurrent').textContent = 'Overview';
    window.location.hash = '';
  } else {
    const q = QUESTIONS.find(x=>x.num===Number(num));
    if (!q) return;
    currentQ = q;
    content.innerHTML = renderQuestion(q);
    const navEl = document.getElementById('nav-'+q.num);
    if (navEl) navEl.classList.add('active');
    document.getElementById('crumbCurrent').textContent = `Q${q.num}`;
    window.location.hash = q.num;
    hljs.highlightAll();
    updateArrows(q);
  }
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo(0,0);
}

function updateArrows(q){
  const list = getFilteredList();
  const idx = list.findIndex(x=>x.num===q.num);
  document.getElementById('prevBtn').disabled = idx <= 0;
  document.getElementById('nextBtn').disabled = idx >= list.length-1;
  document.getElementById('prevBtn').onclick = () => idx>0 && navigate(list[idx-1].num);
  document.getElementById('nextBtn').onclick = () => idx<list.length-1 && navigate(list[idx+1].num);
}

document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchQuery = e.target.value;
  buildSidebar();
});

window.addEventListener('hashchange', ()=>{
  const num = window.location.hash.replace('#','');
  navigate(num || null);
});

buildLevelFilters();
buildSidebar();
navigate(window.location.hash.replace('#','') || null);

</script>
</body>
</html>
