 break `Widget w;`? => Declaring any constructor suppresses the implicit default constructor.", "What's the difference between `T t;` and `T t{};`? => The first default-initializes (built-ins may be garbage); the second value-initializes (built-ins zeroed if no user-provided default constructor)."]}, "69": {"d": "A parameterized constructor takes arguments used to initialize the object's state at creation.", "x": "Parameterized constructors let objects start in a valid, fully specified state (`File f(\"log.txt\", Mode::Append);`) instead of being configured afterwards.\n\nGood practice: mark single-argument constructors `explicit` to prevent implicit conversions; validate arguments and throw on invalid input; take \"sink\" arguments (strings, vectors) by value and `std::move` them into members.\n\nBrace initialization (`Point p{1, 2};`) calls the constructor and forbids narrowing; beware that a constructor taking `std::initializer_list` is preferred by brace syntax.", "p": "Declaring a one-argument constructor without `explicit`, allowing `Buffer b = 4096;` or passing an `int` where a `Buffer` is expected.", "f": ["Why take a `std::string` parameter by value in a constructor? => The caller's temporary can be moved in, and lvalues are copied once, then moved into the member.", "How does `std::initializer_list` affect brace initialization? => `T{a, b}` prefers an initializer_list constructor if one is viable, e.g. `std::vector<int>{3, 0}` gives two elements, not three zeros."]}, "70": {"d": "Yes: a class can have several overloaded constructors with different parameter lists, and the compiler picks one by overload resolution.", "x": "Typical set: default constructor, parameterized constructors, copy and move constructors, and perhaps a constructor taking `std::initializer_list`.\n\nAvoid duplicating logic across constructors: use **delegating constructors** (C++11) to route all overloads through one \"master\" constructor, or default member initializers for common defaults.\n\nToo many overloads make calls ambiguous and hard to read; for objects with many optional settings, consider a builder, an options struct with designated initializers (C++20), or named factory functions (`Duration::fromMs(5)`).", "p": "Overloads like `Widget(int, double)` and `Widget(double, int)` that are easy to call with arguments swapped; use distinct types or named factories.", "f": ["How do you share code between constructors? => Delegating constructors or default member initializers.", "When are named factory functions better than overloaded constructors? => When arguments have the same types but different meanings, e.g. `fromSeconds` vs `fromMilliseconds`."]}, "71": {"d": "A copy constructor `T(const T&)` initializes a new object as a copy of an existing object of the same type.", "x": "It's used for copy-initialization (`T b = a;`, `T b(a);`), passing and returning by value (unless elided), and when containers copy elements.\n\nThe implicit one copies each member. That's correct for members that manage themselves (`std::string`, `std::vector`, `std::unique_ptr` makes the class non-copyable) but wrong for raw owning pointers, where it produces two owners of one buffer.\n\nDeclaring a copy constructor suppresses the implicit default constructor and the implicit move operations, so a class with a custom copy constructor falls back to copying when moved.", "p": "Taking the parameter by value, `T(T other)`: that would require copying to call the copy constructor, infinite recursion, so it's ill-formed.", "f": ["Why must the copy constructor's parameter be a reference? => Passing by value would itself require a copy, recursively.", "What happens to move operations when you declare a copy constructor? => They're not implicitly declared, so rvalues are copied instead."]}, "72": {"d": "The copy constructor creates a **new** object from an existing one; copy assignment (`operator=`) replaces the state of an **already existing** object.", "x": "`T b = a;` calls the copy constructor (initialization); `b = a;` on an existing `b` calls copy assignment.\n\nAssignment must handle what construction doesn't: releasing the old state, self-assignment (`a = a`), and exception safety. The **copy-and-swap** idiom (`T& operator=(T other) { swap(*this, other); return *this; }`) handles all three and also works as move assignment.\n\nAssignment should return `T&` (so chaining `a = b = c` works) and is typically not virtual.", "p": "Writing copy assignment that deletes the old buffer before copying: `a = a` then reads freed memory. Copy first or use copy-and-swap.", "f": ["Which one runs for `T b = a;`? => The copy constructor; the `=` in a declaration is initialization, not assignment.", "Why does copy-and-swap give strong exception safety? => The copy happens before `*this` is modified; if it throws, `*this` is unchanged."]}, "73": {"d": "The Rule of Three says that if a class needs a user-defined destructor, copy constructor or copy assignment operator, it almost certainly needs all three.", "x": "The reason: needing a custom destructor usually means the class owns a raw resource (memory, file handle). The implicit copy operations would then copy the handle, leading to double release or leaks.\n\nChoices: implement all three (deep copy or reference counting), or **delete** the copy operations to make the class non-copyable (`T(const T&) = delete;`). In modern C++ the better answer is usually the Rule of Zero: wrap the resource in a member that already manages it.", "p": "Adding a destructor that frees a raw pointer but forgetting copy operations: the first copy leads to a double free.", "f": ["What's the modern replacement for the Rule of Three? => Rule of Five if you manage resources manually, or ideally the Rule of Zero.", "When would you delete copy operations? => For unique resources like mutexes, file handles or hardware handles that can't be meaningfully duplicated."]}, "74": {"d": "The Rule of Five extends the Rule of Three for C++11: a class that manages a resource should consider all five special members: destructor, copy constructor, copy assignment, move constructor and move assignment.", "x": "Declaring a destructor or copy operation suppresses the implicit move operations, so such a class silently copies where it could move. Adding move operations (usually `noexcept`) restores efficient transfers, e.g. when a `std::vector` of these objects reallocates.\n\nMove operations should leave the source in a valid but unspecified state (typically empty), and be `noexcept` so containers use them (`std::move_if_noexcept`).\n\nIf you define none of the five and rely on members, you're following the Rule of Zero, which is preferred.", "p": "Defining move operations without `noexcept`: `std::vector` then copies elements during reallocation to keep its strong exception guarantee.", "f": ["Why should move constructors be `noexcept`? => Containers only move elements during reallocation if moving can't throw; otherwise they copy.", "What state is a moved-from object in? => Valid but unspecified: you can destroy it or assign to it, but shouldn't rely on its value."]}, "75": {"d": "The Rule of Zero says classes should not define any of the five special member functions; instead they should hold resources in members (smart pointers, containers, RAII wrappers) that already manage copying, moving and destruction.", "x": "Example: a class with `std::vector<std::byte> buffer_` and `std::unique_ptr<Device> dev_` needs no destructor or copy/move code: the compiler-generated ones do the right thing (the class becomes move-only because of the `unique_ptr`).\n\nOnly low-level resource-owning classes (a custom RAII wrapper for a file descriptor or DMA buffer) should implement the Rule of Five; everything else composes them.\n\nThis reduces bugs, boilerplate, and keeps classes exception-safe by construction.", "p": "Writing an empty destructor `~T() {}` \"for completeness\": it suppresses implicit move operations and makes the class copy where it could move. Omit it or write `= default` together with the other special members.", "f": ["How do you make a Rule-of-Zero class non-copyable? => Include a move-only member such as `std::unique_ptr`; the implicit copy operations are then deleted.", "When must you break the Rule of Zero? => In the small RAII wrapper that directly owns a raw resource (e.g. a file descriptor)."]}, "76": {"d": "A member initializer list (`: a_(x), b_(y)`) initializes members and bases directly before the constructor body runs, instead of default-constructing them and assigning later.", "x": "Some members **must** be initialized there: `const` members, references, members without default constructors, and base classes needing arguments.\n\nFor class-type members, initializing in the list avoids a default construction followed by assignment, which matters for expensive types. For built-ins it's the only way to avoid a window where they're uninitialized.\n\nMembers are initialized in their **declaration order**, not the order of the list; compilers warn (`-Wreorder`) when the list order differs.", "p": "Initializing one member from another that is declared later: e.g. `size_(data_.size())` when `size_` is declared before `data_` reads an uninitialized member.", "f": ["Which members must be initialized in the initializer list? => References, `const` members, members without default constructors, and bases needing arguments.", "What decides initialization order? => Declaration order in the class, never the order written in the initializer list."]}, "77": {"d": "An `explicit` constructor cannot be used for implicit conversions or copy-initialization; it must be called explicitly.", "x": "Without `explicit`, `void send(Packet p)` accepts `send(64)` if `Packet(int size)` exists, silently constructing a packet. With `explicit`, that's a compile error and callers must write `send(Packet{64})`.\n\nC++ Core Guidelines: make single-argument constructors `explicit` by default (except for genuine conversions like `std::string` from `const char*`). Since C++11, `explicit` also applies to multi-argument constructors (blocks `T t = {a, b};`) and to conversion operators (`explicit operator bool()` allows `if (obj)` but not `int x = obj;`). C++20 adds conditional `explicit(bool)` for wrapper templates.", "p": "Leaving a size-taking constructor implicit so that `Buffer b = 0;` or passing `0` to a `Buffer` parameter compiles unexpectedly.", "f": ["Why is `explicit operator bool()` still usable in `if (p)`? => Contextual conversion to bool (in conditions) is allowed even for explicit operators.", "What is `explicit(bool)`? => C++20 conditional explicit, used by wrappers like `std::pair` to be explicit only when the underlying conversion is."]}, "78": {"d": "A delegating constructor calls another constructor of the same class in its member initializer list, reusing its initialization logic.", "x": "Example: `Connection() : Connection(\"localhost\", 5432) {}`. The target constructor runs completely first, then the delegating constructor's body.\n\nRules: a delegating constructor's initializer list may contain only the delegation (no other member initializers), and delegation cycles are undefined behaviour (compilers often diagnose them).\n\nOnce any constructor completes (including the target), the object is considered constructed, so if the delegating body then throws, the destructor **does** run.", "p": "Creating a delegation cycle (A delegates to B, B to A), which is undefined behaviour and usually a stack overflow at runtime.", "f": ["Can a delegating constructor also initialize members? => No; its initializer list may only contain the delegated constructor call.", "If the delegating constructor's body throws, does the destructor run? => Yes, because the target constructor already completed."]}, "79": {"d": "Construction goes from the base outward: virtual bases, then direct bases in declaration order, then members in declaration order, then the constructor body. Destruction runs in exactly the reverse order.", "x": "For `class D : public B { M m; };`: `B()` runs, then `m` is constructed, then `D`'s body. Destruction: `D`'s destructor body, then `~M()`, then `~B()`.\n\nThis ordering guarantees that during a class's constructor body, its bases and members are ready, and during its destructor body they still exist. It also explains why virtual calls in constructors don't reach derived overrides: the derived part isn't constructed yet.", "p": "Assuming the order in the constructor's initializer list changes construction order; it doesn't, and compilers warn about the mismatch.", "f": ["In what order are multiple bases constructed? => Virtual bases first, then non-virtual bases in the order they're listed in the class definition.", "Why are destructors called in reverse order? => Later objects may depend on earlier ones, so they must be destroyed first."]}, "80": {"d": "If a constructor throws, the object is never considered constructed: its destructor does not run, but already-constructed members and bases are destroyed in reverse order, and memory from `new` is freed.", "x": "This is safe **if** resources are held by members with their own destructors (RAII). It leaks if the constructor acquired a raw resource in its body and then threw before storing it in a managing member.\n\nExample: `buf_ = new char[n]; dev_ = openDevice();` in the body leaks `buf_` if `openDevice` throws, because `~T()` won't run. Holding `buf_` in a `std::unique_ptr<char[]>` fixes it.\n\nThrowing is the idiomatic way to report constructor failure; the alternative (a `valid()` flag or two-phase init) pushes error checking onto every caller.", "p": "Allocating several raw resources in the constructor body without RAII members: if a later allocation throws, earlier ones leak because the destructor never runs.", "f": ["Is the destructor called when the constructor throws? => No, but fully constructed members and bases are destroyed.", "How do you report constructor failure without exceptions (e.g. `-fno-exceptions` firmware)? => A private constructor plus a static factory returning `std::optional<T>` or `std::expected<T, Error>`."]}, "81": {"d": "A destructor can technically throw only if declared `noexcept(false)`, but it should not: destructors are implicitly `noexcept`, so a throw calls `std::terminate`, and throwing during stack unwinding would terminate anyway.", "x": "During exception handling, destructors of local objects run; if one of them throws while another exception is active, the program terminates. Standard containers and algorithms also assume destructors don't throw.\n\nHandle failures inside the destructor (log them, swallow them) and offer an explicit `close()` / `flush()` member that can throw, so callers who care about errors can check them before destruction. `std::fstream` follows this pattern.", "p": "Letting a flush or close error propagate out of a destructor, which terminates the program as soon as it happens during unwinding.", "f": ["What happens if a destructor throws during stack unwinding? => `std::terminate` is called.", "How do you report cleanup errors then? => Provide an explicit `close()` that can throw or return an error, and make the destructor a best-effort fallback."]}, "82": {"d": "Making the copy constructor private (the pre-C++11 idiom) prevents copying from outside the class, making the type non-copyable.", "x": "Classes that own unique resources (mutexes, file handles, hardware connections, singletons) shouldn't be copied. Before C++11 you declared the copy constructor and copy assignment private and left them undefined (or inherited from `boost::noncopyable`).\n\nModern C++ uses `= delete`: `T(const T&) = delete; T& operator=(const T&) = delete;`. Deleted functions give clear compile errors at the call site, even for friends and members, whereas private undefined functions only failed at link time inside the class.", "p": "Using the old private-and-undefined idiom in new code; `= delete` gives better errors and states intent.", "f": ["Why is `= delete` better than a private copy constructor? => It errors at compile time everywhere (including members and friends) with a clear message.", "Can a non-copyable type still be movable? => Yes, e.g. `std::unique_ptr` and `std::thread`: copy deleted, move defined."]}, "83": {"d": "`= default` asks the compiler to generate the default implementation of a special member function; `= delete` makes a function unusable, so any call is a compile error.", "x": "`= default` is useful to bring back an implicitly suppressed function (a default constructor after adding others), to make a destructor virtual without writing a body (`virtual ~Base() = default;`), or to keep a type trivial (a defaulted function on first declaration can keep triviality; an empty user body `{}` makes it non-trivial).\n\n`= delete` works on any function, not only special members: delete copy operations for unique resources, or delete overloads to block unwanted conversions (`void setSpeed(double) = delete;` next to `void setSpeed(int)`).", "p": "Writing `~T() {}` instead of `~T() = default;`: the user-provided destructor makes the type non-trivially destructible and suppresses implicit moves.", "f": ["Can you delete a non-special function? => Yes; deleting overloads prevents calls with unwanted argument types.", "Does `= default` on the first declaration keep a type trivial? => Yes, if the defaulted function would be trivial; a user-written empty body does not."]}, "84": {"d": "Copy elision is the omission of a copy or move when initializing an object from a temporary or returning a local; since C++17 it is **guaranteed** for prvalues and **optional** (NRVO) for named locals.", "x": "Guaranteed (C++17): `T t = T(args);`, `return T(args);`, and passing a prvalue to a by-value parameter construct the object directly in its final place. No copy or move constructor is even required to exist.\n\nOptional: named return value optimization (`T r; ...; return r;`) and some cases with exceptions. When NRVO doesn't happen, returning a local still uses the move constructor automatically.\n\nConsequence: side effects in copy/move constructors (like logging) may not happen, so constructors must not rely on being called for correctness.", "p": "Writing `return std::move(local);` to \"help\": it prevents NRVO and forces a move.", "f": ["Can a non-movable type be returned by value? => Yes, since C++17, if the return expression is a prvalue (guaranteed elision).", "Why should copy constructors not have required side effects? => Elision may skip them entirely."]}, "85": {"d": "Inside a base constructor the object is still of the base type (the derived part doesn't exist yet), so virtual calls dispatch to the base class's version, not the derived override.", "x": "The vptr is set to the vtable of the class whose constructor is running. This protects against derived overrides reading derived members that aren't initialized yet. The same logic applies in reverse during destruction.\n\nCalling a pure virtual function this way is undefined behaviour (usually an abort). If derived-specific setup is needed, pass data to the base constructor, use a factory that calls an `init()` after construction, or use CRTP where the type is known statically.", "p": "Base constructors calling virtual `configure()` expecting per-device overrides; the base version always runs.", "f": ["What does `typeid(*this)` report inside a base constructor? => The base type, consistent with virtual dispatch at that point.", "Is calling a virtual function in a constructor illegal? => No, it's legal and dispatches to the current class; only pure virtual calls are undefined."]}, "86": {"d": "A converting constructor is any non-`explicit` constructor callable with a single argument; it lets the compiler implicitly convert that argument type into the class type.", "x": "Useful for natural conversions (`std::string s = \"text\";`), dangerous otherwise: with `Timeout(int ms)` non-explicit, a function `wait(Timeout)` accepts `wait(true)` or `wait('A')` because those promote to `int`.\n\nImplicit conversions also participate in overload resolution and operator matching, producing surprising overload choices or ambiguities.\n\nRule: mark single-argument constructors `explicit` unless the conversion is lossless and obviously intended.", "p": "`class Buffer { public: Buffer(std::size_t size); };` lets `buffer = 0;` compile as \"assign a zero-sized buffer\".", "f": ["Do constructors with default arguments count as converting? => Yes, if they can be called with one argument.", "How many user-defined conversions can apply implicitly in one conversion sequence? => At most one."]}, "87": {"d": "Members are always initialized in the order they are declared in the class, regardless of the order in the initializer list; bases are initialized before members.", "x": "The initializer list only supplies values; declaration order controls sequencing, so destruction can run in the exact reverse. Writing the list in a different order is legal but misleading, and `-Wreorder` (part of `-Wall`) warns about it.\n\nThe bug appears when one member's initializer uses another member declared **after** it, reading an uninitialized value. Keep the list in declaration order and avoid cross-member dependencies, or compute from constructor parameters instead.", "p": "`class Buf { std::size_t cap_; std::vector<char> data_; public: Buf(std::size_t n) : data_(n), cap_(data_.size()) {} };` reads `data_` before it's constructed, because `cap_` is declared (and so initialized) first.", "f": ["Why does C++ use declaration order? => Destruction must be the reverse of construction for every constructor, so the order must be fixed per class.", "Which warning catches mismatched initializer order? => `-Wreorder`, enabled by `-Wall` in GCC and Clang."]}, "88": {"d": "Without a user-defined destructor, memory allocated with `new` into a raw pointer member is never freed: the implicit destructor destroys the pointer, not the object it points to, so it leaks.", "x": "The pointer is a plain value; destroying it does nothing to the pointee. Add a destructor that deletes it, and then (Rule of Three/Five) also handle copy and move, or better, replace the raw pointer with `std::unique_ptr` so the implicit destructor does the right thing.\n\nTools: AddressSanitizer's leak checker (`-fsanitize=address`), Valgrind, or Visual Studio's CRT debug heap report these leaks.", "p": "Fixing the leak by adding only a destructor: copies then double-free. Use `std::unique_ptr` (Rule of Zero) instead.", "f": ["Why doesn't the implicit destructor free the memory? => It destroys each member; destroying a raw pointer is trivial and doesn't touch the pointee.", "How do you detect such leaks? => AddressSanitizer / LeakSanitizer, Valgrind, or heap debugging tools."]}, "89": {"d": "Yes: private constructors prevent code outside the class from creating objects directly, used by Singleton, named constructors / factory functions, and classes created only by friends.", "x": "Patterns relying on private constructors:\n\n- **Singleton**: only `instance()` creates the object.\n- **Factory / named constructor**: `static std::optional<Port> open(std::string_view name)` validates and returns nothing on failure, without exceptions.\n- **Passkey idiom**: a public constructor taking a private `Key` type, so only friends can call it but `std::make_unique` still works.\n- Static-only utility classes (though namespaces are usually better).\n\nNote that `std::make_unique`/`make_shared` can't call private constructors; use the passkey idiom or `std::unique_ptr<T>(new T(...))` inside the class.", "p": "Making the constructor private and then trying `std::make_shared<T>()` in a factory: it fails because `make_shared` isn't a friend.", "f": ["What is the passkey idiom? => A public constructor that requires an argument of a private nested type, so only authorized code can construct while `make_unique` still works.", "When is a factory with a private constructor better than throwing? => When failure is expected and exceptions are disabled or too costly, e.g. firmware returning `std::optional`."]}, "90": {"d": "Placement new (`new (ptr) T(args)`) constructs an object in memory you already own, without allocating; you must later call the destructor explicitly (`p->~T()`) and release the memory yourself.", "x": "Uses: memory pools and arenas, containers (`std::vector` constructs elements in raw capacity), embedded systems with static buffers, and objects at fixed addresses (shared memory, DMA regions).\n\nRequirements: the storage must be large enough and suitably aligned (`alignas(T) std::byte buf[sizeof(T)];`). C++17's `std::launder` is sometimes needed when reusing storage for a new object with const or reference members. C++20 adds `std::construct_at` and `std::destroy_at` as safer wrappers.", "p": "Placing an object in a `char buffer[sizeof(T)]` without `alignas(T)`: misaligned objects are undefined behaviour and can fault on some architectures.", "f": ["How do you destroy a placement-new object? => Call the destructor explicitly (`p->~T()` or `std::destroy_at(p)`) and then release the storage separately.", "What does `std::construct_at` add? => A constexpr-friendly, type-safe wrapper for placement new (C++20)."]}, "91": {"d": "Inheritance lets a class (derived) reuse and extend another class (base): it acquires the base's members and can be used where the base is expected (with public inheritance).", "x": "Public inheritance models is-a and enables substitutability; the derived object contains a base subobject, so a `Derived*` converts implicitly to `Base*`.\n\nWhat is not inherited: constructors (unless brought in with `using Base::Base;`), destructors, assignment operators (hidden by the derived ones), and friendships.\n\nUse inheritance for polymorphic interfaces and genuine specialization; use composition for code reuse. Deep hierarchies become fragile; most well-designed C++ codebases keep them to one or two levels.", "p": "Using inheritance mainly to reuse helper functions from a base class, coupling unrelated classes to its implementation.", "f": ["Are constructors inherited? => Not by default; C++11 `using Base::Base;` inherits them.", "What is converted implicitly with public inheritance? => `Derived*` to `Base*` and `Derived&` to `Base&` (upcasts)."]}, "92": {"d": "C++ supports single, multiple, multilevel, hierarchical and hybrid inheritance, each combinable with public, protected or private access and optionally virtual.", "x": "- **Single**: one base.\n- **Multiple**: several bases (`class D : public A, public B`).\n- **Multilevel**: a chain (A <- B <- C).\n- **Hierarchical**: many classes derived from one base.\n- **Hybrid**: combinations, often producing a diamond, handled with virtual inheritance.\n\nOrthogonal choices: access (public for is-a, private or protected for implemented-in-terms-of) and virtual inheritance for shared bases.", "p": "Treating these categories as separate language features; they're just shapes of the same mechanism, and the interview value is in knowing their consequences (ambiguity, diamonds, layout).", "f": ["Which inheritance shapes can create a diamond? => Multiple (hybrid) inheritance where two bases share a common base.", "What does private inheritance model? => \"Implemented in terms of\", not is-a."]}, "93": {"d": "Polymorphism is the ability of one interface to work with objects of different types, each providing its own behaviour.", "x": "C++ offers several kinds:\n\n- **Subtype (runtime) polymorphism**: virtual functions called through base pointers or references.\n- **Parametric (compile-time) polymorphism**: templates and concepts.\n- **Ad-hoc polymorphism**: function and operator overloading.\n- **Coercion**: implicit conversions.\n\nRuntime polymorphism supports open sets of types chosen at runtime; compile-time polymorphism gives zero-overhead code for types known at compile time. `std::variant` + `std::visit` offers a third option for closed sets of types without inheritance.", "p": "Assuming polymorphism in C++ always means virtual functions; templates and overloading are equally central, and often cheaper.", "f": ["When would you choose `std::variant` over virtual functions? => For a closed, known set of types where you want value semantics and no heap allocation.", "What is ad-hoc polymorphism? => Overloading: the same name selects different implementations based on argument types."]}, "94": {"d": "Compile-time polymorphism resolves which code to run during compilation (overloads, templates, CRTP); runtime polymorphism resolves it during execution based on the object's dynamic type (virtual functions).", "x": "Trade-offs:\n\n- Compile-time: no dispatch overhead, inlinable, type errors at compile time; but code bloat from instantiations, longer builds, and types must be known when compiling.\n- Runtime: types can be chosen at runtime (plugins, configuration), one compiled copy of the code, stable binary interfaces; costs an indirect call, a vptr per object, and usually heap allocation.\n\nMany systems combine them: a runtime interface at module boundaries, templates inside hot loops.", "p": "Replacing every virtual interface with templates for speed without measuring: build times and binary size grow, and runtime flexibility is lost.", "f": ["Which is faster? => Usually compile-time, because calls can be inlined; but the difference only matters in hot paths.", "How can you get runtime polymorphism without inheritance? => Type erasure (`std::function`, `std::any`, custom erased wrappers) or `std::variant`."]}, "95": {"d": "`protected` members are accessible to the class itself, its friends, and derived classes (through objects of the derived type), but not to other code.", "x": "A subtle rule: a derived class can access protected members only through objects of its own type (or further derived), not through an arbitrary `Base&`. So `void Derived::f(Base& b) { b.prot_; }` is an error.\n\nProtected member **functions** are useful as customization hooks for derived classes (as in the Template Method / NVI pattern). Protected **data** is usually a mistake, because every derived class can break the base's invariants and the base can never change its representation.", "p": "Exposing internal state as protected data \"so subclasses can use it\", making the base impossible to refactor.", "f": ["Can a derived class access a protected member of another `Base` object? => Only through objects of the derived class type, not through a plain `Base` reference.", "When are protected functions a good idea? => As hooks that derived classes override or call, with the base controlling the overall algorithm."]}, "96": {"d": "The inheritance access specifier caps inherited members' access: public inheritance keeps base access levels; protected inheritance turns public members protected; private inheritance turns public and protected members private.", "x": "Summary for a base's public member: public inheritance leaves it public; protected makes it protected; private makes it private in the derived class. Base private members are never accessible to the derived class regardless.\n\nConversions follow the same rule: only with public inheritance can arbitrary code convert `Derived*` to `Base*`.\n\nA `using Base::member;` declaration in the derived class can restore a specific member's access level.", "p": "Assuming private inheritance hides base members from the derived class itself; it hides them from users of the derived class, while the derived class can still use them.", "f": ["Can outside code convert `Derived*` to `Base*` with private inheritance? => No; the base is inaccessible outside the derived class.", "How can you re-expose one base function under private inheritance? => `public: using Base::function;` inside the derived class."]}, "97": {"d": "Function hiding happens when a derived class declares a member with the same name as a base member: all base overloads of that name become invisible through the derived class, even if their signatures differ.", "x": "Name lookup stops at the first scope where the name is found. If `Derived` declares `f(double)`, then `derived.f(1)` finds only `Derived::f(double)` and never considers `Base::f(int)`.\n\nAvoid it by adding `using Base::f;` in the derived class to bring all overloads into scope, and by using `override` for intended overrides so accidental signature mismatches are compile errors. Compilers warn with `-Woverloaded-virtual`.", "p": "Overriding only one overload of a virtual function set, unintentionally hiding the others from users of the derived class.", "f": ["Why does hiding happen instead of overloading across scopes? => Lookup stops in the innermost scope containing the name, before overload resolution.", "Which warning flag helps? => `-Woverloaded-virtual` in GCC and Clang."]}, "98": {"d": "RTTI (Run-Time Type Information) is the runtime type data the compiler stores for polymorphic classes, enabling `dynamic_cast` and `typeid`.", "x": "For classes with virtual functions, the vtable points to a `type_info` object describing the dynamic type and its bases. `dynamic_cast` walks this information to check downcasts and cross-casts; `typeid(expr)` returns the `std::type_info` of the dynamic type.\n\nRTTI costs binary size (type names and hierarchy data), and some embedded and game codebases disable it (`-fno-rtti`), which also disables `dynamic_cast` on polymorphic types and `typeid` of polymorphic objects.\n\nFrequent `dynamic_cast` in application code often signals a design issue: prefer virtual functions or visitors.", "p": "Relying on `typeid(x).name()` for stable identifiers: its output is implementation-specific (mangled on GCC/Clang), not portable.", "f": ["What stops working with `-fno-rtti`? => `dynamic_cast` on polymorphic types and `typeid` on polymorphic objects; exceptions still work on most toolchains.", "How can you compare types without RTTI? => Your own type IDs (enums or static addresses) exposed through a virtual function."]}, "99": {"d": "`typeid` returns a `const std::type_info&` describing an expression's type: the dynamic type for a polymorphic object accessed through a reference or dereferenced pointer, otherwise the static type.", "x": "Uses: comparing types (`typeid(a) == typeid(b)`), keying maps by type via `std::type_index`, debugging and logging (`name()`).\n\nDetails: `typeid(*p)` with a null `p` to a polymorphic type throws `std::bad_typeid`; top-level const and references are ignored (`typeid(const int&) == typeid(int)`); for non-polymorphic types the result is computed at compile time.\n\n`name()` returns an implementation-defined string, often mangled (use `abi::__cxa_demangle` on GCC/Clang for readable names).", "p": "Writing `typeid(p)` instead of `typeid(*p)` for a base pointer: it reports the pointer's static type (`Base*`), not the object's dynamic type.", "f": ["How do you use a type as a map key? => `std::unordered_map<std::type_index, Handler>` using `std::type_index(typeid(T))`.", "What happens with `typeid(*p)` if `p` is null? => For polymorphic types it throws `std::bad_typeid`."]}, "100": {"d": "For downcasting, `static_cast` trusts you and performs no runtime check (wrong type is undefined behaviour), while `dynamic_cast` checks the object's dynamic type at runtime and returns `nullptr` (pointers) or throws `std::bad_cast` (references) on mismatch.", "x": "Use `static_cast` only when the type is guaranteed by design (e.g. CRTP, or a tag already checked); it's free at runtime. Use `dynamic_cast` when the type genuinely varies; it costs a hierarchy walk (string comparisons of type names in some implementations across shared libraries).\n\n`dynamic_cast` also supports cross-casts (between sibling bases in multiple inheritance) and casts from virtual bases, which `static_cast` can't do.\n\nIf many downcasts appear, consider moving the behaviour into a virtual function or a visitor.", "p": "Using `static_cast<Derived*>(base)` on objects that might be a different derived type; it compiles, returns a wrong pointer, and later code corrupts memory.", "f": ["What does `dynamic_cast` require? => A polymorphic source type (at least one virtual function) and RTTI enabled.", "Can `dynamic_cast` cast sideways? => Yes, cross-casts between sibling bases of the same object work."]}, "101": {"d": "Yes: compile-time techniques (function overloading, templates, CRTP, concepts), `std::variant` with `std::visit`, type erasure and function pointers all provide polymorphic behaviour without virtual functions.", "x": "Options:\n\n- **Templates/concepts**: `template<Shape S> double area(const S&)` works for any type meeting the requirements.\n- **CRTP**: static dispatch through a base template.\n- **`std::variant` + `std::visit`**: closed set of alternatives, value semantics.\n- **Type erasure**: `std::function`, `std::any`, or hand-written wrappers that hide the type behind a uniform interface (internally often using function pointers).\n- **Function pointer tables**: common in C-style firmware drivers (`struct ops { int (*read)(...); }`), the manual equivalent of a vtable.", "p": "Claiming C++ needs `virtual` for polymorphism; interviewers look for knowledge of static and value-based alternatives.", "f": ["What is type erasure? => Hiding concrete types behind a uniform interface without inheritance in the user code, as `std::function` does for callables.", "How do C drivers implement polymorphism? => Structs of function pointers (ops tables), the same idea as a vtable."]}, "102": {"d": "Multilevel inheritance is a chain of derivation where a class derives from a class that itself derives from another (A -> B -> C).", "x": "Each level adds or specializes behaviour; a `C` object contains a `B` subobject which contains an `A` subobject. Constructors run A, B, C; destructors run C, B, A. Virtual functions can be overridden at any level, and the most-derived override wins.\n\nDeep chains are fragile: changes high in the hierarchy ripple down, and understanding behaviour means reading several classes. Mark leaf classes or overrides `final` to stop further derivation where it isn't intended.", "p": "Building five-level hierarchies (Device -> StorageDevice -> NvmeDevice -> VendorNvme -> ModelX) where most levels add one method; flatter designs with composition are easier to maintain.", "f": ["Which override is called in a multilevel chain? => The most-derived one for the object's dynamic type.", "How do you stop further derivation? => Mark the class `final`."]}, "103": {"d": "Hierarchical inheritance is when multiple derived classes inherit from the same single base class.", "x": "This is the typical shape of runtime polymorphism: an abstract `Shape` with `Circle`, `Square` and `Triangle` derived from it, or a `BlockDevice` interface with NVMe, SATA and simulated implementations.\n\nClient code depends only on the base interface, and new derived classes can be added without changing it (open/closed principle). The base should have a virtual destructor and a small, stable interface.", "p": "Adding type checks (`if (dynamic_cast<Circle*>(s))`) in client code instead of virtual functions, defeating the point of the hierarchy.", "f": ["What does hierarchical inheritance enable? => Treating all derived types uniformly through the base interface.", "How do you add an operation to every class in a stable hierarchy without editing them? => The Visitor pattern, or `std::variant` + `std::visit` for closed sets."]}, "104": {"d": "Hybrid inheritance combines two or more inheritance types (for example hierarchical plus multiple), which often produces a diamond structure.", "x": "Example: `Device` is the base; `NetworkDevice` and `StorageDevice` derive from it; `NasDevice` derives from both. Without virtual inheritance, a `NasDevice` holds two `Device` subobjects and member access is ambiguous.\n\nResolve with virtual inheritance for the shared base, or redesign: make the shared part an interface without data, or use composition (a NAS **has** a network interface and storage).", "p": "Creating diamond hierarchies with data in the shared base and forgetting virtual inheritance, leading to duplicated state that gets out of sync.", "f": ["What problem does hybrid inheritance often create? => The diamond problem: duplicated base subobjects and ambiguous names.", "What's an alternative to virtual inheritance for diamonds? => Keep the shared base data-free (a pure interface) or use composition."]}, "105": {"d": "C++11 inheriting constructors (`using Base::Base;`) make the base class's constructors available in the derived class, so you don't write forwarding constructors.", "x": "Example: `class LoggedFile : public File { public: using File::File; };` lets `LoggedFile(\"a.txt\", Mode::Read)` call the matching `File` constructor. Derived members are then default-initialized (or use their default member initializers).\n\nInherited constructors keep their access level and `explicit`-ness; default, copy and move constructors are not inherited (the implicit ones are generated as usual).\n\nUseful for thin wrappers and strong types; avoid them when the derived class has invariants that its own constructor must establish.", "p": "Inheriting constructors in a derived class that adds members needing specific initialization; those members silently get default values.", "f": ["Are copy and move constructors inherited with `using Base::Base`? => No; the derived class gets its own implicit ones.", "What happens to derived-class members? => They're initialized by their default member initializers or default-initialized."]}, "106": {"d": "`dynamic_cast` (for downcasts) and `typeid` (for dynamic type) rely on RTTI attached to the vtable, which only exists for polymorphic classes, i.e. classes with at least one virtual function.", "x": "For a non-polymorphic class there's no vptr in the object, so at runtime there is no way to find out the dynamic type. Therefore `dynamic_cast<Derived*>(basePtr)` on a non-polymorphic base is a compile error, and `typeid(*p)` returns the static type.\n\nThe usual fix is to give the base a virtual destructor, which you need anyway for polymorphic deletion and which makes the class polymorphic.", "p": "Expecting `typeid(*basePtr)` to report the derived type when `Base` has no virtual functions; it reports `Base`.", "f": ["What's the minimal change to make a class polymorphic? => Declare a virtual function, typically `virtual ~Base() = default;`.", "Does `dynamic_cast` for upcasts need RTTI? => No; upcasts are resolved statically."]}, "107": {"d": "`override` asks the compiler to verify that a function overrides a base virtual function; `final` prevents a virtual function from being overridden further or a class from being derived from.", "x": "`override` turns silent bugs into compile errors: a mismatched signature (missing `const`, different parameter type, base function renamed) would otherwise create a new function that doesn't override anything.\n\n`final` documents design intent and allows devirtualization: calls through a pointer to a `final` class can be direct calls. `override` and `final` are contextual keywords, so they can still be used as identifiers elsewhere.\n\nStyle (Core Guidelines C.128): use exactly one of `virtual`, `override` or `final` on each virtual function declaration.", "p": "Adding `const` to a base virtual function during refactoring; derived classes without `override` stop overriding and nobody notices until runtime.", "f": ["Why write `override` if the function already overrides? => It guarantees it keeps overriding when base signatures change.", "How can `final` improve performance? => The compiler knows no further override exists, so it can devirtualize and inline calls."]}, "108": {"d": "With non-virtual multiple inheritance, a derived object contains each base subobject laid out one after another (typically in declaration order), followed by the derived class's own members; each polymorphic base subobject has its own vptr.", "x": "Consequence: converting a `Derived*` to the second base's pointer adjusts the address by an offset, so `static_cast<B2*>(d)` may not equal `(void*)d`. Virtual calls through the second base use **thunks** that adjust `this` before calling the derived override.\n\nThis is why comparing pointers across bases must use the correctly typed pointers, and why `reinterpret_cast` between base pointers is wrong. Exact layout is ABI-defined (Itanium ABI on Linux, MSVC ABI on Windows).", "p": "Using `reinterpret_cast` (or `void*` round-trips through the wrong type) to convert between base pointers in multiple inheritance, skipping the required offset adjustment.", "f": ["Why can `Derived*` and `Base2*` pointing to the same object have different values? => `Base2` lives at a non-zero offset inside `Derived`.", "What is a thunk? => A small adjustor stub that fixes up `this` before jumping to the real override for a secondary base."]}, "109": {"d": "A virtual base class is a base declared with `virtual` inheritance so that, in a diamond, all paths share one subobject of it instead of each path having its own copy.", "x": "Use it when a class inherits the same base through several paths and should logically contain it once (the `iostream` hierarchy, or interfaces that carry some state).\n\nConsequences: the most-derived class constructs the virtual base; access and casts to it go through an indirection; layout is more complex. Prefer designs where shared bases are pure interfaces without data, which removes the need in many cases.", "p": "Adding `virtual` inheritance \"just in case\" everywhere; it complicates construction and adds overhead without benefit when no diamond exists.", "f": ["Who initializes a virtual base? => The most-derived class; intermediate classes' initializers for it are ignored.", "When is virtual inheritance unnecessary in a diamond? => When the shared base has no data (a pure interface); duplication then causes only name ambiguity, which qualification can resolve."]}, "110": {"d": "The compiler uses the **final overrider**: for each virtual function, the dynamic type's class hierarchy must have one unique most-derived override, reached through the vtable of whichever base subobject the call goes through.", "x": "With multiple inheritance, a derived class can override functions from both bases; each base subobject's vtable points to the derived override (via a `this`-adjusting thunk for secondary bases).\n\nIf two bases each provide an override of the same virtual function from a shared virtual base, the most-derived class must provide its own override; otherwise the program is ill-formed (no unique final overrider). If two unrelated bases declare functions with the same name, a single derived override overrides both.", "p": "Inheriting two different overrides of the same virtual function through virtual inheritance without overriding it in the most-derived class; the compiler reports \"no unique final overrider\".", "f": ["What is the final overrider? => The most-derived override of a virtual function for an object's dynamic type.", "Can one function override virtuals from two different bases? => Yes, if both bases declare a virtual with the same signature, one override in the derived class overrides both."]}, "111": {"d": "Interface segregation says clients shouldn't depend on methods they don't use; C++ multiple inheritance of small pure-virtual interfaces lets a class implement several focused interfaces instead of one fat one.", "x": "Example: instead of one `Device` interface with `read`, `write`, `format`, `updateFirmware`, `getTemperature`, define `IBlockIo`, `IFormattable`, `IFirmwareUpdatable`, `IThermalSensor`. A drive implements all four; a read-only simulator implements only `IBlockIo`; tests depend only on the interfaces they need.\n\nSince pure interfaces carry no data, multiple inheritance of them avoids diamond data problems.", "p": "One huge abstract base forcing implementations to stub out irrelevant methods with `throw \"not supported\"`, which also violates Liskov substitution.", "f": ["Why is multiple inheritance of interfaces generally safe? => Interfaces have no data, so there's no duplicated state or ambiguity about members' storage.", "How does ISP help testing? => Test doubles implement only the small interface the code under test needs."]}, "112": {"d": "Yes: a derived class can override a base class's **private** virtual function; access control affects who can call a function, not who can override it.", "x": "This is the basis of the Non-Virtual Interface idiom: the base's public non-virtual function calls a private virtual hook; derived classes override the hook but can't call the base's private version or bypass the public entry point.\n\nHerb Sutter's guideline: make virtual functions private by default, protected only if derived classes need to call the base implementation, and public only for destructors (when polymorphic deletion is needed).", "p": "Assuming private virtual functions can't be overridden and making hooks public, which lets callers skip the base's checks and logging.", "f": ["Can the derived class call the base's private virtual implementation? => No; if it needs to, make the hook protected.", "Why make virtual functions private? => The base keeps control of when they're called (pre/post-conditions), and derived classes only customize."]}, "113": {"d": "If a derived class doesn't override every pure virtual function, it remains abstract: it compiles as a class but can't be instantiated.", "x": "The error appears only when you try to create an object (`Derived d;` or `std::make_unique<Derived>()`), often far from the class definition, with a message listing the missing overrides.\n\nThis is useful for intermediate abstract classes that implement part of an interface. To catch accidental omissions early, mark intended leaf classes `final` and add a `static_assert(!std::is_abstract_v<Derived>)` near the definition.", "p": "A typo in an override's signature without `override`: the pure virtual stays unimplemented and the class is unexpectedly abstract.", "f": ["How do you check at compile time that a class is concrete? => `static_assert(!std::is_abstract_v<T>);`.", "Can an abstract derived class add new pure virtual functions? => Yes, further derived classes must implement both old and new ones."]}, "114": {"d": "The Non-Virtual Interface (NVI) idiom makes public member functions non-virtual and has them call private (or protected) virtual functions that derived classes override.", "x": "Example: `public: void process(Data& d) { validate(d); doProcess(d); log(d); } private: virtual void doProcess(Data&) = 0;`.\n\nBenefits: the base enforces pre- and post-conditions, logging, locking and timing in one place; the public interface and the customization interface can evolve independently; derived classes can't bypass the checks. It's the C++ form of the Template Method pattern, used in the standard library (e.g. `std::streambuf`'s public functions calling protected virtuals).", "p": "Making every virtual function public, so each override must remember to repeat validation and locking, and some inevitably forget.", "f": ["Where does the standard library use NVI? => `std::basic_streambuf`: public functions like `sputc` call protected virtuals like `overflow`.", "What's the relation to Template Method? => NVI is how Template Method is typically implemented in C++."]}, "115": {"d": "A virtual call costs an extra memory load or two (vptr, then vtable slot) and an indirect branch, but the larger cost is that it usually prevents inlining and related optimizations.", "x": "Micro-level: indirect calls are well predicted by modern CPUs when the target is stable, so the direct overhead is a few cycles. Macro-level: without inlining, the compiler can't constant-fold, vectorize or eliminate work across the call.\n\nObjects also carry a vptr (8 bytes on 64-bit), which matters for millions of small objects and cache usage.\n\nGuidance: virtual dispatch is fine at component boundaries and for coarse-grained operations; in tight inner loops (per pixel, per byte) prefer templates, `final` classes, or batching (one virtual call per buffer instead of per element).", "p": "Micro-optimizing virtual calls in code that isn't hot; profile first, and batch work so each virtual call does more.", "f": ["Why is the lost inlining often more expensive than the call itself? => Inlining enables further optimizations like constant propagation and vectorization across the call boundary.", "How can you reduce virtual call overhead in a hot loop? => Batch work per call, use `final`, or switch the hot path to templates."]}, "116": {"d": "Containers of base pointers (`std::vector<Base*>` or, better, `std::vector<std::unique_ptr<Base>>`) let one container hold objects of different derived types and call virtual functions on each without slicing.", "x": "Ownership is the key design question: raw `Base*` in a container don't own anything, so someone else must delete the objects, and the container can easily hold dangling pointers. Use `std::unique_ptr<Base>` for exclusive ownership (the base needs a virtual destructor) or `std::shared_ptr<Base>` if ownership is genuinely shared.\n\nPerformance note: each element is a separate heap allocation, so iteration has poor cache locality. For closed sets of types, `std::vector<std::variant<A, B, C>>` stores objects contiguously.", "p": "`std::vector<Base*> v; v.push_back(new Derived);` and later forgetting to delete, or deleting through a base without a virtual destructor.", "f": ["Why not `std::vector<Base>`? => Objects would be sliced to `Base`.", "What's a cache-friendlier alternative for a fixed set of types? => `std::vector<std::variant<...>>` or one vector per concrete type."]}, "117": {"d": "Covariance lets an override return a more derived type than the base function; contravariance would let an override accept more general parameter types. C++ supports covariant return types (pointers and references only) but not contravariant parameters.", "x": "Covariant returns: `Base* Base::clone()` may be overridden as `Derived* Derived::clone()`. Parameters must match exactly: an override declared with a different parameter type is a different function that hides the base one (and `override` would reject it).\n\nWhy no contravariance: it would complicate overload resolution and ABI; in practice you accept the base parameter type and use virtual calls or double dispatch inside.", "p": "Declaring `void Derived::handle(DerivedEvent&)` expecting it to override `void Base::handle(Event&)`; it doesn't, it hides it.", "f": ["Does covariance work with smart pointers? => No, only with raw pointers and references.", "How do you handle type-specific parameters in overrides? => Accept the base type and dispatch further (visitor/double dispatch or `dynamic_cast`)."]}, "118": {"d": "With protected inheritance, the base's public and protected members become protected in the derived class, and the is-a relationship is visible only to the derived class and its own descendants.", "x": "It expresses \"implemented in terms of, and further derived classes may also rely on that\". Outside code can't convert `Derived*` to `Base*`, but classes derived from `Derived` can.\n\nIt's rarely used in practice; most codebases use public inheritance for interfaces and composition otherwise. One niche: mixin or policy bases that the whole hierarchy should reuse internally without exposing them to users.", "p": "Choosing protected inheritance to \"hide\" a base while still expecting users to pass the object where the base is expected; that conversion isn't accessible to them.", "f": ["Who can convert `Derived*` to `Base*` under protected inheritance? => Members and friends of `Derived` and of classes derived from it.", "Why is protected inheritance rare? => Composition usually expresses implementation reuse more clearly."]}, "119": {"d": "Dependency Inversion says high-level modules should depend on abstractions, not on low-level modules; C++ abstract classes provide those abstractions, which both high-level code and low-level implementations depend on.", "x": "Example: a test sequencer depends on an abstract `IPowerController`; the real relay driver and a simulated controller both implement it. The sequencer never includes the relay driver's headers, so it can be compiled, tested and reused independently, and implementations can be swapped at runtime (injected via constructor).\n\nThe abstraction should be owned by the high-level module (it defines what it needs), not by the low-level library. Templates/concepts offer the same inversion at compile time.", "p": "Defining the \"interface\" as a copy of the concrete driver's full API, so high-level code is still coupled to one implementation's details.", "f": ["How do you inject the implementation? => Pass a reference or `std::unique_ptr` to the interface into the constructor (dependency injection).", "Can templates achieve dependency inversion? => Yes: `template<PowerController P> class Sequencer` depends on a concept, not a concrete class."]}, "120": {"d": "Virtual inheritance adds per-object overhead (extra pointers or offsets for locating the shared base), slower access to the virtual base's members, and more complex construction; the exact cost depends on the ABI.", "x": "Memory: each class with a virtual base typically carries a vptr (or virtual base pointer) used to find the base's offset; objects are larger than with plain inheritance.\n\nTime: accessing a member of the virtual base or converting to it needs an extra load to read the offset; `dynamic_cast` and construction are more complex, and the most-derived class must initialize the virtual base.\n\nBecause of this, use virtual inheritance only where a real diamond with shared state exists, typically in infrastructure hierarchies like streams.", "p": "Paying the virtual-inheritance cost for every object in a performance-critical hierarchy where no diamond actually exists.", "f": ["Why is access to a virtual base's members slower? => Its offset isn't fixed at compile time and must be loaded at runtime.", "How do you measure the layout cost? => Compare `sizeof` with and without virtual inheritance, or dump layouts with compiler flags."]}, "121": {"d": "Operator overloading lets you define what built-in operators (`+`, `==`, `<<`, `[]`, `()`) mean for user-defined types by writing functions named `operator@`.", "x": "It makes domain types read naturally: `a + b` for vectors, `price * qty` for money, `data[i]` for containers. The expression `a + b` is just sugar for `a.operator+(b)` or `operator+(a, b)`.\n\nRules: at least one operand must be a user-defined type; precedence, associativity and arity can't change; you can't invent new operators.\n\nGuideline: overload only when the meaning is obvious and conventional (the \"do as the ints do\" principle), keep related operators consistent (`+` with `+=`, `==` with `!=`, `<` with the other comparisons, or use C++20 `<=>`).", "p": "Overloading operators with surprising meanings (e.g. `+` that mutates its left operand), which makes code misleading to read.", "f": ["Can you change an operator's precedence? => No; overloaded operators keep the built-in precedence and associativity.", "What does C++20's `<=>` simplify? => Defining one three-way comparison (often `= default`) generates `<`, `<=`, `>`, `>=`, and `==` can also be defaulted."]}, "122": {"d": "You can't overload `::` (scope resolution), `.` (member access), `.*` (pointer-to-member access), `?:` (conditional), `sizeof`, `alignof`, `typeid`, and the preprocessor operators `#` and `##`.", "x": "These are excluded because they operate on names or types rather than values, or because overloading them would make basic language semantics unreliable (e.g. `.` must always mean member access so objects behave predictably).\n\nOperators that **can** be overloaded but only as members: `=`, `()`, `[]`, `->`, and conversion operators. `new`, `delete` and their array forms can be overloaded globally or per class. C++23 allows `operator[]` with multiple arguments and static `operator()`/`operator[]`.", "p": "Trying to overload `operator.` for smart-reference types; use `operator->` (which can be overloaded) instead.", "f": ["Which operators must be members? => `=`, `()`, `[]`, `->` and conversion operators.", "What did C++23 add for `operator[]`? => Multiple subscript arguments (`m[i, j]`), useful for matrices and `std::mdspan`."]}, "123": {"d": "Most operators can be implemented either as member functions (left operand is `*this`) or as non-member functions (all operands are parameters, optionally friends for private access).", "x": "Choose members for operators that modify the object or need access to its internals and have the object on the left (`+=`, `-=`, `=`, `[]`, `()`, `->`, unary operators).\n\nChoose non-members for symmetric binary operators (`+`, `-`, `*`, `==`, `<`) so implicit conversions apply to both operands, and for operators whose left operand isn't your type (`std::ostream& operator<<(std::ostream&, const T&)`).\n\nA common pattern: implement `+=` as a member and `+` as a non-member using it: `T operator+(T a, const T& b) { a += b; return a; }`.", "p": "Implementing `operator+` as a member so `money + 5` compiles but `5 + money` doesn't.", "f": ["Why implement `+` in terms of `+=`? => Single source of truth for the arithmetic, and `+` gets a correct copy-then-modify implementation for free.", "Why is `operator<<` for streams a non-member? => The left operand is `std::ostream`, which you can't add members to."]}, "124": {"d": "`operator=`, `operator[]`, `operator()` and `operator->` are required by the language to be non-static member functions, because they're tightly bound to the object on their left.", "x": "For assignment specifically: if you could declare a free `operator=`, the compiler's implicitly declared member copy assignment would still exist, making the rules for which one applies confusing; requiring members keeps class semantics self-contained.\n\n`operator[]` and `operator()` usually need direct access to internal storage and should never allow implicit conversions on the object operand (a free function would let `5[obj]`-style conversions creep in).\n\nC++23 relaxes one related rule: `operator()` and `operator[]` may be `static`, useful for stateless function objects.", "p": "Trying to write a free `operator=` to add assignment from another type; add a member assignment overload or a converting constructor instead.", "f": ["What does C++23 allow for `operator()`? => It may be declared `static` when the functor has no state, avoiding the implicit object parameter.", "Why shouldn't the object operand of `[]` allow implicit conversions? => It would let unrelated types be subscripted after silent conversion, hiding bugs."]}, "125": {"d": "Overload `operator<<` as a non-member taking `std::ostream&` and `const T&`, writing the object and returning the stream so calls can be chained.", "x": "Signature: `std::ostream& operator<<(std::ostream& os, const Point& p)`. Make it a `friend` (often a hidden friend defined inside the class) if it needs private members, or use public accessors.\n\nGuidelines: don't add a trailing newline (let callers decide), respect stream formatting where reasonable, and return the stream reference. For input, `operator>>` should set `failbit` on malformed input and leave the object in a valid state.\n\nIn C++20/23, also consider `std::formatter<Point>` specializations so the type works with `std::format` and `std::print`.", "p": "Returning the stream by value or not returning it at all, which breaks chaining like `std::cout << a << b`.", "f": ["Why is it best as a hidden friend? => It's only found through ADL for `Point`, keeping global overload sets small and avoiding accidental conversions.", "How do you support `std::format` for your type? => Specialize `std::formatter<T>` with `parse` and `format` members."]}, "126": {"d": "Prefix `operator++()` increments and returns a reference to the updated object; postfix `operator++(int)` takes a dummy `int` parameter to distinguish it, returns a copy of the old value, then increments.", "x": "Canonical forms:\n\n- `T& operator++() { /* increment */ return *this; }`\n- `T operator++(int) { T old = *this; ++*this; return old; }`\n\nPostfix must make a copy, so for iterators and heavy types prefer `++it` in loops. For built-in types the compiler optimizes both equally when the result is unused.\n\nImplement postfix in terms of prefix so the increment logic exists once.", "p": "Returning `T&` from postfix or modifying the value before copying it: callers get the new value instead of the old one.", "f": ["Why does postfix take an `int` parameter? => Only to give it a different signature from prefix; the value is unused.", "Why prefer `++it` over `it++` for iterators? => Postfix copies the iterator, which may be non-trivial; prefix doesn't."]}, "127": {"d": "`==` and `!=` must agree (`a != b` should always equal `!(a == b)`); implementing one in terms of the other guarantees it, and C++20 generates `!=` from `==` automatically.", "x": "Equality should be an equivalence relation: reflexive, symmetric and transitive, and consistent with `std::hash` when the type is used in unordered containers (equal objects must hash equally).\n\nBefore C++20 you wrote both (usually as non-members). In C++20, declaring `bool operator==(const T&) const = default;` compares all members in order, and `a != b` is rewritten as `!(a == b)`. Reversed argument order (`5 == obj`) is also handled by rewriting.\n\nDecide what equality means: value equality of all members, or only identity-defining fields (e.g. serial number); document it.", "p": "Defining `==` to compare some fields but hashing different fields, so equal objects end up in different buckets of an `unordered_set`.", "f": ["What does C++20 rewrite `a != b` into? => `!(a == b)`, so you only need `operator==`.", "What must hold between `==` and `std::hash`? => Equal objects must produce equal hashes."]}, "128": {"d": "Self-assignment (`a = a`) breaks naive assignment operators that free their own resources before copying from the source, because the source is the object just freed.", "x": "Naive code: `delete[] data_; data_ = new char[o.size_]; std::copy(o.data_, ...)` reads freed memory when `&o == this`.\n\nFixes: a self-check `if (this == &o) return *this;` (cheap but doesn't give exception safety), allocate and copy into a temporary **before** releasing the old data, or use copy-and-swap, which handles self-assignment and gives the strong exception guarantee.\n\nSelf-assignment is rare but happens through aliases: `v[i] = v[j]` with `i == j`, or `*p = *q` when both point to the same object.", "p": "Adding only the `this == &o` check and still freeing the old buffer before the new allocation, so an allocation failure leaves the object with a dangling pointer.", "f": ["How can self-assignment happen unintentionally? => Through aliases: references or indices that happen to refer to the same object.", "Why is copy-and-swap self-assignment safe? => It copies the source first, then swaps; the old state is released only after the copy succeeded."]}, "129": {"d": "Overloading `operator()` makes objects callable like functions; such objects are called **function objects** or **functors**.", "x": "Functors can carry state (a threshold, a counter, a random generator) and are easily inlined by the compiler, which is why STL algorithms take them as template parameters (`std::sort(v.begin(), v.end(), ByLatency{})`).\n\nLambdas are syntactic sugar for compiler-generated functor classes: captured variables become members and the body becomes `operator()`.\n\nStandard functors include `std::less<>`, `std::plus<>`, `std::hash<T>`; the transparent forms like `std::less<>` enable heterogeneous lookup in ordered containers.", "p": "Writing a functor whose `operator()` modifies state and passing it to algorithms that may copy it; each copy has its own state, so results are inconsistent. Use `std::ref` or lambdas capturing by reference.", "f": ["How does a lambda relate to a functor? => The compiler generates a unique class with the captures as members and the body as `operator()`.", "Why are functors often faster than function pointers in `std::sort`? => The call target is part of the type, so the compiler can inline it."]}, "130": {"d": "Provide two overloads of `operator[]`: a non-const one returning `T&` (read and write) and a const one returning `const T&` (or a value) for read-only access on const objects.", "x": "The const overload is essential: without it, a `const Matrix&` parameter can't be indexed. Both typically share one private implementation to avoid duplication (C++23 \"deducing this\" can write them as one function).\n\nDecide on bounds checking: `operator[]` is conventionally unchecked (like `std::vector`), with a separate `at()` that throws `std::out_of_range`.\n\nFor sparse or proxy-based containers (e.g. `std::vector<bool>`), `operator[]` returns a proxy object, which behaves differently from a real reference (`auto x = v[0];` copies the proxy).", "p": "Providing only a non-const `operator[]`, making the container unusable through const references.", "f": ["Why do standard containers offer both `[]` and `at()`? => `[]` is unchecked for speed; `at()` checks bounds and throws.", "What's the pitfall of proxy references like `std::vector<bool>::reference`? => `auto` captures the proxy, not a bool, which may dangle or behave unexpectedly."]}, "131": {"d": "Copy-and-swap implements assignment by taking the argument by value (making a copy or move), swapping its contents with `*this`, and letting the parameter's destructor release the old state.", "x": "`T& operator=(T other) noexcept { swap(*this, other); return *this; }` with a `noexcept` `swap` that exchanges members.\n\nProperties: **strong exception guarantee** (if the copy throws, `*this` is untouched because the copy happens before the function body), automatic self-assignment safety, and a single function serving as both copy and move assignment (the parameter is move-constructed from rvalues).\n\nCost: it always creates a new copy even when existing capacity could be reused (e.g. assigning a vector of equal size), so performance-critical containers implement assignment more carefully.", "p": "Implementing `swap` in terms of `std::swap(*this, other)`, which for the class itself calls the assignment operator: infinite recursion. Swap members individually.", "f": ["What exception guarantee does copy-and-swap provide? => The strong guarantee: either the assignment succeeds or `*this` is unchanged.", "When is copy-and-swap slower than a hand-written assignment? => When the target could reuse its existing buffer instead of allocating a new one."]}, "132": {"d": "Yes, `operator,` can be overloaded, but it's almost never a good idea: the overloaded version loses the built-in left-to-right sequencing guarantee (pre-C++17) and surprises readers.", "x": "The built-in comma evaluates the left operand, discards it, then evaluates the right. An overloaded comma is a normal function call; before C++17 the evaluation order of its operands was unspecified. C++17 restored left-to-right evaluation for overloaded commas too, but the surprise factor remains.\n\nHistoric uses: DSLs like Boost.Assign (`v += 1, 2, 3;`) and expression templates. Modern alternatives: initializer lists and variadic functions. Generic code sometimes casts to `void` (`(void)a, b`) to avoid invoking a user's overloaded comma.", "p": "Overloading comma so that `f(a, b)` style code inside a macro or template silently calls your operator instead of separating arguments or expressions.", "f": ["Why do generic libraries write `(void)expr, next`? => Casting to `void` prevents an overloaded comma operator from being selected.", "What replaced Boost.Assign-style comma DSLs? => Initializer lists (`std::vector<int> v{1, 2, 3};`)."]}, "133": {"d": "An overloaded operator must have at least one operand of class or enumeration type, so you can't redefine operators between built-in types like `int + int`.", "x": "This keeps the meaning of basic arithmetic stable and prevents libraries from changing how the whole program computes integers.\n\nIf you need different semantics for numbers, wrap them in a type: `struct Saturating { int v; };` with its own `operator+`, or strong typedefs (`Meters`, `Seconds`) that also prevent mixing units. Enumerations can have overloaded operators (commonly `|` and `&` for bit-flag enums).", "p": "Trying to overload `operator+(double, double)` to add rounding behaviour globally; wrap the value in a dedicated type instead.", "f": ["Can you overload operators for enums? => Yes, e.g. `Flags operator|(Flags a, Flags b)` for flag enums.", "How do you get special arithmetic (saturating, modular)? => Define a wrapper type with its own operators."]}, "134": {"d": "A global `operator new`/`delete` replaces allocation for the entire program; a class-specific `operator new`/`delete` (static member functions) affects only objects of that class and its derived classes.", "x": "Global replacement is used for tracking allocations, custom heaps, or failing loudly in real-time code; it must be defined once, with matching forms (`new`/`delete`, array and aligned variants, sized delete).\n\nPer-class overloads suit fixed-size pools (a slab allocator for many small `Packet` objects) and are found by lookup before the global ones. Remember to provide matching `operator delete`, and the array forms if arrays are allocated.\n\nAllocator-aware containers use `std::allocator` (which calls global `operator new`), not class-specific overloads; use `std::pmr` memory resources for container-level control.", "p": "Overriding `operator new` without the matching `operator delete` (or array variants), so memory from the custom allocator is released to the wrong heap.", "f": ["Where is a class-specific `operator new` found? => By lookup in the class scope first, so it applies to that class and derived classes.", "What's a modern alternative for custom container allocation? => `std::pmr` polymorphic memory resources (e.g. `monotonic_buffer_resource`)."]}, "135": {"d": "`operator<` for ordered containers must be a **strict weak ordering**: irreflexive (`!(a < a)`), transitive, and with transitive equivalence (if `a` and `b` are equivalent and `b` and `c` are, so are `a` and `c`).", "x": "The easiest correct implementation compares members lexicographically with `std::tie(a.x, a.y) < std::tie(b.x, b.y)`, or in C++20 `auto operator<=>(const T&) const = default;`.\n\nContainers use `!(a < b) && !(b < a)` as equivalence; if your ordering is inconsistent (e.g. uses `<=`, or compares floats with NaN), `std::set` and `std::map` can corrupt their trees or lose elements, and `std::sort` can crash.\n\nFor floating-point keys, handle NaN explicitly (or use `std::strong_order`/`std::weak_order` in C++20).", "p": "Writing `return a.x <= b.x;` or comparing only one field while `==` compares all fields; `std::sort` may run past the end of the range.", "f": ["What is a strict weak ordering? => An ordering where `<` is irreflexive and transitive and equivalence (neither `a<b` nor `b<a`) is transitive.", "How does `std::tie` help? => It builds tuples of references whose `<` compares elements lexicographically."]}, "136": {"d": "Implicit conversion operators (`operator T()`) let objects convert silently to another type, which can trigger unexpected overloads, lossy conversions and ambiguities.", "x": "Classic example: pre-C++11 smart pointers with `operator bool()` allowed `ptr1 + ptr2` or `int x = ptr;`. The \"safe bool\" idiom was a workaround; C++11 `explicit operator bool()` solves it: usable in conditions, not in arithmetic.\n\nOther problems: two types converting to each other produce ambiguous overloads, and conversions to `const char*` or references may dangle.\n\nGuideline: mark conversion operators `explicit` unless the conversion is lossless and truly natural; prefer named functions (`toString()`, `asSeconds()`).", "p": "A `String` class with implicit `operator const char*()` that returns a pointer into a temporary's buffer, leaving callers with a dangling pointer.", "f": ["What is `explicit operator bool()` for? => It allows use in conditions (`if (p)`) but blocks accidental arithmetic or integer conversions.", "Why prefer named conversion functions? => They make conversions visible at call sites and can't be triggered accidentally."]}, "137": {"d": "For an expression like `a + b`, the compiler gathers member candidates (`a.operator+(b)`), non-member candidates found by ordinary and argument-dependent lookup, and built-in candidates, then runs normal overload resolution on all of them.", "x": "Member and non-member candidates compete on equal terms, using the implicit object parameter for members; the best conversion sequence wins, and if two are equally good the call is ambiguous.\n\nC++20 adds **rewritten candidates**: `a != b` may use `!(a == b)`, `b == a` can use `a == b` with reversed arguments, and `a < b` can use `(a <=> b) < 0`. Non-rewritten candidates win ties over rewritten ones.\n\nDefining the same operation both as member and non-member with equivalent signatures is a common source of ambiguity errors.", "p": "Having both `bool Money::operator==(const Money&) const` and a free `bool operator==(const Money&, const Money&)`: every comparison becomes ambiguous.", "f": ["What are rewritten candidates in C++20? => Expressions using reversed or synthesized forms of `==` and `<=>` (e.g. `!=`, `<`, reversed argument order).", "Are member and non-member operator candidates treated differently? => No, they participate in the same overload resolution."]}, "138": {"d": "Arithmetic operators are recommended as non-members so both operands are treated symmetrically: implicit conversions (from converting constructors) apply to the left operand as well as the right.", "x": "With a member `Rational Rational::operator*(const Rational&) const`, `r * 2` compiles (2 converts to `Rational`) but `2 * r` doesn't, because member functions don't consider conversions on their object operand.\n\nA non-member `Rational operator*(const Rational&, const Rational&)` accepts both. It can be a hidden friend or be built on the member `*=`. Scott Meyers' Effective C++ Item 24 covers this example.", "p": "Implementing only member arithmetic operators and discovering that mixed expressions compile in one direction only.", "f": ["Why don't members allow conversions on the left operand? => The left operand is the object the member is called on; no conversion is considered for it.", "How do you avoid duplicating arithmetic logic? => Implement compound assignment (`*=`) as a member and the binary operator as a non-member calling it."]}, "139": {"d": "Operator overloading becomes ambiguous when two or more candidates are equally good matches; user-defined conversions (converting constructors and conversion operators) often create such ties.", "x": "Example: `struct A { A(int); }; struct B { B(int); }; void operator+(A, A); void operator+(B, B);` then `1 + x` style expressions where the other operand converts to both.\n\nAlso common: a type with implicit `operator int()` and an `operator+(T, T)`: `t + 1` could convert `1` to `T` or `t` to `int` and use built-in addition.\n\nRemedies: make constructors and conversion operators `explicit`, provide exact-match overloads for common mixed cases, and avoid implicit conversions in both directions between two types.", "p": "Giving a type both an
