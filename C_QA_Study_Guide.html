x.","short":"strcpy has no destination-size awareness, so any input at or past the buffer's size overflows the stack; the fix is bounding the copy to the destination's size and always null-terminating, for example with snprintf's guaranteed truncation-and-terminate behavior.","deep":"Vulnerable:\n```c\n#include <string.h>\n#include <stdio.h>\nvoid copy_in(const char *user_input) {\n    char buf[16];\n    strcpy(buf, user_input);   /* no bound check: overflow if input >= 16 bytes */\n    printf(\"buf=%s\\n\", buf);\n}\nint main(void) {\n    copy_in(\"short\");\n    copy_in(\"this string is far longer than 16 bytes\");\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra -g -fsanitize=address` and run, ASan aborted on the second call:\n```\n==1493==ERROR: AddressSanitizer: stack-buffer-overflow ... WRITE of size 40\n    #1 in copy_in t.c:5\n    #2 in main t.c:10\nAddress ... is located in stack of thread T0 at offset 48 in frame\n    #0 in copy_in t.c:3\n  This frame has 1 object(s): [32, 48) 'buf' <== overflows this variable\n```\nFixed:\n```c\n#include <string.h>\n#include <stdio.h>\nvoid copy_in(const char *user_input) {\n    char buf[16];\n    /* snprintf always null-terminates and never writes past sizeof(buf) */\n    int n = snprintf(buf, sizeof(buf), \"%s\", user_input);\n    if (n < 0) return;\n    printf(\"buf=%s\\n\", buf);\n}\nint main(void) {\n    copy_in(\"short\");\n    copy_in(\"this string is far longer than 16 bytes\");\n    return 0;\n}\n```\nCompiled the same way and run, it produced no ASan report and printed `buf=short` then `buf=this string is` (the second string silently, safely truncated to fit).","pitfall":"Switching to a \"safer-looking\" function name (like strncpy) without checking its exact truncation/termination contract, and ending up with a different but still real bug (a non-terminated buffer read later as if it were a C string).","verify":null,"follow":[{"q":"Would strncpy(buf, user_input, sizeof(buf)) have been an equally good fix?","a":"Almost, with one classic trap: strncpy does not guarantee null-termination when the source is exactly sizeof(buf) or longer, so buf could be left without a terminator; you would still need to force `buf[sizeof(buf)-1] = '\\0'` afterward, which snprintf already handles for you."},{"q":"Is a stack canary (compiler stack-protector) a substitute for this fix?","a":"No, a canary can turn some overflows into a detected abort instead of silent corruption, but it does not prevent the overflow itself or guarantee detection for every overflow pattern; bounding the copy is the actual fix, the canary is defense in depth."}],"mod":17},{"id":"17.10","level":"Advanced","type":"Debug","fig":null,"tags":["format-string","printf"],"q":"Why is printf(user_string) a security bug, and what real fix removes it?","short":"If user_string itself contains conversion specifiers like %s or %n, printf interprets them and pulls arguments off the stack that were never actually passed, reading (or, with %n, writing to) whatever garbage address it finds there; the fix is always passing a fixed format string and the user data as its argument, e.g. printf(\"%s\", user_string), so user data is never treated as format syntax.","deep":"Vulnerable:\n```c\n#include <stdio.h>\nvoid log_msg(const char *user_string) {\n    printf(user_string);   /* attacker-controlled format string */\n}\nint main(void) {\n    log_msg(\"hello\\n\");          /* looks fine */\n    log_msg(\"%s%s%s%s\\n\");       /* reads unrelated stack values as pointers: undefined */\n    return 0;\n}\n```\ngcc's own `-Wall -Wextra` already flags this at compile time (`-Wformat-security`: \"format not a string literal and no format arguments\"), and compiling and running it anyway (to see the real failure mode) printed:\n```\nhello\nhello\n(null)(null)<garbage bytes>\n```\nThe first call was harmless because the literal happened to contain no `%` conversions; the second, with no arguments actually passed for its four `%s` specifiers, made printf read whatever values happened to be in the argument-passing registers/stack slots and dereference them as `char *`, which is undefined behavior and, with attacker-chosen format strings (especially `%n`, which writes to a pointer argument), a known real-world exploitation technique for information disclosure or memory corruption.\nFixed:\n```c\n#include <stdio.h>\nvoid log_msg(const char *user_string) {\n    printf(\"%s\", user_string);   /* user string is always DATA, never the format */\n}\nint main(void) {\n    log_msg(\"hello\\n\");\n    log_msg(\"%s%s%s%s\\n\");   /* now printed literally, harmless */\n    return 0;\n}\n```\nCompiled and run, this version printed `hello` then the literal text `%s%s%s%s`, correctly treating the attacker-supplied string as data with no special meaning.","pitfall":"Assuming a format-string bug is harmless because \"we control what strings normally flow through this code path\"; the entire risk is inputs the code was not designed to expect, which is exactly what security review targets.","verify":null,"follow":[{"q":"Does this same bug class apply to other formatted functions?","a":"Yes, any of printf's family (fprintf, snprintf, syslog and similar logging APIs) has the identical risk whenever the format-string argument is not a fixed literal."},{"q":"Would -Wformat-security have caught this without ever running the program?","a":"Yes, it is a static warning gcc/clang emit at compile time whenever a non-literal is passed as a format string with no corresponding variadic arguments; treating that warning as an error (-Werror=format-security) in a firmware build is a reasonable hardening policy."}],"mod":17},{"id":"17.11","level":"Advanced","type":"Numeric","fig":null,"tags":["integer-overflow","malloc"],"q":"A firmware routine computes malloc(count * size) for an attacker-influenced count. Work out how this overflows and show the fix.","short":"On this 64-bit platform, size_t wraps modulo 2^64; choosing count = (SIZE_MAX / 4) + 10 and size = 4 makes count * size wrap to a small number (36 bytes here) instead of the astronomically large true product, so malloc happily \"succeeds\" with far too little memory for the code's later writes; the fix checks count > SIZE_MAX / size before multiplying.","deep":"```c\n#include <stdio.h>\n#include <stdlib.h>\n\nvoid *alloc_records_vuln(size_t count, size_t size) {\n    return malloc(count * size);   /* count*size can overflow size_t and wrap */\n}\nvoid *alloc_records_fixed(size_t count, size_t size) {\n    if (size != 0 && count > (size_t)-1 / size) return NULL;  /* would overflow */\n    return malloc(count * size);\n}\n\nint main(void) {\n    size_t huge_count = ((size_t)-1) / 4 + 10;\n    size_t rec_size = 4;\n    printf(\"count=%zu size=%zu product(wrapped)=%zu\\n\",\n           huge_count, rec_size, huge_count * rec_size);\n    void *p1 = alloc_records_vuln(huge_count, rec_size);\n    printf(\"vuln malloc returned %s\\n\", p1 ? \"non-NULL\" : \"NULL\");\n    free(p1);\n    void *p2 = alloc_records_fixed(huge_count, rec_size);\n    printf(\"fixed alloc returned %s\\n\", p2 ? \"non-NULL\" : \"NULL\");\n    free(p2);\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra -g` and run, it printed:\n```\ncount=4611686018427387913 size=4 product(wrapped)=36\nvuln malloc returned non-NULL\nfixed alloc returned NULL\n```\nThe math: `(size_t)-1` is `SIZE_MAX` (2^64 - 1 on this platform, an unsigned type so this cast is well-defined per 6.3.1.3p2, not UB); dividing by 4 and adding 10 deliberately produces a count where `count * 4` exceeds 2^64 and wraps to 36 (mod 2^64) instead of the true, enormous product. `malloc(36)` then succeeds and returns a real but far-too-small allocation; any code that trusted `count` records now fit and wrote that many 4-byte records would overflow that 36-byte block on record number 10 -- a heap overflow whose root cause is the earlier integer overflow, several lines before the actual out-of-bounds write. The fixed version rejects the request before multiplying by checking `count > SIZE_MAX / size` (rearranged from `count * size > SIZE_MAX` to avoid overflowing while checking for overflow).","pitfall":"Checking `count * size == 0` as an overflow test; a wrapped product can land on any value, including a plausible-looking nonzero one (36 here), not just zero, so that check misses the overflow entirely.","verify":"Whether the specific libc on your target's calloc actually rejects an overflowing nmemb*size; the C11 standard text itself does not mandate this.","follow":[{"q":"Why is (size_t)-1 well-defined here instead of undefined like signed overflow?","a":"size_t is an unsigned type, and unsigned arithmetic (including converting a negative value like -1 to an unsigned type) is defined by the standard to wrap modulo 2^N (6.3.1.3p2), unlike signed overflow which is undefined behavior."},{"q":"Is calloc a safer alternative to malloc(count*size) for this exact pattern?","a":"The C11 text itself only says calloc(nmemb, size) allocates space for nmemb objects of size size and zero-fills it (7.22.3.2p2), with no explicit overflow-checking guarantee; in practice, quality implementations (glibc among them) do reject an overflowing nmemb*size internally, which is why calloc is still the preferred call here, but that check is a quality-of-implementation property to verify for your target, not a portable C11 guarantee."}],"mod":17},{"id":"17.12","level":"Advanced","type":"Scenario","fig":null,"tags":["length-prefixed","bounds-check"],"q":"How do you safely parse a length-prefixed packet (a 2-byte length followed by that many payload bytes) out of a fixed-size receive buffer?","short":"Read the length field first, then before touching any payload byte verify the claimed length does not exceed both the receive buffer's actual remaining bytes and the destination buffer's capacity; reject (do not truncate-and-continue) any packet that fails either check, since a claimed length is untrusted input, not a fact.","deep":"```c\n#include <stdio.h>\n#include <stdint.h>\n#include <string.h>\n\n#define RX_BUF_CAP 64\n\n/* Returns 0 on success, -1 on a malformed/oversized packet (rejected, not truncated). */\nint parse_packet(const uint8_t *rx, size_t rx_len, uint8_t *out, size_t out_cap, size_t *out_len) {\n    if (rx_len < 2) return -1;                         /* not even a full length field */\n    uint16_t claimed_len = (uint16_t)((rx[0] << 8) | rx[1]);\n    size_t available = rx_len - 2;\n    if (claimed_len > available) return -1;            /* claims more than we actually received */\n    if (claimed_len > out_cap) return -1;               /* would not fit destination either */\n    memcpy(out, rx + 2, claimed_len);\n    *out_len = claimed_len;\n    return 0;\n}\n\nint main(void) {\n    uint8_t good_pkt[] = { 0x00, 0x03, 'a', 'b', 'c' };\n    uint8_t bad_pkt[]  = { 0xFF, 0xFF, 'a', 'b', 'c' };  /* claims 65535 bytes, only 3 present */\n    uint8_t out[RX_BUF_CAP];\n    size_t out_len;\n\n    printf(\"good packet: %s\\n\", parse_packet(good_pkt, sizeof(good_pkt), out, sizeof(out), &out_len) == 0 ? \"accepted\" : \"rejected\");\n    printf(\"bad packet:  %s\\n\", parse_packet(bad_pkt, sizeof(bad_pkt), out, sizeof(out), &out_len) == 0 ? \"accepted\" : \"rejected\");\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra -g` and run, it printed `good packet: accepted` and `bad packet:  rejected`, confirming the oversized-length packet was rejected before any `memcpy` touched memory based on its untrusted claim.","pitfall":"Validating claimed_len against the destination buffer's capacity but forgetting to also validate it against how many bytes were actually received, which lets a short, truncated receive still \"successfully\" copy uninitialized or stale bytes from beyond what arrived.","verify":null,"follow":[{"q":"Why reject instead of clamping claimed_len down to available and continuing?","a":"A packet whose claimed length does not match what was actually received is malformed by definition; silently reinterpreting it as a shorter, different packet can misparse the remaining bytes (which the sender intended as something else) rather than safely handling an error."},{"q":"Does this pattern change for a length field that could itself be adversarially huge (e.g. a 32-bit length)?","a":"The same two checks still apply, just done in a wide-enough integer type to avoid a length-field-arithmetic overflow of its own, similar in spirit to 17.11's count*size overflow."}],"mod":17},{"id":"17.13","level":"Principal","type":"Concept","fig":null,"tags":["secure-parsing","checklist"],"q":"You are reviewing a firmware update image parser before it ships. What is a concrete checklist for the input-validation issues an interviewer expects you to raise unprompted?","short":"Validate every length/count/offset field against both the buffer actually available and the destination capacity before use (17.12), check every size computation for overflow before allocating or indexing (17.11), never format untrusted data as a printf format string (17.10), never copy untrusted data with an unbounded function (17.09), and verify a cryptographic signature/hash over the whole image before trusting any of its parsed contents, not just checking a version field.","deep":"A Principal-level review checklist, in the order an attacker-controlled update image should be examined:\n1. Authenticity first: is the image's signature (or at minimum a strong hash against a trusted, separately-delivered value) verified before any field inside it is parsed and acted on? Parsing untrusted structure before authentication means a malformed-but-unsigned image can already exploit a parser bug even if it would later fail signature checks.\n2. Every length and count field: is it bounds-checked against both the actual received/mapped image size and the destination buffer before being used to index, copy, or allocate (17.12's pattern)? Flag any place a length field is trusted without that check.\n3. Every size computation feeding an allocation or index (count * element_size, offset + length, and similar): checked for overflow before use, in a wide-enough type (17.11's pattern), not just \"looks reasonable\" by inspection.\n4. Every fixed-size destination buffer receiving variable-length data: copied into with a bounded function (snprintf, memcpy with a checked length, never strcpy/strcat/sprintf/gets) per 17.09.\n5. Any place a field from the image is passed as, or concatenated into, a format string, a shell command, or similar interpreted syntax: rejected in favor of treating it purely as data (17.10's pattern, generalized).\n6. Version/compatibility fields: parsed defensively (reject unknown/out-of-range versions explicitly) rather than assuming a version number itself is trustworthy just because it parses as a plausible integer.\n7. Failure paths: does every rejection path actually stop processing (return/abort parsing) rather than logging a warning and continuing with partially-parsed or default-filled state? A validated-but-then-ignored check is equivalent to no check.\nA Principal answer states this as a checklist proactively, not just as a reaction to a hypothetical found bug, because \"what would you look for\" is the actual question being asked, not \"can you fix this one bug.\"","pitfall":"Reviewing only the \"happy path\" fields (the ones the normal build tool produces) and never constructing a deliberately malformed image to exercise every rejection path during review or testing.","verify":null,"follow":[{"q":"Why does authenticity (signature check) come before structural validation in this order?","a":"Because parsing itself is where memory-safety bugs live; an attacker does not need a valid signature to trigger a parser bug from a malformed field, so structural parsing of anything not yet authenticated should be treated as parsing hostile input regardless of what the fields claim."},{"q":"Is this checklist specific to firmware update images, or does it generalize?","a":"It generalizes to any parser consuming external/untrusted binary or text input (network protocols, file formats, IPC messages); firmware update images are simply a case where the consequence of a missed check (a compromised, hard-to-recover device) is unusually severe."}],"mod":17},{"id":"17.14","level":"Principal","type":"Trap","fig":null,"tags":["signal","reentrancy","malloc"],"q":"What specifically goes wrong if a signal handler calls printf or malloc, and why can it appear to \"just work\" in casual testing?","short":"printf and malloc maintain internal shared state (stdio buffers, the heap's free-list/bookkeeping) that is not guaranteed reentrant; if the signal interrupts the main program while it is itself inside that same internal state, the handler's call can corrupt it, but this only manifests when the interrupt happens to land inside that narrow window, which is why it can pass every test that never interrupts at exactly the wrong instruction.","deep":"```c\n#include <signal.h>\n#include <stdio.h>\n#include <stdlib.h>\n\n/* BAD: calls malloc() and printf(), neither on the C standard's short list of\n   functions a signal handler may call (7.14.1.1p5: only abort, _Exit,\n   quick_exit, and signal itself, for a signal not raised via raise/abort). */\nstatic void bad_handler(int signum) {\n    (void)signum;\n    int *leak = malloc(sizeof(int));\n    if (leak) { *leak = 1; printf(\"handled\\n\"); }\n}\nstatic volatile sig_atomic_t got_signal = 0;\nstatic void good_handler(int signum) { (void)signum; got_signal = 1; }\n\nint main(void) {\n    signal(SIGUSR1, bad_handler);\n    raise(SIGUSR1);           /* demonstrates it \"runs\", not that it is safe */\n    signal(SIGUSR1, good_handler);\n    got_signal = 0;\n    raise(SIGUSR1);\n    printf(\"got_signal=%d\\n\", got_signal);\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra -g` and run, this printed `handled` then `got_signal=1` -- the bad_handler call \"worked\" in this run, because `raise` here happens synchronously with nothing else mid-call in malloc/stdio's internal state at that exact moment; per the standard this is still undefined behavior, since raise/abort-triggered signals are the one exception where the handler's actions are more permissive (7.14.1.1p4-5), but a real asynchronous interrupt landing while the interrupted code is itself inside malloc's free-list update or stdio's buffer-flush logic would re-enter that same non-reentrant code and can corrupt it -- a bug that depends on timing that a synchronous test using raise() at a controlled point does not reproduce.\n- This is precisely why \"it worked when I tested it\" is not evidence of safety here: the standard's undefined-behavior classification is about what is permitted to happen across all possible timings and implementations, not about what one specific test run's timing happened to trigger.\n- The good_handler pattern (a bare volatile sig_atomic_t assignment) has none of this risk because it touches no shared library-internal state at all.","pitfall":"Concluding a signal/ISR handler is safe because a debug build with printf logging inside it \"worked fine\" during development; the exact conditions that trigger the corruption are timing-dependent and can be arbitrarily rare.","verify":null,"follow":[{"q":"Does this same risk apply identically to a hardware ISR calling malloc, not just a POSIX signal handler?","a":"Yes, the mechanism is the same (re-entering non-reentrant shared state from an asynchronously-interrupting context); the C standard's specific wording is about signal handlers, but the underlying reentrancy hazard is identical for interrupt handlers in embedded firmware."},{"q":"Would running this under ThreadSanitizer or a similar tool reliably catch the bug?","a":"Not reliably; these tools are strongest at races between truly concurrent threads, while this hazard is about a single thread of control being asynchronously re-entered, which needs the interrupt to land at exactly the vulnerable instruction to manifest, something a sanitizer cannot force without specialized interrupt-fuzzing tooling."}],"mod":17},{"id":"17.15","level":"Principal","type":"Cross-layer","fig":null,"tags":["isr-review","root-cause"],"q":"You are handed an ISR that calls printf for logging and occasionally the system hangs or corrupts unrelated data. Walk through diagnosing and fixing it at Principal depth.","short":"Recognize the pattern immediately (printf inside an ISR touches non-reentrant stdio/allocator state, 17.14), confirm by checking whether the hang/corruption correlates with logging-heavy code paths and with the ISR firing during those windows, then fix by replacing the logging call with a lock-free write into a ring buffer that a normal-context task later drains and actually prints from.","deep":"A concrete diagnosis-to-fix walkthrough:\n1. Pattern-match first: any ISR calling a stdio function or the allocator is an immediate suspect regardless of symptoms, per 17.02/17.03/17.14; state this as the leading hypothesis before even reproducing, since it is a structural defect, not something that needs a crash dump to justify raising.\n2. Look for the timing signature that confirms it: does the hang/corruption correlate with periods of heavier logging (more printf calls in flight, meaning more time spent inside stdio's internal buffer/lock state) and with higher interrupt rates (more chances for the ISR to fire mid-printf)? Both correlating together strongly supports the reentrancy hypothesis over an unrelated bug.\n3. If reproducible in a lab setup, confirm directly: a debug build that logs (from normal, non-ISR context only, to avoid the very bug being tested) the program counter or a marker showing \"main context was inside printf/malloc when the ISR fired\" at the moment of failure is strong direct evidence.\n4. Fix architecturally, not by patching the symptom: remove the printf call from the ISR entirely. Replace it with the minimal safe operation from 17.02/17.03 -- push the log message (or just a compact event code/timestamp) into a single-producer/single-consumer ring buffer (module 18 covers the real data structure) using only plain index arithmetic, no library calls. A separate, normal-context task or the main loop then pops from that ring buffer and does the actual printf/formatting/I/O outside any interrupt context.\n5. Explicitly state the trade-off this fix accepts: log messages are now delayed until the consumer next runs (not printed instantly at the moment of the event), and if the ring buffer fills faster than it drains, messages are dropped (a real, size-able capacity/throughput trade-off, not just a code fix); a Principal-level answer names this trade-off unprompted rather than presenting the fix as a free improvement.\n6. Verify the fix actually removed the hazard, not just the symptom: confirm no remaining code path in or reachable from the ISR calls a non-reentrant library function, not only that printf specifically is gone (the same class of bug could reappear via a different call, e.g. malloc for a \"temporary\" formatting buffer).","pitfall":"Fixing this by simply removing the log calls (losing observability) instead of restoring safe observability via a ring-buffer-plus-deferred-consumer design, treating \"make the symptom stop\" as equivalent to \"make the system correct and still debuggable.\"","verify":null,"follow":[{"q":"Why might the original bug present as a full system hang rather than a crash?","a":"Corrupting stdio's or the allocator's internal lock/state can leave a data structure in a state where a later, unrelated call spins forever (e.g. on a corrupted linked free-list) rather than faulting immediately, which looks like a hang with no obvious faulting instruction to backtrace to."},{"q":"Is disabling interrupts around the printf call in the ISR itself an acceptable fix instead?","a":"No; that does not address calling non-reentrant code from within an ISR (the hazard is re-entering the allocator/stdio state that the main-context code was left inside, not other interrupts arriving), and it also extends interrupt latency for every other interrupt source, trading one problem for another."}],"mod":17},{"id":"17.16","level":"Principal","type":"Concept","fig":null,"tags":["hardening","firmware-update"],"q":"Design-level: how would you harden a firmware update image validator against the buffer- and integer-overflow classes of attack covered in this module, and what would you state as the residual risk?","short":"Layer defenses: authenticate the whole image before parsing any field (17.13), validate every length/count against both source and destination bounds (17.12), check every size computation for overflow before allocating or indexing (17.11), use only bounded copy/format functions throughout (17.09/17.10), and state plainly that this reduces but never eliminates risk from an unknown parser bug.","deep":"A design answer structured the way a Principal review expects, stated unprompted rather than only in response to a specific found bug:\n- Defense in depth, ordered by what an attacker needs to defeat first: (1) a valid signature over the entire image, checked before any byte of the image's structure is parsed for meaning; (2) structural validation of every field that controls a length, count, offset, or size computation, rejecting rather than clamping on any inconsistency; (3) bounded, checked primitives (snprintf/memcpy-with-checked-length, overflow-checked size arithmetic) used exclusively throughout the parser, with no direct calls to strcpy/sprintf/gets or unchecked multiplication feeding an allocation.\n- Fail-closed as a stated design principle: any validation failure aborts the update and leaves the existing, already-verified firmware running (never partially applies an unvalidated image), which turns a parser bug from \"attacker gets code execution or bricks the device\" into, at worst, \"a malformed update is correctly rejected.\"\n- State the residual risk plainly: signature verification protects against a *tampered* image, not against a bug in the *validator itself* being triggered by a maliciously crafted but validly-signed image (e.g. if the signing pipeline itself accepts attacker-supplied firmware, or if the parser bug is in code that runs before or regardless of signature status, such as a bootloader's initial header sniff). The concrete mitigation for that residual risk is minimizing what runs before authentication (ideally: read a fixed-size, fixed-format header, verify the signature, and only then parse anything variable-length or attacker-influenced) and testing the validator itself with fuzzing against deliberately malformed images, treating it as untrusted-input-facing code held to the same standard as a network-facing parser.\n- This is the answer shape a Principal interview is testing for: naming the layered checks, explaining the order they must apply in and why, and being explicit about what is not fully solved rather than presenting hardening as making the system attack-proof.","pitfall":"Treating \"we verify a signature\" as sufficient justification to relax structural validation elsewhere in the parser; the signature protects the image's authenticity, not the correctness of the code that later parses its contents.","verify":null,"follow":[{"q":"Why does the order (signature before structural parsing) matter for the residual-risk argument specifically?","a":"Because minimizing pre-authentication parsing surface is the actual mitigation for \"a bug in the validator\" risk; the less code that runs on attacker-controlled bytes before authentication, the smaller that residual attack surface actually is, not just in principle."},{"q":"Would code review alone (no fuzzing) be sufficient assurance for this validator before shipping?","a":"No; this module's own examples (17.07's endian bug, 17.11's overflow) show defects that are easy to miss by inspection and are exactly the class that fuzzing/dynamic testing against malformed inputs reliably surfaces, so both practices are expected together, not as substitutes for each other."}],"mod":17},{"id":"18.01","level":"Basic","type":"Concept","fig":null,"tags":["pool-allocator","fragmentation"],"q":"What is a fixed-block memory pool allocator, and why does it give O(1) alloc/free with no fragmentation across its own blocks?","short":"A pool pre-carves a fixed-size storage array into N equal-size blocks and threads them into a singly linked free list, using each free block's own bytes to store the \"next\" pointer; alloc pops the list head and free pushes back onto it, both O(1), and since every block is the same size a freed block is always immediately reusable, so there is no fragmentation between blocks.","deep":"- Contrast with a general-purpose allocator (module 8): malloc/free must search or coalesce variable-size free chunks, which is why realloc/malloc complexity is not guaranteed constant and why long-running heaps can fragment (many small free chunks too scattered to satisfy a later larger request). A fixed-block pool sidesteps this entirely by never varying block size.\n- The \"free list inside free blocks\" trick costs zero extra memory for bookkeeping: a free block is not in use, so its own storage is available to hold the next-pointer, and only a free block is ever read as a pointer this way (module 18.04 shows the real code).\n- The trade-off this design accepts (state it unprompted in an interview, see 18.13): the pool can only satisfy requests up to its fixed block size, and its total capacity is fixed at init time (N blocks); it is deterministic and fast, not general-purpose.","pitfall":"Sizing pool blocks to fit today's largest object without margin; a later, slightly larger object either needs a second pool sized for it or forces a redesign, since a fixed-block pool cannot serve a request larger than its block size.","verify":null,"follow":[{"q":"Why is this pattern common in firmware/ISR contexts specifically?","a":"Its O(1), bounded-time alloc/free with no internal locking search makes it safe and predictable to call from time-critical or interrupt contexts, unlike a general allocator whose worst-case search/coalesce time is harder to bound."},{"q":"What happens when the pool is exhausted (all N blocks in use)?","a":"alloc must return NULL (or a designated failure value); a well-designed caller checks this every time, since a pool has no way to grow itself at runtime by definition."}],"mod":18},{"id":"18.02","level":"Basic","type":"Concept","fig":"ringbuffer","tags":["ring-buffer","spsc"],"q":"What is a single-producer/single-consumer (SPSC) ring buffer, and why size it as a power of two?","short":"It is a fixed-size circular array with a head index (where the producer writes next) and a tail index (where the consumer reads next), each owned by exactly one side so neither needs a lock against the other; sizing the capacity as a power of two lets the wrap-around use a fast bitwise AND mask (index & (capacity-1)) instead of a modulo, and lets head/tail simply keep incrementing forever, relying on unsigned integer wraparound to still land in range through the mask.","deep":"- \"Single-producer/single-consumer\" is the key safety property: the producer only ever writes `head` (and the slot it points to), the consumer only ever writes `tail` (and reads the slot it points to); neither side writes the other's index, so there is no shared mutable state that needs a lock for this specific access pattern, only for the case where both sides might read the other's index concurrently, which itself needs care about memory ordering across threads/cores (a topic module 18.08 flags, pointing to the C Advanced page).\n- Power-of-two capacity: with capacity C a power of two, `index % C` is exactly `index & (C - 1)` for unsigned index, a single fast bitwise AND instead of a division; letting head/tail increment past C without ever explicitly wrapping them (they wrap naturally at the unsigned integer type's own range, e.g. 2^32) and only masking at the point of indexing into the array is both simpler and avoids a separate \"have I wrapped\" comparison.\n- The design still needs one more decision to disambiguate \"empty\" from \"full\" when head and tail can be numerically equal after masking; 18.06's implementation and 18.07's trap cover the two common ways to solve that.","pitfall":"Sizing the ring buffer to a non-power-of-two capacity \"because that is the number of items I need\" and then either using the slower modulo operator or, worse, forgetting to wrap at all (18.07/18.09 show exactly this failure mode).","verify":null,"follow":[{"q":"Does the ring buffer need any locking at all for the true single-producer/single-consumer case on one core?","a":"No explicit mutex is needed for the index/slot ownership itself, though on multi-core hardware the two sides still need a memory barrier/ordering guarantee that a written slot is visible before its index update is seen by the other side, which is a cross-thread memory-model concern, not a C-language one."},{"q":"What happens if you actually have two producers writing concurrently?","a":"The SPSC design breaks immediately, since both would race to write `head` and could overwrite each other's slot or corrupt the index; that needs a real multi-producer-safe design (locking or an atomic-CAS-based approach), out of scope for the single-producer case this module covers."}],"mod":18},{"id":"18.03","level":"Basic","type":"Concept","fig":null,"tags":["event-dispatch","function-pointers"],"q":"What is a generic event/callback dispatch system in C, and how does it build on the function-pointer patterns from module 12?","short":"It is a table mapping each event type to zero or more registered (function pointer, context pointer) pairs; raising an event walks that event's registered callbacks and invokes each with the event data and its own opaque context, the same struct-of-function-pointers-plus-void*-context idiom module 12 covers for a single interface, generalized to a many-to-many registry instead of one fixed vtable.","deep":"- The core building block is identical to module 12's callback/vtable pattern: a function pointer type (e.g. `void (*)(int event_id, void *ctx)`) plus a `void *ctx` the callback owner supplies at registration time, so one handler function can serve multiple independent registrations (e.g. the same logging handler registered for several different event sources, each with its own context pointer).\n- What is new here relative to a single callback: a small registry (an array or table, indexed by event type, each slot able to hold multiple registered handlers) plus register/unregister/dispatch functions to manage it, turning a single callback slot into a many-handlers-per-event publish/subscribe-style system (18.11 shows the real code).\n- This pattern is common in firmware for decoupling: the code detecting a condition (e.g. an ISR setting a flag, or a driver noticing a state change) does not need to know who cares about it; it just dispatches the event, and any number of independently-written handlers can subscribe.","pitfall":"Growing the registry unbounded (e.g. a dynamically resizing array of handlers) inside a system that also needs deterministic, bounded-time dispatch; a fixed-capacity table sized at design time (with a defined behavior on overflow, like 18.01's pool) keeps the same determinism guarantees firmware code usually needs.","verify":null,"follow":[{"q":"Should dispatch itself ever be called directly from an ISR?","a":"Only if every registered handler is itself safe to run in interrupt context (short, non-blocking, no calls to non-reentrant functions, module 17's ISR rules); the safer default in firmware is dispatching from normal (non-ISR) context after an ISR has only queued the event, e.g. via the ring buffer pattern in 18.14."},{"q":"How is this different from a plain switch statement dispatching on event type?","a":"A switch statement is fixed at compile time and only one place can handle each case; a callback table lets independent, possibly unrelated modules register interest in the same event at runtime without editing a central switch statement."}],"mod":18},{"id":"18.04","level":"Intermediate","type":"Scenario","fig":null,"tags":["pool-allocator","free-list"],"q":"Implement a real fixed-block memory pool allocator (init, alloc, free) and show it actually running.","short":"Thread every block into a free list at init by storing each free block's \"next\" pointer in its own first bytes; alloc pops the list head (or returns NULL if empty), free pushes a block back onto the head; both are O(1) with no search.","deep":"```c\n#include <stdio.h>\n#include <stddef.h>\n\n#define POOL_BLOCK_SIZE 32\n#define POOL_BLOCK_COUNT 8\n\ntypedef struct pool {\n    unsigned char storage[POOL_BLOCK_COUNT][POOL_BLOCK_SIZE];\n    void *free_list;\n} pool_t;\n\nvoid pool_init(pool_t *p) {\n    p->free_list = NULL;\n    for (int i = POOL_BLOCK_COUNT - 1; i >= 0; i--) {\n        void *block = p->storage[i];\n        *(void **)block = p->free_list;   /* stash next-pointer in the free block itself */\n        p->free_list = block;\n    }\n}\nvoid *pool_alloc(pool_t *p) {\n    if (!p->free_list) return NULL;\n    void *block = p->free_list;\n    p->free_list = *(void **)block;\n    return block;\n}\nvoid pool_free(pool_t *p, void *block) {\n    *(void **)block = p->free_list;\n    p->free_list = block;\n}\n\nint main(void) {\n    pool_t pool;\n    pool_init(&pool);\n    void *blocks[POOL_BLOCK_COUNT + 1];\n    int i;\n    for (i = 0; i < POOL_BLOCK_COUNT; i++) {\n        blocks[i] = pool_alloc(&pool);\n        printf(\"alloc %d -> %s\\n\", i, blocks[i] ? \"ok\" : \"NULL\");\n    }\n    void *overflow = pool_alloc(&pool);\n    printf(\"alloc %d (pool exhausted) -> %s\\n\", i, overflow ? \"ok\" : \"NULL\");\n    pool_free(&pool, blocks[3]);\n    void *reused = pool_alloc(&pool);\n    printf(\"after freeing blocks[3], next alloc reuses it: %s\\n\", reused == blocks[3] ? \"yes\" : \"no\");\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra -g` and run, it printed all 8 allocations as `ok`, the 9th as `NULL` (pool correctly exhausted), and confirmed `blocks[3]` was reused exactly on the next alloc after being freed.","pitfall":"Writing past a block's declared size while it is allocated, which (depending on layout) can corrupt the next free block's stashed pointer even though nothing in the pool's own logic looks wrong.","verify":null,"follow":[{"q":"Why does pool_init walk the array backward (index N-1 down to 0)?","a":"Purely cosmetic here (either direction produces a valid free list); walking backward makes the first pool_alloc return storage[0], which some designs prefer for predictable/debuggable allocation order."},{"q":"Is storing the next-pointer inside the free block itself safe?","a":"Yes, as long as POOL_BLOCK_SIZE >= sizeof(void*) (checked at design time, e.g. via a static assertion), since that memory is guaranteed unused while the block is on the free list; it is never read as a pointer once the block is handed out by alloc."}],"mod":18},{"id":"18.05","level":"Intermediate","type":"Numeric","fig":null,"tags":["pool-sizing","pointer-size"],"q":"For the memory pool in 18.04 (32-byte blocks, 8 blocks), work out the total storage cost and confirm the free-list trick has room to fit.","short":"Total storage is 8 * 32 = 256 bytes for the block array; the free-list trick needs sizeof(void*) = 8 bytes (on this 64-bit platform) of scratch space inside each free block, and 32 >= 8, so every block has 24 bytes of slack beyond the pointer, easily enough, with the pool_t struct itself adding one more pointer field (the free_list head) plus its own alignment padding.","deep":"Worked calculation:\n1. Block array size: `POOL_BLOCK_COUNT * POOL_BLOCK_SIZE` = 8 * 32 = 256 bytes, laid out as one contiguous `unsigned char[8][32]` array.\n2. Per-block overhead for the free-list pointer: `sizeof(void*)`, confirmed as 8 bytes on this platform by compiling and running `printf(\"%zu\\n\", sizeof(void*));`, which printed `8`.\n3. Constraint check: each block must be at least large enough to hold that pointer: 32 >= 8, satisfied with 24 bytes of margin per block for the block's actual payload once allocated (a caller can use up to all 32 bytes once the block is handed out by pool_alloc, since the pointer is only stored there while the block sits on the free list, not while it is in use).\n4. Struct-level overhead: `pool_t` adds one `void *free_list` member (8 more bytes) on top of the 256-byte array, for a total object size of 256 + 8 = 264 bytes before any compiler-inserted padding (the array's own alignment is 1, from `unsigned char`, and the trailing pointer needs 8-byte alignment, so the compiler may insert up to 7 padding bytes between them depending on the array's total size modulo 8; here 256 is already a multiple of 8, so no padding is needed and the real size is exactly 264 bytes).\n5. General formula for capacity planning: total pool bytes = `block_count * block_size + sizeof(void*)` (plus at most `alignof(void*) - 1` padding bytes), and the design constraint is always `block_size >= sizeof(void*)`.","pitfall":"Assuming sizeof(void*) is always 8 across every target; it is implementation-defined and commonly 4 on 32-bit embedded targets, which changes both the minimum viable block size and the struct layout math.","verify":null,"follow":[{"q":"What if a design wanted blocks smaller than sizeof(void*), e.g. 4-byte blocks?","a":"The free-list-inside-the-block trick no longer fits; the free list would need a separate index-based representation (e.g. a bitmap of free/used blocks, or a free list of array indices stored in a separate small array) instead of storing a raw pointer in each block."},{"q":"Does this sizing calculation change on a 32-bit target?","a":"Yes, sizeof(void*) would typically be 4 there instead of 8, loosening the block_size >= sizeof(void*) constraint and changing the struct's total byte count and padding accordingly; always confirm pointer size on the actual target, not assume 8."}],"mod":18},{"id":"18.06","level":"Intermediate","type":"Scenario","fig":"ringbuffer","tags":["ring-buffer","power-of-two"],"q":"Implement a real SPSC ring buffer sized as a power of two, with push/pop, and show it correctly filling, emptying, and wrapping.","short":"Keep head and tail as plain unsigned counters that only ever increase; mask each with (CAPACITY - 1) to get the actual array index, and compute fullness as (head - tail) so the code never needs an explicit wrap-around branch.","deep":"```c\n#include <stdio.h>\n#include <stdbool.h>\n\n#define RB_CAPACITY 8   /* must be a power of two */\n\ntypedef struct {\n    int      buf[RB_CAPACITY];\n    unsigned head;   /* next slot to write (producer) */\n    unsigned tail;   /* next slot to read  (consumer) */\n} ring_t;\n\nvoid rb_init(ring_t *rb) { rb->head = 0; rb->tail = 0; }\nstatic unsigned rb_count(const ring_t *rb) { return rb->head - rb->tail; }\nbool rb_full(const ring_t *rb)  { return rb_count(rb) == RB_CAPACITY; }\nbool rb_empty(const ring_t *rb) { return rb->head == rb->tail; }\n\nbool rb_push(ring_t *rb, int v) {\n    if (rb_full(rb)) return false;\n    rb->buf[rb->head & (RB_CAPACITY - 1)] = v;   /* mask replaces % for power-of-two size */\n    rb->head++;\n    return true;\n}\nbool rb_pop(ring_t *rb, int *out) {\n    if (rb_empty(rb)) return false;\n    *out = rb->buf[rb->tail & (RB_CAPACITY - 1)];\n    rb->tail++;\n    return true;\n}\n\nint main(void) {\n    ring_t rb;\n    rb_init(&rb);\n    for (int i = 0; i < RB_CAPACITY; i++) printf(\"push %d -> %s\\n\", i, rb_push(&rb, i) ? \"ok\" : \"full\");\n    printf(\"push %d -> %s (should be full)\\n\", RB_CAPACITY, rb_push(&rb, RB_CAPACITY) ? \"ok\" : \"full\");\n    int v;\n    for (int i = 0; i < 3; i++) { rb_pop(&rb, &v); printf(\"pop -> %d\\n\", v); }\n    for (int i = 0; i < 3; i++) rb_push(&rb, 100 + i);\n    printf(\"count after wrap-around pushes = %u\\n\", rb_count(&rb));\n    while (rb_pop(&rb, &v)) printf(\"drain -> %d\\n\", v);\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra -g` and run, it filled all 8 slots, correctly reported the 9th push as `full`, popped 0/1/2, pushed 100/101/102 into the freed slots (wrapping the index past the array's physical end back to the front), reported `count after wrap-around pushes = 8` (full again), and drained 3,4,5,6,7,100,101,102 in exact FIFO order.","pitfall":"Reserving no distinction between \"head==tail means empty\" and \"head==tail means full\" by using masked indices directly as the comparison instead of the unmasked, ever-increasing counters; 18.07 shows exactly the bug that causes.","verify":null,"follow":[{"q":"Why is rb_count computed as head - tail (unsigned subtraction) instead of an if/else on which is larger?","a":"Because head and tail are unsigned and only ever increase (never reset), unsigned subtraction wraps correctly even once head has numerically wrapped past tail at the 2^32 boundary, giving the correct count with no branch; this only works because both counters are the same unsigned width and neither is ever decremented or reset independently."},{"q":"What is the largest usable capacity with this exact head/tail scheme?","a":"Any power of two up to half the counter type's range is safe in the sense that rb_count's result stays unambiguous; in practice firmware ring buffers use capacities far smaller than that limit, so it is rarely the binding constraint."}],"mod":18},{"id":"18.07","level":"Intermediate","type":"Trap","fig":null,"tags":["ring-buffer","full-empty-ambiguity"],"q":"A ring buffer implementation compares masked head/tail indices directly to detect full and empty, and it silently wastes one slot of capacity. What is happening?","short":"If both \"empty\" and \"full\" are detected by comparing head and tail after masking into [0, CAPACITY), the two states become indistinguishable at head==tail, so the common workaround is to declare the buffer full one slot early (when advancing head would make it equal tail), which correctly avoids the ambiguity but silently caps real usable capacity at CAPACITY-1, not CAPACITY.","deep":"```c\n#include <stdio.h>\n#include <stdbool.h>\n#define CAP 4\ntypedef struct { int buf[CAP]; unsigned head, tail; } naive_rb_t;\nbool push(naive_rb_t *rb, int v) {\n    unsigned next = (rb->head + 1) % CAP;\n    if (next == rb->tail) return false;  /* reserves 1 slot to keep full != empty */\n    rb->buf[rb->head] = v;\n    rb->head = next;\n    return true;\n}\nbool pop(naive_rb_t *rb, int *out) {\n    if (rb->head == rb->tail) return false;  /* empty */\n    *out = rb->buf[rb->tail];\n    rb->tail = (rb->tail + 1) % CAP;\n    return true;\n}\nint main(void) {\n    naive_rb_t rb = {0};\n    int accepted = 0;\n    for (int i = 0; i < CAP; i++) accepted += push(&rb, i);\n    printf(\"pushed %d of %d requested (capacity looks like %d, not %d)\\n\", accepted, CAP, CAP - 1, CAP);\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra -g` and run, it printed `pushed 3 of 4 requested (capacity looks like 3, not 4)`, confirming the array declared with 4 slots only ever holds 3 items at once with this scheme, because the 4th push would make `next == tail`, which the code must reject to keep \"full\" distinguishable from \"empty\" using only masked-index comparison.\nThe two standard fixes: (1) accept the wasted slot (declare the true usable capacity as CAP-1 from the start, which is simple and what most embedded ring buffers actually do), or (2) track head/tail as ever-increasing unsigned counters and mask only at the point of array indexing, as in 18.06, which uses `head - tail` (unmasked) for the count/full/empty checks and therefore wastes no slot at all.","pitfall":"Sizing a ring buffer's CAP to exactly the number of items a producer burst is expected to need, using the naive modulo scheme, and then discovering in the field that the true usable capacity is one less than planned.","verify":null,"follow":[{"q":"Why does 18.06's scheme not need to waste a slot?","a":"Because it compares the unmasked, ever-increasing head and tail counters (not the masked array indices) to determine count/full/empty, so head==tail unambiguously means empty and head-tail==CAPACITY unambiguously means full, with no state that could mean both."},{"q":"Is wasting one slot ever the better engineering choice anyway?","a":"Sometimes, for simplicity or when porting from a reference implementation that already does it; the real requirement is that whichever scheme is chosen, the actual usable capacity is documented correctly, since silently getting CAP-1 when a caller assumed CAP is a capacity-planning bug waiting to surface as unexpected drops."}],"mod":18},{"id":"18.08","level":"Advanced","type":"Cross-layer","fig":null,"tags":["memory-ordering","threads"],"q":"Is the SPSC ring buffer from 18.06 safe if the producer and consumer run on different CPU cores, not just different execution contexts on one core?","short":"The single-writer-per-index property (only the producer writes head, only the consumer writes tail) still holds, but on truly separate cores you additionally need a memory-ordering guarantee that a slot's data write becomes visible to the other core before that side's index update becomes visible, which plain C11 volatile/sig_atomic_t does not provide by itself; that cross-core visibility question is the C Advanced page's memory-ordering/atomics territory, not this page's.","deep":"- On a single core (one producer context and one consumer context that never truly run simultaneously, e.g. an ISR and the main loop on the same core), the compiler-ordering guarantees this page already covers (volatile forcing real, ordered accesses, per module 17) are enough: the ISR either has not run yet or has fully finished by the time the main loop observes its updated head, because they cannot be mid-execution at the same instant on one core.\n- On separate cores running truly concurrently, a plain, non-atomic write to `head` and a plain read of it on another core have no standard C11 guarantee about when (or even whether, from an optimizer's perspective) that write becomes visible to the other core; this is a hardware/memory-model question (cache coherency, memory barriers/fences) layered on top of, not replaced by, the C language's own sequencing rules.\n- The correct multi-core version of this same ring buffer typically uses C11 `_Atomic` head/tail with explicit acquire/release memory ordering (or the target's own barrier intrinsics in a pre-C11/embedded toolchain) so that the consumer's acquire-load of head cannot see a \"new\" head value without also seeing the corresponding slot write that happened-before it. This is exactly the kind of cross-thread memory-ordering design this page's sibling \"C Advanced\" page's concurrency modules cover in depth; this page treats the ring buffer's index/slot-ownership logic (correct on one core, or between compiler-ordered contexts like an ISR and its interrupted code) as the C-language-level contribution, and defers the multi-core memory-model layer to that page.\n- Practically for firmware: an ISR-to-main-loop ring buffer on a single-core microcontroller only needs this page's volatile/ordering treatment; a ring buffer shared between two cores of a multi-core SoC needs the additional atomics/barrier layer, and conflating the two is a common real design mistake.","pitfall":"Assuming a ring buffer that is provably correct for an ISR-and-main-loop pairing on one core is automatically also correct when the same producer/consumer roles are moved onto two separate CPU cores; the index-ownership argument still holds, but a new visibility requirement is added that the single-core version never needed to satisfy.","verify":null,"follow":[{"q":"Does making head and tail volatile fix the multi-core case?","a":"No; volatile only affects compiler-generated reordering/elision at the language level, not the hardware's own memory visibility ordering across cores, which needs actual memory barriers or C11 atomics with the right memory order, not just volatile."},{"q":"Where should a candidate go to study the multi-core-safe version of this exact data structure?","a":"The C Advanced page's memory-ordering and atomics modules, which this page intentionally defers to rather than re-teaching, per this page's own scope."}],"mod":18},{"id":"18.09","level":"Advanced","type":"Debug","fig":null,"tags":["ring-buffer","wrap-bug"],"q":"A ring buffer's push never wraps its head index back into range. Find the bug, show the real corruption it causes, and fix it.","short":"push increments head unconditionally without ever taking it modulo the capacity, so after enough pushes and pops head walks past the array's last valid index and writes out of bounds; because the overwritten memory happens to be the struct's own head/tail/count fields (declared right after buf), the result is silent state corruption rather than an immediate crash.","deep":"Buggy:\n```c\n#include <stdio.h>\n#include <stdbool.h>\n#define CAP 5\ntypedef struct { int buf[CAP]; unsigned head, tail, count; } rb_t;\nbool push(rb_t *rb, int v) {\n    if (rb->count == CAP) return false;\n    rb->buf[rb->head] = v;\n    rb->head = rb->head + 1;      /* BUG: never wraps */\n    rb->count++;\n    return true;\n}\nbool pop(rb_t *rb, int *out) {\n    if (rb->count == 0) return false;\n    *out = rb->buf[rb->tail];\n    rb->tail = (rb->tail + 1) % CAP;\n    rb->count--;\n    return true;\n}\nint main(void) {\n    rb_t rb = {0};\n    int v;\n    for (int i = 0; i < 3; i++) push(&rb, i);   /* head: 0,1,2,3   count=3 */\n    for (int i = 0; i < 2; i++) pop(&rb, &v);   /* tail: 0,1,2     count=1 */\n    push(&rb, 10);  /* buf[3]=10, head=4 */\n    push(&rb, 11);  /* buf[4]=11, head=5 */\n    push(&rb, 12);  /* buf[5]=12 <- out of bounds: head never wrapped */\n    printf(\"head=%u count=%u\\n\", rb.head, rb.count);\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra -g -fsanitize=address` and run, it printed `head=13 count=4` -- not a crash. ASan did not flag it either, because `buf[5]` lands not in a redzone but exactly on the struct's own `head` field, which is declared immediately after `buf[5]` in memory: the write of value 12 into \"buf[5]\" actually overwrote `head` itself with 12, and the very next line's `rb->head = rb->head + 1` then read that just-corrupted value (12) and stored 13, matching the observed output exactly. This is a realistic and dangerous failure mode: a wrap-around bug silently corrupting adjacent state with no fault at all, because the out-of-bounds write happened to land inside the same object rather than past its allocation.\nFixed:\n```c\n#include <stdio.h>\n#include <stdbool.h>\n#define CAP 5\ntypedef struct { int buf[CAP]; unsigned head, tail, count; } rb_t;\nbool push(rb_t *rb, int v) {\n    if (rb->count == CAP) return false;\n    rb->buf[rb->head] = v;\n    rb->head = (rb->head + 1) % CAP;   /* FIX: wrap using modulo capacity */\n    rb->count++;\n    return true;\n}\nbool pop(rb_t *rb, int *out) {\n    if (rb->count == 0) return false;\n    *out = rb->buf[rb->tail];\n    rb->tail = (rb->tail + 1) % CAP;\n    rb->count--;\n    return true;\n}\nint main(void) {\n    rb_t rb = {0};\n    int v;\n    for (int i = 0; i < 3; i++) push(&rb, i);\n    for (int i = 0; i < 2; i++) pop(&rb, &v);\n    push(&rb, 10); push(&rb, 11); push(&rb, 12);\n    printf(\"head=%u count=%u (correctly wrapped)\\n\", rb.head, rb.count);\n    while (pop(&rb, &v)) printf(\"pop -> %d\\n\", v);\n    return 0;\n}\n```\nCompiled and run the same way, it printed `head=1 count=4 (correctly wrapped)` followed by draining `2, 10, 11, 12` in correct order, with no sanitizer report.","pitfall":"Trusting a clean ASan/Valgrind run as proof of ring-buffer correctness; this exact bug corrupts a same-object field silently and triggers neither tool, which is why a design/code review catching the missing modulo matters as much as dynamic testing here.","verify":null,"follow":[{"q":"Why did ASan not catch the buggy version?","a":"The out-of-bounds write landed within the same stack object (rb_t), on another one of its own fields, not past the object's allocated redzone-guarded boundary; ASan's redzones guard the edges of an allocation/object, not internal field boundaries within one object."},{"q":"What review habit would have caught this without running anything?","a":"Noticing that push's index update has no modulo/mask at all while pop's does, an asymmetry between two functions that should both wrap the same way; code review comparing the two side by side, not just reading push in isolation, is the cheap catch here."}],"mod":18},{"id":"18.10","level":"Advanced","type":"Scenario","fig":null,"tags":["pool-allocator","size-classes"],"q":"How would you extend the fixed-block pool allocator to serve a handful of different fixed sizes (size classes) instead of just one?","short":"Run several independent single-size pools side by side (e.g. 16, 32, 64, 128-byte pools), and have a thin front-end alloc function pick the smallest pool whose block size is >= the request, falling back to the next larger pool (or failing) if that size class is exhausted; each pool keeps the exact same O(1) free-list logic from 18.04 internally, so the design only adds a size-class selection step, not new allocation machinery.","deep":"- Structure: one `pool_t`-like instance per size class, each with its own storage array, block size, and free list, exactly as in 18.04; a top-level `multi_pool_alloc(size_t requested_size)` picks the smallest size class with `block_size >= requested_size` and calls that pool's own alloc.\n- Internal fragmentation trade-off to state explicitly: a 20-byte request served from a 32-byte size class wastes 12 bytes inside that block (this is \"internal fragmentation,\" distinct from the cross-block \"external fragmentation\" a general allocator suffers and that fixed-block pools avoid entirely); more size classes reduce internal waste but increase the number of separate pools to size and manage, a direct capacity-planning trade-off.\n- Free must know (or be told) which size class a given pointer belongs to, to push it back onto the right pool's free list; common approaches are storing a small size-class tag just before the returned pointer (a \"header,\" at the cost of a few bytes per allocation and complicating alignment) or requiring the caller to pass the size class back into free explicitly (cheaper, but pushes a correctness burden onto every call site).\n- This is deliberately the same shape as a real-world fixed-size-class allocator design (the kind used in some embedded RTOS memory managers): a small, fixed set of pools rather than one pool, chosen so allocation remains O(1) and bounded while still serving a reasonable range of request sizes without falling back to a general-purpose allocator's unbounded search/coalesce behavior.","pitfall":"Choosing size classes far apart (e.g. 16, 256, 4096 bytes) \"to cover everything with few pools,\" which maximizes internal fragmentation for any request that falls in the wide gaps between classes; real designs tune class sizes to the actual request-size distribution the system produces.","verify":null,"follow":[{"q":"Why not just always allocate from the largest size class to avoid needing a size tag on free?","a":"That defeats the purpose: every allocation would waste space up to the largest block's size regardless of how small the actual request was, giving up exactly the space efficiency multiple size classes exist to provide."},{"q":"Is this design still deterministic/bounded-time like the single-pool version?","a":"Yes, as long as picking the size class itself is O(1) (a small fixed number of size classes checked in order, or a direct lookup) rather than a search over an unbounded or growing set of classes."}],"mod":18},{"id":"18.11","level":"Advanced","type":"Concept","fig":null,"tags":["event-dispatch","callback-table"],"q":"Implement a real generic event/callback dispatch system: register multiple handlers per event type and dispatch to all of them.","short":"A 2D table (event type by handler slot) holds (function pointer, context) pairs; register finds the first empty slot for that event type and fills it, dispatch walks every non-empty slot for the given event type and calls each handler with its own stored context.","deep":"```c\n#include <stdio.h>\n\n#define MAX_HANDLERS 4\n#define EVT_DATA_READY 0\n#define EVT_ERROR      1\n#define EVT_COUNT      2\n\ntypedef void (*event_cb_t)(int event_id, void *ctx);\ntypedef struct { event_cb_t cb; void *ctx; } handler_slot_t;\nstatic handler_slot_t table[EVT_COUNT][MAX_HANDLERS];\n\nint event_register(int event_id, event_cb_t cb, void *ctx) {\n    if (event_id < 0 || event_id >= EVT_COUNT) return -1;\n    for (int i = 0; i < MAX_HANDLERS; i++) {\n        if (table[event_id][i].cb == NULL) {\n            table[event_id][i].cb = cb;\n            table[event_id][i].ctx = ctx;\n            return 0;\n        }\n    }\n    return -1;   /* table full */\n}\nvoid event_dispatch(int event_id) {\n    if (event_id < 0 || event_id >= EVT_COUNT) return;\n    for (int i = 0; i < MAX_HANDLERS; i++) {\n        if (table[event_id][i].cb) table[event_id][i].cb(event_id, table[event_id][i].ctx);\n    }\n}\n\nstatic void on_data_ready(int event_id, void *ctx) { printf(\"handler A: event=%d ctx=%s\\n\", event_id, (const char *)ctx); }\nstatic void on_data_ready2(int event_id, void *ctx) { (void)ctx; printf(\"handler B: event=%d\\n\", event_id); }\n\nint main(void) {\n    event_register(EVT_DATA_READY, on_data_ready, \"sensor1\");\n    event_register(EVT_DATA_READY, on_data_ready2, NULL);\n    event_dispatch(EVT_DATA_READY);\n    event_dispatch(EVT_ERROR);   /* no handlers registered: dispatches nothing, no crash */\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra -g` and run, it printed `handler A: event=0 ctx=sensor1` then `handler B: event=0`, confirming both handlers registered for EVT_DATA_READY ran in registration order, and that dispatching EVT_ERROR (no handlers registered) safely did nothing.","pitfall":"Relying on static (zero-initialized) storage for the table without confirming that in this design NULL is never itself a valid callback value; if some real system used a sentinel other than NULL to mean \"empty,\" the zero-initialization guarantee would not automatically produce it.","verify":null,"follow":[{"q":"Why does event_dispatch check table[event_id][i].cb for NULL before calling it?","a":"Because unused slots start (via static storage's zero-initialization) as NULL function pointers; calling through a NULL function pointer is undefined behavior, so every slot must be checked before being called through."},{"q":"How would you support unregistering a specific handler?","a":"Search for the matching (cb, ctx) pair (or a caller-supplied registration handle/index returned by event_register) and set that slot's cb back to NULL, making it available for a future event_register call again."}],"mod":18},{"id":"18.12","level":"Advanced","type":"Numeric","fig":null,"tags":["alignment","_Alignof","pool-sizing"],"q":"A pool needs to hold a struct with mixed-size members. Work out its size, its alignment requirement, and the padded block size a pool must use.","short":"For struct { uint8_t cmd; uint32_t param; uint16_t seq; }, sizeof is 12 bytes and _Alignof is 4 (dictated by its widest-aligned member, the uint32_t); since 12 is already a multiple of 4, the padded block size a pool should use is also 12 bytes, with no extra rounding needed here.","deep":"```c\n#include <stdio.h>\n#include <stdint.h>\n#include <stddef.h>\ntypedef struct { uint8_t cmd; uint32_t param; uint16_t seq; } record_t;\nint main(void) {\n    printf(\"sizeof(record_t)=%zu  _Alignof(record_t)=%zu\\n\", sizeof(record_t), _Alignof(record_t));\n    size_t block_size = sizeof(record_t);\n    size_t align = _Alignof(record_t);\n    size_t padded_block = ((block_size + align - 1) / align) * align;\n    printf(\"raw block=%zu bytes, rounded up to alignment %zu -> padded block=%zu bytes\\n\", block_size, align, padded_block);\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra -g` and run, it printed `sizeof(record_t)=12  _Alignof(record_t)=4` and `raw block=12 bytes, rounded up to alignment 4 -> padded block=12 bytes`.\nThe math behind why sizeof is 12, not 7 (1+4+2): `cmd` takes 1 byte at offset 0, `param` (a uint32_t) requires 4-byte alignment so the compiler inserts 3 padding bytes before it, placing it at offset 4; `seq` (a uint16_t) needs only 2-byte alignment and fits immediately after `param` at offset 8; the struct's own overall size must be a multiple of its alignment (4, from the widest member), and 8 + 2 = 10 is not a multiple of 4, so 2 trailing padding bytes are added, giving a total of 12 (module 6 covers this padding-and-offset reasoning in full depth). The general rounding formula used above, `((size + align - 1) / align) * align`, is the standard integer round-up-to-a-multiple pattern and is exactly what a pool must apply to its own declared block size if it is choosing a block size independently of `sizeof` a specific struct, to guarantee every block address the pool hands out satisfies that struct's `_Alignof` requirement (6.5.3.4p3 defines `_Alignof` as yielding a type's alignment requirement).","pitfall":"Computing a pool's block size from a struct's member sizes added up by hand (1+4+2=7) instead of trusting sizeof/_Alignof, and under-sizing every block by exactly the padding the compiler actually inserts.","verify":null,"follow":[{"q":"Why must the pool's storage array itself also start at an address that is a multiple of the struct's alignment, not just each block be that many bytes apart?","a":"Because alignment is a property of an address, not just a spacing between blocks; if the array's own base address were misaligned, every block's address would inherit that same misalignment even with correctly-sized/spaced blocks, so the storage array's own declared type or an explicit alignment specifier must guarantee base alignment too."},{"q":"Would using a union of the pool's stored type and a pointer (for the free-list next-pointer trick) ever change this alignment math?","a":"It can only increase the required alignment/size (a union's alignment is the maximum of its members' alignments, and its size is at least the size of its largest member, rounded up to that alignment), never decrease it, so it is a safe way to guarantee both the payload type's and the pointer's alignment needs are met simultaneously by construction."}],"mod":18},{"id":"18.13","level":"Principal","type":"Concept","fig":null,"tags":["allocator-tradeoffs","design-review"],"q":"An interviewer asks you to compare a fixed-block pool allocator against malloc/free for a firmware subsystem. What trade-offs do you state unprompted?","short":"Pool: O(1) bounded alloc/free, no cross-block fragmentation, safe near ISR-adjacent code, but fixed capacity and block sizes decided at design time, with internal fragmentation on undersized requests. malloc/free: flexible sizes and dynamic capacity, but unbounded worst-case time, possible external fragmentation, and generally unsafe from an ISR. It is a determinism-vs-flexibility trade-off, not strictly one being better.","deep":"A Principal-level comparison, stated as trade-offs rather than a verdict:\n- Time complexity and determinism: pool alloc/free are both O(1) with a small, fixed instruction count every single time (pop/push a linked list head); malloc/free's complexity depends on allocator internals (free-list search, possible coalescing, possible OS calls like brk/mmap for growth) and is not guaranteed bounded, which matters directly for real-time/interrupt-adjacent firmware code where a worst-case-time guarantee is often a hard requirement, not a nicety.\n- Fragmentation: a pool cannot fragment across its own blocks (every block is interchangeable), only waste space inside an oversized block relative to a smaller request (internal fragmentation, 18.10); malloc/free can suffer external fragmentation (many small free chunks, too scattered to satisfy a later larger request) after enough varied alloc/free cycles, a failure mode that can appear only after long uptime, making it a poor fit for a device expected to run for months without restart.\n- Capacity planning: a pool's total capacity (N blocks of size S) is fixed at design/init time and must be sized for the worst case the system will ever need concurrently; malloc/free's heap can (within available memory) serve however much is requested at the time, at the cost of that same unpredictability in success/failure and timing.\n- Safety in constrained contexts: a pool's alloc/free have no hidden shared non-reentrant state beyond the pool's own free-list pointer (which the design controls and can make ISR-safe with care), while malloc/free's internal bookkeeping is generally not safe to call from an ISR at all (module 17's reentrancy discussion applies directly).\n- The actual Principal-level answer is a recommendation matched to the subsystem's actual needs, stated explicitly: use a pool (or a small set of size-classed pools, 18.10) for any allocation pattern with a bounded, known-in-advance set of sizes and a hard timing requirement (buffer pools for DMA descriptors, message objects, ISR-queued events); reserve malloc/free for truly variable-size, non-time-critical allocations where flexibility outweighs the loss of determinism, and never mix the two by, for example, letting a pool \"fall back\" to malloc on exhaustion without explicitly re-deriving the timing guarantees that fallback path no longer has.","pitfall":"Presenting the pool allocator as an unconditionally superior design; an interviewer is specifically listening for the stated trade-offs (fixed capacity, internal fragmentation, design-time sizing) alongside the real benefits, not a one-sided pitch.","verify":null,"follow":[{"q":"Is it ever reasonable to use malloc/free during a rarely-hit initialization path even in an otherwise pool-only firmware design?","a":"Often yes, since a one-time, non-time-critical startup allocation does not carry the same real-time/ISR-safety requirements as steady-state operation; the key is being explicit that this specific call site is exempt from the rest of the system's determinism guarantee, not silently mixing allocators without that distinction being documented."},{"q":"What would make you choose several size-classed pools over one large-block pool instead of malloc/free?","a":"When the actual request-size distribution is known and clustered into a few common sizes (18.10), several size classes reclaim most of the space efficiency a general allocator would otherwise be needed for, while keeping every allocation's timing bounded, unlike malloc/free."}],"mod":18},{"id":"18.14","level":"Principal","type":"Scenario","fig":null,"tags":["logging-pipeline","integration-design"],"q":"Design a full pipeline: an ISR producing events, a ring buffer carrying them, and a consumer task dispatching them through a callback table, end to end.","short":"The ISR does the minimum -- read the hardware event, package a small fixed-size record, and push it onto an SPSC ring buffer (18.06) -- then returns; a normal-context consumer task drains that buffer in a loop and calls event_dispatch (18.11) for each popped event, so every registered handler runs outside interrupt context, with a pool allocator (18.01/18.04) available for payloads too large to fit inline.","deep":"End-to-end design, stating each junction's own contract explicitly (the way a Principal design review expects):\n1. Producer side (ISR): on the hardware interrupt, read whatever registers/state describe the event (module 17's volatile MMIO access), fill a small fixed-size `struct event { int type; uint32_t data; }` (or similar, sized to fit the ring buffer's element type directly, no dynamic allocation inside the ISR since that would violate module 17's ISR-safety rules), and call `rb_push` on the shared ring buffer. If `rb_push` returns false (buffer full), the ISR must have an explicit, decided policy -- drop the event and increment a dropped-event counter is the usual firmware choice, never block waiting for space, since blocking in an ISR is itself the violation module 17 warns against.\n2. The ring buffer's contract: single producer (only this ISR writes head), single consumer (only the consumer task writes tail), fixed capacity sized generously enough (from a measured or worst-case event rate) that the drop path is rare in practice, not a normal-case behavior.\n3. Consumer side (normal-context task, e.g. the main loop or an RTOS task): loop calling `rb_pop`; for each popped event, call `event_dispatch(event.type)` (extended if needed to also pass `event.data` through to each handler) so every handler registered for that event type runs here, in normal context, free to call printf, malloc, take locks, or do anything else module 17 forbids inside the ISR itself.\n4. If an event's payload does not fit inline in the fixed-size ring buffer element (e.g. a variable-length log message), do not grow the ring buffer element size to the worst case; instead have the ISR pull a fixed-size block from a memory pool (18.01/18.04) sized for the common payload case, fill it, and push only a pointer/handle to that block through the ring buffer; the consumer task, after processing, returns the block to the pool. This keeps the ring buffer's element size small and fast while still supporting larger payloads through the pool's own fixed-size (and therefore ISR-safe, O(1)) alloc/free.\n5. State the capacity/latency trade-offs explicitly, unprompted: ring buffer capacity bounds how many events can be \"in flight\" between an ISR burst and the consumer task getting scheduled; pool capacity bounds how many larger payloads can be in flight simultaneously; both are finite, both need sizing against a measured or worst-case burst rate, and both need an explicit, tested drop/reject policy for the case where that sizing is exceeded, rather than an unhandled failure path discovered later in the field.\n6. Testing this design end to end means exercising all three failure edges deliberately: ring buffer full (verify drop-and-count behavior, not corruption), pool exhausted (verify the ISR's fallback, e.g. drop the oversized-payload event while still delivering the fixed-size ring buffer record if the design allows a \"payload missing\" event), and normal steady-state throughput (verify the consumer task keeps up with the measured worst-case event rate with margin).","pitfall":"Sizing the ring buffer and the pool independently without reasoning about their combined worst case (a burst that fills both simultaneously), then discovering in the field that events are dropped at a lower real event rate than either capacity number alone would suggest.","verify":null,"follow":[{"q":"Why must the ISR's drop policy on a full ring buffer be an explicit design decision rather than left as \"whatever rb_push happens to return\"?","a":"Because silently dropping data has real system consequences (a missed sensor reading, an undercounted error) that a review needs to sign off on knowingly, and because the alternative (blocking) is unacceptable in an ISR, an explicit, documented drop-and-count policy is the only remaining safe choice, not a default to fall into unexamined."},{"q":"Could the consumer task itself be another interrupt handler instead of normal context?","a":"Only if every registered event handler is itself ISR-safe per module 17's rules, which defeats much of the point of deferring work out of interrupt context in the first place; the standard reason to build this whole pipeline is precisely to let handler logic run in normal context."}],"mod":18},{"id":"18.15","level":"Principal","type":"Trap","fig":null,"tags":["ring-buffer","capacity-review"],"q":"In a design review, a ring buffer is declared with CAPACITY = 100 \"so it can hold at least 100 events,\" using the power-of-two masking scheme from 18.06. What should you flag immediately?","short":"The masking scheme (index & (CAPACITY - 1)) is only correct when CAPACITY is a power of two; 100 is not, so the mask silently computes wrong indices (aliasing multiple logical slots onto the same array slot) instead of failing to compile or crashing obviously, which is exactly the kind of review-time catch that prevents a very hard-to-diagnose field bug.","deep":"Why this specific mistake is dangerous rather than just wrong:\n- `index & (100 - 1)` is `index & 99` (binary 0110 0011), which does not mask cleanly into `[0, 100)` the way it would for a power of two like 128 (`index & 127`, cleanly `[0, 128)`); for many index values, `index & 99` produces a result that is not even always less than 100 in the way a correct modulo would guarantee, and different index values that a correct `% 100` would map to different slots can collide onto the same masked result, silently aliasing two logically different queue positions onto one array slot.\n- This is worse than an out-of-bounds crash: it produces plausible-looking, in-bounds, wrong results (data from one event overwriting another's slot before it was consumed), which can pass casual testing (low traffic, no observed collision) and then corrupt data intermittently under higher load in the field, matching the exact \"silent corruption, timing/load-dependent\" failure signature module 16 and 17 both warn about for different underlying reasons.\n- The two correct fixes: round the declared capacity up to the next power of two (128 here) and accept the extra headroom, keeping the fast mask; or keep CAPACITY = 100 exactly but switch to true modulo (`index % CAPACITY`) throughout, accepting the slightly higher per-operation cost of a division instead of a mask. Either is correct; silently keeping the mask with a non-power-of-two capacity is the one combination that is wrong.\n- A Principal-level review flags this from reading the two numbers alone (CAPACITY=100, masking scheme in use) without needing to run anything, precisely because \"is CAPACITY a power of two\" is a fast, mechanical, always-worth-checking fact whenever a mask-based ring buffer implementation is reused with a new capacity constant.","pitfall":"Copying a mask-based ring buffer implementation into a new context and changing only the capacity constant to \"whatever number the new use case needs,\" without re-verifying the power-of-two constraint the masking scheme silently depends on.","verify":null,"follow":[{"q":"Why might this bug pass initial testing?","a":"At low, non-colliding traffic patterns the aliasing may never actually cause two live events to land on the same masked slot at overlapping times, so functional tests at light load can pass cleanly while the same code corrupts data under a heavier, more realistic load."},{"q":"Is there a compile-time way to catch \"capacity is not a power of two\" automatically rather than relying on manual review?","a":"Yes, a `static_assert((CAPACITY & (CAPACITY - 1)) == 0, \"capacity must be a power of two\")` at the point CAPACITY is defined turns this exact mistake into a compile error instead of a silent runtime bug, and is good practice to add alongside any mask-based ring buffer implementation."}],"mod":18},{"id":"18.16","level":"Principal","type":"Concept","fig":null,"tags":["interview-method","systems-design"],"q":"What method should you actually follow when presenting a C systems-design answer (like the pool allocator or ring buffer here) at the Principal
