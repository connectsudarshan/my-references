<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C Language — Principal Engineer Interview Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e2036; --bg-panel:#123049; --bg-sidebar:#0a1a2c;
  --line:#2f5578; --line-soft:#1c3852;
  --accent:#ffb454; --accent-dim:#c98e42;
  --text:#e7eef6; --text-dim:#8fa9c2; --text-faint:#5d7995;
  --code-bg:#081422;
  --basic:#9fdf9f; --inter:#7ec8e3; --adv:#ffd479; --prin:#ff9d9d;
  --got:#9fdf9f; --shaky:#ffd479; --missed:#ff9d9d;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
body{
  background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
  background-size:28px 28px;background-attachment:fixed;min-height:100vh;
}
::selection{background:var(--accent);color:#0e2036;}
button{font-family:inherit;}
.app{display:flex;min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{width:310px;flex-shrink:0;background:var(--bg-sidebar);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;}
.sidebar-header{padding:20px 20px 14px;border-bottom:1px solid var(--line);cursor:pointer;}
.sidebar-header .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--accent);margin:0 0 6px;}
.sidebar-header h1{font-size:17px;margin:0 0 10px;font-weight:600;line-height:1.3;}
.stat-row{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--text-dim);}
.stat-row b{color:var(--accent);}
.search-box{padding:12px 16px;border-bottom:1px solid var(--line);}
.search-box input{width:100%;background:var(--bg-panel);border:1px solid var(--line);color:var(--text);
  padding:9px 12px;border-radius:5px;font-family:var(--sans);font-size:13.5px;outline:none;}
.search-box input:focus{border-color:var(--accent);}
.search-box input::placeholder{color:var(--text-faint);}
.filters{padding:8px 16px 10px;border-bottom:1px solid var(--line);}
.filters summary{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--text-faint);cursor:pointer;padding:2px 0 6px;list-style:none;user-select:none;}
.filters summary::-webkit-details-marker{display:none;}
.filters summary::before{content:'▸ ';}
.filters[open] summary::before{content:'▾ ';}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px;}
.chip-label{font-family:var(--mono);font-size:10px;color:var(--text-faint);width:100%;letter-spacing:.06em;}
.chip{font-family:var(--mono);font-size:10.5px;padding:4px 9px;border-radius:12px;border:1px solid var(--line);
  color:var(--text-dim);cursor:pointer;user-select:none;background:transparent;}
.chip:hover{border-color:var(--text-dim);}
.chip.active{background:var(--accent);color:#0e2036;border-color:var(--accent);font-weight:600;}
.chip.lv-Basic.active{background:var(--basic);border-color:var(--basic);}
.chip.lv-Intermediate.active{background:var(--inter);border-color:var(--inter);}
.chip.lv-Advanced.active{background:var(--adv);border-color:var(--adv);}
.chip.lv-Principal.active{background:var(--prin);border-color:var(--prin);}
.nav-groups{flex:1;overflow-y:auto;padding-bottom:30px;}
.grp-h{display:flex;align-items:center;gap:8px;padding:10px 16px 4px;cursor:pointer;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.04em;color:var(--text-dim);user-select:none;}
.grp-h:hover{color:var(--text);}
.grp-h .caret{width:10px;color:var(--text-faint);}
.grp-h .grp-t{flex:1;}
.grp-h .grp-c{color:var(--text-faint);}
.grp.soon .grp-h{cursor:default;opacity:.55;}
.grp.soon .grp-h:hover{color:var(--text-dim);}
.badge-soon{font-size:9px;border:1px solid var(--line);border-radius:3px;padding:1px 5px;color:var(--text-faint);}
.grp-bar{height:3px;margin:0 16px 4px 34px;background:var(--line-soft);border-radius:2px;display:flex;overflow:hidden;}
.grp-bar i{display:block;height:100%;}
.grp-bar i.got{background:var(--got);} .grp-bar i.shaky{background:var(--shaky);} .grp-bar i.missed{background:var(--missed);}
.grp-items{display:none;}
.grp.open .grp-items{display:block;}
.nav-item{padding:6px 16px 6px 20px;cursor:pointer;font-size:12.5px;color:var(--text-dim);border-left:2px solid transparent;
  display:flex;gap:8px;align-items:baseline;line-height:1.35;}
.nav-item .qnum{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);flex-shrink:0;width:30px;}
.nav-item:hover{background:rgba(255,255,255,.03);color:var(--text);}
.nav-item.active{background:rgba(255,180,84,.1);color:var(--accent);border-left-color:var(--accent);}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--text-faint);flex-shrink:0;align-self:center;}
.dot.r-got{background:var(--got);border-color:var(--got);}
.dot.r-shaky{background:var(--shaky);border-color:var(--shaky);}
.dot.r-missed{background:var(--missed);border-color:var(--missed);}
.nav-empty{padding:18px 20px;color:var(--text-faint);font-size:13px;}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{padding:14px 40px;border-bottom:1px solid var(--line);background:rgba(14,32,54,.9);backdrop-filter:blur(6px);
  position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.crumb{font-family:var(--mono);font-size:12px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.crumb .sep{margin:0 6px;color:var(--line);}
.crumb .current{color:var(--accent);}
.tools{display:flex;gap:8px;align-items:center;}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;}
.seg button{background:var(--bg-panel);color:var(--text-dim);border:0;padding:6px 11px;cursor:pointer;font-family:var(--mono);font-size:11.5px;}
.seg button.on{background:var(--accent);color:#0e2036;font-weight:600;}
.btn{background:var(--bg-panel);border:1px solid var(--line);color:var(--text);border-radius:5px;padding:7px 14px;cursor:pointer;
  font-family:var(--mono);font-size:12px;}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.btn:disabled{opacity:.3;cursor:default;}
.btn.primary{background:var(--accent);color:#0e2036;border-color:var(--accent);font-weight:600;}
.btn.primary:hover:not(:disabled){background:#ffc474;color:#0e2036;}
.btn.ghost{background:transparent;}
.menu-btn{display:none;}
.content{padding:36px 56px 110px;max-width:940px;width:100%;}

/* ---------- Home ---------- */
.hero h2{font-size:32px;margin:0 0 8px;font-weight:700;letter-spacing:-.01em;}
.hero p{color:var(--text-dim);line-height:1.7;font-size:15.5px;margin:0 0 22px;max-width:720px;}
.stat-boxes{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px;}
.stat-box{background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:6px;padding:12px 18px;min-width:120px;}
.stat-box .n{font-family:var(--mono);font-size:24px;color:var(--accent);font-weight:600;}
.stat-box .l{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
.pstack{height:12px;border-radius:6px;background:var(--line-soft);display:flex;overflow:hidden;margin:6px 0 8px;}
.pstack i{display:block;height:100%;}
.pstack i.got{background:var(--got);} .pstack i.shaky{background:var(--shaky);} .pstack i.missed{background:var(--missed);}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-bottom:22px;}
.legend span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--text-faint);}
.legend .g::before{background:var(--got);} .legend .s::before{background:var(--shaky);} .legend .m::before{background:var(--missed);}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:34px;}
.h-label{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--accent-dim);margin:34px 0 14px;display:flex;align-items:center;gap:10px;}
.h-label::after{content:'';flex:1;height:1px;background:var(--line);}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;}
.mod-card{background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:6px;padding:14px 16px;cursor:pointer;
  transition:border-color .12s,transform .12s;}
.mod-card:hover{border-color:var(--accent);transform:translateY(-1px);}
.mod-card .mn{font-family:var(--mono);font-size:11px;color:var(--accent);margin-bottom:4px;}
.mod-card .mt{font-weight:600;font-size:14.5px;margin-bottom:6px;line-height:1.35;}
.mod-card .md{font-size:12.5px;color:var(--text-dim);line-height:1.5;margin-bottom:10px;}
.mod-card .mc{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);display:flex;justify-content:space-between;margin-top:6px;}
.mod-card.soon{border-style:dashed;opacity:.6;cursor:default;}
.mod-card.soon:hover{border-color:var(--line-soft);transform:none;}
.mod-card .pstack{height:5px;margin:0;}
.rounds{width:100%;border-collapse:collapse;font-size:13px;}
.rounds th,.rounds td{padding:7px 10px;border-bottom:1px solid var(--line-soft);text-align:left;}
.rounds th{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);letter-spacing:.06em;font-weight:500;}

/* ---------- Question ---------- */
.q-meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;padding:3px 9px;border-radius:3px;font-weight:600;}
.badge.lv-Basic{background:rgba(159,223,159,.15);color:var(--basic);}
.badge.lv-Intermediate{background:rgba(126,200,227,.15);color:var(--inter);}
.badge.lv-Advanced{background:rgba(255,212,121,.15);color:var(--adv);}
.badge.lv-Principal{background:rgba(255,157,157,.15);color:var(--prin);}
.badge.ty{border:1px solid var(--line);color:var(--text-dim);font-weight:500;}
.q-id{font-family:var(--mono);font-size:12px;color:var(--text-faint);}
.q-title{font-size:23px;font-weight:600;margin:0 0 22px;line-height:1.4;}
.reveal-box{border:1.5px dashed var(--line);border-radius:8px;padding:34px 24px;text-align:center;background:rgba(18,48,73,.5);}
.reveal-box p{margin:0 0 16px;color:var(--text-dim);font-size:14.5px;line-height:1.6;}
.reveal-box .kbd{margin-top:12px;font-family:var(--mono);font-size:11px;color:var(--text-faint);}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-radius:3px;padding:1px 5px;color:var(--text-dim);background:var(--bg-panel);}
.short-box{background:var(--bg-panel);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;padding:16px 20px;margin:0 0 6px;
  font-size:16px;line-height:1.7;}
.sec-label{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--accent-dim);margin:30px 0 12px;display:flex;align-items:center;gap:10px;}
.sec-label::after{content:'';flex:1;height:1px;background:var(--line);}
.deep{font-size:15px;line-height:1.75;}
.deep p{margin:0 0 14px;}
.deep ul,.deep ol{margin:0 0 14px;padding-left:22px;}
.deep li{margin-bottom:5px;}
.deep li>ul,.deep li>ol{margin:6px 0 4px;}
code{font-family:var(--mono);background:var(--code-bg);padding:1px 6px;border-radius:3px;font-size:.88em;color:#ffd479;}
pre.term{background:var(--code-bg);border:1px solid var(--line-soft);border-radius:6px;padding:14px 18px;overflow-x:auto;margin:0 0 16px;}
pre.term code{background:transparent;padding:0;color:var(--text);font-size:12.5px;line-height:1.6;}
.deep table{border-collapse:collapse;margin:0 0 16px;font-size:13.5px;width:100%;display:block;overflow-x:auto;}
.deep th,.deep td{border:1px solid var(--line-soft);padding:7px 11px;text-align:left;vertical-align:top;}
.deep th{background:var(--bg-panel);font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--accent-dim);white-space:nowrap;}
.fig{margin:6px 0 18px;background:rgba(8,20,34,.7);border:1px solid var(--line-soft);border-radius:8px;padding:14px 16px 10px;}
.fig-title{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--accent-dim);margin-bottom:8px;}
.fig figcaption{font-size:12.5px;color:var(--text-dim);margin-top:8px;line-height:1.55;}
.fig svg{width:100%;height:auto;display:block;}
.fig svg text{font-family:var(--mono);font-size:12px;fill:var(--text);}
.fig svg .d{fill:var(--text-dim);} .fig svg .f{fill:var(--text-faint);} .fig svg .s{font-size:10.5px;} .fig svg .xs{font-size:9.5px;} .fig svg .h{font-weight:600;}
.fig svg .lg{font-size:14px;} .fig svg .ac{fill:var(--accent);} .fig svg .gr{fill:var(--basic);} .fig svg .cy{fill:var(--inter);} .fig svg .rd{fill:var(--prin);}
.fig svg .box{fill:var(--bg-panel);stroke:var(--line);stroke-width:1.5;}
.fig svg .tl{fill:rgba(255,180,84,.14);stroke:var(--accent);stroke-width:1.5;}
.fig svg .dl{fill:rgba(126,200,227,.14);stroke:#7ec8e3;stroke-width:1.5;}
.fig svg .pl{fill:rgba(159,223,159,.14);stroke:#9fdf9f;stroke-width:1.5;}
.fig svg .er{fill:rgba(255,157,157,.14);stroke:#ff9d9d;stroke-width:1.5;}
.fig svg .grp{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4;}
.fig svg .ln{stroke:var(--line);stroke-width:1.5;fill:none;}
.fig svg .lna{stroke:var(--accent);stroke-width:2;fill:none;}
.fig svg .lnc{stroke:#7ec8e3;stroke-width:2;fill:none;}
.fig svg .lng{stroke:#9fdf9f;stroke-width:2;fill:none;}
.fig svg .lnr{stroke:#ff9d9d;stroke-width:2;fill:none;}
.fig svg .lnd{stroke:var(--text-dim);stroke-width:1.3;fill:none;stroke-dasharray:5 4;}
.fig svg .ah{fill:var(--accent);} .fig svg .ahc{fill:#7ec8e3;} .fig svg .ahd{fill:var(--text-dim);} .fig svg .ahr{fill:#ff9d9d;}
.fu{border:1px solid var(--line-soft);border-radius:6px;margin-bottom:8px;background:rgba(18,48,73,.5);}
.fu summary{padding:10px 14px;cursor:pointer;font-size:14px;line-height:1.5;list-style:none;display:flex;gap:10px;}
.fu summary::-webkit-details-marker{display:none;}
.fu summary::before{content:'?';font-family:var(--mono);color:var(--accent);font-weight:700;}
.fu[open] summary{color:var(--accent);}
.fu .fa{padding:0 14px 12px 34px;font-size:14px;line-height:1.65;color:var(--text);}
.callout{border-radius:6px;padding:13px 16px;margin:18px 0 0;font-size:14px;line-height:1.65;}
.callout b{font-family:var(--mono);font-size:11px;letter-spacing:.08em;display:block;margin-bottom:3px;}
.callout.pit{background:rgba(255,157,157,.08);border:1px solid rgba(255,157,157,.35);}
.callout.pit b{color:var(--prin);}
.callout.ver{background:rgba(255,212,121,.06);border:1px dashed rgba(255,212,121,.55);}
.callout.ver b{color:var(--adv);}
.notes{width:100%;min-height:70px;background:var(--code-bg);border:1px solid var(--line-soft);border-radius:6px;color:var(--text);
  padding:10px 12px;font-family:var(--sans);font-size:13.5px;resize:vertical;outline:none;}
.notes:focus{border-color:var(--accent);}
.rate-bar{position:sticky;bottom:0;margin:30px -56px 0;padding:14px 56px;background:rgba(10,26,44,.94);backdrop-filter:blur(6px);
  border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.rate-bar .lbl{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-right:4px;}
.rbtn{border:1.5px solid var(--line);background:var(--bg-panel);color:var(--text);border-radius:6px;padding:9px 18px;cursor:pointer;font-size:14px;font-weight:600;}
.rbtn small{font-family:var(--mono);font-weight:400;color:var(--text-faint);margin-left:6px;}
.rbtn.got:hover,.rbtn.got.sel{border-color:var(--got);background:rgba(159,223,159,.15);color:var(--got);}
.rbtn.shaky:hover,.rbtn.shaky.sel{border-color:var(--shaky);background:rgba(255,212,121,.15);color:var(--shaky);}
.rbtn.missed:hover,.rbtn.missed.sel{border-color:var(--missed);background:rgba(255,157,157,.15);color:var(--missed);}
.rate-bar .sp{flex:1;}
.footer-nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;}
.footer-nav .btn{min-width:110px;}

/* ---------- Mock ---------- */
.setup-grid{display:grid;gap:22px;}
.setup-grid .chip-row .chip{font-size:12px;padding:6px 12px;}
.mock-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-family:var(--mono);font-size:12px;color:var(--text-dim);gap:10px;flex-wrap:wrap;}
.mock-head b{color:var(--accent);}
.mock-prog{height:4px;background:var(--line-soft);border-radius:2px;margin-bottom:22px;overflow:hidden;}
.mock-prog i{display:block;height:100%;background:var(--accent);}
.sum-list{list-style:none;margin:0;padding:0;}
.sum-list li{padding:8px 12px;border:1px solid var(--line-soft);border-radius:5px;margin-bottom:6px;background:rgba(18,48,73,.5);cursor:pointer;display:flex;gap:10px;font-size:13.5px;}
.sum-list li:hover{border-color:var(--accent);}
.modlist{list-style:none;margin:0;padding:0;}
.modlist li{display:flex;gap:10px;align-items:baseline;padding:9px 12px;border:1px solid var(--line-soft);border-radius:5px;margin-bottom:6px;background:rgba(18,48,73,.5);cursor:pointer;font-size:14px;}
.modlist li:hover{border-color:var(--accent);}
.modlist .qn{font-family:var(--mono);font-size:11px;color:var(--text-faint);width:34px;flex-shrink:0;}
.modlist .qt{flex:1;}
.empty{color:var(--text-dim);padding:30px;border:1px dashed var(--line);border-radius:8px;text-align:center;line-height:1.7;}

/* ---------- Misc ---------- */
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--bg-panel);border:1px solid var(--accent);color:var(--text);
  padding:10px 18px;border-radius:6px;font-size:13px;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.4);}
.overlay{position:fixed;inset:0;background:rgba(4,10,18,.7);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--bg-sidebar);border:1px solid var(--line);border-radius:8px;padding:22px 24px;max-width:440px;width:100%;}
.modal p{margin:0 0 18px;line-height:1.6;font-size:14.5px;}
.modal .row{display:flex;gap:10px;justify-content:flex-end;}
.warn{border:1px solid rgba(255,212,121,.5);background:rgba(255,212,121,.06);padding:10px 14px;border-radius:6px;font-size:13px;color:var(--adv);margin-bottom:16px;}
::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;} ::-webkit-scrollbar-track{background:transparent;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

@media (max-width:900px){
  .sidebar{position:fixed;left:-330px;top:0;z-index:20;transition:left .2s;width:310px;}
  .sidebar.open{left:0;box-shadow:0 0 40px rgba(0,0,0,.6);}
  .menu-btn{display:inline-block;}
  .topbar{padding:12px 16px;}
  .content{padding:24px 18px 100px;}
  .rate-bar{margin:26px -18px 0;padding:12px 18px;}
  .q-title{font-size:20px;}
  .hero h2{font-size:26px;}
}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar" aria-label="Question navigation">
    <div class="sidebar-header" id="homeLink" title="Back to overview">
      <p class="kicker">C LANGUAGE · INTERVIEW GUIDE</p>
      <h1>Basics to Principal-level</h1>
      <div class="stat-row"><span><b id="statShown">0</b> shown</span><span><b id="statTotal">0</b> total</span><span><b id="statDone">0</b> rated</span></div>
    </div>
    <div class="search-box"><input id="searchInput" type="search" placeholder="Search questions &amp; answers…   ( / )" aria-label="Search questions"></div>

DIAGRAMS.ptrmodel={title:'int *p[4]  vs  int (*p)[4]',cap:'Left: an array of pointers, each slot free to point anywhere. Right: a single pointer whose step size is an entire int[4] row, which is exactly what a 2D array decays to.',svg:`<svg viewBox="0 0 760 400" role="img" aria-label="int star p bracket 4 versus int paren star p paren bracket 4"><title>int star p bracket 4 versus int paren star p paren bracket 4</title><text class="h" x="190" y="22" text-anchor="middle">int *p[4]  --  array of 4 pointers</text><text class="s d" x="190" y="38" text-anchor="middle">each slot points anywhere, independently</text><rect class="dl" x="40" y="55" width="70" height="32" rx="6" /><text class="s h" x="75" y="76" text-anchor="middle">p[0]</text><rect class="dl" x="40" y="100" width="70" height="32" rx="6" /><text class="s h" x="75" y="121" text-anchor="middle">p[1]</text><rect class="dl" x="40" y="145" width="70" height="32" rx="6" /><text class="s h" x="75" y="166" text-anchor="middle">p[2]</text><rect class="dl" x="40" y="190" width="70" height="32" rx="6" /><text class="s h" x="75" y="211" text-anchor="middle">p[3]</text><line class="lna" x1="110" y1="71" x2="252.0" y2="73.8"/><polygon class="ah" points="260.0,74.0 250.9,78.3 251.1,69.3"/><rect class="pl" x="260" y="60" width="46" height="28" rx="6" /><text class="s h" x="283" y="79" text-anchor="middle">a</text><line class="lna" x1="110" y1="116" x2="292.2" y2="162.0"/><polygon class="ah" points="300.0,164.0 290.2,166.2 292.4,157.4"/><rect class="pl" x="300" y="150" width="46" height="28" rx="6" /><text class="s h" x="323" y="169" text-anchor="middle">b</text><line class="lna" x1="110" y1="161" x2="233.3" y2="239.7"/><polygon class="ah" points="240.0,244.0 230.0,242.9 234.8,235.4"/><rect class="pl" x="240" y="230" width="46" height="28" rx="6" /><text class="s h" x="263" y="249" text-anchor="middle">c</text><line class="lna" x1="110" y1="206" x2="312.8" y2="300.6"/><polygon class="ah" points="320.0,304.0 309.9,304.3 313.7,296.1"/><rect class="pl" x="320" y="290" width="46" height="28" rx="6" /><text class="s h" x="343" y="309" text-anchor="middle">d</text><text class="xs d" x="190" y="350" text-anchor="middle">scattered ints, unrelated addresses</text><line class="lnd" x1="380" y1="10" x2="380" y2="400"/><text class="h" x="570" y="22" text-anchor="middle">int (*prow)[4]  --  one pointer to an int[4]</text><text class="s d" x="570" y="38" text-anchor="middle">arithmetic unit = whole row (16 bytes)</text><rect class="dl" x="430" y="60" width="60" height="34" rx="6" /><text class="s" x="460.0" y="82" text-anchor="middle">1</text><rect class="dl" x="490" y="60" width="60" height="34" rx="6" /><text class="s" x="520.0" y="82" text-anchor="middle">2</text><rect class="dl" x="550" y="60" width="60" height="34" rx="6" /><text class="s" x="580.0" y="82" text-anchor="middle">3</text><rect class="dl" x="610" y="60" width="60" height="34" rx="6" /><text class="s" x="640.0" y="82" text-anchor="middle">4</text><text class="xs d" x="422" y="82" text-anchor="end">row0</text><rect class="box" x="430" y="94" width="60" height="34" rx="6" /><text class="s" x="460.0" y="116" text-anchor="middle">5</text><rect class="box" x="490" y="94" width="60" height="34" rx="6" /><text class="s" x="520.0" y="116" text-anchor="middle">6</text><rect class="box" x="550" y="94" width="60" height="34" rx="6" /><text class="s" x="580.0" y="116" text-anchor="middle">7</text><rect class="box" x="610" y="94" width="60" height="34" rx="6" /><text class="s" x="640.0" y="116" text-anchor="middle">8</text><text class="xs d" x="422" y="116" text-anchor="end">row1</text><rect class="box" x="430" y="128" width="60" height="34" rx="6" /><text class="s" x="460.0" y="150" text-anchor="middle">9</text><rect class="box" x="490" y="128" width="60" height="34" rx="6" /><text class="s" x="520.0" y="150" text-anchor="middle">10</text><rect class="box" x="550" y="128" width="60" height="34" rx="6" /><text class="s" x="580.0" y="150" text-anchor="middle">11</text><rect class="box" x="610" y="128" width="60" height="34" rx="6" /><text class="s" x="640.0" y="150" text-anchor="middle">12</text><text class="xs d" x="422" y="150" text-anchor="end">row2</text><line class="lna" x1="410" y1="77" x2="418.0" y2="77.0"/><polygon class="ah" points="426.0,77.0 417.0,81.5 417.0,72.5"/><text class="s h ac" x="400" y="72" text-anchor="end">prow</text><line class="lnc" x1="410" y1="111" x2="418.0" y2="111.0"/><polygon class="ahc" points="426.0,111.0 417.0,115.5 417.0,106.5"/><text class="s cy" x="680" y="106" text-anchor="start">prow++</text><text class="xs d" x="680" y="120" text-anchor="start">+16 bytes</text><text class="s d" x="570" y="202" text-anchor="middle">matrix[3][4] laid out row-major, contiguous</text><text class="xs d" x="570" y="218" text-anchor="middle">prow[1][2] = 7 ; after prow++, prow[0][0] = 5</text></svg>`};
DIAGRAMS.strlayout={title:'Where a string literal lives',cap:'lit1 and lit2 may both point at one shared read-only object; writing through either is undefined behavior. char arr[] instead owns a private, writable copy made at initialization.',svg:`<svg viewBox="0 0 760 380" role="img" aria-label="String literal storage versus a writable array copy"><title>String literal storage versus a writable array copy</title><text class="s" x="20" y="24" text-anchor="start">char *lit1 = "hello";  char *lit2 = "hello";</text><text class="s" x="20" y="40" text-anchor="start">char arr[] = "hello";</text><rect class="dl" x="60" y="70" width="90" height="30" rx="6" /><text class="s h" x="105" y="90" text-anchor="middle">lit1</text><rect class="dl" x="60" y="112" width="90" height="30" rx="6" /><text class="s h" x="105" y="132" text-anchor="middle">lit2</text><rect class="pl" x="60" y="220" width="90" height="30" rx="6" /><text class="s h" x="105" y="240" text-anchor="middle">arr</text><line class="lna" x1="150" y1="85" x2="322.0" y2="85.0"/><polygon class="ah" points="330.0,85.0 321.0,89.5 321.0,80.5"/><line class="lna" x1="150" y1="127" x2="322.1" y2="101.2"/><polygon class="ah" points="330.0,100.0 321.8,105.8 320.4,96.9"/><rect class="er" x="330" y="60" width="200" height="55" rx="6" /><text class="s h" x="430" y="82" text-anchor="middle">.rodata (read-only)</text><text class="xs d" x="430" y="100" text-anchor="middle">"hello" + NUL -- shared object</text><text class="xs d" x="430" y="130" text-anchor="middle">lit1 == lit2 : 1 on this toolchain (folded)</text><line class="lnr" x1="535" y1="87" x2="585" y2="87"/><text class="s rd" x="592" y="91" text-anchor="start">lit1[0]='H';</text><text class="xs rd" x="592" y="107" text-anchor="start">UB: crashes here</text><line class="lng" x1="150" y1="235" x2="322.0" y2="235.0"/><polygon class="ah" points="330.0,235.0 321.0,239.5 321.0,230.5"/><rect class="pl" x="330" y="210" width="200" height="55" rx="6" /><text class="s h" x="430" y="232" text-anchor="middle">arr : own writable storage</text><text class="xs d" x="430" y="250" text-anchor="middle">"hello" + NUL -- private copy</text><line class="lng" x1="535" y1="237" x2="585" y2="237"/><text class="s gr" x="592" y="231" text-anchor="start">arr[0]='H';</text><text class="xs d" x="592" y="247" text-anchor="start">fine: owns its bytes</text><text class="s d" x="20" y="320" text-anchor="start">A string literal has static duration and may be placed read-only and shared</text><text class="s d" x="20" y="336" text-anchor="start">between identical literals (C11 6.4.5p6-7). Writing through any pointer to it is UB.</text><text class="s d" x="20" y="356" text-anchor="start">char arr[] copies the literal bytes into a fresh, writable object at init time.</text></svg>`};
DIAGRAMS.structpad={title:'struct cmd_header layout',cap:'Byte-by-byte layout on a typical ABI: opcode at 0, one pad byte before nsid (needs 2-byte alignment), cdw2 at 4 with no gap, flags at 8, then 3 trailing pad bytes so sizeof is 12, a multiple of 4.',svg:`<svg viewBox="0 0 760 310" role="img" aria-label="struct cmd_header byte layout with padding"><title>struct cmd_header byte layout with padding</title><rect class="dl" x="40" y="130" width="50" height="56" rx="6" /><text class="s h" x="65.0" y="160" text-anchor="middle">opcode</text><text class="xs d" x="65.0" y="176" text-anchor="middle">1 byte</text><line class="ln" x1="40" y1="130" x2="40" y2="186"/><text class="xs f" x="65.0" y="200" text-anchor="middle">0</text><rect class="grp" x="90" y="130" width="50" height="56" rx="6" /><text class="xs d" x="115.0" y="160" text-anchor="middle">pad</text><line class="ln" x1="90" y1="130" x2="90" y2="186"/><text class="xs f" x="115.0" y="200" text-anchor="middle">1</text><rect class="pl" x="140" y="130" width="100" height="56" rx="6" /><text class="s h" x="190.0" y="160" text-anchor="middle">nsid</text><text class="xs d" x="190.0" y="176" text-anchor="middle">2 bytes</text><line class="ln" x1="140" y1="130" x2="140" y2="186"/><text class="xs f" x="165.0" y="200" text-anchor="middle">2</text><line class="ln" x1="190" y1="130" x2="190" y2="186"/><text class="xs f" x="215.0" y="200" text-anchor="middle">3</text><rect class="tl" x="240" y="130" width="200" height="56" rx="6" /><text class="s h" x="340.0" y="160" text-anchor="middle">cdw2</text><text class="xs d" x="340.0" y="176" text-anchor="middle">4 bytes</text><line class="ln" x1="240" y1="130" x2="240" y2="186"/><text class="xs f" x="265.0" y="200" text-anchor="middle">4</text><line class="ln" x1="290" y1="130" x2="290" y2="186"/><text class="xs f" x="315.0" y="200" text-anchor="middle">5</text><line class="ln" x1="340" y1="130" x2="340" y2="186"/><text class="xs f" x="365.0" y="200" text-anchor="middle">6</text><line class="ln" x1="390" y1="130" x2="390" y2="186"/><text class="xs f" x="415.0" y="200" text-anchor="middle">7</text><rect class="dl" x="440" y="130" width="50" height="56" rx="6" /><text class="s h" x="465.0" y="160" text-anchor="middle">flags</text><text class="xs d" x="465.0" y="176" text-anchor="middle">1 byte</text><line class="ln" x1="440" y1="130" x2="440" y2="186"/><text class="xs f" x="465.0" y="200" text-anchor="middle">8</text><rect class="grp" x="490" y="130" width="150" height="56" rx="6" /><text class="xs d" x="565.0" y="160" text-anchor="middle">pad</text><line class="ln" x1="490" y1="130" x2="490" y2="186"/><text class="xs f" x="515.0" y="200" text-anchor="middle">9</text><line class="ln" x1="540" y1="130" x2="540" y2="186"/><text class="xs f" x="565.0" y="200" text-anchor="middle">10</text><line class="ln" x1="590" y1="130" x2="590" y2="186"/><text class="xs f" x="615.0" y="200" text-anchor="middle">11</text><line class="ln" x1="640" y1="130" x2="640" y2="186"/><line class="lnd" x1="40" y1="120" x2="40" y2="130"/><text class="xs h" x="40" y="114" text-anchor="start">offsetof=0</text><line class="lnd" x1="140" y1="120" x2="140" y2="130"/><text class="xs h" x="140" y="114" text-anchor="start">offsetof=2</text><line class="lnd" x1="240" y1="120" x2="240" y2="130"/><text class="xs h" x="240" y="114" text-anchor="start">offsetof=4</text><line class="lnd" x1="440" y1="120" x2="440" y2="130"/><text class="xs h" x="440" y="114" text-anchor="end">offsetof=8</text><text class="s h" x="20" y="24" text-anchor="start">struct cmd_header { uint8_t opcode; uint16_t nsid; uint32_t cdw2; uint8_t flags; }</text><text class="s d" x="20" y="42" text-anchor="start">nsid needs 2-byte alignment, cdw2 needs 4-byte alignment; struct size is rounded up</text><text class="s d" x="20" y="58" text-anchor="start">to a multiple of its strictest member alignment (4), so total sizeof = 12.</text><line class="ln" x1="40" y1="230" x2="640" y2="230"/><line class="ln" x1="40" y1="224" x2="40" y2="230"/><line class="ln" x1="640" y1="224" x2="640" y2="230"/><text class="s h" x="340.0" y="250" text-anchor="middle">sizeof(struct cmd_header) = 12 bytes</text><text class="s d" x="20" y="270" text-anchor="start">dashed cells = padding: 1 byte before nsid (offset 1),</text><text class="s d" x="20" y="286" text-anchor="start">3 trailing bytes after flags (offsets 9-11) to round size up to 12.</text></svg>`};
DIAGRAMS.memmap={title:'A process address space',cap:'The classic flat layout: code and globals sit low, the heap grows upward from allocations, the stack grows downward from call frames near the top. Real addresses and gaps vary with the OS and ASLR, but this relative order is the common mental model.',svg:`<svg viewBox="0 0 760 460" role="img" aria-label="Process memory map: text, data, bss, heap, stack"><title>Process memory map: text, data, bss, heap, stack</title><line class="ln" x1="130" y1="20" x2="130" y2="390"/><line class="lna" x1="130" y1="390" x2="130.0" y2="392.0"/><polygon class="ah" points="130.0,400.0 125.5,391.0 134.5,391.0"/><text class="xs d" x="130" y="412" text-anchor="middle">low address</text><text class="xs d" x="130" y="14" text-anchor="middle">high address</text><rect class="er" x="150" y="20" width="230" height="90" rx="6" /><text class="s h" x="265" y="70.0" text-anchor="middle">stack</text><text class="s d" x="395" y="69.0" text-anchor="start">locals, return addrs -- grows DOWN as calls nest</text><text class="xs f" x="170" y="144.0" text-anchor="start">(large unmapped gap)</text><line class="ln" x1="125" y1="110" x2="135" y2="110"/><line class="ln" x1="125" y1="170" x2="135" y2="170"/><rect class="pl" x="150" y="170" width="230" height="90" rx="6" /><text class="s h" x="265" y="220.0" text-anchor="middle">heap</text><text class="s d" x="395" y="219.0" text-anchor="start">malloc()/realloc() -- grows UP as you allocate</text><rect class="dl" x="150" y="260" width="230" height="40" rx="6" /><text class="s h" x="265" y="285.0" text-anchor="middle">bss</text><text class="s d" x="395" y="284.0" text-anchor="start">uninitialized globals (zeroed)</text><rect class="dl" x="150" y="300" width="230" height="40" rx="6" /><text class="s h" x="265" y="325.0" text-anchor="middle">data</text><text class="s d" x="395" y="324.0" text-anchor="start">initialized globals</text><rect class="tl" x="150" y="340" width="230" height="50" rx="6" /><text class="s h" x="265" y="370.0" text-anchor="middle">text</text><text class="s d" x="395" y="369.0" text-anchor="start">compiled code (main, functions)</text><polyline class="lnr" points="190,108 190.0,100.0"/><polygon class="ahr" points="190.0,92.0 194.5,101.0 185.5,101.0"/><text class="xs rd" x="142" y="95" text-anchor="start">grows</text><polyline class="lng" points="190,182 190.0,190.0"/><polygon class="ah" points="190.0,198.0 185.5,189.0 194.5,189.0"/><text class="xs gr" x="142" y="205" text-anchor="start">grows</text><text class="s d" x="20" y="434" text-anchor="start">text &lt; data &lt; bss &lt; heap, stack far above -- one common run, x86-64 Linux, ASLR off.</text><text class="s d" x="20" y="450" text-anchor="start">This is an OS/ABI convention, not a C11 rule -- the standard defines only storage durations (6.2.4).</text></svg>`};
DIAGRAMS.bitops={title:'AND / OR / XOR / shift, bit by bit',cap:'a=0xB4, b=0x2F. AND/OR/XOR act on each bit column independently, with no carrying between positions, unlike addition. The shift rows show the same 8 bits after sliding left/right 2 places with zero-fill.',svg:`<svg viewBox="0 0 760 394" role="img" aria-label="Bitwise AND OR XOR and shift worked example"><title>Bitwise AND OR XOR and shift worked example</title><text class="xs f" x="208.0" y="32" text-anchor="middle">7</text><text class="xs f" x="244.0" y="32" text-anchor="middle">6</text><text class="xs f" x="280.0" y="32" text-anchor="middle">5</text><text class="xs f" x="316.0" y="32" text-anchor="middle">4</text><text class="xs f" x="352.0" y="32" text-anchor="middle">3</text><text class="xs f" x="388.0" y="32" text-anchor="middle">2</text><text class="xs f" x="424.0" y="32" text-anchor="middle">1</text><text class="xs f" x="460.0" y="32" text-anchor="middle">0</text><text class="s h" x="178" y="59.0" text-anchor="end">a = 0xB4</text><rect class="dl" x="190" y="40" width="32" height="30" rx="6" /><rect class="box" x="226" y="40" width="32" height="30" rx="6" /><text class="xs f" x="242.0" y="59.0" text-anchor="middle">0</text><rect class="dl" x="262" y="40" width="32" height="30" rx="6" /><rect class="dl" x="298" y="40" width="32" height="30" rx="6" /><rect class="box" x="334" y="40" width="32" height="30" rx="6" /><text class="xs f" x="350.0" y="59.0" text-anchor="middle">0</text><rect class="dl" x="370" y="40" width="32" height="30" rx="6" /><rect class="box" x="406" y="40" width="32" height="30" rx="6" /><text class="xs f" x="422.0" y="59.0" text-anchor="middle">0</text><rect class="box" x="442" y="40" width="32" height="30" rx="6" /><text class="xs f" x="458.0" y="59.0" text-anchor="middle">0</text><text class="s h" x="178" y="97.0" text-anchor="end">b = 0x2F</text><rect class="box" x="190" y="78" width="32" height="30" rx="6" /><text class="xs f" x="206.0" y="97.0" text-anchor="middle">0</text><rect class="box" x="226" y="78" width="32" height="30" rx="6" /><text class="xs f" x="242.0" y="97.0" text-anchor="middle">0</text><rect class="dl" x="262" y="78" width="32" height="30" rx="6" /><rect class="box" x="298" y="78" width="32" height="30" rx="6" /><text class="xs f" x="314.0" y="97.0" text-anchor="middle">0</text><rect class="dl" x="334" y="78" width="32" height="30" rx="6" /><rect class="dl" x="370" y="78" width="32" height="30" rx="6" /><rect class="dl" x="406" y="78" width="32" height="30" rx="6" /><rect class="dl" x="442" y="78" width="32" height="30" rx="6" /><text class="s h" x="178" y="135.0" text-anchor="end">a &amp; b = 0x24</text><rect class="box" x="190" y="116" width="32" height="30" rx="6" /><text class="xs f" x="206.0" y="135.0" text-anchor="middle">0</text><rect class="box" x="226" y="116" width="32" height="30" rx="6" /><text class="xs f" x="242.0" y="135.0" text-anchor="middle">0</text><rect class="pl" x="262" y="116" width="32" height="30" rx="6" /><rect class="box" x="298" y="116" width="32" height="30" rx="6" /><text class="xs f" x="314.0" y="135.0" text-anchor="middle">0</text><rect class="box" x="334" y="116" width="32" height="30" rx="6" /><text class="xs f" x="350.0" y="135.0" text-anchor="middle">0</text><rect class="pl" x="370" y="116" width="32" height="30" rx="6" /><rect class="box" x="406" y="116" width="32" height="30" rx="6" /><text class="xs f" x="422.0" y="135.0" text-anchor="middle">0</text><rect class="box" x="442" y="116" width="32" height="30" rx="6" /><text class="xs f" x="458.0" y="135.0" text-anchor="middle">0</text><text class="s h" x="178" y="173.0" text-anchor="end">a | b = 0xBF</text><rect class="tl" x="190" y="154" width="32" height="30" rx="6" /><rect class="box" x="226" y="154" width="32" height="30" rx="6" /><text class="xs f" x="242.0" y="173.0" text-anchor="middle">0</text><rect class="tl" x="262" y="154" width="32" height="30" rx="6" /><rect class="tl" x="298" y="154" width="32" height="30" rx="6" /><rect class="tl" x="334" y="154" width="32" height="30" rx="6" /><rect class="tl" x="370" y="154" width="32" height="30" rx="6" /><rect class="tl" x="406" y="154" width="32" height="30" rx="6" /><rect class="tl" x="442" y="154" width="32" height="30" rx="6" /><text class="s h" x="178" y="211.0" text-anchor="end">a ^ b = 0x9B</text><rect class="er" x="190" y="192" width="32" height="30" rx="6" /><rect class="box" x="226" y="192" width="32" height="30" rx="6" /><text class="xs f" x="242.0" y="211.0" text-anchor="middle">0</text><rect class="box" x="262" y="192" width="32" height="30" rx="6" /><text class="xs f" x="278.0" y="211.0" text-anchor="middle">0</text><rect class="er" x="298" y="192" width="32" height="30" rx="6" /><rect class="er" x="334" y="192" width="32" height="30" rx="6" /><rect class="box" x="370" y="192" width="32" height="30" rx="6" /><text class="xs f" x="386.0" y="211.0" text-anchor="middle">0</text><rect class="er" x="406" y="192" width="32" height="30" rx="6" /><rect class="er" x="442" y="192" width="32" height="30" rx="6" /><text class="s h" x="178" y="281.0" text-anchor="end">a&lt;&lt;2 = 0xD0</text><rect class="dl" x="190" y="262" width="32" height="30" rx="6" /><rect class="dl" x="226" y="262" width="32" height="30" rx="6" /><rect class="box" x="262" y="262" width="32" height="30" rx="6" /><text class="xs f" x="278.0" y="281.0" text-anchor="middle">0</text><rect class="dl" x="298" y="262" width="32" height="30" rx="6" /><rect class="box" x="334" y="262" width="32" height="30" rx="6" /><text class="xs f" x="350.0" y="281.0" text-anchor="middle">0</text><rect class="box" x="370" y="262" width="32" height="30" rx="6" /><text class="xs f" x="386.0" y="281.0" text-anchor="middle">0</text><rect class="box" x="406" y="262" width="32" height="30" rx="6" /><text class="xs f" x="422.0" y="281.0" text-anchor="middle">0</text><rect class="box" x="442" y="262" width="32" height="30" rx="6" /><text class="xs f" x="458.0" y="281.0" text-anchor="middle">0</text><text class="s h" x="178" y="319.0" text-anchor="end">a&gt;&gt;2 = 0x2D</text><rect class="box" x="190" y="300" width="32" height="30" rx="6" /><text class="xs f" x="206.0" y="319.0" text-anchor="middle">0</text><rect class="box" x="226" y="300" width="32" height="30" rx="6" /><text class="xs f" x="242.0" y="319.0" text-anchor="middle">0</text><rect class="dl" x="262" y="300" width="32" height="30" rx="6" /><rect class="box" x="298" y="300" width="32" height="30" rx="6" /><text class="xs f" x="314.0" y="319.0" text-anchor="middle">0</text><rect class="dl" x="334" y="300" width="32" height="30" rx="6" /><rect class="dl" x="370" y="300" width="32" height="30" rx="6" /><rect class="box" x="406" y="300" width="32" height="30" rx="6" /><text class="xs f" x="422.0" y="319.0" text-anchor="middle">0</text><rect class="dl" x="442" y="300" width="32" height="30" rx="6" /><text class="xs d" x="334" y="228" text-anchor="middle">filled = bit 1, outline = bit 0. columns are independent: no carry between bit positions.</text><line class="lnd" x1="170" y1="244" x2="478" y2="244"/><text class="s d" x="20" y="360" text-anchor="start">Shifting slides every bit two places and fills the vacated end with 0 (unsigned char</text><text class="s d" x="20" y="376" text-anchor="start">promotes to a nonnegative int, so this is a logical shift with no sign extension).</text></svg>`};
DIAGRAMS.endian={title:'Runtime endianness check',cap:'Storing 0x01020304 and reading its first byte through an unsigned char pointer reveals byte order directly: 0x04 first means little-endian, 0x01 first means big-endian. This must be checked, never assumed from the dev machine.',svg:`<svg viewBox="0 0 760 378" role="img" aria-label="Determining endianness at runtime by inspecting bytes"><title>Determining endianness at runtime by inspecting bytes</title><text class="s" x="20" y="24" text-anchor="start">uint32_t x = 0x01020304;  unsigned char *p = (unsigned char *)&amp;x;</text><text class="s h ac" x="20" y="72" text-anchor="start">little-endian (this host, x86-64):</text><rect class="pl" x="60" y="104" width="80" height="46" rx="6" /><text class="s h" x="100.0" y="124" text-anchor="middle">0x04</text><text class="xs d" x="100.0" y="140" text-anchor="middle">p[0]</text><text class="xs f" x="100.0" y="96" text-anchor="middle">&amp;x+0</text><rect class="box" x="150" y="104" width="80" height="46" rx="6" /><text class="s h" x="190.0" y="124" text-anchor="middle">0x03</text><text class="xs d" x="190.0" y="140" text-anchor="middle">p[1]</text><text class="xs f" x="190.0" y="96" text-anchor="middle">&amp;x+1</text><rect class="box" x="240" y="104" width="80" height="46" rx="6" /><text class="s h" x="280.0" y="124" text-anchor="middle">0x02</text><text class="xs d" x="280.0" y="140" text-anchor="middle">p[2]</text><text class="xs f" x="280.0" y="96" text-anchor="middle">&amp;x+2</text><rect class="box" x="330" y="104" width="80" height="46" rx="6" /><text class="s h" x="370.0" y="124" text-anchor="middle">0x01</text><text class="xs d" x="370.0" y="140" text-anchor="middle">p[3]</text><text class="xs f" x="370.0" y="96" text-anchor="middle">&amp;x+3</text><text class="s d" x="440" y="127" text-anchor="start">p[0]==0x04 : least-significant byte first</text><text class="s gr" x="440" y="143" text-anchor="start">-&gt; "little-endian"</text><text class="s h" x="20" y="200" text-anchor="start">big-endian (hypothetical other platform):</text><rect class="tl" x="60" y="232" width="80" height="46" rx="6" /><text class="s h" x="100.0" y="252" text-anchor="middle">0x01</text><text class="xs d" x="100.0" y="268" text-anchor="middle">p[0]</text><text class="xs f" x="100.0" y="224" text-anchor="middle">&amp;x+0</text><rect class="box" x="150" y="232" width="80" height="46" rx="6" /><text class="s h" x="190.0" y="252" text-anchor="middle">0x02</text><text class="xs d" x="190.0" y="268" text-anchor="middle">p[1]</text><text class="xs f" x="190.0" y="224" text-anchor="middle">&amp;x+1</text><rect class="box" x="240" y="232" width="80" height="46" rx="6" /><text class="s h" x="280.0" y="252" text-anchor="middle">0x03</text><text class="xs d" x="280.0" y="268" text-anchor="middle">p[2]</text><text class="xs f" x="280.0" y="224" text-anchor="middle">&amp;x+2</text><rect class="box" x="330" y="232" width="80" height="46" rx="6" /><text class="s h" x="370.0" y="252" text-anchor="middle">0x04</text><text class="xs d" x="370.0" y="268" text-anchor="middle">p[3]</text><text class="xs f" x="370.0" y="224" text-anchor="middle">&amp;x+3</text><text class="s d" x="440" y="255" text-anchor="start">p[0]==0x01 : most-significant byte first</text><text class="s ac" x="440" y="271" text-anchor="start">-&gt; "big-endian"</text><text class="s d" x="20" y="322" text-anchor="start">Byte order is implementation-defined (C11 6.2.6.1p2), so it must be checked at</text><text class="s d" x="20" y="338" text-anchor="start">runtime, not assumed. Accessing through unsigned char * is the well-defined,</text><text class="s d" x="20" y="354" text-anchor="start">strict-aliasing-safe way in (6.5p7); a same-size int-pointer cast would not be.</text></svg>`};
DIAGRAMS.vtable={title:'A struct of function pointers as a vtable',cap:'device_ops_t is the interface; mem_vt and log_vt are two instances filling it with different concrete functions. Calling code invokes ops.read/ops.write without knowing which one it holds.',svg:`<svg viewBox="0 0 760 400" role="img" aria-label="Struct of function pointers emulating a vtable, two instances dispatching to different implementations"><title>Struct of function pointers emulating a vtable, two instances dispatching to different implementations</title><rect class="tl" x="250" y="14" width="260" height="50" rx="6" /><text class="s h" x="380" y="36" text-anchor="middle">calling code (same call site)</text><text class="xs d" x="380" y="54" text-anchor="middle">ops.read(ctx)  /  ops.write(ctx, v)</text><polyline class="lnd" points="310,64 177.6,109.4"/><polygon class="ahd" points="170.0,112.0 177.1,104.8 180.0,113.3"/><polyline class="lnd" points="450,64 602.3,109.7"/><polygon class="ahd" points="610.0,112.0 600.1,113.7 602.7,105.1"/><text class="xs d" x="200" y="100" text-anchor="middle">ops = mem_vt</text><text class="xs d" x="560" y="100" text-anchor="middle">ops = log_vt</text><rect class="dl" x="40" y="112" width="260" height="62" rx="6" /><text class="s h" x="170" y="132" text-anchor="middle">mem_vt : device_ops_t</text><text class="xs" x="170" y="150" text-anchor="middle">read  = mem_read</text><text class="xs" x="170" y="164" text-anchor="middle">write = mem_write</text><rect class="dl" x="460" y="112" width="260" height="62" rx="6" /><text class="s h" x="590" y="132" text-anchor="middle">log_vt : device_ops_t</text><text class="xs" x="590" y="150" text-anchor="middle">read  = log_read</text><text class="xs" x="590" y="164" text-anchor="middle">write = log_write</text><line class="lnd" x1="170" y1="174" x2="170.0" y2="198.0"/><polygon class="ahd" points="170.0,206.0 165.5,197.0 174.5,197.0"/><text class="xs d" x="184" y="194" text-anchor="start">ctx</text><line class="lnd" x1="590" y1="174" x2="590.0" y2="198.0"/><polygon class="ahd" points="590.0,206.0 585.5,197.0 594.5,197.0"/><text class="xs d" x="604" y="194" text-anchor="start">ctx</text><rect class="box" x="40" y="208" width="260" height="48" rx="6" /><text class="s h" x="170" y="228" text-anchor="middle">mem_dev_t</text><text class="xs d" x="170" y="244" text-anchor="middle">{ int value; }</text><rect class="box" x="460" y="208" width="260" height="48" rx="6" /><text class="s h" x="590" y="228" text-anchor="middle">log_dev_t</text><text class="xs d" x="590" y="244" text-anchor="middle">{ int calls; }</text><text class="xs" x="170" y="280" text-anchor="middle">mem_vt.write(&amp;mem, 42);</text><text class="xs h" x="170" y="293" text-anchor="middle">mem_vt.read(&amp;mem) -&gt; 42</text><text class="xs" x="590" y="280" text-anchor="middle">log_vt.write(&amp;log,7); log_vt.write(&amp;log,8);</text><text class="xs h" x="590" y="293" text-anchor="middle">log_vt.read(&amp;log) -&gt; calls=2, last=8</text><text class="s d" x="20" y="330" text-anchor="start">Same struct type (device_ops_t) and the same call site in both cases; which function actually</text><text class="s d" x="20" y="346" text-anchor="start">runs depends only on which instance ops refers to -- this is C-style virtual dispatch by hand.</text><text class="xs d" x="20" y="366" text-anchor="start">ctx plays the role of "this": each concrete function casts it back to its own real struct type; nothing</text><text class="xs d" x="20" y="380" text-anchor="start">in the language ties a given ctx to the vtable it is used with (mem_vt.write(&amp;log,7) would compile).</text></svg>`};
DIAGRAMS.buildpipeline={title:'The four translation phases',cap:'Preprocess, compile, and assemble turn hello.c into hello.o (an object file with a symbol table); link resolves external references like printf against libc to produce the runnable image.',svg:`<svg viewBox="0 0 760 350" role="img" aria-label="Four phases from hello.c to executable, with an nm symbol table aside"><title>Four phases from hello.c to executable, with an nm symbol table aside</title><rect class="box" x="20" y="70" width="100" height="46" rx="6" /><text class="s h" x="70.0" y="90" text-anchor="middle">hello.c</text><text class="xs d" x="70.0" y="106" text-anchor="middle">source text</text><rect class="box" x="150" y="70" width="90" height="46" rx="6" /><text class="s h" x="195.0" y="90" text-anchor="middle">hello.i</text><text class="xs d" x="195.0" y="106" text-anchor="middle">preprocessed text</text><rect class="box" x="290" y="70" width="90" height="46" rx="6" /><text class="s h" x="335.0" y="90" text-anchor="middle">hello.s</text><text class="xs d" x="335.0" y="106" text-anchor="middle">assembly text</text><rect class="dl" x="420" y="70" width="90" height="46" rx="6" /><text class="s h" x="465.0" y="90" text-anchor="middle">hello.o</text><text class="xs d" x="465.0" y="106" text-anchor="middle">object + symbols</text><rect class="pl" x="560" y="70" width="90" height="46" rx="6" /><text class="s h" x="605.0" y="90" text-anchor="middle">hello</text><text class="xs d" x="605.0" y="106" text-anchor="middle">runnable image</text><line class="lna" x1="110" y1="93" x2="142.0" y2="93.0"/><polygon class="ah" points="150.0,93.0 141.0,97.5 141.0,88.5"/><text class="xs h" x="130.0" y="64" text-anchor="middle">Preprocess</text><text class="xs d" x="130.0" y="150" text-anchor="middle">-E</text><line class="lna" x1="240" y1="93" x2="282.0" y2="93.0"/><polygon class="ah" points="290.0,93.0 281.0,97.5 281.0,88.5"/><text class="xs h" x="265.0" y="64" text-anchor="middle">Compile</text><text class="xs d" x="265.0" y="150" text-anchor="middle">-S</text><line class="lna" x1="380" y1="93" x2="412.0" y2="93.0"/><polygon class="ah" points="420.0,93.0 411.0,97.5 411.0,88.5"/><text class="xs h" x="400.0" y="64" text-anchor="middle">Assemble</text><text class="xs d" x="400.0" y="150" text-anchor="middle">-c</text><line class="lna" x1="510" y1="93" x2="552.0" y2="93.0"/><polygon class="ah" points="560.0,93.0 551.0,97.5 551.0,88.5"/><text class="xs h" x="535.0" y="64" text-anchor="middle">Link</text><text class="xs d" x="535.0" y="150" text-anchor="middle">(no flag)</text><line class="ln" x1="390" y1="116" x2="390" y2="160"/><line class="ln" x1="390" y1="160" x2="330" y2="160"/><rect class="box" x="200" y="160" width="130" height="70" rx="6" /><text class="s h" x="265" y="178" text-anchor="middle">nm hello.o</text><text class="xs" x="265" y="194" text-anchor="middle">D gvar   T main</text><text class="xs" x="265" y="208" text-anchor="middle">U printf</text><text class="xs d" x="265" y="222" text-anchor="middle">(U: linker must resolve)</text><line class="ln" x1="20" y1="262" x2="510" y2="262"/><line class="ln" x1="20" y1="256" x2="20" y2="262"/><line class="ln" x1="510" y1="256" x2="510" y2="262"/><text class="s d" x="265.0" y="282" text-anchor="middle">"compiling" = phases 1-3  (gcc -c hello.c runs all three internally)</text><line class="ln" x1="520" y1="262" x2="650" y2="262"/><line class="ln" x1="520" y1="256" x2="520" y2="262"/><line class="ln" x1="650" y1="256" x2="650" y2="262"/><text class="s d" x="585.0" y="282" text-anchor="middle">"linking" = separate step</text><text class="s d" x="20" y="300" text-anchor="start">gvar is D (not B/bss) because int gvar = 42; has a nonzero initializer; only zero/uninitialized</text><text class="s d" x="20" y="316" text-anchor="start">file-scope objects go in .bss. printf stays U until the linker pulls it in from libc.</text><text class="s d" x="20" y="336" text-anchor="start">A clean compile only proves phases 1-3 worked; linking can still fail on an unresolved symbol.</text></svg>`};
DIAGRAMS.linkedlist={title:'Reversing a singly linked list, one step at a time',cap:'reverse_iter walks once with prev/cur/next. Each step saves cur->next, rewires cur->next to point at prev (amber), then advances both pointers; when cur reaches NULL, prev (now C) is the new head.',svg:`<svg viewBox="0 0 760 440" role="img" aria-label="Four frames showing prev, cur, and next as a 3-node list A-&gt;B-&gt;C is reversed to C-&gt;B-&gt;A"><title>Four frames showing prev, cur, and next as a 3-node list A-&gt;B-&gt;C is reversed to C-&gt;B-&gt;A</title><text class="xs d" x="20" y="18" text-anchor="start">amber solid = link rewired this step   grey dashed = already reversed (settled)   plain = original, not yet processed</text><text class="s h" x="20" y="72.0" text-anchor="start">start</text><rect class="dl" x="140" y="50" width="90" height="36" rx="6" /><text class="h" x="185.0" y="73" text-anchor="middle">A</text><rect class="dl" x="330" y="50" width="90" height="36" rx="6" /><text class="h" x="375.0" y="73" text-anchor="middle">B</text><rect class="dl" x="520" y="50" width="90" height="36" rx="6" /><text class="h" x="565.0" y="73" text-anchor="middle">C</text><line class="ln" x1="230" y1="68.0" x2="322.0" y2="68.0"/><polygon class="ahd" points="330.0,68.0 321.0,72.5 321.0,63.5"/><line class="ln" x1="610" y1="68.0" x2="682.0" y2="68.0"/><polygon class="ahd" points="690.0,68.0 681.0,72.5 681.0,63.5"/><text class="xs d" x="698" y="72.0" text-anchor="start">NULL</text><text class="xs ac" x="185.0" y="32" text-anchor="middle">cur</text><line class="lna" x1="185.0" y1="38" x2="185.0" y2="40.0"/><polygon class="ah" points="185.0,48.0 180.5,39.0 189.5,39.0"/><text class="xs d" x="20" y="88.0" text-anchor="start">prev = NULL</text><text class="s h" x="20" y="162.0" text-anchor="start">step 1</text><rect class="dl" x="140" y="140" width="90" height="36" rx="6" /><text class="h" x="185.0" y="163" text-anchor="middle">A</text><rect class="dl" x="330" y="140" width="90" height="36" rx="6" /><text class="h" x="375.0" y="163" text-anchor="middle">B</text><rect class="dl" x="520" y="140" width="90" height="36" rx="6" /><text class="h" x="565.0" y="163" text-anchor="middle">C</text><line class="lna" x1="140" y1="152.0" x2="78.0" y2="152.0"/><polygon class="ah" points="70.0,152.0 79.0,147.5 79.0,156.5"/><text class="xs d" x="70" y="146.0" text-anchor="end">NULL</text><line class="ln" x1="420" y1="158.0" x2="512.0" y2="158.0"/><polygon class="ahd" points="520.0,158.0 511.0,162.5 511.0,153.5"/><text class="xs ac" x="375.0" y="122" text-anchor="middle">cur</text><line class="lna" x1="375.0" y1="128" x2="375.0" y2="130.0"/><polygon class="ah" points="375.0,138.0 370.5,129.0 379.5,129.0"/><text class="xs cy" x="185.0" y="202" text-anchor="middle">prev</text><line class="lnc" x1="185.0" y1="196" x2="185.0" y2="188.0"/><polygon class="ahc" points="185.0,180.0 189.5,189.0 180.5,189.0"/><text class="s h" x="20" y="252.0" text-anchor="start">step 2</text><rect class="dl" x="140" y="230" width="90" height="36" rx="6" /><text class="h" x="185.0" y="253" text-anchor="middle">A</text><rect class="dl" x="330" y="230" width="90" height="36" rx="6" /><text class="h" x="375.0" y="253" text-anchor="middle">B</text><rect class="dl" x="520" y="230" width="90" height="36" rx="6" /><text class="h" x="565.0" y="253" text-anchor="middle">C</text><line class="lnd" x1="140" y1="242.0" x2="78.0" y2="242.0"/><polygon class="ahd" points="70.0,242.0 79.0,237.5 79.0,246.5"/><text class="xs f" x="70" y="236.0" text-anchor="end">NULL</text><line class="lna" x1="330" y1="256.0" x2="238.0" y2="256.0"/><polygon class="ah" points="230.0,256.0 239.0,251.5 239.0,260.5"/><line class="ln" x1="610" y1="248.0" x2="682.0" y2="248.0"/><polygon class="ahd" points="690.0,248.0 681.0,252.5 681.0,243.5"/><text class="xs d" x="698" y="252.0" text-anchor="start">NULL</text><text class="xs ac" x="565.0" y="212" text-anchor="middle">cur</text><line class="lna" x1="565.0" y1="218" x2="565.0" y2="220.0" DIAGRAMS.mmio={title:'volatile vs. non-volatile: what -O2 actually emits',cap:'Same three-store loop compiled twice. Without volatile the compiler collapses it to one store and answers the read from a constant (red = wrong for a real register). With volatile every store and the final reload survive as separate instructions (green = correct).',svg:`<svg viewBox="0 0 760 370" role="img" aria-label="Disassembly comparison of a volatile and non-volatile memory-mapped register write loop"><title>Disassembly comparison of a volatile and non-volatile memory-mapped register write loop</title><text class="s rd" x="190" y="18" text-anchor="middle">non-volatile: for (i=0;i&lt;3;i++) *p=1;</text><text class="s gr" x="570" y="18" text-anchor="middle">volatile: for (i=0;i&lt;3;i++) *p=1;</text><text class="xs d" x="190" y="32" text-anchor="middle">uint32_t *p = &amp;reg;</text><text class="xs d" x="570" y="32" text-anchor="middle">volatile uint32_t *p = &amp;reg;</text><rect class="grp" x="112" y="52" width="16" height="16" rx="3" /><text class="xs d" x="120" y="46" text-anchor="middle">i=0</text><text class="xs rd" x="120" y="78" text-anchor="middle">elim.</text><rect class="grp" x="182" y="52" width="16" height="16" rx="3" /><text class="xs d" x="190" y="46" text-anchor="middle">i=1</text><text class="xs rd" x="190" y="78" text-anchor="middle">elim.</text><rect class="tl" x="252" y="52" width="16" height="16" rx="3" /><text class="xs d" x="260" y="46" text-anchor="middle">i=2</text><rect class="pl" x="492" y="52" width="16" height="16" rx="3" /><text class="xs d" x="500" y="46" text-anchor="middle">i=0</text><line class="lng" x1="500" y1="68" x2="562.7" y2="96.7"/><polygon class="ah" points="570.0,100.0 559.9,100.4 563.7,92.2"/><rect class="pl" x="562" y="52" width="16" height="16" rx="3" /><text class="xs d" x="570" y="46" text-anchor="middle">i=1</text><line class="lng" x1="570" y1="68" x2="570.0" y2="92.0"/><polygon class="ah" points="570.0,100.0 565.5,91.0 574.5,91.0"/><rect class="pl" x="632" y="52" width="16" height="16" rx="3" /><text class="xs d" x="640" y="46" text-anchor="middle">i=2</text><line class="lng" x1="640" y1="68" x2="577.3" y2="96.7"/><polygon class="ah" points="570.0,100.0 576.3,92.2 580.1,100.4"/><line class="lna" x1="260" y1="68" x2="197.3" y2="96.7"/><polygon class="ah" points="190.0,100.0 196.3,92.2 200.1,100.4"/><text class="xs h" x="190" y="96" text-anchor="middle">kept: movl $1,(reg)</text><rect class="dl" x="110" y="100" width="160" height="40" rx="6" /><text class="s h" x="190" y="118" text-anchor="middle">reg (in memory)</text><text class="xs f" x="190" y="133" text-anchor="middle">never read again</text><rect class="dl" x="490" y="100" width="160" height="40" rx="6" /><text class="s h" x="570" y="118" text-anchor="middle">reg (in memory)</text><text class="xs f" x="570" y="133" text-anchor="middle">written 3 times</text><polyline class="lnd" points="260,68 320,68 320,190 258.0,190.0"/><polygon class="ahd" points="250.0,190.0 259.0,185.5 259.0,194.5"/><text class="xs d" x="324" y="130" text-anchor="start">constant reused,</text><text class="xs d" x="324" y="144" text-anchor="start">no reload</text><line class="lng" x1="570" y1="140" x2="570.0" y2="170.0"/><polygon class="ah" points="570.0,178.0 565.5,169.0 574.5,169.0"/><text class="xs h" x="584" y="160" text-anchor="start">real reload</text><rect class="box" x="90" y="190" width="200" height="40" rx="6" /><text class="s h" x="190" y="208" text-anchor="middle">return (int)*p;</text><text class="xs d" x="190" y="224" text-anchor="middle">mov $1,%eax</text><rect class="box" x="470" y="190" width="200" height="40" rx="6" /><text class="s h" x="570" y="208" text-anchor="middle">return (int)*p;</text><text class="xs d" x="570" y="224" text-anchor="middle">mov 0x2fac(%rip),%eax</text><rect class="er" x="20" y="250" width="340" height="40" rx="6" /><text class="s h" x="190" y="268" text-anchor="middle">-O2 result: 1 store total</text><text class="xs d" x="190" y="283" text-anchor="middle">(dead-store elimination)</text><rect class="pl" x="400" y="250" width="340" height="40" rx="6" /><text class="s h" x="570" y="268" text-anchor="middle">-O2 result: 3 stores + 1 reload</text><text class="xs d" x="570" y="283" text-anchor="middle">(all preserved, in order)</text><text class="s d" x="20" y="318" text-anchor="start">C11 6.7.3p7: an access to a volatile object must happen exactly as the abstract machine specifies.</text><text class="s d" x="20" y="334" text-anchor="start">Without volatile the compiler proves the first two stores are dead and the final read is just the</text><text class="s d" x="20" y="350" text-anchor="start">constant it already stored -- both eliminated at -O2, which is invisible at -O0.</text></svg>`};
DIAGRAMS.ringbuffer={title:'SPSC ring buffer: masking and the full/empty ambiguity',cap:'Capacity-8 ring after filling, popping 3, and pushing 3 more (wrap-around). head=11 and tail=3 both mask to slot 3, which is why fullness must be checked with head-tail, not by comparing masked indices.',svg:`<svg viewBox="0 0 760 380" role="img" aria-label="Ring buffer array with head and tail pointers wrapping via bitwise AND"><title>Ring buffer array with head and tail pointers wrapping via bitwise AND</title><text class="xs d" x="20" y="18" text-anchor="start">SPSC ring, CAPACITY=8 (power of two): array index = counter &amp; (CAPACITY-1); head/tail only ever increase.</text><rect class="pl" x="60" y="130" width="78" height="46" rx="6" /><text class="h" x="99.0" y="159" text-anchor="middle">100</text><text class="xs d" x="99.0" y="192" text-anchor="middle">[0]</text><rect class="pl" x="146" y="130" width="78" height="46" rx="6" /><text class="h" x="185.0" y="159" text-anchor="middle">101</text><text class="xs d" x="185.0" y="192" text-anchor="middle">[1]</text><rect class="pl" x="232" y="130" width="78" height="46" rx="6" /><text class="h" x="271.0" y="159" text-anchor="middle">102</text><text class="xs d" x="271.0" y="192" text-anchor="middle">[2]</text><rect class="dl" x="318" y="130" width="78" height="46" rx="6" /><text class="h" x="357.0" y="159" text-anchor="middle">3</text><text class="xs d" x="357.0" y="192" text-anchor="middle">[3]</text><rect class="dl" x="404" y="130" width="78" height="46" rx="6" /><text class="h" x="443.0" y="159" text-anchor="middle">4</text><text class="xs d" x="443.0" y="192" text-anchor="middle">[4]</text><rect class="dl" x="490" y="130" width="78" height="46" rx="6" /><text class="h" x="529.0" y="159" text-anchor="middle">5</text><text class="xs d" x="529.0" y="192" text-anchor="middle">[5]</text><rect class="dl" x="576" y="130" width="78" height="46" rx="6" /><text class="h" x="615.0" y="159" text-anchor="middle">6</text><text class="xs d" x="615.0" y="192" text-anchor="middle">[6]</text><rect class="dl" x="662" y="130" width="78" height="46" rx="6" /><text class="h" x="701.0" y="159" text-anchor="middle">7</text><text class="xs d" x="701.0" y="192" text-anchor="middle">[7]</text><text class="xs cy" x="312" y="78" text-anchor="end">tail = 3</text><line class="lnc" x1="314" y1="84" x2="342.2" y2="121.6"/><polygon class="ahc" points="347.0,128.0 338.0,123.5 345.2,118.1"/><text class="xs ac" x="402" y="96" text-anchor="start">head = 11</text><line class="lna" x1="400" y1="102" x2="373.3" y2="123.0"/><polygon class="ah" points="367.0,128.0 371.3,118.9 376.9,126.0"/><rect class="box" x="30" y="210" width="700" height="56" rx="6" /><text class="s h" x="380" y="230" text-anchor="middle">Both mask to the same slot: 11 &amp; 7 == 3 &amp; 7 == 3</text><text class="xs d" x="380" y="248" text-anchor="middle">but head - tail = 11 - 3 = 8 = CAPACITY, so rb_full() (not equal masked indices) says FULL, not empty.</text><text class="s ac" x="20" y="290" text-anchor="start">push (producer, owns head): buf[head &amp; 7] = v; head++</text><text class="s cy" x="20" y="306" text-anchor="start">pop  (consumer, owns tail):  v = buf[tail &amp; 7]; tail++</text><text class="xs d" x="20" y="336" text-anchor="start">Slots [0..2] (green) were just refilled by the wrap-around pushes of 100,101,102 after 0,1,2 were popped;</text><text class="xs d" x="20" y="352" text-anchor="start">slots [3..7] (blue) still hold the original values 3..7, waiting to be popped in order.</text></svg>`};

var DATA={"modules":[{"id":1,"title":"Types, Storage Classes, Scope & Linkage","desc":"Fundamental types and their ranges, signed/unsigned conversion, storage classes (auto, static, extern, register), block/file scope, internal vs external linkage, and declaration vs definition."},{"id":2,"title":"Operators, Expressions & Sequence Points","desc":"Operator precedence and associativity, implicit conversions and the usual arithmetic conversions, short-circuit evaluation, sequence points, and the undefined-behavior traps in ordinary expressions."},{"id":3,"title":"Control Flow & Program Structure","desc":"if/switch/loops, fall-through, goto and labels, the comma operator, recursion and stack growth, and how source becomes control flow at the machine level."},{"id":4,"title":"Pointers Deep Dive","desc":"Pointer arithmetic, pointer-to-pointer, arrays vs pointers, pointer to array vs array of pointers, const correctness, void* and generic code, and null/dangling/wild pointers."},{"id":5,"title":"Arrays, Strings & Memory Layout","desc":"Array decay, multi-dimensional array layout, string literals and their storage, null termination, and hand-written string/array routines with real, compiled code."},{"id":6,"title":"Structures, Unions & Bit-Fields","desc":"Padding and alignment, structure layout rules, unions and type punning, bit-fields and their portability limits, flexible array members, and packed structs for protocol parsing."},{"id":7,"title":"Type Qualifiers: const, volatile, restrict","desc":"What const, volatile and restrict actually promise the compiler, volatile for hardware registers and signal handlers, and where each qualifier is misused."},{"id":8,"title":"Dynamic Memory Management","desc":"malloc/calloc/realloc/free semantics, heap layout, alignment guarantees, memory leaks, double-free and use-after-free, and writing a simple custom allocator."},{"id":9,"title":"The Preprocessor & Macros","desc":"Object-like and function-like macros, token pasting and stringizing, variadic macros, include guards vs pragma once, and the classic macro pitfalls (missing parens, multiple evaluation, statement-like macros)."},{"id":10,"title":"Undefined Behavior & Standard Compliance","desc":"Strict aliasing, signed integer overflow, out-of-bounds access, the difference between undefined, unspecified and implementation-defined behavior, and how the standard's wording actually reads."},{"id":11,"title":"Bit Manipulation & Numeric Representation","desc":"Two's complement, endianness, floating-point representation basics, and the classic bit-twiddling interview questions (set/clear/toggle a bit, count set bits, power-of-two checks, swap without a temporary) with real code."},{"id":12,"title":"Function Pointers & C-Style Polymorphism","desc":"Declaring and calling through function pointers, callback and dispatch tables, and emulating interfaces/polymorphism in C with structs of function pointers."},{"id":13,"title":"Compilation, Linking & the Build Pipeline","desc":"Preprocessing, compiling, assembling and linking; translation units; object files and symbol resolution; static vs dynamic linking; and what a Makefile actually orchestrates."},{"id":14,"title":"Standard Library Internals","desc":"stdio buffering and flushing, the string.h and ctype.h families, qsort/bsearch, and writing minimal versions of common library functions to show real understanding."},{"id":15,"title":"Core Data Structures & Algorithms in C","desc":"Linked lists, stacks, queues, binary trees and hash tables implemented from scratch in C, plus the classic coding-round questions built on them (reverse a list, detect a cycle, and similar)."},{"id":16,"title":"Debugging, Tooling & Sanitizers","desc":"gdb workflows, Valgrind, AddressSanitizer/UndefinedBehaviorSanitizer, static analysis, and reading a crash or corruption back to its root cause."},{"id":17,"title":"Embedded, Firmware & Secure Coding in C","desc":"Memory-mapped I/O, ISR-safe code and reentrancy, volatile hardware registers, buffer overflows and format-string bugs, integer-overflow-driven vulnerabilities, and the defensive-coding habits firmware review expects."},{"id":18,"title":"Principal-Level Systems Design in C","desc":"Design questions with real code: a fixed-size memory pool allocator, a lock-free-ish single-producer/single-consumer ring buffer, a generic event/callback dispatch system, and how to reason about and present a C systems-design answer at the Principal level."}],"questions":[{"id":"1.01","level":"Basic","type":"Concept","fig":null,"tags":["declaration","definition"],"q":"What is the difference between a declaration and a definition in C?","short":"A declaration tells the compiler an identifier exists and gives its type; a definition also reserves storage (for an object) or provides a body (for a function). `extern int x;` is a declaration only; `int x;` at file scope is a definition (tentative if uninitialized).","deep":"Every definition is also a declaration, but not every declaration is a definition.\n\n- `extern int x;` at any scope: declaration only, no storage reserved here.\n- `int x;` at file scope: a definition (tentative per 6.9.2 if there is no initializer elsewhere in the translation unit).\n- `int x = 0;` at file scope: always a definition, never tentative.\n- A function prototype `int f(int);` is a declaration; `int f(int n) { return n; }` is a definition.\n\n```c\n#include <stdio.h>\n\nextern int counter;      /* declaration only: refers to the definition below */\nint counter = 0;         /* the one definition: this reserves storage */\n\nint main(void)\n{\n    extern int counter;  /* redundant re-declaration, same object */\n    counter++;\n    printf(\"counter = %d\\n\", counter);\n    return 0;\n}\n```\nCompiled and run with gcc -std=c11 -Wall -Wextra: prints `counter = 1`.","pitfall":"Writing `int x;` in a header and including it in two .c files: each translation unit gets its own tentative definition, and linking both together commonly fails with a duplicate-symbol error.","verify":"6.9.2","follow":[{"q":"Can a header file contain a definition?","a":"Only safely for functions marked `static inline`, or via a tentative definition trick; a plain `int x;` in a header included by multiple .c files causes multiple-definition link errors under C's default semantics on most modern toolchains."},{"q":"Why does `extern int x;` inside `main` work here?","a":"It is just another declaration of the same file-scope object; it does not create a new variable."}],"mod":1},{"id":"1.02","level":"Basic","type":"Concept","fig":null,"tags":["types","ranges"],"q":"What are C's standard integer types and what does the standard guarantee about their ranges?","short":"char, short, int, long, long long (each signed or unsigned) with non-decreasing rank and non-decreasing minimum width: char >= 8 bits, short/int >= 16 bits, long >= 32 bits, long long >= 64 bits. Exact sizes beyond that are implementation-defined; use stdint.h for guaranteed widths.","deep":"The standard fixes *minimum* ranges, not exact sizes. `int` is only guaranteed to hold at least -32767 to 32767 (16-bit minimum); on almost every desktop and embedded 32-bit target today it is 32 bits, but a strictly portable firmware codebase should not assume that.\n\nFor a guaranteed exact width, use `<stdint.h>`: `int8_t`, `uint16_t`, `int32_t`, `uint64_t`, etc. (7.20.1.1: \"designates a signed/unsigned integer type with width N, no padding bits, and a two's complement representation\" for the intN_t forms specifically).\n\n```c\n#include <stdio.h>\n#include <stdint.h>\n#include <limits.h>\n\nint main(void)\n{\n    printf(\"sizeof(int8_t)=%zu sizeof(uint32_t)=%zu sizeof(int64_t)=%zu\\n\",\n           sizeof(int8_t), sizeof(uint32_t), sizeof(int64_t));\n    printf(\"INT8_MIN=%d INT8_MAX=%d UINT32_MAX=%u\\n\",\n           INT8_MIN, INT8_MAX, UINT32_MAX);\n    printf(\"plain int range: INT_MIN=%d INT_MAX=%d\\n\", INT_MIN, INT_MAX);\n    return 0;\n}\n```\nOutput on this machine: `sizeof(int8_t)=1 sizeof(uint32_t)=4 sizeof(int64_t)=8`, `INT8_MIN=-128 INT8_MAX=127 UINT32_MAX=4294967295`, `INT_MIN=-2147483648 INT_MAX=2147483647`.","pitfall":"Assuming `long` is 64 bits; it is 32 bits on Windows LLP64 and on many 32-bit embedded targets, 64 bits on Linux/macOS LP64.","verify":"7.20.1.1","follow":[{"q":"Is `int8_t` guaranteed to exist on every platform?","a":"No; it only exists if the platform has an exact 8-bit signed type. Use `int_least8_t` or `int_fast8_t` for portability without that guarantee."},{"q":"Why prefer stdint.h types in protocol/register code?","a":"Wire formats and hardware registers have fixed bit widths; `int`/`long` sizes vary by platform and ABI, which silently breaks layout assumptions."}],"mod":1},{"id":"1.03","level":"Basic","type":"Concept","fig":null,"tags":["scope","linkage"],"q":"What is the difference between scope and linkage?","short":"Scope is about where in the source text an identifier's declaration is visible (block, file, function, or function-prototype scope). Linkage is about whether separate declarations of the same identifier refer to the same object across scopes and translation units (external, internal, or no linkage). They are independent axes.","deep":"- **Scope** (6.2.1): file scope (outside any block, visible until end of translation unit), block scope (inside `{}`, visible until the block ends), function prototype scope (parameter names in a standalone prototype), function scope (labels only).\n- **Linkage** (6.2.2):\n  - **external linkage**: the same identifier in different translation units denotes the same object/function (the default for file-scope identifiers with no storage-class specifier, and for `extern`).\n  - **internal linkage**: the same identifier denotes the same object only within one translation unit (`static` at file scope).\n  - **no linkage**: each declaration denotes a distinct entity (ordinary block-scope variables without `extern`).\n\nA block-scope variable has block scope and (usually) no linkage: it is a fresh object every time you write it in a different function. A file-scope `static` variable has file scope and internal linkage: one object, visible from anywhere in that file but invisible to other files.","pitfall":"Confusing \"static\" the storage-class specifier (which means internal linkage at file scope, but static storage duration at block scope) with a single unified meaning.","verify":"6.2.1, 6.2.2","follow":[{"q":"Does a block-scope `static int x;` have linkage?","a":"No; it has no linkage (it is a unique entity per declaration site) but static *storage duration*, so it retains its value between calls."},{"q":"Can two functions in different files both have a local variable named `count` with no conflict?","a":"Yes; block-scope locals have no linkage, so there is nothing to collide."}],"mod":1},{"id":"1.04","level":"Intermediate","type":"Scenario","fig":null,"tags":["char","signedness"],"q":"Is plain `char` signed or unsigned in C, and why does it matter?","short":"Whether plain `char` is signed or unsigned is implementation-defined (6.2.5p15); on most mainstream platforms including x86/ARM with gcc/clang it is signed. Code that stores small negative values or does bit manipulation in a `char` and assumes one behavior over the other is not portable.","deep":"`char`, `signed char`, and `unsigned char` are three distinct types for overload/type purposes, even though plain `char` has the same representation as one of the other two (implementation-defined which).\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    char c = -1;\n    unsigned char uc = (unsigned char)-1;\n    printf(\"char c = -1 : c == %d, (c < 0) = %d\\n\", c, c < 0);\n    printf(\"unsigned char uc = -1 : uc == %u\\n\", uc);\n    printf(\"is plain char signed here? %s\\n\",\n           ((char)-1 < 0) ? \"yes (signed)\" : \"no (unsigned)\");\n    return 0;\n}\n```\nCompiled and run: `char c = -1 : c == -1, (c < 0) = 1`, `unsigned char uc = -1 : uc == 255`, `is plain char signed here? yes (signed)`. This confirms gcc on this x86-64 target treats plain char as signed.","pitfall":"`putchar('\\xFF')` or `isupper(c)` with plain (possibly-signed) `char c` holding a byte value > 127 is undefined behavior; cast to `unsigned char` first.","verify":"6.2.5p15","follow":[{"q":"Where does the signedness of plain char actually bite?","a":"Reading a byte from a binary file/protocol into a `char` and comparing it against a value > 127, or passing it to a function like `isalpha` without an explicit cast to `unsigned char` first (undefined behavior if the value is negative and not EOF)."},{"q":"How do you write portable byte-handling code regardless of char's signedness?","a":"Always store raw bytes as `unsigned char` or `uint8_t`."}],"mod":1},{"id":"1.05","level":"Intermediate","type":"Concept","fig":null,"tags":["static","scope"],"q":"What does the `static` keyword mean at file scope versus at block scope?","short":"At file scope, `static` gives an identifier internal linkage (private to that translation unit). At block scope, `static` gives a local variable static storage duration (it keeps its value between calls) without changing its scope or linkage (it still has no linkage, still only visible inside the block).","deep":"These are two distinctly different effects sharing one keyword:\n\n| Where | Effect of `static` |\n|---|---|\n| File scope function/object | Internal linkage: invisible to other translation units |\n| Block scope object | Static storage duration: lifetime = whole program, initialized once; scope/linkage unchanged |\n\n```c\n#include <stdio.h>\n\nint next_id(void)\n{\n    static int id = 0; /* static storage duration: initialized once, survives calls */\n    return ++id;\n}\n\nint main(void)\n{\n    int a = next_id();\n    int b = next_id();\n    int c = next_id();\n    printf(\"%d %d %d\\n\", a, b, c);\n    return 0;\n}\n```\nCompiled and run: prints `1 2 3` (each call increments the same persistent object;
