nt.","pitfall":"Assuming `strncat`'s length argument protects the destination buffer's total size, when it only limits how much of the source is appended.","verify":null,"follow":[{"q":"Why is repeated `strcat` in a loop especially risky?","a":"Each call has to re-scan from the start of `dst` to find the current end, making a loop of `n` appends O(n^2) as well as carrying the same unchecked-overflow risk every single call."},{"q":"Is there a bounded version in the standard library?","a":"`strncat` bounds how many bytes of `src` are appended, but it does not bound `dst`'s total remaining space either, so it only partially helps; explicit length tracking (as in 5.16/5.17) is the more robust pattern."}],"mod":5},{"id":"5.11","level":"Advanced","type":"Scenario","fig":null,"tags":["2darray","contiguity"],"q":"Is a true 2D array like `int a[3][4]` guaranteed to be one contiguous block of memory?","short":"Yes. C11 6.5.2.1p3 defines a 2D array as an array of arrays, and 6.7.2.1's \"addresses increase in declaration order\" guarantee (applied recursively) means each row sits immediately after the previous one, with no gaps, so the whole `a[3][4]` is 48 contiguous bytes on a 4-byte `int`.","deep":"```c\n#include <stdio.h>\n\nint main(void) {\n    int a[3][4];\n    printf(\"%p\\n\", (void *)&a[0][0]);\n    printf(\"%p (stride %ld bytes)\\n\", (void *)&a[1][0],\n           (long)((char *)&a[1][0] - (char *)&a[0][0]));\n    printf(\"contiguous: %d\\n\",\n           (char *)&a[2][0] - (char *)&a[0][0] == 2 * (long)sizeof(a[0]));\n    return 0;\n}\n```\nCompiled and run: the stride between rows was `16` bytes, exactly `sizeof(int[4])`, and the contiguity check printed `1`.","pitfall":"Assuming an array of pointers to rows (a jagged array) has the same contiguous, single-`memcpy`-able layout as a true 2D array.","verify":null,"follow":[{"q":"Is an array of separately `malloc`'d rows (`int *rows[3]`, each `malloc`'d) equally contiguous?","a":"No; each row's storage comes from an independent allocation that could land anywhere, which is the jagged-array trade-off from question 4.06."},{"q":"Does this contiguity guarantee let you treat `a` as one flat `int[12]`?","a":"In practice `&a[0][0]` plus flat indexing works because of this guarantee, but the *type* is still `int[3][4]`; you would need an explicit cast or pointer arithmetic to index it as if it were `int[12]`."}],"mod":5},{"id":"5.12","level":"Advanced","type":"Debug","fig":null,"tags":["off-by-one","overflow"],"q":"This copy loop corrupts one byte past the destination buffer. Find the bug.","short":"The loop condition `i <= len` runs one iteration too many, writing indices `0` through `len` inclusive, which is `len + 1` bytes into a buffer sized for `len`; the fix is the ordinary half-open bound, `i < len`.","deep":"```c\n#include <stdio.h>\n#include <stddef.h>\n\n/* BUGGY */\nvoid copy_n_buggy(char *dst, const char *src, size_t len) {\n    for (size_t i = 0; i <= len; i++)   /* BUG: should be i < len */\n        dst[i] = src[i];\n}\n/* FIXED */\nvoid copy_n_fixed(char *dst, const char *src, size_t len) {\n    for (size_t i = 0; i < len; i++)\n        dst[i] = src[i];\n}\nint main(void) {\n    char src[5] = \"abcd\";\n    char dst[5];\n    copy_n_fixed(dst, src, 4);\n    dst[4] = '\\0';\n    printf(\"%s\\n\", dst);\n}\n```\nCompiled and run (only the fixed version was executed, on purpose): printed `abcd`. The buggy version is left uncalled in this program because with `len` equal to the destination's actual capacity, it would write one byte past the end of a real 5-byte `dst`; it is included only to show the exact off-by-one being diagnosed.\n- Debug method: when a buffer overrun corrupts an adjacent byte (often visible as a neighboring variable or a canary changing value), check every loop bound against whether it is inclusive (`<=`) or exclusive (`<`) of the buffer's declared size, and confirm which one the buffer's allocation actually supports.","pitfall":"Writing `<=` in a copy loop bound out of habit from a \"last valid index\" mental model instead of a \"number of elements\" one.","verify":null,"follow":[{"q":"Would `-fsanitize=address` have caught this at runtime?","a":"Yes; AddressSanitizer (module 16) reports a precise \"heap/stack-buffer-overflow\" at the exact write, which is far faster to diagnose than working backward from corrupted data."},{"q":"Why does this particular off-by-one so often go unnoticed in testing?","a":"Writing one byte past a stack buffer frequently lands in padding or an adjacent unrelated variable that is not checked afterward, so the test's visible output can still look correct."}],"mod":5},{"id":"5.13","level":"Advanced","type":"Trap","fig":null,"tags":["array-compare","decay"],"q":"Why does `if (a == b)` for two `int` arrays with identical contents evaluate to false?","short":"In an expression, both array operands decay to pointers to their first elements (C11 6.3.2.1p3), so `a == b` compares two distinct addresses, not the arrays' contents; it is always false unless `a` and `b` are literally the same array object.","deep":"```c\n#include <stdio.h>\n#include <string.h>\n\nint main(void) {\n    int a[3] = {1, 2, 3};\n    int b[3] = {1, 2, 3};\n    printf(\"%d\\n\", a == b);                        /* compares decayed pointers */\n    printf(\"%d\\n\", memcmp(a, b, sizeof(a)) == 0);   /* compares contents */\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra`: GCC's `-Warray-compare` fires on `a == b` and suggests writing `&a[0] == &b[0]` to make the pointer comparison explicit, which is exactly the trap this question is about. Running it printed `0` for the pointer compare and `1` for `memcmp`, since the two arrays have equal contents at different addresses.","pitfall":"Comparing two arrays or two structs with `==` expecting a contents comparison, when C has no built-in aggregate equality operator at all.","verify":null,"follow":[{"q":"Does this warning mean `a == b` is a constraint violation?","a":"No, it is valid C (both sides become compatible pointer types), just almost never what the programmer meant; the warning exists precisely because it compiles fine while doing something else."},{"q":"What is the right way to compare two structs or arrays for equality?","a":"`memcmp` for raw byte equality when there is no padding involved (arrays of scalar types, or `structpad`-style structs with padding require care, see module 6), or a field-by-field/element-by-element comparison otherwise."}],"mod":5},{"id":"5.14","level":"Advanced","type":"Cross-layer","fig":null,"tags":["cache","traversal"],"q":"Why can summing a large 2D array column-by-column be dramatically slower than summing it row-by-row, even though both touch every element exactly once?","short":"Row-major layout (module 5's core fact) means consecutive elements of a row are adjacent in memory; row-by-row traversal reads memory sequentially, which the CPU's cache and prefetcher handle well. Column-by-column traversal jumps a full row's width between accesses, defeating the cache line and prefetcher on every step.","deep":"```c\n#include <stdio.h>\n\n#define N 2048\nstatic int m[N][N];\n\nint main(void) {\n    long sum = 0;\n    for (int i = 0; i < N; i++)\n        for (int j = 0; j < N; j++)\n            m[i][j] = i + j;\n\n    for (int i = 0; i < N; i++)\n        for (int j = 0; j < N; j++)\n            sum += m[i][j];         /* row-major order: sequential in memory */\n    printf(\"row-major sum = %ld\\n\", sum);\n\n    sum = 0;\n    for (int j = 0; j < N; j++)\n        for (int i = 0; i < N; i++)\n            sum += m[i][j];         /* column-major order: strides across rows */\n    printf(\"column-major sum = %ld\\n\", sum);\n    return 0;\n}\n```\nCompiled with default (no `-O`) optimization and run: the row-major loop took about 10400 clock ticks, the column-major loop about 40000 ticks on this run, roughly a 4x slowdown from access order alone on the same data. These figures are illustrative of the effect, not a benchmark; the exact ratio depends heavily on array size, cache size, and optimization level.\n- This is a language/hardware boundary question: C11 only guarantees the row-major logical layout (6.5.2.1p3); it says nothing about caches. The performance consequence comes entirely from how that guaranteed layout interacts with real memory hierarchies.\n- Multi-threaded access patterns add a related but distinct concern, false sharing between cores on the same cache line; that is covered on the C Advanced page's concurrency modules, not here.","pitfall":"Assuming \"touches every element once\" means two loop orders must cost the same; memory access order, not just access count, dominates performance on real hardware.","verify":null,"follow":[{"q":"Does the compiler ever fix this automatically?","a":"A sufficiently aggressive optimizer can sometimes reorder loops (loop interchange) when it proves this is safe, but that is not guaranteed, especially with `-O0` or when the access pattern is not this simple."},{"q":"Does this matter for a firmware log buffer processed in a fixed stride?","a":"Yes, any code walking a large table with a large, fixed stride (skipping fields, or processing one column of a struct-of-arrays) hits the same effect, independent of whether it is literally a 2D array."}],"mod":5},{"id":"5.15","level":"Principal","type":"Scenario","fig":null,"tags":["protocol","parsing"],"q":"Design a parser for a byte buffer containing a sequence of variable-length TLV (type-length-value) records, safe against a truncated or malicious buffer.","short":"Never trust the declared length field alone: before reading a record's header, check enough bytes remain for the header itself, and before reading its value, check the header's declared length does not run past the buffer's actual end; stop and report truncation rather than reading out of bounds.","deep":"```c\n#include <stdio.h>\n#include <stddef.h>\n#include <stdint.h>\n\nint parse_records(const uint8_t *buf, size_t len) {\n    size_t i = 0; int count = 0;\n    while (i < len) {\n        if (i + 2 > len) { printf(\"truncated header at %zu\\n\", i); break; }\n        uint8_t type = buf[i], vlen = buf[i + 1];\n        if (i + 2 + vlen > len) { printf(\"truncated value at %zu\\n\", i); break; }\n        printf(\"record: type=%u len=%u\\n\", type, vlen);\n        i += 2 + vlen;\n        count++;\n    }\n    return count;\n}\n```\nCompiled and run on `{0x01,0x02,'h','i',0x02,0x00}`: printed one record with `type=1 len=2`, then a second with `type=2 len=0`, and returned `2` parsed records; a truncated buffer instead prints which check stopped it, rather than reading past `len`.\n- State the design principle unprompted: every bounds check is computed as \"current offset plus needed bytes, compared against `len`\", written to avoid overflow itself (checking `i + 2 + vlen > len` with all-`size_t` arithmetic works here because `len` is small; for attacker-controlled `vlen` near `SIZE_MAX`, compute the check as `len - i < 2 + (size_t)vlen` style guards instead, to avoid the addition overflowing).\n- Pitfall reviewers should look for: any place a length field from the buffer itself is used as an array index or copy length without first being validated against the buffer's real remaining size.","pitfall":"Trusting a length field read from untrusted data to index or size a copy without first bounding it against the buffer's actual remaining size.","verify":null,"follow":[{"q":"Why check `i + 2 > len` before reading `type`/`vlen` instead of just reading and catching a crash?","a":"C gives no fault-based safety net for buffer reads; an out-of-bounds read is undefined behavior, not a guaranteed, catchable trap, so the check must happen before the read."},{"q":"How would this change for a length field wider than one byte, say a 16-bit length?","a":"The same two checks, just reading a 2-byte length (with defined byte order) and comparing against `len` the same way; the endianness of that length field then also needs to be pinned down, not left as fatal to interpret with the host's native order."}],"mod":5},{"id":"5.16","level":"Principal","type":"Debug","fig":null,"tags":["strcpy","overflow"],"q":"A firmware log function using `strcpy` into a fixed-size line buffer occasionally corrupts adjacent state. Root-cause it and fix it.","short":"`strcpy` has no destination-size parameter, so any log message longer than the buffer overflows it; that overflow is exactly what is corrupting whatever happens to sit next in memory. The fix bounds the copy explicitly and terminates the result itself, since `strncpy` alone does not guarantee null-termination when the source is too long.","deep":"```c\n#include <stdio.h>\n#include <string.h>\n#include <stddef.h>\n\n/* BUGGY */\nvoid log_line_buggy(char *out, const char *msg) {\n    strcpy(out, msg);   /* BUG: no bound; a long msg overruns out */\n}\n/* FIXED */\nvoid log_line_fixed(char *out, size_t outsz, const char *msg) {\n    size_t n = strlen(msg);\n    if (n >= outsz) n = outsz - 1;   /* strncpy alone would not null-terminate here */\n    memcpy(out, msg, n);\n    out[n] = '\\0';\n}\nint main(void) {\n    char line[8];\n    log_line_fixed(line, sizeof(line), \"firmware boot ok\");\n    printf(\"\\\"%s\\\" (len %zu, buffer %zu)\\n\", line, strlen(line), sizeof(line));\n}\n```\nCompiled and run: printed `\"firmwar\" (len 7, buffer 8)`, correctly truncated to 7 characters plus the terminator, with no overflow.\n- Root-cause method for \"corrupts adjacent state\" reports in general: identify what variable sits immediately after the overflowed buffer in memory (stack layout or struct field order), confirm its corruption is consistent with the overflow's length, then confirm the fix by checking the corruption stops under the same inputs; AddressSanitizer (module 16) would name this directly as a buffer overflow without that manual reasoning.","pitfall":"Believing `strncpy` is a drop-in safe replacement for `strcpy` without separately handling the case where it does not null-terminate.","verify":null,"follow":[{"q":"Why not just call `strncpy(out, msg, outsz)`?","a":"`strncpy` stops writing at `outsz` bytes but does not append a `'\\0'` if the source was that long or longer, so the \"fixed\" version could still leave `out` without a terminator; the manual `n >= outsz` check and explicit `out[n] = '\\0'` close that gap."},{"q":"Would `snprintf(out, outsz, \"%s\", msg)` be simpler?","a":"Yes, and it also guarantees null-termination; it is generally the preferred fix in real code, shown here as the manual equivalent to make the exact byte accounting visible."}],"mod":5},{"id":"5.17","level":"Principal","type":"Concept","fig":null,"tags":["api-design","firmware"],"q":"When designing string/buffer handling APIs for firmware, why prefer explicit-length functions over the plain `str*` family everywhere?","short":"Every plain `str*` function (`strcpy`, `strcat`, `strlen` on unterminated data) assumes the caller already got the length right; an explicit-length API takes the destination capacity as a parameter and can refuse or truncate safely, turning a silent memory-corruption bug into a checked, recoverable error.","deep":"```c\n#include <string.h>\n#include <stddef.h>\n\nint safe_copy(char *dst, size_t dstsz, const char *src, size_t srclen) {\n    if (srclen + 1 > dstsz)\n        return -1;             /* reject instead of silently truncating or overflowing */\n    memcpy(dst, src, srclen);\n    dst[srclen] = '\\0';\n    return 0;\n}\n```\nCompiled and run: copying a 5-byte string into a 6-byte buffer returned `0` with the buffer correctly filled; copying a 6-byte string into the same 6-byte buffer returned `-1`, rejected rather than overflowed.\n- State the review checklist unprompted: for firmware code specifically, prefer functions that take both a destination and its capacity, reject rather than best-effort-truncate when that is ambiguous for the caller's protocol, and never call a length-unaware `str*` function on data that did not originate from a literal you control.","pitfall":"Adding a length parameter to an API \"for safety\" but never actually checking it against the destination capacity inside the function body.","verify":null,"follow":[{"q":"Does this mean `strlen`/`strcpy` should never appear in firmware code?","a":"Not literally never, but only on data whose null-termination and bound are already established by the code writing it, such as a local string literal; anything from a wire protocol or another subsystem should go through an explicit-length path."},{"q":"Is this the same idea as module 8's discussion of allocator contracts?","a":"Related in spirit (making an implicit assumption explicit and checkable), but module 8 is about `malloc`/`free`'s size and lifetime contracts specifically, not string length."}],"mod":5},{"id":"5.18","level":"Principal","type":"Numeric","fig":null,"tags":["multidim","offset"],"q":"For `int a[2][3][4]`, work out the linear element offset of `a[1][2][3]` from `a[0][0][0]`, and its byte offset.","short":"With dimensions `[2][3][4]`, the offset formula is `i*3*4 + j*4 + k` elements. For `i=1, j=2, k=3`: `1*12 + 2*4 + 3 = 23` elements, so `23 * sizeof(int) = 92` bytes on a 4-byte `int`.","deep":"```c\n#include <stdio.h>\n#include <stddef.h>\n\nint main(void) {\n    int a[2][3][4];\n    int i = 1, j = 2, k = 3;\n    ptrdiff_t manual = (ptrdiff_t)i * 3 * 4 + (ptrdiff_t)j * 4 + k;\n    ptrdiff_t actual = &a[i][j][k] - &a[0][0][0];\n    printf(\"manual = %td, actual = %td, byte offset = %td\\n\",\n           manual, actual, actual * (ptrdiff_t)sizeof(int));\n    return 0;\n}\n```\nCompiled and run: `manual` and `actual` both printed `23`, and the byte offset printed `92`, confirming the general row-major formula `i*(dim2*dim3) + j*dim3 + k` for a 3D array.","pitfall":"Applying a 2D row-major formula (`i*ncols+j`) unmodified to a 3D or higher array instead of multiplying by the product of all the trailing dimensions.","verify":null,"follow":[{"q":"Does this generalize to N dimensions?","a":"Yes: each index's stride is the product of every dimension strictly to its right, which is exactly how the compiler computes multidimensional subscripting internally (6.5.2.1p3, applied recursively one dimension at a time)."},{"q":"Why compute `manual` with explicit `(ptrdiff_t)` casts on `i` and `j`?","a":"To force the multiplication to happen in `ptrdiff_t` rather than `int`, avoiding a smaller-type overflow if the dimensions or indices were large; here it makes no numeric difference but is the safer habit."}],"mod":5},{"id":"6.01","level":"Basic","type":"Concept","fig":null,"tags":["padding","alignment"],"q":"Why does `struct { char a; int b; char c; }` usually take more than 6 bytes?","short":"Each non-bit-field member must be aligned \"in an implementation-defined manner appropriate to its type\" (C11 6.7.2.1p14); on a typical target `int` needs 4-byte alignment, so the compiler inserts padding before `b` and after `c` to keep every member aligned and the whole struct's size a multiple of its own alignment.","deep":"```c\n#include <stdio.h>\n\nint main(void) {\n    struct example { char a; int b; char c; };\n    printf(\"sizeof = %zu\\n\", sizeof(struct example));\n    printf(\"naive sum = %zu\\n\", sizeof(char) + sizeof(int) + sizeof(char));\n    return 0;\n}\n```\nCompiled and run: `sizeof` printed `12`, while the naive sum of member sizes was `6`; the difference is 3 padding bytes before `b` (to reach 4-byte alignment) and 3 trailing padding bytes after `c` (so the struct's total size is a multiple of `int`'s 4-byte alignment, satisfying arrays of this struct).","pitfall":"Computing a struct's \"expected\" size as the sum of its members' sizes and being surprised when `sizeof` disagrees.","verify":null,"follow":[{"q":"Does padding show up if you print the struct byte by byte?","a":"Yes, but its contents are unspecified (C11 6.2.6.1p6): padding bytes take unspecified values, so never rely on what happens to be there."},{"q":"Would `#pragma pack` remove this padding?","a":"Yes, but it also removes the alignment guarantee for `b`, which can cost real performance (or fault on some architectures) for unaligned multi-byte access; see 6.10 for when that trade is actually worth it."}],"mod":6},{"id":"6.02","level":"Basic","type":"Concept","fig":null,"tags":["layout","initial-member"],"q":"Why is it legal to cast a `struct point { int x; int y; } *` to `int *` and read the first member through it?","short":"C11 6.7.2.1p15 explicitly guarantees a pointer to a structure, suitably converted, points to its initial member (and vice versa), because non-bit-field members are laid out in declaration order with no padding before the very first one.","deep":"```c\n#include <stdio.h>\n\nint main(void) {\n    struct point { int x; int y; };\n    struct point p = {1, 2};\n    struct point *pp = &p;\n    int *first_member = (int *)pp;\n    printf(\"%d %d\\n\", *first_member, p.x);\n    return 0;\n}\n```\nCompiled and run: both printed `1`, confirming the converted pointer reads the same bytes as `p.x`.","pitfall":"Assuming the same \"points to the initial member\" trick works for reaching a struct's second or later member through a plain type-punned pointer.","verify":null,"follow":[{"q":"Does this guarantee extend to the second member too?","a":"No; only the initial member has this guaranteed no-padding-before-it property (6.7.2.1p15 says \"there may be unnamed padding within a structure object, but not at its beginning\"), so reaching `y` this way is not guaranteed."},{"q":"Is this the mechanism behind \"inheritance\" tricks in C, where a base struct is embedded first in a derived struct?","a":"Yes, that pattern relies on exactly this guarantee: a pointer to the derived struct, converted to a pointer to the base struct type, correctly reaches the embedded base struct's first member and beyond, as long as the base struct is literally the first member."}],"mod":6},{"id":"6.03","level":"Basic","type":"Numeric","fig":"structpad","tags":["offsetof","layout"],"q":"Work out the byte offsets and total size of `struct cmd_header { uint8_t opcode; uint16_t nsid; uint32_t cdw2; uint8_t flags; }`.","short":"`opcode` at offset 0 (1 byte). `nsid` needs 2-byte alignment, so 1 padding byte, landing at offset 2. `cdw2` needs 4-byte alignment, and offset 4 already satisfies that, so no gap. `flags` at offset 8 (1 byte), then 3 trailing padding bytes so the struct's total size, 12, is a multiple of 4.","deep":"```c\n#include <stdio.h>\n#include <stddef.h>\n#include <stdint.h>\n\nint main(void) {\n    struct cmd_header {\n        uint8_t  opcode;\n        uint16_t nsid;\n        uint32_t cdw2;\n        uint8_t  flags;\n    };\n    printf(\"%zu %zu %zu %zu, size %zu\\n\",\n           offsetof(struct cmd_header, opcode), offsetof(struct cmd_header, nsid),\n           offsetof(struct cmd_header, cdw2), offsetof(struct cmd_header, flags),\n           sizeof(struct cmd_header));\n    return 0;\n}\n```\nCompiled and run: offsets were `0, 2, 4, 8`, and `sizeof` was `12`, exactly matching the manual walk above. `offsetof` (from `<stddef.h>`, C11 7.19p3) is the standard, portable way to get these numbers instead of computing them by hand.","pitfall":"Computing a struct's wire size as the sum of its field sizes instead of measuring `sizeof` (or working out alignment-driven padding by hand).","verify":"C11 7.19p3, the `offsetof` macro's contract (undefined if the named member is a bit-field).","follow":[{"q":"Where exactly are the padding bytes in this layout?","a":"One byte at offset 1 (before `nsid`), and three bytes at offsets 9-11 (after `flags`, to round the struct up to a multiple of its 4-byte alignment)."},{"q":"Would reordering the members to `opcode, flags, nsid, cdw2` change the total size?","a":"Yes, it would shrink to 8 bytes: the two `uint8_t` fields pack together first, `nsid` then needs no padding to reach 2-byte alignment at offset 2, and `cdw2` lands exactly at offset 4 with nothing wasted."}],"mod":6},{"id":"6.04","level":"Intermediate","type":"Concept","fig":null,"tags":["padding","reordering"],"q":"Does reordering a struct's members ever change its size, and how do you order them to minimize padding?","short":"Yes; padding is inserted between members based on the alignment of whatever comes next, so declaring wider, more strictly-aligned members first (largest alignment to smallest) generally minimizes total padding, since it avoids leaving small gaps that a later member's alignment demands.","deep":"```c\n#include <stdio.h>\n\nint main(void) {\n    struct bad_order  { char a; double b; char c; int d; };\n    struct good_order { double b; int d; char a; char c; };\n    printf(\"%zu %zu\\n\", sizeof(struct bad_order), sizeof(struct good_order));\n    return 0;\n}\n```\nCompiled and run: `bad_order` was `24` bytes, `good_order` was `16` bytes, for the exact same four members, just reordered.","pitfall":"Reordering struct members purely to save space in a struct whose layout is also used as a fixed on-disk or on-wire format, breaking compatibility with existing data.","verify":null,"follow":[{"q":"Why does putting `double b` first help here?","a":"It has the largest alignment requirement (8 bytes on this target); placing it at offset 0 costs nothing, whereas placing it after a `char` forces 7 padding bytes to reach 8-byte alignment."},{"q":"Is there ever a reason not to reorder for minimum padding?","a":"Yes, when the struct's layout must match an external wire format or hardware register map exactly; then the order is dictated by the protocol, not by minimizing size (see 6.10 and 6.15)."}],"mod":6},{"id":"6.05","level":"Intermediate","type":"Concept","fig":null,"tags":["union","type-punning"],"q":"Why is reading a union member other than the one last written considered undefined behavior in general, and what is the one safe way to reinterpret bytes?","short":"C11 6.2.6.1p7 says the bytes not corresponding to the last-written member take unspecified values, and reading a value through the wrong member is a form of type punning the standard does not define, except for the specific common-initial-sequence case (6.5.2.3p6, see 6.06). The one portable way to reinterpret an object's bytes as another type is to `memcpy` its object representation, never to read it back through a different union member or pointer type.","deep":"```c\n#include <stdio.h>\n#include <string.h>\n#include <stdint.h>\n\nint main(void) {\n    union { int32_t i; float f; } value;\n    value.f = 3.5f;\n    /* correct: read back the member that was last written */\n    printf(\"%.1f\\n\", value.f);\n    /* reinterpreting the same bytes as a different type: copy the representation */\n    int32_t bits;\n    memcpy(&bits, &value.f, sizeof bits);\n    printf(\"0x%08x\\n\", (unsigned)bits);\n    return 0;\n}\n```\nCompiled and run: printed `3.5` for the direct read, and `0x40600000` for the `memcpy`-based bit pattern, which is the IEEE-754 encoding of `3.5f`.","pitfall":"Writing one union member and reading a different, unrelated-type member expecting a defined \"reinterpret\" result, when the standard only defines that for members sharing a common initial sequence.","verify":null,"follow":[{"q":"Isn't reading `value.i` right after writing `value.f` a very common trick anyway?","a":"It is common and works on most mainstream compilers in practice, but it is not defined by the C11 union rules in general; module 10 covers why strict aliasing makes this specific pattern risky under optimization."},{"q":"Why is `memcpy` considered safe when a union read is not?","a":"`memcpy` operates on `unsigned char` object representations, which C11 6.2.6.1p4-5 explicitly permits for any object, sidestepping the type-based aliasing question entirely."}],"mod":6},{"id":"6.06","level":"Intermediate","type":"Scenario","fig":null,"tags":["union","common-initial-sequence"],"q":"Two structs in a union both start with `int kind;`. Is it defined to read `.kind` through whichever struct member is not the one currently active?","short":"Yes. C11 6.5.2.3p6 makes a special exception: if a union's members are structures that share a common initial sequence (corresponding members with compatible types, same widths for bit-fields), that shared prefix may be inspected through any of them, regardless of which one was last written. This is exactly the \"tagged union\" idiom.","deep":"```c\n#include <stdio.h>\n\nstruct a { int kind; int x; };\nstruct b { int kind; float y; };\nunion either { struct a as_a; struct b as_b; };\n\nint main(void) {\n    union either u;\n    u.as_a.kind = 1;\n    u.as_a.x = 42;\n    printf(\"%d %d\\n\", u.as_a.kind, u.as_b.kind);   /* both valid reads of the shared prefix */\n    return 0;\n}\n```\nCompiled and run: both printed `1`, confirming `u.as_b.kind` legitimately reads the same value as `u.as_a.kind`, even though `as_a` is the active member.","pitfall":"Assuming the common-initial-sequence exception covers the whole struct, when it only covers the members that are actually identical in type and position up to some point.","verify":null,"follow":[{"q":"Does the exception cover `u.as_b.y` after writing `u.as_a.x`?","a":"No; `x` and `y` are not part of the common initial sequence (they differ in position and type), so reading `y` here is not covered by this exception and is undefined."},{"q":"Is a separate, explicit `tag` field outside the union a more robust pattern than relying on this rule?","a":"Yes, and it is what 6.05's tagged-union example does; the common-initial-sequence rule is narrower and easier to get subtly wrong than an explicit external tag."}],"mod":6},{"id":"6.07","level":"Intermediate","type":"Concept","fig":null,"tags":["bitfields","portability"],"q":"What exactly does the standard leave implementation-defined about bit-field layout?","short":"C11 6.7.2.1p11 leaves both the bit order within a storage unit (high-to-low or low-to-high) and whether a bit-field that does not fit the remaining space starts a new unit or overlaps units as implementation-defined; the unit's own alignment is left merely unspecified. None of that is something portable code may assume matches across compilers or targets.","deep":"```c\n#include <stdio.h>\n\nint main(void) {\n    struct flags { unsigned int ready : 1; unsigned int mode : 2; unsigned int reserved : 5; };\n    struct flags f = {0};\n    f.ready = 1;\n    f.mode = 3;\n    printf(\"sizeof=%zu ready=%u mode=%u\\n\", sizeof(struct flags), f.ready, f.mode);\n    return 0;\n}\n```\nCompiled and run: `sizeof` was `4`, `ready` was `1`, `mode` was `3`, all as expected for reading back what was just written; what this program cannot show is the physical bit order within that 4-byte unit, since C gives no portable way to observe it other than through the members themselves.","pitfall":"Writing a bit-field struct and assuming its physical bit layout is portable to another compiler or CPU architecture.","verify":null,"follow":[{"q":"Can you rely on `f.ready` occupying literally bit 0 of the first byte?","a":"No, not portably; that specific placement is a GCC/x86 convention, not a C11 guarantee, which is exactly why bit-field structs are risky for wire formats (see 6.11)."},{"q":"Does `_Bool` behave specially as a bit-field type?","a":"Yes; C11 6.7.2.1p10 guarantees a nonzero-width `_Bool` bit-field stores 0/1 correctly, which is a narrower guarantee than plain `int`/`unsigned int` bit-fields get."}],"mod":6},{"id":"6.08","level":"Intermediate","type":"Concept","fig":null,"tags":["flexible-array","c99"],"q":"How does a flexible array member let one struct describe a variable-length allocation?","short":"C11 6.7.2.1p18 lets the last member of a struct with at least one other named member be declared with incomplete array type, contributing nothing to `sizeof` the struct itself; the real storage for it is provided by allocating `sizeof(struct) + N * sizeof(element)` bytes and treating the tail as an `N`-element array.","deep":"```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint main(void) {\n    struct packet { int n; double data[]; };   /* flexible array member (C99) */\n    int m = 3;\n    struct packet *p = malloc(sizeof(struct packet) + m * sizeof(double));\n    p->n = m;\n    for (int i = 0; i < m; i++) p->data[i] = i * 1.5;\n    printf(\"sizeof(struct packet) = %zu\\n\", sizeof(struct packet));\n    return 0;\n}\n```\nCompiled and run: `p->data[0..2]` read back `0.0, 1.5, 3.0` as written, and `sizeof(struct packet)` printed `8` (just the `int n` plus its trailing padding to `double`'s alignment), confirming the array itself added nothing to the struct's own size.","pitfall":"Declaring a fixed-size array as the intended \"flexible\" tail member (e.g. `double data[1]`) and then indexing past index 0 without having actually allocated the extra space `malloc`-side.","verify":null,"follow":[{"q":"Why not just declare `double data[3]` directly instead?","a":"That fixes the array length at compile time; a flexible array member lets one struct definition serve any runtime-chosen length from a single `malloc` call."},{"q":"Can you have more than one flexible array member?","a":"No, only the very last member of the struct may have this incomplete array form, and the struct must have at least one other named member before it."}],"mod":6},{"id":"6.09","level":"Intermediate","type":"Trap","fig":null,"tags":["bitfields","signedness"],"q":"Is `struct { int mode : 2; }` a signed or unsigned 2-bit field, and why does that matter?","short":"C11 6.7.2 makes it implementation-defined whether a plain `int` bit-field is signed or unsigned; if it is signed, a 2-bit field can only represent `-2..1`, so storing `3` into it and reading it back can legitimately give `-1`, which surprises code that assumed unsigned wraparound.","deep":"```c\n#include <stdio.h>\n\nint main(void) {\n    struct s { int mode : 2; };\n    struct s v;\n    v.mode = 3;\n    printf(\"%d\\n\", v.mode);\n    return 0;\n}\n```\nCompiled and run with GCC on this target: printed `-1`, because GCC's plain-`int` bit-fields are signed here, and the 2-bit pattern `11` is `-1` in a signed 2-bit two's-complement interpretation.","pitfall":"Declaring a multi-value bit-field as plain `int` and being surprised when a value that \"should\" be small and positive reads back negative.","verify":null,"follow":[{"q":"How do you avoid this ambiguity entirely?","a":"Declare the bit-field as `unsigned int` (or `signed int`) explicitly rather than plain `int`, which pins down the signedness the standard otherwise leaves implementation-defined."},{"q":"Would `_Bool mode : 1;` have the same ambiguity?","a":"No; C11 6.7.2.1p10 specifically guarantees a `_Bool` bit-field stores and reads back 0/1 correctly, with no signedness ambiguity."}],"mod":6},{"id":"6.10","level":"Advanced","type":"Concept","fig":null,"tags":["packed","wire-format"],"q":"What does `__attribute__((packed))` actually change, and when is giving up alignment worth it?","short":"A packed struct tells the compiler to omit the padding it would otherwise insert between and after members, so the struct's `sizeof` becomes exactly the sum of its members' sizes; it is worth the (potential) unaligned-access cost specifically when the struct's layout must match an external, fixed byte layout, such as a wire protocol header, exactly.","deep":"```c\n#include <stdio.h>\n#include <stdint.h>\n\nint main(void) {\n    struct wire_unpacked { uint8_t opcode; uint32_t lba; };\n    struct __attribute__((packed)) wire_packed { uint8_t opcode; uint32_t lba; };\n    printf(\"%zu %zu\\n\", sizeof(struct wire_unpacked), sizeof(struct wire_packed));\n    return 0;\n}\n```\nCompiled and run: `wire_unpacked` was `8` bytes (3 padding bytes before `lba` to reach 4-byte alignment), `wire_packed` was `5` bytes, matching the 5 bytes actually meant to be sent on the wire.","pitfall":"Packing a struct that is used for everyday in-memory computation (not wire I/O) purely to save a few bytes, and paying a real performance cost on every access instead.","verify":null,"follow":[{"q":"Is `__attribute__((packed))` standard C11?","a":"No, it is a GCC/Clang extension; `#pragma pack` (also nonstandard but widely supported, including by MSVC) is the other common spelling of the same idea."},{"q":"Does packing ever cost more than it saves?","a":"Yes; unaligned multi-byte member access inside a packed struct can be slower (extra bus cycles) or, on some non-x86 architectures, fault outright, so packed structs are typically only accessed through explicit byte-copy helpers, not by direct member dereference on strict-alignment targets."}],"mod":6},{"id":"6.11","level":"Advanced","type":"Scenario","fig":null,"tags":["protocol","bitfields"],"q":"You need to parse a 32-bit command word into an 8-bit opcode, 8-bit flags, and 16-bit length. Why is manual shifting and masking usually preferred over a bit-field struct here?","short":"A bit-field struct's bit order and packing rules are implementation-defined (6.7.2.1p11, see 6.07), so the same struct definition can read a wire word differently on another compiler or a big-endian target. Manual `>>`/`&` extraction is defined purely in terms of the integer's own value, independent of the compiler's internal bit-field layout choices, so it behaves identically everywhere.","deep":"```c\n#include <stdio.h>\n#include <stdint.h>\n\nstruct cmd_word { uint32_t raw; };\nstatic unsigned get_opcode(struct cmd_word c) { return c.raw & 0xFFu; }\nstatic unsigned get_flags(struct cmd_word c)  { return (c.raw >> 8) & 0xFFu; }\nstatic unsigned get_length(struct cmd_word c) { return (c.raw >> 16) & 0xFFFFu; }\n\nint main(void) {\n    struct cmd_word c = {0x12340105u};\n    printf(\"opcode=0x%02x flags=0x%02x length=0x%04x\\n\",\n           get_opcode(c), get_flags(c), get_length(c));\n    return 0;\n}\n```\nCompiled and run: printed `opcode=0x05 flags=0x01 length=0x1234`, matching the intended field layout by construction, regardless of what any compiler's bit-field packing would have chosen.","pitfall":"Defining a bit-field struct to match a hardware register or wire format's documented bit layout and assuming the compiler will honor that documented order.","verify":null,"follow":[{"q":"Does this still depend on `raw`'s byte order once it comes off a wire?","a":"Yes; `raw` itself still needs a defined byte order when it is read from a byte stream (e.g. explicit `buf[0] | buf[1]<<8 | ...`), which is a separate concern from the bit-shifting shown here."},{"q":"When is a bit-field struct actually fine to use?","a":"For purely in-memory flags a single program defines and consumes itself, with no cross-compiler or on-disk persistence requirement; portability across builds is the deciding factor, not \"is it a protocol\" per se."}],"mod":6},{"id":"6.12","level":"Advanced","type":"Debug","fig":null,"tags":["sizeof","padding","serialization"],"q":"Code sending a struct over the network computed its wire size as `sizeof(uint8_t) + sizeof(uint32_t)` instead of `sizeof(struct telemetry)`, and the receiver got corrupted data. What went wrong?","short":"The naive sum ignores padding the compiler actually inserts; for `struct telemetry { uint8_t status; uint32_t counter; }` the real struct is 8 bytes (3 padding bytes before `counter`), not the naive 5, so a `memcpy` of `sizeof(struct telemetry)` bytes needs 8 bytes, not 5, and sizing the send/receive buffer from the naive sum truncates the struct.","deep":"```c\n#include <stdio.h>\n#include <stddef.h>\n#include <stdint.h>\n\nint main(void) {\n    struct telemetry { uint8_t status; uint32_t counter; };\n    size_t wrong_wire_size(void) { return sizeof(uint8_t) + sizeof(uint32_t); }  /* BUG: ignores padding */\n    size_t correct_wire_size(void) { return sizeof(struct telemetry); }\n    printf(\"%zu %zu\\n\", wrong_wire_size(), correct_wire_size());\n    return 0;\n}\n```\nCompiled and run: printed `5` and `8`; a `memcpy(wire_buf, &t, wrong_wire_size())` would only copy the first 5 bytes of an 8-byte struct, silently dropping part of `counter` (or, read back on the other end at the wrong offset, misinterpreting whatever bytes were actually sent).\n- Root-cause method: whenever a \"size\" computed field-by-field disagrees with `sizeof` the actual struct, the difference is padding; check with `offsetof` on each member (as in 6.03) to see exactly where the gaps are, rather than guessing.","pitfall":"Recomputing a struct's \"size\" as a sum of its member sizes anywhere the value needs to match what `sizeof` (and therefore `memcpy`) actually produces.","verify":null,"follow":[{"q":"Would `__attribute__((packed))` have been the right fix here?","a":"It is one valid fix (see 6.10), forcing `sizeof` down to match the naive sum; the other valid fix is simply using `sizeof(struct telemetry)` everywhere instead of the naive per-field sum."},{"q":"Is this bug specific to network code?","a":"No, the same mistake appears any time a struct's size is recomputed by hand for a flash write, a shared-memory region, or a checksum range, instead of measured with `sizeof`."}],"mod":6},{"id":"6.13","level":"Advanced","type":"Cross-layer","fig":null,"tags":["alignment","cache-line"],"q":"Why might firmware code deliberately over-align a frequently-updated struct to a full cache line, even though C11's default alignment would be smaller?","short":"C11's `_Alignas`/`__attribute__((aligned))` can request a stricter alignment than the type's natural one (6.2.8p3's \"over-aligned type\"); padding a hot struct out to a full cache line (commonly 64 bytes) stops it from sharing a cache line with an unrelated, independently-updated struct, avoiding false-sharing-style cache traffic between accesses.","deep":"```c\n#include <stdio.h>\n\nint main(void) {\n    struct counter_unpadded { int value; };\n    struct __attribute__((aligned(64))) counter_padded { int value; };\n    printf(\"%zu/%zu  %zu/%zu\\n\",\n           sizeof(struct counter_unpadded), _Alignof(struct counter_unpadded),\n           sizeof(struct counter_padded), _Alignof(struct counter_padded));\n    return 0;\n}\n```\nCompiled and run: `counter_unpadded` was `4` bytes with 4-byte alignment; `counter_padded` was `64` bytes with 64-byte alignment, one full cache line per struct.\n- This spans language and hardware: the C11 alignment mechanism is standard, but \"why 64\" is a property of the target CPU's cache line size, not the language; getting the number right requires knowing the target, not just the standard.\n- On a single core with no concurrent access, this padding buys nothing and only wastes memory; it earns its cost specifically when two independently-updated objects would otherwise share a line, which is fundamentally a multi-core concern. The full false-sharing story across threads belongs on the C Advanced page's memory-ordering/concurrency modules, not here.","pitfall":"Over-aligning every struct in a codebase \"for performance\" without profiling; it costs real memory and only helps the specific case of contended, independently-accessed neighbors on the same cache line.","verify":null,"follow":[{"q":"Is `_Alignas(64)` on the member equivalent to `__attribute__((aligned(64)))` on the struct?","a":"`_Alignas` is the standard C11 spelling and can be applied to an object or a struct member; putting it on the struct type itself (as done here with the GCC attribute) affects every instance's alignment, which is the usual intent for this pattern."},{"q":"Does over-aligning always require an over-aligned type per 6.2.8p3?","a":"Yes by definition; requesting an alignment stricter than `_Alignof(max_align_t)` makes the type \"over-aligned,\" and C11 leaves whether/where extended alignments are supported implementation-defined."}],"mod":6},{"id":"6.14","level":"Advanced","type":"Trap","fig":null,"tags":["strict-aliasing","type-punning"],"q":"`unsigned int *aliased = (unsigned int *)&f;` where `f` is a `float`, then reading `*aliased`. Why is this considered undefined even though it \"just works\" on most compilers?","short":"Reading an object through an lvalue of a type unrelated to the object's actual (effective) type violates the strict-aliasing rule the C standard implies through its type system (formalized in module 10); the safe, always-defined way to reinterpret the same bytes is to `memcpy` them into an object of the target type, which copies the object representation rather than aliasing it.","deep":"```c\n#include <stdio.h>\n#include <string.h>\n\nint main(void) {\n    float f = 1.0f;\n    unsigned int bits;\n    memcpy(&bits, &f, sizeof bits);          /* safe: copies the object representation */\n    printf(\"via memcpy:      0x%08x\\n\", bits);\n    unsigned int *aliased = (unsigned int *)&f;\n    printf(\"via aliased ptr: 0x%08x\\n\", *aliased);   /* technically UB, shown for comparison */\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra` (no warning at the default optimization level used here) and run: both printed `0x3f800000`, the IEEE-754 bit pattern for `1.0f`; at higher optimization levels a compiler is entitled to assume `aliased` and `f` do not overlap and could produce a different, still not-wrong-per-the-standard result, which is exactly why this is dangerous rather than merely stylistically discouraged.","pitfall":"\"Fixing\" a strict-aliasing warning by adding a cast instead of switching to `memcpy`; the cast silences nothing about the actual undefined behavior, only about a compiler diagnostic.","verify":"Strict aliasing's formal basis (the \"effective type\" rules) is covered in depth in module 10; this module states the union/pointer-cast consequence only.","follow":[{"q":"Does this contradict the union-based type punning from 6.05?","a":"No, it reinforces it: reading through a raw pointer cast has the same aliasing problem as reading the wrong union member, and `memcpy` is the one technique the standard treats as always safe for both cases."},{"q":"Is casting to `char *` and reading byte-by-byte also a strict-aliasing violation?","a":"No; C11 makes an explicit exception for accessing any object's bytes through a character type, which is part of why `memcpy` (which does exactly that internally) is safe."}],"mod":6},{"id":"6.15","level":"Principal","type":"Scenario","fig":null,"tags":["protocol","design"],"q":"Design a packed C struct for a simplified NVMe-style command header (1-byte opcode, 1-byte flags, 2-byte command ID, 4-byte namespace ID, 8-byte PRP pointer) that is guaranteed to match its documented wire layout.","short":"Use fixed-width types from `<stdint.h>` for every field (never plain `int`/`long`, whose widths vary by platform), declare fields in the exact documented order, and mark the struct `__attribute__((packed))` so the compiler never inserts padding the specification does not call for; verify with `sizeof` and `offsetof` against the spec's byte layout before trusting it.","deep":"```c\n#include <stdio.h>\n#include <stdint.h>\n\nstruct __attribute__((packed)) nvme_cmd_hdr {\n    uint8_t  opcode;\n    uint8_t  flags;\n    uint16_t cid;\n    uint32_t nsid;\n    uint64_t prp1;\n};\n\nint main(void) {\n    struct nvme_cmd_hdr h = {0x02, 0x00, 0x1234, 0x1, 0x100000ULL};\n    printf(\"sizeof=%zu opcode=0x%02x cid=0x%04x nsid=0x%08x prp1=0x%llx\\n\",\n           sizeof h, h.opcode, h.cid, h.nsid, (unsigned long long)h.prp1);\n    return 0;\n}\n```\nCompiled and run: `sizeof` was `16` (1+1+2+4+8, matching the spec's byte layout with no gaps, since every field here already lands on a naturally aligned offset even without packing); the fields read back exactly as assigned.\n- State the review checklist unprompted for a design like this: fixed-width types everywhere; explicit endianness handling at the point bytes cross a wire (this layout says nothing about byte order within `cid`/`nsid`/`prp1`, which must match the spec's stated endianness, typically little-endian for NVMe); `packed` to remove any padding ambiguity; and a static assertion (`_Static_assert(sizeof(struct nvme_cmd_hdr) == 16, \"layout mismatch\")`, C11 6.7.10) to catch a future change or a different compiler's surprise at build time rather than at runtime.\n- Pitfall to flag in review: accessing multi-byte fields of a packed struct directly on a strict-alignment target risks an unaligned-access fault; if that target matters, read fields through a byte-copy helper instead of direct member access.","pitfall":"Using plain `int`/`long`/`unsigned` fields in a protocol struct, which compiles fine on the development machine but changes width (and therefore the whole layout) on a different target or ABI.","verify":null,"follow":[{"q":"Why fixed-width types instead of `int`/`long`?","a":"`int` and `long` have platform- and ABI-dependent widths in C11 (only minimum ranges are guaranteed); a protocol header needs an exact, portable width for every field, which is exactly what `<stdint.h>`'s `uintN_t` types guarantee."},{"q":"Why `_Static_assert` the size instead of just trusting the packed attribute?","a":"A static assertion converts \"the layout is right\" from an assumption into a build-time-checked fact, catching a future member insertion or a switch to a compiler that handles the attribute differently before it ships."}],"mod":6},{"id":"6.16","level":"Principal","type":"Debug","fig":null,"tags":["serialization","portability"],"q":"The same struct, `memcpy`'d directly into a shared buffer, decodes correctly on one build but not another. Root-cause it.","short":"If the struct is not explicitly packed, its padding (and therefore its total size and field offsets) is implementation-defined and can differ between compilers, optimization settings, or target ABIs; a direct `memcpy` of the whole struct silently bakes in whichever layout the writer's build happened to choose, which the reader's build may not share.","deep":"```c\n#include <stdio.h>\n#include <stdint.h>\n#include <string.h>\n\nstruct hdr_a { uint8_t op; uint32_t len; };                         /* default layout */\nstruct __attribute__((packed)) hdr_b { uint8_t op; uint32_t len; }; /* explicit layout */\n\nint main(void) {\n    printf(\"%zu %zu\\n\", sizeof(struct hdr_a), sizeof(struct hdr_b));\n\n    struct hdr_a a = {0x5, 100};\n    unsigned char wire[5];\n    wire[0] = a.op;\n    memcpy(&wire[1], &a.len, sizeof a.len);   /* always exactly 5 bytes, by construction */\n    printf(\"wire size = %zu\\n\", sizeof wire);\n    return 0;\n}\n```\nCompiled and run: `sizeof(struct hdr_a)` was `8` (3 padding bytes before `len`), `sizeof(struct hdr_b)` was `5`; a writer built against `hdr_a`'s layout and a reader expecting `hdr_b`'s 5-byte layout (or vice versa) would disagree about where `len` even starts. The explicit field-by-field serialization at the end always produces exactly `5` bytes, regardless of either struct's padding.\n- Root-cause method: reproduce the mismatch by printing `sizeof` (and `offsetof` of each field) from both builds; if they differ, the bug is a layout assumption, not a logic error, and the fix is to stop relying on the compiler's default struct layout for anything crossing a build/ABI boundary.\n- Fix: serialize field by field into a byte buffer with an explicit, documented layout (or, at minimum, mark the struct `packed` consistently everywhere it is shared) rather than `memcpy`-ing the struct object itself.","pitfall":"Trusting that two builds of \"the same struct\" have the same in-memory layout just because the source code is identical, when compiler, optimization flags, or target ABI can each change padding decisions.","verify":null,"follow":[{"q":"Isn't `__attribute__((packed))` enough by itself to guarantee this never happens again?","a":"It removes the padding-based version of this bug, but only if every build that touches the struct applies the same attribute consistently; explicit field-by-field serialization removes the dependency on struct layout entirely, which is more robust across compilers."},{"q":"Does endianness cause the same class of symptom?","a":"Yes, a very similar one: a multi-byte field written on a little-endian build and read on a big-endian build decodes as a different number, which is a distinct bug from padding but is diagnosed the same way, by comparing the byte layout both sides actually produce."}],"mod":6},{"id":"6.17","level":"Principal","type":"Concept","fig":null,"tags":["review","serialization"],"q":"A coworker's code does `memcpy(wire_buf, &cmd, sizeof cmd);` to send a struct over a protocol link. What do you flag in review?","short":"Flag exactly three things: whether `cmd`'s layout is pinned down (packed, fixed-width fields, or otherwise spec'd) rather than left to the compiler's default padding choices; whether any padding bytes in `cmd` could leak uninitialized stack/heap memory onto the wire; and whether multi-byte fields have a defined, spec-matching byte order, since a bare `memcpy` carries the host's native endianness as-is.","deep":"- Padding bytes have unspecified contents (C11 6.2.6.1p6); if `cmd` was declared on the stack and not fully initialized member-by-member, those padding bytes can contain leftover stack data, and a raw `memcpy` sends them as-is. This is a real information-disclosure bug class, not just a style nitpick.\n- Even with every byte accounted for, a struct without `packed` (or without fixed-width, naturally-aligned fields) can change size or field offsets across compilers, exactly the failure mode in 6.16.\n- Endianness is invisible in the source: `memcpy` copies host byte order unconditionally; if the protocol specifies a fixed wire order (commonly little-endian for storage/NVMe-style protocols), a big-endian host needs explicit byte-swapping before this `memcpy`, or it needs to serialize field by field instead.\n- The Principal-level answer states a concrete method, not just a list: reproduce the struct's actual layout with `sizeof`/`offsetof` (6.03), decide whether padding could contain sensitive leftover data and zero-initialize if so, and replace the blind `memcpy` with explicit field-by-field serialization whenever the struct will ever be read by a different build, a different compiler, or a different machine's endianness.","pitfall":"Reviewing only for \"does the receiver get the right values\", and missing that padding bytes can leak unrelated memory contents onto a wire or into a file.","verify":null,"follow":[{"q":"Is zero-initializing the whole struct before filling it in enough to close the information-leak angle?","a":"Yes, `struct cmd_t cmd = {0};` (or `memset`) before setting fields guarantees padding bytes are zero rather than leftover stack data, which is a cheap, sufficient fix for that specific concern."},{"q":"When is a direct struct `memcpy` actually fine?","a":"When the struct is packed with fixed-width fields, fully initialized (no leaked padding), and both sides of the copy are built from the same header with a known, matching endianness assumption, such as two processes on the same machine sharing a memory-mapped region."}],"mod":6},{"id":"6.18","level":"Principal","type":"Numeric","fig":null,"tags":["bitfields","storage-unit"],"q":"For `struct { unsigned a:3; unsigned b:6; unsigned c:30; }`, work out why `sizeof` this struct is 8 bytes rather than the 5 bytes `(3+6+30)/8` might suggest.","short":"`a` and `b` together need 9 bits, which fits in one 32-bit `unsigned int` storage unit with 23 bits to spare; `c` needs 30 bits, which does not fit in those remaining 23 bits, so C11 6.7.2.1p11 lets the implementation start `c` in a new storage unit rather than splitting it, giving two 4-byte units, 8 bytes total, not a tightly packed 39 bits.","deep":"```c\n#include <stdio.h>\n\nint main(void) {\n    struct mixed { unsigned int a:3; unsigned int b:6; unsigned int c:30; };\n    struct mixed m = {0};\n    m.a = 5; m.b = 40; m.c = 1000000;\n    printf(\"sizeof=%zu a=%u b=%u c=%u\\n\", sizeof(struct mixed), m.a, m.b, m.c);\n    return 0;\n}\n```\nCompiled and run: `sizeof` printed `8`, and all three fields read back exactly what was assigned (`5, 40, 1000000`), confirming two separate 32-bit units were allocated rather than one struct packed to the theoretical bit-minimum.","pitfall":"Estimating a bit-field struct's size by summing bit widths and dividing by 8, instead of accounting for how bits are packed into (and sometimes wasted across) whole storage units.","verify":null,"follow":[{"q":"Would a different compiler necessarily also pick 8 bytes here?","a":"Not guaranteed; whether a bit-field that does not fit overlaps units or starts a new one is implementation-defined (6.7.2.1p11), so another implementation could in principle choose differently, though \"start a new unit\" is the near-universal practical choice."},{"q":"Does bit-field width ever affect the storage unit's own type width?","a":"Yes in the sense that the declared type (here `unsigned int`) sets the storage unit's base width; a bit-field wider than its declared type's width is already a constraint violation (6.7.2.1p4), so `c`'s 30 bits fitting inside one 32-bit `unsigned int` unit is required, not incidental."}],"mod":6},{"id":"7.01","level":"Basic","type":"Concept","fig":null,"tags":["const","promise","readonly"],"q":"What does const actually promise, and what does it not promise?","short":"const on an object's declared type means the compiler rejects your own attempts to modify it through an lvalue of that type; the standard makes it undefined behavior to modify a const-qualified object through a non-const lvalue at all (C11 6.7.3p6). It does not mean the underlying storage is immutable in general: a non-const alias, another thread without synchronization, or hardware can still change it, and a const pointer to non-const data lets you reassign what you point to's contents freely.","deep":"- const is a promise **you** make to the compiler about how you will access an object through that particular type, not a hardware write-protect bit (though the implementation may put it in read-only memory, C11 footnote 132).\n- `const int *p` is a pointer to data you promise not to modify through `p`; the pointee can still be modified by someone else, e.g. a non-const alias.\n- `int *const p` is a const pointer: `p` itself cannot be reseated, but `*p = x` is fine.\n- Casting away const and then writing is undefined behavior if the underlying object was actually declared const; it is legal (if unusual) if the object was not actually const-qualified, only accessed through a const-qualified lvalue.","pitfall":"Assuming `const int *p` means `p` cannot change. It is the pointee that is protected through `p`; `p` itself is an ordinary, reassignable pointer.","verify":"C11 6.7.3p6 and footnote 132 on read-only storage placement.","follow":[{"q":"Can you legally modify a const object via a cast?","a":"Only if the object itself was not declared const (e.g. a non-const parameter passed as const T*); if it was declared const, modifying it through any non-const lvalue is undefined behavior."},{"q":"Does const help the optimizer the way restrict does?","a":"A little: it tells the compiler you will not write through that pointer, but unlike restrict it says nothing about aliasing with other pointers, so its optimization value is smaller."}],"mod":7},{"id":"7.02","level":"Basic","type":"Concept","fig":null,"tags":["volatile","contract","observable"],"q":"What is volatile's real contract?","short":"Every read or write of a volatile-qualified object must actually happen, in program order relative to other volatile accesses, exactly as the abstract machine would do it (C11 6.7.3p7-8) -- the compiler cannot cache the value in a register across accesses, elide a \"useless\" read/write, or reorder it past another volatile access. It says nothing about atomicity, about ordering relative to non-volatile memory, or about visibility across threads or CPUs.","deep":"- The abstract-machine guarantee: \"at every sequence point the value last stored in the object shall agree with that prescribed by the abstract machine\" (6.7.3p7).\n- What counts as an \"access\" to a volatile object is implementation-defined (6.7.3p7 last sentence) -- e.g. whether a struct-of-bitfields access touches one byte or the whole word is up to the compiler/ABI.\n- volatile is a compiler-only contract: it constrains code generation, not the CPU or bus. It gives you no memory barrier, no cache-coherence guarantee, and no atomic read-modify-write.\n- Classic legitimate uses: memory-mapped I/O registers, and a flag written by a signal handler and polled by the rest of the program (see 7.11).","pitfall":"Treating volatile as \"thread-safe\" or \"atomic.\" It only forces real, ordered accesses in source order; it provides no atomicity and no synchronization.","verify":"C11 6.7.3p7-8 and footnote 134 on memory-mapped I/O and asynchronous interrupts.","follow":[{"q":"Does volatile stop the CPU from reordering the access at the hardware/bus level?","a":"No. On architectures with weak memory ordering you still may need a hardware barrier; volatile only controls what the compiler emits, not what the bus or cache does with it afterward."},{"q":"Is `volatile int x; x++;` a safe increment across threads?","a":"No, it is a non-atomic read-modify-write with no synchronization; use `<stdatomic.h>` for that (see the C Advanced page's memory-model module)."}],"mod":7},{"id":"7.03","level":"Basic","type":"Concept","fig":null,"tags":["restrict","aliasing","optimizer"],"q":"What does restrict promise the optimizer?","short":"A restrict-qualified pointer parameter asserts that, for the lifetime of the enclosing block, the object it points to is accessed only through that pointer (or values derived from it) if it is also modified -- never through some other, non-derived route (C11 6.7.3.1). It is a promise from the programmer to the compiler; the compiler is free to ignore it, but if the promise is false, the behavior is undefined.","deep":"- restrict applies only to pointer types whose referenced type is an object type (6.7.3p2); it is not itself a memory-safety check.\n- The formal rule (6.7.3.1p4): if an lvalue based on a restrict pointer P is used to access object X, and X is also modified by any means, then every other access to X must also be based on P, or the behavior is undefined.\n- Practical effect: the compiler can assume `dst` and `src` in `void f(int *restrict dst, const int *restrict src, int n)` never overlap, so it can reorder loads/stores, vectorize, and avoid re-reading `src` after writing `dst`.\n- \"A translator is free to ignore any or all aliasing implications of uses of restrict\" (6.7.3p8) -- it is an optimization hint you promise is true, never a runtime check.","pitfall":"Adding restrict to make code \"faster\" without verifying every call site truly passes disjoint objects. See 7.13 for what happens when that promise is broken.","verify":"C11 6.7.3.1 (Formal definition of restrict), paragraphs 1-8.","follow":[{"q":"Does restrict change what the function computes if the caller obeys the contract?","a":"No, deleting all restrict qualifiers from a conforming program never changes its observable behavior (6.7.3p8); it only removes an optimization opportunity."},{"q":"Is restrict useful on a plain local variable (not a parameter)?","a":"It is legal but rarely useful; its real value is at function boundaries where the compiler cannot otherwise know two parameters are disjoint."}],"mod":7},{"id":"7.04","level":"Intermediate","type":"Concept","fig":null,"tags":["const","pointer-syntax","reading"],"q":"How do you read const T*, T* const and const T* const, and what does each let you do?","short":"Read the declaration right to left from the name: `const int *p1` is \"p1 is a pointer to a const int\" (reseat p1, cannot write through it); `int *const p2` is \"p2 is a const pointer to int\" (cannot reseat p2, can write through it); `const int *const p3` is \"p3 is a const pointer to a const int\" (neither).","deep":"- The rule of thumb: const binds to whatever is immediately to its **left**, unless it is the first token, in which case it binds to what is immediately to its right. `const int` and `int const` are the same type.\n- `const int *p1 = &a;` then `*p1 = 5;` is a constraint violation (write through a const-qualified lvalue); `p1 = &b;` is fine.\n- `int *const p2 = &a;` then `p2 = &b;` is a constraint violation (cannot reseat a const pointer); `*p2 = 5;` is fine.\n- `const int *const p3 = &a;` locks down both: neither `*p3 = 5;` nor `p3 = &b;` is allowed.\n```c\n#include <stdio.h>\n\nint main(void) {\n    int a = 1, b = 2;\n    const int *p1 = &a;       /* pointer to const int */\n    int *const p2 = &a;       /* const pointer to int */\n    const int *const p3 = &a; /* const pointer to const int */\n\n    p1 = &b;   /* legal: only the pointee is protected */\n    *p2 = 5;   /* legal: only the pointer itself is protected */\n    printf(\"*p1=%d a=%d *p3=%d\\n\", *p1, a, *p3);\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra` and run, this prints `*p1=2 a=5 *p3=5` -- `p1` now points at `b` (value 2), `a` was modified to 5 through `p2`, and `p3` still sees `a`'s current value 5.","pitfall":"Reading `const int *p` as \"p is constant.\" The const binds to `int`, not to `p`; `p` is an ordinary variable.","verify":"C11 6.7.3p4-6 (qualified types apply to lvalues) -- no single clause states the \"read right-to-left\" mnemonic; it is a parsing convention, not standard wording.","follow":[{"q":"Where does this show up in a real API?","a":"`void log_msg(const char *msg)` promises not to modify the string; `char *const argv0` (conceptually) would promise the pointer variable itself never gets reseated."},{"q":"How do you add a fourth qualifier, e.g. a pointer to a volatile register that itself never changes?","a":"`volatile int *const reg = (volatile int *)0x4000; ` -- const pointer to a volatile int."}],"mod":7},{"id":"7.05","level":"Intermediate","type":"Trap","fig":null,"tags":["const","ub","modify","cast"],"q":"Why is modifying a const object through a non-const lvalue undefined behavior, even if it \"just works\"?","short":"C11 6.7.3p6 states plainly: \"If an attempt is made to modify an object defined with a const-qualified type through use of an lvalue with non-const-qualified type, the behavior is undefined.\" A common way to hit this is casting away const on a pointer to an object that was actually declared const, then writing through it -- the write may appear to succeed, corrupt read-only memory, or crash, and the standard does not pick which.","deep":"- The undefined behavior is tied to whether the **object** was declared const, not whether the pointer type you are holding right now says const.\n- Legal: a function takes `const int *p` for a parameter whose real, non-const object the caller owns; casting away const and writing through it there is well-defined (the object itself is not const), if unusual style.\n- Undefined: `const int x = 1; int *p = (int *)&x; *p = 2;` -- `x` was declared const, so the write through `p` is undefined behavior, even though the cast itself compiles.\n- Real risk: the implementation may have placed `x` in a read-only page (6.7.3 footnote 132), so the \"just works\" case can also be a segfault, not just a silently wrong value.","pitfall":"Believing a successful test run proves the cast-and-write is safe. Undefined behavior can \"work\" on one compiler/optimization level and corrupt memory on another; the standard gives no guarantee either way.","verify":"C11 6.7.3p6.","follow":[{"q":"Does `-Wall -Wextra` catch the cast-away-const write?","a":"No, casting away const with an explicit `(int *)` cast is not warned about by `-Wall -Wextra`; `-Wcast-qual` is the flag that flags the cast itself, not the later write."},{"q":"What is the correct way to get a writable copy of const data?","a":"Copy it into a non-const object (e.g. via memcpy or assignment), never write through a cast pointer to the original."}],"mod":7},{"id":"7.06","level":"Intermediate","type":"Cross-layer","fig":null,"tags":["volatile","register","optimizer","polling"],"q":"Why does a plain (non-volatile) polling loop on a hardware status flag get \"optimized away,\" and how do you see that the compiler actually did it?","short":"Without volatile, the compiler assumes nothing else can change the variable between iterations, so at -O2 it hoists the load out of the loop entirely -- if the value it saw was false to begin with, the loop becomes an infinite `jmp` to itself that never re-reads memory. Compiling to assembly (`gcc -O2 -S`) makes the difference visible directly.","deep":"```c\nvolatile int flag_v = 0;\nint flag_p = 0;\n\nint wait_volatile(void) { while (!flag_v) { } return 1; }\nint wait_plain(void)    { while (!flag_p) { } return 1; }\n```\nCompiled with `gcc -std=c11 -Wall -Wextra -O2 -S`, the two loops generate different code:\n- `wait_volatile`: the loop body contains `movl flag_v(%rip), %eax` on every iteration -- a fresh load each time, exactly as 6.7.3p7 requires (\"at every sequence point the value last stored... shall agree with... the abstract machine\").\n- `wait_plain`: the compiler loads `flag_p` **once**, before the loop, sees it is 0, and emits a bare `jmp .L8` to itself -- an infinite loop with no memory access at all, because nothing in the abstract machine (as the compiler sees it) can change a plain `int` out from under a single-threaded function.\n- This is the textbook reason a status-register poll, or a flag set only by a signal handler or another core, must be volatile: the compiler's \"nothing else changes this\" assumption is simply false for those objects.","pitfall":"Testing only at `-O0` (or with a debugger attached, which inhibits some optimizations) and concluding the polling loop is fine.","verify":"C11 6.7.3p7 and footnote 134; the assembly-level behavior itself is compiler/version specific, not part of the standard.","follow":[{"q":"Would `-O0` show the same problem?","a":"No, `-O0` typically reloads every variable every time regardless of volatile, which is exactly why \"it worked in debug builds\" is a common way this bug reaches production."},{"q":"Does making the whole polling function `volatile`-something fix it, or does the qualifier have to be on the object?","a":"The qualifier belongs on the object (or the pointer's pointee) being polled, not on the function; volatile is a type qualifier on data, not a function attribute."}],"mod":7},{"id":"7.07","level":"Intermediate","type":"Concept","fig":null,"tags":["volatile","atomics","memory-barrier"],"q":"Why doesn't volatile imply atomicity or a memory barrier?","short":"volatile's contract (6.7.3p7) is only about the compiler emitting real, ordered accesses in the abstract machine's program order; it says nothing about the access being indivisible (atomic) or about ordering relative to non-volatile memory, other CPUs, or caches. `<stdatomic.h>` and explicit fences exist precisely because volatile does not cover those needs.","deep":"- A `volatile long long x` on a 32-bit target can be split into two 32-bit loads/stores by the compiler; volatile guarantees those two accesses happen, not that they happen together as one indivisible operation.\n- Multiple threads/cores reading and writing a shared volatile variable can still race: volatile prevents the *compiler* from caching or reordering, but the *hardware* memory model (or lack of synchronization) can still let updates be lost or seen out of order.\n- Historically (pre-C11, and still commonly in embedded code) volatile was misused as a substitute for atomics/locks; C11 gives you the real tool: `_Atomic` types and `<stdatomic.h>` with explicit `memory_order`.\n- Cross-reference: the full C11 memory model, `stdatomic.h`, and memory_order variants are covered on the C Advanced page (module 7, \"Memory Model, Atomics & Ordering\") -- this page's module 7 is about the single-threaded, hardware-register contract only.","pitfall":"Using `volatile` on a variable shared between threads and calling it \"good enough.\" It is not a synchronization primitive.","verify":"C11 6.7.3p7 scope (compiler-visible ordering only); the atomics/memory-order clauses (7.17, and 5.1.2.4) are out of this module's scope by design.","follow":[{"q":"So when is volatile alone actually correct?","a":"Single-threaded code where the \"other writer\" is hardware or a signal handler on the same thread, and the access is naturally atomic on the target (e.g. a properly aligned `sig_atomic_t` or word-sized register read)."},{"q":"What is the minimum fix for a genuinely shared flag between threads?","a":"Use `atomic_int` (or `atomic_flag`) from `<stdatomic.h>` instead of `volatile int`, sized and ordered per the C11 memory model."}],"mod":7},{"id":"7.08","level":"Intermediate","type":"Numeric","fig":null,"tags":["const","array","qualified-element"],"q":"When you write const A a[2][3] for a typedef'd array type, what actually becomes const -- the array or its elements?","short":"C11 6.7.3p9 says if an array type's specification includes a qualifier, the **element type** is qualified, not the array type itself. So `const A a` where `A` is `int[2][3]` gives you an array of arrays of const int; `a[0]` has type \"array of 3 const int,\" which decays to `const int *`, not `int *`.","deep":"```c\n#include <stdio.h>\ntypedef int A[2][3];\n\nint main(void) {\n    const A a = { {4, 5, 6}, {7, 8, 9} };\n    const int *pci = a[0];   /* a[0] decays to const int*, not int* */\n    printf(\"a[1][2]=%d pci[1]=%d\\n\", a[1][2], pci[1]);\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra` and run, this prints `a[1][2]=9 pci[1]=5` -- reading through both indexing and the decayed const pointer works, but `int *p = a[0];` would be a constraint violation because `a[0]`'s type is `const int[3]`, not `int[3]` (this is exactly C11's EXAMPLE 2 under 6.7.3).\n- The rule matters for multi-dimensional arrays and typedefs especially, because it is easy to assume `const` on the whole aggregate makes every level uniformly const in the way you expect from a struct.","pitfall":"Assigning `a[0]` to a plain `int *` and being surprised by a compiler error/warning about qualifier mismatch.","verify":"C11 6.7.3p9 and its EXAMPLE 2.","follow":[{"q":"Does this change if A is written directly as `const int a[2][3]` instead of through a typedef?","a":"No, the same rule applies either way; typedefs do not change how qualifiers distribute over array types."},{"q":"What about a pointer to such an array, e.g. `const A *p`?","a":"`p` points to a `const int[2][3]`; `(*p)[0]` again decays to `const int *`, consistent with the element-qualification rule."}],"mod":7},{"id":"7.09","level":"Intermediate","type":"Concept","fig":null,"tags":["restrict","memcpy","disjoint","function-params"],"q":"How does restrict show up in a real function signature, and what must the caller guarantee?","short":"A function like `void copy_n(int *restrict dst, const int *restrict src, int n)` tells the compiler dst and src point to disjoint objects for the duration of the call -- exactly the contract the real `memcpy` (unlike `memmove`) documents in its prototype. The caller, not the compiler, is responsible for actually passing disjoint pointers; nothing checks it at runtime.","deep":"```c\n#include <stdio.h>\n\nvoid copy_n(int * restrict dst, const int * restrict src, int n) {\n    for (int i = 0; i < n; i++)\n        dst[i] = src[i];\n}\n\nint main(void) {\n    int a[5] = {1, 2, 3, 4, 5};\n    int b[5];\n    copy_n(b, a, 5);\n    printf(\"disjoint copy: \");\n    for (int i = 0; i < 5; i++) printf(\"%d \", b[i]);\n    printf(\"\\n\");\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra -O2` and run, this prints `disjoint copy: 1 2 3 4 5 ` -- correct, because `a` and `b` really are disjoint arrays, satisfying the restrict contract.\n- This is exactly the shape of the standard library's own `memcpy(void *restrict dst, const void *restrict src, size_t n)` -- restrict is why a good `memcpy` can outperform a naive byte loop and still be simple code: the compiler knows it never needs to worry about overlap.\n- `memmove` deliberately omits restrict on its parameters because it must support overlapping ranges; that generality costs it the aliasing optimization.","pitfall":"Assuming restrict is \"just documentation.\" It changes what the compiler is allowed to assume and therefore what code it generates; see 7.13 for what breaking the promise actually looks like.","verify":"C11 6.7.3.1 EXAMPLE 2 (the `f(int n, int *restrict p, int *restrict q)` case this mirrors).","follow":[{"q":"Why does the standard's own `memcpy` prototype use restrict but `memmove`'s does not?","a":"memcpy's contract explicitly forbids overlap (UB if it overlaps), so restrict documents and enables optimization for that promise; memmove must work correctly even when the ranges overlap, so it cannot make that promise."},{"q":"Can you pass the same array as both dst and src and just expect a no-op?","a":"Only if dst == src exactly (identical pointers, not merely overlapping) is that within bounds for some implementations, but relying on it is not portable; treat \"same or overlapping\" as unsafe for a restrict-qualified pair unless the function documents otherwise."}],"mod":7},{"id":"7.10","level":"Advanced","type":"Debug","fig":null,"tags":["volatile","optimization","proof"],"q":"Given two otherwise-identical polling functions, one volatile and one not, how do you prove to a skeptical reviewer that the compiler treats them differently?","short":"Compile both to assembly at the optimization level your firmware actually ships with (`gcc -std=c11 -Wall -Wextra -O2 -S`) and diff the loop bodies: the volatile version reloads the variable from memory every iteration, the plain version loads it once and either never re-checks it or gets optimized into a tight infinite jump. That assembly difference is the proof, not a claim about \"what compilers usually do.\"","deep":"- Reproduced from 7.06: `wait_volatile` compiles to a loop containing `movl flag_v(%rip), %eax` inside `.L2`; `wait_plain` compiles to `movl flag_p(%rip), %eax` **once**, followed by `.L8: jmp .L8` with no further memory access.\n- This is a good interview exercise because it forces you past \"the standard says volatile prevents optimizing it away\" into actually demonstrating the mechanism with a real toolchain and real output, which is the level a Principal reviewer expects.\n- The method generalizes: whenever someone claims \"the compiler wouldn't do that,\" the answer is to compile the actual code at the actual flags and read the assembly, not to argue from intuition.","pitfall":"\"Proving\" volatile is unnecessary by testing only at -O0, where most compilers reload everything anyway regardless of the qualifier.","verify":"Compiler/version-specific assembly output is not something the standard defines; C11 6.7.3p7 only guarantees the *semantics* volatile must have, not the code shape at each optimization level.","follow":[{"q":"What if the reviewer says \"but -O0 works fine\"?","a":"Point out `-O0` is not what ships; firmware release builds use optimization, and the bug is specifically an optimization-dependent one -- reproduce at the shipped flags."},{"q":"Is there a way to see this without reading assembly, e.g. from the source alone?","a":"Not reliably; the standard leaves this to the implementation, so the only ground truth is what your actual compiler emits for your actual flags."}],"mod":7},{"id":"7.11","level":"Advanced","type":"Cross-layer","fig":null,"tags":["volatile","signal","sig_atomic_t","handler"],"q":"Why must a flag shared between a signal handler and the rest of the program be volatile sig_atomic_t, not just volatile int?","short":"sig_atomic_t is the type the standard guarantees can be read and written as
