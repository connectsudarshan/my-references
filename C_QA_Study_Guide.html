a fresh automatic local would print `1 1 1`).","pitfall":"Forgetting that a static local's *initializer* runs only once ever, not once per call; `static int x = compute();` does not re-run `compute()` on later calls.","verify":"6.2.2p3, 6.7.1p6","follow":[{"q":"Is a static local thread-safe?","a":"No; without external synchronization, two threads calling `next_id()` concurrently can race on `id` (out of scope here, see the C Advanced page's concurrency modules for the memory-model treatment)."},{"q":"Why use file-scope static instead of a global?","a":"To hide implementation details of a .c file (a translation-unit-private helper or state variable) the way a header-only \"private\" keyword would in other languages."}],"mod":1},{"id":"1.06","level":"Intermediate","type":"Concept","fig":null,"tags":["register"],"q":"What does the `register` storage-class specifier actually do, and why can you not take a register variable's address?","short":"`register` is only a hint that the compiler should keep the object in the fastest storage available; the standard makes no guarantee it is honored, and modern optimizers usually ignore it and decide register allocation themselves. The one hard rule (6.7.1p6/footnote 121): you cannot take the address of anything declared `register`, with `&` or via array-to-pointer decay.","deep":"Because the compiler is allowed to actually place a `register` object in a machine register with no memory address, the standard forbids `&` on it (and forbids indexing/decay operations on a `register` array that would implicitly need its address). This is a **constraint**, not merely folklore: gcc rejects `&x` for a `register` local at compile time.\n\nIn practice, on any optimizing compiler built after roughly 1995, `register` changes nothing: the compiler already performs its own register allocation and ignores the hint (it is legal for an implementation to treat every `register` declaration as a plain `auto` declaration, per 6.7.1p6). It survives mainly as a keyword you must recognize in legacy or textbook code, and as a reserved word you cannot use as an identifier.","pitfall":"Writing `int *p = &reg_var;` where `reg_var` is declared `register` is a compile error (\"address of register variable requested\"), not a runtime surprise.","verify":"6.7.1p6, footnote 121","follow":[{"q":"Does `register` guarantee no memory access at all?","a":"No; it is only a suggestion (6.7.1p6: \"the extent to which such suggestions are effective is implementation-defined\")."},{"q":"Is `register` still legal on function parameters?","a":"Yes, and it has the same \"cannot take its address\" restriction there too."}],"mod":1},{"id":"1.07","level":"Intermediate","type":"Trap","fig":null,"tags":["tentative","linkage"],"q":"Can you declare the same file-scope variable more than once without an initializer? What if the linkage disagrees between declarations?","short":"Yes: repeated uninitialized file-scope declarations are all \"tentative definitions\" (6.9.2) that merge into one object as long as their linkage agrees. If the same identifier ends up with both internal and external linkage in one translation unit, the behavior is undefined (6.2.2p7); gcc typically turns the specific static-after-non-static ordering into a hard compile error instead.","deep":"```c\n#include <stdio.h>\n\nint i4;          /* tentative definition, external linkage */\nint i4;          /* valid: another tentative definition, same object */\nstatic int i5;   /* tentative definition, internal linkage */\nstatic int i5;   /* valid: same object */\n\nint main(void)\n{\n    i4 = 4;\n    i5 = 5;\n    printf(\"i4=%d i5=%d\\n\", i4, i5);\n    return 0;\n}\n```\nCompiled and run: prints `i4=4 i5=5`; both pairs of repeated tentative definitions merge cleanly because each pair agrees on linkage.\n\nNow the disagreement case:\n```c\nint x = 1;      /* external linkage */\nstatic int x;   /* redeclare as internal linkage: linkage disagreement */\n```\ngcc's actual diagnostic for this ordering: `error: static declaration of 'x' follows non-static declaration` -- a hard error, not silent UB, because gcc chooses to reject rather than exploit the undefined behavior. (The reverse order, `static int x; int x;`, is exactly the 6.2.2p4 case where the later `extern`-less declaration inherits internal linkage from the prior one, so it is well-defined and refers to the same static-linkage object.)","pitfall":"Declaring a variable `static` in one header-included declaration and forgetting `static` in another declaration of the same name in the same file; order determines whether you get a clean merge, a compile error, or (per the standard) undefined behavior.","verify":"6.9.2p2, 6.2.2p4, 6.2.2p7","follow":[{"q":"What does example 1 of 6.9.2 say about `int i2 = 2; ... int i2;`?","a":"The second line is a plain declaration with no storage-class specifier, so by 6.2.2p5 it would default to external linkage while the first `static` gave it internal linkage: 6.2.2 renders this undefined, per the standard's own worked example."},{"q":"Why does gcc turn some of these UB cases into compile errors instead of accepting them?","a":"Diagnosing likely-unintended linkage mismatches at compile time is more useful to programmers than silently picking one interpretation, and the standard permits (but does not require) a diagnostic for constraint violations elsewhere; here gcc goes further as a quality-of-implementation choice."}],"mod":1},{"id":"1.08","level":"Intermediate","type":"Numeric","fig":null,"tags":["promotion","sizeof"],"q":"If `a` and `b` are both `unsigned char`, what type is `a + b`, and what happens when you assign the result back into an `unsigned char`?","short":"Integer promotion converts both operands of `+` to `int` first (since `int` can represent every `unsigned char` value), so `a + b` has type `int` and cannot overflow at 8 bits for any `unsigned char` inputs. Assigning that `int` result back into an `unsigned char` then reduces it modulo 256 (6.3.1.3p2).","deep":"```c\n#include <stdio.h>\n\nint main(void)\n{\n    unsigned char a = 200, b = 100;\n    int sum = a + b;               /* promoted to int: no overflow possible */\n    printf(\"sum as int = %d\\n\", sum);\n\n    unsigned char c = a + b;       /* truncated mod 256 on the way back in */\n    printf(\"sum truncated into unsigned char = %u\\n\", c);\n\n    printf(\"sizeof(a + b) = %zu, sizeof(a) = %zu\\n\", sizeof(a + b), sizeof(a));\n    return 0;\n}\n```\nCompiled and run: `sum as int = 300`, `sum truncated into unsigned char = 44` (300 mod 256 = 44), `sizeof(a + b) = 4, sizeof(a) = 1`.\n\nThe `sizeof` line is the tell: even though `a` and `b` are 1-byte objects, the *expression* `a + b` has type `int` (4 bytes here), because 6.3.1.1p2's integer promotions apply to both operands of `+` before the addition happens.","pitfall":"Expecting a firmware \"saturating\" 8-bit add (clamped at 255) from plain `+`; C's promotion-then-truncate model gives silent wraparound (44, not 255), not saturation.","verify":"6.3.1.1p2, 6.3.1.3p2","follow":[{"q":"Would this differ for `unsigned short`?","a":"Same idea: promoted to `int` (or `unsigned int` if `int` cannot hold all `unsigned short` values, which is rare and platform-dependent) before the addition."},{"q":"Does this mean 8-bit \"wraparound\" checksums computed with `unsigned char` variables never see intermediate truncation?","a":"They do see truncation, exactly once, whenever a promoted `int` result is stored back into a narrower type; module 11 covers using this deliberately for bit-twiddling."}],"mod":1},{"id":"1.09","level":"Intermediate","type":"Trap","fig":null,"tags":["comparison","promotion"],"q":"Why does `(-1 > 0u)` evaluate to true in C?","short":"The usual arithmetic conversions (6.3.1.8) require both operands of a relational operator to have the same type; when one operand is `int` and the other is `unsigned int`, the `int` is converted to `unsigned int`. `-1` converted to `unsigned int` becomes `UINT_MAX` (4294967295 on a 32-bit int), which is greater than 0.","deep":"```c\n#include <stdio.h>\n\nint main(void)\n{\n    int a = -1;\n    unsigned int b = 0;\n    if (a > b) {\n        printf(\"a > b is TRUE (a became a huge unsigned value)\\n\");\n    } else {\n        printf(\"a > b is FALSE\\n\");\n    }\n    printf(\"(unsigned int)a = %u\\n\", (unsigned int)a);\n    return 0;\n}\n```\nCompiled with `-Wall -Wextra` and run: gcc emits `warning: comparison of integer expressions of different signedness: 'int' and 'unsigned int' [-Wsign-compare]` at the exact line, and the program prints `a > b is TRUE (a became a huge unsigned value)` and `(unsigned int)a = 4294967295`. This is exactly the kind of bug `-Wextra` is meant to surface; the warning is the point of showing this example, not something to silence.","pitfall":"Looping `for (int i = n - 1; i >= 0; i--)` where `n` is `size_t`/`unsigned`: `i >= 0` is fine since `i` is `int`, but `n - 1` when `n == 0` wraps to a huge `size_t` before the subtraction if you are not careful about which type it is computed in.","verify":"6.3.1.8","follow":[{"q":"Where does this actually bite in real code?","a":"Comparing a `ssize_t`/`int` return value (like a negative error code from `read()`) directly against a `size_t` length without checking for negative first."},{"q":"How do you fix it?","a":"Check the signed value's sign before comparing, or compare after an explicit, deliberate cast, or keep both operands the same signedness in the first place."}],"mod":1},{"id":"1.10","level":"Advanced","type":"Concept","fig":null,"tags":["linkage","multi-file"],"q":"How does `static` at file scope actually isolate an identifier between two translation units? Show it working.","short":"A `static` file-scope identifier has internal linkage: each translation unit that declares `static int x;` gets its own independent object, even with the identical name, and no other file can refer to it via `extern`. Plain (non-static) file-scope identifiers have external linkage, so `extern` in another file really does refer to the same object.","deep":"Two translation units, linked into one program:\n\n```c\n/* file a.c */\n#include <stdio.h>\nstatic int hidden = 10;   /* internal linkage: private to this TU */\nint shared = 100;         /* external linkage: visible to other TUs */\n\nvoid show_a(void)\n{\n    printf(\"in file a: hidden=%d shared=%d\\n\", hidden, shared);\n}\n```\n```c\n/* file b.c */\n#include <stdio.h>\nstatic int hidden = 20;   /* a DIFFERENT object: same name, internal linkage */\nextern int shared;        /* refers to the SAME object defined in a.c */\nvoid show_a(void);\n\nint main(void)\n{\n    printf(\"in file b: hidden=%d shared=%d\\n\", hidden, shared);\n    shared = 200;\n    show_a();\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra -o prog a.c b.c` and run: prints `in file b: hidden=20 shared=100` then `in file a: hidden=10 shared=200`. Each file's `hidden` stays independent (10 vs 20); both files' `shared` is the one object (100, then 200 after `b.c` modifies it).","pitfall":"Relying on `static` file-scope variables for anything that needs to be shared across files; the fix for \"I need this in another file too\" is to drop `static` and add a matching `extern` declaration in a header, not to duplicate the definition.","verify":"6.2.2p3, 6.2.2p5","follow":[{"q":"Would this link at all if both files declared `int hidden = 10;` (no `static`)?","a":"No; both would have external linkage, and defining the same external identifier with an initializer in two translation units is a duplicate-definition link error."},{"q":"Is this the C mechanism closest to \"private\" module state?","a":"Yes; file-scope `static` is C's idiomatic way to hide a translation unit's internals from the rest of the program, similar in spirit to an anonymous namespace in C++."}],"mod":1},{"id":"1.11","level":"Advanced","type":"Trap","fig":null,"tags":["promotion","overflow"],"q":"You want an 8-bit \"saturating\" add (clamp at 255) but wrote `unsigned char c = a + b;`. What actually happens, and how do you fix it?","short":"Integer promotion computes `a + b` as an `int` (no overflow at that width), but assigning the `int` result into `unsigned char c` silently reduces it modulo 256 (6.3.1.3p2), giving wraparound, not saturation. To get real saturation you must check the promoted `int` result explicitly before narrowing.","deep":"```c\n#include <stdio.h>\n#include <stdint.h>\n\nuint8_t add_wrap(uint8_t a, uint8_t b) { return (uint8_t)(a + b); }\n\nuint8_t add_saturate(uint8_t a, uint8_t b)\n{\n    int sum = (int)a + (int)b;      /* still an int: safe to compare against 255 */\n    return (sum > 255) ? 255 : (uint8_t)sum;\n}\n\nint main(void)\n{\n    printf(\"wrap:     200 + 100 = %u\\n\", add_wrap(200, 100));\n    printf(\"saturate: 200 + 100 = %u\\n\", add_saturate(200, 100));\n    return 0;\n}\n```\nCompiled and run: `wrap:     200 + 100 = 44`, `saturate: 200 + 100 = 255`. The wraparound path is exactly what plain `+` followed by narrowing gives you for free; saturation always needs an explicit widened comparison, because C has no saturating-arithmetic operator.","pitfall":"Assuming promotion protects you from all overflow; it only protects the *computation* (because `int` is wide enough for one `unsigned char + unsigned char`), not the final narrowing assignment.","verify":"6.3.1.1p2, 6.3.1.3p2","follow":[{"q":"Does this generalize to signed types?","a":"No directly; signed overflow itself is undefined behavior (module 10), so the \"compute in a wider signed/unsigned type, then clamp\" pattern must widen enough to avoid ever overflowing during the intermediate computation."},{"q":"Is there a compiler builtin that helps?","a":"gcc/clang expose `__builtin_add_overflow` for detecting overflow without relying on promotion width tricks; useful once you cannot simply widen further."}],"mod":1},{"id":"1.12","level":"Advanced","type":"Cross-layer","fig":null,"tags":["static","lifetime"],"q":"What is the difference in lifetime between an automatic local variable and a static local variable, and what goes wrong if you return a pointer to the wrong one?","short":"An automatic (ordinary) local's lifetime ends when its enclosing block exits; returning its address and then dereferencing that pointer after the function returns is undefined behavior. A static local has static storage duration: its lifetime is the entire program, so a pointer to it stays valid across calls.","deep":"```c\n#include <stdio.h>\n\nint next_id(void)\n{\n    static int id = 0;\n    return ++id;\n}\n\nint *bad_local_ptr(void)\n{\n    int local = 42;\n    return &local; /* returns address of an object whose lifetime just ended: UB */\n}\n\nint main(void)\n{\n    int a = next_id(), b = next_id(), c = next_id();\n    printf(\"%d %d %d\\n\", a, b, c);\n    int *p = bad_local_ptr();\n    (void)p; /* deliberately not dereferenced: doing so would be undefined behavior */\n    printf(\"ids demonstrate static storage retains value across calls\\n\");\n    return 0;\n}\n```\nCompiled with `-Wall -Wextra`: gcc flags `bad_local_ptr` with `warning: function returns address of local variable [-Wreturn-local-addr]` -- exactly the bug this question is about, kept as a warning rather than silenced because demonstrating it is the point. Run output: `1 2 3` then the static-retention message; `p` is never dereferenced, so the program itself has no observable UB despite holding a dangling pointer.","pitfall":"This bug often \"works\" in unoptimized debug builds because the stack memory has not been reused yet, then fails mysteriously in release builds once the optimizer reuses that stack slot.","verify":"6.2.4p6","follow":[{"q":"Is the dangling pointer itself (unused) undefined behavior?","a":"Merely holding an indeterminate/dangling pointer value is not itself UB; *using* it (dereferencing, or in some cases even comparing it) is."},{"q":"What is the fix when you really do need to return per-call data by pointer?","a":"Have the caller pass in storage, allocate on the heap (module 8) and document ownership, or return by value."}],"mod":1},{"id":"1.13","level":"Advanced","type":"Debug","fig":null,"tags":["argument-order","unspecified"],"q":"A colleague's code assumes `printf`-style logging always evaluates its arguments left to right. Why is that assumption unsafe in C?","short":"The order in which a function's arguments are evaluated relative to each other is unspecified by the standard (6.5.2.2), not guaranteed left-to-right. Two conforming compilers, or even the same compiler at different optimization levels, may legally evaluate `f(g(), h())`'s arguments in either order.","deep":"```c\n#include <stdio.h>\n\nint n = 0;\nint tag(int v)\n{\n    n++;\n    printf(\"evaluating argument #%d -> value %d\\n\", n, v);\n    return v;\n}\n\nint main(void)\n{\n    printf(\"sum = %d\\n\", tag(1) + tag(2) + tag(3));\n    return 0;\n}\n```\nCompiled and run on this gcc/x86-64 build: it happened to evaluate `tag(1)`, then `tag(2)`, then `tag(3)`, in that order, giving `sum = 6`. That left-to-right result is what this particular compiler chose today; the standard does not promise it, and other compilers (or the same compiler targeting a different ABI, such as most 32-bit x86 calling conventions which traditionally push arguments right-to-left) commonly choose the opposite order.","pitfall":"Debug logging that calls a counter-incrementing or state-mutating helper function directly inside a multi-argument call can produce different counter values in different builds, and the difference is not a compiler bug.","verify":"6.5.2.2, Annex J.1 (order of evaluation of the function designator and arguments is listed as unspecified)","follow":[{"q":"Is this the same rule as the unsequenced-side-effect UB in module 2?","a":"Related but distinct: evaluating each *argument value* in an unspecified order is well-defined (each argument is fully sequenced internally), whereas `i++ + i++` mixes a side effect and a value use of the same object with no sequencing at all, which is undefined, not just unspecified."},{"q":"How do you write logging code safely then?","a":"Evaluate anything with a side effect into a named local variable on its own statement first, then pass the already-computed values to the logging call."}],"mod":1},{"id":"1.14","level":"Advanced","type":"Concept","fig":null,"tags":["static","functions","linkage"],"q":"Does `static` mean the same thing for functions as it does for variables?","short":"Yes: `static` on a file-scope function gives it internal linkage, exactly like a `static` file-scope variable, so it is callable only from within its own translation unit. Functions have no separate \"storage duration\" concept the way objects do, so the analogy is cleaner for functions than the object case.","deep":"```c\n#include <stdio.h>\n\nstatic int helper(int x) { return x * 2; } /* internal linkage: private to this file */\n\nint public_api(int x)\n{\n    return helper(x) + 1;\n}\n\nint main(void)\n{\n    printf(\"public_api(5) = %d\\n\", public_api(5));\n    return 0;\n}\n```\nCompiled and run: prints `public_api(5) = 11`. If another translation unit wrote `extern int helper(int);` and tried to call it, linking would fail with an undefined-reference error, exactly as it would for a `static` variable: `helper` simply does not exist as a symbol outside this file.\n\nThis is the standard C idiom for a module-private helper function: mark every function not part of your header's public API `static`, so the linker (and readers) can immediately tell what is meant to be called from elsewhere.","pitfall":"Forgetting `static` on an internal helper function pollutes the global symbol namespace and can silently collide with an identically-named function in another translation unit at link time, or worse, silently shadow the wrong one depending on link order with weak/strong symbol rules.","verify":"6.2.2p3, 6.2.2p5","follow":[{"q":"Does marking helper functions `static` help the optimizer too?","a":"Yes; a `static` function that is only called within the file is a much easier candidate for inlining and dead-code elimination, since the compiler can see every call site."},{"q":"Can two files each define their own `static helper` with the same name with no conflict?","a":"Yes, exactly like `static` variables; each is a distinct, internally-linked symbol."}],"mod":1},{"id":"1.15","level":"Principal","type":"Cross-layer","fig":null,"tags":["register","volatile","forward-reference"],"q":"A junior engineer suggests declaring a memory-mapped hardware register pointer as `register volatile uint32_t *p;` to \"make register access fast.\" What is wrong with that reasoning?","short":"`register` and `volatile` operate on different axes: `register` is a (usually-ignored) hint about where the compiler stores the *pointer variable*, while `volatile` controls how accesses through the pointer compile (module 7). Neither makes register access \"fast\"; `volatile` makes it *correct*, at a real cost, since it forbids caching the value across accesses.","deep":"This question is really about not conflating two unrelated storage/qualifier concepts that happen to both use the word \"register\":\n\n- `register` (this module, 6.7.1p6): a storage-class specifier, a hint to the compiler about the *variable* `p` (the pointer), applying to ordinary optimization decisions about where the pointer value lives. Compilers routinely ignore it.\n- `volatile` (module 7): a type qualifier on what `p` points to, forcing every read/write through `p` to actually happen as a real memory access, in program order, with no caching or reordering by the compiler. This is what memory-mapped I/O correctness depends on.\n\nPutting `register` on a `volatile` pointer variable does not change how accesses *through* that pointer are compiled at all; it only hints where the pointer value itself might live, which the optimizer will decide regardless. The mental model to give an interviewer: \"`register` is about the compiler's use of CPU registers for a variable; `volatile` is about not eliding or reordering hardware-facing memory operations. They answer completely different questions, and `register` on a hardware-register pointer is a red herring, not an optimization.\"","pitfall":"Treating \"register\" (the keyword) and \"hardware register\" (the memory-mapped I/O concept) as related just because they share a word; they are unrelated.","verify":"6.7.1p6","follow":[{"q":"Does `volatile` provide atomicity or a memory barrier?","a":"No (module 7 covers this in full); it only guarantees each access happens and happens in source order relative to other volatile accesses, nothing about atomicity across threads/interrupts or CPU-level memory ordering."},{"q":"Is there ever a reason to use `register` in 2024-era embedded C?","a":"Rarely; on some small microcontroller toolchains with weaker optimizers it can still matter, but the first thing to check is what your specific compiler's documentation says, not to assume 1990s folklore still applies."}],"mod":1},{"id":"1.16","level":"Principal","type":"Scenario","fig":null,"tags":["review","extern","firmware"],"q":"Reviewing a firmware driver's headers, you see the same variable declared `extern int status;` in three .c files and defined (without `extern`) once in a fourth. A teammate wants to also mark it `static` in the definition \"for encapsulation.\" Walk through why that specific change breaks the build and what the correct fix looks like.","short":"Adding `static` to the one true definition gives that identifier internal linkage, so it becomes private to its own translation unit; the `extern int status;` declarations in the other three files then refer to a nonexistent external symbol, and the link fails with undefined-reference errors. Real encapsulation here means keeping the state `static` from the start and exposing accessor functions instead of the raw variable.","deep":"Method for this kind of review:\n\n1. Identify every declaration of the identifier across the codebase (`grep -rn 'status' --include=*.c --include=*.h`) and classify each as declaration-only (`extern`) or definition (initializer or no storage-class specifier at file scope).\n2. Check that exactly one file has the definition, and that its linkage (implicit external, since there is no `static`) matches what every `extern` declaration expects.\n3. If a variable truly should be private to one module, the fix is architectural, not a one-line edit: make it `static` in that one file, delete the `extern` declarations everywhere else, and add getter/setter functions (or an explicit \"module API\") for anything other files legitimately need.\n4. Re-run the link step immediately after any linkage change; a linkage mismatch across files is almost always caught at link time as an undefined-reference error (not a silent runtime bug), which is the good case -- the bad case (6.2.2p7, same identifier both internal and external linkage within one translation unit) usually only arises from redeclaring a name inconsistently *within a single file*, which is rarer in practice than the cross-file case, but is undefined behavior when it does happen rather than a link error.\n\nA concrete pitfall to name in the review: the teammate's instinct is right (state should not be a raw exported global) but the mechanism is wrong (flipping linkage without removing the callers). Encapsulation in C is a discipline enforced by API design and header hygiene, not by a keyword alone.","pitfall":"Changing a variable's linkage without immediately checking every caller; the compiler will not warn you at the point of the linkage change itself, only later at link time (or, worse, not at all if the mismatched declaration was never actually used, per 6.9p3-p5).","verify":"6.2.2p3, 6.2.2p7, 6.9p3","follow":[{"q":"What is the minimal safe refactor?","a":"Add `int get_status(void)` / `void set_status(int)` next to the now-`static` variable, update the three callers to use the functions, remove the `extern` declarations."},{"q":"Would `const` help express intent here too?","a":"If callers only ever read it, exposing `extern const int status_snapshot;` updated via a setter function is a common middle ground, though it does not stop internal code in the defining file from changing it."}],"mod":1},{"id":"1.17","level":"Principal","type":"Debug","fig":null,"tags":["firmware","checksum","promotion"],"q":"A one's-complement checksum routine (like the classic IP/UDP header checksum) accumulates 16-bit words directly into a `uint16_t sum` and produces wrong checksums on some packets but not others. Root-cause it.","short":"Accumulating straight into a `uint16_t` means every `sum += words[i]` is computed in promoted `int`, then truncated back to 16 bits immediately, silently discarding any carry out of bit 15 on that iteration. The standard one's-complement algorithm requires accumulating in a wider type and folding the carry back in once, at the end, not per-iteration.","deep":"```c\n#include <stdio.h>\n#include <stdint.h>\n#include <stddef.h>\n\n/* BUGGY: truncates to 16 bits after every addition, losing carries */\nuint16_t checksum_missing_fold(const uint16_t *words, size_t n)\n{\n    uint16_t sum = 0;\n    for (size_t i = 0; i < n; i++) sum += words[i];\n    return (uint16_t)~sum;\n}\n\n/* CORRECT: accumulate wide, fold carries once at the end */\nuint16_t checksum_correct(const uint16_t *words, size_t n)\n{\n    uint32_t sum = 0;\n    for (size_t i = 0; i < n; i++) sum += words[i];\n    while (sum >> 16) sum = (sum & 0xFFFFu) + (sum >> 16);\n    return (uint16_t)~sum;\n}\n\nint main(void)\n{\n    uint16_t words[] = {0xFFFF, 0x0001}; /* sum overflows 16 bits by exactly 1 */\n    printf(\"missing_fold = 0x%04X\\n\", checksum_missing_fold(words, 2));\n    printf(\"correct      = 0x%04X\\n\", checksum_correct(words, 2));\n    return 0;\n}\n```\nCompiled and run: `missing_fold = 0xFFFF`, `correct      = 0xFFFE`. These differ precisely because 0xFFFF + 0x0001 = 0x10000, and the buggy version's `uint16_t sum` truncates that to 0x0000 on the spot (integer promotion happens for the addition, but the assignment back into `sum` narrows it right away), whereas the correct version keeps the carry alive in `uint32_t` and folds it back in explicitly.\n\nRoot-cause method: (1) reproduce with a minimal input that is known to overflow 16 bits, as above, rather than debugging against real packet captures first; (2) inspect every accumulator's declared width against the arithmetic it needs to support losslessly; (3) fix by widening the accumulator type, not by changing the loop logic.","pitfall":"\"It passed my test packets\" is not evidence of correctness for a carry-dependent algorithm; you must specifically construct an input whose accumulation crosses the narrow type's width boundary.","verify":"6.3.1.1p2, 6.3.1.3p2","follow":[{"q":"Why does the bug only show up on \"some\" packets?","a":"Only inputs whose partial sums cross a 16-bit boundary during accumulation trigger a lost carry; small packets or packets whose words happen not to overflow 16 bits checksum correctly by accident."},{"q":"Is `int` (rather than `uint16_t`) as the accumulator type enough of a fix on a platform where `int` is 32 bits?","a":"It would happen to work there, but it is fragile and implicit; explicitly using `uint32_t` documents the requirement and is portable to platforms where `int` is narrower."}],"mod":1},{"id":"2.01","level":"Basic","type":"Concept","fig":null,"tags":["precedence","associativity"],"q":"Which operator precedence rules actually matter to memorize for day-to-day C code?","short":"Arithmetic (`* / %` then `+ -`) binds tighter than relational (`< <= > >=`), which binds tighter than equality (`== !=`), which binds tighter than bitwise `&`, then `^`, then `|`, then `&&`, then `||`, then `?:`, then assignment. The single most dangerous gap: `==` binds tighter than `&`/`|`, the opposite of what most people expect from math notation.","deep":"Full precedence from highest to lowest (grouping the ones worth memorizing):\n\n1. `() [] -> .` (postfix)\n2. unary `! ~ + - * & sizeof (cast)`\n3. `* / %`\n4. `+ -`\n5. `<< >>`\n6. `< <= > >=`\n7. `== !=`\n8. `&` (bitwise AND)\n9. `^` (bitwise XOR)\n10. `|` (bitwise OR)\n11. `&&`\n12. `||`\n13. `?:`\n14. `= += -=` etc. (right-associative)\n15. `,`\n\nThe practical rule: when mixing bitwise operators (`& ^ |`) with equality/relational operators in the same expression, always parenthesize; that combination is the single most common real-world precedence bug in C.","pitfall":"Writing `a & b == c` intending `(a & b) == c`; `==` binds tighter, so this actually means `a & (b == c)`.","verify":"6.5 (Annex A grammar defines the precedence via nested grammar productions in the C11 standard)","follow":[{"q":"Which operators are right-associative?","a":"Unary operators, assignment operators, and `?:` (the ternary's third operand associates right-to-left for chained ternaries)."},{"q":"Do casts have higher precedence than binary operators?","a":"Yes, `(int)x + y` casts only `x`, not `x + y`."}],"mod":2},{"id":"2.02","level":"Basic","type":"Concept","fig":null,"tags":["short-circuit"],"q":"What does \"short-circuit evaluation\" mean for `&&` and `||`, and is it guaranteed by the standard?","short":"Yes, guaranteed (6.5.13, 6.5.14): `&&` evaluates its right operand only if the left compares unequal to 0; `||` evaluates its right operand only if the left compares equal to 0. There is also a guaranteed sequence point between the two evaluations when the right operand does run.","deep":"```c\n#include <stdio.h>\n\nint calls = 0;\nint side_effect(void)\n{\n    calls++;\n    printf(\"side_effect() called\\n\");\n    return 1;\n}\n\nint main(void)\n{\n    int cond = 0;\n    if (cond && side_effect()) printf(\"unreachable\\n\");\n    printf(\"&& short-circuited: side_effect called %d times\\n\", calls);\n\n    cond = 1;\n    if (cond || side_effect()) printf(\"|| short-circuited too\\n\");\n    printf(\"total calls after ||: %d\\n\", calls);\n    return 0;\n}\n```\nCompiled and run: `side_effect()` is never printed; both messages report `0` calls. `cond && side_effect()` skips the call because `cond` is 0; `cond || side_effect()` skips it because `cond` is 1.","pitfall":"Writing `if (p->field && p)` when you meant to guard against a null `p`; order inside `&&` matters.","verify":"6.5.13p4, 6.5.14p4","follow":[{"q":"Is this different from `&` and `|`?","a":"Completely: `&` and `|` are bitwise operators that always evaluate both operands, with unspecified order between them and no short-circuiting at all."},{"q":"Why does this matter for null-pointer checks?","a":"It is why `if (p != NULL && p->field)` is safe while `if (p->field && p != NULL)` is not; the left operand is fully evaluated (and its sequence point passed) before the right is even considered."}],"mod":2},{"id":"2.03","level":"Basic","type":"Concept","fig":null,"tags":["comma-operator"],"q":"What does the comma operator do, and where can it not be used?","short":"`a, b` evaluates `a` as a discarded void expression, then evaluates and returns `b`; there is a sequence point between the two (6.5.17). It cannot be used where a comma is already a syntactic separator (function-call argument lists, initializer lists) without wrapping it in parentheses.","deep":"```c\n#include <stdio.h>\n\nint main(void)\n{\n    int a[5] = {0};\n    int i, j;\n    for (i = 0, j = 4; i < j; i++, j--) { a[i] = i; a[j] = j; }\n    for (int k = 0; k < 5; k++) printf(\"%d \", a[k]);\n    printf(\"\\n\");\n\n    int t;\n    int result = (t = 3, t + 2); /* value of the whole expression is 5 */\n    printf(\"result = %d\\n\", result);\n    return 0;\n}\n```\nCompiled and run: prints `0 1 0 3 4` (index 2 never written) then `result = 5`.\n\nThe classic gotcha from the standard's own example (6.5.17p3): in `f(a, (t=3, t+2), c)`, the function is called with exactly three arguments; the middle one, `(t=3, t+2)`, needs its own parentheses because the outer commas are argument separators, not comma operators.","pitfall":"`printf(\"%d\", (x, y))` compiles and prints `y`'s value, discarding `x`'s value entirely (but not its side effects) -- easy to write by accident and hard to spot in review.","verify":"6.5.17p2-p3","follow":[{"q":"Is `for (i = 0, j = 4; ...)` using the comma operator or just separated statements?","a":"It is the genuine comma operator; a `for` clause is a single expression slot, and comma lets you pack two initializations into it."},{"q":"Does the comma operator's left operand's side effects happen before the right operand's?","a":"Yes, guaranteed, unlike most other binary operators."}],"mod":2},{"id":"2.04","level":"Intermediate","type":"Numeric","fig":null,"tags":["promotion","conversions"],"q":"Given `char a = 10; short b = 20; unsigned long c = 5UL;`, what is the type and value of `a + b - c`?","short":"`a` and `b` are integer-promoted to `int` first; then, because `c` is `unsigned long` (the highest rank present), the usual arithmetic conversions (6.3.1.8) convert the whole expression to `unsigned long` before the subtraction. The result is `unsigned long` with value 25 here, but if `c` had made the expression go negative it would wrap around instead of going negative.","deep":"```c\n#include <stdio.h>\n\nint main(void)\n{\n    char a = 10;\n    short b = 20;\n    unsigned long c = 5UL;\n    unsigned long result = a + b - c;\n    printf(\"a+b-c = %lu (all done in unsigned long)\\n\", result);\n\n    int x = -1;\n    unsigned long y = 1;\n    printf(\"x + y = %lu (x becomes ULONG_MAX, then +1 wraps to 0)\\n\", x + y);\n    return 0;\n}\n```\nCompiled and run: `a+b-c = 25`, `x + y = 0`. The second line is the sharper lesson: `-1` converted to `unsigned long` becomes `ULONG_MAX` (not a small negative-looking value), and `ULONG_MAX + 1` wraps to exactly `0`, per 6.3.1.3p2's \"repeatedly adding one more than the maximum representable value\" rule.","pitfall":"Mixing a signed loop counter with an unsigned array-size type (`size_t`) in the same comparison; the signed value silently converts to unsigned.","verify":"6.3.1.1, 6.3.1.8","follow":[{"q":"What is the general rank-based rule?","a":"Convert both operands to the type of whichever operand has the greater integer conversion rank (6.3.1.1); if ranks are equal but one is unsigned, the signed one converts to unsigned."},{"q":"Why is this dangerous in loop bounds like `for (int i = n - 1; ...)` with `size_t n`?","a":"If `n` is `size_t` (unsigned) and you write `n - 1` where `n` could be `0`, the subtraction happens in `size_t` and wraps to `SIZE_MAX`, not `-1`."}],"mod":2},{"id":"2.05","level":"Intermediate","type":"Trap","fig":null,"tags":["precedence","bitwise"],"q":"Why does `if (flags & mask == 0x02)` almost never do what it looks like it does?","short":"`==` has higher precedence than `&`, so this parses as `flags & (mask == 0x02)`, not `(flags & mask) == 0x02`. `mask == 0x02` evaluates to `0` or `1` first, and then `flags` is bitwise-ANDed against that `0`/`1`, which is almost never the intended bit-test.","deep":"```c\n#include <stdio.h>\n\nint main(void)\n{\n    unsigned int flags = 0x06; /* bits 1 and 2 set */\n    unsigned int mask = 0x02;\n\n    if (flags & mask == 0x02) {\n        printf(\"trap: 'flags & mask == 0x02' -> true, but for the wrong reason\\n\");\n    } else {\n        printf(\"trap: 'flags & mask == 0x02' -> false\\n\");\n    }\n\n    if ((flags & mask) == 0x02) {\n        printf(\"correct: (flags & mask) == 0x02 -> true\\n\");\n    }\n    return 0;\n}\n```\nCompiled with `-Wall -Wextra`: gcc emits `warning: suggest parentheses around comparison in operand of '&' [-Wparentheses]` at exactly that line -- this warning existing at all is evidence of how common the mistake is. Run output: the trap branch prints `false` (because `mask == 0x02` is `1`, and `flags & 1` is `0x06 & 0x01 = 0`), while the parenthesized version correctly prints `true`.","pitfall":"This bug frequently still compiles clean and \"looks\" correct at a glance in code review; only `-Wparentheses` (included in `-Wall`) or careful manual precedence-checking catches it.","verify":"6.5.10, 6.5.9 (bitwise AND and equality-operator subclauses, whose relative order in the grammar's subclause sequence sets their precedence per 6.5 footnote 85)","follow":[{"q":"Does the same trap apply to `|`?","a":"Yes, identically; `flags | mask == 0` has the same misparse."},{"q":"Is there a simple habit that prevents this entirely?","a":"Always parenthesize any expression that mixes a bitwise operator with a relational or equality operator, with no exceptions, even when you are sure of the precedence."}],"mod":2},{"id":"2.06","level":"Intermediate","type":"Concept","fig":null,"tags":["ternary","conversions"],"q":"What is the result type of `cond ? i : f` when `i` is `int` and `f` is `float`?","short":"The second and third operands of `?:` undergo the usual arithmetic conversions when both are arithmetic types (6.5.15), so the common type here is `float`: `i` is converted to `float` for the purposes of computing the result, regardless of which branch is actually taken.","deep":"```c\n#include <stdio.h>\n\nint main(void)\n{\n    int i = 5;\n    float f = 2.0f;\n    printf(\"%f\\n\", 1 ? i : f);   /* i is converted to float: 5.000000 */\n    printf(\"sizeof(1 ? i : f) = %zu (float), sizeof(i) = %zu (int)\\n\",\n           sizeof(1 ? i : f), sizeof(i));\n    return 0;\n}\n```\nCompiled and run: `5.000000`, then `sizeof(1 ? i : f) = 4 (float), sizeof(i) = 4 (int)` (both 4 bytes on this platform, but the types differ: the `sizeof` expression's *type* is `float` even though its numeric size happens to match `int` here). Passing an `int` result of `?:` straight to `printf(\"%d\", ...)` when the compiler silently picked `float` due to the other branch is a classic source of `-Wformat` warnings and wrong output.","pitfall":"`printf(\"%d\\n\", cond ? int_val : float_val)` silently promotes the whole ternary to `float`/`double`, and `%d` then reads the wrong bytes, typically undefined behavior from a mismatched format specifier.","verify":"6.5.15p5","follow":[{"q":"What if one branch were a pointer and the other `NULL`/`0`?","a":"Different rule set (6.5.15p6) applies for pointer operands: compatible pointer types unify, and a null pointer constant converts to the other operand's pointer type."},{"q":"Does the *unevaluated* branch still affect the result's type?","a":"Yes; the conversion rule looks at both operands' types regardless of which one is actually evaluated at runtime."}],"mod":2},{"id":"2.07","level":"Intermediate","type":"Scenario","fig":null,"tags":["comma","for-loop"],"q":"Beyond `for` loop clauses, where is the comma operator legitimately useful, versus where it is a code smell?","short":"Legitimate: packing two independent updates into one `for` clause (`i++, j--`), or, rarely, sequencing a side effect before a macro's result expression. Code smell: chaining unrelated statements with commas purely to squeeze code onto one line, which hurts readability for no benefit over separate statements with semicolons.","deep":"The comma operator earns its place almost exclusively in `for`-loop init/update clauses, because those clauses are syntactically restricted to a single expression:\n\n```c\nfor (i = 0, j = 4; i < j; i++, j--) { /* ... */ }\n```\n\nOutside that context, if you can write two separate statements instead, you almost always should; a comma-joined chain like `x = 1, y = 2, z = x + y;` compiles and runs fine but reads worse than three separate statements and gains nothing (each sub-expression's side effects are still fully sequenced left to right, so there is no performance reason either).\n\nOne more legitimate spot: inside a macro that must expand to a single expression (not a statement), `#define LOG_AND_RETURN(v) (log_value(v), (v))` uses the comma operator to sequence a side effect and still yield a value usable in a larger expression -- module 9 covers the do-while(0) idiom for the statement-like case instead.","pitfall":"Confusing \"the comma operator\" with \"the comma used as a list separator\" -- they look identical but have entirely different sequencing rules; only the operator form guarantees a sequence point between its two operands.","verify":"6.5.17","follow":[{"q":"Can the comma operator appear inside a function call's argument list directly?","a":"No without parentheses; `f(a, b)` is two arguments, but `f((a, b))` is one argument whose value is `b`."},{"q":"Does `-Wall` warn about comma-chained statements?","a":"Not generally; there is no standard warning for \"too many commas,\" which is exactly why it is a style discipline, not a compiler-enforced rule."}],"mod":2},{"id":"2.08","level":"Intermediate","type":"Concept","fig":null,"tags":["sequence-points","c11"],"q":"What is a \"sequence point,\" and how did C11's wording change from earlier standards?","short":"Traditionally, specific points (end of a full expression, `&&`/`||`/`,`/`?:`'s first operand) were called \"sequence points\"; an unsequenced side effect and value use on the same object between two of them was undefined. C11 replaced \"sequence point\" with a \"sequenced before\" partial order (6.5p1-p3); the guarantees at `&&`, `||`, `,`, and `?:` are unchanged.","deep":"Places where sequencing is still guaranteed in C11 (Annex C lists them explicitly, using the modernized terminology):\n\n- Between evaluating the left and right operands of `&&`, `||`, and the comma operator, when the right operand is evaluated at all.\n- Between the first operand of `?:` and whichever of the second/third is evaluated.\n- At the end of a full expression (after a statement, or after each of the three parts of a `for`'s controlling expressions in their own contexts).\n- Between the value computation and side effect of an operator's operands, and the value computation of the result (6.5p1: \"the value computations of the operands of an operator are sequenced before the value computation of the result\").\n\nWhat did *not* change in practice: `i++ + i++` and `i = i++ + 1` are undefined behavior under both models. What changed is the framing: instead of \"there must be a sequence point separating these,\" C11 says \"if a side effect on a scalar object is unsequenced relative to another side effect on the same object, or a value computation using that object, the behavior is undefined\" (6.5p2), which is a strictly more general statement that also lets the standard describe truly concurrent/interleaved evaluation possibilities that \"sequence point\" language handled awkwardly.","pitfall":"Assuming C11 \"removed\" sequence points and therefore loosened the classic UB rules; it only changed the descriptive mechanism, not the actual guarantees or prohibitions.","verify":"6.5p1-p3, Annex C","follow":[{"q":"Does function-call argument evaluation order relate to sequence points?","a":"The arguments' evaluations are indeterminately sequenced relative to each other (order unspecified, module 1's 1.13), but each individual argument's own evaluation is internally sequenced; there is also a sequence point between all argument evaluations and the actual call (6.5.2.2)."},{"q":"Where can I read the definitive list for C11?","a":"Annex C (\"Sequence points\"), which is informative but cross-references the normative subclauses."}],"mod":2},{"id":"2.09","level":"Intermediate","type":"Concept","fig":null,"tags":["sequence-points","for-loop"],"q":"In `for (clause1; expr2; expr3) body`, exactly when is `expr3` evaluated relative to `body` and the next check of `expr2`?","short":"`expr3` is evaluated (as a discarded void expression) after each execution of the loop body, and before the next evaluation of the controlling expression `expr2` (6.8.5.3p1). `expr2` itself is checked before every execution of `body`, including the first.","deep":"This ordering is exactly what makes `for` and a hand-written `while` differ subtly around `continue` (module 3 covers that difference in full), and it is why `for (int i = 0; i < n; i++)` never accidentally increments `i` one extra time: the sequence within one full iteration is always controlling-expression-check, then body, then `expr3`, then back to controlling-expression-check.\n\n`clause1` (if a declaration) has its scope extend over the whole loop, including `expr2` and `expr3`, and is itself reached, in execution order, before the first evaluation of `expr2` -- this is why `for (int i = 0; ...)` lets you use `i` in all three clauses and the body, but not after the loop.","pitfall":"Believing `expr3` runs *before* the body on the first iteration; it never does, on any iteration -- it always runs strictly after the body.","verify":"6.8.5.3p1-p2","follow":[{"q":"Can `expr2` be omitted?","a":"Yes; an omitted controlling expression is replaced by a nonzero constant (6.8.5.3p2), making `for (;;)` an infinite loop by definition."},{"q":"Does `clause1` run once, or once per iteration?","a":"Exactly once, before the loop starts; only `expr2` and `expr3` repeat per iteration."}],"mod":2},{"id":"2.10","level":"Advanced","type":"Trap","fig":null,"tags":["undefined-behavior","sequence"],"q":"Why is `i = i++ + 1;` undefined behavior, and what did you actually observe when you compiled it?","short":"The expression contains a side effect on `i` (from `i++`) and both a value computation using `i`'s old value (the `+1` add uses `i++`'s result) and a separate side effect from the outer `=` assigning into `i`, with no sequencing between the `i++` side effect and the assignment's side effect on the same scalar object. 6.5p2 makes this undefined regardless of what any particular compiler happens to produce.","deep":"```c\n#include <stdio.h>\n\nint main(void)\n{\n    int i = 5;\n    i = i++ + 1;\n    printf(\"i = %d (undefined; do not rely on this value)\\n\", i);\n    return 0;\n}\n```\nCompiled with `-Wall -Wextra`: gcc detects and flags this exact pattern with `warning: operation on 'i' may be undefined [-Wsequence-point]`, which is precisely the point of this question (the warning is informative, not a defect to silence). Run output on this build: `i = 6`. This is one specific compiler's one specific answer today; the standard permits a conforming implementation to produce `5`, `6`, `7`, or something else entirely, and even this same compiler could legally produce a different answer at a different optimization level or after an unrelated code change nearby.","pitfall":"Treating \"it consistently prints 6 on my machine every time I run it\" as proof the behavior is well-defined; consistency under one compiler and one set of flags is not a standard guarantee.","verify":"6.5p2, footnote 84","follow":[{"q":"Is `i = i + 1;` (no `++`) fine?","a":"Yes, completely well-defined: it has one side effect (the outer assignment) and no unsequenced competing side effect on `i`."},{"q":"Does `-fsanitize=undefined` catch this?","a":"Not always automatically for pure `-Wsequence-point`-style cases (UBSan focuses on a different category of checks like signed overflow and misaligned access; gcc's `-Wsequence-point` warning, part of `-Wall`, is actually the more reliable static catch for this specific pattern), covered further in module 10."}],"mod":2},{"id":"2.11","level":"Advanced","type":"Trap","fig":null,"tags":["undefined-behavior","arrays"],"q":"Is `a[i++] = i;` well-defined? What does the standard say directly about this exact expression?","short":"No. This is the standard's own textbook example of undefined behavior (6.5 footnote 84 lists `a[i++] = i;` by name): the side effect from `i++` and the value computation of the right-hand `i` are unsequenced relative to each other, so it is undefined which value of `i` is stored into which element of `a`.","deep":"```c\n#include <stdio.h>\n\nint main(void)\n{\n    int a[3] = {0, 0, 0};\n    int i = 0;\n    a[i++] = i;\n    printf(\"a[0]=%d a[1]=%d a[2]=%d i=%d\\n\", a[0], a[1], a[2], i);\n    return 0;\n}\n```\nCompiled with `-Wall -Wextra`: gcc again catches it with `warning: operation on 'i' may be undefined [-Wsequence-point]`. Run output: `a[0]=1 a[1]=0 a[2]=0 i=1`. On this build, the index computation `i++` used the old value (`0`), and the right-hand `i` was read *after* the increment (`1`), landing `1` in `a[0]`. A compiler is equally free to read the right-hand `i` before applying the increment's side effect, landing `0` in `a[0]` instead, or to make other legal choices.","pitfall":"\"Fixing\" this by adding parentheses (`a[(i++)] = i;`); parentheses only affect grouping, not sequencing, and do nothing here.","verify":"6.5p2, footnote 84","follow":[{"q":"Why does the standard bother naming this exact example in a footnote?","a":"Because it is exactly the kind of expression that looks \"obviously\" like it should write the post-increment value at the post-increment index, but the language provides no such guarantee, making it a canonical teaching example."},{"q":"What is the safe rewrite?","a":"Split it: `a[i] = i + 1; i++;` (or `i++; a[i-1] = i;`), whichever ordering you actually intend, with the increment on its own statement."}],"mod":2},{"id":"2.12","level":"Advanced","type":"Debug","fig":null,"tags":["argument-order","unspecified"],"q":"A test asserts `printf(\"%d %d %d\\n\", tag(1), tag(2), tag(3))` prints \"1 2 3\" in that order because \"arguments evaluate left to right.\" Debug the assumption, not the code.","short":"The assumption itself is the bug: C does not guarantee any particular order for evaluating a function's arguments (6.5.2.2); it is unspecified. The test happens to pass on today's compiler and flags, which is exactly the kind of false confidence that unspecified behavior produces.","deep":"```c\n#include <stdio.h>\n\nint n = 0;\nint tag(int v)\n{\n    n++;\n    printf(\"evaluating argument #%d -> value %d\\n\", n, v);\n    return v;\n}\n\nint main(void)\n{\n    printf(\"sum = %d\\n\", tag(1) + tag(2) + tag(3));\n    return 0;\n}\n```\nCompiled and run on this gcc/x86-64 build: the three `tag()` calls happened to run in source order (1, then 2, then 3), producing `sum = 6`. That is a fact about this compiler and target today, not a language guarantee; many real toolchains (historically, several 32-bit x86 calling conventions, and various optimization decisions) evaluate arguments right-to-left or in whatever order is most efficient for register allocation.","pitfall":"Shipping logging/telemetry code whose correctness (not just its printed order, but computed values) depends on argument evaluation order; refactor any such side-effecting expression into separate statements first.","verify":"6.5.2.2, Annex J.1","follow":[{"q":"How should this actually be tested?","a":"Assert on the *set* of values produced and the final result, not on the order argument-evaluation side effects were observed in; or restructure the code under test so it does not depend on evaluation order at all."},{"q":"Is this the same category of bug as `i = i++ + 1`?","a":"Related but distinct: this is *unspecified* behavior (one of several defined outcomes, compiler's choice, no diagnostic required or typically given) rather than *undefined* behavior (no defined outcome at all); see module 10 for the full three-way split."}],"mod":2},{"id":"2.13","level":"Advanced","type":"Numeric","fig":null,"tags":["division","modulo"],"q":"What are `-5 / 2`, `-5 % 2`, `5 / -2`, and `5 % -2` in C11, and what rule guarantees those values?","short":"`-5 / 2 = -2`, `-5 % 2 = -1`, `5 / -2 = -2`, `5 % -2 = 1`. C99/C11 mandates truncation toward zero for integer division (unlike C89, which left the rounding direction implementation-defined), and `%` is defined so that `(a/b)*b + a%b == a` always holds.","deep":"```c\n#include <stdio.h>\n\nint main(void)\n{\n    printf(\"-5 / 2  = %d\\n\", -5 / 2);\n    printf(\"-5 %% 2  = %d\\n\", -5 % 2);\n    printf(\"5 / -2  = %d\\n\", 5 / -2);\n    printf(\" 5 %% -2  = %d\\n\", 5 % -2);\n    return 0;\n}\n```\nCompiled and run: `-5 / 2  = -2`, `-5 % 2  = -1`, `5 / -2  = -2`, ` 5 % -2  = 1`. Sanity-checking the identity: `(-5/2)*2 + (-5%2) = (-2)*2 + (-1) = -5`. Correct.\n\nTruncation toward zero means `-5 / 2` rounds -2.5 toward 0, giving -2 (not -3, which would be \"round toward negative infinity,\" the other common convention used by some languages like Python).","pitfall":"Porting code from a language that rounds toward negative infinity (Python's `//` and `%`) and assuming C's `/` and `%` behave the same way for negative operands; they do not.","verify":"6.5.5p6","follow":[{"q":"Was this always true in C?","a":"No; C89 left the rounding direction for negative operands implementation-defined. C99 (carried into C11) is the version that mandated truncation toward zero specifically."},{"q":"What if either operand is 0?","a":"Division by zero and `%` with a zero right operand are both undefined behavior (6.5.5p5), regardless of sign."}],"mod":2},{"id":"2.14","level":"Advanced","type":"Cross-layer","fig":null,"tags":["optimization","unsequenced"],"q":"Why does the \"unsequenced side effects are undefined\" rule (6.5p2) actually matter to a compiler's optimizer, beyond just \"it's confusing to read\"?","short":"Because the behavior is undefined rather than merely unspecified, the optimizer is free to assume it never happens in valid programs, and may reorder, merge, vectorize, or otherwise transform expressions across what looks like a fixed evaluation order in the source, as long as the transformation is correct for every well-defined input. This is the same license that lets compilers auto-vectorize loops and reorder independent memory operations for performance.","deep":"The unsequenced-evaluation rule is not primarily about penalizing bad code; it exists to give the compiler transformation freedom. If the standard required, say, strict left-to-right evaluation of every subexpression, many everyday optimizations (reordering independent loads across a loop body for vectorization, hoisting a common subexpression, scheduling instructions to hide memory latency on an out-of-order or pipelined CPU) would become observably incorrect for any code containing side effects, forcing the compiler to prove far more before optimizing.\n\nBy instead saying \"if your code's subexpressions have unsequenced side effects on the same object, that program's behavior is undefined,\" the standard shifts the burden onto the programmer to avoid writing such expressions, and grants the compiler broad license for well-defined programs. This is the same underlying philosophy behind signed-overflow UB (module 10) and strict aliasing: each pushes a correctness obligation onto the programmer specifically so that the optimizer does not have to defensively preserve a specific, possibly slow, evaluation order.","pitfall":"Debugging a \"why did -O2 change my program's output\" issue by assuming a compiler bug, before first checking the code for undefined behavior; the vast majority of these reports turn out to be exactly this category.","verify":"6.5p2","follow":[{"q":"Does this mean `-O0` and `-O2` can legitimately produce different results for `i = i++ + 1`?","a":"Yes, legitimately, precisely because the behavior is undefined; in practice, on this gcc build both `-O0` and `-O2` happened to produce the same result for this particular expression, but that agreement is not something the standard promises."},{"q":"Is this the same reasoning as why an \"infinite loop\" with no side effects can be assumed to terminate (module 3, 6.8.5p6)?","a":"Yes, same family of rule: giving the optimizer permission to assume the absence of certain problematic constructs in exchange for programmer discipline."}],"mod":2},{"id":"2.15","level":"Advanced","type":"Trap","fig":null,"tags":["macro","multiple-evaluation","forward-reference"],"q":"`#define MAX(a, b) ((a) > (b) ? (a) : (b))`, called as `MAX(x++, y)`. What actually happens to `x`, and why?","short":"Because a function-like macro is pure text substitution before any evaluation happens, `x++` appears twice in the expanded expression (once as the comparison's left operand, once again as the selected branch's value), so `x` is incremented twice for one call that looks like it should increment it once. Module 9 covers the full preprocessor mechanics; here the relevant point is that this is a real, observable extra side effect, not a sequencing UB.","deep":"```c\n#include <stdio.h>\n\n#define MAX(a, b) ((a) > (b) ? (a) : (b))\n\nint main(void)\n{\n    int x = 5, y = 3;\n    int r = MAX(x++, y);\n    printf(\"r = %d, x = %d (expected x=6 if x++ evaluated once)\\n\", r, x);\n    return 0;\n}\n```\nCompiled and run: `r = 6, x = 7`. Tracing the expansion: `MAX(x++, y)` becomes `((x++) > (y) ? (x++) : (y))`. The comparison evaluates `x++` once (using the original value 5, then incrementing `x` to 6), the comparison is true (5 > 3), so the `?:`'s second operand `(x++)` runs too, using the now-6 value as the ternary's result and incrementing `x` again to 7.\n\nThis is unambiguously well-defined per the standard's evaluation rules (each `x++` is its own fully sequenced expression, and `?:` guarantees a sequence point before whichever branch runs); the bug is entirely at the text-substitution level, specific to how the macro was written, not a sequencing violation.","pitfall":"Assuming a macro that \"looks like a function call\" evaluates its arguments like a function does; only genuine functions evaluate each argument exactly once, guaranteed.","verify":"6.10.3 (macro replacement is textual, prior to expression evaluation)","follow":[{"q":"Does a `static inline` function have this problem?","a":"No; a real function evaluates its arguments exactly once each, which is precisely why \"prefer inline functions over macros when arguments might have side effects\" is standard advice (module 9 elaborates)."},{"q":"Is there a macro-only fix?","a":"Not a complete one for arbitrary expressions; GNU C's statement-expression extension can capture the argument once, but that is a compiler extension, not portable C11."}],"mod":2},{"id":"2.16","level":"Principal","type":"Debug","fig":null,"tags":["optimization","unsequenced","root-cause"],"q":"A regression only reproduces in the `-O2` release build, never in the `-O0` debug build, and the changed line is `buf[idx++] = idx;`-shaped. What is your root-cause method, and what would you actually expect to find?","short":"Treat \"different behavior at different optimization levels\" as a strong prior for undefined behavior, specifically an unsequenced side-effect-plus-value-use on the same scalar object, before suspecting a compiler bug. The fix is always the same regardless of what either build level happened to produce: split the increment onto its own statement so no unsequenced pair exists.","deep":"Method, in order:\n\n1. Grep the changed diff for the classic shapes: `x = x++ ...`, `arr[i++] = i` (or `= f(i++, i)`), `x++ + x++`, any expression touching the same scalar object twice with at least one `++`/`--`/assignment among the touches.\n2. Confirm with `-Wall -Wextra -Wsequence-point`: gcc reliably flags exactly this pattern with `warning: operation on '...' may be undefined [-Wsequence-point]` at compile time, which is usually faster than bisecting the optimizer.\n3. If you want empirical confirmation beyond the warning, compile the isolated expression at both `-O0` and `-O2` and diff the output; a difference is confirmatory (though, per this module's 2.14, even *no* observed difference today does not prove the code is well-defined -- the warning from step 2 is the actual proof).\n4. Fix by splitting the expression: decide which value (pre- or post-increment) was actually intended, and write it as two ordinary statements with the increment isolated.\n\nConcretely, for `buf[idx++] = idx;`: if the intent was \"store the pre-increment index, then advance,\" write `buf[idx] = idx; idx++;`... but check the requirement again -- more often the intent was \"store the index that was just used,\" i.e. `buf[idx] = idx; idx++;` is usually correct as written unless the requirement actually wants the post-increment value stored, in which case `idx++; buf[idx-1] = idx;` or simply reordering the increment to a separate prior/following line makes the intent unambiguous and removes the UB either way.","pitfall":"\"It works if I just add `-O0` to the release build\" is not a fix; it hides the same latent UB, which can resurface with a different compiler version, a different `-O` level, or unrelated code changes nearby that affect the optimizer's choices.","verify":"6.5p2","follow":[{"q":"Why does `-O0` often \"look fine\" while `-O2` breaks?","a":"`-O0` frequently (not guaranteedly) evaluates subexpressions in a simple, consistent left-to-right-ish order matching direct codegen, while `-O2`'s instruction scheduling, common-subexpression elimination, and register allocation are more likely to reorder or restructure the unsequenced pieces differently."},{"q":"Is `-fsanitize=undefined` a substitute for step 2's `-Wsequence-point`?","a":"No; UBSan's runtime checks target a different set of UB categories (signed overflow, null/misaligned pointer access, etc.); the `-Wsequence-point` compile-time warning is the more reliable tool specifically for this pattern."}],"mod":2},{"id":"2.17","level":"Principal","type":"Concept","fig":null,"tags":["undefined","unspecified","three-way-split"],"q":"Explain, with the operators covered in this module, the practical difference between \"undefined behavior\" and \"unspecified behavior,\" using one example of each.","short":"Undefined behavior (6.5p2, `i = i++ + 1;`) means the standard imposes no requirements at all on the result: any outcome, including none, is conforming, and the compiler may assume it never happens. Unspecified behavior (Annex J.1, function argument evaluation order per 6.5.2.2) means the standard allows more than one outcome and the implementation picks one, consistently within its own rules, but is not required to document which, and no diagnostic is required either way.","deep":"The distinction matters most in what you are allowed to conclude from an observation:\n\n- If you observe `i = i++ + 1;` produce `6` on your build, you have learned nothing generalizable: the standard permits this program to do anything at all (including produce `7` after a one-line unrelated change elsewhere, or under a different compiler), because the behavior is undefined. Treating an observed value as a fact about the *language* is simply wrong; it is only a fact about one build.\n- If you observe `tag(1) + tag(2) + tag(3)` evaluate left-to-right on your build, you have learned a real fact about *that build's* choice among the standard's permitted alternatives, but not a fact about the *language*: the standard permits (does not forbid) a different, equally conforming compiler to choose the opposite order, with zero required diagnostic in either case.\n\nA third category this module also touches, though its home is module 10, is implementation-defined behavior: like unspecified, one of several outcomes is chosen, but unlike unspecified, the implementation *must* document and consistently apply its choice (plain `char`'s signedness in module 1 is the canonical example). Interviewers frequently want you to place a given behavior into the correct one of these three buckets and justify it with the mechanism (sequencing rules for UB, \"implementation picks silently\" for unspecified, \"implementation picks and documents\" for implementation-defined), not just recite the definitions.","pitfall":"Using \"unspecified\" and \"undefined\" interchangeably in an interview; they carry materially different guarantees, and conflating them is a fast way to lose credibility on a topic the standard is very precise about.","verify":"6.5p2, 6.5.2.2, Annex J.1, 3.4.1, 3.4.3, 3.4.4 (definitions of implementation-defined, undefined, and unspecified behavior)","follow":[{"q":"Which bucket does signed integer overflow fall into?","a":"Undefined (module 10 covers this and strict aliasing as the two most consequential UB categories for real bugs)."},{"q":"Which bucket does the number of significant initial characters in an identifier beyond a certain length fall into?","a":"Implementation-defined (a translation limit the standard requires the implementation to document, distinct from both of the above)."}],"mod":2},{"id":"3.01","level":"Basic","type":"Concept","fig":null,"tags":["if-else","dangling-else"],"q":"What is the \"dangling else\" problem, and how does C11 actually resolve it?","short":"When an `if` without braces is followed by another `if` and then a single `else`, indentation can suggest the `else` belongs to the outer `if`, but 6.8.4.1p3 states the rule plainly: \"an else is associated with the lexically nearest preceding if that is allowed by the syntax.\" The fix is always braces, never trusting indentation.","deep":"```c\n#include <stdio.h>\n\nint main(void)\n{\n    int a = 1, b = 0;\n    if (a)\n        if (b)\n            printf(\"a and b\\n\");\n        else\n            printf(\"a but not b (this is what actually runs)\\n\");\n    return 0;\n}\n```\nCompiled with `-Wall -Wextra`: gcc flags this exact shape with `warning: suggest explicit braces to avoid ambiguous 'else' [-Wdangling-else]`. Run output: `a but not b (this is what actually runs)`, confirming the `else` binds to the inner `if (b)`, exactly as 6.8.4.1p3 requires, regardless of how the indentation visually suggests otherwise.","pitfall":"Relying on an auto-formatter or personal indentation style instead of braces for any `if` containing a nested `if` without its own `else`.","verify":"6.8.4.1p3","follow":[{"q":"Does adding braces change the binding, or just make it visible?","a":"It actually changes which `if` the `else` binds to, if you place the braces to enclose the inner `if` alone; braces make the (already-fixed) rule match your visual intent instead of fighting it."},{"q":"Is this ambiguous in the grammar itself?","a":"No; the grammar plus 6.8.4.1p3's rule fully disambiguates it. It only \"looks\" ambiguous to a human reading indentation."}],"mod":3},{"id":"3.02","level":"Basic","type":"Concept","fig":null,"tags":["switch","break"],"q":"How does a `switch` statement decide where control jumps, and what happens if you omit `break`?","short":"The controlling expression is integer-promoted, compared against each `case` constant (also converted to that promoted type); control jumps to the first matching label, or to `default` if none match and one exists, or skips the whole body if neither exists (6.8.4.2p5). Without `break`, execution falls through into the next label's statements instead of exiting the switch.","deep":"```c\n#include <stdio.h>\n\nint main(void)\n{\n    int day = 3;\n    switch (day) {\n    case 1: printf(\"Mon\\n\"); break;\n    case 2: printf(\"Tue\\n\"); break;\n    case 3: printf(\"Wed\\n\"); break;\n    default: printf(\"other\\n\"); break;\n    }\n    return 0;\n}\n```\nCompiled and run: prints `Wed`. Each `break` (6.8.6.3) terminates the switch immediately; removing the `break` after `case 3` would fall straight into `default`'s `printf(\"other\\n\")` too, printing both lines.\n\nThere may be at most one `default` label (6.8.4.2p3), and it does not have to be last textually, though placing it last is the near-universal convention.","pitfall":"Forgetting `break` at the end of a case is the single most common `switch` bug; `-Wimplicit-fallthrough` (not in default `-Wall`/`-Wextra` on all gcc versions, but available and worth enabling) flags unmarked fall-through.","verify":"6.8.4.2p3, p5, 6.8.6.3","follow":[{"q":"Must every case end in break?","a":"No; intentional fall-through (module 3's later Duff's-device and fall-through questions) is legal C, just easy to get wrong by accident."},{"q":"What type must the controlling expression have?","a":"Integer type (6.8.4.2p1); a `switch` on a `float` or pointer is a constraint violation."}],"mod":3},{"id":"3.03","level":"Basic","type":"Concept","fig":null,"tags":["loops","invariant"],"q":"What is the actual behavioral difference between `while`, `do-while`, and `for`, beyond syntax?","short":"`while` and `for` both test their controlling expression before every iteration, including the first, so the body can run zero times. `do-while` tests after each iteration, so the body always runs at least once (6.8.5.2p1). `for` additionally has a dedicated init clause and a post-body expression, both absent from `while`.","deep":"```c\n#include <stdio.h>\n\nint main(void)\n{\n    int n = 3;\n    printf(\"for: \");\n    for (int i = 0; i < n; i++) printf(\"%d \", i);\n    printf(\"\\nwhile: \");\n    int i = 0;\n    while (i < n) { printf(\"%d \", i); i++; }\n    printf(\"\\ndo-while: \");\n    i = 0;\n    do { printf(\"%d \", i); i++; } while (i < n);\n\n    n = 0;\n    printf(\"\\nfor with n=0 runs: \");\n    for (int j = 0; j < n; j++) printf(\"%d \", j);\n    printf(\"(none)\\n\");\n    return 0;\n}\n```\nCompiled and run: `for: 0 1 2`, `while: 0 1 2`, `do-while: 0 1 2`, then `for with n=0 runs: (none)`. Setting `n = 0` before the last loop demonstrates the zero-iteration case that `for`/`while` support and `do-while` cannot.","pitfall":"Using `do-while` when the body should not run on a false initial condition; this is a common off-by-one-iteration bug when translating a `while` loop into `do-while` for style reasons alone.","verify":"6.8.5.1p1, 6.8.5.2p1, 6.8.5.3p1","follow":[{"q":"When is `do-while` the natural choice?","a":"When the loop body must run at least once regardless of the condition, such as a menu-driven input loop or a retry-once-then-check pattern."},{"q":"Which loop is a \"loop invariant\" easiest to reason about with?","a":"`for`, because its three clauses put the initialization, condition, and progress step in one place, making the invariant (\"this holds true before every condition check\") easier to state and verify."}],"mod":3},{"id":"3.04","level":"Intermediate","type":"Scenario","fig":null,"tags":["switch","fallthrough"],"q":"Show a real, legitimate use of intentional switch fall-through (not a bug).","short":"Stacking multiple `case` labels with no statements between them, all sharing the code of the final label in the group, is the standard way to group multiple values into one action, e.g. classifying vowels. This is fall-through between labels with no code in between, which is a different (safe) pattern from fall-through past code.","deep":"```c\n#include <stdio.h>\n\nint is_vowel(char c)\n{\n    switch (c) {\n    case 'a': case 'e': case 'i': case 'o': case 'u':\n    case 'A': case 'E': case 'I': case 'O': case 'U':\n        return 1;\n    default:\n        return 0;\n    }\n}\n\nint main(void)\n{\n    const char *s = \"Hello\";\n    for (const char *p = s; *p; p++)\n        printf(\"%c: %s\\n\", *p, is_vowel(*p) ? \"vowel\" : \"consonant\");\n    return 0;\n}\n```\nCompiled and run: `H: consonant`, `e: vowel`, `l: consonant`, `l: consonant`, `o: vowel`. All ten vowel labels share one `return 1;`; there is no code between the stacked labels for control to fall through *past*, which is exactly what makes this pattern safe and idiomatic rather than a latent bug.","pitfall":"Adding a statement \"temporarily\" between two stacked case labels for debugging, then forgetting to remove it, turning a safe grouping into an unintended fall-through bug.","verify":"6.8.4.2p3","follow":[{"q":"Is this different from Duff's device style fall-through?","a":"Yes; here, labels with no statements between them just group alternatives. Duff's device (this module, advanced section) falls through *past executable statements*, which is a much sharper tool used deliberately for loop unrolling."},{"q":"Does `-Wimplicit-fallthrough` warn about this pattern?","a":"No; gcc specifically recognizes empty-label-to-label fall-through (no statements in between) as safe and does not warn on it."}],"mod":3},{"id":"3.05","level":"Intermediate","type":"Concept","fig":null,"tags":["goto","cleanup"],"q":"What is the \"goto for cleanup\" pattern, and why is it still considered legitimate, idiomatic C rather than a code smell?","short":"A function acquires several resources in sequence and jumps to one shared cleanup label on any failure, releasing exactly what was successfully acquired so far, in reverse order, then returns. This avoids duplicating cleanup code at every failure point and avoids deep nesting; it is the closest C gets to RAII-style exception safety, and it is explicitly sanctioned by the standard's own goto example (6.8.6.1p3).","deep":"```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint process(int fail_at)\n{\n    int rc = -1;\n    int *buf1 = NULL, *buf2 = NULL, *buf3 = NULL;\n\n    buf1 = malloc(4 * sizeof(int));\n    if (!buf1 || fail_at == 1) goto cleanup;\n\n    buf2 = malloc(4 * sizeof(int));\n    if (!buf2 || fail_at == 2) goto cleanup;\n\n    buf3 = malloc(4 * sizeof(int));\n    if (!buf3 || fail_at == 3) goto cleanup;\n\n    rc = 0; /* success: all three resources acquired */\n\ncleanup:\n    free(buf3);\n    free(buf2);\n    free(buf1);\n    return rc;\n}\n\nint main(void)\n{\n    printf(\"fail_at=2 -> rc=%d\\n\", process(2));\n    printf(\"fail_at=0 -> rc=%d\\n\", process(0));\n    return 0;\n}\n```\nCompiled and run: `fail_at=2 -> rc=-1`, `fail_at=0 -> rc=0`. `free(NULL)` is well-defined and a no-op (7.22.3.3), which is exactly why the single shared `cleanup:` label can safely `free()` all three pointers regardless of how far acquisition actually got.","pitfall":"Forgetting to initialize each pointer to NULL before the acquisition sequence; without that, a cleanup path reached before a given `malloc` runs would `free()` an indeterminate (not NULL) pointer, which is undefined behavior.","verify":"6.8.6.1p2-p3, 7.22.3.3","follow":[{"q":"Why not just nest the ifs instead of using goto?","a":"With more than two or three resources, nested ifs indent one level per resource and duplicate (or badly complicate) the cleanup logic at every failure branch; the goto version keeps cleanup in exactly one place."},{"q":"Is jumping backward with goto ever legitimate too?","a":"Yes, for state-machine-style dispatch or restart logic (6.8.6.1's own example jumps into a loop's reinitialization code), though that is a less common pattern than forward cleanup jumps."}],"mod":3},{"id":"3.06","level":"Intermediate","type":"Numeric","fig":null,"tags":["off-by-one","bounds"],"q":"An array `int a[5]` is looped over with `for (int i = 0; i <= n; i++)` where `n = sizeof(a)/sizeof(a[0])`. Work out exactly what goes wrong and what the fix is.","short":"`n` is `5` (the element count), so valid indices are `0` through `4`; `i <= n` lets `i` reach `5`, reading `a[5]`, one element past the end of the array. That access is out-of-bounds and undefined behavior, not merely \"off by one in value\" -- there is no guaranteed sixth element to read.","deep":"```c\n#include <stdio.h>\n\nint main(void)\n{\n    int a[5] = {10, 20, 30, 40, 50};\n    int n = sizeof(a) / sizeof(a[0]); /* 5 */\n\n    int sum = 0;\n    for (int i = 0; i < n; i++) sum += a[i]; /* correct: i in [0, n-1] */\n    printf(\"correct sum (i < n) = %d\\n\", sum);\n\n    printf(\"bounds check: last valid index is %d, n is %d\\n\", n - 1, n);\n    return 0;\n}\n```\nCompiled and run: `correct sum (i < n) = 150`, `bounds check: last valid index is 4, n is 5`. The worked numbers: `n = sizeof(a)/sizeof(a[0]) = 20/4 = 5` on a platform with 4-byte `int`; valid indices are `0..4`; `i <= n` would let `i` reach `5`, one past the last valid index, which this file deliberately does not execute since an out-of-bounds read has no defined value to show.","pitfall":"Using `<=` \"by habit\" when translating a 1-based mathematical description (\"process elements 1 through n\") directly into 0-based C indices without adjusting the comparison.","verify":"6.5.6 (pointer/array bound reasoning); accessing `a[5]` of a 5-element array is outside the object per 6.5.6p8's \"one past the end\" rule, which permits computing but not dereferencing that address","follow":[{"q":"Why is `<` idiomatic and `<=` almost always wrong for zero-based array bounds?","a":"Because C array indices are zero-based and half-open ranges (`[0, n)`) are exactly what `<` expresses; `<=` describes a closed range `[0, n]`, which has one too many elements for a zero-based array of size `n`."},{"q":"Does this crash immediately?","a":"Not necessarily and not reliably; reading one past a stack or heap array often reads adjacent memory silently (appearing to \"work\"), which is what makes this bug dangerous rather than merely annoying."}],"mod":3},{"id":"3.07","level":"Intermediate","type":"Scenario","fig":null,"tags":["recursion","factorial"],"q":"Write both a recursive and an iterative factorial, and identify which calls in the recursive version are (and are not) tail calls.","short":"`fact_recursive`'s call `n * fact_recursive(n - 1)` is NOT a tail call: the multiplication happens *after* the recursive call returns, so the compiler must keep a stack frame per call to remember `n` for that pending multiply. A true tail call would return the recursive call's result directly with no further work, which this does not do.","deep":"```c\n#include <stdio.h>\n\nunsigned long fact_recursive(unsigned n)\n{\n    if (n <= 1) return 1;\n    return n * fact_recursive(n - 1); /* not a tail call: multiply happens after the call returns */\n}\n\nunsigned long fact_iterative(unsigned n)\n{\n    unsigned long r = 1;\n    for (unsigned i = 2; i <= n; i++) r *= i;\n    return r;\n}\n\nint main(void)\n{\n    printf(\"recursive 10! = %lu\\n\", fact_recursive(10));\n    printf(\"iterative 10! = %lu\\n\", fact_iterative(10));\n    return 0;\n}\n```\nCompiled and run: `recu
