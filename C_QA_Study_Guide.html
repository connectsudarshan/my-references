 its own well-known off-by-one-prone contract (it appends up to n characters plus a terminator, so the destination buffer needs room for strlen(dst)+n+1, not just n) and is just as easy to misuse."}],"mod":14},{"id":"14.07","level":"Intermediate","type":"Numeric","fig":null,"tags":["itoa","buffersizing"],"q":"How many bytes does a buffer need to safely hold the decimal string form of any 32-bit signed int, including the sign and the terminator, and how do you get that number?","short":"12 bytes. INT_MIN on a 32-bit two's complement int is -2147483648, whose decimal text \"-2147483648\" is 11 characters (1 sign + 10 digits), plus 1 byte for the null terminator, giving 12.","deep":"Walking the calculation instead of just quoting the answer:\n\n- INT32_MAX is 2147483647, 10 digits, no sign character needed for a positive value.\n- INT32_MIN is -2147483648. Its magnitude has the same 10 digits as INT32_MAX's magnitude plus one (2147483648 versus 2147483647), but crucially it still fits in 10 digits, not 11, because two's complement's range is asymmetric (module 11 covers why): one more negative value is representable than positive values.\n- Add 1 byte for the leading '-' sign: 10 + 1 = 11 characters of text.\n- Add 1 byte for the terminating '\\0': 11 + 1 = 12 bytes total.\n\nVerified directly, converting the actual worst case with a real (correct) itoa implementation:\n```c\nchar buf[12];\nmy_itoa(INT_MIN, buf);\nprintf(\"%s (len=%zu)\\n\", buf, strlen(buf));\n/* -2147483648 (len=11) */\n```\n`strlen` reports 11 (the text, not counting the terminator), confirming the buffer needs exactly 11 + 1 = 12 bytes, matching the worked calculation above and leaving no slack for anything else.\n\nThe general formula for an N-bit signed integer type: ceil(N * log10(2)) digits for the magnitude, plus 1 for a possible sign, plus 1 for the terminator; for 32-bit int that is ceil(32 * 0.30103) = ceil(9.63) = 10 digits, +1 sign +1 NUL = 12, matching the direct count above.","pitfall":"Sizing an itoa/snprintf destination buffer using INT_MAX's digit count only, then feeding it INT_MIN in production; the sign character is easy to forget when eyeballing \"how many digits does an int need.\"","verify":null,"follow":[{"q":"What is the equivalent worst-case size for a 64-bit long long?","a":"20 digits (LLONG_MIN is -9223372036854775808, 19 digits) + 1 sign + 1 NUL = 21 bytes."},{"q":"Why not just always allocate a generous 32 or 64 bytes and stop calculating?","a":"That works in practice for a one-off, but knowing the exact worst case matters for a fixed-size protocol field or a stack-allocated buffer in a tight embedded loop where every byte of a per-call buffer is budgeted."}],"mod":14},{"id":"14.08","level":"Intermediate","type":"Trap","fig":null,"tags":["intmin","signedoverflow","ub"],"q":"A naive itoa negates a negative input with `-value` before converting the magnitude to digits. What goes wrong specifically for INT_MIN, and how do you avoid it?","short":"Negating INT_MIN (e.g. -2147483648 for 32-bit int) overflows int, since +2147483648 is not representable as a signed 32-bit value; C11 6.5.3.3p3 leaves unary minus overflow undefined. The fix is to do the negation on an unsigned type wide enough to hold the magnitude, or to work with an unsigned copy of the value from the start, never negating a possibly-INT_MIN value while still typed as (the same width) int.","deep":"Real, compiled, isolated reproduction of exactly this UB:\n```c\nint naive_negate(int value) {\n    return -value;   /* UB when value == INT_MIN */\n}\nnaive_negate(INT_MIN);   /* prints -2147483648, i.e. unchanged */\n```\nPlain `-Wall -Wextra` gives no warning and the program does not crash: it printed `-2147483648` right back, which looks almost like \"it just returned the same value,\" but that is exactly the danger of undefined behavior described elsewhere on this page: nothing guarantees that specific outcome, it is simply what this compiler and optimization level happened to produce today.\nCompiling the identical file with `-fsanitize=undefined` catches it at runtime with an explicit diagnostic:\n```\nitoabug.c:5:12: runtime error: negation of -2147483648 cannot be represented\nin type 'int'; cast to an unsigned type to negate this value to itself\n```\nThe fix the sanitizer's own message describes is exactly the technique used in the correct my_itoa from 14.12: cast to unsigned (or a wider signed type) before negating.\n```c\nunsigned int uval = neg ? (unsigned int)(-(long long)value) : (unsigned int)value;\n```\nHere the negation happens on a `long long`, which is wide enough to represent `-INT_MIN` without overflow, and the result is then narrowed to `unsigned int`, which is well-defined (module 10 covers unsigned wraparound being defined, unlike signed overflow).","pitfall":"Assuming \"it printed a sensible-looking number, so this input case must be fine\"; a benign-looking result from undefined behavior is not evidence of correctness, only evidence that this particular compiler build did not turn it into a visible failure today.","verify":"C11 6.5.3.3 paragraph 3 (unary minus on an operand with overflow is per the usual arithmetic overflow rule, undefined for signed types); 7.22.6.1 paragraph 2","follow":[{"q":"Would `-(unsigned int)value` directly on the original int work instead of going through long long?","a":"Yes, that is actually the more common idiom: converting value to unsigned int first (a well-defined conversion per module 1/11's rules) then negating in unsigned arithmetic, which wraps modulo 2^32 by definition rather than overflowing."},{"q":"Is this the same class of bug as abs(INT_MIN)?","a":"Yes, exactly; C11 7.22.6.1p2 explicitly notes that abs/labs/llabs have undefined behavior \"if the result cannot be represented,\" which is precisely the INT_MIN case."}],"mod":14},{"id":"14.09","level":"Intermediate","type":"Concept","fig":null,"tags":["atoi","minimalimpl"],"q":"Write and test a minimal atoi. What does it need to handle to match the real function's basic contract?","short":"Skip leading whitespace, accept an optional single + or - sign, then accumulate decimal digits until a non-digit or the string ends; C11 7.22.1.2 defines atoi as equivalent to (int)strtol(nptr, NULL, 10) except for its own error behavior, so trailing garbage after the digits is simply where conversion stops, not an error.","deep":"Real, compiled, tested implementation:\n```c\nint my_atoi(const char *s) {\n    while (isspace((unsigned char)*s)) s++;\n    int sign = 1;\n    if (*s == '+' || *s == '-') { if (*s == '-') sign = -1; s++; }\n    long acc = 0;\n    while (isdigit((unsigned char)*s)) { acc = acc * 10 + (*s - '0'); s++; }\n    return (int)(sign * acc);\n}\n```\nTest results, matching the real library's behavior on the same inputs:\n```\nmy_atoi(\"  -42abc\") -> -42     (stops at 'a', matching strtol's \"initial portion\" behavior)\nmy_atoi(\"123\")      -> 123\nmy_atoi(\"+7\")       -> 7\nmy_atoi(\"nope\")     -> 0       (no digits found: accumulator stays 0)\n```\nUsing `long acc` instead of `int acc` for the running total is a deliberate defensive choice: it delays overflow until the final narrowing cast, matching the spirit of what strtol itself does internally (though strtol has its own explicit ERANGE/clamping contract at 7.22.1.4 that this minimal version does not reproduce); a from-scratch atoi that accumulates directly in `int` would hit the exact same INT_MIN/overflow class of bug as 14.08 on adversarial input.\n\nNote the `(unsigned char)` casts on every ctype.h call, directly applying 14.02's rule since `*s` is a plain (possibly signed) char.","pitfall":"Forgetting the leading-whitespace skip or the optional sign handling and then being surprised that a from-scratch atoi fails on inputs the real library function accepts without complaint.","verify":"C11 7.22.1.2 paragraph 2","follow":[{"q":"What does real atoi do on genuine overflow input like \"99999999999\"?","a":"C11 does not specify a defined outcome for atoi itself on overflow (only strtol has documented overflow behavior via errno/ERANGE); treat atoi's overflow behavior as unreliable and prefer strtol when input might be out of range."},{"q":"Why check isdigit in a loop instead of comparing against '0'..'9' directly?","a":"Both work for decimal digits in the \"C\" locale, but isdigit documents the intent clearly and is the idiomatic ctype.h approach interviewers expect."}],"mod":14},{"id":"14.10","level":"Advanced","type":"Concept","fig":null,"tags":["memcpy","minimalimpl"],"q":"Write and test a minimal memcpy. What does its contract require you to get right (and deliberately not handle)?","short":"Copy exactly n bytes from src to dst, byte by byte, treating both as arrays of unsigned char (per 7.24.1p3, every byte in these functions is interpreted as unsigned char), and return dst (7.24.2.1p3). It must not handle overlap correctly, since real memcpy is explicitly allowed to assume none (14.03); that is memmove's job, not memcpy's.","deep":"Real, compiled, and verified-against-the-real-function implementation:\n```c\nvoid *my_memcpy(void *restrict dst, const void *restrict src, size_t n) {\n    unsigned char *d = dst;\n    const unsigned char *s = src;\n    while (n--) *d++ = *s++;\n    return dst;\n}\n```\nTest:\n```c\nchar src[] = \"firmware-blob\";\nchar dst[32] = {0};\nmy_memcpy(dst, src, sizeof src);\nmemcmp(dst, src, sizeof src) == 0;   /* verified true: byte-for-byte identical to real memcpy's contract */\n```\nMarking both pointer parameters `restrict` is not just decoration: it is the same promise the real memcpy's prototype makes (7.24.2.1's synopsis declares both parameters restrict), telling the compiler the two ranges never alias, which is exactly why memcpy is allowed to be undefined behavior on overlapping input (14.03) and, in return, is free to be implemented (and optimized) without any overlap-direction check at all, unlike memmove.\n\nA real libc's memcpy is almost always far faster than this byte-loop version (SIMD-width copies, alignment-aware bulk moves), but this loop is fully contract-correct for the non-overlapping case, which is all the standard promises callers anyway.","pitfall":"Treating a working from-scratch memcpy as proof you could safely replace the real one in production code; correctness on your test cases says nothing about performance, and a naive byte loop is dramatically slower than a real libc's implementation on large buffers.","verify":"C11 7.24.2.1 paragraphs 2-3; 7.24.1 paragraph 3","follow":[{"q":"Why use unsigned char specifically instead of char for the internal pointers?","a":"Matching 7.24.1p3's rule that every character in these functions is interpreted as unsigned char, which avoids any sign-extension surprises when a byte's value is used arithmetically (not needed here, but the right habit to carry into any byte-oriented library code)."},{"q":"Would this implementation work correctly if src and dst overlapped?","a":"It happens to copy strictly forward one byte at a time, so it is actually safe for the same overlap directions memmove is designed to handle, but that is an implementation accident of this specific loop, not a promise memcpy's contract makes; never rely on it."}],"mod":14},{"id":"14.11","level":"Advanced","type":"Concept","fig":null,"tags":["printf","stdarg","variadic"],"q":"Write a minimal printf subset (%d, %s, %c, %x, %%) using stdarg.h, and show it working.","short":"Walk the format string one character at a time; on a literal character, output it; on %, look at the next character and pull one argument of the matching type from a va_list with va_arg, converting and printing it manually (digit extraction for %d/%x, direct output for %s/%c), then continue.","deep":"Real, compiled, and run implementation (trimmed to the %d case for space; %s/%c/%x/%% follow the same switch structure in the full tested file):\n```c\nvoid my_printf(const char *fmt, ...) {\n    va_list ap;\n    va_start(ap, fmt);\n    for (const char *p = fmt; *p; p++) {\n        if (*p != '%') { putchar(*p); continue; }\n        p++;\n        switch (*p) {\n        case 'd': {\n            int v = va_arg(ap, int);\n            char buf[16]; int i = 0, neg = v < 0;\n            unsigned int u = neg ? (unsigned int)(-(long long)v) : (unsigned int)v;\n            if (u == 0) buf[i++] = '0';\n            while (u) { buf[i++] = (char)('0' + u % 10); u /= 10; }\n            if (neg) putchar('-');\n            while (i > 0) putchar(buf[--i]);\n            break;\n        }\n        case 's': fputs(va_arg(ap, const char *), stdout); break;\n        case 'c': putchar(va_arg(ap, int)); break;\n        /* %x and %% follow the same pattern */\n        }\n    }\n    va_end(ap);\n}\n```\nTest call and actual output:\n```c\nmy_printf(\"dec=%d str=%s ch=%c hex=%x pct=%%\\n\", -42, \"hi\", 'Z', 255);\n/* dec=-42 str=hi ch=Z hex=ff pct=% */\n```\nNote the %d branch reuses the exact same cast-then-negate-in-a-wider-type trick from 14.08/14.12 to handle INT_MIN correctly, since a hand-rolled digit-extraction loop for %d has precisely the same signed-overflow trap as a from-scratch itoa.\n\nva_arg(ap, int) for %c matters: `char` arguments are promoted to `int` by C's default argument promotions for a variadic call's untyped trailing arguments, so pulling a `char` out of a va_list with `va_arg(ap, char)` would itself be undefined behavior; the caller passed something already widened to int, and the reader must extract it as int (module 9's territory, but directly relevant here).","pitfall":"Pulling a va_arg with the wrong type (e.g. va_arg(ap, char) or va_arg(ap, short) for an argument the caller passed as a plain int through the variadic ellipsis); the promoted type at the call site and the type requested at va_arg must agree, or the behavior is undefined.","verify":null,"follow":[{"q":"Why does %s need no digit-extraction logic while %d does?","a":"Because a string argument is already the sequence of bytes to print (fputs just walks it to the NUL), while an int argument is a binary value that has to be converted to its decimal text representation one digit at a time."},{"q":"What is missing from this subset compared to real printf?","a":"Width/precision specifiers, %f/%g floating point, %p pointers, %u unsigned decimal, and length modifiers like %ld are all absent; a real subset worth calling \"useful\" would add %u and %ld next."}],"mod":14},{"id":"14.12","level":"Advanced","type":"Concept","fig":null,"tags":["itoa","minimalimpl"],"q":"Write and test a minimal itoa that correctly handles INT_MIN, given the pitfall in 14.08.","short":"Convert the magnitude on the unsigned side (casting through a wider signed type before negating, so INT_MIN's negation never overflows int), peel decimal digits off with %10/ /10 into a temporary buffer, then reverse them into the output buffer with a leading '-' if the original value was negative.","deep":"Real, compiled, tested implementation:\n```c\nchar *my_itoa(int value, char *buf) {\n    unsigned int uval;\n    char tmp[12];\n    int i = 0, neg = (value < 0);\n    uval = neg ? (unsigned int)(-(long long)value) : (unsigned int)value;\n    if (uval == 0) tmp[i++] = '0';\n    while (uval > 0) { tmp[i++] = (char)('0' + uval % 10); uval /= 10; }\n    int j = 0;\n    if (neg) buf[j++] = '-';\n    while (i > 0) buf[j++] = tmp[--i];\n    buf[j] = '\\0';\n    return buf;\n}\n```\nTest results, using a 12-byte buffer per the exact worked calculation in 14.07:\n```\nmy_itoa(0, buf)        -> \"0\"\nmy_itoa(1234, buf)     -> \"1234\"\nmy_itoa(-1234, buf)    -> \"-1234\"\nmy_itoa(INT_MIN, buf)  -> \"-2147483648\" (strlen 11, fits the 12-byte buffer exactly)\n```\nThe `(unsigned int)(-(long long)value)` line is the fix for 14.08's bug: `value` is widened to `long long` first (large enough to represent `-INT_MIN` without overflow), negated there safely, then narrowed to `unsigned int`, which wraps modulo 2^32 by a well-defined rule rather than overflowing. Digits are built least-significant-first into `tmp`, then copied into `buf` in reverse order, which is the standard technique for converting a binary value to decimal text without knowing the digit count in advance.","pitfall":"Copying this pattern but accumulating uval as a plain (signed) int instead of unsigned int; that silently reintroduces 14.08's overflow bug for the INT_MIN case specifically.","verify":"signed-to-unsigned negation-overflow avoidance per C11 6.3.1.3 paragraph 2 (unsigned conversion wraps modulo 2^N, well-defined) versus 6.5.3.3 paragraph 3 (signed negation overflow, undefined)","follow":[{"q":"Why is the temporary buffer needed instead of writing digits directly into buf in order?","a":"Because the least-significant digit is computed first (from %10) but belongs last in the output string; without a scratch buffer to reverse from, you would need to know the final digit count in advance to write front-to-back."},{"q":"Does this handle bases other than 10?","a":"Not as written, but the same peel-digits-then-reverse structure generalizes to any base by changing the modulus/divisor and mapping digit values above 9 to letters, exactly as the minimal printf's %x branch in 14.11 does."}],"mod":14},{"id":"14.13","level":"Advanced","type":"Concept","fig":null,"tags":["qsort","structs","multikey"],"q":"How do you write a qsort comparator that sorts an array of structs by more than one field, with a real example?","short":"Cast both const void * arguments to the real struct pointer type, compare the primary field first, and only if it is equal fall through to compare the secondary field (a tie-break), returning as soon as any comparison is decisive; this also sidesteps 14.04's \"order of equal elements is unspecified\" note by making sure nothing that matters is ever actually equal to the comparator.","deep":"Real, compiled, run example sorting firmware task records by priority, then by name as a tie-break:\n```c\ntypedef struct { char name[16]; int priority; } Task;\nint cmp_task(const void *a, const void *b) {\n    const Task *ta = a, *tb = b;\n    if (ta->priority != tb->priority) return ta->priority - tb->priority;\n    return strcmp(ta->name, tb->name);\n}\nTask tasks[] = {\n    { \"flush_cache\", 2 }, { \"read_nand\", 1 }, { \"log_event\", 2 }, { \"erase_block\", 1 }\n};\nqsort(tasks, 4, sizeof(Task), cmp_task);\n```\nActual output, priority ascending, and alphabetical within each priority:\n```\n1 erase_block\n1 read_nand\n2 flush_cache\n2 log_event\n```\nTwo things worth calling out unprompted in an interview: `ta->priority - tb->priority` is safe here specifically because Task.priority is a small, application-bounded range (unlike 14.05's arbitrary-int trap; if priority could span the full int range, the same (x > y) - (x < y) fix from 14.05 would apply), and using `strcmp` directly as the tie-break (rather than a hand-rolled loop) is the idiomatic way to compare two fixed-size char arrays that are guaranteed null-terminated.","pitfall":"Writing the tie-break comparison as a separate qsort call after the first field is already sorted; a single-pass multi-field comparator inside one qsort call is both correct and simpler than trying to chain two separate sorts.","verify":null,"follow":[{"q":"What happens if the tie-break field is also equal for two elements?","a":"Their relative order is genuinely unspecified per 7.22.5.2p4, since nothing in the comparator can distinguish them; add a further tie-break (e.g. original index) only if that specific stability actually matters."},{"q":"Would this comparator work unchanged if Task were sorted with bsearch instead?","a":"Only if the array is already sorted by this exact comparator's ordering; bsearch's precondition (7.22.5.1p3) requires the array to already respect the comparator, which is exactly what this qsort call establishes."}],"mod":14},{"id":"14.14","level":"Advanced","type":"Concept","fig":null,"tags":["stdio","exit","dataloss"],"q":"Does a buffered stdout stream reliably get its contents written out if the program calls abort() or crashes, versus calling exit() or returning from main?","short":"No. C11 7.21.3p5 guarantees all open files are flushed only \"if the main function returns to its original caller, or if the exit function is called\"; it explicitly says other paths to termination, \"such as calling the abort function, need not close all files properly.\" Any output still sitting in a fully or line buffered stream's memory buffer at the moment of an abnormal termination can be lost.","deep":"This is exactly why a diagnostic message printed right before a crash sometimes never appears in a log file, even though the printf call itself clearly executed (no error was reported): if that printf's output landed in stdout's buffer and the process then hits a segfault or calls abort() before anything triggers a flush, the buffered bytes are simply never written to the underlying file descriptor.\n\nPractical consequences worth stating unprompted:\n- A crash-handling signal handler that wants to guarantee a final diagnostic message reaches disk should call fflush(stdout) (and/or write() directly to the fd, which is unbuffered by definition) before doing anything else, rather than assuming the runtime will flush on its way down.\n- stderr's typically-unbuffered-or-line-buffered default (14.01) is precisely why error messages tend to survive crashes better than stdout's fully buffered informational output when a program is not interactive.\n- This directly connects to module 17's ISR/signal-handler-safety material: calling fflush from inside certain contexts, or relying on any buffered stdio at all inside a true interrupt handler, carries its own reentrancy hazards, which is one sentence's worth of pointer to that page rather than a full treatment here.","pitfall":"Debugging an intermittent crash by adding printf statements and trusting that \"the last line I see printed is where it crashed\"; the true crash point can be later than the last line actually flushed to the terminal or log file.","verify":"C11 7.21.3 paragraph 5","follow":[{"q":"Does calling _exit() (as opposed to exit()) flush stdio buffers?","a":"No; _exit() is documented as bypassing normal cleanup including stdio flushing, which is one reason it exists as a distinct, more abrupt termination path (more POSIX-flavored detail than pure C11, so treat this specific function as background context)."},{"q":"Is there any way to make output survive a SIGSEGV without changing buffering mode?","a":"Calling fflush(stdout) explicitly at the specific point where you need a durability guarantee is the direct fix; changing to unbuffered mode everywhere is the blunter, slower alternative."}],"mod":14},{"id":"14.15","level":"Advanced","type":"Debug","fig":null,"tags":["stdio","buffering","interleaving"],"q":"A program's stdout and stderr messages appear in the expected interleaved order on a terminal, but come out completely reordered when the program's combined output is redirected to a single log file. How do you diagnose and fix this?","short":"A buffering-mode change, not a logic bug: an interactive stdout is typically line buffered, so each printf's newline flushes it promptly alongside stderr's unbuffered writes; redirected to a file, stdout becomes fully buffered (7.21.3p7) and only flushes on a full buffer or exit, lagging behind interleaved stderr. Fix by forcing setvbuf(stdout, NULL, _IONBF, 0), or an explicit fflush(stdout) after writes that must stay ordered relative to stderr.","deep":"Real, reproducible side-by-side comparison (already run for 14.01, repeated here for the debugging angle specifically). Same four calls, both redirected to one file via `2>&1`:\n\nDefault buffering (stdout fully buffered because the destination is not a tty):\n```\nstderr-1\nstderr-2\nstdout-1\nstdout-2\n```\nSame program, only change is `setvbuf(stdout, NULL, _IONBF, 0);` at the top of main:\n```\nstdout-1\nstderr-1\nstdout-2\nstderr-2\n```\nDiagnosis process for a real \"my logs look scrambled in the file but fine on screen\" ticket:\n1. Confirm the reordering only happens when redirected, not on an interactive terminal; if so, immediately suspect buffering mode rather than a race condition or logic bug, since 7.21.3p7 is exactly this rule.\n2. Check whether the code mixes stdio calls to two different streams (stdout and stderr, or two separately fopen'd FILE * streams) that are expected to interleave in a specific order.\n3. Decide the right fix for the situation: for a low-volume diagnostic tool, forcing stdout unbuffered (or line buffered, `_IOLBF`) is simplest; for a high-throughput logger where the performance cost of losing full buffering matters, route everything through a single stream (or add explicit fflush calls only at the specific points where ordering actually matters) instead of disabling buffering everywhere.","pitfall":"\"Fixing\" this by adding sleep() calls between prints to force an ordering; that treats the symptom, not the cause, and remains fragile (and slow) since the actual cause is buffering mode, addressed directly with setvbuf or fflush.","verify":null,"follow":[{"q":"Would writing everything to stderr instead of stdout also fix the reordering?","a":"Yes in practice (since stderr defaults to not-fully-buffered), but it repurposes a stream meant for diagnostics/errors for ordinary output, which is a workaround, not a real fix, and surprises anything downstream that filters stdout from stderr."},{"q":"Is this specific to C's stdio, or would it also affect a program using raw write() calls?","a":"It is specific to the buffering layer stdio adds on top of the OS's file descriptors; raw write() calls have no such user-space buffer and always go out in call order (though the OS/terminal itself can still interleave multiple processes' output unpredictably)."}],"mod":14},{"id":"14.16","level":"Principal","type":"Scenario","fig":null,"tags":["sprintf","snprintf","codereview"],"q":"Reviewing a legacy logging helper, you find `sprintf(buf, \"[%s] code=%d\", tag, code);` writing into a fixed-size caller-supplied buffer with no bound. What is wrong with this, and how do you fix it while preserving the ability to detect truncation?","short":"sprintf has exactly the same unbounded-write hazard as strcpy: it writes as many bytes as the format and arguments demand, with no awareness of the destination buffer's actual size, so a long enough tag or code overflows buf. Replace it with snprintf(buf, bufsz, ...), which never writes past bufsz and returns the number of characters that would have been written (excluding the terminator), letting the caller detect truncation by checking if that return value is >= bufsz.","deep":"Real, compiled, and run before/after comparison:\n```c\n/* BEFORE (legacy): unbounded, as risky as strcpy */\nvoid log_event_bad(char *buf, size_t bufsz, const char *tag, int code) {\n    (void)bufsz;\n    sprintf(buf, \"[%s] code=%d\", tag, code);\n}\n\n/* AFTER: bounded, and truncation is detectable */\nvoid log_event_good(char *buf, size_t bufsz, const char *tag, int code) {\n    int need = snprintf(buf, bufsz, \"[%s] code=%d\", tag, code);\n    if (need < 0 || (size_t)need >= bufsz) {\n        fprintf(stderr, \"log line truncated (needed %d, had %zu)\\n\", need, bufsz);\n    }\n}\n```\nReal run, deliberately feeding a tag too long for a small buffer:\n```\nlog_event_good(small[16], ..., \"sensor_overflow_event\", -1)\n-> stderr: log line truncated (needed 31, had 16)\n-> small buf result: \"[sensor_overflo\"     <- safely truncated, no overflow\n```\n`need` (31) tells the caller exactly how large a buffer would have been required, which is itself a standard, documented idiom for a two-pass \"measure then allocate\" pattern (`int need = snprintf(NULL, 0, fmt, ...); char *buf = malloc(need + 1); snprintf(buf, need + 1, fmt, ...);`) when the required size is not known ahead of time.\n\nA code review at this level should treat every `sprintf`, `gets`, `strcpy`, and `strcat` call in legacy firmware logging/parsing code as a finding regardless of whether today's inputs happen to fit; the whole point of a fixed-size destination buffer is that some future input will not, and the review's job is to make that case fail safely (truncate and report) rather than fail by corrupting adjacent memory. Module 17 covers the security-vulnerability framing of exactly this class of bug (stack buffer overflows, format-string bugs) in more depth; this question is the library-contract half of the same finding.","pitfall":"Replacing sprintf with snprintf but forgetting to actually check the return value; the overflow is fixed, but a silently truncated, possibly misleading log line is left undetected, which is a real (if quieter) correctness bug for anything downstream parsing that log.","verify":null,"follow":[{"q":"Why does the fixed function check `(size_t)need >= bufsz` rather than `> bufsz`?","a":"snprintf's return value is the number of characters that would have been written excluding the terminator; if that count equals bufsz exactly, the terminator itself had no room, so equality already means truncation occurred."},{"q":"Is checking snprintf's return value optional in a security-conscious codebase?","a":"No; ignoring it is functionally similar to ignoring sprintf's lack of bounds checking in the first place, just with the overflow itself now prevented but the truncation going unnoticed and potentially corrupting a log's meaning silently."}],"mod":14},{"id":"14.17","level":"Principal","type":"Concept","fig":null,"tags":["safelibc","firmwarereview"],"q":"For a firmware team's code review checklist, which common string.h/stdio.h calls are risky by contract, and what should each be replaced with?","short":"Flag any call whose write size depends on unbounded input rather than a caller-supplied destination size: gets, sprintf, strcpy, strcat, and any strncpy/strncat use that assumes automatic null-termination. Replace with fgets(buf, sizeof buf, stdin), snprintf(buf, sizeof buf, ...), a bounded copy that explicitly null-terminates, and a bounded append with an explicit remaining-length check, respectively.","deep":"A practical review table, each row grounded in that function's own documented contract rather than folklore:\n\n| Risky call | Contract gap | Safer replacement |\n|---|---|---|\n| gets(buf) | No length argument at all; cannot bound the write | fgets(buf, sizeof buf, stdin), then strip the trailing newline explicitly |\n| sprintf(buf, fmt, ...) | Writes exactly what the format demands, no bound (14.16) | snprintf(buf, sizeof buf, fmt, ...), checking the return value |\n| strcpy(dst, src) | No bound; overflows if src is longer than dst | snprintf(dst, sizeof dst, \"%s\", src), or a manual bounded copy |\n| strcat(dst, src) | Same as strcpy, plus it re-scans dst for its current end every call | Track a running length and append with strncat plus an explicit remaining-length argument, or better, snprintf-based construction |\n| strncpy(dst, src, n) misused as \"safe strcpy\" | Not guaranteed to null-terminate when src is >= n bytes (14.06) | Always follow with an explicit dst[n-1] = '\\0', or prefer snprintf |\n\nThe unifying review question for every row: \"does this call know the real remaining space in the destination, and does it stop there no matter what the input looks like?\" gets and sprintf structurally cannot know that (no size parameter exists to tell them); strcpy/strcat structurally ignore it even though the destination's size is knowable elsewhere in the code; strncpy knows it but trades away guaranteed termination in exchange.\n\nFor a firmware review specifically, the stakes are higher than on a general-purpose OS: a stack or static buffer overflow in a bare-metal target has no ASan, no guard pages by default, and often no crash at all, just silent adjacent-memory corruption that manifests as an unrelated bug hours later (module 16 and 17 both build on this).","pitfall":"Treating this checklist as a one-time cleanup pass rather than a standing review rule; a codebase that fixes every existing sprintf call but keeps writing new ones the same way has fixed nothing structurally.","verify":null,"follow":[{"q":"Why is gets so much worse than the others that it was removed from C11's own library (it is not declared in C11's stdio.h at all, only in older standards/implementations as a deprecated leftover)?","a":"Because it has no length parameter whatsoever, so there is no caller-side fix at the call site itself; the only correct action is to never call it."},{"q":"Should this checklist also flag scanf(\"%s\", buf)?","a":"Yes, for the same structural reason as gets: an unbound %s conversion in scanf has no length limit either, unlike the width-limited form scanf(\"%15s\", buf), which is the bounded alternative."}],"mod":14},{"id":"14.18","level":"Principal","type":"Concept","fig":null,"tags":["bsearch","minimalimpl","duplicates"],"q":"Write a minimal bsearch, and show that it honors the standard's \"unspecified which matching element is returned\" contract when duplicates are present.","short":"Standard binary search over [lo, hi]: compute mid, compare the key against the element there using the caller's comparator, narrow to the left or right half on a mismatch, and return a pointer to the element on an exact match; the standard match found first depends purely on the array's size and the midpoint arithmetic, not on which duplicate is \"first\" or \"last\" in the array.","deep":"Real, compiled, run implementation and the exact duplicate-key case:\n```c\nint cmp_int(const void *a, const void *b) { return *(const int *)a - *(const int *)b; }\nint arr[] = { 1, 3, 5, 5, 5, 7, 9 };\nint key = 5;\nint *hit = bsearch(&key, arr, 7, sizeof(int), cmp_int);\n/* found 5 at index 3 */\n```\n(This reuses the real bsearch from stdlib.h, already shown matching this exact behavior in 14.04, to make the point concrete without duplicating a from-scratch implementation's code here; the algorithm a hand-written version needs is the standard midpoint-narrowing loop below.)\n```c\nvoid *my_bsearch(const void *key, const void *base, size_t nmemb, size_t size,\n                  int (*compar)(const void *, const void *)) {\n    size_t lo = 0, hi = nmemb;\n    while (lo < hi) {\n        size_t mid = lo + (hi - lo) / 2;\n        const char *elem = (const char *)base + mid * size;\n        int c = compar(key, elem);\n        if (c == 0) return (void *)elem;\n        if (c < 0) hi = mid; else lo = mid + 1;\n    }\n    return NULL;\n}\n```\nIndex 3 out of the three 5s at indices 2, 3, 4 is simply where this loop's midpoint math (`lo + (hi - lo) / 2` starting from the full 7-element range) happens to land first; C11 7.22.5.1p4 states plainly that \"if two elements compare as equal, which element is matched is unspecified,\" precisely so that different (but still correct) binary-search implementations, or the same implementation on a differently-sized array, are all free to return a different one of several equally-valid matches.\n\nThe implementation above deliberately mirrors real bsearch's parameter list exactly (`key, base, nmemb, size, compar`) so it is a drop-in, contract-compatible replacement, useful for an interview whiteboard version of \"implement bsearch from memory.\"","pitfall":"Writing test code or downstream logic that assumes bsearch always returns \"the first\" matching element among duplicates; that assumption is not something the standard, or any conforming implementation, promises.","verify":"C11 7.22.5.1 paragraphs 3-4","follow":[{"q":"Why use lo + (hi - lo) / 2 instead of (lo + hi) / 2 for the midpoint?","a":"The subtract-then-add form avoids lo + hi overflowing size_t for a very large array, which is a real, if rare, correctness concern the simpler-looking form does not have."},{"q":"Would this implementation ever fail to find an element that real bsearch would find?","a":"No, as long as the array is actually sorted according to the same comparator (the shared precondition both real and this bsearch depend on, per 7.22.5.1p3); the algorithm itself is the textbook-correct binary search."}],"mod":14},{"id":"15.01","level":"Basic","type":"Concept","fig":null,"tags":["linkedlist","pushfront"],"q":"How do you implement a singly linked list's node and an insert-at-head operation in C, and why is head insertion O(1)?","short":"A node holds a value and a pointer to the next node (a struct containing a pointer to its own type, allowed by C11 6.7.2.1p3 since a struct may not contain an instance of itself but may contain a pointer to one). Insert-at-head allocates a new node, points its next at the current head, and returns the new node as the new head: no traversal, so it is O(1) regardless of list length.","deep":"Real, compiled, run implementation:\n```c\ntypedef struct Node { int val; struct Node *next; } Node;\n\nNode *push_front(Node *head, int v) {\n    Node *n = malloc(sizeof *n);\n    n->val = v;\n    n->next = head;\n    return n;\n}\n```\nBuilding a list by pushing 5,4,3,2,1 in that order onto an empty list and printing it gives `1 2 3 4 5`, confirming that push_front always puts the newest value first: each call only touches the new node and rewires one pointer, never walking the existing chain.\n\nThe self-referential struct (`struct Node *next` inside `struct Node`) works specifically because the member is a *pointer* to the struct type, not the struct type itself; C11 6.7.2.1p3 states this directly: \"a structure or union shall not contain a member with incomplete or function type (hence, a structure shall not contain an instance of itself, but may contain a pointer to an instance of itself).\" A pointer's size does not depend on the size of what it points to, so the type is well-formed even though `Node` is not yet fully defined at the point the `next` member's type name appears.\n\nFreeing a whole list correctly needs to save `next` before freeing the current node (a bug this page revisits directly in 15.15):\n```c\nvoid free_list(Node *head) {\n    while (head) { Node *next = head->next; free(head); head = next; }\n}\n```","pitfall":"Forgetting that a freshly malloc'd node's next field is uninitialized garbage until explicitly set; every insert function must set next itself rather than assuming a fresh node starts as NULL.","verify":"C11 6.7.2.1 paragraph 3","follow":[{"q":"Why does push_front take and return a Node* rather than modifying a global head variable?","a":"It keeps the function pure and reusable for any list, including a local one in main, and makes the caller's control over the head pointer explicit rather than hidden as a side effect."},{"q":"What is the equivalent O(1) operation at the tail instead of the head?","a":"None, for a plain singly linked list with only a head pointer; appending at the tail requires either walking to the end (O(n)) or maintaining a separate tail pointer alongside head, as the queue implementation in 15.03 does."}],"mod":15},{"id":"15.02","level":"Basic","type":"Concept","fig":null,"tags":["stack","arraybacked","listbacked"],"q":"What are the trade-offs between an array-backed stack and a list-backed stack, and how do you implement each?","short":"Array-backed: fixed capacity chosen up front, no per-element allocation, push/pop are just an index bump plus a store/load, and the whole stack lives in one contiguous, cache-friendly block. List-backed: unbounded (until memory runs out), but every push allocates a node and every pop frees one, and elements are scattered across the heap.","deep":"Array-backed, real compiled code (fixed capacity CAP):\n```c\ntypedef struct { int data[CAP]; int top; } ArrStack;\nvoid as_push(ArrStack *s, int v) { s->data[++s->top] = v; }\nint  as_pop(ArrStack *s)  { return s->data[s->top--]; }\n```\nPushing 1, 2, 3 then popping until empty produced `3 2 1`, the expected LIFO order, with `top` starting at -1 to mean \"empty.\"\n\nList-backed, real compiled code (pushes and pops at the head, same push_front idea as 15.01):\n```c\ntypedef struct { Node *top; } LStack;\nvoid ls_push(LStack *s, int v) { Node *n = malloc(sizeof *n); n->val = v; n->next = s->top; s->top = n; }\nint  ls_pop(LStack *s)  { Node *n = s->top; int v = n->val; s->top = n->next; free(n); return v; }\n```\nPushing 1, 2, 3 then popping three times gave `3 2 1` as well, the same LIFO contract, verified independently of the array version.\n\nThe real trade-off for a firmware interview to state unprompted: the array version has a hard, compile-time-known capacity and zero allocator involvement (good for an ISR-adjacent or allocation-forbidden context, module 17's territory), while the list version never overflows short of running out of heap but pays a malloc/free call, and a pointer-chase, on every single push/pop (15.14 covers the cache-locality cost of that pointer chasing directly).","pitfall":"Shipping the array-backed stack without a capacity check \"because it will never realistically overflow in practice\"; that assumption is exactly the kind of unchecked-bound bug module 17 covers as a real security and reliability hazard.","verify":null,"follow":[{"q":"What happens on as_push if the stack is already at capacity (top == CAP - 1)?","a":"This minimal version has no bounds check at all, so it silently writes past data[CAP-1], a buffer overflow; a real implementation must check top against CAP before incrementing."},{"q":"Why does ls_pop free the node it just read from?","a":"Because the list-backed stack owns its nodes; once a value is popped out, the node backing it is no longer part of the stack and would otherwise leak if not freed."}],"mod":15},{"id":"15.03","level":"Basic","type":"Concept","fig":null,"tags":["queue","ringbuffer","listbacked"],"q":"What are the trade-offs between a circular-array queue and a list-backed queue, and how do you implement each correctly?","short":"A circular array queue wraps head/tail indices modulo its fixed capacity, giving O(1) enqueue/dequeue with no allocation and full cache locality, but a fixed maximum size. A list-backed queue needs both a head and a tail pointer (unlike a stack, which only ever touches one end) to get O(1) enqueue without walking the whole list; it has no fixed capacity but pays per-node allocation.","deep":"Circular array, real compiled code and run, deliberately wrapping the tail index around the capacity:\n```c\ntypedef struct { int data[CAP]; int head, tail, count; } RingQueue;\nvoid rq_push(RingQueue *q, int v) { q->data[q->tail] = v; q->tail = (q->tail + 1) % CAP; q->count++; }\nint  rq_pop(RingQueue *q)  { int v = q->data[q->head]; q->head = (q->head + 1) % CAP; q->count--; return v; }\n```\nWith CAP=5: pushing 10,20,30, popping one (10), then pushing 40,50 (which wraps `tail` back around past index 4 to index 0) and draining the rest gave `10 20 30 40 50`, the correct FIFO order across the wraparound, confirming the modulo arithmetic handles the wrap correctly.\n\nList-backed, real compiled code and run, with the two-pointer head/tail design:\n```c\ntypedef struct { Node *head, *tail; } LQueue;\nvoid lq_push(LQueue *q, int v) {\n    Node *n = malloc(sizeof *n); n->val = v; n->next = NULL;\n    if (q->tail) q->tail->next = n; else q->head = n;\n    q->tail = n;\n}\nint lq_pop(LQueue *q) {\n    Node *n = q->head; int v = n->val;\n    q->head = n->next;\n    if (!q->head) q->tail = NULL;\n    free(n);\n    return v;\n}\n```\nPushing 1,2,3 then popping three times gave `1 2 3`, the expected FIFO order, verified separately from the array version.\n\nThe `if (!q->head) q->tail = NULL;` line in lq_pop is easy to miss and is the classic list-queue bug: after popping the last element, `tail` must be reset too, or the next push will link a new node onto a stale, freed tail pointer.","pitfall":"Implementing a list-backed queue with only a head pointer and walking to the end on every push \"since it is simple\"; that turns every enqueue into O(n), defeating the entire point of a queue's expected O(1) operations.","verify":null,"follow":[{"q":"Why does a stack only need one pointer (top) but a queue needs two (head and tail)?","a":"A stack always inserts and removes at the same end, so one pointer tracks everything; a queue inserts at one end and removes at the other, so both ends need to be independently reachable in O(1)."},{"q":"What happens to the circular array queue if you push when count == CAP?","a":"This minimal version has no full-check, so it silently overwrites data at the old head index before the head pointer catches up, corrupting the oldest unread element; a production version must check count against CAP before pushing (module 18's ring buffer question covers this hardening in more depth)."}],"mod":15},{"id":"15.04","level":"Intermediate","type":"Concept","fig":null,"tags":["doublylinkedlist"],"q":"How does a doubly linked list's insert and remove differ from a singly linked list's, and what makes O(1) removal-by-pointer possible?","short":"Each node carries both next and prev pointers. Removing a given node (with no traversal from the head) is O(1) because the node itself already knows both its neighbors, so their links can be rewired directly; a singly linked list needs the *previous* node's address to unlink a given node, which normally requires a traversal from the head to find it.","deep":"Real, compiled, run implementation:\n```c\ntypedef struct DNode { int val; struct DNode *prev, *next; } DNode;\n\nDNode *dll_insert_after(DNode *pos, int v) {\n    DNode *n = malloc(sizeof *n);\n    n->val = v;\n    n->prev = pos;\n    n->next = pos ? pos->next : NULL;\n    if (pos) { if (pos->next) pos->next->prev = n; pos->next = n; }\n    return n;\n}\n\nvoid dll_remove(DNode *n) {\n    if (n->prev) n->prev->next = n->next;\n    if (n->next) n->next->prev = n->prev;\n    free(n);\n}\n```\nBuilding `1 -> 2 -> 3` and then removing the middle node (`2`) directly via `dll_remove(b)` (no traversal needed since the caller already held a pointer to it) produced `1 3`, confirming the remaining nodes' prev/next links were correctly rewired around the removed node.\n\nThis O(1)-removal-given-a-pointer property is exactly why doubly linked lists are the usual backing structure for an LRU cache's internal list, or any structure where an external index (a hash table mapping a key to a list node pointer) needs to delete an arbitrary element quickly without a search.","pitfall":"Removing a node by pointer without first updating both of its neighbors' links; forgetting the prev side leaves the list traversable forward but corrupted when traversed backward, and forgetting the next side breaks forward traversal entirely.","verify":null,"follow":[{"q":"Why does dll_remove check n->prev and n->next for NULL before dereferencing?","a":"Because the node being removed might be the first node (prev is NULL) or the last node (next is NULL) in the list, and unconditionally dereferencing either would be a NULL-pointer dereference in those cases."},{"q":"What is the memory cost of the extra prev pointer compared to a singly linked list?","a":"One extra pointer per node (commonly 8 bytes on a 64-bit target), doubling the pointer overhead per node while leaving the payload (val here) unchanged."}],"mod":15},{"id":"15.05","level":"Intermediate","type":"Scenario","fig":"linkedlist","tags":["reverse","iterative"],"q":"Reverse a singly linked list in place, iteratively, without allocating any new nodes. Walk through what each pointer is doing.","short":"Walk the list once with three pointers: prev (starts NULL), cur (starts at head), and a saved next; at each step, save cur->next, then point cur->next at prev (reversing that one link), then advance prev and cur forward. When cur becomes NULL, prev is the new head.","deep":"Real, compiled, run implementation:\n```c\nNode *reverse_iter(Node *head) {\n    Node *prev = NULL, *cur = head;\n    while (cur) {\n        Node *next = cur->next;\n        cur->next = prev;\n        prev = cur;\n        cur = next;\n    }\n    return prev;\n}\n```\nStarting from `1 2 3 4 5` (built by pushing 5..1 as in 15.01), calling `reverse_iter` and printing the result gave `5 4 3 2 1`, confirming the reversal.\n\nTracing the pointer state at each iteration on a short 3-node list `A -> B -> C -> NULL` makes the mechanism concrete:\n\n| step | prev | cur | next (saved) | link just rewired |\n|---|---|---|---|---|\n| start | NULL | A | - | - |\n| 1 | A | B | B | A->next now points to NULL (was B) |\n| 2 | B | C | C | B->next now points to A (was C) |\n| 3 | C | NULL | NULL | C->next now points to B (was NULL) |\n\nAfter step 3, `cur` is NULL so the loop ends, and `prev` (C) is returned as the new head: the list is now `C -> B -> A -> NULL`, exactly the reverse of the original, and no node was ever allocated or freed; only the `next` pointers were rewired.\n\nThis is the operation the assigned figure illustrates: the node/next pointer structure, and this exact link-by-link rewiring as the list is walked once.","pitfall":"Returning cur instead of prev at the end of the loop; cur is NULL by the time the loop exits, so returning it gives a reversed list whose head pointer is lost, not the actual new head.","verify":"self-referential struct via pointer member, C11 6.7.2.1 paragraph 3","follow":[{"q":"Why must next be saved before overwriting cur->next?","a":"Because cur->next = prev immediately destroys the only remaining reference to the rest of the original list; without saving it first, the traversal would lose the rest of the list right after reversing the first link."},{"q":"What is the time and space complexity?","a":"O(n) time (one pass, one pointer rewrite per node) and O(1) extra space (three pointer variables regardless of list length), which is the benchmark a recursive version (15.06) is compared against."}],"mod":15},{"id":"15.06","level":"Intermediate","type":"Concept","fig":null,"tags":["reverse","recursive","stackdepth"],"q":"Reverse a singly linked list recursively. How does its resource cost compare to the iterative version?","short":"Recurse to the end of the list first, then, unwinding back up, make each node's next point back at the node that called it, and set the original head's next to NULL. Correctness matches the iterative version exactly, but each recursive call adds a stack frame, so reversing a list of length n uses O(n) call-stack space, versus the iterative version's O(1) extra space; a long enough list risks stack overflow recursively where the loop never would.","deep":"Real, compiled, run implementation:\n```c\nNode *reverse_rec(Node *head) {\n    if (!head || !head->next) return head;\n    Node *new_head = reverse_rec(head->next);\n    head->next->next = head;\n    head->next = NULL;\n    return new_head;\n}\n```\nApplied to the already-iteratively-reversed `5 4 3 2 1` list from 15.05, calling `reverse_rec` and printing gave `1 2 3 4 5` back, confirming the recursive version reverses correctly (and, applied twice in a row here, returns to the original order, a useful sanity check of its own).\n\nThe base case (`!head || !head->next`) stops recursion at an empty list or a single remaining node, which is already \"reversed\" trivially. Unwinding back up the call stack, `head->next->next = head` is the key line: it makes the node that is one step *closer to the original head* point back at `head`, effectively reversing that one link, exactly mirroring what the iterative version's `cur->next = prev` does, just performed in the opposite traversal order (tail-to-head as the stack unwinds, instead of head-to-tail as the loop advances).\n\nThis function is not written as a tail call (there is work, `head->next->next = head; head->next = NULL;`, after the recursive call returns), so a compiler cannot trivially turn it into a loop even with tail-call optimization; module 3's coverage of tail calls and stack growth is directly relevant background for why this specific recursive shape costs real stack space per call, unlike an actually tail-recursive function.","pitfall":"Using unmodified list-length-proportional recursion (as written here) on a list whose maximum length is not tightly bounded; it is correct but trades a real, sometimes hard-to-diagnose stack-overflow risk for arguably more elegant code.","verify":null,"follow":[{"q":"Could this be rewritten to be tail-recursive?","a":"Yes, by passing an accumulator (the growing reversed list) as an extra parameter and doing the pointer rewiring before the recursive call instead of after, which is essentially rewriting the iterative version's loop as recursion with prev/cur as parameters."},{"q":"Why prefer the iterative version in firmware code with a hard stack size limit?","a":"Because its O(1) extra space has no dependency on list length, while the recursive version's stack usage grows linearly with list length and can overflow a small, fixed embedded stack on a long enough list, a failure mode the iterative version cannot have."}],"mod":15},{"id":"15.07","level":"Intermediate","type":"Numeric","fig":null,"tags":["middlenode","slowfast"],"q":"Using the slow/fast pointer technique on a 7-node list holding 1..7, trace exactly where slow and fast are after each step, and confirm why slow ends up on the middle element.","short":"slow and fast both start at the head; each loop step moves slow one node and fast two nodes, stopping once fast reaches the end. Since fast covers ground twice as fast as slow, when fast has traveled to the end (6 hops for a 7-node list), slow has traveled half as far (3 hops), landing exactly on node 4, the middle of 1..7. Verified: find_middle returned 4.","deep":"Real, compiled, run code:\n```c\nNode *find_middle(Node *head) {\n    Node *slow = head, *fast = head;\n    while (fast && fast->next) { slow = slow->next; fast = fast->next->next; }\n    return slow;\n}\n```\nTracing the loop on the 7-node list `1 2 3 4 5 6 7` (indices 1..7 by value, so \"node k\" below just means the node holding value k):\n\n| iteration | slow (before) | fast (before) | fast && fast->next? | slow (after) | fast (after) |\n|---|---|---|---|---|---|\n| 1 | 1 | 1 | yes | 2 | 3 |\n| 2 | 2 | 3 | yes | 3 | 5 |\n| 3 | 3 | 5 | yes | 4 | 7 |\n| 4 | 4 | 7 | no (7->next is NULL) | loop stops | loop stops |\n\nThe loop condition `fast && fast->next` fails once fast is at node 7 (the last node, whose next is NULL), so the loop body never runs a 4th time; slow is left at node 4, exactly the middle of the 7 nodes, matching the real program's printed output `middle of 1..7 is 4`.\n\nGeneralizing: for an odd-length list of n nodes, fast needs (n-1)/2 full double-steps to reach the last node, and slow (moving half as fast) ends up at node number (n-1)/2 + 1, which is exactly the middle element (node 4 of 7 here: (7-1)/2 + 1 = 4). For an even-length list, this exact loop condition lands slow on the *second* of the two middle nodes (worth stating as a deliberate, testable convention choice, since some interview specifications instead want the first of the two).","pitfall":"Assuming this loop's specific stopping condition always lands on the mathematically \"first\" middle node for an even-length list; the exact node returned for an even count depends on the precise loop condition used, and different (still-correct-looking) variants disagree on which of the two middles they return.","verify":null,"follow":[{"q":"What would change if the loop condition were just while (fast) instead of while (fast && fast->next)?","a":"It would attempt fast->next->next when fast is the last node (fast->next is NULL), dereferencing a NULL pointer's next field, an immediate crash; the && fast->next check exists specifically to stop one iteration earlier."},{"q":"Does this technique require knowing the list's length in advance?","a":"No, that is exactly its advantage over \"count the nodes, then walk length/2 steps,\" which requires two full passes; slow/fast finds the middle in a single pass."}],"mod":15},{"id":"15.08","level":"Intermediate","type":"Debug","fig":null,"tags":["cycledetection","floyd"],"q":"A teammate's cycle-detection function marks every visited node's address in a growing array and checks each new node against that array before continuing. Why is this both slower and riskier than Floyd's algorithm, and how do you replace it?","short":"The visited-array approach needs O(n) extra memory that must be sized or reallocated for an unknown-length list (and is simply wrong, not just slow, if the list turns out to be cyclic and thus unbounded in \"nodes visited so far\" terms), plus an O(n) scan per new node for an unsorted array, giving O(n^2) overall. Floyd's slow/fast pointer algorithm detects a cycle in O(n) time with O(1) extra space and no upfront sizing assumption at all.","deep":"Real, compiled, run implementation of Floyd's algorithm, and the exact scenario that breaks a visited-array approach:\n```c\nint has_cycle(Node *head) {\n    Node *slow = head, *fast = head;\n    while (fast && fast->next) {\n        slow = slow->next;\n        fast = fast->next->next;\n        if (slow == fast) return 1;\n    }\n    return 0;\n}\n```\nBuilt a 7-node list `1..7`, confirmed `has_cycle` correctly returns 0 on the plain list, then manually linked node 7's next back to node 4 (simulating a real corrupted-list bug) and re-ran the same function: it correctly returned 1 this time. Both results were verified against the actual list structure, not assumed.\n\nWhy the visited-array approach is worse in exactly the way that matters for this bug class: a cyclic list has no well-defined \"end,\" so any traversal that keeps appending \"nodes visited so far\" to a container without ever checking for a repeat first (rather than checking membership before each append) never terminates at all on a truly cyclic list, looping forever while growing an unbounded array, exactly the failure this detection code is supposed to catch. Even a correctly-ordered \"check membership, then append\" version is O(n) per lookup in a plain array (or needs a hash set to get O(1) lookups, at the cost of real extra memory), while Floyd's two-pointer technique needs no auxiliary storage proportional to list size at all: just two Node* variables, regardless of whether the list has 10 nodes or 10 million.\n\nThe mechanism: if there is a cycle, fast (moving twice as fast) is guaranteed to eventually lap slow from behind within the cycle and land on the exact same node, because their relative speed inside the cycle is 1 node per iteration, so the gap between them shrinks by exactly 1 each step until it hits 0. If there is no cycle, fast simply reaches the natural NULL end first, and the loop's `fast && fast->next` condition stops it there.","pitfall":"Building \"cycle detection\" as \"grow a set of visited addresses\" without first checking membership before insertion; on an actually cyclic list, that specific ordering mistake means the detection code itself never terminates, the exact bug it was meant to catch.","verify":null,"follow":[{"q":"Does Floyd's algorithm tell you where the cycle begins, not just that one exists?","a":"The basic version above only answers yes/no; a well-known extension (reset one pointer to head, then advance both one step at a time until they meet again) locates the exact node where the cycle starts, a natural interview follow-up."},{"q":"Why must the loop check fast && fast->next rather than just fast, exactly as in 15.07?","a":"For the same reason: to avoid dereferencing fast->next->next when fast is already the last node in a non-cyclic list, which would otherwise be a NULL-pointer dereference."}],"mod":15},{"id":"15.09","level":"Intermediate","type":"Concept","fig":null,"tags":["mergelists","sorted"],"q":"Merge two already-sorted singly linked lists into one sorted list, without allocating any new nodes.","short":"Use a dummy head node and a tail pointer; repeatedly compare the two lists' current front nodes, splice the smaller one onto the result's tail, and advance that list's pointer, until one list runs out, then splice the entire remainder of the other list onto the tail in one step.","deep":"Real, compiled, run implementation:\n```c\nNode *merge_sorted(Node *a, Node *b) {\n    Node dummy = {0, NULL};\n    Node *tail = &dummy;\n    while (a && b) {\n        if (a->val <= b->val) { tail->next = a; a = a->next; }\n        else { tail->next = b; b = b->next; }\n        tail = tail->next;\n    }\n    tail->next = a ? a : b;\n    return dummy.next;\n}\n```\nMerging `1 3 5 7` with `2 4 6` produced `1 2 3 4 5 6 7`, a fully sorted, interleaved result, confirming both the comparison logic and the final \"attach whatever is left\" step.\n\nThe dummy stack-local node (`Node dummy = {0, NULL};`) is a standard technique to avoid special-casing \"what is the very first node of the result\": without it, the first splice would need its own separate code path to set a genuine head pointer instead of just advancing `tail->next`. `dummy.next` at the end is exactly that real head, decided naturally by whichever list contributed the very first node.\n\nNo new nodes are allocated: every node in the result is one of the original nodes from `a` or `b`, just relinked; this is the same \"rewire pointers, do not copy data\" spirit as the in-place reversal in 15.05.","pitfall":"Using <= versus < in the comparison inconsistently between two similar merge functions in the same codebase; it changes which list's element comes first when values are equal, which matters if later code depends on a stable interleaving of equal keys.","verify":null,"follow":[{"q":"What happens if the input lists are not actually sorted?","a":"The function still runs and produces some list, but it will not be sorted; the algorithm's correctness depends entirely on the precondition that both inputs are already sorted, exactly like bsearch's precondition in module 14."},{"q":"Is this the same core idea used in merge sort's merge step?","a":"Yes exactly; this two-pointer, take-the-smaller-front repeatedly technique is the merge step of merge sort, just applied here to two already-independently-sorted lists rather than to two halves of a list being recursively sorted."}],"mod":15},{"id":"15.10","level":"Advanced","type":"Concept","fig":null,"tags":["bst","insert","traversal"],"q":"Implement BST insertion and an inorder traversal, and explain why inorder traversal visits nodes in sorted order.","short":"Insert recursively: go left if the new value is smaller than the current node, right if larger, and attach a new node when you fall off the tree. Inorder traversal (left subtree, then this node, then right subtree, recursively) visits sorted order specifically because the BST invariant guarantees every node in a left subtree is smaller and every node in a right subtree is larger than the node itself, at every level.","deep":"Real, compiled, run implementation:\n```c\ntypedef struct BNode { int val; struct BNode *left, *right; } BNode;\n\nBNode *bst_insert(BNode *root, int v) {\n    if (!root) { BNode *n = malloc(sizeof *n); n->val = v; n->left = n->right = NULL; return n; }\n    if (v < root->val) root->left = bst_insert(root->left, v);\n    else if (v > root->val) root->right = bst_insert(root->right, v);\n    return root;\n}\n\nvoid inorder(BNode *root) {\n    if (!root) return;\n    inorder(root->left);\n    printf(\"%d \", root->val);\n    inorder(root->right);\n}\n```\nInserting `5, 3, 8, 1, 4, 7, 9` in that order and running `inorder` printed `1 3 4 5 7 8 9`, fully sorted ascending, regardless of the arbitrary insertion order.\n\nThe recursive insert function relies on the same \"return the (sub)tree root, let the caller relink it\" pattern used throughout this module: `root->left = bst_insert(root->left, v);` both recurses into the left subtree and, on the way back up, rewrites the parent's left pointer to whatever that subtree's root now is (unchanged for every level except the one where the new node was actually attached).\n\nThis particular insertion order (5,3,8,1,4,7,9) happens to build a reasonably balanced tree; a BST's worst case (inserting already-sorted data, e.g. 1,2,3,4,5,6,7 in order) degenerates into a linked list with O(n) height, turning every operation from the expected O(log n) into O(n), a fact worth raising unprompted as the direct motivation for self-balancing variants (AVL, red-black trees) that this page does not implement but that an interviewer will expect you to know exist.","pitfall":"Assuming a BST built from arbitrary insertion order is automatically balanced; sorted or near-sorted input insertion order produces a degenerate, effectively linear tree with none of a BST's expected logarithmic performance.","verify":null,"follow":[{"q":"What would a preorder traversal (node, then left, then right) be useful for instead of sorted output?","a":"Reconstructing the tree's own structure (e.g. serializing it for later rebuilding), since preorder visits each subtree's root before its children, capturing the shape top-down."},{"q":"Why does bst_insert return BNode* instead of taking a BNode** and modifying the root in place?","a":"Both work; the return-and-relink style used here reads more like ordinary recursive functions elsewhere in this module and avoids explicit pointer-to-pointer syntax, at the (usually negligible) cost of reassigning a pointer at every level on the way back up even when it did not change."}],"mod":15},{"id":"15.11","level":"Advanced","type":"Concept","fig":null,"tags":["bst","search","delete"],"q":"Implement BST search and deletion, specifically the case of deleting a node that has two children.","short":"Search walks left or right by comparison exactly like insert, stopping at a match or a NULL. Deleting a leaf or a one-child node just splices the single child (or NULL) into the parent's slot. Deleting a two-child node instead copies in the value of its inorder successor (the smallest value in its right subtree) and then recursively deletes that successor node from the right subtree, where it is guaranteed to have at most one child.","deep":"Real, compiled, run implementation:\n```c\nBNode *bst_search(BNode *root, int v) {\n    if (!root || root->val == v) return root;\n    return v < root->val ? bst_search(root->left, v) : bst_search(root->right, v);\n}\n\nBNode *bst_min(BNode *root) { while (root->left) root = root->left; return root; }\n\nBNode *bst_delete(BNode *root, int v) {\n    if (!root) return NULL;\n    if (v < root->val) root->left = bst_delete(root->left, v);\n    else if (v > root->val) root->right = bst_delete(root->right, v);\n    else {\n        if (!root->left)  { BNode *r = root->right; free(root); return r; }\n        if (!root->right) { BNode *l = root->left;  free(root); return l; }\n        BNode *succ = bst_min(root->right);\n        root->val = succ->val;\n        root->right = bst_delete(root->right, succ->val);\n    }\n    return root;\n}\n```\nOn the same tree as 15.10 (inorder `1 3 4 5 7 8 9`), calling `bst_search(root, 7)` found it and `bst_search(root, 6)` correctly reported missing. Deleting the root itself (value 5, which has two children) and reprinting inorder gave `1 3 4 7 8 9`: 5 is gone, the remaining values are still fully sorted, confirming the two-child deletion correctly preserved the BST invariant.\n\nThe reason the inorder successor (`bst_min` of the right subtree) is exactly the right replacement value: it is the smallest value that is still larger than everything in the deleted node's left subtree, and by construction (it is the leftmost node of the right subtree) it has no left child of its own, so deleting it recursively from the right subtree always falls into the \"zero or one child\" cases already handled, never re-triggering the two-child case for the successor itself.","pitfall":"Deleting a two-child node by just picking one of its two children to promote directly into its place; that breaks the BST invariant for the rest of that child's original subtree unless the successor/predecessor value-copy-then-recursive-delete pattern (or an equivalent rebalancing) is used instead.","verify":null,"follow":[{"q":"Could the inorder predecessor (largest value in the left subtree) be used instead of the successor?","a":"Yes, symmetrically; either choice preserves the BST invariant equally well, and real implementations differ only by convention on which one they pick."},{"q":"What is the time complexity of bst_delete on a balanced tree of n nodes?","a":"O(log n), the same as search and insert, since it does at most one root-to-leaf walk (plus, for the two-child case, one more walk down to find the successor, still bounded by the tree's height)."}],"mod":15},{"id":"15.12","level":"Advanced","type":"Concept","fig":null,"tags":["hashtable","chaining"],"q":"Design and implement a hash table with chaining: what does each bucket hold, and how do insert and lookup work?","short":"An array of NBUCKETS bucket heads, each a singly linked list of (key, value) nodes. Insert hashes the key to pick a bucket, then pushes a new node onto that bucket's list (O(1), no collision resolution needed beyond chaining). Lookup hashes the key the same way, then walks only that one bucket's chain comparing keys, so average-case lookup is O(1 + load factor) rather than O(n) over the whole table.","deep":"Real, compiled, run implementation, keyed by string (a realistic case: named config fields):\n```c\n#define NBUCKETS 8\ntypedef struct HNode { char *key; int val; struct HNode *next; } HNode;\ntypedef struct { HNode *buckets[NBUCKETS]; } HashTable;\n\nunsigned hash_str(const char *s) {\n    unsigned h = 5381;\n    while (*s) h = h * 33 + (unsigned char)*s++;   /* djb2 */\n    return h;\n}\n\nvoid ht_put(HashTable *t, const char *key, int val) {\n    unsigned idx = hash_str(key) % NBUCKETS;\n    HNode *n = malloc(sizeof *n);\n    n->key = dup_str(key);   /* heap-owned copy; caller's key string may not outlive this call */\n    n->val = val;\n    n->next = t->buckets[idx];\n    t->buckets[idx] = n;\n}\n\nint ht_get(HashTable *t, const char *key, int *out) {\n    unsigned idx = hash_str(key) % NBUCKETS;\n    for (HNode *n = t->buckets[idx]; n; n = n->next)\n        if (strcmp(n->key, key) == 0) { *out = n->val; return 1; }\n    return 0;\n}\n```\n(`dup_str` is a small manual `malloc` + `memcpy` helper; C11's string.h has no standard `strdup`, that name is a POSIX addition, so this page implements its own copy rather than reach outside ISO C.)\n\nInserting `\"lba_start\"->0`, `\"lba_count\"->4096`, `\"block_size\"->4096` and then looking up `\"block_size\"` correctly returned found=1, value=4096; looking up `\"missing_key\"` correctly returned found=0.\n\nEach `ht_put` pushes onto the front of its bucket's chain, exactly like 15.01's `push_front`, which is why a hash table with chaining is naturally described as \"an array of linked lists\": every bucket is a small independent singly linked list, and this table's entire design is 15.01's data structure applied NBUCKETS times over.","pitfall":"Growing a hash table's load far beyond its bucket count without ever resizing (rehashing into a larger bucket array); every chain grows unbounded and lookup performance degrades toward a plain linked list's O(n), silently, with no error or warning.","verify":null,"follow":[{"q":"What happens as more keys land in the same bucket?","a":"The chain for that bucket grows, and lookup degrades from O(1) toward O(chain length); this is exactly the load-factor and hash-quality concern covered directly in 15.13."},{"q":"Why hash to unsigned and then take % NBUCKETS rather than working in signed int?","a":"To avoid a negative hash value ever reaching the modulo (which would either be undefined behavior territory for a negative dividend in some formulations or simply produce a negative index), unsigned arithmetic wraps predictably and stays non-negative by construction."}],"mod":15},{"id":"15.13","level":"Advanced","type":"Trap","fig":null,"tags":["hashfunction","collisions","loadfactor"],"q":"A hash table using `hash(key) = (key * 4) % NBUCKETS` performs badly on keys that are all multiples of 4 (a realistic pattern for, say, 4-byte-aligned addresses used as keys). Why, and how does a better hash function fix it?","short":"Multiplying every key by 4 before the modulo means every key's hash is itself a multiple of 4 modulo NBUCKETS; if the keys are already multiples of 4 (aligned addresses are a classic real example), the extra *4 factor collapses most of the key space into a small handful of buckets instead of spreading across all NBUCKETS. A hash that mixes the bits thoroughly (avalanche-style mixing) spreads the same key set far more evenly, regardless of the keys' own alignment pattern.","deep":"Real, compiled, run measurement, with 8 keys that are all multiples of 4 (0, 4, 8, ..., 28) hashed into 16 buckets:\n```c\nunsigned bad_hash_pow2(int key) { return (unsigned)(key * 4) % NBUCKETS; }\nunsigned good_hash(int key) {\n    unsigned h = (unsigned)key;\n    h ^= h >> 16; h *= 0x7feb352dU;\n    h ^= h >> 15; h *= 0x846ca68bU;\n    h ^= h >> 16;\n    return h % NBUCKETS;\n}\n```\nActual measured worst-case bucket load across all 16 buckets for the same 8 keys:\n```\nworst-case bucket load: bad_hash_pow2=8, good_hash=2 (out of 8 keys)\n```\n`bad_hash_pow2` put every single one of the 8 keys into the exact same bucket (a worst-case load of 8, meaning it degenerated to a plain 8-element linked list for every single lookup); `good_hash` spread the same 8 keys so that no bucket held more than 2, close to the ideal 8/16 = 0.5 average load.\n\nWhy the collapse happens mathematically: with `NBUCKETS = 16` (a power of two) and every key already a multiple of 4, `key * 4` is a multiple of 16 for every key that is itself a multiple of 4, so `(key * 4) % 16` is 0 for every single one of them. A hash function that only ever multiplies and takes a modulo with a power-of-two table size is throwing away exactly the low bits that would otherwise distinguish these keys, precisely when the input already has a nonrandom low-bit pattern (address alignment is one of the most common real sources of exactly this pattern).\n\n`good_hash`'s xor-shift-multiply sequence (a widely used integer hash mixing pattern) deliberately spreads influence from every input bit across every output bit before the final modulo, so a shared low-bit pattern in the input no longer maps to a shared low-bit pattern in the output.","pitfall":"Choosing a hash function that looks \"randomish\" by eye (multiply by a constant, take a modulo) without checking its actual bucket-load distribution against realistic key patterns; a hash that is fine on random test keys can collapse badly on the structured key patterns real systems actually produce.","verify":"djb2/xor-shift-multiply mixing constants are widely published integer-hash folklore, not ISO C or POSIX-specified; treat the specific constants as implementation choice, not a standard.","follow":[{"q":"Would simply using a prime number of buckets instead of a power of two have fixed bad_hash_pow2 on its own?","a":"It would help somewhat (a prime modulus tends to break up simple multiplicative patterns better than a power of two), but it does not fix the root problem the same way real bit-mixing does, and it constrains the table size to primes, which complicates resizing logic."},{"q":"Is this bug something -Wall/-Wextra would catch?","a":"No; both hash functions compile silently and \"work\" in the sense of returning a valid bucket index every time, the defect is purely about the statistical distribution of outputs, which no compiler warning inspects."}],"mod":15},{"id":"15.14","level":"Advanced","type":"Cross-layer","fig":null,"tags":["cachelocality","pointerchasing"],"q":"Why is traversing a linked list measurably slower than traversing an equally-sized array, even though both are nominally O(n) traversals?","short":"An array's elements are contiguous, so sequential access lets the CPU's hardware prefetcher and cache lines do their job: one cache-line fetch covers many consecutive elements. A linked list's nodes are scattered wherever malloc happened to place them, so each next-pointer follow is a fresh, unpredictable memory address, likely a fresh cache miss every single node, turning \"O(n) with a small constant\" into \"O(n) with a much larger constant\" purely from memory latency, not instruction count.","deep":"Real, compiled (with -O2), measured benchmark summing 2,000,000 ints both ways:\n```c\nlong sum1 = 0;\nfor (int i = 0; i < N; i++) sum1 += arr[i];          /* array traversal */\n\nlong sum2 = 0;\nfor (Node *p = head; p; p = p->next) sum2 += p->val;  /* list traversal, same N nodes */\n```\nActual measured result on this run:\n```\narray sum=1999999000000 time=0.0013s\nlist  sum=1999999000000 time=0.0119s\nlist/array ratio: 9.5x\n```\nBoth loops compute the identical mathematical result (confirmed: the two sums match exactly), and both are unambiguously O(n) in the number of elements touched, yet the list traversal took roughly 9.5 times longer in this run. The instruction count per element is similar (a load, an add, a pointer/index advance); the difference is almost entirely memory-system behavior: the array's sequential access pattern lets the CPU prefetch upcoming cache lines before they are needed, while the list's node addresses are effectively random relative to each other (wherever the allocator happened to place each malloc call), so most next-pointer dereferences miss cache and pay full DRAM latency.\n\nThis is exactly the kind of fact a Principal-level firmware interview expects stated unprompted when a candidate is asked to choose a data structure for a hot path: \"asymptotically the same O(n)\" is not the same claim as \"equally fast in practice,\" and for latency-sensitive embedded code, a contiguous array (or an array-backed structure like 15.02/15.03's array-backed stack/queue) is very often the right default over a linked structure specifically because of this cache-locality gap, independent of any algorithmic complexity argument.","pitfall":"Choosing a data structure purely by asymptotic complexity (\"O(n) is O(n)\") without considering the real memory-access pattern each option produces; two structures with identical big-O traversal cost can differ by nearly an order of magnitude in actual wall-clock time.","verify":null,"follow":[{"q":"Would this gap shrink or grow on a target with no data cache at all (a very small microcontroller)?","a":"It would shrink toward zero, since without a cache hierarchy, both access patterns pay a similar flat per-access memory latency; the gap measured here is a cache-hierarchy effect specific to CPUs with cache, not a fundamental property of pointer-chasing itself."},{"q":"Does allocating all the list's nodes from one contiguous arena instead of individually malloc'ing each one help?","a":"Yes, substantially in practice; if the nodes happen to end up physically near each other (a common technique: a node pool/arena allocator), sequential traversal gets much better locality than nodes scattered across many separate heap allocations, even though the pointer-chasing access pattern itself is unchanged."}],"mod":15},{"id":"15.15","level":"Advanced","type":"Debug","fig":null,"tags":["useafterfree","listfree"],"q":"A list-freeing function frees each node and then still reads that node's next field to continue the loop. What is the bug, how does the toolchain catch it, and what is the fix?","short":"free(p) followed by p = p->next reads the next field of memory that was just deallocated: a use-after-free, undefined behavior. GCC 13's own -Wall diagnoses this specific pattern statically (-Wuse-after-free), and AddressSanitizer catches it dynamically at the exact faulting read with a full report. Fix: save next into a local variable before ca
