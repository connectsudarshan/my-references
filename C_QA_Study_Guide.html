lling free on the current node.","deep":"The buggy function, and the fix, both real and compiled:\n```c\n/* BUG: use-after-free */\nvoid free_list_bad(Node *head) {\n    Node *p = head;\n    while (p) { free(p); p = p->next; }   /* reads p->next AFTER p was freed */\n}\n\n/* FIX: save next before freeing */\nvoid free_list_good(Node *head) {\n    while (head) {\n        Node *next = head->next;   /* saved first */\n        free(head);\n        head = next;               /* uses the saved copy, never touches freed memory */\n    }\n}\n```\nJust compiling `free_list_bad` with `-std=c11 -Wall -Wextra` (no sanitizer flag needed) produced this real diagnostic on this toolchain:\n```\nwarning: pointer 'p' used after 'free' [-Wuse-after-free]\n    p = p->next;\n        ~~^~~~~~\n  note: call to 'free' here\n    free(p);\n```\nBuilding the same buggy function with `-fsanitize=address -g` and actually running it produced a full runtime report at the exact faulting line:\n```\n==ERROR: AddressSanitizer: heap-use-after-free on address ...\nREAD of size 8 ... in free_list_bad ... uafbug2.c:5\nfreed by thread T0 here:\n    #1 free_list_bad ... uafbug2.c:5\npreviously allocated by thread T0 here: ... malloc ...\n```\nThe fixed version, run on a real 4-node list, printed \"ok\" with no warning and no sanitizer report, confirming both that saving `next` before freeing eliminates the diagnosed defect and that the corrected function still does its actual job (freeing every node).\n\nThis exact bug (free, then dereference the just-freed pointer's own field to decide what comes next) is one of the most common real-world linked-list defects, precisely because the \"obvious\" one-line loop body (`free(p); p = p->next;`) reads correctly at a glance and often does not crash immediately in practice (freed memory is frequently left readable, if not reliable, for a short time by many allocators), which is exactly why relying on \"it did not crash when I tested it\" is not evidence of correctness for this class of bug.","pitfall":"Trusting a clean, crash-free test run of exactly this kind of loop as proof of correctness; both the specific static warning and the dynamic sanitizer report shown here exist precisely because ordinary testing frequently fails to reveal a use-after-free at all.","verify":null,"follow":[{"q":"Why does this bug not reliably crash without a sanitizer?","a":"Because free() typically does not zero or unmap the memory it releases immediately; the bytes are often still physically present and readable (though logically invalid and subject to being overwritten by any subsequent allocation), so a use-after-free read frequently \"succeeds\" with a plausible-looking but logically meaningless value instead of crashing."},{"q":"Would reordering to p = p->next; free(p_prev) (tracking the previous node explicitly) also fix it?","a":"Yes, any ordering that reads next before that specific node is freed works; saving next into a local variable first is simply the most direct, minimal-state version of that same fix."}],"mod":15},{"id":"15.16","level":"Principal","type":"Scenario","fig":null,"tags":["intrusivelist","containerof","kernelstyle"],"q":"Design an intrusive linked list, where the link pointers live inside the struct being linked rather than in a separate wrapper node, and show how a caller recovers the containing struct from just a link pointer.","short":"Embed a plain { struct ListNode *next; } member directly inside the payload struct; the list itself only ever stores and walks pointers to that embedded member. To get back to the containing struct from a link pointer, use a container_of-style macro: subtract the member's known byte offset (via offsetof) from the link pointer's address, exactly the technique real kernels use for zero-allocation, embeddable lists.","deep":"Real, compiled, run implementation:\n```c\ntypedef struct ListNode { struct ListNode *next; } ListNode;\n\n#define container_of(ptr, type, member) \\\n    ((type *)((char *)(ptr) - offsetof(type, member)))\n\ntypedef struct {\n    int id;\n    char name[16];\n    ListNode link;     /* embedded node: no separate allocation for list bookkeeping */\n} Device;\n```\nLinking two real Device structs by their embedded `link` members and walking the list purely through `ListNode *` pointers, then recovering each `Device*` at every step:\n```c\nDevice d1 = { 1, \"nand0\", { NULL } };\nDevice d2 = { 2, \"nand1\", { NULL } };\nd1.link.next = &d2.link;\n\nListNode *cur = &d1.link;\nwhile (cur) {\n    Device *dev = container_of(cur, Device, link);\n    printf(\"device id=%d name=%s\\n\", dev->id, dev->name);\n    cur = cur->next;\n}\n```\nActual output: `device id=1 name=nand0` then `device id=2 name=nand1`, confirming `container_of` correctly recovered each full `Device` from nothing but a pointer to its embedded `link` member.\n\n`offsetof(type, member)` (stddef.h, C11 7.19) gives the exact byte distance from the start of `type` to `member`; since `link` is a plain, fixed-layout member (no padding surprises beyond what module 6 already covers for ordinary struct layout), subtracting that constant offset from the address of the embedded `ListNode` recovers the address of the struct that contains it, with zero runtime search and no extra pointer stored anywhere.\n\nWhy this earns its place as a Principal-level design question: the same list-linking machinery (`ListNode`, and the traversal logic) works completely generically for *any* struct that embeds a `ListNode`, with zero heap allocation dedicated to list bookkeeping (unlike every other list in this module, which allocates a separate wrapper node per element); this is exactly the technique the Linux kernel's own `struct list_head` uses throughout, and it is a natural fit for firmware contexts (module 17's territory) where a fixed set of long-lived driver/device structs need to be linked and relinked without ever calling an allocator.","pitfall":"Using container_of on a pointer that does not actually point at the named member (a typo'd member name compiles fine as long as the type matches accidentally, or a stray pointer entirely); there is no runtime check, so the result is a garbage pointer used with full confidence.","verify":"offsetof is defined in C11 7.19 (stddef.h); the container_of pattern itself is a widely used idiom (notably in the Linux kernel), not something C11 names or specifies directly.","follow":[{"q":"What is the main risk of this technique compared to a wrapper-node list?","a":"Every struct type that wants to participate in this kind of list must dedicate a member to the embedded link, and a struct can only be a member of as many such lists as it has distinct embedded link members, unlike a wrapper-node list which can link any existing struct without modifying its definition."},{"q":"Does container_of perform any runtime check that ptr actually points at the named member of a real type instance?","a":"No, none at all; it is pure pointer arithmetic based on a compile-time offset, so passing it a pointer that is not actually a member of that member at that struct type produces silently wrong, out-of-bounds pointers rather than any kind of detectable error."}],"mod":15},{"id":"15.17","level":"Principal","type":"Concept","fig":null,"tags":["embedded","fixedcapacity","noalloc"],"q":"For an embedded system where malloc is disallowed after initialization, how do you provide stack/queue behavior with no per-operation dynamic allocation?","short":"Use the fixed-capacity array-backed forms already shown in 15.02/15.03 (an index-tracked array for a stack, a circular-array queue for a FIFO), sized at compile time or once at startup, so every push/pop/enqueue/dequeue is pure index and bounds arithmetic with zero calls into an allocator afterward. The one addition a production version needs beyond 15.02/15.03's minimal versions is an explicit full/empty check on every operation, since neither of those minimal versions had one.","deep":"Restating the array-backed forms from 15.02/15.03 with the missing bounds checks made explicit, which is exactly what a \"malloc-forbidden after init\" firmware review should be looking for:\n```c\ntypedef struct { int data[CAP]; int top; } ArrStack;\nint as_push(ArrStack *s, int v) {\n    if (s->top + 1 >= CAP) return -1;   /* full: caller must handle, not overflow silently */\n    s->data[++s->top] = v;\n    return 0;\n}\n```\n```c\ntypedef struct { int data[CAP]; int head, tail, count; } RingQueue;\nint rq_push(RingQueue *q, int v) {\n    if (q->count == CAP) return -1;     /* full: do not silently overwrite the oldest entry */\n    q->data[q->tail] = v; q->tail = (q->tail + 1) % CAP; q->count++;\n    return 0;\n}\n```\nBoth `CAP`-sized arrays live wherever they are declared (a global, a `static`, or a field inside a larger driver-state struct), determined entirely at compile time; nothing here ever calls `malloc`, `free`, or any other allocator function, satisfying the \"no dynamic allocation after init\" constraint directly, and giving fully deterministic, bounded memory usage that a static analysis or a linker map can verify ahead of time, a real concern for a certified or safety-reviewed firmware image.\n\nThis module's ring buffer here is intentionally the minimal version; module 18 covers the same underlying structure at full Principal-interview depth (sizing the capacity as a power of two specifically so wraparound can use a bitmask instead of a modulo, and treating it as a single-producer/single-consumer design point), so the deeper treatment of capacity-sizing tricks and concurrency-adjacent correctness belongs there rather than being duplicated here.","pitfall":"Reusing 15.02/15.03's minimal teaching versions verbatim in real firmware without adding the full/empty checks; those versions were written to show the core mechanism clearly, not as production-ready, bounds-safe code.","verify":null,"follow":[{"q":"Why return an error code instead of asserting or silently dropping data on a full push?","a":"An error return lets the caller decide the right policy for its situation (drop the newest, drop the oldest, block, or propagate an error upward), which is a decision that depends on the specific system and should not be hard-coded inside the data structure itself."},{"q":"Is a fixed-capacity array-backed structure automatically safe to share between an ISR and the main loop?","a":"No; bounds-checked pushes/pops handle capacity correctly, but concurrent access from an interrupt context and normal code still needs its own correctness reasoning (ordering, atomicity of the index updates), which is squarely module 17's and the sibling C Advanced page's territory, not something capacity checking alone solves."}],"mod":15},{"id":"15.18","level":"Principal","type":"Scenario","fig":null,"tags":["datastructurechoice","binarysearch","designtradeoff"],"q":"You need a lookup table for firmware configuration keys known entirely at compile time (page size, zone size, max open zones, and similar fixed fields). Would you reach for a BST, a hash table, or a sorted array with binary search, and why?","short":"A sorted static const array searched with binary search: for a fixed, compile-time-known key set, it needs zero allocation, zero pointers to chase (contiguous memory, matching 15.14's cache-locality argument directly), lives entirely in read-only .rodata/flash (module 13's section-placement argument), and gives the same O(log n) lookup complexity as a BST with none of a BST's or hash table's runtime construction cost or memory overhead.","deep":"Real, compiled, run implementation:\n```c\ntypedef struct { const char *key; int value; } CfgEntry;\n\nstatic const CfgEntry cfg[] = {\n    { \"erase_block_size\", 262144 },\n    { \"max_open_zones\",   14 },\n    { \"page_size\",        4096 },\n    { \"zone_size\",        1073741824 },\n};\n#define NCFG (sizeof cfg / sizeof cfg[0])\n\nint cfg_lookup(const char *key, int *out) {\n    int lo = 0, hi = (int)NCFG - 1;\n    while (lo <= hi) {\n        int mid = lo + (hi - lo) / 2;\n        int c = strcmp(key, cfg[mid].key);\n        if (c == 0) { *out = cfg[mid].value; return 1; }\n        if (c < 0) hi = mid - 1; else lo = mid + 1;\n    }\n    return 0;\n}\n```\nReal run: `cfg_lookup(\"page_size\", &v)` found it with value 4096; `cfg_lookup(\"unknown_key\", &v)` correctly reported not found.\n\nThe design case for this over the two alternatives, stated the way an interviewer wants to hear it argued rather than just asserted:\n\n- Versus a BST (15.10/15.11): a BST built from this fixed, known-in-advance key set at program startup pays real construction cost (n insertions, each involving pointer writes and, worse, a real risk of ending up degenerate if the keys happen to be inserted in sorted order, 15.10's own pitfall) and real per-node heap allocation and pointer-chasing overhead, for no benefit, since the key set never changes after the program starts; a `static const` sorted array has none of that: it is already fully \"built\" at compile time, sitting in flash.\n- Versus a hash table (15.12/15.13): a hash table gives expected O(1) lookup, clearly better than binary search's O(log n) for a large key set, but at the cost of an array of bucket-chain pointers to allocate and maintain, a hash function to get right (15.13's whole point), and no ordering guarantee if anything downstream ever wants to iterate the keys sorted; for a small, fixed configuration table (here, 4 entries; realistically dozens, not millions), the asymptotic O(1) versus O(log n) gap is not the deciding factor at all, while the memory/allocation/flash-placement argument clearly is.\n- The sorted-array approach is also directly checkable at compile time or by a simple startup assertion (the array must actually be sorted for binary search's precondition to hold, exactly module 14's bsearch precondition), whereas a hand-built BST's correctness depends on runtime insertion logic executing correctly every time the program starts.\n\nThe general design principle worth stating unprompted: reach for a pointer-based dynamic structure (BST, hash table, linked list) when the data set's membership actually changes at runtime; when it does not, a flat, sorted, statically-declared array is very often both simpler and objectively more efficient in exactly the ways that matter for firmware (flash placement, zero heap use, cache locality).","pitfall":"Defaulting to \"a hash table is always faster\" without checking whether the actual key set size and its compile-time-fixed nature make that speed advantage irrelevant next to the real costs (allocation, hash-function correctness, memory layout) a hash table brings for a small, static table.","verify":"C11 6.9.2 paragraph 2 (a static const array without an explicit runtime-computed initializer is placed by the toolchain in read-only storage; the exact section name (.rodata) is a toolchain/ABI convention, not ISO C terminology)","follow":[{"q":"Would you change this answer if the config table had thousands of entries instead of 4?","a":"The core argument (fixed key set known at compile time) does not change, but at a much larger scale a hash table's O(1) lookup, or a perfect hash computed once offline for this exact known key set, would start to matter more than it does for a handful of entries, where binary search's few comparisons are already effectively free."},{"q":"What standard library function could replace the hand-written binary search loop here?","a":"bsearch (module 14), with a comparator that calls strcmp on the key field, provided the array element size and layout still match bsearch's void*-based contract; writing the loop by hand here was for clarity, not because bsearch would not work."}],"mod":15},{"id":"16.01","level":"Basic","type":"Concept","fig":null,"tags":["gdb","workflow"],"q":"What is the basic gdb workflow for finding a bug (breakpoints, backtrace, print, watch)?","short":"Compile with -g, run under gdb, set breakpoints with `break`, step with `next`/`step`, inspect state with `print`, and on a crash run `backtrace` to see the call chain that led there.","deep":"The core loop for almost any gdb session:\n- `gcc -g -O0 -o prog prog.c` so gdb has line numbers and locals are not optimized away.\n- `gdb ./prog`, then `break function_name` or `break file.c:42` to stop before the suspect code runs.\n- `run` (with args if needed) starts the program; execution stops at the breakpoint.\n- `next` steps over a line (does not enter called functions), `step` steps into them.\n- `print expr` shows a variable or expression's current value; `print *ptr` dereferences.\n- `watch expr` breaks whenever that expression's value changes, useful when you know what is being corrupted but not where.\n- On a crash (no breakpoint needed), just `run` and let it fault, then `backtrace` (or `bt`) prints the stack of calls that led to the fault, innermost frame first.\n- `frame N` moves your current inspection point to stack frame N so `print` and `list` operate in that frame's context.","pitfall":"Debugging an optimized (-O2) build makes gdb's variable and line info unreliable because the compiler reorders and eliminates code; always reproduce with -O0 -g first.","verify":null,"follow":[{"q":"Does gdb need source code to work?","a":"No, it can disassemble and show registers on a stripped binary, but without -g and source it cannot show line numbers or variable names."},{"q":"What is the difference between next and step?","a":"next steps over a function call as one line; step follows the call into the function's own source if debug info is available."}],"mod":16},{"id":"16.02","level":"Basic","type":"Concept","fig":null,"tags":["gdb","compilation"],"q":"Why does gdb need the -g compiler flag, and what does it actually add to the binary?","short":"-g embeds debug info (DWARF on Linux): a mapping from machine instructions back to source lines, plus symbol names, types and stack-frame layout, so gdb can show source, variable names and backtraces instead of raw addresses.","deep":"Without -g, a binary still runs identically, but gdb only has the symbol table (function and global names) to work with, not per-line or per-variable information.\n- `-g` adds a separate debug-info section (DWARF, on Linux/ELF) alongside the actual machine code; it does not change what the CPU executes.\n- This is why -g does not slow the program down: it is metadata the debugger reads, not extra instructions.\n- Optimization (-O1 and above) is still compatible with -g, but variables can be optimized into registers, merged, or eliminated, so gdb may report \"optimized out\" for a value that logically exists conceptually but not as a distinct memory location anymore.\n- Stripping a binary (`strip`) removes this debug info (and often the symbol table too) for a smaller release binary; that is why release crash dumps are often re-analyzed against a separately kept unstripped copy.","pitfall":"Debugging a stripped release binary with no matching debug-info build available leaves you reading raw addresses and registers only.","verify":null,"follow":[{"q":"Can you add -g and still ship an optimized binary?","a":"Yes, -O2 -g is common; just expect gdb's view of locals to be less exact than an -O0 -g build."},{"q":"Does -g affect binary size?","a":"Yes, it adds a debug-info section, sometimes larger than the code itself, which is why release packages often strip it."}],"mod":16},{"id":"16.03","level":"Basic","type":"Concept","fig":null,"tags":["valgrind","asan"],"q":"What is Valgrind used for, and how is it different from AddressSanitizer?","short":"Valgrind is a runtime instrumentation tool (Memcheck being its default tool) that finds memory leaks, invalid reads/writes and use of uninitialized memory by emulating the program in software; it needs no recompilation but runs much slower than AddressSanitizer, which is compiled in and much faster.","deep":"Both catch the same broad class of bugs (out-of-bounds access, use-after-free, leaks) but with very different mechanisms and costs.\n- Valgrind (Memcheck) runs your unmodified binary inside a CPU emulator, tracking every byte's \"defined\" and \"addressable\" state; typical slowdown is 10-50x, but you do not need to recompile or add flags.\n- AddressSanitizer (ASan) is a compiler instrumentation (`-fsanitize=address`): the compiler inserts checks and redzones around allocations at compile time; slowdown is usually only 2x, but you must recompile.\n- Valgrind tends to be better at \"uninitialized value used\" detection; ASan tends to be faster and catches stack and global buffer overflows that plain Memcheck configurations sometimes miss without extra tools.\n- Both are commonly run together in CI: cheap ASan runs on every build, Valgrind on selected slower nightly runs.","pitfall":"Assuming a clean Valgrind run proves a program is memory-safe; it only proves no bug was triggered on the exact inputs and code paths exercised during that run.","verify":null,"follow":[{"q":"Do you need -g for Valgrind to show source lines?","a":"Yes, same as gdb; without debug info Valgrind reports addresses instead of file:line locations."},{"q":"Can Valgrind and ASan be used on the same binary at once?","a":"No, running an ASan-instrumented binary under Valgrind's emulator is unsupported and typically fails or gives meaningless results."}],"mod":16},{"id":"16.04","level":"Intermediate","type":"Debug","fig":null,"tags":["gdb","segfault","backtrace"],"q":"Given a segfault, how do you use gdb to find exactly which call and which pointer caused it?","short":"Run the crashing program under gdb (or open its core file); when it faults, `backtrace` shows the call chain, and `print` on the frame's arguments (for example a null pointer) confirms the bad value that caused the fault.","deep":"Example with a bug three calls deep:\n```c\n#include <stdio.h>\nvoid level3(int *p) { *p = 42; }\nvoid level2(int *p) { level3(p); }\nvoid level1(void) { int *bad = NULL; level2(bad); }\nint main(void) { printf(\"starting\\n\"); level1(); return 0; }\n```\nCompiled with `gcc -std=c11 -Wall -Wextra -g -O0` and run as `gdb -batch -ex run -ex backtrace -ex \"print p\" ./prog`, gdb produced:\n```\nProgram received signal SIGSEGV, Segmentation fault.\n0x0000555555555159 in level3 (p=0x0) at t.c:2\n2       void level3(int *p) { *p = 42; }\n#0  0x0000555555555159 in level3 (p=0x0) at t.c:2\n#1  0x000055555555517e in level2 (p=0x0) at t.c:3\n#2  0x00005555555551a1 in level1 () at t.c:4\n#3  0x00005555555551c0 in main () at t.c:5\n$1 = (int *) 0x0\n```\nFrame #0 is where the fault happened (`*p = 42` in level3); `print p` confirms `p` is 0x0 (NULL). Frame #2 shows the actual root cause: level1 passed a NULL `bad` into level2. The fix is at the source of the bad value, not necessarily at the frame where the crash was reported.","pitfall":"Reading only the innermost frame and patching there treats a symptom; always walk the backtrace to where the bad value was actually created.","verify":null,"follow":[{"q":"Why look past frame 0 instead of just fixing level3?","a":"Frame 0 only shows where the invalid access happened; the root cause (level1 constructing a NULL) is further up the stack, and fixing only level3 (e.g. adding a NULL check) would hide the real defect."},{"q":"How do you get a backtrace from a core file instead of a live run?","a":"`gdb ./prog core` (or `gdb -c core ./prog`), then `bt`, works the same way against a saved crash dump."}],"mod":16},{"id":"16.05","level":"Intermediate","type":"Debug","fig":null,"tags":["valgrind","heap-overflow"],"q":"How do you read a Valgrind \"Invalid write\" report to find an off-by-one heap overflow?","short":"Valgrind names the exact instruction and line that wrote out of bounds, and states how many bytes past which allocation's end the write landed, e.g. \"0 bytes after a block of size 20\"; that number tells you precisely how far past the buffer the loop went.","deep":"```c\n#include <stdlib.h>\nint main(void) {\n    int *arr = malloc(5 * sizeof(int));\n    for (int i = 0; i <= 5; i++)   /* off-by-one: writes arr[5], out of bounds */\n        arr[i] = i;\n    free(arr);\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra -g -O0` (no warning from gcc itself) and run under `valgrind -q`, the output was:\n```\n==1314== Invalid write of size 4\n==1314==    at 0x1091A3: main (t.c:5)\n==1314==  Address 0x4a7d054 is 0 bytes after a block of size 20 alloc'd\n==1314==    at 0x4846828: malloc (in vgpreload_memcheck-amd64-linux.so)\n==1314==    by 0x10917E: main (t.c:3)\n```\nReading it: the write is \"size 4\" (one int), at main line 5 (the loop body), and lands \"0 bytes after a block of size 20\" allocated at line 3. 20 bytes / 4 bytes per int = 5 ints, so the block holds valid indices 0..4; the write at offset 20 is exactly `arr[5]`, confirming the loop's `i <= 5` should be `i < 5`.","pitfall":"Assuming the reported line number is always the bug; here it correctly is, but with inlining or macro-heavy code the reported line can be the outer call site, not the true faulting expression.","verify":null,"follow":[{"q":"Why did gcc -Wall -Wextra not flag this at compile time?","a":"Static warnings cannot generally prove a runtime loop bound against a runtime-sized allocation; this needs dynamic checking (Valgrind or ASan), not compile-time analysis."},{"q":"What does \"Address ... is N bytes after a block of size S\" tell you in general?","a":"It converts the raw faulting address into a distance from a known allocation's boundary, which combined with the element size lets you compute the exact bad index."}],"mod":16},{"id":"16.06","level":"Intermediate","type":"Debug","fig":null,"tags":["valgrind","leak"],"q":"How do you read a Valgrind leak-check report to find where a leaked allocation came from?","short":"`--leak-check=full` prints each leaked block's size and the exact allocation call stack (down to the malloc site), so \"definitely lost\" plus that stack tells you precisely which allocation was never freed.","deep":"```c\n#include <stdlib.h>\nvoid make_leak(void) {\n    int *p = malloc(100 * sizeof(int));\n    p[0] = 1; /* p goes out of scope here without free: leaked */\n}\nint main(void) { make_leak(); return 0; }\n```\nCompiled with `gcc -std=c11 -Wall -Wextra -g -O0` and run as `valgrind -q --leak-check=full ./prog`:\n```\n==1325== 400 bytes in 1 blocks are definitely lost in loss record 1 of 1\n==1325==    at 0x4846828: malloc (in vgpreload_memcheck-amd64-linux.so)\n==1325==    by 0x10915E: make_leak (t.c:3)\n==1325==    by 0x10917C: main (t.c:7)\n```\n\"definitely lost\" means Valgrind found no remaining pointer to that block anywhere in reachable memory at exit; the stack under it is the allocation site (`make_leak`, line 3, called from `main`, line 7), which is exactly where the missing `free(p)` belongs.","pitfall":"Ignoring \"still reachable\" leaks in a long-running (not short-lived) process; they can still be a real, growing leak if the reachable pointer is never actually used to free the memory.","verify":null,"follow":[{"q":"What does \"still reachable\" mean instead of \"definitely lost\"?","a":"A pointer to the block still exists somewhere (e.g. a global), so it was technically never freed but was not truly orphaned; often intentional for allocations meant to live until process exit."},{"q":"Does Valgrind show where memory should have been freed?","a":"No, only where it was allocated; you infer the missing free's location from the code path and the object's intended lifetime."}],"mod":16},{"id":"16.07","level":"Intermediate","type":"Concept","fig":null,"tags":["asan","heap-overflow"],"q":"What does an AddressSanitizer heap-buffer-overflow report tell you, and how do you compile for it?","short":"Add -fsanitize=address (with -g) to compilation; ASan wraps every heap allocation in \"redzones\" it can detect touching, and on violation prints the faulting access, its exact source line, and the allocation's own line and size.","deep":"```c\n#include <stdlib.h>\nint main(void) {\n    char *buf = malloc(10);\n    buf[10] = 'x';   /* one past the end */\n    free(buf);\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra -g -fsanitize=address` and run directly (no separate tool invocation needed, the check is built into the binary):\n```\n==1335==ERROR: AddressSanitizer: heap-buffer-overflow on address 0x50200000001a\nWRITE of size 1 at 0x50200000001a thread T0\n    #0 0x... in main /tmp/t.c:4\n0x50200000001a is located 0 bytes after 10-byte region [0x502000000010,0x50200000001a)\nallocated by thread T0 here:\n    #0 0x... in malloc\n    #1 0x... in main /tmp/t.c:3\nSUMMARY: AddressSanitizer: heap-buffer-overflow /tmp/t.c:4 in main\n```\nThis is more precise than Valgrind's \"N bytes after a block\" phrasing but gives the same essential facts: WRITE (not READ), size 1 byte, at line 4, into a 10-byte region allocated at line 3, one byte past its end (`buf[10]` on a 10-byte buffer, valid indices 0..9).","pitfall":"Forgetting -g means ASan still catches the bug but reports only a binary address instead of a source file and line.","verify":null,"follow":[{"q":"Why is ASan faster than Valgrind for the same class of bug?","a":"ASan's checks are compiled directly into the binary (redzone bounds checks around real allocations) instead of emulating every instruction in software."},{"q":"Does ASan catch stack and global buffer overflows too, not just heap?","a":"Yes, with the same -fsanitize=address flag it instruments stack and global arrays as well, each reported with its own overflow message naming the object."}],"mod":16},{"id":"16.08","level":"Intermediate","type":"Concept","fig":null,"tags":["ubsan","signed-overflow"],"q":"What does UndefinedBehaviorSanitizer catch that AddressSanitizer and -Wall do not?","short":"UBSan (-fsanitize=undefined) instruments arithmetic and type operations to catch undefined behavior with no memory-safety symptom, like signed integer overflow, division by zero, or invalid shifts, none of which corrupt memory and so are invisible to ASan or Valgrind.","deep":"```c\n#include <stdio.h>\nint main(void) {\n    int a = 2147483647;   /* INT_MAX */\n    int b = a + 1;         /* signed overflow: UB */\n    printf(\"%d\\n\", b);\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra -fsanitize=undefined -g` (no warning from -Wall/-Wextra) and run:\n```\nt.c:4:9: runtime error: signed integer overflow: 2147483647 + 1 cannot be represented in type 'int'\n-2147483648\n```\nThe program still ran to completion and printed a value (wrapping to INT_MIN on this toolchain), because UBSan by default reports and continues rather than aborting; but per the C standard, signed overflow is undefined behavior (6.5p5's general clause plus the integer-overflow footnote), so a different compiler, optimization level, or platform is free to produce a different result, trap, or optimize the surrounding code unexpectedly.","pitfall":"Treating a \"clean\" run under -Wall -Wextra as proof there is no undefined behavior; UB with no immediate memory-safety symptom needs UBSan specifically.","verify":null,"follow":[{"q":"Why does -Wall -Wextra not catch this at compile time?","a":"The overflow depends on the runtime value of `a`, which the compiler cannot always prove at compile time; -Wall is a static check, UBSan is a runtime instrumentation."},{"q":"Can UBSan be told to abort instead of just printing and continuing?","a":"Yes, `-fsanitize=undefined -fno-sanitize-recover=all` (or `-fsanitize-trap=undefined`) turns each detected violation into an abort/trap."}],"mod":16},{"id":"16.09","level":"Intermediate","type":"Numeric","fig":null,"tags":["valgrind","offset-math"],"q":"A Valgrind report says \"Address ... is 0 bytes after a block of size 20 alloc'd\" for a write of size 4; which array index actually overflowed?","short":"20 bytes / 4 bytes per element = 5 elements, valid indices 0..4; a write landing 0 bytes after that block is at byte offset 20, which is index 20 / 4 = 5, i.e. exactly one past the last valid index.","deep":"This is the arithmetic behind reading module 16's Valgrind example (16.05) without re-running the tool:\n1. Block size in bytes: 20.\n2. Element size from the write report: \"size 4\" (an int on this platform).\n3. Number of valid elements: 20 / 4 = 5, so valid indices are 0, 1, 2, 3, 4.\n4. The faulting write is reported as \"0 bytes after\" the block, i.e. at byte offset 20 (the first byte past the end).\n5. Index of that offset: 20 / 4 = index 5.\n6. Index 5 is exactly one past the last valid index (4), confirming a classic off-by-one (`i <= 5` instead of `i < 5` when the array has 5 elements).\nThis same offset-to-index conversion works for any element size: divide the \"bytes after\" (or \"bytes before\", for underflows) figure and the block size by the element size to get exact indices without needing to reproduce the run.","pitfall":"Dividing the wrong quantity (the write size instead of the block size) by the element size; always convert the block/offset numbers, treating the write size only as the element size hint.","verify":null,"follow":[{"q":"What if the write size and the array's element size differ?","a":"Then the access is not a clean array-index overflow at all; recompute using the block's element type, not the write's reported size, and suspect a type-punning or pointer-arithmetic bug instead."},{"q":"Does the same offset math work for stack-buffer-overflow reports from ASan?","a":"Yes, ASan's \"region [start, end)\" plus the faulting address gives the same offset, which divided by element size gives the index."}],"mod":16},{"id":"16.10","level":"Advanced","type":"Debug","fig":null,"tags":["asan","use-after-free"],"q":"How does AddressSanitizer report a use-after-free, and why does gcc's own -Wall sometimes also catch the simplest cases?","short":"ASan poisons freed memory's shadow bytes so any later access aborts with \"heap-use-after-free\", naming both the access site and the original free's location; modern gcc's -Wuse-after-free (part of -Wall in recent versions) can also catch the most obvious same-function cases purely by static analysis.","deep":"```c\n#include <stdlib.h>\nint main(void) {\n    int *p = malloc(sizeof(int));\n    *p = 5;\n    free(p);\n    *p = 10;   /* use after free */\n    return 0;\n}\n```\nCompiling with plain `gcc -std=c11 -Wall -Wextra -g` already produced a static warning here:\n```\nt.c: In function 'main':\nt.c:6:8: warning: pointer 'p' used after 'free' [-Wuse-after-free]\n    6 |     *p = 10;\n      |     ~~~^~~~\nt.c:5:5: note: call to 'free' here\n```\nCompiling instead with `-fsanitize=address` and running gave the dynamic confirmation:\n```\n==1356==ERROR: AddressSanitizer: heap-use-after-free on address 0x502000000010\nWRITE of size 4 at 0x502000000010 thread T0\n    #0 0x... in main /tmp/t.c:6\n0x502000000010 is located 0 bytes inside of 4-byte region [...]\nfreed by thread T0 here:\n    #0 0x... in free\n    #1 0x... in main /tmp/t.c:5\n```\nThe static warning only fires when the compiler can trivially see both the `free` and the later dereference in the same function with no intervening reassignment; once the pointer crosses a function boundary, is stored in a struct, or the free happens conditionally, only the dynamic ASan check reliably catches it.","pitfall":"Relying on `-Wall` alone for use-after-free safety in any code where the free and the reuse are not both visible in one small function.","verify":null,"follow":[{"q":"Does -Wuse-after-free replace the need for ASan?","a":"No, it only catches simple, locally visible cases; ASan catches the general case at runtime regardless of how the pointer traveled."},{"q":"Why does ASan say \"0 bytes inside of 4-byte region\" rather than \"after\"?","a":"Because the access is within the original allocation's bounds, just after it was freed; this is a use-after-free, not a bounds overflow."}],"mod":16},{"id":"16.11","level":"Advanced","type":"Cross-layer","fig":null,"tags":["asan","ubsan","gdb"],"q":"Can AddressSanitizer, UndefinedBehaviorSanitizer and gdb watchpoints be combined, and when would you want all three?","short":"Yes: -fsanitize=address,undefined links into one binary, and running that binary under gdb still works normally, with ASan/UBSan aborting on the exact faulting access while gdb's watch or the sanitizer's own abort gives you a backtrace at the moment of the real bug rather than wherever memory corruption later happens to crash.","deep":"A practical order of escalation for a hard-to-reproduce corruption bug:\n- First combine both sanitizers in one build: `gcc -std=c11 -Wall -Wextra -g -fsanitize=address,undefined -o prog prog.c`. Both instrument independently and their reports do not conflict.\n- Run the binary normally; on either kind of violation the process aborts immediately at the real faulting instruction, with a stack trace, instead of continuing and crashing later somewhere unrelated (the classic \"corruption crashes far from its cause\" problem).\n- If you need to inspect live state instead of just reading the abort message, run the same binary under gdb (`gdb ./prog`, then `run`): the sanitizer's internal abort behaves like any other signal gdb can catch, and `backtrace` at that point shows the exact call chain.\n- A `watch` on a specific variable is still useful alongside sanitizers when you know which value is being corrupted but the sanitizers themselves are not triggering (for example, a logic bug that writes a wrong-but-in-bounds value); the sanitizers cannot catch a bug that never touches invalid memory or invokes undefined behavior.\n- Threaded code (data races, memory ordering across threads) needs ThreadSanitizer (-fsanitize=thread) instead, and is out of scope here; see the C Advanced page's concurrency modules for that.","pitfall":"Expecting sanitizers to catch a purely logical bug (wrong but in-bounds, well-defined computation); they only catch memory-safety and undefined-behavior classes, not incorrect-but-legal results.","verify":null,"follow":[{"q":"Can ASan and UBSan be combined with -O2 for a closer-to-release repro?","a":"Yes, both work at any optimization level, though line-accurate reporting is best at -O0 -g."},{"q":"Is there a performance reason to run them separately in CI?","a":"Sometimes; combined they are still only roughly as slow as ASan alone, so most projects run them together unless a specific job needs to isolate one signal."}],"mod":16},{"id":"16.12","level":"Advanced","type":"Concept","fig":null,"tags":["clang-tidy","static-analysis"],"q":"What can a static analyzer like clang-tidy catch that neither compiler warnings nor a single test run will, and what are its limits?","short":"clang-tidy's clang-analyzer checks perform path-sensitive analysis across a function's possible execution paths (not just the one your tests happened to exercise), so it can flag a leak or null-dereference that only occurs on a code path you never actually ran, at the cost of false positives and no guarantee of completeness.","deep":"```c\n#include <stdio.h>\n#include <stdlib.h>\nvoid bad(void) {\n    int *p = malloc(sizeof(int));\n    *p = 5;\n    printf(\"%d\\n\", *p);\n    /* missing free(p): leak */\n}\nint main(void) { bad(); return 0; }\n```\nThis compiles clean with `gcc -std=c11 -Wall -Wextra -g` (no warning; gcc's static analysis does not track allocation lifetime this deeply by default) and runs fine, so a single execution proves nothing about the leak. Running `clang-tidy t.c -checks='-*,clang-analyzer-*' -- -std=c11` reported:\n```\nt.c:6:5: warning: Potential leak of memory pointed to by 'p' [clang-analyzer-unix.Malloc]\n    Calling 'bad'\n    Memory is allocated\n    Potential leak of memory pointed to by 'p'\n```\nThe analyzer symbolically walks the function's logic (allocate, then every path from there) rather than executing it, which is why it finds the missing `free` without any test input triggering it.\n- Static analyzers trade recall for false positives: expect to suppress or tune some warnings that are not real bugs in your context.\n- They complement, not replace, ASan/UBSan/Valgrind: static tools find issues without running the program at all; dynamic tools confirm what actually happens on the paths you do execute.","pitfall":"Treating a clean static-analysis run as proof of correctness; both false negatives (missed real bugs) and false positives (flagged non-bugs) are expected and normal.","verify":null,"follow":[{"q":"Is clang-tidy specific to code compiled with clang?","a":"No, it can analyze C/C++ source compiled with any compiler's flags passed after `--`; it does its own parsing, it does not need to link or run the resulting binary."},{"q":"What is cppcheck's role relative to clang-tidy?","a":"A similar class of static analyzer with a different (often faster, sometimes less deep) rule set; many teams run both since they catch different subsets of issues."}],"mod":16},{"id":"16.13","level":"Advanced","type":"Scenario","fig":null,"tags":["double-free","methodology"],"q":"You have a crash reported as \"double free or corruption\" from glibc. What is a systematic method to find the second, incorrect free call?","short":"Reproduce under AddressSanitizer, which reports both the second (invalid) free's location and the first free's location in one message; without ASan, add temporary logging or gdb breakpoints on every free of the suspect pointer to find the pair, since glibc's own message only names where the check fired, not the earlier valid free.","deep":"A concrete method, cheapest step first:\n1. Recompile with `-fsanitize=address -g` if at all possible; ASan's \"attempting double-free\" report gives two full stack traces directly: where the invalid second free happened, and where the original (valid) free that made the pointer already-freed happened. This alone usually finds the bug in minutes.\n2. If ASan cannot be used (e.g. only reproduces in a environment you cannot recompile for), run under Valgrind's Memcheck, which reports the same two-stack information for double frees.\n3. If neither tool is available at all, fall back to gdb: `break free` (or a conditional breakpoint `break free if $rdi == <suspect address>` once you know the address), then continue and note every stack at which that specific pointer value is freed; the second hit is the bug.\n4. Once you have both call sites, look for the actual root cause pattern: a pointer stored in two owners (e.g. copied into a cache and also owned by its original container), an early-return path that frees then falls through to a shared cleanup `goto` that frees again, or a realloc-failure path that frees a pointer the caller also frees.\n5. The fix is almost always ownership clarification, not a patch at the crash site: decide which one piece of code owns the free, and set the other's copy to NULL after use (or reference-count, or restructure so only one path reaches the free).","pitfall":"\"Fixing\" a double-free by wrapping the second free call in a NULL check without understanding why two code paths both reached a free on the same pointer; the underlying ownership bug usually resurfaces elsewhere.","verify":null,"follow":[{"q":"Why is ASan's message more useful than glibc's default abort message here?","a":"glibc's message only fires the moment the corruption is detected (the second free), with no memory of the first, valid free; ASan instruments allocation state itself and remembers both events."},{"q":"Is setting a pointer to NULL after freeing it a real fix or just a safety net?","a":"Freeing NULL is a defined no-op in C, so it prevents that specific double-free from crashing again, but it does not fix an ownership design that allows two code paths to both believe they own the pointer."}],"mod":16},{"id":"16.14","level":"Advanced","type":"Trap","fig":null,"tags":["wall","sanitizers"],"q":"A program compiles cleanly with -Wall -Wextra and passes its tests. Is it safe to assume it has no serious memory bugs?","short":"No; -Wall/-Wextra are static, best-effort warnings that miss most out-of-bounds heap accesses (they cannot generally reason about runtime-sized allocations or loop bounds), and passing tests only proves correctness on the exact inputs exercised, not on all inputs.","deep":"```c\n#include <stdlib.h>\nint main(void) {\n    char *buf = malloc(10);\n    buf[10] = 'x';   /* one past the end */\n    free(buf);\n    return 0;\n}\n```\nCompiling this exact file with `gcc -std=c11 -Wall -Wextra -g -O0` produces zero warnings and it links and \"runs\" (the process usually exits 0, since one stray byte write often does not corrupt anything the program later reads back) -- yet it is a real, undefined-behavior heap overflow, confirmed only when the same source is recompiled with `-fsanitize=address` and run, which reports a heap-buffer-overflow at that exact line (see 16.07).\n- -Wall/-Wextra reason about the source text and types; they do not track allocation sizes through arbitrary control flow, so a runtime-computed index against a runtime-sized `malloc` is invisible to them in general.\n- Passing tests establish nothing about inputs, sizes, or timings the tests did not exercise; a buffer overflow that writes past the end into unused heap padding can be silently harmless today and corrupt something critical tomorrow after an allocator or struct layout change.\n- The only way to get real assurance is to actually run the code (ideally with realistic and edge-case inputs) under ASan/UBSan and/or Valgrind as part of the normal test cycle, not as an occasional manual check.","pitfall":"Treating \"compiles with no warnings\" as a safety signal for memory correctness; it is a signal about code style and some classes of definite errors, not about runtime memory safety.","verify":null,"follow":[{"q":"Would -Wanalyzer (gcc's static analyzer) have caught this?","a":"Not reliably for a runtime-determined index like this one; static analyzers are stronger on some bug shapes (nullability, leaks on clear paths) than on data-dependent bounds violations."},{"q":"Is it enough to run ASan once locally before merging?","a":"Better than nothing, but the strongest practice is running the full test suite under ASan/UBSan in CI on every change, since a bug only manifests on the inputs actually exercised."}],"mod":16},{"id":"16.15","level":"Principal","type":"Concept","fig":null,"tags":["methodology","core-dump"],"q":"A field device sends back a core dump from a crash you cannot reproduce locally. What is your method for turning that core file into a root cause?","short":"Confirm the core matches a known build (same binary/symbols, same libc), load it in gdb with that exact binary (`gdb ./prog core`), get the backtrace and the values of every pointer/index involved in the faulting frame, then work backward through the call chain to where the bad value was actually produced, treating the fault frame as a symptom location, not the bug's location.","deep":"A concrete method for this Principal-level scenario:\n1. Establish provenance first: which exact build produced this core (git commit / build ID), and does the binary you have locally (with debug symbols) match it exactly? A mismatched binary makes every subsequent step meaningless (wrong line numbers, wrong optimized-away variables, or gdb refusing to load frames sensibly).\n2. Load it: `gdb ./matching_binary core.1234`, then `bt full` for a backtrace with every frame's locals, not just arguments.\n3. Identify the faulting frame's bad value (a NULL pointer, an out-of-range index, a corrupted length field) and its type/expected invariant.\n4. Walk outward: for each caller frame, ask \"was this value already bad when it was passed in, or did this frame corrupt a previously-good value?\" Repeat until you find the frame where a good value first became bad; that is the actual defect location, often several frames away from the crash.\n5. If the corruption looks like it crosses an unrelated boundary (e.g. the bad value lives in a different struct than the one being manipulated at the fault site), suspect a buffer overflow or dangling pointer earlier in execution, not a logic error at the fault site; a core dump alone cannot show you the history of writes, only the final state, so this may require adding targeted logging/assertions and reproducing again with those in place, or shipping an ASan-instrumented build to the field temporarily if crash frequency allows it.\n6. Once a hypothesis exists, write a minimal reproduction locally (even a synthetic one that fakes the suspected bad input) and confirm it reproduces the same crash signature before calling it root-caused.\nA method statement an interviewer wants to hear: never declare root cause from the fault frame alone; always trace the value's origin, and be explicit about what the core dump can and cannot tell you (final state, not history).","pitfall":"Fixing the symptom at the fault frame (e.g. adding a NULL check right where the crash happened) without finding where the bad value actually originated, which leaves the real defect free to resurface with a different symptom later.","verify":null,"follow":[{"q":"What if the field binary was stripped and no debug-symbol build survives for that exact version?","a":"This is why keeping a build-artifact archive (binary plus matching debug info, indexed by build ID) is part of a serious release process; without it, only the raw addresses and the stripped symbol table remain, severely limiting analysis."},{"q":"Is a core dump enough to prove root cause on its own?","a":"Rarely by itself; it proves the state at the moment of the fault, and a plausible causal chain still needs to be confirmed by reproduction or by ruling out alternative explanations for that same final state."}],"mod":16},{"id":"16.16","level":"Principal","type":"Scenario","fig":null,"tags":["heap-corruption","release-build"],"q":"Users report intermittent crashes only in the optimized release build (no sanitizers, no debug symbols); ASan is not available there. How do you root-cause suspected heap corruption under that constraint?","short":"Reproduce the same source under ASan/UBSan in a debug-equivalent build first to catch the common cases cheaply; if the bug truly only manifests under release-build optimization and timing, add targeted canaries/guard bytes or a lightweight custom allocator wrapper that records allocation metadata, and narrow with bisection (which recent change, which code path) rather than blind staring at the crash address.","deep":"A layered method for this constraint (no ASan in production, bug does not reproduce off it):\n1. First assume it is an ordinary bug that a debug/sanitized build should also show, and spend real effort trying to reproduce it under `-fsanitize=address,undefined -g -O0` with the same inputs, timing patterns, and data sizes as production, including running for as long as needed; many \"release-only\" bugs are actually \"not-yet-triggered-with-these-inputs\" bugs, not truly optimization-dependent ones.\n2. If it still does not reproduce even with equivalent inputs, suspect either: (a) a data race or memory-ordering issue exposed only by release-build timing (point to the C Advanced page's concurrency modules for that analysis), or (b) undefined behavior whose observable effect depends on the specific optimizations the release flags enable (e.g. a strict-aliasing violation that -O0 happens to not miscompile but -O2 does).\n3. For (b), bisect the compiler flags: build the same source at increasing optimization levels (-O0, -O1, -O2) and see exactly where the symptom appears; that narrows the search to the specific optimization pass's assumptions the code is violating, which is often traceable to one of the classic UB categories (aliasing, signed overflow, uninitialized reads).\n4. If flags alone do not narrow it, instrument minimally and cheaply for production: wrap malloc/free with a thin layer that stores a magic-number guard byte and the allocation's size/call-site right before/after the block (a hand-built, lightweight ASan-like check), and check the guard on every free; this catches the same overflow/corruption class with far less overhead than full ASan, at the cost of writing and validating that wrapper yourself.\n5. State the trade-off explicitly to stakeholders: full ASan in production is the most reliable tool but usually too slow/heavy to ship; guard-byte instrumentation is a deliberate, lighter approximation with known blind spots (it only catches corruption that touches the guard bytes, not all corruption); and compiler-flag bisection narrows the search space without needing new instrumentation at all.","pitfall":"Concluding the compiler itself has a bug from an optimization-level-dependent crash; the overwhelming majority of such cases are undefined behavior in the source that a higher optimization level is newly free to miscompile, not an actual compiler defect.","verify":null,"follow":[{"q":"Why not just ship a debug build to production to get ASan there too?","a":"Debug/ASan builds are typically 2-10x slower and use more memory (redzones), which can itself change timing enough to hide a timing-dependent bug, and may be unacceptable for production load; a canary/percentage rollout of an ASan build is a common middle ground instead of blanket deployment."},{"q":"Is compiler-flag bisection a reliable way to find every optimization-dependent bug?","a":"It reliably narrows which optimization level exposes the symptom, but the underlying defect is still undefined behavior in the source; the fix is correcting that UB, not permanently pinning a lower optimization level."}],"mod":16},{"id":"16.17","level":"Principal","type":"Concept","fig":null,"tags":["ci-policy","methodology"],"q":"What debugging and static-analysis tooling policy would you mandate for a firmware team's CI pipeline, and what does each layer catch that the others do not?","short":"Run -Wall -Wextra -Werror on every compile, run the full test suite under -fsanitize=address,undefined on every change, run a static analyzer (clang-tidy/cppcheck) on every change to catch bugs on paths tests do not exercise, and reserve full Valgrind runs for a slower nightly job; state which bug classes each layer misses so gaps are a known trade-off, not a surprise.","deep":"A single small function can show why no one layer is sufficient alone:\n```c\n#include <stdio.h>\n#include <stdlib.h>\nvoid risky(int n) {\n    int *arr = malloc((size_t)n * sizeof(int));\n    for (int i = 0; i <= n; i++) arr[i] = i;  /* off-by-one overflow */\n    /* no free(arr): leak too */\n}\nint main(void) { risky(4); printf(\"done\\n\"); return 0; }\n```\n- Compiled with `gcc -std=c11 -Wall -Wextra -g` alone: zero warnings, and running it printed `done` with no visible symptom -- this layer alone would ship the bug.\n- Compiled with `-fsanitize=address` added and run: immediately aborted with `AddressSanitizer: heap-buffer-overflow ... WRITE of size 4 ... in risky t.c:8`, catching the overflow the instant this exact code path ran, but only because `main` happened to call `risky` at all in this build; a real codebase's test suite must actually exercise a function for ASan to see it.\n- Run through `clang-tidy -checks='-*,clang-analyzer-*'` (module 16.12's tool): flags the leak via path-sensitive analysis without needing `risky` to be called by anything, catching the leak class ASan's dynamic instrumentation would only report as \"still reachable/leaked\" if the process happened to exit while still allocated and leak-checking was enabled.\nA concrete policy statement for a review: (1) `-Wall -Wextra -Werror` blocking on every commit, zero cost beyond compile time, catches the definite-error subset; (2) the full test suite additionally run under `-fsanitize=address,undefined` on every commit or PR, roughly 2x slower, catches memory-safety/UB on any exercised path; (3) a static analyzer pass on every commit, catches some unexercised-path bugs at the cost of tuning false positives; (4) a nightly (not per-commit, due to its 10-50x slowdown) full Valgrind run across a broader input/fuzz corpus than the fast per-commit test suite typically covers, as a deeper backstop.","pitfall":"Treating any single layer (most commonly, \"it compiles clean with -Wall\") as sufficient sign-off for a change, when each layer in this policy is deliberately catching a different, non-overlapping class of bug.","verify":null,"follow":[{"q":"Why not just run Valgrind on every commit instead of ASan, since Valgrind needs no recompilation?","a":"Its 10-50x slowdown makes per-commit CI feedback too slow for routine development; ASan's roughly 2x cost is the better fit for the fast, every-commit feedback loop, with Valgrind reserved for a slower, less frequent deeper pass."},{"q":"Does this policy guarantee no memory bugs reach production?","a":"No; it only guarantees no bug within a class these specific tools detect, on a code path these specific tests exercise, reaches production undetected -- a completely untested path or a bug class outside all four layers (e.g. a purely logical error with no memory-safety or UB signature) can still ship."}],"mod":16},{"id":"17.01","level":"Basic","type":"Concept","fig":null,"tags":["mmio","volatile"],"q":"Why must a memory-mapped hardware register be accessed through a volatile-qualified pointer in C?","short":"Without volatile, the compiler is free to cache a register's value in a CPU register, reorder accesses, or eliminate ones it thinks are redundant, since as far as the abstract machine can tell nothing else changes that memory; volatile forces every read and write in the source to actually happen, in order, because the standard says the object may change \"in ways unknown to the implementation.\"","deep":"```c\n#include <stdio.h>\n#include <stdint.h>\nstatic uint32_t fake_register = 0;   /* simulates a hardware status register */\nint main(void) {\n    volatile uint32_t *status_reg = &fake_register;\n    fake_register = 0x1;                  /* pretend hardware set \"ready\" */\n    while ((*status_reg & 0x1u) == 0) {   /* volatile forces a real reload every iteration */\n        /* busy-wait */\n    }\n    printf(\"device ready, status=0x%x\\n\", *status_reg);\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra -O2` and run, it printed `device ready, status=0x1`. Without volatile on `status_reg`, an optimizing compiler is entitled to read the register once, see it is never written to from the compiler's point of view inside the loop, and turn the whole `while` into either an infinite loop (if it decided the condition is always true) or nothing at all -- both wrong, and both technically legal per the standard for a non-volatile object the compiler believes is unchanging (C11 6.7.3p7).","pitfall":"Qualifying the wrong level of a multi-level declaration, e.g. writing `uint32_t *volatile p` when you meant the pointed-to register to be volatile, which silently compiles but protects the wrong thing.","verify":null,"follow":[{"q":"Does volatile guarantee the access is atomic?","a":"No; volatile only forces the access to actually happen as written, in program order relative to other volatile accesses -- it says nothing about atomicity or memory ordering visible to another core or thread."},{"q":"Is `volatile uint32_t *p` the same as `uint32_t volatile *p`?","a":"Yes, both qualify the pointed-to type as volatile (the qualifier binds to what precedes it, or to the base type if it is first); `uint32_t *volatile p` instead would make the pointer itself volatile, not what it points to."}],"mod":17},{"id":"17.02","level":"Basic","type":"Concept","fig":null,"tags":["isr","constraints"],"q":"What must an interrupt service routine (ISR) never do, and why?","short":"An ISR must never block (no mutex waits, no I/O that can stall), must not call malloc/free or most of the standard library (non-reentrant internal state, unbounded time), and must keep its critical section as short as possible, because it runs with interrupts often disabled or nested and any delay or reentrancy bug there stalls or corrupts the whole system.","deep":"Concrete reasons behind each rule:\n- No blocking calls: an ISR runs \"on top of\" whatever the CPU was doing; blocking there does not just delay one task, it can delay every other interrupt and the whole scheduler, since many architectures keep interrupts of equal or lower priority masked while the handler runs.\n- No malloc/free (or most libc calls) inside the handler: the general-purpose allocator is not guaranteed reentrant -- if the code the ISR interrupted was itself inside malloc's internal bookkeeping (e.g. updating a free list), calling malloc again from the ISR can corrupt that shared state (see 17.14/17.15 for the concrete signal-handler analogue in the C standard).\n- Keep it short and defer work: the standard firmware pattern is \"do the minimum in the ISR (read a register, set a flag or push into a lock-free ring buffer, per module 18's fig=ringbuffer design), then let a later main-loop or scheduled task do the real processing\" -- this bounds interrupt latency and keeps the reentrancy surface tiny.\n- Only touch data shared with non-interrupt code through `volatile sig_atomic_t`-style flags or a properly synchronized structure (a single-producer/single-consumer ring buffer is the classic safe pattern), never through an unprotected multi-field struct that could be read half-updated.","pitfall":"Treating \"it worked in testing\" as proof an ISR is safe; reentrancy and timing bugs in interrupt code are often invisible until a rare overlapping-interrupt timing window occurs in the field.","verify":null,"follow":[{"q":"Can an ISR call printf for quick debugging?","a":"In production code, no -- printf is not guaranteed reentrant and its I/O can block; it is sometimes tolerated temporarily during bring-up debugging on hardware with no other observability, but should never ship."},{"q":"What is \"interrupt latency\" and why does ISR length matter to it?","a":"The time from the hardware event to the ISR actually starting to handle it; a long-running higher-priority ISR (or one that disables interrupts broadly) delays the start of every other pending interrupt, which is often a hard real-time requirement in firmware."}],"mod":17},{"id":"17.03","level":"Basic","type":"Concept","fig":null,"tags":["reentrancy","signal-safety"],"q":"What does \"reentrant\" or \"signal-handler-safe\" (async-signal-safe) mean for a function?","short":"A function is reentrant/async-signal-safe if it can be safely called again while an earlier call to it (on the same thread, e.g. because a signal or interrupt arrived mid-call) has not yet finished, which requires it to touch no shared mutable state without protection that itself cannot be safely re-entered.","deep":"Why this matters specifically for C on embedded/firmware systems:\n- The C standard itself is explicit about this for signal handlers: per 7.14.1.1p5, if a signal was not raised by `abort`/`raise`, the handler's behavior is undefined if it refers to any static/thread-storage-duration object other than by assigning to a `volatile sig_atomic_t`, or if it calls any standard library function other than `abort`, `_Exit`, `quick_exit`, or `signal` itself.\n- The same reasoning applies to interrupt handlers even outside the standard's own signal-handler wording: `malloc` typically maintains a free list with no lock (on a single-core, single-threaded-looking firmware target, \"no lock\" is normal since there is usually no preemptive contention to guard against outside interrupts) -- if an ISR calls `malloc` while the interrupted code was itself mid-update of that free list, the second call corrupts shared state that the first call is still relying on.\n- Reentrant-safe operations in this context are small and specific: reading/writing a `volatile sig_atomic_t` (or similarly a single aligned word your target can access atomically), and simple self-contained arithmetic with no shared global side effects.\n- A ring buffer with a single producer (the ISR) and single consumer (the main loop) is reentrant-safe by construction if the head/tail update discipline is followed correctly (module 18 covers this data structure in depth), because each side only ever writes its own index.","pitfall":"Assuming a function is safe to call from an ISR just because it \"looks stateless,\" when it actually calls into the standard library's allocator, buffered I/O, or some other function with hidden shared state internally.","verify":null,"follow":[{"q":"Is a function reentrant just because it has no static locals?","a":"Not necessarily; it must also avoid calling any non-reentrant function and avoid unprotected access to any object shared with the interrupted context, including through pointers passed in."},{"q":"Does \"thread-safe\" mean the same thing as \"reentrant\"?","a":"They overlap but are not identical: thread-safety is about concurrent access from multiple threads (often solved with locks); reentrancy is specifically about a function being safely re-entered on the same thread of control before its first invocation returns, where taking a lock inside a signal/interrupt handler is itself often unsafe or deadlock-prone."}],"mod":17},{"id":"17.04","level":"Intermediate","type":"Cross-layer","fig":null,"tags":["mmio","bitfields","registers"],"q":"Why is a C bit-field struct a bad way to describe a hardware register's bit layout, even though it looks natural?","short":"The C standard leaves bit-field allocation order, whether they cross storage-unit boundaries, and their exact storage layout implementation-defined (and unspecified in places), so the same bit-field struct can map to different actual bit positions on different compilers or targets; explicit masks and shifts on a plain volatile integer are the portable way to describe a fixed hardware bit layout.","deep":"Example of the fragile version versus the portable version for a register where bits [0] = enable, bits [1:3] = mode, bit [4] = error:\n```c\n#include <stdio.h>\n#include <stdint.h>\n\n/* Fragile: relies on this compiler's particular bit-field allocation order\n   and packing, which the standard does not fix (6.7.2.1's bit-field rules\n   leave allocation order and unit-crossing implementation-defined). */\nstruct ctrl_bitfield { unsigned enable:1, mode:3, error:1; };\n\n/* Portable: explicit masks/shifts on a plain volatile word, same meaning\n   on every compiler and target. */\n#define CTRL_ENABLE_MASK 0x1u\n#define CTRL_MODE_MASK   0xEu   /* bits 1..3 */\n#define CTRL_MODE_SHIFT  1\n#define CTRL_ERROR_MASK  0x10u\n\nint main(void) {\n    printf(\"sizeof(struct ctrl_bitfield)=%zu\\n\", sizeof(struct ctrl_bitfield));\n    volatile uint32_t ctrl = 0;\n    ctrl |= CTRL_ENABLE_MASK;                      /* set enable */\n    ctrl = (ctrl & ~CTRL_MODE_MASK) | (2u << CTRL_MODE_SHIFT); /* set mode=2 */\n    printf(\"ctrl=0x%x mode=%u\\n\", ctrl, (ctrl & CTRL_MODE_MASK) >> CTRL_MODE_SHIFT);\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra -O2` and run, it printed `ctrl=0x5 mode=2`; the exact numeric masks were chosen to match the real register's documented bit positions and will mean the same thing on any C compiler for this target, unlike the bit-field struct's layout.","pitfall":"Porting bit-field-based register code to a new compiler or target without re-verifying the actual bit layout, because \"it compiled\" gives no guarantee the allocation order matched the datasheet on the new toolchain.","verify":null,"follow":[{"q":"Are bit-fields ever acceptable in firmware code?","a":"Yes, for purely internal, single-compiler, single-build software state where exact memory layout does not need to match an external (hardware or wire) specification; not for anything a datasheet or protocol document fixes the bit positions of."},{"q":"Does using masks and shifts lose readability compared to bit-fields?","a":"Slightly, which is why real firmware code typically wraps them in named macros or small inline helper functions per field, keeping the readability while keeping the layout portable and explicit."}],"mod":17},{"id":"17.05","level":"Intermediate","type":"Scenario","fig":null,"tags":["signal","sig_atomic_t","isr"],"q":"How do you safely communicate \"an event happened\" from a signal handler (or, by the same pattern, an ISR) to the rest of the program?","short":"Set a single `volatile sig_atomic_t` flag in the handler and do nothing else there; the main code polls that flag and does all the real work outside the handler, which is exactly the one pattern the C standard guarantees is well-defined for a signal handler triggered other than by raise/abort (7.14.1.1p5).","deep":"```c\n#include <signal.h>\n#include <stdio.h>\n\nstatic volatile sig_atomic_t stop_flag = 0;\n\nvoid on_sigterm(int signum) {\n    (void)signum;\n    stop_flag = 1;   /* only thing this handler does: set a flag */\n}\n\nint main(void) {\n    signal(SIGTERM, on_sigterm);\n    raise(SIGTERM);              /* simulate receiving the signal right away */\n    if (stop_flag) {\n        printf(\"stop_flag observed set after signal\\n\");\n    }\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra -g` and run, it printed `stop_flag observed set after signal`, confirming the main code correctly saw the flag change after the (simulated) signal.\n- `sig_atomic_t` is guaranteed by the standard to be a type whose objects can be accessed as atomic entities even in the presence of asynchronous interrupts (7.14p2), which is exactly the property needed here; it is not a general-purpose atomic integer type for arithmetic under contention, just for this set/read flag pattern.\n- The same exact pattern (a `volatile` flag, set only by the interrupting context, read and cleared only by the interrupted context) is the correct minimal building block for an ISR-to-main-loop signal in firmware, with the ISR-safety caveats from 17.02/17.03 applying identically.","pitfall":"Doing real work (calling library functions, allocating, complex logic) inside the handler itself instead of just setting the flag; see 17.14/17.15 for exactly why that class of mistake is unsafe.","verify":null,"follow":[{"q":"Can the flag carry more than a boolean, e.g. an event-type code?","a":"Yes as long as it stays a single `sig_atomic_t`-width value written in one access; do not build a multi-field struct and expect the handler to update it \"atomically\" without extra synchronization."},{"q":"Why not just use `int stop_flag` instead of `volatile sig_atomic_t`?","a":"Without volatile the compiler can cache stop_flag's value across the loop and never notice the handler changed it; the standard specifically singles out `sig_atomic_t` as the type whose accesses from within a signal handler are well-defined at all, so both qualifier and type matter."}],"mod":17},{"id":"17.06","level":"Intermediate","type":"Scenario","fig":null,"tags":["packed-struct","wire-format"],"q":"How do you safely parse a fixed binary protocol header into a struct without relying on the compiler's natural struct layout?","short":"Decode each field explicitly, byte by byte, from a raw buffer using shifts and masks in the documented wire byte order, rather than casting the buffer to a struct pointer and dereferencing it; only use a `#pragma pack`'d struct as the destination you fill in, never as something you cast the wire bytes directly onto.","deep":"```c\n#include <stdio.h>\n#include <stdint.h>\n\n#pragma pack(push, 1)\ntypedef struct {\n    uint8_t  opcode;\n    uint16_t length;   /* big-endian on the wire */\n    uint32_t crc;      /* big-endian on the wire */\n} pkt_hdr_t;\n#pragma pack(pop)\n\nstatic uint16_t be16(const uint8_t *p) { return (uint16_t)((p[0] << 8) | p[1]); }\nstatic uint32_t be32(const uint8_t *p) {\n    return ((uint32_t)p[0] << 24) | ((uint32_t)p[1] << 16) | ((uint32_t)p[2] << 8) | p[3];\n}\n\nint main(void) {\n    uint8_t wire[] = { 0x05, 0x00, 0x10, 0xDE, 0xAD, 0xBE, 0xEF };\n    printf(\"sizeof(pkt_hdr_t) packed = %zu\\n\", sizeof(pkt_hdr_t));\n\n    pkt_hdr_t h;\n    h.opcode = wire[0];\n    h.length = be16(&wire[1]);\n    h.crc    = be32(&wire[3]);\n    printf(\"opcode=0x%02x length=0x%04x crc=0x%08x\\n\", h.opcode, h.length, h.crc);\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra -g` and run, it printed `sizeof(pkt_hdr_t) packed = 7` and `opcode=0x05 length=0x0010 crc=0xdeadbeef`, matching the wire bytes exactly. `#pragma pack(push,1)` removes the compiler's usual padding (module 6 covers padding/alignment rules in depth) so the struct's own in-memory size matches the wire size, but the struct is still filled in field by field here, not by casting the raw buffer to `pkt_hdr_t *`; see 17.07 for exactly what goes wrong with that shortcut.","pitfall":"Forgetting `#pragma pack(pop)` (or the attribute equivalent) after the wire-format struct definitions, which leaves every later struct in the file unexpectedly packed too.","verify":null,"follow":[{"q":"Why not just memcpy the whole wire buffer into the packed struct at once?","a":"memcpy would still leave each multi-byte field in the wire's byte order, which only matches the host's native order by accident; the fields would need per-field byte-swapping after the copy regardless, so decoding field-by-field is no more work and is clearer."},{"q":"Is #pragma pack part of the C standard?","a":"No, it and `__attribute__((packed))` are compiler extensions (widely supported by gcc/clang/MSVC in their own forms); the standard leaves structure padding implementation-defined and provides no portable way to remove it."}],"mod":17},{"id":"17.07","level":"Intermediate","type":"Trap","fig":null,"tags":["endianness","type-punning"],"q":"What goes wrong when you cast a raw network/wire buffer directly to a struct pointer and read a multi-byte field?","short":"The field's bytes get reinterpreted in the host's native byte order instead of the wire's documented order, so on a little-endian host a big-endian 16-bit wire value like 0x0010 is read back as 0x1000; the fix is decoding explicitly with shifts, never trusting the host's struct layout to match the wire's byte order.","deep":"```c\n#include <stdio.h>\n#include <stdint.h>\n\n#pragma pack(push, 1)\ntypedef struct { uint8_t opcode; uint16_t length; } pkt_hdr_t;\n#pragma pack(pop)\n\nint main(void) {\n    uint8_t wire[] = { 0x05, 0x00, 0x10 };   /* opcode=0x05, length=0x0010 (big-endian) */\n\n    pkt_hdr_t *bad = (pkt_hdr_t *)wire;      /* BUGGY: direct cast */\n    printf(\"buggy direct-cast length = 0x%04x (wrong: wire said 0x0010)\\n\", bad->length);\n\n    uint16_t good_length = (uint16_t)((wire[1] << 8) | wire[2]);  /* CORRECT */\n    printf(\"correct decoded length   = 0x%04x\\n\", good_length);\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra -g` and run on this (little-endian x86-64) host, it printed:\n```\nbuggy direct-cast length = 0x1000 (wrong: wire said 0x0010)\ncorrect decoded length   = 0x0010\n```\nThe struct-cast read the two length bytes (0x00, 0x10) in the host's little-endian order, producing 0x1000 instead of the wire's intended 0x0010 -- silently wrong, not a crash, which is what makes this bug class dangerous in the field: it can pass every test run on a little-endian development machine and only misbehave against a real big-endian peer or a specific value pattern.","pitfall":"Testing wire-format parsing code only on one host architecture and concluding it is correct, when the byte-order bug is invisible precisely on a same-endianness host/wire pairing.","verify":null,"follow":[{"q":"Would this bug also exist on a big-endian host?","a":"No, on an actual big-endian host the direct cast would happen to read the correct value, which is exactly why the bug is easy to miss during development on one architecture and only appears when porting to or interoperating with the other endianness."},{"q":"Is casting a buffer to a struct pointer also a strict-aliasing concern, separate from endianness?","a":"Yes; besides the endianness bug, reading through a pointer of a different effective type than how the memory was written is a distinct undefined-behavior risk covered in module 10, so the struct-cast approach has two independent problems, not just one."}],"mod":17},{"id":"17.08","level":"Advanced","type":"Cross-layer","fig":"mmio","tags":["volatile","compiler-reordering"],"q":"Concretely, what does the compiler actually do differently to a memory-mapped register write with and without volatile?","short":"Compiling the identical write-three-times loop with and without volatile and comparing disassembly shows the non-volatile version collapsing three stores into one (the compiler proves the first two are \"dead\" since nothing it can see reads them), while the volatile version emits three separate store instructions plus a real reload, exactly the compiler behavior 6.7.3p7 exists to prevent for objects that \"may be modified in ways unknown to the implementation.\"","deep":"```c\n/* non-volatile version */\n#include <stdint.h>\nstatic uint32_t reg = 0;\nint main(void) {\n    uint32_t *p = &reg;\n    for (int i = 0; i < 3; i++) { *p = 1; }\n    return (int)*p;\n}\n```\n```c\n/* volatile version, otherwise identical */\n#include <stdint.h>\nstatic uint32_t reg = 0;\nint main(void) {\n    volatile uint32_t *p = &reg;\n    for (int i = 0; i < 3; i++) { *p = 1; }\n    return (int)*p;\n}\n```\nBoth compiled with `gcc -std=c11 -Wall -Wextra -O2`. Disassembling with `objdump -d`, the non-volatile `main` contained exactly one store instruction:\n```\nmovl   $0x1,0x2fc6(%rip)        # reg\nmov    $0x1,%eax\nret\n```\nwhile the volatile `main` contained three separate stores plus a final load:\n```\nmovl   $0x1,0x2fc6(%rip)        # reg\nmovl   $0x1,0x2fbc(%rip)        # reg\nmovl   $0x1,0x2fb2(%rip)        # reg\nmov    0x2fac(%rip),%eax        # reg  (real reload for the return value)\nret\n```\nThis is the figure's point made concrete: the compiler treated the non-volatile writes as redundant (only the last one is observable, so the first two are eliminated, and the final read is answered from the constant it just proved was stored, no reload needed) while every volatile write and the final volatile read actually happened as separate instructions in program order, because the standard requires the abstract machine's sequence of accesses to a volatile object to be preserved, not just its final value.","pitfall":"Testing volatile-sensitive code only at -O0, where the compiler often has not yet applied the optimizations (dead-store/load elimination, hoisting, reordering) that a volatile qualifier exists to prevent, then being surprised when a release (-O2) build breaks.","verify":null,"follow":[{"q":"Would -O0 show the same difference between the two versions?","a":"Mostly not; at -O0 gcc generally does not perform this kind of dead-store elimination anyway, so both versions tend to emit similar code, which is exactly why relying on an unoptimized build to \"prove\" non-volatile register access is fine is misleading."},{"q":"Does this same reasoning apply to reads, not just writes?","a":"Yes symmetrically: a non-volatile read inside a polling loop can be hoisted out of the loop entirely (read once, then loop forever or not at all on that stale value) since the compiler sees nothing in the loop body that could change it; volatile forces a fresh read every iteration, which is exactly the polling pattern in 17.01."}],"mod":17},{"id":"17.09","level":"Advanced","type":"Debug","fig":null,"tags":["buffer-overflow","strcpy"],"q":"A firmware log function using strcpy on attacker- or peer-controlled input overflows its stack buffer. Show the vulnerable code, how it fails, and a real fi
