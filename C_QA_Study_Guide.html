olumn 23 is the `arr[idx]` expression; the type `int [5]` tells you the declared array size directly from the diagnostic, no need to go find the declaration first.\n2. **Second and third lines, a separate address-sanitizer-style check** UBSan's `-fsanitize=undefined` also performs for out-of-bounds loads: it shows the actual bytes at and after the computed address, with a caret marking where the read started, which is directly the byte pattern of whatever memory happened to follow `arr` on the stack.\n3. **The plain, non-sanitized run still \"succeeds\"** and prints `32767` (some indeterminate stack value), which is exactly why this class of bug is dangerous in production: it neither crashes nor looks obviously wrong.\n4. **The fix is a bounds check before the access**, `if (idx >= 0 && idx < 5) use(arr[idx]);`, or restructuring so `idx` cannot reach an invalid value in the first place (a `switch` or a lookup table sized to match every valid input).\n- **Why plain -Wall does not catch this:** `idx` is a variable, not a compile-time constant, so there is nothing for a purely static pass to disprove; UBSan's bounds check is inserted at compile time but evaluated against the actual runtime value of `idx`.","pitfall":"Reading only the first line of a multi-part sanitizer report and missing that a single bad access can trigger more than one check.","verify":"The specific set of checks bundled under gcc's -fsanitize=undefined (`array-bounds` is one of several sub-checks; the exact sub-check list is a gcc-documentation fact, not a language-standard one).","follow":[{"q":"Would this be caught if `arr` were accessed through a pointer parameter instead of the local array directly?","a":"Usually not by this specific check, since UBSan's array-bounds instrumentation relies on the compiler still knowing the static array type at the access site; once the array has decayed to a plain pointer passed into another function, that type information is typically gone and AddressSanitizer (a different tool, `-fsanitize=address`) is what catches the out-of-bounds memory access instead."},{"q":"Is `idx` itself required to be undefined before the subscript runs?","a":"No, computing `idx = 5` is completely fine; the undefined behavior is specifically in using it as a subscript into a 5-element array, per the pointer-arithmetic rule in 6.5.6p8 (array subscripting `arr[idx]` is defined as `*(arr + idx)`)."}],"mod":10},{"id":"10.11","level":"Advanced","type":"Concept","fig":null,"tags":["indeterminate-value","trap-representation","uninitialized"],"q":"What does the standard actually say about reading an uninitialized automatic variable, and is it always undefined behavior?","short":"C11 6.3.2.1p2 says that if an automatic-storage object that could have been declared `register` (address never taken) is read before being initialized or assigned, the behavior is undefined. Separately, 6.2.6.1p5 says that if the object's stored bits form a trap representation for its type and are read through a non-character lvalue, that is also undefined. So \"indeterminate value\" is not a safe placeholder; reading it can be undefined outright, not merely unpredictable.","deep":"```c\n#include <stdio.h>\nint main(void) {\n    int x;\n    if (x > 0) printf(\"pos\\n\"); else printf(\"nonpos\\n\");\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra`:\n```\nq11.c: In function 'main':\nq11.c:4:8: warning: 'x' is used uninitialized [-Wuninitialized]\n    4 |     int x;\n      |         ^\n```\nRunning it printed `pos`. Under `-fsanitize=undefined` it also ran silently and printed `pos` again, with no runtime diagnostic, because gcc's UBSan build does not include an uninitialized-value check by default (that class of detection belongs to MemorySanitizer, a separate, clang-only tool not exercised here).\n- **Two distinct standard hooks, easy to conflate:** 6.3.2.1p2 is about *never having given the object a value at all*; 6.2.6.1p5's trap representation is about the bits present (from whatever leftover memory happened to be there) not forming a valid value of the type at all, for example a `_Bool` byte holding something other than 0 or 1 on an implementation that traps on it. Ordinary `int` on common platforms has no trap representations, so the first clause, plain \"unspecified-turned-undefined by use,\" is the one actually in play for `int x;` here; padding-heavy or `_Bool`-like types are where the second clause bites.\n- **\"Indeterminate value\" is the standard's term** (an unspecified value or a trap representation), and 6.3.2.1p2 is explicit that using it is undefined, not merely unspecified, precisely because it might be a trap representation.\n- **Static analysis (here, -Wuninitialized) is decent at exactly this pattern** because \"declared, then read on some path with no intervening write\" is a data-flow property the compiler already computes for other reasons; it is one of the more reliable UB warnings available.","pitfall":"Assuming an uninitialized read is merely \"some garbage value\" that is annoying but safe to reason about. The standard allows it to be a trap representation, which can be undefined the instant it is read, not just imprecise.","verify":"C11 6.3.2.1p2 (indeterminate value on automatic storage) and 6.2.6.1p5 (trap representations).","follow":[{"q":"Does zero-initializing static or global variables avoid this?","a":"Yes, objects with static storage duration are zero-initialized by default (6.7.9p10) if not explicitly initialized, so this specific issue is purely about automatic (stack) storage."},{"q":"Would `int x = 0;` at the top instead of a later conditional assignment always be safer style?","a":"Generally yes for exactly this reason; default-initializing removes an entire category of undefined behavior for negligible cost, at the price of occasionally masking a \"forgot to set this\" logic bug that a warning would otherwise have caught."}],"mod":10},{"id":"10.12","level":"Advanced","type":"Scenario","fig":null,"tags":["works-on-my-machine","portability","review"],"q":"A teammate says \"this pointer-arithmetic trick works fine on our target, so it is not really a bug.\" How do you separate a real implementation-defined guarantee from an accidental one before signing off?","short":"Check whether the behavior is named in Annex J.3 (implementation-defined behavior) or documented by the vendor's own manual; if so, and the code only ever targets that documented implementation, it is a reviewable, sustainable dependency. If the behavior is undefined per the standard (Annex J.2) and merely happens to be stable on the current compiler and flags, it is not a guarantee at all, and \"works fine\" only describes today's toolchain, not tomorrow's.","deep":"1. **Ask which category it falls into first.** Implementation-defined behavior (3.4.1) requires the vendor to document one fixed choice; that is a real, checkable contract you can cite (a manual page, a `-std=` note, an ABI document). Undefined behavior (3.4.3) has no such obligation from anyone, ever.\n2. **Get the exact construct in front of you**, not a paraphrase. \"Signed right shift\" (6.5.7p5) is implementation-defined on every conforming implementation; \"signed integer overflow\" (6.5p5) is undefined on all of them. These are easy to blur together in a hallway conversation but the standard treats them completely differently.\n3. **Check whether the confirmed guarantee is actually the one being relied on.** A right-shift trick might rely on the implementation-defined \"arithmetic shift\" choice and nothing else; if nearby code also silently assumes no overflow, that second assumption is still undefined even if the shift itself is fine.\n4. **Compile the exact function at more than one optimization level** and, where feasible, more than one compiler, specifically looking for a change in output; agreement across `-O0`, `-O2`, and a second compiler is evidence (never proof) that nothing UB-shaped is being exploited, while disagreement is close to proof that something is.\n5. **Write down the dependency explicitly** in a comment or design note (\"relies on arithmetic right shift, implementation-defined per 6.5.7p5, true for gcc/clang on this target\") so the next reviewer, or the next target port, has something concrete to re-check instead of re-litigating \"works fine\" from scratch.\n- **The core distinction to hold onto:** implementation-defined behavior is a promise from one vendor for one implementation; it is portable across your team's builds on that toolchain but not across toolchains. Undefined behavior is not a promise from anyone, on any toolchain, ever, even if every build you have tried agrees.","pitfall":"Accepting \"it works on our target\" as equivalent to \"it is implementation-defined.\" Only a documented vendor guarantee earns that word; an accidental stable result on undefined behavior earns nothing.","verify":null,"follow":[{"q":"Does \"our target never changes compilers\" make relying on undefined behavior acceptable?","a":"No; it also never changes optimization flags, library versions, or gets rebuilt after a compiler security update, until one day it does, and undefined behavior gives the new build no obligation to match the old one's accidental output."},{"q":"Is Annex J itself normative?","a":"No, Annex J is explicitly informative (a cross-reference list); the normative requirement is always the individual clause it points back to, so cite the clause, not the annex entry, when it matters."}],"mod":10},{"id":"10.13","level":"Advanced","type":"Concept","fig":null,"tags":["implementation-defined","signed-shift","examples"],"q":"Besides the standard's own example, what are the other classic implementation-defined behaviors worth knowing for a C interview?","short":"The standard's textbook example (3.4.1) is right-shifting a negative signed value; 6.5.7p5 confirms it directly, saying that for `E1 >> E2` with a negative `E1`, \"the resulting value is implementation-defined.\" Other common ones: the signed-integer representation choice, two's complement, ones' complement, or sign-magnitude (6.2.6.2p2), converting an out-of-range value to a signed type (6.3.1.3p3), and integer sizes beyond the standard's stated minimums (5.2.4.2.1).","deep":"```c\n#include <stdio.h>\nint main(void) {\n    int s = -16;\n    unsigned int u = 0xFFFFFFF0u;\n    printf(\"signed >>2 = %d\\n\", s >> 2);\n    printf(\"unsigned >>2 = %u\\n\", u >> 2);\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra` and run: `signed >>2 = -4`, `unsigned >>2 = 1073741820`. The unsigned line is fully defined by 6.5.7p5's other branch (logical shift, quotient of `E1 / 2^E2`); the signed line's `-4` is this compiler's implementation-defined choice (an arithmetic shift that fills with the sign bit), not a portable guarantee.\n| Behavior | Clause | This gcc/x86-64 |\n|---|---|---|\n| Right shift of a negative signed value | 6.5.7p5 | Arithmetic shift (sign-extends) |\n| Signed integer representation | 6.2.6.2p2 | Two's complement |\n| Out-of-range conversion to signed type | 6.3.1.3p3 | Result is the low-order bits (wraps) |\n| Size of `int` | 5.2.4.2.1 (minimums only) | 32 bits |\n\n- **Why \"implementation-defined\" is still useful information:** unlike undefined behavior, each of these has one fixed, documented answer for a given compiler and target, so code that depends on \"arithmetic right shift\" is non-portable but not unsafe on a toolchain where that is the documented choice; the risk is entirely in porting to a different one, not in the current build misbehaving.\n- **C17/C23:** the core wording for these clauses is essentially unchanged from C11; C23 does add a normative requirement that signed integers be two's complement (removing the other two historical choices as conforming options going forward), which turns 6.2.6.2p2's implementation-defined list into a fixed rule for any C23-conforming implementation.","pitfall":"Calling every \"surprising but consistent\" result implementation-defined without checking the actual clause. Some surprising-but-consistent results (like the earlier `x + 1 > x` fold) are undefined behavior that merely happened to be stable on one build, not a documented guarantee.","verify":"C11 6.5.7p5 (shift semantics), 6.2.6.2p2 (signed representation choices), 6.3.1.3p3 (out-of-range signed conversion).","follow":[{"q":"Is `-8 >> 1` guaranteed to equal `-4` on every C11 implementation?","a":"No; it is guaranteed to be one implementation-defined value chosen and documented by that vendor, and arithmetic shift (giving `-4`) merely happens to be what essentially every mainstream implementation documents, gcc and clang included."},{"q":"Does implementation-defined behavior ever get caught by -fsanitize=undefined?","a":"No; by definition it is not undefined behavior, so UBSan has nothing to report there, which is exactly why the earlier question's table showed a clean UBSan run for the signed-shift line."}],"mod":10},{"id":"10.14","level":"Advanced","type":"Trap","fig":null,"tags":["pointer-comparison","relational","different-objects"],"q":"Is comparing two pointers into unrelated arrays with `<` well-defined, if the comparison compiles and runs without crashing?","short":"No. C11 6.5.8p5 defines pointer relational comparison only for pointers into the same array object (or one past its end) or the same aggregate; it closes with \"In all other cases, the behavior is undefined.\" Equality (`==`, 6.5.9) is defined for any two pointers, but `<`, `>`, `<=`, and `>=` between pointers to two separately declared objects are undefined behavior even though the comparison will produce some `0` or `1` on essentially every real machine.","deep":"- **What is actually guaranteed by 6.5.8p5:** pointers into the same array compare according to subscript order; pointers to members of the same struct compare in declaration order; all pointers to members of the same union compare equal; a pointer one past the end of an array compares greater than a pointer to its last element. Nothing else is covered.\n- **What is not guaranteed:** given `int a[4], b[4];`, the expression `&a[0] < &b[0]` has no defined result. On most real stack or static layouts it will return something consistent for a given build, but nothing in the standard obligates that, and address space layout randomization, reordering by the linker, or a different optimization level can all change which object ends up at the lower address.\n- **Why `==` is different and safe:** 6.5.9 defines pointer equality unconditionally (they compare equal exactly when they point to the same object, or are both null, or one is one-past-the-end matching the other under the rule in 6.5.6p9); there is no \"unrelated objects\" exception the way there is for the ordering operators.\n- **Where this actually bites in real code:** a bounds check like `if (ptr >= buffer_a && ptr < buffer_a + len)` is fine (same array), but code that tries to establish a total order between two independently allocated buffers, or between a stack variable's address and a heap pointer, to decide \"which one is higher in memory\" is relying on undefined behavior, not a portable layout fact.\n- **The standard-conforming alternative** when a total order across unrelated objects is actually needed (rare, and usually a sign the design should not need it) is to convert both pointers to `uintptr_t` (7.20.1.4) first; the pointer-to-integer conversion itself is implementation-defined but at least well-defined enough to compare as integers, unlike the raw pointer comparison.","pitfall":"Trusting that \"it returned 0 or 1 consistently across many test runs\" proves the comparison is defined. Consistency under one build's memory layout is not the same as a standard guarantee.","verify":"C11 6.5.8p5 (relational operators, pointer comparison rules) and 6.5.9 (equality operators).","follow":[{"q":"Is subtracting (not comparing) two pointers into different arrays any better?","a":"No, it is the matching undefined case in 6.5.6p9, for the same reason: the standard only defines pointer subtraction within one array object."},{"q":"Does this affect qsort-style comparators, which receive pointers into elements of the same array being sorted?","a":"No, that is exactly the safe case (same array object), which is why qsort comparators comparing `*(const int *)a` against `*(const int *)b` (comparing the pointed-to values, not the addresses) or even the addresses themselves within one array are both fine."}],"mod":10},{"id":"10.15","level":"Principal","type":"Cross-layer","fig":null,"tags":["optimizer","overflow-assumption","x-plus-one"],"q":"A junior engineer is confused that `if (x + 1 > x) return 1;` returned `1` even when called with `x == INT_MAX`, where `x + 1` overflows. Walk through why, and what it reveals about how optimizers use undefined behavior.","short":"Because signed overflow is undefined, the compiler may assume `x + 1 > x` is always true for every `int x`, since the only way it could be false is an overflow the standard says cannot legally happen. On this gcc/x86-64 toolchain, the comparison is constant-folded to `1` at both `-O0` and `-O2`, so the function always returns `1` for `INT_MAX` too, even though a naive two's-complement model says `INT_MAX + 1` wraps to `INT_MIN`, which is not greater than `INT_MAX`.","deep":"```c\n#include <stdio.h>\n#include <limits.h>\nint check(int x) {\n    if (x + 1 > x) return 1;\n    return 0;\n}\nint main(void) {\n    printf(\"%d\\n\", check(INT_MAX));\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra` at both `-O0` and `-O2`: both printed `1`. Looking at the `-O0` generated assembly for `check` confirms the whole comparison was folded away in the front end, before any optimization pass even ran:\n```\ncheck:\n        movl    %edi, -4(%rbp)\n        movl    $1, %eax\n        ret\n```\n1. **The reasoning chain the compiler is entitled to make:** \"the standard says `x + 1` for a signed `int` may not overflow (6.5p5 makes overflow undefined); therefore, for every value of `x` the standard permits, `x + 1 > x` holds; therefore the whole `if` can be replaced by the constant `1`.\" This is a completely legal transformation under the standard, not a bug in gcc.\n2. **This is not an -O2-only effect here**, which surprises people expecting \"optimizations only kick in at higher levels.\" Some UB-based constant folding happens as part of basic front-end simplification even at `-O0`; the aggressive whole-loop transformations most people associate with \"the optimizer assumed no overflow\" (for example turning `for (i = 0; i <= n; i++)` into something that behaves as if it cannot terminate abnormally) are the higher-optimization-level version of the same underlying license.\n3. **The mental model to replace:** \"the compiler will do the two's-complement thing I expect\" is only true for unsigned types, which have a defined wraparound (6.3.1.3p2). For signed types, the correct mental model is \"the compiler is allowed to assume this line of code, as written, never overflows,\" and will use that assumption anywhere it helps, including deleting the very check meant to catch the overflow.\n4. **The fix**, if overflow must be detected rather than assumed away, is to check before the addition using the type's limits (`if (x == INT_MAX) return 0; return 1;` here), or to perform the arithmetic in a wider or unsigned type and then range-check the result, never to test for overflow after the fact on the signed operation itself.\n- **Interview framing:** this example (or the closely related infinite-loop-from-overflow-assumption story) is the standard way interviewers probe whether a candidate understands that \"undefined behavior\" is not a synonym for \"probably fine in practice,\" but an active license the optimizer is written to exploit.","pitfall":"Debugging this by staring at the \"wrong\" runtime value and looking for a hardware or memory-corruption explanation. The value is not wrong by any hardware fault; the whole comparison was removed at compile time.","verify":"C11 6.5p5 (undefined on overflow) and 6.3.1.3p2 (defined unsigned wraparound), to confirm the asymmetry that makes this fold legal only for the signed version.","follow":[{"q":"Would `unsigned int check_u(unsigned int x) { return (x + 1 > x); }` behave the same way at `x == UINT_MAX`?","a":"No, and that is the whole point of the contrast: unsigned wraparound is defined (6.3.1.3p2), so `UINT_MAX + 1` really is `0`, `0 > UINT_MAX` is false, and the function correctly returns `0`; the compiler cannot fold this one to a constant because the false case is a real, reachable outcome."},{"q":"Is this specific to gcc, or would clang do the same fold?","a":"The standard permits any conforming compiler to perform this fold, since it follows directly from signed overflow being undefined; which specific compilers actually implement it, and at which point in their pipeline, is a toolchain fact, not a language one, so always verify on the actual compiler in use rather than assuming."}],"mod":10},{"id":"10.16","level":"Principal","type":"Scenario","fig":null,"tags":["firmware-review","checklist","ub-audit"],"q":"You are reviewing a firmware driver's C file for undefined behavior before a safety-relevant release. What is your concrete method, beyond \"read it carefully\"?","short":"Run a layered pipeline rather than relying on inspection alone: compiler warnings at their strictest, a UB sanitizer build exercised against the real test suite and a fuzzer where inputs are attacker- or environment-controlled, then a targeted manual pass over the specific constructs sanitizers cannot see (strict aliasing, incompatible function-pointer calls, and pointer comparisons across unrelated objects), each mapped to a specific standard clause so the finding is falsifiable, not a feeling.","deep":"1. **Static pass:** build with `-std=c11 -Wall -Wextra -Wpedantic` (and a stricter project-specific set, such as `-Wconversion`, `-Wcast-align`, `-Wshadow`) and clear every warning; treat this as necessary, not sufficient, per the earlier question in this module.\n2. **Dynamic pass:** build a host-side test binary with `-fsanitize=undefined,address` and run the full existing test suite through it, then run a fuzzer (or at minimum a targeted set of boundary-value inputs: `0`, negative, `INT_MAX`/`INT_MIN`-adjacent, maximum buffer sizes) against any function that parses external or hardware-derived data, since sanitizers only report what actually executes.\n3. **Manual audit for sanitizer blind spots**, specifically:\n   - Any pointer cast that reinterprets an object's type (strict aliasing, 6.5p6-7): confirm every one goes through `memcpy` or a union, not a raw pointer cast.\n   - Any function pointer called after being cast to or from a different function type (6.3.2.3p8): confirm the call site's assumed signature matches the pointed-to function's real signature.\n   - Any pointer comparison or subtraction between two objects (6.5.8p5, 6.5.6p9): confirm both operands are always into the same array or aggregate.\n   - Any signed arithmetic on values derived from hardware registers or untrusted input, where overflow is reachable: confirm range checks happen before, not after, the arithmetic.\n4. **Cross-reference every unsigned computation that is expected to wrap** (tick counters, ring-buffer indices) against 6.3.1.3p2 explicitly, to confirm the code is relying on documented wraparound rather than an accidental two's-complement assumption smuggled in through a signed type.\n5. **Record findings against clause numbers**, not vague descriptions, so a re-reviewer (or a future toolchain upgrade that changes what gets exploited) can re-check the same specific claim quickly.\n- **Why this order:** static analysis is cheapest and catches the syntactically obvious cases first; dynamic analysis catches value-dependent bugs the static pass structurally cannot; the manual pass exists specifically for the handful of UB categories current sanitizers do not instrument well (aliasing and incompatible function-pointer calls chief among them, per the earlier module questions).","pitfall":"Treating a clean sanitizer run on the existing test suite as a release gate by itself. It only reflects the inputs the suite happens to exercise, not the full input space a shipped driver will see.","verify":null,"follow":[{"q":"Does passing every step of this pipeline prove the file has no undefined behavior?","a":"No; it raises confidence substantially but sanitizers only see executed paths and gcc's UBSan build has known gaps (no aliasing or function-type check), so the manual pass is load-bearing, not optional, for the categories it targets."},{"q":"Should this pipeline run on every commit or only before release?","a":"The static and dynamic passes belong in ordinary CI on every commit, since they are cheap and automatic; the manual audit is realistically a release-gate activity, focused on the diff since the last audit rather than the whole file every time."}],"mod":10},{"id":"10.17","level":"Principal","type":"Debug","fig":null,"tags":["strict-aliasing","optimization-level-diff","root-cause"],"q":"A checksum routine passes its unit tests at -O0 but a teammate reports it silently misbehaves after enabling -O2 in the release build, and no sanitizer flags anything. What is your root-cause process?","short":"Given \"same source, different optimization level, no sanitizer hit,\" the usual suspects are a strict-aliasing violation the compiler only exploits once it caches values across pointer accesses at -O2, or an unsequenced expression the compiler is free to reorder. Isolate it by bisecting flags (`-O1`, then individual `-f` flags under `-O2`), then hunt for type-punning casts, the most common cause of this \"-O0 clean, -O2 broken, sanitizer silent\" shape.","deep":"```c\n#include <stdio.h>\nfloat alias_write(float *fp, int *ip) {\n    float before = *fp;\n    (void)before;\n    *ip = 0x40490fdb;\n    return *fp;\n}\nint main(void) {\n    float f = 1.0f;\n    int *ip = (int *)&f;\n    float after = alias_write(&f, ip);\n    printf(\"%f\\n\", after);\n    return 0;\n}\n```\nOn this gcc/x86-64 toolchain, both `-O0` and `-O2` printed `3.141593` for this particular function, meaning this exact snippet did not reproduce a visible difference here; the important lesson from actually testing it is that a strict-aliasing violation is not guaranteed to misbehave at any given optimization level or compiler version, it merely has no guarantee it will not, which is precisely why \"it passed at -O0\" is worthless evidence. Do not treat a matching result across levels as proof the code is fine; treat it only as this build's outcome today.\n1. **Bisect the flags, not just -O0 vs -O2.** Try `-O1`, then `-O2` with individual passes disabled (`-fno-strict-aliasing` is the single highest-value one to try first for exactly this failure shape), to localize which specific optimization pass changes behavior.\n2. **`-fno-strict-aliasing` flipping the result is close to a smoking gun.** If disabling only that flag restores the -O0 behavior, the bug is almost certainly a type-punning cast somewhere in the checksum's byte-access code, not a logic error in the checksum algorithm itself.\n3. **Grep for the actual pattern**, not just \"look for bugs\": every `(int *)`, `(uint32_t *)`, `(float *)`-style cast applied to an object of a different declared type, especially inside a loop that also reads or writes through the object's original type nearby.\n4. **Confirm and fix with memcpy**, not by declaring the aliasing cast \"probably fine\": replace the pointer-cast reinterpretation with `memcpy` into a same-sized local of the target type, re-run at `-O2`, and confirm the result is now stable and matches -O0 without needing `-fno-strict-aliasing` as a crutch.\n5. **Explain to the team why the unit tests missed it:** unit tests built at -O0 (or with sanitizers that do not instrument aliasing) will never see this class of bug regardless of coverage percentage; the fix belongs in the CI matrix (test the release optimization level too), not only in this one file.\n- **Why sanitizers did not flag it:** gcc's `-fsanitize=undefined` has no aliasing-violation check, as noted earlier in this module; ASan and UBSan both instrument memory safety and a specific list of undefined operations, and effective-type violations are not on gcc's list.","pitfall":"Declaring the bug \"fixed\" because a specific test now passes at -O2. Without identifying and removing the actual aliasing violation, a future compiler upgrade or a different optimization pass can reopen the identical failure mode.","verify":null,"follow":[{"q":"If disabling -fno-strict-aliasing does not change the symptom, what next?","a":"Suspect unsequenced side effects (6.5p2) next, especially inside function-call argument lists or compound expressions the checksum loop might use, since those can also change behavior across optimization levels without any sanitizer catching them."},{"q":"Is it safe to ship the release build with -fno-strict-aliasing as the permanent fix instead of finding the cast?","a":"It suppresses this symptom on this compiler, but it is a global flag masking a real, still-undefined-behavior bug in the source, so treat it as a temporary firebreak while root-causing, never as the actual fix."}],"mod":10},{"id":"10.18","level":"Principal","type":"Concept","fig":null,"tags":["defensive-coding","misra","portable-idioms","c17-c23"],"q":"Given that undefined behavior cannot be caught by any single tool, what is a realistic, layered defensive strategy for a firmware team that must ship reliable C?","short":"No single practice closes the gap; combine strict compiler warnings, a UB/address sanitizer build in the host test matrix, a coding standard that forbids the highest-risk idioms (raw type-punning casts, overflow-prone signed arithmetic on untrusted ranges), and a few standard-conforming replacements (memcpy for reinterpretation, unsigned types for anything expected to wrap, range checks before arithmetic) applied consistently enough that reviewers can spot violations quickly.","deep":"- **Tooling layer:** `-Wall -Wextra -Wpedantic` always on; `-fsanitize=undefined,address` in the host test matrix (see the Principal review-checklist question in this module); a static analyzer (cppcheck, clang-tidy, or a MISRA-C checker) run in CI, since these tools specifically encode many of the patterns this module covers as automatic rule checks rather than relying on a human remembering clause numbers.\n- **Coding-standard layer:** ban the specific idioms this module identified as both common and dangerous: pointer-cast type punning (require `memcpy` or a documented union instead), signed arithmetic on values that can plausibly reach the type's limits without a prior range check, and pointer comparisons or subtraction across values not provably from the same array or object.\n- **Idiom-replacement layer, the \"do this instead\" list:**\n  - Reinterpreting bytes: `memcpy` into a same-sized object of the target type, never a pointer cast.\n  - A value expected to wrap (counters, ring-buffer indices, checksums): declare it unsigned and rely on 6.3.1.3p2's defined modulo behavior.\n  - Arithmetic that could exceed a signed type's range: range-check with the type's `_MAX`/`_MIN` macros before the operation, not after.\n  - Bit position and endianness-sensitive protocol fields: explicit shifts and masks (Module 11), never a struct laid directly over wire bytes via a pointer cast.\n- **Process layer:** the layered pipeline from the earlier Principal question (static, then dynamic, then manual audit against specific clauses) as a release gate, with findings tracked against clause numbers so re-review after a toolchain upgrade is fast.\n- **C17/C23 note:** C17 made no substantive change to any of this module's clauses; C23 tightens one relevant spot by requiring two's-complement signed representation, which removes one entire implementation-defined axis (6.2.6.2p2's three historical choices) for any code that can assume a C23 toolchain, though it does not touch signed overflow itself, which remains undefined even in C23.","pitfall":"Adopting a coding-standard ban list without the sanitizer and warning layers behind it. A human-enforced rule catches what reviewers happen to notice; the automated layers catch what they do not.","verify":null,"follow":[{"q":"Does adopting MISRA-C or a similar standard eliminate the need to understand the underlying clauses?","a":"No; a checklist rule (\"do not use pointer casts for type punning\") is only followable and defensible in review if the reviewer understands the clause behind it well enough to recognize the pattern in code the checklist's exact wording did not anticipate."},{"q":"Is it realistic to run -fsanitize=undefined on the actual embedded target, not just host tests?","a":"Rarely for a shipped image, due to code size and timing overhead on constrained hardware, which is exactly why the host-side test matrix (simulator, unit tests, or a bring-up board with more resources) is where this instrumentation earns its value, not the final release binary."}],"mod":10},{"id":"11.01","level":"Basic","type":"Concept","fig":null,"tags":["twos-complement","subtraction","representation"],"q":"What is two's complement, and why does it let a CPU implement subtraction with the same hardware as addition?","short":"Two's complement is one of three signed-integer representations C11 6.2.6.2p2 permits (the others are ones' complement and sign-magnitude); in it, the sign bit contributes -(2^M) rather than being a separate sign flag. Negating a value is \"invert the bits and add one,\" so `a - b` becomes `a + (~b + 1)`, meaning a single binary adder circuit handles both addition and subtraction with no separate subtractor and no special-cased sign logic.","deep":"- **The representation, precisely (6.2.6.2p2):** for an M-value-bit signed type, if the sign bit is 1, \"the sign bit has the value -(2^M)\" under two's complement, versus \"the corresponding value with sign bit 0 is negated\" for sign-magnitude, or \"-(2^M - 1)\" for ones' complement. Which one an implementation uses is implementation-defined in C11, though every mainstream target (and C23, normatively) uses two's complement.\n- **Why subtraction \"is free\":** `a - b == a + (-b)`, and `-b` in two's complement is `~b + 1` (flip every bit, add one). Since the hardware already has an adder for `+`, subtraction reuses it by first complementing and incrementing `b`, which is a cheap bitwise operation, rather than needing a distinct subtractor circuit.\n- **The one asymmetry two's complement introduces:** there is one more negative value than positive value (`INT_MIN` has no positive counterpart in range), because `0` \"uses up\" one of the sign-bit-1 patterns that sign-magnitude would otherwise spend on negative zero. This is why `-INT_MIN` and `abs(INT_MIN)` cannot be represented and are undefined behavior (7.22.6.1p2, footnote 304: \"the absolute value of the most negative number cannot be represented in two's complement\").\n- **Worked example, 8-bit for readability:** `5 - 3` as two's complement: `3 = 00000011`, `-3 = ~00000011 + 1 = 11111101`, `5 + (-3) = 00000101 + 11111101 = 00000010 = 2` (the carry out of the top bit is discarded), which matches the expected result using only addition.","pitfall":"Writing `-x` or `abs(x)` on a signed value that might be `INT_MIN` without checking first. It is undefined behavior, not merely \"returns INT_MIN\".","verify":"C11 6.2.6.2p2 (the three permitted signed representations) and 7.22.6.1p2 with footnote 304 (abs of INT_MIN).","follow":[{"q":"Is `abs(INT_MIN)` a crash, or just a wrong answer?","a":"Neither is guaranteed; 7.22.6.1p2 makes it undefined behavior outright, so a real toolchain might return `INT_MIN` unchanged, trap, or do anything else, and none of those outcomes is more \"correct\" than another per the standard."},{"q":"Does unsigned arithmetic care which signed representation is in use?","a":"No, 6.2.6.2p1's unsigned rule (pure binary, value bits only) is independent of the signed-representation choice entirely, which is part of why unsigned wraparound is portable while signed overflow is not (Module 10)."}],"mod":11},{"id":"11.02","level":"Basic","type":"Concept","fig":"bitops","tags":["and-or-xor-shift","bitwise","worked-example"],"q":"What do AND, OR, XOR, and the shift operators actually compute, bit by bit, on a real byte value?","short":"AND (`&`) keeps only the bits set in both operands, OR (`|`) keeps bits set in either, XOR (`^`) keeps bits set in exactly one, and `<<`/`>>` slide the bit pattern left or right, filling vacated positions with zero (left, and for unsigned/nonnegative right) or an implementation-defined bit (negative signed right shift, Module 10). Each is a fixed, position-by-position truth-table operation with no carrying or borrowing between bit positions, unlike ordinary addition.","deep":"```c\n#include <stdio.h>\nint main(void) {\n    unsigned char a = 0xB4;\n    unsigned char b = 0x2F;\n    printf(\"a & b = 0x%02X\\n\", (unsigned char)(a & b));\n    printf(\"a | b = 0x%02X\\n\", (unsigned char)(a | b));\n    printf(\"a ^ b = 0x%02X\\n\", (unsigned char)(a ^ b));\n    printf(\"a << 2 = 0x%02X\\n\", (unsigned char)(a << 2));\n    printf(\"a >> 2 = 0x%02X\\n\", (unsigned char)(a >> 2));\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra`, this prints `a & b = 0x24`, `a | b = 0xBF`, `a ^ b = 0x9B`, `a << 2 = 0xD0`, `a >> 2 = 0x2D`.\n\n| Position (MSB to LSB) | a=0xB4 | b=0x2F | a&b | a\\|b | a^b |\n|---|---|---|---|---|---|\n| bits | 1011 0100 | 0010 1111 | 0010 0100 | 1011 1111 | 1001 1011 |\n| hex | 0xB4 | 0x2F | 0x24 | 0xBF | 0x9B |\n\n- **Each column is independent:** bit 7 of the result depends only on bit 7 of `a` and bit 7 of `b`; there is no interaction between adjacent bit positions the way there is in addition's carry chain. That independence is exactly why these operators are the tool of choice for masks, flags, and packing (Module 6's bit-fields do the same thing at the language level).\n- **Shift is a position operation, not arithmetic:** `a << 2` moves every bit two positions toward the high end and fills the low two positions with `0`, per 6.5.7p4; `unsigned char` results are promoted to `int` for the shift (integer promotions) and then implicitly narrowed back by the cast in this code, which is why the cast to `(unsigned char)` before printing matters, otherwise `%02X` with an `int` argument on a promoted value would still print the right bits here, but relying on that without the cast is fragile.\n- **`a >> 2` here is `0x2D`** because `unsigned char` promotes to a nonnegative `int` for the shift, so 6.5.7p5's \"quotient of E1 / 2^E2\" branch applies: `0xB4 = 180`, `180 / 4 = 45 = 0x2D`, a pure logical shift with no sign extension.","pitfall":"Forgetting that `unsigned char` and `short` operands promote to `int` before any bitwise or shift operator runs, so intermediate results can be wider than the source type until narrowed back explicitly.","verify":"C11 6.5.7p4-5 (shift semantics) and 6.5.10 to 6.5.12 (AND, XOR, OR semantics).","follow":[{"q":"Would `a >> 2` differ if `a` were declared `signed char` holding the same bit pattern?","a":"Only in how the value is interpreted before promotion; `(signed char)0xB4` is a negative value on a two's-complement implementation, and after integer promotion to `int` it stays negative, so the shift becomes 6.5.7p5's other branch, implementation-defined for a negative operand (Module 10)."},{"q":"Is `a ^ b` the same as `(a | b) & ~(a & b)`?","a":"Yes, that identity always holds for XOR (bits set in exactly one operand equal bits set in either operand but not both), and it is a common way interviewers ask you to derive XOR from AND/OR/NOT if you forget the direct truth table."}],"mod":11},{"id":"11.03","level":"Basic","type":"Numeric","fig":null,"tags":["sizeof","char-bit","int-limits","worked-calculation"],"q":"Work out CHAR_BIT, sizeof(int), and INT_MIN/INT_MAX for a typical 64-bit Linux target, and explain the relationship between them.","short":"On this gcc/x86-64 target, `CHAR_BIT` is 8, `sizeof(int)` is 4, so `int` has 32 value-carrying bits; with one bit reserved as the sign bit in two's complement, the range is -2^31 to 2^31 - 1, which is exactly `INT_MIN = -2147483648` and `INT_MAX = 2147483647`, confirmed by compiling and printing `<limits.h>`'s macros directly.","deep":"```c\n#include <stdio.h>\n#include <limits.h>\nint main(void) {\n    printf(\"CHAR_BIT=%d sizeof(int)=%zu sizeof(long)=%zu\\n\", CHAR_BIT, sizeof(int), sizeof(long));\n    printf(\"INT_MIN=%d INT_MAX=%d\\n\", INT_MIN, INT_MAX);\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra`, prints `CHAR_BIT=8 sizeof(int)=4 sizeof(long)=8` and `INT_MIN=-2147483648 INT_MAX=2147483647`.\n1. **Total bits in `int`** = `CHAR_BIT * sizeof(int)` = `8 * 4 = 32`.\n2. **Two's complement split**: 1 sign bit + 31 value bits (assuming no padding bits, which is true for `int` on this target).\n3. **Range from 31 value bits**: values `0` to `2^31 - 1 = 2147483647` are representable with the sign bit clear; with the sign bit set, two's complement adds the range down to `-2^31 = -2147483648` (6.2.6.2p2's \"the sign bit has the value -(2^M)\" with M=31).\n4. **`long`'s 8 bytes here (64 bits) is a target/ABI fact**, not something C11 fixes; the standard only guarantees `long` is at least 32 bits (5.2.4.2.1's minimum-range table), so `sizeof(long)` legitimately differs across platforms (4 on 32-bit Windows, 8 on 64-bit Linux) even with the same compiler.\n- **Why this worked calculation matters for firmware:** any code that hardcodes \"`int` is 32 bits\" or \"`long` is 64 bits\" instead of using `<stdint.h>`'s exact-width types (`int32_t`, `uint64_t`) or `sizeof`/`<limits.h>` is making a platform assumption that C11 does not guarantee, even though it happens to hold on most desktop and server targets.","pitfall":"Assuming `sizeof(int) == sizeof(long)` because it happens to be true, or false, on the one target you tested. Use `<stdint.h>` exact-width types for any wire format or register layout that must match across targets.","verify":"C11 5.2.4.2.1 (minimum magnitude requirements for INT_MIN/INT_MAX/LONG_MIN/LONG_MAX).","follow":[{"q":"Does C11 guarantee int is exactly 32 bits?","a":"No; 5.2.4.2.1 only guarantees INT_MIN <= -32767 and INT_MAX >= 32767 as minimums, so a conforming `int` could in principle be 16 bits (rare in practice today) or wider than 32."},{"q":"Why use INT_MIN/INT_MAX from <limits.h> instead of hardcoding -2147483648/2147483647?","a":"Portability and self-documentation: the macros are correct on whatever the actual target's int width is, and the literal `-2147483648` is not even directly writable as an int constant in C (it parses as unary minus applied to `2147483648`, which does not fit in a signed int, forcing an implementation-defined type for the literal itself)."}],"mod":11},{"id":"11.04","level":"Intermediate","type":"Concept","fig":null,"tags":["set-clear-toggle-test","bit-mask","register"],"q":"What are the standard idioms to set, clear, toggle, and test a single bit in an integer, and why does each one use the operator it does?","short":"Set with `x |= (1u << n)` (OR forces that bit to 1 without disturbing others), clear with `x &= ~(1u << n)` (AND with every bit 1 except position n forces it to 0), toggle with `x ^= (1u << n)` (XOR flips exactly that bit), and test with `(x >> n) & 1u` (shift the target bit to position 0, then mask off everything else). Each idiom follows directly from the bitwise truth table: OR only ever turns bits on, AND only ever turns them off (when masked with 0s), XOR always flips.","deep":"```c\n#include <stdio.h>\nint main(void) {\n    unsigned int reg = 0x00;\n    reg |= (1u << 3);\n    printf(\"set: 0x%02X\\n\", reg);\n    reg &= ~(1u << 3);\n    printf(\"clear: 0x%02X\\n\", reg);\n    reg ^= (1u << 3);\n    printf(\"toggle: 0x%02X\\n\", reg);\n    unsigned int is_set = (reg >> 3) & 1u;\n    printf(\"test bit3: %u\\n\", is_set);\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra`, prints `set: 0x08`, `clear: 0x00`, `toggle: 0x08`, `test bit3: 1`.\n- **Why `1u`, not `1`:** using an unsigned literal keeps the shift and mask operations entirely in defined, wraparound-friendly unsigned arithmetic; shifting a plain `1` (an `int`) into the sign bit position (bit 31 of a 32-bit int) would attempt to produce a negative-signed-overflow result, undefined per 6.5.7p4, whereas `1u << 31` is perfectly defined unsigned arithmetic.\n- **Why clear uses `~` then `&`, not a direct assignment:** `~(1u << n)` produces a mask that is all 1s except a single 0 at position n; ANDing with it leaves every other bit unchanged (`x & 1 == x`) and forces position n to 0 (`x & 0 == 0`) regardless of its previous value, which is exactly \"clear this bit, leave the rest alone.\"\n- **Why this pattern matters for firmware registers:** a hardware control register is almost always \"read-modify-write one or two bits, leave the rest of the register untouched,\" because other bits may control unrelated hardware functions; a naive `reg = (1 << 3)` would zero every other bit in the register, likely disabling something else the firmware did not intend to touch.\n- **Multi-bit fields generalize the same idea:** to set a multi-bit field to a value `v` at bit offset `n` with width `w`, clear the field first with a wider mask (`x &= ~(((1u << w) - 1) << n)`), then OR in the shifted value (`x |= (v << n)`), combining the clear and set idioms.","pitfall":"Shifting a plain `int` literal (not `1u`) up to or past the sign bit position. That specific shift is undefined behavior per 6.5.7p4, not merely \"sets a negative-looking bit.\"","verify":"C11 6.5.7p4 (left shift of a signed value that is not representable is undefined) and 6.5.10-6.5.12 (AND/XOR/OR semantics).","follow":[{"q":"Why not just write reg = 0x08 to set bit 3?","a":"That overwrites every other bit in `reg` to 0, which is fine only if bit 3 is the sole meaningful bit; the OR-based idiom is the one that composes safely when other bits also matter, which is the common case for real registers."},{"q":"Does `(reg >> 3) & 1u` work the same as `reg & (1u << 3)` for testing a bit?","a":"Both correctly test whether the bit is set (nonzero result means set), but `(reg >> 3) & 1u` always yields exactly `0` or `1`, while `reg & (1u << 3)` yields `0` or `8`; prefer the shift form when the test result itself will be used as a boolean or compared numerically to `1`."}],"mod":11},{"id":"11.05","level":"Intermediate","type":"Numeric","fig":null,"tags":["popcount","brian-kernighan","worked-example"],"q":"Walk through Brian Kernighan's bit-counting trick, `n &= (n - 1)`, with an actual value, and explain why it terminates in exactly popcount(n) iterations.","short":"`n - 1` flips the lowest set bit of `n` to 0 and sets every bit below it to 1 (the two's complement borrow chain); ANDing that back into `n` clears exactly the lowest set bit and leaves every other bit untouched, so each iteration removes exactly one set bit. Starting from `n = 0x0B` (`0000 1011`, three set bits), the loop runs exactly three times before `n` reaches `0`, matching `popcount(0x0B) == 3`.","deep":"```c\n#include <stdio.h>\nint popcount(unsigned int n) {\n    int count = 0;\n    while (n) {\n        n &= (n - 1);\n        count++;\n    }\n    return count;\n}\nint main(void) {\n    printf(\"%d\\n\", popcount(0xFFu));\n    printf(\"%d\\n\", popcount(0x0Bu));\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra`, prints `8` (for `0xFF`, all 8 bits set) and `3` (for `0x0B`).\n\nTrace of `popcount(0x0B)`, `0x0B = 0000 1011`:\n| Step | n before | n - 1 | n & (n-1) | count |\n|---|---|---|---|---|\n| 1 | 0000 1011 | 0000 1010 | 0000 1010 | 1 |\n| 2 | 0000 1010 | 0000 1001 | 0000 1000 | 2 |\n| 3 | 0000 1000 | 0000 0111 | 0000 0000 | 3 |\n\n1. **Why `n - 1` flips exactly the lowest set bit and everything below it:** subtracting 1 borrows from the lowest set bit (since every bit below it is 0), turning that bit to 0 and every bit below it to 1, while every bit above it is untouched.\n2. **Why the AND then clears only that one bit:** the bits above the lowest set bit are identical in `n` and `n-1` (AND leaves them unchanged); the lowest set bit is 1 in `n` and 0 in `n-1` (AND clears it); the bits below are 0 in `n` and 1 in `n-1` (AND keeps them 0, which they already were).\n3. **Loop count equals the number of set bits exactly**, since each iteration removes precisely one, and the loop exits the instant `n` becomes `0`, which is why this trick runs in O(popcount(n)) rather than O(bit width) the way a naive shift-and-test loop over every bit position would.\n- **When to prefer this over `__builtin_popcount`:** almost never on gcc/clang, since the builtin typically compiles to a single hardware `POPCNT` instruction where available and is both faster and clearer; this trick remains worth knowing because it is a standard interview question and because it is portable to toolchains or embedded targets with no such builtin.","pitfall":"Assuming this trick requires knowing the integer's bit width in advance. It does not; it only ever does as many iterations as there are set bits, regardless of the type's width.","verify":"This is a well-known algorithmic identity rather than a spec-cited rule; the underlying two's-complement borrow behavior is grounded in C11 6.2.6.2p2.","follow":[{"q":"What does this trick compute for n = 0?","a":"The `while (n)` loop body never executes, so it correctly returns `0` immediately, with no special-casing needed."},{"q":"Is n &= (n - 1) safe for signed n?","a":"It works bit-for-bit the same way on a two's-complement representation, but mixing signed arithmetic (`n - 1` on a signed type) into a bit-twiddling loop invites the overflow risk from Module 10 if `n` can be `INT_MIN`; prefer an unsigned parameter type, as this code does."}],"mod":11},{"id":"11.06","level":"Intermediate","type":"Concept","fig":null,"tags":["power-of-two","bit-trick","edge-case"],"q":"Why does `n != 0 && (n & (n - 1)) == 0` correctly test whether an unsigned value is a power of two, and why is the `n != 0` check required?","short":"A power of two has exactly one bit set, so `n - 1` flips that bit to 0 and sets every lower bit to 1, making `n` and `n - 1` share no set bits, so `n & (n - 1) == 0`. A value with two or more set bits fails this, since `n - 1` clears only the lowest one. The explicit `n != 0` guard is required because `0 - 1` wraps to all-1-bits for unsigned, making `0 & (0 - 1) == 0` true by accident, and 0 is not a power of two.","deep":"```c\n#include <stdio.h>\n#include <stdbool.h>\nbool is_pow2(unsigned int n) {\n    return n != 0 && (n & (n - 1)) == 0;\n}\nint main(void) {\n    printf(\"%d %d %d %d\\n\", is_pow2(0), is_pow2(1), is_pow2(64), is_pow2(65));\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra`, prints `0 1 1 0`, matching: `0` is not a power of two, `1 = 2^0` is, `64 = 2^6` is, `65 = 64 + 1` (two set bits) is not.\n- **Short-circuit order matters, not just correctness:** `&&` guarantees the `n != 0` check runs first and, if false, the right-hand side is never evaluated at all (6.5.13p4's short-circuit rule), so there is no risk of a hypothetical issue from evaluating `n - 1` on `n == 0`; that subtraction is itself perfectly well-defined unsigned wraparound (Module 10), so this particular guard is about logical correctness, not about avoiding undefined behavior.\n- **The bit picture for n = 64:** `64 = 0100 0000`, `63 = 0011 1111`, and the AND of those two is `0000 0000`, no overlap, confirming the power-of-two case. For `n = 65 = 0100 0001`, `64 = 0100 0000`, AND gives `0100 0000`, nonzero, correctly rejecting it.\n- **A related, frequently confused idiom:** `n & (n + 1) == 0`... is not a power-of-two test; that shape instead identifies a value that is one less than a power of two (all low bits set, like `0x0F` or `0x7F`), which shows up in mask construction, not power-of-two checks. Keep the two straight.\n- **Firmware use case:** power-of-two checks gate ring-buffer and DMA-alignment code (Module 18's ring buffer is sized to a power of two specifically so index wraparound can use a cheap `& (size - 1)` mask instead of a modulo operation).","pitfall":"Dropping the `n != 0` guard because \"0 isn't usually passed in.\" Any function meant to be a general-purpose predicate should handle its documented domain correctly, including the edge value.","verify":null,"follow":[{"q":"Would this function misclassify n == UINT_MAX?","a":"No; UINT_MAX has every bit set, so n & (n-1) clears only the lowest bit and leaves the rest set, giving a nonzero result and correctly reporting \"not a power of two.\""},{"q":"Can the same idiom be written as (n & -n) == n for a signed type?","a":"That form relies on `-n` in two's complement isolating the lowest set bit the same way `n - 1`'s complement does, but doing it with a signed type reintroduces the INT_MIN negation problem from the first question in this module; the unsigned version shown here avoids that entirely."}],"mod":11},{"id":"11.07","level":"Intermediate","type":"Trap","fig":null,"tags":["xor-swap","aliasing","no-temp"],"q":"The classic \"swap two variables without a temporary\" trick uses three XORs. What is the trap that makes it dangerous in real code, not just a curiosity?","short":"`*a ^= *b; *b ^= *a; *a ^= *b;` correctly swaps two distinct integers using only XOR's self-inverse property, but if `a` and `b` point to the same object (or the same array element passed twice), the first line computes `*a ^= *a`, which zeroes the value, and the swap silently destroys the data instead of leaving it unchanged the way a temporary-based swap naturally would. A real implementation must guard the aliasing case explicitly.","deep":"```c\n#include <stdio.h>\nvoid xor_swap(int *a, int *b) {\n    if (a == b) return;\n    *a ^= *b;\n    *b ^= *a;\n    *a ^= *b;\n}\nint main(void) {\n    int x = 5, y = 9;\n    xor_swap(&x, &y);\n    printf(\"%d %d\\n\", x, y);\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra`, prints `9 5`, confirming the swap worked for the ordinary, non-aliased case.\n1. **Why the three-XOR sequence works when a != b:** let the original values be `A` and `B`. After line 1, `*a = A^B`. After line 2, `*b = B ^ (A^B) = A`. After line 3, `*a = (A^B) ^ A = B`. The result is `*a = B, *b = A`, a correct swap, using only XOR's properties `x^x=0` and `x^0=x`.\n2. **Why aliasing breaks it:** if `a == b`, line 1 computes `*a ^= *a`, and `x ^ x` is always `0` regardless of `x`'s value (6.5p6-7's rules about accessing the same object twice in one full expression are not even the issue here; this is XOR's own algebra doing exactly what it always does), so the value is zeroed before the \"swap\" even gets to the second line. This is a plain logic bug, not undefined behavior, which makes it worse in one sense: no sanitizer will ever flag it.\n3. **Where aliasing sneaks in in real code:** calling `xor_swap(&arr[i], &arr[j])` inside a sort routine where `i` and `j` can be equal on some iteration (a common off-by-one in partition logic) is the realistic version of this bug, not two obviously-identical variables.\n4. **Why the guard belongs inside the function, not at every call site:** relying on every caller to remember \"never call this with equal pointers\" is exactly the kind of contract that erodes over time as new call sites are added; the one-line `if (a == b) return;` makes the function correct for its entire domain unconditionally.\n- **Practical verdict:** this trick has no real performance advantage on any modern compiler (a plain temporary-based swap compiles to the same or better code, since the compiler already has spare registers), so treat it as an interview-knowledge item and a code-review red flag rather than something to actually reach for.","pitfall":"Presenting the XOR swap in an interview without immediately naming the aliasing failure. Interviewers specifically probe for whether a candidate knows this trick has a sharp edge, not just that it exists.","verify":null,"follow":[{"q":"Does using a temporary variable have the same aliasing problem?","a":"No: `int t = *a; *a = *b; *b = t;` produces `*a == *b == original value` (a correct no-op) when `a == b`, since it never relies on an operation that is destructive to the value in place, which is exactly why the temporary-based swap is the one to use in production code."},{"q":"Is the XOR trick ever the right choice for firmware?","a":"Rarely; a handful of odd niches (swapping without spilling a register in extremely tight hand-written assembly) motivated it historically, but for C source compiled by a modern optimizer it offers no benefit and carries this real risk."}],"mod":11},{"id":"11.08","level":"Intermediate","type":"Concept","fig":null,"tags":["reverse-bits","byte","loop"],"q":"Write and verify a function that reverses the bits within a single byte.","short":"Peel off the source byte's bits from the low end one at a time with `b & 1`, and build the result from the high end by shifting the accumulator left and OR-ing in each peeled bit before shifting the source right, so the first (originally lowest) bit ends up at the top of the result and the last (originally highest) bit ends up at the bottom. For `0xB4` (`1011 0100`), reversing the bit order gives `0x2D` (`0010 1101`).","deep":"```c\n#include <stdio.h>\n#include <stdint.h>\nuint8_t reverse_bits(uint8_t b) {\n    uint8_t r = 0;\n    for (int i = 0; i < 8; i++) {\n        r = (uint8_t)((r << 1) | (b & 1));\n        b >>= 1;\n    }\n    return r;\n}\nint main(void) {\n    printf(\"0x%02X\\n\", reverse_bits(0xB4));\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra`, prints `0x2D`.\n1. **Bit by bit trace:** `b = 1011 0100`. Iteration 1 takes bit 0 of `b` (`0`), shifts `r` left (still `0`) and ORs in `0`, giving `r = 0`; then `b >>= 1` gives `0101 1010`. This repeats, each time moving the next-lowest bit of the (shrinking) `b` into the bottom of `r` after shifting `r` left, so bits arrive into `r` in the same order they left `b`, but end up read in reverse relative to `b`'s original layout.\n2. **Why the cast `(uint8_t)(...)` is needed on every assignment to r:** `r << 1` and the `|` promote to `int` (integer promotions), so without the explicit narrowing cast back to `uint8_t`, `-Wextra`/`-Wconversion`-style tooling would flag an implicit narrowing, and more importantly, relying on the implicit truncation without stating it invites exactly the kind of \"did the width really come out right\" review question this cast pre-empts.\n3. **Generalizing to a full word instead of a byte:** the identical loop structure works for any fixed width by changing the loop bound to the type's bit count (`sizeof(x) * CHAR_BIT` iterations) and widening the types; a byte-sized reversal is the version worth memorizing because it also underlies bit-reversed addressing used in FFT implementations and some peripheral register layouts.\n- **A faster, no-loop alternative for exactly 8 bits** is a 256-entry lookup table indexed by the input byte, trading code size (256 bytes of table) for O(1) time; that trade-off (loop vs. table) is a legitimate thing to discuss when asked to optimize this in an interview.","pitfall":"Off-by-one in the loop bound (7 instead of 8, or starting the shift before the first OR), which silently drops or duplicates the extreme bits instead of producing an obviously wrong, easy-to-spot result.","verify":null,"follow":[{"q":"Would this loop work unmodified for a 16-bit input if the type were changed to uint16_t and the bound to 16?","a":"Yes, the same bit-peeling structure generalizes directly to any fixed width by widening the accumulator type and the loop bound to match."},{"q":"Why use uint8_t from <stdint.h> instead of unsigned char here?","a":"Both are typically the same object representation on ordinary platforms, but `uint8_t` states the intent (exactly 8 bits, no more) explicitly, which matters for wire-format and register-width code even though the two types are frequently interchangeable in practice."}],"mod":11},{"id":"11.09","level":"Intermediate","type":"Concept","fig":"endian","tags":["endianness","runtime-check","byte-order"],"q":"How do you determine at runtime whether the current platform is little-endian or big-endian, using only well-defined C?","short":"Store a known multi-byte value into an object, take its address as an `unsigned char *` (permitted by 6.5p7's character-type exception to strict aliasing, unlike a same-size non-character pointer cast), and inspect the first byte: if it holds the least-significant byte of the value, the platform is little-endian, and if it holds the most-significant byte, it is big-endian. 6.2.6.1p2 leaves byte order implementation-defined, so this must be checked, not assumed.","deep":"```c\n#include <stdio.h>\n#include <stdint.h>\nint main(void) {\n    uint32_t x = 0x01020304u;\n    unsigned char *p = (unsigned char *)&x;\n    printf(\"bytes: %02X %02X %02X %02X\\n\", p[0], p[1], p[2], p[3]);\n    if (p[0] == 0x04) printf(\"little-endian\\n\");\n    else if (p[0] == 0x01) printf(\"big-endian\\n\");\n    else printf(\"unknown\\n\");\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra` on this x86-64 host, prints `bytes: 04 03 02 01` and `little-endian`: the least-significant byte (`0x04`) is stored first, at the lowest address.\n- **Why accessing through unsigned char * is not a strict-aliasing violation but casting to another int * would be:** 6.5p7 lists \"a character type\" as one of the always-allowed lvalue types for accessing any object's stored value, precisely so byte-level inspection code like this is well-defined; casting the same pointer to `uint16_t *` instead and dereferencing it would hit the exact violation covered in Module 10.\n- **Why this must be a runtime check, not a compile-time assumption:** 6.2.6.1p2 states byte order is either explicitly specified (it is not, for ordinary object types) or implementation-defined, so portable code that must know the host's byte order (rather than simply avoiding the question by using explicit shifts, per the next question) has to ask the platform, not hardcode an assumption that happens to hold on the one machine being tested.\n- **The common preprocessor-only alternative** is checking predefined macros such as `__BYTE_ORDER__` and `__ORDER_LITTLE_ENDIAN__` (gcc/clang extensions, not standardized by C11), which resolves this at compile time instead of runtime; the code above is the portable-C11 way to get the same answer without depending on a specific toolchain's macros.\n- **C23 note:** C23 adds `<stdbit.h>` types and, separately, a standardized way to query byte order is still not part of core C23 either; endianness detection remains a \"check it yourself\" problem in standard C even in the newest revision, which is why this runtime idiom stays relevant.","pitfall":"Assuming \"little-endian\" because the development machine is x86 and shipping that assumption into wire-format or cross-platform serialization code without an actual runtime or explicit-shift-based check.","verify":"C11 6.2.6.1p2 (byte order is implementation-defined) and 6.5p7 (character-type access exception).","follow":[{"q":"Would this check work the same way for a struct instead of a scalar?","a":"The same character-pointer technique works for inspecting any object's raw bytes, but a struct additionally has unspecified padding bytes between members (Module 6), so byte-by-byte inspection of a struct mixes real data bytes with padding bytes that carry no defined value."},{"q":"Is casting &x to (unsigned char *) itself well-defined?","a":"Yes; 6.3.2.3p7 explicitly covers converting a pointer to an object type into a pointer to a character type, and 6.5p7 then permits accessing the object through it, which together is exactly why this pattern, and not a same-size integer-pointer cast, is the standard-conforming choice."}],"mod":11},{"id":"11.10","level":"Advanced","type":"Concept","fig":null,"tags":["ieee754","float-bits","sign-exponent-mantissa"],"q":"Decode the sign, exponent, and mantissa fields out of a 32-bit IEEE-754 float's bit pattern, using well-defined C.","short":"Copy the float's bytes into a same-sized `uint32_t` with `memcpy` (standard-conforming, unlike a pointer cast), then extract bit 31 as the sign, bits 30 to 23 as the biased 8-bit exponent, and bits 22 to 0 as the mantissa; subtracting the bias of 127 from the exponent field gives the actual power of two. `-6.5f` decodes to sign 1, biased exponent 129 (unbiased 2, so 2^2=4), and a mantissa encoding significand 1.625.","deep":"```c\n#include <stdio.h>\n#include <string.h>\n#include <stdint.h>\nint main(void) {\n    float f = -6.5f;\n    uint32_t bits;\n    memcpy(&bits, &f, sizeof bits);\n    unsigned sign = (bits >> 31) & 1u;\n    unsigned exp = (bits >> 23) & 0xFFu;\n    unsigned mant = bits & 0x7FFFFFu;\n    printf(\"sign=%u exp=%u (unbiased %d) mantissa=0x%06X\\n\", sign, exp, (int)exp - 127, mant);\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra`, prints `sign=1 exp=129 (unbiased 2) mantissa=0x500000`.\n1. **Why `memcpy`, not a pointer cast:** reinterpreting a `float`'s bytes as a `uint32_t` through a pointer cast is exactly the strict-aliasing violation covered in Module 10; `memcpy` between two same-sized objects of different types has no such problem, since it operates through `unsigned char` internally (conceptually) and every mainstream compiler compiles a small, fixed-size `memcpy` like this one down to the same load/store a cast would have produced, at no runtime cost.\n2. **Reconstructing the value from the fields:** IEEE-754 single precision is `(-1)^sign * 1.mantissa * 2^(exp - 127)` for a normal number (leading `1.` implicit and not stored). Here, sign=1 (negative), unbiased exponent 2 (`2^2 = 4`), and mantissa `0x500000 = 0b101_0000...0` over 23 bits represents `0.625` when interpreted as `mantissa / 2^23`, giving significand `1.625`; `-1 * 1.625 * 4 = -6.5`, matching the original value.\n3. **Annex F is C11's IEEE-754 binding**, and this module treats it as the assumed floating-point model since essentially every modern target implements it that way, though C11 itself does not require IEEE-754 outside of Annex F's optional conformance; `__STDC_IEC_559__` being defined is the standard way to check whether Annex F applies on a given implementation.\n- **Why interviewers ask this:** it tests whether the representation is understood as an engineered trade-off (range from the exponent, precision from the mantissa) rather than memorized trivia, and it is directly relevant to firmware that must interpret raw floating-point telemetry or protocol fields byte-for-byte.","pitfall":"Reinterpreting float bits with a pointer cast instead of memcpy. It compiles and often \"just works\" at -O0, which is exactly the strict-aliasing trap covered in Module 10.","verify":"C11 Annex F (IEC 60559 floating-point binding) and whether __STDC_IEC_559__ is defined on the target toolchain.","follow":[{"q":"What would exp == 0 and exp == 255 mean instead of an ordinary value like 129?","a":"exp == 0 signals a denormal (or exact zero if the mantissa is also 0), and exp == 255 signals infinity (mantissa 0) or NaN (nonzero mantissa), both special cases Module 11's later question on denormals and NaN covers."},{"q":"Does this decoding change for a negative zero versus positive zero?","a":"Yes, both have exp=0 and mantissa=0, differing only in the sign bit, and this is exactly the \"negative zero\" case that compares equal to positive zero under == but has a different bit pattern, worth remembering when doing byte-level comparisons instead of numeric ones."}],"mod":11},{"id":"11.11","level":"Advanced","type":"Numeric","fig":null,"tags":["float-epsilon","comparison","rounding"],"q":"Why does accumulating 0.1f ten times not equal 1.0f exactly, and how should the comparison be written instead of `==`?","short":"`0.1f` has no exact finite binary representation (0.1 in base 2 is a repeating fraction), so each addition carries a small rounding error, and ten accumulated roundings do not cancel back to exactly `1.0f`; on this toolchain the sum came out `1.000000119`, off from `1.0f` by exactly one `FLT_EPSILON`. The fix is comparing within a tolerance, `fabsf(a - b) < epsilon`, never `a == b`.","deep":"```c\n#include <stdio.h>\n#include <float.h>\n#include <math.h>\nint main(void) {\n    float sum = 0.0f;\n    for (int i = 0; i < 10; i++) sum += 0.1f;\n    float one = 1.0f;\n    printf(\"sum=%.9f one=%.9f equal=%d\\n\", sum, one, sum == one);\n    printf(\"diff=%.9f FLT_EPSILON=%.9f\\n\", fabsf(sum - one), FLT_EPSILON);\n    printf(\"close=%d\\n\", fabsf(sum - one) < 1e-6f);\n    return 0;\n}\n```\nCompiled and linked with `gcc -std=c11 -Wall -Wextra -o q11b q11b.c -lm`, prints `sum=1.000000119 one=1.000000000 equal=0`, `diff=0.000000119 FLT_EPSILON=0.000000119`, `close=1`.\n1. **Why 0.1f is inexact:** IEEE-754 binary floating point represents values as a sum of powers of two; `0.1` in base 2 is the repeating fraction `0.0001100110011...`, which cannot terminate in any finite number of mantissa bits, so the stored value is already the nearest representable float to 0.1, not 0.1 itself.\n2. **Why the error is exactly one FLT_EPSILON here:** `FLT_EPSILON` (7.19 no, actually `<float.h>`, C11 5.2.4.2.2) is defined as the difference between 1 and the next representable float greater than 1; accumulating ten roundings of a value near 0.1 happened, on this toolchain and rounding mode, to land exactly one representable step above `1.0f`, which is a plausible, though not standard-guaranteed, outcome of repeated rounding.\n3. **Why == is the wrong tool:** floating-point equality only holds when the bit patterns are identical, and after any chain of arithmetic involving non-exactly-representable values, expecting bit-for-bit equality with a separately-computed value is almost always the wrong expectation; the standard tolerance-based comparison (`fabsf(a - b) < some_epsilon`) is the idiom for this reason.\n4. **Choosing the tolerance is context-dependent:** `1e-6f` worked here because the error was on the order of `FLT_EPSILON` itself; a computation involving larger magnitudes or more accumulated operations needs a tolerance scaled to the magnitude of the values involved (relative error), not a single fixed absolute constant everywhere.\n- **Firmware relevance:** sensor fusion, calibration, and control-loop code that compares floating-point thresholds needs this tolerance discipline; a `==` comparison that \"happened to work\" in unit tests can fail intermittently once compiler, optimization level, or FPU rounding mode changes the exact accumulated error.","pitfall":"Comparing accumulated floating-point sums with == in test assertions. It works by accident on some builds and breaks on the next compiler or optimization-level change.","verify":"C11 5.2.4.2.2 (FLT_EPSILON definition) and Annex F for the IEEE-754 rounding model assumed here.","follow":[{"q":"Would using double instead of float make the sum exactly 1.0?","a":"It would reduce the error's magnitude by many orders of magnitude (doubles carry far more mantissa bits) but not eliminate it in general, since 0.1 is still not exactly representable in binary at any finite precision."},{"q":"Is FLT_EPSILON itself always the right tolerance to use?","a":"Only as a rough starting point; it is the gap right at 1.0, and the appropriate tolerance for values far from 1.0 should generally scale with the magnitude of the operands (relative epsilon), not stay fixed at FLT_EPSILON."}],"mod":11},{"id":"11.12","level":"Advanced","type":"Debug","fig":null,"tags":["shift-ub","bounds-check","fix"],"q":"A code reviewer flags `unsigned int bad_mask(int n) { return 1u << n; }`. What exactly is wrong, and how do you fix it?","short":"C11 6.5.7p3 says that if the shift count is negative or is greater than or equal to the width of the promoted left operand, the behavior is undefined; `bad_mask` never checks `n` against that range, so any caller passing `n < 0` or `n >= 32` (for a 32-bit `unsigned int`) triggers undefined behavior at the shift itself, not merely a wrong answer. The fix is an explicit range check before the shift, returning a defined sentinel (here, `0`) for out-of-range input.","deep":"```c\n#include <stdio.h>\nunsigned int bad_mask(int n) {\n    return 1u << n;\n}\nunsigned int fixed_mask(int n) {\n    if (n < 0 || n >= 32) return 0;\n    return 1u << n;\n}\nint main(void) {\n    printf(\"%u\\n\", bad_mask(5));\n    printf(\"%u\\n\", fixed_mask(31));\n    printf(\"%u\\n\", fixed_mask(32));\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra`, prints `32`, `2147483648`, `0`: `bad_mask(5)` happens to look correct for an in-range argument, `fixed_mask(31)` correctly returns the top bit set, and `fixed_mask(32)` correctly returns `0` instead of invoking the undefined shift `bad_mask(32)` would have performed.\n1. **The exact standard text:** 6.5.7p3, \"If the value of the right operand is negative or is greater than or equal to the width of the promoted left operand, the behavior is undefined.\" Width here means the full bit width of the type after integer promotion (32 for `unsigned int` on this target), not the precision or any smaller \"meaningful bits\" notion.\n2. **Why this bug is easy to miss in review:** `bad_mask(5)` (a typical in-range call) looks completely correct, and the function will keep looking correct through however many test cases happen to stay in range; the bug only manifests for a caller that passes a computed, possibly attacker- or configuration-influenced index that reaches 32 or higher, or a negative value from an unchecked subtraction.\n3. **Why 32, not 31, is the boundary:** shifting by exactly the type's bit width (32 for a 32-bit `unsigned int`) is undefined, matching \"greater than or equal to\"; shifting by 31 is the maximum defined shift amount, moving the single set bit into the sign-bit position of the underlying representation, which is fine since the type is unsigned.\n4. **The general defensive pattern**, useful anywhere a bit position or shift count is derived from external input (a protocol field width, a configuration value, a loop bound): validate the count against `[0, bit_width)` before shifting, exactly as `fixed_mask` does, rather than trusting the caller.","pitfall":"Testing only with small, obviously in-range shift counts and concluding the function is correct. The bug is invisible until an out-of-range count is actually exercised.","verify":"C11 6.5.7p3 (shift count range) confirmed against this target's 32-bit unsigned int width.","follow":[{"q":"Would gcc -fsanitize=undefined have caught a call to bad_mask(32) at runtime?","a":"Yes; shift-exponent range checking is one of the specific checks bundled in gcc's -fsanitize=undefined, and it would report a runtime error naming the exact operator and operand values, the same style of report seen for signed overflow in Module 10."},{"q":"Is 1u << 31 itself defined?","a":"Yes, 31 is one less than the 32-bit width, satisfying 6.5.7p3's bound exactly, and since the left operand is unsigned, there is no additional signed-overflow concern the way there would be for 1 << 31 on a signed int."}],"mod":11},{"id":"11.13","level":"Advanced","type":"Concept","fig":null,"tags":["arithmetic-shift","logical-shift","signed-vs-unsigned"],"q":"For the identical underlying bit pattern, why does a signed right shift give a different numeric result than an unsigned right shift?","short":"`-16` and `0xFFFFFFF0` are the same 32-bit pattern on a two's-complement target, but 6.5.7p5 gives them different shift semantics: shifting the unsigned value right is defined as the integer quotient `E1 / 2^E2` (a logical shift, filling with zeros), while shifting a negative signed value right is implementation-defined, and on this gcc/x86-64 toolchain it sign-extends (fills with ones), giving `-4` for the signed case versus `1073741820` for the unsigned case on the same bits.","deep":"```c\n#include <stdio.h>\nint main(void) {\n    int s = -16;\n    unsigned int u = 0xFFFFFFF0u;\n    printf(\"signed >>2 = %d\\n\", s >> 2);\n    printf(\"unsigned >>2 = %u\\n\", u >> 2);\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra`, prints `signed >>2 = -4` and `unsigned >>2 = 1073741820`.\n1. **Same bits, different rule applied:** both `s` and `u` hold the identical 32-bit pattern `1111 1111 1111 1111 1111 1111 1111 0000` on a two's-complement implementation; which shift rule (6.5.7p5's defined quotient, or its implementation-defined negative-value branch) applies is determined purely by the operand's declared type, not by the bit pattern itself.\n2. **The unsigned result, checked arithmetically:** `0xFFFFFFF0 = 4294967280`, and `4294967280 / 4 = 1073741820`, matching 6.5.7p5's \"integral part of the quotient of E1 / 2^E2\" exactly, with zeros filling the vacated high bits, a pure logical shift.\n3. **The signed result is this compiler's documented choice, not a universal rule:** gcc and clang both document (and essentially every mainstream target implements) an arithmetic right shift for negative signed values, filling with copies of the sign bit, which is why `-16 >> 2` gives `-4` (mathematically, `-16 / 4 = -4` exactly, though the standard does not phrase it as division for the negative case precisely because rounding direction on division and shifting can differ for values that do not divide evenly).\n4. **Why this distinction is a favorite interview probe:** it tests whether a candidate treats \"shift\" as one operation, or correctly separates it into \"logical shift\" (unsigned, or nonnegative signed, zero-fill) versus \"arithmetic shift\" (negative signed, implementation-defined fill), which is exactly the kind of type-driven semantic split C11 encodes throughout its bitwise-operator clauses.\n- **Practical guidance:** if a right shift must behave identically across every conforming compiler, perform it on an unsigned type; if a signed arithmetic shift's rounding-toward-negative-infinity behavior is specifically wanted, document the implementation-defined dependency explicitly rather than assuming it silently.","pitfall":"Assuming a right shift is \"just\" a fast divide by a power of two for signed values. It rounds toward negative infinity for negative operands under arithmetic shift, while integer division by a power of two truncates toward zero, so the two differ by one for negative, non-multiple dividends.","verify":"C11 6.5.7p5 (shift semantics for signed and unsigned operands) as implemented (arithmetic shift) by gcc/clang on x86-64.","follow":[{"q":"Does casting the signed value to unsigned before shifting make the result portable?","a":"Yes; (unsigned int)s >> 2 forces 6.5.7p5's defined quotient branch regardless of the original sign, at the cost of losing the sign-extension behavior if that was actually wanted."},{"q":"Is left shift affected by the same signed/unsigned split?","a":"Left shift has its own asymmetry (6.5.7p4): unsigned left shift is always defined as reduction modulo 2^width, while signed left shift is undefined the moment the mathematical result would not fit in the type, which is a stricter condition than simply \"shifting a negative value,\" covered in Module 10's overflow discussion."}],"mod":11},{"id":"11.14","level":"Advanced","type":"Cross-layer","fig":null,"tags":["byte-order","wire-format","portable-en
