 signature stability concerns apply to any array or set of function pointers a plugin boundary exposes; the struct is simply the common way to group and version them together, not the source of the ABI-stability requirement."}],"mod":12},{"id":"12.16","level":"Principal","type":"Debug","fig":null,"tags":["vtable-corruption","buffer-overflow","security"],"q":"A struct holding a fixed-size name buffer followed by a function pointer had its function pointer silently redirected to a different function after an unchecked copy into the name field. Reproduce and explain the mechanism.","short":"`widget_t` lays out an 8-byte `name` array immediately before a `void (*on_event)(void)` function pointer, with no padding between them on this target; a copy routine that writes more bytes into `name` than it holds, with no bounds check, overwrites `on_event`'s stored bytes with whatever followed the name data in the source, including, here, the address of a different function. The next call through `on_event` then executes that different function, not the one originally assigned.","deep":"```c\n#include <stdio.h>\n#include <string.h>\n#include <stddef.h>\n\ntypedef struct {\n    char name[8];\n    void (*on_event)(void);\n} widget_t;\n\nvoid safe_action(void) { printf(\"safe action ran\\n\"); }\nvoid dangerous_action(void) { printf(\"dangerous action ran (pointer was clobbered)\\n\"); }\n\nvoid set_name(widget_t *w, const unsigned char *src, size_t len) {\n    memcpy(w->name, src, len);   /* BUG: no bound check against sizeof(w->name) */\n}\n\nint main(void) {\n    printf(\"offsetof(on_event)=%zu sizeof(name)=%zu\\n\",\n           offsetof(widget_t, on_event), sizeof(((widget_t *)0)->name));\n\n    widget_t w;\n    w.on_event = safe_action;\n    printf(\"before overflow: \");\n    w.on_event();\n\n    void (*target)(void) = dangerous_action;\n    unsigned char payload[sizeof(w.name) + sizeof(w.on_event)];\n    memset(payload, 'A', sizeof w.name);\n    memcpy(payload + sizeof w.name, &target, sizeof target);\n\n    set_name(&w, payload, sizeof payload);\n\n    printf(\"after overflow: \");\n    w.on_event();\n    return 0;\n}\n```\nCompiled with `gcc -std=c11 -Wall -Wextra`, prints `offsetof(on_event)=8 sizeof(name)=8`, `before overflow: safe action ran`, `after overflow: dangerous action ran (pointer was clobbered)`, confirming both that `on_event` sits at exactly byte offset 8 with no padding on this target, and that overflowing `name` by exactly `sizeof(on_event)` bytes fully overwrites it with the attacker-chosen (here, deliberately constructed) function address.\n1. **The bug in `set_name` is the classic unchecked-length-copy pattern**: it trusts its `len` parameter completely, with no comparison against `sizeof(w->name)`, so any caller (or any externally-controlled length, such as one read from a network packet's header field) that supplies more bytes than the buffer holds writes past it into whatever memory follows, here the function pointer.\n2. **Why the exact byte count matters for a reliable demonstration**: this reproduction confirms via `offsetof` that there is no padding between `name` and `on_event` on this target (both are naturally 8-byte-aligned already), so a payload of exactly `sizeof(name) + sizeof(on_event)` bytes lands precisely on the boundary; a different struct layout, or a target with padding inserted for alignment, would need the exact overflow length recalculated, which is itself worth noting in a real review, since \"the overflow lands exactly on the function pointer\" is layout-dependent, not universal.\n3. **Why this is worse than an ordinary buffer overflow overwriting plain data**: corrupting an adjacent `int` produces a wrong value; corrupting an adjacent function pointer, when that pointer is later called, hijacks control flow to an address the attacker or the accidental overflow chose, which is precisely the mechanism behind classic function-pointer-overwrite security exploits, here reproduced with a benign, known target function for illustration rather than attacker-controlled shellcode.\n4. **The real fix is bounds-checking `set_name` itself**, not merely reordering the struct: `if (len > sizeof(w->name)) { /* truncate or reject */ }` before the `memcpy`, since reordering members only relocates which adjacent data gets corrupted, it does not remove the unchecked-copy root cause.\n5. **Defense in depth beyond the immediate fix**: placing security-sensitive function pointers in a separate, non-adjacent structure from any externally-influenced buffer, or validating lengths at the point data enters the system (the network or file boundary) rather than only inside each individual copy routine, reduces the blast radius even if one bounds check is missed elsewhere.\n- **This is the practical, worst-case version of the vtable-corruption risk hinted at in the earlier struct-of-function-pointers question**: there, the risk was calling with a mismatched (but still valid) context pointer; here, the function pointer itself is corrupted by an unrelated memory-safety bug, a distinct and more severe failure mode.","pitfall":"Fixing this specific reproduction by reordering the struct so name comes after on_event, declaring the bug solved. The unchecked-length copy is the actual defect; reordering only moves which neighboring data an overflow corrupts next.","verify":null,"follow":[{"q":"Would -fsanitize=address have caught this overflow?","a":"AddressSanitizer specifically instruments memory accesses and would likely catch memcpy writing past the bounds of a heap-allocated buffer of this size, though for a stack-local struct like widget_t here, whether it is caught depends on whether ASan's stack instrumentation covers this exact access pattern; either way, testing with -fsanitize=address is a reasonable first line of defense worth adding regardless of this specific reproduction's outcome."},{"q":"Is bounds-checking set_name sufficient, or should the struct layout also change?","a":"Bounds-checking the copy is the mandatory fix; changing the struct layout (for example, storing a length-prefixed or explicitly bounded string type) is a good additional hardening step but does not by itself fix a copy routine that ignores buffer size entirely."}],"mod":12},{"id":"12.17","level":"Principal","type":"Concept","fig":null,"tags":["vtable-vs-cpp","virtual-dispatch","compiler-internals"],"q":"How closely does the hand-written struct-of-function-pointers pattern in this module match what a C++ compiler actually generates for virtual dispatch?","short":"Extremely closely in mechanism: a typical C++ implementation gives each polymorphic class one hidden vtable, a static array of function pointers shared by every instance, and each object carries a hidden pointer to its class's vtable; calling a virtual function compiles to \"load the vtable pointer, load the function pointer from a fixed offset in it, call it,\" exactly the `obj.iface.method(&obj, ...)` shape this module built by hand, minus the compiler wiring it up automatically.","deep":"| Aspect | Hand-written C vtable (this module) | Typical C++ compiler-generated vtable |\n|---|---|---|\n| Vtable storage | One struct instance per implementation, built explicitly | One static array per class, generated by the compiler |\n| Object-to-vtable link | Caller passes ctx/self explicitly to each call | Hidden vptr member inserted at the start of the object, set by the constructor |\n| \"this\" parameter | Explicit void *self/ctx argument | Implicit this parameter, invisible in source, present in the generated calling convention |\n| Method call syntax | obj.iface.method(&obj, args) | obj.method(args), compiler inserts the vtable load and this |\n| Multiple inheritance | Not directly modeled; would need multiple embedded interface structs | Handled with additional vtables and pointer adjustment thunks, considerably more complex |\n\n- **Where the analogy is exact:** single inheritance, single-interface dispatch (one base class, one set of virtual functions) maps almost one-to-one onto this module's pattern; \"call the function at this offset in the vtable, passing the object as the first hidden argument\" is a fair description of both.\n- **Where C++ goes further than anything shown here:** multiple inheritance, virtual inheritance, and RTTI (`dynamic_cast`, `typeid`) all require additional bookkeeping (multiple vtables per object, vtable entries that are themselves adjustment thunks rather than plain function pointers) that a hand-rolled single-struct C vtable does not attempt to replicate; this module's pattern is a faithful model of the simple case, not a full reimplementation of C++'s object model.\n- **Compile-time versus runtime cost**: both the hand-written and compiler-generated versions pay one pointer-chase (or two, object to vtable, then vtable to function) per virtual/interface call, versus a direct call's zero indirection; this is why both C++ virtual functions and C-style vtables have a small but real per-call overhead compared to a plain function call, relevant when discussing performance trade-offs of either \"interface\"-shaped design.\n- **Why this comparison is a strong interview answer:** it demonstrates the candidate understands polymorphism is not \"a C++ feature\" conceptually but an implementation technique (indirect calls through a table of function pointers plus a per-instance state pointer) that C++ automates and C exposes by hand, which is exactly the kind of \"compiles down to\" understanding a Principal-level systems interview is probing for.","pitfall":"Describing C++ virtual dispatch as \"magic\" in an interview instead of naming the underlying vtable-and-vptr mechanism. Being able to describe it as \"the same pattern you just hand-built in C, generated automatically\" is a stronger answer.","verify":null,"follow":[{"q":"Does every C++ compiler use exactly this vtable-pointer-as-hidden-first-member layout?","a":"The general shape (a hidden vptr, a shared per-class vtable array) is close to universal among mainstream C++ implementations, but the exact layout details (vptr position, how multiple inheritance and virtual bases are represented) are governed by each platform's C++ ABI specification, not by the C++ standard itself, which deliberately leaves object layout unspecified."},{"q":"Is a hand-written C vtable ever actually faster than C++ virtual dispatch?","a":"Not fundamentally; both perform the same one or two pointer-chase indirections per call, so any real difference between a specific hand-written version and a specific compiler's generated code comes down to unrelated factors like inlining opportunities or struct layout, not the vtable mechanism itself."}],"mod":12},{"id":"13.01","level":"Basic","type":"Concept","fig":"buildpipeline","tags":["phases","preprocessor","linker"],"q":"What are the four phases that turn a .c file into an executable, and what does each one produce?","short":"Preprocess (macro/include expansion -> .i), compile (-> assembly .s), assemble (-> object code .o with symbols+relocations), link (resolve symbols across .o files and libraries -> executable). C11 5.1.1.2 describes this as translation phases 1-7 plus a final linking phase.","deep":"The standard (5.1.1.2) folds this into \"translation phases\", but toolchains expose it as four commands you can run by hand.\n\n- 1. Preprocess: `gcc -E hello.c -o hello.i` expands `#include`, macros, conditionals. Pure text in, pure text out.\n- 2. Compile: `gcc -S hello.i -o hello.s` turns C into target assembly. Type checking and diagnostics happen here.\n- 3. Assemble: `gcc -c hello.s -o hello.o` turns assembly into an ELF (or other) object file: machine code plus a symbol table and relocation entries for anything not yet resolved.\n- 4. Link: `gcc hello.o -o hello` resolves every external reference against other .o files and libraries, producing a runnable image (5.1.1.2's final bullet: \"all external object and function references are resolved\").\n\nReal run, on a file with one global `int gvar = 42;`:\n```c\n#include <stdio.h>\nint gvar = 42;\nint main(void) {\n    printf(\"gvar=%d\\n\", gvar);\n    return 0;\n}\n```\n`gcc -std=c11 -Wall -Wextra -E hello.c -o hello.i` produced a 547-line `.i` file (all of stdio.h's declarations pulled in). `nm hello.o` after assembling shows:\n```\n0000000000000000 D gvar\n0000000000000000 T main\n                 U printf\n```\n`D` = defined in `.data` (gvar is initialized and nonzero), `T` = defined in `.text` (main's code), `U` = undefined, to be resolved by the linker (printf lives in libc). Running the final binary prints `gvar=42`.","pitfall":"Assuming a clean compile means the program will link; compiling only checks phases 1-3, linking is a separate step that can still fail with unresolved symbols.","verify":"C11 5.1.1.2","follow":[{"q":"Why does gvar show up as D and not B (bss)?","a":"Because it has a nonzero initializer; only zero-initialized or uninitialized file-scope objects go in .bss, which does not take space in the object file."},{"q":"Can you skip straight from .c to .o?","a":"Yes, `gcc -c hello.c -o hello.o` runs all three earlier phases internally; the separate commands just make each stage's output visible."}],"mod":13},{"id":"13.02","level":"Basic","type":"Concept","fig":null,"tags":["translationunit","tus"],"q":"What is a translation unit, and why does a multi-file C program need the concept?","short":"A translation unit is one source file after preprocessing (all its #includes expanded inline). Each .c file is compiled into its own translation unit and object file independently; the linker is what stitches multiple translation units into one program.","deep":"C11 6.9p4 defines it exactly this way: \"the unit of program text after preprocessing is a translation unit, which consists of a sequence of external declarations.\"\n\n- Each `.c` file, plus everything its headers pull in, is compiled in isolation. The compiler for translation unit A has no visibility into translation unit B's local (`static`) names or its internal logic; it only sees what B's headers declare.\n- This is why a function defined in `b.c` and used in `a.c` needs a *declaration* visible to `a.c` (usually via a header), but the *definition* lives in exactly one translation unit.\n- A header is not itself a translation unit; it only becomes part of one when `#include`d into a `.c` file.\n- Practical consequence: two translation units can each define a `static` (file-scope, internal-linkage) function or variable with the same name with zero conflict, because internal linkage confines that identifier to its own translation unit (6.2.2p2).","pitfall":"Believing the compiler will catch a type mismatch between a function's definition in one .c file and a mismatched declaration in another; without a shared, correct header, that is left to the linker (which does not check types) or to whole-program tools like LTO.","verify":"C11 6.9 paragraph 4","follow":[{"q":"Does the compiler see across translation units during compilation?","a":"No; only the linker sees all of them together, and only at the level of external symbols, not full type information."},{"q":"What forces a rebuild of a translation unit?","a":"Any change to the .c file itself or to any header it (transitively) includes, since the preprocessed text changes."}],"mod":13},{"id":"13.03","level":"Basic","type":"Concept","fig":null,"tags":["errors","toolchain"],"q":"What is the practical difference between a compile-time error and a link-time error?","short":"A compile error means one translation unit is malformed on its own (syntax, type mismatch, undeclared identifier) and stops at phase 2. A link error means every translation unit compiled fine individually, but the linker could not make their external references agree: usually \"undefined reference\" (never defined anywhere) or \"multiple definition\" (defined more than once).","deep":"Compile errors are local: the compiler only needs the one translation unit (plus its headers) to detect them. Examples: `error: expected ';'`, `error: 'foo' undeclared`, `error: incompatible types`.\n\nLink errors are global: they only appear once the linker tries to unify symbol references across every object file and library on the command line. The two classic ones:\n\n- Undefined reference: some `.o` has a `U` (undefined) entry in `nm` for a symbol that no other `.o` or library defines. Compiling that `.o` alone succeeded because a *declaration* (prototype) satisfied the compiler; only the linker actually requires the *definition* to exist.\n- Multiple definition: two translation units both provide an external definition for the same identifier. C11 6.9p5 requires exactly one external definition program-wide for an identifier that is used; providing two is a constraint the linker (not the compiler) enforces.\n\nA useful mental model: the compiler enforces C's syntax and type rules one file at a time; the linker enforces C's *linkage* rules (6.2.2) across the whole program.","pitfall":"Treating \"it compiled\" as \"it is correct\"; a header/definition mismatch across translation units is invisible to both the compiler and the (typeless) linker.","verify":null,"follow":[{"q":"Can a program compile every file individually but never link?","a":"Yes, that is the normal case for any program split across files: each .o compiles fine, and linking is where cross-file symbol resolution is checked."},{"q":"Does the linker check function signatures?","a":"No; C object files carry no type information for functions, only names, so a mismatched declaration/definition pair link successfully and misbehave at runtime instead of being caught."}],"mod":13},{"id":"13.04","level":"Intermediate","type":"Concept","fig":null,"tags":["linkage","extern","static"],"q":"How do extern and static at file scope control which symbols a translation unit exposes to the linker?","short":"A file-scope declaration with no storage-class specifier, or with extern, has external linkage: the same identifier in another translation unit refers to the same object/function, and the linker must find exactly one definition. static at file scope gives internal linkage: the identifier is private to that translation unit, so other files can reuse the same name with no clash (C11 6.2.2).","deep":"Two files, `a.c` and `b.c`:\n```c\n/* a.c */\nstatic int counter = 0;   /* internal linkage: private to a.c */\nint shared_total = 100;   /* external linkage: visible elsewhere */\nvoid bump(void) { counter++; shared_total += counter; }\n```\n```c\n/* b.c */\nextern int shared_total;  /* declaration only, refers to a.c's definition */\nvoid bump(void);\nint main(void) { bump(); bump(); return 0; }\n```\nAfter compiling both and running `nm`:\n```\na.o: 0000000000000000 T bump\n     0000000000000000 b counter        <- lowercase b: local symbol, .bss\n     000000000000002e T report\n     0000000000000000 D shared_total   <- uppercase D: global, .data\nb.o:                  U bump\n                       U shared_total\n```\nLowercase letters (`b`, `t`, `d`) in `nm` output mean internal linkage; uppercase (`B`, `T`, `D`) mean external. `counter` cannot collide with a same-named symbol in another file; `shared_total` must be defined exactly once program-wide or the link fails.\n\n`extern` on a declaration does not create storage; it only asserts \"this identifier is defined somewhere with external linkage\" (6.2.2p4-5). The actual reservation of storage happens at the one file-scope definition.","pitfall":"Forgetting `static` on a file-scope helper function or global meant to be private, which silently exposes it as an external symbol and risks a multiple-definition clash if another translation unit picks the same name.","verify":"C11 6.2.2 paragraphs 2-5","follow":[{"q":"What happens if b.c also writes `int shared_total;` instead of `extern int shared_total;`?","a":"It becomes a second (tentative) definition of the same external identifier; whether that links depends on the compiler's -fcommon setting, see 13.08."},{"q":"Does a function declared with no storage-class specifier default to internal or external linkage?","a":"External; 6.2.2p5 says a function identifier with no storage-class specifier is linked exactly as if declared extern."}],"mod":13},{"id":"13.05","level":"Intermediate","type":"Debug","fig":null,"tags":["multipledefinition","headers"],"q":"Linking two files that both #include the same header fails with \"multiple definition of `config_flag'\". What is wrong with the header, and how do you fix it?","short":"The header defines a global variable (int config_flag = 0;) instead of only declaring one. Every .c file that includes it gets its own external definition, so linking two or more of them violates the one-external-definition rule (C11 6.9p5). Fix: declare `extern int config_flag;` in the header, and put the one real definition (with initializer) in exactly one .c file.","deep":"Reproduced exactly:\n```c\n/* bad_hdr.h */\nint config_flag = 0;   /* BAD: a definition, not a declaration */\n```\n```c\n/* x.c */          #include \"bad_hdr.h\"\nint main(void) { return config_flag; }\n/* y.c */          #include \"bad_hdr.h\"\nvoid touch(void) { config_flag = 1; }\n```\nCompiling `x.o` and `y.o` each succeeds. Linking them gives exactly this real error:\n```\n/usr/bin/ld: y.o:(.bss+0x0): multiple definition of `config_flag';\nx.o:(.bss+0x0): first defined here\ncollect2: error: ld returned 1 exit status\n```\nEach translation unit's `#include` re-pastes the same defining declaration in, so both `x.o` and `y.o` carry their own external definition of `config_flag` -- exactly the situation 6.9p5 forbids for an identifier that is used in an expression.\n\nThe fix separates declaration from definition:\n```c\n/* good_hdr.h */\nextern int config_flag;   /* declaration: no storage, just a promise */\n```\n```c\n/* config.c */\nint config_flag = 0;      /* the one and only definition */\n```\nNow every other `.c` file includes `good_hdr.h` to get the declaration, and only `config.c` provides the definition, satisfying \"exactly one external definition\" program-wide.","pitfall":"Defining any non-const object in a header without extern; every translation unit that includes the header re-defines it, which either fails to link or (with -fcommon) silently merges into one shared object depending on compiler defaults, see 13.08.","verify":"C11 6.9 paragraph 5","follow":[{"q":"Would making config_flag `static` in the header fix it?","a":"It changes the symptom (each translation unit gets its own private copy with internal linkage, no link error) but breaks the intent of sharing one flag across files; every file would see its own independent flag."},{"q":"Why does the error mention `.bss` here even though the source wrote `= 0`?","a":"The compiler folds an explicit zero-initializer for a file-scope object into the same zero-initialized section as an uninitialized one; it is still a full external definition either way."}],"mod":13},{"id":"13.06","level":"Intermediate","type":"Numeric","fig":null,"tags":["objectfile","sizes","sections"],"q":"`size hello.o` on the module 13.01 example prints `text 140  data 4  bss 0  dec 144`. What does each column mean, and why is data exactly 4 and bss exactly 0?","short":"text/data/bss are byte counts of the object file's .text (code), .data (initialized globals), and .bss (zero/uninitialized globals) sections; dec is their sum. data=4 because the single global `int gvar = 42;` is a 4-byte nonzero-initialized int, which must be stored in the file; bss=0 because there are no zero-initialized or uninitialized globals in that translation unit.","deep":"`readelf -S hello.o` on the real object file lists, among others:\n```\n[1] .text     PROGBITS  ... size 0x8c (offset shown, size in later column)\n[3] .data     PROGBITS  ...\n[4] .bss      NOBITS    ...\n[5] .rodata   PROGBITS  ...\n```\nand `size hello.o` reduces that to the classic three-column summary:\n```\n   text    data     bss     dec     hex filename\n    140       4       0     144      90 hello.o\n```\n- .text (140 bytes here): the machine code for `main`'s prologue, the call to `printf`, and epilogue. It is read-only and shared between all processes running the binary.\n- .data (4 bytes): storage for `gvar`. It occupies real space in the file because the linker/loader must reproduce the value 42, not just zero it.\n- .bss (0 bytes here): would hold zero-initialized or uninitialized file-scope objects (per the tentative-definition rule, C11 6.9.2p2, they behave as if initialized to 0). NOBITS means the section takes no space *in the file*; the loader just zero-fills that many bytes in memory at load time. This program declares none, so it is 0.\n- dec = text + data + bss = 144, the total memory footprint size contributed by this object's loaded segments (excluding read-only string/constant data in .rodata, which `size` does not fold in by default).\n\nThis is the numeric reason \"put large lookup tables as `static const`\" matters for firmware: a `static const` array lands in `.rodata` (flash, read-only, shareable) while a non-const zero-initialized array lands in `.bss` (RAM the loader must zero at startup) and a non-const initialized array lands in `.data` (RAM the loader must copy from flash at startup) -- three different costs for what looks like the same declaration with one keyword changed.","pitfall":"Reading `size`'s dec column as \"the binary's disk footprint\"; .bss contributes to the runtime memory image but not to file bytes, so a program with a huge zero-initialized static buffer can have a tiny file yet need a large amount of RAM at load.","verify":"C11 6.9.2 paragraph 2","follow":[{"q":"Where would `static const char msg[] = \"hi\";` be counted?","a":"In .rodata, not .data or .bss, since it is both initialized and read-only; `size` does not include .rodata in its text/data/bss triple, so it would not show up in any of the three printed numbers at all."},{"q":"If gvar were `int gvar;` with no initializer instead?","a":"bss would become 4 and data would go back to 0, since an uninitialized file-scope int is a tentative definition that resolves to a zero-initialized .bss entry (C11 6.9.2p2)."}],"mod":13},{"id":"13.07","level":"Intermediate","type":"Concept","fig":null,"tags":["objectfile","symboltable","nm"],"q":"What does a .o file actually contain, and what do nm's single-letter symbol codes mean?","short":"An object file holds machine code and data organized into sections (.text, .data, .bss, .rodata, ...), plus a symbol table (name, section, linkage) and relocation entries for every reference the compiler could not resolve on its own. nm prints one line per symbol table entry; the letter shows its section and linkage: uppercase = external linkage, lowercase = internal (file-local).","deep":"Common `nm` letters worth memorizing for interview whiteboard use:\n\n| Letter | Meaning |\n|---|---|\n| T / t | defined in .text (code); uppercase external, lowercase static |\n| D / d | defined in .data (initialized global); uppercase external, lowercase static |\n| B / b | defined in .bss (zero/uninitialized global); uppercase external, lowercase static |\n| U | undefined: referenced here, defined elsewhere (the linker must supply it) |\n| R / r | defined in .rodata (read-only constant data) |\n| W / w | weak symbol: a definition the linker may silently replace with a strong one |\n\nA relocation entry is a note to the linker: \"at this byte offset in .text, patch in the final address of symbol X once you know it.\" That is why `objdump -r hello.o` shows entries tying specific instruction bytes back to symbols like `printf`; the compiler emitted a placeholder address, and the linker (or, for a shared library, the loader) fills in the real one.\n\nConcretely, `readelf -s hello.o` for the module 13.01 example lists `main` and `gvar` as `GLOBAL DEFAULT <section>` entries with real byte sizes, and `printf` as `GLOBAL UND` (undefined) -- the same information `nm` summarizes with its letter codes.","pitfall":"Assuming `nm` output on a stripped binary or a fully linked executable looks the same as on a `.o`; a final executable's local symbols and relocation info are often discarded, and `nm`/`strip` behavior differs from the intermediate object file stage.","verify":null,"follow":[{"q":"Why does a static function still appear in nm output?","a":"Its symbol is still needed by the assembler/linker within its own translation unit (for jumps/calls) and for debuggers; it is just marked local (lowercase) so no other translation unit can reference it by name."},{"q":"Does a .o file know its final load address?","a":"No; addresses are typically 0 or placeholders in a relocatable object file (as seen in the `nm` output above), finalized only when the linker (static) or loader (shared library) assigns real addresses."}],"mod":13},{"id":"13.08","level":"Intermediate","type":"Trap","fig":null,"tags":["tentativedefinition","fcommon"],"q":"Two files each write plain `int config_flag;` (no initializer) at file scope via a shared header, with no extern anywhere. Does that link?","short":"Depends on the compiler's -fcommon default. Modern GCC (10+) defaults to -fno-common: it fails with \"multiple definition\", since each file's uninitialized int is a full definition. With -fcommon (the old Unix default), the linker merges both \"common\" symbols into one and it links fine. C11 6.9p5 disallows two external definitions once the identifier is used; the merging behavior is a tolerated extension, not standard-guaranteed.","deep":"Verified on this toolchain (GCC 13, `-std=c11 -Wall -Wextra`), same two files as in 13.05 but *without* an initializer:\n```c\n/* bad_hdr2.h */\nint config_flag;   /* no initializer: a tentative definition (C11 6.9.2) */\n```\nDefault flags:\n```\n$ gcc -c x3.c -o x3.o && gcc -c y3.c -o y3.o && gcc x3.o y3.o -o link3\n/usr/bin/ld: y3.o:(.bss+0x0): multiple definition of `config_flag';\nx3.o:(.bss+0x0): first defined here\n```\nAdding `-fcommon` at compile time changes what kind of symbol `nm` reports:\n```\n$ gcc -fcommon -c x3.c -o x4.o\n$ nm x4.o | grep config_flag\n0000000000000004 C config_flag        <- C: common symbol, mergeable\n$ gcc -fcommon x4.o y4.o -o link4 && ./link4 ; echo $?\n0\n```\nWith `-fcommon`, an uninitialized file-scope int becomes a *common* symbol (`C` in `nm`), and the linker is explicitly allowed to merge multiple common definitions of the same name into one shared storage location -- this is the classic \"K&R common symbol\" behavior that predates strict ODR-style enforcement, and it is what C11 6.9.2p2's tentative-definition wording is describing at the level of a single translation unit (and many linkers historically extended across translation units too). GCC changed its *default* to `-fno-common` in version 10 specifically because this merging masks real bugs (accidentally declaring the same global in two unrelated files).\n\nThe moral for an interview: never rely on this. Always give exactly one file-scope definition with an initializer, and `extern` declarations everywhere else, as in 13.05's fix.","pitfall":"Writing what looks like \"just a global declaration\" (`int x;`) in a shared header and assuming every compiler treats accidental duplication the same way; the actual outcome depends on a compiler flag whose default has changed across toolchain versions.","verify":"C11 6.9.2 paragraph 2; gcc -fcommon/-fno-common default per GCC 10 release notes","follow":[{"q":"Would an explicit `int config_flag = 0;` in both files show the same -fcommon-dependent behavior?","a":"No; an explicit initializer makes it an external definition immediately (6.9.2p1), not a tentative one, so it is a hard multiple-definition error regardless of -fcommon."},{"q":"Is relying on -fcommon portable across compilers?","a":"No; it is a GCC/linker convenience rooted in traditional Unix toolchains, not something the C standard promises, so code depending on it can fail to link with a different compiler or a newer GCC default."}],"mod":13},{"id":"13.09","level":"Intermediate","type":"Concept","fig":null,"tags":["make","incrementalbuild"],"q":"What does a Makefile's rule graph actually orchestrate, and how does it decide what to rebuild?","short":"Each rule says \"this target depends on these files; run this recipe if the target is missing or older than any dependency.\" make compares file modification timestamps and only re-runs recipes for out-of-date targets, so touching one .c file recompiles just that file (and re-links), not the whole project.","deep":"A minimal real Makefile:\n```\nprog: a.o b.o\n\t$(CC) $(CFLAGS) a.o b.o -o prog\na.o: a.c\n\t$(CC) $(CFLAGS) -c a.c -o a.o\nb.o: b.c\n\t$(CC) $(CFLAGS) -c b.c -o b.o\n```\nFirst `make` run compiles both files and links:\n```\ngcc ... -c a.c -o a.o\ngcc ... -c b.c -o b.o\ngcc ... a.o b.o -o prog\n```\nTouching only `a.c` and re-running `make` produces exactly:\n```\ngcc ... -c a.c -o a.o\ngcc ... a.o b.o -o prog\n```\n`b.o` is untouched: `make` saw that `b.o` is newer than `b.c`, so `b.c -> b.o`'s rule is already satisfied. It only recompiled `a.o` (because `a.c` is now newer than `a.o`), then re-ran the link rule because `prog`'s dependency `a.o` just changed.\n\nThis is the entire mechanism behind \"incremental builds\": a directed graph of file dependencies plus a timestamp comparison, nothing more magical. Getting the dependency list wrong (a common bug: forgetting that `a.o` also depends on any header `a.c` includes) means `make` will not know to rebuild `a.o` when only a header changes -- the classic \"stale build\" bug fixed in real projects by compiler-generated `.d` dependency files.","pitfall":"Relying only on explicit .c-to-.o rules without header dependency tracking; editing a widely-included header silently leaves stale .o files that make believes are up to date.","verify":null,"follow":[{"q":"Why does the link step re-run even though prog.c itself does not exist?","a":"Because prog's own rule lists a.o and b.o as prerequisites, and a.o's timestamp just changed, making prog older than one of its prerequisites."},{"q":"What is missing from this toy Makefile that a real one needs?","a":"Automatic header dependency tracking (e.g. gcc -MMD generating .d files) so that changing a shared header also triggers recompilation of every .c that includes it."}],"mod":13},{"id":"13.10","level":"Advanced","type":"Concept","fig":null,"tags":["staticlinking","dynamiclinking","sharedlibrary"],"q":"What actually changes between static linking and dynamic (shared-library) linking, and at what point does each one happen?","short":"Static linking copies the needed library code into the executable at build time; the file is self-contained and its size grows accordingly. Dynamic linking leaves a reference (a needed .so name plus exported symbol names) in the executable and defers loading and resolving that code until the program starts (or first calls into it), via the dynamic loader; multiple running programs can then share one physical copy of the library in memory.","deep":"Real demonstration: a one-function shared library.\n```c\n/* libmath2.c */\nint triple(int x) { return x * 3; }\n```\nBuilt with `gcc -fPIC -shared -o libmath2.so libmath2.o`, then a program linked against it with `gcc usemath.o -L. -lmath2 -o dynprog`.\n\n`nm -D libmath2.so` (dynamic symbol table only) shows:\n```\n00000000000010f9 T triple\n```\n`ldd ./dynprog` (with the .so on the library path) shows the dependency the loader must satisfy before `main` runs:\n```\nlibmath2.so => ./libmath2.so (0x00007fa140337000)\n```\nRunning it prints `21` (triple(7)), confirming the call actually crosses the shared-library boundary correctly. Comparing file sizes for a statically-linked \"hello world\" versus this dynamically-linked program in this environment came out nearly identical (~16000 bytes) at this tiny scale, because the real weight difference only shows up with a library much bigger than libc's already-shared startup code; the size argument for dynamic linking matters at the scale of, say, linking against a multi-megabyte library used by many processes on one system.\n\nPractically:\n- Build time: static linking resolves every symbol now, and the result runs with no further dependency lookups. Dynamic linking leaves symbol names in the binary for the loader to resolve later.\n- Load/start time: the dynamic loader (`ld.so` on Linux) must find every `.so` listed (`ldd` shows exactly this list), map it into the process, and patch call sites to the resolved addresses (see 13.15 for the PLT/GOT mechanism doing that patching).\n- Update story: replacing a shared library file updates every program that dynamically links it, without rebuilding them (this is also the ABI-break risk in 13.18); a statically linked program needs a full rebuild to pick up a fix.\n- Memory: multiple processes using the same .so can share its code pages in physical memory; statically linked copies cannot.","pitfall":"Assuming a dynamically linked program is guaranteed to run unchanged after a library upgrade; a shared library update that silently changes a function's behavior or ABI breaks every program depending on the old contract, see 13.18.","verify":null,"follow":[{"q":"Why is -fPIC needed to build the shared library here?","a":"Position-independent code has no hard-coded absolute addresses, so the same physical code pages can be mapped at a different virtual address in every process that loads the library."},{"q":"Does the C standard mandate any of this?","a":"No; static/dynamic linking, .so files, and the dynamic loader are operating-system and toolchain concepts, not part of ISO C, which only requires that \"library components are linked to satisfy external references\" (5.1.1.2) without saying how."}],"mod":13},{"id":"13.11","level":"Advanced","type":"Concept","fig":null,"tags":["inline","linkage","externinline"],"q":"In C11, what is the real difference between static inline, plain inline, and extern inline on a function defined in a shared header, and why does only one of them reliably link?","short":"static inline gives the function internal linkage: every translation unit that includes it gets its own private copy, and there is never a symbol clash, which is why it is the safe default for header-defined helpers. Plain inline (no static, no extern) is an inline definition only: C11 6.7.4p7 says it \"does not provide an external definition\", so if no translation unit anywhere also provides one, every call becomes an unresolved external reference and the program fails to link.","deep":"Real test, two translation units including the same header each way.\n\n`static inline` version (`infl.h`: `static inline int sq(int x) { return x * x; }`), included by `p1.c` and `p2.c`:\n```\n$ nm p1.o | grep sq\n0000000000000000 t sq\n$ nm p2.o | grep sq\n0000000000000000 t sq\n$ gcc p1.o p2.o -o pstatic && ./pstatic\n9 16\n```\nTwo independent local (`t`, lowercase) copies, no clash, links and runs fine.\n\nPlain `inline` version (`infl2.h`: `inline int sq2(int x) { return x * x; }`), included the same way by `q1.c` and `q2.c`:\n```\n$ nm q1.o | grep sq2\n                 U sq2\n$ nm q2.o | grep sq2\n                 U sq2\n$ gcc q1.o q2.o -o pinline\n/usr/bin/ld: q1.o: in function 'use2':\nq1.c:(.text+0xe): undefined reference to 'sq2'\n/usr/bin/ld: q2.o: in function 'main':\nq2.c:(.text+0x13): undefined reference to 'sq2'\n```\nBoth `.o` files show `sq2` as `U` (undefined) -- the compiler treated the plain-`inline` definition as usable only for inlining calls *within* that translation unit's own emitted code path, and (per 6.7.4p7) did not also emit a callable external definition. Since no third translation unit supplies `extern inline int sq2(int x) { ... }` (which is exactly the escape hatch the standard describes for providing the one external definition an inline function needs when it is not always inlined away), every call falls through to an unresolved reference.\n\nThe practical rule for header-only helpers: use `static inline`. Reach for plain `inline` (paired with one `extern inline` definition in a single .c file) only when deliberately building the classic \"inline in headers, one real definition in one .c file for whichever translation unit needs an address-of or a non-inlined call\" pattern, which is easy to get wrong.","pitfall":"Assuming inline by itself behaves like C++'s inline (which does imply a mergeable, always-available external definition); in C11 it does not, and swapping static inline for plain inline in a widely-included header can turn a working build into a wall of \"undefined reference\" errors.","verify":"C11 6.7.4 paragraph 7","follow":[{"q":"Why did the static inline version show a lowercase t and still work across two files with the identical function body?","a":"Internal linkage means each translation unit's copy is a separate entity by definition (6.2.2p2); nothing requires them to be merged, so duplicate private copies of a small helper are completely normal and cheap."},{"q":"What extra declaration would make the plain-inline version link?","a":"Adding a definition with the extern specifier (extern inline int sq2(int x) {...}) in exactly one translation unit gives the program the one external definition C11 6.7.4p7 says an inline function needs when it is not defined with extern anywhere."}],"mod":13},{"id":"13.12","level":"Advanced","type":"Debug","fig":null,"tags":["undefinedreference","linkererror"],"q":"A build fails with `undefined reference to 'compute_checksum'`. Walk through how you would root-cause it.","short":"The symbol has a declaration (so the compiler accepted the call) but no definition anywhere on the link line. Check in order: is the defining .c file actually compiled and passed to the final link command; is the function accidentally static in the file that defines it; is the name mismatched by a typo or a macro-guarded branch; and, for a library, is it listed on the link line in the right position relative to the objects that need it (13.13).","deep":"A systematic checklist, cheapest checks first:\n\n1. Confirm the symbol name exactly: `nm your_object.o | grep compute_checksum` on the .o you expect to define it. If it does not appear at all, that file was never compiled with the code you think it has, or was not recompiled after being edited (a stale-build problem, see 13.09's dependency tracking note).\n2. Check for accidental internal linkage: if `nm` shows a lowercase `t compute_checksum` in the defining file instead of uppercase `T`, someone marked it `static`, making it invisible outside that translation unit -- remove `static` or add a proper non-static entry point.\n3. Confirm the defining .o is actually on the final link command line: it is common in growing Makefiles/CMake setups for a new .c file to compile fine (producing a valid .o) but never get added to the list of objects passed to the final `gcc ... -o prog` invocation.\n4. Check link order for libraries: if `compute_checksum` lives in a static library (`.a`), it must appear *after* the object file that calls it on the command line (see 13.13); listing it first means the linker never pulls that member in.\n5. Check for a name mismatch introduced by conditional compilation: a `#ifdef` that compiles a different function name on this platform, or a typo that only shows up as a mismatch between a header declaration and the .c definition (which the compiler cannot catch, since C has no cross-file type checking for this, see 13.03).\n\nEach step is directly checkable with `nm`/`objdump` on the real object files and the actual link command, rather than guessing.","pitfall":"Chasing this as if it were a compiler problem (re-checking headers and prototypes) when the actual cause is a build-system issue: the defining .c file was never added to the link command, or a library is in the wrong position.","verify":null,"follow":[{"q":"Would a missing #include of the function's prototype header cause this exact error?","a":"No, that would usually be a compile-time warning/error (implicit declaration) or, if it compiled anyway, a type mismatch; \"undefined reference\" specifically means the compiler was satisfied but the linker found no definition."},{"q":"Does the error tell you which translation unit is missing the definition, or just that no one supplied it?","a":"Just the latter; the linker only reports the reference site(s) that needed the symbol and the fact that nothing on the link line defined it, so locating the intended definition is on you."}],"mod":13},{"id":"13.13","level":"Advanced","type":"Trap","fig":null,"tags":["staticlibrary","linkorder","ar"],"q":"You link against two static libraries where liba.a needs a symbol from libb.a, using `gcc main.o -la -lb -o prog`. It works. Why does `gcc -la -lb main.o -o prog` (same libraries, different position) fail with an undefined reference to a function that is clearly inside liba.a?","short":"A traditional Unix linker scans the command line left to right and, on hitting a static library, pulls in only the archive members needed by *undefined references it already has* at that point, then discards the rest of that library from consideration. Objects and libraries providing needed symbols must come after the things that reference those symbols; putting -la -lb before main.o means the linker has no outstanding references yet when it scans the archives, so it pulls nothing from either.","deep":"Real, reproducible example. `funcb.o` defines `funcb`; `funca.o` calls `funcb` and defines `funca`; `mainprog.o` calls `funca`. Archived as `liba.a` (contains funca.o) and `libb.a` (contains funcb.o).\n```\n$ gcc mainprog.o -L. -la -lb -o prog_ok && ./prog_ok\n11\n$ gcc -L. -la -lb mainprog.o -o prog_bad\n/usr/bin/ld: mainprog.o: in function 'main':\nmainprog.c:(.text+0xe): undefined reference to 'funca'\n```\nIn the working command, the linker processes `mainprog.o` first, which creates an outstanding undefined reference to `funca`. It then scans `liba.a`, finds `funca` there, pulls that member in (which in turn creates a new outstanding reference to `funcb`), then scans `libb.a` and resolves that too. Every reference is satisfied by something appearing later on the command line.\n\nIn the failing command, `liba.a` and `libb.a` are scanned first, while there are zero outstanding references (nothing has asked for `funca` or `funcb` yet), so the linker takes nothing from either archive and moves on. By the time it reaches `mainprog.o` and discovers it needs `funca`, both archives have already been scanned and, for a traditional one-pass linker, are not revisited.\n\nThe general rule: on the link command line, list libraries *after* the objects (and other libraries) that need their symbols, and list a library that itself depends on another library *before* that other library (so `-la -lb` when a needs b, not `-lb -la`). For a true circular dependency between two static libraries, repeating a library (`-la -lb -la`) or using `-Wl,--start-group ... --end-group` forces the linker to rescan.","pitfall":"\"Fixing\" a link-order failure by blindly repeating every library on the command line instead of understanding the dependency direction; it works by accident and hides a build script that will break again the next time a new circular or reordered dependency is introduced.","verify":null,"follow":[{"q":"Would this same ordering problem happen with regular .o files instead of .a archives?","a":"No; plain object files (not inside an archive) are always fully included in the link regardless of position, only archive member selection is order-sensitive."},{"q":"Why does a modern linker not just fix this automatically?","a":"Some linkers (e.g. gold, or GNU ld with certain flags) support smarter multi-pass or as-needed resolution, but the traditional single-pass left-to-right behavior is still the portable assumption interviewers expect you to know and reason about."}],"mod":13},{"id":"13.14","level":"Advanced","type":"Concept","fig":null,"tags":["namemangling","extern-c"],"q":"Why does linking a C library from C++ require extern \"C\", when linking two C files never needs anything like it?","short":"C has no overloading, so a C compiler emits a function's own name (implementation-defined leading underscore aside) as its linker symbol. C++ supports overloading, so a C++ compiler \"mangles\" parameter types into the symbol name; extern \"C\" tells the C++ compiler to emit the plain, unmangled C-style name instead, so it matches what the C object file or library actually exports.","deep":"This is purely a toolchain/ABI convention, not something C11 specifies (ISO C has one function namespace per translation unit and no overloading, so it never needed a mangling scheme). It matters for this module because it is the single most common real-world linking failure when C and C++ object files meet: a C++ translation unit calling a C function declared without `extern \"C\"` looks for a mangled symbol like `_Z6triplei`, while the C object file exports the plain name `triple`, and the link fails with an undefined reference even though the function objectively exists.\n\nThis is why C library headers meant to be usable from C++ wrap their declarations:\n```c\n#ifdef __cplusplus\nextern \"C\" {\n#endif\nint triple(int x);\n#ifdef __cplusplus\n}\n#endif\n```\nNo such wrapping is ever needed between two C translation units, because both sides already agree on the same simple, unmangled naming convention by default.","pitfall":"Assuming any two toolchains agree on how a C function name reaches the linker; a leading underscore or symbol-name convention is implementation-defined, and mixing compilers or object formats across platforms can trip on this even in pure C.","verify":null,"follow":[{"q":"Does this affect data symbols (variables) the same way?","a":"Yes; a global variable declared in a C++ translation unit without extern \"C\" also gets a mangled or namespace-qualified name and will not match a plain C definition."},{"q":"Is name mangling part of the C11 standard?","a":"No; it is entirely a C++ compiler/ABI concept (and differs between C++ compilers on some platforms), while C11 only defines linkage (external/internal/none), not any name-encoding scheme."}],"mod":13},{"id":"13.15","level":"Advanced","type":"Cross-layer","fig":null,"tags":["plt","got","dynamicloading"],"q":"When a dynamically linked program calls a function that lives in a shared library, how does that call actually reach the right address, given that the .so's load address is not known until runtime?","short":"The compiler emits the call through a small stub (the Procedure Linkage Table, PLT) instead of a direct address. The PLT stub jumps through an entry in the Global Offset Table (GOT), a per-process table of addresses that the dynamic loader fills in (often lazily, on first call) once it knows where each shared library actually got mapped. This indirection is what lets the same position-independent .so code (13.10) work at a different address in every process.","deep":"This is operating-system/ABI machinery sitting on top of what C itself guarantees, so treat it as background rather than a standards citation.\n\n- At compile time (with -fPIC), a call to a function that might live in a shared library is compiled as a call to a PLT stub at a fixed offset within the executable's own code, not a call to the function's real address (which is not known yet).\n- The PLT stub loads an address from a corresponding GOT slot and jumps there. Initially (with lazy binding, the traditional default), that GOT slot points back into the dynamic loader's resolver code.\n- The first time that function is actually called, the resolver looks up the real symbol address in the loaded .so (this is the step `ldd`/`nm -D` are previewing statically: which .so, which exported symbol), writes the real address into the GOT slot, and jumps to it. Every subsequent call through the same PLT stub now jumps straight to the GOT slot's now-correct address, skipping the resolver.\n- This is exactly why 13.10's `nm -D libmath2.so` step (listing exported dynamic symbols) and `ldd`'s dependency list are the two pieces of information the loader needs at this point: which library to map, and which symbol names inside it are valid jump targets.\n\nFor firmware/embedded interview purposes, the point worth stating unprompted: this indirection is real runtime overhead (an extra memory load and jump on first call, then one extra load thereafter) compared to a statically linked call, which is one reason latency-critical or very small embedded images often prefer static linking or link-time-resolved calls entirely.","pitfall":"Assuming a dynamically linked call has identical performance to a statically linked one; the extra indirection is small but nonzero, and matters when profiling a tight, latency-sensitive loop that happens to cross a shared-library boundary.","verify":null,"follow":[{"q":"Is PLT/GOT part of the C standard?","a":"No; it is an ELF/ABI mechanism used by common Linux and Unix-like loaders, entirely outside what C11 specifies about linking."},{"q":"What does \"lazy binding\" trade off against?","a":"It defers resolution cost to first-use (faster process startup when many library functions are never called), at the cost of a slightly slower first call to each one and a security surface (GOT-overwrite based exploits) that hardened builds sometimes disable via full RELRO/eager binding."}],"mod":13},{"id":"13.16","level":"Principal","type":"Scenario","fig":null,"tags":["odr","headerdesign"],"q":"Two translation units each #include the same header, but through different preprocessor conditions the header ends up defining a non-static, non-inline function with two different bodies for the same name. What actually happens when you try to link this, and what should you have done instead?","short":"This is not silently \"resolved\" by picking one version: both are full external definitions of the same ordinary function name, so the linker reports a plain multiple-definition error, just like 13.05 and 13.08's variable case but for a function symbol. The fix is to never define an ordinary function inside a header: declare it there, and give it exactly one definition, in exactly one .c file, regardless of build configuration.","deep":"Verified reproduction: a header whose body depends on a macro define.\n```c\n/* oops.h */\n#ifdef VARIANT_B\nint clamp(int x) { return x > 10 ? 10 : x; }\n#else\nint clamp(int x) { return x > 5 ? 5 : x; }\n#endif\n```\n`u1.c` includes it as-is; `u2.c` does `#define VARIANT_B` before including it. Compiling both succeeds independently. Linking:\n```\n/usr/bin/ld: u2.o: in function 'clamp':\nu2.c:(.text+0x0): multiple definition of 'clamp'; u1.o:u1.c:(.text+0x0): first defined here\n```\nThis is a reassuring result for an interview to be able to state precisely: an ordinary function symbol is never \"common\"/mergeable the way an uninitialized variable can be under -fcommon (13.08); the linker always treats two full function bodies with the same external name as a hard error, so this particular class of mistake fails loudly rather than silently picking whichever definition happened to link first. (Contrast this with a truly dangerous version of the same mistake: if the two variants were compiled into *separate shared libraries* loaded by the same process, or one side used `static`/weak-symbol tricks to suppress the clash, the wrong body actually can win silently -- which is why symbol visibility and versioning, 13.17-13.18, matter for real shared-library design.)\n\nWhat should have been done: never put an executable function body in a header guarded by build-configuration macros. Put the two variants in separate .c files (`clamp_variant_a.c`, `clamp_variant_b.c`) selected at build time by which file the Makefile compiles, or make the branch a runtime `if` inside one always-compiled function, and keep the header to a single declaration.","pitfall":"Assuming a multiple-definition link failure here is a false alarm because \"the header is fine, it is just conditional\"; the compiler and linker are correctly reporting the two constructs the header actually can be turned into.","verify":"C11 6.9 paragraph 5","follow":[{"q":"Would marking both variants static have avoided the link error?","a":"Yes, each would become a private internal-linkage copy per translation unit with no cross-file clash, but that reintroduces the real danger: two translation units silently running logically different code under the same function name with no diagnostic at all."},{"q":"Is this scenario covered by a specific standard clause?","a":"Yes, the same one as 13.05's variable case: C11 6.9 paragraph 5 requires exactly one external definition for an identifier that is used, and this is a function identifier violating it."}],"mod":13},{"id":"13.17","level":"Principal","type":"Concept","fig":null,"tags":["abi","visibility","sharedlibrary"],"q":"You are designing a shared library that a firmware validation tool will load at runtime. What linking-level choices matter for keeping its ABI stable, and how would you enforce them?","short":"Decide which symbols are the public API and hide everything else (mark internal helpers static, or build with -fvisibility=hidden and export only the intended entry points); version the exported symbol set so old and new builds can be told apart; and never change an exported function's signature or a shared struct's layout without bumping that version, since old callers keep calling by name/offset, not by recompiled knowledge of the new layout.","deep":"Concretely, the choices a Principal-level design review should call out unprompted:\n\n- Default visibility is wrong for a library: without `-fvisibility=hidden` (or per-symbol `static`), every non-static function and global in the library is a dynamic symbol (visible in `nm -D`, as seen in 13.10), which means internal helper functions become part of the accidental public ABI, and any future rename of one is technically a breaking change for anyone who (mis)used it.\n- Explicit exports: build the small, intended API surface with an explicit export mechanism (a version script listing exported names, or `__attribute__((visibility(\"default\")))` on just those functions) and leave the rest hidden. This directly narrows what 13.15's PLT/GOT resolution machinery, and any external tool inspecting the .so, ever sees.\n- ABI stability across a struct passed by pointer across the library boundary: adding a field in the middle, or changing a field's type, silently breaks every caller compiled against the old header without a rebuild (the classic embedded-firmware \"who owns which struct layout\" bug); the safe pattern is either an opaque pointer (caller never sees the struct's layout, only calls accessor functions) or appending new fields only at the end plus a version/size field the caller passes in.\n- Symbol versioning: giving exported symbols explicit version tags (the same mechanism glibc uses) lets the library ship a new, incompatible implementation of a function under the old name for old callers, while new callers linking against the new version get the new behavior, without either side needing a rebuild it does not already need.\n\nThe failure mode this whole design is defending against is exactly 13.18's scenario: swap in a new .so, and every program that dynamically links it inherits whatever changed, whether or not that program was rebuilt to expect it.","pitfall":"Treating \"it compiles and links against the new .so\" as proof the ABI is intact; a mismatched struct layout, an accidentally-renamed internal helper someone else's code was calling, or a changed function signature can all link and then corrupt data or crash at runtime, with no linker diagnostic at all.","verify":null,"follow":[{"q":"Why is an opaque pointer safer than exposing a struct's layout across a shared-library boundary?","a":"Because the caller never bakes the struct's field offsets into its own compiled code; only the library's own functions (compiled together with the struct definition) ever touch its fields directly, so the library is free to change the layout in a new version."},{"q":"What is the one-sentence version of \"why hide internal symbols\"?","a":"Every exported symbol is a promise you have to keep in every future release; hiding everything except the deliberate API keeps that promise small."}],"mod":13},{"id":"13.18","level":"Principal","type":"Scenario","fig":null,"tags":["abi","debugging","sharedlibrary"],"q":"A device previously running fine starts crashing (or silently corrupting data) immediately after only one shared library file on the target was swapped for a \"compatible\" update, with no other code changed. How do you diagnose this as a linking/ABI problem rather than a fresh logic bug?","short":"Treat it as an ABI-mismatch investigation, not a new-bug hunt: diff the old and new .so's exported symbols (nm -D, readelf --dyn-syms) for anything renamed, resized, or reordered; check whether any struct shared across the boundary changed layout; and check whether the caller was ever rebuilt against a matching header. The caller still calls by name/offset against an assumption baked in at its own build time, and only the library's binary content changed.","deep":"A concrete diagnostic sequence for this exact situation:\n\n1. Confirm it really is the library swap, not a coincidence: revert to the old .so on a spare unit and confirm the crash disappears; this isolates the variable to exactly one file.\n2. Diff the exported symbol tables: `nm -D old.so > old.syms; nm -D new.so > new.syms; diff old.syms new.syms`. A symbol that disappeared, or changed from a function to something else, or gained/lost a version suffix, is an immediate suspect (this is the same table 13.10 and 13.17 build directly on).\n3. Check for a struct layout change across the boundary: if the library and the caller both compile against a shared header defining a struct passed by value or by pointer, confirm both were built from the *identical* header revision; a field added, removed, reordered, or resized in that struct between the two .so builds is the single most common silent-corruption cause, because the caller's already-compiled code keeps using the old field offsets against the new library's differently-laid-out data.\n4. Check the caller was not, in fact, supposed to be rebuilt: \"compatible update\" claims are only as good as the versioning discipline in 13.17; if the new .so bumped a symbol version or changed a documented struct, the caller needed a matching rebuild and simply was not given one.\n5. If the symbol tables and struct layout actually match, move on to a normal logic-bug investigation inside the new library's changed code, using the debugging techniques in module 16, rather than continuing to suspect linking.\n\nStating this sequence unprompted, in this order (fastest and least invasive checks first, matching your own knowledge of what 13.10/13.15/13.17 actually change at the binary level) is what distinguishes a Principal-level answer from \"add some printf statements and see.\"","pitfall":"Spending debugging time inside the caller's unchanged source code, because \"nothing else was touched,\" when the actual defect is a binary-compatibility break introduced entirely by the library update.","verify":null,"follow":[{"q":"Would rebuilding the calling program have caught this ahead of time?","a":"Only if it was rebuilt against the new library's current header/version at the same time the new .so was deployed; the entire failure mode exists because the caller's binary was not rebuilt when the library's binary changed."},{"q":"Is this fundamentally a linker problem or a process/discipline problem?","a":"Process/discipline; the linker and loader did exactly what they were told (resolve these names dynamically), the missing piece is a versioning and compatibility contract that was not actually honored by the update."}],"mod":13},{"id":"14.01","level":"Basic","type":"Concept","fig":null,"tags":["stdio","buffering"],"q":"What are the three stdio buffering modes, and when does each one actually flush to the destination?","short":"Unbuffered: each character is intended to appear as soon as possible. Line buffered: a block is transmitted when a newline is written (or when input is needed on that or an unbuffered stream). Fully buffered: a block is transmitted only when the buffer fills. C11 7.21.3p7 says stdin/stdout are fully buffered unless the stream can be determined not to refer to an interactive device; stderr starts out not fully buffered.","deep":"C11 7.21.3p3-7 defines these modes and who gets which by default. In practice: a terminal-attached stdout is usually line buffered by the C library, a stdout redirected to a file or pipe becomes fully buffered, and stderr is unbuffered (or at least never fully buffered) so diagnostics show up immediately even if the process crashes right after.\n\nReal, reproducible demonstration of why this matters: same program, same four calls, run with stdout and stderr merged into one file (`./buf2 > merged.txt 2>&1`):\n```c\nprintf(\"stdout-1\\n\");\nfprintf(stderr, \"stderr-1\\n\");\nprintf(\"stdout-2\\n\");\nfprintf(stderr, \"stderr-2\\n\");\n```\nOutput, because stdout is fully buffered (not a tty) and only flushes at program exit, while stderr writes immediately:\n```\nstderr-1\nstderr-2\nstdout-1\nstdout-2\n```\nForcing stdout unbuffered with `setvbuf(stdout, NULL, _IONBF, 0);` before the same four calls produces the order the source suggests:\n```\nstdout-1\nstderr-1\nstdout-2\nstderr-2\n```\nNothing about the program's logic changed; only the buffering mode did. `setvbuf`'s three mode macros are exactly `_IOFBF` (fully buffered), `_IOLBF` (line buffered), `_IONBF` (unbuffered), per 7.21.5.6.","pitfall":"Debugging with interleaved printf/fprintf(stderr, ...) calls and trusting their on-screen order when output has been redirected to a file or pipe; the order you see on a terminal can be completely different once buffering mode changes.","verify":"C11 7.21.3 paragraphs 3 and 7; 7.21.5.6","follow":[{"q":"Does fflush(stdout) fix the reordering without changing the buffering mode?","a":"Yes; inserting fflush(stdout) after each printf forces that block out immediately regardless of mode, at the cost of losing the performance benefit of buffering."},{"q":"Why is stderr special-cased?","a":"So that diagnostic and error output remains useful even if the process aborts right after printing it, before a full buffer would otherwise have been flushed."}],"mod":14},{"id":"14.02","level":"Basic","type":"Concept","fig":null,"tags":["ctype","ub"],"q":"Why do ctype.h functions like isalpha take an int instead of a char, and what breaks if you pass a plain (possibly negative) char directly?","short":"C11 7.4p1 requires the argument's value to be representable as an unsigned char or equal EOF; passing any other value is undefined behavior. On a platform where plain char is signed, a byte with the high bit set (e.g. 0xE9) becomes a negative int when passed as char, which is a value outside that allowed range unless explicitly cast to unsigned char first.","deep":"Real demonstration:\n```c\nchar c = (char)0xE9;                 /* signed char: value is -23 on this platform */\nprintf(\"c as int = %d\\n\", c);        /* -23 */\nisalpha(c);                          /* UB per 7.4p1: -23 is not representable as\n                                         unsigned char and is not EOF */\nisalpha((unsigned char)c);           /* correct: promotes 0xE9 = 233, a valid unsigned char */\n```\nOn this toolchain (glibc), both calls happened to return 0 with no crash, because glibc's ctype lookup table is deliberately built with extra entries covering the negative-index range as a long-standing compatibility accommodation. That is an implementation choice, not a standard guarantee: 7.4p1 leaves the behavior undefined for the un-cast call, and a different C library, a hardened build, or a different negative value is free to read out-of-bounds memory or misclassify the character.\nThe fix is always the same one-line cast: wrap the argument in `(unsigned char)` before passing it to any ctype.h function, every time the source value could be a plain (possibly signed) char.","pitfall":"Writing isalpha(*p) on a plain char * without a cast; it works by accident on most bytes and breaks specifically on high-bit-set bytes on signed-char platforms, which is exactly the kind of bug that only shows up with certain input data.","verify":"C11 7.4 paragraph 1","follow":[{"q":"Why does EOF (typically -1) get a special exemption in the rule?","a":"Because these functions are commonly fed the direct return value of getchar()/fgetc(), which is an int already carrying either a valid unsigned char value or EOF, so the standard explicitly allows EOF through without requiring a cast."},{"q":"Is this the same underlying mistake as the ctype/plain-char issue seen anywhere else on this page?","a":"Yes, in spirit it is the same class of bug as any signed/unsigned mismatch at a library boundary; the specific fix here is always casting to unsigned char before the call."}],"mod":14},{"id":"14.03","level":"Basic","type":"Concept","fig":null,"tags":["memcpy","memmove"],"q":"What is the actual difference between memcpy and memmove's contracts, and why does it matter for overlapping buffers?","short":"memcpy (7.24.2.1) copies n bytes from src to dst and is undefined behavior if the two objects overlap. memmove (7.24.2.2) copies as if src were first copied into a temporary buffer, so it is explicitly defined and correct for overlapping regions. Use memmove whenever the source and destination might overlap, such as shifting elements within one array.","deep":"Real test shifting a 20-byte buffer left by 2 (a classic in-place array-shift pattern):\n```c\nchar a[20] = \"0123456789ABCDEFGHI\";\nchar b[20] = \"0123456789ABCDEFGHI\";\nmemmove(a, a + 2, 10);   /* defined: overlap is explicitly handled */\nmemcpy(b, b + 2, 10);    /* UB per 7.24.2.1: src and dst overlap */\n```\nOn this toolchain both produced the identical, correct-looking result `23456789ABABCDEFGHI`, because this glibc's memcpy implementation happened to copy in a direction that tolerates this particular overlap and size. That is exactly the danger the standard is warning about: it is undefined, not \"always visibly wrong\". A different libc version, a different size, a vectorized/SIMD memcpy that copies in chunks, or a more aggressive compiler optimization pass are all free to produce silently corrupted data for the same overlapping memcpy call, and the bug would only show up on some platforms or after a toolchain upgrade.\nThe rule for firmware code doing any kind of in-place buffer shift, ring-buffer wraparound copy, or struct-field shuffling: if there is any chance the two ranges overlap, use memmove, never memcpy, regardless of what today's specific compiler happens to get away with.","pitfall":"\"It worked when I tested it\" is not evidence that an overlapping memcpy is safe; the standard's undefined behavior classification means correctness is not guaranteed across compiler versions, optimization levels, or platforms even when today's specific test passes.","verify":"C11 7.24.2.1 paragraph 2; 7.24.2.2 paragraph 2","follow":[{"q":"Does memmove cost more than memcpy?","a":"It can, since a general memmove implementation may need to check overlap direction and possibly copy through a scratch area or copy backwards, though many libc implementations optimize the common cases well."},{"q":"Is strcpy safe on overlapping strings?","a":"No, the standard's string functions generally share this same undefined-on-overlap restriction unless a function's own description says otherwise, exactly as memcpy's does."}],"mod":14},{"id":"14.04","level":"Intermediate","type":"Concept","fig":null,"tags":["qsort","bsearch","contract"],"q":"What exactly do qsort and bsearch require from the comparator function, and what do they leave unspecified?","short":"The comparator returns negative, zero, or positive for \"less than, equal to, greater than\" between its two const void * arguments (cast to the real element type first), consistently across all pairs. C11 7.22.5.2p4 leaves the relative order of elements that compare equal unspecified after qsort, and 7.22.5.1p4 leaves which matching element bsearch returns unspecified when duplicates exist.","deep":"Both functions (`stdlib.h`) take `void *base, size_t nmemb, size_t size, int (*compar)(const void *, const void *)`. Neither knows anything about the actual element type; all type safety is the caller's responsibility inside the comparator.\n\n`bsearch` additionally requires the array to already be sorted according to that same comparator (7.22.5.1p3): \"the array shall consist of: all the elements that compare less than, ... equal to, ... greater than the key object, in that order,\" which is a precondition, not something bsearch checks.\n\nDuplicate-key demonstration, real run:\n```c\nint arr[] = { 1, 3, 5, 5, 5, 7, 9 };\nint key = 5;\nint *hit = bsearch(&key, arr, 7, sizeof(int), cmp_int);\n/* found 5 at index 3 */\n```\nIndex 3 (the middle of the three 5s here) is simply what this particular implementation's binary-search midpoint math landed on; 7.22.5.1p4 explicitly says which one is unspecified, so code must never depend on getting \"the first\" or \"the last\" matching element from bsearch.","pitfall":"Assuming qsort is a stable sort; two elements that compare equal can end up in either relative order, which breaks code that relies on \"first-inserted wins\" tie-breaking without an explicit tie-break field in the comparator.","verify":"C11 7.22.5.1 paragraph 4; 7.22.5.2 paragraph 4","follow":[{"q":"What happens if the comparator is inconsistent (a < b and b < a both report true for the same pair)?","a":"The standard's precondition is violated, so qsort's/bsearch's result is unspecified in a much stronger sense: the array may not end up sorted at all, and bsearch may miss an element that is actually present."},{"q":"Can qsort's element size differ from sizeof of the actual element type?","a":"It must not; passing a mismatched size silently corrupts memory since qsort moves size bytes per swap regardless of what type those bytes actually hold."}],"mod":14},{"id":"14.05","level":"Intermediate","type":"Debug","fig":null,"tags":["qsort","comparator","overflow"],"q":"A qsort comparator written as `return *(const int*)a - *(const int*)b;` sorts most arrays correctly but produces obviously wrong order on some inputs. What is the bug, and how do you fix it?","short":"Subtracting two ints for the comparator can itself signed-overflow (undefined behavior) when the two values are far enough apart, e.g. one near INT_MAX and one near INT_MIN; the wrapped/UB result can have the wrong sign, making qsort misplace elements. Fix: compare with `(x > y) - (x < y)`, which never overflows.","deep":"Real, reproducible failure:\n```c\nint bad_cmp(const void *a, const void *b) {\n    return *(const int *)a - *(const int *)b;      /* BUG */\n}\nint good_cmp(const void *a, const void *b) {\n    int x = *(const int *)a, y = *(const int *)b;\n    return (x > y) - (x < y);                       /* correct */\n}\nint arr1[] = { 2000000000, -2000000000, 0 };\nint arr2[] = { 2000000000, -2000000000, 0 };\nqsort(arr1, 3, sizeof(int), bad_cmp);\nqsort(arr2, 3, sizeof(int), good_cmp);\n```\nActual output on this toolchain:\n```\nbad_cmp  result: 2000000000 -2000000000 0     <- unsorted!\ngood_cmp result: -2000000000 0 2000000000     <- correctly ascending\n```\n`2000000000 - (-2000000000)` is `4000000000`, which does not fit in a 32-bit signed int (max is `2147483647`); the subtraction is signed overflow, which C11 leaves undefined (module 10's territory), and in practice wraps to a negative number here, so the comparator reports \"2000000000 is less than -2000000000\", corrupting the sort.\n`(x > y) - (x < y)` only ever produces `1`, `0`, or `-1` from two boolean comparisons, so it is correct for the full range of int with no overflow risk, and is the idiomatic, safe comparator body for any qsort/bsearch on a numeric type.","pitfall":"Writing a - b as a shortcut for a three-way comparator on any signed integer type; it is a common idiom that is only safe when the value range is known to be small enough that the subtraction cannot overflow.","verify":"C11 7.22.5.2 (qsort); overflow behavior per module 10 / 6.5 paragraph 5 (signed integer overflow is undefined)","follow":[{"q":"Would casting to a wider type before subtracting also fix it?","a":"Yes, e.g. `(long)x - (long)y` avoids the overflow for any int values since long is guaranteed wide enough, but the branchless (x > y) - (x < y) form works for any comparable type without needing to reason about a wider type's range."},{"q":"Does -Wall/-Wextra catch this bug?","a":"No; it compiles cleanly with both flags, since signed overflow in a subtraction is not something GCC's warnings flag by default (module 10 and 16 cover -fsanitize=undefined, which does catch it at runtime)."}],"mod":14},{"id":"14.06","level":"Intermediate","type":"Concept","fig":null,"tags":["strncpy","pitfall"],"q":"What does strncpy(dst, src, n) actually guarantee about null-termination, and how does that differ from what most people assume?","short":"If src (including its terminator) is shorter than n, strncpy copies it and then pads the rest of dst with zero bytes up to n, so dst is null-terminated. If src's length is n or more, strncpy copies exactly n bytes and writes no terminator at all, leaving dst potentially not null-terminated. Most misuse assumes strncpy always produces a proper C string.","deep":"Real demonstration, both cases:\n```c\nchar dst[8];\nmemset(dst, 'X', sizeof dst);\nstrncpy(dst, \"hi\", sizeof dst);      /* src shorter than n */\n/* dst bytes: 68 69 00 00 00 00 00 00  -> \"hi\" then zero padding, safely terminated */\n\nchar dst2[4];\nstrncpy(dst2, \"abcdef\", sizeof dst2);  /* src longer than n */\n/* dst2 bytes: 'a' 'b' 'c' 'd' -- no NUL byte anywhere in dst2 */\n```\nGCC's own `-Wstringop-truncation` warning fires exactly on the second call: `'strncpy' output truncated copying 4 bytes from a string of length 6`, which is the compiler correctly flagging this exact contract gap; it is expected here, not a defect to silence, since it is demonstrating the real behavior.\n\nThe zero-padding behavior (when src is shorter) is also a hidden performance trap: strncpy always writes all n bytes of dst regardless of how short src is, so calling it with a small src and a large n wastes time zeroing bytes nobody asked for, unlike strlcpy-style alternatives (not standard C) or a manual bounded copy.\n\nThe safe, portable pattern for \"copy into a fixed buffer and guarantee termination\" in standard C11 is to size the write with `snprintf(dst, sizeof dst, \"%s\", src)` (14.16 covers exactly this substitution for sprintf-family calls), or to always follow strncpy with an explicit `dst[n-1] = '\\0';`.","pitfall":"Using strncpy expecting it to behave like \"strcpy but bounded and always safely terminated\"; it is bounded, but termination is only guaranteed when the source already fits with room to spare.","verify":"strncpy's zero-pad and non-termination contract, C11 7.24.2.4","follow":[{"q":"Why does strncpy behave this way instead of always guaranteeing termination?","a":"It was originally designed for fixed-width, not-necessarily-terminated fields (like old Unix directory entries), and the string.h family's names predate the safer conventions expected today."},{"q":"Is strncat safer?","a":"No, it has
