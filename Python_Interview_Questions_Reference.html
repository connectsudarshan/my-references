 keeps its local variables and position between `next()` calls."]], "pitfall": "Putting validation at the top of a generator function. It does not run until the first `next()`, so errors appear far from the call; validate in a normal wrapper function that returns the generator.", "follow": [["What does `inspect.getgeneratorstate` show?", "One of `GEN_CREATED`, `GEN_RUNNING`, `GEN_SUSPENDED`, `GEN_CLOSED`."], ["Can a generator run forever?", "Yes, infinite generators are common; the consumer decides when to stop (e.g. `islice`)."]], "output": "generator\nstart\n3\ndone\n[2, 1]", "num": 182, "sectionTitle": "Iterators, Generators & Comprehensions"}, {"section": 9, "level": "Moderate", "question": "Generator expression vs list comprehension?", "answer": "`(x for x in ...)` is lazy: it produces items on demand and uses constant memory. `[x for x in ...]` builds the whole list immediately. Use generator expressions for aggregations (`sum`, `any`, `max`) or one-pass streaming.", "code": "import sys\nlst = [x * x for x in range(1_000_000)]\ngen = (x * x for x in range(1_000_000))\nprint(sys.getsizeof(lst), sys.getsizeof(gen))\nprint(sum(x * x for x in range(1_000_000)))", "terms": [["Generator expression", "`(expr for x in it)`: lazy, one-shot, constant memory."]], "pitfall": "Using a generator expression and then calling `len()` or indexing on it. Generators support neither; use a list if you need them.", "follow": [["When can you omit the extra parentheses?", "When the generator is the sole argument of a call: `sum(x * x for x in xs)`."], ["Is a genexp always faster for `sum`?", "Not always; for small inputs `sum([...])` can be slightly faster. The genexp wins on memory for large inputs."]], "output": "8448728 208\n333332833333500000", "num": 183, "sectionTitle": "Iterators, Generators & Comprehensions"}, {"section": 9, "level": "Moderate", "question": "What does `yield from` do?", "answer": "It delegates to a sub-iterator: yields all its values (and forwards `send()`/`throw()`), and evaluates to the sub-generator's return value. It simplifies recursive generators and generator composition.", "code": "def read_files(*files):\n    for f in files:\n        yield from f.splitlines()\ndef walk(tree):\n    yield tree[\"name\"]\n    for child in tree.get(\"children\", []):\n        yield from walk(child)\nprint(list(read_files(\"a\\nb\", \"c\")))\nprint(list(walk({\"name\": \"root\", \"children\": [{\"name\": \"x\", \"children\": [{\"name\": \"y\"}]}, {\"name\": \"z\"}]})))", "terms": [["Delegating generator", "A generator that hands control to a sub-generator with `yield from`."]], "pitfall": "Writing `for x in sub(): yield x` when `sub` returns a value or needs `send()`. The loop drops the return value and does not forward `send`/`throw`; use `yield from`.", "follow": [["How do you write a recursive tree walk with it?", "`def walk(node): yield node; for c in node.children: yield from walk(c)`."], ["How did `yield from` relate to early asyncio?", "Before `async`/`await` (3.5), coroutines were generators using `yield from`."]], "output": "['a', 'b', 'c']\n['root', 'x', 'y', 'z']", "num": 184, "sectionTitle": "Iterators, Generators & Comprehensions"}, {"section": 9, "level": "Difficult", "question": "What are `send()`, `throw()` and `close()` on generators?", "answer": "`gen.send(value)` resumes the generator and makes the paused `yield` expression evaluate to `value` (first call must be `send(None)` or `next`). `throw(exc)` raises inside the generator at the `yield`. `close()` raises `GeneratorExit` so `finally` blocks run.", "code": "def running_avg():\n    total = count = 0\n    avg = None\n    try:\n        while True:\n            value = yield avg\n            total += value; count += 1\n            avg = total / count\n    finally:\n        print(\"cleanup\")\ng = running_avg(); next(g)\nprint(g.send(10), g.send(20), g.send(60))\ng.close()", "terms": [["Priming", "Advancing a new generator to its first `yield` with `next(gen)` (or `send(None)`) before sending values."], ["`GeneratorExit`", "Raised inside the generator by `close()`; the generator must not yield after catching it."]], "pitfall": "Catching `GeneratorExit` (or a bare `except:`) and yielding again. `close()` then raises `RuntimeError: generator ignored GeneratorExit`.", "follow": [["What does `send(x)` return?", "The next value the generator yields."], ["When is `close()` called automatically?", "When the generator object is garbage-collected while suspended."]], "output": "10.0 15.0 30.0\ncleanup", "num": 185, "sectionTitle": "Iterators, Generators & Comprehensions"}, {"section": 9, "level": "Moderate", "question": "What does `enumerate` do?", "answer": "Wraps an iterable to yield `(index, item)` pairs, with an optional `start`. It replaces `range(len(x))` loops.", "code": "for i, name in enumerate([\"riya\", \"arjun\", \"meera\"], start=1):\n    print(f\"{i}. {name}\")", "terms": [["`start`", "Keyword argument setting the first index, such as `enumerate(xs, start=1)`."]], "pitfall": "Iterating `for i in range(len(xs)):` and then `xs[i]`. It is slower and less clear, and it does not work for iterables without indexing.", "follow": [["How do you enumerate in reverse?", "`reversed(list(enumerate(xs)))`, or compute indices with `zip(range(len(xs)-1, -1, -1), reversed(xs))`."], ["Is `enumerate` lazy?", "Yes, it returns an iterator."]], "output": "1. riya\n2. arjun\n3. meera", "num": 186, "sectionTitle": "Iterators, Generators & Comprehensions"}, {"section": 9, "level": "Moderate", "question": "What does `zip` do, and what happens with unequal lengths?", "answer": "`zip` pairs items from several iterables and stops at the **shortest**. `strict=True` (3.10+) raises `ValueError` on mismatch; `itertools.zip_longest` pads instead. `zip(*rows)` transposes.", "code": "from itertools import zip_longest\nnames, scores = [\"a\", \"b\", \"c\"], [90, 80]\nprint(list(zip(names, scores)), list(zip_longest(names, scores, fillvalue=0)))\nprint(list(zip(*[(1, 2, 3), (4, 5, 6)])))\ntry:\n    list(zip(names, scores, strict=True))\nexcept ValueError as e:\n    print(\"ValueError:\", e)", "terms": [["`zip_longest`", "From `itertools`; pads shorter inputs with `fillvalue`."]], "pitfall": "Zipping two lists that should have equal length, and silently losing data when one is shorter. Use `strict=True` to fail loudly.", "follow": [["How do you unzip a list of pairs?", "`a, b = zip(*pairs)` (the results are tuples)."], ["How do you iterate over consecutive pairs?", "`itertools.pairwise(xs)` (3.10+)."]], "output": "[('a', 90), ('b', 80)] [('a', 90), ('b', 80), ('c', 0)]\n[(1, 4), (2, 5), (3, 6)]\nValueError: zip() argument 2 is shorter than argument 1", "num": 187, "sectionTitle": "Iterators, Generators & Comprehensions"}, {"section": 9, "level": "Moderate", "question": "Name the most useful `itertools` functions.", "answer": "- Infinite: `count`, `cycle`, `repeat`\n- Slicing/filtering: `islice`, `takewhile`, `dropwhile`, `filterfalse`, `compress`\n- Combining: `chain`, `zip_longest`, `product`, `pairwise` (3.10), `batched` (3.12)\n- Grouping/aggregating: `groupby`, `accumulate`, `tee`\n- Combinatorics: `permutations`, `combinations`, `combinations_with_replacement`", "code": "from itertools import accumulate, pairwise, product, combinations, islice, count, batched\nprint(list(accumulate([5, 3, 8])), list(pairwise(\"abcd\")))\nprint(list(product(\"AB\", [1, 2])), list(combinations(\"abc\", 2)))\nprint(list(islice(count(10, 5), 4)), list(batched(range(7), 3)))", "terms": [["`batched`", "(3.12+) Splits an iterable into tuples of size n; 3.13 adds `strict=True`."], ["`accumulate`", "Running totals (or any binary function) over an iterable."]], "pitfall": "Using `itertools.tee` on a large iterator and consuming one copy fully before the other. `tee` buffers every item in between, so memory grows to the whole input.", "follow": [["How many items does `permutations(range(10))` produce?", "10! = 3,628,800, which is why these functions are lazy."], ["What is `product` useful for?", "Nested loops without nesting: `product(xs, ys)` or `product(range(2), repeat=n)` for bit patterns."]], "output": "[5, 8, 16] [('a', 'b'), ('b', 'c'), ('c', 'd')]\n[('A', 1), ('A', 2), ('B', 1), ('B', 2)] [('a', 'b'), ('a', 'c'), ('b', 'c')]\n[10, 15, 20, 25] [(0, 1, 2), (3, 4, 5), (6,)]", "num": 188, "sectionTitle": "Iterators, Generators & Comprehensions"}, {"section": 9, "level": "Moderate", "question": "What is lazy evaluation and why does it matter?", "answer": "Values are computed only when needed. Generators, `range`, `map`, `filter`, `zip`, dict views and file iteration are lazy. It saves memory, allows infinite sequences, and lets pipelines stop early.", "code": "from itertools import count\ndef expensive(n):\n    print(f\"computing {n}\"); return n * n\nfirst_big = next(x for x in map(expensive, count(1)) if x > 10)\nprint(\"result:\", first_big)", "terms": [["Pipeline", "Chained lazy stages (read, filter, transform) that process one item at a time."]], "pitfall": "A lazy pipeline over a file that is closed before the pipeline is consumed (returning a generator from inside a `with` block). Consumption then fails with `ValueError: I/O operation on closed file`.", "follow": [["Is `range` an iterator?", "No, it is a lazy sequence: it supports `len`, indexing and multiple iterations."], ["How do you force evaluation?", "Wrap with `list()`, `tuple()`, or consume in a loop."]], "output": "computing 1\ncomputing 2\ncomputing 3\ncomputing 4\nresult: 16", "num": 189, "sectionTitle": "Iterators, Generators & Comprehensions"}, {"section": 9, "level": "Difficult", "question": "Why can a generator only be iterated once, and how do you work around it?", "answer": "A generator is an iterator: once exhausted it stays empty. Wrap it in a class whose `__iter__` creates a new generator each time (an iterable), materialize it into a list, or use `itertools.tee` (which buffers).", "code": "gen = (x for x in range(3))\nprint(sum(gen), sum(gen))\nclass Squares:\n    def __init__(self, n): self.n = n\n    def __iter__(self): return (x * x for x in range(self.n))\ns = Squares(3)\nprint(sum(s), sum(s))", "terms": [["Re-iterable", "An object whose `__iter__` returns a fresh iterator each time."]], "pitfall": "Checking whether a generator is empty with `if gen:`. Generator objects are always truthy; use `first = next(gen, sentinel)`.", "follow": [["How do you peek at the first item without losing it?", "`first = next(it)` then `itertools.chain([first], it)`."], ["Is caching all items in a list a valid workaround?", "Yes, when the data fits in memory: `items = list(gen)`."]], "output": "3 0\n5 5", "num": 190, "sectionTitle": "Iterators, Generators & Comprehensions"}, {"section": 9, "level": "Moderate", "question": "Do comprehension loop variables leak into the enclosing scope?", "answer": "No (in Python 3). Comprehensions run in their own scope, so the loop variable doesn't overwrite an outer name. A plain `for` loop variable **does** remain after the loop.", "code": "x = \"outer\"\nsquares = [x * x for x in range(3)]\nprint(x)\nfor y in range(3): pass\nprint(y)", "terms": [["PEP 709", "Inlined comprehensions (3.12): faster, with the same scoping rules as before."]], "pitfall": "In a class body, a comprehension cannot see class-level names except in the outermost iterable, so `[x * FACTOR for x in data]` inside a class raises `NameError` for `FACTOR`.", "follow": [["Does a `for` loop variable leak?", "Yes, it stays bound to the last value after the loop."], ["Does a walrus in a comprehension leak?", "Yes, `:=` binds in the containing scope by design."]], "output": "outer\n2", "num": 191, "sectionTitle": "Iterators, Generators & Comprehensions"}, {"section": 9, "level": "Moderate", "question": "How do you read a huge file efficiently?", "answer": "Iterate over the file object: it yields one line at a time with buffered I/O, using constant memory. For binary data, read fixed-size chunks with `iter(lambda: f.read(size), b\"\")`.", "code": "import tempfile, os\npath = os.path.join(tempfile.mkdtemp(), \"big.log\")\nwith open(path, \"w\") as f:\n    f.writelines(f\"line {i} {'ERROR' if i % 1000 == 0 else 'ok'}\\n\" for i in range(100_000))\nwith open(path) as f:\n    errors = sum(1 for line in f if \"ERROR\" in line)\nprint(\"errors:\", errors)\nwith open(path, \"rb\") as f:\n    chunks = sum(1 for _ in iter(lambda: f.read(64 * 1024), b\"\"))\nprint(\"64KB chunks:\", chunks)", "terms": [["Buffered I/O", "Reading in large blocks internally while handing out lines one at a time."], ["`mmap`", "Maps a file into memory so the OS pages it in on demand."]], "pitfall": "Calling `f.read()` or `f.readlines()` on a multi-gigabyte file. Both load the whole file into memory.", "follow": [["How do you read binary in chunks idiomatically?", "`for chunk in iter(lambda: f.read(1 << 16), b\"\"):`."], ["How do you process a huge CSV?", "Stream with `csv.reader`, or use pandas `read_csv(chunksize=...)` or polars' lazy scan."]], "output": "errors: 100\n64KB chunks: 23", "num": 192, "sectionTitle": "Iterators, Generators & Comprehensions"}, {"section": 9, "level": "Difficult", "question": "What happens if a generator has a `return` value?", "answer": "`return value` in a generator raises `StopIteration(value)`. `yield from` captures it as the expression's result; a plain `for` loop ignores it.", "code": "def worker():\n    yield 1; yield 2\n    return \"summary: 2 items\"\ndef supervisor():\n    result = yield from worker()\n    print(\"got\", result)\nprint(list(supervisor()))", "terms": [["`StopIteration.value`", "Attribute carrying a generator's return value."]], "pitfall": "Expecting a `for` loop to give you the return value. The loop swallows `StopIteration`; use `yield from` or call `next()` and catch `StopIteration` yourself.", "follow": [["Where is this pattern useful?", "Sub-generators that yield progress and return a summary to a delegating generator."], ["What is `return` without a value in a generator?", "It ends iteration with `StopIteration` whose value is `None`."]], "output": "got summary: 2 items\n[1, 2]", "num": 193, "sectionTitle": "Iterators, Generators & Comprehensions"}, {"section": 9, "level": "Moderate", "question": "What are `any()` and `all()`, and do they short-circuit?", "answer": "`any(it)` is True if any item is truthy; `all(it)` is True if all are (and True for empty input). Both stop as soon as the answer is known, so pass a generator expression to avoid computing everything.", "code": "def check(n):\n    print(\"checking\", n); return n > 2\nprint(any(check(n) for n in [1, 5, 9]))\nprint(all([]), any([]))", "terms": [["Short-circuit", "Stopping evaluation as soon as the result is known."]], "pitfall": "Passing a list comprehension (`any([check(x) for x in xs])`). The list is fully built first, so there is no short-circuit; pass a generator expression.", "follow": [["What does `all([])` return and why?", "True, because no item is false (vacuous truth)."], ["How do you find which item matched?", "`next((x for x in xs if pred(x)), None)`."]], "output": "checking 1\nchecking 5\nTrue\nTrue False", "num": 194, "sectionTitle": "Iterators, Generators & Comprehensions"}, {"section": 9, "level": "Difficult", "question": "What is an async generator?", "answer": "An `async def` function with `yield`, consumed with `async for`. It can `await` between yields, ideal for streaming paginated APIs or websocket messages.", "code": "import asyncio\nasync def fetch_pages():\n    for page in range(1, 4):\n        await asyncio.sleep(0.01)            # pretend network call\n        yield [f\"item{page}-{i}\" for i in range(2)]\nasync def main():\n    async for items in fetch_pages():\n        print(items)\nasyncio.run(main())", "terms": [["`async for`", "Iterates over an async iterator, awaiting `__anext__` for each item."], ["`aclose()`", "Async equivalent of `close()`; ensures `finally` blocks run."]], "pitfall": "Breaking out of an `async for` over an async generator without closing it. Cleanup runs later on a GC hook; wrap it with `contextlib.aclosing` for deterministic cleanup.", "follow": [["Can you use `yield from` in an async generator?", "No; use `async for x in sub(): yield x`."], ["Are async comprehensions allowed?", "Yes, `[x async for x in agen()]` inside an `async def`."]], "output": "['item1-0', 'item1-1']\n['item2-0', 'item2-1']\n['item3-0', 'item3-1']", "num": 195, "sectionTitle": "Iterators, Generators & Comprehensions"}, {"section": 9, "level": "Moderate", "question": "How do you implement `range`-like behaviour with a generator for floats?", "answer": "`range` only supports integers. Write a generator computing `start + i * step` (multiplication avoids accumulated floating-point error), or use `numpy.arange`/`linspace`.", "code": "def frange(start, stop, step):\n    n = 0\n    while (value := start + n * step) < stop:\n        yield round(value, 10)\n        n += 1\nprint(list(frange(0, 1, 0.25)), list(frange(0.1, 0.5, 0.1)))", "terms": [["Accumulated rounding error", "Error that grows when you repeatedly add a float step."]], "pitfall": "Using `while x < stop: x += step`. Rounding errors accumulate, and the loop can produce one extra or one missing value.", "follow": [["What does NumPy offer?", "`np.arange` (same end-point pitfalls) and `np.linspace(start, stop, num)`, which is safer for floats."], ["How do you get exact decimal steps?", "Use `Decimal` or `Fraction` arithmetic."]], "output": "[0.0, 0.25, 0.5, 0.75] [0.1, 0.2, 0.3, 0.4]", "num": 196, "sectionTitle": "Iterators, Generators & Comprehensions"}, {"section": 9, "level": "Moderate", "question": "What does `iter(callable, sentinel)` do?", "answer": "The two-argument form calls `callable()` repeatedly and yields results until it returns `sentinel`. Common for reading chunks until EOF or polling until a stop value.", "code": "import io\nf = io.BytesIO(b\"abcdefgh\")\nprint(list(iter(lambda: f.read(3), b\"\")))", "terms": [["Sentinel", "A marker value that signals the end of the data."]], "pitfall": "Using a sentinel that can legitimately occur in the data, such as an empty line when reading from a socket that may send empty lines.", "follow": [["How do you read a socket until closed?", "`for data in iter(lambda: sock.recv(4096), b\"\"):`."], ["Can the callable take arguments?", "No; wrap it with `lambda` or `functools.partial`."]], "output": "[b'abc', b'def', b'gh']", "num": 197, "sectionTitle": "Iterators, Generators & Comprehensions"}, {"section": 9, "level": "Difficult", "question": "What is the difference between a nested comprehension's loop order and nested for loops?", "answer": "The `for` clauses appear in the **same order** as nested loops would be written (outer first). The expression comes first. Reading left to right after the expression matches the indentation order of the equivalent loops.", "code": "pairs = [(x, y) for x in range(2) for y in \"ab\" if y != \"b\" or x]\nout = []\nfor x in range(2):\n    for y in \"ab\":\n        if y != \"b\" or x: out.append((x, y))\nprint(pairs, pairs == out)", "terms": [["Clause order", "`for` clauses are read left to right as outer to inner loops."]], "pitfall": "Writing `[x for x in row for row in matrix]`. `row` is used before it is defined, which raises `NameError` (or silently uses a stale outer `row`).", "follow": [["How do you transpose a matrix?", "`[list(col) for col in zip(*matrix)]`."], ["When should you switch to plain loops?", "When there are more than two `for` clauses or complex conditions."]], "output": "[(0, 'a'), (1, 'a'), (1, 'b')] True", "num": 198, "sectionTitle": "Iterators, Generators & Comprehensions"}, {"section": 10, "level": "Easy", "question": "What is a decorator?", "answer": "A callable that takes a function (or class) and returns a replacement, usually a wrapper adding behaviour before/after the original call. `@decorator` above a `def` is shorthand for `func = decorator(func)`.", "code": "import functools\ndef log_calls(fn):\n    @functools.wraps(fn)\n    def wrapper(*args, **kwargs):\n        print(f\"calling {fn.__name__}{args}\")\n        return fn(*args, **kwargs)\n    return wrapper\n@log_calls\ndef add(a, b): return a + b\nprint(add(2, 3))", "terms": [["`@` syntax", "`@d` above `def f` is shorthand for `f = d(f)` after the definition."], ["Wrapper", "The inner function a decorator returns, which calls the original."]], "pitfall": "Returning the wrapper's result from the decorator instead of the wrapper (`return wrapper()` instead of `return wrapper`). The function is then called at decoration time.", "follow": [["Since 3.9, what can follow `@`?", "Any expression (PEP 614), such as `@buttons[0].on_click`."], ["Can you undo a decorator?", "If `functools.wraps` was used, the original is available as `f.__wrapped__`."]], "output": "calling add(2, 3)\n5", "num": 199, "sectionTitle": "Decorators & Context Managers"}, {"section": 10, "level": "Moderate", "question": "Why use `functools.wraps` in decorators?", "answer": "Without it, the wrapper replaces the original's `__name__`, `__doc__`, `__module__`, `__qualname__` and signature. That breaks logging, documentation, debugging, pytest and frameworks that key routes by function name. `wraps` copies them and sets `__wrapped__`.", "code": "import functools\ndef plain(fn):\n    def wrapper(*a, **k): return fn(*a, **k)\n    return wrapper\ndef proper(fn):\n    @functools.wraps(fn)\n    def wrapper(*a, **k): return fn(*a, **k)\n    return wrapper\n@plain\ndef f():\n    \"\"\"Docs for f.\"\"\"\n@proper\ndef g():\n    \"\"\"Docs for g.\"\"\"\nprint(f.__name__, f.__doc__, \"|\", g.__name__, g.__doc__, \"| __wrapped__:\", g.__wrapped__.__name__)", "terms": [["`__wrapped__`", "Attribute set by `wraps` pointing to the original function."]], "pitfall": "Forgetting `wraps` in a decorator used with pytest fixtures or FastAPI endpoints. They inspect the signature and see `(*args, **kwargs)`, which breaks dependency injection.", "follow": [["Which attributes does `wraps` copy?", "`__module__`, `__name__`, `__qualname__`, `__doc__`, `__dict__` (merged), `__type_params__` (3.12+), and it sets `__wrapped__`."], ["Does `wraps` preserve the signature for type checkers?", "No; use `ParamSpec` in the decorator's annotations for that."]], "output": "wrapper None | g Docs for g. | __wrapped__: g", "num": 200, "sectionTitle": "Decorators & Context Managers"}, {"section": 10, "level": "Moderate", "question": "How do you write a decorator that accepts arguments?", "answer": "Add another layer: an outer function takes the arguments and returns the actual decorator, which takes the function and returns the wrapper.", "code": "import functools, time\ndef retry(times=3, delay=0.0, exceptions=(Exception,)):\n    def decorator(fn):\n        @functools.wraps(fn)\n        def wrapper(*args, **kwargs):\n            for attempt in range(1, times + 1):\n                try:\n                    return fn(*args, **kwargs)\n                except exceptions as e:\n                    print(f\"attempt {attempt}: {e}\")\n                    if attempt == times: raise\n                    time.sleep(delay)\n        return wrapper\n    return decorator\ncalls = iter([ConnectionError(\"timeout\"), ConnectionError(\"reset\"), \"OK\"])\n@retry(times=3, exceptions=(ConnectionError,))\ndef fetch():\n    r = next(calls)\n    if isinstance(r, Exception): raise r\n    return r\nprint(fetch())", "terms": [["Decorator factory", "A function that takes configuration and returns a decorator."]], "pitfall": "Supporting both `@retry` and `@retry(times=3)` without care. The first passes the function as the first argument; detect it with `if callable(arg)` or require parentheses.", "follow": [["How many nested functions does this need?", "Three: the factory, the decorator, and the wrapper."], ["How do you write it as a class?", "Store the arguments in `__init__`, and make `__call__(self, fn)` return the wrapper."]], "output": "attempt 1: timeout\nattempt 2: reset\nOK", "num": 201, "sectionTitle": "Decorators & Context Managers"}, {"section": 10, "level": "Moderate", "question": "In what order are stacked decorators applied?", "answer": "Bottom-up at definition time: `@a @b def f` means `f = a(b(f))`. At call time the outermost wrapper (`a`) runs first.", "code": "def tag(name):\n    def deco(fn):\n        def wrapper(): return f\"<{name}>{fn()}<\/{name}>\"\n        return wrapper\n    return deco\n@tag(\"b\")\n@tag(\"i\")\ndef hello(): return \"hi\"\nprint(hello())", "terms": [["Decoration order", "Bottom-up at definition, top-down (outermost first) at call time."]], "pitfall": "Stacking `@staticmethod` or `@classmethod` below another decorator that expects a plain function. Put `@classmethod`/`@staticmethod` outermost (top).", "follow": [["Where should `@app.route` go relative to `@login_required`?", "`@app.route` on top, so it registers the already-protected function."], ["Is `@cache` above or below `@timed` better?", "Depends on intent: `@timed` on top measures cache hits too; below, it times only real computations."]], "output": "<b><i>hi<\/i><\/b>", "num": 202, "sectionTitle": "Decorators & Context Managers"}, {"section": 10, "level": "Moderate", "question": "Can you decorate a class? Give an example.", "answer": "Yes: a class decorator receives the class and returns it (modified) or a replacement. `@dataclass`, `@functools.total_ordering` and registration decorators work this way.", "code": "REGISTRY = {}\ndef register(cls):\n    REGISTRY[cls.__name__.lower()] = cls\n    cls.registered = True\n    return cls\n@register\nclass CsvExporter: pass\nprint(REGISTRY, CsvExporter.registered)", "terms": [["Class decorator", "A callable taking a class and returning a class."]], "pitfall": "A class decorator that returns a new wrapper class. `isinstance` checks, pickling and class attributes on the original may break; prefer modifying and returning the same class.", "follow": [["When is a class decorator better than a metaclass?", "For one-off modifications that do not need to apply to subclasses automatically."], ["Do class decorators apply to subclasses?", "No; only to the decorated class itself."]], "output": "{'csvexporter': <class '__main__.CsvExporter'>} True", "num": 203, "sectionTitle": "Decorators & Context Managers"}, {"section": 10, "level": "Difficult", "question": "How do you write a class-based decorator, and when is it useful?", "answer": "A class with `__init__(self, fn)` and `__call__`. Useful when the decorator keeps state (call counts, caches). Use `functools.update_wrapper(self, fn)` to preserve metadata. Note it won't bind as a method unless you also implement `__get__`.", "code": "import functools\nclass CountCalls:\n    def __init__(self, fn):\n        functools.update_wrapper(self, fn)\n        self.fn, self.calls = fn, 0\n    def __call__(self, *args, **kwargs):\n        self.calls += 1\n        return self.fn(*args, **kwargs)\n@CountCalls\ndef ping(): return \"pong\"\nping(); ping()\nprint(ping.calls, ping.__name__)", "terms": [["`__get__` for methods", "Needed so that decorating a method still binds `self`."]], "pitfall": "Using a class-based decorator on methods without implementing `__get__`. The instance is not passed, and `self` is missing in the call.", "follow": [["How do you implement `__get__` for it?", "Return `functools.partial(self.__call__, instance)` (or `types.MethodType(self, instance)`) when `instance` is not None."], ["How do you apply `wraps` in a class decorator?", "`functools.update_wrapper(self, fn)` in `__init__`."]], "output": "2 ping", "num": 204, "sectionTitle": "Decorators & Context Managers"}, {"section": 10, "level": "Moderate", "question": "Give real-world uses of decorators.", "answer": "- Frameworks: `@app.route` (Flask), `@app.get` (FastAPI), `@login_required`, `@csrf_exempt`\n- Caching: `@functools.cache`, `@lru_cache`, Django `@cache_page`\n- Resilience: `@retry` (tenacity), rate limiting, timeouts\n- Observability: timing, logging, tracing spans\n- Testing: `@pytest.fixture`, `@pytest.mark.parametrize`, `@unittest.mock.patch`\n- Language: `@property`, `@staticmethod`, `@classmethod`, `@dataclass`, `@contextmanager`, `@abstractmethod`", "code": "", "terms": [["Cross-cutting concern", "Behavior needed in many places (logging, auth, retries) that is not the function's main job."]], "pitfall": "Hiding important control flow (retries, transactions, permission checks) in stacked decorators nobody reads. Keep decorators focused and document their effect.", "follow": [["What does `@functools.singledispatch` show about decorators?", "Decorators can return objects with extra methods (`.register`), not just wrappers."], ["How do you write a registration decorator?", "Add the function to a dict and return it unchanged."]], "output": "", "num": 205, "sectionTitle": "Decorators & Context Managers"}, {"section": 10, "level": "Moderate", "question": "How do you write a timing decorator?", "answer": "Wrap the call with `time.perf_counter()` (monotonic, high resolution) and report in a `finally` block so failures are timed too.", "code": "import functools, time\ndef timed(fn):\n    @functools.wraps(fn)\n    def wrapper(*a, **k):\n        start = time.perf_counter()\n        try:\n            return fn(*a, **k)\n        finally:\n            print(f\"{fn.__name__} took {(time.perf_counter() - start) * 1000:.1f} ms\")\n    return wrapper\n@timed\ndef slow_sum(n): return sum(range(n))\nslow_sum(2_000_000)", "terms": [["`perf_counter`", "Highest-resolution monotonic clock, for measuring durations."], ["`process_time`", "CPU time of the current process, excluding sleep."]], "pitfall": "Using `time.time()` for durations. It can jump when the system clock is adjusted; use `perf_counter` or `monotonic`.", "follow": [["How do you time a block rather than a function?", "A context manager with `perf_counter` in `__enter__` and `__exit__`."], ["How do you get reliable micro-benchmarks?", "Use `timeit` (or `python -m timeit`), which repeats runs and disables GC during timing."]], "output": "slow_sum took 12.0 ms", "num": 206, "sectionTitle": "Decorators & Context Managers"}, {"section": 10, "level": "Difficult", "question": "How do you write a decorator that works on both sync and async functions?", "answer": "Check `inspect.iscoroutinefunction(fn)` and return an `async def` wrapper for coroutines (which `await`s the call) or a normal wrapper otherwise.", "code": "import asyncio, functools, inspect, time\ndef timed(fn):\n    if inspect.iscoroutinefunction(fn):\n        @functools.wraps(fn)\n        async def awrapper(*a, **k):\n            t = time.perf_counter(); r = await fn(*a, **k)\n            print(f\"async {fn.__name__}: {(time.perf_counter() - t) * 1000:.0f} ms\"); return r\n        return awrapper\n    @functools.wraps(fn)\n    def wrapper(*a, **k):\n        t = time.perf_counter(); r = fn(*a, **k)\n        print(f\"sync {fn.__name__}: {(time.perf_counter() - t) * 1000:.0f} ms\"); return r\n    return wrapper\n@timed\nasync def fetch(): await asyncio.sleep(0.05); return \"data\"\n@timed\ndef compute(): time.sleep(0.02); return 42\nprint(asyncio.run(fetch()), compute())", "terms": [["`inspect.iscoroutinefunction`", "True for `async def` functions (and, since 3.12, for functions marked with `inspect.markcoroutinefunction`)."]], "pitfall": "Wrapping an async function with a sync wrapper. The wrapper returns the coroutine un-awaited, so timing or error handling applies to creating the coroutine, not running it.", "follow": [["Why is `asyncio.iscoroutinefunction` discouraged now?", "It is deprecated since 3.14; use `inspect.iscoroutinefunction`."], ["How do you handle async generators?", "Check `inspect.isasyncgenfunction` and write an `async def` wrapper that uses `async for ... yield`."]], "output": "async fetch: 54 ms\nsync compute: 20 ms\ndata 42", "num": 207, "sectionTitle": "Decorators & Context Managers"}, {"section": 10, "level": "Easy", "question": "What is a context manager and the `with` statement?", "answer": "An object that sets something up on entry and guarantees cleanup on exit, even if an exception occurs. `with open(path) as f:` closes the file automatically. It implements `__enter__` and `__exit__`.", "code": "import os, tempfile\npath = os.path.join(tempfile.mkdtemp(), \"notes.txt\")\nwith open(path, \"w\", encoding=\"utf-8\") as f:\n    f.write(\"hello\")\nprint(f.closed)", "terms": [["Context manager protocol", "`__enter__` and `__exit__`."], ["RAII-like cleanup", "Tying resource release to leaving a block, as C++ ties it to object scope."]], "pitfall": "Returning a file from inside a `with open(...)` block to use later. The file is already closed when the caller uses it.", "follow": [["Which stdlib objects are context managers?", "Files, locks, sockets, `decimal.localcontext`, `tempfile.TemporaryDirectory`, `ThreadPoolExecutor`."], ["Is `with` required to close files?", "Not strictly (CPython closes on garbage collection), but it guarantees timely closing on every path."]], "output": "True", "num": 208, "sectionTitle": "Decorators & Context Managers"}, {"section": 10, "level": "Moderate", "question": "How do you create a context manager with `contextlib.contextmanager`?", "answer": "Write a generator that does setup, `yield`s exactly once (the yielded value is bound by `as`), and does cleanup after. Wrap the `yield` in `try/finally` so cleanup runs if the block raises.", "code": "from contextlib import contextmanager\nimport os, tempfile\n@contextmanager\ndef working_dir(path):\n    old = os.getcwd()\n    os.chdir(path)\n    try:\n        yield path\n    finally:\n        os.chdir(old)\ntmp = tempfile.mkdtemp()\nwith working_dir(tmp):\n    print(os.getcwd() == os.path.realpath(tmp) or os.getcwd() == tmp)\nprint(os.getcwd() != tmp)", "terms": [["Generator-based context manager", "Setup before `yield`, cleanup after it, typically in `finally`."]], "pitfall": "Forgetting `try/finally` around the `yield`. If the block raises, the exception is thrown into the generator at the `yield` and the cleanup code never runs.", "follow": [["Can the result be used as a decorator?", "Yes, `@contextmanager` objects inherit `ContextDecorator`, so `@my_cm()` wraps a function call."], ["What happens if the generator yields twice?", "`RuntimeError: generator didn't stop`."]], "output": "True\nTrue", "num": 209, "sectionTitle": "Decorators & Context Managers"}, {"section": 10, "level": "Moderate", "question": "Can one `with` statement manage multiple context managers?", "answer": "Yes: `with A() as a, B() as b:`. Since 3.10 you can wrap them in parentheses across lines. They're entered left to right and exited in reverse order. For a dynamic number, use `contextlib.ExitStack`.", "code": "from contextlib import contextmanager\n@contextmanager\ndef res(name):\n    print(\"open\", name); yield name; print(\"close\", name)\nwith (\n    res(\"db\") as db,\n    res(\"cache\") as cache,\n):\n    print(\"using\", db, cache)", "terms": [["Unwinding order", "Managers exit in reverse order of entry."]], "pitfall": "Assuming a failure in a later `__enter__` also skips cleanup of earlier ones. It does not; earlier managers still exit properly, which is exactly why this form is safe.", "follow": [["What is the pre-3.10 way to span lines?", "Backslash continuation, or `ExitStack`."], ["Can a later manager use an earlier `as` name?", "Yes, `with open(p) as f, Wrapper(f) as w:` works because they are entered in order."]], "output": "open db\nopen cache\nusing db cache\nclose cache\nclose db", "num": 210, "sectionTitle": "Decorators & Context Managers"}, {"section": 10, "level": "Moderate", "question": "What does `contextlib.suppress` do?", "answer": "It suppresses the listed exceptions inside the block, a readable alternative to `try/except: pass` for expected, ignorable errors.", "code": "import contextlib, os\nwith contextlib.suppress(FileNotFoundError):\n    os.remove(\"/definitely/not/here.tmp\")\nprint(\"no crash\")", "terms": [["Expected exception", "An error that is a normal outcome, such as `FileNotFoundError` when deleting an optional file."]], "pitfall": "Wrapping a multi-line block in `suppress`. Execution stops at the first raising line and the remaining lines silently do not run.", "follow": [["What is the typical example?", "`with suppress(FileNotFoundError): os.remove(path)`."], ["Does `suppress` handle exception groups?", "Yes since 3.12: it suppresses matching exceptions within an `ExceptionGroup` and re-raises the rest."]], "output": "no crash", "num": 211, "sectionTitle": "Decorators & Context Managers"}, {"section": 10, "level": "Difficult", "question": "What is `contextlib.ExitStack` used for?", "answer": "It manages an arbitrary, runtime-determined number of context managers and callbacks, unwinding them in reverse order. Also useful to conditionally enter a context manager or to transfer cleanup responsibility (`pop_all()`).", "code": "from contextlib import ExitStack, contextmanager\n@contextmanager\ndef conn(n):\n    print(f\"connect {n}\"); yield n; print(f\"disconnect {n}\")\nshards = [1, 2, 3]\nwith ExitStack() as stack:\n    conns = [stack.enter_context(conn(s)) for s in shards]\n    stack.callback(print, \"flush metrics\")\n    print(\"query all:\", conns)", "terms": [["`enter_context`", "Enters a context manager and registers its exit."], ["`pop_all`", "Transfers the registered callbacks to a new stack, used to keep resources open on success."]], "pitfall": "Opening many files in a loop with `ExitStack` and exceeding the OS file-descriptor limit. Process in batches if the number is large.", "follow": [["How do you register a plain cleanup function?", "`stack.callback(fn, *args)`."], ["How does `pop_all` help in constructors?", "Open resources inside a `with ExitStack()`; on success call `pop_all()` to keep them, so failures clean up automatically."]], "output": "connect 1\nconnect 2\nconnect 3\nquery all: [1, 2, 3]\nflush metrics\ndisconnect 3\ndisconnect 2\ndisconnect 1", "num": 212, "sectionTitle": "Decorators & Context Managers"}, {"section": 10, "level": "Difficult", "question": "How do async context managers work?", "answer": "They implement `__aenter__`/`__aexit__` (or use `@contextlib.asynccontextmanager`) and are used with `async with`. Typical: DB transactions, HTTP sessions (`aiohttp.ClientSession`), locks in asyncio.", "code": "import asyncio\nfrom contextlib import asynccontextmanager\n@asynccontextmanager\nasync def transaction(name):\n    print(\"BEGIN\", name); await asyncio.sleep(0)\n    try:\n        yield name\n        print(\"COMMIT\", name)\n    except Exception:\n        print(\"ROLLBACK\", name); raise\nasync def main():\n    async with transaction(\"tx1\"):\n        pass\n    try:\n        async with transaction(\"tx2\"):\n            raise ValueError(\"bad row\")\n    except ValueError:\n        pass\nasyncio.run(main())", "terms": [["`asynccontextmanager`", "Decorator turning an async generator into an async context manager."]], "pitfall": "Using `with` instead of `async with` on an async resource. It raises `TypeError` (the object does not support the synchronous protocol), or worse, a library may offer both and the sync path blocks the event loop.", "follow": [["What is `AsyncExitStack`?", "The async counterpart of `ExitStack`, with `enter_async_context`."], ["Can `__aexit__` suppress exceptions?", "Yes, by returning a truthy value, just like `__exit__`."]], "output": "BEGIN tx1\nCOMMIT tx1\nBEGIN tx2\nROLLBACK tx2", "num": 213, "sectionTitle": "Decorators & Context Managers"}, {"section": 10, "level": "Moderate", "question": "Can a context manager suppress exceptions? How?", "answer": "Yes: if `__exit__` returns a truthy value, the exception is swallowed. In `@contextmanager` generators, catching the exception around `yield` and not re-raising suppresses it. Suppressing should be deliberate and narrow.", "code": "", "terms": [["`__exit__` return value", "Truthy means the exception is handled; falsy (including `None`) means it propagates."]], "pitfall": "In an `@contextmanager` generator, catching `Exception` around `yield` and not re-raising. Every error inside the `with` block is silently swallowed.", "follow": [["How do you inspect the exception in `__exit__`?", "The arguments `exc_type`, `exc_value` and `traceback` are `None` when no exception occurred."], ["Should `__exit__` re-raise the exception itself?", "No; return a falsy value and Python re-raises it with the original traceback."]], "output": "", "num": 214, "sectionTitle": "Decorators & Context Managers"}, {"section": 10, "level": "Difficult", "question": "What is `contextlib.nullcontext` for?", "answer": "A context manager that does nothing, optionally returning a value. It lets code use one `with` statement whether or not a real resource (lock, transaction, file) is provided.", "code": "import contextlib, sys\ndef write_report(text, path=None):\n    cm = open(path, \"w\") if path else contextlib.nullcontext(sys.stdout)\n    with cm as out:\n        out.write(text + \"\\n\")\nwrite_report(\"printed to stdout because no path was given\")", "terms": [["Null object pattern", "A do-nothing implementation that removes special-case branches."]], "pitfall": "Writing `with (lock if lock else nullcontext()):` everywhere. Encapsulate the choice once, for example by defaulting the parameter to `nullcontext()`.", "follow": [["What does `nullcontext(x)` bind with `as`?", "`x` itself."], ["Does it support `async with`?", "Yes, since 3.10."]], "output": "printed to stdout because no path was given", "num": 215, "sectionTitle": "Decorators & Context Managers"}, {"section": 10, "level": "Difficult", "question": "How would you write a decorator that caches results with a time-to-live (TTL)?", "answer": "Store `(timestamp, value)` keyed by arguments, and recompute when the entry is older than the TTL. Arguments must be hashable. (Libraries like `cachetools.TTLCache` provide this.)", "code": "import functools, time\ndef ttl_cache(seconds):\n    def deco(fn):\n        store = {}\n        @functools.wraps(fn)\n        def wrapper(*args):\n            now = time.monotonic()\n            if args in store and now - store[args][0] < seconds:\n                return store[args][1]\n            value = fn(*args); store[args] = (now, value); return value\n        return wrapper\n    return deco\n@ttl_cache(0.05)\ndef rate(cur):\n    print(\"  fetching\", cur); return 83.1\nrate(\"USD\"); rate(\"USD\"); time.sleep(0.06); rate(\"USD\")", "terms": [["TTL", "Time to live: how long a cached value stays valid."], ["Cache stampede", "Many callers recomputing the same expired value at once."]], "pitfall": "Letting expired entries stay in the dict forever. Without eviction the cache grows without bound; evict on access, cap the size, or use `cachetools.TTLCache`.", "follow": [["Which clock should a TTL cache use?", "`time.monotonic()`, which never jumps backward."], ["How do you make it thread-safe?", "Guard reads and writes with a lock, and consider a per-key lock to avoid duplicate computation."]], "output": "  fetching USD\n  fetching USD", "num": 216, "sectionTitle": "Decorators & Context Managers"}, {"section": 10, "level": "Moderate", "question": "What is the difference between `@property` and a decorator you write yourself?", "answer": "`property` is a built-in **descriptor** class; used as a decorator it wraps the getter in a descriptor object that intercepts attribute access. Your own decorators usually return a wrapper function. Both use the same `@` syntax because both are callables applied to the function.", "code": "", "terms": [["Descriptor class", "A class whose instances control attribute access when stored as class attributes."]], "pitfall": "Writing a function-based decorator and expecting it to behave like `@property` (attribute access without calling). Only descriptors can intercept attribute access.", "follow": [["How does `@x.setter` work?", "`property.setter` returns a new property object copying the getter and adding the setter, which replaces the name `x`."], ["Can you write your own property?", "Yes, a class with `__get__`, `__set__` and `__set_name__` reproduces it."]], "output": "", "num": 217, "sectionTitle": "Decorators & Context Managers"}, {"section": 11, "level": "Easy", "question": "How does `try` / `except` / `else` / `finally` work?", "answer": "`try` runs code that may fail; `except` handles matching exceptions; `else` runs only if no exception occurred (keep the `try` block minimal and put follow-up code here); `finally` always runs, for cleanup.", "code": "def parse(s):\n    try:\n        n = int(s)\n    except ValueError as e:\n        print(f\"  bad input: {e}\")\n    else:\n        print(f\"  parsed {n}\")\n    finally:\n        print(\"  finally runs either way\")\nparse(\"42\"); parse(\"forty-two\")", "terms": [["`else` clause", "Runs only when the `try` block raised nothing; exceptions inside it are not caught by the preceding `except`."], ["`finally` clause", "Runs on every exit path: normal, exception, `return`, `break`, `continue`."]], "pitfall": "Putting too much code in the `try` block. An `except KeyError` then also catches unrelated `KeyError`s from lines you did not mean to protect; move the rest into `else`.", "follow": [["What order must the clauses appear in?", "`try`, one or more `except`, optional `else`, optional `finally`; or `try`/`finally` alone."], ["Is the exception variable available after the `except` block?", "No; `except E as e` deletes `e` at the end of the block to avoid reference cycles with the traceback."]], "output": "  parsed 42\n  finally runs either way\n  bad input: invalid literal for int() with base 10: 'forty-two'\n  finally runs either way", "num": 218, "sectionTitle": "Exceptions & Error Handling"}, {"section": 11, "level": "Easy", "question": "How do you catch multiple exception types?", "answer": "Use a tuple in one clause, `except (KeyError, IndexError) as e:`, or separate clauses for different handling. Clauses are checked top to bottom, so put specific exceptions before general ones.", "code": "def lookup(data, key):\n    try:\n        return data[key]\n    except (KeyError, IndexError) as e:\n        return f\"missing: {type(e).__name__}\"\n    except TypeError:\n        return \"wrong key type\"\nprint(lookup({\"a\": 1}, \"b\"), lookup([1], 5), lookup([1], \"x\"))", "terms": [["Handler order", "The first matching `except` clause wins, so put specific exceptions before general ones."]], "pitfall": "Writing `except KeyError, IndexError:` (Python 2 syntax). In Python 3 that is a `SyntaxError` before 3.14; in 3.14, PEP 758 allows unparenthesized lists only without `as`. Use a tuple for clarity.", "follow": [["Can you catch an exception by a common base?", "Yes; `except LookupError` catches both `KeyError` and `IndexError`."], ["How do you catch everything except system-exit signals?", "`except Exception`, which excludes `KeyboardInterrupt`, `SystemExit` and `GeneratorExit`."]], "output": "missing: KeyError missing: IndexError wrong key type", "num": 219, "sectionTitle": "Exceptions & Error Handling"}, {"section": 11, "level": "Moderate", "question": "Why is a bare `except:` (or `except Exception: pass`) bad?", "answer": "A bare `except:` also catches `KeyboardInterrupt` and `SystemExit`, so Ctrl+C and `sys.exit()` stop working. Swallowing errors silently hides bugs. Catch the narrowest exception you can handle, and log or re-raise the rest.", "code": "import sys\ntry:\n    sys.exit(3)\nexcept:                       # catches SystemExit too!\n    print(\"exit was swallowed; the program keeps running\")\nprint(issubclass(KeyboardInterrupt, Exception), issubclass(KeyboardInterrupt, BaseException))", "terms": [["Swallowing", "Catching an exception and discarding it without logging or re-raising."]], "pitfall": "`except Exception: return None` in a data-access function. Callers cannot tell \"not found\" from \"database is down\", and failures surface much later as confusing `None` errors.", "follow": [["When is catching broad `Exception` acceptable?", "At a top-level boundary (request handler, worker loop, CLI entry point) where you log it and continue or exit cleanly."], ["How do linters flag this?", "Ruff/flake8 rules such as E722 (bare except), BLE001 (blind except) and S110 (try-except-pass)."]], "output": "exit was swallowed; the program keeps running\nFalse True", "num": 220, "sectionTitle": "Exceptions & Error Handling"}, {"section": 11, "level": "Moderate", "question": "Describe Python's exception hierarchy.", "answer": "`BaseException` is the root. Directly under it: `SystemExit`, `KeyboardInterrupt`, `GeneratorExit`, `BaseExceptionGroup` and `Exception`. Almost everything else derives from `Exception`: `ArithmeticError` (`ZeroDivisionError`), `LookupError` (`KeyError`, `IndexError`), `OSError` (`FileNotFoundError`, `PermissionError`, `TimeoutError`), `ValueError` (`UnicodeError`), `TypeError`, `AttributeError`, `ImportError` (`ModuleNotFoundError`), `RuntimeError` (`RecursionError`, `NotImplementedError`).", "code": "for exc in (ZeroDivisionError, KeyError, FileNotFoundError, ModuleNotFoundError, RecursionError):\n    print(exc.__name__.ljust(20), \" -> \".join(c.__name__ for c in exc.__mro__[1:-1]))", "terms": [["`BaseException`", "Root of all exceptions; direct subclasses other than `Exception` are meant to end the program or generator."], ["`OSError` family", "`FileNotFoundError`, `PermissionError`, `TimeoutError`, `ConnectionError` and more, chosen from `errno`."]], "pitfall": "Catching `IOError` or `EnvironmentError` separately from `OSError`. Since 3.3 they are aliases of `OSError`, so separate handlers are redundant.", "follow": [["Where does `StopIteration` sit?", "Under `Exception`; `StopAsyncIteration` too."], ["How do you print the hierarchy?", "Walk `BaseException.__subclasses__()` recursively, or see the tree in the \"Built-in Exceptions\" docs."]], "output": "ZeroDivisionError    ArithmeticError -> Exception -> BaseException\nKeyError             LookupError -> Exception -> BaseException\nFileNotFoundError    OSError -> Exception -> BaseException\nModuleNotFoundError  ImportError -> Exception -> BaseException\nRecursionError       RuntimeError -> Exception -> BaseException", "num": 221, "sectionTitle": "Exceptions & Error Handling"}, {"section": 11, "level": "Easy", "question": "How do you raise an exception?", "answer": "`raise ExceptionType(\"message\")`. A bare `raise` inside an `except` block re-raises the current exception with its original traceback.", "code": "def withdraw(balance, amount):\n    if amount <= 0:\n        raise ValueError(f\"amount must be positive, got {amount}\")\n    if amount > balance:\n        raise RuntimeError(\"insufficient funds\")\n    return balance - amount\ntry:\n    withdraw(100, -5)\nexcept ValueError as e:\n    print(\"ValueError:\", e)", "terms": [["Re-raise", "A bare `raise` inside an `except` re-raises the exception currently being handled."]], "pitfall": "Raising a class with arguments inconsistently, or `raise \"error\"`. Only `BaseException` instances or subclasses can be raised; strings raise `TypeError`.", "follow": [["What does `raise ValueError` (no parentheses) do?", "Python instantiates the class with no arguments and raises it."], ["What happens with a bare `raise` outside an `except`?", "`RuntimeError: No active exception to reraise`."]], "output": "ValueError: amount must be positive, got -5", "num": 222, "sectionTitle": "Exceptions & Error Handling"}, {"section": 11, "level": "Moderate", "question": "How do you create custom exceptions?", "answer": "Subclass `Exception` (never `BaseException`). Create a base exception for your library/app and specific subclasses, and attach useful data as attributes. Callers can then catch broadly or narrowly.", "code": "class PaymentError(Exception):\n    \"\"\"Base class for payment failures.\"\"\"\nclass CardDeclined(PaymentError):\n    def __init__(self, code, message=\"card declined\"):\n        super().__init__(f\"{message} (code {code})\")\n        self.code = code\ntry:\n    raise CardDeclined(\"51\")\nexcept PaymentError as e:\n    print(type(e).__name__, \"|\", e, \"| code:\", e.code)", "terms": [["Exception hierarchy per package", "One base class (`MyLibError`) with specific subclasses, so callers can catch at the level they need."]], "pitfall": "Overriding `__init__` with extra required arguments and not calling `super().__init__(message)`. The exception then prints badly and can fail to unpickle when crossing process boundaries.", "follow": [["Should custom exceptions end in \"Error\"?", "Yes by PEP 8 convention when they signal an error."], ["When should you reuse a built-in exception instead?", "When the meaning matches exactly, such as `ValueError` for a bad argument value or `KeyError` for a missing key."]], "output": "CardDeclined | card declined (code 51) | code: 51", "num": 223, "sectionTitle": "Exceptions & Error Handling"}, {"section": 11, "level": "Moderate", "question": "What is exception chaining (`raise ... from ...`)?", "answer": "`raise NewError(...) from err` sets `__cause__`, so the traceback shows \"The above exception was the direct cause...\". Raising inside an `except` without `from` sets `__context__` implicitly. `from None` hides the original, for example to hide implementation details.", "code": "class ConfigError(Exception): pass\ndef load(cfg):\n    try:\n        return int(cfg[\"port\"])\n    except (KeyError, ValueError) as e:\n        raise ConfigError(\"invalid port setting\") from e\ntry:\n    load({\"port\": \"eighty\"})\nexcept ConfigError as e:\n    print(e, \"| caused by:\", repr(e.__cause__))", "terms": [["`__cause__`", "Set by `raise ... from err`; shown as \"direct cause\"."], ["`__context__`", "Set automatically when raising inside `except`; shown as \"During handling ... another exception occurred\"."]], "pitfall": "Translating exceptions without `from`, so the traceback suggests a bug in the handler rather than a deliberate translation.", "follow": [["What does `raise X from None` do?", "Suppresses the context display (`__suppress_context__ = True`); use it when the original is irrelevant to the caller."], ["Is the original exception lost with `from None`?", "No; it is still stored in `__context__`, just not printed."]], "output": "invalid port setting | caused by: ValueError(\"invalid literal for int() with base 10: 'eighty'\")", "num": 224, "sectionTitle": "Exceptions & Error Handling"}, {"section": 11, "level": "Moderate", "question": "What is the difference between `raise` and `raise e` inside an `except` block?", "answer": "Bare `raise` re-raises the active exception unchanged. `raise e` re-raises the same object but adds the current line to its traceback. Use bare `raise` to preserve the original traceback cleanly.", "code": "", "terms": [["Traceback", "The chain of frames from where the exception was raised; stored in `e.__traceback__`."]], "pitfall": "Using `raise e` and then being confused by tracebacks that include the re-raise line. Use bare `raise` to re-raise unchanged.", "follow": [["How do you raise with a specific traceback?", "`raise e.with_traceback(tb)`."], ["Does `raise e` lose the original frames?", "No; it appends the current frame to the existing traceback."]], "output": "", "num": 225, "sectionTitle": "Exceptions & Error Handling"}, {"section": 11, "level": "Moderate", "question": "EAFP vs LBYL: which style does Python prefer?", "answer": "**EAFP** (\"Easier to Ask Forgiveness than Permission\"): try the operation and handle the exception. **LBYL** (\"Look Before You Leap\"): check first. Python favours EAFP: it's often faster when failures are rare and avoids race conditions (a file can disappear between the check and the open).", "code": "config = {\"host\": \"db\"}\n# LBYL\nport = config[\"port\"] if \"port\" in config else 5432\n# EAFP\ntry:\n    port2 = config[\"port\"]\nexcept KeyError:\n    port2 = 5432\nprint(port, port2, config.get(\"port\", 5432))", "terms": [["TOCTOU", "Time-of-check to time-of-use race: the state can change between the check and the action."]], "pitfall": "Using EAFP where the exception is the common case in a hot loop. Raising is costly; when failures are frequent, a cheap check (`dict.get`, `in`) is faster.", "follow": [["Why is `if os.path.exists(p): open(p)` racy?", "The file can be deleted between the check and the open; `try: open(p) except FileNotFoundError` avoids that."], ["Is LBYL ever clearer?", "Yes, for input validation and preconditions where failing early with a clear message helps."]], "output": "5432 5432 5432", "num": 226, "sectionTitle": "Exceptions & Error Handling"}, {"section": 11, "level": "Moderate", "question": "Does `finally` run if the `try` block returns? What if `finally` also returns?", "answer": "`finally` always runs, even after `return`, `break` or an exception. If `finally` itself executes `return`, it **overrides** the earlier return value and even swallows an in-flight exception. Python 3.14 warns about `return` in `finally` (PEP 765); avoid it.", "code": "import warnings\nwarnings.simplefilter(\"ignore\", SyntaxWarning)\nsrc = \"\"\"\ndef f():\n    try:\n        return \"from try\"\n    finally:\n        print(\"  finally runs\")\ndef g():\n    try:\n        1 / 0\n    finally:\n        return \"finally swallowed the exception\"\nprint(f()); print(g())\n\"\"\"\nexec(compile(src, \"<demo>\", \"exec\"))", "terms": [["Return override", "A `return` in `finally` replaces any pending return value and cancels any exception."]], "pitfall": "`return`, `break` or `continue` inside `finally`, which silently swallows exceptions. Python 3.14 emits a `SyntaxWarning` for it (PEP 765).", "follow": [["Does `finally` run on `os._exit()`?", "No; `os._exit` terminates immediately without unwinding."], ["Does `finally` run when a thread is killed or the process gets SIGKILL?", "No, nothing runs after SIGKILL."]], "output": "  finally runs\nfrom try\nfinally swallowed the exception", "num": 227, "sectionTitle": "Exceptions & Error Handling"}, {"section": 11, "level": "Moderate", "question": "What does `assert` do and when should you not use it?", "answer": "`assert cond, msg` raises `AssertionError` if `cond` is false. Asserts are **removed** when Python runs with `-O`, so never use them for input validation, security checks or anything that must always run. Use them for internal invariants and tests.", "code": "import subprocess, sys\ncode = \"assert 1 == 2, 'invariant broken'; print('asserts were skipped')\"\nfor flags in ([], [\"-O\"]):\n    r = subprocess.run([sys.executable, *flags, \"-c\", code], capture_output=True, text=True)\n    print(flags or \"normal\", \"->\", (r.stdout or r.stderr.strip().splitlines()[-1]).strip())", "terms": [["`__debug__`", "True unless Python runs with `-O`; asserts compile to `if __debug__: ...`."]], "pitfall": "`assert (x > 0, \"msg\")` with parentheses. That asserts a non-empty tuple, which is always true; Python warns about it.", "follow": [["What are asserts good for?", "Internal invariants and developer assumptions, and test assertions in pytest."], ["What should you use for argument validation instead?", "An explicit `if ...: raise ValueError(...)`."]], "output": "normal -> AssertionError: invariant broken\n['-O'] -> asserts were skipped", "num": 228, "sectionTitle": "Exceptions & Error Handling"}, {"section": 11, "level": "Moderate", "question": "How do you log an exception with its traceback?", "answer": "Inside an `except` block call `logger.exception(\"message\")` (logs at ERROR level with traceback) or pass `exc_info=True` to any log call. `traceback.format_exc()` returns the traceback as a string.", "code": "import logging, sys\nlogging.basicConfig(stream=sys.stdout, format=\"%(levelname)s %(message)s\")\nlog = logging.getLogger(\"orders\")\ntry:\n    {}[\"missing\"]\nexcept KeyError:\n    log.exception(\"failed to load order\")", "terms": [["`logger.exception`", "Logs at ERROR level and includes the current exception's traceback."], ["`exc_info`", "Argument that attaches exception info to any log call (`exc_info=True` or an exception instance)."]], "pitfall": "Logging and then re-raising at every layer. The same traceback appears many times in the logs; log once at the boundary that handles it.", "follow": [["How do you get the traceback as a string?", "`traceback.format_exc()`, or `\"\".join(traceback.format_exception(e))`."], ["How do you log an exception outside the `except` block?", "Pass the exception object: `logger.error(\"msg\", exc_info=e)`."]], "output": "ERROR failed to load order\nTraceback (most recent call last):\n  File \"C:\\Users\\win11\\AppData\\Local\\Temp\\tmpb92p5cwr\\snippet.py\", line 5, in <module>\n    {}[\"missing\"]\n    ~~^^^^^^^^^^^\nKeyError: 'missing'", "num": 229, "sectionTitle": "Exceptions & Error Handling"}, {"section": 11, "level": "Difficult", "question": "What are exception groups and `except*` (Python 3.11+)?", "answer": "`ExceptionGroup` bundles several exceptions, e.g. from concurrent tasks in `asyncio.TaskGroup`. `except* Type` handles the matching subset while unmatched exceptions continue to propagate. Several `except*` clauses can each run.", "code": "def run_all():\n    errors = [ValueError(\"bad sku\"), TimeoutError(\"inventory slow\"), ValueError(\"bad qty\")]\n    raise ExceptionGroup(\"checkout failed\", errors)\ntry:\n    run_all()\nexcept* ValueError as eg:\n    print(\"validation:\", [str(e) for e in eg.exceptions])\nexcept* TimeoutError as eg:\n    print(\"timeouts:\", [str(e) for e in eg.exceptions])", "terms": [["`ExceptionGroup`", "An exception holding several exceptions (and nested groups)."], ["`except*`", "Handles matching exceptions inside a group; each `except*` clause can run, and unhandled ones re-raise as a group."]], "pitfall": "Using a plain `except ValueError` around `asyncio.TaskGroup` code. Errors arrive wrapped in an `ExceptionGroup`, so the handler does not match; use `except*`.", "follow": [["Can you mix `except` and `except*` in one `try`?", "No; a `try` statement uses one kind only."], ["How do you split a group programmatically?", "`eg.split(ValueError)` returns `(matching, rest)`; `eg.subgroup(...)` returns just the matching part."]], "output": "validation: ['bad sku', 'bad qty']\ntimeouts: ['inventory slow']", "num": 230, "sectionTitle": "Exceptions & Error Handling"}, {"section": 11, "level": "Moderate", "question": "What is `add_note()` on exceptions?", "answer": "Since 3.11, `exc.add_note(text)` attaches extra context that is printed with the traceback, without wrapping the exception in a new type.", "code": "import traceback\ntry:\n    try:\n        int(\"x\")\n    except ValueError as e:\n        e.add_note(\"while parsing row 17 of orders.csv\")\n        raise\nexcept ValueError as e:\n    print(\"\".join(traceback.format_exception_only(e)).strip())", "terms": [["`__notes__`", "List of strings attached to an exception, printed after the message."]], "pitfall": "Wrapping exceptions in new types only to add context. That changes the type callers catch; `add_note` adds context while keeping the type.", "follow": [["Where are notes useful?", "Adding the file name, row number or request id while re-raising in a loop or pipeline."], ["Does pytest show notes?", "Yes, tracebacks display them, which helps with hypothesis failures too."]], "output": "ValueError: invalid literal for int() with base 10: 'x'\nwhile parsing row 17 of orders.csv", "num": 231, "sectionTitle": "Exceptions & Error Handling"}, {"section": 11, "level": "Moderate", "question": "How do `warnings` differ from exceptions?", "answer": "Warnings signal something noteworthy (deprecation, likely mistake) without stopping the program. `warnings.warn(msg, DeprecationWarning, stacklevel=2)` issues one; filters can ignore them, show them once, or turn them into errors (`-W error`), which is useful in tests.", "code": "import warnings\ndef old_api():\n    warnings.warn(\"old_api() is deprecated; use new_api()\", DeprecationWarning, stacklevel=2)\n    return 1\nwith warnings.catch_warnings(record=True) as caught:\n    warnings.simplefilter(\"always\")\n    old_api()\nprint(caught[0].category.__name__, \"-\", caught[0].message)", "terms": [["Warning filter", "Rules (`-W`, `PYTHONWARNINGS`, `warnings.filterwarnings`) that ignore, show once or turn warnings into errors."], ["`stacklevel`", "Points the warning at the caller's line instead of the library's line."]], "pitfall": "Emitting `DeprecationWarning` from a library and expecting users to see it. It is hidden by default except in `__main__` and test runners; also document the deprecation.", "follow": [["How do you turn warnings into errors in tests?", "`python -W error` or pytest's `filterwarnings = error` setting."], ["What is `warnings.deprecated`?", "A 3.13 decorator (PEP 702) that marks functions or classes as deprecated for both type checkers and runtime."]], "output": "DeprecationWarning - old_api() is deprecated; use new_api()", "num": 232, "sectionTitle": "Exceptions & Error Handling"}, {"section": 11, "level": "Difficult", "question": "How do you retry an operation on transient errors properly?", "answer": "Retry only idempotent operations, only on transient errors (timeouts, 503), with a maximum attempt count, exponential backoff and jitter, and re-raise the last error. Libraries like `tenacity` implement this.", "code": "import random, time\ndef with_retry(fn, attempts=4, base=0.01, retry_on=(TimeoutError, ConnectionError)):\n    for i in range(1, attempts + 1):\n        try:\n            return fn()\n        except retry_on as e:\n            if i == attempts: raise\n            sleep = random.uniform(0, base * 2 ** i)\n            print(f\"attempt {i} failed ({e}); sleeping {sleep * 1000:.0f} ms\")\n            time.sleep(sleep)\nrandom.seed(3)\nresults = iter([TimeoutError(\"slow\"), ConnectionError(\"reset\"), \"200 OK\"])\ndef call():\n    r = next(results)\n    if isinstance(r, Exception): raise r\n    return r\nprint(with_retry(call))", "terms": [["Exponential backoff", "Waiting 1, 2, 4, 8, ... seconds between attempts."], ["Jitter", "Randomizing delays so many clients do not retry in lockstep."], ["Idempotent", "Safe to repeat: doing it twice has the same effect as once."]], "pitfall": "Retrying at several layers (client library, service code, load balancer). Attempts multiply (3 x 3 x 3 = 27) and amplify an outage; retry at one layer only.", "follow": [["Which errors should not be retried?", "Validation errors, 4xx client errors (except 429 and sometimes 408), and authentication failures."], ["Which library is common for this?", "`tenacity` (decorators with stop, wait and retry conditions), or `stamina` built on it."]], "output": "attempt 1 failed (slow); sleeping 5 ms\nattempt 2 failed (reset); sleeping 22 ms\n200 OK", "num": 233, "sectionTitle": "Exceptions & Error Handling"}, {"section": 11, "level": "Moderate", "question": "What happens to an exception raised in a `with` block?", "answer": "The context manager's `__exit__` receives it. If `__exit__` returns a falsy value, the exception propagates after cleanup; files are still closed and locks still released.", "code": "", "terms": [["Exit arguments", "`__exit__(exc_type, exc_value, traceback)`, all `None` when no exception occurred."]], "pitfall": "An exception raised inside `__exit__` itself replaces the original exception, which then only appears as context. Keep cleanup code defensive.", "follow": [["Does a lock get released if the block raises?", "Yes; `threading.Lock.__exit__` releases it and returns None so the exception propagates."], ["How do you see whether cleanup saw an error?", "Check `exc_type is not None` in `__exit__`."]], "output": "", "num": 234, "sectionTitle": "Exceptions & Error Handling"}, {"section": 11, "level": "Difficult", "question": "What is the cost of exceptions in Python?", "answer": "Entering a `try` block is almost free (zero-cost exceptions since 3.11). Raising and catching is relatively expensive (creating the exception and traceback). So EAFP is fine when failures are rare, but don't use exceptions for common control flow in hot loops.", "code": "import timeit\nd = {\"a\": 1}\ndef eafp_hit():\n    try: return d[\"a\"]\n    except KeyError: return 0\ndef eafp_miss():\n    try: return d[\"b\"]\n    except KeyError: return 0\ndef lbyl_miss(): return d[\"b\"] if \"b\" in d else 0\nfor f in (eafp_hit, eafp_miss, lbyl_miss):\n    print(f.__name__.ljust(10), \"%.0f ns\" % (timeit.timeit(f, number=200_000) / 200_000 * 1e9))", "terms": [["Zero-cost exceptions", "Since 3.11, a `try` block adds no instructions on the normal path; handlers are found via a table when raising."]], "pitfall": "Using exceptions for normal control flow in tight loops, such as `try: d[k] except KeyError` when most keys are missing. Raising costs microseconds each time.", "follow": [["How can you measure it?", "`timeit` a function that raises and catches versus one that returns a sentinel."], ["What makes raising expensive?", "Creating the exception object, building the traceback and unwinding frames."]], "output": "eafp_hit   28 ns\neafp_miss  115 ns\nlbyl_miss  28 ns", "num": 235, "sectionTitle": "Exceptions & Error Handling"}, {"section": 11, "level": "Moderate", "question": "What does `sys.exit()` actually do?", "answer": "It raises `SystemExit`, which unwinds the stack (running `finally` blocks and context managers) and exits with the given status code. `os._exit()` exits immediately without cleanup (used in forked children).", "code": "import sys\ntry:\n    sys.exit(2)\nexcept SystemExit as e:\n    print(\"caught SystemExit with code\", e.code)", "terms": [["`SystemExit`", "Exception raised by `sys.exit`; its `code` becomes the process exit status."], ["`os._exit`", "Exits immediately without cleanup; used in forked children."]], "pitfall": "Calling `sys.exit()` in a worker thread expecting the program to exit. It only ends that thread.", "follow": [["What exit status does `sys.exit(\"message\")` produce?", "It prints the message to stderr and exits with status 1."], ["How do you run cleanup at interpreter exit?", "`atexit.register(fn)`; it does not run on `os._exit` or fatal signals."]], "output": "caught SystemExit with code 2", "num": 236, "sectionTitle": "Exceptions & Error Handling"}, {"section": 12, "level": "Easy", "question": "What is the difference between a module and a package?", "answer": "A **module** is a single `.py` file (or a compiled extension). A **package** is a directory of modules, usually with an `__init__.py`, imported with dotted names (`package.module`). Without `__init__.py` it's a namespace package.", "code": "import json, json.decoder, os\nprint(json.__file__.endswith(\"__init__.py\"), hasattr(json, \"__path__\"))\nprint(json.decoder.__name__, hasattr(os, \"__path__\"))", "terms": [["Regular package", "A directory with `__init__.py`."], ["Extension module", "A compiled `.so`/`.pyd` module written in C, C++ or Rust."]], "pitfall": "Naming your file after a stdlib module (`random.py`, `json.py`). The script directory comes first on `sys.path`, so your file shadows the real module; Python 3.13 warns about this in the error message.", "follow": [["Is a package also a module?", "Yes; a package is a module object with a `__path__` attribute."], ["What is a distribution?", "The installable unit on PyPI (a wheel or sdist), which may contain several top-level packages."]], "output": "True True\njson.decoder False", "num": 237, "sectionTitle": "Modules, Packages & Imports"}, {"section": 12, "level": "Easy", "question": "What are the different ways to import?", "answer": "- `import module` then `module.name`\n- `import package.module as alias`\n- `from module import name1, name2`\n- `from package import module`\n- relative inside packages: `from . import sibling`, `from ..utils import helper`\n- `from module import *` imports public names (those in `__all__` if defined); avoid it outside the REPL.", "code": "import math\nimport collections.abc as cabc\nfrom datetime import date, timedelta\nprint(math.pi, cabc.Mapping.__name__, date(2026, 9, 28) + timedelta(days=3))", "terms": [["Wildcard import", "`from m import *`; imports public names (or `__all__`)."]], "pitfall": "Using `from module import *` in application code. It hides where names come from and can silently overwrite existing names.", "follow": [["Does `from m import x` see later changes to `m.x`?", "No; it binds `x` to the object at import time. Rebinding `m.x` later is not reflected."], ["How does this affect mocking?", "Patch where the name is looked up: `mock.patch(\"mymodule.x\")`, not `\"m.x\"`, if `mymodule` did `from m import x`."]], "output": "3.141592653589793 Mapping 2026-10-01", "num": 238, "sectionTitle": "Modules, Packages & Imports"}, {"section": 12, "level": "Moderate", "question": "How does Python find a module when you import it?", "answer": "It checks `sys.modules` (cache) first. If not found, finders on `sys.meta_path` search built-in modules, frozen modules, then each directory in `sys.path` (the script's directory, `PYTHONPATH`, the standard library, site-packages). The module is executed once and cached.", "code": "import sys\nprint(type(sys.path).__name__, len(sys.path) > 0, \"json\" in sys.modules)\nimport json\nprint(\"json\" in sys.modules, [getattr(f, \"__name__\", type(f).__name__) for f in sys.meta_path])", "terms": [["`sys.path`", "List of directories and zip files searched for imports."], ["Finder / loader", "A finder locates a module spec; a loader executes the module code."]], "pitfall": "Running a script from inside a package directory. The script's directory becomes `sys.path[0]`, so absolute imports of the package fail; run it with `python -m package.module` from the project root.", "follow": [["How do you see where a module was loaded from?", "`module.__file__` or `module.__spec__.origin`."], ["How do you add a path at runtime?", "`sys.path.insert(0, path)`, but prefer installing the project (`pip install -e .`)."]], "output": "list True False\nTrue ['BuiltinImporter', 'FrozenImporter', 'PathFinder']", "num": 239, "sectionTitle": "Modules, Packages & Imports"}, {"section": 12, "level": "Moderate", "question": "What happens when you import the same module twice?", "answer": "The module body runs only the first time; later imports return the cached object from `sys.modules`. To re-execute (e.g. during development), use `importlib.reload(module)`.", "code": "import sys, types, importlib, tempfile, pathlib\nd = pathlib.Path(tempfile.mkdtemp()); sys.path.insert(0, str(d))\n(d / \"greet.py\").write_text('print(\"  module body executing\")\\nVALUE = 1\\n')\nimport greet\nimport greet\nprint(\"imported twice, body ran once; VALUE =\", greet.VALUE)\n(d / \"greet.py\").write_text('print(\"  reloaded body\")\\nVALUE = 2\\n')\nimportlib.invalidate_caches(); importlib.reload(greet)\nprint(\"after reload VALUE =\", greet.VALUE)", "terms": [["`sys.modules`", "Dict cache of loaded modules keyed by full dotted name."], ["`importlib.reload`", "Re-executes a module's code in the existing module object."]], "pitfall": "Expecting `reload` to update objects already imported elsewhere with `from m import x`, or existing instances of old classes. They still refer to the old objects.", "follow": [["How can the same file be imported as two modules?", "If it is reachable under two names (e.g. `pkg.mod` and `mod` via different `sys.path` entries); then it runs twice with separate state."], ["How do you force a fresh import in a test?", "Delete it from `sys.modules` and import again, or use `importlib.reload`."]], "output": "  module body executing\nimported twice, body ran once; VALUE = 1\n  reloaded body\nafter reload VALUE = 2", "num": 240, "sectionTitle": "Modules, Packages & Imports"}, {"section": 12, "level": "Moderate", "question": "What is `__init__.py` for?", "answer": "It marks a directory as a regular package and runs on first import of the package. Use it to expose a clean public API (`from .client import Client`), set `__all__`, or define package-level constants. Keep it light: heavy imports there slow every import of the package.", "code": "", "terms": [["Public API surface", "Names re-exported by `__init__.py` so users can write `from pkg import Client`."]], "pitfall": "Importing heavy submodules eagerly in `__init__.py`. Every `import pkg` pays the cost; use a lazy `__getattr__` for rarely used parts.", "follow": [["Can `__init__.py` be empty?", "Yes, and it often is."], ["What runs when you `import pkg.sub`?", "First `pkg/__init__.py`, then `pkg/sub.py`."]], "output": "", "num": 241, "sectionTitle": "Modules, Packages & Imports"}, {"section": 12, "level": "Moderate", "question": "What is `__all__`?", "answer": "A list of public names in a module. It controls what `from module import *` imports and documents the public API for tools and readers. It doesn't prevent explicit imports of other names.", "code": "import sys, types\nmod = types.ModuleType(\"shapes\")\nexec(\"__all__ = ['area']\\ndef area(): return 1\\ndef _helper(): pass\\ndef debug(): pass\", mod.__dict__)\nsys.modules[\"shapes\"] = mod\nns = {}\nexec(\"from shapes import *\", ns)\nprint(sorted(k for k in ns if not k.startswith(\"__\")))", "terms": [["Public name", "A name without a leading underscore, or one listed in `__all__`."]], "pitfall": "Listing a name in `__all__` that does not exist. `from m import *` then raises `AttributeError`; linters can check this.", "follow": [["Does `__all__` affect `import m`?", "No, only star imports and tooling such as documentation generators and type checkers."], ["What goes in `__all__` of a package's `__init__.py`?", "The re-exported public API, which also tells type checkers these imports are intentional re-exports."]], "output": "['area']", "num": 242, "sectionTitle": "Modules, Packages & Imports"}, {"section": 12, "level": "Difficult", "question": "What causes circular imports, and how do you fix them?", "answer": "Module A imports B while B imports A. The second import gets a **partially initialized** module, so names defined later aren't there yet and you get `ImportError: cannot import name ...` (older versions add \"most likely due to a circular import\"). Fixes: move shared code into a third module, import inside the function that needs it, import the module (`import a`) instead of names (`from a import x`), or restructure dependencies.", "code": "import sys, tempfile, pathlib, subprocess\nd = pathlib.Path(tempfile.mkdtemp())\n(d / \"orders.py\").write_text(\"from customers import Customer\\nclass Order: pass\\n\")\n(d / \"customers.py\").write_text(\"from orders import Order\\nclass Customer: pass\\n\")\nr = subprocess.run([sys.executable, \"-c\", \"import orders\"], cwd=d, capture_output=True, text=True)\nprint(r.stderr.strip().splitlines()[-1].split(\" (\")[0])", "terms": [["Partially initialized module", "A module object in `sys.modules` whose code has not finished running."]], "pitfall": "\"Fixing\" a cycle by moving imports around until it happens to work. It breaks again on the next refactor; extract the shared code into a third module.", "follow": [["How can type hints cause cycles, and how do you avoid it?", "Import only for type checking under `if TYPE_CHECKING:`; with 3.14 lazy annotations, no string quotes are needed."], ["Why does `import a` often work where `from a import x` fails?", "`import a` only needs the module object, while `from a import x` needs `x` to already be defined."]], "output": "ImportError: cannot import name 'Order' from 'orders'", "num": 243, "sectionTitle": "Modules, Packages & Imports"}, {"section": 12, "level": "Moderate", "question": "Absolute vs relative imports?", "answer": "Absolute imports use the full path from the project root (`from myapp.utils import slugify`
