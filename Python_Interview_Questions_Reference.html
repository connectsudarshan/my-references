l for the whole function body, so the earlier `print(x)` reads an unassigned local.", "code": "x = 10\ndef f():\n    print(x)\n    x = 5\ntry:\n    f()\nexcept UnboundLocalError as e:\n    print(\"UnboundLocalError:\", e)", "output": "UnboundLocalError: cannot access local variable 'x' where it is not associated with a value", "num": 431, "sectionTitle": "Tricky Questions & Gotchas"}, {"section": 21, "level": "Moderate", "question": "Why does `sorted(['b', 'A', 'c'])` put 'A' first, and how do you sort case-insensitively?", "answer": "Strings compare by Unicode code point, and uppercase letters come before lowercase. Use `key=str.casefold` (or `str.lower`).", "code": "words = [\"banana\", \"apple\", \"Cherry\"]\nprint(sorted(words), sorted(words, key=str.casefold))", "output": "['Cherry', 'apple', 'banana'] ['apple', 'banana', 'Cherry']", "num": 432, "sectionTitle": "Tricky Questions & Gotchas"}, {"section": 21, "level": "Moderate", "question": "What does `sorted` do with mixed types like `[1, 'a']` in Python 3?", "answer": "It raises `TypeError` because `<` isn't defined between `int` and `str`. Python 2 allowed arbitrary cross-type ordering; Python 3 removed it. Provide a `key` that maps everything to comparable values.", "code": "try:\n    sorted([3, \"a\", 1])\nexcept TypeError as e:\n    print(\"TypeError:\", e)\nprint(sorted([3, \"a\", 1], key=str))", "output": "TypeError: '<' not supported between instances of 'str' and 'int'\n[1, 3, 'a']", "num": 433, "sectionTitle": "Tricky Questions & Gotchas"}, {"section": 21, "level": "Moderate", "question": "What does `print(1 < 2 < 3, 3 > 2 > 1, 1 < 3 > 2)` print?", "answer": "`True True True`. Comparisons chain: `a < b < c` means `a < b and b < c`. So `1 < 3 > 2` is `1 < 3 and 3 > 2`, which is True, although it reads strangely.", "code": "print(1 < 2 < 3, 3 > 2 > 1, 1 < 3 > 2, (1 < 3) > 2)", "output": "True True True False", "num": 434, "sectionTitle": "Tricky Questions & Gotchas"}, {"section": 21, "level": "Difficult", "question": "Why is `nan` in a list found by `in` but not equal to itself?", "answer": "`float('nan') != float('nan')` by IEEE 754 rules, but container membership checks **identity first** (`x is item or x == item`). The same NaN object is found; a different NaN object is not.", "code": "nan = float(\"nan\")\nprint(nan == nan, nan in [nan], float(\"nan\") in [nan])", "output": "False True False", "num": 435, "sectionTitle": "Tricky Questions & Gotchas"}, {"section": 21, "level": "Moderate", "question": "What does `len({1, 1.0, True})` return?", "answer": "`1`. `1`, `1.0` and `True` are equal and have the same hash, so the set keeps only the first one.", "code": "s = {1, 1.0, True}\nprint(len(s), s)", "output": "1 {1}", "num": 436, "sectionTitle": "Tricky Questions & Gotchas"}, {"section": 21, "level": "Moderate", "question": "Why does a generator produce nothing the second time you loop over it?", "answer": "A generator is an iterator: it's exhausted after one pass and stays empty. Recreate it, store results in a list, or wrap the logic in an iterable class whose `__iter__` makes a new generator.", "code": "g = (x * x for x in range(3))\nprint(list(g), list(g))", "output": "[0, 1, 4] []", "num": 437, "sectionTitle": "Tricky Questions & Gotchas"}, {"section": 21, "level": "Moderate", "question": "What does `print(type(()), type((1)), type((1,)))` show?", "answer": "`<class 'tuple'> <class 'int'> <class 'tuple'>`. Parentheses alone don't make a tuple; the **comma** does. `(1)` is just the integer 1.", "code": "print(type(()), type((1)), type((1,)), type(1,))", "output": "<class 'tuple'> <class 'int'> <class 'tuple'> <class 'int'>", "num": 438, "sectionTitle": "Tricky Questions & Gotchas"}, {"section": 21, "level": "Difficult", "question": "Class attribute trap: why do all instances share this list?", "answer": "`items = []` in the class body is a **class** attribute, created once and shared by all instances. `self.items.append(...)` mutates that shared list. Initialize mutable state in `__init__` (or `field(default_factory=list)` in dataclasses).", "code": "class Cart:\n    items = []\n    def add(self, x): self.items.append(x)\na, b = Cart(), Cart()\na.add(\"pen\")\nprint(b.items, Cart.items)", "output": "['pen'] ['pen']", "num": 439, "sectionTitle": "Tricky Questions & Gotchas"}, {"section": 21, "level": "Moderate", "question": "What does `\"abc\" * -1` and `[1, 2][5:10]` return?", "answer": "An empty string and an empty list. Multiplying a sequence by zero or a negative number gives an empty sequence, and slicing never raises `IndexError` for out-of-range bounds (indexing does).", "code": "print(repr(\"abc\" * -1), [1, 2][5:10])\ntry:\n    [1, 2][5]\nexcept IndexError as e:\n    print(\"IndexError:\", e)", "output": "'' []\nIndexError: list index out of range", "num": 440, "sectionTitle": "Tricky Questions & Gotchas"}, {"section": 21, "level": "Moderate", "question": "Does `except Exception` catch `KeyboardInterrupt` and `SystemExit`?", "answer": "No. Both inherit from `BaseException`, not `Exception`, precisely so that generic handlers don't block Ctrl+C or `sys.exit()`. A bare `except:` does catch them, which is why it's discouraged.", "code": "print(issubclass(KeyboardInterrupt, Exception), issubclass(SystemExit, BaseException))", "output": "False True", "num": 441, "sectionTitle": "Tricky Questions & Gotchas"}, {"section": 21, "level": "Difficult", "question": "Why can't you use a list as a dict key, but you can use a tuple (sometimes)?", "answer": "Dict keys must be hashable, and a hash must not change while the key is in the dict. Lists are mutable, so they're unhashable. Tuples are hashable only if all their items are hashable: `(1, 2)` works, `(1, [2])` doesn't.", "code": "d = {(1, 2): \"ok\"}\nfor key in ([1, 2], (1, [2])):\n    try:\n        d[key] = \"x\"\n    except TypeError as e:\n        print(type(key).__name__, \"->\", e)", "output": "list -> cannot use 'list' as a dict key (unhashable type: 'list')\ntuple -> cannot use 'tuple' as a dict key (unhashable type: 'list')", "num": 442, "sectionTitle": "Tricky Questions & Gotchas"}, {"section": 21, "level": "Moderate", "question": "What's the output of `print(\"%s\" % (1, 2))`?", "answer": "`TypeError: not all arguments converted during string formatting`. A tuple on the right of `%` is treated as the argument list. To print a tuple with one `%s`, wrap it: `\"%s\" % ((1, 2),)`, or use f-strings.", "code": "try:\n    print(\"%s\" % (1, 2))\nexcept TypeError as e:\n    print(\"TypeError:\", e)\nt = (1, 2)\nprint(\"%s\" % (t,), f\"{t}\")", "output": "TypeError: not all arguments converted during string formatting\n(1, 2) (1, 2)", "num": 443, "sectionTitle": "Tricky Questions & Gotchas"}, {"section": 21, "level": "Difficult", "question": "Why does `x = x.sort()` leave `x` as None?", "answer": "In-place methods (`list.sort`, `list.append`, `list.reverse`, `dict.update`, `random.shuffle`) return `None` by convention, to make clear they mutate rather than return a new object. Use `sorted(x)` for a new list, or call `x.sort()` without assigning.", "code": "x = [3, 1, 2]\nx = x.sort()\nprint(x)\ny = [3, 1, 2]\nprint(sorted(y), y)", "output": "None\n[1, 2, 3] [3, 1, 2]", "num": 444, "sectionTitle": "Tricky Questions & Gotchas"}, {"section": 21, "level": "Moderate", "question": "Does `is` work for comparing strings?", "answer": "Not reliably. Short identifier-like strings and compile-time constants are often interned (same object), so `is` may appear to work, but strings built at runtime usually aren't. Always use `==` for string comparison.", "code": "a = \"nvme\"\nb = \"\".join([\"nv\", \"me\"])\nprint(a == b, a is b)", "output": "True False", "num": 445, "sectionTitle": "Tricky Questions & Gotchas"}, {"section": 21, "level": "Difficult", "question": "What does `print(any([]), all([]))` print, and why?", "answer": "`False True`. `any` asks \"is at least one item true?\" (none exist, so False); `all` asks \"is there any item that is false?\" (none exist, so it's vacuously True). This matters for validations like `all(check(x) for x in results)` on an empty results list.", "code": "print(any([]), all([]))\nresults = []\nprint(\"all tests passed?\", all(r == \"PASS\" for r in results), \"<- vacuous truth: guard for empty input\")", "output": "False True\nall tests passed? True <- vacuous truth: guard for empty input", "num": 446, "sectionTitle": "Tricky Questions & Gotchas"}, {"section": 21, "level": "Moderate", "question": "What is the output of `print(list(zip([1, 2, 3], 'ab')))`?", "answer": "`[(1, 'a'), (2, 'b')]`. `zip` stops at the shortest input silently, which can hide data loss. Use `zip(..., strict=True)` (3.10+) to raise on mismatched lengths, or `itertools.zip_longest` to pad.", "code": "print(list(zip([1, 2, 3], \"ab\")))\ntry:\n    list(zip([1, 2, 3], \"ab\", strict=True))\nexcept ValueError as e:\n    print(\"ValueError:\", e)", "output": "[(1, 'a'), (2, 'b')]\nValueError: zip() argument 2 is shorter than argument 1", "num": 447, "sectionTitle": "Tricky Questions & Gotchas"}, {"section": 21, "level": "Difficult", "question": "Why does `json.loads(json.dumps({1: (2, 3)}))` not round-trip?", "answer": "JSON object keys are always strings and JSON has no tuple type, so `{1: (2, 3)}` comes back as `{'1': [2, 3]}`. Serialize and deserialize with explicit schemas or conversion when types matter.", "code": "import json\noriginal = {1: (2, 3)}\nback = json.loads(json.dumps(original))\nprint(back, back == original)", "output": "{'1': [2, 3]} False", "num": 448, "sectionTitle": "Tricky Questions & Gotchas"}, {"section": 21, "level": "Moderate", "question": "What does `datetime.now()` get wrong in distributed systems?", "answer": "It returns a **naive** local time with no timezone. Comparing or storing naive datetimes from servers in different zones (or across DST changes) gives wrong results. Use `datetime.now(timezone.utc)` for storage and convert for display.", "code": "from datetime import datetime, timezone\nnaive, aware = datetime.now(), datetime.now(timezone.utc)\nprint(naive.tzinfo, aware.tzinfo)\ntry:\n    naive < aware\nexcept TypeError as e:\n    print(\"TypeError:\", e)", "output": "None UTC\nTypeError: can't compare offset-naive and offset-aware datetimes", "num": 449, "sectionTitle": "Tricky Questions & Gotchas"}];
const SECTIONS = {"1": "Python Basics & Syntax", "2": "Data Types, Variables & Mutability", "3": "Strings & Text", "4": "Lists, Tuples, Dicts & Sets", "5": "Functions, Arguments & Scope", "6": "Object-Oriented Programming", "7": "Inheritance, MRO & Polymorphism", "8": "Dunder Methods & the Data Model", "9": "Iterators, Generators & Comprehensions", "10": "Decorators & Context Managers", "11": "Exceptions & Error Handling", "12": "Modules, Packages & Imports", "13": "Memory Management & Garbage Collection", "14": "Concurrency: GIL, Threads, Processes & asyncio", "15": "Standard Library Essentials", "16": "Type Hints & Modern Python (3.8 - 3.14)", "17": "Metaprogramming: Descriptors, Metaclasses & __slots__", "18": "Testing, Debugging & Logging", "19": "Performance & Optimization", "20": "Coding Problems (Interview-Round Style)", "21": "Tricky Questions & Gotchas"};
const SECTION_ORDER = Object.keys(SECTIONS).map(Number);
const LV_COLOR = {Easy:'var(--easy)', Moderate:'var(--moderate)', Difficult:'var(--difficult)'};

let activeLevels = new Set(['Easy','Moderate','Difficult']);
let onlyUnknown = false, onlyCode = false, quiz = false, revealed = false;
let query = '', current = null;
const collapsed = new Set();

const KEY = 'pyqa-known';
let known = new Set();
try { known = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch(e) {}
try { quiz = localStorage.getItem('pyqa-quiz') === '1'; } catch(e) {}
function saveKnown(){ try { localStorage.setItem(KEY, JSON.stringify([...known])); } catch(e) {} }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inline(s){
  return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
}
function renderAnswer(text){
  return text.split(/\n\s*\n/).map(block=>{
    const lines = block.split('\n');
    if (lines.every(l=>/^\s*- /.test(l))) return '<ul>'+lines.map(l=>'<li>'+inline(l.replace(/^\s*- /,''))+'</li>').join('')+'</ul>';
    return '<p>'+inline(lines.join(' '))+'</p>';
  }).join('');
}
function matches(q){
  if (!activeLevels.has(q.level)) return false;
  if (onlyUnknown && known.has(q.num)) return false;
  if (onlyCode && !q.code) return false;
  if (query){
    const h = (q.question+' '+q.answer+' '+q.code).toLowerCase();
    if (!query.toLowerCase().split(/\s+/).every(w=>h.includes(w))) return false;
  }
  return true;
}
function filtered(){ return QUESTIONS.filter(matches); }

function buildFilters(){
  const lf = document.getElementById('levelFilters');
  ['Easy','Moderate','Difficult'].forEach(l=>{
    const c = document.createElement('button');
    c.className='chip active'; c.textContent=l;
    c.onclick=()=>{ activeLevels.has(l)?activeLevels.delete(l):activeLevels.add(l); c.classList.toggle('active'); buildSidebar(); };
    lf.appendChild(c);
  });
  const ef = document.getElementById('extraFilters');
  [['Not known yet',()=>onlyUnknown=!onlyUnknown],['Has code',()=>onlyCode=!onlyCode]].forEach(([label,fn])=>{
    const c = document.createElement('button');
    c.className='chip'; c.textContent=label;
    c.onclick=()=>{ fn(); c.classList.toggle('active'); buildSidebar(); };
    ef.appendChild(c);
  });
}

function buildSidebar(){
  const box = document.getElementById('navGroups');
  box.innerHTML='';
  let shown = 0;
  SECTION_ORDER.forEach(s=>{
    const items = QUESTIONS.filter(q=>q.section===s && matches(q));
    if (!items.length) return;
    shown += items.length;
    const label = document.createElement('div');
    label.className='nav-group-label';
    label.innerHTML='<span>'+s+'. '+esc(SECTIONS[s]).toUpperCase()+'</span><span>'+(collapsed.has(s)?'+':'−')+' '+items.length+'</span>';
    label.onclick=()=>{ collapsed.has(s)?collapsed.delete(s):collapsed.add(s); buildSidebar(); };
    box.appendChild(label);
    if (collapsed.has(s)) return;
    items.forEach(q=>{
      const el = document.createElement('div');
      el.className='nav-item'+(current&&current.num===q.num?' active':''); el.id='nav-'+q.num; el.tabIndex=0;
      el.innerHTML='<span class="lv" style="background:'+LV_COLOR[q.level]+'"></span><span class="qnum">Q'+q.num+'</span><span>'+inline(q.question.length>70?q.question.slice(0,68)+'…':q.question)+'</span>'+(known.has(q.num)?'<span class="known">✓</span>':'');
      el.onclick=()=>go(q.num);
      el.onkeydown=e=>{ if(e.key==='Enter'){ go(q.num);} };
      box.appendChild(el);
    });
  });
  if (!shown) box.innerHTML='<div class="empty">No questions match these filters.</div>';
  document.getElementById('statShown').textContent = shown;
  document.getElementById('statKnown').textContent = known.size;
}

function renderHome(){
  const withCode = QUESTIONS.filter(q=>q.code).length, withOut = QUESTIONS.filter(q=>q.output).length;
  let h = '<div class="home-hero"><p class="kicker">OVERVIEW</p><h2>Python Interview Questions</h2>'+
    '<p>'+QUESTIONS.length+' questions from basics to internals, grouped into '+SECTION_ORDER.length+' topics and three difficulty levels. Every code example on this page was executed with Python 3.14 when the page was built, and its real output is shown beneath it. Use quiz mode to hide answers, and mark questions you know to filter them out next time.</p>'+
    '<div class="home-stats">'+
      '<div class="stat-box"><div class="n">'+QUESTIONS.length+'</div><div class="l">Questions</div></div>'+
      '<div class="stat-box"><div class="n">'+withCode+'</div><div class="l">With code</div></div>'+
      '<div class="stat-box"><div class="n">'+withOut+'</div><div class="l">With executed output</div></div>'+
      '<div class="stat-box"><div class="n">'+known.size+'</div><div class="l">Marked known</div></div>'+
    '</div></div>'+
    '<div class="section-label">TOPICS</div><div class="section-list">';
  SECTION_ORDER.forEach(s=>{
    const qs = QUESTIONS.filter(q=>q.section===s);
    const k = qs.filter(q=>known.has(q.num)).length;
    const lv = l=>qs.filter(q=>q.level===l).length;
    h += '<button class="section-card" onclick="go('+qs[0].num+')"><div class="sc-title">'+s+'. '+esc(SECTIONS[s])+'</div>'+
      '<div class="sc-meta"><span>'+qs.length+' questions</span><span>'+lv('Easy')+' · '+lv('Moderate')+' · '+lv('Difficult')+'</span></div>'+
      '<div class="bar"><span style="width:'+(100*k/qs.length)+'%"></span></div></button>';
  });
  h += '</div><div class="section-label">HOW TO USE THIS PAGE</div><ul class="tips">'+
    '<li><b>← / →</b> move through the questions in the current filter; <b>R</b> jumps to a random one; <b>Space</b> reveals the answer in quiz mode; <b>K</b> marks it known.</li>'+
    '<li>The level chips filter by difficulty. "Not known yet" hides what you have already marked.</li>'+
    '<li>For design patterns in depth, open the companion page <i>Python Design Patterns Field Reference</i>.</li></ul>';
  return h;
}

function renderQuestion(q){
  const list = filtered(), i = list.findIndex(x=>x.num===q.num);
  const prev = i>0?list[i-1]:null, next = i>=0&&i<list.length-1?list[i+1]:null;
  const hide = quiz && !revealed;
  let body;
  if (hide){
    body = '<div class="reveal"><button class="btn on" onclick="reveal()">Show answer (Space)</button></div>';
  } else {
    body = '<div class="q-answer">'+renderAnswer(q.answer)+'</div>';
    if (q.code){
      body += '<div class="code-stack"><div class="code-wrap"><span class="code-label">PYTHON</span><pre><code class="language-python">'+esc(q.code)+'</code></pre></div>'+
        (q.output?'<div class="code-wrap out-wrap"><span class="code-label out">OUTPUT</span><pre><code class="nohighlight">'+esc(q.output)+'</code></pre></div>':'')+'</div>';
    }
  }
  const k = known.has(q.num);
  return '<div class="qcard"><div class="q-meta"><span class="level-badge '+q.level+'">'+q.level.toUpperCase()+'</span>'+
    '<span class="q-num">Q'+q.num+' · Section '+q.section+': '+esc(q.sectionTitle)+'</span></div>'+
    '<h2 class="q-title">'+inline(q.question)+'</h2>'+body+
    '<div class="q-actions"><button class="btn'+(k?' done':'')+'" onclick="toggleKnown('+q.num+')">'+(k?'✓ Known':'Mark as known (K)')+'</button></div>'+
    '<div class="footer-nav">'+
      '<button class="btn" '+(prev?'onclick="go('+prev.num+')"':'disabled')+'><span class="dir">← PREV</span>'+(prev?'Q'+prev.num:'')+'</button>'+
      '<button class="btn" '+(next?'onclick="go('+next.num+')"':'disabled')+' style="text-align:right"><span class="dir">NEXT →</span>'+(next?'Q'+next.num:'')+'</button>'+
    '</div><p class="kbd-hint">'+(i+1)+' of '+list.length+' in current filter</p></div>';
}

function paint(){
  const c = document.getElementById('content');
  if (!current){ c.innerHTML = renderHome(); document.getElementById('crumbCurrent').textContent='Overview'; }
  else {
    c.innerHTML = renderQuestion(current);
    document.getElementById('crumbCurrent').textContent = 'Q'+current.num+' · '+current.sectionTitle;
    if (window.hljs) c.querySelectorAll('pre code.language-python').forEach(el=>hljs.highlightElement(el));
  }
}
function go(num){
  current = num ? QUESTIONS.find(q=>q.num===Number(num)) || null : null;
  revealed = false;
  document.querySelectorAll('.nav-item.active').forEach(e=>e.classList.remove('active'));
  if (current){
    const el = document.getElementById('nav-'+current.num);
    if (el){ el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
    if (location.hash !== '#q'+current.num) history.replaceState(null,'','#q'+current.num);
  } else if (location.hash) history.replaceState(null,'',location.pathname+location.search);
  paint();
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo(0,0);
}
function reveal(){ revealed = true; paint(); }
function toggleKnown(n){ known.has(n)?known.delete(n):known.add(n); saveKnown(); buildSidebar(); paint(); }
function step(d){
  if (!current) { const l = filtered(); if (l.length) go(l[0].num); return; }
  const l = filtered(), i = l.findIndex(x=>x.num===current.num);
  const t = l[i+d]; if (t) go(t.num);
}
function random(){ const l = filtered(); if (l.length) go(l[Math.floor(Math.random()*l.length)].num); }
function setQuiz(v){
  quiz = v; try { localStorage.setItem('pyqa-quiz', v?'1':'0'); } catch(e) {}
  const b = document.getElementById('quizBtn'); b.textContent = 'Quiz mode: '+(v?'on':'off'); b.classList.toggle('on', v);
  revealed = false; paint();
}

document.getElementById('search').addEventListener('input', e=>{ query = e.target.value.trim(); buildSidebar(); });
document.getElementById('quizBtn').onclick = ()=>setQuiz(!quiz);
document.getElementById('randBtn').onclick = random;
document.addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key==='ArrowRight') step(1);
  else if (e.key==='ArrowLeft') step(-1);
  else if (e.key==='r' || e.key==='R') random();
  else if ((e.key==='k' || e.key==='K') && current) toggleKnown(current.num);
  else if (e.key===' ' && current && quiz && !revealed){ e.preventDefault(); reveal(); }
});
window.addEventListener('hashchange', ()=>{ const m = location.hash.match(/^#q(\d+)$/); go(m?m[1]:null); });

buildFilters();
setQuiz(quiz);
buildSidebar();
const m0 = location.hash.match(/^#q(\d+)$/);
go(m0 ? m0[1] : null);
</script>
