l": "Writing to a `ChainMap` expecting to update the layer where the key was found. Writes and deletes always go to the first mapping.", "follow": [["How do you add a new scope?", "`cm.new_child()` returns a ChainMap with a fresh dict in front; `.parents` drops it."], ["How does `SimpleNamespace` differ from a dict?", "It uses attribute access and has a readable repr; convert with `vars(ns)`."]], "output": "8080 True {'port': 8080, 'debug': True}\nnamespace(name='riya', role='admin', active=True)", "num": 303, "sectionTitle": "Standard Library Essentials"}, {"section": 15, "level": "Moderate", "question": "How do you measure execution time of a snippet?", "answer": "`timeit` for micro-benchmarks (runs many times, disables GC by default); `time.perf_counter()` for wall-clock timing of code blocks; `cProfile` for finding where time goes in a whole program.", "code": "import timeit\nprint(f\"{timeit.timeit('sum(range(1000))', number=10_000) * 100:.2f} us per call\")\nbest = min(timeit.repeat(\"'-'.join(map(str, range(100)))\", number=10_000, repeat=3))\nprint(f\"join: best of 3 = {best * 100:.2f} us per call\")", "terms": [["Warm-up", "Initial runs affected by caching or JIT specialization, which benchmarks should exclude."]], "pitfall": "Timing a single run with `time.time()` and comparing two versions. Noise dominates; repeat many times and compare minimums or medians.", "follow": [["What is `pyperf`?", "A benchmarking tool that spawns worker processes, calibrates loops and reports statistics; used for CPython's own benchmarks."], ["How do you time in IPython or Jupyter?", "`%timeit expr` and `%%timeit` for a whole cell."]], "output": "6.23 us per call\njoin: best of 3 = 4.43 us per call", "num": 304, "sectionTitle": "Standard Library Essentials"}, {"section": 15, "level": "Moderate", "question": "What is `decimal.Decimal` and when must you use it?", "answer": "Exact base-10 arithmetic with configurable precision and rounding. Use it for money, tax and billing, where binary float rounding errors are unacceptable. Construct from strings, not floats.", "code": "from decimal import Decimal, ROUND_HALF_UP\nprint(Decimal(0.1), \"|\", Decimal(\"0.1\"))\nprice, qty, gst = Decimal(\"19.99\"), 3, Decimal(\"0.18\")\ntotal = (price * qty * (1 + gst)).quantize(Decimal(\"0.01\"), ROUND_HALF_UP)\nprint(total, sum([0.1] * 10), sum([Decimal(\"0.1\")] * 10))", "terms": [["Context", "Precision, rounding mode and traps for Decimal operations (`decimal.getcontext()`, `localcontext()`)."], ["`quantize`", "Rounds to a fixed exponent, such as two decimal places."]], "pitfall": "Mixing `Decimal` and `float` in arithmetic. It raises `TypeError`, and converting floats with `Decimal(0.1)` imports binary error; build from strings.", "follow": [["What does precision mean for Decimal?", "Significant digits (default 28), not decimal places."], ["How do you store money in a database?", "Use a DECIMAL/NUMERIC column, or integer minor units (cents)."]], "output": "0.1000000000000000055511151231257827021181583404541015625 | 0.1\n70.76 1.0 1.0", "num": 305, "sectionTitle": "Standard Library Essentials"}, {"section": 15, "level": "Moderate", "question": "What does `shutil` provide?", "answer": "High-level file operations: `copy2` (with metadata), `copytree`, `rmtree`, `move`, `make_archive`/`unpack_archive`, `disk_usage`, and `which` (find an executable on PATH).", "code": "import shutil, tempfile, pathlib\nsrc = pathlib.Path(tempfile.mkdtemp(), \"project\"); (src / \"pkg\").mkdir(parents=True)\n(src / \"pkg\" / \"a.py\").write_text(\"x = 1\"); (src / \"notes.tmp\").write_text(\"scratch\")\ndst = src.parent / \"backup\"\nshutil.copytree(src, dst, ignore=shutil.ignore_patterns(\"*.tmp\"))\nprint(sorted(p.relative_to(dst).as_posix() for p in dst.rglob(\"*\")))\nshutil.rmtree(dst); print(\"removed:\", not dst.exists())", "terms": [["`copy2`", "Copies a file with its metadata (timestamps)."]], "pitfall": "Calling `shutil.rmtree` on a path built from user input or an unchecked variable. An empty or wrong value can delete far more than intended; validate the path first.", "follow": [["How do you find an executable on PATH?", "`shutil.which(\"git\")`."], ["What does `copytree(dirs_exist_ok=True)` do?", "(3.8+) Copies into an existing destination instead of raising."]], "output": "['pkg', 'pkg/a.py']\nremoved: True", "num": 306, "sectionTitle": "Standard Library Essentials"}, {"section": 15, "level": "Difficult", "question": "How do you use `sqlite3` from Python safely?", "answer": "Always use **parameterized queries** (`?` placeholders), never f-strings, to prevent SQL injection. Use the connection as a context manager for transactions, set `row_factory = sqlite3.Row` for dict-like rows.", "code": "import sqlite3\ncon = sqlite3.connect(\":memory:\")\ncon.row_factory = sqlite3.Row\ncon.execute(\"CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT)\")\nwith con:\n    con.executemany(\"INSERT INTO users (name) VALUES (?)\", [(\"riya\",), (\"arjun\",)])\nevil = \"x' OR '1'='1\"\nprint(con.execute(\"SELECT count(*) FROM users WHERE name = ?\", (evil,)).fetchone()[0], \"rows (injection blocked)\")\nrow = con.execute(\"SELECT * FROM users WHERE name = ?\", (\"riya\",)).fetchone()\nprint(dict(row))", "terms": [["Parameterized query", "SQL with placeholders whose values are sent separately, so they cannot change the query structure."], ["`autocommit`", "(3.12+) connection attribute that selects PEP 249-compliant transaction control."]], "pitfall": "Using the connection as a context manager and expecting it to close. `with conn:` commits or rolls back a transaction but does not close the connection.", "follow": [["How do you get rows as dicts?", "`conn.row_factory = sqlite3.Row`, then access by column name."], ["How do you use SQLite from multiple threads?", "One connection per thread, or `check_same_thread=False` with your own locking; enable WAL mode for concurrent readers."]], "output": "0 rows (injection blocked)\n{'id': 1, 'name': 'riya'}", "num": 307, "sectionTitle": "Standard Library Essentials"}, {"section": 15, "level": "Moderate", "question": "What does the `statistics` module offer?", "answer": "Basic statistics without NumPy: `mean`, `fmean`, `median`, `mode`, `stdev`, `pstdev`, `quantiles`, `correlation` and `linear_regression` (3.10+).", "code": "import statistics as st\nlatencies = [120, 95, 101, 3000, 110, 99, 105]\nprint(st.mean(latencies), st.median(latencies), round(st.stdev(latencies)))\nprint(st.quantiles(latencies, n=4))", "terms": [["`pstdev` vs `stdev`", "Population versus sample standard deviation."]], "pitfall": "Using `statistics` on millions of values in a hot path. It is written for correctness with exact arithmetic, not speed; use NumPy for large arrays.", "follow": [["What does `statistics.quantiles` return?", "n-1 cut points dividing the data into n intervals (quartiles by default)."], ["What is `NormalDist` for?", "Normal-distribution math: `cdf`, `inv_cdf`, `overlap`, and building one from samples."]], "output": "518.5714285714286 105 1094\n[99.0, 105.0, 120.0]", "num": 308, "sectionTitle": "Standard Library Essentials"}, {"section": 15, "level": "Difficult", "question": "How do you make HTTP requests with only the stdlib?", "answer": "`urllib.request` can do it (`urlopen`, `Request` with headers and data), and `http.client` is lower level. In practice most projects use `requests` or `httpx` (sync and async) for sessions, retries and JSON convenience.", "code": "import urllib.request, json\nreq = urllib.request.Request(\"https://api.example.com/orders\", data=json.dumps({\"id\": 1}).encode(),\n                             headers={\"Content-Type\": \"application/json\"}, method=\"POST\")\nprint(req.get_method(), req.full_url, req.headers)", "terms": [["`urllib.request.Request`", "Object carrying URL, method, headers and body."]], "pitfall": "Calling `urlopen` without a timeout. The default is to wait forever on an unresponsive server; always pass `timeout=`.", "follow": [["Why prefer `httpx` or `requests`?", "Connection pooling, simpler JSON handling, sessions, retries, and in httpx's case async and HTTP/2."], ["How do you send JSON with urllib?", "Encode it with `json.dumps(...).encode()` and set `Content-Type: application/json`."]], "output": "POST https://api.example.com/orders {'Content-type': 'application/json'}", "num": 309, "sectionTitle": "Standard Library Essentials"}, {"section": 16, "level": "Easy", "question": "What are type hints and are they enforced?", "answer": "Annotations describing expected types (`def f(x: int) -> str`). CPython does **not** enforce them at runtime; static checkers (mypy, pyright), IDEs and some libraries (Pydantic, FastAPI, dataclasses) use them. They document intent and catch bugs before running.", "code": "def total(prices: list[float], tax: float = 0.18) -> float:\n    return round(sum(prices) * (1 + tax), 2)\nprint(total([10.0, 20.0]))\nprint(total.__annotations__)", "terms": [["Static type checker", "A tool that analyzes code without running it: mypy, pyright, pyrefly, ty."]], "pitfall": "Adding type hints but never running a type checker in CI. The hints drift out of date and give readers false confidence.", "follow": [["Do type hints make code faster?", "Not in CPython; compilers like mypyc and Cython can use them for speed."], ["What does `Any` mean?", "An escape hatch that disables checking for that value in both directions."]], "output": "35.4\n{'prices': list[float], 'tax': <class 'float'>, 'return': <class 'float'>}", "num": 310, "sectionTitle": "Type Hints & Modern Python (3.8 - 3.14)"}, {"section": 16, "level": "Moderate", "question": "What is the modern syntax for common type hints?", "answer": "Since 3.9 use built-in generics: `list[int]`, `dict[str, float]`, `tuple[int, ...]`. Since 3.10 use `X | Y` instead of `Union`, and `X | None` instead of `Optional[X]`. `collections.abc.Iterable`, `Callable`, `Mapping` for flexible parameters.", "code": "from collections.abc import Callable, Iterable\ndef apply(fn: Callable[[int], int], values: Iterable[int]) -> list[int]:\n    return [fn(v) for v in values]\ndef find(users: dict[str, int], name: str) -> int | None:\n    return users.get(name)\nprint(apply(lambda v: v * 2, (1, 2, 3)), find({\"riya\": 1}, \"arjun\"))", "terms": [["`X | None`", "Modern spelling of `Optional[X]` (3.10+)."], ["`collections.abc` types", "Preferred for parameter types: `Iterable`, `Sequence`, `Mapping`, `Callable`."]], "pitfall": "Annotating parameters as `list[str]` when any iterable works. Callers then cannot pass tuples or generators; accept `Iterable[str]` and return concrete types.", "follow": [["What does `tuple[int, ...]` mean?", "A tuple of any length whose items are ints; `tuple[int, str]` is exactly two items."], ["How do you annotate a callable?", "`Callable[[int, str], bool]`, or a Protocol with `__call__` for keyword arguments."]], "output": "[2, 4, 6] None", "num": 311, "sectionTitle": "Type Hints & Modern Python (3.8 - 3.14)"}, {"section": 16, "level": "Moderate", "question": "What are generics and `TypeVar`? What's the 3.12 syntax?", "answer": "Generics let functions and classes be typed over a type parameter. Before 3.12: `T = TypeVar(\"T\")`. Since 3.12 (PEP 695): `def first[T](xs: list[T]) -> T` and `class Stack[T]:`, plus `type Alias = ...` statements.", "code": "def first[T](items: list[T]) -> T:\n    return items[0]\nclass Stack[T]:\n    def __init__(self) -> None: self._items: list[T] = []\n    def push(self, item: T) -> None: self._items.append(item)\n    def pop(self) -> T: return self._items.pop()\ntype Pair[K] = tuple[K, K]\ns = Stack[int](); s.push(5)\nprint(first([\"a\", \"b\"]), s.pop(), Pair.__value__)", "terms": [["Type parameter", "A placeholder type, such as `T` in `def first[T](xs: list[T]) -> T`."], ["Bound / constraints", "`T: Number` restricts `T` to subtypes; `T: (int, str)` restricts it to listed types."]], "pitfall": "Using a TypeVar only once in a signature (`def f(x: T) -> None`). It adds nothing; a TypeVar is meaningful only when it links two or more positions.", "follow": [["What does the `type` statement do?", "Declares a (lazily evaluated) type alias: `type Pair[T] = tuple[T, T]` (3.12+)."], ["What is variance?", "Whether `Box[Cat]` is a subtype of `Box[Animal]`; the 3.12 syntax infers it automatically."]], "output": "a 5 tuple[K, K]", "num": 312, "sectionTitle": "Type Hints & Modern Python (3.8 - 3.14)"}, {"section": 16, "level": "Moderate", "question": "What is `typing.Protocol`?", "answer": "Structural typing (\"static duck typing\"): a class matches a Protocol if it has the required methods/attributes, without inheriting from it. Great for describing what a function needs (`SupportsRead`, `HasId`).", "code": "from typing import Protocol\nclass HasArea(Protocol):\n    def area(self) -> float: ...\nclass Square:\n    def __init__(self, s: float): self.s = s\n    def area(self) -> float: return self.s ** 2\ndef total_area(shapes: list[HasArea]) -> float:\n    return sum(s.area() for s in shapes)\nprint(total_area([Square(2), Square(3)]))", "terms": [["Structural typing", "A type matches by shape rather than by declared inheritance."]], "pitfall": "Defining huge protocols with many methods. Keep them small (one or two methods), like `SupportsRead` or `Sized`, so many types satisfy them.", "follow": [["Can a protocol include attributes?", "Yes, declare them with annotations in the protocol body."], ["What stdlib protocols exist?", "`typing.SupportsInt`, `SupportsAbs`, `collections.abc.Iterable`, `Sized`, `Hashable`, and others."]], "output": "13", "num": 313, "sectionTitle": "Type Hints & Modern Python (3.8 - 3.14)"}, {"section": 16, "level": "Moderate", "question": "What are `TypedDict` and `Literal`?", "answer": "`TypedDict` types dicts with known string keys (like JSON payloads) for type checkers. `Literal[\"GET\", \"POST\"]` restricts a value to specific constants. Both are purely static; at runtime a TypedDict is a plain dict.", "code": "from typing import TypedDict, Literal, NotRequired\nclass OrderPayload(TypedDict):\n    id: int\n    status: Literal[\"PENDING\", \"PAID\", \"SHIPPED\"]\n    note: NotRequired[str]\np: OrderPayload = {\"id\": 1, \"status\": \"PAID\"}\nprint(p, type(p).__name__, OrderPayload.__required_keys__)", "terms": [["`Required` / `NotRequired`", "Mark individual TypedDict keys as required or optional."], ["`ReadOnly`", "(3.13+) Marks TypedDict keys as not to be modified."]], "pitfall": "Expecting `TypedDict` to validate JSON at runtime. At runtime it is a plain dict; use pydantic's `TypeAdapter` or msgspec to validate.", "follow": [["How do you narrow a `Literal` type?", "Compare with `==` or use `match`; checkers narrow the type in each branch."], ["How do you type `**kwargs` with specific keys?", "`**kwargs: Unpack[MyTypedDict]` (PEP 692)."]], "output": "{'id': 1, 'status': 'PAID'} dict frozenset({'status', 'id'})", "num": 314, "sectionTitle": "Type Hints & Modern Python (3.8 - 3.14)"}, {"section": 16, "level": "Difficult", "question": "How do you type a decorator correctly (`Callable`, `ParamSpec`)?", "answer": "A naive decorator typed as `Callable[..., Any]` loses the wrapped function's signature. `ParamSpec` (`P`) captures the parameters, so the decorated function keeps its exact signature for type checkers.", "code": "import functools\nfrom collections.abc import Callable\ndef logged[**P, R](fn: Callable[P, R]) -> Callable[P, R]:\n    @functools.wraps(fn)\n    def wrapper(*args: P.args, **kwargs: P.kwargs) -> R:\n        print(\"calling\", fn.__name__)\n        return fn(*args, **kwargs)\n    return wrapper\n@logged\ndef scale(x: float, *, factor: float = 2.0) -> float: return x * factor\nprint(scale(3.0, factor=10))", "terms": [["`ParamSpec`", "Captures a callable's parameter list so a wrapper can expose the same signature."], ["`Concatenate`", "Adds or removes leading parameters from a `ParamSpec`."]], "pitfall": "Typing a decorator's return as `Callable[..., Any]`. Every decorated function loses its argument checking, which silently weakens type coverage across the codebase.", "follow": [["What is the 3.12 syntax?", "`def deco[**P, R](fn: Callable[P, R]) -> Callable[P, R]:`."], ["How do you type a decorator that injects the first argument?", "Accept `Callable[Concatenate[Session, P], R]` and return `Callable[P, R]`."]], "output": "calling scale\n30.0", "num": 315, "sectionTitle": "Type Hints & Modern Python (3.8 - 3.14)"}, {"section": 16, "level": "Moderate", "question": "What does `from __future__ import annotations` do, and what changed in 3.14?", "answer": "It makes all annotations lazily stored as strings (PEP 563), allowing forward references and avoiding import-time cost. Python 3.14 implements **deferred evaluation** natively (PEP 649/749): annotations are evaluated only when accessed (e.g. via `annotationlib.get_annotations`), so forward references work without the future import.", "code": "class Node:\n    def link(self, other: Node) -> Node:      # forward reference works in 3.14 without quotes\n        return other\nimport annotationlib\nprint(annotationlib.get_annotations(Node.link))", "terms": [["PEP 649/749", "Deferred evaluation of annotations, the default in 3.14."], ["Forward reference", "A reference to a name defined later in the file."]], "pitfall": "Keeping `from __future__ import annotations` and runtime-annotation libraries together. String annotations can fail to resolve in libraries like pydantic when names are only imported under `TYPE_CHECKING`.", "follow": [["How do you read annotations safely in 3.14?", "`annotationlib.get_annotations(obj, format=Format.FORWARDREF)` tolerates undefined names."], ["Will the `__future__` import be removed?", "It is expected to be deprecated eventually, but it still works in 3.14."]], "output": "{'other': <class '__main__.Node'>, 'return': <class '__main__.Node'>}", "num": 316, "sectionTitle": "Type Hints & Modern Python (3.8 - 3.14)"}, {"section": 16, "level": "Moderate", "question": "What are `Final`, `ClassVar` and `@override`?", "answer": "`Final` marks a name that shouldn't be reassigned; `ClassVar` marks a class-level attribute (dataclasses skip it as a field); `typing.override` (3.12+) marks a method that must override a parent method, so checkers flag typos and removed base methods.", "code": "from dataclasses import dataclass, fields\nfrom typing import ClassVar, Final, override\nMAX: Final = 10\n@dataclass\nclass Item:\n    registry: ClassVar[dict] = {}\n    name: str\nclass Base:\n    def save(self) -> None: ...\nclass Child(Base):\n    @override\n    def save(self) -> None: print(\"saved\")\nprint([f.name for f in fields(Item)]); Child().save()", "terms": [["`ClassVar`", "Marks a class-level attribute that instances should not set."]], "pitfall": "Writing `x: Final[int] = 3` in a dataclass and expecting a class constant. Type checkers treat it like a class-level constant, but `@dataclass` still makes it an instance field with a default. Use `ClassVar` (or a module-level constant) for real constants.", "follow": [["What does `@override` catch?", "A method marked `@override` that does not actually override anything, such as after a base-class rename."], ["Is `@override` enforced at runtime?", "No; it only sets `__override__ = True` for introspection."]], "output": "['name']\nsaved", "num": 317, "sectionTitle": "Type Hints & Modern Python (3.8 - 3.14)"}, {"section": 16, "level": "Difficult", "question": "How do you check types at runtime if hints aren't enforced?", "answer": "Options: explicit `isinstance` checks; Pydantic models or `TypeAdapter` for validating external data; `typeguard`/`beartype` decorators for runtime checking in tests. Keep runtime validation at system boundaries (API input, config files).", "code": "from typing import get_type_hints\ndef validate_call(fn):\n    hints = get_type_hints(fn)\n    def wrapper(**kwargs):\n        for k, v in kwargs.items():\n            if k in hints and not isinstance(v, hints[k]):\n                raise TypeError(f\"{k} must be {hints[k].__name__}, got {type(v).__name__}\")\n        return fn(**kwargs)\n    return wrapper\n@validate_call\ndef create(name: str, age: int): return f\"{name} ({age})\"\nprint(create(name=\"riya\", age=31))\ntry:\n    create(name=\"arjun\", age=\"25\")\nexcept TypeError as e:\n    print(\"TypeError:\", e)", "terms": [["`typeguard` / `beartype`", "Libraries that check annotations when functions are called."], ["`TypeIs` / `TypeGuard`", "Return annotations for user-defined narrowing functions."]], "pitfall": "Adding runtime type checking to every internal function. It slows code down; validate at trust boundaries (API input, config, files).", "follow": [["Can `isinstance` check `list[int]`?", "No; `isinstance(x, list[int])` raises `TypeError`. Check the container and elements separately."], ["What is `TypeIs` (3.13)?", "Like `TypeGuard` but narrows in both the true and false branches."]], "output": "riya (31)\nTypeError: age must be int, got str", "num": 318, "sectionTitle": "Type Hints & Modern Python (3.8 - 3.14)"}, {"section": 16, "level": "Easy", "question": "What major features arrived in Python 3.8 to 3.11?", "answer": "- 3.8: walrus `:=`, positional-only params `/`, f-string `=` debugging\n- 3.9: dict `|` merge, `list[int]` generics, `str.removeprefix`, `zoneinfo`\n- 3.10: `match` statement, `X | Y` unions, better error messages, `zip(strict=True)`\n- 3.11: 10-60% faster CPython, exception groups and `except*`, `TaskGroup`, `tomllib`, `Self` type, fine-grained error locations", "code": "", "terms": [["Faster CPython", "The 3.11 project that added the specializing adaptive interpreter, making code 10-60% faster."]], "pitfall": "Using new syntax in a library that still supports older Pythons. Check `requires-python` and test on the oldest supported version in CI.", "follow": [["What were the key 3.11 additions?", "Exception groups and `except*`, `TaskGroup`, `tomllib`, `Self`, better error locations, and the big speedup."], ["How do you find which Python versions are still supported?", "The devguide's status page; each release gets about five years of support."]], "output": "", "num": 319, "sectionTitle": "Type Hints & Modern Python (3.8 - 3.14)"}, {"section": 16, "level": "Moderate", "question": "What major features arrived in Python 3.12, 3.13 and 3.14?", "answer": "- 3.12: PEP 695 generic syntax and `type` aliases, more flexible f-strings (PEP 701), `itertools.batched`, per-interpreter GIL, immortal objects\n- 3.13: new interactive REPL, experimental free-threaded build and JIT, `copy.replace`, improved error messages\n- 3.14: free-threading officially supported (PEP 779), deferred annotations (PEP 649), template strings `t\"...\"` (PEP 750), `concurrent.interpreters` (PEP 734), `compression.zstd`, incremental GC, warnings for `return` in `finally`", "code": "import sys\nprint(sys.version.split()[0])\nitems = [\"a\", \"b\"]\nprint(f\"{\"-\".join(items)}\")          # 3.12+: reuse the same quotes inside f-strings", "terms": [["PEP 695", "Type-parameter syntax and the `type` statement (3.12)."], ["PEP 779", "Made the free-threaded build officially supported in 3.14."]], "pitfall": "Assuming the 3.13 experimental JIT makes code faster. It is off by default and gives small gains so far; measure before relying on it.", "follow": [["What did 3.13 change in the REPL?", "A new interactive shell with color, multi-line editing and paste mode."], ["What is new for debugging in 3.14?", "Safe external debugger attach (PEP 768) and the `python -m pdb -p PID` option."]], "output": "3.14.7\na-b", "num": 320, "sectionTitle": "Type Hints & Modern Python (3.8 - 3.14)"}, {"section": 16, "level": "Difficult", "question": "What are template strings (t-strings) in Python 3.14?", "answer": "A `t\"...\"` literal (PEP 750) creates a `string.templatelib.Template` object instead of a `str`, exposing the static parts and the interpolated values separately. Libraries can then process values safely, e.g. escaping HTML or parameterizing SQL, before producing the final string.", "code": "from string.templatelib import Template, Interpolation\nimport html\ndef render_html(t: Template) -> str:\n    return \"\".join(html.escape(str(p.value)) if isinstance(p, Interpolation) else p for p in t)\nuser = \"<script>alert('x')<\/script>\"\ntmpl = t\"<p>Hello {user}!<\/p>\"\nprint(type(tmpl).__name__)\nprint(render_html(tmpl))", "terms": [["`Template`", "Object holding static string parts and `Interpolation` objects, iterable in order."], ["`Interpolation`", "Holds `value`, `expression`, `conversion` and `format_spec` for one `{...}` field."]], "pitfall": "Expecting a t-string to be a string. `t\"...\"` has no `str` methods and does not format itself; a processing function must render it.", "follow": [["What are t-strings good for?", "Safe SQL, HTML escaping, structured logging and shell commands, where each value needs processing."], ["Can you convert a Template to a plain string?", "Yes, by writing a renderer that joins the strings and formatted values; there is no built-in `str()` rendering."]], "output": "Template\n<p>Hello &lt;script&gt;alert(&#x27;x&#x27;)&lt;/script&gt;!<\/p>", "num": 321, "sectionTitle": "Type Hints & Modern Python (3.8 - 3.14)"}, {"section": 16, "level": "Moderate", "question": "What is `Self` type and when do you use it?", "answer": "`typing.Self` (3.11+) annotates methods returning an instance of the current class, including subclasses, e.g. fluent builders or alternate constructors, without writing a `TypeVar` bound to the class.", "code": "from typing import Self\nclass Query:\n    def __init__(self): self.parts: list[str] = []\n    def where(self, cond: str) -> Self:\n        self.parts.append(cond); return self\nclass UserQuery(Query): pass\nq = UserQuery().where(\"age > 18\").where(\"active\")\nprint(type(q).__name__, q.parts)", "terms": [["`Self`", "Refers to the type of the current instance, including subclasses."]], "pitfall": "Annotating fluent methods with the class name (`-> Builder`). Subclasses calling them then lose their own type; use `Self`.", "follow": [["How was this done before 3.11?", "With a bound TypeVar: `T = TypeVar(\"T\", bound=\"Builder\")` and `def m(self: T) -> T`."], ["Can `Self` be used in classmethods?", "Yes, for alternate constructors: `def from_json(cls, s: str) -> Self`."]], "output": "UserQuery ['age > 18', 'active']", "num": 322, "sectionTitle": "Type Hints & Modern Python (3.8 - 3.14)"}, {"section": 16, "level": "Moderate", "question": "What is `tomllib` and how do you read TOML config?", "answer": "`tomllib` (3.11+) parses TOML (used by `pyproject.toml`) into dicts. It's read-only; use third-party `tomli-w` to write. Open files in binary mode.", "code": "import tomllib\ncfg = tomllib.loads(\"\"\"\n[server]\nhost = \"0.0.0.0\"\nport = 8080\n[features]\nbeta = [\"search\", \"wishlist\"]\n\"\"\")\nprint(cfg[\"server\"][\"port\"], cfg[\"features\"][\"beta\"])", "terms": [["TOML", "Tom's Obvious Minimal Language: a config format with typed values and tables."]], "pitfall": "Opening the TOML file in text mode for `tomllib.load`. It requires binary mode (`\"rb\"`) and raises `TypeError` otherwise.", "follow": [["How do you parse a TOML string?", "`tomllib.loads(text)`."], ["Which TOML types map to Python?", "Tables become dicts, arrays lists, and date/time values become `datetime`, `date` or `time` objects."]], "output": "8080 ['search', 'wishlist']", "num": 323, "sectionTitle": "Type Hints & Modern Python (3.8 - 3.14)"}, {"section": 16, "level": "Difficult", "question": "What is the difference between `mypy` and `pyright`, and how do you adopt typing in an existing codebase?", "answer": "Both are static type checkers: mypy (the reference implementation, plugin ecosystem) and pyright (fast, powers VS Code's Pylance). Adopt gradually: start with `--check-untyped-defs` or strictness per module, type public APIs and new code first, add stubs (`types-requests`), and enforce in CI with a ratchet so coverage only grows.", "code": "", "terms": [["Strict mode", "A set of stricter checks (no implicit `Any`, full annotations)."], ["Baseline", "Recording existing errors so CI fails only on new ones."]], "pitfall": "Turning on strict mode for a large untyped codebase in one step. Thousands of errors get suppressed with `# type: ignore`; adopt per module, strictest on new code.", "follow": [["What are newer Rust-based checkers?", "Astral's `ty` and Meta's `pyrefly`, which aim for much faster checking."], ["How do you type third-party libraries without hints?", "Install stub packages (`types-requests`) or write `.pyi` stubs."]], "output": "", "num": 324, "sectionTitle": "Type Hints & Modern Python (3.8 - 3.14)"}, {"section": 16, "level": "Moderate", "question": "What does `@dataclass(slots=True, frozen=True)` give you, and what does `kw_only` do?", "answer": "`slots=True` (3.10+) generates `__slots__` (less memory, no accidental attributes). `frozen=True` makes instances immutable and hashable. `kw_only=True` requires keyword arguments in `__init__`, avoiding argument-order mistakes and allowing defaults before non-defaults.", "code": "from dataclasses import dataclass\n@dataclass(slots=True, frozen=True, kw_only=True)\nclass Money:\n    currency: str = \"INR\"\n    amount: int\nm = Money(amount=500)\nprint(m, hash(m) == hash(Money(amount=500)), hasattr(m, \"__dict__\"))", "terms": [["`kw_only`", "Makes fields keyword-only; `KW_ONLY` sentinel makes only later fields keyword-only."]], "pitfall": "Using `slots=True` with a zero-argument `super()` in methods on 3.10-3.13. The decorator creates a new class, breaking the `__class__` cell; it works on 3.14.", "follow": [["Does `frozen=True` make instances hashable?", "Yes, with `eq=True` (the default) it generates `__hash__`."], ["How do you set a field in `__post_init__` of a frozen dataclass?", "`object.__setattr__(self, \"field\", value)`."]], "output": "Money(currency='INR', amount=500) True False", "num": 325, "sectionTitle": "Type Hints & Modern Python (3.8 - 3.14)"}, {"section": 16, "level": "Moderate", "question": "What are `NewType` and `Annotated`?", "answer": "`NewType(\"UserId\", int)` creates a distinct type for checkers (so a `UserId` can't be passed where an `OrderId` is expected) with zero runtime cost. `Annotated[T, meta]` attaches metadata used by frameworks, e.g. FastAPI's `Annotated[int, Query(gt=0)]` or Pydantic constraints.", "code": "from typing import NewType, Annotated, get_type_hints\nUserId = NewType(\"UserId\", int)\ndef load(uid: UserId) -> str: return f\"user {uid}\"\nprint(load(UserId(7)), UserId(7) == 7, type(UserId(7)).__name__)\ndef price(x: Annotated[float, \"must be >= 0\"]): ...\nprint(get_type_hints(price, include_extras=True)[\"x\"].__metadata__)", "terms": [["`NewType`", "Creates a distinct type for checkers; at runtime it is an identity function returning the value."], ["`Annotated`", "Attaches metadata to a type, such as `Annotated[int, Gt(0)]`, used by pydantic and FastAPI."]], "pitfall": "Subclassing a `NewType` or using it in `isinstance`. Neither works; it is not a real class. Use a real subclass if you need runtime distinction.", "follow": [["What do type checkers do with `Annotated` metadata?", "They ignore it; only libraries that read it at runtime use it."], ["How does FastAPI use `Annotated`?", "`Annotated[str, Query(max_length=50)]` declares parameter source and validation."]], "output": "user 7 True int\n('must be >= 0',)", "num": 326, "sectionTitle": "Type Hints & Modern Python (3.8 - 3.14)"}, {"section": 17, "level": "Moderate", "question": "What is a descriptor?", "answer": "An object defining `__get__`, and optionally `__set__`/`__delete__`, stored as a **class** attribute. Attribute access on instances is routed through it. `property`, `classmethod`, `staticmethod`, bound methods and ORM fields (Django, SQLAlchemy) are all descriptors.", "code": "class Positive:\n    def __set_name__(self, owner, name): self.attr = \"_\" + name\n    def __get__(self, obj, objtype=None):\n        if obj is None: return self            # accessed on the class\n        return getattr(obj, self.attr)\n    def __set__(self, obj, value):\n        if value <= 0: raise ValueError(f\"{self.attr[1:]} must be > 0\")\n        setattr(obj, self.attr, value)\nclass Product:\n    price = Positive(); qty = Positive()\n    def __init__(self, price, qty): self.price, self.qty = price, qty\np = Product(99.0, 2); print(p.price * p.qty)\ntry:\n    p.qty = 0\nexcept ValueError as e:\n    print(\"ValueError:\", e)", "terms": [["Owner class", "The class on which the descriptor is stored; passed to `__get__` as `owner`."], ["`__get__(self, instance, owner)`", "Called for attribute reads; `instance` is `None` when accessed on the class."]], "pitfall": "Storing a descriptor as an instance attribute (`self.x = MyDescriptor()`). The protocol only works for class attributes, so it behaves like a plain object.", "follow": [["What should `__get__` return when `instance is None`?", "Usually the descriptor itself, so class-level access and introspection work."], ["Where are descriptors used in the stdlib?", "`property`, `classmethod`, `staticmethod`, `functools.cached_property`, bound methods and `__slots__`."]], "output": "198.0\nValueError: qty must be > 0", "num": 327, "sectionTitle": "Metaprogramming: Descriptors, Metaclasses & __slots__"}, {"section": 17, "level": "Difficult", "question": "Data vs non-data descriptors: what's the lookup precedence?", "answer": "A **data descriptor** defines `__set__` or `__delete__`; a **non-data descriptor** only `__get__`. Lookup order for `obj.x`: data descriptors on the type win over the instance `__dict__`, which wins over non-data descriptors and plain class attributes. That's why `cached_property` (non-data) can store its result in the instance dict and be found there next time.", "code": "class Data:\n    def __get__(self, o, t=None): return \"data descriptor\"\n    def __set__(self, o, v): pass\nclass NonData:\n    def __get__(self, o, t=None): return \"non-data descriptor\"\nclass C:\n    d = Data(); n = NonData()\nc = C()\nc.__dict__[\"d\"] = \"instance value\"; c.__dict__[\"n\"] = \"instance value\"\nprint(c.d, \"|\", c.n)", "terms": [["Precedence", "Data descriptor on the type, then instance `__dict__`, then non-data descriptor or plain class attribute, then `__getattr__`."]], "pitfall": "Expecting to override a `property` by assigning an instance attribute. Properties are data descriptors, so the assignment calls the setter (or raises `AttributeError`) instead.", "follow": [["Why does `cached_property` work?", "It is a non-data descriptor: after the first call, the value stored in the instance `__dict__` wins on later lookups."], ["Are functions data descriptors?", "No, non-data; that is why you can shadow a method with an instance attribute."]], "output": "data descriptor | instance value", "num": 328, "sectionTitle": "Metaprogramming: Descriptors, Metaclasses & __slots__"}, {"section": 17, "level": "Moderate", "question": "How is `property` implemented using descriptors?", "answer": "`property` is a data descriptor class storing `fget`, `fset`, `fdel`. Its `__get__` calls `fget(obj)`, `__set__` calls `fset(obj, value)` or raises `AttributeError` if read-only. `@x.setter` returns a new property copy with `fset` added.", "code": "class MyProperty:\n    def __init__(self, fget, fset=None): self.fget, self.fset = fget, fset\n    def __get__(self, obj, objtype=None): return self if obj is None else self.fget(obj)\n    def __set__(self, obj, value):\n        if self.fset is None: raise AttributeError(\"read-only\")\n        self.fset(obj, value)\n    def setter(self, fset): return MyProperty(self.fget, fset)\nclass Circle:\n    def __init__(self, r): self._r = r\n    @MyProperty\n    def area(self): return round(3.14159 * self._r ** 2, 2)\nc = Circle(2); print(c.area)\ntry:\n    c.area = 5\nexcept AttributeError as e:\n    print(\"AttributeError:\", e)", "terms": [["`fget` / `fset` / `fdel`", "The functions stored on a property object."]], "pitfall": "Naming the setter method differently from the property (`@x.setter def set_x`). That creates a second property named `set_x` and leaves `x` read-only.", "follow": [["How do you write a property without decorators?", "`x = property(get_x, set_x, del_x, \"doc\")`."], ["Can a property be abstract?", "Yes, stack `@property` over `@abstractmethod`."]], "output": "12.57\nAttributeError: read-only", "num": 329, "sectionTitle": "Metaprogramming: Descriptors, Metaclasses & __slots__"}, {"section": 17, "level": "Moderate", "question": "What is a metaclass?", "answer": "The class of a class. Classes are created by calling their metaclass (default `type`) with name, bases and namespace. Custom metaclasses (subclassing `type`) can modify or validate classes at creation time. \"Metaclasses are deeper magic than 99% of users should ever worry about\" (Tim Peters): prefer decorators or `__init_subclass__` first.", "code": "class Meta(type):\n    def __new__(mcls, name, bases, ns):\n        ns.setdefault(\"table\", name.lower() + \"s\")\n        return super().__new__(mcls, name, bases, ns)\nclass Model(metaclass=Meta): pass\nclass Order(Model): pass\nprint(type(Order).__name__, Order.table, type(type).__name__)", "terms": [["`type`", "The default metaclass; `type(cls)` shows a class's metaclass."]], "pitfall": "Reaching for a metaclass when `__init_subclass__`, a class decorator or `__set_name__` would do. Metaclasses conflict easily when combining libraries.", "follow": [["What is a metaclass conflict?", "Deriving from two bases with unrelated metaclasses raises `TypeError`; you need a metaclass that subclasses both."], ["Which method creates the class object?", "`metaclass.__new__(mcls, name, bases, namespace)`; `__init__` then initializes it."]], "output": "Meta orders type", "num": 330, "sectionTitle": "Metaprogramming: Descriptors, Metaclasses & __slots__"}, {"section": 17, "level": "Difficult", "question": "How can you create a class dynamically with `type()`?", "answer": "`type(name, bases, namespace)` builds a class at runtime, the same thing the `class` statement does. Useful for generating classes from schemas or configuration.", "code": "def greet(self): return f\"hello from {type(self).__name__}\"\nDog = type(\"Dog\", (object,), {\"sound\": \"woof\", \"greet\": greet})\nd = Dog()\nprint(d.greet(), d.sound, Dog.__mro__)\nfields = {\"id\": int, \"name\": str}\nRow = type(\"Row\", (), {\"__annotations__\": fields, \"__slots__\": tuple(fields)})\nprint(Row.__slots__)", "terms": [["`types.new_class`", "Creates a class while correctly handling metaclasses and `__prepare__`."]], "pitfall": "Forgetting `__module__` and `__qualname__` in dynamically created classes. Pickling and reprs then point to the wrong place; set them explicitly.", "follow": [["How do you create a dataclass dynamically?", "`dataclasses.make_dataclass(\"Point\", [\"x\", \"y\"])`."], ["How do you define methods for `type()`?", "Put functions in the namespace dict; they become methods."]], "output": "hello from Dog woof (<class '__main__.Dog'>, <class 'object'>)\n('id', 'name')", "num": 331, "sectionTitle": "Metaprogramming: Descriptors, Metaclasses & __slots__"}, {"section": 17, "level": "Difficult", "question": "What real-world problems do metaclasses solve?", "answer": "Frameworks that need to transform class bodies: Django models (collecting `Field` attributes into `_meta`), SQLAlchemy declarative models, enum's `EnumType`, ABCMeta (abstract method tracking), and registries/validation of every subclass. Many of these could now use `__init_subclass__` and `__set_name__`.", "code": "", "terms": [["Declarative API", "Users describe structure with class attributes, and the framework builds behavior from them."]], "pitfall": "Writing a metaclass that silently changes semantics (renaming attributes, injecting methods). Debugging user classes becomes very hard; document and minimize the magic.", "follow": [["Which stdlib features use metaclasses?", "`abc.ABCMeta` and `enum.EnumType` (formerly `EnumMeta`)."], ["What can `__prepare__` enable?", "A custom namespace, for example one recording definition order or detecting duplicate names."]], "output": "", "num": 332, "sectionTitle": "Metaprogramming: Descriptors, Metaclasses & __slots__"}, {"section": 17, "level": "Difficult", "question": "What is the order of operations when a class statement runs?", "answer": "1) Resolve the metaclass. 2) Call `metaclass.__prepare__` to get the namespace mapping. 3) Execute the class body in that namespace. 4) Call `metaclass(name, bases, namespace)`, which runs `__new__` and `__init__`; during `type.__new__`, `__set_name__` is called on descriptors and the parent's `__init_subclass__` runs. 5) Apply class decorators.", "code": "class Meta(type):\n    @classmethod\n    def __prepare__(mcls, name, bases): print(\"1 __prepare__\"); return {}\n    def __new__(mcls, name, bases, ns): print(\"3 metaclass __new__\"); return super().__new__(mcls, name, bases, ns)\nclass Desc:\n    def __set_name__(self, owner, name): print(\"4 __set_name__\", name)\nclass Base(metaclass=Meta):\n    def __init_subclass__(cls): print(\"5 __init_subclass__\", cls.__name__)\ndef deco(cls): print(\"6 class decorator\"); return cls\nprint(\"-- defining Child --\")\n@deco\nclass Child(Base):\n    print(\"2 class body runs\")\n    field = Desc()", "terms": [["`__prepare__`", "Returns the mapping used as the class namespace while the body executes."]], "pitfall": "Expecting decorators to run before `__init_subclass__`. The class is fully created (including `__set_name__` and `__init_subclass__`) before class decorators are applied.", "follow": [["Where do `__set_name__` calls happen?", "Inside `type.__new__`, after the class object exists, before `__init_subclass__`."], ["When is the metaclass's `__call__` used?", "Not at class creation, but when instances are created: `Cls()` calls `type(Cls).__call__`."]], "output": "1 __prepare__\n3 metaclass __new__\n-- defining Child --\n1 __prepare__\n2 class body runs\n3 metaclass __new__\n4 __set_name__ field\n5 __init_subclass__ Child\n6 class decorator", "num": 333, "sectionTitle": "Metaprogramming: Descriptors, Metaclasses & __slots__"}, {"section": 17, "level": "Moderate", "question": "What does `__slots__` do and what are its limitations?", "answer": "It declares a fixed set of instance attributes stored in slots instead of a per-instance `__dict__`, saving memory and speeding attribute access. Limitations: no new attributes, no `__weakref__` unless listed, `cached_property` needs a `__dict__`, and every class in the hierarchy must define slots to fully avoid `__dict__`.", "code": "class Point:\n    __slots__ = (\"x\", \"y\")\n    def __init__(self, x, y): self.x, self.y = x, y\nclass Point3D(Point):          # forgot __slots__: gets a __dict__ again\n    pass\np, q = Point(1, 2), Point3D(1, 2)\nprint(hasattr(p, \"__dict__\"), hasattr(q, \"__dict__\"), Point.x)", "terms": [["Slot", "A fixed attribute stored at a known offset in the instance."]], "pitfall": "Adding `__slots__` to an existing class and breaking callers that use `obj.__dict__`, `vars(obj)`, or set ad-hoc attributes (common in tests and mocks). Search for such uses first.", "follow": [["Can you mix `__slots__` and `__dict__`?", "Yes, include `\"__dict__\"` in `__slots__` to allow dynamic attributes too."], ["Do slots work with multiple inheritance?", "Only one base in the hierarchy may have non-empty slots, otherwise you get a layout conflict."]], "output": "False True <member 'x' of 'Point' objects>", "num": 334, "sectionTitle": "Metaprogramming: Descriptors, Metaclasses & __slots__"}, {"section": 17, "level": "Moderate", "question": "What is monkey patching?", "answer": "Changing classes, modules or functions at runtime, e.g. replacing `time.sleep` in a test or patching a library bug. It's powerful but hidden and fragile; in tests, use `unittest.mock.patch` or pytest's `monkeypatch`, which undo the change automatically.", "code": "import math\noriginal = math.sqrt\nmath.sqrt = lambda x: \"patched!\"\nprint(math.sqrt(16))\nmath.sqrt = original\nprint(math.sqrt(16))", "terms": [["Patch", "A runtime replacement of an attribute, restored afterwards in tests."]], "pitfall": "Monkey patching in production code to fix a library bug and forgetting it. Upgrades silently change behavior; pin the version, add a test, and link the upstream issue.", "follow": [["How does pytest make patching safe?", "The `monkeypatch` fixture undoes every change after the test."], ["What is gevent's `monkey.patch_all()`?", "It replaces blocking stdlib functions with cooperative versions; it must run before other imports."]], "output": "patched!\n4.0", "num": 335, "sectionTitle": "Metaprogramming: Descriptors, Metaclasses & __slots__"}, {"section": 17, "level": "Moderate", "question": "What does `inspect` let you do?", "answer": "Introspect live objects: signatures, source code, members, class hierarchy, call stack frames, whether something is a coroutine function or generator. Frameworks use it for dependency injection, CLI generation and documentation.", "code": "import inspect\ndef create(name: str, *, admin: bool = False) -> dict: return {}\nprint(inspect.signature(create), inspect.isfunction(create))\nprint([n for n, _ in inspect.getmembers(dict, inspect.ismethoddescriptor)][:5])\nprint(inspect.currentframe().f_code.co_name)", "terms": [["`inspect.getsource`", "Returns the source code of a function, class or module when the file is available."], ["`inspect.stack`", "Returns information about the current call stack."]], "pitfall": "Calling `inspect.stack()` in hot paths. It is slow because it reads source lines; use `sys._getframe()` if you only need the frame.", "follow": [["How do you check for async functions?", "`inspect.iscoroutinefunction`, `isasyncgenfunction`, `isawaitable`."], ["How do you get members of a module?", "`inspect.getmembers(module, inspect.isfunction)`."]], "output": "(name: str, *, admin: bool = False) -> dict True\n['__contains__', '__delattr__', '__delitem__', '__dir__', '__eq__']\n<module>", "num": 336, "sectionTitle": "Metaprogramming: Descriptors, Metaclasses & __slots__"}, {"section": 17, "level": "Difficult", "question": "How do `eval`, `exec` and `compile` differ, and what are the risks?", "answer": "`eval` evaluates a single expression and returns its value; `exec` executes statements; `compile` turns source into a code object for either. Running untrusted input through them allows arbitrary code execution: restricting globals does not make them safe. Use `ast.literal_eval` for literals or a real parser.", "code": "import ast\nprint(eval(\"2 * 21\"))\nns = {}; exec(\"def f(x):\\n    return x + 1\", ns); print(ns[\"f\"](9))\ncode = compile(\"a + b\", \"<expr>\", \"eval\"); print(eval(code, {\"a\": 1, \"b\": 2}))\nprint(ast.literal_eval(\"[1, {'k': (2, 3)}]\"))\ntry:\n    ast.literal_eval(\"__import__('os').getcwd()\")\nexcept ValueError as e:\n    print(\"literal_eval refused:\", type(e).__name__)", "terms": [["Code object", "Compiled bytecode plus metadata, returned by `compile`."]], "pitfall": "Believing `eval(s, {\"__builtins__\": {}})` is a sandbox. Attribute tricks like `().__class__.__base__.__subclasses__()` escape it; never evaluate untrusted input.", "follow": [["What is the safe alternative for literals?", "`ast.literal_eval`."], ["What are legitimate uses of `exec`?", "Code generation in tools (e.g. dataclasses and namedtuple historically), REPLs and template engines."]], "output": "42\n10\n3\n[1, {'k': (2, 3)}]\nliteral_eval refused: ValueError", "num": 337, "sectionTitle": "Metaprogramming: Descriptors, Metaclasses & __slots__"}, {"section": 17, "level": "Difficult", "question": "What is the `ast` module used for?", "answer": "It parses Python source into an abstract syntax tree you can inspect, transform (`NodeTransformer`) and compile back. Linters (pylint, Bandit), formatters, codemods, coverage tools and pytest's assertion rewriting are built on it.", "code": "import ast\ntree = ast.parse(\"total = price * qty + tax\")\nprint(ast.dump(tree.body[0].value, indent=None)[:80] + \"...\")\nnames = sorted({n.id for n in ast.walk(tree) if isinstance(n, ast.Name)})\nprint(names, ast.unparse(tree))", "terms": [["`NodeVisitor` / `NodeTransformer`", "Classes that walk an AST, optionally replacing nodes."], ["`ast.unparse`", "(3.9+) Turns an AST back into source code."]], "pitfall": "Expecting `ast.parse` then `ast.unparse` to preserve formatting and comments. Comments are lost; use `libcst` for formatting-preserving refactors.", "follow": [["How do you view an AST?", "`print(ast.dump(ast.parse(src), indent=2))`."], ["How does pytest use AST rewriting?", "It rewrites `assert` statements in test modules to record intermediate values for detailed failure messages."]], "output": "BinOp(left=BinOp(left=Name(id='price', ctx=Load()), op=Mult(), right=Name(id='qt...\n['price', 'qty', 'tax', 'total'] total = price * qty + tax", "num": 338, "sectionTitle": "Metaprogramming: Descriptors, Metaclasses & __slots__"}, {"section": 17, "level": "Moderate", "question": "How can you add methods or attributes to a class after it's defined?", "answer": "Assign to the class: `Cls.method = function`; all instances (existing and new) see it because lookups go through the class. Assigning to one instance only affects that instance, and a function assigned to an instance is not bound automatically (use `types.MethodType`).", "code": "import types\nclass User:\n    def __init__(self, name): self.name = name\nu = User(\"riya\")\nUser.shout = lambda self: self.name.upper()\nprint(u.shout())\nu.whisper = types.MethodType(lambda self: self.name.lower() + \"...\", u)\nprint(u.whisper())", "terms": [["`types.MethodType`", "Binds a function to one instance as a method."]], "pitfall": "Assigning a function to an instance (`obj.m = func`) and expecting `self` to be passed. Functions on instances are not bound; use `types.MethodType(func, obj)`.", "follow": [["Do existing instances see a method added to the class?", "Yes; method lookup goes through the class at call time."], ["Can you add methods to built-in types like `str`?", "No; built-in types are immutable (`TypeError: cannot set ... attribute of immutable type 'str'`)."]], "output": "RIYA\nriya...", "num": 339, "sectionTitle": "Metaprogramming: Descriptors, Metaclasses & __slots__"}, {"section": 17, "level": "Difficult", "question": "How do Django/SQLAlchemy model fields know their own names?", "answer": "Each field is a descriptor-like object in the class body. When the class is created, `__set_name__` (or a metaclass that scans the namespace) tells each field its attribute name and owner, so it can map to a column and build the model's metadata without you repeating names.", "code": "", "terms": [["`__set_name__(owner, name)`", "Hook called on each class attribute after class creation."]], "pitfall": "Reusing one descriptor instance for two attributes (`a = b = Field()`). `__set_name__` is called twice, and the second name overwrites the first.", "follow": [["How did frameworks do this before 3.6?", "A metaclass scanned the class namespace and told each field its name."], ["How do fields keep their definition order?", "Class namespaces are ordered dicts, so iteration follows definition order."]], "output": "", "num": 340, "sectionTitle": "Metaprogramming: Descriptors, Metaclasses & __slots__"}, {"section": 18, "level": "Easy", "question": "What testing frameworks are common in Python?", "answer": "`unittest` (stdlib, xUnit style classes) and **pytest** (the de facto standard: plain `assert`, fixtures, parametrization, plugins). Also `doctest` for examples in docstrings, `hypothesis` for property-based testing, `tox`/`nox` for multi-environment runs, `coverage.py` for coverage.", "code": "", "terms": [["Test runner", "The tool that discovers, runs and reports tests: pytest, `python -m unittest`."]], "pitfall": "Mixing unittest-style classes and pytest fixtures without knowing the limits. Fixtures cannot be injected into `unittest.TestCase` methods as parameters.", "follow": [["Can pytest run unittest tests?", "Yes, pytest discovers and runs `unittest.TestCase` subclasses."], ["What is `tox`/`nox`?", "Tools to run tests in several environments or Python versions."]], "output": "", "num": 341, "sectionTitle": "Testing, Debugging & Logging"}, {"section": 18, "level": "Easy", "question": "Write a basic unittest test case.", "answer": "Subclass `unittest.TestCase`, write `test_*` methods, use assertion methods, and use `setUp`/`tearDown` for fixtures.", "code": "import unittest\ndef apply_discount(price, pct):\n    if not 0 <= pct <= 100: raise ValueError(\"pct out of range\")\n    return round(price * (1 - pct / 100), 2)\nclass DiscountTests(unittest.TestCase):\n    def test_basic(self): self.assertEqual(apply_discount(200, 10), 180)\n    def test_zero(self): self.assertEqual(apply_discount(99.99, 0), 99.99)\n    def test_invalid(self):\n        with self.assertRaises(ValueError): apply_discount(10, 150)\nsuite = unittest.defaultTestLoader.loadTestsFromTestCase(DiscountTests)\nresult = unittest.TextTestRunner(verbosity=0, stream=open(\"nul\" if __import__(\"os\").name == \"nt\" else \"/dev/null\", \"w\")).run(suite)\nprint(\"ran\", result.testsRun, \"failures\", len(result.failures), \"errors\", len(result.errors))", "terms": [["`setUpClass`", "Classmethod run once before all tests in the class."], ["`addCleanup`", "Registers teardown functions that run even if `setUp` fails later."]], "pitfall": "Using `assertTrue(a == b)`. On failure it only says \"False is not true\"; `assertEqual(a, b)` shows both values.", "follow": [["How do you skip a test?", "`@unittest.skip(\"reason\")` or `@unittest.skipIf(cond, \"reason\")`."], ["How do you run a single test?", "`python -m unittest tests.test_mod.TestClass.test_method`."]], "output": "ran 3 failures 0 errors 0", "num": 342, "sectionTitle": "Testing, Debugging & Logging"}, {"section": 18, "level": "Moderate", "question": "Why is pytest preferred, and what does a pytest test look like?", "answer": "Tests are plain functions with plain `assert` (pytest rewrites asserts to show detailed diffs), fixtures are injected by argument name, `@pytest.mark.parametrize` runs one test over many inputs, and a huge plugin ecosystem exists (pytest-django, pytest-asyncio, pytest-cov, pytest-xdist).", "code": "# test_pricing.py -- run with:  pytest -q\nimport pytest\n\ndef apply_discount(price, pct): return round(price * (1 - pct / 100), 2)\n\n@pytest.fixture\ndef cart():\n    return {\"items\": [(\"pen\", 50.0), (\"book\", 450.0)]}\n\ndef test_total(cart):\n    assert sum(p for _, p in cart[\"items\"]) == 500\n\n@pytest.mark.parametrize(\"price,pct,expected\", [(200, 10, 180), (100, 0, 100), (80, 25, 60)])\ndef test_discount(price, pct, expected):\n    assert apply_discount(price, pct) == expected", "terms": [["Assertion rewriting", "pytest rewrites `assert` statements to show the compared values on failure."], ["Parametrization", "`@pytest.mark.parametrize` runs one test with many inputs."]], "pitfall": "Writing `assert (a, b)` or asserting a non-empty tuple. It always passes; pytest warns about it.", "follow": [["How do you run tests matching a name?", "`pytest -k \"login and not slow\"`."], ["How do you stop at the first failure?", "`pytest -x`, and `--lf` reruns only last failures."]], "output": "", "num": 343, "sectionTitle": "Testing, Debugging & Logging"}, {"section": 18, "level": "Moderate", "question": "What are pytest fixtures and scopes?", "answer": "Functions decorated with `@pytest.fixture` that provide setup (and teardown after `yield`) to tests that name them as parameters. Scopes: `function` (default), `class`, `module`, `package`, `session`, so expensive resources (DB, server) can be shared. `conftest.py` shares fixtures across files.", "code": "# conftest.py\nimport pytest, sqlite3\n\n@pytest.fixture(scope=\"session\")\ndef db():\n    con = sqlite3.connect(\":memory:\")\n    con.execute(\"CREATE TABLE users (name TEXT)\")\n    yield con                      # tests run here\n    con.close()                    # teardown after the whole session\n\n@pytest.fixture\ndef user(db):                      # fixtures can use fixtures\n    db.execute(\"INSERT INTO users VALUES ('riya')\")\n    yield \"riya\"\n    db.execute(\"DELETE FROM users\")", "terms": [["Scope", "`function`, `class`, `module`, `package` or `session`: how long a fixture instance lives."], ["`conftest.py`", "File whose fixtures are visible to tests in its directory and below."]], "pitfall": "Session-scoped fixtures returning mutable objects that tests modify. State leaks between tests and makes results depend on order.", "follow": [["What does `autouse=True` do?", "Applies the fixture to every test in its scope without naming it."], ["How do you parametrize a fixture?", "`@pytest.fixture(params=[...])` and read `request.param`."]], "output": "", "num": 344, "sectionTitle": "Testing, Debugging & Logging"}, {"section": 18, "level": "Moderate", "question": "How do you mock a dependency in tests?", "answer": "`unittest.mock.patch` replaces an object where it's **looked up** for the duration of a test, and `Mock`/`MagicMock` record calls so you can assert on them (`assert_called_once_with`). Better still, design for dependency injection and pass fakes directly.", "code": "from unittest import mock\nimport json, urllib.request\ndef get_rate(cur):\n    with urllib.request.urlopen(f\"https://api.example.com/rates/{cur}\") as r:\n        return json.load(r)[\"rate\"]\nfake_resp = mock.MagicMock()\nfake_resp.__enter__.return_value = fake_resp\nfake_resp.read.return_value = b'{\"rate\": 83.1}'\nwith mock.patch(\"urllib.request.urlopen\", return_value=fake_resp) as m:\n    print(get_rate(\"USD\"))\n    m.assert_called_once_with(\"https://api.example.com/rates/USD\")\nprint(\"no real network call was made\")", "terms": [["Test double", "A stand-in object: stub, fake, mock or spy."]], "pitfall": "Mocking so much that tests only check that mocks were called. They pass while real behavior is broken; mock at system boundaries (network, clock, filesystem).", "follow": [["How do you assert a call happened?", "`mock.assert_called_once_with(...)`; also inspect `mock.call_args_list`."], ["How do you make a mock raise?", "`mock.side_effect = ValueError(\"boom\")`; a list makes successive calls return successive values."]], "output": "83.1\nno real network call was made", "num": 345, "sectionTitle": "Testing, Debugging & Logging"}, {"section": 18, "level": "Difficult", "question": "Why does `mock.patch` sometimes not work? (Patch where it's used)", "answer": "`patch(\"module.name\")` replaces the attribute in **that module's namespace**. If your code did `from requests import get`, it holds its own reference in `myapp.client.get`; patching `requests.get` won't affect it. Patch the name in the module under test: `patch(\"myapp.client.get\")`.", "code": "import sys, types\nfrom unittest import mock\nlib = types.ModuleType(\"lib\"); exec(\"def now(): return 'real time'\", lib.__dict__); sys.modules[\"lib\"] = lib\napp = types.ModuleType(\"app\"); exec(\"from lib import now\\ndef stamp(): return now()\", app.__dict__); sys.modules[\"app\"] = app\nwith mock.patch(\"lib.now\", return_value=\"fake\"):\n    print(\"patched lib.now ->\", app.stamp())\nwith mock.patch(\"app.now\", return_value=\"fake\"):\n    print(\"patched app.now ->\", app.stamp())", "terms": [["Lookup location", "The module namespace where the code under test finds the name at call time."]], "pitfall": "Patching `requests.get` when the code did `from requests import get`. The code keeps its own reference; patch `mymodule.get`.", "follow": [["How do you patch an attribute of an object?", "`mock.patch.object(SomeClass, \"method\")`."], ["How do you patch a dict or environment variables?", "`mock.patch.dict(os.environ, {\"KEY\": \"v\"})`, or pytest's `monkeypatch.setenv`."]], "output": "patched lib.now -> real time\npatched app.now -> fake", "num": 346, "sectionTitle": "Testing, Debugging & Logging"}, {"section": 18, "level": "Moderate", "question": "What is `MagicMock` vs `Mock`, and what does `spec`/`autospec` add?", "answer": "`MagicMock` also supports magic methods (`len`, iteration, context managers). `spec=`/`autospec=True` restrict the mock to the real object's attributes and signatures, so typos and wrong arguments fail instead of silently passing.", "code": "from unittest import mock\nclass Gateway:\n    def charge(self, amount: float, currency: str) -> str: ...\nloose = mock.Mock()\nloose.chrage(10)                                  # typo passes silently!\nstrict = mock.create_autospec(Gateway, instance=True)\ntry:\n    strict.chrage(10)\nexcept AttributeError as e:\n    print(\"AttributeError:\", e)\ntry:\n    strict.charge(10)\nexcept TypeError as e:\n    print(\"TypeError:\", e)", "terms": [["`spec`", "Restricts a mock to the attributes of a real object."], ["`autospec`", "Also checks call signatures of methods."]], "pitfall": "Misspelling an assertion method on a plain `Mock` (`mock.assert_called_onse()`). Old versions returned a new mock and the test passed; modern versions raise `AttributeError` for names starting with `assert`, but `spec` catches more typos.", "follow": [["What is `AsyncMock`?", "A mock whose calls return awaitables; `patch` uses it automatically for async functions."], ["What is `seal()`?", "Prevents a mock from creating new attributes automatically."]], "output": "AttributeError: Mock object has no attribute 'chrage'\nTypeError: missing a required argument: 'currency'", "num": 347, "sectionTitle": "Testing, Debugging & Logging"}, {"section": 18, "level": "Moderate", "question": "How do you test code that raises exceptions or logs messages?", "answer": "`pytest.raises(Exc, match=\"regex\")` or `self.assertRaises` for exceptions; pytest's `caplog` fixture or `self.assertLogs` for log records; `capsys` to capture printed output.", "code": "import logging, unittest\nlog = logging.getLogger(\"billing\")\ndef refund(amount):\n    if amount > 1000:\n        log.warning(\"large refund %s\", amount)\n    return amount\nclass T(unittest.TestCase):\n    def test_logs(self):\n        with self.assertLogs(\"billing\", level=\"WARNING\") as cm:\n            refund(5000)\n        self.assertIn(\"large refund 5000\", cm.output[0])\n        print(\"captured:\", cm.output)\nunittest.main(argv=[\"x\"], exit=False, verbosity=0)", "terms": [["`caplog`", "pytest fixture capturing log records."], ["`capsys`", "pytest fixture capturing stdout/stderr."]], "pitfall": "Using `pytest.raises` around too much code. The test passes if any line raises that exception; wrap only the call that should raise.", "follow": [["How do you check exception attributes?", "`with pytest.raises(E) as exc_info:` then inspect `exc_info.value`."], ["How do you test exception groups?", "`pytest.raises(ExceptionGroup)` with `exc_info.group_contains(ValueError)` (pytest 8+), or `pytest.RaisesGroup`."]], "output": "captured: ['WARNING:billing:large refund 5000']", "num": 348, "sectionTitle": "Testing, Debugging & Logging"}, {"section": 18, "level": "Moderate", "question": "What is property-based testing?", "answer": "Instead of hand-picked examples, you state properties that must hold for all inputs, and a library (Hypothesis) generates many inputs, including edge cases, and shrinks failures to a minimal example. Great for parsers, serializers and math.", "code": "# pip install hypothesis ; run with pytest\nfrom hypothesis import given, strategies as st\n\ndef encode(s: str) -> bytes: return s.encode(\"utf-8\")\ndef decode(b: bytes) -> str: return b.decode(\"utf-8\")\n\n@given(st.text())\ndef test_roundtrip(s):\n    assert decode(encode(s)) == s          # property: decode(encode(x)) == x\n\n@given(st.lists(st.integers()))\ndef test_sort_is_idempotent(xs):\n    assert sorted(sorted(xs)) == sorted(xs)", "terms": [["Strategy", "A Hypothesis generator of input values, such as `st.integers()`."], ["Shrinking", "Reducing a failing input to a minimal example."]], "pitfall": "Writing properties that re-implement the function under test. Test invariants instead: round trips, idempotence, ordering, comparison with a simple reference implementation.", "follow": [["What are good properties for a sort function?", "The output is ordered, has the same length, and is a permutation (same `Counter`) of the input."], ["How does Hypothesis reproduce failures?", "It stores failing examples in a local database and replays them first."]], "output": "", "num": 349, "sectionTitle": "Testing, Debugging & Logging"}, {"section": 18, "level": "Easy", "question": "How do you debug Python code?", "answer": "- `breakpoint()` (3.7+) drops into `pdb` at that line: `n` next, `s` step, `c` continue, `p expr`, `l` list, `w` where, `u`/`d` up/down the stack\n- `python -m pdb script.py`, or post-mortem after a crash with `pdb.pm()`\n- IDE debuggers (VS Code, PyCharm)\n- structured logging and `traceback`; `faulthandler` for hard crashes", "code": "", "terms": [["`PYTHONBREAKPOINT`", "Environment variable choosing what `breakpoint()` calls, or `0` to disable it."], ["Post-mortem", "Debugging after a crash with `python -m pdb script.py` or `pdb.pm()`."]], "pitfall": "Leaving `breakpoint()` calls in committed code. CI hangs waiting for input; add a linter rule (Ruff T100) against it.", "follow": [["How do you debug in pytest on failure?", "`pytest --pdb` opens the debugger at the failing line."], ["How do you attach to a running process?", "`python -m pdb -p PID` (3.14+), or IDE/debugpy attach."]], "output": "", "num": 350, "sectionTitle": "Testing, Debugging & Logging"}, {"section": 18, "level": "Moderate", "question": "How do you read a Python traceback?", "answer": "Read from the **bottom**: the last line is the exception type and message; the lines above show the call stack from outermost (top) to where it failed (bottom), with file, line and code. Since 3.11, `^^^^` markers point to the exact failing expression. For chained exceptions, read each block.", "code": "import traceback\ndef load(cfg): return cfg[\"db\"][\"port\"]\ntry:\n    load({\"db\": None})\nexcept TypeError:\n    print(traceback.format_exc().strip())", "terms": [["Frame line", "`File \"x.py\", line N, in func` followed by the source line."], ["Chained traceback", "Several tracebacks joined by \"direct cause\" or \"during handling\" messages."]], "pitfall": "Reading only the top of a long traceback. The actual failure is at the bottom, and with chained exceptions the root cause is often the first traceback printed.", "follow": [["What do the `^^^^` markers mean?", "Since 3.11 they point at the exact sub-expression that failed."], ["How do you print a traceback without raising?", "`traceback.print_exc()` inside `except`, or `traceback.print_stack()` anywhere."]], "output": "Traceback (most recent call last):\n  File \"C:\\Users\\win11\\AppData\\Local\\Temp\\tmpmvo_8gwg\\snippet.py\", line 4, in <module>\n    load({\"db\": None})\n    ~~~~^^^^^^^^^^^^^^\n  File \"C:\\Users\\win11\\AppData\\Local\\Temp\\tmpmvo_8gwg\\snippet.py\", line 2, in load\n    def load(cfg): return cfg[\"db\"][\"port\"]\n                          ~~~~~~~~~^^^^^^^^\nTypeError: 'NoneType' object is not subscriptable", "num": 351, "sectionTitle": "Testing, Debugging & Logging"}, {"section": 18, "level": "Moderate", "question": "What is code coverage and what does it not tell you?", "answer": "Coverage (`coverage.py`, `pytest --cov`) measures which lines/branches ran during tests. It finds untested code but doesn't prove tests check the right things: 100% coverage with weak asserts can still miss bugs. Aim for meaningful coverage of critical logic, and consider branch coverage and mutation testing.", "code": "", "terms": [["Branch coverage", "Whether both outcomes of each condition were executed."]], "pitfall": "Chasing 100% line coverage. Tests can execute every line without asserting anything meaningful; review assertions and consider mutation testing (mutmut).", "follow": [["How do you enable branch coverage?", "`coverage run --branch` or `pytest --cov --cov-branch`."], ["What is `sys.monitoring`'s effect on coverage?", "Since 3.12, coverage.py can use the low-overhead `sys.monitoring` API, making coverage much faster."]], "output": "", "num": 352, "sectionTitle": "Testing, Debugging & Logging"}, {"section": 18, "level": "Moderate", "question": "How do you test async code?", "answer": "Use `pytest-asyncio` (`@pytest.mark.asyncio` / auto mode) or `unittest.IsolatedAsyncioTestCase`, and `AsyncMock` for awaited dependencies.", "code": "import asyncio, unittest\nfrom unittest.mock import AsyncMock\nasync def get_user(client, uid):\n    data = await client.fetch(f\"/users/{uid}\")\n    return data[\"name\"].title()\nclass T(unittest.IsolatedAsyncioTestCase):\n    async def test_get_user(self):\n        client = AsyncMock(); client.fetch.return_value = {\"name\": \"riya sharma\"}\n        self.assertEqual(await get_user(client, 7), \"Riya Sharma\")\n        client.fetch.assert_awaited_once_with(\"/users/7\")\n        print(\"async test passed\")\nunittest.main(argv=[\"x\"], exit=False, verbosity=0)", "terms": [["`IsolatedAsyncioTestCase`", "unittest base class that runs each test in a fresh event loop."]], "pitfall": "Writing `async def test_x()` without the plugin or marker. Plain pytest does not run the coroutine; depending on the version it warns, fails or skips it.", "follow": [["How do you avoid real sleeps in async tests?", "Inject the sleep function or clock, or patch `asyncio.sleep` with an `AsyncMock`."], ["What is anyio's pytest plugin?", "Runs async tests on asyncio and trio backends with `@pytest.mark.anyio`."]], "output": "async test passed", "num": 353, "sectionTitle": "Testing, Debugging & Logging"}, {"section": 18, "level": "Moderate", "question": "What's the difference between unit, integration and end-to-end tests?", "answer": "**Unit** tests check one function/class in isolation (fast, many). **Integration** tests check components together with real dependencies (DB, message queue), often via containers. **End-to-end** tests exercise the whole system like a user (slow, few). The test pyramid suggests many unit tests, fewer integration, very few E2E.", "code": "", "terms": [["Test pyramid", "Many fast unit tests, fewer integration tests, and a few end-to-end tests."]], "pitfall": "Mocking the database in all \"integration\" tests. Real query behavior (constraints, transactions, SQL dialect) goes untested; use a real database in a container (testcontainers).", "follow": [["What are contract tests?", "Tests that check a service honors the API expected by its consumers, such as with Pact."], ["How do you keep slow tests out of the default run?", "Mark them (`@pytest.mark.slow`) and deselect with `-m \"not slow\"`."]], "output": "", "num": 354, "sectionTitle": "Testing, Debugging & Logging"}, {"section": 18, "level": "Moderate", "question": "How do you freeze time or control randomness in tests?", "answer": "Inject a clock/RNG (best), or patch: `freezegun`/`time-machine` for dates, `random.seed()` or a dedicated `random.Random(seed)` instance for reproducible randomness.", "code": "import random\nfrom datetime import datetime, timezone\nclass Service:\n    def __init__(self, clock=lambda: datetime.now(timezone.utc), rng=random.Random()):\n        self.clock, self.rng = clock, rng\n    def token(self): return f\"{self.clock():%Y%m%d}-{self.rng.randint(1000, 9999)}\"\ns = Service(clock=lambda: datetime(2026, 9, 28, tzinfo=timezone.utc), rng=random.Random(42))\nprint(s.token(), s.token())", "terms": [["Dependency injection", "Passing collaborators (clock, RNG) in rather than using globals."]], "pitfall": "Patching `datetime.datetime.now` directly with `mock.patch`. It fails because built-in types cannot be patched; use `freezegun`/`time-machine` or inject a clock.", "follow": [["Why is time-machine faster than freezegun?", "It patches time at the C level instead of replacing modules' references."], ["How do you seed Hypothesis or NumPy?", "Hypothesis manages its own seed (`--hypothesis-seed`); NumPy uses `np.random.default_rng(seed)`."]], "output": "20260928-2824 20260928-1409", "num": 355, "sectionTitle": "Testing, Debugging & Logging"}, {"section": 18, "level": "Moderate", "question": "What is logging best practice in applications vs libraries?", "answer": "Libraries: `log = logging.getLogger(__name__)`, never configure handlers (at most add `NullHandler`). Applications: configure once at startup (`dictConfig`), use structured/JSON logs in production, include request IDs, log exceptions with `log.exception`, and use lazy `%s` formatting. Don't use `print` in services.", "code": "", "terms": [["`NullHandler`", "A handler that discards records, avoiding \"no handler\" warnings in libraries."], ["Structured logging", "Logging key-value data (JSON), for example with `structlog`, instead of free text."]], "pitfall": "Using f-strings inside log calls at DEBUG level in hot paths. The string is formatted even when DEBUG is disabled; pass arguments (`log.debug(\"x=%s\", x)`).", "follow": [["How do you add request IDs to every log line?", "A `logging.Filter` or `LoggerAdapter` reading a `contextvars.ContextVar`."], ["Where should applications configure logging?", "Once at startup, in the entry point, typically with `dictConfig`."]], "output": "", "num": 356, "sectionTitle": "Testing, Debugging & Logging"}, {"section": 18, "level": "Difficult", "question": "How do you find where a slow or hanging Python process is stuck?", "answer": "`py-spy dump --pid <pid>` shows every thread's stack without stopping it; `py-spy top`/`record` profiles live. `faulthandler.dump_traceback_later(timeout)` dumps stacks if a run hangs; `python -X faulthandler` shows stacks on crashes; `sys._current_frames()` in-process.", "code": "import sys, threading, time, traceback\ndef worker(): time.sleep(0.2)\nt = threading.Thread(target=worker, name=\"slow-worker\"); t.start()\ntime.sleep(0.05)\nfor tid, frame in sys._current_frames().items():\n    name = next((th.name for th in threading.enumerate() if th.ident == tid), \"?\")\n    if name == \"slow-worker\":\n        print(name, \"is at:\", traceback.extract_stack(frame)[-1].line)\nt.join()", "terms": [["Sampling profiler", "Periodically records stacks with low overhead; py-spy works without modifying the program."], ["`faulthandler`", "Dumps Python tracebacks on crashes or on a signal/timeout."]], "pitfall": "Adding print statements to production to find a hang. Attach py-spy or enable `faulthandler.register(signal.SIGUSR1)` instead; no restart or code change needed.", "follow": [["What is new in Python 3.14 for this?", "`python -m asyncio ps PID` and `pstree PID` show running asyncio tasks of another process."], ["How do you profile CPU in development?", "`python -m cProfile -o out.prof script.py`, viewed with snakeviz, or use scalene/py-spy flame graphs."]], "output": "slow-worker is at: def worker(): time.sleep(0.2)", "num": 357, "sectionTitle": "Testing, Debugging & Logging"}, {"section": 18, "level": "Moderate", "question": "What are doctests?", "answer": "Examples in docstrings written as interactive sessions (`>>> expr` then expected output). `python -m doctest module.py` or `doctest.testmod()` runs them, keeping documentation examples correct.", "code": "import doctest\ndef slugify(text):\n    \"\"\"Turn a title into a URL slug.\n    >>> slugify(\"Hello World\")\n    'hello-world'\n    >>> slugify(\"  Python  Tips \")\n    'python-tips'\n    \"\"\"\n    return \"-\".join(text.lower().split())\nprint(doctest.testmod(verbose=False))", "terms": [["`ELLIPSIS` option", "Doctest directive allowing `...` to match any output."]], "pitfall": "Doctests with unstable output (dict ordering in old versions, memory addresses, floats). They fail randomly; use doctests for simple, deterministic examples.", "follow": [["How does pytest run doctests?", "`pytest --doctest-modules`."], ["Are doctests a replacement for unit tests?", "No; they keep documentation correct but are awkward for edge cases and setup."]], "output": "TestResults(failed=0, attempted=2)", "num": 358, "sectionTitle": "Testing, Debugging & Logging"}, {"section": 18, "level": "Moderate", "question": "How do you structure tests in a project?", "answer": "A `tests/` directory mirroring the package layout, `test_*.py` files, shared fixtures in `conftest.py`, test configuration in `pyproject.toml` (`[tool.pytest.ini_options]`), markers for slow/integration tests, and CI running `pytest -q --cov` on every pull request, often parallelized with `pytest-xdist`.", "code": "", "terms": [["src layout", "Package under `src/`, so tests run against the installed package, not the working directory."]], "pitfall": "Putting `__init__.py`-less test folders with duplicate file names (`tests/a/test_utils.py`, `tests/b/test_utils.py`). pytest's default import mode raises errors; use unique names or `--import-mode=importlib`.", "follow": [["Where should test configuration live?", "`[tool.pytest.ini_options]` in `pyproject.toml`, or a `pytest.ini`."], ["How do you run tests in parallel?", "`pytest -n auto` with the pytest-xdist plugin."]], "output": "", "num": 359, "sectionTitle": "Testing, Debugging & Logging"}, {"section": 19, "level": "Easy", "question": "What is the first step when Python code is too slow?", "answer": "**Measure** before changing anything: time the whole program, then profile to find where time actually goes (`cProfile`, `py-spy`). Most programs spend most of their time in a small part of the code, and intuition about which part is often wrong. Then fix the algorithm or data structure first, micro-optimizations last.", "code": "import cProfile, pstats, io\ndef slow_unique(items):\n    out = []\n    for x in items:\n        if x not in out: out.append(x)        # O(n) membership -> O(n^2) overall\n    return out\ndata = list(range(3000)) * 2\nprof = cProfile.Profile(); prof.enable(); slow_unique(data); prof.disable()\nstats = pstats.Stats(prof).sort_stats(\"cumulative\")\nfor (file, line, name), (cc, nc, tt, ct, callers) in stats.stats.items():\n    if name == \"slow_unique\":\n        print(f\"{name}: {nc} call(s), {ct * 1000:.1f} ms cumulative -> the hotspot\")", "terms": [["Profiler", "A tool that measures where time is spent: `cProfile` (deterministic) or py-spy/scalene (sampling)."], ["Hot spot", "The small part of the code where most of the time goes."]], "pitfall": "Optimizing code that \"looks slow\" without profiling. Most time is usually in a few places you did not suspect, often I/O or one quadratic loop.", "follow": [["How do you read `cProfile` output?", "Sort by `cumulative` to find expensive call trees and by `tottime` to find functions that are slow themselves."], ["What is Amdahl's law?", "The speedup from optimizing one part is limited by the fraction of total time that part takes."]], "output": "slow_unique: 1 call(s), 46.8 ms cumulative -> the hotspot", "num": 360, "sectionTitle": "Performance & Optimization"}, {"section": 19, "level": "Easy", "question": "How do you time a piece of code correctly?", "answer": "Use `time.perf_counter()` for wall-clock timing of a block (monotonic, high resolution), and `timeit` for small snippets (it repeats the code many times and disables GC by default). Report the best of several repeats; single measurements are noisy.", "code": "import time, timeit\nt = time.perf_counter(); sum(range(1_000_000)); print(f\"block: {(time.perf_counter() - t) * 1000:.1f} ms\")\nbest = min(timeit.repeat(\"sum(range(1000))\", number=1000, repeat=5))\nprint(f\"snippet: {best / 1000 * 1e6:.2f} us per call (best of 5)\")", "terms": [["`tim
