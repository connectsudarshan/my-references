"title": "<code>functools.lru_cache<\/code>, <code>cache<\/code>, <code>wraps<\/code>; <code>contextlib.contextmanager<\/code>", "body": "<code>@lru_cache<\/code> adds memoization to any pure function in one line. <code>@contextmanager<\/code> turns a generator into a context manager. <code>@property<\/code>, <code>@staticmethod<\/code> and <code>@dataclass<\/code> use the same syntax."}, {"where": "framework", "title": "Flask and Django view decorators", "body": "<code>@app.route('/orders')<\/code> registers a view; <code>@login_required<\/code>, Django's <code>@cache_page(60)<\/code>, <code>@require_POST<\/code> and <code>@csrf_exempt<\/code> wrap views to add auth, caching and method checks without editing the view body."}, {"where": "framework", "title": "WSGI middleware such as Werkzeug <code>ProxyFix<\/code>", "body": "<code>app.wsgi_app = ProxyFix(app.wsgi_app)<\/code> wraps a WSGI app in another callable with the same signature that fixes client IPs behind a load balancer. Middleware stacks are decorator chains."}, {"where": "production", "title": "Resilience wrappers: tenacity <code>@retry<\/code>, rate limiters, metrics", "body": "Service clients decorate outbound calls with <code>@retry(stop=stop_after_attempt(3), wait=wait_exponential())<\/code>, plus timing and Prometheus counters, keeping the business function focused on business logic."}], "use": ["Add cross-cutting behaviour (cache, retry, log, auth, timing) to many functions", "Combine optional features by stacking instead of subclassing each combination", "Add behaviour to objects at runtime"], "avoid": ["Deep stacks that make tracebacks and debugging hard", "The added behaviour changes the interface or meaning: that is no longer a decorator"], "pitfall": "Forgetting <code>@functools.wraps<\/code>: every decorated function is then called <code>wrapper<\/code>, breaking logs, docs, pytest names and Flask routes (Flask raises an error for duplicate endpoint names).", "qa": [{"q": "What does <code>@decorator<\/code> syntax actually do?", "a": "<p><code>@d<\/code> above <code>def f<\/code> is sugar for <code>f = d(f)<\/code> after the function is defined. Stacked decorators apply bottom-up: <code>@a @b def f<\/code> is <code>f = a(b(f))<\/code>.<\/p>"}, {"q": "How do you write a decorator that takes arguments?", "a": "<p>Add one more level: a factory that takes the arguments and returns the real decorator, which takes the function and returns the wrapper (see <code>retry(times=3)<\/code>).<\/p>"}, {"q": "Python decorators vs the GoF Decorator pattern?", "a": "<p>GoF Decorator wraps an <b>object<\/b> with the same interface (like the <code>io<\/code> stack). Python's <code>@<\/code> syntax wraps <b>functions or classes<\/b> at definition time. Both add behaviour while preserving the interface; Python decorators can also register or replace things.<\/p>"}, {"q": "What does <code>functools.wraps<\/code> do?", "a": "<p>It copies <code>__name__<\/code>, <code>__qualname__<\/code>, <code>__doc__<\/code>, <code>__module__<\/code> and <code>__dict__<\/code> from the wrapped function and sets <code>__wrapped__<\/code>, so introspection, docs and <code>inspect.signature<\/code> still work.<\/p>"}], "related": ["proxy", "adapter", "chain-of-responsibility", "composite"], "code_out": "  fetch_rate('USD',) took 20.4 ms\n  attempt 1 failed: upstream timeout\n  fetch_rate('USD',) took 20.0 ms\n  attempt 2 failed: upstream timeout\n  fetch_rate('USD',) took 20.5 ms\nrate: 83.1\n  fetch_rate('USD',) took 0.0 ms\ncached: 83.1\nfetch_rate - Call an exchange-rate API (flaky).", "pythonic_out": "compressed bytes: 92\nfirst line back: order_id,total\nTextIOWrapper -> BufferedReader -> FileIO"}, {"id": "facade", "cat": "structural", "name": "Facade", "alias": "One simple interface in front of a complex subsystem.", "simple": "A hotel concierge. You say \"book me dinner and a taxi for 8 pm\". Behind the scenes they call the restaurant, the taxi company and update your bill. You talk to one person, not five departments.", "intent": "<p>A facade offers a small, task-oriented API that coordinates many lower-level objects. It hides ordering rules, setup and error handling, so most callers get the common case in one call while experts can still reach the subsystem directly.<\/p>\n<p>Python's most loved libraries are facades: <code>requests.get()<\/code> over urllib3 and <code>http.client<\/code>; <code>subprocess.run()<\/code> over <code>Popen<\/code>; <code>shutil<\/code> over <code>os<\/code>. In your own code, a service-layer function like <code>place_order()<\/code> is a facade over repositories, payment and messaging.<\/p>", "structure": "  client --> OrderFacade.place_order(cart, card)\n                 |-- InventoryService.reserve()\n                 |-- PaymentService.charge()\n                 |-- InvoiceService.create()\n                 '-- EmailService.send()        (order and rollback handled inside)", "code": "class Inventory:\n    def reserve(self, sku, qty): print(f\"  reserve {qty} x {sku}\"); return f\"R-{sku}\"\n    def release(self, rid): print(f\"  release {rid}\")\nclass Payments:\n    def charge(self, card, amount):\n        if card.endswith(\"0000\"): raise RuntimeError(\"card declined\")\n        print(f\"  charge {amount:.2f} on ****{card[-4:]}\"); return \"PAY-77\"\nclass Invoices:\n    def create(self, order_id, amount): print(f\"  invoice for {order_id}\"); return f\"INV-{order_id}\"\nclass Mailer:\n    def send(self, to, subject): print(f\"  email {to}: {subject}\")\n\nclass CheckoutFacade:\n    \"\"\"One call for the common case; hides order of steps and compensation.\"\"\"\n    def __init__(self):\n        self.inv, self.pay, self.invoices, self.mail = Inventory(), Payments(), Invoices(), Mailer()\n\n    def place_order(self, order_id, email, sku, qty, price, card):\n        rid = self.inv.reserve(sku, qty)\n        try:\n            self.pay.charge(card, qty * price)\n        except RuntimeError as e:\n            self.inv.release(rid)                     # compensation hidden from caller\n            return {\"ok\": False, \"error\": str(e)}\n        inv = self.invoices.create(order_id, qty * price)\n        self.mail.send(email, f\"Order {order_id} confirmed\")\n        return {\"ok\": True, \"invoice\": inv}\n\nshop = CheckoutFacade()\nprint(shop.place_order(\"O-1\", \"a@x.com\", \"SKU-9\", 2, 499.0, \"4111111111111111\"))\nprint(shop.place_order(\"O-2\", \"b@x.com\", \"SKU-9\", 1, 499.0, \"4000000000000000\"))", "pythonic": "import subprocess, sys, shutil, tempfile, pathlib\n\n# subprocess.run is a facade over Popen + pipes + wait + error checking\nr = subprocess.run([sys.executable, \"-c\", \"print('hello from child')\"],\n                   capture_output=True, text=True, check=True, timeout=10)\nprint(r.stdout.strip(), \"| exit\", r.returncode)\n\n# shutil is a facade over os, zipfile and tarfile\nwith tempfile.TemporaryDirectory() as d:\n    src = pathlib.Path(d, \"reports\"); src.mkdir()\n    (src / \"q1.csv\").write_text(\"a,b\\n1,2\\n\")\n    archive = shutil.make_archive(str(pathlib.Path(d, \"backup\")), \"zip\", src)\n    print(pathlib.Path(archive).name, pathlib.Path(archive).stat().st_size > 0)", "pythonic_note": "Before writing your own facade, check whether the stdlib already has one: <code>subprocess.run<\/code>, <code>shutil.copytree<\/code>, <code>shutil.make_archive<\/code>, <code>pathlib.Path.read_text<\/code>.", "examples": [{"where": "stdlib", "title": "<code>subprocess.run()<\/code>", "body": "Added in 3.5 as a facade over <code>Popen<\/code>: it starts the process, wires pipes, waits, applies a timeout, and raises <code>CalledProcessError<\/code> with <code>check=True<\/code>. <code>Popen<\/code> is still there for streaming or interactive cases."}, {"where": "stdlib", "title": "<code>shutil<\/code> and <code>pathlib<\/code>", "body": "<code>shutil.copytree<\/code>, <code>rmtree<\/code> and <code>make_archive<\/code> hide the recursion over <code>os.scandir<\/code>, permission copying and zip/tar details. <code>Path.read_text()<\/code> hides open, decode and close."}, {"where": "framework", "title": "requests over urllib3 and http.client", "body": "<code>requests.get(url, params=..., timeout=5)<\/code> hides connection pooling, redirects, cookie handling, content decoding and JSON parsing. It became Python's most downloaded library largely because of this simple facade."}, {"where": "framework", "title": "boto3 <code>s3.upload_file()<\/code>", "body": "One call that decides whether to use multipart upload, splits the file into parts, uploads them in parallel threads and retries failed parts, which would otherwise be dozens of low-level API calls."}, {"where": "production", "title": "Service layer in web applications", "body": "Views and API handlers call <code>OrderService.place_order()<\/code>; the service coordinates repositories, payment gateway, events and emails. Controllers stay thin and the same logic is reused by CLI commands and background jobs."}], "use": ["A subsystem is complex and most callers need a few common operations", "You want a stable entry point while internals change", "Layering an application (service layer over infrastructure)"], "avoid": ["The facade becomes a god object that knows everything; split it by use case", "Hiding things power users legitimately need; keep the subsystem accessible"], "pitfall": "Facades that swallow errors to look simple (returning <code>None<\/code> on any failure). Hide complexity, not failures: raise clear exceptions or return explicit results.", "qa": [{"q": "Facade vs Adapter?", "a": "<p>An Adapter makes one existing interface match another expected interface. A Facade defines a new, simpler interface over many objects. Adapter is about compatibility; Facade is about simplicity.<\/p>"}, {"q": "Does a facade prevent access to the subsystem?", "a": "<p>No. It is a convenience layer. Clients who need fine control can still use the subsystem directly (as you can still use <code>Popen<\/code> instead of <code>run<\/code>).<\/p>"}, {"q": "Give an example of a facade you wrote.", "a": "<p>A good answer names a real subsystem and the simplification: e.g. a <code>DeviceTestRunner.run(test_plan)<\/code> facade that powers the device, configures firmware, runs the workload, collects logs and powers down, so test authors write one call instead of 40 lines of setup.<\/p>"}], "related": ["adapter", "mediator", "singleton", "abstract-factory"], "code_out": "  reserve 2 x SKU-9\n  charge 998.00 on ****1111\n  invoice for O-1\n  email a@x.com: Order O-1 confirmed\n{'ok': True, 'invoice': 'INV-O-1'}\n  reserve 1 x SKU-9\n  release R-SKU-9\n{'ok': False, 'error': 'card declined'}", "pythonic_out": "hello from child | exit 0\nbackup.zip True"}, {"id": "flyweight", "cat": "structural", "name": "Flyweight", "alias": "Share the common, immutable part of many similar objects to save memory.", "simple": "A printing press doesn't cast a new letter \"e\" for every \"e\" in the newspaper. It has one \"e\" block and stamps it wherever needed. Only the position on the page is different each time.", "intent": "<p>When you need millions of fine-grained objects, most of their data is often identical. Flyweight splits state into <b>intrinsic<\/b> (shared, immutable: font, sprite, species, category name) and <b>extrinsic<\/b> (per-use: position, quantity). A factory hands out one shared object per intrinsic value.<\/p>\n<p>CPython itself does this: small integers from -5 to 256 are preallocated and shared, and strings can be interned. In your own code, combine a cached factory with <code>__slots__<\/code> on the per-instance objects.<\/p>", "structure": " 1,000,000 Tree(x, y, type)     type -> TreeType(\"oak\", texture, mesh)   <- 3 shared objects\n                                         TreeType(\"pine\", ...)\n                                         TreeType(\"birch\", ...)\n extrinsic: x, y (per tree)     intrinsic: name, texture, mesh (shared)", "code": "import tracemalloc, functools, random\n\nclass TreeType:                                    # intrinsic, shared, immutable\n    def __init__(self, name, color, texture):\n        self.name, self.color, self.texture = name, color, texture\n\n@functools.cache                                   # flyweight factory: one per key\ndef tree_type(name, color):\n    return TreeType(name, color, texture=bytes(2_000))   # pretend 2 KB texture\n\nclass Tree:\n    __slots__ = (\"x\", \"y\", \"type\")                # no per-instance __dict__\n    def __init__(self, x, y, type_): self.x, self.y, self.type = x, y, type_\n\nclass FatTree:                                     # naive: every tree owns a texture\n    def __init__(self, x, y, name, color):\n        self.x, self.y, self.name, self.color = x, y, name, color\n        self.texture = bytes(2_000)\n\nkinds = [(\"oak\", \"green\"), (\"pine\", \"dark green\"), (\"birch\", \"white\")]\nrandom.seed(1)\nN = 20_000\n\ndef measure(make):\n    tracemalloc.start()\n    forest = [make(random.random(), random.random(), *random.choice(kinds)) for _ in range(N)]\n    cur, _ = tracemalloc.get_traced_memory(); tracemalloc.stop()\n    return forest, cur / 1e6\n\n_, fat_mb = measure(lambda x, y, n, c: FatTree(x, y, n, c))\nforest, fly_mb = measure(lambda x, y, n, c: Tree(x, y, tree_type(n, c)))\nprint(f\"naive:     {fat_mb:6.1f} MB\")\nprint(f\"flyweight: {fly_mb:6.1f} MB  ({fat_mb / fly_mb:.0f}x less)\")\nprint(\"shared TreeType objects:\", tree_type.cache_info().currsize)", "pythonic": "import sys\n\na, b = 256, int(\"256\")\nc, d = 257, int(\"257\")\nprint(\"256 shared:\", a is b, \"| 257 shared:\", c is d)   # CPython small-int cache (-5..256)\n\ns1 = \"\".join([\"order\", \"_status\"])\ns2 = \"order_status\"\nprint(\"equal:\", s1 == s2, \"| same object:\", s1 is s2)\nprint(\"after intern:\", sys.intern(s1) is sys.intern(s2))", "pythonic_note": "CPython already shares small ints and many strings. <code>sys.intern()<\/code> lets you share strings explicitly, which helps when millions of records repeat the same keys. (Identity of ints and strings is an implementation detail: always compare values with <code>==<\/code>.)", "examples": [{"where": "stdlib", "title": "CPython small-integer cache and <code>sys.intern()<\/code>", "body": "Integers -5..256 are preallocated singletons; identifiers and many literal strings are interned automatically, and <code>sys.intern()<\/code> interns any string so repeated values share memory and compare faster in dict lookups."}, {"where": "stdlib", "title": "<code>re<\/code> compiled-pattern cache and <code>enum<\/code> members", "body": "<code>re.search(pattern, s)<\/code> keeps an internal cache of compiled patterns, so the same regex string is compiled once. Enum members are created once and shared by every reference."}, {"where": "framework", "title": "pandas <code>category<\/code> dtype", "body": "<code>df['city'].astype('category')<\/code> stores each distinct string once plus small integer codes per row. A 10-million-row column with 50 cities can shrink from hundreds of MB to tens of MB."}, {"where": "framework", "title": "<code>__slots__<\/code> in data-heavy libraries", "body": "Libraries that create huge numbers of small objects (ORM row objects, AST nodes, geometry points) use <code>__slots__<\/code> to drop the per-instance <code>__dict__<\/code>, the memory-saving companion to sharing intrinsic state."}, {"where": "production", "title": "Games, maps and text editors", "body": "Games render forests and crowds from a few shared meshes/textures; map apps share icon sprites across thousands of pins; editors share glyph objects per character and font instead of one per keystroke."}], "use": ["Very large numbers of similar objects cause memory pressure", "Most object state can be made immutable and shared"], "avoid": ["Object counts are small: complexity without benefit", "The shared part must be mutable per object"], "pitfall": "Mutating a shared flyweight (<code>tree.type.color = 'red'<\/code>) changes every tree using it. Make intrinsic objects immutable (frozen dataclasses, tuples).", "qa": [{"q": "Intrinsic vs extrinsic state?", "a": "<p>Intrinsic state is independent of context and can be shared (species, font, texture). Extrinsic state depends on context and is supplied per use (position, size, quantity).<\/p>"}, {"q": "Why does <code>a is b<\/code> return True for 256 but False for 257?", "a": "<p>CPython preallocates integers from -5 to 256 and reuses them (a flyweight cache). Larger ints created at runtime are separate objects. It is an implementation detail: never use <code>is<\/code> to compare numbers.<\/p>"}, {"q": "How would you cut memory for 10 million objects in Python?", "a": "<p>Use <code>__slots__<\/code>, share repeated values (flyweight / <code>sys.intern<\/code> / pandas categories), use tuples or namedtuples, or move to columnar structures (NumPy arrays, pandas, <code>array<\/code> module) instead of one object per record. Measure with <code>tracemalloc<\/code>.<\/p>"}], "related": ["singleton", "object-pool", "prototype"], "code_out": "naive:       44.0 MB\nflyweight:    2.3 MB  (19x less)\nshared TreeType objects: 3", "pythonic_out": "256 shared: True | 257 shared: False\nequal: True | same object: False\nafter intern: True"}, {"id": "proxy", "cat": "structural", "name": "Proxy", "alias": "A stand-in with the same interface that controls access to the real object.", "simple": "A cheque is a proxy for money in your bank. You can hand it over like cash, but the bank checks your balance (protection) and only moves money when it's presented (lazy). The money itself stays safely in the vault (remote).", "intent": "<p>A proxy has the same interface as the real subject and decides when and how to forward calls. Common kinds:<\/p>\n<p><b>Virtual (lazy) proxy<\/b>: create an expensive object only when first used. <b>Protection proxy<\/b>: check permissions or make the object read-only. <b>Remote proxy<\/b>: represent an object in another process or machine. <b>Caching / logging proxy<\/b>: add caching or auditing on access. <b>Smart reference<\/b>: count references or hold weak references.<\/p>\n<p>In Python, <code>__getattr__<\/code> makes generic proxies short: it is only called for attributes not found on the proxy itself, so everything else forwards to the target.<\/p>", "structure": " client --> ReportProxy.render()  --(first use? load)--> RealReport.render()\n                 |  same interface\n                 '-- checks role, logs access, caches result", "code": "import time\n\nclass SalesReport:                               # expensive real subject\n    def __init__(self, year):\n        print(f\"  loading 2 GB of {year} sales data...\")\n        time.sleep(0.05)\n        self.year, self.rows = year, 1_250_000\n    def summary(self): return f\"{self.year}: {self.rows:,} rows\"\n    def export(self, fmt): return f\"{self.year}.{fmt} written\"\n\nclass ReportProxy:\n    \"\"\"Virtual proxy (lazy load) + protection proxy (role check) + logging.\"\"\"\n    def __init__(self, year, user_role):\n        self._year, self._role, self._real = year, user_role, None\n\n    def _subject(self):\n        if self._real is None:                   # created on first real use\n            self._real = SalesReport(self._year)\n        return self._real\n\n    def __getattr__(self, name):                 # called only for missing attributes\n        if name == \"export\" and self._role != \"admin\":\n            raise PermissionError(f\"role '{self._role}' cannot export\")\n        print(f\"  audit: {self._role} called {name}\")\n        return getattr(self._subject(), name)\n\nr = ReportProxy(2025, user_role=\"analyst\")\nprint(\"proxy created, nothing loaded yet\")\nprint(r.summary())\nprint(r.summary())                               # already loaded: no second load\ntry:\n    r.export(\"csv\")\nexcept PermissionError as e:\n    print(\"blocked:\", e)", "pythonic": "import types, weakref\n\n# protection proxy: a read-only view of a dict\n_config = {\"db_url\": \"postgres://prod\", \"debug\": False}\nCONFIG = types.MappingProxyType(_config)\ntry:\n    CONFIG[\"debug\"] = True\nexcept TypeError as e:\n    print(\"read-only:\", e)\n_config[\"debug\"] = True                          # owner can still change the real dict\nprint(\"view sees update:\", CONFIG[\"debug\"])\nprint(type(int.__dict__).__name__)               # class namespaces are exposed this way\n\n# smart reference: weakref.proxy doesn't keep the object alive\nclass Session: pass\ns = Session(); p = weakref.proxy(s)\ndel s\ntry:\n    p.anything\nexcept ReferenceError as e:\n    print(\"weak proxy:\", e)", "pythonic_note": "<code>types.MappingProxyType<\/code> (read-only view) and <code>weakref.proxy<\/code> are ready-made proxies. Every class's <code>__dict__<\/code> is a <code>mappingproxy<\/code>.", "examples": [{"where": "stdlib", "title": "<code>types.MappingProxyType<\/code> and <code>weakref.proxy<\/code>", "body": "A mapping proxy is a read-only live view, used to expose internal registries safely. <code>weakref.proxy<\/code> behaves like the object but doesn't keep it alive, useful for caches and parent back-references."}, {"where": "stdlib", "title": "<code>xmlrpc.client.ServerProxy<\/code> and <code>multiprocessing<\/code> managers", "body": "Remote proxies: calling <code>proxy.add(2, 3)<\/code> sends a request to another process or server. <code>multiprocessing.Manager().dict()<\/code> returns a proxy whose methods run in the manager process."}, {"where": "framework", "title": "Flask <code>request<\/code>, <code>current_app<\/code>, <code>g<\/code> (Werkzeug <code>LocalProxy<\/code>)", "body": "These module-level names are proxies that resolve to the object for the current request context, which is why you can import <code>request<\/code> globally and still get the right one in each concurrent request."}, {"where": "framework", "title": "Django <code>request.user<\/code> and SQLAlchemy lazy loading", "body": "Django's authentication middleware sets <code>request.user<\/code> to a <code>SimpleLazyObject<\/code>, so the user query only runs if the view touches it. SQLAlchemy relationships with <code>lazy='select'<\/code> load related rows only on first attribute access."}, {"where": "production", "title": "API gateways and caching proxies", "body": "At system scale, NGINX, Envoy and CDNs are proxies with the same HTTP interface as the service behind them, adding auth, rate limiting, TLS and caching. Test code uses <code>unittest.mock<\/code> objects as stand-in proxies for real services."}], "use": ["Delay creating something expensive until needed", "Control access (permissions, read-only) without changing the real class", "Represent a remote or cross-process object locally", "Add caching, auditing or reference management transparently"], "avoid": ["The indirection hides important latency (a remote call that looks like a local attribute)", "Simple cases where an explicit function call is clearer"], "pitfall": "<code>__getattr__<\/code> does not intercept special methods: <code>len(proxy)<\/code>, <code>proxy[0]<\/code> and <code>str(proxy)<\/code> look up <code>__len__<\/code>/<code>__getitem__<\/code>/<code>__str__<\/code> on the type and bypass it. Define those explicitly if needed.", "qa": [{"q": "Proxy vs Decorator?", "a": "<p>Both wrap an object with the same interface. A Decorator adds responsibilities and is usually stacked by the client. A Proxy controls access (lazy creation, permissions, remoteness) and often manages the real object's lifecycle itself.<\/p>"}, {"q": "What is the difference between <code>__getattr__<\/code> and <code>__getattribute__<\/code>?", "a": "<p><code>__getattribute__<\/code> runs on every attribute access. <code>__getattr__<\/code> runs only when normal lookup fails. Proxies usually use <code>__getattr__<\/code> so their own attributes resolve normally.<\/p>"}, {"q": "How does Flask make <code>request<\/code> a global yet per-request?", "a": "<p><code>request<\/code> is a Werkzeug <code>LocalProxy<\/code> bound to a context variable. Each access looks up the request object for the current context (thread or async task), so concurrent requests never see each other's data.<\/p>"}], "related": ["decorator", "adapter", "singleton"], "code_out": "proxy created, nothing loaded yet\n  audit: analyst called summary\n  loading 2 GB of 2025 sales data...\n2025: 1,250,000 rows\n  audit: analyst called summary\n2025: 1,250,000 rows\nblocked: role 'analyst' cannot export", "pythonic_out": "read-only: 'mappingproxy' object does not support item assignment\nview sees update: True\nmappingproxy\nweak proxy: weakly-referenced object no longer exists"}, {"id": "chain-of-responsibility", "cat": "behavioral", "name": "Chain of Responsibility", "alias": "Pass a request along a chain of handlers; each handles it, passes it on, or stops it.", "simple": "Calling customer support: the bot tries first; if it can't help, you go to a level-1 agent, then to a specialist, then to a manager. You just made one call; the chain decided who dealt with it.", "intent": "<p>Instead of one big function with every check, you build a chain of small handlers. Each handler looks at the request and either handles it, modifies it and passes it on, or stops the chain (for example, returns 401). The sender doesn't know which handler finished the job, and handlers can be reordered or added through configuration.<\/p>\n<p>Web middleware is the everyday Python form: each middleware wraps the next one and can short-circuit. Exception handling is also a chain: an exception travels up the call stack until some <code>except<\/code> handles it.<\/p>", "structure": " request -> [RequestId] -> [Auth] -> [RateLimit] -> [Validate] -> view\n                            |           |\n                     401 & stop    429 & stop      (each can short-circuit)\n response flows back through the same chain in reverse", "code": "import time\nfrom typing import Callable\n\nHandler = Callable[[dict], dict]\n\ndef request_id(next_: Handler) -> Handler:\n    counter = iter(range(1000, 10**6))\n    def handle(req):\n        req[\"id\"] = next(counter)\n        resp = next_(req)\n        resp[\"headers\"][\"X-Request-ID\"] = str(req[\"id\"])   # runs on the way back\n        return resp\n    return handle\n\ndef auth(next_: Handler) -> Handler:\n    def handle(req):\n        if req.get(\"token\") != \"secret\":\n            return {\"status\": 401, \"body\": \"unauthorized\", \"headers\": {}}   # stop here\n        return next_(req)\n    return handle\n\ndef rate_limit(limit_per_sec: int):\n    def mw(next_: Handler) -> Handler:\n        hits = []\n        def handle(req):\n            now = time.monotonic()\n            hits[:] = [t for t in hits if now - t < 1]\n            if len(hits) >= limit_per_sec:\n                return {\"status\": 429, \"body\": \"slow down\", \"headers\": {}}\n            hits.append(now)\n            return next_(req)\n        return handle\n    return mw\n\ndef view(req):\n    return {\"status\": 200, \"body\": f\"orders for {req['user']}\", \"headers\": {}}\n\ndef build_chain(endpoint, middlewares):\n    for mw in reversed(middlewares):          # first in list = outermost\n        endpoint = mw(endpoint)\n    return endpoint\n\napp = build_chain(view, [request_id, auth, rate_limit(2)])\nfor token in [\"secret\", \"wrong\", \"secret\", \"secret\"]:\n    r = app({\"user\": \"riya\", \"token\": token})\n    print(r[\"status\"], r[\"body\"], r[\"headers\"])", "pythonic": "import logging, io\n\n# stdlib chain: a record goes to the logger's handlers, then propagates to parent loggers\nbuf = io.StringIO()\nroot = logging.getLogger(); root.handlers[:] = []\nh = logging.StreamHandler(buf); h.setFormatter(logging.Formatter(\"root handler got: %(name)s %(message)s\"))\nroot.addHandler(h)\n\napp_log = logging.getLogger(\"shop\")\nsvc_log = logging.getLogger(\"shop.payments\")      # child of \"shop\", grandchild of root\nsvc_log.warning(\"card declined\")                  # no handler on shop.payments -> passed up the chain\nlogging.getLogger(\"shop.payments\").propagate = False\nsvc_log.warning(\"this one stops at shop.payments\")\nprint(buf.getvalue().strip())", "pythonic_note": "The <code>logging<\/code> hierarchy is a chain: records propagate from <code>shop.payments<\/code> to <code>shop<\/code> to the root logger unless <code>propagate = False<\/code> stops them.", "examples": [{"where": "stdlib", "title": "<code>logging<\/code> propagation", "body": "A record is offered to the handlers of its logger, then to each ancestor's handlers. Setting <code>propagate = False<\/code> ends the chain; this is how libraries avoid double-logging."}, {"where": "stdlib", "title": "<code>urllib.request.OpenerDirector<\/code>", "body": "<code>build_opener()<\/code> chains handlers (<code>ProxyHandler<\/code>, <code>HTTPRedirectHandler<\/code>, <code>HTTPBasicAuthHandler<\/code>, <code>HTTPSHandler<\/code>), ordered by <code>handler_order<\/code>. Each gets a chance to process the request or the error."}, {"where": "framework", "title": "Django middleware / ASGI (Starlette, FastAPI) middleware", "body": "Each middleware receives <code>get_response<\/code> (the rest of the chain). <code>SecurityMiddleware<\/code>, <code>SessionMiddleware<\/code>, <code>AuthenticationMiddleware<\/code> and <code>CsrfViewMiddleware<\/code> run in order, and any can return a response early."}, {"where": "framework", "title": "Scrapy downloader and spider middlewares", "body": "Requests pass through retry, user-agent, cookies and proxy middlewares; each can modify, drop or replace the request or response."}, {"where": "production", "title": "Approval workflows and support escalation", "body": "Expense approvals (team lead up to 10k, manager up to 1 lakh, director above), fraud checks (rules engine then ML model then manual review) and ticket escalation are chains where each level decides or forwards."}], "use": ["Several independent checks/transformations apply in sequence", "The set or order of handlers should be configurable", "Any handler may need to stop processing early"], "avoid": ["Every request must be handled by exactly one specific handler: a dict dispatch is clearer", "Long chains where it is hard to see which handler ran (add logging/tracing)"], "pitfall": "Order bugs: putting rate limiting before authentication lets anonymous floods consume a real user's quota; putting a caching middleware before auth can serve one user's page to another. Order is part of the design.", "qa": [{"q": "How is web middleware an example of Chain of Responsibility?", "a": "<p>Each middleware wraps the next and decides whether to call it. It can modify the request before, the response after, or return early (401, 429, cached response). The view only sees requests that passed the whole chain.<\/p>"}, {"q": "Chain of Responsibility vs Decorator?", "a": "<p>The structure is similar (wrappers), but a decorator always delegates and adds behaviour, while a chain handler may <b>stop<\/b> the request. Middleware is effectively both.<\/p>"}, {"q": "What happens if no handler handles the request?", "a": "<p>You must define it: a default final handler (404), an exception, or silently dropping. Leaving it undefined is a common bug.<\/p>"}], "related": ["decorator", "command", "observer"], "code_out": "200 orders for riya {'X-Request-ID': '1000'}\n401 unauthorized {'X-Request-ID': '1001'}\n200 orders for riya {'X-Request-ID': '1002'}\n429 slow down {'X-Request-ID': '1003'}", "pythonic_out": "root handler got: shop.payments card declined"}, {"id": "command", "cat": "behavioral", "name": "Command", "alias": "Turn a request into an object so it can be queued, logged, retried or undone.", "simple": "At a restaurant the waiter writes your order on a ticket. The ticket can wait in a queue, be handed to any cook, be cancelled, or be kept for the bill. The ticket is the command: the request itself, written down.", "intent": "<p>A command object packages an action with everything needed to run it later: the receiver, the method and the arguments. Once a request is an object you can <b>queue<\/b> it (task queues), <b>schedule<\/b> it, <b>log<\/b> it, <b>retry<\/b> it, send it over the network, and <b>undo<\/b> it (if it also stores how to reverse itself).<\/p>\n<p>In Python, any callable is already a command: a function, a lambda, a <code>functools.partial<\/code>, or an object with <code>__call__<\/code>. Use a class when you need extra methods such as <code>undo()<\/code> or a serializable description.<\/p>", "structure": " Invoker (button, queue, scheduler)  --calls-->  Command.execute()\n                                                     | knows receiver + args\n history stack: [Insert(\"Hi\"), Bold(0,2), Delete(3)]  --> undo(): pop().undo()", "code": "from dataclasses import dataclass, field\n\nclass Document:                         # receiver\n    def __init__(self): self.text = \"\"\n\n@dataclass\nclass Insert:\n    doc: Document; pos: int; s: str\n    def execute(self): d = self.doc; d.text = d.text[:self.pos] + self.s + d.text[self.pos:]\n    def undo(self):    d = self.doc; d.text = d.text[:self.pos] + d.text[self.pos + len(self.s):]\n\n@dataclass\nclass Delete:\n    doc: Document; pos: int; n: int\n    removed: str = field(default=\"\", init=False)\n    def execute(self):\n        d = self.doc; self.removed = d.text[self.pos:self.pos + self.n]\n        d.text = d.text[:self.pos] + d.text[self.pos + self.n:]\n    def undo(self):\n        d = self.doc; d.text = d.text[:self.pos] + self.removed + d.text[self.pos:]\n\nclass Editor:                           # invoker keeps history\n    def __init__(self, doc): self.doc, self.undo_stack, self.redo_stack = doc, [], []\n    def run(self, cmd):\n        cmd.execute(); self.undo_stack.append(cmd); self.redo_stack.clear()\n    def undo(self):\n        cmd = self.undo_stack.pop(); cmd.undo(); self.redo_stack.append(cmd)\n    def redo(self):\n        cmd = self.redo_stack.pop(); cmd.execute(); self.undo_stack.append(cmd)\n\ndoc = Document(); ed = Editor(doc)\ned.run(Insert(doc, 0, \"Hello world\"));   print(repr(doc.text))\ned.run(Insert(doc, 5, \", dear\"));        print(repr(doc.text))\ned.run(Delete(doc, 0, 7));               print(repr(doc.text))\ned.undo();                               print(\"undo ->\", repr(doc.text))\ned.undo();                               print(\"undo ->\", repr(doc.text))\ned.redo();                               print(\"redo ->\", repr(doc.text))\nprint(\"history:\", [type(c).__name__ for c in ed.undo_stack])", "pythonic": "import functools, queue, threading\n\n# any callable is a command; functools.partial binds the arguments now, runs later\ndef send_email(to, subject): return f\"sent '{subject}' to {to}\"\n\njobs = queue.Queue()\njobs.put(functools.partial(send_email, \"a@x.com\", \"Welcome\"))\njobs.put(functools.partial(send_email, \"b@x.com\", \"Invoice INV-42\"))\njobs.put(lambda: 1 / 0)                         # a failing command\njobs.put(None)                                  # sentinel: stop worker\n\ndef worker():\n    while (cmd := jobs.get()) is not None:\n        try:\n            print(\"ok  \", cmd())\n        except Exception as e:\n            print(\"fail\", type(e).__name__, \"-> would retry or dead-letter\")\n\nt = threading.Thread(target=worker); t.start(); t.join()", "pythonic_note": "A queue of callables plus a worker thread is a tiny task queue. Celery and RQ do the same across machines by serializing the command (task name + arguments) into a message.", "examples": [{"where": "stdlib", "title": "<code>concurrent.futures.Executor.submit(fn, *args)<\/code>, <code>sched<\/code>, <code>threading.Timer<\/code>", "body": "All take a callable plus arguments to execute later or elsewhere. <code>sched.scheduler.enter(delay, priority, action, argument)<\/code> is a command scheduler in the stdlib."}, {"where": "stdlib", "title": "IDLE's undo system (<code>idlelib/undo.py<\/code>)", "body": "IDLE, the editor shipped with Python, records <code>InsertCommand<\/code> and <code>DeleteCommand<\/code> objects with <code>do<\/code>, <code>undo<\/code> and <code>redo<\/code>, grouped by <code>CommandSequence<\/code>: the classic Command-for-undo design."}, {"where": "framework", "title": "Celery / RQ tasks", "body": "<code>send_invoice.delay(order_id)<\/code> serializes the command (task name and arguments) into a message on RabbitMQ or Redis. Any worker executes it, with retries, ETA scheduling and result tracking."}, {"where": "framework", "title": "Django migrations", "body": "Each migration is a list of operation objects (<code>AddField<\/code>, <code>RunPython<\/code>, ...) with <code>database_forwards<\/code> and <code>database_backwards<\/code>. That is why <code>migrate app 0007<\/code> can roll the schema back: commands with undo."}, {"where": "production", "title": "Audit logs and event-sourced systems", "body": "Banking and admin systems store every command (<code>TransferMoney(from, to, amount, by_user)<\/code>) before executing it, giving an audit trail and the ability to replay or compensate operations."}], "use": ["Operations must be queued, scheduled, retried or run on another machine", "You need undo/redo or an audit log of actions", "UI elements should trigger actions without knowing the receiver"], "avoid": ["A direct function call is all you need: don't wrap every call in a class", "Undo is required but actions have external side effects that cannot be reversed (emails sent)"], "pitfall": "Undo that re-computes from current state instead of storing what it changed. The Delete command above records <code>removed<\/code> during <code>execute()<\/code>; without it, undo cannot restore the text.", "qa": [{"q": "How would you implement undo/redo?", "a": "<p>Represent each action as a command with <code>execute()<\/code> and <code>undo()<\/code>. Keep an undo stack and a redo stack: running a new command pushes to undo and clears redo; undo pops from undo, reverses and pushes to redo. Alternatively store Memento snapshots when reversing is hard.<\/p>"}, {"q": "Why is Command less visible in Python?", "a": "<p>Functions are first-class objects, so a callable (function, lambda, <code>functools.partial<\/code>, bound method) already is a command. Classes are needed only for extra behaviour such as undo, serialization or metadata.<\/p>"}, {"q": "How does Celery relate to the Command pattern?", "a": "<p>A task call is turned into a message containing the task name and arguments (the command), put on a broker queue (invoker), and executed by a worker (receiver side), with retries and scheduling.<\/p>"}], "related": ["memento", "strategy", "chain-of-responsibility", "observer"], "code_out": "'Hello world'\n'Hello, dear world'\n'dear world'\nundo -> 'Hello, dear world'\nundo -> 'Hello world'\nredo -> 'Hello, dear world'\nhistory: ['Insert', 'Insert']", "pythonic_out": "ok   sent 'Welcome' to a@x.com\nok   sent 'Invoice INV-42' to b@x.com\nfail ZeroDivisionError -> would retry or dead-letter"}, {"id": "interpreter", "cat": "behavioral", "name": "Interpreter", "alias": "Represent a small language's grammar as classes and evaluate sentences by walking the tree.", "simple": "A recipe card is a tiny language: \"if dough is sticky then add flour\". A cook reads each line and acts on it. An interpreter is the cook for your own mini-language.", "intent": "<p>For a <b>small, stable language<\/b> (business rules, filters, search queries, config expressions), define one class per grammar rule: literals, variables, <code>and<\/code>, <code>or<\/code>, comparisons. A parser turns text into a tree of these nodes, and each node's <code>evaluate(context)<\/code> computes its value, calling its children.<\/p>\n<p>It lets non-programmers write rules (stored in a DB, changed without deploys) safely, instead of using <code>eval()<\/code>. For bigger languages use a parser library (Lark, pyparsing) or Python's own <code>ast<\/code>.<\/p>", "structure": "  \"country == 'IN' and total > 1000 or vip == true\"\n              Or\n            /    \\\n          And     Eq(vip, true)\n         /   \\\n  Eq(country,'IN')  Gt(total, 1000)       evaluate(ctx) recurses down the tree", "code": "import re\nfrom dataclasses import dataclass\n\n# ---- grammar as classes (the Interpreter pattern)\n@dataclass\nclass Lit:  value: object\n@dataclass\nclass Var:  name: str\n@dataclass\nclass Cmp:  op: str; left: object; right: object\n@dataclass\nclass And:  left: object; right: object\n@dataclass\nclass Or:   left: object; right: object\n\nOPS = {\"==\": lambda a, b: a == b, \"!=\": lambda a, b: a != b,\n       \">\": lambda a, b: a > b, \"<\": lambda a, b: a < b, \">=\": lambda a, b: a >= b}\n\ndef evaluate(node, ctx):\n    match node:                                     # structural pattern matching (3.10+)\n        case Lit(v):          return v\n        case Var(name):       return ctx[name]\n        case Cmp(op, l, r):   return OPS[op](evaluate(l, ctx), evaluate(r, ctx))\n        case And(l, r):       return evaluate(l, ctx) and evaluate(r, ctx)\n        case Or(l, r):        return evaluate(l, ctx) or evaluate(r, ctx)\n\n# ---- tiny recursive-descent parser: or_expr := and_expr ('or' and_expr)*\nTOKEN = re.compile(r\"\\s*(?:(\\d+\\.?\\d*)|'([^']*)'|(true|false)\\b|(and|or)\\b|(==|!=|>=|>|<)|([A-Za-z_]\\w*))\")\n\ndef tokenize(text):\n    pos, out = 0, []\n    while pos < len(text.rstrip()):\n        m = TOKEN.match(text, pos)\n        if not m: raise SyntaxError(f\"bad input at {pos}: {text[pos:]!r}\")\n        num, s, boolean, kw, op, name = m.groups()\n        out.append((\"num\", float(num)) if num else (\"str\", s) if s is not None else\n                   (\"bool\", boolean == \"true\") if boolean else (\"kw\", kw) if kw else\n                   (\"op\", op) if op else (\"name\", name))\n        pos = m.end()\n    return out\n\ndef parse(text):\n    toks = tokenize(text); i = 0\n    def peek(): return toks[i] if i < len(toks) else (None, None)\n    def atom():\n        nonlocal i\n        kind, val = toks[i]; i += 1\n        return Var(val) if kind == \"name\" else Lit(val)\n    def comparison():\n        nonlocal i\n        left = atom()\n        if peek()[0] == \"op\":\n            op = toks[i][1]; i += 1\n            return Cmp(op, left, atom())\n        return left\n    def and_expr():\n        nonlocal i\n        node = comparison()\n        while peek() == (\"kw\", \"and\"): i += 1; node = And(node, comparison())\n        return node\n    def or_expr():\n        nonlocal i\n        node = and_expr()\n        while peek() == (\"kw\", \"or\"): i += 1; node = Or(node, and_expr())\n        return node\n    tree = or_expr()\n    if i != len(toks):\n        raise SyntaxError(f\"unexpected token {toks[i]}\")\n    return tree\n\nrule = parse(\"country == 'IN' and total > 1000 or vip == true\")   # stored in DB by ops team\nprint(rule)\norders = [{\"country\": \"IN\", \"total\": 2500, \"vip\": False},\n          {\"country\": \"US\", \"total\": 9000, \"vip\": False},\n          {\"country\": \"US\", \"total\": 10,   \"vip\": True}]\nfor o in orders:\n    print(o, \"-> free shipping:\", evaluate(rule, o))", "pythonic": "import ast, operator\n\n# Python's own parser + a whitelist evaluator: safe arithmetic without eval()\nOPS = {ast.Add: operator.add, ast.Sub: operator.sub, ast.Mult: operator.mul,\n       ast.Div: operator.truediv, ast.USub: operator.neg}\n\ndef calc(expr: str, **vars):\n    def ev(n):\n        match n:\n            case ast.Expression(body): return ev(body)\n            case ast.Constant(value=v) if isinstance(v, (int, float)): return v\n            case ast.Name(id=name) if name in vars: return vars[name]\n            case ast.BinOp(l, op, r) if type(op) in OPS: return OPS[type(op)](ev(l), ev(r))\n            case ast.UnaryOp(op, x) if type(op) in OPS: return OPS[type(op)](ev(x))\n        raise ValueError(f\"not allowed: {ast.dump(n)[:40]}\")\n    return ev(ast.parse(expr, mode=\"eval\"))\n\nprint(calc(\"price * qty * (1 - discount)\", price=499, qty=3, discount=0.1))\ntry:\n    calc(\"__import__('os').system('rm -rf /')\")\nexcept ValueError as e:\n    print(\"rejected:\", e)\nprint(ast.literal_eval(\"{'retries': 3, 'hosts': ['a', 'b']}\"))   # stdlib safe literal interpreter", "pythonic_note": "Reuse Python's parser (<code>ast.parse<\/code>) and interpret only the node types you whitelist. <code>ast.literal_eval<\/code> is the stdlib's safe interpreter for literals. Never <code>eval()<\/code> user input.", "examples": [{"where": "stdlib", "title": "<code>re<\/code>, <code>fnmatch<\/code>, <code>string.Template<\/code>", "body": "Regular expressions are a language: <code>re.compile<\/code> parses the pattern and compiles it into code for the regex engine. <code>fnmatch.translate<\/code> turns shell globs into regexes; <code>string.Template<\/code> interprets <code>$name<\/code> placeholders."}, {"where": "stdlib", "title": "<code>ast<\/code> and <code>ast.literal_eval<\/code>", "body": "<code>ast.parse<\/code> turns source into a node tree; <code>literal_eval<\/code> safely interprets only literals (numbers, strings, lists, dicts), which is why it is the safe replacement for <code>eval<\/code> on config strings."}, {"where": "framework", "title": "Jinja2, SQLAlchemy expressions, pandas <code>query()<\/code>", "body": "Jinja2 parses templates into an AST and compiles them to Python. SQLAlchemy builds expression trees (<code>User.age > 30<\/code>) that are rendered per SQL dialect. <code>df.query('price > 100 and region == \"IN\"')<\/code> interprets a filter language."}, {"where": "framework", "title": "Parser libraries: Lark, pyparsing, SymPy", "body": "Lark and pyparsing build interpreters for larger DSLs from a grammar. SymPy represents math expressions as trees (<code>Add<\/code>, <code>Mul<\/code>, <code>Symbol<\/code>) and evaluates, simplifies or differentiates them."}, {"where": "production", "title": "Rules engines for pricing, fraud and alerting", "body": "Ops or risk teams write rules like <code>amount > 50000 and country != 'IN'<\/code> in an admin UI; the service parses them into a tree once and evaluates each transaction, so rule changes need no deployment. Alert rules in monitoring tools (PromQL) are interpreted the same way."}], "use": ["A small language changes often and must be edited by non-developers", "Rules must be stored as data and evaluated safely", "The grammar is simple and stable"], "avoid": ["The grammar is large: use a parser generator (Lark) or an existing language", "Performance-critical evaluation of complex expressions: compile to Python or SQL instead"], "pitfall": "Using <code>eval()<\/code> as the interpreter. Even with <code>{'__builtins__': {}}<\/code> it can be escaped. Parse and evaluate only an explicit whitelist of node types.", "qa": [{"q": "When is the Interpreter pattern a good fit?", "a": "<p>For small DSLs such as business rules, filters, query syntax or feature-flag conditions, where the grammar is simple, rules are data, and safety matters more than raw speed.<\/p>"}, {"q": "How do you safely evaluate a user-supplied expression in Python?", "a": "<p>Parse it with <code>ast.parse(mode='eval')<\/code> and walk the tree, allowing only whitelisted nodes (constants, names from a given dict, specific operators). For literals only, use <code>ast.literal_eval<\/code>. Never use <code>eval<\/code>.<\/p>"}, {"q": "How does Interpreter relate to Composite and Visitor?", "a": "<p>The expression tree is a Composite (And/Or contain sub-expressions). Evaluation can live in each node (classic Interpreter) or in a separate Visitor / <code>match<\/code> function, which makes adding new operations (pretty-print, to-SQL) easier.<\/p>"}], "related": ["composite", "visitor", "strategy"], "code_out": "Or(left=And(left=Cmp(op='==', left=Var(name='country'), right=Lit(value='IN')), right=Cmp(op='>', left=Var(name='total'), right=Lit(value=1000.0))), right=Cmp(op='==', left=Var(name='vip'), right=Lit(value=True)))\n{'country': 'IN', 'total': 2500, 'vip': False} -> free shipping: True\n{'country': 'US', 'total': 9000, 'vip': False} -> free shipping: False\n{'country': 'US', 'total': 10, 'vip': True} -> free shipping: True", "pythonic_out": "1347.3\nrejected: not allowed: Call(func=Attribute(value=Call(func=Name\n{'retries': 3, 'hosts': ['a', 'b']}"}, {"id": "iterator", "cat": "behavioral", "name": "Iterator", "alias": "Access elements of a collection one by one without exposing how it is stored.", "simple": "A TV remote's \"next channel\" button. You don't need to know how channels are stored or numbered inside the TV; you just press next until you've seen what you want.", "intent": "<p>An iterator gives sequential access with one operation, \"give me the next item\", and hides whether items come from a list, a tree, a file, a database cursor or a paginated API. It is <b>lazy<\/b>: items are produced on demand, so you can stream data far larger than memory, or even infinite sequences.<\/p>\n<p>Iterator is built into Python: an <b>iterable<\/b> has <code>__iter__()<\/code> returning an <b>iterator<\/b>, which has <code>__next__()<\/code> and raises <code>StopIteration<\/code> at the end. <code>for<\/code> loops, comprehensions, <code>zip<\/code>, <code>sum<\/code> and unpacking all use this protocol. Generators (<code>yield<\/code>) are the easiest way to write one.<\/p>", "structure": " for order in OrdersApi(customer):     <- iterable\n     ...                                   iter() -> iterator; next() -> item\n   page 1 [o1 o2 o3] -> page 2 [o4 o5] -> StopIteration\n   (next page fetched only when the loop reaches it)", "code": "class OrdersApi:\n    \"\"\"Iterable over a paginated REST API: callers never see pages.\"\"\"\n    PAGES = {None: ([\"o1\", \"o2\", \"o3\"], \"p2\"), \"p2\": ([\"o4\", \"o5\"], \"p3\"), \"p3\": ([\"o6\"], None)}\n\n    def __init__(self, customer): self.customer = customer\n\n    def _fetch(self, cursor):\n        print(f\"  GET /customers/{self.customer}/orders?cursor={cursor}\")\n        return self.PAGES[cursor]\n\n    def __iter__(self):                          # generator = iterator for free\n        cursor = None\n        while True:\n            items, cursor = self._fetch(cursor)\n            yield from items\n            if cursor is None:\n                return\n\nclass Countdown:\n    \"\"\"The explicit protocol, without a generator.\"\"\"\n    def __init__(self, start): self.n = start\n    def __iter__(self): return self\n    def __next__(self):\n        if self.n <= 0: raise StopIteration\n        self.n -= 1\n        return self.n + 1\n\nprint(list(Countdown(3)))\n\nfrom itertools import islice\nprint(\"first 4 only:\")\nprint(list(islice(OrdersApi(\"C-9\"), 4)))         # page 3 is never requested", "pythonic": "import itertools\n\ndef read_log(lines):                             # imagine: open(\"huge.log\") -> 50 GB\n    for line in lines:\n        yield line.rstrip()\n\nlogs = (f\"2026-09-28 {'ERROR' if i % 4 == 0 else 'INFO'} request {i}\" for i in itertools.count())\nerrors = (l for l in read_log(logs) if \" ERROR \" in l)     # nothing has run yet\nfor line in itertools.islice(errors, 3):                   # pulls just enough items\n    print(line)\n\npairs = zip([\"a\", \"b\", \"c\"], itertools.count(1))\nprint(dict(pairs))\nprint(list(itertools.batched(range(7), 3)))                # Python 3.12+", "pythonic_note": "Generator expressions and <code>itertools<\/code> let you process infinite or huge streams lazily. <code>itertools.batched<\/code> (3.12+) chunks any iterator, useful for bulk database inserts.", "examples": [{"where": "stdlib", "title": "The iterator protocol and generators", "body": "Files iterate lines, dicts iterate keys, <code>range<\/code> is lazy, <code>os.scandir<\/code> yields directory entries, <code>csv.reader<\/code> yields rows. All work in <code>for<\/code> loops because they implement <code>__iter__<\/code>/<code>__next__<\/code>."}, {"where": "stdlib", "title": "<code>itertools<\/code>", "body": "<code>islice<\/code>, <code>chain<\/code>, <code>groupby<\/code>, <code>pairwise<\/code>, <code>batched<\/code>, <code>tee<\/code> and <code>count<\/code> compose iterators without building lists, the foundation of memory-efficient data processing in pure Python."}, {"where": "framework", "title": "Django <code>QuerySet.iterator(chunk_size=2000)<\/code>", "body": "Streams rows from the database cursor instead of loading every model instance into memory at once, which is essential for exports and data migrations over millions of rows."}, {"where": "framework", "title": "boto3 paginators and pandas <code>read_csv(chunksize=...)<\/code>", "body": "<code>s3.get_paginator('list_objects_v2').paginate(Bucket=b)<\/code> hides continuation tokens. <code>pd.read_csv(path, chunksize=100_000)<\/code> returns an iterator of DataFrames for files larger than RAM."}, {"where": "production", "title": "ETL jobs and log processing", "body": "Nightly jobs stream records from an API or file, transform them with generators and write in batches. Memory stays flat whether the input has ten thousand or ten billion rows."}], "use": ["Traversing a collection whose structure should stay hidden (tree, API, DB)", "Data is large, remote or infinite and should be produced lazily", "You want the same loop code to work over many sources"], "avoid": ["You need random access or <code>len()<\/code> repeatedly: materialize a list", "The same data must be iterated many times: an iterator is exhausted after one pass"], "pitfall": "Iterating an iterator twice: the second loop silently gets nothing. <code>gen = (x for x in data); sum(gen); max(gen)<\/code> fails with an empty sequence. Make the class an iterable (new iterator per <code>__iter__<\/code>) or use <code>itertools.tee<\/code>/a list.", "qa": [{"q": "Iterable vs iterator?", "a": "<p>An iterable has <code>__iter__()<\/code> and can be looped over many times (list, dict, a class like <code>OrdersApi<\/code>). An iterator has <code>__next__()<\/code>, keeps position and is consumed once; its <code>__iter__<\/code> returns itself. <code>iter(iterable)<\/code> gives a fresh iterator.<\/p>"}, {"q": "What is the advantage of generators?", "a": "<p>They produce values lazily with little memory, keep local state between <code>yield<\/code>s automatically, and make pipeline code simple. <code>yield from<\/code> delegates to a sub-iterator.<\/p>"}, {"q": "How would you process a 50 GB log file in Python?", "a": "<p>Iterate the file object line by line (it is already a lazy iterator), filter and transform with generators, aggregate incrementally (counters), and write results in batches. Never call <code>read()<\/code> or <code>readlines()<\/code> on it.<\/p>"}], "related": ["pipeline", "composite", "visitor"], "code_out": "[3, 2, 1]\nfirst 4 only:\n  GET /customers/C-9/orders?cursor=None\n  GET /customers/C-9/orders?cursor=p2\n['o1', 'o2', 'o3', 'o4']", "pythonic_out": "2026-09-28 ERROR request 0\n2026-09-28 ERROR request 4\n2026-09-28 ERROR request 8\n{'a': 1, 'b': 2, 'c': 3}\n[(0, 1, 2), (3, 4, 5), (6,)]"}, {"id": "mediator", "cat": "behavioral", "name": "Mediator", "alias": "Objects talk to a central coordinator instead of referencing each other directly.", "simple": "Planes don't radio each other to decide who lands first. They all talk to the control tower, which knows the runways and tells each plane when to land. Add a new plane and nothing changes for the others.", "intent": "<p>When many objects interact, direct references create a tangled web (N x N connections). A mediator centralizes the interaction rules: components notify the mediator about events, and the mediator decides who else needs to act. Components become reusable because they only know the mediator.<\/p>\n<p>Typical examples: a form dialog where widgets enable/disable each other, a chat room, a workflow coordinator, an air-traffic or resource scheduler. At system scale, a message broker plays the mediator role between services.<\/p>", "structure": "  Without:  A <-> B <-> C <-> D  (everyone knows everyone)\n  With:          A   B\n                  \\ /\n               [Tower]      components -> notify(event) -> mediator decides\n                  / \\\n                 C   D", "code": "class ControlTower:                              # the mediator\n    def __init__(self, runways):\n        self.free = list(runways)\n        self.waiting = []\n\n    def request_landing(self, plane):\n        if self.free:\n            runway = self.free.pop(0)\n            plane.clear_to_land(runway)\n        else:\n            self.waiting.append(plane)\n            plane.hold(len(self.waiting))\n\n    def runway_vacated(self, runway):\n        if self.waiting:\n            self.waiting.pop(0).clear_to_land(runway)\n        else:\n            self.free.append(runway)\n\nclass Plane:                                     # colleague: knows only the tower\n    def __init__(self, code, tower): self.code, self.tower = code, tower\n    def approach(self):              self.tower.request_landing(self)\n    def clear_to_land(self, rw):     print(f\"{self.code}: cleared to land on {rw}\"); self.runway = rw\n    def hold(self, pos):             print(f\"{self.code}: holding, position {pos}\")\n    def taxi_off(self):              print(f\"{self.code}: left {self.runway}\"); self.tower.runway_vacated(self.runway)\n\ntower = ControlTower([\"09L\", \"09R\"])\nplanes = [Plane(c, tower) for c in [\"AI101\", \"6E202\", \"UK303\", \"QP404\"]]\nfor p in planes: p.approach()\nplanes[0].taxi_off()\nplanes[1].taxi_off()", "pythonic": "import queue, threading\n\n# stdlib mediator between threads: producers and consumers never reference each other\njobs = queue.Queue(maxsize=3)                  # coordinates hand-off and back-pressure\ndef producer(name, n):\n    for i in range(n): jobs.put(f\"{name}-{i}\")\ndef consumer(done):\n    while (item := jobs.get()) is not None:\n        done.append(item); jobs.task_done()\n\ndone = []\nc = threading.Thread(target=consumer, args=(done,)); c.start()\nps = [threading.Thread(target=producer, args=(n, 3)) for n in (\"scanner\", \"upload\")]\nfor p in ps: p.start()\nfor p in ps: p.join()\njobs.join(); jobs.put(None); c.join()\nprint(sorted(done))", "pythonic_note": "<code>queue.Queue<\/code> mediates between threads: producers and consumers only know the queue, which also applies back-pressure when <code>maxsize<\/code> is reached.", "examples": [{"where": "stdlib", "title": "<code>queue.Queue<\/code> / <code>asyncio.Queue<\/code>", "body": "Producers and consumers never hold references to each other; the queue coordinates hand-off, blocking and back-pressure. Adding more consumers changes nothing for producers."}, {"where": "stdlib", "title": "<code>asyncio<\/code> event loop", "body": "Coroutines don't wake each other up directly. They await futures, and the event loop, as the central coordinator, watches sockets and timers and resumes the right task when its I/O is ready."}, {"where": "framework", "title": "Qt / tkinter dialogs", "body": "In a PyQt or tkinter form, the dialog class usually acts as the mediator: widgets emit signals (\"country changed\") and the dialog updates the state list, enables the submit button and validates, so widgets stay reusable."}, {"where": "framework", "title": "Workflow orchestrators: Airflow, Prefect", "body": "Tasks declare dependencies; the scheduler decides when each runs based on the others' results. Tasks never call each other, which makes them independently retryable."}, {"where": "production", "title": "Message brokers between microservices", "body": "Services publish to Kafka or RabbitMQ instead of calling each other; the broker routes messages, buffers spikes and lets new consumers join without changing producers."}], "use": ["Many objects interact in complex ways and direct references are becoming a web", "You want components reusable in other contexts", "Interaction rules should live in one place"], "avoid": ["Only two or three objects interact simply", "The mediator starts containing all business logic (a god object)"], "pitfall": "The mediator grows into a giant class that everything depends on. Split it by use case (one mediator per dialog or workflow) and keep domain logic in the components.", "qa": [{"q": "Mediator vs Observer?", "a": "<p>Observer is one-to-many broadcast: the subject doesn't know or care what observers do. Mediator encapsulates <b>how<\/b> a group of objects interact: it receives events and actively decides who does what. Mediators are often implemented using observer-style notifications.<\/p>"}, {"q": "Mediator vs Facade?", "a": "<p>A Facade simplifies access to a subsystem for outside clients; subsystem objects don't know the facade. A Mediator coordinates peers, and those peers do know and talk to the mediator.<\/p>"}, {"q": "What is the main risk of Mediator?", "a": "<p>Centralizing too much: the mediator becomes a complex, hard-to-test god object. Keep it focused on coordination.<\/p>"}], "related": ["observer", "facade", "command"], "code_out": "AI101: cleared to land on 09L\n6E202: cleared to land on 09R\nUK303: holding, position 1\nQP404: holding, position 2\nAI101: left 09L\nUK303: cleared to land on 09L\n6E202: left 09R\nQP404: cleared to land on 09R", "pythonic_out": "['scanner-0', 'scanner-1', 'scanner-2', 'upload-0', 'upload-1', 'upload-2']"}, {"id": "memento", "cat": "behavioral", "name": "Memento", "alias": "Capture an object's internal state as a snapshot so it can be restored later.", "simple": "Saving a video game before the boss fight. The save file captures everything you need, and if you lose you reload it. You never need to know how the game stores health or inventory internally.", "intent": "<p>A memento is an opaque snapshot of an object's state. The <b>originator<\/b> creates it (<code>save()<\/code>) and restores from it (<code>restore(m)<\/code>). A <b>caretaker<\/b> (undo history, checkpoint manager) stores mementos without looking inside. Encapsulation is preserved: only the originator understands the snapshot.<\/p>\n<p>Use it for undo, checkpoints, transactions and \"what-if\" experiments. Compared to Command-based undo it is simpler (just restore) but can use more memory, so store diffs or limit history for large states.<\/p>", "structure": " Originator (Editor)  --save()-->  Memento (frozen snapshot)  --> Caretaker.history [m1, m2, m3]\n Originator.restore(history.pop())   <- caretaker never reads the memento's contents", "code": "from dataclasses import dataclass\nimport copy\n\n@dataclass(frozen=True)\nclass CartMemento:                               # opaque, immutable snapshot\n    _items: tuple\n    _coupon: str | None\n\nclass ShoppingCart:                              # originator\n    def __init__(self): self.items, self.coupon = {}, None\n    def add(self, sku, qty): self.items[sku] = self.items.get(sku, 0) + qty\n    def apply_coupon(self, code): self.coupon = code\n    def save(self) -> CartMemento:\n        return CartMemento(tuple(sorted(self.items.items())), self.coupon)\n    def restore(self, m: CartMemento):\n        self.items, self.coupon = dict(m._items), m._coupon\n    def __repr__(self): return f\"Cart({self.items}, coupon={self.coupon})\"\n\nclass History:                                   # caretaker\n    def __init__(self, limit=20): self._stack, self._limit = [], limit\n    def push(self, m): self._stack = (self._stack + [m])[-self._limit:]\n    def pop(self): return self._stack.pop()\n\ncart, history = ShoppingCart(), History()\nhistory.push(cart.save()); cart.add(\"SKU-1\", 2)\nhistory.push(cart.save()); cart.add(\"SKU-2\", 1); cart.apply_coupon(\"DIWALI20\")\nprint(\"now:        \", cart)\ncart.restore(history.pop()); print(\"undo:       \", cart)\ncart.restore(history.pop()); print(\"undo again: \", cart)\n\n# \"what-if\": try a change on a snapshot, keep the original safe\ncheckpoint = cart.save()\ncart.add(\"SKU-9\", 100)\nprint(\"experiment: \", cart)\ncart.restore(checkpoint); print(\"rolled back:\", cart)", "pythonic": "import random, pickle\n\n# stdlib memento 1: the RNG's internal state (625 numbers) as an opaque object\nstate = random.getstate()\nfirst = [random.randint(1, 100) for _ in range(5)]\nrandom.setstate(state)                      # restore the snapshot\nagain = [random.randint(1, 100) for _ in range(5)]\nprint(first, first == again)\n\n# stdlib memento 2: __getstate__/__setstate__ control what a snapshot contains\nclass Session:\n    def __init__(self, user): self.user, self.cache, self.conn = user, {\"k\": 1}, object()\n    def __getstate__(self):  return {\"user\": self.user}          # snapshot omits cache + live connection\n    def __setstate__(self, s): self.__init__(s[\"user\"])          # rebuilt fresh on load\nblob = pickle.dumps(Session(\"riya\"))\nrestored = pickle.loads(blob)\nprint(restored.user, restored.cache, len(blob), \"bytes\")", "pythonic_note": "<code>random.getstate()<\/code>/<code>setstate()<\/code> is a textbook memento in the stdlib. <code>__getstate__<\/code>/<code>__setstate__<\/code> let a class decide what goes into a pickle snapshot.", "examples": [{"where": "stdlib", "title": "<code>random.getstate()<\/code> / <code>setstate()<\/code>", "body": "Returns the generator's entire internal state as an opaque object. Simulations and tests save it to replay exactly the same random sequence later."}, {"where": "stdlib", "title": "<code>pickle<\/code> with <code>__getstate__<\/code> / <code>__setstate__<\/code>", "body": "The object decides what its snapshot contains (for example dropping a socket or a cache) and how to rebuild itself. <code>copyreg<\/code> customizes this for classes you don't own."}, {"where": "framework", "title": "PyTorch <code>state_dict()<\/code> / <code>load_state_dict()<\/code>", "body": "Training checkpoints save the model's and optimizer's state dicts every epoch. After a crash, or to roll back a diverging run, you restore the last good snapshot without touching the model's code."}, {"where": "framework", "title": "Django <code>transaction.atomic()<\/code> savepoints", "body": "A nested <code>atomic()<\/code> block creates a database savepoint; if the block raises, the database rolls back to that snapshot while the outer transaction continues."}, {"where": "production", "title": "Undo history, drafts and game saves", "body": "Document editors, form wizards (\"back\" restores previous answers), configuration tools (\"revert to last applied config\") and games keep bounded histories of snapshots."}], "use": ["Undo, rollback, checkpoints or \"what-if\" experiments", "State must be restored without exposing internals to the caller"], "avoid": ["State is huge and changes often: store diffs or use Command-based undo", "State includes external effects (sent emails, charged cards) that restoring memory cannot undo"], "pitfall": "Shallow snapshots: saving <code>self.items<\/code> (the same dict) instead of a copy means later edits change the \"snapshot\" too. The example stores an immutable tuple for that reason.", "qa": [{"q": "Memento vs Command for undo?", "a": "<p>Memento stores full state snapshots: simple and reliable, but memory-heavy. Command stores the operation and its inverse: memory-light, but every command needs a correct <code>undo()<\/code>. They are often combined: a command keeps a memento of the part it changes.<\/p>"}, {"q": "How does Memento preserve encapsulation?", "a": "<p>The caretaker stores the memento but never reads or modifies it; only the originator knows its structure. In Python this is by convention (underscore fields, frozen dataclass) rather than enforced.<\/p>"}, {"q": "How would you implement checkpointing for a long-running job?", "a": "<p>Periodically serialize the essential state (position in input, partial aggregates, RNG state, model weights) atomically to durable storage (write temp file, then rename). On start, load the latest checkpoint if present and resume from there.<\/p>"}], "related": ["command", "prototype", "state"], "code_out": "now:         Cart({'SKU-1': 2, 'SKU-2': 1}, coupon=DIWALI20)\nundo:        Cart({'SKU-1': 2}, coupon=None)\nundo again:  Cart({}, coupon=None)\nexperiment:  Cart({'SKU-9': 100}, coupon=None)\nrolled back: Cart({}, coupon=None)", "pythonic_out": "[42, 6, 8, 100, 29] True\nriya {'k': 1} 56 bytes"}, {"id": "observer", "cat": "behavioral", "name": "Observer (Publish / Subscribe)", "alias": "When one object changes, every subscribed listener is notified automatically.", "simple": "You subscribe to a YouTube channel. When a new video is uploaded, every subscriber gets a notification. The creator doesn't phone each person, and you can unsubscribe any time.", "intent": "<p>A <b>subject<\/b> keeps a list of <b>observers<\/b> (callbacks) and notifies them when something happens. The subject doesn't know what observers do, so you can add features (send email, update search index, write audit log) without changing the code that raised the event.<\/p>\n<p>In Python an observer is usually just a callable. Two practical concerns matter in real code: <b>memory leaks<\/b> (the subject's list keeps observers alive, so long-lived subjects often hold weak references) and <b>error isolation<\/b> (one failing observer shouldn't stop the others).<\/p>", "structure": " Order.mark_paid()  --emit(\"order_paid\", order)-->  EventBus\n                                                    |-> send_receipt(order)\n                                                    |-> update_inventory(order)\n                                                    '-> analytics.track(order)", "code": "from collections import defaultdict\nimport weakref\n\nclass EventBus:\n    def __init__(self):\n        self._subs = defaultdict(list)\n\n    def subscribe(self, event, fn):\n        # bound methods are stored weakly so a dead object doesn't leak\n        ref = weakref.WeakMethod(fn) if hasattr(fn, \"__self__\") else (lambda f=fn: f)\n        self._subs[event].append(ref)\n        return lambda: self._subs[event].remove(ref)          # unsubscribe handle\n\n    def emit(self, event, **payload):\n        for ref in list(self._subs[event]):\n            fn = ref()\n            if fn is None:                                     # observer was garbage-collected\n                self._subs[event].remove(ref); continue\n            try:\n                fn(**payload)\n            except Exception as e:                             # isolate failures\n                print(f\"  observer {fn.__name__} failed: {e}\")\n\nbus = EventBus()\n\ndef send_receipt(order_id, total): print(f\"  email receipt for {order_id} ({total})\")\ndef fraud_check(order_id, total):\n    if total > 50_000: raise RuntimeError(\"manual review needed\")\n\nclass Analytics:\n    def track(self, order_id, total): print(f\"  analytics: +{total} revenue\")\n\nbus.subscribe(\"order_paid\", send_receipt)\nbus.subscribe(\"order_paid\", fraud_check)\na = Analytics()\nstop_analytics = bus.subscribe(\"order_paid\", a.track)\n\nprint(\"order O-1 paid\"); bus.emit(\"order_paid\", order_id=\"O-1\", total=1200)\nprint(\"order O-2 paid\"); bus.emit(\"order_paid\", order_id=\"O-2\", total=75_000)\ndel a                                                          # analytics object goes away\nprint(\"order O-3 paid\"); bus.emit(\"order_paid\", order_id=\"O-3\", total=300)", "pythonic": "import asyncio\n\n# stdlib observer 1: asyncio futures notify callbacks when done\nasync def main():\n    loop = asyncio.get_running_loop()\n    fut = loop.create_future()\n    fut.add_done_callback(lambda f: print(\"callback A got\", f.result()))\n    fut.add_done_callback(lambda f: print(\"callback B got\", f.result()))\n    loop.call_later(0.01, fut.set_result, \"payment confirmed\")\n    await fut\nasyncio.run(main())\n\n# stdlib observer 2: a property that notifies listeners on change\nclass Thermostat:\n    def __init__(self): self._t, self.listeners = 21.0, []\n    @property\n    def temp(self): return self._t\n    @temp.setter\n    def temp(self, v):\n        old, self._t = self._t, v\n        for fn in self.listeners: fn(old, v)\nt = Thermostat()\nt.listeners.append(lambda old, new: print(f\"temp {old} -> {new}\"))\nt.temp = 24.5", "pythonic_note": "Callbacks are just callables in a list. The stdlib uses this in <code>asyncio.Future.add_done_callback<\/code>, <code>tkinter.Variable.trace_add<\/code> and <code>atexit.register<\/code>.", "examples": [{"where": "stdlib", "title": "<code>asyncio.Future.add_done_callback<\/code>, <code>atexit.register<\/code>", "body": "Futures notify every registered callback when their result arrives. <code>atexit.register(fn)<\/code> subscribes functions to the interpreter-exit event."}, {"where": "stdlib", "title": "<code>tkinter<\/code> variable traces", "body": "<code>StringVar.trace_add('write', callback)<\/code> calls every observer when the value changes, so labels and buttons can react to an entry field without polling."}, {"where": "framework", "title": "Django signals (<code>post_save<\/code>, <code>pre_delete<\/code>, <code>request_finished<\/code>)", "body": "<code>@receiver(post_save, sender=Order)<\/code> runs your function after any <code>Order.save()<\/code>, for cache invalidation, search indexing or audit logs, without editing the model. Receivers are held weakly by default."}, {"where": "framework", "title": "Blinker (Flask signals), Qt signals/slots, watchdog", "body": "Flask emits <code>request_started<\/code> and <code>template_rendered<\/code> through Blinker. PyQt/PySide connect widget signals to slots. <code>watchdog<\/code>'s <code>Observer<\/code> notifies handlers when files change."}, {"where": "production", "title": "Domain events, webhooks and pub/sub", "body": "\"OrderPaid\" is published once; receipt, loyalty points, analytics and warehouse services each subscribe. Across processes the same idea uses Redis pub/sub, Kafka topics or webhooks (GitHub, Stripe)."}], "use": ["Several parts of the system must react to a change, and the list will grow", "The source of the event shouldn't depend on the reactors", "UI updates, cache invalidation, audit trails, integrations"], "avoid": ["Order of reactions matters or reactions must be one transaction: call them explicitly", "Chains of events triggering events become impossible to follow (\"event spaghetti\")"], "pitfall": "Memory leaks from strong references: a long-lived subject keeps every subscribed object alive forever. Unsubscribe explicitly, or store <code>weakref.WeakMethod<\/code> / use libraries that hold weak references (Django signals do by default).", "qa": [{"q": "How would you implement Observer in Python?", "a": "<p>Keep a list (or dict of lists per event) of callables; <code>subscribe<\/code> appends and returns an unsubscribe function; <code>emit<\/code> calls each one, catching exceptions so one bad observer doesn't break the rest. Use weak references for bound methods if subjects live long.<\/p>"}, {"q": "Observer vs Pub/Sub?", "a": "<p>In classic Observer, observers register directly with the subject. In Pub/Sub, a broker (event bus, Kafka) sits in between, so publishers and subscribers don't know each other, and delivery can be asynchronous and cross-process.<\/p>"}, {"q": "What are the risks of Django signals?", "a": "<p>Hidden control flow (a <code>save()<\/code> triggers code in other apps), no transaction awareness by default (use <code>transaction.on_commit<\/code> for side effects like emails), and <code>bulk_create<\/code>/<code>update()<\/code> skip them. Many teams prefer explicit service-layer calls for core logic.<\/p>"}], "related": ["mediator", "chain-of-responsibility", "command"], "code_out": "order O-1 paid\n  email receipt for O-1 (1200)\n  analytics: +1200 revenue\norder O-2 paid\n  email receipt for O-2 (75000)\n  observer fraud_check failed: manual review needed\n  analytics: +75000 revenue\norder O-3 paid\n  email receipt for O-3 (300)", "pythonic_out": "callback A got payment confirmed\ncallback B got payment confirmed\ntemp 21.0 -> 24.5"}, {"id": "state", "cat": "behavioral", "name": "State", "alias": "An object changes its behaviour when its internal state changes, via one class per state.", "simple": "A traffic light: the same \"next\" button makes it go green to yellow, yellow to red, red to green. What \"next\" does depends on the current colour. Each colour knows only its own rule.", "intent": "<p>When a method is full of <code>if self.status == ...<\/code> checks, and the same checks repeat in every method, move each state's behaviour into its own class. The context object delegates to its current state object, and states decide the transitions. Invalid actions in a state become explicit errors instead of silent bugs.<\/p>\n<p>This is a <b>finite state machine<\/b>. For simple cases, a transition table (dict of allowed moves) is enough; the State pattern shines when each state has substantial behaviour.<\/p>", "structure": " Order.pay() --> self.state.pay(order)\n   Pending --pay--> Paid --ship--> Shipped --deliver--> Delivered\n      '--cancel--> Cancelled <--cancel-- Paid (refund)\n   Shipped.cancel() -> error: already shipped", "code": "class OrderState:\n    name = \"?\"\n    def pay(self, order):     raise ValueError(f\"cannot pay when {self.name}\")\n    def ship(self, order):    raise ValueError(f\"cannot ship when {self.name}\")\n    def deliver(self, order): raise ValueError(f\"cannot deliver when {self.name}\")\n    def cancel(self, order):  raise ValueError(f\"cannot cancel when {self.name}\")\n\nclass Pending(OrderState):\n    name = \"PENDING\"\n    def pay(self, order):    order.log(\"payment captured\"); order.state = Paid()\n    def cancel(self, order): order.log(\"cancelled, nothing to refund\"); order.state = Cancelled()\n\nclass Paid(OrderState):\n    name = \"PAID\"\n    def ship(self, order):   order.log(\"handed to courier\"); order.state = Shipped()\n    def cancel(self, order): order.log(\"refund issued\"); order.state = Cancelled()\n\nclass Shipped(OrderState):\n    name = \"SHIPPED\"\n    def deliver(self, order): order.log(\"delivered, ask for review\"); order.state = Delivered()\n\nclass Delivered(OrderState): name = \"DELIVERED\"\nclass Cancelled(OrderState): name = \"CANCELLED\"\n\nclass Order:                                   # context\n    def __init__(self, oid): self.oid, self.state = oid, Pending()\n    def log(self, msg): print(f\"  {self.oid} [{self.state.name}] {msg}\")\n    def __getattr__(self, action):             # delegate pay/ship/... to the state\n        return lambda: getattr(self.state, action)(self)\n\no = Order(\"O-17\")\nfor action in [\"pay\", \"ship\", \"cancel\", \"deliver\", \"pay\"]:\n    try:\n        getattr(o, action)()\n    except ValueError as e:\n        print(f\"  {o.oid} rejected {action}: {e}\")\nprint(\"final state:\", o.state.name)", "pythonic": "from enum import Enum\n\nclass Status(Enum):\n    PENDING = \"pending\"; PAID = \"paid\"; SHIPPED = \"shipped\"; CANCELLED = \"cancelled\"\n\n# for simple lifecycles, a transition table is clearer than classes\nTRANSITIONS = {\n    (Status.PENDING, \"pay\"): Status.PAID,\n    (Status.PENDING, \"cancel\"): Status.CANCELLED,\n    (Status.PAID, \"ship\"): Status.SHIPPED,\n    (Status.PAID, \"cancel\"): Status.CANCELLED,\n}\n\ndef apply(status, event):\n    try:\n        return TRANSITIONS[(status, event)]\n    except KeyError:\n        raise ValueError(f\"{event!r} not allowed in {status.name}\") from None\n\ns = Status.PENDING\nfor ev in [\"pay\", \"ship\"]:\n    s = apply(s, ev); print(ev, \"->\", s.name)\ntry:\n    apply(s, \"cancel\")\nexcept ValueError as e:\n    print(e)", "pythonic_note": "An <code>Enum<\/code> plus a transition dict covers
