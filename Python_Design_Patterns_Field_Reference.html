most business workflows. Switch to state classes when each state carries real behaviour.", "examples": [{"where": "stdlib", "title": "<code>asyncio.Future<\/code> / <code>Task<\/code> states", "body": "A future is PENDING, then either FINISHED or CANCELLED. <code>set_result()<\/code> on a finished future raises <code>InvalidStateError<\/code>, the state machine rejecting an illegal transition."}, {"where": "stdlib", "title": "<code>http.client.HTTPConnection<\/code>", "body": "Internally tracks idle, request-started and request-sent states; calling <code>putheader()<\/code> or <code>getresponse()<\/code> in the wrong state raises <code>CannotSendHeader<\/code> / <code>ResponseNotReady<\/code>."}, {"where": "framework", "title": "django-fsm, transitions, python-statemachine", "body": "Libraries that declare states and allowed transitions on models: <code>@transition(field=state, source='paid', target='shipped')<\/code> guards methods so a shipped order can't be paid twice, and can emit signals on each transition."}, {"where": "framework", "title": "TCP-like protocol handlers in asyncio / Twisted", "body": "Protocol implementations (SMTP, FTP, custom device protocols) move through states such as connected, authenticated and in-transfer, accepting different commands in each."}, {"where": "production", "title": "Order, payment, KYC and device lifecycles", "body": "E-commerce orders, loan applications, support tickets and hardware test rigs (idle, powering-on, running-workload, collecting-logs, failed) are modelled as state machines, often persisted as a status column with guarded transitions."}], "use": ["Behaviour depends heavily on a status field and <code>if/elif<\/code> on it repeats across methods", "Illegal transitions must be rejected reliably", "Workflows with clear lifecycles"], "avoid": ["Two or three states with trivial behaviour: an enum and a dict are enough", "Transitions depend on many external factors that don't belong to states"], "pitfall": "Updating the status without checking the transition (<code>order.status = 'shipped'<\/code> anywhere in the code). Route every change through one guarded method, and in databases use conditional updates (<code>UPDATE ... WHERE status='paid'<\/code>) to avoid race conditions.", "qa": [{"q": "State vs Strategy?", "a": "<p>Same structure (context delegates to an object), different intent. Strategy is chosen by the client and rarely changes; State objects change themselves as the context moves through its lifecycle, and each state knows its successors.<\/p>"}, {"q": "How do you model an order lifecycle in a web app?", "a": "<p>An enum status column, a transition table or state classes enforcing allowed moves, one service method per event (<code>pay<\/code>, <code>ship<\/code>), atomic conditional DB updates to prevent double transitions, and an event emitted on each transition for other parts of the system.<\/p>"}, {"q": "Where does the transition logic live?", "a": "<p>Either inside states (each state sets the next: flexible, decentralized) or in a central table (easy to see and validate the whole machine). Tables are easier to review; state classes are better when states have rich behaviour.<\/p>"}], "related": ["strategy", "memento", "command"], "code_out": "  O-17 [PENDING] payment captured\n  O-17 [PAID] handed to courier\n  O-17 rejected cancel: cannot cancel when SHIPPED\n  O-17 [SHIPPED] delivered, ask for review\n  O-17 rejected pay: cannot pay when DELIVERED\nfinal state: DELIVERED", "pythonic_out": "pay -> PAID\nship -> SHIPPED\n'cancel' not allowed in SHIPPED"}, {"id": "strategy", "cat": "behavioral", "name": "Strategy", "alias": "Define a family of interchangeable algorithms and pick one at runtime.", "simple": "Going to the airport: car, metro or cab. The goal is the same; you pick the strategy based on traffic, budget and luggage, and you can switch tomorrow without changing where you're going.", "intent": "<p>Put each variant of an algorithm behind the same interface and let the caller (or config) choose. The code that uses the algorithm stays the same, and adding a new variant means adding one function or class, not editing a growing <code>if/elif<\/code> chain.<\/p>\n<p>In Python, the simplest strategy is <b>a function<\/b> passed as an argument: <code>sorted(key=...)<\/code> is Strategy. Use classes when a strategy has configuration or several related methods, and a <code>typing.Protocol<\/code> to describe the interface.<\/p>", "structure": " Checkout(shipping=ExpressShipping())  ->  shipping.cost(order)\n                  StandardShipping | ExpressShipping | FreeOver(999) | a plain function\n all share:  cost(order) -> float", "code": "from dataclasses import dataclass\nfrom typing import Protocol\n\n@dataclass\nclass Order:\n    total: float\n    weight_kg: float\n    pincode: str\n\nclass ShippingStrategy(Protocol):\n    def cost(self, order: Order) -> float: ...\n\nclass Standard:\n    def cost(self, o): return 40 + 10 * o.weight_kg\n\nclass Express:\n    def __init__(self, surcharge=99): self.surcharge = surcharge\n    def cost(self, o): return Standard().cost(o) * 2 + self.surcharge\n\nclass FreeOver:\n    def __init__(self, threshold, fallback): self.threshold, self.fallback = threshold, fallback\n    def cost(self, o): return 0.0 if o.total >= self.threshold else self.fallback.cost(o)\n\ndef metro_flat(o): return 25.0               # a plain function works too\n\nclass FunctionStrategy:                       # adapt a function to the interface\n    def __init__(self, fn): self.fn = fn\n    def cost(self, o): return self.fn(o)\n\ndef checkout(order: Order, shipping: ShippingStrategy):\n    return round(order.total + shipping.cost(order), 2)\n\norder = Order(total=850, weight_kg=2.5, pincode=\"560001\")\nfor name, s in {\"standard\": Standard(), \"express\": Express(),\n                \"free over 999\": FreeOver(999, Standard()),\n                \"free over 500\": FreeOver(500, Standard()),\n                \"metro flat\": FunctionStrategy(metro_flat)}.items():\n    print(f\"{name:14} -> pay {checkout(order, s)}\")", "pythonic": "import hashlib, json\nfrom datetime import date\nfrom decimal import Decimal\n\npeople = [(\"Riya\", 31), (\"Arjun\", 25), (\"Meera\", 42)]\nprint(sorted(people, key=lambda p: p[1]))            # strategy = the key function\nprint(max(people, key=lambda p: len(p[0])))\n\ndef encode_extra(o):                                 # strategy for unknown types\n    if isinstance(o, (date, Decimal)): return str(o)\n    raise TypeError(type(o))\nprint(json.dumps({\"on\": date(2026, 9, 28), \"amt\": Decimal(\"9.99\")}, default=encode_extra))\n\nfor algo in (\"md5\", \"sha256\"):                       # algorithm chosen by name\n    print(algo, hashlib.new(algo, b\"invoice-42\").hexdigest()[:16])", "pythonic_note": "Passing a function is the Strategy pattern. <code>key=<\/code>, <code>default=<\/code> and <code>hashlib.new(name)<\/code> are all strategies in the stdlib.", "examples": [{"where": "stdlib", "title": "<code>sorted(key=)<\/code>, <code>min/max(key=)<\/code>, <code>json.dumps(default=, cls=)<\/code>", "body": "The sorting algorithm is fixed; the comparison strategy is a function you pass. <code>json<\/code> lets you plug in how unknown types are encoded."}, {"where": "stdlib", "title": "<code>hashlib.new(name)<\/code>, <code>shutil.make_archive(format=)<\/code>, <code>zipfile.ZipFile(compression=)<\/code>", "body": "Choose the hashing, archive or compression algorithm by parameter. The calling code is identical for SHA-256 or BLAKE2, zip or gztar, ZIP_DEFLATED or ZIP_LZMA."}, {"where": "framework", "title": "scikit-learn estimators and PyTorch optimizers", "body": "Any estimator with <code>fit<\/code>/<code>predict<\/code> plugs into <code>Pipeline<\/code>, <code>cross_val_score<\/code> or <code>GridSearchCV<\/code>; switching <code>LogisticRegression<\/code> for <code>RandomForestClassifier<\/code> is one line. PyTorch training loops swap <code>SGD<\/code> for <code>AdamW<\/code> the same way."}, {"where": "framework", "title": "requests <code>auth=<\/code>, Django <code>PASSWORD_HASHERS<\/code>", "body": "<code>requests.get(url, auth=HTTPBasicAuth(u, p))<\/code> or a custom <code>AuthBase<\/code> subclass plugs in how requests are signed. Django hashes passwords with the first strategy in <code>PASSWORD_HASHERS<\/code> (PBKDF2, Argon2, bcrypt) and can verify older ones."}, {"where": "production", "title": "Pricing, discounts, shipping and payment selection", "body": "E-commerce platforms choose a discount strategy per campaign, a shipping calculator per courier, and a payment provider per country, often configured from the database so business teams can switch without a deploy."}], "use": ["Several variants of an algorithm exist and are chosen at runtime or by config", "You want to remove <code>if/elif<\/code> branching on a \"type\" or \"mode\" parameter", "Variants should be testable in isolation"], "avoid": ["There is one algorithm and no realistic second one", "Variants differ by a constant: pass the value, not a strategy"], "pitfall": "Strategies that need different inputs. If <code>Express<\/code> needs the pincode and <code>Standard<\/code> doesn't, pass the whole context object (the order) rather than growing a list of optional parameters.", "qa": [{"q": "How is Strategy implemented idiomatically in Python?", "a": "<p>Pass a function (or any callable) as a parameter, or look it up in a dict by name. Use classes (with a <code>Protocol<\/code> interface) when strategies need configuration or several methods.<\/p>"}, {"q": "Strategy vs Template Method?", "a": "<p>Strategy uses <b>composition<\/b>: the whole algorithm is swapped by passing a different object. Template Method uses <b>inheritance<\/b>: the skeleton is fixed in a base class and subclasses override steps. Strategy is more flexible at runtime.<\/p>"}, {"q": "How does Strategy support the Open/Closed Principle?", "a": "<p>New behaviour is added by writing a new strategy, without modifying the code that uses strategies. The context is closed for modification but open for extension.<\/p>"}], "related": ["state", "template-method", "command", "bridge"], "code_out": "standard       -> pay 915.0\nexpress        -> pay 1079.0\nfree over 999  -> pay 915.0\nfree over 500  -> pay 850.0\nmetro flat     -> pay 875.0", "pythonic_out": "[('Arjun', 25), ('Riya', 31), ('Meera', 42)]\n('Arjun', 25)\n{\"on\": \"2026-09-28\", \"amt\": \"9.99\"}\nmd5 2001ef6785ad0d17\nsha256 3c304bc21c841476"}, {"id": "template-method", "cat": "behavioral", "name": "Template Method", "alias": "A base class fixes the steps of an algorithm; subclasses fill in specific steps.", "simple": "Every tea and coffee recipe follows the same routine: boil water, brew, pour into cup, add extras. Tea brews leaves and adds lemon; coffee brews grounds and adds milk. The routine is fixed; only two steps differ.", "intent": "<p>The base class has a non-overridden method (the template) that calls steps in a fixed order. Some steps are abstract (subclasses must implement them), some have defaults (hooks subclasses may override). This guarantees the invariant parts (validation, logging, transactions, cleanup) always run, while letting subclasses customize the rest.<\/p>\n<p>Frameworks are built on it: you subclass and override <code>handle()<\/code>, <code>setUp()<\/code>, <code>get_queryset()<\/code>, and the framework calls them at the right time (\"don't call us, we'll call you\", the Hollywood principle).<\/p>", "structure": " Importer.run(path)            # template: fixed order, not overridden\n   rows = self.read(path)      # abstract: CsvImporter / JsonImporter\n   rows = self.validate(rows)  # hook with default\n   rows = self.transform(rows) # hook with default (no-op)\n   self.save(rows)             # shared implementation\n   self.report()", "code": "import csv, io, json\nfrom abc import ABC, abstractmethod\n\nclass Importer(ABC):\n    def run(self, source):                       # the template method\n        rows = self.read(source)\n        good = [r for r in rows if self.is_valid(r)]\n        good = [self.transform(r) for r in good]\n        self.save(good)\n        print(f\"  {type(self).__name__}: {len(good)}/{len(rows)} rows imported\")\n\n    @abstractmethod\n    def read(self, source) -> list[dict]: ...    # required step\n\n    def is_valid(self, row):                     # hook with a sensible default\n        return bool(row.get(\"email\"))\n\n    def transform(self, row):                    # hook: no-op by default\n        return row\n\n    def save(self, rows):                        # shared, invariant step\n        for r in rows: print(\"    INSERT\", r)\n\nclass CsvImporter(Importer):\n    def read(self, source): return list(csv.DictReader(io.StringIO(source)))\n    def transform(self, row): return {**row, \"email\": row[\"email\"].lower()}\n\nclass JsonImporter(Importer):\n    def read(self, source): return json.loads(source)\n    def is_valid(self, row): return super().is_valid(row) and row.get(\"age\", 0) >= 18\n\nCsvImporter().run(\"name,email\\nRiya,RIYA@X.COM\\nNo Email,\\n\")\nJsonImporter().run('[{\"name\":\"Arjun\",\"email\":\"a@x.com\",\"age\":17},{\"name\":\"Meera\",\"email\":\"m@x.com\",\"age\":30}]')\n\ntry:\n    Importer()\nexcept TypeError as e:\n    print(\"ABC guard:\", e)", "pythonic": "from collections.abc import Mapping\n\nclass EnvConfig(Mapping):\n    \"\"\"Implement 3 abstract methods; Mapping's template methods give you the rest.\"\"\"\n    def __init__(self, raw): self._d = {k.lower(): v for k, v in raw.items()}\n    def __getitem__(self, key): return self._d[key.lower()]\n    def __iter__(self): return iter(self._d)\n    def __len__(self): return len(self._d)\n\ncfg = EnvConfig({\"DB_URL\": \"postgres://db\", \"DEBUG\": \"0\"})\nprint(cfg.get(\"db_url\"), \"db_url\" in cfg, list(cfg.keys()), dict(cfg.items()))   # all inherited\nprint(cfg == {\"db_url\": \"postgres://db\", \"debug\": \"0\"})", "pythonic_note": "<code>collections.abc<\/code> is Template Method at its best: implement <code>__getitem__<\/code>, <code>__iter__<\/code> and <code>__len__<\/code>, and <code>Mapping<\/code> supplies <code>get<\/code>, <code>keys<\/code>, <code>items<\/code>, <code>__contains__<\/code> and <code>__eq__<\/code> built on top of them.", "examples": [{"where": "stdlib", "title": "<code>socketserver.BaseRequestHandler<\/code>", "body": "The server calls <code>setup()<\/code>, <code>handle()<\/code>, <code>finish()<\/code> in order for each connection; you override <code>handle()<\/code> only. <code>http.server.BaseHTTPRequestHandler<\/code> goes further, dispatching to your <code>do_GET<\/code>/<code>do_POST<\/code>."}, {"where": "stdlib", "title": "<code>unittest.TestCase<\/code>, <code>threading.Thread.run<\/code>, <code>html.parser.HTMLParser<\/code>", "body": "The test runner calls <code>setUp<\/code>, the test, <code>tearDown<\/code>; <code>Thread.start()<\/code> calls your <code>run()<\/code>; <code>HTMLParser.feed()<\/code> calls your <code>handle_starttag<\/code>/<code>handle_data<\/code> hooks."}, {"where": "stdlib", "title": "<code>collections.abc<\/code> mixin methods", "body": "<code>Mapping<\/code>, <code>Sequence<\/code>, <code>MutableSet<\/code> and friends define concrete methods in terms of a few abstract ones, and refuse instantiation until those are provided."}, {"where": "framework", "title": "Django class-based views", "body": "<code>View.dispatch()<\/code> routes to <code>get()<\/code>/<code>post()<\/code>; <code>ListView<\/code> calls <code>get_queryset()<\/code>, <code>get_context_data()<\/code> and <code>get_template_names()<\/code>, each overridable. You customize a list page by overriding one hook."}, {"where": "production", "title": "ETL jobs, report generators, device test sequences", "body": "A base job class fixes extract, validate, transform, load, notify, with retries and metrics in the template; each data source only implements <code>extract()<\/code>. Hardware test frameworks fix power-on, configure, run, collect logs, power-off."}], "use": ["Several classes share the same algorithm structure with small differences", "Invariant steps (validation, logging, cleanup) must always run in order", "Building a framework or base class others extend"], "avoid": ["Variation is better passed as a function (Strategy): it avoids inheritance", "Deep hierarchies where subclasses override hooks of hooks"], "pitfall": "Subclasses overriding the template method itself, or forgetting <code>super()<\/code> in a hook with a default. Keep the template non-overridden by convention (and document it), and use <code>@abstractmethod<\/code> for required steps.", "qa": [{"q": "What is the Hollywood principle?", "a": "<p>\"Don't call us, we'll call you.\" The base class or framework controls the flow and calls your overridden methods at the right time. Template Method is its classic implementation.<\/p>"}, {"q": "What is a hook method?", "a": "<p>A step in the template with a default implementation (often empty) that subclasses may override to customize behaviour, unlike abstract steps which they must implement.<\/p>"}, {"q": "How do ABCs help?", "a": "<p><code>abc.ABC<\/code> with <code>@abstractmethod<\/code> prevents instantiating a subclass that hasn't implemented required steps, so a missing step fails at construction time instead of mid-run.<\/p>"}], "related": ["strategy", "factory-method", "mixin"], "code_out": "    INSERT {'name': 'Riya', 'email': 'riya@x.com'}\n  CsvImporter: 1/2 rows imported\n    INSERT {'name': 'Meera', 'email': 'm@x.com', 'age': 30}\n  JsonImporter: 1/2 rows imported\nABC guard: Can't instantiate abstract class Importer without an implementation for abstract method 'read'", "pythonic_out": "postgres://db True ['db_url', 'debug'] {'db_url': 'postgres://db', 'debug': '0'}\nTrue"}, {"id": "visitor", "cat": "behavioral", "name": "Visitor", "alias": "Add new operations over a set of classes without changing those classes.", "simple": "A tax inspector visits a factory, a shop and a farm. Each business opens its doors, and the inspector applies the right rules for each type. Next month a health inspector visits the same places with different rules, and the businesses didn't change at all.", "intent": "<p>You have a stable set of node types (AST nodes, shapes, document elements) but keep adding operations (evaluate, pretty-print, export, lint). Instead of adding a method to every class for every operation, put each operation in a visitor class with one method per node type.<\/p>\n<p>Classic Visitor uses <b>double dispatch<\/b>: <code>node.accept(visitor)<\/code> calls <code>visitor.visit_Circle(self)<\/code>. Python usually skips <code>accept<\/code>: <code>ast.NodeVisitor<\/code> dispatches by the class name (<code>visit_<\/code> + name), and <code>functools.singledispatch<\/code> dispatches on the argument's type.<\/p>", "structure": " elements: Heading, Paragraph, Image, Table      (stable)\n visitors: HtmlExporter, WordCounter, Linter        (keep growing)\n visitor.visit(node) -> getattr(self, \"visit_\" + type(node).__name__)(node)", "code": "from dataclasses import dataclass\n\n@dataclass\nclass Heading:   text: str; level: int\n@dataclass\nclass Paragraph: text: str\n@dataclass\nclass Image:     src: str; alt: str\n\nclass Visitor:\n    def visit(self, node):                       # dispatch by class name (like ast.NodeVisitor)\n        method = getattr(self, \"visit_\" + type(node).__name__, self.generic_visit)\n        return method(node)\n    def generic_visit(self, node):\n        raise NotImplementedError(type(node).__name__)\n\nclass HtmlExporter(Visitor):\n    def visit_Heading(self, n):   return f\"<h{n.level}>{n.text}<\/h{n.level}>\"\n    def visit_Paragraph(self, n): return f\"<p>{n.text}<\/p>\"\n    def visit_Image(self, n):     return f'<img src=\"{n.src}\" alt=\"{n.alt}\">'\n\nclass WordCounter(Visitor):\n    def visit_Heading(self, n):   return len(n.text.split())\n    def visit_Paragraph(self, n): return len(n.text.split())\n    def visit_Image(self, n):     return 0\n\nclass AccessibilityLinter(Visitor):             # a NEW operation, zero changes to nodes\n    def visit_Heading(self, n):   return None\n    def visit_Paragraph(self, n): return None\n    def visit_Image(self, n):     return None if n.alt else f\"image {n.src} has no alt text\"\n\ndoc = [Heading(\"Q3 Report\", 1), Paragraph(\"Revenue grew 18 percent.\"),\n       Image(\"chart.png\", \"\"), Paragraph(\"Churn fell to 2 percent.\")]\n\nprint(\"\\n\".join(HtmlExporter().visit(n) for n in doc))\nprint(\"words:\", sum(WordCounter().visit(n) for n in doc))\nprint(\"lint:\", [msg for n in doc if (msg := AccessibilityLinter().visit(n))])", "pythonic": "import ast\nfrom functools import singledispatch\n\n# stdlib Visitor 1: a tiny security linter over Python's own AST\nSOURCE = \"\"\"\nimport os, subprocess\ndef run(cmd, data):\n    result = eval(data)\n    subprocess.call(cmd, shell=True)\n    return os.system(\"ls\")\n\"\"\"\nclass DangerFinder(ast.NodeVisitor):\n    def visit_Call(self, node):\n        name = ast.unparse(node.func)\n        if name in {\"eval\", \"exec\", \"os.system\"}:\n            print(f\"line {node.lineno}: call to {name}\")\n        if any(k.arg == \"shell\" and getattr(k.value, \"value\", False) for k in node.keywords):\n            print(f\"line {node.lineno}: {name} with shell=True\")\n        self.generic_visit(node)                 # keep walking into children\nDangerFinder().visit(ast.parse(SOURCE))\n\n# stdlib Visitor 2: singledispatch picks the implementation by argument type\n@singledispatch\ndef to_json(obj): raise TypeError(type(obj))\n@to_json.register\ndef _(obj: int): return str(obj)\n@to_json.register\ndef _(obj: list): return \"[\" + \",\".join(to_json(x) for x in obj) + \"]\"\n@to_json.register\ndef _(obj: str): return '\"' + obj + '\"'\nprint(to_json([1, \"a\", [2, 3]]))", "pythonic_note": "<code>ast.NodeVisitor<\/code> is how real linters work, and <code>functools.singledispatch<\/code> gives you type-based dispatch without an <code>accept()<\/code> method on every class.", "examples": [{"where": "stdlib", "title": "<code>ast.NodeVisitor<\/code> / <code>ast.NodeTransformer<\/code>", "body": "Subclass and define <code>visit_FunctionDef<\/code>, <code>visit_Call<\/code> and so on; <code>generic_visit<\/code> walks children. <code>NodeTransformer<\/code> returns replacement nodes to rewrite code."}, {"where": "stdlib", "title": "<code>functools.singledispatch<\/code> / <code>singledispatchmethod<\/code>", "body": "Register one implementation per type for a generic function; <code>singledispatchmethod<\/code> does the same for methods. It is the Pythonic Visitor when you can't add methods to the classes, such as <code>int<\/code>, <code>datetime<\/code> or a third-party type."}, {"where": "framework", "title": "pylint, flake8 plugins, Bandit, LibCST", "body": "pylint checkers define <code>visit_call<\/code>, <code>visit_functiondef<\/code> over the astroid tree. Bandit's security checks run over the AST with a node visitor. LibCST offers <code>CSTVisitor<\/code>/<code>CSTTransformer<\/code> for codemods that keep formatting."}, {"where": "framework", "title": "docutils / Sphinx translators", "body": "Sphinx builds a document tree once; HTML, LaTeX, man-page and text writers are visitors with <code>visit_paragraph<\/code>/<code>depart_paragraph<\/code> methods for every node type."}, {"where": "production", "title": "Compilers, query planners, document exporters", "body": "A document model exported to PDF, DOCX and HTML; a query AST that is type-checked, optimized and turned into SQL in separate passes; a config tree validated and then rendered. Each pass is a visitor."}], "use": ["The set of node types is stable but operations keep being added", "Operations need type-specific logic across a tree (Composite)", "You want each operation's code in one place"], "avoid": ["New node types are added often: every visitor must then be updated", "Only one or two operations: a method on each class is simpler"], "pitfall": "Forgetting <code>self.generic_visit(node)<\/code> inside an <code>ast.NodeVisitor<\/code> method: the visitor then stops descending, silently missing nested calls (for example an <code>eval<\/code> inside a function inside a class).", "qa": [{"q": "What is double dispatch?", "a": "<p>Choosing the method based on the runtime types of two objects: the element (via <code>element.accept(visitor)<\/code>) and the visitor (via <code>visitor.visit_X(element)<\/code>). Python replaces it with name-based lookup or <code>singledispatch<\/code>.<\/p>"}, {"q": "What is the Visitor trade-off?", "a": "<p>Adding a new operation is easy (one new visitor). Adding a new element type is hard (every visitor needs a new method). Pick Visitor when types are stable and operations grow.<\/p>"}, {"q": "How would you write a custom lint rule for Python code?", "a": "<p>Parse with <code>ast.parse<\/code>, subclass <code>ast.NodeVisitor<\/code>, implement <code>visit_&lt;NodeType&gt;<\/code> methods that inspect nodes and record findings with line numbers, and call <code>generic_visit<\/code> to keep traversing. Package it as a flake8 or Ruff plugin for CI.<\/p>"}], "related": ["composite", "interpreter", "iterator"], "code_out": "<h1>Q3 Report<\/h1>\n<p>Revenue grew 18 percent.<\/p>\n<img src=\"chart.png\" alt=\"\">\n<p>Churn fell to 2 percent.<\/p>\nwords: 11\nlint: ['image chart.png has no alt text']", "pythonic_out": "line 4: call to eval\nline 5: subprocess.call with shell=True\nline 6: call to os.system\n[1,\"a\",[2,3]]"}, {"id": "registry", "cat": "pythonic", "name": "Registry / Plugin", "alias": "Classes or functions register themselves in a lookup table so they can be found by name.", "simple": "A food court directory board: every new stall adds its name and counter number to the board. Visitors look up \"pizza\" on the board; the building manager never has to be told about each new stall.", "intent": "<p>A registry is a dict from a key (name, type, file extension, command) to a class or function. Code that needs one looks it up instead of importing it directly. Adding a feature means adding a new registered class, with no edits to the dispatching code (Open/Closed Principle).<\/p>\n<p>Python gives you three ways to register: a <b>decorator<\/b> (<code>@register(\"csv\")<\/code>), <b><code>__init_subclass__<\/code><\/b> (every subclass registers automatically), and <b>package entry points<\/b> (<code>importlib.metadata.entry_points<\/code>) so separately installed packages can add plugins, which is how pytest, Flask and many CLIs load extensions.<\/p>", "structure": " PARSERS = {\"csv\": CsvParser, \"json\": JsonParser, \"xml\": XmlParser}\n class YamlParser(Parser, fmt=\"yaml\")   -> auto-added by __init_subclass__\n parser_for(\"report.yaml\")  -> PARSERS[\"yaml\"]()", "code": "import json, csv, io\n\nclass Parser:\n    registry: dict[str, type[\"Parser\"]] = {}\n\n    def __init_subclass__(cls, *, ext: str, **kw):     # runs when a subclass is DEFINED\n        super().__init_subclass__(**kw)\n        if ext in Parser.registry:\n            raise ValueError(f\"duplicate parser for .{ext}\")\n        Parser.registry[ext] = cls\n\n    @classmethod\n    def for_file(cls, filename: str) -> \"Parser\":\n        ext = filename.rsplit(\".\", 1)[-1].lower()\n        try:\n            return cls.registry[ext]()\n        except KeyError:\n            raise ValueError(f\"no parser for .{ext}; known: {sorted(cls.registry)}\") from None\n\nclass JsonParser(Parser, ext=\"json\"):\n    def parse(self, text): return json.loads(text)\n\nclass CsvParser(Parser, ext=\"csv\"):\n    def parse(self, text): return list(csv.DictReader(io.StringIO(text)))\n\n# a plugin added later, in another module: no edits above\nclass KeyValueParser(Parser, ext=\"env\"):\n    def parse(self, text): return dict(l.split(\"=\", 1) for l in text.splitlines() if l)\n\nprint(\"registered:\", sorted(Parser.registry))\nprint(Parser.for_file(\"orders.csv\").parse(\"id,total\\n1,99\\n\"))\nprint(Parser.for_file(\"app.ENV\").parse(\"DEBUG=0\\nDB=postgres\"))\ntry:\n    Parser.for_file(\"photo.png\")\nexcept ValueError as e:\n    print(e)", "pythonic": "from importlib.metadata import entry_points\n\n# decorator-based registry for functions (how CLIs and task runners register commands)\nCOMMANDS = {}\ndef command(name):\n    def deco(fn):\n        COMMANDS[name] = fn\n        return fn\n    return deco\n\n@command(\"greet\")\ndef greet(who=\"world\"): return f\"hello {who}\"\n@command(\"version\")\ndef version(): return \"2.4.1\"\n\nprint(COMMANDS[\"greet\"](\"riya\"), \"|\", COMMANDS[\"version\"]())\n\n# installed packages register plugins through entry points (pip installs, no code edits)\ngroups = entry_points()\nprint(\"console_scripts found:\", len(groups.select(group=\"console_scripts\")) > 0)", "pythonic_note": "A decorator that fills a dict is the lightest registry. Entry points extend it across packages: a plugin just declares itself in its <code>pyproject.toml<\/code>.", "examples": [{"where": "stdlib", "title": "<code>atexit.register<\/code>, <code>codecs.register<\/code>, <code>copyreg.pickle<\/code>, <code>mimetypes.add_type<\/code>", "body": "Registries all over the stdlib: exit handlers, text encodings looked up by name (<code>'utf-8'<\/code>), custom pickling functions per type, and file-extension to MIME-type mappings."}, {"where": "stdlib", "title": "<code>abc.ABC.register<\/code> and <code>importlib.metadata.entry_points<\/code>", "body": "<code>Sequence.register(MyList)<\/code> makes <code>isinstance(x, Sequence)<\/code> true without inheritance (a virtual subclass registry). Entry points are the packaging-level plugin registry."}, {"where": "framework", "title": "pytest plugins, Flask extensions and blueprints", "body": "pytest discovers plugins through the <code>pytest11<\/code> entry-point group (via pluggy). Flask apps call <code>app.register_blueprint(bp)<\/code>, and <code>@app.route<\/code> is itself a registry of URL rules."}, {"where": "framework", "title": "Django <code>admin.site.register<\/code>, DRF <code>router.register<\/code>, Celery <code>@app.task<\/code>", "body": "Admin pages, API routes and background tasks are all looked up by name from registries filled at import time."}, {"where": "production", "title": "File-format, payment-provider and device-driver plugins", "body": "Data platforms register one parser per format, payment services one adapter per provider, test frameworks one driver per device model. New ones ship as separate modules or packages without touching the core."}], "use": ["Many interchangeable implementations chosen by a key (format, name, type)", "Third parties or other teams should add implementations without editing core code", "CLI commands, routes, handlers, serializers"], "avoid": ["Only a couple of fixed implementations: an explicit dict literal is clearer", "Registration by import side effect when nothing imports the module (the plugin silently never registers)"], "pitfall": "Plugins register only when their module is imported. If nothing imports <code>yaml_parser.py<\/code>, it is not in the registry. Import plugin modules explicitly at startup, or use entry points, which are discovered without imports.", "qa": [{"q": "What is <code>__init_subclass__<\/code> and how is it used for registries?", "a": "<p>A classmethod hook (PEP 487, Python 3.6+) called on the base class whenever a subclass is created. It receives class keyword arguments, so <code>class JsonParser(Parser, ext='json')<\/code> can register itself without a metaclass.<\/p>"}, {"q": "How do Python plugin systems discover plugins from other packages?", "a": "<p>Through entry points: a package declares <code>[project.entry-points.\"myapp.plugins\"]<\/code> in <code>pyproject.toml<\/code>; the host calls <code>importlib.metadata.entry_points(group='myapp.plugins')<\/code> and loads each one.<\/p>"}, {"q": "How does a registry relate to Factory Method?", "a": "<p>A registry is the lookup table a factory uses: <code>Parser.for_file()<\/code> is a factory whose choice comes from the registry, so adding types doesn't change the factory.<\/p>"}], "related": ["factory-method", "strategy", "dependency-injection"], "code_out": "registered: ['csv', 'env', 'json']\n[{'id': '1', 'total': '99'}]\n{'DEBUG': '0', 'DB': 'postgres'}\nno parser for .png; known: ['csv', 'env', 'json']", "pythonic_out": "hello riya | 2.4.1\nconsole_scripts found: True"}, {"id": "dependency-injection", "cat": "pythonic", "name": "Dependency Injection", "alias": "Give an object its collaborators from outside instead of letting it create them.", "simple": "A chef doesn't grow vegetables or build the stove. The restaurant hands the chef ingredients and equipment. In a cooking class the chef gets toy ingredients to practise with, same recipes, no real cost.", "intent": "<p>If <code>OrderService<\/code> creates its own <code>StripeClient()<\/code> and <code>PostgresRepo()<\/code> inside <code>__init__<\/code>, it can't be tested without Stripe and PostgreSQL, and it can't be reconfigured. With DI, dependencies are <b>passed in<\/b> (usually to the constructor). The code that wires real objects together lives in one place at startup (the <b>composition root<\/b>).<\/p>\n<p>Python needs no framework for this: constructor arguments with type hints (often <code>Protocol<\/code>s) are enough. Frameworks like FastAPI (<code>Depends<\/code>) and pytest (fixtures) do injection for you by looking at function parameters.<\/p>", "structure": " main():   repo = PostgresRepo(dsn); pay = StripeGateway(key)\n           service = OrderService(repo, pay)           <- composition root\n tests:    service = OrderService(FakeRepo(), FakeGateway())\n OrderService never calls PostgresRepo() or StripeGateway() itself", "code": "from typing import Protocol\nfrom dataclasses import dataclass, field\n\nclass PaymentGateway(Protocol):\n    def charge(self, customer_id: str, amount: float) -> str: ...\nclass OrderRepo(Protocol):\n    def save(self, order: dict) -> None: ...\nclass Clock(Protocol):\n    def now(self) -> str: ...\n\nclass OrderService:\n    def __init__(self, repo: OrderRepo, payments: PaymentGateway, clock: Clock):\n        self.repo, self.payments, self.clock = repo, payments, clock   # injected\n\n    def place(self, customer_id, amount):\n        ref = self.payments.charge(customer_id, amount)\n        order = {\"customer\": customer_id, \"amount\": amount, \"ref\": ref, \"at\": self.clock.now()}\n        self.repo.save(order)\n        return order\n\n# ---- test doubles: no network, no DB, deterministic time\n@dataclass\nclass FakeRepo:\n    saved: list = field(default_factory=list)\n    def save(self, order): self.saved.append(order)\n\nclass FakeGateway:\n    def __init__(self, fail=False): self.fail, self.calls = fail, []\n    def charge(self, customer_id, amount):\n        self.calls.append((customer_id, amount))\n        if self.fail: raise RuntimeError(\"card declined\")\n        return \"PAY-TEST-1\"\n\nclass FixedClock:\n    def now(self): return \"2026-09-28T10:00:00Z\"\n\nrepo, gw = FakeRepo(), FakeGateway()\nsvc = OrderService(repo, gw, FixedClock())\nprint(svc.place(\"C-7\", 499.0))\nassert repo.saved[0][\"ref\"] == \"PAY-TEST-1\" and gw.calls == [(\"C-7\", 499.0)]\n\nfailing = OrderService(FakeRepo(), FakeGateway(fail=True), FixedClock())\ntry:\n    failing.place(\"C-8\", 10.0)\nexcept RuntimeError as e:\n    print(\"declined path tested without Stripe:\", e, \"| saved:\", failing.repo.saved)", "pythonic": "# How pytest injects fixtures: it reads parameter NAMES and supplies matching objects.\n# A 15-line imitation of the idea:\nimport inspect\n\nPROVIDERS = {}\ndef fixture(fn): PROVIDERS[fn.__name__] = fn; return fn\n\n@fixture\ndef db(): return {\"users\": [\"riya\", \"arjun\"]}\n@fixture\ndef user_count(db): return len(db[\"users\"])          # fixtures can depend on fixtures\n\ndef run_test(test):\n    def resolve(name):\n        f = PROVIDERS[name]\n        return f(*[resolve(p) for p in inspect.signature(f).parameters])\n    kwargs = {p: resolve(p) for p in inspect.signature(test).parameters}\n    test(**kwargs); print(f\"{test.__name__} passed with {sorted(kwargs)}\")\n\ndef test_users(db, user_count):\n    assert user_count == 2 and \"riya\" in db[\"users\"]\nrun_test(test_users)", "pythonic_note": "pytest and FastAPI both inject by inspecting function signatures. This toy version shows the mechanism: parameter names are looked up in a provider registry, recursively.", "examples": [{"where": "stdlib", "title": "<code>http.server.HTTPServer(addr, HandlerClass)<\/code>, <code>json.loads(object_hook=, cls=)<\/code>", "body": "The server doesn't create a specific handler; you inject the handler class. <code>json<\/code> and <code>logging<\/code> (handlers, formatters, filters) accept collaborators as arguments rather than hard-coding them."}, {"where": "framework", "title": "FastAPI <code>Depends()<\/code>", "body": "<code>def get_orders(db: Session = Depends(get_db), user = Depends(current_user))<\/code>: FastAPI calls the providers per request, caches them within the request, and tests swap them with <code>app.dependency_overrides[get_db] = fake_db<\/code>."}, {"where": "framework", "title": "pytest fixtures", "body": "Tests declare what they need as parameters (<code>def test_x(tmp_path, client, db_session)<\/code>) and pytest builds the dependency graph, with scopes (function, module, session) and teardown."}, {"where": "framework", "title": "Django pluggable backends, dependency-injector library", "body": "Django injects implementations by import path in settings (<code>EMAIL_BACKEND<\/code>, <code>CACHES<\/code>, <code>STORAGES<\/code>); tests switch to <code>locmem<\/code> email. The <code>dependency-injector<\/code> package offers containers and providers for large apps."}, {"where": "production", "title": "Hexagonal / clean architecture services", "body": "Domain services depend on ports (<code>Protocol<\/code>s for repositories, gateways, clocks); adapters for PostgreSQL, Stripe or Kafka are wired in <code>main.py<\/code>. Unit tests run in milliseconds with in-memory fakes."}], "use": ["Code talks to databases, APIs, clocks, randomness or the filesystem and needs tests", "Implementations differ between environments", "Large applications where wiring should be visible in one place"], "avoid": ["Injecting pure helpers (<code>math<\/code>, a formatting function): import them", "Heavy DI containers in small scripts: plain constructor arguments are enough"], "pitfall": "Using <code>unittest.mock.patch<\/code> on module paths everywhere instead of injecting. Tests then break whenever an import moves, and they test wiring rather than behaviour. Inject the collaborator and pass a fake.", "qa": [{"q": "What is dependency injection and why use it?", "a": "<p>Providing an object's dependencies from outside (constructor, parameters) instead of creating them inside. Benefits: testability with fakes, configurable implementations, explicit dependencies, and looser coupling.<\/p>"}, {"q": "DI vs Service Locator vs Singleton?", "a": "<p>With DI dependencies are pushed in and visible in the signature. A service locator or singleton is pulled from a global inside the code, hiding dependencies and making tests share state.<\/p>"}, {"q": "How do you override a dependency in FastAPI tests?", "a": "<p><code>app.dependency_overrides[get_db] = lambda: fake_session<\/code>, then use <code>TestClient(app)<\/code>. Every endpoint depending on <code>get_db<\/code> receives the fake.<\/p>"}], "related": ["abstract-factory", "repository", "singleton", "strategy"], "code_out": "{'customer': 'C-7', 'amount': 499.0, 'ref': 'PAY-TEST-1', 'at': '2026-09-28T10:00:00Z'}\ndeclined path tested without Stripe: card declined | saved: []", "pythonic_out": "test_users passed with ['db', 'user_count']"}, {"id": "context-manager", "cat": "pythonic", "name": "Context Manager (Execute Around)", "alias": "Guarantee setup and cleanup around a block of code with <code>with<\/code>.", "simple": "A library book: you check it out, read it, and it must go back, even if you spill coffee on it. The <code>with<\/code> statement is the librarian who makes sure the book is returned no matter what happened while you had it.", "intent": "<p>Many resources need a paired action: open/close, acquire/release, begin/commit-or-rollback, set/restore. A context manager bundles both halves so the cleanup <b>always<\/b> runs, including when an exception is raised or the function returns early. It is Python's version of C++ RAII and the \"Execute Around\" pattern.<\/p>\n<p>Write one as a class with <code>__enter__<\/code>/<code>__exit__<\/code>, or as a generator with <code>@contextlib.contextmanager<\/code> (code before <code>yield<\/code> is setup, after is cleanup). <code>__exit__<\/code> receives the exception and may suppress it by returning <code>True<\/code>. Async versions use <code>async with<\/code> and <code>__aenter__<\/code>/<code>__aexit__<\/code>.<\/p>", "structure": " with transaction(conn) as tx:        __enter__: BEGIN\n     tx.execute(...)                   body\n     tx.execute(...)                   __exit__: COMMIT, or ROLLBACK if an exception escaped\n # cleanup guaranteed on success, exception, return or break", "code": "import sqlite3, time\nfrom contextlib import contextmanager\n\n@contextmanager\ndef transaction(conn):\n    cur = conn.cursor()\n    cur.execute(\"BEGIN\")\n    try:\n        yield cur\n    except Exception:\n        conn.rollback(); print(\"  ROLLBACK\")\n        raise\n    else:\n        conn.commit(); print(\"  COMMIT\")\n\nclass Timer:\n    def __enter__(self):\n        self.t0 = time.perf_counter(); return self\n    def __exit__(self, exc_type, exc, tb):\n        self.ms = (time.perf_counter() - self.t0) * 1000\n        print(f\"  block took {self.ms:.2f} ms (exception: {exc_type.__name__ if exc_type else None})\")\n        return False                                  # don't swallow exceptions\n\nconn = sqlite3.connect(\":memory:\", isolation_level=None)\nconn.execute(\"CREATE TABLE accounts (name TEXT PRIMARY KEY, balance INT CHECK (balance >= 0))\")\nconn.executemany(\"INSERT INTO accounts VALUES (?, ?)\", [(\"riya\", 500), (\"arjun\", 100)])\n\ndef transfer(src, dst, amount):\n    with Timer(), transaction(conn) as cur:\n        cur.execute(\"UPDATE accounts SET balance = balance + ? WHERE name = ?\", (amount, dst))\n        cur.execute(\"UPDATE accounts SET balance = balance - ? WHERE name = ?\", (amount, src))\n\ntransfer(\"riya\", \"arjun\", 200)\ntry:\n    transfer(\"arjun\", \"riya\", 1_000)                  # violates CHECK -> rollback\nexcept sqlite3.IntegrityError as e:\n    print(\"  failed:\", e)\nprint(dict(conn.execute(\"SELECT name, balance FROM accounts\")))", "pythonic": "import contextlib, os, tempfile, threading, decimal\n\nlock = threading.Lock()\nwith lock:                                            # acquire / release\n    print(\"in critical section, locked =\", lock.locked())\nprint(\"after, locked =\", lock.locked())\n\nwith contextlib.suppress(FileNotFoundError):          # ignore one specific error\n    os.remove(\"does-not-exist.tmp\")\n\nwith decimal.localcontext() as ctx:                   # temporarily change settings\n    ctx.prec = 5\n    print(decimal.Decimal(1) / decimal.Decimal(7))\nprint(decimal.Decimal(1) / decimal.Decimal(7))\n\nwith contextlib.ExitStack() as stack:                 # a dynamic number of resources\n    d = stack.enter_context(tempfile.TemporaryDirectory())\n    files = [stack.enter_context(open(os.path.join(d, f\"part{i}.txt\"), \"w\")) for i in range(3)]\n    for f in files: f.write(\"data\")\n    print(len(files), \"files open\")\nprint(\"all closed:\", all(f.closed for f in files))", "pythonic_note": "The stdlib is full of ready-made context managers: locks, <code>decimal.localcontext<\/code>, <code>tempfile.TemporaryDirectory<\/code>, <code>contextlib.suppress<\/code>, <code>contextlib.chdir<\/code> (3.11+) and <code>ExitStack<\/code> for a variable number of resources.", "examples": [{"where": "stdlib", "title": "<code>open()<\/code>, <code>threading.Lock<\/code>, <code>sqlite3<\/code> connections", "body": "Files close, locks release, and a <code>sqlite3<\/code> connection used in <code>with conn:<\/code> commits on success or rolls back on exception, even when the block raises."}, {"where": "stdlib", "title": "<code>contextlib<\/code>: <code>contextmanager<\/code>, <code>ExitStack<\/code>, <code>suppress<\/code>, <code>redirect_stdout<\/code>, <code>chdir<\/code>", "body": "Toolkit for writing and combining context managers. <code>ExitStack<\/code> is what you use when the number of resources is only known at runtime."}, {"where": "stdlib", "title": "<code>unittest.mock.patch<\/code>, <code>decimal.localcontext<\/code>, <code>warnings.catch_warnings<\/code>", "body": "Temporarily change global state and reliably restore it at the end of the block, which is essential in tests."}, {"where": "framework", "title": "SQLAlchemy sessions, Django <code>transaction.atomic()<\/code>, <code>torch.no_grad()<\/code>", "body": "<code>with Session(engine) as s, s.begin():<\/code> commits or rolls back; <code>atomic()<\/code> wraps a DB transaction or savepoint; <code>no_grad()<\/code> disables gradient tracking for inference inside the block."}, {"where": "production", "title": "Distributed locks, spans and temporary infrastructure", "body": "<code>with redis_client.lock('invoice:42', timeout=10):<\/code> prevents double processing across servers; tracing libraries use <code>with tracer.start_as_current_span('charge'):<\/code>; test harnesses spin up and tear down containers or devices around a test."}], "use": ["Any acquire/release, open/close, begin/commit pair", "Temporarily changing global state (cwd, env vars, settings, mocks)", "Timing, tracing or logging around a block"], "avoid": ["No cleanup is needed: a plain function call is clearer", "The resource must outlive the block (return it and manage its lifetime elsewhere)"], "pitfall": "In a <code>@contextmanager<\/code> generator, putting cleanup after <code>yield<\/code> without <code>try/finally<\/code>. If the block raises, the code after <code>yield<\/code> never runs and the resource leaks.", "qa": [{"q": "What happens in <code>__exit__<\/code> when an exception occurs?", "a": "<p>It receives <code>(exc_type, exc_value, traceback)<\/code>. Returning a truthy value suppresses the exception; returning <code>False<\/code>/<code>None<\/code> lets it propagate after cleanup. With no exception all three are <code>None<\/code>.<\/p>"}, {"q": "Class-based vs <code>@contextmanager<\/code>?", "a": "<p>The decorator is shorter for simple setup/teardown (wrap <code>yield<\/code> in <code>try/finally<\/code>). A class is better when the manager has state or methods, is reusable, or needs to be re-entrant.<\/p>"}, {"q": "What is <code>ExitStack<\/code> for?", "a": "<p>Managing a dynamic number of context managers (for example opening N files from a list) and registering arbitrary cleanup callbacks; everything is unwound in reverse order when the stack exits.<\/p>"}], "related": ["object-pool", "decorator", "repository"], "code_out": "  COMMIT\n  block took 0.06 ms (exception: None)\n  ROLLBACK\n  block took 0.04 ms (exception: IntegrityError)\n  failed: CHECK constraint failed: balance >= 0\n{'riya': 300, 'arjun': 300}", "pythonic_out": "in critical section, locked = True\nafter, locked = False\n0.14286\n0.1428571428571428571428571429\n3 files open\nall closed: True"}, {"id": "null-object", "cat": "pythonic", "name": "Null Object", "alias": "Use a do-nothing object with the right interface instead of <code>None<\/code> checks.", "simple": "A mannequin in a shop window wears clothes like a person but never talks or moves. Code that \"dresses\" whoever is in the window works the same whether it's a real model or a mannequin; nobody has to check first.", "intent": "<p>Code sprinkled with <code>if self.logger is not None:<\/code> or <code>if user is not None and user.is_admin<\/code> is noisy and easy to get wrong. A Null Object implements the expected interface with safe, neutral behaviour: log nothing, cache nothing, return an empty list, deny permissions. Callers use it like any real object.<\/p>\n<p>It is great for optional collaborators (loggers, metrics, caches, tracers) and \"absent\" domain objects (anonymous user, no discount). It should never hide real errors: use it only where \"do nothing\" is the correct behaviour.<\/p>", "structure": " Checkout(discount=NoDiscount())      NoDiscount.apply(total) -> total\n Service(metrics=NullMetrics())       NullMetrics.incr(...)  -> does nothing\n request.user = AnonymousUser()       .is_authenticated -> False, .has_perm() -> False", "code": "from typing import Protocol\n\nclass Metrics(Protocol):\n    def incr(self, name: str, value: int = 1) -> None: ...\n\nclass PrintMetrics:\n    def incr(self, name, value=1): print(f\"  metric {name} += {value}\")\n\nclass NullMetrics:                        # the null object: same interface, no effect\n    def incr(self, name, value=1): pass\n\nclass Discount(Protocol):\n    def apply(self, total: float) -> float: ...\n\nclass PercentOff:\n    def __init__(self, pct): self.pct = pct\n    def apply(self, total): return round(total * (1 - self.pct / 100), 2)\n\nclass NoDiscount:                         # null object instead of discount=None\n    def apply(self, total): return total\n\nclass AnonymousUser:\n    is_authenticated = False\n    name = \"guest\"\n    def has_perm(self, perm): return False\n\ndef checkout(total, user, discount: Discount = NoDiscount(), metrics: Metrics = NullMetrics()):\n    metrics.incr(\"checkout.started\")                      # no \"if metrics:\" anywhere\n    final = discount.apply(total)\n    can_invoice = user.has_perm(\"invoice.create\")\n    return f\"{user.name}: pay {final} (invoice allowed: {can_invoice})\"\n\nprint(checkout(1000, AnonymousUser()))\nprint(checkout(1000, AnonymousUser(), PercentOff(10), PrintMetrics()))", "pythonic": "import logging, contextlib\n\n# stdlib null object 1: libraries attach NullHandler so they never print unless the app configures logging\nlib_log = logging.getLogger(\"mylib\")\nlib_log.addHandler(logging.NullHandler())\nlib_log.warning(\"silently ignored unless the app adds a handler\")\nprint(\"handlers:\", [type(h).__name__ for h in lib_log.handlers])\n\n# stdlib null object 2: nullcontext when a lock/transaction is optional\nimport threading\ndef update(counter, lock=None):\n    with lock or contextlib.nullcontext():       # no if/else around the with-block\n        counter[\"n\"] += 1\nc = {\"n\": 0}\nupdate(c); update(c, threading.Lock())\nprint(c)", "pythonic_note": "<code>logging.NullHandler<\/code> and <code>contextlib.nullcontext<\/code> are Null Objects shipped in the stdlib for exactly this purpose.", "examples": [{"where": "stdlib", "title": "<code>logging.NullHandler<\/code>", "body": "The logging HOWTO recommends that libraries add a <code>NullHandler<\/code> to their top-level logger, so they stay quiet unless the application configures logging."}, {"where": "stdlib", "title": "<code>contextlib.nullcontext<\/code> and <code>os.devnull<\/code>", "body": "<code>nullcontext()<\/code> is a context manager that does nothing, used when a real lock or transaction is optional. Writing to <code>os.devnull<\/code> is the file-system null object for discarding output."}, {"where": "framework", "title": "Django <code>AnonymousUser<\/code>", "body": "When nobody is logged in, <code>request.user<\/code> is an <code>AnonymousUser<\/code> with <code>is_authenticated = False<\/code> and <code>has_perm()<\/code> returning False, so views and templates never check for <code>None<\/code>."}, {"where": "framework", "title": "Django <code>DummyCache<\/code>, OpenTelemetry no-op tracer", "body": "<code>django.core.cache.backends.dummy.DummyCache<\/code> implements the cache API but stores nothing (handy in development). The OpenTelemetry API returns a no-op tracer when no SDK is configured, so instrumented libraries cost almost nothing."}, {"where": "production", "title": "Optional integrations and feature flags", "body": "Services inject <code>NullMetrics<\/code>, <code>NullNotifier<\/code> or <code>NoDiscount<\/code> when a feature is disabled or in tests, removing dozens of <code>if enabled:<\/code> branches from business code."}], "use": ["An optional collaborator where \"do nothing\" is correct (logging, metrics, tracing, caching)", "Replacing repeated <code>None<\/code> checks for an absent domain object"], "avoid": ["Absence is an error the caller must handle (a missing required config, a missing order)", "It would hide bugs, for example a <code>NullPaymentGateway<\/code> in production"], "pitfall": "A null object that silently returns wrong data (e.g. a <code>NullUser<\/code> with admin rights or a null repository returning an empty list during an outage). Neutral must mean safe, and it must be obvious in configuration when it is active.", "qa": [{"q": "What problem does the Null Object pattern solve?", "a": "<p>It removes repeated <code>None<\/code> checks by providing an object with the expected interface and harmless behaviour, simplifying callers and preventing <code>AttributeError: 'NoneType' object has no attribute ...<\/code>.<\/p>"}, {"q": "Why should libraries add <code>logging.NullHandler<\/code>?", "a": "<p>So the library doesn't emit \"No handlers could be found\" warnings or print unexpectedly; the application decides where logs go by configuring handlers on the root or library logger.<\/p>"}, {"q": "When is Null Object a bad idea?", "a": "<p>When absence is exceptional and must be handled (raise or return an <code>Optional<\/code> the caller checks). A silent null object can hide misconfiguration.<\/p>"}], "related": ["strategy", "dependency-injection", "proxy"], "code_out": "guest: pay 1000 (invoice allowed: False)\n  metric checkout.started += 1\nguest: pay 900.0 (invoice allowed: False)", "pythonic_out": "handlers: ['NullHandler']\n{'n': 2}"}, {"id": "mixin", "cat": "pythonic", "name": "Mixin", "alias": "Small classes that add one reusable capability through multiple inheritance.", "simple": "Phone accessories: a wireless-charging back, a camera lens clip, a card holder. Each adds one feature to any phone. You combine the ones you need instead of buying a new phone model for every combination.", "intent": "<p>A mixin is a class not meant to stand alone. It provides one focused capability (JSON serialization, timestamps, login checks, threading) that you add by listing it as a base: <code>class Order(TimestampMixin, JsonMixin, Model)<\/code>. It relies on the <b>MRO<\/b> (method resolution order) and cooperative <code>super()<\/code> calls so several mixins can wrap the same method.<\/p>\n<p>Rules of thumb: mixins have no <code>__init__<\/code> state of their own (or call <code>super().__init__<\/code>), put them <b>left<\/b> of the main base class, and name them <code>...Mixin<\/code>. Prefer composition when a capability needs its own state or configuration.<\/p>", "structure": " class ThreadingHTTPServer(ThreadingMixIn, HTTPServer)\n MRO: ThreadingHTTPServer -> ThreadingMixIn -> HTTPServer -> TCPServer -> BaseServer -> object\n ThreadingMixIn.process_request() overrides BaseServer's to run each request in a thread", "code": "import json\nfrom datetime import datetime, timezone\n\nclass JsonMixin:\n    def to_json(self):\n        return json.dumps({k: v for k, v in vars(self).items() if not k.startswith(\"_\")}, default=str)\n\nclass TimestampMixin:\n    def save(self):\n        now = datetime(2026, 9, 28, 10, 0, tzinfo=timezone.utc)     # fixed for the demo\n        self.created_at = getattr(self, \"created_at\", now)\n        self.updated_at = now\n        return super().save()                                        # cooperative\n\nclass AuditMixin:\n    def save(self):\n        print(f\"  audit: saving {type(self).__name__}\")\n        return super().save()\n\nclass Model:\n    def save(self): print(f\"  INSERT {type(self).__name__}\"); return self\n\nclass Order(AuditMixin, TimestampMixin, JsonMixin, Model):\n    def __init__(self, oid, total): self.oid, self.total = oid, total\n\no = Order(\"O-5\", 1299).save()\nprint(o.to_json())\nprint(\"MRO:\", \" -> \".join(c.__name__ for c in Order.__mro__))", "pythonic": "import socketserver, http.server\n\n# the stdlib builds its threading HTTP server from a mixin + a base server\nprint(http.server.ThreadingHTTPServer.__mro__[:3])\nprint(issubclass(http.server.ThreadingHTTPServer, socketserver.ThreadingMixIn))\n\n# collections.abc mixins: inherit behaviour from a few required methods\nfrom collections.abc import MutableSet\nclass TagSet(MutableSet):\n    def __init__(self, it=()): self._s = {t.lower() for t in it}\n    def __contains__(self, x): return x.lower() in self._s\n    def __iter__(self): return iter(sorted(self._s))\n    def __len__(self): return len(self._s)\n    def add(self, x): self._s.add(x.lower())\n    def discard(self, x): self._s.discard(x.lower())\ntags = TagSet([\"Python\", \"SQL\"])\ntags |= {\"Docker\"}                        # |=, -=, isdisjoint, pop... come from the mixin\nprint(list(tags), \"PYTHON\" in tags, tags.isdisjoint({\"java\"}))", "pythonic_note": "<code>http.server.ThreadingHTTPServer<\/code> is literally <code>ThreadingMixIn<\/code> + <code>HTTPServer<\/code>. <code>collections.abc.MutableSet<\/code> gives you <code>|=<\/code>, <code>-=<\/code>, <code>pop<\/code> and more from five methods.", "examples": [{"where": "stdlib", "title": "<code>socketserver.ThreadingMixIn<\/code> / <code>ForkingMixIn<\/code>", "body": "Add concurrency to any socketserver: <code>class ThreadingTCPServer(ThreadingMixIn, TCPServer)<\/code>. <code>http.server.ThreadingHTTPServer<\/code> is defined exactly this way."}, {"where": "stdlib", "title": "<code>collections.abc<\/code> mixin methods", "body": "<code>Mapping<\/code>, <code>MutableSequence<\/code> and <code>MutableSet<\/code> supply many concrete methods once you implement the abstract ones, which is how you make custom containers behave like built-ins."}, {"where": "framework", "title": "Django class-based view mixins", "body": "<code>class InvoiceView(LoginRequiredMixin, PermissionRequiredMixin, DetailView)<\/code> adds authentication and permission checks to a generic view; <code>FormMixin<\/code>, <code>SingleObjectMixin<\/code> and <code>ContextMixin<\/code> build the generic views themselves."}, {"where": "framework", "title": "Django REST Framework model mixins", "body": "<code>ListModelMixin<\/code>, <code>CreateModelMixin<\/code>, <code>RetrieveModelMixin<\/code> combine with <code>GenericViewSet<\/code>; <code>ModelViewSet<\/code> is just all of them together."}, {"where": "production", "title": "ORM model mixins: timestamps, soft delete, tenancy", "body": "SQLAlchemy and Django projects commonly share <code>TimestampMixin<\/code> (created_at/updated_at columns), <code>SoftDeleteMixin<\/code> (deleted_at plus a filtered manager) and <code>TenantMixin<\/code> across dozens of models."}], "use": ["The same small capability is needed across unrelated classes", "Frameworks designed for composition by mixins (Django CBVs, DRF, socketserver)"], "avoid": ["The capability needs its own state and configuration: use composition", "Long mixin lists whose methods interact in surprising MRO order"], "pitfall": "Not calling <code>super()<\/code> in a mixin method: the chain stops and later mixins or the base class never run (in the example, removing <code>super().save()<\/code> from <code>AuditMixin<\/code> would skip timestamps and the INSERT).", "qa": [{"q": "What is the MRO and how does Python compute it?", "a": "<p>The method resolution order is the sequence of classes searched for attributes. Python uses the C3 linearization: children before parents, left-to-right base order preserved, each class once. See it with <code>Cls.__mro__<\/code>.<\/p>"}, {"q": "Why do mixins go to the left of the base class?", "a": "<p>So their methods come first in the MRO and can override and extend the base's methods via <code>super()<\/code>. <code>class V(LoginRequiredMixin, View)<\/code> runs the login check before <code>View.dispatch<\/code>.<\/p>"}, {"q": "Mixin vs composition?", "a": "<p>Mixins share behaviour through inheritance and are convenient for small stateless capabilities. Composition (holding a collaborator) is better for stateful or configurable behaviour and avoids MRO surprises.<\/p>"}], "related": ["template-method", "decorator", "registry"], "code_out": "  audit: saving Order\n  INSERT Order\n{\"oid\": \"O-5\", \"total\": 1299, \"created_at\": \"2026-09-28 10:00:00+00:00\", \"updated_at\": \"2026-09-28 10:00:00+00:00\"}\nMRO: Order -> AuditMixin -> TimestampMixin -> JsonMixin -> Model -> object", "pythonic_out": "(<class 'http.server.ThreadingHTTPServer'>, <class 'socketserver.ThreadingMixIn'>, <class 'http.server.HTTPServer'>)\nTrue\n['docker', 'python', 'sql'] True True"}, {"id": "repository", "cat": "pythonic", "name": "Repository & Unit of Work", "alias": "Hide persistence behind a collection-like interface, and commit a batch of changes atomically.", "simple": "A library catalogue: you ask the librarian \"get me the book with ID 42\" or \"add this book\". You don't know whether books are in the basement, a warehouse or on loan. The Unit of Work is the checkout desk: all the books you borrow in one visit are recorded together, or not at all.", "intent": "<p>A <b>Repository<\/b> gives domain code a simple, collection-like API (<code>add<\/code>, <code>get<\/code>, <code>list_by_customer<\/code>) and hides SQL, ORMs and HTTP storage behind it. Business logic becomes testable with an in-memory fake repository.<\/p>\n<p>A <b>Unit of Work<\/b> tracks everything changed during one business operation and commits it atomically at the end (or rolls back). It usually also owns the repositories, so a use case reads: <code>with uow: order = uow.orders.get(id); order.ship(); uow.commit()<\/code>. These two patterns are the heart of Cosmic Python's architecture.<\/p>", "structure": " service: with uow:                          SqlUnitOfWork -> session/transaction\n            order = uow.orders.get(\"O-9\")      SqlOrderRepository -> SELECT ...\n            order.ship()                       (changes tracked)\n            uow.commit()                       COMMIT (or ROLLBACK on error)\n tests:   FakeUnitOfWork + dict-based FakeOrderRepository", "code": "import sqlite3\nfrom dataclasses import dataclass\n\n@dataclass\nclass Order:\n    id: str; customer: str; status: str = \"PAID\"\n    def ship(self):\n        if self.status != \"PAID\": raise ValueError(f\"cannot ship {self.status} order\")\n        self.status = \"SHIPPED\"\n\n# ---- repository: collection-like API, SQL hidden inside\nclass SqlOrderRepository:\n    def __init__(self, conn): self.conn, self.seen = conn, {}\n    def add(self, o): self.conn.execute(\"INSERT INTO orders VALUES (?,?,?)\", (o.id, o.customer, o.status)); self.seen[o.id] = o\n    def get(self, oid):\n        row = self.conn.execute(\"SELECT id, customer, status FROM orders WHERE id=?\", (oid,)).fetchone()\n        o = Order(*row); self.seen[oid] = o; return o          # identity map, simplified\n\n# ---- unit of work: one transaction per business operation\nclass SqlUnitOfWork:\n    def __init__(self, conn): self.conn = conn\n    def __enter__(self):\n        self.orders = SqlOrderRepository(self.conn); self.conn.execute(\"BEGIN\"); return self\n    def commit(self):\n        for o in self.orders.seen.values():                  # flush tracked changes\n            self.conn.execute(\"UPDATE orders SET status=? WHERE id=?\", (o.status, o.id))\n        self.conn.execute(\"COMMIT\"); self.committed = True\n    def __exit__(self, exc_type, *_):\n        if not getattr(self, \"committed\", False): self.conn.execute(\"ROLLBACK\")\n        self.committed = False\n\ndef ship_order(uow, oid):                                    # service layer: no SQL here\n    with uow:\n        order = uow.orders.get(oid)\n        order.ship()\n        uow.commit()\n\nconn = sqlite3.connect(\":memory:\", isolation_level=None)\nconn.execute(\"CREATE TABLE orders (id TEXT PRIMARY KEY, customer TEXT, status TEXT)\")\nuow = SqlUnitOfWork(conn)\nwith uow:\n    uow.orders.add(Order(\"O-9\", \"riya\")); uow.orders.add(Order(\"O-10\", \"arjun\", \"PENDING\")); uow.commit()\n\nship_order(uow, \"O-9\")\ntry:\n    ship_order(uow, \"O-10\")\nexcept ValueError as e:\n    print(\"rejected:\", e)\nprint(conn.execute(\"SELECT * FROM orders\").fetchall())", "pythonic": "from dataclasses import dataclass\n\n@dataclass\nclass Order:\n    id: str; status: str = \"PAID\"\n    def ship(self): self.status = \"SHIPPED\"\n\nclass FakeRepo:                                   # in-memory repository for unit tests\n    def __init__(self, *orders): self._d = {o.id: o for o in orders}\n    def get(self, oid): return self._d[oid]\n\nclass FakeUoW:\n    def __init__(self, repo): self.orders, self.committed = repo, False\n    def __enter__(self): return self\n    def __exit__(self, *a): pass\n    def commit(self): self.committed = True\n\ndef ship_order(uow, oid):                         # the SAME service function as production\n    with uow:\n        uow.orders.get(oid).ship(); uow.commit()\n\nuow = FakeUoW(FakeRepo(Order(\"O-1\")))\nship_order(uow, \"O-1\")\nprint(uow.orders.get(\"O-1\").status, \"committed:\", uow.committed, \"(no database needed)\")", "pythonic_note": "The payoff: the service function runs unchanged against an in-memory fake, so business rules are tested in microseconds without a database.", "examples": [{"where": "stdlib", "title": "<code>sqlite3<\/code> transactions and <code>shelve<\/code>", "body": "A <code>sqlite3<\/code> connection used as a context manager commits or rolls back a batch of statements together, a minimal unit of work. <code>shelve<\/code> offers a dict-like persistent store: a repository-style interface over <code>dbm<\/code> files."}, {"where": "framework", "title": "SQLAlchemy <code>Session<\/code>", "body": "SQLAlchemy's documentation describes the Session as implementing the Unit of Work pattern with an identity map: it tracks new, dirty and deleted objects and flushes them in the right order within one transaction on <code>commit()<\/code>."}, {"where": "framework", "title": "Django managers and QuerySets", "body": "<code>Order.objects<\/code> is a repository-like entry point; custom managers (<code>Order.objects.overdue()<\/code>) keep query logic out of views. <code>transaction.atomic()<\/code> supplies the unit-of-work boundary."}, {"where": "production", "title": "\"Architecture Patterns with Python\" (Cosmic Python)", "body": "Harry Percival and Bob Gregory's book (O'Reilly, 2020, free online as cosmicpython.com) builds a Flask + SQLAlchemy service around Repository, Unit of Work, service layer and domain events, and is the standard Python reference for these patterns."}, {"where": "production", "title": "Swapping storage without touching business logic", "body": "Teams move an aggregate from PostgreSQL to DynamoDB, or add a Redis read-through cache, by writing a new repository class. Services and tests stay the same."}], "use": ["Non-trivial domain logic you want to test without a database", "Several storage backends, or likely future migration", "Operations that change several objects and must commit atomically"], "avoid": ["Simple CRUD apps where the ORM already is a fine repository", "Wrapping every ORM feature: you end up rebuilding the ORM badly"], "pitfall": "Leaky repositories that return ORM query objects or raw rows. Callers then depend on SQLAlchemy/Django anyway. Return domain objects, and put transaction control in the unit of work, not scattered <code>commit()<\/code> calls inside repositories.", "qa": [{"q": "What is the Repository pattern?", "a": "<p>An abstraction over persistence that looks like an in-memory collection of domain objects (<code>add<\/code>, <code>get<\/code>, queries by business meaning). It decouples domain logic from the database and makes testing with fakes easy.<\/p>"}, {"q": "What does Unit of Work add?", "a": "<p>A boundary for one business operation: it tracks changes and commits them atomically or rolls back, and gives the service one object that provides repositories and transaction control.<\/p>"}, {"q": "Isn't Django's ORM already a repository?", "a": "<p>Largely, yes, and for many apps that's enough. A separate repository layer pays off when domain logic is complex, you want very fast unit tests, or you need to hide which store is used.<\/p>"}], "related": ["dependency-injection", "context-manager", "facade"], "code_out": "rejected: cannot ship PENDING order\n[('O-9', 'riya', 'SHIPPED'), ('O-10', 'arjun', 'PENDING')]", "pythonic_out": "SHIPPED committed: True (no database needed)"}, {"id": "pipeline", "cat": "pythonic", "name": "Generator Pipeline", "alias": "Chain small lazy stages so data streams through them one item at a time.", "simple": "A car-wash tunnel: soap, brushes, rinse, dry. Each car moves through every station, and many cars are inside at once at different stations. No station waits for all cars of the day before starting.", "intent": "<p>A pipeline is a series of stages, each taking an iterable and yielding transformed items: read, parse, filter, enrich, batch, write. Built from generators, it processes one item at a time, so memory stays constant regardless of input size, and stages are small, testable and reorderable.<\/p>\n<p>The idea is the Unix pipe (<code>cat | grep | sort<\/code>) expressed in Python. Libraries lift the same concept to ML (scikit-learn Pipeline), dataframes (<code>df.pipe<\/code>) and distributed processing (Apache Beam).<\/p>", "structure": " read_lines(path) -> parse_json -> only(status=500) -> enrich(geo) -> batched(500) -> write_db\n    each stage: def stage(items): for x in items: ... yield y\n    memory: O(batch size), not O(file size)", "code": "import json, itertools, io, collections\n\nRAW = io.StringIO(\"\\n\".join(json.dumps(r) for r in [\n    {\"ts\": \"10:00\", \"path\": \"/checkout\", \"status\": 200, \"ms\": 120},\n    {\"ts\": \"10:01\", \"path\": \"/checkout\", \"status\": 500, \"ms\": 3000},\n    \"not json at all\",\n    {\"ts\": \"10:02\", \"path\": \"/search\",   \"status\": 500, \"ms\": 800},\n    {\"ts\": \"10:03\", \"path\": \"/checkout\", \"status\": 502, \"ms\": 2500},\n    {\"ts\": \"10:04\", \"path\": \"/login\",    \"status\": 200, \"ms\": 90},\n]))\n\ndef read_lines(f):\n    for line in f:\n        yield line.strip()\n\ndef parse(lines, errors):\n    for line in lines:\n        try:\n            rec = json.loads(line)\n            if isinstance(rec, dict): yield rec\n            else: errors[\"not an object\"] += 1\n        except json.JSONDecodeError:\n            errors[\"bad json\"] += 1\n\ndef server_errors(records):\n    return (r for r in records if r[\"status\"] >= 500)\n\ndef enrich(records):\n    for r in records:\n        yield {**r, \"slow\": r[\"ms\"] > 1000}\n\ndef write(batches):\n    for i, batch in enumerate(batches, 1):\n        print(f\"  batch {i}: INSERT {len(batch)} rows ->\", [(r[\"path\"], r[\"status\"]) for r in batch])\n\nerrors = collections.Counter()\nstream = enrich(server_errors(parse(read_lines(RAW), errors)))   # nothing has run yet\nwrite(itertools.batched(stream, 2))                               # pulling drives the pipeline\nprint(\"skipped:\", dict(errors))", "pythonic": "from functools import reduce\n\ndef compose(*stages):\n    return lambda data: reduce(lambda acc, stage: stage(acc), stages, data)\n\nstrip   = lambda xs: (x.strip() for x in xs)\nnonempty = lambda xs: (x for x in xs if x)\nupper   = lambda xs: (x.upper() for x in xs)\n\nclean = compose(strip, nonempty, upper)          # reusable, reorderable pipeline\nprint(list(clean([\"  pune \", \"\", \" bengaluru\", \"   \"])))", "pythonic_note": "Stages are plain functions from iterable to iterable, so composing them is a one-line <code>reduce<\/code>.", "examples": [{"where": "stdlib", "title": "Generators, <code>itertools<\/code>, file iteration", "body": "Generator expressions, <code>filter<\/code>, <code>map<\/code>, <code>itertools.batched<\/code>, <code>groupby<\/code> and <code>islice<\/code> are pipeline stages; file objects and <code>csv.reader<\/code> are sources. David Beazley's \"Generator Tricks for Systems Programmers\" talk popularized this style."}, {"where": "stdlib", "title": "<code>subprocess<\/code> pipes", "body": "Connecting <code>Popen(..., stdout=PIPE)<\/code> into another process's <code>stdin<\/code> builds a real OS-level pipeline from Python, the same model as a shell <code>|<\/code>."}, {"where": "framework", "title": "scikit-learn <code>Pipeline<\/code> / <code>make_pipeline<\/code>", "body": "<code>make_pipeline(SimpleImputer(), StandardScaler(), LogisticRegression())<\/code> chains preprocessing and model so the exact same steps run in training, cross-validation and prediction, which prevents data leakage."}, {"where": "framework", "title": "pandas <code>.pipe()<\/code> and Apache Beam", "body": "<code>df.pipe(clean).pipe(add_features).pipe(aggregate)<\/code> keeps dataframe transformations readable. Beam's Python SDK writes <code>p | ReadFromText(...) | beam.Map(parse) | beam.Filter(...)<\/code> and runs it on Dataflow or Spark."}, {"where": "production", "title": "Log processing and ETL", "body": "Jobs that scan gigabytes of logs or export millions of DB rows stream through parse, filter, enrich and batch-write stages. They run in constant memory and any stage can be unit-tested with a short list."}], "use": ["Large or unbounded data processed in stages", "You want each transformation small, testable and reusable", "ETL, log analysis, data cleaning, ML preprocessing"], "avoid": ["A stage needs all data at once (global sort, median): materialize explicitly there", "Tiny data where a list comprehension is simpler"], "pitfall": "Error handling inside lazy stages: an exception surfaces only when the consumer pulls the bad item, far from where the stage was built. Handle and count bad records inside the stage (as <code>parse<\/code> does) rather than letting one bad line kill a 10-hour job.", "qa": [{"q": "Why use generators for data pipelines?", "a": "<p>They are lazy: each item flows through all stages before the next is read, so memory stays constant, work starts immediately, and you can stop early. Stages are simple functions that are easy to test and combine.<\/p>"}, {"q": "What does <code>yield from<\/code> do?", "a": "<p>Delegates to a sub-iterator, yielding all its values (and passing <code>send<\/code>/<code>throw<\/code> through). It is useful for flattening nested sources, for example reading many files in one stage.<\/p>"}, {"q": "Why use scikit-learn's Pipeline instead of calling steps manually?", "a": "<p>It guarantees preprocessing is fitted only on training folds during cross-validation (no leakage), bundles the whole workflow into one estimator for grid search and deployment, and keeps training and serving identical.<\/p>"}], "related": ["iterator", "chain-of-responsibility", "composite"], "code_out": "  batch 1: INSERT 2 rows -> [('/checkout', 500), ('/search', 500)]\n  batch 2: INSERT 1 rows -> [('/checkout', 502)]\nskipped: {'not an object': 1}", "pythonic_out": "['PUNE', 'BENGALURU']"}, {"id": "lazy", "cat": "pythonic", "name": "Lazy Initialization", "alias": "Delay creating or computing something expensive until it is first needed, then keep it.", "simple": "A hotel doesn't cook breakfast for every room at 6 am. It cooks when a guest orders, and if you order a second coffee, the pot that's already brewed is used. Nobody pays for food that no one eats.", "intent": "<p>Many objects hold expensive parts that aren't always used: an ML model, a parsed config, a DB connection, a big lookup table, a slow import. Lazy initialization creates them on first access and caches the result, which speeds up startup (important for CLIs, serverless functions and tests) and avoids wasted work.<\/p>\n<p>Python tools: <code>functools.cached_property<\/code> (compute once per instance), <code>functools.cache<\/code> (per argument), module-level <code>__getattr__<\/code> (PEP 562) for lazy module attributes and imports, and <code>importlib.util.LazyLoader<\/code>. Thread safety of the first initialization needs attention in multi-threaded servers.<\/p>", "structure": " report.stats   first access -> compute (2 s) -> stored in report.__dict__[\"stats\"]\n report.stats   later access -> plain attribute lookup (ns), no recompute\n del report.stats -> invalidates, next access recomputes", "code": "import time\nfrom functools import cached_property\n\nclass SalesReport:\n    def __init__(self, rows): self.rows = rows\n\n    @cached_property\n    def stats(self):                               # expensive, computed on first access\n        print(\"  computing stats (slow)...\")\n        time.sleep(0.05)\n        totals = [r[\"total\"] for r in self.rows]\n        return {\"count\": len(totals), \"sum\": sum(totals), \"max\": max(totals)}\n\n    @property\n    def average(self):                             # cheap derived value built on the lazy one\n        return self.stats[\"sum\"] / self.stats[\"count\"]\n\nr = SalesReport([{\"total\": t} for t in (120, 80, 400, 250)])\nprint(\"created report (nothing computed yet)\")\nt0 = time.perf_counter(); print(r.stats, f\"{(time.perf_counter() - t0) * 1000:.0f} ms\")\nt0 = time.perf_counter(); print(r.average, f\"{(time.perf_counter() - t0) * 1000:.3f} ms\")\nr.rows.append({\"total\": 1000})\ndel r.stats                                        # invalidate the cache explicitly\nprint(r.stats)", "pythonic": "import sys, types\n\n# PEP 562: module-level __getattr__ makes attributes (or heavy imports) lazy\nmod = types.ModuleType(\"analytics\")\nexec(\"\"\"\n_loaded = {}\ndef __getattr__(name):\n    if name == \"model\":\n        print(\"  loading 500 MB model on first use...\")\n        _loaded[name] = {\"weights\": \"...\"}\n        globals()[name] = _loaded[name]       # cache: next access skips __getattr__\n        return _loaded[name]\n    raise AttributeError(name)\n\"\"\", mod.__dict__)\nsys.modules[\"analytics\"] = mod\n\nimport analytics\nprint(\"imported analytics (fast)\")\nprint(analytics.model); print(analytics.model)   # loads once\n\nimport concurrent.futures as cf                   # the stdlib uses the same trick\nprint(\"ProcessPoolExecutor\" in cf.__dict__, hasattr(cf, \"__getattr__\"))", "pythonic_note": "<code>concurrent.futures<\/code> itself uses a module <code>__getattr__<\/code> so that importing the package doesn't eagerly import the process-pool machinery.", "examples": [{"where": "stdlib", "title": "<code>functools.cached_property<\/code> and <code>functools.cache<\/code>", "body": "<code>cached_property<\/code> stores the computed value in the instance <code>__dict__<\/code> on first access (delete the attribute to invalidate). <code>cache<\/code>/<code>lru_cache<\/code> make any pure function compute each input once."}, {"where": "stdlib", "title": "Module <code>__getattr__<\/code> (PEP 562) and <code>importlib.util.LazyLoader<\/code>", "body": "<code>concurrent.futures<\/code> exposes <code>ProcessPoolExecutor<\/code> and <code>ThreadPoolExecutor<\/code> through a module-level <code>__getattr__<\/code> that imports them on first access. <code>LazyLoader<\/code> defers executing a module until an attribute is touched."}, {"where": "fra
