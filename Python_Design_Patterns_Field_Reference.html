mework", "title": "Django <code>gettext_lazy<\/code>, lazy QuerySets, <code>SimpleLazyObject<\/code>", "body": "Translated strings in models are evaluated when rendered (so the active language is right), QuerySets hit the database only when iterated, and <code>request.user<\/code> loads only if used."}, {"where": "framework", "title": "Scientific CLIs and lazy-loader packages", "body": "scikit-image and other Scientific Python projects adopted the <code>lazy_loader<\/code> package (SPEC 1) so <code>import skimage<\/code> doesn't import every submodule up front, which noticeably cuts import time."}, {"where": "production", "title": "Serverless cold starts and ML services", "body": "AWS Lambda handlers and model-serving APIs load the model or DB client on first request (then reuse it across invocations in the same container), keeping cold starts and unused-code paths cheap."}], "use": ["Expensive resources that aren't always used", "Faster startup for CLIs, tests and serverless functions", "Values derived from immutable data (safe to cache)"], "avoid": ["The value depends on data that changes: the cache goes stale silently", "Failures should surface at startup (bad config), not on the first unlucky request"], "pitfall": "<code>cached_property<\/code> on mutable data: after <code>rows<\/code> changes, <code>stats<\/code> is stale until you <code>del obj.stats<\/code>. Also, first-time initialization can race in threaded servers: guard it with a lock if creation must happen once.", "qa": [{"q": "<code>property<\/code> vs <code>cached_property<\/code>?", "a": "<p><code>property<\/code> recomputes on every access. <code>cached_property<\/code> computes once and stores the result as an instance attribute (it is a non-data descriptor, so the instance attribute then wins). It needs an instance <code>__dict__<\/code>, so it doesn't work with <code>__slots__<\/code>-only classes.<\/p>"}, {"q": "How can you speed up a slow Python CLI start?", "a": "<p>Measure with <code>python -X importtime<\/code>, then move heavy imports inside the functions that need them, use module <code>__getattr__<\/code> or <code>LazyLoader<\/code> for optional submodules, and cache expensive setup lazily.<\/p>"}, {"q": "What are the risks of lazy initialization?", "a": "<p>Unpredictable latency on first use, errors surfacing late, stale caches when underlying data changes, and races on first initialization under concurrency.<\/p>"}], "related": ["proxy", "singleton", "flyweight"], "code_out": "created report (nothing computed yet)\n  computing stats (slow)...\n{'count': 4, 'sum': 850, 'max': 400} 50 ms\n212.5 0.006 ms\n  computing stats (slow)...\n{'count': 5, 'sum': 1850, 'max': 1000}", "pythonic_out": "imported analytics (fast)\n  loading 500 MB model on first use...\n{'weights': '...'}\n{'weights': '...'}\nFalse True"}];

const CATS = {
  creational:{label:'Creational', color:'var(--c-creational)', blurb:'How objects get made'},
  structural:{label:'Structural', color:'var(--c-structural)', blurb:'How objects are composed'},
  behavioral:{label:'Behavioral', color:'var(--c-behavioral)', blurb:'How objects talk and share work'},
  pythonic:  {label:'Pythonic & Architectural', color:'var(--c-pythonic)', blurb:'Idioms Python programmers reach for daily'}
};
const ORDER = ['creational','structural','behavioral','pythonic'];
const WHERE = {stdlib:'STDLIB', framework:'FRAMEWORK', production:'PRODUCTION'};

const DISSOLVE = [
  ['Strategy','Pass a function (or lambda) instead of a strategy class','sorted(data, key=len)','strategy'],
  ['Command','Any callable, functools.partial, or a closure is a command','Button(command=save)','command'],
  ['Iterator','Generators and the iterator protocol are built in','yield row','iterator'],
  ['Singleton','A module is imported once and cached in sys.modules','import config','singleton'],
  ['Decorator','@decorator syntax wraps functions and classes','@functools.lru_cache','decorator'],
  ['Visitor','functools.singledispatch dispatches on argument type','@render.register(Circle)','visitor'],
  ['Template Method','Hook methods on a base class; ABCs enforce them','class H(BaseRequestHandler)','template-method'],
  ['Observer','A list of callbacks; signal libraries (blinker, Django signals)','post_save.connect(fn)','observer'],
  ['Prototype','copy.copy / copy.deepcopy are built in','copy.deepcopy(template)','prototype'],
  ['Factory Method','Classes are callables; classmethods are named constructors','datetime.fromtimestamp(ts)','factory-method'],
];

const PICKER = [
  ['Create one of several related classes chosen at runtime','Factory Method','factory-method'],
  ['Build a complex object step by step (many optional parts)','Builder','builder'],
  ['Copy a configured object instead of constructing it again','Prototype','prototype'],
  ['Reuse expensive resources (connections, threads)','Object Pool','object-pool'],
  ['Make an existing class fit the interface my code expects','Adapter','adapter'],
  ['Add behaviour (logging, caching, retries) without editing the class','Decorator','decorator'],
  ['Give a messy subsystem one simple entry point','Facade','facade'],
  ['Control access to an object (lazy, remote, read-only)','Proxy','proxy'],
  ['Treat single items and groups the same way (trees)','Composite','composite'],
  ['Share memory across millions of similar objects','Flyweight','flyweight'],
  ['Swap an algorithm at runtime','Strategy','strategy'],
  ['Notify many listeners when something changes','Observer','observer'],
  ['Pass a request through a series of handlers','Chain of Responsibility','chain-of-responsibility'],
  ['Queue, log or undo operations','Command','command'],
  ['Behaviour changes with an internal state (workflows)','State','state'],
  ['Fix the algorithm skeleton, let subclasses fill steps','Template Method','template-method'],
  ['Add new operations over a stable tree of types','Visitor','visitor'],
  ['Save and restore an object\'s state (undo, checkpoints)','Memento','memento'],
  ['Guarantee cleanup of a resource','Context Manager','context-manager'],
  ['Make classes discoverable as plugins','Registry / Plugin','registry'],
  ['Make code testable by passing collaborators in','Dependency Injection','dependency-injection'],
  ['Keep domain logic independent of the database','Repository & Unit of Work','repository'],
  ['Process a large stream in stages with little memory','Generator Pipeline','pipeline'],
];

const STORE_KEY = 'pydp-ref-revised';
let revised = new Set();
try { revised = new Set(JSON.parse(localStorage.getItem(STORE_KEY) || '[]')); } catch(e) {}
function saveRevised(){ try { localStorage.setItem(STORE_KEY, JSON.stringify([...revised])); } catch(e) {} }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function strip(s){ return String(s).replace(/<[^>]+>/g,''); }
function byId(id){ return PATTERNS.find(p=>p.id===id); }
function haystack(p){
  return (p.name+' '+p.alias+' '+strip(p.intent)+' '+p.examples.map(e=>e.title+' '+strip(e.body)).join(' ')+' '+p.code+' '+(p.pythonic||'')).toLowerCase();
}

function buildSidebar(filter){
  const q = (filter||'').trim().toLowerCase();
  const box = document.getElementById('navGroups');
  box.innerHTML = '';
  let shown = 0;
  ORDER.forEach(cat=>{
    const all = PATTERNS.filter(p=>p.cat===cat);
    const items = all.filter(p=>!q || haystack(p).includes(q));
    if(!items.length) return;
    shown += items.length;
    const g = document.createElement('div');
    g.className = 'nav-group';
    g.innerHTML = '<div class="nav-group-label"><span class="dot" style="background:'+CATS[cat].color+'"></span>'+CATS[cat].label.toUpperCase()+' ('+all.length+')</div>';
    items.forEach(p=>{
      const el = document.createElement('div');
      el.className = 'nav-item'; el.id = 'nav-'+p.id; el.tabIndex = 0; el.setAttribute('role','link');
      el.innerHTML = '<span class="num">'+String(all.indexOf(p)+1).padStart(2,'0')+'</span><span>'+esc(p.name)+'</span>'+(revised.has(p.id)?'<span class="tick" title="Revised">✓</span>':'');
      el.onclick = ()=>navigate(p.id);
      el.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); navigate(p.id);} };
      g.appendChild(el);
    });
    box.appendChild(g);
  });
  if(!shown) box.innerHTML = '<div class="empty">No patterns match "'+esc(filter)+'".</div>';
  const cur = document.getElementById('nav-'+location.hash.slice(1));
  if(cur) cur.classList.add('active');
  const n = PATTERNS.filter(p=>revised.has(p.id)).length;
  document.getElementById('progressText').textContent = n+' / '+PATTERNS.length+' patterns revised';
  document.getElementById('progressBar').style.width = (100*n/PATTERNS.length)+'%';
}

function link(id,label){ return '<a onclick="navigate(\''+id+'\')">'+label+'</a>'; }

function renderHome(){
  const nEx = PATTERNS.reduce((a,p)=>a+p.examples.length,0);
  const nStd = PATTERNS.reduce((a,p)=>a+p.examples.filter(e=>e.where==='stdlib').length,0);
  const nQa = PATTERNS.reduce((a,p)=>a+p.qa.length,0);
  let h = '<div class="page"><div class="cat-tag"><span class="dot" style="background:var(--accent)"></span>OVERVIEW</div>'+
    '<h2>Python Design Patterns Field Reference</h2>'+
    '<p class="alias">23 Gang-of-Four patterns + Object Pool + 8 patterns Python developers use every day</p>'+
    '<p class="home-intro">Each pattern has a plain-language analogy, a structure sketch, a complete Python program that was actually executed to produce the output shown, the idiomatic shortcut where Python makes the pattern simpler, and real places you can open and read: modules in the standard library, code in Django, Flask, FastAPI, SQLAlchemy, pytest and scikit-learn, and production systems.</p>'+
    '<div class="stats">'+
      '<div class="stat"><div class="n">'+PATTERNS.length+'</div><div class="l">Patterns</div></div>'+
      '<div class="stat"><div class="n">'+nEx+'</div><div class="l">Real-world examples</div></div>'+
      '<div class="stat"><div class="n">'+nStd+'</div><div class="l">Found in the stdlib</div></div>'+
      '<div class="stat"><div class="n">'+nQa+'</div><div class="l">Interview questions</div></div>'+
    '</div>'+
    '<div class="section-label">WHICH PATTERN DO I NEED?</div>'+
    '<div class="table-wrap"><table><thead><tr><th>If you need to…</th><th>Use</th></tr></thead><tbody>'+
    PICKER.map(r=>'<tr><td>'+r[0]+'</td><td>'+link(r[2],r[1])+'</td></tr>').join('')+'</tbody></table></div>'+
    '<div class="section-label">PATTERNS THAT SHRINK IN PYTHON</div>'+
    '<p class="sub">Peter Norvig\'s 1996 talk "Design Patterns in Dynamic Languages" found that 16 of the 23 GoF patterns become simpler or invisible when functions are first-class objects. Interviewers like hearing that you know both forms.</p>'+
    '<div class="table-wrap"><table><thead><tr><th>Pattern</th><th>Python shortcut</th><th>Looks like</th></tr></thead><tbody>'+
    DISSOLVE.map(r=>'<tr><td>'+link(r[3],r[0])+'</td><td>'+r[1]+'</td><td><code>'+esc(r[2])+'</code></td></tr>').join('')+'</tbody></table></div>';
  ORDER.forEach(cat=>{
    h += '<div class="section-label">'+CATS[cat].label.toUpperCase()+' · '+CATS[cat].blurb.toUpperCase()+'</div><div class="home-grid">';
    PATTERNS.filter(p=>p.cat===cat).forEach(p=>{
      h += '<button class="home-card" onclick="navigate(\''+p.id+'\')"><span class="hc-cat" style="color:'+CATS[cat].color+'">'+CATS[cat].label.toUpperCase()+'</span>'+
        '<h3>'+esc(p.name)+(revised.has(p.id)?'<span class="tick">✓</span>':'')+'</h3><p>'+p.alias+'</p></button>';
    });
    h += '</div>';
  });
  return h+'</div>';
}

function codeBlock(code,label,cls,lang){
  const cl = lang ? 'language-'+lang : 'nohighlight';
  return '<div class="code-wrap '+(cls||'')+'"><span class="code-label '+(cls==='out-wrap'?'out':cls==='struct-wrap'?'struct':'')+'">'+label+'</span><pre><code class="'+cl+'">'+esc(code)+'</code></pre></div>';
}

function renderPattern(p){
  const cat = CATS[p.cat];
  const i = PATTERNS.indexOf(p), prev = PATTERNS[i-1], next = PATTERNS[i+1];
  let h = '<div class="page"><div class="cat-tag"><span class="dot" style="background:'+cat.color+'"></span>'+cat.label.toUpperCase()+' PATTERN</div>'+
    '<h2>'+esc(p.name)+'</h2><p class="alias">'+p.alias+'</p>'+
    '<div class="simple"><span class="lbl">IN SIMPLE WORDS</span><p>'+p.simple+'</p></div>'+
    '<div class="section-label">INTENT</div><div class="intent">'+p.intent+'</div>';
  if(p.structure) h += '<div class="section-label">STRUCTURE</div>'+codeBlock(p.structure,'SKETCH','struct-wrap');
  h += '<div class="section-label">PYTHON IMPLEMENTATION</div><div class="code-stack">'+
    codeBlock(p.code,'PYTHON · RUNS AS-IS','', 'python')+
    (p.code_out ? codeBlock(p.code_out,'OUTPUT','out-wrap') : '')+'</div>';
  if(p.pythonic){
    h += '<div class="section-label">THE PYTHONIC SHORTCUT</div>'+(p.pythonic_note?'<p class="sub">'+p.pythonic_note+'</p>':'')+
      '<div class="code-stack">'+codeBlock(p.pythonic,'IDIOMATIC PYTHON','','python')+(p.pythonic_out?codeBlock(p.pythonic_out,'OUTPUT','out-wrap'):'')+'</div>';
  }
  h += '<div class="section-label">WHERE THIS SHOWS UP IN THE REAL WORLD ('+p.examples.length+')</div>'+
    '<div class="ex-legend"><span><span class="dot" style="background:var(--w-stdlib)"></span>Standard library: open it and read the source</span><span><span class="dot" style="background:var(--w-framework)"></span>Popular framework or library</span><span><span class="dot" style="background:var(--w-production)"></span>Production system design</span></div>'+
    '<ul class="examples">'+p.examples.map(e=>'<li><span class="where '+e.where+'">'+WHERE[e.where]+'</span><div><p class="ex-title">'+e.title+'</p><p class="ex-body">'+e.body+'</p></div></li>').join('')+'</ul>';
  h += '<div class="section-label">WHEN TO USE / WHEN TO AVOID</div><div class="tradeoffs">'+
    '<div class="tradeoff-box use"><h4>USE WHEN</h4><ul>'+p.use.map(u=>'<li>'+u+'</li>').join('')+'</ul></div>'+
    '<div class="tradeoff-box avoid"><h4>AVOID WHEN</h4><ul>'+p.avoid.map(a=>'<li>'+a+'</li>').join('')+'</ul></div></div>'+
    '<div class="pitfall"><b>COMMON PITFALL</b>'+p.pitfall+'</div>';
  h += '<div class="section-label">INTERVIEW QUESTIONS ('+p.qa.length+')</div><div class="qa-tools"><button class="btn" id="qaToggle" onclick="toggleQA()">Expand all answers</button></div><div class="qa">'+
    p.qa.map((x,k)=>'<details><summary><span class="q">Q'+(k+1)+'</span><span>'+x.q+'</span><span class="chev">›</span></summary><div class="ans">'+x.a+'</div></details>').join('')+'</div>';
  if(p.related && p.related.length){
    h += '<div class="section-label">RELATED PATTERNS</div><div class="related">'+p.related.map(r=>{const o=byId(r);return '<button class="chip" onclick="navigate(\''+r+'\')"><span class="dot" style="background:'+CATS[o.cat].color+'"></span>'+esc(o.name)+'</button>';}).join('')+'</div>';
  }
  const done = revised.has(p.id);
  h += '<div class="page-actions"><button class="btn'+(done?' done':'')+'" id="revBtn" onclick="toggleRevised(\''+p.id+'\')">'+(done?'✓ Revised':'Mark as revised')+'</button></div>'+
    '<div class="footer-nav">'+(prev?'<button onclick="navigate(\''+prev.id+'\')"><span class="dir">← PREV</span>'+esc(prev.name)+'</button>':'<span></span>')+
    (next?'<button onclick="navigate(\''+next.id+'\')" style="text-align:right"><span class="dir">NEXT →</span>'+esc(next.name)+'</button>':'<span></span>')+'</div></div>';
  return h;
}

function toggleQA(){
  const all=[...document.querySelectorAll('.qa details')], open=all.some(d=>!d.open);
  all.forEach(d=>d.open=open);
  document.getElementById('qaToggle').textContent = open?'Collapse all answers':'Expand all answers';
}
function toggleRevised(id){
  revised.has(id)?revised.delete(id):revised.add(id); saveRevised();
  const b=document.getElementById('revBtn'), d=revised.has(id);
  b.textContent=d?'✓ Revised':'Mark as revised'; b.classList.toggle('done',d);
  buildSidebar(document.getElementById('search').value);
}
function navigate(id){
  const c=document.getElementById('content'), p=byId(id);
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  if(!p){
    c.innerHTML=renderHome(); document.getElementById('crumbCurrent').textContent='Overview';
    if(location.hash) history.replaceState(null,'',location.pathname+location.search);
  } else {
    c.innerHTML=renderPattern(p);
    const n=document.getElementById('nav-'+id); if(n) n.classList.add('active');
    document.getElementById('crumbCurrent').textContent=p.name;
    if(location.hash!=='#'+id) history.replaceState(null,'','#'+id);
    if(window.hljs) c.querySelectorAll('pre code.language-python').forEach(el=>hljs.highlightElement(el));
  }
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));
document.getElementById('search').addEventListener('input',e=>buildSidebar(e.target.value));
buildSidebar();
navigate(location.hash.slice(1));
</script>
