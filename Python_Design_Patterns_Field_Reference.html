<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<title>Python Design Patterns Field Reference</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
.hljs{color:#d8dee9}
.hljs-keyword,.hljs-built_in,.hljs-meta .hljs-keyword{color:#81a1c1}
.hljs-string,.hljs-meta .hljs-string{color:#a3be8c}
.hljs-number,.hljs-literal{color:#b48ead}
.hljs-comment{color:#6f7f99;font-style:italic}
.hljs-title,.hljs-title.function_,.hljs-section{color:#88c0d0}
.hljs-attr,.hljs-attribute,.hljs-property{color:#8fbcbb}
.hljs-type,.hljs-title.class_{color:#8fbcbb}
.hljs-variable,.hljs-params{color:#d8dee9}
.hljs-meta{color:#d08770}
.hljs-subst{color:#d8dee9}

:root{
  color-scheme:dark;
  --bg:#0e2036;
  --bg-panel:#123049;
  --bg-sidebar:#0a1a2c;
  --line:#2f5578;
  --line-soft:#1c3852;
  --accent:#ffd43b;
  --accent-dim:#c9a93a;
  --py-blue:#6aa7de;
  --text:#e7eef6;
  --text-dim:#8fa9c2;
  --text-faint:#6a86a3;
  --code-bg:#081422;
  --good:#9fdf9f;
  --bad:#ff9d9d;
  --c-creational:#7ec8e3;
  --c-structural:#ffb454;
  --c-behavioral:#9fdf9f;
  --c-pythonic:#ffd43b;
  --w-stdlib:#6aa7de;
  --w-framework:#c3a6ff;
  --w-production:#6fd6c6;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
  background-size:28px 28px;background-attachment:fixed;min-height:100vh;
}
::selection{background:var(--accent);color:#0e2036;}
a{color:var(--accent);}
code{font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;}
p code,li code,td code,.ex-body code,.ans code,.intent code,.simple code,.pitfall code{background:rgba(255,255,255,0.07);padding:1px 5px;border-radius:3px;font-size:0.88em;color:#ffe58a;}
.app{display:flex;min-height:100vh;}

.sidebar{width:300px;flex-shrink:0;background:var(--bg-sidebar);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar-header{padding:24px 22px 16px;border-bottom:1px solid var(--line);}
.kicker{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.08em;color:var(--accent);margin:0 0 6px;}
.sidebar-header h1{font-size:19px;margin:0 0 4px;font-weight:600;line-height:1.3;cursor:pointer;}
.sidebar-header p{font-size:12.5px;color:var(--text-dim);margin:0;line-height:1.5;}
.progress{margin-top:12px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);}
.progress-bar{height:4px;background:var(--line-soft);border-radius:2px;margin-top:6px;overflow:hidden;}
.progress-bar span{display:block;height:100%;background:var(--accent);width:0;transition:width .3s;}
.search-box{padding:12px 18px;border-bottom:1px solid var(--line);}
.search-box input{width:100%;background:var(--bg-panel);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:5px;font-family:inherit;font-size:13.5px;outline:none;}
.search-box input:focus{border-color:var(--accent);}
.search-box input::placeholder{color:var(--text-faint);}
.nav-group{padding:12px 0 4px;}
.nav-group-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.1em;padding:6px 22px;color:var(--text-faint);display:flex;align-items:center;gap:8px;}
.dot{width:7px;height:7px;border-radius:1px;display:inline-block;transform:rotate(45deg);flex-shrink:0;}
.nav-item{display:flex;align-items:baseline;gap:10px;padding:7px 22px 7px 30px;cursor:pointer;font-size:14px;color:var(--text-dim);border-left:2px solid transparent;transition:background .12s,color .12s,border-color .12s;}
.nav-item .num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-faint);width:18px;flex-shrink:0;}
.nav-item .tick{margin-left:auto;color:var(--good);font-size:12px;}
.nav-item:hover{background:rgba(255,255,255,0.03);color:var(--text);}
.nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
.nav-item.active{background:rgba(255,212,59,0.08);color:var(--accent);border-left-color:var(--accent);}
.nav-item.active .num{color:var(--accent);}
.empty{color:var(--text-faint);font-size:13px;padding:10px 22px;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{padding:16px 40px;border-bottom:1px solid var(--line);background:rgba(14,32,54,0.9);backdrop-filter:blur(6px);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.crumb{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-faint);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.crumb .sep{margin:0 6px;color:var(--line);}
.crumb .current{color:var(--accent);}
.menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--text);border-radius:5px;padding:6px 10px;cursor:pointer;font-family:'IBM Plex Mono',monospace;flex-shrink:0;}

.content{padding:44px 56px 100px;max-width:940px;}
.page{animation:fadein .25s ease;}
@keyframes fadein{from{opacity:.4;transform:translateY(4px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.page{animation:none;}*{transition:none!important;}}

.cat-tag{display:inline-flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.08em;color:var(--text-dim);border:1px solid var(--line);padding:4px 10px 4px 8px;border-radius:3px;margin-bottom:18px;}
.cat-tag .dot{width:8px;height:8px;}
.page h2{font-size:34px;margin:0 0 6px;font-weight:700;letter-spacing:-0.01em;line-height:1.15;text-wrap:balance;}
.alias{font-family:'IBM Plex Mono',monospace;color:var(--text-faint);font-size:13px;margin:0 0 24px;line-height:1.5;}
.simple{display:flex;gap:14px;align-items:flex-start;background:rgba(159,223,159,0.07);border:1px solid rgba(159,223,159,0.28);border-radius:6px;padding:14px 18px;margin:0 0 22px;}
.simple .lbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.08em;color:var(--good);flex-shrink:0;padding-top:3px;}
.simple p{margin:0;font-size:15px;line-height:1.65;}
.intent{font-size:15.5px;line-height:1.75;margin:0;padding:16px 20px;background:var(--bg-panel);border-left:3px solid var(--accent);border-radius:0 4px 4px 0;}
.intent p{margin:0 0 10px;}
.intent p:last-child{margin:0;}
.section-label{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.1em;color:var(--accent-dim);margin:36px 0 14px;display:flex;align-items:center;gap:10px;}
.section-label::after{content:'';flex:1;height:1px;background:var(--line);}
.sub{font-size:13.5px;color:var(--text-dim);margin:-4px 0 14px;line-height:1.6;}

pre{background:var(--code-bg);border:1px solid var(--line-soft);border-radius:6px;padding:20px 22px;overflow-x:auto;margin:0;}
pre code{font-size:13px;line-height:1.65;background:transparent;}
.code-wrap{position:relative;margin-top:14px;}
.code-label{position:absolute;top:-11px;left:16px;background:var(--accent);color:#0e2036;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.05em;padding:2px 8px;border-radius:3px;}
.code-label.struct{background:var(--c-creational);}
.code-label.out{background:var(--good);}
.out-wrap pre{background:#06101b;border-style:dashed;color:#cfe8cf;}
.out-wrap pre code{font-size:12.5px;}
.struct-wrap pre{color:#bcd3e8;font-size:12.5px;line-height:1.45;}
.struct-wrap pre code{font-size:12.5px;line-height:1.45;}
.code-stack{display:flex;flex-direction:column;gap:22px;margin-top:6px;}

.ex-legend{display:flex;gap:14px;flex-wrap:wrap;margin:-2px 0 14px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);}
.ex-legend span{display:inline-flex;align-items:center;gap:6px;}
.examples{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;}
.examples li{display:flex;gap:14px;padding:14px 16px;background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:6px;}
.where{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;letter-spacing:0.06em;padding:3px 7px;border-radius:3px;color:#0e2036;flex-shrink:0;height:fit-content;margin-top:2px;min-width:84px;text-align:center;}
.where.stdlib{background:var(--w-stdlib);}
.where.framework{background:var(--w-framework);}
.where.production{background:var(--w-production);}
.ex-title{font-weight:600;font-size:14.5px;margin:0 0 3px;}
.ex-body{font-size:13.5px;color:var(--text-dim);line-height:1.6;margin:0;}

.tradeoffs{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.tradeoff-box{padding:14px 16px;border-radius:6px;border:1px solid var(--line-soft);background:var(--bg-panel);}
.tradeoff-box h4{margin:0 0 8px;font-size:12px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.06em;}
.tradeoff-box.use h4{color:var(--good);}
.tradeoff-box.avoid h4{color:var(--bad);}
.tradeoff-box ul{margin:0;padding-left:16px;font-size:13.5px;color:var(--text-dim);line-height:1.6;}
.pitfall{margin-top:16px;padding:12px 16px;border:1px solid rgba(255,157,157,0.35);background:rgba(255,157,157,0.06);border-radius:6px;font-size:14px;line-height:1.6;}
.pitfall b{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.06em;color:var(--bad);margin-right:8px;}

.qa{display:flex;flex-direction:column;gap:10px;}
.qa details{background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:6px;}
.qa details[open]{border-color:var(--line);}
.qa summary{cursor:pointer;padding:13px 16px;font-weight:600;font-size:14.5px;list-style:none;display:flex;gap:12px;align-items:baseline;}
.qa summary::-webkit-details-marker{display:none;}
.qa summary .q{font-family:'IBM Plex Mono',monospace;color:var(--py-blue);font-size:12px;flex-shrink:0;}
.qa summary .chev{margin-left:auto;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;transition:transform .15s;}
.qa details[open] summary .chev{transform:rotate(90deg);}
.qa summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px;}
.qa .ans{padding:0 16px 14px 46px;font-size:14px;line-height:1.7;color:var(--text-dim);}
.qa .ans p{margin:0 0 8px;}
.qa .ans p:last-child{margin:0;}

.related{display:flex;gap:8px;flex-wrap:wrap;}
.chip{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:6px 11px;border-radius:14px;border:1px solid var(--line);background:var(--bg-panel);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
.chip:hover,.chip:focus-visible{border-color:var(--accent);color:var(--accent);outline:none;}
.btn{background:var(--bg-panel);border:1px solid var(--line);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px 14px;border-radius:5px;cursor:pointer;transition:border-color .15s,color .15s;}
.btn:hover,.btn:focus-visible{border-color:var(--accent);color:var(--accent);outline:none;}
.btn.done{border-color:var(--good);color:var(--good);}
.page-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:40px;}
.qa-tools{margin-bottom:10px;}

.footer-nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:24px;border-top:1px solid var(--line-soft);}
.footer-nav button{background:var(--bg-panel);border:1px solid var(--line);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:10px 16px;border-radius:5px;cursor:pointer;transition:border-color .15s,color .15s;max-width:48%;text-align:left;}
.footer-nav button:hover,.footer-nav button:focus-visible{border-color:var(--accent);color:var(--accent);outline:none;}
.footer-nav .dir{color:var(--text-faint);font-size:10px;display:block;}

.table-wrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:6px;background:var(--bg-panel);}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px;}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.5;}
th{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.06em;color:var(--accent);background:rgba(0,0,0,0.15);font-weight:600;}
td{color:var(--text-dim);}
td:first-child{color:var(--text);}
tr:last-child td{border-bottom:none;}
td a{cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--accent);}

.home-intro{font-size:16px;line-height:1.7;color:var(--text-dim);max-width:70ch;margin:0;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:22px;}
.stat{background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:6px;padding:12px 14px;}
.stat .n{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;}
.stat .l{font-size:12px;color:var(--text-dim);margin-top:2px;}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.home-card{background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:6px;padding:14px 16px;cursor:pointer;transition:border-color .15s,transform .15s;text-align:left;color:var(--text);font:inherit;}
.home-card:hover,.home-card:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none;}
.hc-cat{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.06em;}
.home-card h3{margin:6px 0 5px;font-size:15px;display:flex;gap:6px;align-items:baseline;}
.home-card h3 .tick{color:var(--good);font-size:12px;margin-left:auto;}
.home-card p{margin:0;font-size:12.5px;color:var(--text-dim);line-height:1.5;}

@media(max-width:900px){
  .sidebar{position:fixed;left:-310px;z-index:20;transition:left .2s;box-shadow:8px 0 24px rgba(0,0,0,0.4);height:100%;padding-top:env(safe-area-inset-top,0px);}
  .sidebar.open{left:0;}
  .content{padding:30px 16px 80px;}
  .topbar{padding:12px 16px;}
  .tradeoffs{grid-template-columns:1fr;}
  .menu-btn{display:inline-block;}
  .page h2{font-size:27px;}
  .qa .ans{padding-left:16px;}
  .simple{flex-direction:column;gap:6px;}
  .examples li{flex-direction:column;gap:8px;}
}
</style>

<script>
const PATTERNS = [{"id": "singleton", "cat": "creational", "name": "Singleton", "alias": "Exactly one instance of a class, with a global access point.", "simple": "A country has one president at a time. Everyone who says \"call the president\" reaches the same person. Asking for a \"new\" president while one is in office just gives you the current one.", "intent": "<p>Guarantee a class has a single instance and give everyone the same way to reach it. Typical uses are objects that model something unique: the app's configuration, a process-wide cache, a hardware device handle.<\/p>\n<p>In Python the cleanest singleton is usually <b>a module<\/b>: modules run once and are cached in <code>sys.modules<\/code>, so every <code>import config<\/code> returns the same object. When you need a class (for lazy creation or subclassing), override <code>__new__<\/code> or use a metaclass, and add a lock if threads may race on first creation.<\/p>", "structure": "  caller A --.                      +---------------------+\n             +--> AppConfig() ----> | _instance (cached)  |  <- created once\n  caller B --'   (same object)      +---------------------+", "code": "import threading\n\nclass SingletonMeta(type):\n    \"\"\"Metaclass: every class using it gets exactly one instance.\"\"\"\n    _instances = {}\n    _lock = threading.Lock()\n\n    def __call__(cls, *args, **kwargs):\n        if cls not in cls._instances:              # fast path, no lock\n            with cls._lock:                        # double-checked locking\n                if cls not in cls._instances:\n                    cls._instances[cls] = super().__call__(*args, **kwargs)\n        return cls._instances[cls]\n\nclass AppConfig(metaclass=SingletonMeta):\n    def __init__(self):\n        print(\"loading config once...\")\n        self.settings = {\"db_url\": \"postgres://db/prod\", \"debug\": False}\n\ndef worker(results):\n    results.append(id(AppConfig()))\n\nresults = []\nthreads = [threading.Thread(target=worker, args=(results,)) for _ in range(8)]\nfor t in threads: t.start()\nfor t in threads: t.join()\n\nprint(\"distinct instances across 8 threads:\", len(set(results)))\na, b = AppConfig(), AppConfig()\nb.settings[\"debug\"] = True\nprint(\"a is b:\", a is b, \"| a sees b's change:\", a.settings[\"debug\"])", "pythonic": "# config.py would normally be its own file; we fake that with types.ModuleType\nimport sys, types\n\nconfig = types.ModuleType(\"config\")\nconfig.settings = {\"db_url\": \"postgres://db/prod\"}\nsys.modules[\"config\"] = config           # what the import system does on first import\n\nimport config as c1                      # anywhere in the program...\nimport config as c2                      # ...always the same module object\nc1.settings[\"debug\"] = True\nprint(c1 is c2, c2.settings)\n\n# The standard library does this too: module-level functions share one hidden instance\nimport random\nprint(random.random.__self__ is random.randint.__self__)   # both bound to random._inst", "pythonic_note": "Most Python code never writes a singleton class. A module is already a singleton, and the standard library uses exactly this trick.", "examples": [{"where": "stdlib", "title": "<code>None<\/code>, <code>True<\/code>, <code>False<\/code>, <code>Ellipsis<\/code>, <code>NotImplemented<\/code>", "body": "The interpreter creates each of these once. That is why <code>x is None<\/code> is the correct test: there is only one <code>None<\/code> object to compare identity with."}, {"where": "stdlib", "title": "<code>random<\/code> module's hidden instance", "body": "<code>random.py<\/code> creates <code>_inst = Random()<\/code> at import and binds <code>random()<\/code>, <code>randint()<\/code>, <code>shuffle()<\/code> and friends to it. Calling <code>random.seed(42)<\/code> therefore affects every caller in the process."}, {"where": "stdlib", "title": "<code>logging.getLogger(name)<\/code>", "body": "Returns the same Logger object for the same name every time (a per-name singleton, sometimes called a Multiton). Configure <code>getLogger('payments')<\/code> once in <code>main<\/code> and every module that asks for it gets the configured logger."}, {"where": "framework", "title": "Django <code>settings<\/code>", "body": "<code>django.conf.settings<\/code> is one module-level <code>LazySettings<\/code> instance. It loads your settings module on first attribute access and every app reads from that one object."}, {"where": "production", "title": "Per-process clients: DB engine, Redis, boto3 session", "body": "Web services create one SQLAlchemy <code>Engine<\/code> or Redis client per process and share it, because each owns a connection pool. Creating one per request exhausts database connections under load."}], "use": ["The domain really has one of something (config, device handle, process-wide registry)", "An expensive shared resource must be created once per process (connection pool, loaded ML model)"], "avoid": ["You only want to avoid passing an argument around: that is a hidden global and makes tests share state", "You need different instances in tests or per tenant; inject the object instead", "Across processes: each worker process (gunicorn, multiprocessing) gets its own copy"], "pitfall": "Overriding <code>__new__<\/code> but not <code>__init__<\/code>: <code>__init__<\/code> still runs on every <code>AppConfig()<\/code> call and silently resets state. The metaclass version above avoids this because <code>__call__<\/code> skips both.", "qa": [{"q": "How do you implement a singleton in Python? Which way do you prefer?", "a": "<p>Options: a module (simplest, preferred), overriding <code>__new__<\/code>, a metaclass overriding <code>__call__<\/code>, or a decorator that caches the instance. I prefer a module, or a metaclass when I need a class with lazy init. Add a lock for thread-safe first creation.<\/p>"}, {"q": "Is a singleton thread-safe in Python?", "a": "<p>Module import is protected by the import lock, so module singletons are safe. A class-based singleton can race on first creation (two threads both see no instance). Use double-checked locking with <code>threading.Lock<\/code> as shown. Note that free-threaded Python (3.13t+, no GIL) makes this even more important.<\/p>"}, {"q": "Why do many people call Singleton an anti-pattern?", "a": "<p>It is global mutable state: hidden dependencies, order-dependent tests, and hard-to-replace collaborators. The fix is usually dependency injection: create one instance at startup and pass it in.<\/p>"}], "related": ["lazy", "object-pool", "dependency-injection", "flyweight"], "code_out": "loading config once...\ndistinct instances across 8 threads: 1\na is b: True | a sees b's change: True", "pythonic_out": "True {'db_url': 'postgres://db/prod', 'debug': True}\nTrue"}, {"id": "factory-method", "cat": "creational", "name": "Factory Method", "alias": "Let a method (often overridable) decide which concrete class to instantiate.", "simple": "You order \"a coffee\" at the counter. You don't go into the kitchen and pick the machine. The barista (factory) decides whether it comes from the espresso machine or the filter pot based on what you asked.", "intent": "<p>Callers ask for an object through a method instead of calling a concrete class directly. The method (or a subclass override of it) decides the concrete type. This decouples client code from the classes it uses and gives you one place to change the decision.<\/p>\n<p>In Python, two forms are everywhere: <b>overridable hook methods<\/b> such as <code>get_serializer_class()<\/code> in a base class, and <b>alternate constructors<\/b> as <code>@classmethod<\/code>s such as <code>datetime.fromtimestamp()<\/code>. A plain function that returns different classes is a simple factory and is fine for most code.<\/p>", "structure": " Exporter (base)                    create_writer() is the factory method\n   export(): w = self.create_writer(); w.write(rows)\n       ^                      ^\n CsvExporter              JsonExporter\n   create_writer()->CsvWriter   create_writer()->JsonWriter", "code": "import csv, io, json\nfrom abc import ABC, abstractmethod\n\nclass Exporter(ABC):\n    \"\"\"export() is fixed; subclasses decide WHICH writer to create.\"\"\"\n    def export(self, rows):\n        out = io.StringIO()\n        writer = self.create_writer(out)          # <-- factory method\n        writer(rows)\n        return out.getvalue()\n\n    @abstractmethod\n    def create_writer(self, out): ...\n\nclass CsvExporter(Exporter):\n    def create_writer(self, out):\n        def write(rows):\n            w = csv.DictWriter(out, fieldnames=rows[0].keys(), lineterminator=\"\\n\")\n            w.writeheader(); w.writerows(rows)\n        return write\n\nclass JsonExporter(Exporter):\n    def create_writer(self, out):\n        return lambda rows: json.dump(rows, out)\n\nEXPORTERS = {\"csv\": CsvExporter, \"json\": JsonExporter}\n\ndef exporter_for(fmt: str) -> Exporter:         # simple factory keyed by config\n    return EXPORTERS[fmt]()\n\nrows = [{\"sku\": \"A1\", \"qty\": 3}, {\"sku\": \"B7\", \"qty\": 1}]\nfor fmt in (\"csv\", \"json\"):\n    print(f\"--- {fmt}\")\n    print(exporter_for(fmt).export(rows).strip())", "pythonic": "from datetime import datetime, timezone\nfrom dataclasses import dataclass\n\n@dataclass\nclass Money:\n    cents: int\n    currency: str\n\n    @classmethod                               # alternate constructor = named factory\n    def from_string(cls, text: str) -> \"Money\":\n        amount, cur = text.split()\n        return cls(round(float(amount) * 100), cur)\n\nprint(Money.from_string(\"19.99 USD\"))\nprint(datetime.fromtimestamp(0, tz=timezone.utc))   # stdlib alternate constructor\nprint(dict.fromkeys([\"a\", \"b\"], 0))                 # another one\nprint(int.from_bytes(b\"\\x01\\x00\", \"little\"))", "pythonic_note": "Classes are callables, so a dict of classes is already a factory. For different input formats, add <code>@classmethod<\/code> alternate constructors named <code>from_*<\/code>.", "examples": [{"where": "stdlib", "title": "<code>pathlib.Path(...)<\/code>", "body": "Calling <code>Path('data.csv')<\/code> returns a <code>WindowsPath<\/code> on Windows and a <code>PosixPath<\/code> elsewhere. <code>Path.__new__<\/code> picks the concrete class so your code never has to."}, {"where": "stdlib", "title": "Alternate constructors: <code>datetime.fromisoformat<\/code>, <code>dict.fromkeys<\/code>, <code>int.from_bytes<\/code>", "body": "Classmethods named <code>from_*<\/code> are the standard Python idiom for \"another way to build this object\". <code>Decimal.from_float<\/code> and <code>bytes.fromhex<\/code> follow it too."}, {"where": "stdlib", "title": "<code>logging.setLogRecordFactory()<\/code>", "body": "Logging creates every record through a replaceable factory. Services use it to attach a request ID or tenant ID to every <code>LogRecord<\/code> without touching any logging call."}, {"where": "framework", "title": "Django REST Framework <code>get_serializer_class()<\/code>", "body": "<code>GenericAPIView<\/code> calls this hook to pick the serializer. A viewset overrides it to return a light <code>OrderListSerializer<\/code> for list views and a detailed one for retrieve, while the base class keeps all request handling."}, {"where": "framework", "title": "Django <code>Manager.get_queryset()<\/code> and <code>FormMixin.get_form_class()<\/code>", "body": "Custom managers override <code>get_queryset()<\/code> (for example to hide soft-deleted rows); class-based views override <code>get_form_class()<\/code> to choose a form per user role."}], "use": ["The exact class depends on config, input or platform", "A framework base class must let subclasses choose a collaborator", "An object can be built from several input formats (<code>from_json<\/code>, <code>from_row<\/code>)"], "avoid": ["There is only one concrete type; call the class", "A deep class hierarchy only to pick between two classes: a dict or a function is enough"], "pitfall": "Growing an <code>if/elif<\/code> chain inside the factory for every new type. Use a registry dict (or <code>__init_subclass__<\/code> registration) so adding a type does not edit the factory.", "qa": [{"q": "Factory Method vs simple factory vs Abstract Factory?", "a": "<p><b>Simple factory<\/b>: a function/dict returning one of several classes. <b>Factory Method<\/b>: an overridable method in a base class; subclasses decide the product. <b>Abstract Factory<\/b>: an object that creates a whole family of related products that must match.<\/p>"}, {"q": "What is an alternate constructor in Python?", "a": "<p>A <code>@classmethod<\/code> that builds an instance from a different input, returning <code>cls(...)<\/code>. Because it uses <code>cls<\/code>, subclasses automatically get instances of the subclass. Examples: <code>datetime.fromtimestamp<\/code>, <code>dict.fromkeys<\/code>.<\/p>"}, {"q": "Why use <code>cls(...)<\/code> instead of the class name inside a classmethod factory?", "a": "<p>So the factory respects inheritance: <code>SubMoney.from_string()<\/code> returns a <code>SubMoney<\/code>, not the base class.<\/p>"}], "related": ["abstract-factory", "registry", "template-method", "prototype"], "code_out": "--- csv\nsku,qty\nA1,3\nB7,1\n--- json\n[{\"sku\": \"A1\", \"qty\": 3}, {\"sku\": \"B7\", \"qty\": 1}]", "pythonic_out": "Money(cents=1999, currency='USD')\n1970-01-01 00:00:00+00:00\n{'a': 0, 'b': 0}\n1"}, {"id": "abstract-factory", "cat": "creational", "name": "Abstract Factory", "alias": "Create families of related objects that must be used together, without naming concrete classes.", "simple": "IKEA sells furniture in styles. If you pick the \"Scandinavian\" catalogue, the chair, table and lamp all match. You never end up with a Scandinavian chair and a Baroque table because you only ever order from one catalogue at a time.", "intent": "<p>An abstract factory is an object with several creation methods (<code>create_queue()<\/code>, <code>create_storage()<\/code>, ...). Each concrete factory returns a <b>matching set<\/b> of products. Client code receives one factory and never mixes families by accident.<\/p>\n<p>Use it when products come in families: one per cloud provider, per database backend, per UI theme, or \"real\" vs \"fake\" for tests.<\/p>", "structure": " CloudFactory:  create_storage()  create_queue()\n     |                        |\n AwsFactory -> S3Storage, SqsQueue\n LocalFactory -> DiskStorage, MemoryQueue      (for tests / laptops)\n app code:  f = factory_for(env);  f.create_storage().put(...)", "code": "from abc import ABC, abstractmethod\nfrom collections import deque\n\n# ---- product interfaces\nclass Storage(ABC):\n    @abstractmethod\n    def put(self, key, data): ...\nclass Queue(ABC):\n    @abstractmethod\n    def send(self, msg): ...\n\n# ---- family 1: \"cloud\" (stubs that just print)\nclass S3Storage(Storage):\n    def put(self, key, data): print(f\"S3 PUT s3://bucket/{key} ({len(data)} bytes)\")\nclass SqsQueue(Queue):\n    def send(self, msg): print(f\"SQS send -> {msg}\")\n\n# ---- family 2: local, used in tests and on laptops\nclass DiskStorage(Storage):\n    def __init__(self): self.files = {}\n    def put(self, key, data): self.files[key] = data; print(f\"disk write {key}\")\nclass MemoryQueue(Queue):\n    def __init__(self): self.q = deque()\n    def send(self, msg): self.q.append(msg); print(f\"memory queue size={len(self.q)}\")\n\n# ---- the abstract factory and its concrete factories\nclass InfraFactory(ABC):\n    @abstractmethod\n    def create_storage(self) -> Storage: ...\n    @abstractmethod\n    def create_queue(self) -> Queue: ...\n\nclass AwsFactory(InfraFactory):\n    def create_storage(self): return S3Storage()\n    def create_queue(self): return SqsQueue()\n\nclass LocalFactory(InfraFactory):\n    def create_storage(self): return DiskStorage()\n    def create_queue(self): return MemoryQueue()\n\ndef upload_invoice(factory: InfraFactory, invoice_id: str, pdf: bytes):\n    \"\"\"Business code: knows nothing about AWS or disks.\"\"\"\n    factory.create_storage().put(f\"invoices/{invoice_id}.pdf\", pdf)\n    factory.create_queue().send({\"event\": \"InvoiceStored\", \"id\": invoice_id})\n\nfor env, factory in {\"prod\": AwsFactory(), \"test\": LocalFactory()}.items():\n    print(f\"[{env}]\"); upload_invoice(factory, \"INV-42\", b\"%PDF-1.7 ...\")", "examples": [{"where": "stdlib", "title": "<code>xml.dom<\/code> implementations", "body": "<code>xml.dom.getDOMImplementation()<\/code> returns an implementation object whose <code>createDocument()<\/code> and <code>createDocumentType()<\/code> build nodes that belong together (minidom nodes only work with minidom documents)."}, {"where": "framework", "title": "Django database backends", "body": "Each backend's <code>DatabaseWrapper<\/code> declares a family: <code>ops_class<\/code>, <code>features_class<\/code>, <code>introspection_class<\/code>, <code>creation_class<\/code>, <code>client_class<\/code>. Switching <code>ENGINE<\/code> from PostgreSQL to SQLite swaps the whole matching set."}, {"where": "framework", "title": "SQLAlchemy dialects", "body": "A <code>Dialect<\/code> supplies a matching SQL compiler, DDL compiler, type compiler and identifier preparer. The PostgreSQL dialect's pieces all agree on quoting and types; you never get a MySQL compiler with a PostgreSQL type map."}, {"where": "production", "title": "Multi-cloud or on-prem products", "body": "Products sold to customers on AWS, Azure and on-prem ship an <code>AwsFactory<\/code>, <code>AzureFactory<\/code> and <code>OnPremFactory<\/code> producing storage, queue and secrets clients. The business logic has no cloud-specific imports."}, {"where": "production", "title": "Test doubles for a hardware abstraction layer", "body": "Firmware test rigs swap a <code>RealDeviceFactory<\/code> (NVMe controller, power relay, UART) for a <code>SimulatedDeviceFactory<\/code>, so the same test scripts run in CI without hardware."}], "use": ["Objects come in families that must match (cloud provider, DB backend, theme)", "You want one switch to change the whole environment (prod vs local vs test)"], "avoid": ["Only one product type varies: use Factory Method", "Families rarely change; every new product type means editing every factory"], "pitfall": "Creating the factory deep inside business code (<code>AwsFactory()<\/code> inline). Pick the factory once at startup from config and pass it in, or the abstraction buys nothing.", "qa": [{"q": "When would you choose Abstract Factory over Factory Method?", "a": "<p>When you must create <b>several related products<\/b> that have to be consistent with each other. Factory Method varies one product through subclassing; Abstract Factory varies a whole family through composition (you pass in a factory object).<\/p>"}, {"q": "What is the main drawback?", "a": "<p>Adding a new <b>product type<\/b> (say <code>create_cache()<\/code>) forces a change to the interface and every concrete factory. Adding a new <b>family<\/b> is easy.<\/p>"}, {"q": "How does this help testing?", "a": "<p>Tests pass a factory that returns in-memory fakes, so the code under test runs without network or cloud credentials and still exercises the same paths.<\/p>"}], "related": ["factory-method", "dependency-injection", "bridge"], "code_out": "[prod]\nS3 PUT s3://bucket/invoices/INV-42.pdf (12 bytes)\nSQS send -> {'event': 'InvoiceStored', 'id': 'INV-42'}\n[test]\ndisk write invoices/INV-42.pdf\nmemory queue size=1"}, {"id": "builder", "cat": "creational", "name": "Builder", "alias": "Construct a complex object step by step; the same steps can produce different results.", "simple": "At a sandwich counter you say: \"wheat bread, add chicken, add cheese, no onions, toast it\". Each step adds something, and at the end they hand you the finished sandwich. Nobody makes you shout all 12 choices in one breath.", "intent": "<p>A builder collects configuration through small, readable steps and produces the final object with <code>build()<\/code> (or <code>prepare()<\/code>, <code>compile()<\/code>). It avoids constructors with a dozen optional arguments, lets you validate the whole thing at the end, and can keep the product immutable.<\/p>\n<p>Python's keyword arguments and dataclasses remove much of the need for simple cases. Builders still earn their place when construction is <b>incremental<\/b> (built across several functions), <b>conditional<\/b>, or produces text/structures such as SQL queries, HTTP requests and emails. The chained style (<code>.where().order_by()<\/code>) is called a fluent interface.<\/p>", "structure": " QueryBuilder(\"orders\")\n   .where(\"status = ?\", \"PAID\")     each call records a part,\n   .where(\"total > ?\", 100)         returns self (or a new builder)\n   .order_by(\"created_at DESC\")\n   .limit(10)\n   .build()  -> (sql_string, params)   validated, final product", "code": "class QueryBuilder:\n    \"\"\"Builds a parameterised SELECT; each method returns a NEW builder (immutable).\"\"\"\n    def __init__(self, table, cols=(\"*\",), wheres=(), params=(), order=None, lim=None):\n        self.table, self.cols, self.wheres = table, cols, wheres\n        self.params, self.order, self.lim = params, order, lim\n\n    def _copy(self, **kw):\n        d = dict(table=self.table, cols=self.cols, wheres=self.wheres,\n                 params=self.params, order=self.order, lim=self.lim)\n        d.update(kw)\n        return QueryBuilder(**d)\n\n    def select(self, *cols):        return self._copy(cols=cols)\n    def where(self, cond, *vals):   return self._copy(wheres=self.wheres + (cond,), params=self.params + vals)\n    def order_by(self, clause):     return self._copy(order=clause)\n    def limit(self, n):\n        if n <= 0: raise ValueError(\"limit must be positive\")\n        return self._copy(lim=n)\n\n    def build(self):\n        sql = f\"SELECT {', '.join(self.cols)} FROM {self.table}\"\n        if self.wheres: sql += \" WHERE \" + \" AND \".join(self.wheres)\n        if self.order:  sql += f\" ORDER BY {self.order}\"\n        if self.lim:    sql += f\" LIMIT {self.lim}\"\n        return sql, list(self.params)\n\nbase = QueryBuilder(\"orders\").select(\"id\", \"total\").where(\"status = ?\", \"PAID\")\n\n# built incrementally, maybe in different functions, based on user filters\nrecent_big = base.where(\"total > ?\", 100).order_by(\"created_at DESC\").limit(10)\nprint(recent_big.build())\nprint(base.build())          # base is unchanged: safe to reuse", "pythonic": "from dataclasses import dataclass, field, replace\n\n@dataclass(frozen=True)\nclass HttpRequest:                      # for simple cases, keywords + defaults ARE the builder\n    url: str\n    method: str = \"GET\"\n    headers: dict = field(default_factory=dict)\n    timeout: float = 5.0\n\nreq = HttpRequest(\"https://api.example.com/orders\", method=\"POST\",\n                  headers={\"Content-Type\": \"application/json\"})\nretry = replace(req, timeout=10.0)      # \"modify\" a frozen object -> new object\nprint(req); print(retry.timeout)\n\n# stdlib builder: email.message.EmailMessage\nfrom email.message import EmailMessage\nmsg = EmailMessage()\nmsg[\"Subject\"] = \"Invoice INV-42\"\nmsg[\"To\"] = \"billing@example.com\"\nmsg.set_content(\"Please find the invoice attached.\")\nmsg.add_attachment(b\"%PDF-1.7\", maintype=\"application\", subtype=\"pdf\", filename=\"INV-42.pdf\")\nprint(msg.is_multipart(), [p.get_content_type() for p in msg.iter_parts()])", "pythonic_note": "For plain objects, keyword arguments with defaults plus <code>dataclasses.replace()<\/code> replace a builder. The stdlib's <code>EmailMessage<\/code> is a real builder for MIME messages.", "examples": [{"where": "stdlib", "title": "<code>email.message.EmailMessage<\/code>", "body": "You set headers, call <code>set_content()<\/code>, then <code>add_attachment()<\/code> as many times as needed; the object turns itself into a correct multipart MIME structure. Building MIME by hand is famously error-prone."}, {"where": "stdlib", "title": "<code>argparse.ArgumentParser<\/code>", "body": "A parser is assembled with repeated <code>add_argument()<\/code>, <code>add_subparsers()<\/code> and <code>add_mutually_exclusive_group()<\/code> calls, then <code>parse_args()<\/code> produces the result."}, {"where": "framework", "title": "SQLAlchemy <code>select(...).where(...).order_by(...)<\/code>", "body": "Each call returns a new statement object (SQLAlchemy calls this \"generative\"), so a base query can be shared and extended safely. Compilation to SQL happens at the end, per dialect."}, {"where": "framework", "title": "requests <code>Request(...).prepare()<\/code>", "body": "<code>requests.Request<\/code> collects method, URL, headers, params, JSON and auth; <code>prepare()<\/code> builds the final <code>PreparedRequest<\/code> with encoded body and headers, which the session then sends."}, {"where": "framework", "title": "Django QuerySet chaining", "body": "<code>Order.objects.filter(status='PAID').exclude(total=0).order_by('-created')[:10]<\/code> builds a query step by step. No SQL runs until you iterate, which is why chains can be passed between functions."}], "use": ["Construction has many optional or conditional steps", "The object is assembled across several functions", "The product is text or a structure that must be valid as a whole (SQL, HTTP, MIME, config)"], "avoid": ["A dataclass with keyword defaults already reads clearly", "A mutable builder shared across callers: one caller's <code>.where()<\/code> leaks into another's query"], "pitfall": "Mutable builders that return <code>self<\/code>: reusing a partially built object in two places silently mixes both configurations. Return a new builder per step (like SQLAlchemy) or document single use.", "qa": [{"q": "Why do you need Builder less often in Python than in Java or C++?", "a": "<p>Keyword arguments with defaults, <code>dataclasses<\/code> and <code>replace()<\/code> already give readable construction with optional parameters. Builder is kept for incremental, conditional or validated construction.<\/p>"}, {"q": "What is a fluent interface?", "a": "<p>An API where each method returns an object (self or a new one) so calls chain: <code>q.where(...).order_by(...).limit(10)<\/code>. Builders are the most common place you see it.<\/p>"}, {"q": "Builder vs Factory?", "a": "<p>A factory decides <b>which<\/b> class to create, in one call. A builder decides <b>how<\/b> one complex object is assembled, over several calls.<\/p>"}], "related": ["prototype", "facade", "factory-method"], "code_out": "('SELECT id, total FROM orders WHERE status = ? AND total > ? ORDER BY created_at DESC LIMIT 10', ['PAID', 100])\n('SELECT id, total FROM orders WHERE status = ?', ['PAID'])", "pythonic_out": "HttpRequest(url='https://api.example.com/orders', method='POST', headers={'Content-Type': 'application/json'}, timeout=5.0)\n10.0\nTrue ['text/plain', 'application/pdf']"}, {"id": "prototype", "cat": "creational", "name": "Prototype", "alias": "Create new objects by copying a fully configured existing object.", "simple": "A teacher prepares one perfect worksheet, then photocopies it for 40 students. Each student writes on their own copy, and the original stays clean for next year.", "intent": "<p>When an object is expensive or fiddly to set up, configure it once (the prototype) and clone it whenever you need another. The clone can then be adjusted without touching the original.<\/p>\n<p>Python has this built in: <code>copy.copy()<\/code> (shallow) and <code>copy.deepcopy()<\/code> (recursive), customizable with <code>__copy__<\/code> / <code>__deepcopy__<\/code>. <code>dataclasses.replace()<\/code> and, since 3.13, <code>copy.replace()<\/code> create a copy with some fields changed. The key decision is <b>shallow vs deep<\/b>: a shallow copy shares nested lists and dicts with the original.<\/p>", "structure": " prototype = EnemyTemplate(mesh, stats, ai)   <- configured once (expensive)\n e1 = copy.deepcopy(prototype); e1.pos = (3, 4)\n e2 = copy.deepcopy(prototype); e2.pos = (9, 1)   independent clones", "code": "import copy\n\nclass ReportTemplate:\n    def __init__(self, title, sections, style):\n        self.title = title\n        self.sections = sections          # nested list: the shallow/deep trap\n        self.style = style\n    def __repr__(self):\n        return f\"<{self.title}: {self.sections}>\"\n\nbase = ReportTemplate(\"Monthly\", [\"Summary\", \"Revenue\"], {\"font\": \"Inter\", \"logo\": \"acme.png\"})\n\nshallow = copy.copy(base)\nshallow.title = \"March (shallow)\"\nshallow.sections.append(\"Churn\")         # mutates the SHARED list\nprint(\"after shallow edit, base:\", base)\n\nbase.sections.remove(\"Churn\")\ndeep = copy.deepcopy(base)\ndeep.title = \"March (deep)\"\ndeep.sections.append(\"Churn\")            # its own list\nprint(\"after deep edit, base:   \", base)\nprint(\"deep copy:              \", deep)\n\nclass Connection:\n    def __init__(self, dsn): self.dsn, self.sock = dsn, object()  # pretend socket\n    def __deepcopy__(self, memo):\n        # never clone live resources: make a fresh connection instead\n        return Connection(self.dsn)\n\nc = Connection(\"db://prod\")\nprint(\"socket shared?\", copy.deepcopy(c).sock is c.sock)", "pythonic": "from dataclasses import dataclass, replace\nimport copy\n\n@dataclass(frozen=True)\nclass RetryPolicy:\n    attempts: int = 3\n    backoff: float = 0.2\n    retry_on: tuple = (502, 503, 504)\n\nDEFAULT = RetryPolicy()                              # the prototype\npayments = replace(DEFAULT, attempts=5)              # clone + change\nprint(payments)\nprint(copy.replace(DEFAULT, backoff=1.0))            # Python 3.13+: works for dataclasses, namedtuples...", "pythonic_note": "For immutable value objects, <code>dataclasses.replace()<\/code> (or <code>copy.replace()<\/code> on 3.13+) is the prototype pattern in one line.", "examples": [{"where": "stdlib", "title": "<code>copy<\/code> module, <code>__copy__<\/code> / <code>__deepcopy__<\/code>", "body": "The standard protocol for cloning. <code>deepcopy<\/code> keeps a <code>memo<\/code> dict so shared references and cycles are copied once and stay shared inside the clone."}, {"where": "stdlib", "title": "<code>dataclasses.replace()<\/code> and <code>copy.replace()<\/code>", "body": "Create a modified copy of a frozen dataclass or namedtuple. Common for configuration objects: keep a default policy and derive per-service variants."}, {"where": "framework", "title": "scikit-learn <code>sklearn.base.clone()<\/code>", "body": "Builds a new, unfitted estimator with the same hyperparameters. <code>GridSearchCV<\/code> and <code>cross_val_score<\/code> clone your estimator for every fold so folds never share learned state."}, {"where": "framework", "title": "Django <code>QuerySet._clone()<\/code>", "body": "Every <code>.filter()<\/code>, <code>.exclude()<\/code> or <code>.order_by()<\/code> clones the queryset and modifies the clone. That is why <code>qs.filter(...)<\/code> does not change <code>qs<\/code>."}, {"where": "production", "title": "Game engines and simulations", "body": "Spawning hundreds of enemies or test packets from one fully configured template object is much cheaper than rebuilding each (loading meshes, stats, default fields) from scratch."}], "use": ["Setup is expensive (parsing, I/O, many fields) and many similar objects are needed", "You want to derive variants from a default configuration", "Objects must be independent snapshots of a starting state"], "avoid": ["Objects hold live resources (sockets, file handles, locks) unless you customize <code>__deepcopy__<\/code>", "Construction is cheap and a constructor call is clearer"], "pitfall": "Using <code>copy.copy()<\/code> (or <code>list(...)<\/code>, <code>dict(...)<\/code>, <code>[:]<\/code>) and then mutating a nested list: the \"copy\" and the original change together.", "qa": [{"q": "Shallow copy vs deep copy?", "a": "<p>A shallow copy creates a new outer object but keeps references to the same inner objects. A deep copy recursively copies inner objects too. <code>list.copy()<\/code>, <code>dict.copy()<\/code>, slicing and <code>copy.copy()<\/code> are shallow.<\/p>"}, {"q": "What is the <code>memo<\/code> argument in <code>__deepcopy__<\/code>?", "a": "<p>A dict mapping <code>id(original)<\/code> to its copy. It lets <code>deepcopy<\/code> handle cycles and shared references: an object referenced twice is copied once. Pass it to nested <code>copy.deepcopy(x, memo)<\/code> calls.<\/p>"}, {"q": "Why does scikit-learn clone estimators?", "a": "<p>To guarantee each training run starts from the same unfitted state with the same hyperparameters, so cross-validation folds and grid-search candidates never leak fitted state into each other.<\/p>"}], "related": ["memento", "builder", "flyweight"], "code_out": "after shallow edit, base: <Monthly: ['Summary', 'Revenue', 'Churn']>\nafter deep edit, base:    <Monthly: ['Summary', 'Revenue']>\ndeep copy:               <March (deep): ['Summary', 'Revenue', 'Churn']>\nsocket shared? False", "pythonic_out": "RetryPolicy(attempts=5, backoff=0.2, retry_on=(502, 503, 504))\nRetryPolicy(attempts=3, backoff=1.0, retry_on=(502, 503, 504))"}, {"id": "object-pool", "cat": "creational", "name": "Object Pool", "alias": "Keep a set of ready-to-use expensive objects and lend them out instead of creating new ones.", "simple": "A bike-sharing station has 20 bikes. You borrow one, ride, and return it to the dock. The city doesn't build a new bike for every trip, and when all 20 are out, you wait for one to come back.", "intent": "<p>Some objects are expensive to create but cheap to reuse: database connections (TCP + TLS + auth), HTTP connections, threads, processes. A pool creates a limited number, hands one out on request, and takes it back when the caller is done.<\/p>\n<p>Good pools do three more things: <b>cap<\/b> the total (protecting the database from too many connections), <b>block or time out<\/b> when empty, and <b>reset or health-check<\/b> objects on return so the next borrower gets a clean one. In Python, lending is best expressed as a context manager so objects always come back.<\/p>", "structure": "   acquire()  ---> [conn1][conn2][conn3]  <--- release() (reset + return)\n   pool empty?  wait up to timeout, then raise\n   max size caps load on the database", "code": "import queue, threading, time, itertools\nfrom contextlib import contextmanager\n\nclass Connection:\n    _ids = itertools.count(1)\n    def __init__(self):\n        time.sleep(0.05)                 # pretend: TCP + TLS + auth handshake\n        self.id = next(self._ids)\n        self.in_tx = False\n    def query(self, sql): return f\"conn{self.id}: {sql}\"\n    def reset(self): self.in_tx = False  # roll back leftovers before reuse\n\nclass ConnectionPool:\n    def __init__(self, size):\n        self._q = queue.Queue(maxsize=size)\n        for _ in range(size):\n            self._q.put(Connection())\n        self.created = size\n\n    @contextmanager\n    def connection(self, timeout=1.0):\n        try:\n            conn = self._q.get(timeout=timeout)      # blocks when all are lent out\n        except queue.Empty:\n            raise TimeoutError(\"pool exhausted\") from None\n        try:\n            yield conn\n        finally:\n            conn.reset()\n            self._q.put(conn)                         # always returned, even on error\n\npool = ConnectionPool(size=3)\nused = []\ndef handle_request(n):\n    with pool.connection() as c:\n        used.append(c.id)\n        time.sleep(0.01)\n        c.query(f\"SELECT * FROM orders WHERE id={n}\")\n\nstart = time.perf_counter()\nthreads = [threading.Thread(target=handle_request, args=(i,)) for i in range(30)]\nfor t in threads: t.start()\nfor t in threads: t.join()\nprint(f\"30 requests served by {len(set(used))} connections (created {pool.created})\")\nprint(f\"elapsed {time.perf_counter() - start:.2f}s vs ~{30 * 0.05:.1f}s if each request opened its own\")", "pythonic": "from concurrent.futures import ThreadPoolExecutor\nimport threading\n\ndef work(n):\n    return n * n, threading.current_thread().name\n\n# the stdlib pools threads for you: at most 4 threads, reused for 10 tasks\nwith ThreadPoolExecutor(max_workers=4, thread_name_prefix=\"w\") as pool:\n    results = list(pool.map(work, range(10)))\nprint([r[0] for r in results])\nprint(\"threads used:\", sorted({r[1] for r in results}))", "pythonic_note": "You rarely write a pool yourself. The stdlib pools threads and processes; database drivers and HTTP clients pool connections. Your job is to size and configure them.", "examples": [{"where": "stdlib", "title": "<code>concurrent.futures.ThreadPoolExecutor<\/code> / <code>ProcessPoolExecutor<\/code>, <code>multiprocessing.Pool<\/code>", "body": "Worker threads or processes are created once and reused for many tasks. Starting a process costs milliseconds; reusing one costs almost nothing."}, {"where": "framework", "title": "SQLAlchemy <code>QueuePool<\/code>", "body": "<code>create_engine()<\/code> uses a <code>QueuePool<\/code> by default (<code>pool_size=5<\/code>, <code>max_overflow=10<\/code>). <code>pool_pre_ping=True<\/code> checks a connection is alive before lending it, and <code>pool_recycle<\/code> replaces old ones."}, {"where": "framework", "title": "requests + urllib3 connection pools", "body": "A <code>requests.Session<\/code> keeps urllib3 connection pools per host (tuned via <code>HTTPAdapter(pool_connections, pool_maxsize)<\/code>). Reusing a Session avoids a new TCP and TLS handshake per call, which is often the biggest speed-up in API clients."}, {"where": "framework", "title": "redis-py <code>ConnectionPool<\/code>, psycopg <code>ConnectionPool<\/code>", "body": "Redis clients share a pool across threads by default. <code>psycopg_pool.ConnectionPool<\/code> provides min/max size, timeouts and health checks for PostgreSQL."}, {"where": "production", "title": "Protecting the database under load", "body": "With 20 gunicorn workers x 10 pooled connections each, the DB sees at most 200 connections. Without a cap, a traffic spike opens thousands and the database refuses new connections for everyone. PgBouncer adds a shared pool in front of PostgreSQL for the same reason."}], "use": ["Objects are expensive to create and can be safely reused (connections, threads, processes, buffers)", "You must cap concurrent use of a scarce resource"], "avoid": ["Cheap objects: Python's allocator is fast, and pooling adds complexity", "Objects that carry per-user state you cannot reliably reset"], "pitfall": "Forgetting to return objects on exceptions. After a few errors the pool is empty and every request hangs. Always lend through <code>with<\/code> / <code>try...finally<\/code>.", "qa": [{"q": "Why pool database connections?", "a": "<p>Opening a connection means TCP setup, TLS, authentication and server-side process creation, often several milliseconds. Pooling reuses connections and caps the total so the database is not overwhelmed.<\/p>"}, {"q": "How do you size a connection pool?", "a": "<p>Start from the database's max connections divided by the number of app processes, then load-test. Larger is not always better: too many concurrent queries cause lock contention. Monitor wait time for a connection and DB CPU.<\/p>"}, {"q": "What happens to a pool after fork (gunicorn preload, multiprocessing)?", "a": "<p>Sockets inherited by the child are shared with the parent and get corrupted if both use them. Create pools after fork, or dispose them in the child (SQLAlchemy: <code>engine.dispose(close=False)<\/code>).<\/p>"}], "related": ["singleton", "flyweight", "context-manager"], "code_out": "30 requests served by 3 connections (created 3)\nelapsed 0.11s vs ~1.5s if each request opened its own", "pythonic_out": "[0, 1, 4, 9, 16, 25, 36, 49, 64, 81]\nthreads used: ['w_0', 'w_1', 'w_2']"}, {"id": "adapter", "cat": "structural", "name": "Adapter", "alias": "Wrap an object so it fits the interface your code already expects.", "simple": "Your Indian laptop charger won't fit a UK socket. You don't rewire the laptop or the wall; you plug in a travel adapter. It changes the shape of the plug and nothing else.", "intent": "<p>An adapter translates calls from the interface a client expects (the <b>target<\/b>) into calls on an existing object with a different interface (the <b>adaptee<\/b>). Neither side changes.<\/p>\n<p>Typical Python cases: wrapping a third-party SDK behind your own interface, fitting legacy code into new code, converting between sync and async, or between bytes and text. Because Python uses duck typing, the target interface is often informal (\"anything with <code>.send(msg)<\/code>\") or a <code>typing.Protocol<\/code>.<\/p>", "structure": " client --> PaymentGateway.pay(amount_inr)      (target interface)\n                 ^\n          StripeAdapter.pay(...)  --translates-->  stripe_sdk.PaymentIntent.create(amount=paise, currency=\"inr\")\n                                                   (adaptee: third-party API)", "code": "from typing import Protocol\n\n# ---- the interface our checkout code is written against\nclass PaymentGateway(Protocol):\n    def pay(self, order_id: str, amount_rupees: float) -> str: ...\n\n# ---- two third-party SDKs with different shapes (the adaptees)\nclass StripeSDK:\n    def create_payment_intent(self, amount, currency, metadata):\n        return {\"id\": \"pi_3Nx\", \"status\": \"succeeded\", \"amount\": amount}\n\nclass LegacyBankClient:\n    def DoTransfer(self, txn_ref, paise):           # old SOAP-style naming\n        return f\"OK|{txn_ref}|{paise}\"\n\n# ---- adapters: translate names, units and return types\nclass StripeAdapter:\n    def __init__(self, sdk: StripeSDK): self.sdk = sdk\n    def pay(self, order_id, amount_rupees):\n        r = self.sdk.create_payment_intent(amount=round(amount_rupees * 100),\n                                           currency=\"inr\", metadata={\"order\": order_id})\n        return r[\"id\"]\n\nclass LegacyBankAdapter:\n    def __init__(self, client: LegacyBankClient): self.client = client\n    def pay(self, order_id, amount_rupees):\n        status, ref, _ = self.client.DoTransfer(order_id, int(amount_rupees * 100)).split(\"|\")\n        if status != \"OK\":\n            raise RuntimeError(\"bank transfer failed\")\n        return ref\n\ndef checkout(gateway: PaymentGateway, order_id, total):\n    print(f\"{type(gateway).__name__:18} -> payment ref {gateway.pay(order_id, total)}\")\n\ncheckout(StripeAdapter(StripeSDK()), \"ORD-1\", 499.00)\ncheckout(LegacyBankAdapter(LegacyBankClient()), \"ORD-2\", 1250.50)", "pythonic": "import functools, io\n\n# stdlib adapter 1: an old-style cmp function adapted to the key= interface\ndef compare_versions(a, b):                     # returns -1 / 0 / 1 (Python 2 style)\n    pa, pb = [int(x) for x in a.split(\".\")], [int(x) for x in b.split(\".\")]\n    return (pa > pb) - (pa < pb)\nprint(sorted([\"1.10.0\", \"1.2.3\", \"1.9.9\"], key=functools.cmp_to_key(compare_versions)))\n\n# stdlib adapter 2: a bytes stream adapted to a text stream\nraw = io.BytesIO(\"naïve café\\nline two\\n\".encode(\"utf-8\"))\ntext = io.TextIOWrapper(raw, encoding=\"utf-8\")   # now you can iterate str lines\nprint([line.strip() for line in text])", "pythonic_note": "The standard library ships adapters you use without noticing: <code>functools.cmp_to_key<\/code> and <code>io.TextIOWrapper<\/code> are both textbook Adapters.", "examples": [{"where": "stdlib", "title": "<code>io.TextIOWrapper<\/code>", "body": "Adapts a binary stream (file, socket, <code>BytesIO<\/code>, <code>subprocess<\/code> pipe) into a text stream with decoding and newline handling. <code>open(path, 'r')<\/code> returns one."}, {"where": "stdlib", "title": "<code>functools.cmp_to_key<\/code> and <code>socket.makefile()<\/code>", "body": "<code>cmp_to_key<\/code> adapts a two-argument compare function to the <code>key=<\/code> interface used by <code>sorted<\/code> since Python 3. <code>socket.makefile()<\/code> adapts a socket to the file interface so you can call <code>readline()<\/code>."}, {"where": "framework", "title": "asgiref <code>sync_to_async<\/code> / <code>async_to_sync<\/code>", "body": "Django uses these adapters to call the synchronous ORM from async views, and async code from sync code, by running the call in a thread or an event loop behind a matching interface."}, {"where": "framework", "title": "Django database backends over DB-API drivers", "body": "psycopg, mysqlclient and sqlite3 differ in parameter styles, error classes and type conversions. Each Django backend adapts its driver to the same interface the ORM uses."}, {"where": "production", "title": "Wrapping vendor SDKs (payments, SMS, email)", "body": "Teams put Razorpay, Stripe or Twilio behind their own <code>PaymentGateway<\/code> / <code>SmsSender<\/code> interface. Switching vendors, or adding a fallback provider, then touches one adapter instead of every call site."}], "use": ["You must use a class whose interface doesn't match what your code expects", "Isolating a third-party SDK so it can be replaced or faked in tests", "Bridging sync/async, bytes/text, old/new APIs"], "avoid": ["You own both sides and can simply change one interface", "The adapter starts adding business logic: it should only translate"], "pitfall": "Leaking the adaptee's types through the adapter (returning the vendor's response object). Callers then depend on the vendor anyway. Return your own types.", "qa": [{"q": "Adapter vs Facade vs Decorator?", "a": "<p><b>Adapter<\/b> changes the interface of one object to match an expected one. <b>Facade<\/b> gives a new, simpler interface over a whole subsystem. <b>Decorator<\/b> keeps the same interface and adds behaviour.<\/p>"}, {"q": "Object adapter vs class adapter?", "a": "<p>An object adapter holds the adaptee (composition), as in the example. A class adapter inherits from the adaptee and the target (multiple inheritance). Composition is preferred: looser coupling and it can adapt any subclass instance.<\/p>"}, {"q": "How does <code>typing.Protocol<\/code> help here?", "a": "<p>It declares the target interface structurally. Any adapter with a matching <code>pay()<\/code> type-checks without inheriting from anything, which fits Python's duck typing.<\/p>"}], "related": ["facade", "decorator", "proxy", "bridge"], "code_out": "StripeAdapter      -> payment ref pi_3Nx\nLegacyBankAdapter  -> payment ref ORD-2", "pythonic_out": "['1.2.3', '1.9.9', '1.10.0']\n['naïve café', 'line two']"}, {"id": "bridge", "cat": "structural", "name": "Bridge", "alias": "Split an abstraction from its implementation so both can vary independently.", "simple": "A TV remote (abstraction) and the TV (implementation) are separate. You can buy a fancy remote or a basic one, and use either with a Sony or a Samsung TV. Four combinations, but only two remotes and two TVs to build.", "intent": "<p>When a class varies along two independent dimensions, inheritance explodes: <code>EmailAlert<\/code>, <code>SmsAlert<\/code>, <code>UrgentEmailAlert<\/code>, <code>UrgentSmsAlert<\/code>... Bridge splits the dimensions into two hierarchies connected by composition: the <b>abstraction<\/b> holds a reference to an <b>implementor<\/b>. With M abstractions and N implementations you write M + N classes instead of M x N.<\/p>\n<p>It is designed up front (unlike Adapter, which fixes a mismatch after the fact). The <code>logging<\/code> module is the best-known Python example: loggers decide <i>what<\/i> to log, handlers decide <i>where<\/i> it goes.<\/p>", "structure": "  Notification (abstraction)  ----has-a---->  Channel (implementor)\n     |- Alert                                   |- EmailChannel\n     |- Reminder                                |- SmsChannel\n     '- Digest                                  '- SlackChannel\n  3 + 3 classes cover all 9 combinations", "code": "from abc import ABC, abstractmethod\n\n# ---- implementor hierarchy: HOW a message is delivered\nclass Channel(ABC):\n    @abstractmethod\n    def deliver(self, to: str, text: str): ...\n\nclass EmailChannel(Channel):\n    def deliver(self, to, text): print(f\"  email to {to}: {text}\")\nclass SmsChannel(Channel):\n    def deliver(self, to, text): print(f\"  sms to {to}: {text[:40]}\")\nclass SlackChannel(Channel):\n    def deliver(self, to, text): print(f\"  slack #{to}: {text}\")\n\n# ---- abstraction hierarchy: WHAT is sent and why\nclass Notification:\n    def __init__(self, channel: Channel): self.channel = channel   # the bridge\n    def send(self, to, subject): self.channel.deliver(to, self.render(subject))\n    def render(self, subject): return subject\n\nclass Alert(Notification):\n    def render(self, subject): return f\"[ALERT] {subject.upper()}\"\nclass Reminder(Notification):\n    def render(self, subject): return f\"Reminder: {subject}\"\n\nAlert(SmsChannel()).send(\"+91-98450-00000\", \"disk 95% full on db-2\")\nAlert(SlackChannel()).send(\"oncall\", \"disk 95% full on db-2\")\nReminder(EmailChannel()).send(\"riya@example.com\", \"invoice due Friday\")\nprint(\"combinations available:\", 2 * 3, \"classes written:\", 2 + 3)", "pythonic": "import logging, io\n\n# stdlib Bridge: Logger (what/level/hierarchy) x Handler (where) x Formatter (how it looks)\nlog = logging.getLogger(\"payments\")\nlog.setLevel(logging.INFO)\nbuf = io.StringIO()\nfor handler, fmt in [(logging.StreamHandler(buf), \"%(levelname)s %(name)s: %(message)s\"),\n                     (logging.StreamHandler(buf), '{\"lvl\":\"%(levelname)s\",\"msg\":\"%(message)s\"}')]:\n    handler.setFormatter(logging.Formatter(fmt))\n    log.addHandler(handler)\nlog.info(\"charged order 42\")\nprint(buf.getvalue().strip())", "pythonic_note": "You already use a Bridge daily: the same <code>log.info()<\/code> call can go to the console, a file, syslog or a JSON collector, because loggers and handlers are separate hierarchies.", "examples": [{"where": "stdlib", "title": "<code>logging<\/code>: Logger, Handler, Formatter", "body": "Loggers form a name hierarchy and filter by level; handlers (<code>FileHandler<\/code>, <code>RotatingFileHandler<\/code>, <code>SysLogHandler<\/code>, <code>SMTPHandler<\/code>, <code>QueueHandler<\/code>) decide the destination. Any logger works with any handler."}, {"where": "framework", "title": "matplotlib figures and backends", "body": "Your plotting code builds Figures and Artists (the abstraction); a backend (Agg for PNG, PDF, SVG, TkAgg or QtAgg for windows) renders them. The same script saves a PNG on a server or opens a window on a laptop."}, {"where": "framework", "title": "Django <code>FileField<\/code> and storage backends", "body": "Models use <code>FileField<\/code> and <code>default_storage<\/code>; the storage implementation can be the local filesystem or S3/GCS via django-storages. Changing <code>STORAGES<\/code> in settings moves every upload without touching models."}, {"where": "framework", "title": "SQLAlchemy Engine over DBAPI drivers", "body": "The Engine/Session API is the abstraction; the driver (<code>psycopg<\/code>, <code>asyncpg<\/code>, <code>pymysql<\/code>) is selected by the URL, e.g. <code>postgresql+psycopg://<\/code>. Both sides evolve separately."}, {"where": "production", "title": "Notification services", "body": "Alert, reminder, marketing and digest messages (abstractions) x email, SMS, push, WhatsApp, Slack (channels). New channel? One class. New message type? One class."}], "use": ["A class varies along two independent axes", "You want to switch implementations at runtime or by configuration", "Avoiding an M x N subclass explosion"], "avoid": ["Only one dimension varies: Strategy or plain composition is enough", "Early in a design where the second dimension is speculative"], "pitfall": "Letting implementation details leak into the abstraction's interface (for example an <code>sms_max_length<\/code> parameter on <code>Notification.send<\/code>). Keep channel-specific logic inside the channel.", "qa": [{"q": "Bridge vs Adapter?", "a": "<p>Both use composition. Adapter is applied afterwards to make incompatible interfaces work together. Bridge is designed up front to let an abstraction and its implementation vary independently.<\/p>"}, {"q": "Bridge vs Strategy?", "a": "<p>Structurally similar (an object holds a replaceable implementation). Strategy swaps one algorithm; Bridge separates two whole hierarchies that both keep growing.<\/p>"}, {"q": "Give a stdlib example of Bridge.", "a": "<p>The <code>logging<\/code> package: <code>Logger<\/code> objects (abstraction) delegate output to any <code>Handler<\/code> (implementation), each with its own <code>Formatter<\/code>.<\/p>"}], "related": ["adapter", "strategy", "abstract-factory"], "code_out": "  sms to +91-98450-00000: [ALERT] DISK 95% FULL ON DB-2\n  slack #oncall: [ALERT] DISK 95% FULL ON DB-2\n  email to riya@example.com: Reminder: invoice due Friday\ncombinations available: 6 classes written: 5", "pythonic_out": "INFO payments: charged order 42\n{\"lvl\":\"INFO\",\"msg\":\"charged order 42\"}"}, {"id": "composite", "cat": "structural", "name": "Composite", "alias": "Treat individual objects and groups of objects through the same interface (trees).", "simple": "An army: a general gives the order \"march\" to a division, which passes it to its brigades, which pass it to battalions, down to single soldiers. The general doesn't care whether he is talking to one soldier or ten thousand.", "intent": "<p>Composite models part-whole hierarchies as trees where <b>leaves<\/b> and <b>containers<\/b> share one interface. Client code calls <code>size()<\/code>, <code>render()<\/code> or <code>run()<\/code> on any node; containers forward the call to their children and combine the results.<\/p>\n<p>Anything tree-shaped fits: file systems, UI widget trees, org charts, menus, ASTs, test suites, neural network layers, bills of materials.<\/p>", "structure": "          Folder(\"project\")            size() = sum(child.size())\n          /        |        \\\n   File(a.py)  Folder(\"src\")  File(README)\n                 /      \\\n          File(x.py)  File(y.py)       File.size() = its own bytes", "code": "from abc import ABC, abstractmethod\n\nclass Node(ABC):\n    def __init__(self, name): self.name = name\n    @abstractmethod\n    def size(self) -> int: ...\n    @abstractmethod\n    def show(self, indent=0): ...\n\nclass File(Node):                           # leaf\n    def __init__(self, name, nbytes):\n        super().__init__(name); self.nbytes = nbytes\n    def size(self): return self.nbytes\n    def show(self, indent=0): print(\" \" * indent + f\"{self.name} ({self.nbytes} B)\")\n\nclass Folder(Node):                         # composite\n    def __init__(self, name, *children):\n        super().__init__(name); self.children = list(children)\n    def add(self, node): self.children.append(node); return self\n    def size(self): return sum(c.size() for c in self.children)   # recursion\n    def show(self, indent=0):\n        print(\" \" * indent + f\"{self.name}/ ({self.size()} B)\")\n        for c in self.children: c.show(indent + 2)\n\nproject = Folder(\"project\",\n    File(\"README.md\", 1_200),\n    Folder(\"src\", File(\"app.py\", 8_400), File(\"models.py\", 5_100),\n           Folder(\"utils\", File(\"dates.py\", 900))),\n    Folder(\"tests\", File(\"test_app.py\", 3_300)))\n\nproject.show()\nprint(\"total:\", project.size(), \"bytes | one file:\", File(\"x\", 7).size())  # same call on both", "pythonic": "import unittest\n\nclass TestMath(unittest.TestCase):\n    def test_add(self): self.assertEqual(1 + 1, 2)\nclass TestStr(unittest.TestCase):\n    def test_upper(self): self.assertEqual(\"a\".upper(), \"A\")\n\n# stdlib Composite: a TestSuite holds TestCases AND other TestSuites; all have run() / countTestCases()\ninner = unittest.TestSuite([TestStr(\"test_upper\")])\nsuite = unittest.TestSuite([TestMath(\"test_add\"), inner])\nprint(\"tests in tree:\", suite.countTestCases())\nresult = unittest.TestResult()\nsuite.run(result)\nprint(\"ran:\", result.testsRun, \"failures:\", len(result.failures))", "pythonic_note": "<code>unittest.TestSuite<\/code> is a Composite from the stdlib: suites contain tests or other suites, and you call <code>run()<\/code> on the root.", "examples": [{"where": "stdlib", "title": "<code>unittest.TestSuite<\/code>", "body": "A suite contains test cases and nested suites; <code>run(result)<\/code> and <code>countTestCases()<\/code> work at every level. Test discovery builds exactly this tree from your packages."}, {"where": "stdlib", "title": "<code>xml.etree.ElementTree<\/code> and <code>ast<\/code>", "body": "An <code>Element<\/code> has children that are <code>Element<\/code>s; <code>iter()<\/code> and <code>findall()<\/code> walk the tree uniformly. Every <code>ast<\/code> node, from <code>Module<\/code> down to <code>Constant<\/code>, shares the <code>ast.AST<\/code> base and is walked with the same tools."}, {"where": "framework", "title": "PyTorch <code>nn.Module<\/code>", "body": "A model is a module containing layers that are themselves modules (and may contain modules). <code>model.parameters()<\/code>, <code>model.to('cuda')<\/code>, <code>model.eval()<\/code> and <code>state_dict()<\/code> recurse through the whole tree."}, {"where": "framework", "title": "scikit-learn <code>Pipeline<\/code> and <code>ColumnTransformer<\/code>", "body": "A Pipeline of transformers is itself an estimator with <code>fit<\/code>/<code>predict<\/code>, so it can be nested in another Pipeline or passed to <code>GridSearchCV<\/code> exactly like a single model."}, {"where": "production", "title": "Menus, permissions and bills of materials", "body": "E-commerce category trees, nested navigation menus, role hierarchies (a role grants permissions and other roles), and manufacturing BOMs (a product is parts and sub-assemblies) all compute totals by recursive Composite calls."}], "use": ["Data is naturally a tree (part-whole)", "Clients should treat one item and a group the same way"], "avoid": ["The structure is flat, or leaves and groups need very different operations", "You need strict type rules on which children are allowed (the uniform interface makes this harder)"], "pitfall": "Recursion on very deep or cyclic structures: a folder that (by a bug or a symlink) contains itself causes infinite recursion. Track visited nodes or guard depth.", "qa": [{"q": "What problem does Composite solve?", "a": "<p>It lets client code handle single objects and collections uniformly through one interface, so tree operations (sum sizes, render, run) are written once instead of with type checks everywhere.<\/p>"}, {"q": "Where should child-management methods (<code>add<\/code>, <code>remove<\/code>) live?", "a": "<p>Either only on the composite (safer: leaves can't have children, but clients must know the type) or on the shared interface (more uniform, leaves raise an error). Python code usually puts them only on the composite.<\/p>"}, {"q": "Which pattern is often used to add operations over a Composite tree?", "a": "<p>Visitor (or <code>functools.singledispatch<\/code>): new operations such as export or validation are written in one place without changing node classes. Iterator is used to walk the tree.<\/p>"}], "related": ["visitor", "iterator", "decorator"], "code_out": "project/ (18900 B)\n  README.md (1200 B)\n  src/ (14400 B)\n    app.py (8400 B)\n    models.py (5100 B)\n    utils/ (900 B)\n      dates.py (900 B)\n  tests/ (3300 B)\n    test_app.py (3300 B)\ntotal: 18900 bytes | one file: 7", "pythonic_out": "tests in tree: 2\nran: 2 failures: 0"}, {"id": "decorator", "cat": "structural", "name": "Decorator", "alias": "Wrap an object or function to add behaviour while keeping the same interface.", "simple": "Your phone plus a case plus a screen guard plus a pop-socket. Each layer adds something, the phone inside is unchanged, and it is still a phone: you call and text exactly as before. You can add or remove layers in any order.", "intent": "<p>A decorator wraps a component, exposes the <b>same interface<\/b>, and adds behaviour before/after delegating: caching, logging, retries, timing, auth checks, compression. Decorators stack, so behaviours combine without a subclass per combination.<\/p>\n<p>Python has two forms. The <b>GoF object decorator<\/b> wraps an object (as <code>io<\/code> stacks buffering and text decoding over a raw file). The <b>@decorator syntax<\/b> wraps functions and classes: <code>@deco<\/code> above <code>def f<\/code> means <code>f = deco(f)<\/code>. Always use <code>functools.wraps<\/code> so the wrapper keeps the original name and docstring.<\/p>", "structure": "  @retry(3)                     call ->  retry wrapper\n  @timed                                   -> timed wrapper\n  @cache                                     -> cache wrapper\n  def fetch_rate(cur): ...                     -> original fetch_rate\n  (same signature at every layer)", "code": "import functools, time, random\n\ndef timed(fn):\n    @functools.wraps(fn)                      # keep name/docstring of fn\n    def wrapper(*args, **kwargs):\n        t0 = time.perf_counter()\n        try:\n            return fn(*args, **kwargs)\n        finally:\n            print(f\"  {fn.__name__}{args} took {(time.perf_counter() - t0) * 1000:.1f} ms\")\n    return wrapper\n\ndef retry(times, exceptions=(ConnectionError,)):\n    def deco(fn):                             # decorator factory: takes arguments\n        @functools.wraps(fn)\n        def wrapper(*args, **kwargs):\n            for attempt in range(1, times + 1):\n                try:\n                    return fn(*args, **kwargs)\n                except exceptions as e:\n                    print(f\"  attempt {attempt} failed: {e}\")\n                    if attempt == times: raise\n        return wrapper\n    return deco\n\nrandom.seed(7)\n@retry(times=3)\n@timed\n@functools.lru_cache(maxsize=128)\ndef fetch_rate(currency):\n    \"\"\"Call an exchange-rate API (flaky).\"\"\"\n    time.sleep(0.02)\n    if random.random() < 0.5:\n        raise ConnectionError(\"upstream timeout\")\n    return {\"USD\": 83.1, \"EUR\": 90.4}[currency]\n\nprint(\"rate:\", fetch_rate(\"USD\"))\nprint(\"cached:\", fetch_rate(\"USD\"))           # served by lru_cache, no sleep\nprint(fetch_rate.__name__, \"-\", fetch_rate.__doc__)", "pythonic": "import io, gzip\n\n# GoF object decorators in the stdlib: each layer has the same file interface\nraw = io.BytesIO()\nwith gzip.GzipFile(fileobj=raw, mode=\"wb\") as gz:           # adds compression\n    with io.TextIOWrapper(gz, encoding=\"utf-8\") as text:     # adds str -> bytes encoding\n        text.write(\"order_id,total\\n\" * 1000)\nprint(\"compressed bytes:\", len(raw.getvalue()))\n\nraw.seek(0)\nwith io.TextIOWrapper(gzip.GzipFile(fileobj=raw), encoding=\"utf-8\") as f:\n    print(\"first line back:\", f.readline().strip())\n\nf = open(__import__(\"os\").devnull)          # open() itself returns a stack of decorators\nprint(type(f).__name__, \"->\", type(f.buffer).__name__, \"->\", type(f.buffer.raw).__name__)\nf.close()", "pythonic_note": "Opening a text file gives you <code>TextIOWrapper<\/code> -> <code>BufferedReader<\/code> -> <code>FileIO<\/code>: three decorators, each adding one feature behind the same file interface.", "examples": [{"where": "stdlib", "title": "<code>io<\/code> stack and <code>gzip.GzipFile(fileobj=...)<\/code>", "body": "<code>FileIO<\/code> does raw reads, <code>BufferedReader<\/code> adds buffering, <code>TextIOWrapper<\/code> adds decoding. <code>GzipFile<\/code> wraps any file object to add compression. Same read/write interface at each layer."}, {"where": "stdlib",
