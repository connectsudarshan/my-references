<style>
.hljs{color:#d8dee9}
.hljs-keyword,.hljs-built_in,.hljs-meta .hljs-keyword{color:#81a1c1}
.hljs-string,.hljs-meta .hljs-string{color:#a3be8c}

:root{
  color-scheme:dark;
  --bg:#0e2036;
  --bg-panel:#123049;
  --bg-sidebar:#0a1a2c;
  --line:#2f5578;
  --line-soft:#1c3852;
  --accent:#ffd43b;
  --accent-dim:#c9a93a;
  --py-blue:#6aa7de;
  --text:#e7eef6;
  --text-dim:#8fa9c2;
  --text-faint:#6a86a3;
  --code-bg:#081422;
  --good:#9fdf9f;
  --bad:#ff9d9d;
  --c-creational:#7ec8e3;
  --c-structural:#ffb454;
  --c-behavioral:#9fdf9f;
  --c-pythonic:#ffd43b;
  --w-stdlib:#6aa7de;
  --w-framework:#c3a6ff;
  --w-production:#6fd6c6;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
  background-size:28px 28px;background-attachment:fixed;min-height:100vh;
}
::selection{background:var(--accent);color:#0e2036;}
a{color:var(--accent);}
code{font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;}
p code,li code,td code,.ex-body code,.ans code,.intent code,.simple code,.pitfall code{background:rgba(255,255,255,0.07);padding:1px 5px;border-radius:3px;font-size:0.88em;color:#ffe58a;}
.app{display:flex;min-height:100vh;}

.sidebar{width:300px;flex-shrink:0;background:var(--bg-sidebar);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar-header{padding:24px 22px 16px;border-bottom:1px solid var(--line);}
.kicker{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.08em;color:var(--accent);margin:0 0 6px;}
.sidebar-header h1{font-size:19px;margin:0 0 4px;font-weight:600;line-height:1.3;cursor:pointer;}
.sidebar-header p{font-size:12.5px;color:var(--text-dim);margin:0;line-height:1.5;}
.progress{margin-top:12px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);}
.progress-bar{height:4px;background:var(--line-soft);border-radius:2px;margin-top:6px;overflow:hidden;}
.progress-bar span{display:block;height:100%;background:var(--accent);width:0;transition:width .3s;}
.search-box{padding:12px 18px;border-bottom:1px solid var(--line);}
.search-box input{width:100%;background:var(--bg-panel);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:5px;font-family:inherit;font-size:13.5px;outline:none;}
.search-box input:focus{border-color:var(--accent);}
.search-box input::placeholder{color:var(--text-faint);}
.nav-group{padding:12px 0 4px;}
.nav-group-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.1em;padding:6px 22px;color:var(--text-faint);display:flex;align-items:center;gap:8px;}
.dot{width:7px;height:7px;border-radius:1px;display:inline-block;transform:rotate(45deg);flex-shrink:0;}
.nav-item{display:flex;align-items:baseline;gap:10px;padding:7px 22px 7px 30px;cursor:pointer;font-size:14px;color:var(--text-dim);border-left:2px solid transparent;transition:background .12s,color .12s,border-color .12s;}
.nav-item .num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-faint);width:18px;flex-shrink:0;}
.nav-item .tick{margin-left:auto;color:var(--good);font-size:12px;}
.nav-item:hover{background:rgba(255,255,255,0.03);color:var(--text);}
.nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
.nav-item.active{background:rgba(255,212,59,0.08);color:var(--accent);border-left-color:var(--accent);}
.nav-item.active .num{color:var(--accent);}
.empty{color:var(--text-faint);font-size:13px;padding:10px 22px;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{padding:16px 40px;border-bottom:1px solid var(--line);background:rgba(14,32,54,0.9);backdrop-filter:blur(6px);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.crumb{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-faint);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.crumb .sep{margin:0 6px;color:var(--line);}
.crumb .current{color:var(--accent);}
.menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--text);border-radius:5px;padding:6px 10px;cursor:pointer;font-family:'IBM Plex Mono',monospace;flex-shrink:0;}

.content{padding:44px 56px 100px;max-width:940px;}
.page{animation:fadein .25s ease;}
@keyframes fadein{from{opacity:.4;transform:translateY(4px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.page{animation:none;}*{transition:none!important;}}

.cat-tag{display:inline-flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.08em;color:var(--text-dim);border:1px solid var(--line);padding:4px 10px 4px 8px;border-radius:3px;margin-bottom:18px;}
.cat-tag .dot{width:8px;height:8px;}
.page h2{font-size:34px;margin:0 0 6px;font-weight:700;letter-spacing:-0.01em;line-height:1.15;text-wrap:balance;}
.alias{font-family:'IBM Plex Mono',monospace;color:var(--text-faint);font-size:13px;margin:0 0 24px;line-height:1.5;}
.simple{display:flex;gap:14px;align-items:flex-start;background:rgba(159,223,159,0.07);border:1px solid rgba(159,223,159,0.28);border-radius:6px;padding:14px 18px;margin:0 0 22px;}
.simple .lbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.08em;color:var(--good);flex-shrink:0;padding-top:3px;}
.simple p{margin:0;font-size:15px;line-height:1.65;}
.intent{font-size:15.5px;line-height:1.75;margin:0;padding:16px 20px;background:var(--bg-panel);border-left:3px solid var(--accent);border-radius:0 4px 4px 0;}
.intent p{margin:0 0 10px;}
.intent p:last-child{margin:0;}
.section-label{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.1em;color:var(--accent-dim);margin:36px 0 14px;display:flex;align-items:center;gap:10px;}
.section-label::after{content:'';flex:1;height:1px;background:var(--line);}
.sub{font-size:13.5px;color:var(--text-dim);margin:-4px 0 14px;line-height:1.6;}

pre{background:var(--code-bg);border:1px solid var(--line-soft);border-radius:6px;padding:20px 22px;overflow-x:auto;margin:0;}
pre code{font-size:13px;line-height:1.65;background:transparent;}
.code-wrap{position:relative;margin-top:14px;}
.code-label{position:absolute;top:-11px;left:16px;background:var(--accent);color:#0e2036;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.05em;padding:2px 8px;border-radius:3px;}
.code-label.struct{background:var(--c-creational);}
.code-label.out{background:var(--good);}
.out-wrap pre{background:#06101b;border-style:dashed;color:#cfe8cf;}
.out-wrap pre code{font-size:12.5px;}
.struct-wrap pre{color:#bcd3e8;font-size:12.5px;line-height:1.45;}
.struct-wrap pre code{font-size:12.5px;line-height:1.45;}
.code-stack{display:flex;flex-direction:column;gap:22px;margin-top:6px;}

.ex-legend{display:flex;gap:14px;flex-wrap:wrap;margin:-2px 0 14px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);}
.ex-legend span{display:inline-flex;align-items:center;gap:6px;}
.examples{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;}
.examples li{display:flex;gap:14px;padding:14px 16px;background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:6px;}
.where{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;letter-spacing:0.06em;padding:3px 7px;border-radius:3px;color:#0e2036;flex-shrink:0;height:fit-content;margin-top:2px;min-width:84px;text-align:center;}
.where.stdlib{background:var(--w-stdlib);}
.where.framework{background:var(--w-framework);}
.where.production{background:var(--w-production);}
.ex-title{font-weight:600;font-size:14.5px;margin:0 0 3px;}
.ex-body{font-size:13.5px;color:var(--text-dim);line-height:1.6;margin:0;}

.tradeoffs{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.tradeoff-box{padding:14px 16px;border-radius:6px;border:1px solid var(--line-soft);background:var(--bg-panel);}
.tradeoff-box h4{margin:0 0 8px;font-size:12px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.06em;}
.tradeoff-box.use h4{color:var(--good);}
.tradeoff-box.avoid h4{color:var(--bad);}
.tradeoff-box ul{margin:0;padding-left:16px;font-size:13.5px;color:var(--text-dim);line-height:1.6;}
.pitfall{margin-top:16px;padding:12px 16px;border:1px solid rgba(255,157,157,0.35);background:rgba(255,157,157,0.06);border-radius:6px;font-size:14px;line-height:1.6;}
.pitfall b{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.06em;color:var(--bad);margin-right:8px;}

.qa{display:flex;flex-direction:column;gap:10px;}
.qa details{background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:6px;}
.qa details[open]{border-color:var(--line);}
.qa summary{cursor:pointer;padding:13px 16px;font-weight:600;font-size:14.5px;list-style:none;display:flex;gap:12px;align-items:baseline;}
.qa summary::-webkit-details-marker{display:none;}
.qa summary .q{font-family:'IBM Plex Mono',monospace;color:var(--py-blue);font-size:12px;flex-shrink:0;}
.qa summary .chev{margin-left:auto;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;transition:transform .15s;}
.qa details[open] summary .chev{transform:rotate(90deg);}
.qa summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px;}
.qa .ans{padding:0 16px 14px 46px;font-size:14px;line-height:1.7;color:var(--text-dim);}
.qa .ans p{margin:0 0 8px;}
.qa .ans p:last-child{margin:0;}

.related{display:flex;gap:8px;flex-wrap:wrap;}
.chip{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:6px 11px;border-radius:14px;border:1px solid var(--line);background:var(--bg-panel);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
.chip:hover,.chip:focus-visible{border-color:var(--accent);color:var(--accent);outline:none;}
.btn{background:var(--bg-panel);border:1px solid var(--line);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px 14px;border-radius:5px;cursor:pointer;transition:border-color .15s,color .15s;}
.btn:hover,.btn:focus-visible{border-color:var(--accent);color:var(--accent);outline:none;}
.btn.done{border-color:var(--good);color:var(--good);}
.page-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:40px;}
.qa-tools{margin-bottom:10px;}

.footer-nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:24px;border-top:1px solid var(--line-soft);}
.footer-nav button{background:var(--bg-panel);border:1px solid var(--line);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:10px 16px;border-radius:5px;cursor:pointer;transition:border-color .15s,color .15s;max-width:48%;text-align:left;}
.footer-nav button:hover,.footer-nav button:focus-visible{border-color:var(--accent);color:var(--accent);outline:none;}
.footer-nav .dir{color:var(--text-faint);font-size:10px;display:block;}

.table-wrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:6px;background:var(--bg-panel);}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px;}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.5;}
th{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.06em;color:var(--accent);background:rgba(0,0,0,0.15);font-weight:600;}
td{color:var(--text-dim);}
td:first-child{color:var(--text);}
tr:last-child td{border-bottom:none;}
td a{cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--accent);}

.home-intro{font-size:16px;line-height:1.7;color:var(--text-dim);max-width:70ch;margin:0;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:22px;}
.stat{background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:6px;padding:12px 14px;}
.stat .n{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;}
.stat .l{font-size:12px;color:var(--text-dim);margin-top:2px;}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.home-card{background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:6px;padding:14px 16px;cursor:pointer;transition:border-color .15s,transform .15s;text-align:left;color:var(--text);font:inherit;}
.home-card:hover,.home-card:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none;}
.hc-cat{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.06em;}
.home-card h3{margin:6px 0 5px;font-size:15px;display:flex;gap:6px;align-items:baseline;}
.home-card h3 .tick{color:var(--good);font-size:12px;margin-left:auto;}
.home-card p{margin:0;font-size:12.5px;color:var(--text-dim);line-height:1.5;}

@media(max-width:900px){
  .sidebar{position:fixed;left:-310px;z-index:20;transition:left .2s;box-shadow:8px 0 24px rgba(0,0,0,0.4);height:100%;padding-top:env(safe-area-inset-top,0px);}
  .sidebar.open{left:0;}
  .content{padding:30px 16px 80px;}
  .topbar{padding:12px 16px;}
  .tradeoffs{grid-template-columns:1fr;}
  .menu-btn{display:inline-block;}
  .page h2{font-size:27px;}
  .qa .ans{padding-left:16px;}
  .simple{flex-direction:column;gap:6px;}
  .examples li{flex-direction:column;gap:8px;}
}
</style>

<div class="app">
  <nav class="sidebar" id="sidebar" aria-label="Patterns">
    <div class="sidebar-header">
      <p class="kicker">GoF + PYTHONIC · PYTHON 3.12+</p>
      <h1 onclick="navigate('')">Python Design Patterns Field Reference</h1>
      <p id="sideSub">Every pattern with runnable Python, real output, and where it lives in the stdlib, frameworks and production systems.</p>
      <div class="progress" id="progressText"></div>
      <div class="progress-bar"><span id="progressBar"></span></div>
    </div>

    <div id="navGroups"></div>
  </nav>
  <div class="main">
    <div class="topbar">
      <div class="crumb">Python Patterns <span class="sep">/</span> <span class="current" id="crumbCurrent">Overview</span></div>

    </div>

<script>
const PATTERNS = /*__DATA__*/[];

const CATS = {
  creational:{label:'Creational', color:'var(--c-creational)', blurb:'How objects get made'},
  structural:{label:'Structural', color:'var(--c-structural)', blurb:'How objects are composed'},
  behavioral:{label:'Behavioral', color:'var(--c-behavioral)', blurb:'How objects talk and share work'},
  pythonic:  {label:'Pythonic & Architectural', color:'var(--c-pythonic)', blurb:'Idioms Python programmers reach for daily'}
};
const ORDER = ['creational','structural','behavioral','pythonic'];
const WHERE = {stdlib:'STDLIB', framework:'FRAMEWORK', production:'PRODUCTION'};

const DISSOLVE = [
  ['Strategy','Pass a function (or lambda) instead of a strategy class','sorted(data, key=len)','strategy'],
  ['Command','Any callable, functools.partial, or a closure is a command','Button(command=save)','command'],
  ['Iterator','Generators and the iterator protocol are built in','yield row','iterator'],
  ['Singleton','A module is imported once and cached in sys.modules','import config','singleton'],
  ['Decorator','@decorator syntax wraps functions and classes','@functools.lru_cache','decorator'],
  ['Visitor','functools.singledispatch dispatches on argument type','@render.register(Circle)','visitor'],
  ['Template Method','Hook methods on a base class; ABCs enforce them','class H(BaseRequestHandler)','template-method'],
  ['Observer','A list of callbacks; signal libraries (blinker, Django signals)','post_save.connect(fn)','observer'],
  ['Prototype','copy.copy / copy.deepcopy are built in','copy.deepcopy(template)','prototype'],
  ['Factory Method','Classes are callables; classmethods are named constructors','datetime.fromtimestamp(ts)','factory-method'],
];

const PICKER = [
  ['Create one of several related classes chosen at runtime','Factory Method','factory-method'],
  ['Build a complex object step by step (many optional parts)','Builder','builder'],
  ['Copy a configured object instead of constructing it again','Prototype','prototype'],
  ['Reuse expensive resources (connections, threads)','Object Pool','object-pool'],
  ['Make an existing class fit the interface my code expects','Adapter','adapter'],
  ['Add behaviour (logging, caching, retries) without editing the class','Decorator','decorator'],
  ['Give a messy subsystem one simple entry point','Facade','facade'],
  ['Control access to an object (lazy, remote, read-only)','Proxy','proxy'],
  ['Treat single items and groups the same way (trees)','Composite','composite'],
  ['Share memory across millions of similar objects','Flyweight','flyweight'],
  ['Swap an algorithm at runtime','Strategy','strategy'],
  ['Notify many listeners when something changes','Observer','observer'],
  ['Pass a request through a series of handlers','Chain of Responsibility','chain-of-responsibility'],
  ['Queue, log or undo operations','Command','command'],
  ['Behaviour changes with an internal state (workflows)','State','state'],
  ['Fix the algorithm skeleton, let subclasses fill steps','Template Method','template-method'],
  ['Add new operations over a stable tree of types','Visitor','visitor'],
  ['Save and restore an object\'s state (undo, checkpoints)','Memento','memento'],
  ['Guarantee cleanup of a resource','Context Manager','context-manager'],
  ['Make classes discoverable as plugins','Registry / Plugin','registry'],
  ['Make code testable by passing collaborators in','Dependency Injection','dependency-injection'],
  ['Keep domain logic independent of the database','Repository & Unit of Work','repository'],
  ['Process a large stream in stages with little memory','Generator Pipeline','pipeline'],
];

const STORE_KEY = 'pydp-ref-revised';
let revised = new Set();
try { revised = new Set(JSON.parse(localStorage.getItem(STORE_KEY) || '[]')); } catch(e) {}
function saveRevised(){ try { localStorage.setItem(STORE_KEY, JSON.stringify([...revised])); } catch(e) {} }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function strip(s){ return String(s).replace(/<[^>]+>/g,''); }
function byId(id){ return PATTERNS.find(p=>p.id===id); }
function haystack(p){
  return (p.name+' '+p.alias+' '+strip(p.intent)+' '+p.examples.map(e=>e.title+' '+strip(e.body)).join(' ')+' '+p.code+' '+(p.pythonic||'')).toLowerCase();
}

function buildSidebar(filter){
  const q = (filter||'').trim().toLowerCase();
  const box = document.getElementById('navGroups');
  box.innerHTML = '';
  let shown = 0;
  ORDER.forEach(cat=>{
    const all = PATTERNS.filter(p=>p.cat===cat);
    const items = all.filter(p=>!q || haystack(p).includes(q));
    if(!items.length) return;
    shown += items.length;
    const g = document.createElement('div');
    g.className = 'nav-group';
    g.innerHTML = '<div class="nav-group-label"><span class="dot" style="background:'+CATS[cat].color+'"></span>'+CATS[cat].label.toUpperCase()+' ('+all.length+')</div>';
    items.forEach(p=>{
      const el = document.createElement('div');
      el.className = 'nav-item'; el.id = 'nav-'+p.id; el.tabIndex = 0; el.setAttribute('role','link');
      el.innerHTML = '<span class="num">'+String(all.indexOf(p)+1).padStart(2,'0')+'</span><span>'+esc(p.name)+'</span>'+(revised.has(p.id)?'<span class="tick" title="Revised">✓</span>':'');
      el.onclick = ()=>navigate(p.id);
      el.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); navigate(p.id);} };
      g.appendChild(el);
    });
    box.appendChild(g);
  });
  if(!shown) box.innerHTML = '<div class="empty">No patterns match "'+esc(filter)+'".</div>';
  const cur = document.getElementById('nav-'+location.hash.slice(1));
  if(cur) cur.classList.add('active');
  const n = PATTERNS.filter(p=>revised.has(p.id)).length;
  document.getElementById('progressText').textContent = n+' / '+PATTERNS.length+' patterns revised';
  document.getElementById('progressBar').style.width = (100*n/PATTERNS.length)+'%';
}

function link(id,label){ return '<a onclick="navigate(\''+id+'\')">'+label+'</a>'; }

function renderHome(){
  const nEx = PATTERNS.reduce((a,p)=>a+p.examples.length,0);
  const nStd = PATTERNS.reduce((a,p)=>a+p.examples.filter(e=>e.where==='stdlib').length,0);
  const nQa = PATTERNS.reduce((a,p)=>a+p.qa.length,0);
  let h = '<div class="page"><div class="cat-tag"><span class="dot" style="background:var(--accent)"></span>OVERVIEW</div>'+
    '<h2>Python Design Patterns Field Reference</h2>'+
    '<p class="alias">23 Gang-of-Four patterns + Object Pool + 8 patterns Python developers use every day</p>'+
    '<p class="home-intro">Each pattern has a plain-language analogy, a structure sketch, a complete Python program that was actually executed to produce the output shown, the idiomatic shortcut where Python makes the pattern simpler, and real places you can open and read: modules in the standard library, code in Django, Flask, FastAPI, SQLAlchemy, pytest and scikit-learn, and production systems.</p>'+
    '<div class="stats">'+
      '<div class="stat"><div class="n">'+PATTERNS.length+'</div><div class="l">Patterns</div></div>'+
      '<div class="stat"><div class="n">'+nEx+'</div><div class="l">Real-world examples</div></div>'+
      '<div class="stat"><div class="n">'+nStd+'</div><div class="l">Found in the stdlib</div></div>'+
      '<div class="stat"><div class="n">'+nQa+'</div><div class="l">Interview questions</div></div>'+
    '</div>'+
    '<div class="section-label">WHICH PATTERN DO I NEED?</div>'+
    '<div class="table-wrap"><table><thead><tr><th>If you need to…</th><th>Use</th></tr></thead><tbody>'+
    PICKER.map(r=>'<tr><td>'+r[0]+'</td><td>'+link(r[2],r[1])+'</td></tr>').join('')+'</tbody></table></div>'+
    '<div class="section-label">PATTERNS THAT SHRINK IN PYTHON</div>'+
    '<p class="sub">Peter Norvig\'s 1996 talk "Design Patterns in Dynamic Languages" found that 16 of the 23 GoF patterns become simpler or invisible when functions are first-class objects. Interviewers like hearing that you know both forms.</p>'+
    '<div class="table-wrap"><table><thead><tr><th>Pattern</th><th>Python shortcut</th><th>Looks like</th></tr></thead><tbody>'+
    DISSOLVE.map(r=>'<tr><td>'+link(r[3],r[0])+'</td><td>'+r[1]+'</td><td><code>'+esc(r[2])+'</code></td></tr>').join('')+'</tbody></table></div>';
  ORDER.forEach(cat=>{
    h += '<div class="section-label">'+CATS[cat].label.toUpperCase()+' · '+CATS[cat].blurb.toUpperCase()+'</div><div class="home-grid">';
    PATTERNS.filter(p=>p.cat===cat).forEach(p=>{
      h += '<button class="home-card" onclick="navigate(\''+p.id+'\')"><span class="hc-cat" style="color:'+CATS[cat].color+'">'+CATS[cat].label.toUpperCase()+'</span>'+
        '<h3>'+esc(p.name)+(revised.has(p.id)?'<span class="tick">✓</span>':'')+'</h3><p>'+p.alias+'</p></button>';
    });
    h += '</div>';
  });
  return h+'</div>';
}

function codeBlock(code,label,cls,lang){
  const cl = lang ? 'language-'+lang : 'nohighlight';
  return '<div class="code-wrap '+(cls||'')+'"><span class="code-label '+(cls==='out-wrap'?'out':cls==='struct-wrap'?'struct':'')+'">'+label+'</span><pre><code class="'+cl+'">'+esc(code)+'</code></pre></div>';
}

function renderPattern(p){
  const cat = CATS[p.cat];
  const i = PATTERNS.indexOf(p), prev = PATTERNS[i-1], next = PATTERNS[i+1];
  let h = '<div class="page"><div class="cat-tag"><span class="dot" style="background:'+cat.color+'"></span>'+cat.label.toUpperCase()+' PATTERN</div>'+
    '<h2>'+esc(p.name)+'</h2><p class="alias">'+p.alias+'</p>'+
    '<div class="simple"><span class="lbl">IN SIMPLE WORDS</span><p>'+p.simple+'</p></div>'+
    '<div class="section-label">INTENT</div><div class="intent">'+p.intent+'</div>';
  if(p.structure) h += '<div class="section-label">STRUCTURE</div>'+codeBlock(p.structure,'SKETCH','struct-wrap');
  h += '<div class="section-label">PYTHON IMPLEMENTATION</div><div class="code-stack">'+
    codeBlock(p.code,'PYTHON · RUNS AS-IS','', 'python')+
    (p.code_out ? codeBlock(p.code_out,'OUTPUT','out-wrap') : '')+'</div>';
  if(p.pythonic){
    h += '<div class="section-label">THE PYTHONIC SHORTCUT</div>'+(p.pythonic_note?'<p class="sub">'+p.pythonic_note+'</p>':'')+
      '<div class="code-stack">'+codeBlock(p.pythonic,'IDIOMATIC PYTHON','','python')+(p.pythonic_out?codeBlock(p.pythonic_out,'OUTPUT','out-wrap'):'')+'</div>';
  }
  h += '<div class="section-label">WHERE THIS SHOWS UP IN THE REAL WORLD ('+p.examples.length+')</div>'+
    '<div class="ex-legend"><span><span class="dot" style="background:var(--w-stdlib)"></span>Standard library: open it and read the source</span><span><span class="dot" style="background:var(--w-framework)"></span>Popular framework or library</span><span><span class="dot" style="background:var(--w-production)"></span>Production system design</span></div>'+
    '<ul class="examples">'+p.examples.map(e=>'<li><span class="where '+e.where+'">'+WHERE[e.where]+'</span><div><p class="ex-title">'+e.title+'</p><p class="ex-body">'+e.body+'</p></div></li>').join('')+'</ul>';
  h += '<div class="section-label">WHEN TO USE / WHEN TO AVOID</div><div class="tradeoffs">'+
    '<div class="tradeoff-box use"><h4>USE WHEN</h4><ul>'+p.use.map(u=>'<li>'+u+'</li>').join('')+'</ul></div>'+
    '<div class="tradeoff-box avoid"><h4>AVOID WHEN</h4><ul>'+p.avoid.map(a=>'<li>'+a+'</li>').join('')+'</ul></div></div>'+
    '<div class="pitfall"><b>COMMON PITFALL</b>'+p.pitfall+'</div>';
  h += '<div class="section-label">INTERVIEW QUESTIONS ('+p.qa.length+')</div><div class="qa-tools"><button class="btn" id="qaToggle" onclick="toggleQA()">Expand all answers</button></div><div class="qa">'+
    p.qa.map((x,k)=>'<details><summary><span class="q">Q'+(k+1)+'</span><span>'+x.q+'</span><span class="chev">›</span></summary><div class="ans">'+x.a+'</div></details>').join('')+'</div>';
  if(p.related && p.related.length){
    h += '<div class="section-label">RELATED PATTERNS</div><div class="related">'+p.related.map(r=>{const o=byId(r);return '<button class="chip" onclick="navigate(\''+r+'\')"><span class="dot" style="background:'+CATS[o.cat].color+'"></span>'+esc(o.name)+'</button>';}).join('')+'</div>';
  }
  const done = revised.has(p.id);
  h += '<div class="page-actions"><button class="btn'+(done?' done':'')+'" id="revBtn" onclick="toggleRevised(\''+p.id+'\')">'+(done?'✓ Revised':'Mark as revised')+'</button></div>'+
    '<div class="footer-nav">'+(prev?'<button onclick="navigate(\''+prev.id+'\')"><span class="dir">← PREV</span>'+esc(prev.name)+'</button>':'<span></span>')+
    (next?'<button onclick="navigate(\''+next.id+'\')" style="text-align:right"><span class="dir">NEXT →</span>'+esc(next.name)+'</button>':'<span></span>')+'</div></div>';
  return h;
}

function toggleQA(){
  const all=[...document.querySelectorAll('.qa details')], open=all.some(d=>!d.open);
  all.forEach(d=>d.open=open);
  document.getElementById('qaToggle').textContent = open?'Collapse all answers':'Expand all answers';
}
function toggleRevised(id){
  revised.has(id)?revised.delete(id):revised.add(id); saveRevised();
  const b=document.getElementById('revBtn'), d=revised.has(id);
  b.textContent=d?'✓ Revised':'Mark as revised'; b.classList.toggle('done',d);
  buildSidebar(document.getElementById('search').value);
}
function navigate(id){
  const c=document.getElementById('content'), p=byId(id);
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  if(!p){
    c.innerHTML=renderHome(); document.getElementById('crumbCurrent').textContent='Overview';
    if(location.hash) history.replaceState(null,'',location.pathname+location.search);
  } else {
    c.innerHTML=renderPattern(p);
    const n=document.getElementById('nav-'+id); if(n) n.classList.add('active');
    document.getElementById('crumbCurrent').textContent=p.name;
    if(location.hash!=='#'+id) history.replaceState(null,'','#'+id);
    if(window.hljs) c.querySelectorAll('pre code.language-python').forEach(el=>hljs.highlightElement(el));
  }
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));
document.getElementById('search').addEventListener('input',e=>buildSidebar(e.target.value));
buildSidebar();
navigate(location.hash.slice(1));
</script>
