ing parameters in the CEM specification, and the requirements for device readiness and CRS behavior after Conventional Reset in the Base Specification.","follow":[{"q":"Why does the rescan result matter?","a":"It separates \"not ready in time\" from \"not on the link\". A drive that appears later was alive and late."},{"q":"Would you also try hot reset and FLR?","a":"Yes, as separate variables. A warm reboot may not toggle PERST#, so hot reset paths and SSD reset handling in the Resets module are relevant."}],"mod":17},{"id":"17.16","level":"Principal","type":"Debug","fig":null,"tags":["correlation","nak","bios","poison","two-factor"],"q":"Three failures each follow one variable: NAK storms after a specific TLP size, completion timeouts only with one host BIOS version, and poisoned TLPs from the SSD only on writes to one address range. How do you attack each one?","short":"Treat each as an experiment on one variable. For the TLP size, sweep sizes and speeds, and use the analyzer as a witness to see whether the LCRC is wrong on the wire. For the BIOS, diff config space between versions and check settings like MPS, tags, ASPM and IOMMU. For poison, decide whether the address is a host address, an LBA or an SSD-internal buffer, then vary each independently.","deep":"| Failure | First question | Experiment | Likely causes |\n|---|---|---|---|\n| NAK storm at one TLP size | Is it deterministic or statistical? | Sweep payload length in DW steps at Gen1 to Gen5, and see if only some speeds fail | Framing, alignment or LCRC bug in the datapath (deterministic), or extra exposure to bit errors (statistical) |\n| Completion timeouts with one BIOS | What did the BIOS program differently? | `lspci -vvv` diff of the whole tree between BIOS versions, then change one setting at a time | Completion Timeout range, MPS or MRRS, 10-bit tags or extended tags, relaxed ordering, ASPM and L1 substates, IOMMU, C-state settings |\n| Poison on one address range | Which address is it? | Fix the LBA and move the host buffer, then fix the buffer and move the LBA | Host address bit or 4 KB crossing handling, internal SRAM or DRAM ECC on one region, firmware DMA descriptor bug |\n\n- **NAK storm details:** at Gen3 and above, the 128b/130b framing puts length in the STP token, so a bug that shows only at one length, or only at Gen3 and up, points to framing or datapath alignment. A random SI problem would grow smoothly with size and speed, not step at one size.\n- **Analyzer as a witness:** if the analyzer sees a bad LCRC on the wire, the transmitter or encoder is at fault. If the wire is clean and the receiver still NAKs, suspect the receiver or its equalization. The tap position matters.\n- **Timeout details:** the SSD is the requester when it reads host memory (SQE fetch, PRP list, write data). A late completion can come from the IOMMU walk, a deep CPU package C-state, or the root port in L1. Use the analyzer to check whether the completion was late or never sent.\n- **Poison details:** EP on an SSD memory write means the SSD marked its own data as bad, for example on an uncorrectable internal ECC error, or software or firmware set it. The receiver logs Poisoned TLP Received. Record the TLP header address, the NVMe command and its LBA, and the buffer address.","pitfall":"Changing the variable and a second thing at once. A two-factor experiment (hold one fixed, sweep the other) is the only way to separate host address from LBA from buffer.","verify":"Poisoned TLP and Completion Timeout bit names and default completion timeout range in the Base Specification, and the 128b/130b STP token and framing rules.","follow":[{"q":"The NAK storm is deterministic at one size and only above Gen2. What does that suggest?","a":"A 128b/130b framing or alignment issue, not signal integrity. Confirm with the same size at Gen2, and by reading the wire LCRC."},{"q":"Timeouts vanish when ASPM L1 is disabled in the new BIOS. What does that mean?","a":"The exit latency or LTR handling under that BIOS is too slow for the device. Check L1 substate settings and completion timeout range."}],"mod":17},{"id":"17.17","level":"Principal","type":"Scenario","fig":null,"tags":["automation","triage","pipeline","classification","evidence"],"q":"How would you build a triage-automation pipeline that collects evidence on failure and classifies the failure signature?","short":"Detect a failure event, then run a fixed, read-only collection sequence before any reset: config space of the SSD and all upstream ports, AER, LnkSta and LnkSta2, dmesg, NVMe logs, SSD debug and LTSSM logs, and temperatures, with timestamps. A rule-based classifier maps the evidence to a signature (link down, downtrain, correctable storm, uncorrectable error, controller fatal, clean-lower-layers timeout), stores it with the platform context, and escalates unknown signatures.","deep":"- **Trigger:** an NVMe timeout or controller reset in the kernel log, an AER event (`ras:aer_event`, rasdaemon), a link change in a poller, a harness I/O error, or an analyzer trigger.\n- **Collect, in this order (read-only, with per-step timeouts, and no reset):**\n  1. Timestamp, unique failure ID, DUT, slot, BIOS, kernel, firmware versions.\n  2. Config space (`lspci -xxxx`) for the SSD, every upstream port and any retimer. Config reads first, since they are safe on a dead link and return all 1s.\n  3. AER status and mask, LnkSta, LnkSta2 and the bandwidth status bits, DPC status.\n  4. BAR0 CSTS and CC only after config space shows a live device, since an MMIO read to a dead device can stall or escalate on some platforms.\n  5. dmesg and journal window, sysfs AER counters.\n  6. `nvme smart-log`, `error-log`, controller-initiated telemetry, vendor debug log, LTSSM history.\n  7. Temperatures and rails, analyzer save through its API.\n- **Classify (example rules):**\n\n| Evidence | Signature |\n|---|---|\n| Config all 1s or DLLLA clear, CSTS 0xFFFFFFFF | Link down or device gone |\n| Config live, LnkSta below LnkCap or width reduced | Downtrain (equalization or lane) |\n| Live link, rising CESta rates | Correctable storm (margin) |\n| UESta set: completion timeout, poison, UR, surprise down | Uncorrectable class |\n| Config live, CSTS.CFS set | Controller fatal (firmware) |\n| All layers clean, commands time out | Firmware stall or host-side (interrupt, IOMMU, driver) |\n\n- **Store and act:** one JSON record per failure with the raw dumps attached, dedup by signature and platform, trend by firmware and BIOS version, and page a human only on unknown signatures or a rate above the baseline.\n- **Feedback:** compare classifier labels with human root causes and add rules for what it misses.\n- **Guard rails:** do not clear sticky bits before saving, do not reset until collection ends (or the hold-off expires), and keep the collection from perturbing the failure.","pitfall":"Building the collector so that it clears counters, reloads the driver, or reboots as its first step, and then finding the evidence is gone.","verify":"Platform behavior of an MMIO read to a dead device (timeout versus machine check), and how DPC and hot-plug handling on your platform interact with collection.","follow":[{"q":"How do you keep the pipeline from destroying evidence?","a":"Read-only steps, with clearing and resets in a separate stage that runs only after all evidence is saved and the record is written."},{"q":"How do you measure the pipeline's value?","a":"Time from failure to signature, percent of failures classified without a human, agreement with human root cause, and the share of failures with complete evidence."}],"mod":17},{"id":"17.18","level":"Principal","type":"Scenario","fig":null,"tags":["stress","corners","soak","statistics","error-injection","pass-criteria"],"q":"Design a stress and corner test plan for a Gen5 x4 SSD's PCIe link, with pass criteria and statistics.","short":"Build a corner matrix of voltage, temperature, refclk (SSC on and off, frequency offset), slots and cables, and speeds. On each cell run reset cycles, long fio soaks with data verify, margin sweeps and error injection. Pass criteria: zero uncorrectable errors and miscompares, correctable rates below a threshold set from throughput impact, minimum lane margin above the characterization limit, and link-up yield with a stated upper bound from the rule of three.","deep":"| Axis | Levels |\n|---|---|\n| Rail voltage | Nominal, and the low and high limits of the form factor's supply tolerance |\n| Temperature | Cold, ambient, hot (case and ambient), plus thermal ramps |\n| Refclk | SSC off and on (down-spread, about 30 to 33 kHz modulation), frequency offset toward the plus and minus limits (VERIFY) |\n| Channel | Best and worst slot, cable and backplane length, with and without retimer, several units |\n| Speed and width | Gen1 to Gen5, and forced downtrain and retrain |\n| Events | Cold power cycle, warm reboot, hot reset, FLR, CC.EN toggle, L1.2 entry and exit |\n\n- **Test types per cell:**\n  - Reset and link-up cycles, thousands.\n  - Soak: 72 to 168 hours of mixed fio with `--verify=crc32c` on a scratch drive.\n  - Lane margining sweeps at each corner.\n  - Error injection: LCRC, poisoned TLP, UR, completion timeout, surprise down, with the recovery path verified (see the scenarios module).\n- **Pass criteria:**\n  - Zero uncorrectable errors and zero data miscompares.\n  - Correctable error rate below a threshold from the replay model, for example under 0.1 percent throughput loss.\n  - Worst-lane margin above the limit from silicon characterization, with no lane far below its neighbors.\n  - Link-up yield: 3,000 clean trials give a 95 percent upper bound of 0.1 percent failure, 30,000 give 0.01 percent (rule of three, 3 / n).\n  - Latency: no stalls beyond the QoS budget.\n- **Statistics traps:** failures cluster by unit, slot and temperature, so do not pool trials across units, and report per-corner and per-unit results. For a BER claim, 1e-12 at 95 percent confidence needs 3e12 error-free bits on that lane: 94 s at 32 Gb/s and 188 s at 16 Gb/s, per lane.\n- **Automation:** the evidence pipeline from this module runs on every failure, and the corner controller logs the environment with every result.","pitfall":"Pooling all units and corners into one pass rate. A corner or unit that fails is hidden by the many that pass.","verify":"Supply tolerance for your form factor, the refclk frequency tolerance and SSC parameters in the CEM and Base Specifications, and the fixtures used for refclk offset.","follow":[{"q":"One unit fails once in 3,000 cycles. Is it a fail?","a":"The 95 percent upper bound with one failure is about 4.7 / n, near 0.16 percent. Investigate it as a real defect first. Do not average it away."},{"q":"Why include SSC off?","a":"Some systems run without spread spectrum, and a design that passes only with SSC on may depend on clock tolerance it does not have. Test both."}],"mod":17},{"id":"18.01","level":"Principal","type":"Cross-layer","fig":"ltssm","tags":["bring-up","power-on","enumeration","nvme","cc-en","admin-queue"],"q":"Walk through everything that happens from power-on until the first NVMe read completes.","short":"Power rails and REFCLK stabilize, then PERST# is released. The LTSSM trains Detect, Polling, Configuration to L0 at 2.5 GT/s, then changes speed to the maximum, and the Data Link Layer completes flow control initialization. Firmware enumerates and assigns BARs, the OS driver maps BAR0, programs the admin queues and sets CC.EN, waits for CSTS.RDY, identifies the controller, creates the I/O queues, and finally a read goes doorbell, SQE fetch, data DMA, CQE and MSI-X.","deep":"1. **Power and clock:** supply rails reach their limits, REFCLK runs stably, then the platform releases PERST#. The CEM allows roughly 100 ms from power valid to PERST# release and wants REFCLK stable before release (VERIFY).\n2. **Link training** (see the LTSSM module): Detect, Polling, Configuration, L0 at 2.5 GT/s. Then a speed change through Recovery, with equalization at Gen3 and above, up to the highest common rate. Training must start soon after PERST# release (about 20 ms, VERIFY).\n3. **Data Link Layer:** DL_Init sends InitFC1 and InitFC2 for VC0, then DL_Active, and TLPs can flow.\n4. **Enumeration** (see Config Space & Enumeration): firmware waits after reset, handles CRS while the SSD boots, reads the Vendor ID, assigns bus numbers, sizes and assigns BARs, and sets Memory Space and Bus Master Enable. Class code 010802h identifies an NVMe controller.\n5. **Driver bind:** the driver maps BAR0 and reads CAP (queue depth limit, doorbell stride, timeout CAP.TO in 500 ms units) and VS.\n6. **Controller enable:** allocate the admin SQ and CQ in host memory, write AQA, ASQ and ACQ, set CC (entry sizes, page size, command set) and CC.EN = 1, then poll CSTS.RDY = 1, within the CAP.TO limit.\n7. **Admin setup:** Identify Controller and Namespace, Set Features for the number of I/O queues, Create I/O Completion Queue then Create I/O Submission Queue (the SQ refers to its CQ), and configure MSI-X vectors.\n8. **First read:** the driver writes the SQE, writes the SQ tail doorbell (MWr to BAR0), the SSD fetches the SQE (MRd and completion), reads NAND, DMA writes the data (MWr TLPs), posts the CQE (MWr) and an MSI-X (MWr). The driver sees the CQE and writes the CQ head doorbell.\n- **Where each stage fails:** no L0 means steps 1 to 2, config reads returning all 1s means the link or CRS timing, RDY never set means firmware or CC settings, and a timeout on the first I/O means the queue, interrupt or data path.","pitfall":"Treating \"link up\" as \"device usable\". Between L0 and the first I/O are DL_Active, enumeration, BAR programming, CC.EN and queue creation, each with its own failure signature.","verify":"PERST# and REFCLK timing in the CEM, the 20 ms link-training start rule, CRS behavior, and the admin opcodes and field names in the NVMe Base Specification.","follow":[{"q":"Which step has the longest and most variable time?","a":"CC.EN to CSTS.RDY, which depends on firmware initialization and can approach the CAP.TO limit, followed by BIOS and OS enumeration."},{"q":"Why create the CQ before the SQ?","a":"The Create I/O SQ command names the CQ that receives its completions, so that CQ has to exist first."}],"mod":18},{"id":"18.02","level":"Advanced","type":"Cross-layer","fig":null,"tags":["read","tlp","mps","flow-control","ordering","latency"],"q":"Trace a 4 KB read from the application down to NAND and back at every PCIe layer, with numbers.","short":"The driver writes a 64-byte SQE and a 4-byte doorbell (a posted MWr). The SSD fetches the SQE (MRd and completion), reads NAND, then DMA-writes the 4 KB as sixteen 256-byte MWr TLPs, a 16-byte CQE and a 4-byte MSI-X write. That is 22 TLPs, about 4.6 KB upstream and about 150 B downstream. The data takes about 0.57 microseconds on Gen4 x4, negligible next to the NAND read.","deep":"Assumptions: Gen4 x4, MPS 256 B, a 4 KB aligned buffer (one PRP), and a fixed per-TLP cost of 10 B (2 sequence number, 4 LCRC, 4 framing) plus the header: 16 B for 4DW memory requests and 12 B for completions. So a memory TLP adds 26 B and a completion adds 22 B.\n1. **Application to driver:** `pread` with O_DIRECT or io_uring, the block layer, then the NVMe driver builds the SQE (opcode 02h Read, PRP1 = buffer address) in the host SQ.\n2. **Doorbell:** MWr, 4 B payload, posted, to BAR0 at 1000h plus the queue offset (stride from CAP.DSTRD). Wire size 30 B.\n3. **SQE fetch:** SSD issues an MRd for 64 B (non-posted, with a Tag), the Root Complex returns a CplD. Wire size 26 B up, about 86 B down.\n4. **NAND and FTL:** address translation, NAND read, ECC. Tens of microseconds for a typical TLC read (assumed 50 to 100 microseconds). This is where most of the latency is.\n5. **Data DMA:** 4096 / 256 = 16 MWr TLPs, each 256 + 26 = 282 B, so 4512 B. At 7.877 GB/s that is 573 ns (286 ns on Gen5 x4). Efficiency 4096 / 4512 = 90.8 percent. A memory TLP cannot cross a 4 KB boundary, so an aligned buffer needs no split beyond MPS.\n6. **Flow control:** the 16 MWr TLPs use 16 posted-header credits and 16 x 16 = 256 posted-data credits (one data credit is 16 B). The Root Complex returns them with UpdateFC as its memory controller drains.\n7. **Completion:** CQE is a 16 B MWr (42 B on the wire) with the phase bit, then MSI-X is a 4 B MWr (26 B, a 3DW header because the interrupt address is below 4 GB). The driver later writes the CQ head doorbell (30 B).\n8. **Ordering matters:** the CQE and MSI-X are posted writes behind the data writes on the same path, so posted ordering guarantees the host sees the data before it sees the completion (see Flow Control & Ordering).\n9. **Totals:** 22 TLPs. Upstream 26 + 4512 + 42 + 26 = 4606 B. Downstream 30 + 86 + 30 = 146 B, plus DLLPs.\n- **Latency budget:** PCIe round trips (doorbell to SQE fetch, then data, CQE and interrupt) add a few microseconds, while NAND adds tens. At QD1 the link speed barely matters, and at high QD it sets the ceiling.","pitfall":"Assuming the completion can overtake the data. It cannot on the same path, because posted writes stay in order, and that is what NVMe relies on.","verify":"Whether your platform's MPS is 128 B, 256 B or 512 B, the NAND read latency of your part, and the CQE and PRP field details in the NVMe Base Specification.","follow":[{"q":"How does MPS 128 or 512 change this?","a":"128 B gives 32 TLPs and 83 percent efficiency, and 512 B gives 8 TLPs and 95 percent. The header cost is fixed per TLP."},{"q":"What if the buffer is not 4 KB aligned?","a":"The SSD needs two PRP entries, and the transfer splits at the page boundary into more, smaller TLPs."}],"mod":18},{"id":"18.03","level":"Principal","type":"Scenario","fig":null,"tags":["validation-plan","gen5","enterprise","exit-criteria","corner-matrix"],"q":"Design the PCIe validation plan for a new Gen5 x4 enterprise SSD.","short":"Define scope and risks, then cover link bring-up, electrical and margin, protocol and config, power management, resets and hot-plug, error injection, NVMe over PCIe, platform interoperability and long soak. Run each across a corner matrix (voltage, temperature, refclk, slots, speeds) on multiple units, automate with evidence capture on failure, and exit on quantified criteria: link-up yield bound, zero uncorrectable errors and miscompares, margin above limit, latency targets.","deep":"- **Scope:** form factor (U.2, U.3, E3.S, E1.S), speeds (Gen1 to Gen5), SR-IOV, hot-plug, IDE or DOE if offered, retimer topologies, and target platforms (CPU vendors, switches, backplanes).\n- **Test categories:**\n\n| Category | Examples |\n|---|---|\n| Link and LTSSM | Bring-up yield, speed and width changes, equalization, Recovery counts, downtrain and uptrain |\n| Electrical | Pre-compliance Tx and Rx, refclk tolerance, SSC, margin per lane |\n| Protocol and config | TLP variety and sizes, MPS and MRRS, 64-bit addresses, ordering, flow control, CRS, capabilities, BAR sizing |\n| Power | ASPM, L1.x, D-states, LTR, NVMe APST, exit latency |\n| Resets and hot-plug | PERST#, hot reset, FLR, CC.EN, subsystem reset, surprise removal |\n| Errors | AER, DPC, poison, UR, completion timeout, recovery and data verify |\n| NVMe over PCIe | Queue and interrupt scaling, doorbell handling, MSI-X, CMB or PMR if present |\n| Interop | Several root complexes and switches, BIOS versions, retimers, cable and backplane variety |\n| Soak | Long mixed load with data verify and thermal cycling |\n\n- **Corner matrix:** voltage low and high, temperature cold and hot, refclk SSC on and off with offsets, best and worst slot, and speed forced down.\n- **Automation:** every test scripted, reset loops, evidence capture on failure (see the Debug module), results database with firmware, BIOS and platform tags.\n- **Exit criteria:** link-up yield with a stated upper bound (3,000 clean trials gives 0.1 percent at 95 percent), zero uncorrectable errors and miscompares in soak, correctable rate under a throughput-impact threshold, worst-lane margin above characterization limits on all platforms in scope, latency and QoS targets met, and no open link-level issues above an agreed severity.\n- **Metrics reported:** yield per cell, correctable rate per GB, margin distribution, defect arrival and closure rate, platform coverage.","pitfall":"Writing a plan as a list of test cases without pass criteria, statistics or platform coverage. An interviewer wants the exit criteria and the reasoning behind them.","verify":"Which PCI-SIG and NVMe compliance programs apply to your form factor and generation.","follow":[{"q":"What is the highest-risk area?","a":"Interoperability and margin on real platforms, because compliance covers only reference conditions. Also resets and error recovery paths, which are the least exercised."},{"q":"How do you decide when to stop?","a":"When the exit criteria are met on the platforms in scope, the defect discovery rate has fallen, and there are no unexplained failures."}],"mod":18},{"id":"18.04","level":"Principal","type":"Scenario","fig":null,"tags":["field","interop","statistics","margin","population"],"q":"A Gen5 drive works in the lab but fails in about 2 percent of a customer's servers. How do you find out why?","short":"First explain why the lab missed it: with 2 percent, ten servers show nothing 82 percent of the time. Then treat it as a population problem. Collect a standard evidence bundle from failing and passing servers, build a table of platform attributes, find what separates them, and reproduce on a loaned failing server with swap tests. Measure margin on both populations, then fix by tuning, firmware or platform change and verify at the failure rate.","deep":"1. **Why the lab missed it:** the chance of seeing no failure in n servers is 0.98^n: 82 percent for 10, 36 percent for 50, 13 percent for 100. To have a 95 percent chance of catching one failing server needs about 148 servers (ln 0.05 / ln 0.98).\n2. **Define the failure:** link down, downtrain, timeouts, or drops? The signature drives everything else (see the Debug module's classification).\n3. **Evidence bundle from both groups:** `lspci -vvv` for the SSD and upstream ports, LnkSta and LnkSta2, AER counters, dmesg, `nvme smart-log`, error log, telemetry, BIOS, CPU and firmware versions, BMC logs, slot, backplane and cable.\n4. **Stratify:** find the attribute that separates failing from passing: platform generation, BIOS setting, backplane revision, retimer firmware, slot position, cable length, power supply, ambient temperature, drive firmware, unit lot.\n5. **Reproduce:** bring a failing server to the lab (or remote access). Swap tests: failing drive in a lab server, lab drive in the failing server, then swap slots and cables. The failure follows one item.\n6. **Measure margin:** run lane margining and equalization readouts in failing and passing servers. A population separated by low margin points to the tail of channel loss, connector tolerance, refclk or power noise, not a logic bug.\n7. **Fix and verify:** equalization or preset changes, firmware workaround, BIOS advice, or a platform change. Verify at the failing platform's rate with enough trials (150 or more for 2 percent).\n8. **Prevent:** add worst-channel screening and platform-diversity to the lab, and ship telemetry so margin and link events in the field are visible.","pitfall":"Declaring \"cannot reproduce\" after ten lab servers. Sample size, not luck, explains it.","verify":null,"follow":[{"q":"The failing servers all share one BIOS version. Is that the cause?","a":"It is a strong lead, not proof. Test by changing only the BIOS on a failing server, and check whether it also correlates with hardware batch."},{"q":"What if failing servers show no PCIe errors at all?","a":"Widen the search: firmware, host-side stalls, power events. Clean lower layers point up the stack (see the NVMe timeout question in this module)."}],"mod":18},{"id":"18.05","level":"Principal","type":"Debug","fig":null,"tags":["throughput","write","thermal","slc-cache","proving-link","bottleneck"],"q":"Sequential write throughput is high for 10 minutes and then drops. What are the PCIe-side and non-PCIe causes, and how do you separate them and prove the link is or is not the bottleneck?","short":"Look at the drop shape and what it correlates with. A drop after a fixed number of GB written points to an SLC cache or garbage collection, a drop after a fixed time points to thermal, and Bad TLP or Recovery counts rising point to the link. Prove the link is not the bottleneck by comparing throughput to the link ceiling, by lowering link speed or width and seeing no change, and by showing clean replay, credit and retrain evidence.","deep":"- **Non-PCIe causes:** SSD thermal throttling (composite temperature against the warning threshold), SLC write cache exhausted, steady-state garbage collection and write amplification, a power-state cap, host page cache write-back, CPU or memory throttling, and file system effects.\n- **PCIe causes:**\n  - Rising replays or retrains at higher temperature (Bad TLP rates, Recovery counts).\n  - A downtrain or width change (LnkSta).\n  - Write data is fetched by the SSD with MRd, so throughput depends on completion latency and outstanding reads. A slower host memory path (remote NUMA, IOMMU misses) can limit it without any error.\n  - Credit stalls and ASPM effects, less likely under sustained load.\n- **Separate with experiments:**\n  1. Plot throughput against time and against cumulative GB. GB-linked implies cache, time-linked implies thermal.\n  2. Log SSD temperature, throttle counters, LnkSta, AER rates and Recovery counts every few seconds beside throughput.\n  3. Repeat with a preconditioned drive, with a fan or heatsink change, and on another host.\n- **Prove the link is not the bottleneck:**\n  1. Ceiling: Gen5 x4 is about 15.75 GB/s per direction, about 14.3 GB/s at 256 B MPS. If you measure 3 GB/s, the link is at 20 percent.\n  2. Change the link: run at Gen4 (about 7.9 GB/s) or x2. If throughput does not move, the link is not limiting. If it drops proportionally, it is a co-limit.\n  3. Watch the link: zero replay, no Recovery, no credit stalls in an analyzer or PHY counters.\n  4. Use an SSD DMA loopback test (vendor tool) that moves data without NAND, to show the link and host can sustain the rate.\n  5. Queue depth: if throughput is flat as QD rises, the limit is the device, not the link.","pitfall":"Concluding PCIe is the bottleneck because measured throughput is below line rate. Line rate is a ceiling, and most workloads are limited elsewhere.","verify":"Your drive's thermal thresholds and throttle fields in the SMART log, and the effective TLP efficiency for your platform's MPS.","follow":[{"q":"The drop happens at the same GB every time, at any temperature. What is it?","a":"A finite fast region, most likely an SLC cache filling and the drive dropping to native write speed."},{"q":"Throughput is 60 percent of the ceiling with no errors. Is the link the limit?","a":"Not proven. Reduce link speed and see if it moves. Also check outstanding requests and completion latency (Little's law) and the host memory path."}],"mod":18},{"id":"18.06","level":"Principal","type":"Numeric","fig":null,"tags":["topology","switch","bifurcation","lanes","oversubscription","numa","hot-plug"],"q":"Design a 24-drive Gen5 NVMe server: budget the lanes and bandwidth, choose between direct attach and switches, and say what you validate.","short":"Twenty-four x4 drives need 96 lanes. Each Gen5 x4 is 15.75 GB/s per direction raw. Direct attach gives every drive its full lanes but consumes 96 of the host's lanes. Three switches with x16 uplinks use 48 host lanes but cap each 8-drive group near 57 GB/s, a 2:1 lane and about 1.7:1 bandwidth oversubscription at 12 GB/s per drive. Choose by the workload's real limit, such as network bandwidth.","deep":"Assumptions: Gen5 x4 drive = 32 GT/s x 4 x 128/130 = 15.75 GB/s per direction; 256 B MPS gives 256 / 282 = 90.8 percent TLP efficiency; each drive sustains 12 GB/s; the host has about 160 usable Gen5 lanes across two sockets (VERIFY per platform).\n1. **Lanes:** 24 x 4 = 96 lanes for drives.\n2. **Direct attach:** 96 host lanes, no oversubscription. Aggregate 24 x 12 = 288 GB/s. Leaves about 64 lanes for NICs and others.\n3. **Three switches, eight drives each, x16 uplink:** downstream 32 lanes and upstream 16, so 2:1 by lanes. Uplink 63.0 GB/s raw, x 0.908 = 57.2 GB/s usable. Demand 8 x 12 = 96 GB/s, so 1.7:1 oversubscription. Per drive about 7.2 GB/s when all are busy. Aggregate cap 3 x 57.2 = 172 GB/s. Uses 48 host lanes.\n4. **Compare with the consumer:** two 400 GbE NICs are about 100 GB/s per direction. Either option exceeds that, so a network-bound server does not need direct attach. A local analytics server that scans at 288 GB/s does.\n5. **Host memory:** each DMA byte lands in DRAM and is read again, so DRAM traffic is at least 2x. 12 channels of DDR5-4800 are about 461 GB/s peak per socket (assumed).\n6. **NUMA:** put 12 drives on each socket, keep the NIC and the application on the same node, and avoid cross-socket DMA.\n7. **Bifurcation and clocks:** an x16 slot must be set to x4x4x4x4 in BIOS, with a REFCLK and PERST# per drive, and retimers or short cables for Gen5.\n8. **Hot-plug:** native hot-plug per slot with power control, and DPC on switch ports so one drive fault does not take down its group.\n9. **Validate:**\n   - All 24 links train at Gen5 x4 on every boot (`lspci -tv`, LnkSta).\n   - Scaling test at 1, 4, 8, 12 and 24 concurrent drives, expecting linear scaling up to the limit.\n   - Error counters under full load, plus power and thermal with all drives busy.\n   - Hot-plug on each slot, DPC containment, NUMA placement, and staggered power-up to limit inrush.","pitfall":"Comparing lane counts instead of bandwidth to the real consumer. Oversubscription is acceptable when the downstream limit (network, CPU, DRAM) is below the uplink cap.","verify":"The usable lane count per platform, switch part port counts and features (DPC, peer-to-peer), and any inter-socket bandwidth limit.","follow":[{"q":"Why not x8 uplinks to save cost?","a":"A Gen5 x8 uplink halves the cap to about 28.6 GB/s per switch, or 3.6 GB/s per drive at 8 per switch. Fine for cold storage, poor for hot NVMe."},{"q":"What could make the measured number lower than 57.2 GB/s per uplink?","a":"MPS smaller than 256 B, non-optimal completions, switch arbitration, and host DMA limits."}],"mod":18},{"id":"18.07","level":"Advanced","type":"Debug","fig":null,"tags":["field","dmesg","logs","evidence","dropout"],"q":"A drive drops out intermittently in the field and all you have is dmesg. What can you conclude, and what do you ask for?","short":"You can conclude the time, the visible sequence, and whether the controller was unreachable or alive. A read of CSTS returning all 1s, with PCI_STATUS all 1s, means the device was not answering on the link. Timeouts with a readable, ready controller point to a stall. AER or DPC lines before the timeouts show the PCIe error first. You cannot conclude the layer, the direction, the LTSSM or the cause. Ask for config space, SMART, telemetry, versions and fleet correlation.","deep":"| Pattern in the log | Conclusion | Follow-up |\n|---|---|---|\n| \"controller is down\" with CSTS and PCI_STATUS all 1s | Reads returned all 1s: link down, device removed or unresponsive | AER, hot-plug or DPC lines before it, and whether a rescan brought it back |\n| I/O timeouts, abort, reset, CSTS readable | Device alive and not completing | SSD firmware, thermal, queue or interrupt |\n| AER uncorrected or fatal lines naming a port | A PCIe error came first, and the type says which layer | Decode the error and the reporting device |\n| Hot-plug \"Link Down\" or DPC containment | Port-level link loss or containment | What triggered it |\n| Rising corrected errors before the drop | Marginal link trending worse | Rate and load correlation |\n| No AER lines at all | Ambiguous: masked, firmware-owned, or no error reported | Check platform AER ownership |\n\n- **Cannot conclude:** the direction, the LTSSM path, whether it was the drive, slot or power, or the temperature. A single log is one sample.\n- **Ask for:**\n  1. Full dmesg from boot to the event, and the previous boot's log.\n  2. `lspci -vvv` for the SSD and upstream ports, before and after.\n  3. `nvme smart-log` and `error-log` (unsafe shutdown and power cycle counts), controller-initiated telemetry.\n  4. Kernel, BIOS, drive firmware, slot, backplane, rack and PSU details, plus BMC event log (power and thermal).\n  5. Whether the drive came back on a rescan or needed a power cycle.\n  6. How many drives, slots and servers show the same pattern.\n- **Shared cause versus single drive:** several drives dropping at the same moment on one backplane or switch points to power, the switch or the backplane. A single drive on a single slot points to the drive or slot.","pitfall":"Naming a root cause from a dmesg excerpt. The log tells you what the host saw, not what happened on the link.","verify":"The exact wording of nvme and AER messages on your kernel version, and platform AER ownership (firmware-first or native).","follow":[{"q":"The drive returns after a rescan. What does that tell you?","a":"The drive and slot are not dead. It was a link event, a reset, or a hung controller that was recovered, so look at DPC, hot-plug and AER handling."},{"q":"No AER in the log. Does that mean no PCIe error?","a":"No. AER may be masked, owned by firmware, or the failure never produced an error message, such as a sudden power loss to the slot."}],"mod":18},{"id":"18.08","level":"Principal","type":"Numeric","fig":null,"tags":["regression","link-up","statistics","rule-of-three","automation","confidence"],"q":"Design an automated regression for link-up yield across resets, speeds and temperatures, with a statistical pass criterion.","short":"Define a trial (reset, then check speed, width, DL active, config read, CSTS.RDY and one verified I/O). Run it over a matrix of reset types, target speeds and temperatures. With zero failures in n trials, the 95 percent upper bound on the failure rate is about 3 / n, so 3,000 clean trials of one unit in one cell bound the rate below about 0.1 percent. Screen every cell with about 300 trials and go deep on the worst cells.","deep":"1. **Trial definition:** reset type (cold power cycle, warm reboot, hot reset, secondary bus reset, FLR, link disable and enable), then pass only if LnkSta speed and width equal the expected values, Data Link Layer Link Active is set, config space is readable, CSTS.RDY = 1, one I/O verifies, and AER shows no uncorrectable error. A lower speed than expected is a failure, classified separately.\n2. **Matrix example:** 5 reset types x 3 target speeds (Gen3, Gen4, Gen5) x 3 temperatures (cold, ambient, hot) = 45 cells.\n3. **Rule of three:** with zero failures in n independent trials, the 95 percent upper bound on the rate is 1 - 0.05^(1/n), about 3 / n.\n\n| Target failure rate | Trials for 95 percent | For 99 percent |\n|---|---|---|\n| 1 percent | 299 | 459 |\n| 0.5 percent | 598 | 919 |\n| 0.1 percent | 2,995 | 4,604 |\n| 0.01 percent | 29,957 | 46,050 |\n\n4. **With failures:** 1 failure in n gives an upper bound of about 4.74 / n, 2 failures about 6.3 / n. Report the bound with the count, and use an exact interval, not just k / n.\n5. **Time budget:** at 45 s per trial, one cell of 3,000 trials takes 37.5 h on one rig. A tiered plan: tier 1 is 300 per cell x 45 cells = 13,500 trials (bound 1 percent per cell), tier 2 is 3,000 in the three worst cells = 9,000 trials. Total 22,500 trials = 281 h, or about 47 h on six rigs.\n6. **Independence traps:** failures cluster by unit, slot and temperature. Randomize order, power-cycle between trials, do not pool across units, and report per-unit and per-cell results. A failing trial can leave the rig in a bad state, so freeze it and capture evidence before continuing.\n7. **Gate:** release requires each cell's upper bound below its tier's target (300-trial cells are only bounded at about 1 percent, so state that limit), no unexplained failure, and any failure root-caused. Compare firmware versions by bounds, not by single counts.","pitfall":"Pooling all trials into one number. A cell that fails at 5 percent hides inside a pool of many that never fail.","verify":"Reset methods your platform exposes and their real duration, and exact confidence-interval method your organization uses.","follow":[{"q":"1 failure in 3,000 trials. Does it pass a 0.1 percent target?","a":"The bound is 4.74 / 3,000 = 0.16 percent, so not proven. Root-cause it, or extend to about 4,750 trials in total with no further failure."},{"q":"Why not run all 45 cells at 3,000?","a":"135,000 trials at 45 s is 1,688 h. The tiered plan finds bad cells cheaply and spends time only where the risk is."}],"mod":18},{"id":"18.09","level":"Advanced","type":"Scenario","fig":null,"tags":["hot-plug","surprise-removal","esd","inrush","dpc","pciehp"],"q":"How do you validate hot-plug and surprise removal without damaging hardware?","short":"Use hot-plug-rated slots and connectors, and do bulk cycling with a hot-plug emulator fixture that switches power, presence and PERST# electrically so the connector is not worn out. Test orderly removal, surprise removal under I/O load, hot-add, and neighbors during events. Check that the OS and drivers contain the failure with no hang or panic, and that data acknowledged before removal survives.","deep":"- **Hardware safety:**\n  - Use form factors and connectors designed for hot-plug (U.2, U.3, E1.S, E3.S). M.2 is generally not hot-plug rated.\n  - Rated mating cycles are limited, so put thousands of cycles on a fixture with relays or FETs on power, presence detect and PERST#, keep real mating to a small count, and use a robot or guide.\n  - Mating sequence: ground and precharge first, power next, signals last. Backplanes should have a hot-swap controller with inrush limiting, and you should measure inrush and neighbor rail dips on a scope.\n  - ESD control and orderly power-off before manual removal.\n- **Scenarios:**\n  1. Orderly removal: `echo 0 > /sys/bus/pci/slots/<slot>/power` or the attention button, and device removal in the OS.\n  2. Surprise removal at idle and under fio load: I/O errors reach the application, no hang, no panic, no leaked resources.\n  3. Hot-add: enumeration, BAR assignment and driver bind, with bus numbers and windows reserved (see the Resets, Hot-Plug module).\n  4. Repeat behind a switch, with DPC, and confirm the error does not spread to other ports.\n  5. Neighbors: run I/O on adjacent drives during insertion and removal, and check for errors caused by rail dips or crosstalk.\n- **Device side:** surprise removal is a power loss for the drive. Verify power-loss protection, that `unsafe_shutdowns` increments, and that data acknowledged with a flush survived.\n- **Pass criteria:** thousands of cycles, zero hangs, zero panics, all neighbor I/O uninterrupted, re-enumeration every time, no data loss for acknowledged writes.","pitfall":"Testing hot-plug on a slot or drive not designed for it. You can damage the connector, drive or backplane.","verify":"Connector mating-cycle ratings, mating sequence and hot-plug requirements in the form-factor specification (SFF or OCP) for your drive.","follow":[{"q":"What does the host see on a surprise removal?","a":"Surprise Down at the port (or a hot-plug event), pending requests never complete and time out, and the NVMe driver sees reads of all 1s. A hot-plug slot should treat it as a removal, not a fatal error."},{"q":"Why an emulator fixture?","a":"A connector is rated for a limited number of mating cycles, and manual insertion also varies. Electrical switching gives repeatable timing and unlimited cycles."}],"mod":18},{"id":"18.10","level":"Principal","type":"Scenario","fig":null,"tags":["backplane","retimer","redesign","gen4","channel-loss","decision"],"q":"You inherit a flaky Gen4 backplane. How do you decide between adding retimers and redesigning it?","short":"Measure before choosing. Quantify per-slot failure, lane margin and channel loss against the Gen4 budget of about 28 dB at 8 GHz, find whether failures track slot position, drive or connector, and try cheap fixes first (presets, BIOS, connector rework). If the worst slots are only slightly over budget, retimers are a fast fix. If margin is structurally short or Gen5 is coming, redesign.","deep":"1. **Stabilize and measure:** per-slot link-up yield, correctable rates and lane margin, at temperature, across several drives. Plot margin against slot channel loss (VNA or simulation) and trace length.\n2. **Read the pattern:**\n   - Only the far slots fail: length and loss, a budget problem.\n   - One or two slots: connector, via or assembly defect, fix locally.\n   - Fails with certain drives: drive-side issue, not the backplane.\n   - Fails with certain hosts: host board, BIOS equalization.\n3. **Cheap fixes first:** transmitter presets and receiver settings, BIOS equalization settings, refclk and power checks, connector rework or replacement.\n4. **Compare options:**\n\n| Option | Strength | Cost and risk |\n|---|---|---|\n| Retimer | Splits the channel into two budgets, restores margin quickly | Added part, power, latency (tens of ns), firmware and configuration, own failure modes, more validation |\n| Redriver | Cheap boost | Amplifies noise and jitter, does not fix jitter, can interfere with training |\n| Redesign | Removes the cause: lower-loss material, shorter routes, better connector and vias | Cost, schedule, respin risk |\n\n5. **Decide with data:** if the worst slot is over budget by a small margin and the rest are fine, a retimer is fast. If most slots have little margin, or the product must carry Gen5 later, redesign, because at Gen5 a board and backplane get a far smaller share of the loss budget (the overall channel budget is about 36 dB at 16 GHz, but each inch loses much more at that frequency and the package and silicon take their share), and the retimers would be needed anyway.\n6. **Verify the choice:** repeat the margin and yield tests, and update the plan with the retimer's firmware and temperature behavior (see the Equalization and Retimers module).","pitfall":"Choosing a retimer because it is the fastest fix without asking whether the loss is at one slot or across the backplane.","verify":"The loss budgets per generation (28 dB at 8 GHz for Gen4, 36 dB at 16 GHz for Gen5) and what part of the total belongs to the host, backplane and drive.","follow":[{"q":"Why not just use a redriver?","a":"It does not reset jitter or noise and cannot recover a marginal link that is jitter limited. It can also interfere with equalization."},{"q":"What would change your decision toward redesign?","a":"Margin that is structurally short across many slots, no cost or schedule room for retimer validation, or a Gen5 roadmap for the same backplane."}],"mod":18},{"id":"18.11","level":"Advanced","type":"Scenario","fig":null,"tags":["error-handling","injection","containment","recovery","data-integrity"],"q":"How do you validate error handling end to end: inject, contain, log, recover, and verify data?","short":"For each error class choose an injection method, define the expected containment, log entries and recovery, and then run I/O with data verification before, during and after. Check that the right error is logged at the right place, the fault stays contained, the system recovers without hang or panic, and no data is silently corrupted.","deep":"| Injection | Layer | Expected containment and log | Recovery and check |\n|---|---|---|---|\n| Corrupt LCRC or Nak | Data Link | Bad TLP counted, replay, no visible failure | No data error, throughput dip only |\n| Bad DLLP | Data Link | Bad DLLP counted | Later DLLPs recover |\n| Poisoned TLP | Transaction | Poisoned TLP logged at the receiver, data not consumed | Command error or defined driver action, no silent use |\n| UR from an unmapped address | Transaction | Completion with UR, IOMMU or AER log | Command fails cleanly |\n| Withheld completion | Transaction | Completion timeout logged | Command aborts or resets, no hang |\n| Surprise down | Link | DPC or hot-plug event | Driver error handling, other devices unaffected |\n| Controller fatal (CSTS.CFS) | NVMe | Driver detects the fault | Controller reset, I/O resumes |\n\n- **Injection tools:** analyzer or exerciser (LCRC, DLLP, poison, delay completions), OS AER injection (`aer-inject` on Linux), ACPI EINJ for platform errors, kernel fault injection for NVMe and block, and firmware test hooks in the SSD.\n- **Contain:** a downstream port with DPC should stop traffic and prevent poisoned or corrupt data being consumed (see the Errors, AER & DPC module). Check that neighbors keep running.\n- **Log:** the right AER bit, header log and first error pointer, on the correct device, plus a kernel message and a rasdaemon record.\n- **Recover:** the AER driver flow (error detected, slot reset, resume) and the NVMe driver's handlers, then confirm the link retrains and I/O resumes within a time budget.\n- **Verify data:** run fio with data verification or per-LBA patterns and end-to-end protection information, and compare with a reference model after each recovery. Confirm no torn or stale data and no silent acceptance of poison.\n- **Metrics:** recovery time, I/Os failed, false positives, missing logs, and zero silent corruption.","pitfall":"Checking that the error is logged but not that the recovered data is correct. Inject, then verify content.","verify":"Availability of aer-inject, EINJ and NVMe fault injection on your kernel and platform, and the exact AER bits that map to each injected error.","follow":[{"q":"Which is the most dangerous outcome?","a":"Silent data corruption, where an error is not detected or is logged but data is still used. A hang is bad, corruption is worse."},{"q":"How do you test that a correctable error stays invisible?","a":"Inject at a rate and verify throughput and data. The only effect is the replay cost and the counter."}],"mod":18},{"id":"18.12","level":"Advanced","type":"Concept","fig":null,"tags":["gen4","gen5","gen6","flit","pam4","validation-differences"],"q":"Compare validating Gen4, Gen5 and Gen6 devices. What changes in the plan?","short":"Gen4 and Gen5 are both NRZ with 128b/130b, so the protocol tests carry over, but Gen5 has a tighter channel budget, adds precoding, and leans on retimers, so margin and channel work grow. Gen6 changes the game: PAM4, FLIT mode with FEC and flit-level replay, so the error model, counters, analyzers and instruments change. NVMe and software layers stay the same.","deep":"| Area | Gen4 (16 GT/s) | Gen5 (32 GT/s) | Gen6 (64 GT/s) |\n|---|---|---|---|\n| Signaling | NRZ | NRZ | PAM4, 32 GBaud |\n| Encoding and framing | 128b/130b | 128b/130b | FLIT mode, FEC and CRC |\n| Channel budget | About 28 dB at 8 GHz | About 36 dB at 16 GHz | Similar Nyquist, far less SNR |\n| Error model | Raw BER near 1e-12, LCRC replay | Same, precoding to limit DFE bursts | Raw pre-FEC BER much higher, FEC corrects and flit replay catches the rest |\n| Typical debug counters | Bad TLP, replay, Recovery | Same, plus retimer statistics | FEC and flit error and replay counts (VERIFY names) |\n| Retimers | Sometimes | Often | More often |\n| Instruments | Analyzer, scope | Higher bandwidth | Flit-aware analyzer, much higher bandwidth |\n| New features to validate | Lane margining | Precoding, more margin | FLIT, FEC, L0p |\n\n- **What carries over:** config space, enumeration, NVMe queues, MSI-X, resets, error classes, most of the plan.\n- **Gen5 additions:** margin per lane becomes the primary health metric, retimer segments must be validated, and thermal and channel corners matter more.\n- **Gen6 additions:** validate FEC and CRC behavior and flit replay, measure pre-FEC error rates, verify L0p, check latency (FEC adds delay), and prove that DLLP-based debug assumptions (Ack, Nak, replay counters) are replaced by flit-level equivalents. BER-style claims move to pre-FEC and flit-level error rates.\n- **Plan effect:** keep the layered checklist, but add the new counters and decode, and revalidate the exit criteria. Do not reuse Gen4 error thresholds.","pitfall":"Assuming a Gen5 test plan scales to Gen6 by changing the speed. PAM4, FEC and flits change what an error is.","verify":"Flit size and field layout, FEC and replay behavior, L0p, Gen6 counter names and requirements in PCIe Base 6.x, and Gen6 compliance program status.","follow":[{"q":"Why do Gen5 drives more often need retimers than Gen4?","a":"The channel budget at 16 GHz Nyquist is tighter for the same board and connector, so more topologies exceed it."},{"q":"What do you keep from a Gen4 plan for Gen6?","a":"The layered method, reset and enumeration tests, NVMe tests, corner matrix and statistics. Replace the electrical and error-model tests."}],"mod":18},{"id":"18.13","level":"Advanced","type":"Trap","fig":null,"tags":["nvme","timeout","doorbell","msi-x","checkpoints","clean-counters"],"q":"The NVMe driver logs an I/O timeout but every PCIe counter is clean. Where do you look next?","short":"Clean error counters do not mean a healthy path. A lost doorbell, a stuck credit, a masked interrupt or a hung firmware produces no PCIe error. Walk the six checkpoints of a command: doorbell arrived, SQE fetched, SQE completion returned, data moved, CQE posted, MSI-X sent. The first missing step names the suspect. Without an analyzer, use CSTS, interrupt counts, MSI-X mask and PBA state, and SSD debug logs.","deep":"| Checkpoint | If it is missing | Suspect |\n|---|---|---|\n| 1. Doorbell MWr reaches the SSD | Nothing starts | Host driver, BAR or Memory Space Enable off, write not delivered, link |\n| 2. SQE fetch (MRd) issued | Doorbell seen, nothing happens | Bus Master Enable clear, SSD firmware stalled, queue disabled |\n| 3. SQE completion returned | MRd sent, no CplD | Host memory path, IOMMU, Root Complex (a completion timeout may follow) |\n| 4. Data transfer | Command fetched, no data | Firmware or NAND stall, garbage collection, thermal throttle |\n| 5. CQE posted | Data moved, no CQE | Firmware completion path |\n| 6. MSI-X sent | CQE present, host not woken | MSI-X or vector masked, wrong affinity, pending bit set, driver |\n\n- **Without an analyzer:** read CSTS (RDY, CFS), `/proc/interrupts` per queue, the MSI-X Function Mask and the PBA, whether polling the CQ finds the completion, `nvme get-feature` for APST and power state, block-layer traces (`blktrace`, ftrace nvme events), SSD debug logs and temperature.\n- **Extra suspects:** a power-state exit latency (APST plus L1.2) exceeding a tight timeout, a long firmware pause (garbage collection or a thermal event), and host stalls (soft lockup, interrupt storm).\n- **Scope of the timeout:** one queue, one namespace, one command type, or everything? All queues at once points to the controller or the link. One queue points to interrupt or driver state.\n- **Why counters are clean:** they count errors that a layer detects. A missing packet, an undelivered doorbell or a masked interrupt is not an error to any layer.","pitfall":"Reading \"no AER errors\" as \"not PCIe\". Lost or delayed packets need an analyzer or a device-side log to show.","verify":"Default nvme_core timeout parameter names and values on your kernel, and the MSI-X Function Mask and PBA layout in the Interrupts module and spec.","follow":[{"q":"What default timeouts should you keep in mind?","a":"Linux uses about 30 s for I/O and 60 s for admin commands by default (nvme_core parameters). A short timeout in your test may only be exposing a long firmware pause."},{"q":"PBA bit set but no interrupt: what does it mean?","a":"The device sent the interrupt but the vector or function was masked, so it is pending. Look at the host's masking and the driver."}],"mod":18},{"id":"18.14","level":"Advanced","type":"Cross-layer","fig":null,"tags":["l1.2","aspm","ltr","power","latency","clkreq"],"q":"Explain L1.2 power-saving trade-offs and how you validate that latency targets are met.","short":"L1.2 gates the reference clock and turns off the link's common-mode bias, so idle power drops, but the first I/O after idle pays an exit latency of tens of microseconds or more (the drive's T_POWER_ON plus common-mode restore plus Recovery). LTR tells the host how much latency the device tolerates. Validate by measuring idle power, state residency and the QD1 latency-versus-idle-gap curve, and require the tail latency to meet the target.","deep":"- **Mechanism (see the Power Management module):** the L1 PM Substates capability adds L1.1 and L1.2. L1.2 needs CLKREQ# to let the platform remove REFCLK, and LTR to decide when it is safe. The link enters L1.2 only when idle long enough and LTR allows.\n- **Trade-off:** saves the most idle power (the difference between L0 idle and L1.2 idle is large for a drive, on the order of hundreds of mW, VERIFY), costs exit latency on the first I/O, which lands in the p99 and p99.9 at low queue depth.\n- **Interplay with NVMe:** APST puts the controller in a deeper NVMe power state after idle, with its own entry and exit latencies. The two exit latencies can add.\n- **Validation steps:**\n  1. Confirm entry: read L1SS control bits and LTR values, watch CLKREQ# and REFCLK on a scope, use PHY residency counters, and measure the 3.3 V rail power.\n  2. Measure exit latency: from the first doorbell or CLKREQ# assertion to L0 and the first TLP, on an analyzer.\n  3. Latency curve: QD1 4 KB reads with idle gaps from 10 microseconds to 10 seconds (`fio --thinktime`, `--lat_percentiles=1`). The latency steps up at the L1 entry timer and again at L1.2 thresholds.\n  4. Compare p50, p99, p99.9 with substates enabled and disabled. Pass if the added tail latency is within the target.\n  5. Stress: millions of entry and exit cycles, at temperature, with retimers, checking for errors and link retrains.\n  6. Platform matrix: host support and LTR programming differ.\n- **Example:** if L1.2 exit is 70 microseconds (hypothetical) and the read takes 80, the first read after idle is 87 percent slower, which matters for a latency SLA and not for a cold archive.","pitfall":"Validating only that the link enters L1.2 and saves power. The requirement is the tail latency, so measure the first I/O after idle.","verify":"L1.1 versus L1.2 clock and common-mode behavior, the T_POWER_ON and Common Mode Restore Time fields, typical exit latency, and LTR threshold rules in the Base Specification.","follow":[{"q":"Why can LTR values make L1.2 never engage?","a":"If the device reports a tolerance below the L1.2 exit latency (or the threshold), the platform will not allow L1.2."},{"q":"Where do you look if the tail latency got worse after enabling substates?","a":"The idle-gap curve, the exit latency, LTR values, and APST settings."}],"mod":18},{"id":"18.15","level":"Advanced","type":"Cross-layer","fig":null,"tags":["rapid-fire","link","physical","ltssm","electrical"],"q":"Rapid fire: link and physical. Answer ten one-liners.","short":"This round checks fast recall across the physical layer, LTSSM, equalization and Data Link basics. Answer each in one sentence, then be ready to go one level deeper on any of them. The goal is precise, correct one-liners, and admitting VERIFY items instead of guessing.","deep":"- **Why does Polling run at 2.5 GT/s?** Every device supports it and it needs no equalization, so it is the common starting point.\n- **Which state handles a speed change and an L1 exit?** Recovery.\n- **What is the Gen4 Nyquist frequency?** 8 GHz, half of 16 GT/s for NRZ.\n- **What is the Gen3 and above encoding overhead?** 128b/130b, about 1.5 percent, versus 20 percent for 8b/10b.\n- **What does a retimer do that a redriver does not?** It recovers the clock and retransmits, splitting the channel into two budgets.\n- **What is a SKP ordered set for?** Absorbing clock differences between two reference clocks by adding or removing symbols.\n- **What does Receiver Error mean, versus Bad TLP, and who logs them?** Receiver Error is a PHY-level decode or framing failure and Bad TLP is an LCRC or sequence failure. The receiver logs both, so Bad TLP at the endpoint describes the inbound direction.\n- **What does Replay Number Rollover cause?** The Data Link Layer requests link retraining (Recovery).\n- **What does lane margining tell you?** The timing and voltage margin at a real receiver, per lane and direction, in system.\n- **What is the difference between an L0 link and a usable link?** The Data Link Layer must also reach DL_Active after flow control initialization.","pitfall":"Padding one-liners with detail. Give the crisp answer first and let the interviewer pull the depth.","verify":"The 36 dB and 28 dB budget figures, SKP interval, and encoding overheads in the Base Specification.","follow":[{"q":"Which of these did you have to hedge on?","a":"Say plainly which ones: the numbers that sit under VERIFY in this guide, such as budgets and timeouts. Say where you would look them up."},{"q":"How would you extend one answer into a debug story?","a":"Choose one, for example Rollover, and say what you would read (AER, LnkSta, LTSSM history) and what you would change."}],"mod":18},{"id":"18.16","level":"Advanced","type":"Cross-layer","fig":null,"tags":["rapid-fire","protocol","system","nvme","tlp","aer"],"q":"Rapid fire: protocol and system. Answer ten one-liners.","short":"This round covers TLPs, ordering, config space, interrupts, AER and NVMe over PCIe. Give one crisp sentence for each and expect a follow-up on any. Precision matters more than volume, and anything spec-sensitive should be flagged instead of guessed.","deep":"- **Which requests are posted?** Memory writes and messages. Reads, I/O and config requests are non-posted and get completions.\n- **What limits the payload size and the read request size?** MPS (the lowest of the two ends) limits payload, MRRS limits how much one read request can ask, and completions split at the RCB.\n- **Can a memory TLP cross a 4 KB boundary?** No. The address plus length must stay within a 4 KB region.\n- **What is CRS for?** Configuration Request Retry Status lets a device that is not ready delay enumeration without failing it.\n- **Why does the CQE not overtake the data?** Both are posted writes on the same path and posted writes stay in order.\n- **Where do NVMe doorbells live?** In BAR0 starting at offset 1000h, spaced by the stride in CAP.DSTRD.\n- **MSI versus MSI-X for NVMe?** MSI-X gives a per-vector table with masking and up to 2048 vectors, so each queue can have its own vector and CPU.\n- **What does a UR completion mean?** The completer does not support or cannot route the request. It is an error class. The completer detects and logs it, and the requester sees the status in the completion and may log it too.\n- **What does DPC do?** It contains an uncorrectable error by disabling the downstream port's link so bad data does not spread, and lets software recover.\n- **FLR versus CC.EN = 0?** FLR resets the whole function, including PCIe state, and CC.EN = 0 resets only the NVMe controller.","pitfall":"Answering from memory of one platform. MPS, RCB and timeouts vary, so say \"typically\".","verify":"The MSI-X table size limit, the doorbell offset and stride rules, and FLR and CC.EN behavior in the Base and NVMe specifications.","follow":[{"q":"Pick one answer you gave and describe a failure that violates it.","a":"For example, a completion arriving before its data would break the producer-consumer model, which shows up as stale data with a good CQE."},{"q":"Which answers depend on the platform?","a":"MPS and RCB, completion timeout values, and DPC and AER ownership, so state them as defaults, not universal facts."}],"mod":18},{"id":"18.17","level":"Principal","type":"Scenario","fig":null,"tags":["communication","leadership","root-cause","stakeholders","status"],"q":"How do you communicate a root cause and fix status to stakeholders?","short":"Lead with the conclusion and its status in one line, then give evidence, confidence, blast radius, workaround, next steps with dates, and the decision you need. Separate what is proven from what is suspected, quantify with rates and confidence, name the affected populations, and update on a fixed cadence. Do not mix root cause and fix status, and never let a hypothesis sound like a finding.","deep":"- **Structure of the update:**\n  1. **Status line:** what is known and where the fix stands, in one sentence.\n  2. **Impact and blast radius:** which products, platforms, firmware and customers, and what fraction. For example \"about 2 percent of servers on platform X\".\n  3. **Evidence:** the decisive observations (swap test result, margin data, trace), not the whole investigation.\n  4. **Confidence:** proven, likely or hypothesis, and what would change it.\n  5. **Workaround and mitigation:** what customers can do now.\n  6. **Plan:** next steps with owners and dates, and how the fix will be verified (rate and trials).\n  7. **Ask:** the decision, resource or approval needed.\n- **Principal-level habits:**\n  - Say what you do not know, and how you will find out.\n  - Give numbers with intervals (0 failures in 3,000 trials means under 0.1 percent at 95 percent), not \"looks stable\".\n  - Keep one source of truth and a fixed update time.\n  - Escalate early when the risk or timeline changes, not after.\n  - After the fix, publish the escape analysis: why the lab missed it and what regression now covers it.\n- **Audience:** engineering wants signatures and data, program managers want dates and risk, executives want impact and decisions. Same facts, different depth.","pitfall":"Reporting activity (\"we are investigating\") instead of state: what is known, what is not, and what changes next.","verify":null,"follow":[{"q":"Root cause is only 70 percent certain. What do you tell people?","a":"State it as the leading hypothesis with the evidence for and against, name the test that will confirm it and when, and give the mitigation that holds in either case."},{"q":"A customer wants a date. What do you say?","a":"A range tied to milestones, such as \"fix build in X days, verification needs about N trials, which is Y days\", not a single optimistic date."}],"mod":18},{"id":"18.18","level":"Principal","type":"Scenario","fig":null,"tags":["mentoring","training","analyzer","trace-reading","team"],"q":"How would you mentor a new validation engineer to read a protocol-analyzer trace in one week?","short":"Start from a known-good capture and build up layer by layer: link-up anatomy on day 1, one NVMe command's TLPs on day 2, ACK/NAK and replay on day 3, LTSSM and Recovery on day 4, and a blind debug of unlabeled traces on day 5. Each day ends with an annotated deliverable. Teach the good-versus-bad diff, triggers and filters, and what a trace cannot show.","deep":"| Day | Focus | Exercise | Output |\n|---|---|---|---|\n| 1 | Anatomy of link-up | Mark every phase on a good capture from PERST# to L0: TS1 and TS2, EIEOS, SKP, InitFC1 and InitFC2, first config TLPs | Annotated timeline with timestamps |\n| 2 | Reading TLPs | Follow one NVMe read: doorbell, SQE fetch, data MWr TLPs, CQE, MSI-X. Match tags, lengths and addresses | Table of the 22 TLPs and the byte count and efficiency |\n| 3 | Data Link Layer | A capture with an injected LCRC error: sequence numbers, Nak, replay, Acks | Written explanation of the replay and the cost |\n| 4 | LTSSM and Recovery | Compare normal L1 exit, a speed change, a downtrain and Polling.Compliance snippets | State trail and cause for three snippets |\n| 5 | Blind debug | Three unlabeled traces, each with a different fault. Also set the trigger and filter for one | Ten-minute readout with confidence levels |\n\n- **Method to teach:**\n  - Always read a known-good trace first, then diff the failing one against it.\n  - Work in layers: framing, then DLL (sequence numbers, Ack and Nak), then TL (type, address, tag, length, status), then LTSSM and NVMe meaning.\n  - Use a checklist: who sent it, which direction, what came before, what should come next, and what is missing.\n  - Practice triggers, pre-trigger depth, filters and timestamp correlation (see the Debug module).\n- **Limits to teach early:** the analyzer sees the wire at its tap, not the receiver's view, and an interposer changes the channel.\n- **Assessment:** by Friday they can explain a trace to another engineer in two minutes, predict the next packet, say what the trace cannot show, and hand over an annotated file someone else can follow.\n- **Support:** pair on the first real failure, keep a reference library of annotated captures, and review their first three written findings for evidence and confidence wording.","pitfall":"Starting with a hard failing trace. With no baseline, everything looks abnormal, so start with known-good and change one thing at a time.","verify":null,"follow":[{"q":"The new engineer freezes on raw symbols. What do you do?","a":"Move up a level: use the decoded view with a short list of what to look for, and only drop to symbols to answer a specific question."},{"q":"How do you know the week worked?","a":"They correctly classify a blind trace, their annotations are usable by others, and they ask \"what would I expect to see here\" before opening a capture."}],"mod":18}]};
</script>
<script>
(function(){
'use strict';
var LEVELS=['Basic','Intermediate','Advanced','Principal'];
var TYPES=['Concept','Numeric','Scenario','Debug','Cross-layer','Trap'];
var MODS=DATA.modules, Q=DATA.questions;
var byId={}; Q.forEach(function(q,i){
  q._i=i; byId[q.id]=q;
  q._hay=(q.q+' '+q.short+' '+q.deep+' '+q.follow.map(function(f){return f.q+' '+f.a;}).join(' ')+' '+(q.pitfall||'')+' '+(q.verify||'')+' '+q.tags.join(' ')).toLowerCase();
});
var modById={}; MODS.forEach(function(m){ m.qs=Q.filter(function(q){return q.mod===m.id;}); m.built=m.qs.length>0; modById[m.id]=m; });

/* ---------- storage ---------- */
var LS='pcieqa.v1', storageOK=true;
function blank(){return {ratings:{},notes:{},last:null,mode:'study',rounds:[]};}
function load(){
  try{ var s=JSON.parse(localStorage.getItem(LS)); if(s&&s.ratings){ s.notes=s.notes||{}; s.rounds=s.rounds||[]; s.mode=s.mode||'study'; return s; } }catch(e){ storageOK=false; }
  return blank();
}
var store=load();
function save(){ try{ localStorage.setItem(LS,JSON.stringify(store)); }catch(e){ storageOK=false; } }

/* ---------- state ---------- */
var S={search:'',levels:new Set(LEVELS),types:new Set(TYPES),status:'all',open:new Set(MODS.filter(function(m){return m.built;}).slice(0,1).map(function(m){return m.id;})),cur:null,revealed:false,mock:null};
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function stOf(q){ var r=store.ratings[q.id]; return r?r.r:'none'; }
function fmtTime(ms){ var s=Math.floor(ms/1000),m=Math.floor(s/60); s=s%60; return m+':'+(s<10?'0':'')+s; }

/* ---------- mini markdown ---------- */
function inline(s){ s=esc(s); s=s.replace(/`([^`]+)`/g,'<code>$1</code>'); s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); return s; }
function mdTable(rows){
  var cells=rows.map(function(r){ return r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(c){return c.trim();}); });
  var head=cells[0], body=cells.slice(1); if(body.length&&/^[\s:|-]+$/.test(body[0].join(''))) body=body.slice(1);
  return '<table><thead><tr>'+head.map(function(c){return '<th>'+inline(c)+'</th>';}).join('')+'</tr></thead><tbody>'+
    body.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+inline(c)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';
}
var LIST_RE=/^(\s*)(-|\d+\.) (.*)$/;
function mdList(L,i,indent){
  var m=LIST_RE.exec(L[i]), tag=m[2]==='-'?'ul':'ol', start=tag==='ol'?parseInt(m[2],10):1, items=[];
  while(i<L.length){
    m=LIST_RE.exec(L[i]); if(!m) break;
    var ind=m[1].length, t=m[2]==='-'?'ul':'ol';
    if(ind<indent) break;
    if(ind>indent){
      if(!items.length) break;
      var r=mdList(L,i,ind); items[items.length-1]+=r.html; i=r.i; continue;
    }
    if(t!==tag) break;
    items.push(inline(m[3])); i++;
  }
  return {html:'<'+tag+(tag==='ol'&&start!==1?' start="'+start+'"':'')+'>'+items.map(function(x){return '<li>'+x+'</li>';}).join('')+'</'+tag+'>', i:i};
}
function md(text){
  var L=String(text||'').split('\n'), out=[], i=0, buf;
  while(i<L.length){
    var l=L[i];
    if(/^```/.test(l)){ buf=[]; i++; while(i<L.length&&!/^```/.test(L[i])){buf.push(L[i]);i++;} i++; out.push('<pre class="term"><code>'+esc(buf.join('\n'))+'</code></pre>'); continue; }
    if(/^\|/.test(l)){ buf=[]; while(i<L.length&&/^\|/.test(L[i])){buf.push(L[i]);i++;} out.push(mdTable(buf)); continue; }
    if(LIST_RE.test(l)){ var r=mdList(L,i,LIST_RE.exec(l)[1].length); out.push(r.html); i=r.i; continue; }
    if(l.trim()===''){ i++; continue; }
    buf=[l]; i++;
    while(i<L.length&&L[i].trim()!==''&&!/^(```|\||\s*(-|\d+\.) )/.test(L[i])){buf.push(L[i]);i++;}
    out.push('<p>'+inline(buf.join(' '))+'</p>');
  }
  return out.join('');
}

/* ---------- filters / sidebar ---------- */
function matches(q){
  if(!S.levels.has(q.level)||!S.types.has(q.type)) return false;
  var st=stOf(q);
  if(S.status==='unseen'&&st!=='none') return false;
  if(S.status==='weak'&&st!=='shaky'&&st!=='missed') return false;
  if(S.status==='got'&&st!=='got') return false;
  if(S.status==='flag'&&!q.verify) return false;
  if(S.search&&q._hay.indexOf(S.search.toLowerCase())<0) return false;
  return true;
}
function filtered(){ return Q.filter(matches); }

function buildFilters(){
  var f=$('filters');
  var h='<summary>FILTERS</summary>';
  h+='<div class="chip-row"><span class="chip-label">LEVEL</span>'+LEVELS.map(function(l){return '<span class="chip lv-'+l+' active" data-lv="'+l+'" role="button" tabindex="0">'+l+'</span>';}).join('')+'</div>';
  h+='<div class="chip-row"><span class="chip-label">TYPE</span>'+TYPES.map(function(t){return '<span class="chip active" data-ty="'+t+'" role="button" tabindex="0">'+t+'</span>';}).join('')+'</div>';
  h+='<div class="chip-row"><span class="chip-label">STATUS</span>'+[['all','All'],['unseen','Unseen'],['weak','Shaky + Missed'],['got','Got it'],['flag','Verify-in-spec']].map(function(s){return '<span class="chip'+(s[0]==='all'?' active':'')+'" data-st="'+s[0]+'" role="button" tabindex="0">'+s[1]+'</span>';}).join('')+'</div>';
  f.innerHTML=h;
  f.addEventListener('click',function(e){
    var c=e.target.closest('.chip'); if(!c) return;
    if(c.dataset.lv){ toggleSet(S.levels,c.dataset.lv,c); }
    else if(c.dataset.ty){ toggleSet(S.types,c.dataset.ty,c); }
    else if(c.dataset.st){ S.status=c.dataset.st; f.querySelectorAll('[data-st]').forEach(function(x){x.classList.toggle('active',x===c);}); }
    buildSidebar();
  });
  f.addEventListener('keydown',function(e){ if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('chip')){ e.preventDefault(); e.target.click(); } });
}
function toggleSet(set,v,el){ if(set.has(v)){ if(set.size>1){set.delete(v);el.classList.remove('active');} } else {set.add(v);el.classList.add('active');} }

function barHtml(qs){
  var n=qs.length||1, g=0,s=0,m=0; qs.forEach(function(q){var st=stOf(q); if(st==='got')g++; else if(st==='shaky')s++; else if(st==='missed')m++;});
  return '<i class="got" style="width:'+(g/n*100)+'%"></i><i class="shaky" style="width:'+(s/n*100)+'%"></i><i class="missed" style="width:'+(m/n*100)+'%"></i>';
}
function buildSidebar(){
  var c=$('navGroups'), html='', shown=0, curQ=S.cur?byId[S.cur]:null;
  MODS.forEach(function(m){
    if(!m.built){
      html+='<div class="grp soon"><div class="grp-h"><span class="caret"></span><span class="grp-t">'+m.id+'. '+esc(m.title)+'</span><span class="badge-soon">PHASE 2</span></div></div>';
      return;
    }
    var items=m.qs.filter(matches); shown+=items.length;
    var open=S.open.has(m.id)||(curQ&&curQ.mod===m.id)||!!S.search;
    if(!items.length&&!(curQ&&curQ.mod===m.id)) return;
    var done=m.qs.filter(function(q){return stOf(q)!=='none';}).length;
    html+='<div class="grp'+(open?' open':'')+'" data-m="'+m.id+'"><div class="grp-h" data-toggle="'+m.id+'"><span class="caret">'+(open?'▾':'▸')+'</span><span class="grp-t">'+m.id+'. '+esc(m.title)+'</span><span class="grp-c">'+done+'/'+m.qs.length+'</span></div>';
    html+='<div class="grp-bar">'+barHtml(m.qs)+'</div><div class="grp-items">';
    items.forEach(function(q){
      html+='<div class="nav-item'+(S.cur===q.id?' active':'')+'" data-id="'+q.id+'"><span class="dot r-'+stOf(q)+'"></span><span class="qnum">'+q.id+'</span><span>'+esc(q.q.length>62?q.q.slice(0,60)+'…':q.q)+'</span></div>';
    });
    html+='</div></div>';
  });
  if(!shown) html+='<div class="nav-empty">No questions match the current filters.</div>';
  c.innerHTML=html;
  $('statShown').textContent=shown; $('statTotal').textContent=Q.length;
  $('statDone').textContent=Q.filter(function(q){return stOf(q)!=='none';}).length;
}
$('navGroups').addEventListener('click',function(e){
  var it=e.target.closest('.nav-item'); if(it){ go('q/'+it.dataset.id); return; }
  var h=e.target.closest('[data-toggle]'); if(h){ var id=Number(h.dataset.toggle); if(S.open.has(id)) S.open.delete(id); else S.open.add(id); var g=h.parentNode; g.classList.toggle('open'); h.querySelector('.caret').textContent=g.classList.contains('open')?'▾':'▸'; }
});
$('homeLink').addEventListener('click',function(){ go(''); });
$('searchInput').addEventListener('input',function(e){ S.search=e.target.value.trim(); buildSidebar(); });
$('menuBtn').addEventListener('click',function(){ $('sidebar').classList.toggle('open'); });

/* ---------- routing ---------- */
function go(h){ if(location.hash.replace(/^#\/?/,'')===h){ render(); } else location.hash='#/'+h; }
window.addEventListener('hashchange',render);
function route(){ var h=location.hash.replace(/^#\/?/,''); if(!h) return {r:'home'}; var p=h.split('/'); return {r:p[0],a:p[1]}; }

function setCrumb(parts){ $('crumb').innerHTML=parts.map(function(p,i){ return i===parts.length-1?'<span class="current">'+esc(p)+'</span>':esc(p)+'<span class="sep">/</span>'; }).join(''); }
function scrollTop(){ window.scrollTo(0,0); }

function render(){
  var r=route(), c=$('content');
  $('sidebar').classList.remove('open');
  document.querySelectorAll('#modeSeg button').forEach(function(b){b.classList.toggle('on',b.dataset.mode===store.mode);});
  if(r.r!=='run'&&r.r!=='q') S.cur=null;
  if(r.r==='q'&&byId[r.a]){ S.cur=r.a; S.revealed=(store.mode==='ref'); var q=byId[r.a]; if(!S.mock||!S.mock.active){ S.mock=null; } store.last=q.id; save(); c.innerHTML=renderQuestion(q,null); wireQuestion(q); setCrumb(['PCIe Q&A','Module '+q.mod,'Q'+q.id]); }
  else if(r.r==='m'&&modById[r.a]&&modById[r.a].built){ c.innerHTML=renderModule(modById[r.a]); wireList(); setCrumb(['PCIe Q&A','Module '+r.a]); }
  else if(r.r==='mock'){ c.innerHTML=renderMockSetup(); wireMockSetup(); setCrumb(['PCIe Q&A','Mock Round']); }
  else if(r.r==='run'){ if(!S.mock){ go('mock'); return; } renderRun(); }
  else { c.innerHTML=renderHome(); wireHome(); setCrumb(['PCIe Q&A','Overview']); }
  buildSidebar(); scrollTop();
  var act=document.querySelector('.nav-item.active'); if(act&&act.scrollIntoView) act.scrollIntoView({block:'nearest'});
}

/* ---------- home ---------- */
function counts(list){ var o={got:0,shaky:0,missed:0,none:0}; list.forEach(function(q){o[stOf(q)]++;}); return o; }
function renderHome(){
  var built=Q.length, cn=counts(Q), done=built-cn.none;
  var weak=cn.shaky+cn.missed, last=store.last&&byId[store.last]?byId[store.last]:null;
  var h='<div class="hero"><h2>PCIe Q&amp;A Study Guide</h2>'+
   '<p>From first principles to Principal-level scenarios, weighted toward SSD/NVMe validation and debug. Answer out loud first, reveal, then rate yourself. Shaky and missed questions feed the review queue and mock rounds. Switch to <b>Reference</b> mode (top right) to read like a normal Q&amp;A page.</p>';
  if(!storageOK) h+='<div class="warn">Browser storage is unavailable here, so progress will not persist after you close the page. Use Export progress to keep a copy.</div>';
  h+='<div class="stat-boxes"><div class="stat-box"><div class="n">'+built+'</div><div class="l">Questions live</div></div>'+
     '<div class="stat-box"><div class="n">'+MODS.filter(function(m){return m.built;}).length+' / '+MODS.length+'</div><div class="l">Modules live</div></div>'+
     '<div class="stat-box"><div class="n">'+Math.round(done/built*100)+'%</div><div class="l">Rated so far</div></div>'+
     '<div class="stat-box"><div class="n">'+Q.filter(function(q){return q.type==='Scenario'||q.type==='Debug';}).length+'</div><div class="l">Scenario / debug</div></div></div>';
  h+='<div class="pstack" title="Progress">'+barHtml(Q)+'</div>';
  h+='<div class="legend"><span class="g">Got it '+cn.got+'</span><span class="s">Shaky '+cn.shaky+'</span><span class="m">Missed '+cn.missed+'</span><span>Unseen '+cn.none+'</span></div>';
  h+='<div class="actions">';
  h+=last?'<button class="btn primary" data-act="continue">Continue · Q'+last.id+'</button>':'<button class="btn primary" data-act="start">Start with Q'+Q[0].id+'</button>';
  h+='<button class="btn" data-act="mock">Mock Round…</button>';
  h+='<button class="btn" data-act="weak"'+(weak?'':' disabled')+'>Review Shaky + Missed ('+weak+')</button>';
  h+='<button class="btn ghost" data-act="export">Export progress</button><button class="btn ghost" data-act="import">Import…</button><button class="btn ghost" data-act="reset">Reset</button>';
  h+='<input type="file" id="impFile" accept="application/json,.json" hidden></div>';
  h+='<div class="h-label">MODULES</div><div class="mod-grid">';
  MODS.forEach(function(m){
    if(!m.built){ h+='<div class="mod-card soon"><div class="mn">MODULE '+m.id+' · PHASE 2</div><div class="mt">'+esc(m.title)+'</div><div class="md">'+esc(m.desc)+'</div></div>'; return; }
    var c2=counts(m.qs);
    h+='<div class="mod-card" data-mod="'+m.id+'"><div class="mn">MODULE '+m.id+'</div><div class="mt">'+esc(m.title)+'</div><div class="md">'+esc(m.desc)+'</div>'+
       '<div class="pstack">'+barHtml(m.qs)+'</div><div class="mc"><span>'+m.qs.length+' questions</span><span>'+(m.qs.length-c2.none)+' rated</span></div></div>';
  });
  h+='</div>';
  if(store.rounds.length){
    h+='<div class="h-label">RECENT MOCK ROUNDS</div><table class="rounds"><thead><tr><th>WHEN</th><th>QUESTIONS</th><th>GOT IT</th><th>SHAKY</th><th>MISSED</th><th>TIME</th></tr></thead><tbody>'+
      store.rounds.slice(0,6).map(function(r){ return '<tr><td>'+new Date(r.t).toLocaleString()+'</td><td>'+r.n+'</td><td>'+r.got+'</td><td>'+r.shaky+'</td><td>'+r.missed+'</td><td>'+fmtTime(r.ms)+'</td></tr>'; }).join('')+'</tbody></table>';
  }
  return h+'</div>';
}
function wireHome(){
  var c=$('content');
  c.querySelectorAll('[data-mod]').forEach(function(el){ el.addEventListener('click',function(){ go('m/'+el.dataset.mod); }); });
  c.querySelectorAll('[data-act]').forEach(function(b){ b.addEventListener('click',function(){
    var a=b.dataset.act;
    if(a==='continue') go('q/'+store.last); else if(a==='start') go('q/'+Q[0].id);
    else if(a==='mock') go('mock'); else if(a==='weak'){ startMock({mods:new Set(MODS.filter(function(m){return m.built;}).map(function(m){return m.id;})),levels:new Set(LEVELS),types:new Set(TYPES),source:'weak',count:999}); }
