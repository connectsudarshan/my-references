) or up or down (voltage) and count errors, giving you quantified margin per lane without a scope.","deep":"- **Mechanism:** per-lane control and status registers accept commands such as Set Error Count Limit and Step Margin (timing left or right, voltage up or down). The receiver steps its sample point until the error count exceeds the limit.\n- **Output:** margin as a fraction of the unit interval for timing, and as a fraction of voltage swing for voltage.\n- **Advantages:** works in-system, on live links, per lane, and can be automated. No scope or analyzer is needed.\n- **Limits:** the result depends on the receiver's implementation (sampler independence, step resolution), so compare like with like, and use it as a relative margin metric, not an absolute one.\n- **Use in validation:** trend margin across temperature and voltage corners, across reset cycles, and across units, and flag the lanes with the smallest margin as the first suspects.","pitfall":"Comparing absolute margin numbers between different silicon vendors. Compare trends within one design.","verify":"Capability register layout, supported commands, and margining requirements per generation (Base Specification, Lane Margining chapter).","follow":[{"q":"Can you margin both directions of a link?","a":"Yes. Each port's receiver can be margined, and software can command it through the capability registers on either side."},{"q":"Does margining disturb traffic?","a":"It is designed to run while the link is active, though extreme steps can induce errors that the link recovers from."}],"mod":3},{"id":"3.12","level":"Advanced","type":"Concept","fig":null,"tags":["compliance","rx-test","tx-test"],"q":"How is the electrical compliance of a PCIe device tested?","short":"Transmitters are measured on a scope against the specified eye, jitter, swing and equalization presets using compliance patterns. Receivers are tested with stressed signals of calibrated jitter and noise to confirm they keep the BER target. Reference clocks and channels have their own tests. At Gen3 and above, receiver tests use the link-equalization protocol and loopback, so the device under test tunes its own equalizers.","deep":"- **TX tests:** the device is placed in Polling.Compliance or another test mode, emits a compliance pattern, and the scope evaluates jitter, eye height and width, and presets after a reference receiver model.\n- **RX tests:** a BERT generates a stressed signal (sinusoidal jitter, differential noise, crosstalk). The DUT is put in Loopback so the tester can count errors on the returned data.\n- **Reference clock tests:** jitter and spread-spectrum characteristics of the clock are measured separately.\n- **Channel and connector tests:** insertion loss, return loss and crosstalk are verified against the budget.\n- **Why it is not enough:** passing compliance shows a device meets a specified electrical envelope on a reference channel. Interoperability and system margin are validated separately.","pitfall":"Treating \"passed compliance\" as \"will work in every system.\"","verify":"Test procedures and pattern names for your generation in the PCI-SIG compliance documents.","follow":[{"q":"Why use loopback for receiver tests?","a":"The BERT needs a way to see what the DUT received. In Loopback the DUT retransmits the received bits."},{"q":"What changes at Gen3 and above?","a":"Receivers negotiate transmitter equalization with the tester through the training protocol before being stressed, so the test reflects the real link."}],"mod":3},{"id":"3.13","level":"Principal","type":"Concept","fig":"pam4","tags":["pam4","nyquist","gen6"],"q":"Gen5 and Gen6 have the same Nyquist frequency. Why is Gen6 still much harder?","short":"Both run at 32 GBaud, so the channel loss at Nyquist (16 GHz) is about the same. But PAM4 divides the same swing into three eyes, each a third of the height, so noise, crosstalk, reflections and jitter that were tolerable at Gen5 now consume a much larger fraction of the remaining margin, about 9.5 dB less SNR. That forces stronger equalization, FEC and flit-level replay.","deep":"- **Same symbol rate, same loss:** channel insertion loss depends on the frequency content, which is set by the symbol rate. So the loss budget stays near Gen5's.\n- **Less margin per eye:** the eye height is one third, so an interferer of a given size costs three times as much relative margin.\n- **Consequences:** raw bit error rate before correction is many orders of magnitude worse than 1e-12, so lightweight forward error correction is mandatory. Errors can also come in bursts from DFE, so precoding is used to limit burst length.\n- **Protocol response:** the link moves to fixed-size flits with CRC and replay, so the residual errors after FEC are caught at the flit level.\n- **System implication:** crosstalk and power noise budgets tighten, and more designs need retimers.","pitfall":"Assuming a doubling of data rate means a doubling of channel bandwidth. Gen6 uses the same bandwidth and pays with SNR.","verify":"Precoding details and target pre-FEC error rate in the current Base Specification.","follow":[{"q":"Why does DFE cause burst errors?","a":"A wrong decision is fed back into the equalizer and can bias the next decisions, so one error can become several. Precoding limits this."},{"q":"Why FEC and not just a better channel?","a":"Meeting 1e-12 raw at PAM4 would need a channel and receiver far beyond practical, so a small amount of correction is cheaper than a perfect channel."}],"mod":3},{"id":"3.14","level":"Advanced","type":"Debug","fig":null,"tags":["temperature","errors","triage","signal-integrity"],"q":"A link is clean at room temperature but correctable errors climb at high temperature after 30 minutes. How do you separate a signal-integrity problem from a protocol problem?","short":"Correlate the error rate with temperature and lane, then change one variable at a time. Errors that fall at a lower link speed, follow specific lanes, or improve with a different preset or clock mode point at the channel or PHY margin. Errors that appear only with certain traffic patterns, states, or power transitions point at protocol or power-state handling.","deep":"1. **Measure, don't guess:** log AER correctable counters (Receiver Error, Bad TLP, Bad DLLP, Replay Timer Timeout, Rollover), Recovery counts, and link speed over time with temperature.\n2. **Lane dependence:** run lane margining at both temperatures. A single lane collapsing points at a specific via, connector pin or PHY lane.\n3. **Speed sweep:** force the next lower speed. If errors vanish, margin at the higher speed is the issue (equalization, channel, refclk jitter).\n4. **Equalization:** check whether equalization completed cleanly and whether the presets chosen at hot differ from cold. Re-run equalization when hot.\n5. **Traffic dependence:** compare idle, sequential, and random workloads. Errors that scale with toggle rate suggest supply noise or crosstalk.\n6. **Power state dependence:** disable ASPM and L1 substates to see whether errors cluster around low-power exits.\n7. **Bench:** if possible, capture on a scope or analyzer, and swap the cable, slot or unit to separate systematic from unit-specific issues.","pitfall":"Changing several variables at once (speed, lane count, ASPM), which destroys the attribution.","verify":null,"follow":[{"q":"What tells you \"PHY marginal\" versus \"firmware bug\"?","a":"The counters live below the Transaction Layer and respond to speed, lane, temperature and clock changes. Firmware bugs respond to workload and state, not to temperature."},{"q":"What is a quick isolation experiment?","a":"Swap the device into a known-good slot and swap a known-good device into the failing slot. Whichever side follows the failure is the suspect."}],"mod":3},{"id":"3.15","level":"Principal","type":"Scenario","fig":null,"tags":["eval-board","system","refclk","power-sequence"],"q":"An SSD links up perfectly on the vendor evaluation board but fails to train or runs at Gen1 in your platform. What differs and what do you check?","short":"Compare the platform against the eval board on clocking, power sequencing, reset, and channel. The likeliest culprits are the reference clock mode (common clock versus separate reference), power and PERST# sequencing, channel loss or connector differences, lane wiring (polarity, reversal, lane order), and BIOS or firmware settings that force speed or width.","deep":"1. **Clocking:** is REFCLK present and stable before PERST# releases? Is the slot clocking mode (common clock or SRIS) what the device expects, and is SSC on or off?\n2. **Power and reset:** are all rails stable within the specified time before PERST# deasserts, and does PERST# meet the required timing? A late rail can look like a training failure.\n3. **Channel:** compare insertion loss, connector type, length, riser or backplane presence. A retimer may be missing where the eval board had none but the platform is longer.\n4. **Wiring:** lane order and reversal, polarity swaps, and unused lane termination; a design relying on reversal that the device does not support trains at x1 or fails.\n5. **Platform settings:** BIOS forced link speed, bifurcation settings, ASPM defaults, and Target Link Speed.\n6. **Evidence:** read `LnkSta` and `LnkSta2` for equalization phase status, capture LTSSM traces (which state it loops in), and check the Detect result: which lanes were detected.","pitfall":"Concluding \"device bug\" because it works on the eval board. Eval boards rarely resemble a real platform's channel or sequencing.","verify":"Power-up timing parameters (refclk and power stable before PERST# deassertion) in the CEM specification.","follow":[{"q":"Trains at Gen1 only. What is the first suspect?","a":"Equalization or channel loss at the higher rates, since Gen1 needs no equalization. Check the equalization phase status and whether a retimer is needed."},{"q":"Fails in Detect. What do you check?","a":"Presence of the device's receiver termination, power and PERST# sequencing, and lane connectivity, since Detect is an analog measurement."}],"mod":3},{"id":"3.16","level":"Principal","type":"Trap","fig":null,"tags":["compliance","interop","margin"],"q":"The device passed PCI-SIG compliance. Why can it still fail in customer systems?","short":"Compliance checks the device against a reference channel and reference partner at defined conditions. Customer systems have different channels, connectors, clocking, power noise, thermal profiles, BIOS settings, and partner silicon, so real margin can be smaller. Compliance shows the design is capable; it does not show that a specific platform has margin.","deep":"- **Reference conditions:** compliance uses defined test channels, loads and patterns, not your platform's actual worst case.\n- **System interactions:** crosstalk from neighboring interfaces, power delivery noise, spread-spectrum clocks, and thermal gradients affect margin.\n- **Partner variation:** different root complex or switch implementations have different equalization behavior and timing, so interop testing across partners matters.\n- **Population variation:** corner units and aging matter. Margin should be a distribution across many units, temperatures, and voltage corners.\n- **Software and BIOS:** power-management settings, MPS and MRRS, and link-retrain triggers behave differently per platform.\n- **Validation answer:** measure margin and error rates per platform, across corners, and track link-up yield across many reset cycles, not a single pass.","pitfall":"Treating compliance as sign-off for every platform and dismissing field failures because \"it passed.\"","verify":null,"follow":[{"q":"What metric would you track across platforms?","a":"Link-up success rate over many resets, correctable error rate per hour, and per-lane margin distributions."},{"q":"Who owns the fix when a specific platform fails?","a":"Depends on the evidence: channel and BIOS on the platform side, equalization behavior on the silicon side, jointly analyzed with traces and margin data."}],"mod":3},{"id":"4.01","level":"Basic","type":"Concept","fig":"ltssm","tags":["ltssm","states"],"q":"What is the LTSSM, and what are its states?","short":"The Link Training and Status State Machine is the Physical Layer state machine that brings a link up, keeps it healthy, and moves it between power states. The states are Detect, Polling, Configuration, L0 (normal operation), Recovery, the low-power states L0s, L1 and L2, and the special states Hot Reset, Disabled and Loopback.","deep":"- **Bring-up path:** Detect (is anything there), Polling (achieve bit and symbol lock, exchange TS1 and TS2), Configuration (agree link number, lane numbers and width), L0 (TLPs and DLLPs flow).\n- **Recovery:** the hub for retraining, speed changes, width changes and error recovery without a full restart.\n- **Low power:** L0s (fast idle, per direction), L1 (deeper, both directions, exits through Recovery), L2 (main power removed, auxiliary power on).\n- **Special states:** Hot Reset (reset the downstream side of the link), Disabled (link turned off), Loopback (test mode).\n- **Two ports, one machine each:** each port runs its own LTSSM, and they stay in step by exchanging ordered sets.","pitfall":"Treating the LTSSM as one shared machine. Each end runs its own and they synchronize through ordered sets.","verify":null,"follow":[{"q":"Who runs the LTSSM, the MAC or the PHY?","a":"The MAC side owns the state machine and drives the PHY through PIPE."},{"q":"Which state do you spend all your time in?","a":"L0, where TLPs and DLLPs flow. Everything else exists to reach L0 or leave it."}],"mod":4},{"id":"4.02","level":"Basic","type":"Concept","fig":null,"tags":["detect","receiver-detect"],"q":"What happens in the Detect state?","short":"The transmitter checks each lane for a receiver termination by pulsing its common-mode voltage and measuring the response. Detect.Quiet waits in electrical idle; Detect.Active performs the measurement. If at least one lane shows a receiver, the LTSSM moves to Polling with the detected lanes. If none do, it returns to Detect.Quiet and tries again.","deep":"- **Detect.Quiet:** wait in electrical idle, up to a 12 ms timeout (or until an idle exit is seen), then move to Detect.Active.\n- **Detect.Active:** the transmitter runs receiver detection on every lane. Lanes with a detected receiver define the candidate link width.\n- **Outcome:** any lane detected leads to Polling. No lane detected sends the LTSSM back to Detect.Quiet, so an empty slot loops here forever, which is normal.\n- **Why it matters:** an unpowered device, missing lane or damaged connector shows up here as a narrower or absent link.","pitfall":"Expecting Detect to involve packets. It is a purely analog measurement.","verify":"Detect.Quiet timeout value (12 ms) in the LTSSM chapter of the Base Specification.","follow":[{"q":"Is a partner needed for Detect to succeed?","a":"The partner only needs its receiver termination present. It does not need to run its LTSSM."},{"q":"Why might a populated slot loop in Detect?","a":"Receiver terminations are missing (unpowered card, connector fault) or the lane is open or shorted."}],"mod":4},{"id":"4.03","level":"Basic","type":"Concept","fig":null,"tags":["polling","ts1","ts2","bit-lock"],"q":"What happens in Polling?","short":"Both ports send TS1 ordered sets at 2.5 GT/s so each receiver can achieve bit lock and symbol lock, and they check for polarity inversion. After seeing enough TS1 or TS2 from the partner, they move to Polling.Configuration and send TS2 to confirm they are ready to proceed. Polling.Compliance is a side state used when a receiver is detected but the partner never sends anything.","deep":"- **Polling.Active:** transmit TS1 with PAD in the link and lane fields. Exit after receiving 8 consecutive TS1 or TS2 (or their inverted forms) and having sent at least 1024 TS1. A 24 ms timeout applies.\n- **Polling.Configuration:** transmit TS2 and exit to Configuration after receiving 8 consecutive TS2 and having sent at least 16 TS2 since the first TS2 was received.\n- **Polling.Compliance:** entered when a receiver was detected but the partner never left electrical idle, which is how a compliance load board is recognized. The port emits a compliance pattern for scope testing.\n- **Polarity:** an inverted TS1 tells the receiver to invert that lane's polarity.","pitfall":"Calling Polling.Compliance a failure state. It is a defined test state that real hardware sometimes ends up in by accident.","verify":"Exact ordered-set counts and timeouts for each Polling sub-state.","follow":[{"q":"Why is Polling always at 2.5 GT/s?","a":"Every device supports it and it needs no equalization, so it is the lowest common denominator to start negotiation."},{"q":"What proves bit lock and symbol lock?","a":"Receiving valid TS1 or TS2 with correct symbol boundaries, seen as a run of consecutive valid ordered sets."}],"mod":4},{"id":"4.04","level":"Basic","type":"Concept","fig":null,"tags":["configuration","lane-number","width"],"q":"What is negotiated in the Configuration state?","short":"The link number, the lane numbers and the link width. The downstream port proposes a link number and lane numbers in TS1, the upstream port echoes and accepts, and both agree on the widest set of lanes that trained. Lane reversal is resolved here, and the state ends when both sides exchange TS2 and then idle data and enter L0.","deep":"- **Linkwidth.Start:** the downstream port sends TS1 with a link number; the upstream port replies with the same link number.\n- **Linkwidth.Accept:** the downstream port chooses which lanes belong to the link and sends lane numbers.\n- **Lanenum.Wait and Lanenum.Accept:** the upstream port confirms the lane numbers, applying reversal if needed.\n- **Complete:** both sides send TS2 and confirm the configuration.\n- **Idle:** idle data is exchanged and L0 is entered after enough idle symbols are sent and received.\n- **Width choice:** must be a supported width (x1, x2, x4, x8, x16), so a partially failed lane group falls back to a smaller width.","pitfall":"Assuming widths are arbitrary. An x4 link with one bad lane comes up x2 or x1, not x3.","verify":null,"follow":[{"q":"Who proposes the link number?","a":"The downstream port."},{"q":"Where does lane reversal show up?","a":"In the lane numbers: the upstream port sees them in reverse order and maps its lanes accordingly, if it supports reversal."}],"mod":4},{"id":"4.05","level":"Intermediate","type":"Concept","fig":null,"tags":["ts1","ts2","ordered-set"],"q":"What do TS1 and TS2 ordered sets contain?","short":"Each is 16 symbols. They start with a COM (in 8b/10b) or a block header, then carry the link number, lane number, N_FTS, the data rate identifier, training control bits (hot reset, disable link, loopback, disable scrambling, compliance receive), and finally a TS identifier pattern that tells TS1 from TS2. Gen3 and above reuse fields to carry equalization requests and results.","deep":"| Symbol | Content |\n|---|---|\n| 0 | COM, or in 128b/130b a fixed pattern that identifies TS1 or TS2 |\n| 1 | Link number (or PAD) |\n| 2 | Lane number (or PAD) |\n| 3 | N_FTS: number of fast training sequences needed to exit L0s |\n| 4 | Data rate identifier: supported speeds, speed change request |\n| 5 | Training control bits |\n| 6 to 15 | TS identifier (TS1 or TS2 pattern); in Gen3 and above, the first symbols carry equalization info |\n\n- **Data rate identifier:** each bit advertises a supported rate, and a separate bit requests a speed change.\n- **Training control bits:** hot reset, disable link, loopback, disable scrambling, compliance receive.\n- **Handshake use:** both sides transmit TS1 or TS2 until they have seen a set number of matching sets, which is how they agree to progress together.","pitfall":"Memorizing symbol positions without knowing what each field is used for during debug.","verify":"Field layout and bit assignments for TS1/TS2, especially the Gen3+ equalization fields.","follow":[{"q":"What does N_FTS do?","a":"It tells the transmitter partner how many FTS ordered sets to send when leaving L0s so this receiver can relock."},{"q":"Why do TS1 and TS2 exist as two types?","a":"TS1 means \"I am still negotiating.\" TS2 means \"I have accepted the current configuration and am ready to move on.\""}],"mod":4},{"id":"4.06","level":"Intermediate","type":"Concept","fig":"recovery","tags":["recovery"],"q":"What is Recovery, when is it entered, and what are its sub-states?","short":"Recovery is the state a link enters to retrain without a full restart: after errors, to change speed or width, on every L1 exit, when L0s exit fails, or when software sets Retrain Link. Its sub-states are RcvrLock (relock and exchange TS1), RcvrCfg (exchange TS2 and confirm parameters), Speed (change data rate), Equalization (Gen3 and above), and Idle, which returns to L0.","deep":"- **Entry triggers:** REPLAY_NUM rollover or excessive receiver errors, software Retrain Link, speed or width change requests, L1 exit, failed L0s exit, and reception of TS1 from a partner that has already entered Recovery.\n- **RcvrLock:** transmit TS1 and wait for 8 consecutive TS1 or TS2 from the partner.\n- **RcvrCfg:** transmit TS2 and confirm; this is where the speed change bit is agreed.\n- **Speed:** enter electrical idle, switch the PHY to the new rate, then return to RcvrLock at that rate.\n- **Equalization:** phases 0 to 3, when a new Gen3+ rate needs equalization or a retrain requests it.\n- **Idle:** exchange idle data and return to L0, or move to Configuration when a width change is required.\n- **Failure:** most timeouts send the machine back to Detect. Configuration is reached by protocol events (new link or lane numbers, upconfigure), and a lower speed is the result of the rate negotiation, not of a timeout.","pitfall":"Assuming Recovery only happens on errors. Speed changes and L1 exits use it routinely.","verify":"The complete list of Recovery entry conditions and timeouts in the Base Specification.","follow":[{"q":"Does Recovery lose TLPs?","a":"TLPs already in the replay buffer are retained and replayed as needed. Data in flight during retrain may need replay."},{"q":"Why does every L1 exit go through Recovery?","a":"The receiver has lost lock during idle, so it must re-lock and reconfirm parameters before resuming."}],"mod":4},{"id":"4.07","level":"Intermediate","type":"Concept","fig":null,"tags":["l0s","fts","aspm"],"q":"How does L0s work, and why is it rarely used?","short":"L0s is a fast, per-direction idle state. A transmitter sends an electrical idle ordered set and goes quiet. To leave L0s it sends N_FTS fast training sequences so the receiver can re-lock quickly, then SKP and back to L0. It gives modest savings and its wake behavior is the cost, so it is often left disabled on modern platforms.","deep":"- **Directional:** each direction enters and exits independently. One direction can be in L0s while the other is active.\n- **Exit:** the transmitter sends the N_FTS number of FTS ordered sets that the receiver advertised, then a SKP ordered set. If the receiver cannot relock in time, the link goes to Recovery.\n- **Latency:** the exit latency is a function of N_FTS and reference clock mode. Devices report it in Link Capabilities.\n- **Policy:** ASPM control in Link Control enables L0s and L1 separately. Many platforms enable only L1.\n- **Validation angle:** a failed L0s exit is one of the classic sources of unexpected Recovery entries and correctable errors.","pitfall":"Treating L0s as a bidirectional state like L1.","verify":"How current platforms and NVMe devices treat L0s support (many do not implement it).","follow":[{"q":"Where does the exit latency come from?","a":"The number of FTS the receiver needs (N_FTS) times their duration, plus fixed overheads. Slower reference clock modes need larger N_FTS."},{"q":"Why disable it?","a":"Power savings are small compared with L1, the exit latency is visible to workloads, and wake failures cause Recovery entries."}],"mod":4},{"id":"4.08","level":"Intermediate","type":"Concept","fig":null,"tags":["l1","aspm","exit-latency"],"q":"What is L1, how is it entered, and what determines its exit latency?","short":"L1 is a deeper low-power link state where both directions are in electrical idle and the PHY can shut down most of its analog circuitry. It is entered either by software placing the device in D3hot (or a lower device state) or autonomously when the device requests it under ASPM. Exit always goes through Recovery, so exit latency is the time to relock plus the time to restart the PHY.","deep":"- **Entry paths:** software-directed (D-state change from D0 to a lower state) or ASPM autonomous (device decides the link is idle). Both involve a DLLP handshake between the two ports (covered in the Data Link Layer module).\n- **Exit:** either side can start it by leaving electrical idle. The link passes through Recovery and returns to L0. The device reports the worst-case exit latency in Link Capabilities.\n- **L1 substates (L1.1, L1.2):** further reduce power by turning off the reference clock (using CLKREQ#) and, in L1.2, more of the receiver circuitry, at the cost of a much longer exit.\n- **Policy:** the platform compares each device's reported exit latency, together with the latency tolerance the device advertises (LTR), to decide which states are safe.","pitfall":"Assuming L1 loses configuration state. Configuration space and device state are preserved in L1.","verify":"L1 substate timing parameters (T_POWER_ON, LTR thresholds) in the L1 PM Substates chapter.","follow":[{"q":"Why does L1 exit take longer than L0s?","a":"The PHY must wake, relock, and pass through Recovery, whereas L0s only needs a short FTS burst."},{"q":"What do L1 substates add?","a":"Lower idle power by turning off the reference clock and more analog circuitry, with a longer exit latency."}],"mod":4},{"id":"4.09","level":"Intermediate","type":"Concept","fig":null,"tags":["l2","pme","wake","d3cold"],"q":"What is L2, and how does a link enter it?","short":"L2 is the lowest link power state, used when main power is removed but auxiliary power is present so the device can signal a wake event. Entry starts with the Root Complex sending a PME_Turn_Off message. The device replies with PME_TO_Ack and PM_Enter_L23 DLLPs, the link goes idle, and main power can be removed. Wake is signaled by beacon or the WAKE# pin.","deep":"1. Software puts devices into D3 and the RC broadcasts PME_Turn_Off.\n2. Each device finishes outstanding transactions and answers with PME_TO_Ack.\n3. Each device sends PM_Enter_L23 DLLPs upstream, the port at the other end answers with PM_Request_Ack, and the link enters L2/L3 Ready.\n4. Platform removes main power. The link is in L2 if auxiliary power remains, or L3 if everything is off.\n5. Wake: the device asserts WAKE# or sends a beacon. Main power and reference clock return, and the link retrains from Detect (L2 exits through Detect, not Recovery).\n- **State loss:** in D3cold the device loses its state and must be reinitialized by software after power returns.","pitfall":"Assuming L2 preserves device state. D3cold devices come back in their reset state.","verify":null,"follow":[{"q":"How does a device wake the system from L2?","a":"By asserting the WAKE# sideband signal (or, for some designs, a beacon on the link)."},{"q":"Why does L2 exit through Detect?","a":"Power was removed, so the link must retrain fully."}],"mod":4},{"id":"4.10","level":"Advanced","type":"Concept","fig":null,"tags":["hot-reset","disabled","loopback"],"q":"What are the Hot Reset, Disabled and Loopback states used for?","short":"Hot Reset is entered when a port receives TS1 with the Hot Reset bit set, resetting everything downstream of that link through the link itself instead of PERST#. Disabled takes a link offline when told to by the Disable Link bit. Loopback is a test state in which one port (the slave) reflects the received data back to the master for bit-error testing.","deep":"- **Hot Reset:** software sets Secondary Bus Reset in the bridge control register of the downstream port. The port sends TS1 with the Hot Reset bit for about 2 ms, and the device resets its functions, then both sides return to Detect and retrain.\n- **Disabled:** entered with the Disable Link bit in TS1. The link stays disabled until software clears the Link Disable bit or a reset occurs.\n- **Loopback:** the master sends TS1 with the Loopback bit. The slave enters Loopback and retransmits everything it receives. It is used for receiver testing and analyzer bring-up.\n- **Reset scope:** hot reset resets function state and config space to defaults (except sticky bits) but does not remove power or drop the reference clock.","pitfall":"Expecting hot reset to preserve BARs. Function state and config registers reset to defaults, so software must re-enumerate and reprogram.","verify":"Hot reset duration and reset scope for sticky registers in the Base Specification.","follow":[{"q":"How does software trigger a hot reset?","a":"It sets the Secondary Bus Reset bit in the Bridge Control register of the downstream port above the device."},{"q":"Is a hot reset the same as PERST#?","a":"No. PERST# is a fundamental reset that also clears sticky state and restarts everything. Hot reset resets at the link level and preserves sticky registers."}],"mod":4},{"id":"4.11","level":"Advanced","type":"Concept","fig":null,"tags":["speed-change","recovery","gen3"],"q":"Describe how a link changes speed from Gen1 to Gen4.","short":"Both ports advertise supported rates in TS1 and TS2. After reaching L0 at Gen1, either side (or software) initiates a speed change by entering Recovery and setting the speed-change request. In Recovery.RcvrCfg they agree on the highest common rate, move to Recovery.Speed to switch the PHY, and return to RcvrLock at the new rate. For Gen3 and above the first arrival at each new rate also runs equalization.","deep":"1. **Initial state:** every link trains at Gen1, so L0 is reached at 2.5 GT/s after Polling and Configuration.\n2. **Trigger:** hardware autonomous logic, or software via Target Link Speed and Retrain Link.\n3. **Recovery.RcvrLock and RcvrCfg:** exchange the data rate identifiers and set the speed change bit.\n4. **Recovery.Speed:** the ports enter electrical idle, the PHY changes rate, and the ports return to RcvrLock at the higher rate.\n5. **Equalization:** at 8 GT/s and above, a link that has not previously equalized at this rate goes through Recovery.Equalization phases before returning to L0.\n6. **Failure handling:** if the new rate fails, the link falls back to the previous rate, and the port may not try the same speed again unless software requests it.","pitfall":"Expecting a link to stay at Gen1 forever if it cannot do more. The speed-change failure path returns it to the last good rate.","verify":"Rules for repeated speed-change attempts and successful_speed_negotiation flags in the LTSSM chapter.","follow":[{"q":"What if the higher rate fails to train?","a":"The LTSSM times out and returns to the lower rate. The device may be limited from retrying automatically."},{"q":"Who decides the target speed?","a":"The highest speed both sides advertise, unless software lowered it with Target Link Speed or hardware autonomous speed change is disabled."}],"mod":4},{"id":"4.12","level":"Advanced","type":"Numeric","fig":null,"tags":["timeouts","ltssm"],"q":"What are the typical LTSSM timeouts you should know?","short":"Commonly cited values: Detect.Quiet 12 ms, Polling.Active 24 ms, Polling.Configuration 48 ms, Configuration sub-states 2 ms with Linkwidth.Start at 24 ms, Recovery.RcvrLock 24 ms, Recovery.RcvrCfg 48 ms, Recovery.Idle 2 ms. The exact numbers matter less than knowing which state a timeout drops you into, because that tells you where the link stalled.","deep":"| State | Timeout (commonly cited) | On timeout |\n|---|---|---|\n| Detect.Quiet | 12 ms | Detect.Active |\n| Polling.Active | 24 ms | Detect, or Polling.Compliance |\n| Polling.Configuration | 48 ms | Detect |\n| Configuration.Linkwidth.Start | 24 ms | Detect |\n| Configuration.Lanenum, Complete, Idle | 2 ms | Detect |\n| Recovery.RcvrLock | 24 ms | Detect |\n| Recovery.RcvrCfg | 48 ms | Detect |\n| Recovery.Idle | 2 ms | Detect |\n\n- **How it helps debug:** a link that keeps cycling Polling.Active to Detect never got 8 consecutive TS1. One cycling Recovery to Detect never completed RcvrCfg.\n- **Automation implication:** test harness timeouts for \"link up\" should be longer than several worst-case LTSSM loops.","pitfall":"Quoting a timeout without knowing its destination state.","verify":"Every value in this table against the LTSSM state tables in the Base Specification. Numbers vary by state and revision.","follow":[{"q":"Why do interviews ask for timeouts?","a":"They show whether you have debugged real training failures. Each timeout tells you which handshake failed."},{"q":"What does a repeating loop period tell you?","a":"The sum of the timeouts in the loop identifies the states involved, so a 24 ms cycle points at Polling.Active."}],"mod":4},{"id":"4.13","level":"Advanced","type":"Concept","fig":null,"tags":["downtrain","width","upconfigure"],"q":"How does width down-training happen, and how can a link change width without a full restart?","short":"If one or more lanes fail detection or fail to train, Configuration picks the largest supported width that the remaining lanes can form, so an x4 link with a bad lane comes up x2 or x1. Some devices also support upconfiguration: a link that trained narrow can return to Recovery and Configuration to widen when lanes become usable, without going back to Detect.","deep":"- **Allowed widths:** x1, x2, x4, x8, x16 (the base spec also defines x12 and x32, rare in practice). Lane assignments follow rules (for example an x1 link uses lane 0), so the surviving lanes must form a legal group.\n- **Common causes:** a broken lane, connector issue, poor equalization on a lane, or a device that does not wire all lanes.\n- **Hardware autonomous width change:** a device can reduce width to save power when it supports it (and the Hardware Autonomous Width Disable bit allows it).\n- **Upconfigure:** a device advertises upconfigure capability in TS2. A link can move from Recovery.Idle back to Configuration to widen.\n- **Reporting:** Link Status shows negotiated width, and Link Autonomous Bandwidth Status and Link Bandwidth Management Status flag changes not initiated by software.","pitfall":"Treating a width reduction as always fault-driven. Power management can also reduce width intentionally.","verify":"Upconfigure rules and lane assignment constraints for each width.","follow":[{"q":"Why not run three lanes?","a":"Widths must be power-of-two groups. Three healthy lanes become x2 (with one wasted)."},{"q":"How does software learn the width dropped?","a":"Through Link Status (negotiated width) and the link bandwidth notification bits."}],"mod":4},{"id":"4.14","level":"Advanced","type":"Concept","fig":null,"tags":["lnkcap","lnksta","registers","lspci"],"q":"Which PCIe registers show link state, and what do you look for in each?","short":"Link Capabilities shows what the port can do (maximum speed and width, ASPM support, exit latencies). Link Control configures behavior (ASPM enable, Retrain Link, Common Clock, Link Disable). Link Status shows the result (current speed, negotiated width, Link Training in progress, Slot Clock Configuration, Data Link Layer Link Active). Link Control 2 sets Target Link Speed, and Link Status 2 reports equalization phase results.","deep":"| Register | Key fields for debug |\n|---|---|\n| Link Capabilities (`LnkCap`) | Max Link Speed, Max Link Width, ASPM support, L0s and L1 exit latency |\n| Link Control (`LnkCtl`) | ASPM control, Retrain Link, Common Clock Configuration, Link Disable |\n| Link Status (`LnkSta`) | Current Link Speed, Negotiated Link Width, Link Training, Slot Clock Configuration, Data Link Layer Link Active |\n| Link Control 2 (`LnkCtl2`) | Target Link Speed, Enter Compliance, Hardware Autonomous Speed Disable |\n| Link Status 2 (`LnkSta2`) | Equalization Complete, Phase 1/2/3 Successful, Link Equalization Request, retimer presence |\n\n```\n$ sudo lspci -s 01:00.0 -vv | grep -E \"LnkCap|LnkCtl|LnkSta\"\n```\n\nFirst check: is `LnkSta` speed and width equal to `LnkCap`? If not, is there a Target Link Speed limit, and did Link Training or equalization fail?","pitfall":"Comparing `LnkSta` to `LnkCap` of the wrong port. Check both ends of the link (root port and device).","verify":null,"follow":[{"q":"How do you force a retrain from software?","a":"Set Retrain Link in Link Control, after setting Target Link Speed in Link Control 2 if you want a specific speed."},{"q":"Which bit says the link is up at the DLL?","a":"Data Link Layer Link Active in Link Status."}],"mod":4},{"id":"4.15","level":"Advanced","type":"Debug","fig":null,"tags":["polling-compliance","detect","triage"],"q":"The LTSSM sits in Polling.Compliance. What does that mean, and what do you check?","short":"The port detected a receiver on at least one lane but never saw the partner leave electrical idle, so it assumed a compliance load board and started emitting the compliance pattern. In a real system it means the partner has its receiver terminated but is not transmitting: it is held in reset, not clocked, not powered enough to run its LTSSM, or its transmitters are disabled.","deep":"- **Entry rule:** from Polling.Active, if the timeout expires with a receiver detected but no electrical idle exit ever observed, the LTSSM enters Polling.Compliance.\n- **Common real-world causes:** PERST# still asserted, REFCLK absent or unstable at the device, device power rails not stable, a device firmware not yet running with an LTSSM enable, or an analog fault where terminations are present but the transmitter is not working.\n- **What to check:** PERST# timing, REFCLK presence and level at the device, power rails, the device's readiness, and whether the device's LTSSM is enabled in firmware or strap configuration.\n- **Exit:** the machine leaves compliance on detecting an idle exit or a reset condition.","pitfall":"Assuming the state means the link is broken electrically. It often means the partner is simply not ready.","verify":"The exact Polling.Compliance entry conditions in the Base Specification.","follow":[{"q":"Why does an empty slot not go to Polling.Compliance?","a":"No receiver is detected, so the LTSSM never leaves Detect."},{"q":"How could firmware cause this?","a":"An SSD whose controller has not yet enabled the PCIe PHY's LTSSM (or released it from reset) has terminations on but transmits nothing."}],"mod":4},{"id":"4.16","level":"Principal","type":"Scenario","fig":null,"tags":["triage","ltssm","logs","downtrain"],"q":"A link comes up at x2 Gen1 instead of x4 Gen4. How do you use LTSSM state history to triage?","short":"Get the LTSSM state log (from an analyzer, the controller's debug registers, or vendor tools) and read the sequence of states and where it loops. Width x2 means one pair of lanes failed Detect or Configuration. Gen1 means the speed change or equalization failed and the link fell back. Which state it visits and how often tells you which handshake failed.","deep":"| Observation | Likely stage | Likely cause |\n|---|---|---|\n| Loops Detect to Detect | Detect | No receiver: power, termination, connector, lanes |\n| Loops Polling.Active to Detect | Polling | No lock or no TS1 seen: clock, reset timing, SI |\n| Polling then Configuration.Linkwidth.Start to Detect | Configuration | Link number mismatch or partner not responding |\n| Lanenum stages fail on some lanes | Configuration | Lane wiring, reversal support, or bad lanes |\n| Reaches L0 at Gen1, then Recovery.Speed cycles | Speed change | Rate advertisement, PHY rate change failure |\n| Recovery.Equalization phases fail then fallback | Equalization | Channel loss, preset choice, retimer, marginal RX |\n\n- **Order of operations:** first confirm which lanes were detected (that gives the maximum width), then whether TS1/TS2 exchange completes, then whether L0 is reached, then what happens on the speed change.\n- **Quantify:** count loops per minute and record which lanes were active in each pass.\n- **Cross-check:** compare with `LnkSta2` equalization bits and AER, and reproduce with a known-good partner.","pitfall":"Changing settings before capturing the state history. Once the link is retrained, the evidence is gone.","verify":null,"follow":[{"q":"x2 width but all four lanes are wired. What next?","a":"Find which lane pair failed Detect or Configuration, swap the device or slot, and inspect the connector and those traces."},{"q":"Reaches Gen1 L0 fine but never a higher speed. What first?","a":"Confirm both sides advertise higher rates, that Target Link Speed allows it, and whether equalization fails in Recovery.Equalization."}],"mod":4},{"id":"4.17","level":"Principal","type":"Cross-layer","fig":null,"tags":["nvme","reset","flr","perst","cc-en"],"q":"How do an NVMe controller reset, FLR, hot reset and PERST# differ, and what does each do to the PCIe link?","short":"Clearing CC.EN resets only the NVMe controller state and leaves the link and PCIe config space alone. FLR resets one PCIe function (and therefore its NVMe controller) without touching the link. A hot reset is signaled over the link (TS1 with the reset bit) and resets all functions below it, then retrains. PERST# is a fundamental reset that resets everything, including sticky registers, and restarts the link from Detect.","deep":"| Reset | Scope | Link retrains | PCIe config space |\n|---|---|---|---|\n| CC.EN 1 to 0 | NVMe controller only | No | Kept |\n| FLR | One PCIe function | No | Function reset to defaults (except sticky) |\n| Hot reset (Secondary Bus Reset) | All functions on the link | Yes (via Detect) | Reset to defaults (except sticky) |\n| PERST# | Whole device | Yes | Everything reset including sticky |\n| NVMe subsystem reset | NVMe subsystem, per NVMe spec | May, device dependent | Device dependent |\n\n- **Test strategy:** each reset type needs its own test loop, with link state, config space, MSI-X setup and queue state re-verified after each.\n- **Recovery time:** FLR completion time is bounded (100 ms) and hot reset and PERST# have recovery time requirements before configuration accesses.\n- **Common bug class:** firmware that handles CC.EN reset correctly but leaves state stale after FLR or hot reset.","pitfall":"Testing only CC.EN resets and assuming the others behave the same.","verify":"NVMe subsystem reset behavior with respect to the link, and FLR and reset recovery times in the PCIe and NVMe specifications.","follow":[{"q":"After a hot reset, what must software do?","a":"Re-enumerate the function: reprogram BARs, bus master, MSI-X, and re-run NVMe controller initialization."},{"q":"What does CC.EN not reset?","a":"PCIe link state and PCIe configuration space, so BARs and MSI-X enables persist."}],"mod":4},{"id":"4.18","level":"Principal","type":"Trap","fig":null,"tags":["recovery","detect","transitions"],"q":"Which LTSSM exits go through Recovery, which go through Detect, and which go straight back to L0?","short":"L1 exit, speed and width changes, retrain requests and repeated replay rollover go through Recovery. Hot reset, Disabled, L2 exit, and hard timeouts go through Detect. L0s exit returns directly to L0 after FTS, and only falls to Recovery if the receiver cannot relock. Configuration reaches L0 directly during initial training.","deep":"| Event | Path |\n|---|---|\n| Initial bring-up | Detect, Polling, Configuration, L0 |\n| L1 exit | L1, Recovery, L0 |\n| L0s exit | L0s, L0 (or Recovery if FTS relock fails) |\n| Speed change | L0, Recovery (Speed, Equalization), L0 |\n| Width change (upconfigure) | L0, Recovery, Configuration, L0 |\n| Error-driven retrain | L0, Recovery, L0 |\n| Hot reset or Disabled | Recovery or Configuration to Hot Reset or Disabled, then Detect |\n| L2 exit | L2, Detect, Polling, Configuration, L0 |\n| Timeout inside Recovery | Detect (the usual outcome; Configuration is reached only by protocol events) |\n\n- **Why it matters for validation:** each path needs its own stress loop, and the recovery counts tell you which one you are exercising.\n- **Interview trap:** claiming L1 exits through Polling or L2 exits through Recovery.","pitfall":"Describing any low-power exit as \"goes through Polling.\"","verify":"Transition table against the LTSSM figure and state tables in the Base Specification.","follow":[{"q":"Why does L2 exit through Detect while L1 exits through Recovery?","a":"Power was removed in L2, so the whole link must retrain. In L1 power stays on and only lock needs to be re-established."},{"q":"What is the cheapest recovery path?","a":"L0s to L0 via FTS. That is also why its failure modes are subtle."}],"mod":4},{"id":"5.01","level":"Basic","type":"Concept","fig":"eq","tags":["equalization","isi","channel-loss"],"q":"Why does PCIe need equalization at high data rates?","short":"The copper channel (package, board, connector, cable) loses high frequencies more than low ones, so each bit smears into its neighbours. That inter-symbol interference closes the receiver's eye. Equalization gives the high frequencies back, using a shaped transmitter, a receiver filter and a decision-feedback stage, so the receiver can still slice the bit correctly.","deep":"- **The problem:** the channel acts like a low-pass filter. A single 1 among 0s arrives as a low, wide pulse whose tail leaks into the next several bit times. That leakage is inter-symbol interference (ISI).\n- **Why it grows with speed:** the Nyquist frequency moves up (4 GHz at Gen3, 8 GHz at Gen4, 16 GHz at Gen5) where loss per inch is much higher, while the bit time shrinks, so the same tail spans more bits.\n- **Three tools:** TX equalization (pre-shape the launched waveform), receiver CTLE (a linear filter that boosts highs) and receiver DFE (subtracts the ISI of already-decided bits).\n- **Where it is not needed:** at 2.5 and 5 GT/s the fixed de-emphasis of the transmitter is enough for normal channels.","pitfall":"Thinking equalization is one block. TX FIR, CTLE and DFE do different jobs and are tuned by different mechanisms.","verify":null,"follow":[{"q":"Why does the link train at Gen1 first if the target is Gen5?","a":"Every device supports 2.5 GT/s, it needs no adaptive equalization, so it is the safe place to negotiate. Then the speed change to 8 GT/s and above triggers equalization."},{"q":"Can a link at 16 GT/s work with no equalization?","a":"Only on a very short, clean channel, and the spec still runs the equalization procedure. The receiver adapts inside regardless."}],"mod":5},{"id":"5.02","level":"Basic","type":"Concept","fig":null,"tags":["tx-eq","fir","de-emphasis","preshoot"],"q":"What does the transmitter equalizer do, and what are pre-cursor, cursor and post-cursor?","short":"The transmitter runs each bit through a 3-tap FIR filter. The cursor tap is the current bit, the pre-cursor tap adds a scaled copy of the next bit (preshoot), and the post-cursor tap adds a scaled copy of the previous bit (de-emphasis). The result lowers the amplitude of long runs of identical bits relative to transitions, which pre-compensates the channel's loss of highs.","deep":"- **Taps:** C-1 (pre-cursor), C0 (cursor) and C+1 (post-cursor). The pre and post taps are normally negative, so they subtract.\n- **De-emphasis:** after a transition the following identical bits are sent at a reduced level. The transition bit keeps the full swing, so high-frequency content is relatively stronger.\n- **Preshoot:** the bit just before a transition gets a boost, which sharpens the leading edge.\n- **Peak power is constant:** the sum of the absolute tap values is fixed (the full-swing budget). Equalization lowers low-frequency amplitude rather than raising the peak.\n- **Who chooses the settings:** the link partner asks for them, since it is the receiver that knows what it sees.","pitfall":"Saying the transmitter \"boosts\" the high frequencies. It attenuates the low ones.","verify":null,"follow":[{"q":"Is TX equalization the same as \"amplifying\" the signal?","a":"No. The peak swing stays put. The low-frequency part is attenuated, which is why a lot of equalization costs eye height."},{"q":"Which tap fights the ISI from earlier bits?","a":"The post-cursor tap. Long channels need more of it."}],"mod":5},{"id":"5.03","level":"Intermediate","type":"Concept","fig":null,"tags":["gen1","gen2","de-emphasis","presets"],"q":"How did equalization work at Gen1 and Gen2, and what changed at Gen3?","short":"Gen1 uses a fixed -3.5 dB de-emphasis. Gen2 lets the transmitter use -3.5 dB or -6 dB, chosen through training or a Link Control 2 field. Neither adapts to the actual channel. Gen3 replaced that with a negotiated, per-lane, per-direction adaptive procedure: presets and coefficients requested by the receiving side, plus receiver CTLE and DFE requirements.","deep":"| Rate | Encoding | TX equalization | Adaptation |\n|---|---|---|---|\n| 2.5 GT/s | 8b/10b | Fixed -3.5 dB de-emphasis | None |\n| 5 GT/s | 8b/10b | -3.5 dB or -6 dB | Choice of two, not adaptive |\n| 8 GT/s | 128b/130b | 3-tap FIR, presets P0 to P10 and coefficients | Four-phase negotiation, per lane |\n| 16, 32 GT/s | 128b/130b | Same mechanism, tighter budgets | Same four phases |\n\n- **Why the change:** at 8 GT/s the Nyquist frequency is 4 GHz, where real channels lose far more than a fixed setting can compensate, and channels differ widely (a short M.2 trace versus a long backplane). A static setting is wrong for most of them, so it had to become adaptive.\n- **Per lane:** each lane has its own channel, so each gets its own settings.","pitfall":"Assuming equalization is a single event during link-up. A Gen5 device that trained through 8 and 16 GT/s has run the procedure at each of those rates.","verify":"Selectable De-emphasis field and Link Control 2 details for 5 GT/s.","follow":[{"q":"Is the Gen2 -6 dB setting negotiated adaptively?","a":"No. It is a static selection via the Selectable De-emphasis bit and the Link Control 2 field. It is not a training loop."},{"q":"Does Gen3 equalization only run at 8 GT/s?","a":"No. It runs for each higher rate you reach, using that rate's own settings."}],"mod":5},{"id":"5.04","level":"Intermediate","type":"Concept","fig":null,"tags":["presets","p0-p10","coefficients"],"q":"What are the transmitter presets P0 to P10, and which one is flat?","short":"They are eleven predefined 3-tap FIR settings covering combinations of preshoot and de-emphasis, so two ports can agree on a starting point by sending a 4-bit number instead of coefficients. P4 is the flat one, with no preshoot and no de-emphasis. P0 is pure de-emphasis at -6 dB, and P1 is -3.5 dB.","deep":"- **Purpose:** a quick common vocabulary. A receiver can ask \"use P7\" instead of sending three coefficients, and the transmitter maps the preset to its own coefficient values.\n- **Rough map:** P0 (-6 dB de-emphasis), P1 (-3.5 dB), P2 (-4.4 dB), P3 (-2.5 dB), P4 (no equalization), P5 and P6 (preshoot only, small), P7 and P8 (3.5 dB preshoot plus -6 dB or -3.5 dB de-emphasis), P9 (preshoot only, larger), P10 (de-emphasis tied to the boost limit, used for special cases).\n- **Typical usage:** platforms often start from a moderate preset and tune from there, and firmware can pin per-lane presets in the Lane Equalization Control registers.\n- **After presets:** if a preset is not good enough the receiver requests explicit coefficients in later phases.","pitfall":"Memorizing preset dB values as facts. Interviewers care that you know the trade-off (more de-emphasis for a lossier channel, more preshoot for a bandwidth-limited one) more than the table.","verify":"The exact preshoot and de-emphasis dB for P2 and P5 through P10 in the Base Specification's transmitter preset table.","follow":[{"q":"Does every transmitter implement all 11 presets?","a":"Yes, every port must support all of them at the rates where equalization applies. Exact dB values have a tolerance."},{"q":"Why is P4 useful in validation?","a":"It is the reference flat waveform. Comparing eye or margin at P4 against the negotiated preset shows how much the equalization buys you on that channel."}],"mod":5},{"id":"5.05","level":"Intermediate","type":"Numeric","fig":null,"tags":["fir","coefficients","de-emphasis","math"],"q":"Given a flat sum of tap magnitudes of 1, what post-cursor coefficient gives -6 dB de-emphasis, and what gives -3.5 dB?","short":"With no pre-cursor tap, C0 = 1 - |C+1|. De-emphasis is 20 log10((C0 - |C+1|) / (C0 + |C+1|)). For -6 dB the ratio is 0.5, so C+1 = -0.25 and C0 = 0.75. For -3.5 dB the ratio is 0.668, so C+1 = -0.166 and C0 = 0.834.","deep":"1. Take the fixed budget C0 + |C+1| = 1 (the peak amplitude, at a transition).\n2. After a transition, a run of identical bits sits at C0 - |C+1| (the steady low-frequency level).\n3. De-emphasis in dB = 20 log10((C0 - |C+1|) / 1).\n4. For -6.02 dB: the ratio is 0.5, so C0 - |C+1| = 0.5 and C0 + |C+1| = 1, giving C0 = 0.75 and |C+1| = 0.25.\n5. For -3.5 dB: the ratio is 10^(-3.5/20) = 0.668, so C0 = 0.834 and |C+1| = 0.166.\n\n```\nP0  (-6.0 dB)  ->  C+1 = -0.25, C0 = 0.75\nP1  (-3.5 dB)  ->  C+1 = -0.166, C0 = 0.834\n```\n\n- **What it shows:** a lot of equalization means the steady-state level is only half the peak level. Equalizing costs eye height at low frequency, so the receiver has to be able to tell the smaller level from noise.\n- **In a real preset table:** the pre-cursor tap and headroom constraints (FS and LF) also shape the values. This simplified model matches the post-cursor-only presets.","pitfall":"Quoting -6 dB as \"6 dB of boost\". It is a 6 dB reduction of the steady level relative to the transition level.","verify":"The definition of preset ratios in terms of FS, LF and coefficient constraints.","follow":[{"q":"What happens to the signal energy at DC when you go from P4 to P0?","a":"The DC (long-run) level drops by 6 dB while the transition amplitude is unchanged."},{"q":"Why not send a bigger amplitude instead?","a":"The transmitter swing is bounded by the specification and by its supply, so the peak is fixed and equalization redistributes energy."}],"mod":5},{"id":"5.06","level":"Intermediate","type":"Concept","fig":"eqphases","tags":["eq-phases","phase0","phase1","phase2","phase3"],"q":"Walk through the four phases of Gen3+ link equalization.","short":"Phase 0: the downstream port hands the upstream port a preset and receiver hint using EQ TS2 (sent at the old rate, applied when the new rate starts). Phase 1 (at the new rate) both sides check the link works with those presets and exchange FS and LF. In Phase 2 the upstream port tunes the downstream port's transmitter. In Phase 3 the downstream port tunes the upstream port's transmitter. Each side tunes the other's TX.","deep":"- **Phase 0:** just before the rate change, at 2.5 or 5 GT/s, the downstream port sends its chosen TX preset and Rx preset hint for the upstream port. The upstream port applies the preset when it arrives at the new rate.\n- **Phase 1:** both ports are at the new rate in Recovery.Equalization and advertise their preset, FS and LF in TS1. The goal is a link that works well enough (bit, symbol and block alignment, and a BER good enough to continue) and to publish the tuning ranges.\n- **Phase 2 (USP tunes DSP):** the upstream port evaluates what it receives, then requests new TX coefficients or presets from the downstream port through TS1 fields, iterating until satisfied or timed out.\n- **Phase 3 (DSP tunes USP):** the same in the other direction.\n- **Why the receiver drives it:** only the receiver knows the eye quality at its own slicer.\n- **Done when:** both directions are tuned. The LTSSM then continues through Recovery.RcvrLock and RcvrCfg to L0.","pitfall":"Mixing up which port tunes which transmitter. In Phase 2 the upstream port is the one asking, and it is the downstream port's TX that changes.","verify":"Which side evaluates in Phase 2 versus Phase 3, and the exact per-phase timeouts (order of tens of ms).","follow":[{"q":"Which port controls the timing of the phases?","a":"The downstream port initiates and leads Phase 3, the upstream port leads Phase 2. If a phase times out, equalization is counted as unsuccessful. The LTSSM then goes through Recovery.Speed and retries or drops to a lower rate."},{"q":"Where does the receiver's own EQ (CTLE and DFE) adapt?","a":"Internally and continuously during all the phases. It has no protocol messages."}],"mod":5},{"id":"5.07","level":"Advanced","type":"Concept","fig":null,"tags":["fs","lf","coefficient","tuning","ts1"],"q":"What are FS and LF, and how does a coefficient-tuning request work?","short":"FS (full swing) is the maximum transmitter output amplitude expressed in coefficient units, and LF (low frequency) is the smallest steady-state level the transmitter can produce. A receiver asks for a new setting by sending a TS1 with the requested preset or coefficients. The transmitter checks it against FS and LF, applies it or rejects it, and reports that in its own TS1, so the receiver can compare eyes and choose.","deep":"- **Coefficient units:** the three taps are integers in a shared range. FS is the sum of tap magnitudes. LF is the level of a long run, so LF = C0 - |C-1| - |C+1| in a simple model.\n- **Constraints:** a request must stay inside limits, for example the pre-cursor is limited to keep the transmitter linear. A request that violates FS or LF is rejected.\n- **Request and response:** the receiver sends a TS1 carrying the full set it wants (a preset, or the three coefficient values). The transmitter echoes the values in its own TS1 once applied, or sets a Reject Coefficient Value bit if the request breaks the FS or LF constraints.\n- **Loop:** request, wait for a settling time, measure the eye or error metric, then request again. Implementations use steepest descent or an exhaustive search of a small neighbourhood.\n- **Timeout:** each phase has a bounded window, so implementations limit their search.","pitfall":"Treating a rejected request as an error. It is a normal limit-hit and the tuning algorithm should handle it.","verify":"Symbol positions and field names in TS1 for the coefficient request and response, and the FS and LF value ranges.","follow":[{"q":"Why not just always use the best preset and skip coefficients?","a":"Presets are coarse. Coefficient tuning finds a better point for a specific lane, and when it fails you can still fall back on the preset."},{"q":"Why might a device use a fixed preset and skip tuning?","a":"Platform tuning has already been done at bring-up, so the device uses the preset from firmware or from Lane Equalization Control and finishes training in a predictable time."}],"mod":5},{"id":"5.08","level":"Intermediate","type":"Concept","fig":null,"tags":["ctle","dfe","rx-eq","rx-preset"],"q":"How does receiver equalization work, and why does the spec barely define it?","short":"The receiver applies a CTLE (a linear filter that boosts high frequencies) and often a DFE (which subtracts the ISI expected from the bits it has already decided). It adapts continuously and locally, so no protocol messages are needed. The spec defines a reference receiver for compliance testing, and an Rx preset hint in Phase 0, but leaves the actual algorithms to the implementer.","deep":"- **CTLE:** an analogue filter with programmable peaking (dB of gain at Nyquist), placed before the sampler. It amplifies noise and crosstalk along with the signal.\n- **DFE:** subtracts a weighted sum of previously decided bits from the incoming sample, so it removes post-cursor ISI without amplifying noise. Errors can propagate: one wrong decision affects the next few samples, giving burst errors.\n- **Why the spec leaves it open:** vendors compete on receiver performance. What matters is that the receiver meets a defined BER under a defined stressed eye.\n- **Reference receiver:** the specification defines a reference CTLE and DFE model for channel compliance and for the stressed-eye test, so everyone measures the same thing.\n- **Rx preset hint:** a 3-bit suggested starting CTLE setting sent in the equalization TS2 and in Lane Equalization Control, which the receiver may use or ignore.","pitfall":"Assuming a \"bad eye\" on a scope means the receiver fails. The receiver's DFE and CTLE can recover eyes that look closed at the pin.","verify":"Reference CTLE and DFE parameters per rate, and the Rx preset hint encoding.","follow":[{"q":"Why does DFE cause burst errors?","a":"A wrong decision feeds back and corrupts the next few decisions, so errors come in short bursts rather than isolated. That motivates precoding at Gen5."},{"q":"Can you see the receiver EQ state from software?","a":"Not through the spec. Vendor debug registers and the Lane Margining feature give the outcome, not the coefficients."}],"mod":5},{"id":"5.09","level":"Advanced","type":"Concept","fig":null,"tags":["perform-equalization","redo-eq","linkctl3","speed-change"],"q":"When does equalization run, and how can software force it to run again?","short":"It runs the first time the link goes to a rate of 8 GT/s or above, during a speed change through Recovery.Equalization. It can be repeated: a port can request it (Link Equalization Request), and software can set the Perform Equalization bit in Link Control 3 before triggering a retrain. Reset, hot reset or a cold link-up also re-run it.","deep":"- **First use:** on the first transition to each new rate, the equalization phases run because no settings are stored for that rate.\n- **Redo via hardware:** if the receiver detects degradation (e.g. rising BER), it sets its Link Equalization Request bit, optionally with an interrupt, to ask software to redo equalization.\n- **Redo via software:** set Perform Equalization in Link Control 3 (in the Secondary PCI Express Extended Capability), then request a retrain (Retrain Link) or a speed change. The next Recovery does a full equalization pass.\n- **Rates are independent:** each rate has its own Lane Equalization Control and status bits, so a Gen5 link tracks 8, 16 and 32 GT/s equalization separately.\n- **Cost:** equalization takes milliseconds to tens of milliseconds, during which the link is not carrying traffic.","pitfall":"Expecting every retrain to redo equalization. Ordinary Recovery from L1 reuses the stored settings and skips it.","verify":"Names and bit positions in Link Control 3 and Link Status 2 for each rate (8, 16, 32 GT/s), and which retrains skip equalization.","follow":[{"q":"Why does re-equalizing help?","a":"Temperature, voltage or cable position can change since the last training. Retraining lets both sides find new settings."},{"q":"What is the risk of forcing EQ on a live device?","a":"The link is down during it. TLPs are held and completion timeouts can fire if the redo is slow, so it should be done at a controlled quiet point."}],"mod":5},{"id":"5.10","level":"Advanced","type":"Debug","fig":null,"tags":["lnksta2","lane-eq-control","registers","eq-status"],"q":"Which registers tell you whether equalization completed and what was chosen?","short":"Link Status 2 has, per rate, Equalization Complete and Phase 1, 2 and 3 Successful bits, plus Link Equalization Request. The Lane Equalization Control registers hold the per-lane TX presets and Rx hints used or requested. These live in the Secondary PCI Express Extended Capability (8 GT/s) and its 16 and 32 GT/s counterparts.","deep":"- **Link Status 2:** Current De-emphasis Level, Equalization 8.0 GT/s Complete, Phase 1 Successful, Phase 2 Successful, Phase 3 Successful, Link Equalization Request 8.0 GT/s.\n- **Higher rates:** the 16 GT/s and 32 GT/s Physical Layer Extended Capabilities carry the same kind of status and a per-lane control array.\n- **Lane Equalization Control:** one entry per lane holding the downstream TX preset, downstream Rx preset hint, upstream TX preset and upstream Rx preset hint.\n- **Reading the result:**\n  - Complete = 1, all phases successful: normal.\n  - Phase 1 fail: the link does not work at the new rate at all (channel, clocking).\n  - Phase 2 or 3 fail: the tuning did not converge (marginal channel, mismatch, retimer).\n- **Tools:** `lspci -vvv` on Linux (Secondary PCI Express capability), `setpci` for raw access, vendor tools on Windows.","pitfall":"Reading Complete = 1 as \"the eye is good\". Complete only means the procedure finished without timing out.","verify":"Exact bit names and layout for the 16 GT/s and 32 GT/s status and control registers.","follow":[{"q":"The link runs at 16 GT/s but the 8 GT/s Phase 3 bit is 0. Is that a problem?","a":"Possibly not. Check whether the bit is defined as sticky per rate and whether that rate was actually trained through. Compare with a known-good system."},{"q":"Do the preset registers show what the receiver finally settled on?","a":"No. They show requested or default presets. The final coefficients are internal unless the vendor exposes them."}],"mod":5},{"id":"5.11","level":"Advanced","type":"Concept","fig":null,"tags":["precoding","gen5","dfe","burst-errors"],"q":"What is precoding and why was it added at 32 GT/s?","short":"A DFE causes burst errors because one wrong decision corrupts the next few. Precoding transforms the transmitted data so a burst of errors turns into fewer, shorter events after the receiver's decoder, which improves how errors look to the link CRC and the replay logic. At 32 GT/s the ports can negotiate precoding in the training sequences, and it is an integral part of the PAM4 signalling in Gen6.","deep":"- **Problem:** with a DFE, the error probability is not independent per bit. A single symbol error may become several bit errors in a row.\n- **Idea:** the transmitter applies a simple, reversible filter (a 1/(1+D) style precoder) before sending. The receiver undoes it after the slicer. An error burst caused by DFE feedback collapses into two edge errors rather than a long run.\n- **At Gen5:** the receiver requests precoding via the training sequence, and the transmitter enables it. It is negotiated per lane.\n- **At Gen6:** PAM4 raises the raw BER to about 1e-6, so precoding is used together with FEC and a lightweight CRC to bring the residual error rate down.","pitfall":"Calling precoding a form of equalization. It changes error statistics, not the eye.","verify":"Which rates define precoding, how it is requested in TS1 and the exact precoder polynomial.","follow":[{"q":"Why do errors matter beyond BER?","a":"Burst length interacts with what the CRC and FEC can correct, and the error count a validator sees in counters. The same raw BER with bursts causes more replay events than with isolated errors."},{"q":"Is precoding part of the equalization phases?","a":"It is negotiated in the same training exchange, but it is not one of the four phases."}],"mod":5},{"id":"5.12","level":"Principal","type":"Trap","fig":null,"tags":["over-equalization","margin","tuning","crosstalk"],"q":"A colleague says \"just use the highest-boost preset to be safe\". What is wrong with that?","short":"More equalization is not safer. Boost raises the high-frequency gain, so it also amplifies crosstalk, reflections and noise, and de-emphasis lowers the low-frequency level that the receiver's threshold needs. Past an optimum point, the eye closes again. Every channel has a best setting, and margin (not the preset number) is the measure that tells you which one it is.","deep":"- **Two failure modes:** under-equalization leaves ISI. Over-equalization adds noise and can add distortion and overshoot at edges, and reduces steady-state eye height.\n- **Crosstalk and reflections:** these are high-frequency and not fixed by equalization. Boosting highs makes them worse.\n- **Receiver limits:** a CTLE with too much peaking saturates the front end and reduces the DFE's effective input range.\n- **How to find the optimum:** sweep presets (or fix the TX and vary the RX) and measure per-lane margin or BER at each. Choose the setting with the widest margin, not the highest boost.\n- **Short channels:** a short, clean channel prefers a flat preset (P4 or similar). The negotiated preset on such a channel showing modest equalization is a healthy sign.","pitfall":"Optimizing for \"the link comes up\" during bring-up. A link that trains only with an extreme setting fails first in the field.","verify":null,"follow":[{"q":"Your Gen5 link passes with a high-boost preset but fails with a mid one. Which do you trust?","a":"Neither by itself. Measure the margin across temperature and voltage. A setting that only works at one point has no headroom."},{"q":"Why does margin beat a pass/fail link-up?","a":"Link-up is binary and hides the edge of failure. Margin shows how far from it you are."}],"mod":5},{"id":"5.13","level":"Intermediate","type":"Concept","fig":null,"tags":["retimer","redriver","repeater"],"q":"What is the difference between a redriver and a retimer?","short":"A redriver is an analog device that amplifies and filters the signal without recovering the clock or understanding the protocol. It boosts noise and jitter along with the signal. A retimer is protocol-aware: it recovers the clock, decodes the bits, and retransmits with a fresh clock and its own transmitter, so the channel is split into two independent segments. Retimers reset accumulated jitter and noise. Redrivers do not.","deep":"| | Redriver | Retimer |\n|---|---|---|\n| Clock recovery | No | Yes (CDR) |\n| Protocol awareness | No | Yes, has its own LTSSM |\n| Resets jitter | No | Yes |\n| Equalization | Fixed or programmed gain and EQ, invisible to link partners | Full link equalization on each segment |\n| Latency | Very small | Tens of nanoseconds |\n| Typical use | Short, moderate loss | Long channels, backplanes, risers, Gen5 and beyond |\n\n- **Retimer segments:** the retimer trains with the root port on one side and with the endpoint on the other. Each segment does its own equalization.\n- **Redriver problems:** it can break receiver detection, compliance and equalization negotiation, since the partners see a channel that is neither the real one nor a clean one.\n- **Gen5 trend:** at 32 GT/s the loss budget is tight enough that most long or connector-heavy topologies need retimers.","pitfall":"Treating a redriver as a lower-cost retimer. They solve different problems and a redriver cannot fix a jitter problem.","verify":"Maximum number of retimers and the retimer latency budget in the Base Specification.","follow":[{"q":"Does a retimer add latency to TLPs?","a":"Yes, a small amount in each direction, tens of ns. Rarely visible but it counts in tight completion or latency budgets."},{"q":"Can a link have more than one retimer?","a":"The specification allows up to two between the two link ends. Each segment must be within its own channel budget."}],"mod":5},{"id":"5.14","level":"Advanced","type":"Concept","fig":null,"tags":["retimer","ltssm","skp","sris"],"q":"How does a retimer behave in the LTSSM, and how do the two ports know it is there?","short":"A retimer has a forwarding mode in which it passes bits through, and it also runs its own LTSSM on each side to train each segment. Ports discover it through Retimer Present bits in the TS2 ordered sets, which lets them adjust timeouts, N_FTS and clock-tolerance assumptions. The retimer absorbs clock differences by adding or removing SKP ordered sets, and each segment can run on a slightly different clock.","deep":"- **Two segments:** the root-port-facing side acts as an upstream port and the endpoint-facing side as a downstream port. Each side trains and equalizes independently.\n- **Forwarding:** after training, TLPs, DLLPs and ordered sets are passed through, with SKP ordered sets inserted or dropped to absorb the clock offset between the two segments.\n- **Discovery:** TS2 has Retimer Present and Two Retimers Present bits, so each port learns how many retimers are in the path.\n- **Effects on training:** timers are extended to allow for the retimer's own training time. Equalization may take longer.\n- **Clocking:** the segments may use separate reference clocks, so a retimer supports common-clock and separate-clock modes.\n- **Configuration:** a retimer usually has its own register interface (I2C, SMBus or a management port) with firmware, presets and per-lane settings.","pitfall":"Assuming a retimer is a transparent wire in debug. Every retimer adds a component with its own firmware version, configuration, and failure modes.","verify":"Which TS2 bits and symbol carry Retimer Present, SKP handling rules, and the retimer-related timeout extensions.","follow":[{"q":"If the endpoint's Link Status shows Gen5 x4, does that prove the retimer's other side is Gen5 x4 too?","a":"It proves the end-to-end link works at that rate, but each retimer segment negotiates separately. Read the retimer's own status to see per-segment results."},{"q":"What does the port do with TS1 that the retimer has modified?","a":"The retimer forwards or rewrites the training fields as the specification requires so both ports see a consistent end-to-end view."}],"mod":5},{"id":"5.15","level":"Principal","type":"Scenario","fig":null,"tags":["triage","retimer","gen5","backplane","downtrain"],"q":"A Gen5 x4 SSD behind a retimer on a backplane trains at Gen4, or fails intermittently at Gen5. How do you triage it?","short":"First prove where the downtrain happens: read the equalization status bits at the root port and the endpoint, and the retimer's own segment status. Then split the variables: swap the drive, the slot and the retimer firmware and preset settings, and compare cold-boot to warm-reset. Finally use lane margining or an in-line analyzer to see whether one lane or one segment is the weak point.","deep":"1. **Capture state:** current link speed and width, `LnkSta2` phases per rate, AER counters, and the LTSSM log if available. Record which lanes and which segment.\n2. **Segment isolation:** read the retimer's per-segment link state and error counters. A failure on the root-port-side segment points to the host board and connector. A failure on the endpoint side points to the backplane, connector or drive.\n3. **Split the variables:**\n   - Swap the drive between slots and against a known-good drive.\n   - Try the drive in a direct-attach slot with no retimer, if there is one.\n   - Update or roll back retimer firmware, and check its register configuration against the vendor's platform tuning guide.\n4. **Reset sequence:** confirm the retimer is out of reset and its reference clock is stable before the root port starts training. A late retimer makes the root port train against nothing and fall back.\n5. **Margin:** run lane margining at the receivers to find the weak lane, then sweep presets to see how much the margin moves.\n6. **Environment:** repeat at temperature and voltage corners, and with a different cable or connector.\n\n- **Interposers:** a passive analyzer interposer adds loss, so a Gen5 link that works normally may fail with it in place. Use it with that in mind.","pitfall":"Blaming the drive first. In a retimed topology the drive is one of four or five things in the chain, so isolate before deciding.","verify":null,"follow":[{"q":"The link is stable at Gen4 but flaky at Gen5. Ship it at Gen4?","a":"Only as a documented workaround. It hides a margin problem that may also lurk in the Gen4 path and it loses half the bandwidth."},{"q":"Cold boot fails, warm reset works. What does that suggest?","a":"A power-up sequencing or reset-timing issue (retimer or drive not ready by the time the root port trains), or a temperature-dependent margin."}],"mod":5},{"id":"5.16","level":"Principal","type":"Debug","fig":null,"tags":["automation","link-up-yield","perst","margining","regression"],"q":"One boot in about two hundred comes up at a lower speed. How do you build automation that quantifies and root-causes it?","short":"Run a soak test that repeatedly resets the link (PERST# toggle, hot reset, or power cycle) and records the final speed, width, equalization status bits, AER counters and lane margin every time. From a few thousand cycles you get a link-up yield and a distribution by lane and preset, and you can correlate failures with temperature, voltage, slot and firmware.","deep":"- **Loop:** reset, wait for the link (with a timeout), read `LnkSta`, `LnkSta2`, AER and margin, log everything with a timestamp and the conditions, repeat for N cycles (thousands).\n- **Reset types to compare:** PERST# assertion (fundamental reset), secondary bus reset (hot reset), and full power cycle. A failure pattern that appears only in one type points to a specific mechanism.\n- **Metrics:**\n  - Link-up yield: the fraction of cycles reaching target speed and width.\n  - Time to L0: distribution, including tail.\n  - Equalization phase failures: which phase, which lane.\n  - Margin: minimum per-lane timing and voltage margin.\n- **Correlate:** temperature (chamber or hot/cold), supply voltage corners, slot and cable, firmware version, reference-clock source.\n- **Pass criteria:** a stated target, such as zero downtrains in 10,000 cycles at each corner, with a confidence bound rather than a hunch.\n- **Evidence for triage:** on any failure, capture the LTSSM log and the retimer's status before the next reset erases it.\n\n```\nfor i in 1..N:\n    toggle PERST# (or power cycle)\n    wait link up (timeout T)\n    record speed, width, LnkSta2 EQ bits, AER, margin\n    if speed < target: dump LTSSM log + retimer status; flag\n```","pitfall":"Reporting \"passed 100 cycles\". At a 1-in-200 failure rate, 100 clean cycles happens about 60% of the time.","verify":null,"follow":[{"q":"What sample size do you need to claim 1 in 1000 or better?","a":"Roughly 3000 clean cycles gives about 95% confidence that the failure rate is below 1 in 1000 (the rule of three). More for tighter claims."},{"q":"Why log the conditions with every cycle?","a":"A failure that clusters at one temperature or one slot is a margin issue. One that is uniform is a logic or sequencing issue."}],"mod":5},{"id":"6.01","level":"Basic","type":"Concept","fig":null,"tags":["dll","overview","reliability"],"q":"What does the Data Link Layer do, and why does PCIe need one?","short":"The Data Link Layer turns an unreliable serial link into a reliable one for TLPs. It stamps every TLP with a sequence number and an LCRC, checks them at the receiver, and uses ACK and NAK DLLPs with a replay buffer to resend anything that got corrupted. It also carries flow control initialization and updates, power-management handshakes, and reports link up and down to the layers above.","deep":"- **Reliable delivery:** sequence numbers plus LCRC plus replay buffer. The Transaction Layer never sees a corrupted or lost TLP unless the link itself is dead.\n- **Flow control transport:** InitFC1, InitFC2 and UpdateFC DLLPs carry the credit information the Transaction Layer needs. The Data Link Layer only moves them.\n- **Power management:** PM_Enter_L1, PM_Request_Ack and similar DLLPs run the L1 handshakes.\n- **Link state reporting:** DL_Up and DL_Down tell the Transaction Layer whether the link can carry traffic. Software can read this as Data Link Layer Link Active.\n- **Why it exists:** the specification targets a BER of about 1e-12, and at billions of bits per second something will eventually be wrong. Hardware replay keeps software out of the loop.","pitfall":"Saying the DLL guarantees delivery. It guarantees correct delivery across one link, and only while the link stays up
