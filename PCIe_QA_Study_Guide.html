.","verify":null,"follow":[{"q":"Does the Data Link Layer look at TLP contents?","a":"Only enough to frame it, number it and check the LCRC. It does not parse headers or the payload."},{"q":"Who does end-to-end integrity?","a":"The ECRC in the Transaction Layer, if enabled. The LCRC covers one link hop only."}],"mod":6},{"id":"6.02","level":"Basic","type":"Concept","fig":"encap","tags":["lcrc","sequence-number","framing","tlp"],"q":"What does the Data Link Layer add to a TLP, and what does it look like on the wire?","short":"It prepends a 2-byte field carrying a 12-bit sequence number and appends a 4-byte LCRC. The Physical Layer then adds framing: an STP start symbol and END symbol in 8b/10b, or a 4-byte STP token in 128b/130b. So on the wire a TLP is framing, sequence number, header, payload, optional ECRC, LCRC, and end marker.","deep":"- **Sequence number:** 12 bits, in a 16-bit field (4 reserved bits), placed in front of the header.\n- **LCRC:** 32-bit CRC over the sequence number and the whole TLP, so it protects the header, payload and ECRC together.\n- **Framing (8b/10b):** STP (start TLP) and END (or EDB for a nullified TLP) are control symbols.\n- **Framing (128b/130b):** an STP token at the start carries the TLP length, and the end is implied by that length.\n- **Cost per TLP:** roughly 6 bytes from the Data Link Layer plus 2 to 4 bytes framing, on top of the 12 or 16-byte header. It is why small TLPs are inefficient.","pitfall":"Forgetting the LCRC covers the sequence number. A TLP with a good LCRC but the wrong sequence number is still a receiver-side problem.","verify":null,"follow":[{"q":"Does the LCRC get recomputed on a replay?","a":"No. The same TLP, with the same sequence number and same LCRC, is resent from the replay buffer."},{"q":"Are DLLPs numbered?","a":"No. DLLPs have no sequence number and are never replayed. They are protected only by a 16-bit CRC, and lost ones are recovered by later ones."}],"mod":6},{"id":"6.03","level":"Intermediate","type":"Concept","fig":"dllp","tags":["dllp","format","types"],"q":"What is a DLLP, what does it look like, and which types exist?","short":"A DLLP is a 6-byte packet with a 1-byte type, 3 bytes of type-specific content and a 16-bit CRC. It travels between the two ends of one link and never crosses a switch. The main types are Ack, Nak, the flow control set (InitFC1, InitFC2, UpdateFC for P, NP and Cpl), the power-management DLLPs, and vendor-specific and Nop. DLLPs use no credits and are not replayed.","deep":"| Type | Encoding (byte 0) | Purpose |\n|---|---|---|\n| Ack | 00h | Acknowledge TLPs up to a sequence number |\n| Nak | 10h | Report a bad TLP, ask for replay |\n| PM_Enter_L1 | 20h | Software-directed move to L1 |\n| PM_Enter_L23 | 21h | Move to L2/L3 ready |\n| PM_Active_State_Request_L1 | 23h | ASPM L1 request |\n| PM_Request_Ack | 24h | Acknowledge a PM request |\n| InitFC1 P, NP, Cpl | 4xh, 5xh, 6xh | Initialize credits, round 1 (x = VC) |\n| InitFC2 P, NP, Cpl | Cxh, Dxh, Exh | Initialize credits, round 2 |\n| UpdateFC P, NP, Cpl | 8xh, 9xh, Axh | Return credits during operation |\n\n- **Layout:** byte 0 is the type (and VC for flow control), bytes 1 to 3 carry content such as the sequence number or credit values, bytes 4 to 5 are the CRC-16.\n- **On the wire:** with framing (SDP and END in 8b/10b) a DLLP occupies 8 bytes.\n- **No flow control on DLLPs:** they are always accepted. That is why credits can be returned even when the link is otherwise full.","pitfall":"Learning the encodings as trivia. What matters is the pattern: Ack and Nak carry a sequence number, flow control DLLPs carry credit counts, and none are replayed.","verify":"Type encodings for PM, Vendor-Specific, Nop and the Data Link Feature DLLP in the Base Specification.","follow":[{"q":"Why are DLLPs never replayed?","a":"They are periodic or self-superseding. A later Ack covers an earlier one and a later UpdateFC carries a newer cumulative total."},{"q":"Can a DLLP pass through a switch?","a":"No. It is consumed at the next link partner. Each link has its own."}],"mod":6},{"id":"6.04","level":"Intermediate","type":"Concept","fig":"replay","tags":["ack","nak","replay","cumulative"],"q":"Explain the ACK/NAK protocol and the replay buffer.","short":"The sender keeps every transmitted TLP in a replay buffer until it is acknowledged. The receiver checks LCRC and sequence number. If good it accepts the TLP and sends an Ack, which is cumulative: acknowledging sequence N covers everything up to N. If bad it drops the TLP and sends a Nak with the last good sequence number. The sender purges up to that number and replays the rest, in order.","deep":"1. Sender assigns the next sequence number, transmits, and stores a copy.\n2. Receiver checks the TLP. Good: NEXT_RCV_SEQ advances and the TLP goes up to the Transaction Layer. Bad: it is discarded.\n3. Receiver sends Ack (covers all in-order TLPs so far) or Nak (report an error).\n4. On an Ack the sender frees buffer entries up to that sequence number.\n5. On a Nak the sender frees up to the reported number and retransmits everything still in the buffer, in original order.\n\n- **Cumulative:** the receiver does not have to send one Ack per TLP. It may coalesce them within a latency limit.\n- **Go-back-N:** later TLPs already in flight are dropped by the receiver as out of sequence and get sent again with the replay. That is why one error costs about a round trip of bandwidth.\n- **One Nak per error burst:** the receiver sets a NAK_SCHEDULED flag and does not send more Naks until it receives the expected TLP.\n- **Flow control credits:** a replay does not consume credits again. They were taken when the TLP was first sent.","pitfall":"Imagining selective retransmit. PCIe replays everything after the first bad TLP.","verify":null,"follow":[{"q":"Why is the Ack cumulative?","a":"It reduces DLLP traffic and simplifies state. One Ack retires many TLPs."},{"q":"Does the Transaction Layer see the replay?","a":"No. Replay is entirely between the two Data Link Layers."}],"mod":6},{"id":"6.05","level":"Intermediate","type":"Concept","fig":null,"tags":["sequence-number","window","wrap","counters"],"q":"How does the 12-bit sequence number work, and why can only 2048 TLPs be outstanding?","short":"Sequence numbers count 0 to 4095 and wrap. The sender tracks NEXT_TRANSMIT_SEQ and ACKD_SEQ, the receiver tracks NEXT_RCV_SEQ. To tell a new TLP from an old duplicate after wrap, the spec limits unacknowledged TLPs to at most 2048, half the space. Numbers within 2048 behind the expected one are duplicates, and those within 2048 ahead are gaps.","deep":"- **Sender state:** NEXT_TRANSMIT_SEQ (next number to assign), ACKD_SEQ (last acknowledged).\n- **Receiver state:** NEXT_RCV_SEQ (the next number it expects).\n- **Why half:** modular arithmetic on a 12-bit field is only unambiguous if all live numbers sit inside a window of half the range. Then \"behind\" and \"ahead\" of the expected number never overlap.\n- **Classification at the receiver:**\n\n| Received seq vs NEXT_RCV_SEQ | Meaning | Action |\n|---|---|---|\n| Equal | The expected TLP | Accept if LCRC good |\n| Up to 2048 behind | Duplicate (already accepted) | Discard, but send Ack |\n| Otherwise (ahead) | A TLP was lost | Discard, send Nak |\n\n- **Practical limit:** at typical rates the buffer size or round trip runs out first, so the 2048 limit rarely binds. Tiny TLPs at very high rates and long round trips (retimers, long cables) get closer.","pitfall":"Thinking the sequence number is a global TLP ID. It is per link and per direction, and is unrelated to the requester's Tag.","verify":"Initial values of NEXT_TRANSMIT_SEQ, ACKD_SEQ and NEXT_RCV_SEQ, and the exact Ack/Nak sequence number encoding (NEXT_RCV_SEQ minus 1).","follow":[{"q":"Why ack a duplicate instead of ignoring it?","a":"A duplicate usually means the sender did not see an earlier Ack. Acking it lets the sender move on."},{"q":"What resets the counters?","a":"Entering DL_Inactive/DL_Init (link down and back up) resets them on both sides, so they start from 0 in a fresh link."}],"mod":6},{"id":"6.06","level":"Intermediate","type":"Trap","fig":null,"tags":["duplicate","nak-scheduled","out-of-sequence"],"q":"A receiver sees TLP 10, then 12 (11 was corrupted and dropped), then 13. What does it send, and what does the sender do?","short":"TLP 11 fails the LCRC, so the receiver drops it and sends one Nak carrying sequence 10. TLPs 12 and 13 are out of sequence, so they are dropped silently, with no additional Nak because NAK_SCHEDULED is already set. The sender receives the Nak, frees up to 10, and replays 11, 12, 13 in order. The receiver accepts them and normal Acks resume.","deep":"1. TLP 11 arrives with a bad LCRC: discard, send Nak(10), set NAK_SCHEDULED.\n2. TLP 12 arrives: its number is ahead of NEXT_RCV_SEQ (11), so it is out of sequence. Discard. No new Nak, because one is outstanding.\n3. TLP 13: same.\n4. Sender gets Nak(10): it frees up to 10 and replays 11, 12, 13.\n5. Receiver accepts 11 (clears NAK_SCHEDULED), 12 and 13, and sends Ack(13).\n\n- **Important:** the receiver sent one Nak, while the sender resent three TLPs. Error counters and replay volume are not one to one, and whether TLPs 12 and 13 also add to the Bad TLP count depends on how the implementation and spec version classify out-of-sequence TLPs.\n- **If the Nak is lost:** the DLLP CRC would fail (Bad DLLP), the sender never learns, and its replay timer eventually expires and replays anyway.","pitfall":"Assuming each dropped TLP makes a Nak. One Nak covers the whole burst until the expected TLP arrives.","verify":"Whether out-of-sequence TLPs that are discarded are counted as Bad TLP in AER.","follow":[{"q":"What if TLP 11 arrives corrupted and the receiver cannot even tell it is a TLP (framing lost)?","a":"It appears as a Receiver Error at the Physical Layer. TLP 12 later shows up as out of sequence and triggers a Nak."},{"q":"Does the sender log anything on a Nak-triggered replay?","a":"No AER bit is set for the Nak replay itself. The receiver logs Bad TLP. The replay does count toward REPLAY_NUM, though."}],"mod":6},{"id":"6.07","level":"Advanced","type":"Numeric","fig":null,"tags":["replay-buffer","sizing","bdp","round-trip"],"q":"How large must the replay buffer be for a Gen4 x4 link, and what sets that size?","short":"The buffer must hold every TLP sent during one round trip: the time for a TLP to reach the receiver, be checked, have its Ack scheduled and return. At about 7.88 GB/s and an assumed 1 microsecond round trip that is about 7.9 KB. With roughly 280-byte TLPs that is about 28 TLPs in flight. A smaller buffer stalls the sender waiting for Acks.","deep":"1. Link rate: 16 GT/s x 4 lanes x 128/130 = 63.0 Gb/s = about 7.88 GB/s per direction.\n2. Round trip (assumed): TLP transit, receiver LCRC check and logic, Ack coalescing wait, Ack transit, sender processing = about 1 microsecond. Real designs work from the spec's Ack latency limits for the width and Max_Payload_Size.\n3. Bytes in flight = 7.88 GB/s x 1 microsecond = about 7.9 KB.\n4. With 256 B payload plus about 24 B of overhead, a TLP is about 280 B, so about 28 TLPs.\n5. Add margin for at least one maximum-size TLP being sent and one being received when the Ack arrives.\n\n- **Scaling:** double the width or the rate and the buffer must double. Add retimers or long cables and it grows by the extra latency times the rate.\n- **Effect of too small a buffer:** the link idles waiting for Acks, so throughput falls below line rate even with zero errors. It is a performance bug that looks like nothing in the error counters.","pitfall":"Sizing to the average round trip. Size to the worst case allowed by the Ack latency limits, or the buffer fills and the link stalls.","verify":"The Ack latency limit table (by width and Max_Payload_Size) and REPLAY_TIMER formula in the Base Specification.","follow":[{"q":"Which setting makes the required buffer larger?","a":"Larger Max_Payload_Size raises the allowed Ack latency, and wider or faster links carry more bytes per microsecond."},{"q":"How do Ack coalescing and buffer size interact?","a":"Slower coalescing frees the receiver's DLLP bandwidth but keeps entries in the sender's buffer longer, so it needs a larger buffer."}],"mod":6},{"id":"6.08","level":"Advanced","type":"Concept","fig":null,"tags":["replay-timer","replay-num","rollover","recovery"],"q":"What are REPLAY_TIMER and REPLAY_NUM, and when does a replay force the link to retrain?","short":"REPLAY_TIMER runs at the sender while TLPs are unacknowledged. If it expires with no Ack or Nak progress, the sender replays the buffer and increments REPLAY_NUM, a 2-bit counter. If REPLAY_NUM would roll over from 3 back to 0, meaning repeated replays without progress, the Data Link Layer asks the Physical Layer to retrain the link by entering Recovery. Both events are logged as correctable errors.","deep":"- **REPLAY_TIMER:** starts when a TLP is sent (if not running) and resets on each Ack that makes progress. It is a few times the Ack latency limit, so a lost Ack or a stuck receiver triggers it.\n- **On expiry:** replay everything in the buffer, restart the timer, increment REPLAY_NUM, and log Replay Timer Timeout (AER correctable).\n- **On rollover:** REPLAY_NUM would go from 3 to 0, so the Data Link Layer stops transmitting and requests retraining. AER logs Replay Number Rollover.\n- **On progress:** an Ack that acknowledges at least one TLP resets REPLAY_NUM to 0.\n- **After retrain:** the replay buffer is kept, and replay resumes when the link is back in L0. If retraining fails, DL_Down follows.\n- **Why it matters:** repeated rollover events mean the link is bad enough to keep failing, and the retrain is the hardware's last attempt before declaring the link dead.","pitfall":"Treating Replay Number Rollover as a benign counter. It means the link was one step from a forced retrain, which stalls all traffic for microseconds to milliseconds.","verify":"The REPLAY_TIMER limit formula, and exactly which events (Nak, timer expiry, Ack with progress) increment or reset REPLAY_NUM.","follow":[{"q":"Does a Nak-triggered replay increment REPLAY_NUM?","a":"Replays increment it and progress in acknowledgment resets it. Check the spec for the exact Nak handling, since a Nak that also frees entries counts as progress."},{"q":"What would a stuck receiver look like at the sender?","a":"Replay Timer Timeouts, then Rollover, then Recovery, and possibly a link down if the partner never responds."}],"mod":6},{"id":"6.09","level":"Intermediate","type":"Concept","fig":null,"tags":["lcrc","crc32","crc16","polynomial","ecrc"],"q":"Which CRCs does PCIe use, and what does each protect?","short":"LCRC is a 32-bit CRC per link, covering the sequence number and TLP, checked and regenerated at every hop. ECRC is a 32-bit CRC from source to destination in the Transaction Layer, optional and left untouched by switches. DLLPs use a 16-bit CRC. The 32-bit CRC uses the same polynomial as Ethernet, 0x04C11DB7, and the DLLP CRC-16 uses 0x100B.","deep":"| CRC | Width | Scope | Checked by |\n|---|---|---|---|\n| LCRC | 32 | Sequence number and TLP, one link | Every receiver |\n| ECRC | 32 | TLP header and data, end to end | Final receiver (and switches may check) |\n| DLLP CRC | 16 | The 4 bytes of the DLLP | Every receiver |\n\n- **Polynomials:** CRC-32 is x^32+x^26+x^23+x^22+x^16+x^12+x^11+x^10+x^8+x^7+x^5+x^4+x^2+x+1 (0x04C11DB7). The DLLP CRC-16 polynomial is 0x100B.\n- **Why both LCRC and ECRC:** LCRC catches link errors and triggers replay. ECRC catches errors introduced inside a switch or a device between the links, where LCRC is regenerated over corrupted data and appears fine.\n- **Strength:** a 32-bit CRC detects every burst error up to 32 bits long and all but about 1 in 4 billion (2^-32) of longer or random error patterns, which is strong for link error patterns.","pitfall":"Assuming LCRC protects end to end. A fault inside a switch's buffers gets a fresh good LCRC on the way out.","verify":"The polynomial and initial values for LCRC and DLLP CRC in the Base Specification, and the ECRC masking of variant bits.","follow":[{"q":"Why does the switch regenerate the LCRC?","a":"The sequence number is per link and differs on each hop, and the LCRC covers it, so it must be recomputed."},{"q":"What happens when ECRC fails?","a":"The Transaction Layer reports an uncorrectable ECRC Error (AER), and the packet is treated as bad by the receiver. It is not replayed by the Data Link Layer."}],"mod":6},{"id":"6.10","level":"Advanced","type":"Concept","fig":null,"tags":["dlcmsm","dl-init","dl-active","dl-up","dl-feature"],"q":"What is the Data Link Control and Management State Machine, and how does it decide the link is up?","short":"The DLCMSM tracks the state of the Data Link Layer. It sits in DL_Inactive until the Physical Layer reports the link is up, optionally goes through DL_Feature to exchange capabilities, then DL_Init to run flow control initialization with InitFC1 and InitFC2, and finally DL_Active, where TLPs are accepted and sent. DL_Up is reported to the Transaction Layer only in DL_Active. Loss of the Physical Layer link returns it to DL_Inactive.","deep":"- **DL_Inactive:** the Physical Layer link is down or reset. No TLPs. Waits for the link to come up.\n- **DL_Feature:** (newer specs) exchange of Data Link Feature DLLPs to negotiate optional features, such as Scaled Flow Control.\n- **DL_Init:** send InitFC1 for each VC and credit type, then InitFC2. Move on when both sides have finished.\n- **DL_Active:** normal operation. Ack/Nak, replay, and UpdateFC all run here.\n- **Link down:** any loss of the Physical Layer link, or a reset, returns to DL_Inactive and the buffers and counters are cleared.\n- **What software sees:** the Data Link Layer Link Active bit in Link Status reflects DL_Active, and hot-plug software waits on it before touching a newly inserted device.","pitfall":"Equating LTSSM L0 with a usable link. A link can sit in L0 but never reach DL_Active if flow control initialization does not complete.","verify":"Whether DL_Feature applies at all rates in the spec version you target, and DLCMSM transition conditions.","follow":[{"q":"Is the link \"up\" when the LTSSM reaches L0?","a":"Physically yes, but not to the software layers. Until the DLCMSM reaches DL_Active, TLPs are not exchanged."},{"q":"Can the DLCMSM be in DL_Init while the LTSSM is in Recovery?","a":"The Physical Layer can retrain while the Data Link Layer keeps its state, as long as the link is not declared down. Full loss goes to DL_Inactive."}],"mod":6},{"id":"6.11","level":"Advanced","type":"Concept","fig":null,"tags":["flow-control","initfc1","initfc2","updatefc"],"q":"Why does flow control initialization need both InitFC1 and InitFC2?","short":"InitFC1 advertises each credit type to the partner. InitFC2 repeats the advertisement to confirm that the partner has received it, so neither side moves to DL_Active before the other knows its credits. Once a port has received InitFC1 for all three types it moves to InitFC2. Once it receives InitFC2 for any type, it considers the exchange done. After that the credits are refreshed with UpdateFC.","deep":"- **What is sent:** for each supported VC, the receiver advertises Posted, Non-Posted and Completion credits, each split into header credits and data credits.\n- **InitFC1 round:** send InitFC1-P, InitFC1-NP, InitFC1-Cpl repeatedly. Record the values received from the partner.\n- **InitFC2 round:** once InitFC1 was received for all types, send InitFC2. The reception of InitFC2 (or an UpdateFC) proves that the partner completed its InitFC1 phase.\n- **Why two rounds:** with only one, one side could finish while the other is still missing its first advertisement, since DLLPs are unacknowledged. The second round is the handshake.\n- **VC0 first:** VC0 is always initialized. Other VCs are initialized later by software enabling them.\n- **UpdateFC:** in DL_Active the receiver sends cumulative credit updates when the Transaction Layer frees buffer space, at least every 30 microseconds by the spec's timing rules (VERIFY).","pitfall":"Explaining InitFC2 as a repeat with no purpose. It is the acknowledgement of the first round in a protocol with no acknowledgements.","verify":"UpdateFC timing limit, the scaled flow control field encodings, and the infinite credit rules for Completions.","follow":[{"q":"Can TLPs flow on VC0 before other VCs are initialized?","a":"Yes. Only VC0 must be initialized to enter DL_Active."},{"q":"What is infinite credit?","a":"A value of 0 in the advertisement means the receiver has infinite credit for that type. It is used for Completion credits by endpoints and Root Complexes, which can always accept completions for requests they issued."}],"mod":6},{"id":"6.12","level":"Intermediate","type":"Concept","fig":null,"tags":["pm-dllp","l1","aspm","handshake"],"q":"How do the power management DLLPs get a link into L1?","short":"For software-directed power management, when a device is put into D1, D2 or D3hot, it sends PM_Enter_L1 upstream. The upstream port stops sending new TLPs, waits until all its TLPs are acknowledged, then replies with PM_Request_Ack. After that both sides go to electrical idle and the LTSSM enters L1. For ASPM the downstream port sends PM_Active_State_Request_L1 and the upstream port either accepts with PM_Request_Ack or rejects with a message.","deep":"1. Software writes the device's power state (D-state), or the device's ASPM timer expires after idle.\n2. Downstream side blocks new TLPs, waits for its own replay buffer to drain (all ACKed), and sends PM_Enter_L1 (or PM_Active_State_Request_L1 for ASPM), repeatedly.\n3. Upstream side stops new TLPs, waits for its Acks and credits to settle, then sends PM_Request_Ack repeatedly.\n4. When the downstream side sees PM_Request_Ack, it goes to electrical idle. The upstream side follows, and the LTSSM enters L1.\n5. Exit is triggered by either side and goes through Recovery.\n\n- **Why wait for Acks:** if a TLP were unacknowledged when the link went idle, it might be lost. The handshake guarantees a clean quiet point.\n- **ASPM rejection:** the upstream port can refuse with a PM_Active_State_Nak Transaction Layer message and the link stays in L0.\n- **Where the details are:** entry conditions and L1 substates are covered in the power management module.","pitfall":"Expecting L1 entry to be immediate. It is a handshake with wait-for-Ack conditions, and traffic can hold it off.","verify":null,"follow":[{"q":"Why are PM DLLPs sent repeatedly?","a":"DLLPs are unacknowledged, so repeats make sure at least one gets through a noisy link."},{"q":"Can a TLP be pending when L1 entry starts?","a":"It must be delivered and acknowledged first. The handshake does not begin until the transmit side is quiet."}],"mod":6},{"id":"6.13","level":"Advanced","type":"Debug","fig":null,"tags":["aer","counters","bad-tlp","bad-dllp","receiver-error"],"q":"The AER correctable status on an endpoint shows large Bad TLP counts but Replay Timer Timeout is zero. What does each counter mean and what does this pattern tell you?","short":"Receiver Error means the Physical Layer lost sync or hit a decode or framing error. Bad TLP means a TLP failed LCRC or sequence checks. Bad DLLP means a DLLP failed CRC. Replay Timer Timeout and Replay Number Rollover are logged by the sender. Many Bad TLPs with no timeouts means the endpoint's receiver is seeing errors and its Naks are getting back to the sender, which is replaying successfully. The errors are mainly in the inbound direction.","deep":"| Status bit | Logged by | Meaning |\n|---|---|---|\n| Receiver Error | Receiver | PHY-level error: 8b/10b code violation, disparity, framing, or 128b/130b sync or block error |\n| Bad TLP | Receiver | LCRC failure or bad sequence number |\n| Bad DLLP | Receiver | DLLP CRC failure |\n| Replay Number Rollover | Sender | Repeated replays with no progress (2-bit counter rolls over) |\n| Replay Timer Timeout | Sender | No Ack within the timer, so it replayed |\n\n- **Direction rule:** errors are logged at the receiving end. Bad TLP at the endpoint means the root-port-to-endpoint direction is damaged. Look at the root port's counters for the other direction.\n- **Nak replays set no AER bit at the sender:** a Nak-triggered replay logs nothing there, although it counts toward REPLAY_NUM. Only Replay Timer Timeout and Replay Number Rollover appear in the sender's AER.\n- **This pattern:** Bad TLP high, Timeout zero, Rollover zero: errors are frequent but isolated, the return path (Ack and Nak DLLPs) is healthy, and each replay succeeds. You will see reduced throughput without failures.\n- **Receiver Error high with Bad TLP low:** the Physical Layer is failing, but errors are mostly in idle or DLLP periods, or masked. Suspect clocking, equalization or margin.\n- **Bad DLLP high:** the same physical cause as the others, seen on small packets. Check the return path.","pitfall":"Reading counters as if they described the local transmitter. They describe what the local receiver saw.","verify":"Bit positions of the correctable error status register, and whether your platform masks any of them in the Correctable Error Mask register.","follow":[{"q":"Bad TLP is high on the endpoint. Which side's transmitter do you suspect?","a":"The root port's transmitter or the channel in that direction (or the endpoint's receiver). Do not read the endpoint's own transmit direction from that counter."},{"q":"Both ends show similar counts?","a":"Symmetric problem: reference clock, power noise, a shared channel issue such as the connector, or the environment (temperature)."}],"mod":6},{"id":"6.14","level":"Advanced","type":"Concept","fig":null,"tags":["surprise-down","dl-up","data-link-protocol-error","link-active"],"q":"What are Surprise Down and Data Link Protocol errors, and how does the Data Link Layer report link up and down?","short":"The Data Link Layer reports DL_Up when it enters DL_Active and DL_Down when the link is lost. If the link goes down while software did not expect it, for example a drive pulled without a hot-plug request, the port logs a Surprise Down Error, which is uncorrectable. A Data Link Protocol Error is logged when a received Ack or Nak refers to a sequence number that is not outstanding, meaning the partner's state is corrupt.","deep":"- **DL_Up and DL_Down:** signals to the Transaction Layer. On DL_Down, pending transactions are aborted and completions will not arrive.\n- **Link Active bit:** Data Link Layer Link Active in Link Status is set when DL_Active, and ports can optionally signal changes with an interrupt (Data Link Layer State Changed).\n- **Surprise Down Error:** DL_Down without a preceding intentional cause (Link Disable, hot reset, or slot power-off), logged as an uncorrectable error. Hot-plug capable slots may treat it as a normal removal.\n- **Data Link Protocol Error:** an uncorrectable error that indicates a fault inside the partner's Data Link Layer or a DLLP that refers to state that does not exist. Rare in the field.\n- **Consequence:** in-flight requests never complete, and the completion timeout on the requester handles them.","pitfall":"Treating a Surprise Down on a hot-plug slot as always a failure. It is the normal signature of a surprise removal.","verify":"Which uncorrectable error bits map to Surprise Down and Data Link Protocol Error, and platform hot-plug behavior for them.","follow":[{"q":"How does an NVMe SSD pulled from a live slot appear?","a":"The port sees DL_Down, logs Surprise Down (unless the slot expects it), and the NVMe driver sees timeouts and a controller that reads all 1s."},{"q":"What ends a Surprise Down state?","a":"A link retrain that reaches DL_Active again, or removal of the device by the OS."}],"mod":6},{"id":"6.15","level":"Principal","type":"Numeric","fig":null,"tags":["ber","throughput","go-back-n","replay"],"q":"Estimate the throughput loss caused by replays at a given BER, for a Gen4 x4 link. At what BER does it become severe?","short":"A 280-byte TLP is 2240 bits. With independent bit errors the chance a TLP is bad is about 2240 x BER. Each bad TLP wastes about a round trip, roughly 30 TLP times on this link. Efficiency is about 1 / (1 + 2240 x 30 x BER). At BER 1e-12 the loss is negligible. At 1e-6 it is about 6 percent, at 4.5e-6 about 23 percent, and at 1.5e-5 about half.","deep":"1. TLP bits: 280 B x 8 = 2240 bits.\n2. Probability a TLP is corrupted: p = 2240 x BER (valid for small BER).\n3. Window: about 30 TLPs in flight (a round trip of about 1 microsecond at 7.88 GB/s).\n4. Cost of one error: the bad TLP plus the in-flight ones behind it are discarded and resent, about W = 30 TLP times.\n5. Cost per delivered TLP: 1 + p x W slots. Efficiency = 1 / (1 + 2240 x 30 x BER) = 1 / (1 + 67,200 x BER).\n\n| BER | p x W | Throughput loss |\n|---|---|---|\n| 1e-12 | 6.7e-8 | negligible |\n| 1e-9 | 6.7e-5 | 0.007 % |\n| 1e-6 | 0.067 | about 6 % |\n| 4.5e-6 | 0.30 | about 23 % |\n| 1.5e-5 | 1.0 | 50 % |\n\n- **Assumptions:** independent errors and a steady traffic stream. In practice DFE errors come in bursts, so the same BER hits fewer TLPs and the loss is lower. Idle links lose almost nothing because there is little to replay.\n- **The message:** the spec BER (1e-12) makes replay overhead invisible. A link with an unnoticed BER of 1e-6 still looks alive but runs measurably slower, and shows up as a throughput dip and Bad TLP counters, not as a failure.","pitfall":"Applying the raw BER to bytes instead of to the whole TLP. The loss depends on TLP size and window, not on the byte count alone.","verify":null,"follow":[{"q":"Why does a wider or faster link suffer more for the same BER?","a":"The window in TLPs grows with bandwidth times round trip, so each error wastes more."},{"q":"How would you use this in a test?","a":"Convert observed Bad TLP rate and throughput into an implied BER and compare against the lane margining results."}],"mod":6},{"id":"6.16","level":"Principal","type":"Scenario","fig":null,"tags":["triage","direction","replay-rollover","recovery","nvme"],"q":"An NVMe SSD sees periodic stalls under heavy sequential writes, and AER shows Replay Number Rollover on the root port. How do you isolate which direction and which component is at fault?","short":"Rollover at the root port means its transmitter sent TLPs that were never successfully acknowledged, several replays in a row. That points to the root-port-to-SSD direction or the SSD's Ack path. Read both ends' counters: Bad TLP or Receiver Error at the SSD confirms the downstream direction. Then swap slots, drives and cables, and run margining at the SSD's receiver to find the weak lane.","deep":"1. **Establish the direction:** the sender logs Rollover and Replay Timer Timeout. The receiver logs Bad TLP, Bad DLLP and Receiver Error. So root port Rollover plus SSD Bad TLP means downstream traffic is being damaged. Root port Rollover with no SSD errors suggests Acks from the SSD are not returning, so look at the upstream direction.\n2. **Correlate with workload:** heavy writes send large TLPs downstream, which raises exposure for that direction. Compare a read-heavy test.\n3. **Correlate with the LTSSM:** each rollover forces Recovery. Check Recovery entry counts and the retrain reason.\n4. **Isolate:**\n   - Swap the SSD with another unit and slot. Follow the fault (device, slot or system).\n   - Compare Gen4 and Gen3 operation. If the errors vanish at lower speed, it is margin.\n   - Check temperature and power delivery.\n5. **Measure:** lane margining at the SSD receiver (downstream direction) and at the root port receiver (upstream direction).\n6. **Impact on NVMe:** stalls of a few ms per retrain accumulate into long tail latency. If the stall exceeds the command timeout, the host resets the controller.\n\n- **Fix candidates:** equalization preset or retimer tuning, channel or connector repair, reference clock cleanup, or a firmware fix if the SSD's Ack timing is wrong.","pitfall":"Blaming the drive because the stalls appear on it. The counters say which direction, and the direction narrows which component.","verify":null,"follow":[{"q":"No AER errors at all but the stalls remain. What next?","a":"Check if AER is masked or not reported by firmware (BIOS masks), read the raw register, and compare against the NVMe controller's own link error counters or vendor logs."},{"q":"Could this be the SSD firmware rather than signal integrity?","a":"Yes, if the SSD stops sending Acks (for example a stalled Data Link Layer in its controller). Bad TLP counts stay low but timeouts and rollover rise."}],"mod":6},{"id":"6.17","level":"Principal","type":"Debug","fig":null,"tags":["automation","aer","linux","windows","monitoring","rasdaemon"],"q":"How would you automate Data Link Layer health monitoring across a validation lab or fleet?","short":"Poll the AER correctable counters on every link at a fixed interval, convert them to rates, and alert on trends and on the dangerous ones (Rollover, Timeout, Data Link Protocol Error, Surprise Down). On Linux read sysfs aer_dev_correctable and use rasdaemon. On Windows use WHEA events. Store the rates with workload, temperature and firmware version so a failing link shows up as an outlier.","deep":"- **Linux:**\n  - `lspci -vvv -s <BDF>` shows `CESta:` with RxErr, BadTLP, BadDLLP, Rollover, Timeout.\n  - `/sys/bus/pci/devices/<BDF>/aer_dev_correctable` and `aer_dev_fatal` give per-error counters, and `aer_rootport_total_err_cor` gives root port totals.\n  - `rasdaemon` (`ras-mc-ctl`) logs AER events with timestamps. `dmesg` shows `AER: Corrected error received`.\n- **Windows:** the WHEA-Logger provider in the System event log records corrected and uncorrected PCIe errors, and the Windows Performance tooling can correlate them with workload.\n- **Design:**\n  - Sample counters before and after each test, and record deltas.\n  - Convert to rates (per minute, per GB moved) so tests of different lengths compare.\n  - Store per lane speed and width, temperature and firmware version.\n  - Alert on any Rollover, Surprise Down or protocol error, and on the correctable rate exceeding a threshold or trending up.\n- **Gotchas:**\n  - Counters are per-receiver, so poll both ends of the link.\n  - Some are sticky until cleared, so clear after read (write 1 to clear) or compute deltas.\n  - The firmware may mask or take ownership of AER (firmware-first), hiding errors from the OS.","pitfall":"Alerting on the raw count. Long tests always accumulate counts, so monitor rates and changes.","verify":"WHEA-Logger event IDs and fields for PCIe corrected errors on your Windows version, and sysfs counter names on your kernel version.","follow":[{"q":"How do you set a threshold?","a":"From the baseline distribution of healthy units at the same speed and workload, and a rate that would cost a defined amount of throughput (see the BER model), not a guess."},{"q":"Why record the firmware version?","a":"Retimer, BIOS and SSD firmware all change link behavior, and correlation with a version is often the first clue in a regression."}],"mod":6},{"id":"7.01","level":"Basic","type":"Concept","fig":"tlphdr","tags":["tlp","header","fmt","type","dw0"],"q":"What does a TLP look like, and what do the Fmt and Type fields tell you?","short":"A TLP is a header of 3 or 4 DW, an optional payload of up to 1024 DW, and an optional 1-DW ECRC. DW0 is common to every TLP: Fmt (3 bits) gives the header size and whether data follows, Type (5 bits) gives the kind of TLP, then come TC, Attr, TD, EP, AT and a 10-bit Length counted in DW. In a request, DW1 holds Requester ID, Tag and the byte enables, and DW2/DW3 hold the address.","deep":"- **Fmt[2:0]:** 000 = 3DW header, no data; 001 = 4DW, no data; 010 = 3DW with data; 011 = 4DW with data; 100 = TLP prefix. Bit 0 picks 3DW or 4DW and bit 1 says whether a payload follows.\n- **Type[4:0]:** together with Fmt it selects memory, I/O, configuration, message, completion or atomic (next question).\n- **TC[2:0]:** Traffic Class 0 to 7, mapped to a Virtual Channel (Module 8). **Attr** holds the Relaxed Ordering, No Snoop and ID-Based Ordering bits; those bits exist here but the ordering rules belong to Module 8.\n- **TD and EP:** TD says a 1-DW ECRC digest follows the payload. EP says the payload is poisoned. **AT[1:0]** is the address type used with ATS.\n- **Length[9:0]:** payload size in DW. The value 0 encodes 1024 DW, which is 4 KB. On a read request it is the amount requested.\n- **3DW versus 4DW:** a 3DW request carries a 32-bit address, a 4DW request a 64-bit address. A requester must use the 4DW form only for addresses above 4 GB.\n- **Requests, DW1:** Requester ID (16 bits), Tag (8 bits), Last DW BE and First DW BE (4 bits each). Address bits [1:0] are not sent because access is DW aligned; the byte enables give the byte level.","pitfall":"Reading Length as bytes, or treating Length 0 as an empty transfer. It means 1024 DW, or 4096 bytes.","verify":"Bit positions of the extra tag bits (T9, T8) and the LN bit in DW0 byte 1 in the spec revision you use, and the rule that addresses below 4 GB must use the 3DW format.","follow":[{"q":"Why does a doorbell write to an SSD look like a 4DW TLP on a server but a 3DW TLP on some other systems?","a":"The header size follows the target address. BAR0 placed above 4 GB needs the 64-bit form, while one below 4 GB uses the 32-bit form."},{"q":"Which fields change hop by hop?","a":"In a normal memory or message TLP, none of DW0 to DW3. Sequence number, LCRC and framing are added per link outside the TLP. Exceptions: a bridge converts Type 1 config requests to Type 0, and a switch may set EP on a TLP it finds corrupted."}],"mod":7},{"id":"7.02","level":"Basic","type":"Concept","fig":null,"tags":["types","mrd","mwr","cfg","msg","cpl","atomic"],"q":"Which TLP types exist, and how are they encoded in Fmt and Type?","short":"Memory read and write, I/O read and write, configuration read and write (Type 0 and Type 1), messages, completions with or without data, and three AtomicOps (FetchAdd, Swap, CAS). Memory read locked (MRdLk) is a legacy type. Fmt and Type together form byte 0 of the header, so an analyzer shows 20h for a 64-bit read, 60h for a 64-bit write and 4Ah for a completion with data.","deep":"| TLP | Byte 0 (Fmt+Type) | Posted or not | Response |\n|---|---|---|---|\n| MRd | 00h (3DW), 20h (4DW) | Non-posted | CplD |\n| MRdLk (legacy) | 01h, 21h | Non-posted | CplDLk |\n| MWr | 40h (3DW), 60h (4DW) | Posted | None |\n| IORd, IOWr | 02h, 42h | Non-posted | CplD, Cpl |\n| CfgRd0, CfgWr0 | 04h, 44h | Non-posted | CplD, Cpl |\n| CfgRd1, CfgWr1 | 05h, 45h | Non-posted | CplD, Cpl |\n| Cpl, CplD | 0Ah, 4Ah | n/a | n/a |\n| CplLk, CplDLk | 0Bh, 4Bh | n/a | n/a |\n| Msg, MsgD | 30h to 37h, 70h to 77h | Posted | None |\n| FetchAdd, Swap, CAS | 4Ch to 4Eh (3DW), 6Ch to 6Eh (4DW) | Non-posted | CplD |\n\n- **Messages:** always a 4DW header. The low 3 bits of Type are the routing subfield, so a message's byte 0 varies with how it is routed (see the routing question).\n- **Atomics:** the completer performs a read-modify-write and returns the original value in a CplD. Support is optional and advertised in Device Capabilities 2. NVMe SSDs rarely issue them.\n- **Locked reads:** only Root Complexes issue MRdLk and native endpoints are not required to support it.\n- **Analyzer habit:** memorize 00h, 20h, 40h, 60h, 4Ah and 0Ah. They cover almost all NVMe traffic.","pitfall":"Assuming MSI-X is a Msg TLP. An MSI-X interrupt is an ordinary MWr to the address in the vector table. Msg types carry INTx emulation, power management, error signaling and vendor messages.","verify":"Type encodings for messages, atomics and locked transactions, and the AtomicOp operand sizes, in the Base Specification.","follow":[{"q":"Which of these does an NVMe SSD generate as a requester, and which does it receive?","a":"It sends MRd (SQE, PRP or SGL, write data) and MWr (read data, CQE, MSI-X), plus Cpl and CplD as a completer. It receives MWr (doorbells) and MRd, CfgRd and CfgWr from the host."},{"q":"Why are I/O and configuration writes non-posted?","a":"Software needs to know they took effect, and an error has to come back to the requester, so they return a Cpl without data."}],"mod":7},{"id":"7.03","level":"Basic","type":"Concept","fig":null,"tags":["routing","address","id","implicit","switch"],"q":"How are TLPs routed: address routing, ID routing and implicit routing?","short":"Memory and I/O requests route by address: a switch compares it with each downstream port's windows and sends the TLP down on a match, or up otherwise. Configuration requests and completions route by ID (bus, device, function). Messages carry a 3-bit routing subfield in Type that picks address, ID, or implicit routing, such as to the Root Complex, broadcast from it, or terminate at the next receiver.","deep":"| Routing | Used by | How a switch decides |\n|---|---|---|\n| Address | MRd, MWr, IORd, IOWr, atomics, Msg with 001 | Address inside a downstream port's base and limit window goes down, else up |\n| ID | CfgRd/Wr, Cpl, CplD, Msg with 010 | Bus number inside a port's secondary to subordinate range goes down, else up |\n| Implicit | Msg with 000, 011, 100, 101 | To Root Complex, broadcast from Root Complex, local (terminate at receiver), gather to Root Complex |\n\n- **Completions:** the completer copies the request's Requester ID and Tag into the completion, which routes by ID back to the requester. The tag is never used for routing.\n- **Configuration:** a Type 1 request travels through bridges, and the bridge whose secondary bus matches converts it to Type 0 for the device on that bus.\n- **Peer to peer:** because memory requests route by address, an SSD can write to another endpoint's BAR through a switch if the address fits a downstream window. ACS can force such traffic up to the Root Complex instead.","pitfall":"Believing the tag helps route a completion. Routing uses the Requester ID only, and the tag matters only at the requester.","verify":"Message routing subfield encodings and the Type 1 base and limit rules in the Base Specification.","follow":[{"q":"Which routing does an SSD's SQE fetch use in each direction?","a":"The MRd routes by address (a host memory address) upstream, and the CplD routes by ID, using the SSD's own BDF, downstream."},{"q":"Which routing does a Power Management PME message use?","a":"Implicit routing to the Root Complex, so no address or ID is involved."}],"mod":7},{"id":"7.04","level":"Intermediate","type":"Concept","fig":null,"tags":["length","byte-enable","first-be","last-be","zero-length"],"q":"How do Length and the First and Last DW byte enables express a byte-granular access?","short":"Length counts whole DW. Byte-level precision comes from two 4-bit masks: First DW BE for the first DW and Last DW BE for the last, with every DW in between fully enabled. A 1-DW access uses only First DW BE and sets Last DW BE to 0000. A read of Length 1 with First BE 0000 is a zero-length read, used to flush earlier posted writes.","deep":"- **Mask meaning:** bit i of a BE field enables byte i of that DW, so 0001b is the lowest-addressed byte and 1100b is bytes 2 and 3.\n- **Byte count:** bytes moved = 4 x Length, minus the unused low bytes in the first DW, minus the unused high bytes in the last DW.\n- **Example, 6-byte write at address 0x...02:** DW0 holds bytes 2 and 3, DW1 holds four more, so Length = 2, First BE = 1100b, Last BE = 1111b, and the address field carries 0x...00.\n- **Example, unaligned 4-byte access at 0x...02:** it straddles two DW, so it becomes Length 2, First BE 1100b, Last BE 0011b.\n- **Length 0:** means 1024 DW. It is legal only when MPS (writes) or MRRS (reads) allow 4096 bytes.\n- **Zero-length read:** the completer must still return one DW of data, whose value is undefined. Software uses it as a cheap flush, because a read cannot pass earlier posted writes (Module 8).\n- **SSD flavor:** doorbells are 4-byte writes with BE 1111b. An 8-byte register such as CAP appears as one 2-DW read or as two 1-DW reads, depending on how the host accessed it.","pitfall":"Treating the BE as offsets into the payload. They are relative to the DW-aligned address, not to the start of the data.","verify":"Legal BE patterns, including non-contiguous enables for 1-DW and 2-DW requests and the zero-length write rules.","follow":[{"q":"Where do byte enables appear in a completion?","a":"They do not. Byte Count and Lower Address in the completion carry the same information (see the completion header question)."},{"q":"Can a memory write have First BE 0000?","a":"Only as a 1-DW zero-length write, which is legal but useless for data. Both BE fields are normally non-zero when Length is greater than 1."}],"mod":7},{"id":"7.05","level":"Intermediate","type":"Concept","fig":null,"tags":["requester-id","tag","extended-tag","10-bit-tag","outstanding"],"q":"What are the Requester ID and Tag, and why do tags limit the number of outstanding reads?","short":"The Requester ID (bus, device, function) says who sent a request, and the Tag identifies each outstanding non-posted request from that requester. The completer copies both into the completion so the requester can match it. A requester can have only as many reads in flight as it has free tags: 32 with the original 5-bit tag, 256 with extended tags, up to 1024 with 10-bit tags. So bandwidth is capped at tags x read size / round-trip time.","deep":"- **Requester ID format:** Bus [15:8], Device [7:3], Function [2:0]. With ARI the device and function fields merge into an 8-bit function number.\n- **Tag scope:** unique among the non-posted requests outstanding from one Requester ID. A tag is allocated when a request is issued and freed when the last completion for it arrives. Split completions all carry the same tag.\n- **Widths:** the original tag field uses 5 bits. Extended Tag Field Enable (Device Control) makes it 8 bits. 10-bit tags need the Requester Enable in Device Control 2 and a completer that supports them.\n- **Bandwidth math:** the numeric worked out in Module 2 (about 31 reads of 256 B for Gen4 x4 at 1 microsecond). Here is the other direction: 32 tags x 256 B at a 2 microsecond round trip (through a switch and an IOMMU) caps at 4.1 GB/s, already below Gen4 x4.\n- **Buffer promise:** an endpoint that issues reads advertises infinite completion credits (Module 8), so it must own enough buffer for every outstanding tag times its read size.\n- **Ordering:** completions for different tags can come back in any order, so the requester places data by tag and address, never by arrival order.","pitfall":"Confusing tags with flow control credits. Tags are an end-to-end limit set by the requester. Credits are a per-link limit set by each receiver (Module 8).","verify":"Bit positions of Extended Tag Field Enable and 10-bit Tag Requester Enable, and which capability bits show completer support for 10-bit tags.","follow":[{"q":"Can two outstanding requests from one requester share a tag?","a":"No. Completions would be ambiguous, and a late completion could be applied to the wrong request."},{"q":"Do posted writes need a tag?","a":"The field exists but nothing matches on it, since no completion returns."}],"mod":7},{"id":"7.06","level":"Intermediate","type":"Concept","fig":null,"tags":["mps","mrrs","rcb","4kb-rule","device-control"],"q":"What are MPS, MRRS and RCB, what is the 4 KB rule, and where are they set?","short":"Max_Payload_Size (MPS) caps the data in any one TLP, from 128 B to 4096 B, and is set in Device Control. Max_Read_Request_Size (MRRS) caps how much one read request may ask for. The Read Completion Boundary (RCB, 64 or 128 B) is the address boundary where a completer may split a read's data. No request may cross a 4 KB address boundary.","deep":"| Parameter | Limits | Where | Values |\n|---|---|---|---|\n| MPS | Payload of one MWr, MsgD or CplD | Device Control, bits 7:5 | 128 B to 4096 B |\n| MRRS | Size of one read request | Device Control, bits 14:12 | 128 B to 4096 B |\n| RCB | Where a read's completions may split | Link Control, bit 3 | 64 B or 128 B |\n| 4 KB rule | Address plus length of any request | Fixed by the spec | 4096 B |\n\n- **MPS is per device:** each function is set to no more than its Device Capabilities limit, and the operating system normally programs the smallest value the path supports. A TLP whose payload exceeds the receiver's MPS is a Malformed TLP.\n- **MRRS is independent of MPS:** a larger MRRS means fewer request TLPs. The data returns as several completions, each at most MPS.\n- **RCB:** Root Complexes use 64 or 128 B. Other elements use 128 B. A completer may only split at RCB-aligned addresses.\n- **4 KB rule:** a 512 B DMA that starts at offset 0xF00 in a page becomes two TLPs of 256 B, because the first must stop at the 4 KB boundary. NVMe pages are at least 4 KB, so PRP boundaries never conflict.\n- **Where to look:** `lspci -vv` shows `MaxPayload` and `MaxReadReq` in DevCap and DevCtl for each device.","pitfall":"Expecting a larger MRRS to produce larger completions. Completion payload is bounded by MPS and by the completer's choice of split.","verify":"RCB rules for endpoints versus Root Ports, and the Device Control and Link Control bit positions.","follow":[{"q":"Is MPS set per link or per device?","a":"Per device, but the values along a path must be consistent, because a receiver rejects a TLP larger than its own MPS."},{"q":"Does RCB apply to writes?","a":"No. It applies only to how completions for a read are split."}],"mod":7},{"id":"7.07","level":"Intermediate","type":"Concept","fig":null,"tags":["completion","status","byte-count","lower-address","ur","ca","crs"],"q":"What is in a completion header, and what do the status codes mean?","short":"A completion always has a 3DW header. DW1 holds the Completer ID, a 3-bit Completion Status, the BCM bit and a 12-bit Byte Count. DW2 holds the Requester ID, the Tag and a 7-bit Lower Address. Status is SC (successful), UR (unsupported request), CRS (configuration retry) or CA (completer abort). Byte Count is the bytes still to come including this TLP, and Lower Address is the low 7 bits of the address of its first byte.","deep":"| Bits | Field | Meaning |\n|---|---|---|\n| DW1 [31:16] | Completer ID | BDF of the device that answered |\n| DW1 [15:13] | Completion Status | 000 SC, 001 UR, 010 CRS, 100 CA |\n| DW1 [12] | BCM | Byte Count Modified, used only by PCI-X bridges, 0 in native PCIe |\n| DW1 [11:0] | Byte Count | Remaining bytes for the whole request, 4096 encoded as 0 |\n| DW2 [31:16] | Requester ID | Routes the completion back |\n| DW2 [15:8] | Tag | Matches the outstanding request |\n| DW2 [6:0] | Lower Address | Low 7 bits of first byte address |\n\n- **Cpl versus CplD:** CplD carries data and Length is the DW in this completion. A Cpl without data answers writes to I/O or configuration space, and errors.\n- **CRS:** valid only for configuration requests. It tells the requester the device is not ready yet, for example just after reset. A Root Port retries, or with CRS Software Visibility returns a special Vendor ID value 0001h to software.\n- **Unexpected completion:** a completion whose Requester ID and Tag match nothing outstanding is logged as an Unexpected Completion error and dropped.","pitfall":"Reading Byte Count as this TLP's payload size. It is what remains of the whole request, so it equals the payload only in the last completion.","verify":"Completion Status encodings, and the values of Byte Count and Lower Address in error completions.","follow":[{"q":"Why does the completion repeat the Requester ID and Tag?","a":"The completer holds no other state. The ID routes the completion and the tag selects the outstanding request."},{"q":"Does a UR completion carry data?","a":"No. It is a Cpl without data with status UR, and the requester treats the read as failed."}],"mod":7},{"id":"7.08","level":"Intermediate","type":"Concept","fig":null,"tags":["poisoned","ep","ecrc","td","data-integrity"],"q":"What is a poisoned TLP, and how does it differ from an ECRC error?","short":"The EP bit is set by a device that knows the payload is already bad, for example after an uncorrectable ECC error, and forwards the TLP anyway. The TLP has a good LCRC and a good ECRC, so the link sees nothing wrong. An ECRC error means the TLP was changed in flight and is caught end to end when the TD bit says a digest is present. Poison says the data was bad at the source. ECRC says something corrupted it on the way.","deep":"- **Who sets EP:** a requester or completer with uncorrectable data (for example a Root Complex returning host memory that failed ECC), or a switch that detects an internal data fault while forwarding.\n- **Receiver action:** it logs Poisoned TLP Received and must not treat the data as good. AER register details are in Module 12.\n- **No replay:** LCRC is fine, so the Data Link Layer does nothing. Poison is a data-integrity signal, not a link error.\n- **ECRC:** TD=1 adds a 32-bit digest over the header (variant bits masked, EP among them) and payload, generated at the source and checked by the final receiver. Enabling it is an AER capability setting on both ends.\n- **Delivery differs:** a poisoned TLP is delivered with a flag. An ECRC failure means the TLP is not delivered, and a requester of a non-posted request usually learns through a completion timeout.\n- **SSD flavor:** if the SSD fetches write data and a CplD comes back poisoned, the controller must not program that data into NAND as good. The command should complete with an error such as Data Transfer Error. NVMe end-to-end protection information is a separate storage-level check.","pitfall":"Treating the EP bit as a link error indicator. It reports a data problem that was known at the source.","verify":"Default severity and masking of Poisoned TLP Received and ECRC Error, the handling rules for poisoned writes to MMIO, and what a receiver does with an ECRC-failed request.","follow":[{"q":"Why can the LCRC not catch what ECRC catches?","a":"The LCRC is regenerated at each hop, so a fault inside a switch gets a fresh good LCRC (Module 6)."},{"q":"Can a poisoned TLP be sent on purpose in a test?","a":"Yes, from a protocol exerciser or a device with an injection feature. It is the only clean way to test how a controller handles bad data from the host."}],"mod":7},{"id":"7.09","level":"Intermediate","type":"Trap","fig":null,"tags":["ur","ca","unsupported-request","completer-abort","all-ones"],"q":"A host read to an SSD returns all ones. Is that a UR or a CA, and how do you tell?","short":"All ones alone tells you neither. UR means the completer does not support or decode the request: the address hits no BAR, the type or message is unsupported, or the function does not exist. CA means the completer decoded and supports the request but cannot complete it, because of an internal fault or a request it cannot service. A dead link also produces all ones. Check link state first, then the completion status on an analyzer and the error bits.","deep":"- **Non-posted:** the completer returns a Cpl with status UR (001) or CA (100), and a Root Complex turns it into all ones for the CPU. **Posted:** no completion exists, so the error is signaled by message or logged only.\n- **Typical UR causes with an SSD:** a read outside the BAR, a Type 1 or Type 0 configuration request to a function that is absent (this is how enumeration finds \"no device\"), an unsupported message, or a request with an unsupported type such as I/O.\n- **Typical CA causes:** the function is mid-reset or the controller logic faulted after decoding the address, or a design that aborts sizes and alignments it cannot handle instead of returning UR. Which one a device picks is a design decision.\n- **Where each is logged:** the completer logs Unsupported Request or Completer Abort in AER and sets Signaled Target Abort for CA. The requester's Status register shows Received Master Abort for UR and Received Target Abort for CA.\n- **Triage order:** first confirm the link is up and DL Active is set. Then look for the completion status on the analyzer, then AER and Status bits at both ends.\n- **IOMMU faults:** when an SSD's DMA hits an unmapped host address, the platform usually answers with UR or CA. Which one is platform specific.","pitfall":"Calling every all-ones result a link failure, or every one a UR. Prove the link state and the completion status first.","verify":"Bit positions of Signaled Target Abort, Received Target Abort and Received Master Abort in the Status register, and the default severity of UR and CA in AER.","follow":[{"q":"What does software see on a UR to a configuration read?","a":"All ones, so Vendor ID reads as FFFFh, which is how enumeration detects an empty slot."},{"q":"Is a UR always a bug?","a":"No. Enumeration probes cause them deliberately, which is why platforms often mask or treat them as advisory."}],"mod":7},{"id":"7.10","level":"Intermediate","type":"Concept","fig":null,"tags":["prefix","pasid","vdm","nvme-mi","mctp","message"],"q":"What are TLP prefixes and vendor-defined messages, and where might you meet them on an SSD?","short":"A TLP prefix is an extra DW placed before the header, marked by Fmt 100. Local prefixes are consumed by the next hop, and end-to-end prefixes travel to the destination, for example the PASID prefix used with address translation. A vendor-defined message (VDM) is a Msg TLP whose content is defined by a vendor. NVMe-MI can run over MCTP inside PCIe VDMs, giving a management controller an out-of-band path to the SSD.","deep":"- **Prefix format:** one DW, Fmt=100, with Type bit 4 selecting local (0) or end-to-end (1) and the rest naming the prefix. A TLP can carry a small, capability-limited number of end-to-end prefixes.\n- **Effect:** a prefix adds 4 bytes and extends the TLP with extra fields. It does not change routing or credits handling beyond the extra bytes. A switch that does not support end-to-end prefixes blocks them and reports an error.\n- **Examples:** PASID (end-to-end, tells the IOMMU which process address space), Extended TPH, and vendor-defined local or end-to-end prefixes. The details belong to Module 13.\n- **VDM basics:** a Msg or MsgD with message code 7Eh (Type 0) or 7Fh (Type 1) and a Vendor ID in the header. It can be routed to the Root Complex, by ID, or broadcast. A receiver that does not understand Type 0 returns UR, while Type 1 is silently discarded.\n- **NVMe-MI over VDM:** the baseboard management controller sends NVMe-MI commands (health, vendor log, firmware update) as MCTP over PCIe VDMs. On an analyzer they appear as MsgD TLPs. The alternative transport is MCTP over SMBus or I2C.\n- **Credits:** messages are posted TLPs, so they use posted credits like memory writes.","pitfall":"Assuming a prefix changes routing. Routing still follows the header that comes after the prefixes.","verify":"Message codes for Vendor_Defined Type 0 and Type 1, the Max End-End TLP Prefixes limit, and the MCTP over PCIe binding used by NVMe-MI.","follow":[{"q":"Why is a Type 1 vendor message safer to broadcast?","a":"Devices that do not recognize it drop it silently, while Type 0 makes them return UR and log an error."},{"q":"Does NVMe-MI over VDM need the host NVMe driver?","a":"No. It is a separate path, but it needs the link up and the controller's management logic alive."}],"mod":7},{"id":"7.11","level":"Advanced","type":"Numeric","fig":null,"tags":["completion-splitting","rcb","byte-count","lower-address","reassembly"],"q":"How is a read split into completions, and how do Byte Count and Lower Address let the requester reassemble it?","short":"The completer may split a read only at RCB-aligned addresses, with each completion at most MPS, and it must send them in address order. Every completion repeats the Requester ID and Tag, carries the bytes remaining in Byte Count, and gives the low 7 address bits in Lower Address. The requester knows a request is complete when a completion's Byte Count equals its own payload. A 200-byte read at 0x10000020 with RCB 64 B can return as four completions.","deep":"Assumptions: MRd at 0x1000_0020, Length 50 DW (200 B), full byte enables, MPS 256, completer splits at every 64 B boundary.\n\n| # | Address range | Payload | Byte Count | Lower Address |\n|---|---|---|---|---|\n| 1 | 0x10000020 to 0x1000003F | 32 B | 200 | 20h |\n| 2 | 0x10000040 to 0x1000007F | 64 B | 168 | 40h |\n| 3 | 0x10000080 to 0x100000BF | 64 B | 104 | 00h |\n| 4 | 0x100000C0 to 0x100000E7 | 40 B | 40 | 40h |\n\n1. Byte Count starts at the whole request (200) and drops by each payload: 200, 168, 104, 40.\n2. The last completion has Byte Count equal to its payload, so the requester frees the tag.\n3. Lower Address holds only 7 bits, so it wraps at 128 B. That is why completion 3 shows 00h.\n4. Offset into the buffer for any piece = request size minus its Byte Count, for example 200 - 168 = 32 for piece 2.\n\n- **RCB 128 B:** the same read returns as 96 B (Lower Address 20h, Byte Count 200) and 104 B (Lower Address 00h, Byte Count 104), two completions.\n- **No split:** a completer is also allowed to return all 200 B in one CplD, since it is below MPS.\n- **Cost of splitting:** assuming about 22 B of overhead per completion, four completions give 200 / 288 = 69% efficiency, one gives 200 / 222 = 90%.\n- **Lost piece:** if completion 3 is lost, completion 4 arrives with Byte Count 40 when 104 remains expected, so the requester can detect a gap instead of only timing out.","pitfall":"Assuming the SSD decides how many completions come back. The completer, usually the host Root Complex, chooses the split within the rules.","verify":"The Lower Address[1:0] rule for the first completion when First DW BE is partial, and the Byte Count calculation for partial byte enables.","follow":[{"q":"Why is Lower Address only 7 bits?","a":"RCB is at most 128 B, so the position within a 128 B block is enough to see alignment. Byte Count carries the rest."},{"q":"What splits are legal for a 256 B aligned read with RCB 64 B?","a":"Any split at 64 B multiples with each piece at most MPS: one 256, two 128, four 64, or uneven ones like 64 plus 192."}],"mod":7},{"id":"7.12","level":"Advanced","type":"Debug","fig":null,"tags":["hex-decode","header","mwr","4dw","aer-header-log"],"q":"An analyzer or AER header log shows the bytes 60 00 00 40 3B 00 05 FF 00 00 00 02 4A 3C 10 00. Decode the TLP, and say whether it is legal at MPS 128.","short":"Byte 0 is 60h: Fmt 011 and Type 00000, a 4DW memory write with data. Length is 040h, 64 DW or 256 B. The Requester ID is 3B00h (bus 3Bh, device 0, function 0), Tag 05h, both byte enables Fh. The address is 0x2_4A3C_1000. So it is a 256 B posted write from the SSD to host memory. It is fine at MPS 256 or larger, but Malformed at a receiver whose MPS is 128.","deep":"| DW | Byte(s) | Decode |\n|---|---|---|\n| DW0 | 60h | Fmt = 011b (4DW header, with data), Type = 00000b (memory request), so MWr |\n| DW0 | 00h | TC = 000, IDO = 0 (T9, T8, LN and TH are all 0) |\n| DW0 | 00h | TD = 0 (no ECRC), EP = 0, Attr = 00 (RO 0, NS 0), AT = 00, Length[9:8] = 00 |\n| DW0 | 40h | Length[7:0] = 40h, so 64 DW = 256 B |\n| DW1 | 3Bh 00h | Requester ID: bus 3Bh, device 00h, function 0 |\n| DW1 | 05h | Tag = 05h, not matched for a posted write |\n| DW1 | FFh | Last BE = Fh, First BE = Fh, all bytes valid |\n| DW2 | 00 00 00 02 | Address [63:32] = 0x00000002 |\n| DW3 | 4A 3C 10 00 | Address [31:2] = 0x4A3C1000, low bits zero |\n\n- **Address:** 0x2_4A3C_1000 is about 9.2 GiB, above 4 GB, so the 4DW form is correct. With upper bits zero it would have to be 3DW.\n- **4 KB rule:** 0x...1000 plus 256 B ends at 0x...1100, inside one page, so it is legal.\n- **MPS check:** 256 B payload exceeds 128 B, so a receiver at MPS 128 flags Malformed TLP. At 256 B or more it is fine.\n- **On the wire:** 16 B header + 256 B payload = 272 B, plus 4 B STP token, 2 B sequence number and 4 B LCRC = 282 B.\n- **Variants:** byte 0 = 20h would be a read with no payload. Byte 2 = 80h would set TD, 40h would set EP (poison), 20h would set RO. Byte 3 = 00h would mean 1024 DW.\n- **Tooling:** `lspci -vv` prints `HeaderLog:` as four DW in this same order (DW0 first) for the first uncorrectable error.","pitfall":"Putting Length[9:8] in the wrong place. The two high Length bits sit in the low bits of byte 2, and Length[7:0] fills byte 3.","verify":"T9, T8 and LN bit positions in byte 1 and the byte order used by the AER Header Log register on your platform.","follow":[{"q":"How do you find which device is bus 3B?","a":"`lspci -s 3b:00.0` or `lspci -tv`. The Requester ID is the device's BDF at the time."},{"q":"Change the last byte of DW0 to 00h. What is the TLP?","a":"Length 0 means 1024 DW, a 4096 B write. It is legal only if MPS is 4096, and at address 0x...1000 it exactly fills one page."}],"mod":7},{"id":"7.13","level":"Advanced","type":"Cross-layer","fig":null,"tags":["nvme","doorbell","sqe","cqe","prp","sgl","msix"],"q":"Which TLPs does one NVMe command generate, from doorbell to interrupt?","short":"The host rings the SQ tail doorbell with a 4-byte MWr to BAR0. The SSD fetches the 64 B submission entry with an MRd, and if needed the PRP list or SGL descriptors with more MRds. Read data goes to the host as MWr TLPs, while write data is fetched with MRd and returns in CplD. The SSD then posts a 16 B CQE with an MWr and raises MSI-X with a 4 B MWr, and the host writes the CQ head doorbell.","deep":"| Step | Direction | TLP | Size |\n|---|---|---|---|\n| SQ tail doorbell | host to SSD | MWr | 4 B |\n| Fetch SQE | SSD to host, CplD back | MRd, CplD | 64 B (often several entries at once) |\n| Fetch PRP list or SGL | SSD to host, CplD back | MRd, CplD | 8 B per PRP, 16 B per SGL descriptor |\n| Read data out | SSD to host | MWr | Up to MPS each |\n| Write data in | SSD to host, CplD back | MRd (up to MRRS), CplD (split at RCB) | Per request |\n| Post CQE | SSD to host | MWr | 16 B |\n| Interrupt | SSD to host | MWr to MSI-X address | 4 B |\n| CQ head doorbell | host to SSD | MWr | 4 B |\n\n- **Only three steps are non-posted:** the SQE fetch, the PRP or SGL fetch, and the write-data fetch. They need tags and cost a round trip. Everything else is posted.\n- **Doorbell placement:** SQ y tail is at 1000h + (2y) x (4 << CAP.DSTRD) and CQ y head at 1000h + (2y+1) x (4 << CAP.DSTRD).\n- **PRP list size:** a 128 KiB transfer with 4 KiB pages needs PRP1 plus a list of 31 PRPs, which is a single 248 B MRd.\n- **Order matters:** data MWr, then CQE MWr, then MSI-X MWr must stay in that order (Module 8). Complete NVMe register and queue behavior is in Module 16.\n- **CMB:** a controller memory buffer holds queues or data in the SSD, so the host writes them with MWr and the SSD skips some MRd round trips.","pitfall":"Counting only data TLPs. At small I/O sizes the SQE fetch, CQE, MSI-X and doorbells are a large share of link and controller work.","verify":"Doorbell offsets and stride, and CMB behavior, in the NVMe Base Specification.","follow":[{"q":"Why can a controller fetch several SQEs with one MRd?","a":"After a doorbell advances the tail by n entries they are contiguous, so one 64 x n B read saves round trips and header overhead."},{"q":"Which of these go through the host IOMMU?","a":"Every request the SSD issues to host memory, since it uses IOVAs. The doorbell is host-to-device MMIO and is not translated."}],"mod":7},{"id":"7.14","level":"Advanced","type":"Numeric","fig":null,"tags":["overhead","efficiency","iops","4k-read","mps"],"q":"Why is a 4 KiB NVMe read many TLPs, and what does the overhead cost on Gen4 x4?","short":"With MPS 256, the SSD sends the 4 KiB as 16 MWr TLPs, plus a CQE write, an MSI-X write and an SQE fetch request: 19 TLPs and about 4.6 KB on the wire upstream. Efficiency is about 89%, so a Gen4 x4 link (7.88 GB/s per direction) has a ceiling near 1.7 M IOPS for 4 KiB reads. At MPS 128 it drops to about 1.57 M, at MPS 512 it rises to about 1.79 M.","deep":"Assumptions: Gen4 x4 = 7.877 GB/s per direction. Per-TLP overhead = 4 B STP token + 2 B sequence + header + 4 B LCRC, so 26 B with a 4DW header and 22 B with a 3DW header. Buffer is page aligned with a 64-bit address. ACK DLLPs, UpdateFC and SKP ordered sets are ignored.\n\n| Upstream traffic | TLPs | Wire bytes |\n|---|---|---|\n| Data, 16 x (256 + 26) | 16 | 4512 |\n| CQE write (16 B, 4DW) | 1 | 42 |\n| MSI-X write (4 B, 3DW) | 1 | 26 |\n| SQE fetch request (MRd, 4DW) | 1 | 26 |\n| Total | 19 | 4606 |\n\n1. Efficiency = 4096 / 4606 = 88.9%.\n2. Ceiling = 7.877 GB/s / 4606 B = about 1.71 M IOPS.\n3. MPS 128: 32 x 154 + 94 = 5022 B, giving 1.57 M. MPS 512: 8 x 538 + 94 = 4398 B, giving 1.79 M.\n4. The opposite direction carries only the two doorbells (26 B each) and the 64 B SQE completion (86 B), about 138 B per I/O. It is nearly idle.\n\n- **Direction:** random reads load the device-to-host direction. Random writes load host-to-device, where data returns as completions.\n- **Misaligned buffers:** a PRP1 offset such as 0xF0 splits the 4 KiB across a page boundary and can add a TLP.\n- **Real drives sit below the ceiling** because of ACK and UpdateFC DLLPs, SKP ordered sets and controller limits.","pitfall":"Modeling only the payload. Doorbells, queue entries and the interrupt are small TLPs, but each costs a whole header and framing.","verify":"Framing overhead per generation (128b/130b STP token size) and FLIT-mode overhead for Gen6.","follow":[{"q":"Would MPS 512 fix a link-bound drive?","a":"It raises the ceiling by about 5 percent, but the smallest MPS on the path decides, and many platforms run 256."},{"q":"Which direction limits a 4 KiB random write workload?","a":"Host to device, where the SSD's write data arrives as CplD TLPs split at the completer's RCB."}],"mod":7},{"id":"7.15","level":"Advanced","type":"Scenario","fig":null,"tags":["mps","mrrs","malformed-tlp","mismatch","triage"],"q":"An SSD passes small-I/O tests but hangs or resets under large transfers after a platform change. How do you check for an MPS or MRRS mismatch?","short":"An MPS mismatch fails only bulk transfers: the sender uses a larger payload than a receiver on the path accepts, so that receiver logs Malformed TLP while doorbells, CQEs and small I/O keep working. An MRRS mistake gives no errors, only low throughput. Compare `lspci -vv` DevCap and DevCtl MaxPayload and MaxReadReq for every device on the path, and check AER for a Malformed TLP with a header log showing a large write.","deep":"1. **Read every device:** `lspci -vvv -s <BDF>` for the Root Port, each switch port and the SSD. Example: `DevCap: MaxPayload 512 bytes`, `DevCtl: MaxPayload 256 bytes, MaxReadReq 512 bytes`.\n2. **Compare along the path:** every receiver's MPS must be at least the payload its peer sends. A Root Port at 128 with an SSD at 256 breaks the SSD's data writes. The reverse direction (host completions to the SSD) may work. This asymmetry is a strong clue.\n3. **Confirm with evidence:** AER shows `MalfTLP+` in UESta at the receiver, and the header log decodes as in the previous decode question (Fmt/Type 60h, Length 040h). DPC, if enabled, contains the port and the host sees command timeouts and a controller reset.\n4. **Why it appears after a change:** a hot-plugged drive not re-tuned by the OS, firmware or BIOS that set a value the OS did not lower, or a new switch or riser with a lower MPS limit.\n5. **MRRS symptom:** MRRS 128 B means four times as many read requests as 512 B. Combined with a small tag pool, write throughput flattens while reads look normal. An analyzer shows many 128 B MRds.\n6. **Prove it:** with the device quiescent, lower MPS in Device Control on all devices (for example `setpci -s <BDF> CAP_EXP+8.w=0000:00e0` clears the MPS field to 128 B) and repeat. Changing MPS under traffic is unsafe.\n\n- **Not signal integrity:** the failure is deterministic with transfer size, has no correctable-error growth, and disappears at MPS 128.\n- **Fix:** set the path minimum in firmware or the OS, and add a boot-time check that reads and compares MPS along the path.","pitfall":"Chasing signal integrity because the errors appear only under load. Failure that depends on transfer size points to configuration.","verify":"The default AER severity of Malformed TLP, and how your OS assigns MPS at enumeration and hot-plug.","follow":[{"q":"Why do small I/Os still work?","a":"CQEs, doorbells and SQE-sized TLPs are far below any MPS. Only bulk data TLPs exceed the smaller MPS."},{"q":"Does a larger MPS at the receiver than at the sender break anything?","a":"No. It is just less efficient, since the sender never exceeds its own setting."}],"mod":7},{"id":"7.16","level":"Principal","type":"Debug","fig":null,"tags":["analyzer","completion-splitting","rcb","checker","automation"],"q":"The same SSD write-data fetch shows 64 B completions on one platform and 256 B on another. Is either a bug, and how would you build a checker for split completions?","short":"Neither is a bug by size alone. The completer picks the split, and any pattern is legal if each piece is at most MPS, splits fall on RCB-aligned addresses, pieces return in address order, and Byte Count and Lower Address are consistent. Build a checker per Requester ID and Tag that verifies those invariants, not a fixed size. Track the completion size distribution per platform separately as a performance baseline.","deep":"1. **Group** each MRd with its completions by Requester ID and Tag until the last piece arrives.\n2. **Invariants to check:**\n   - Sum of payloads equals the requested bytes, adjusted for byte enables.\n   - First Byte Count equals the request total, and each next one equals the previous Byte Count minus the previous payload.\n   - Lower Address of each piece equals the low 7 bits of (start address plus bytes so far).\n   - Every payload is at most MPS, and every internal split falls on a multiple of RCB.\n   - Pieces of one request arrive in ascending address order, and Completer ID stays constant.\n   - Status is SC on every piece. A UR or CA has no data and ends the request.\n   - No tag is reused before its request finishes.\n3. **Measure:** latency from the MRd to the first and to the last completion, and a completion size histogram. Compare platforms.\n4. **What the sizes cost:** overhead per completion is about 22 B, so pieces of 64, 128 and 256 B give about 74%, 85% and 92% efficiency. A 64 B completer means more TLPs and more DLLP work in the SSD's receive path.\n5. **Defects the checker catches:** payload above MPS (Malformed at the requester), split off an RCB boundary, out-of-order pieces, wrong Byte Count (the requester may hang or corrupt data), and duplicated tags.\n6. **SSD requester side:** its receive path must accept any legal split, including small pieces and interleaving across tags, and its reassembly must not depend on arrival order across requests.\n7. **Automation:** export traces from the analyzer scripting interface (CSV or JSON), run the checker as a script over every capture, and fail the run on any violation.","pitfall":"Writing a checker with fixed expected completion sizes. It flags legal platforms and misses real defects.","verify":"The exact completion splitting rules for reads that cross RCB boundaries, and how unaligned or partial-BE reads are treated.","follow":[{"q":"Can a completer send the first piece before it has all the data?","a":"Yes, in address order as data becomes available. So the first completion can arrive well before the last."},{"q":"Would you fail a device that only copes with 128 B completions?","a":"Yes. A requester has to accept any legal split."}],"mod":7},{"id":"7.17","level":"Principal","type":"Scenario","fig":null,"tags":["tags","mrrs","latency","plateau","write-iops","quantify"],"q":"4 KiB random write IOPS plateau at about 0.9 M on a Gen4 x4 SSD while reads reach 1.6 M and the NAND is idle. How do you find whether the PCIe request path is the limit?","short":"Write data is fetched with MRd, so it is bound by tags x MRRS / round-trip time, not just by link rate. Measure the three inputs: MRRS from Device Control, the peak outstanding tags on the analyzer, and request-to-completion latency. If MRRS 128 B, 32 tags and 1.1 microseconds give 3.7 GB/s, that is 0.91 M IOPS and explains the plateau. Change one knob at a time and see whether the plateau moves in proportion.","deep":"1. **Model:** ceiling = min(link efficiency ceiling, tags x MRRS / latency, credit window / loop time from Module 8, controller internals).\n2. **Measure:**\n   - `lspci -vv`: `MaxReadReq` for the SSD, and whether Extended Tag is enabled (`ExtTag+`).\n   - Analyzer: maximum number of distinct outstanding tags, and time from each MRd to its first and last completion, under load, not idle.\n   - The completion size histogram (see the previous question).\n3. **Compute:** 32 tags x 128 B = 4096 B in flight. At 1.1 microseconds that is 4096 / 1.1e-6 = 3.72 GB/s, which is 0.91 M writes of 4096 B per second. This matches the plateau.\n4. **Controlled experiments:**\n   - Raise MRRS to 512 B. If the plateau scales, the request size was the limit.\n   - Enable extended tags or 10-bit tags where supported. If tags in use grow, the tag pool was the limit.\n   - Remove a hop (switch, retimer) to shorten latency.\n5. **Decision criteria:** the plateau follows the model and moves proportionally: fix MRRS and tags. It does not move: look at credits (Module 8), IOMMU translation misses, root complex read latency or SSD internals.\n6. **Latency under load:** queueing inside the host makes latency higher than idle, so the tags needed rise. Size the pool for the loaded value.\n\n- **Cautions:** a bigger MRRS raises the completion buffer the SSD must own, since it advertised infinite completion credits. Confirm its buffer covers tags x MRRS.","pitfall":"Setting MRRS to 4096 to be safe. It can overrun the device's completion buffer, and some platforms handle huge reads poorly.","verify":"The tag capability and enable bits and the maximum outstanding requests supported by the completer.","follow":[{"q":"Why is the read path unaffected?","a":"Read data is sent as posted MWr, which needs no tags and no round trip. Only credits limit it."},{"q":"How would you confirm the tag limit is in the controller firmware and not the OS setting?","a":"If extended tags are enabled in DevCtl and the analyzer still shows at most 32 different tags, the device is not using them."}],"mod":7},{"id":"7.18","level":"Principal","type":"Cross-layer","fig":null,"tags":["test-plan","negative-testing","malformed","poison","exerciser","nvme"],"q":"How would you design a TLP-level negative and corner-case test plan for an NVMe SSD's PCIe interface?","short":"Use a protocol exerciser as the link partner, because a real host only sends legal TLPs. Cover parametric legal traffic (MPS, MRRS, RCB, sizes, alignments, splits) and illegal traffic (malformed, poisoned, unsupported, ECRC, unexpected completions, timeouts). For each case define the expected PCIe behavior from the spec, then observe the analyzer trace, AER, NVMe status and log pages, and a data compare. Pass means no hang, no corruption, the right error class, and the controller recovers.","deep":"1. **Positive sweep:** MPS x MRRS x RCB x I/O size x buffer alignment. Check TLP sizes never exceed MPS or MRRS, the 4 KB rule holds, and data compares clean.\n2. **Malformed:** payload above MPS, Length inconsistent with byte enables, TLP crossing 4 KB, reserved Fmt or Type, TD with no digest. Expect Malformed TLP logged and no state corruption.\n3. **Unsupported and abort:** reads outside every BAR and unsupported types return UR, with no side effect. Check what completi
