t has stopped ringing doorbells for new commands. Check CQ head doorbell writes are being made, or the controller cannot free SQ entries."}],"mod":16},{"id":"16.05","level":"Intermediate","type":"Concept","fig":"nvmeflow","tags":["read","4kb","tlp","flow","doorbell","cqe","msix"],"q":"What does one 4 KB NVMe read look like on the PCIe bus, TLP by TLP?","short":"The host writes the 64-byte SQE into host memory, then a 4-byte doorbell MWr goes to the SSD. The SSD fetches the SQE with a 64-byte MRd (a CplD returns it), reads the media, and writes the 4 KB into host memory as MWr TLPs of up to MPS bytes. It then posts a 16-byte CQE with MWr, sends an MSI-X MWr, and after the host processes it the host writes the CQ head doorbell. Only the SQE fetch is a non-posted request.","deep":"1. **SQE in memory:** an ordinary CPU store to the SQ ring, no PCIe traffic yet.\n2. **Doorbell:** posted MWr, 4 bytes, host to SSD, to the SQ tail doorbell.\n3. **SQE fetch:** MRd of 64 bytes (or several SQEs together), and a CplD with the payload back to the SSD. This is the one non-posted step.\n4. **PRP or SGL fetch:** only when the buffer needs more than PRP1 and PRP2. A 4 KB aligned buffer needs neither a list.\n5. **Data:** the SSD reads NAND and issues MWr TLPs into host memory, each at most MPS, none crossing a 4 KB boundary. Reads never need tags for the data.\n6. **CQE:** one 16-byte MWr into the CQ ring, with the phase tag set.\n7. **Interrupt:** a 4-byte MSI-X MWr to the interrupt controller address in the vector's table entry.\n8. **Host:** the interrupt handler sees the phase tag, processes the CQE, and finishes the request.\n9. **CQ head doorbell:** posted MWr from host to SSD, telling it the entry is consumed.\n- **Ordering that matters:** data MWr, then CQE MWr, then the MSI-X MWr are one posted stream. The producer/consumer rule guarantees the host sees data before the CQE, and the CQE before the interrupt handler runs.\n- **Where time goes:** the SQE fetch round trip is about a microsecond or a bit more. The NAND read is tens of microseconds. The data phase at Gen4 x4 is under a microsecond. The rest is software.","pitfall":"Forgetting that the host's SQE write is not a bus event. It becomes visible on the bus only as the controller's later MRd.","verify":"Whether your controller fetches one SQE or several per MRd, and whether its CQE and MSI-X writes are separate TLPs in the order shown.","follow":[{"q":"Which TLPs in this flow carry a completion?","a":"Only the SQE fetch (and any PRP or SGL list fetch). Everything else is posted."},{"q":"Where would a PRP list fetch appear?","a":"Between the SQE fetch and the first data MWr, as another MRd and CplD, for transfers larger than two pages."}],"mod":16},{"id":"16.06","level":"Advanced","type":"Numeric","fig":null,"tags":["tlp-count","bytes","read","write","overhead","mps","rcb"],"q":"How many TLPs and how many bytes cross the link for one 4 KB read and one 4 KB write?","short":"With MPS 256, MRRS 512, 64-bit host addresses and no lists, a 4 KB read is 22 TLPs and about 4.75 KB on the wire, of which 19 TLPs and 4606 B go device to host. A 4 KB write is 30 TLPs and about 4.9 KB, of which 4594 B go host to device. The data phase is 88 to 89 percent of the busy direction. If the host returns 64-byte completions the write costs 78 TLPs.","deep":"Assumptions: per-TLP link overhead 10 B (2 B sequence + 4 B LCRC + 4 B STP framing at 128b/130b), no ECRC, 4DW (16 B) headers for host memory and device BAR addresses, 3DW (12 B) for completions and for MSI-X to a 32-bit interrupt address, no PRP list, one SQE per fetch, no doorbell batching, and DLLPs and SKPs ignored.\n4 KB read (device writes data to host):\n| Step | TLP | Direction | Count | Wire bytes each | Total |\n|---|---|---|---|---|---|\n| SQ tail doorbell | MWr 4 B | host to SSD | 1 | 30 | 30 |\n| SQE fetch | MRd 64 B | SSD to host | 1 | 26 | 26 |\n| SQE completion | CplD 64 B | host to SSD | 1 | 86 | 86 |\n| Data | MWr 256 B | SSD to host | 16 | 282 | 4512 |\n| CQE | MWr 16 B | SSD to host | 1 | 42 | 42 |\n| MSI-X | MWr 4 B | SSD to host | 1 | 26 | 26 |\n| CQ head doorbell | MWr 4 B | host to SSD | 1 | 30 | 30 |\nTotal 22 TLPs, 4752 B. SSD to host: 19 TLPs, 4606 B (efficiency 4096 / 4606 = 88.9 percent). Host to SSD: 3 TLPs, 146 B.\n4 KB write (device reads data from host), MRRS 512, completions of 256 B: the two doorbells, SQE MRd and CplD as above, then 8 MRd of 512 B (26 B each) and 16 CplD of 256 B (278 B each), CQE and MSI-X. Total 30 TLPs, 4896 B. Host to SSD 4594 B (89.2 percent), SSD to host 302 B.\n- **RCB and completion size:** if the host splits completions into 128 B pieces the write is 46 TLPs and the host to SSD direction is 4946 B (82.8 percent). At 64 B pieces it is 78 TLPs and 5650 B (72.5 percent).\n- **Batching:** one doorbell per N commands, one SQE fetch for several entries, and a CQ head doorbell per N completions cut the control TLPs. At 4 KB the control overhead is only about 2 percent of the busy direction, so the data TLP size matters far more.","pitfall":"Counting only data TLPs. The control TLPs matter for small I/O rates, and the completion split matters for writes.","verify":"Framing overhead for your generation (8b/10b, 128b/130b or FLIT), the header sizes for your address map, and what completion size your Root Complex actually returns.","follow":[{"q":"Which direction is the bottleneck for reads and for writes?","a":"Reads load the SSD to host direction, writes load the host to SSD direction. Full duplex means mixed traffic can exceed either alone."},{"q":"How many tags does one 4 KB write use?","a":"9 non-posted requests (the SQE fetch plus 8 data reads), each holding a tag until its completions return."}],"mod":16},{"id":"16.07","level":"Principal","type":"Numeric","fig":null,"tags":["iops","ceiling","gen4","gen5","4k-random","overhead"],"q":"What is the PCIe ceiling on 4 KB random read IOPS for a Gen4 x4 and a Gen5 x4 SSD, and how honest a predictor is it?","short":"The busy direction carries about 4606 B per 4 KB read at MPS 256. Gen4 x4 (7.877 GB/s) allows about 1.71 M IOPS and Gen5 x4 (15.75 GB/s) about 3.42 M, or about 1.70 M and 3.39 M with SKP and DLLP overhead. It is an upper bound, not a prediction. Gen4 drives usually hit controller or NAND limits first, while Gen5 drives come close enough that PCIe efficiency matters.","deep":"1. Link rate: Gen4 x4 = 16 GT/s x 4 x 128/130 / 8 = 7.877 GB/s. Gen5 x4 = 15.754 GB/s, per direction.\n2. Bytes per read (SSD to host) from the previous question: 16 data TLPs x 282 B + MRd 26 B + CQE 42 B + MSI-X 26 B = 4606 B.\n3. IOPS = link bytes per second / bytes per IO.\n| Host MPS | Bytes per IO | Gen4 x4 | Gen5 x4 |\n|---|---|---|---|\n| 128 | 5022 | 1.57 M | 3.14 M |\n| 256 | 4606 | 1.71 M | 3.42 M |\n| 512 | 4398 | 1.79 M | 3.58 M |\n4. Extras: one SKP ordered set per about 370 blocks costs about 0.3 percent, and a few DLLPs per IO another 0.5 percent. That gives about 4642 B and 1.70 M and 3.39 M at MPS 256.\n- **Sanity check:** 3 M IOPS at 4 KB is 12.3 GB/s of payload, and with about 4.6 KB per I/O on the wire it is about 13.8 GB/s, which is 88 percent of the Gen5 x4 raw rate. That is inside the PCIe envelope but leaves little headroom.\n- **Honesty about measured numbers:** datasheet random-read figures for current drives are typically below the ceilings, roughly 1.0 to 1.6 M for Gen4 x4, and about 1.5 to 2.6 M for consumer Gen5 x4 drives with enterprise Gen5 drives reaching around 3 M. The controller, NAND parallelism, firmware and host CPU cost per I/O usually bind first. PCIe becomes the limit only if MPS is small, the link is down-trained, or completions are split finely.\n- **Use:** a measured IOPS well below the bound says look at the host and the drive. A measured IOPS near the bound says look at MPS, batching and link efficiency.","pitfall":"Quoting the PCIe ceiling as a drive's expected performance. It is an upper limit and shows the drive is not link-limited, not that it will reach it.","verify":"Current datasheet IOPS for the drives you compare, and the MPS your platform actually negotiates on the path.","follow":[{"q":"How many I/Os must be in flight to reach 1.7 M at 80 microseconds latency?","a":"By Little's law 1.7 M x 80 microseconds = 136 outstanding commands."},{"q":"Do reads and writes share the ceiling?","a":"No. They load opposite directions, so a mixed workload can use both."}],"mod":16},{"id":"16.08","level":"Advanced","type":"Concept","fig":null,"tags":["sequential","throughput","mps","mrrs","tags","credits","gen4","gen5"],"q":"Why does Gen4 x4 sequential throughput top out near 7 GB/s and Gen5 x4 near 14 GB/s, and how do MPS, MRRS, tags and credits shape it?","short":"The link's raw rate is 7.88 and 15.75 GB/s. Each TLP carries roughly 26 bytes of overhead, so a 256-byte payload is about 91 percent efficient, giving 7.15 and 14.3 GB/s, and about 1 percent less for SKPs and DLLPs. Real drives report about 7.0 to 7.4 and 14 to 14.8 GB/s. MPS sets the payload efficiency, and tags, MRRS and credits decide whether the link stays full.","deep":"| MPS | Efficiency (26 B overhead) | Gen4 x4 | Gen5 x4 |\n|---|---|---|---|\n| 128 | 83.1 % | 6.55 GB/s | 13.09 GB/s |\n| 256 | 90.8 % | 7.15 GB/s | 14.30 GB/s |\n| 512 | 95.2 % | 7.50 GB/s | 14.99 GB/s |\nWith about 1 percent for SKP and DLLPs: 7.08 and 14.16 at MPS 256, and 7.42 and 14.84 at MPS 512.\n- **MPS:** the smallest MPS on the path wins, so a switch or root port at 128 B costs 8 to 9 percent. Drives quoted at the top of the range imply an MPS 512 path.\n- **Tags and MRRS (SSD reading host memory, the write path):** bytes in flight = bandwidth x round trip. Gen5 x4 at 2 microseconds needs about 31.5 KB, or about 62 reads of 512 B. With 32 tags of 512 B at 2 microseconds you cap near 8.2 GB/s. Extended or 10-bit tags and a larger MRRS are needed at Gen5.\n- **Credits (SSD writing host memory, the read path):** the Root Complex must advertise enough posted data credits and return them fast. At a 1 microsecond credit loop Gen4 x4 needs about 7.9 KB, or about 490 credits of 16 B. Verify with the analyzer's InitFC and UpdateFC values (module 8).\n- **Other limits:** IOMMU translation, host memory bandwidth, NUMA distance, and the controller's DMA engine.","pitfall":"Blaming the SSD for a shortfall against the raw link rate. Part of the gap is TLP overhead by design.","verify":"Datasheet sequential figures for the drives in question, and the negotiated MPS and MRRS on the actual platform (`lspci -vv` DevCtl).","follow":[{"q":"Why can a drive quote more than 91 percent of raw?","a":"A platform with MPS 512 reaches about 95 percent, so about 7.4 and 14.8 GB/s fit in one direction. A quote above that would not."},{"q":"What if sequential reads are fine but sequential writes are much lower?","a":"Look at tags and MRRS on the SSD, and the Root Complex's completion size, since writes make the SSD issue reads."}],"mod":16},{"id":"16.09","level":"Intermediate","type":"Concept","fig":null,"tags":["prp","sgl","scatter","tlp-size","list-fetch"],"q":"What is the PCIe cost of PRP versus SGL, and of scattered buffers?","short":"PRP lists describe a buffer as page-sized 8-byte pointers, and SGLs describe it as 16-byte descriptors of any byte length. On PCIe, a long PRP or SGL list needs extra MRd and CplD fetches before or during the transfer, and a scattered buffer is moved in more, smaller TLPs. Contiguous 4 KB pages cost the same either way. Fragments smaller than MPS cut efficiency.","deep":"- **PRP:** PRP1 and PRP2 hold up to two pages. Beyond that PRP2 points to a list page of 512 entries, whose last entry chains to the next list page. A 128 KB read with an aligned buffer needs PRP1 plus a 31-entry list (248 B), fetched by MRd before the SSD can write those pages.\n- **SGL:** the first descriptor can sit in the command. Others live in segments in host memory, each 16 B and each with its own length. Bit bucket descriptors let the controller skip data without sending it.\n- **Data TLP sizing:** each TLP is at most MPS, must not cross a 4 KB boundary, and stays inside one fragment.\n| Buffer layout for 4 KB | Data TLPs | Wire bytes | Efficiency |\n|---|---|---|---|\n| 16 fragments of 256 B (or contiguous) | 16 | 4512 | 90.8 % |\n| 32 fragments of 128 B | 32 | 4928 | 83.1 % |\n| 64 fragments of 64 B | 64 | 5760 | 71.1 % |\n- **Latency:** a list fetch is a dependent round trip. Controllers prefetch lists, but a long chain adds latency to the first data byte.\n- **Host side:** Linux uses PRPs by default and can use SGLs when the controller advertises them (the `sgl_threshold` parameter controls it).","pitfall":"Assuming SGL is always faster. It removes host copies for scattered buffers but adds descriptor fetches, and tiny fragments become tiny TLPs.","verify":"The PRP list chaining rule, SGL descriptor types and the Identify Controller SGL support field in the NVMe Base Specification, and the Linux `sgl_threshold` default.","follow":[{"q":"Does SGL reduce bus traffic for a contiguous buffer?","a":"No. Same data TLPs, plus a descriptor to read."},{"q":"What does a bit bucket save?","a":"Data that the host does not want is not transferred at all, saving MWr TLPs on reads."}],"mod":16},{"id":"16.10","level":"Intermediate","type":"Concept","fig":null,"tags":["msix","interrupts","coalescing","polling","vector"],"q":"How does NVMe use MSI-X, and what does interrupt coalescing do to latency and PCIe traffic?","short":"Each completion queue names an interrupt vector when it is created. The controller signals a completion by sending a 4-byte posted MWr to the address and data in that vector's MSI-X table entry, after the CQE write. Interrupt coalescing (Set Features: a count threshold and a time in 100 microsecond units) delays the interrupt to reduce the rate. It lowers CPU load at high queue depth and adds latency at low queue depth.","deep":"- **Vectors:** Linux allocates one MSI-X vector per I/O queue (usually per CPU) plus one for admin, and sets affinity so the completion lands on the submitting CPU.\n- **On the bus:** a 4-byte MWr, 26 B or 30 B on the wire, negligible bandwidth. Its cost is CPU time.\n- **Ordering:** the MSI-X MWr follows the CQE in the same posted stream, so the handler sees the CQE.\n- **Masking:** a masked vector sets its pending bit in the PBA and fires on unmask. INTMS and INTMC are for pin-based and MSI interrupts, not MSI-X.\n- **Coalescing:** the aggregation threshold and aggregation time come from the Interrupt Coalescing feature, and the Interrupt Vector Configuration feature can turn coalescing off per vector. Default is usually none, because it hurts latency.\n- **Polling:** io_uring with poll queues creates CQs without interrupts. There is no MSI-X traffic and the CPU polls the CQ in memory.\n- **Debug:** an I/O timeout with a posted CQE means the interrupt was lost. Check `/proc/interrupts` for per-queue counts, MSI-X masks, the IOMMU interrupt remapping, and look for the MWr to the interrupt address on the analyzer.","pitfall":"Turning on coalescing to raise IOPS and forgetting the QD1 latency hit.","verify":"The Interrupt Coalescing and Interrupt Vector Configuration Feature IDs (08h and 09h) and their units, and the MSI-X table entry format (module 10).","follow":[{"q":"What does coalescing do at QD1?","a":"It can add up to the aggregation time to every completion. That is why it is usually off for latency-sensitive workloads."},{"q":"Why is the interrupt a separate posted write and not part of the CQE?","a":"The CQE is a memory write for polling hosts. The interrupt is a separate message to the interrupt controller, so both models work."}],"mod":16},{"id":"16.11","level":"Advanced","type":"Concept","fig":null,"tags":["cmb","pmr","p2p","bar","queue-placement","acs"],"q":"Where can queues live, and what do CMB and PMR change on the PCIe side?","short":"SQs and CQs normally live in host memory. A Controller Memory Buffer (CMB) is SSD memory exposed through a BAR that can hold SQs, CQs, lists and data. Host writes to a CMB SQ are posted MWr that skip the SQE fetch round trip, but CPU reads from CMB are slow non-posted MMIO reads, so CQs stay in host memory. A CMB also enables peer-to-peer DMA. A Persistent Memory Region (PMR) is meant to survive resets and needs flush discipline.","deep":"- **Host-memory queues (default):** coherent, cacheable, DMA by the SSD, with the doorbell and SQE-fetch round trip on every submission.\n- **SQ in CMB:** the host writes 64-byte entries by MMIO into the BAR (write-combining helps), so the SSD does not need the MRd and CplD. This shortens submission latency by about one round trip.\n- **CQ in CMB:** the host polls with MMIO reads, each a full non-posted round trip. That is slow and stalls the core, so CQs belong in host memory.\n- **Data in CMB and P2P:** another endpoint (an RDMA NIC or GPU) can DMA into the CMB directly. Behind one switch it routes by address without the Root Complex. Through the Root Complex it requires P2P routing support, and ACS redirect or the IOMMU may force it upstream (module 13). Linux exposes it through p2pdma.\n- **BAR consequence:** a CMB adds to BAR size and needs window space, which affects hot-plug padding (module 15).\n- **PMR:** persistent memory behind a BAR, enabled and controlled by its own registers. Because host writes are posted, they are not persistent when the instruction retires. The host must use the specified flush mechanism, which is the same posted-write visibility problem discussed in module 2 (a read after the write forces earlier writes out).\n- **Validation:** MMIO write and read throughput to the CMB, P2P bandwidth and errors (UR, CTO, ACS blocks), behavior of CMB and PMR contents across CC.EN, FLR and PERST#, and window sizes.","pitfall":"Placing CQs in the CMB to save host memory and then seeing polling latency collapse.","verify":"CMBLOC, CMBSZ, CMBMSC and PMRCAP, PMRCTL registers and fields, what may be placed in the CMB, whether contents survive resets, and the PMR flush mechanisms.","follow":[{"q":"Why is reading the CMB from the CPU so slow?","a":"MMIO reads are uncached, non-posted, and typically limited to small sizes, so each is a round trip of about a microsecond."},{"q":"Why can P2P silently fail on some platforms?","a":"The Root Complex may not route between root ports, or ACS blocks it, and the request ends as UR, CTO or a logged error."}],"mod":16},{"id":"16.12","level":"Intermediate","type":"Concept","fig":null,"tags":["hmb","dram-less","latency","ftl","set-features"],"q":"How does a DRAM-less SSD use Host Memory Buffer, and why is it sensitive to PCIe latency?","short":"With HMB the host gives the SSD a region of host DRAM (Set Features, Host Memory Buffer) that the controller uses through ordinary DMA, typically to cache flash-translation mapping. Each miss in the controller's small SRAM becomes a small MRd to host memory in the middle of the I/O, adding a round trip of a microsecond or more to that command's latency. It also needs re-enabling after every reset.","deep":"- **Mechanism:** the host allocates buffers, builds a descriptor list, and enables HMB with Set Features (Feature ID 0Dh). The controller reads and writes them as normal bus-master requests. The driver picks the size within the controller's minimum and preferred values, and on Linux the `nvme.max_host_mem_size_mb` module parameter limits it.\n- **Capacity reality:** a full mapping table needs about 4 B per 4 KB, roughly 1 MB per GB of flash (about 1 GB for 1 TB). A 64 MB HMB covers only about 6 percent of a 1 TB drive, so it helps localized workloads and helps little on uniform random reads.\n- **PCIe cost:** a few small MRd and CplD pairs per I/O, plus write-backs. Bandwidth is negligible. Latency is not, because these reads are dependent steps.\n- **What inflates it:** ASPM L1 exit and LTR, IOMMU translation misses, host memory in a low-power state, and contention with other DMA. Each shows as a tail in latency.\n- **Validation:** compare QD1 random read latency with HMB on and off (a Linux module parameter or Set Features can turn it off), test under DMA contention and with L1 enabled, and check that HMB is re-enabled after CC.EN, FLR and PERST# and after resume from sleep.\n- **Security angle:** the SSD can read and write that host memory, so the IOMMU should confine it to the HMB region.","pitfall":"Judging a DRAM-less drive on sequential tests. HMB shows up in random latency.","verify":"HMB Feature ID (0Dh), the preferred and minimum size fields in Identify Controller, the Linux `max_host_mem_size_mb` default and whether 0 disables HMB, and the descriptor format.","follow":[{"q":"Why does a PERST# lose HMB?","a":"The controller state is gone, and the host must re-run the Set Features to hand the descriptors back."},{"q":"What is the first symptom of HMB trouble in the field?","a":"Random read latency and tails that are worse than the same drive's DRAM-equipped sibling under the same workload."}],"mod":16},{"id":"16.13","level":"Advanced","type":"Cross-layer","fig":null,"tags":["timeout","completion-timeout","nvme-timeout","reset","driver"],"q":"NVMe command timeouts versus the PCIe Completion Timeout: which fires first, and what does the driver do?","short":"The PCIe Completion Timeout is set in Device Control 2, with a default range of about 50 microseconds to 50 ms. It fires in the requester long before the Linux NVMe timeouts of 30 s for I/O and 60 s for admin commands. A stalled PCIe read is caught by hardware and logged first. An NVMe timeout means the controller never posted a completion, which after clean PCIe logs points to the drive or firmware. The driver then aborts, then resets the controller.","deep":"Both sides have requesters:\n- **Host requester:** a CPU MMIO read to BAR0 (for example CSTS). If the SSD does not answer, the Root Complex times out, logs it, and returns all ones to the CPU (some platforms escalate it to a machine check).\n- **SSD requester:** its MRd for an SQE, PRP list or data. A missing completion times out in the SSD, which logs it, and usually fails the command internally or hangs. The host sees nothing until its own NVMe timeout.\nTimeline in Linux:\n1. PCIe CTO: milliseconds, hardware, AER or DPC.\n2. Command timeout: the driver logs `I/O <id> QID <n> timeout, aborting` and sends an Abort (admin).\n3. If that fails or the controller is unresponsive: `... timeout, reset controller`. The reset toggles CC.EN, waits for CSTS.RDY, recreates queues and requeues the requests.\n4. If CSTS reads all ones the driver logs that the controller is down, and resets or removes it.\n- **The nesting:** CAP.TO (500 ms units) bounds controller ready waits, the NVMe command timeouts are tens of seconds, and the CTO is normally the smallest of the three.\n- **Use in triage:** AER CTO time before the NVMe timeout means a link or path fault. NVMe timeout with clean PCIe logs points to the SSD or its firmware (module 2 has the triage flow).","pitfall":"Treating the NVMe timeout as the first symptom. Look earlier in the AER log for a CTO.","verify":"The CTO ranges and default in Device Capabilities 2 and Device Control 2 (module 12), the Linux defaults (`nvme_core.io_timeout`, `admin_timeout`), and the exact driver message text on your kernel.","follow":[{"q":"What if the CTO is programmed to 64 s?","a":"It exceeds the NVMe timeout, so the driver's own reset MMIO reads can stall the CPU up to the CTO, and the reset looks hung."},{"q":"What state do in-flight commands end in after the reset?","a":"They are cancelled and requeued or failed. The SSD never posts their CQEs."}],"mod":16},{"id":"16.14","level":"Advanced","type":"Debug","fig":null,"tags":["sequential","plateau","gen4","checklist","iommu","numa","fio"],"q":"Sequential read plateaus at 3.2 GB/s on a Gen4 x4 drive. What do you check, and in what order?","short":"3.2 GB/s is about what a Gen3 x4 or Gen4 x2 link can deliver (ceiling about 3.5 GB/s), so read LnkSta first. If the link is 16 GT/s x4, check MPS, MRRS, AER counters, IOMMU mode, NUMA and IRQ placement, workload parameters (block size and queue depth), thermal and power state, and finally the drive's own limits. Change one variable at a time.","deep":"1. **Link:** `lspci -vv -s <BDF>`, compare LnkCap to LnkSta. 8 GT/s x4 or 16 GT/s x2 gives a ceiling of 3.94 GB/s raw, about 3.5 after overhead, so 3.2 fits. Then triage the link (modules 4 and 5).\n2. **Payload sizes:** DevCtl MaxPayload and MaxReadReq. MPS 128 caps Gen4 x4 at about 6.5 GB/s, which alone would not explain 3.2.\n3. **Errors:** AER correctable counters before and after the run. Rising Bad TLP and replays cut throughput (module 6).\n4. **Credits and tags:** with an analyzer, InitFC values and whether the SSD stalls on credits, and how many tags the SSD uses.\n5. **IOMMU:** `dmesg | grep -i iommu`. Strict translation on every DMA can cut throughput. Try passthrough mode as an experiment.\n6. **CPU and NUMA:** SSD on one socket and fio on the other, IRQs on the wrong CPUs, or one core saturated (`perf top`, `mpstat -P ALL`). Pin fio and IRQs local to the SSD's node.\n7. **Workload:** throughput = QD x block size / latency. QD 4 of 128 KiB at 160 microseconds gives 3.3 GB/s. Raise QD and jobs, and use `--direct=1` with io_uring or libaio.\n8. **Thermal and power:** `nvme smart-log` temperature and thermal transition counts, `nvme get-feature -f 2` for the power state, and APST settings.\n9. **Drive limits:** state of the drive (fresh versus preconditioned, SLC cache, capacity used), the datasheet sequential figure for its capacity point, and reading unmapped LBAs.\n- **Decision:** if a known-good drive in the same slot does 7 GB/s the drive or its firmware is the cause. If both are stuck, it is the platform.","pitfall":"Tuning fio first. Confirm the link and the negotiated MPS before touching software.","verify":"Which figures on the drive's datasheet apply to your capacity and workload, and the tools available on your platform for IOMMU and NUMA inspection.","follow":[{"q":"Which single check separates link from everything else?","a":"LnkSta speed and width, and the same drive in another slot."},{"q":"What would low sequential read with high bad-TLP counts tell you?","a":"A signal-integrity problem causing replays, not a host or drive throughput limit."}],"mod":16},{"id":"16.15","level":"Advanced","type":"Debug","fig":null,"tags":["iops","qd32","doorbell","coalescing","little-law","triage"],"q":"Measured 4 KB random read IOPS is half the datasheet at QD32. How do you find out why?","short":"First apply Little's law: 32 outstanding at 500 K IOPS implies 64 microseconds per I/O, so compare latency to the drive's. Then compute PCIe bytes per I/O (about 4.6 KB) to show whether the link is a limit, check the link speed and width, and check the test conditions behind the datasheet number. Then look at doorbell batching, interrupt coalescing, and per-queue and per-core limits.","deep":"1. **Little's law:** IOPS = QD / latency. 500 K IOPS at QD32 is 64 microseconds mean. If the drive's true latency is 80 microseconds, QD32 on one queue can only give 400 K. Datasheet numbers are often at QD128 or 256 across several threads.\n2. **PCIe bytes per I/O:** about 4606 B upstream (question 16.06). 500 K IOPS is 2.3 GB/s, 29 percent of Gen4 x4. So PCIe is not the limit unless the link is degraded: Gen3 x2 tops out near 430 K IOPS.\n3. **Link and MPS:** LnkSta, DevCtl and AER, as in the plateau question.\n4. **Doorbells:** count doorbell MWr per I/O on the analyzer. Two per I/O means no batching. At 500 K IOPS that is 1 M MMIO writes per second, which costs CPU. Batch submits (io_uring, `iodepth_batch_submit`).\n5. **Interrupts:** `/proc/interrupts` shows the interrupt rate. A coalescing setting (feature 08h) can hold completions and stretch latency. Try polled I/O for comparison.\n6. **Queue and CPU limits:** one queue per core, and a single core typically sustains from a few hundred thousand to roughly a million IOPS, depending on the I/O stack. Use several jobs pinned to different cores and check each core's utilization.\n7. **Test conditions:** LBA format and alignment (`nvme id-ns`), raw device versus filesystem, span of LBAs read, preconditioned versus fresh, thermal state.\n- **Decision:** if bytes per IO x IOPS is far below link capacity and CPU is not saturated, look at the drive: its own queue arbitration, thermal throttle, or firmware settings.","pitfall":"Comparing a single-thread QD32 result to a multi-thread QD256 datasheet number.","verify":"The datasheet's stated queue depth, thread count and span, and the Interrupt Coalescing feature settings on your drive.","follow":[{"q":"What tells you the drive is not being fed enough?","a":"Latency stays flat as QD rises but IOPS rises linearly. If IOPS stops growing with QD while latency climbs, the drive is saturated."},{"q":"Why check the LBA span?","a":"Reading a small or empty span can be faster or slower than the datasheet condition because of caching and unmapped reads."}],"mod":16},{"id":"16.16","level":"Advanced","type":"Trap","fig":null,"tags":["cqe","ordering","relaxed-ordering","dma-rmb","coherency"],"q":"The driver sees the CQE but the data buffer still holds old data. Where can the ordering fail?","short":"Data MWr then CQE MWr are one posted stream, and a posted write without Relaxed Ordering cannot pass an earlier posted write, so the CQE cannot legally be visible before the data. First read the wire order on the analyzer. If the CQE really left the SSD before the last data TLP, it is a device bug. If the wire order is right, check Relaxed Ordering and IDO bits, the path and IOMMU, then the host side: missing barriers or non-coherent DMA.","deep":"1. **Wire order:** on the analyzer, is the CQE MWr after every data MWr for that command? An SSD with separate data and CQE engines can post the CQE early. This is a plausible firmware or hardware bug.\n2. **Ordering attributes:** in the TLP header Attr field, RO (Relaxed Ordering) and IDO. The rule is that a posted write with RO clear may not pass earlier posted writes. Data with RO set is fine as long as the CQE (and the MSI-X message) have RO clear, since they cannot pass the data. A CQE with RO set breaks the guarantee.\n3. **Same path:** are data and CQE in the same traffic class and virtual channel, through the same route? Different paths do not order.\n4. **IOMMU, ATS and ACS:** translated and untranslated requests can take different routes (for example ACS redirect), and different routes do not order against each other.\n5. **Root complex:** confirm it honors ordering for RO = 0 writes on your platform.\n6. **Host CPU:** the driver must read the phase tag, then execute a read barrier (Linux `dma_rmb()`), then read the rest of the CQE and the data. On weakly ordered CPUs a missing barrier reorders the reads. On non-coherent DMA systems a missing cache invalidate returns stale data.\n7. **Software drivers:** user-space stacks need the same barriers and cache attributes.\n- **Data point:** the analyzer sees the link, not host memory visibility. So the trace proves the device side and the host side needs its own checks.","pitfall":"Adding a delay or a second read in the driver to hide it. Find the actual ordering violation.","verify":"The ordering table rules for posted requests with RO set and clear, Attr bit positions, and the barrier requirements of your CPU architecture and driver.","follow":[{"q":"Why use Relaxed Ordering on data at all?","a":"It lets the Root Complex reorder data writes for memory efficiency, and is safe when the completion signal itself is not relaxed."},{"q":"Does the MSI-X write have the same guarantee?","a":"Yes, if it is posted with RO clear it follows the CQE in the same stream."}],"mod":16},{"id":"16.17","level":"Principal","type":"Scenario","fig":null,"tags":["analyzer","timeline","trace","latency","reconstruction"],"q":"You have a protocol analyzer trace of a slow NVMe read. How do you reconstruct the full command timeline and find where the time went?","short":"Anchor on the SQ doorbell MWr, match the SQE fetch MRd and CplD, decode the command fields from the CplD payload (opcode, command ID, PRP1, SLBA, NLB), follow the data MWr into the PRP address, find the CQE MWr by command ID, then the MSI-X MWr and the CQ head doorbell. Time each gap, and attribute it to the host (interrupt to doorbell), the link and host memory (fetch round trip), or the drive (doorbell to fetch, fetch to first data).","deep":"Illustrative trace for one 4 KB read (times in microseconds from the doorbell):\n| Time | TLP | Detail |\n|---|---|---|\n| 0.00 | MWr host to SSD | BAR0 + 1008h, data 0005h: SQ1 tail = 5 |\n| 0.42 | MRd SSD to host | tag 1Ah, 16 DW, SQ base + 4 x 40h (head 4) |\n| 1.31 | CplD host to SSD | tag 1Ah, 64 B: opcode 02h read, CID 0031h, PRP1, SLBA, NLB = 7 (512 B LBAs) |\n| 72.4 | MWr SSD to host | 256 B to PRP1: first data TLP |\n| 73.1 | MWr SSD to host | 16th 256 B TLP, last byte at PRP1 + FFFh |\n| 73.2 | MWr SSD to host | 16 B CQE: SQHD 5, SQID 1, CID 0031h, phase 1, status 0 |\n| 73.3 | MWr SSD to host | 4 B to interrupt address, vector data |\n| 79.8 | MWr host to SSD | BAR0 + 100Ch, data 0005h: CQ1 head = 5 |\nMethod:\n1. **Anchor:** find the doorbell, note the queue and new tail, compute the SQE address from the SQ base and old head.\n2. **Match the fetch:** by tag, and check the CplD is 64 B and complete.\n3. **Decode the command:** CID, opcode, PRP or SGL, LBA and length. Verify data bytes = (NLB + 1) x LBA size.\n4. **Follow the data:** all MWr addresses fall inside the PRP range, none cross 4 KB, sizes sum to the length.\n5. **Find the CQE:** by CID and SQID. Check the phase tag matches the expected value, status is success, and SQHD equals the new head.\n6. **Gaps:** doorbell to fetch 0.42 (SSD arbitration), fetch round trip 0.89 (host memory plus IOMMU), fetch to first data 71.1 (firmware, FTL and NAND), data phase 0.7, data to CQE 0.1, CQE to interrupt 0.1, interrupt to CQ doorbell 6.5 (host).\n- **Reading the gaps:** a fetch round trip well above a microsecond or two points at ASPM L1 exit, IOMMU faults or a slow Root Complex. A long fetch-to-data gap is the drive. A long interrupt-to-doorbell gap is host software.","pitfall":"Using host-observed latency to blame the drive. The trace shows the drive's part is only the fetch-to-data gap.","verify":"How your analyzer decodes NVMe fields, and the queue base addresses and depth for the queue under test.","follow":[{"q":"What if the CQE appears before the last data TLP?","a":"That is an ordering bug in the SSD (see the CQE ordering question)."},{"q":"How do you correlate to host tracing?","a":"Use a marker MMIO write that appears in both logs, or synchronize clocks, and compare the host's submit and complete times to the doorbell and doorbell-return times."}],"mod":16},{"id":"16.18","level":"Principal","type":"Cross-layer","fig":null,"tags":["correlation","latency","histogram","replay","recovery","aspm","credit-stall","design"],"q":"How would you design cross-layer validation that correlates NVMe command latency histograms with PCIe events such as replays, Recovery entries, credit stalls and ASPM exits?","short":"Collect per-command latency on the host, and PCIe events from counters and analyzers, on one aligned time base. Compare histograms with and without events, attribute the tail commands to event windows, and confirm causality by injecting each event (ASPM, replays, speed change) and watching the histogram shift. Report tail latency explained by PCIe events, and flag unexplained tail as a drive or host issue.","deep":"1. **Latency data:** per-I/O timestamps from fio latency logs, or eBPF on block request issue and complete, into HDR histograms per workload. Add the drive's vendor telemetry if available.\n2. **PCIe events:** AER counter deltas (Bad TLP, Replay Timer Timeout, Rollover), LTSSM Recovery entries and L1 or L0s entries and exits (analyzer or device counters), credit stalls (analyzer flow-control state or device counters), link speed and width changes, and SSD-side error counters.\n3. **Time alignment:** a marker (an MMIO write to a scratch or vendor register, or a config access) issued by the test host and visible in both the host log and the analyzer trace. Repeat it to measure clock offset and drift.\n4. **Tail attribution:** for each I/O above p99.9, check for events in [submit, complete]. Compare that fraction to random windows of the same length. A large lift means correlation.\n5. **Causality by injection:** force ASPM L1 on and off, inject LCRC errors at a controlled rate, drop the link speed, throttle credits. The histogram should shift in proportion (dose response).\n6. **Controls:** run at steady state, fixed temperature and fixed firmware, and exclude drive-internal causes such as garbage collection and thermal throttling using SMART and telemetry.\n7. **Sample size:** p99.99 needs at least 1e6 I/Os per condition to see about 100 tail events, and more events to prove correlation.\n- **Output:** per-run overlay of histograms annotated with event rates, a table of tail latency explained by each event type, and a gate that fails the build when unexplained tail rises.\n- **Decision criteria:** for example, no Recovery entries in the run, replay rate under the agreed limit, and the p99.99 latency under budget both with and without ASPM.","pitfall":"Treating correlation as cause, or ignoring drive-internal tail sources such as garbage collection.","verify":"Which PCIe counters your platform, analyzer and SSD actually expose, and how your tools timestamp events.","follow":[{"q":"What if correlation is high but injection changes nothing?","a":"A shared cause, such as thermal or a host interrupt, drives both. The injection test separates causation from correlation."},{"q":"How does this connect to the NVMe timeout question?","a":"Latency spikes that approach the command timeout precede resets, so long tails are early warnings of a timeout storm."}],"mod":16},{"id":"17.01","level":"Basic","type":"Concept","fig":null,"tags":["toolbox","analyzer","scope","margining","host-tools"],"q":"What tools do you use to debug a PCIe link and an NVMe SSD, and what can each one see?","short":"A protocol analyzer sees ordered sets, TLPs and DLLPs on the wire, and the LTSSM is inferred from them. A scope or BERT sees analog signal quality. Lane margining measures the receiver's own timing and voltage margin in the running system. Host tools (lspci, setpci, nvme-cli, dmesg, fio) see config space, AER, link status and NVMe logs. SSD-side logs, telemetry and UART/JTAG show the firmware's view. No single tool sees every layer.","deep":"| Tool | Sees | Blind to |\n|---|---|---|\n| Protocol analyzer | Ordered sets, TLP and DLLP decode, timing, inferred LTSSM | Analog quality, the DUT's internal state, what the DUT's receiver actually decoded |\n| Scope, BERT, eye and jitter tools | Voltage versus time at a probed point, jitter, reference clock, Tx presets | Protocol behavior, and the receiver's internal eye after its own equalization |\n| Lane margining | Per-lane timing and voltage margin at the true receiver, in system | Why margin is low, and it is receiver-implementation dependent |\n| Host tools | Config space, AER, LnkSta, NVMe logs, kernel messages, load generation | Almost everything once the link is down, and usually the LTSSM history |\n| SSD-side logs, telemetry, UART, JTAG | Firmware asserts, PHY and LTSSM counters, FTL and NAND state | The host and channel side |\n\n- **Pick by layer:** physical problems go to scope and margining, LTSSM, Data Link and Transaction Layer problems go to the analyzer plus AER counters, and NVMe-level problems go to host tools plus SSD logs.\n- **Cheapest and least intrusive first:** counters and logs cost nothing and run in the failing setup. Reach for the analyzer or scope when the counters cannot separate the hypotheses.","pitfall":"Starting with the most powerful tool. A scope or an interposer changes the setup and burns days, while a counter delta often narrows the layer in minutes.","verify":null,"follow":[{"q":"Which tool do you use first?","a":"The host-side counters and logs, because they are non-intrusive and already in the failing system. They also tell you which layer the expensive tools should look at."},{"q":"Why keep the analyzer if AER already counts errors?","a":"AER counts the receiver's view without timing or context. The analyzer shows the packet sequence, who sent what, and what happened just before the error."}],"mod":17},{"id":"17.02","level":"Basic","type":"Concept","fig":null,"tags":["linux","lspci","setpci","nvme-cli","fio","dmesg"],"q":"Which Linux commands do you run first on a suspect NVMe SSD, and what do you read from each?","short":"Run lspci -vvv as root on the SSD and on its upstream ports to read LnkCap, LnkSta, AER status and DevCtl. Dump raw config space for offline decoding. Read BAR0 CSTS to see if the controller answers. Use nvme smart-log and error-log for device health, dmesg or journalctl for AER and driver messages, and fio for load. Capture all of it before any reset.","deep":"```\nlspci -vvv -s 01:00.0              # LnkCap/LnkSta, DevCtl, CESta/UESta, L1SS\nlspci -xxxx -s 01:00.0             # raw 4 KB config dump, keep it for offline decode\nsetpci -s 01:00.0 CAP_EXP+0x12.w   # raw Link Status (offset 0x12 in the PCIe capability)\ncat /sys/bus/pci/devices/0000:01:00.0/current_link_speed\nnvme smart-log /dev/nvme0          # temperature, media_errors, unsafe_shutdowns\nnvme error-log /dev/nvme0\njournalctl -k -b -1 | grep -Ei \"nvme|aer|dpc|pcieport\"   # previous boot's kernel log\nfio --name=rd --filename=/dev/nvme0n1 --rw=randread --bs=4k --iodepth=32 --ioengine=io_uring --direct=1 --time_based --runtime=600\n```\n- **lspci needs root:** without it, extended capabilities such as AER are not shown. Read the root port and any switch ports too, not just the SSD.\n- **What to compare:** LnkSta against LnkCap on both ends, CESta and UESta bits, DevCtl (MPS, MRRS), and whether ASPM is enabled.\n- **BAR0 reads:** `pcimem /sys/bus/pci/devices/0000:01:00.0/resource0 0x1c w` reads CSTS (offset 1Ch). A value of 0xFFFFFFFF means the read got no valid answer, usually a down link. On some platforms an MMIO read to a dead device is slow or escalates, so read config space first.\n- **Other tools:** `rasdaemon` (`ras-mc-ctl --errors`) keeps timestamped AER events, and `echo 1 > /sys/kernel/tracing/events/nvme/enable` turns on NVMe command tracepoints.\n- **Writes are different from reads:** setpci writes and fio on a raw device change state or destroy data. Reads are safe.","pitfall":"Running the commands after a reset or a driver reload. Sticky AER bits, driver counters and device state have already changed.","verify":"setpci capability names (CAP_EXP) and lspci output labels on your pciutils version, and the sysfs attributes available on your kernel.","follow":[{"q":"The link looks fine in lspci but I/O times out. What next?","a":"Read CSTS and the NVMe logs, then trace the command path (doorbell, SQE fetch, data, CQE, interrupt). See the NVMe over PCIe module and the scenarios module."},{"q":"Why journalctl -b -1?","a":"After a reboot that lost the drive, the interesting messages are in the previous boot's log, provided the journal is persistent."}],"mod":17},{"id":"17.03","level":"Basic","type":"Concept","fig":null,"tags":["windows","windbg","etw","powershell","vendor-tools"],"q":"What are the Windows equivalents of the Linux PCIe and NVMe debug tools?","short":"Device Manager and PowerShell Get-PnpDeviceProperty show the link speed and width the OS recorded. WinDbg kernel debugging with !pci dumps config space. Event Viewer shows WHEA-Logger PCIe error events and storage reset events. Windows Performance Recorder and Analyzer capture ETW traces of the storage stack, Get-StorageReliabilityCounter gives SMART-like data, and diskspd or fio generate load. Vendor tools cover NVMe logs.","deep":"- **Link facts:** the PCI device properties in Device Manager (Details tab) or `Get-PnpDeviceProperty -InstanceId <id>` list current and maximum link speed and width. Compare current against maximum.\n- **Config space and topology:** WinDbg in kernel mode: `!pci` dumps PCI config space, `!devnode` and `!devstack` show the device tree and stack. This needs a debug connection.\n- **Errors:** the Windows System event log has WHEA-Logger events for corrected and uncorrected PCIe errors, but only if firmware handed AER control to the OS. Storport and stornvme reset events (for example \"Reset to device ... was issued\") mark command timeouts.\n- **Tracing:** `wpr` records ETW with storage providers, and WPA shows I/O latency by layer. Use it to see which I/Os stalled and for how long.\n- **Health and load:** `Get-StorageReliabilityCounter` (temperature, error totals, wear), `Get-PhysicalDisk`, `diskspd` or Windows fio for stress.\n- **Gaps:** no setpci, no direct register access from user mode, and limited raw NVMe log access with the inbox driver. Use vendor CLI tools or an NVMe passthrough tool. A practical trick is to boot a Linux live image on the same hardware and run lspci, setpci and nvme-cli there.","pitfall":"Assuming the absence of WHEA events means the link had no errors. It only means none were reported to the OS.","verify":"DEVPKEY names for link speed and width, WHEA-Logger event IDs, stornvme and storport reset event IDs, and whether your NVMe passthrough tool supports the log pages you need.","follow":[{"q":"Windows shows no PCIe errors but the drive drops. Is the link healthy?","a":"Not proven. Firmware may own AER so the OS never sees it, and the WHEA channel may be filtered. Check platform settings and use vendor or analyzer data."},{"q":"Why compare Windows and Linux on the same box?","a":"It splits OS and driver behavior from hardware. If the failure follows the hardware in both, the cause is below the OS."}],"mod":17},{"id":"17.04","level":"Intermediate","type":"Concept","fig":"stack","tags":["method","triage","bisect","layers"],"q":"What is your disciplined method for debugging a PCIe or NVMe failure?","short":"Define the failure precisely with numbers. Capture state before any reset destroys it. Split host, device and channel by swapping parts. Reduce variables. Bisect firmware, BIOS, OS, slot and drive. Reproduce with statistics so you know the failure rate. Then root-cause layer by layer from physical to LTSSM to Data Link to Transaction Layer to NVMe, and stop at the lowest layer that shows an anomaly.","deep":"1. **Define:** one sentence with a rate, for example \"1 in about 200 warm reboots the SSD is absent at enumeration, Gen5 slot 3, BIOS 2.1\". If you cannot write it, you are not ready to debug.\n2. **Capture first:** config space of the SSD and every upstream port, AER, LnkSta and LnkSta2, dmesg, NVMe logs, SSD debug logs, temperature. Analyzer ring buffers and SSD RAM logs are overwritten or lost by the next reset.\n3. **Split:** known-good SSD in the failing host, failing SSD in a known-good host, different slot or cable. The failure follows the culprit.\n4. **Reduce:** lowest speed that fails, ASPM off, one drive, minimal load, a pre-OS environment.\n5. **Bisect:** binary search on firmware, BIOS, OS and driver versions.\n6. **Reproduce with statistics:** for a 2 percent failure, a fix needs about 150 clean trials for 95 percent confidence, not 10 (rule of three, see the scenarios module).\n7. **Layer checklist:**\n   - Physical: power, refclk, channel, margin.\n   - LTSSM: state history, equalization result, speed and width.\n   - Data Link: Bad TLP, Bad DLLP, replay, flow control initialization.\n   - Transaction Layer: poison, UR, completion timeout, MPS and MRRS, ordering.\n   - NVMe: CSTS, queues, interrupts, firmware state.\n8. **Close the loop:** verify the fix at the failure rate, and add a regression test.","pitfall":"Changing several variables at once (new BIOS, new drive, new cable) and losing the ability to say which one mattered.","verify":null,"follow":[{"q":"Why stop at the lowest anomalous layer?","a":"Upper-layer symptoms are usually consequences of lower-layer faults. A replay storm explains latency spikes, but the reverse is rarely true."},{"q":"What is the exception?","a":"A firmware hang can leave every PCIe layer clean while NVMe commands time out, so clean lower layers push you up to the device, not further down."}],"mod":17},{"id":"17.05","level":"Intermediate","type":"Cross-layer","fig":null,"tags":["ssd-side","telemetry","uart","jtag","firmware-counters"],"q":"What visibility does the SSD itself give you for PCIe problems, and what do you ask the firmware team to provide?","short":"The SSD can log what no external tool can: its own LTSSM history, Recovery and speed-change counts, equalization results, per-lane margin, Bad TLP and replay counters as its MAC saw them, and which reset (PERST#, CC.EN, FLR, subsystem reset) arrived and when. Access is through vendor log pages, host-initiated and controller-initiated telemetry, UART and JTAG.","deep":"- **Vendor log pages:** Get Log Page with a vendor-specific log identifier returns firmware counters and trace buffers.\n- **Telemetry:** the host-initiated log is a snapshot the host requests on demand. The controller-initiated log is created by the SSD itself on an internal event such as an assert, so it can capture the state of a crash.\n- **UART:** a firmware console for prints, register peeks and history dumps. **JTAG or SWD:** halts cores and reads the PCIe controller and PHY registers directly, useful when the firmware is hung.\n- **Counters to request:**\n  - LTSSM state history ring with timestamps.\n  - Recovery entries by reason, speed changes and failed speed changes, down-configuration events.\n  - Equalization phase results and the final preset or coefficients per lane.\n  - Bad TLP, Bad DLLP, LCRC, replay and Receiver Error counts, and flow control stall counts.\n  - Reset events with cause and timestamp, and the firmware boot phase timeline.\n- **Why it matters:** it is the only view of the SSD's own receiver and the only proof of which reset the SSD actually saw.\n- **Limits:** admin commands cannot read logs when the link is down, so the important data must be persisted or held for a UART or JTAG dump. A debug firmware build can change timing and hide a race.","pitfall":"Trusting a debug-build result for a timing-sensitive failure. If the failure disappears on the debug build, timing changed.","verify":"Log identifiers for the Error Information, SMART, Telemetry Host-Initiated and Telemetry Controller-Initiated pages and the vendor-specific range in the NVMe Base Specification, and any standardized telemetry defined by the OCP Datacenter NVMe SSD specification.","follow":[{"q":"How do you line up an SSD-side log with a host-side trace?","a":"Use a shared marker: a GPIO toggle from firmware, a unique command ID or LBA, or an analyzer trigger, since the clocks differ."},{"q":"Who should define the counter set?","a":"Validation, with firmware. Ask for counters that map to the layer checklist and that are readable in production firmware, not just a debug build."}],"mod":17},{"id":"17.06","level":"Intermediate","type":"Concept","fig":null,"tags":["analyzer","interposer","probe","visibility"],"q":"Compare protocol analyzer connection methods, and what an analyzer can and cannot see.","short":"An interposer sits between slot and device, a mid-bus probe attaches to a footprint designed into the board, and a cable or in-line tap sits inside a cabled link. All decode ordered sets, TLPs and DLLPs in both directions and follow the LTSSM. They cannot see analog quality, the device's internal state, or what the device's own receiver decoded. Any interposer changes the channel, which is a real Gen5 pitfall.","deep":"- **Interposer or in-line tap:** convenient, needs no board planning. It adds a connector pair, trace length and possibly an active retiming stage, so loss and reflections change.\n- **Mid-bus probe:** a footprint (pads or a probe connector) on the board under test, giving the least disturbance, but it must be designed in.\n- **What is visible:** framing, TLP headers and payloads, sequence numbers, LCRC as seen at the tap, Ack and Nak DLLPs, UpdateFC values, SKP and other ordered sets, EIEOS and EIOS, timing between events, and an inferred LTSSM state trail.\n- **What is not:**\n  - The device's receiver view. An LCRC error at the analyzer may be the analyzer's own front end, and a clean capture can hide an error the device saw.\n  - Analog margin and the internal eye.\n  - Internal credit state, firmware state and NVMe internals, except as they show on the wire.\n  - Behavior with the reference clock gated in L1.2, and sometimes the speed-change moments, where the analyzer may relock.\n- **The interposer effect:** a channel with little margin at Gen5 can train at Gen4, or become unstable, once an interposer adds a few dB of loss at Nyquist. An active interposer can also help a marginal channel and hide the fault.\n- **Rule:** compare LnkSta, AER counts and lane margin with and without the interposer before trusting a trace. If the failure changes, capture with a mid-bus probe or use device-side logging.","pitfall":"Treating an analyzer capture taken through an interposer as a neutral observation of the failing link.","verify":"The additional loss and retiming behavior of your specific interposer at 16 and 32 GT/s from the vendor, and how your analyzer handles speed changes and L1.2.","follow":[{"q":"The failure disappears with the interposer installed. What do you conclude?","a":"The interposer changed the channel or timing, so the failure is likely margin or timing related. Verify with margining, and capture from a mid-bus probe."},{"q":"Can the analyzer prove a receiver bug?","a":"Only as a witness. If the wire shows a good TLP and the device NAKs it, the receiver is suspect, but the analyzer's own tap position and equalization can disagree with the device."}],"mod":17},{"id":"17.07","level":"Advanced","type":"Concept","fig":null,"tags":["analyzer","trigger","filter","timestamp","correlation"],"q":"How do you set up analyzer triggers, filters and timestamp correlation so the capture actually contains the failure?","short":"Trigger on the symptom: a Nak DLLP, a replayed sequence number, Recovery entry from L0, a completion with UR or CA status, a poisoned TLP, or a missing completion. Place the trigger so most of the buffer holds the time before it. Use capture filters sparingly because dropped data is lost, and correlate timestamps with shared markers such as command IDs or a hardware trigger between instruments.","deep":"- **Useful triggers:**\n  - Nak DLLP, or the same sequence number appearing twice (a replay).\n  - LTSSM leaving L0 for Recovery, not counting L1 exit.\n  - Completion status UR or CA, poisoned TLP (EP bit), ECRC error.\n  - A non-posted request with no completion within a set time.\n  - A specific address range, TLP type, length or tag.\n  - An external signal such as PERST# or a firmware GPIO.\n- **Trigger position:** most failures are caused by something earlier. Use a mostly pre-trigger buffer so you see the lead-up, not just the event.\n- **Filters:** a capture filter (drop idle, SKP, Ack and UpdateFC DLLPs, or truncate payloads) extends capture time but permanently drops evidence. Ack and UpdateFC matter for flow control and replay debug, so keep them in that case. Display filters are lossless.\n- **Timestamp correlation:** the analyzer, host and SSD clocks are different domains.\n  - Use the NVMe Command Identifier in the SQE and CQE to tie a host trace (blktrace, ftrace nvme events) to TLPs.\n  - Have firmware toggle a GPIO wired to an analyzer or scope trigger input.\n  - Use trigger out of the analyzer to trigger the scope, so the analog eye is captured at the moment of the Nak.\n- **Buffer sizing:** see the capture-time numeric question in this module.","pitfall":"Free-running a capture and stopping it by hand after noticing the failure. The lead-up has been overwritten.","verify":null,"follow":[{"q":"Why not capture everything with no filter?","a":"Full-rate capture fills a large buffer in seconds, so you would catch only the last few seconds before you stopped, not the failure."},{"q":"What if the failure happens once per day?","a":"Use a ring buffer with a hardware trigger on the earliest symptom, header-only capture, and automation to save and re-arm on each trigger."}],"mod":17},{"id":"17.08","level":"Intermediate","type":"Concept","fig":null,"tags":["scope","bert","eye","jitter","connector"],"q":"What does an eye measured at the connector tell you, and what does it not tell you about the receiver?","short":"A scope at the connector or a test fixture shows the transmitter's output, jitter, presets and reference clock, and the channel's effect if you probe beyond it. At Gen3 and above the raw eye is often closed by channel loss, so the tools apply reference equalization in software. It does not show the receiver's internal eye after its own CTLE, DFE and clock recovery, so a closed connector eye can still run error-free and a clean one can still fail.","deep":"- **Scope and eye tools:** Tx eye height and width against the compliance mask after a reference channel and reference receiver model, swing, common mode, presets P0 to P10, and refclk jitter and spread-spectrum profile.\n- **BERT:** stresses the receiver with calibrated jitter and noise, and counts errors, usually through loopback. Result: does the DUT keep the BER target under defined stress.\n- **What the connector eye means:** it characterizes the transmitter and the channel up to that point. It cannot include the receiver's adaptation.\n- **The internal eye:** the eye at the slicer after CTLE and DFE is not available on a scope. Lane margining is the tool that reaches it, by moving the receiver's own sampler.\n- **Practical limits:**\n  - Probing needs a test fixture or breakout, and the probe or fixture adds loading and needs de-embedding.\n  - The link must run a known pattern or compliance state, which is not the live-traffic condition.\n  - Bandwidth and cost of Gen5 real-time scopes are high.\n- **Use:** scope for the transmitter and refclk (compliance, characterization), margining for the receiver in system.","pitfall":"Judging a Gen4 or Gen5 link by an unequalized eye at the pins. The spec measures after reference equalization for a reason.","verify":"Reference channel, reference receiver and test-point definitions in the PCI-SIG electrical test specification for your generation.","follow":[{"q":"The connector eye is closed at Gen5 but the link is stable. Is that a problem?","a":"Not by itself. The receiver equalizes the loss, so what counts is the eye after equalization. Use margining and error rates to judge."},{"q":"The eye looks great but Bad TLPs are high. Where do you look?","a":"The receiver side: its equalization result, power noise, clock recovery, or crosstalk that the transmit-side view does not show. Run margining on that lane."}],"mod":17},{"id":"17.09","level":"Advanced","type":"Concept","fig":null,"tags":["margining","lane-margining","automation","receiver"],"q":"Why is lane margining at the receiver the best in-system tool, and how do you use it in a validation flow?","short":"It measures how much timing and voltage margin the real receiver has after its real equalization, per lane, on a live link, on a customer or lab system, with no extra hardware in the channel. It is scriptable across resets, temperatures and units, so you get margin distributions, not a single reading. It tells you how much margin exists, not why it is small, and the values are implementation-specific.","deep":"- **Why it is best:** the sample point is inside the actual receiver, after CTLE and DFE. Nothing is added to the channel, and it runs on production systems.\n- **Mechanism (see the Physical Layer module):** the Lane Margining at the Receiver capability provides per-lane controls to shift the sampling point in time or voltage and count errors against a limit. Software drives it from the Downstream Port side.\n- **Validation flow:**\n  1. Confirm the capability exists on the port and device, and that BIOS has not blocked it.\n  2. Establish a baseline distribution on known-good units and slots.\n  3. Margin every lane in both directions (each direction has its own receiver) at each speed, temperature and voltage corner.\n  4. Record the worst lane, the spread across lanes, and the change from baseline.\n  5. Gate on thresholds from silicon characterization, and trend across firmware, BIOS and reset cycles.\n- **Retimers:** the margining protocol can address retimer receivers too, so a retimed link can be examined per segment, if the retimer supports it.\n- **Interpretation:** a lane with much less margin than its neighbors points at a via, connector pin or PHY lane. Uniformly low margin points at loss, clock, or power. Falling margin with temperature points at a thermally sensitive component.\n- **Limits:** implementations differ in step count, resolution, and whether the error sampler is independent of the data path, so compare within one design. Margin is not a substitute for an error-rate test.","pitfall":"Reporting one margin number per link. Report per lane and per direction, since the worst lane decides the link.","verify":"Which data rates require Lane Margining at the Receiver support (and whether voltage margining is mandatory), the extended capability ID (0027h), the retimer receiver numbering, and the pciutils margining tool (pcilmr) and its minimum version.","follow":[{"q":"Which direction does margining at the root port measure?","a":"The SSD-to-host direction: the SSD transmitter, the channel and the root port receiver. Margining at the SSD receiver measures host to SSD."},{"q":"Does the platform always let you margin?","a":"No. Some root ports do not implement it or firmware locks it, so plan for the case where only the SSD side can be margined."}],"mod":17},{"id":"17.10","level":"Intermediate","type":"Concept","fig":null,"tags":["compliance","pci-sig","integrators-list","cbb","clb","loopback"],"q":"How does the PCI-SIG compliance program work at a concept level, and what do the test boards and loopback do?","short":"PCI-SIG runs Compliance Workshops where members test devices, and devices that pass are listed on the Integrators List. Electrical testing uses a Compliance Base Board (CBB) to test add-in cards and a Compliance Load Board (CLB) to test host systems. The tests cover transmitter, receiver, reference clock and channel. Receiver tests put the device into Loopback so a BERT can count errors on stressed data.","deep":"- **Compliance Workshops:** organized events where members test products with the reference test equipment and against other members' products.\n- **Integrators List:** the public list of products that passed the program for a given generation and form factor. It is what integrators consult for a pass.\n- **CBB and CLB:** the CBB is a reference host board into which an add-in card under test is inserted, with breakout to instruments. The CLB plugs into a system's slot as a reference load and lets the host's transmitter and clock be measured.\n- **Tx test:** the device enters a compliance state and emits patterns (and steps through presets), and a scope checks eye, jitter, swing and preset accuracy against reference receiver models.\n- **Rx test:** a BERT sends a calibrated stressed signal. At Gen3 and above the BERT first goes through link training and equalization with the DUT, then puts it into Loopback so it returns the received bits for error counting.\n- **Refclk and channel tests:** refclk jitter and spread-spectrum, and insertion loss, return loss and crosstalk of connectors and cables.\n- **Meaning:** passing shows the design meets the electrical envelope under reference conditions. See the Physical Layer module for why customer systems can still fail.\n- **In-house use:** run pre-compliance on your own samples, and complement it with margin and link-up yield testing in real platforms.","pitfall":"Describing compliance as \"the SSD is certified for all systems\". It is a pass against reference conditions for a specific generation and form factor.","verify":"Exact names and status of the PCI-SIG workshop and Integrators List programs, which generations and form factors (M.2, U.2, E1.S, E3.S) have active compliance programs, the CBB and CLB usage rules, and the NVMe compliance program details.","follow":[{"q":"Does an NVMe SSD also need NVMe compliance?","a":"Yes, separately. NVMe protocol conformance and interoperability testing is run by a different program (commonly UNH-IOL) with its own integrators list."},{"q":"Why is Loopback needed at all for the Rx test?","a":"The BERT has no other view of what the device received, so the device echoes the bits back and the BERT counts the errors."}],"mod":17},{"id":"17.11","level":"Advanced","type":"Numeric","fig":null,"tags":["analyzer","capture-buffer","filtering","line-rate"],"q":"How long does a 64 GB analyzer capture buffer last at Gen4 x4 full line rate, and what does filtering buy you?","short":"A Gen4 x4 link carries about 7.88 GB/s per direction after decoding. Capturing both directions at full rate is about 15.75 GB/s, so 64 GB fills in about 4.1 seconds (8.1 s for one direction), and Gen5 x4 halves that to 2 seconds. Dropping TLP payloads keeps about 26 of about 282 bytes per 256 B TLP, roughly 11 times longer: about 44 s at saturation, and less of a gain for traffic that is mostly small TLPs, which shrink far less than payload-heavy traffic.","deep":"Assumptions: Gen4 x4, 16 GT/s x 4 lanes x 128/130, the analyzer stores about one byte per decoded byte with no compression, a 256 B payload with a 4DW header, and a 64 GB buffer. Real analyzers add timestamp and metadata, so treat this as an upper bound (vendor detail, VERIFY).\n1. Per direction: 16e9 x 4 x 128/130 / 8 = 7.877 GB/s.\n2. Both directions saturated: 2 x 7.877 = 15.75 GB/s. Time = 64 / 15.75 = **4.06 s**. One direction only: 64 / 7.877 = 8.1 s.\n3. Gen5 x4: double the rate, so 2.03 s for both directions.\n4. Filtering payloads: one 256 B TLP is 256 + 16 (header) + 2 (sequence number) + 4 (LCRC) + 4 (framing token) = 282 B. Keeping everything but the payload is 26 B, a ratio of 10.8. Saturated: 4.06 x 10.8 = **44 s**.\n5. A realistic 4 KB random read workload at 3.5 GB/s of payload: upstream about 3.5 x 282/256 = 3.9 GB/s, plus about 0.2 GB/s downstream (assumed: doorbells, SQE completions, DLLPs), so about 4.1 GB/s total. Unfiltered: 64 / 4.1 = **16 s**. Header-only: the upstream data shrinks to 3.9 x 26/282 = 0.36 GB/s, while the small downstream TLPs stay near 0.2 GB/s, so about 0.56 GB/s and 64 / 0.56 = **about 114 s**.\n6. SKP ordered sets are about 16 B per 370 or so blocks, roughly 0.3 percent. They clutter the trace but barely change capture time.\n\n- **Conclusion:** even 64 GB gives seconds to minutes. So capture must be trigger-driven, with a ring buffer, pre-trigger depth and header-only or otherwise filtered capture for anything that takes longer to happen than that.\n- **What filtering costs:** dropping payload loses data corruption evidence. Drop what the hypothesis does not need.","pitfall":"Quoting buffer time at full line rate for a trace of a real workload, or at the decoded rate for an analyzer that stores raw symbols with overhead.","verify":"How your analyzer stores data (raw symbols versus decoded, timestamp overhead, compression) and the SKP ordered-set interval for 128b/130b in the Base Specification.","follow":[{"q":"Which direction fills first in a read-heavy workload?","a":"Upstream, since the SSD sends the data. Some analyzers let you allocate buffer per direction or filter one side."},{"q":"How would you capture a failure that appears once per hour?","a":"Trigger on the earliest symptom, header-only, hardware-trigger a save, re-arm automatically, and log which triggers fired."}],"mod":17},{"id":"17.12","level":"Advanced","type":"Trap","fig":null,"tags":["lnksta","link-up","retrain","lbms","health"],"q":"The lab report says \"link up at Gen5 x4, so the link is healthy\". Why is that not proof, and what else do you check?","short":"LnkSta only reports the speed and width at the moment you read it. It does not say how many times the link retrained or downtrained on the way, how much margin the receiver has, whether one lane is nearly dead, what the error rate is under load, or whether it will come up again on the next reset or at temperature. Healthy needs evidence over time: error rates, Recovery counts, margin per lane, throughput, and link-up yield.","deep":"- **What \"up at Gen5 x4\" proves:** at some point the LTSSM reached L0 at that speed and width, and the Data Link Layer became active.\n- **What it does not prove:**\n  - **Stability:** a link that retrains every minute looks identical to a stable link when you read LnkSta between retrains.\n  - **Margin:** a link at the edge of its budget still trains. Margin per lane decides if it survives a hot day.\n  - **Error rate:** replays cost throughput without changing LnkSta.\n  - **Each direction and each lane:** a link with one weak lane is still \"x4\".\n  - **Repeatability:** one good boot says nothing about the yield over hundreds of resets.\n  - **Retimer segments:** each segment negotiates separately (see the Equalization and Retimers module).\n- **Evidence to collect instead:**\n  - Clear then read the sticky Link Bandwidth Management Status and Link Autonomous Bandwidth Status bits (lspci shows BWMgmt and ABWMgmt) after a soak. If they set, the link changed speed or width.\n  - Correctable AER rates per hour under load, Replay Number Rollover, and vendor Recovery counters.\n  - LnkSta2 equalization results and per-lane margin at both ends.\n  - Throughput against the link ceiling, and link-up yield over many resets.\n- **Reverse trap:** LnkSta at Gen4 on a Gen5 device may be a slot limit or Target Link Speed setting, not a fault. Compare with both ends' LnkCap and Link Control 2 first.","pitfall":"Signing off link health with one screenshot of lspci output.","verify":"The exact conditions that set Link Bandwidth Management Status and Link Autonomous Bandwidth Status in the Base Specification, which differ for hardware-initiated and software-initiated changes.","follow":[{"q":"How would you catch a link that downtrains and recovers?","a":"Poll LnkSta and the bandwidth status bits at a short interval, keep the LTSSM history from the SSD, and count Recovery entries."},{"q":"Is a link at less than max speed always broken?","a":"No. Check the capabilities and settings of both ends, including the slot, BIOS and ASPM policy, before calling it a fault."}],"mod":17},{"id":"17.13","level":"Advanced","type":"Debug","fig":"ltssm","tags":["ltssm","history","recovery","detect","cause-mapping"],"q":"You have an LTSSM state history for a failing link. How do you map the patterns to causes?","short":"Read where the machine loops and how often. Detect loops mean no receiver. Polling loops or Polling.Compliance mean no partner signal. A Recovery to Detect loop after a power cycle usually means a speed change or equalization that cannot complete. Periodic L0 to Recovery to L0 points to errors or lock loss under load. A Recovery followed by Configuration and a narrower width means a lane died.","deep":"| History pattern | Reading | Likely causes | Next evidence |\n|---|---|---|---|\n| Detect.Quiet and Detect.Active repeat | No receiver found | Device unpowered or held in reset, connector, missing lane | Rails, PERST#, connector, presence signals |\n| Polling.Active to Polling.Compliance | Termination present but partner silent | PERST# held, no refclk, firmware not started | Reset timing, refclk at the device |\n| Polling or Configuration back to Detect | Partner never completes training | Refclk, reset skew, signal integrity, lane wiring | Which lanes, TS1 seen or not |\n| L0 at Gen1, Recovery.Speed, Recovery.RcvrLock, timeout to Detect, repeated | Speed change fails and the link restarts | PLL or refclk at the higher rate, equalization failure, channel loss, retimer state, cold-only calibration | Force lower Target Link Speed, compare cold with warm, LnkSta2 equalization bits |\n| L0 to Recovery to L0 every few minutes | Errors or lock loss under load | Replay Number Rollover, Receiver Error, thermal drift, power noise, SSC | Correlate with load and temperature, Recovery initiator, AER |\n| Recovery to Configuration to L0 at lower width | A lane dropped out | Lane wiring, connector, PHY lane | Margin per lane, which lane went missing |\n| L0 to L1 to Recovery to L0 in microseconds | Normal ASPM traffic | None, but check exit latency | LTR and latency numbers |\n\n- **Count carefully:** exclude L1 exit Recoveries. Count Recovery entries from L0 per hour, and the duration in Recovery (microseconds versus milliseconds).\n- **Who initiated:** the analyzer shows which end left L0 first. The reason is in the controller's debug registers.\n- **The loop after a power cycle:** the link trained at Gen1, so Detect, Polling and Configuration are fine. The fault is in Recovery at the higher rate, and since a failed speed change should normally fall back to a lower speed, the return to Detect means the fallback also failed. Check for a retimer or clock that is not stable after a cold start.\n- State meanings and timeouts are in the LTSSM module.","pitfall":"Treating every Recovery entry as an error. L1 exit and speed changes go through Recovery by design.","verify":"Recovery sub-state transitions and timeouts that lead to Detect in your specification revision, and how your tool names the LTSSM states.","follow":[{"q":"Cold boot fails, warm reset works. What do you suspect?","a":"Power and reset sequencing, retimer or clock not ready, or temperature-dependent PLL calibration. Compare timing of rails, refclk and PERST# at both."},{"q":"How would you tell a bad lane from a bad channel?","a":"Margin per lane and per direction, and the lane numbers in the width change. One lane means a local fault, all lanes means loss, clock or power."}],"mod":17},{"id":"17.14","level":"Advanced","type":"Debug","fig":null,"tags":["temperature","bad-tlp","replay","throughput","eq-drift"],"q":"Sequential read throughput is 7.0 GB/s at 25 C but drops to about 6.2 GB/s at 70 C, and Bad TLP counts rise on the root port. How do you debug it?","short":"First prove it is PCIe replay and not SSD thermal throttling: check the SSD temperature and throttle counters, and compare the loss with the Bad TLP rate. An 11 percent loss implies a BER near 2e-6, or about 1e5 Bad TLPs per second. Then localize the temperature-sensitive part with local heating and cooling, run lane margining at both ends across temperature, and test whether a retrain at temperature restores the link.","deep":"1. **Rule out throttling:** `nvme smart-log` composite temperature and thermal management counters. Throttling cuts throughput without Bad TLPs. Here Bad TLPs rise on the receiver of the read direction, which is the root port, so replay is real.\n2. **Quantify with the replay model** (Data Link module, Gen4 x4, 282 B TLPs, window of 30 TLPs): efficiency = 1 / (1 + 67,200 x BER). A drop from 7.0 to 6.2 GB/s (efficiency about 0.886) gives BER = (1/0.886 - 1) / 67,200 = about 1.9e-6. Per-TLP error probability is 2240 x 1.9e-6 = 4.3e-3. At 7.0 GB/s that is about 24.8 million TLPs per second, so about 1e5 Bad TLPs per second.\n3. **Sanity check the counters:** if the measured rate is 10 per second, replay explains almost none of the loss. Note AER status bits are sticky flags and OS counters count reported events, so they undercount. Use the SSD's or root port's PHY counters, or the analyzer, for true rates.\n4. **Localize:** the chamber heats everything. Use a thermal head or spot heating and cooling on the SSD controller, the retimer, the root complex and the connector one at a time. Swap parts, and run margining on both ends at 25 C and 70 C.\n5. **Separate margin loss from stale equalization:** at 70 C, force a retrain (Retrain Link) or re-equalize. If errors vanish, equalization adapted at 25 C is stale. If they stay, real margin was lost.\n6. **Mechanisms to check:** channel and connector loss rising with temperature, CTLE or PLL drift in a PHY, refclk source or SSC generator drift, regulator noise at temperature.\n7. **Fix candidates:** re-equalization policy, preset tuning, clock or power fix, thermal design.","pitfall":"Blaming the SSD because it is the unit inside the chamber. The root port, retimer, board and connector are at 70 C as well.","verify":"Which correctable errors your root port reports and how the OS counts them, and the temperature and throttle fields in your drive's SMART log.","follow":[{"q":"LnkSta is unchanged at 70 C. Does that rule out link problems?","a":"No. Replays and Bad TLPs happen with the link staying at Gen4 x4. Only a retrain or downtrain would change LnkSta."},{"q":"What if the loss is 11 percent but Bad TLP rate is only about 50 per second?","a":"Replay is not the main cause. Look at thermal throttling, firmware behavior at temperature, or flow control and latency effects."}],"mod":17},{"id":"17.15","level":"Advanced","type":"Debug","fig":null,"tags":["warm-reboot","perst","enumeration","crs","timing"],"q":"An NVMe SSD sometimes disappears from the bus after a warm reboot but always shows up after a cold power cycle. How do you find out why?","short":"Warm reboot differs from cold in reset and power sequencing: the SSD keeps power, may not see a proper PERST# assertion, may have a dirty shutdown to recover from, and the BIOS enumerates on a fixed schedule. The suspects are the SSD being not ready in time, PERST# or refclk timing, and a link that does not retrain. Capture PERST#, refclk, the LTSSM and the first config reads at the failure to see which.","deep":"1. **Where does it fail?** The evidence points to a stage:\n\n| Observation at the failure | Meaning |\n|---|---|\n| LTSSM stays in Detect | No receiver termination: power, reset or connector |\n| Polling.Compliance | SSD terminated but silent: held in reset, no refclk, firmware not started |\n| L0 reached, config reads return CRS or the BIOS times out | SSD firmware not ready in time |\n| Config space reads fine, driver finds no controller | CSTS.RDY or firmware issue after enumeration |\n\n2. **Measure the reset:** scope PERST#, refclk and the 3.3 V rail through the reboot. Was PERST# asserted at all, for how long, and was refclk stable before it was released? The CEM parameters are about 100 ms from power valid to PERST# release, and refclk stable about 100 microseconds before release (VERIFY).\n3. **Dirty shutdown:** check `unsafe_shutdowns` in the smart-log. If a warm reboot without a shutdown notification forces power-loss recovery in firmware, the SSD may take seconds to become ready. A robust device brings the link up early and returns CRS or CSTS.RDY = 0 until ready. It should not delay training.\n4. **Time it:** from PERST# release to first TS1, to L0, to the first successful config read, and to CSTS.RDY. Compare the failing boot with a good one.\n5. **Confirm with a rescan:** after the OS is up, `echo 1 > /sys/bus/pci/rescan`. If the drive appears, the link and drive were slow, not dead.\n6. **Fix options:** firmware (start training and answer CRS sooner, shorten recovery), BIOS (longer wait or a proper PERST# pulse), platform (PERST# and refclk timing).","pitfall":"Treating a warm reboot as a mild cold boot. It removes the power cycle that cleans up the SSD, retimer and clock state.","verify":"PERST# and refclk tim
