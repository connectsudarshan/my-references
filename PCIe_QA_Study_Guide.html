ig":null,"tags":["runtime-d3","storage","nvme","d3cold","apst"],"q":"Why is Runtime D3 unusual for NVMe SSDs, and what do laptops use instead?","short":"Runtime D3 puts an idle device into D3hot or D3cold while the system is running. For an SSD the resume cost is large: a D3hot exit delay, a controller reset and reinitialization, and for D3cold also power and reset sequencing. Meanwhile APST plus link L1.2 already brings an idle SSD down to a few milliwatts with a millisecond-scale exit. So most systems keep the SSD in D0 and use D3 only for system sleep.","deep":"| Path | Typical exit cost | State preserved | Savings |\n|---|---|---|---|\n| Link L1.2 (ASPM) | tens of microseconds | Everything | PHY power |\n| NVMe non-operational PS via APST | about 1 to 10 ms (EXLAT) | Everything (queues, config) | NAND and controller power |\n| D3hot | 10 ms plus controller reinit | Config space only if No_Soft_Reset | Small extra over the two above |\n| D3cold | Hundreds of ms to seconds | Nothing (needs shutdown first) | Zero device power |\n\n- **Linux:** the PCI core has runtime PM (`power/control`, `power/runtime_status`), but the mainline NVMe PCI driver historically implements only system-sleep callbacks and uses APST for runtime savings. Suspend behaviour depends on heuristics (deepest power state versus full shutdown) and on the platform's StorageD3Enable property.\n- **Windows:** the storage stack supports device idle power management on platforms that declare storage devices safe for D3, and the results are visible in modern standby reports.\n- **State loss:** entering D3cold requires an NVMe shutdown first (see the NVMe shutdown question). Coming back is a full bring-up, and any outstanding I/O has already been drained.\n- **Where it does make sense:** data center and embedded designs that switch off whole slots, and platforms where the SSD sits behind a power-gated rail and the rail must drop for a battery target.","pitfall":"Validating only system suspend. Runtime idle transitions happen thousands of times a day and hit different code paths in the SSD firmware.","verify":"Whether the NVMe driver in your kernel version implements runtime PM, the StorageD3Enable handling and the current Windows behaviour for NVMe idle D3.","follow":[{"q":"Why not always use D3cold when idle?","a":"Resume latency and the risk of a failed re-initialization outweigh a few extra milliwatts. It also needs a clean shutdown each time."},{"q":"What must the driver do before D3cold?","a":"Drain I/O, delete queues, issue the NVMe shutdown notification and wait for completion, then save config state."}],"mod":11},{"id":"11.10","level":"Advanced","type":"Concept","fig":null,"tags":["l1ss","l1.1","l1.2","clkreq","t-power-on","ltr"],"q":"What are the L1 PM Substates, and what gates entry into L1.2?","short":"L1 PM Substates split L1 into L1.0 (classic L1), L1.1 and L1.2. In both new substates the CLKREQ# sideband is deasserted so the platform can stop the reference clock. L1.1 keeps the link common-mode voltage. L1.2 also drops it and powers down more of the PHY, which saves the most but exits the slowest, needing T_POWER_ON plus common-mode restore time. Entering L1.2 also requires that the device's LTR meets the L1.2 threshold.","deep":"- **Capability (extended, ID 001Eh):** supports for PCI-PM and ASPM flavours of L1.1 and L1.2, Port Common Mode Restore Time, and Port T_POWER_ON (a scale plus value).\n- **Control 1:** enables for PCI-PM L1.1, PCI-PM L1.2, ASPM L1.1, ASPM L1.2, the Common Mode Restore Time to use, and LTR_L1.2_THRESHOLD (value plus scale).\n- **Control 2:** T_POWER_ON the software programs (scale plus value).\n- **CLKREQ#:** an open-drain sideband. The device deasserts it to say \"you may stop the reference clock\" and asserts it to request the clock back. Both the device and the platform's clock buffer must be wired for it.\n- **L1.1 exit:** restart the clock, then normal Recovery.\n- **L1.2 exit:** after CLKREQ# assertion the ports wait T_POWER_ON, re-establish common mode (Common Mode Restore Time), then run Recovery.\n- **LTR gate:** the port may enter L1.2 only if the latency tolerance the device has reported is at least LTR_L1.2_THRESHOLD, which the OS sets from the exit times. A device that reports a tight tolerance stays out of L1.2.\n\n```\nL1SubCap: PCI-PM_L1.2+ PCI-PM_L1.1+ ASPM_L1.2+ ASPM_L1.1+ L1_PM_Substates+\n          PortCommonModeRestoreTime=10us PortTPowerOn=10us\nL1SubCtl1: PCI-PM_L1.2+ PCI-PM_L1.1+ ASPM_L1.2+ ASPM_L1.1+\n          T_CommonMode=0us LTR1.2_Threshold=0ns\nL1SubCtl2: T_PwrOn=10us\n```\n(Illustrative lspci output.)","pitfall":"Assuming L1.2 is only an SSD setting. It needs the SSD, the root port, the clock buffer and the OS all agreeing on timings.","verify":"L1 PM Substates capability ID, register offsets, field names and bit positions, the exact meaning and interaction of T_POWER_ON and Common Mode Restore Time, whether the PCI-PM L1.2 entry also depends on the LTR threshold, and the snoop versus non-snoop rule for the LTR threshold.","follow":[{"q":"Why does L1.2 fail on some platforms even when the SSD supports it?","a":"CLKREQ# is not routed to the clock source, the clock takes longer to become stable than the programmed T_POWER_ON, or no LTR is being sent."},{"q":"What is the difference between PCI-PM and ASPM substate enables?","a":"PCI-PM substates apply when software put the device in D3hot, ASPM substates when the link goes idle in D0."}],"mod":11},{"id":"11.11","level":"Advanced","type":"Concept","fig":null,"tags":["ltr","obff","snoop","latency","l1.2"],"q":"What is Latency Tolerance Reporting, and why does an SSD send it?","short":"LTR is a message (Msg TLP) in which a device tells the platform the longest latency it can tolerate for memory requests it makes, given separately for snooped and non-snooped traffic. The platform uses the tightest value it has collected to decide how deep the CPU package, memory and PCIe links may sleep. An SSD sends a tight value when it has work and a large one when idle, which lets the link enter L1.2 and the SoC enter deep idle.","deep":"- **Enable:** Device Capabilities 2 advertises LTR support, and Device Control 2 has the LTR Mechanism Enable bit. The LTR extended capability holds Max Snoop Latency and Max No-Snoop Latency, which cap what the device may report.\n- **Message content:** for snoop and non-snoop, a value (10 bits), a scale (3 bits) and a Requirement bit. Scale steps are 1 ns, 32 ns, 1,024 ns, 32,768 ns, 1,048,576 ns and 33,554,432 ns, so the largest expressible tolerance is about 34 ms.\n- **Snoop and non-snoop:** snoop traffic is cache-coherent DMA, non-snoop is traffic that bypasses CPU caches. The platform's wake cost differs, so the device reports both.\n- **Aggregation:** switches combine the LTR of downstream ports (the minimum) and forward one upstream.\n- **What an SSD does:** in an active phase, it reports a small value (tens of microseconds) so that host memory responds fast. With empty queues and no background work, it reports a large value or no requirement.\n- **What LTR gates:** the LTR_L1.2_THRESHOLD check on the link (previous question) and the platform's package C-state selection.\n- **OBFF:** Optimized Buffer Flush/Fill lets the platform hint to devices when it is awake so that they batch their DMA. It is rarely used in practice and LTR does the practical work.","pitfall":"Treating LTR as a link-level feature. It is a system-level input, and a wrong value costs power at the package, not just at the link.","verify":"LTR message format and encodings, Requirement bit semantics, aggregation rules, behaviour when no LTR has been sent, and OBFF status in your Base Specification revision.","follow":[{"q":"What happens if a device never sends LTR?","a":"The result depends on the platform policy and the Requirement bit rules. Many platforms then treat the device as unconstrained, but some keep the package shallow. Measure it, do not assume."},{"q":"Why does an idle SSD sometimes block deep package idle?","a":"Its last LTR was small (or zero) and was never relaxed, or its firmware keeps sending updates because of background activity."}],"mod":11},{"id":"11.12","level":"Advanced","type":"Concept","fig":null,"tags":["apst","nvme","idle-timer","table","linux"],"q":"How does NVMe Autonomous Power State Transition work, and what does the table contain?","short":"APST lets the controller move itself to a lower power state after being idle. The host writes a table through Set Features (Feature ID 0Ch) with one entry per current power state: an idle time prior to transition (ITPT, in milliseconds) and an idle transition power state (ITPS). Idle time counts from the last command in the current state, and the controller returns to an operational state when a command arrives. Support is reported by Identify Controller.","deep":"- **Table format:** 32 entries of 8 bytes in a 256-byte buffer. Entry N applies when the controller is in power state N. Bits 7:3 are ITPS and bits 31:8 are ITPT. ITPT of zero means no transition.\n- **Enable:** bit 0 of CDW11 (APSTE). Identify Controller has an APST attribute that says whether the controller supports it.\n- **Linux approach** (`nvme_core.default_ps_max_latency_us`, default 100000): consider each non-operational state whose exit latency is within the limit, and set the idle time to 50 times (ENLAT + EXLAT), rounded up to milliseconds. Setting the limit to 0 disables APST.\n\nWith the sample descriptors from the previous power-state question:\n\n| Current state | Idle time | Target |\n|---|---|---|\n| PS0, PS1, PS2 (assumed operational) | 71 ms (50 x 1,410 us) | PS3 |\n| PS3 | 500 ms (50 x 10,000 us) | PS4 |\n| PS4 | none | none |\n\n- **Why 50 times:** the time in a state has to repay the energy spent entering and leaving it. The multiplier is a heuristic and errs toward staying awake.\n- **Interaction with the workload:** any command resets the idle timer. A background writer that touches the drive every 400 ms never lets the state ladder reach PS4.\n- **Known problems:** some SSDs misbehave in the deepest state or with APST at all, so Linux carries quirks that disable APST or the deepest state for specific models.","pitfall":"Comparing APST settings across kernels without noting the driver's latency limit. Two systems with the same drive can pick different target states.","verify":"The APST table encoding (ITPS and ITPT bit positions), Feature ID 0Ch, the Identify Controller APST attribute, which operational state the controller returns to, and the driver's current formula and quirk list.","follow":[{"q":"Is the host aware when APST changes state?","a":"Not by any notification. Get Features (Power Management) returns the state the host last set, which may not reflect an APST-driven transition, so the transitions are silent to the host (verify on your controller)."},{"q":"What extra latency does an I/O see after APST entry?","a":"Up to EXLAT for the state plus link exit latency. It shows up as first-I/O latency after idle."}],"mod":11},{"id":"11.13","level":"Advanced","type":"Cross-layer","fig":null,"tags":["shutdown","cc-shn","csts-shst","d3","rtd3","unsafe-shutdown"],"q":"How does the NVMe Shutdown Notification relate to PCIe D3, and in what order do you use them?","short":"They are independent. CC.SHN (normal or abrupt) tells the NVMe controller to flush and finish so that power can go away safely, and CSTS.SHST reports processing then complete. PCIe D3 only changes function and link power. Before removing power (D3cold) you do the NVMe shutdown first, wait for SHST to show complete, then move to D3hot and let the platform cut power. D3hot alone is not a flush.","deep":"1. Quiesce: stop new I/O, wait for outstanding commands, delete queues.\n2. Write CC.SHN = normal shutdown notification.\n3. Poll CSTS.SHST until it reads shutdown processing complete. Use a timeout based on the controller's reported RTD3 entry time (Identify Controller) or a driver default.\n4. Save PCI config state and write D3hot in PMCSR. The link goes to L1.\n5. If the platform removes power, PME_Turn_Off and the L2 sequence follow (LTSSM module).\n6. Resume: restore power and link, restore config, then reset the controller (CC.EN 0 then 1) and rebuild admin and I/O queues.\n\n- **Abrupt shutdown:** used when there is no time for a full flush (emergency, hung device). It is less clean, and the controller may need extra recovery work at next power-up.\n- **Unsafe shutdowns:** the SMART/Health log keeps a count of power losses that happened without a shutdown notification. It is the field evidence that a platform skipped step 2.\n- **After SHST complete:** the controller does not accept I/O until it is reset. Sequencing the shutdown before D3hot is a software step, and no hardware does it for you.\n- **Link loss is not a shutdown:** an SSD whose link drops (DPC, surprise removal) receives no notification and stays powered.","pitfall":"Assuming the PCIe PME_Turn_Off handshake flushes the SSD. It only quiesces the link. The flush is the NVMe shutdown.","verify":"CC.SHN and CSTS.SHST bit positions and encodings, the RTD3 entry and resume fields, the default shutdown timeout used by your OS driver, and what the NVMe Base Specification requires before entering D3.","follow":[{"q":"Is a normal shutdown needed before D3hot if power stays on?","a":"Generally not for data safety, because the device stays powered. It is needed before power removal or when the platform may remove it without warning."},{"q":"What do RTD3 Entry and Resume Latency tell you?","a":"The controller's worst-case time to complete a normal shutdown and to resume from a D3-style power cycle, so the host can size its timeouts."}],"mod":11},{"id":"11.14","level":"Advanced","type":"Numeric","fig":null,"tags":["numeric","exlat","enlat","latency-budget","l1.2"],"q":"Given the NVMe power states below and a link that wakes from L1.2, which states are permissible for a host that tolerates 5 ms, and for one that tolerates 10 ms?","short":"Wake latency is roughly link exit plus EXLAT. With link exit assumed at 0.11 ms, PS3 wakes in 1.31 ms and PS4 in 9.11 ms. At a 5 ms tolerance only PS3 is permissible. At 10 ms, PS4 passes the typical case (9.11 ms) but fails the conservative case where I/O arrives just as entry starts (10.11 ms), so it depends on whether the limit is soft or hard.","deep":"Assumptions (all illustrative): PS3 has ENLAT 210 us and EXLAT 1,200 us. PS4 has ENLAT 1,000 us and EXLAT 9,000 us. Link exit from L1.2 is 110 us, taken as a conservative sum of T_POWER_ON (70 us), common mode restore (10 us) and Recovery and clock restart (30 us).\n\n1. Typical wake: link exit + EXLAT. PS3: 0.11 + 1.20 = 1.31 ms. PS4: 0.11 + 9.00 = 9.11 ms.\n2. Conservative wake (I/O arrives while the entry is in progress and must wait for it): link exit + ENLAT + EXLAT. PS3: 0.11 + 0.21 + 1.20 = 1.52 ms. PS4: 0.11 + 1.00 + 9.00 = 10.11 ms.\n3. Compare with 5 ms: PS3 passes both (1.31 and 1.52). PS4 fails both. Even the EXLAT alone (9 ms) fails.\n4. Compare with 10 ms: PS3 passes. PS4 passes typical (9.11 ms) and fails conservative (10.11 ms) by 0.11 ms.\n5. APST idle timers under the Linux rule: PS3 at 50 x (210 + 1,200) us = 70.5 ms, so 71 ms. PS4 at 50 x (1,000 + 9,000) us = 500 ms.\n6. Sanity check on energy: assume 2 W during transitions. Enter and exit cost 2 W x 10 ms = 20 mJ. PS4 saves 40 mW - 5 mW = 35 mW over PS3, so break-even is 20 mJ / 35 mW = about 0.57 s. The 500 ms timer is the same order.\n\n- **Decision rule:** for a soft target (median or p99 responsiveness) use the typical wake. For a hard bound use the conservative wake and add margin.\n- **Where the numbers come from:** ENLAT and EXLAT from Identify Controller, link exit from the L1 substate registers (or measured), tolerance from the OS policy or workload.","pitfall":"Checking EXLAT alone. The link exit and the entry-in-progress case both add to the real worst-case wake.","verify":"Whether T_POWER_ON and common mode restore overlap or add in the spec, and how the NVMe Base Specification defines ENLAT and EXLAT when a command arrives during entry.","follow":[{"q":"Would the answer change on a platform with L1.1 only?","a":"The link exit is shorter (no common mode restore), so PS3 and PS4 shift by tens of microseconds. The NVMe part still dominates."},{"q":"What if the SSD advertises EXLAT smaller than what you measure?","a":"That is a firmware or spec violation. Measure EXLAT in validation (see the scale question) and file it against the device."}],"mod":11},{"id":"11.15","level":"Advanced","type":"Debug","fig":null,"tags":["debug","l1.2","d3","recovery","aer","dmesg"],"q":"An SSD works for hours, then fails to respond after an idle period (an L1.2 exit) or never returns from D3. What do you collect, and what experiments do you run?","short":"First classify the failure: is the link gone (reads return all ones, LnkSta not active), degraded (down-trained, Recovery loops) or up with a dead controller (CSTS not ready). Collect LnkSta, AER counters, LTSSM Recovery counts around the event, dmesg, and the exact ASPM and substate settings. Then bisect by turning features off one at a time: L1.2, then all ASPM, then APST. If disabling L1.2 fixes it, the exit timing or clock is suspect.","deep":"| Evidence | What it tells you |\n|---|---|\n| Config reads return FFFFFFFF, `DLActive-` | Link not up: the exit from L1.2 or D3cold did not train |\n| `LnkSta` speed lower than `LnkCap` | It retrained but fell back (equalization or margin) |\n| Recovery count per L1 exit above 1 | The exit needed several attempts: T_POWER_ON, clock start or CMRT too short |\n| AER correctable (RxErr, BadTLP) spikes right after wake | Receiver had not stabilized. Marginal exit |\n| AER uncorrectable or DPC event | Consequence, not root cause. Look for the first error |\n| `CSTS = 0xffffffff` or RDY clear | Link gone (all ones) versus controller alive but not ready |\n| dmesg: `Unable to change power state from D3cold to D0, device inaccessible` | Config space unreadable on resume |\n| dmesg: `controller is down; will reset: CSTS=0xffffffff` | The driver saw all ones on MMIO |\n\nTypical message wording differs by kernel; read the sequence, not the exact text.\n\n1. Record the environment: BIOS, kernel and firmware versions, temperature, `lspci -vv` for both ends (LnkCtl, L1SubCtl1 and 2, DevCtl2 LTR enable).\n2. Reproduce with a scripted idle-then-I/O loop and note the idle time that fails. A fixed idle time that always fails points at a timer (APST idle timer, ASPM idle timer or LTR threshold).\n3. Bisect:\n   - Disable L1.2 alone (`echo 0 > /sys/bus/pci/devices/<BDF>/link/l1_2_aspm`), then L1.1, then all ASPM (`pcie_aspm.policy=performance`).\n   - Disable APST (`nvme_core.default_ps_max_latency_us=0`) to separate NVMe state from link state.\n   - For D3, try a different resume path (D3hot only versus D3cold).\n4. Vary conditions: temperature, supply voltage, reference clock (SSC on and off), and the slot or root port.\n5. Capture the wake on a protocol analyzer or LTSSM log: CLKREQ# assertion, clock stable time, Recovery entries and the first TS1.","pitfall":"Fixing the symptom by disabling ASPM everywhere and closing the bug. The platform then ships with a latent defect that another SSD or BIOS will expose.","verify":"dmesg wording on your kernel, the sysfs link attribute names, and how your vendor tooling exposes LTSSM Recovery counts.","follow":[{"q":"L1.2 off fixes it. Is the SSD at fault?","a":"Not necessarily. The exit budget is shared between the SSD, the root port, the clock buffer and the board. Compare the programmed T_POWER_ON with the measured clock stable time."},{"q":"It fails only when cold. Why?","a":"Regulator and clock start-up times stretch at low temperature, so a marginal T_POWER_ON that works at room temperature no longer covers them."}],"mod":11},{"id":"11.16","level":"Principal","type":"Cross-layer","fig":null,"tags":["laptop","s0ix","modern-standby","ltr","pmc","l1.2","apst"],"q":"How do NVMe non-operational states and link L1.2 combine in a real laptop idle or standby, and how do you check that they do?","short":"The platform reaches its deepest idle only if three layers agree: the SSD sits in its deepest non-operational state, the link is in L1.2 with CLKREQ# deasserted so the clock can stop, and the SSD's LTR is relaxed so the SoC may enter deep package idle. If any leg is missing, the whole platform stays awake. Check each leg separately, then check the platform residency counters.","deep":"- **Leg 1, NVMe:** the SSD must actually reach the deepest state. Background housekeeping, periodic OS writes shorter than the APST idle time, or a quirk that disables the deepest state all keep it up. In suspend-to-idle the Linux driver may either put the SSD in the deepest power state (relying on ASPM) or shut it down fully, depending on heuristics and platform properties.\n- **Leg 2, link:** ASPM L1.2 must be enabled at both ends, CLKREQ# wired, and the LTR threshold satisfied.\n- **Leg 3, LTR:** a small or missing LTR from any device keeps the package shallow. Any one device can pin the platform.\n- **Evidence to collect:**\n  - SSD power at the rail with a power analyzer at a stable idle (compare to the datasheet in the deepest state).\n  - Link state through `lspci -vv` and the platform's L1 residency counters where available.\n  - Platform residency: on Intel systems package C-state and S0ix residency (`turbostat`, the PMC core debugfs files including LTR and residency, Windows `powercfg /sleepstudy`).\n  - The LTR the SSD currently reports and which device is the blocker.\n- **Failure ladder:** SSD in PS0 with L1 only costs hundreds of milliwatts. PS4 with a link stuck in L0 wastes the PHY power. Good PS4 and L1.2 with a bad LTR loses the SoC savings, which are the largest.\n- **Wake side:** the first I/O after wake pays link exit plus EXLAT. A laptop must confirm that resume-time storage reads still meet the OS's expectations.","pitfall":"Trusting the SSD's own report of being idle. Measure power and platform residency. A state that is configured but never reached earns nothing.","verify":"Platform specifics: the PMC core debugfs file names, the Windows sleepstudy and modern standby storage requirements, StorageD3Enable handling, and the Linux suspend-to-idle NVMe decision logic for your kernel.","follow":[{"q":"How does a data-center SSD differ?","a":"Latency-critical servers usually disable ASPM and APST and stay in PS0 and L0. The validation goal is then stability at full power, not idle savings."},{"q":"Why validate per firmware version?","a":"Idle behaviour is firmware policy (timers, background scheduling, LTR updates). A new firmware can silently stop reaching PS4."}],"mod":11},{"id":"11.17","level":"Principal","type":"Scenario","fig":null,"tags":["validation","stress","scale","latency","integrity","temperature"],"q":"How would you validate power-state transitions on an SSD across many units and a long time, and prove the failure rate is low?","short":"Build a harness that cycles every transition (ASPM L1 and its substates, NVMe non-operational states, D3hot and D3cold) under a controlled idle-then-I/O pattern, verifies data after each cycle, times the exit against EXLAT plus link exit, and logs link, AER and SMART counters. Run it across temperature and voltage corners on many units. For rare failures use the rule of three: about 3 divided by the target failure rate in clean cycles.","deep":"1. **Cycle definition:** idle for a set time, then a small I/O burst, repeat. Vary idle time (below, near and above each timer), burst size and queue depth, and whether a write is in flight when entry begins.\n2. **Data integrity:** write with a known pattern (per-LBA seed, or fio with `verify=crc32c`), and read back and compare after every cycle group. Include reads before and after exit and writes that straddle the transition.\n3. **Timing:** measure first-I/O latency after idle from the host (fio with think time, latency histograms) and compare with link exit plus EXLAT from the descriptor. Any sample above the budget is a defect against the descriptor.\n4. **Observation:** per cycle read LnkSta, AER correctable and uncorrectable counters, Recovery counts if available, SMART (media errors, unsafe shutdowns), and, where the controller exposes it, the current NVMe power state (Get Features reports the host-set value, so APST-driven states may need a vendor log).\n5. **Corners:** temperature (cold, ambient, hot), supply voltage margins, reference clock with and without spread spectrum, Gen speed, and different root ports and BIOS versions.\n6. **Correlation:** log temperature and rail voltage with each failure. Wake failures that cluster at cold plus low voltage point at clock or regulator start-up.\n7. **Statistics:** a failure rate below 1e-5 per cycle at 95 percent confidence needs about 3 / 1e-5 = 300,000 clean cycles. At 10 cycles per second that is about 8.3 hours per unit and condition, so run many units in parallel.\n8. **Timer-bound cycles:** an APST cycle cannot be shorter than its idle timer. With the 500 ms timer in the example, 300,000 cycles take about 42 hours at 2 cycles per second. For stress, write a test-only APST table with short idle times, and keep a separate run with production tables.\n\n- **Pass criteria:** zero data miscompares, zero AER uncorrectable errors, no link down-training, latency within budget, and no unexpected Recovery entries beyond the expected one per exit.\n- **Triage of failures:** save the trace and counters at the failing cycle and cycle number. A failure at cycle N right after a fixed idle time is deterministic. A random one is a margin issue.","pitfall":"Counting configured cycles instead of observed transitions. If the SSD never entered the deep state, a million passes prove nothing.","verify":"Which counters your SSD, root port and vendor tooling actually expose (L1 entry counts, PS residency) and the exact fio options for think time and verification on your version.","follow":[{"q":"How do you know the device really entered the state?","a":"Read the state or residency (Get Features, vendor log, rail power, L1 entry counts). A test that only sets the policy is not proof."},{"q":"How do you avoid hiding bugs by long cycles?","a":"Randomize idle times and mix I/O sizes. A fixed rhythm can miss races that only appear at particular gaps."}],"mod":11},{"id":"11.18","level":"Principal","type":"Cross-layer","fig":null,"tags":["matrix","d-states","l-states","ps","platforms","coverage"],"q":"How would you design a power-state validation matrix across D-states, L-states, NVMe power states and host platforms?","short":"Treat it as a state space with legal and illegal combinations. Enumerate the axes (D-state, link state and substates, NVMe power state, APST, LTR, link speed, reset type, workload, host platform), remove impossible cells, cover transitions and not only states, prioritize by risk with pairwise coverage, and require evidence that each state was actually observed. Automate it and gate on integrity, latency, counters and residency.","deep":"1. **Axes:**\n   - D-state: D0, D3hot, D3cold.\n   - Link: L0, L1, L1.1, L1.2, L2 through D3cold. L0s if the device supports it.\n   - NVMe: PS0 to PSn and APST on or off.\n   - Environment: link speed and width, LTR values, ASPM policy, host platform (root port, BIOS, OS), temperature and voltage.\n2. **Prune the impossible:** D3hot with the link in L0, D3cold with L1, NVMe I/O in a non-operational state, and so on. Document why each is excluded.\n3. **Cover transitions:** the interesting bugs are in edges (L0 to L1.2 under a write in flight, PS3 to PS4 during a flush, D3hot to D0 then immediate doorbell), and in orders (NVMe shutdown then D3, versus D3 then shutdown).\n4. **Reduce with pairwise coverage** for the axes that are mostly independent, and keep full coverage for the critical set: exits (latency and correctness), resume after D3cold, and low-power state under error injection.\n5. **Add stress and fault:** transitions under heavy I/O, with resets (FLR, hot reset, controller reset) mid-transition, and with injected errors during exit.\n6. **Evidence per cell:** observed state (not configured), transition count, exit latency versus budget, AER and Recovery deltas, SMART and data integrity results.\n7. **Platform matrix:** at least one client and one server platform, with different clock trees (some route CLKREQ#, some do not), different LTR handling and different OS drivers.\n8. **Automation:** a cell is a scripted test with setup, transition loop, verification and a pass or fail with logs. A dashboard shows coverage and failure rate per cell.\n\n- **Decision criteria:** risk from customer usage (laptop idle most of the time), history of bugs, and cost per cell. Cover breadth first, then depth in the cells that have failed.","pitfall":"Claiming coverage by configuration. A cell is covered only if the transition was observed and its effects were verified.","verify":null,"follow":[{"q":"How do you stop the matrix from growing without bound?","a":"Fix the reference platform set, use pairwise coverage, retire cells that pass for many releases, and add cells only when a bug escapes."},{"q":"How do you report coverage to management?","a":"By observed cells and transition counts versus the risk-ranked list, with open failures and the platform each one occurred on."}],"mod":11},{"id":"12.01","level":"Basic","type":"Concept","fig":"aer","tags":["error-classes","correctable","non-fatal","fatal","err-messages"],"q":"What are the three PCIe error classes, and what does each mean for recovery?","short":"Correctable errors are fixed by hardware (replay, retrain) and need no software action. Uncorrectable non-fatal errors mean one transaction failed but the link and device are still usable, for example an Unsupported Request or a Completion Timeout. Uncorrectable fatal errors mean link or device state cannot be trusted, for example a Malformed TLP, and normally need a reset. Each class is reported to the Root Complex by ERR_COR, ERR_NONFATAL or ERR_FATAL.","deep":"| Class | Examples | Message | Recovery |\n|---|---|---|---|\n| Correctable | Receiver Error, Bad TLP, Bad DLLP, Replay Timer Timeout, Replay Number Rollover | ERR_COR | Hardware already fixed it. Software logs and watches rates |\n| Uncorrectable non-fatal | Poisoned TLP, ECRC, Unsupported Request, Completer Abort, Completion Timeout, Unexpected Completion | ERR_NONFATAL | The transaction is lost, the link works. Driver or OS may retry or fail that operation |\n| Uncorrectable fatal | Data Link Protocol Error, Surprise Down, Flow Control Protocol Error, Receiver Overflow, Malformed TLP | ERR_FATAL | Assume the link or device is corrupt. Reset the link or the device, possibly removing it |\n\n- **Severity is programmable:** the Uncorrectable Error Severity register chooses fatal or non-fatal per error type, so the table shows defaults.\n- **Where each error is detected:** the layer view is in the Layered Architecture module. Here the focus is what happens after detection.\n- **Downstream Port Containment:** a DPC-capable port can turn a fatal event into a contained one, by taking the link down and failing traffic to that one subtree while the rest of the system continues.\n- **Why the classes exist:** the class tells the OS how much to distrust. Non-fatal says \"this request failed\". Fatal says \"do not trust anything on this link until it has been reset\".","pitfall":"Reading \"non-fatal\" as \"safe to ignore\". A non-fatal error still lost a transaction, and for a posted write there may be no other symptom.","verify":null,"follow":[{"q":"Is a correctable error harmless?","a":"The data is fine, but the rate is the early warning of a marginal link, as shown in the Data Link Layer module."},{"q":"Who decides whether a fatal error crashes the machine?","a":"Platform policy: firmware-first handling, the OS AER driver and DPC. See the firmware-first and DPC questions in this module."}],"mod":12},{"id":"12.02","level":"Basic","type":"Concept","fig":null,"tags":["signaling","err-cor","device-control","root-control","serr"],"q":"How is an error reported to the system, and which enable bits gate it?","short":"A function that detects an error sets its status bits, and if reporting is enabled it sends an ERR_COR, ERR_NONFATAL or ERR_FATAL message toward the Root Complex. Device Control has separate enables for correctable, non-fatal, fatal and Unsupported Request reporting. The Root Port collects the message, sets Root Error Status and Error Source Identification, and can raise an interrupt or a system error depending on Root Error Command and Root Control.","deep":"1. **Detect and log:** the function sets bits in Device Status (detected bits) and, with AER, in the Uncorrectable or Correctable Error Status registers.\n2. **Send a message:** if the enables allow it, the function sends an error Message TLP routed implicitly to the Root Complex, carrying its own Requester ID.\n3. **Switch forwarding:** switches forward the message upstream unchanged.\n4. **Root Port receives:** it sets ERR_COR Received or ERR_FATAL/NONFATAL Received in Root Error Status (with a \"multiple\" bit for repeats) and records the Requester ID in Error Source Identification.\n5. **Notify software:** Root Error Command enables an AER interrupt (MSI or MSI-X) per class, and Root Control enables \"System Error on Correctable, Non-Fatal or Fatal Error\", which escalates to a platform SERR-style event (NMI, SMI or machine check).\n\n- **Two layers of enable:** Device Control gates the message from the device. AER Mask registers gate whether an individual error is logged and signaled. The Command register SERR# Enable also gates non-fatal and fatal messages.\n- **Mask does not clear the status bit:** a masked error usually still sets its status bit but is not signaled. Many systems show Advisory Non-Fatal set and masked in `lspci`.\n- **Design consequence:** silence in the OS log can mean no error, a disabled reporting path, a masked error or firmware-first ownership. Check the enables before concluding.","pitfall":"Assuming \"no ERR_ message\" means \"no error\". Read the device's own status bits and mask registers.","verify":"Whether the Detected bits in Device Status set regardless of the enables, the exact role of Command SERR# Enable, and mask versus status-bit behaviour, in the Base Specification.","follow":[{"q":"Why is there a separate Unsupported Request enable?","a":"URs are routine during probing and legacy accesses, so they can be silenced without hiding real errors."},{"q":"Who reads Error Source Identification?","a":"The OS AER driver at the Root Port, to find which function to interrogate without scanning the whole tree."}],"mod":12},{"id":"12.03","level":"Basic","type":"Concept","fig":null,"tags":["aer","registers","capability","header-log","sticky"],"q":"What does each register in the AER capability do?","short":"The AER extended capability holds the Uncorrectable Error Status, Mask and Severity registers, the Correctable Error Status and Mask registers, Advanced Error Capabilities and Control, the Header Log, and on Root Ports the Root Error Command, Root Error Status and Error Source Identification. Status registers say what happened, Mask says what to suppress, Severity says fatal or non-fatal, and the Header Log keeps the TLP header of the first error.","deep":"| Register | Purpose |\n|---|---|\n| Uncorrectable Error Status | One bit per error type. Write 1 to clear. Sticky |\n| Uncorrectable Error Mask | Suppress logging and signaling of selected errors |\n| Uncorrectable Error Severity | Per error, fatal (1) or non-fatal (0) |\n| Correctable Error Status and Mask | Same for Receiver Error, Bad TLP, Bad DLLP, Replay Number Rollover, Replay Timer Timeout, Advisory Non-Fatal, Corrected Internal Error, Header Log Overflow |\n| Advanced Error Capabilities and Control | First Error Pointer (which uncorrectable bit came first), ECRC generation and check capable and enable, multiple header recording |\n| Header Log | Four DWORDs: header of the TLP tied to the first uncorrectable error |\n| Root Error Command and Status | Interrupt enables and received-error flags at Root Ports and event collectors |\n| Error Source Identification | Requester IDs of the last ERR_COR and last ERR_FATAL or ERR_NONFATAL |\n| TLP Prefix Log | Prefix DWORDs if the offending TLP had prefixes |\n\n- **Sticky:** these bits survive a hot reset and reflect the state before it, which is very useful for post-mortems. Software can clear them by writing 1, and a Fundamental Reset clears them unless auxiliary power keeps them alive.\n- **First Error Pointer:** later errors set status bits but only the first fills the Header Log (unless multiple header recording is on).\n- **lspci view:** `UESta`, `UEMsk`, `UESvrt`, `CESta`, `CEMsk`, `AERCap` and `HeaderLog`. The Linux kernel also exposes counters in sysfs (see the Data Link Layer module).","pitfall":"Reading the Header Log without checking the First Error Pointer. The log belongs to the first error only, not to the bit you are looking at.","verify":"Register offsets from the AER capability base and all bit positions (for example, Uncorrectable Error Status bit 20 for Unsupported Request), and the header log re-arm behaviour.","follow":[{"q":"Which registers are on every function, and which only on Root Ports?","a":"The status, mask, severity, capabilities and header log are per function. Root Error Command, Root Error Status and Error Source Identification exist only on Root Ports and Root Complex Event Collectors."},{"q":"What clears the Header Log?","a":"Clearing the First Error status bit re-arms it. The log is not cleared by reading."}],"mod":12},{"id":"12.04","level":"Intermediate","type":"Concept","fig":null,"tags":["errors","poisoned","ecrc","ur","ca","cto","malformed","causes"],"q":"For each Transaction Layer error, what causes it in a real SSD system and what does it tell you?","short":"Poisoned TLP means data marked bad travelled a link. ECRC means corruption inside the path that LCRC could not see. Unsupported Request means the target does not support the access, Completer Abort means it understood but could not finish, Completion Timeout means no reply arrived, Unexpected Completion means a reply with no request. Malformed TLP, Flow Control Protocol Error and Receiver Overflow mean a protocol violation and are fatal by default.","deep":"| Error | Default | Typical SSD-platform cause | What it tells you |\n|---|---|---|---|\n| Poisoned TLP | Non-fatal | SSD data path ECC failure passed on as EP data, or a poisoned host write | Data integrity event, not link quality |\n| ECRC Error | Non-fatal | Corruption inside a switch or a device datapath | Fault between link ends, where LCRC cannot see |\n| Unsupported Request | Non-fatal | Read of an unimplemented BAR region, config access to a missing function, MMIO while in D3hot | Address or state problem, often software |\n| Completer Abort | Non-fatal | Device cannot service a valid request (internal fault, illegal access size) | Suspect the device |\n| Completion Timeout | Non-fatal | Hung firmware, link down, function in reset or low power | Nothing came back |\n| Unexpected Completion | Non-fatal | Late completion after a timeout, misrouted completion | A timeout preceded it |\n| ACS Violation | Non-fatal | Peer-to-peer blocked by ACS (Virtualization module) | Configuration matches policy |\n| Malformed TLP | Fatal | MPS mismatch, bad header fields, 4 KB crossing | A device or driver violated the format |\n| Flow Control Protocol Error | Fatal | Bad InitFC or UpdateFC values | Data Link or credit logic fault |\n| Receiver Overflow | Fatal | Sender exceeded advertised credits | Credit accounting bug |\n\n- **Use the table backwards:** given an AER bit, the third column lists the first hypotheses.\n- **Layer view:** which layer detects each error is in the Layered Architecture module. Fatal Data Link errors (Surprise Down, Data Link Protocol Error) were covered in the Data Link Layer module.","pitfall":"Memorizing the list without the causes. Interviewers ask for the next step, and the cause column gives it.","verify":"Default severities and bit positions for each error, including ACS Violation and Uncorrectable Internal Error.","follow":[{"q":"Which of these do you expect during normal operation?","a":"Unsupported Request during probing, and occasionally Advisory Non-Fatal. Anything else in steady state is a bug or a marginal system."},{"q":"Which are strongly related to each other?","a":"A Completion Timeout followed by an Unexpected Completion when the late reply arrives."}],"mod":12},{"id":"12.05","level":"Intermediate","type":"Trap","fig":null,"tags":["trap","ur","ca","completion-status","advisory-non-fatal"],"q":"Unsupported Request and Completer Abort both make a request fail. Are they the same?","short":"No. Unsupported Request (UR) means the request could not be supported at all: unknown type, or an address or ID that the target does not claim. Completer Abort (CA) means the target recognized and accepted the request but cannot or will not complete it. They use different completion status codes and different status bits, and CA usually points at the device while UR often points at software or configuration.","deep":"| | Unsupported Request | Completer Abort |\n|---|---|---|\n| Meaning | Request cannot be supported here | Request understood but cannot be completed |\n| Completion status | UR | CA |\n| SSD example | Read at a BAR0 offset with no register. Config read to a non-existent function. MMIO while in D3hot | Internal fault while servicing a register read. Access with a size or alignment the device refuses |\n| Requester status bit | Received Master Abort | Received Target Abort |\n| Completer status bit | Unsupported Requests Detected | Signaled Target Abort |\n| Default severity | Non-fatal, with its own reporting enable | Non-fatal |\n\n- **Default severity is the same. Handling is not:** UR has its own enable in Device Control because it is routine (bus probing, legacy accesses). CA is rarely routine, so treat any CA from an SSD as a device defect until proven otherwise.\n- **Posted versus non-posted:** a non-posted request that fails returns a UR or CA completion, so the requester is told. For a posted write there is no completion, so the error is signaled by an ERR_ message only, and nothing tells the driver.\n- **Advisory Non-Fatal:** for certain non-fatal errors that the requester will learn about through the completion status, the specification lets the function report ERR_COR and set the Advisory Non-Fatal bit in Correctable Error Status instead of sending ERR_NONFATAL.\n- **What the CPU sees:** the Root Complex commonly turns UR and CA on a CPU read into all ones (0xFFFFFFFF). A driver that treats all ones as a valid value gets wrong data.\n- **DPC:** a Downstream Port in containment returns either UR or CA for requests aimed at the contained subtree, selected by DPC Completion Control.","pitfall":"Treating both as \"the device said no\". The first word is a hint to the cause: UR is about the request, CA is about the completer.","verify":"Completion status encodings, mapping to the PCI Status bits, the exact set of errors eligible for Advisory Non-Fatal reporting, and how the specification treats UR for posted requests.","follow":[{"q":"Which one do you get for a config read of a non-existent function?","a":"UR, and the Root Complex reports all ones to the CPU. That is how enumeration finds empty slots."},{"q":"Should you mask UR globally to reduce log noise?","a":"Prefer rate limiting the log. Masking UR globally hides real bugs, for example a firmware update that removed a register."}],"mod":12},{"id":"12.06","level":"Intermediate","type":"Concept","fig":null,"tags":["poisoned","ecrc","ep-bit","td-bit","data-integrity"],"q":"How do Poisoned TLPs and ECRC work, and where do they matter for an SSD?","short":"A Poisoned TLP has the EP bit set in its header. It is delivered, but tells the receiver that the payload is bad, for example because the sender's memory had an uncorrectable ECC error. ECRC is an optional 32-bit CRC in a TLP digest (TD bit) that is checked at the destination and catches corruption that happened between link ends. Both report as uncorrectable non-fatal errors by default.","deep":"- **Poisoning:** the source sets EP rather than sending bad data silently. The receiver logs Poisoned TLP Received, must not use the data as if it were good, and switches forward poisoned TLPs unchanged. A requester that gets a poisoned completion may also set the Master Data Parity Error status bit.\n- **SSD as source:** an SSD that hits an uncorrectable error in an internal SRAM or DRAM buffer while sending read data should poison the write TLP to host memory, or fail the command. Sending the data clean is silent corruption.\n- **SSD as sink:** if the host sends a poisoned write (or a poisoned completion for a DMA read), the SSD must not commit that data as good.\n- **Host reaction:** some platforms escalate a poisoned read completion into a machine check for the CPU.\n- **ECRC:**\n  - The source needs ECRC Generation Enable and the destination needs ECRC Check Enable (Advanced Error Capabilities and Control). Linux has a `pci=ecrc=` boot option.\n  - Switches pass the digest through (variant fields excluded) and may check it.\n  - Cost is 4 bytes per TLP. Support in devices and Root Ports is uneven, so validate it before enabling widely.\n- **Relation to NVMe end-to-end protection:** NVMe protection information (PI) covers the data from host buffer to media at the command level. ECRC covers only the transport. A strong design uses both.\n- **DPC extension:** Poisoned TLP Egress Blocking stops a switch from forwarding poisoned data beyond the port.","pitfall":"Assuming that a Poisoned TLP was rejected. It was delivered, and it is the receiver's job not to consume the data.","verify":"Master Data Parity Error behaviour, ECRC masking of variant fields, the Poisoned TLP Egress Blocking register, and how your NVMe device handles a poisoned host write.","follow":[{"q":"Why is ECRC not enough by itself?","a":"It is optional, and it does not protect data inside the device after the TLP has been received."},{"q":"Can LCRC catch what ECRC catches?","a":"No. LCRC is regenerated at every hop, so corruption inside a switch buffer carries a fresh, valid LCRC."}],"mod":12},{"id":"12.07","level":"Intermediate","type":"Concept","fig":null,"tags":["completion-timeout","devctl2","unexpected-completion","nvme"],"q":"How does the Completion Timeout mechanism work, and what happens when it fires?","short":"The requester starts a timer for each non-posted request. If the completion has not arrived when it expires, the requester logs Completion Timeout (uncorrectable non-fatal by default), releases the tag, and completes the operation in an error way (a CPU read returns all ones). The range is selectable through Device Control 2, with a default range of 50 microseconds to 50 milliseconds. A late completion then shows up as an Unexpected Completion.","deep":"- **Capabilities:** Device Capabilities 2 lists the supported ranges (A to D, short to long) and whether the timeout can be disabled. Device Control 2 selects a value and has the disable bit.\n- **Ranges (verify):** default 50 microseconds to 50 milliseconds. Others include 50 to 100 microseconds, 1 to 10 ms, 16 to 55 ms, 65 to 210 ms, 260 to 900 ms, 1 to 3.5 s, 4 to 13 s and 17 to 64 s.\n- **Range, not a value:** each setting is a range because the timer only has to expire somewhere inside it. The minimum is what the request is guaranteed to survive.\n- **Who is the requester:** a Root Port for CPU MMIO reads, an SSD for its DMA reads from host memory. Each has its own timer and its own log.\n- **CPU reads:** a CPU core waiting on an MMIO read to a hung device stalls until the timeout, which is one reason drivers avoid unnecessary reads. On expiry the read returns all ones and some platforms raise a machine check.\n- **SSD as requester:** a DMA read that times out fails the associated command, commonly with a Data Transfer Error status, or leads to a controller reset.\n- **Late completion:** it arrives after the tag was released and is logged as Unexpected Completion. If the tag was reused, the late data could be mistaken for the new request, so timeouts must be long enough that this does not happen in normal operation.\n- **Relation to NVMe timeouts:** the driver's command timeouts are seconds (Linux defaults are 30 s for I/O and 60 s for admin). The PCIe timeout fires first, and the driver mostly sees the consequences (all ones, failed DMA), not the timeout itself.","pitfall":"Sizing against the top of the range. The guarantee is the bottom of the range, and slow but healthy devices need that margin.","verify":"The full range and encoding table in Device Control 2 and Device Capabilities 2, the default range guarantees (including any recommendation about the minimum), and platform behaviour on a core-initiated timeout.","follow":[{"q":"Can you disable the timeout?","a":"If the device reports the capability, yes, but then a lost request hangs forever. Only for special test cases."},{"q":"Where do you look next after a Completion Timeout?","a":"The request-disappearance walk in the Layered Architecture module: routing, credits, link state, completer state."}],"mod":12},{"id":"12.08","level":"Intermediate","type":"Concept","fig":null,"tags":["malformed","flow-control-error","receiver-overflow","mps","fatal"],"q":"Why are Malformed TLP, Flow Control Protocol Error and Receiver Overflow fatal, and how do they show up during SSD bring-up?","short":"They mean the transmitter or its configuration broke a rule that the receiver cannot recover from. Malformed TLP is a format violation such as a payload larger than Max_Payload_Size. Receiver Overflow means the sender exceeded the credits it was given. Flow Control Protocol Error means a credit initialization or update is inconsistent. Since the two ends no longer agree on the rules, the default severity is fatal.","deep":"- **Malformed TLP triggers:** payload larger than the receiver's Max_Payload_Size, length field not matching the data, undefined Fmt or Type, certain byte enable violations, a memory request crossing a 4 KB boundary (receivers may optionally check this), or an invalid combination of fields.\n- **Classic SSD cause:** an MPS mismatch. If the OS sets MPS on a device higher than an upstream component supports (for example after a hot reset that resets one side but not the other), the SSD sends a 512-byte write to a port that accepts 256. The receiver flags Malformed TLP.\n- **Receiver Overflow:** the receiver's buffer received more than the credits it advertised. It usually means a bug in the sender's credit tracking, or a Data Link layer reset that lost credit state.\n- **Flow Control Protocol Error:** a bad InitFC or UpdateFC value (for example a credit count that goes backwards or exceeds the legal window).\n- **What the host sees:** Uncorrectable fatal AER log, and with DPC the port containing the SSD goes down. Without DPC the platform may treat it as a system error.\n- **Evidence:** the Header Log has the offending TLP for Malformed TLP and gives the length and address to compare with MPS. Receiver Overflow and Flow Control Protocol Error usually have no useful header.\n- **Validation:** deliberately set mismatched MPS and MRRS values in a lab to confirm that the platform contains the error and recovers, and that the SSD never generates oversize TLPs itself under any MPS setting.","pitfall":"Chasing signal integrity for a Malformed TLP. These errors are logical, so check MPS, driver and firmware behaviour first.","verify":"The complete list of malformed conditions, and which error types record a header log and which do not.","follow":[{"q":"How can MRRS cause errors?","a":"It should not cause Malformed TLPs at the receiver. It limits read request size. A device that ignores MRRS breaks the requester's expectations, and completions may not fit the requester's buffers."},{"q":"What does the driver do to avoid MPS mismatch?","a":"The PCI core walks the hierarchy and programs the lowest common MPS on every device on the path. Bugs appear when it is bypassed by hot-plug or firmware settings."}],"mod":12},{"id":"12.09","level":"Advanced","type":"Numeric","fig":null,"tags":["numeric","completion-timeout","budget","switch","l1-exit"],"q":"A CPU reads a register on an SSD two switches away. What is the worst-case completion time compared with the Completion Timeout settings?","short":"Adding the terms gives about 2.2 ms: 1.2 us of fabric, 1 ms for a busy SSD firmware to answer, 192 us for three links waking from L1, 33 us of head-of-line blocking, and 1 ms for one link retrain. That is far below a 16 to 55 ms setting (7 times margin) but above the guaranteed minimum of a 1 to 10 ms setting, which could time out a perfectly healthy device.","deep":"Assumptions (illustrative): Root Port, switch 1, switch 2, SSD gives three links and two switches. Non-posted read of one DWORD.\n\n1. **Fabric:** switch latency 0.15 us x 2 switches x 2 directions = 0.6 us. PHY and serialization 0.1 us x 3 links x 2 directions = 0.6 us. Total 1.2 us.\n2. **Completer:** hardware-served register: about 2 us. Firmware-served register while firmware is in a long non-preemptible task: assume 1,000 us worst case.\n3. **Link wake:** all three links in ASPM L1 with a large exit latency of about 64 us each (the top code means more than 64 us), so about 3 x 64 = 192 us if the wakes are serialized. Treat that as a typical worst case rather than a strict bound.\n4. **Head-of-line blocking:** the read cannot pass earlier posted writes. Assume 256 KB of posted data ahead of it at 7.88 GB/s (Gen4 x4): 262,144 / 7.88e9 = 33 us.\n5. **One retrain:** replay timeouts plus a Recovery entry, assumed 1,000 us in total.\n6. **Sum:** 1.2 + 1,000 + 192 + 33 + 1,000 = about 2,226 us = 2.2 ms.\n\n| Setting (verify) | Guaranteed minimum | Verdict for 2.2 ms |\n|---|---|---|\n| 50 to 100 us | 50 us | Times out on a healthy path |\n| 1 to 10 ms | 1 ms | Can time out falsely |\n| 16 to 55 ms | 16 ms | Passes, 7.2x margin |\n| Default range (50 us to 50 ms) | 50 us by spec, usually far higher | Measure the real implementation |\n\n- **Rule:** size the budget against the minimum of the selected range, with a margin factor of 2 to 4 for terms you did not model.\n- **Cost of the top of the range:** with a 55 ms setting a hung device stalls each CPU read for up to 55 ms, so failures are slow to detect. The setting is a trade between false timeouts and detection speed.","pitfall":"Comparing the average latency to the timeout. The timeout is about the tail, including retrains and low-power exits.","verify":"The range table and the minimum guaranteed by the default range, and L1 exit encodings, in the Base Specification. The 1 ms firmware and retrain terms are assumptions to replace with measured values.","follow":[{"q":"What changes if the SSD is the requester reading host memory?","a":"The completer is the Root Complex: IOMMU walks, memory controller queues and deep package idle exit (often tens of microseconds and more), so LTR values matter here too (see the Power Management module)."},{"q":"What if a time-out fires falsely?","a":"The completion arrives later and is logged as Unexpected Completion, and the operation has already failed, so you get both an error and a stale response."}],"mod":12},{"id":"12.10","level":"Advanced","type":"Debug","fig":null,"tags":["header-log","decode","ur","aer","lspci"],"q":"An SSD logs an Unsupported Request with the AER header log 00000001 0000050f f7f03f00 00000000. Decode it and say what it tells you.","short":"It is a 3-DW header. The first DWORD (Fmt 000, Type 00000) is a Memory Read, length 1 DW. The second says requester 00:00.0, tag 5, first byte enable F. The third is the address F7F03F00, which is BAR0 plus 0x3F00. So the CPU read a 4-byte register at an offset that the SSD does not implement, and the SSD returned UR.","deep":"```\nUESta: ... CmpltAbrt- UnxCmplt- RxOF- MalfTLP- ECRC- UnsupReq+ ACSViol-\nUEMsk: ... UnsupReq- ...\nAERCap: First Error Pointer: 14, ECRCGenCap- ECRCGenEn- ECRCChkCap- ECRCChkEn-\nHeaderLog: 00000001 0000050f f7f03f00 00000000\nRegion 0: Memory at f7f00000 (64-bit, non-prefetchable) [size=16K]\n```\n1. **Which error, which TLP:** UnsupReq is set and First Error Pointer 0x14 is bit 20, so the header log belongs to the UR.\n2. **DW0 = 0x00000001:** bits 31:29 Fmt = 000, meaning 3-DW header without data. Bits 28:24 Type = 00000, so this is a Memory Read request. TC, TD, EP and attributes are zero. Length = 1 DW.\n3. **DW1 = 0x0000050F:** Requester ID 0x0000 (bus 0, device 0, function 0, which is how this Root Complex identifies CPU-originated requests), Tag 0x05, Last DW byte enable 0000 (required for a 1 DW read), First DW byte enable 1111.\n4. **DW2 = 0xF7F03F00:** 32-bit address. BAR0 starts at 0xF7F00000, so the offset is 0x3F00, inside the 16 KB BAR.\n5. **DW3:** unused for a 3-DW header.\n6. **Interpretation:** a non-posted CPU MMIO read to BAR0+0x3F00. Assume the register map has nothing there. The SSD returned a UR completion, and the CPU got 0xFFFFFFFF.\n7. **Next steps:** which tool or driver reads that offset (a vendor utility built for another firmware register map, a stale driver, a debug script)? Reproduce with a direct read of that physical address. Compare the firmware version's register map. If it is a regression, an offset was removed or moved.\n\nQuick Fmt/Type values you can decode by eye:\n\n| DW0 top byte | TLP |\n|---|---|\n| 00h / 20h | Memory Read, 3-DW / 4-DW header |\n| 40h / 60h | Memory Write, 3-DW / 4-DW header |\n| 04h / 44h | Config Read / Write type 0 |\n| 0Ah / 4Ah | Completion / Completion with data |","pitfall":"Reading DW1 as the address. The address is in the last header DWORD or DWORDs (DW2 for 3-DW, DW2 and DW3 for 4-DW headers).","verify":"The Header Log byte ordering as printed by your tool (lspci and Linux print DW0 first with Fmt/Type in the top byte on common hosts), and that the register map assumption fits your SSD.","follow":[{"q":"Why is the requester ID 0000 here?","a":"CPU-originated requests carry an ID that the Root Complex chooses, and many platforms use 00:00.0. It does not identify a bug by itself."},{"q":"What if the same log shows a 64-bit MWr (60h)?","a":"A posted write that hit a bad address. Nothing returned to the CPU, so the AER log is the only evidence."}],"mod":12},{"id":"12.11","level":"Advanced","type":"Concept","fig":null,"tags":["dpc","containment","trigger","recovery","edpc"],"q":"What is Downstream Port Containment, what triggers it, and what does it do?","short":"DPC is a capability of Downstream Ports (Root Ports and switch downstream ports). When triggered, the port takes its link down, completes non-posted requests to the subtree with UR or CA and drops the rest. Triggers are an unmasked uncorrectable error at the port, ERR_FATAL (optionally ERR_NONFATAL) received from below, a Root Port PIO error, or a software trigger. Software recovers by clearing the trigger status so the link retrains.","deep":"- **Triggers (DPC Control, Trigger Enable):** off, on for fatal, or on for non-fatal and fatal. Sources: unmasked uncorrectable error detected at the port, ERR_FATAL or ERR_NONFATAL message received from below, Root Port PIO error (enhanced DPC), and the DPC software trigger.\n- **What containment does:**\n  - Sets the trigger status and reason, and records the source ID.\n  - Takes the link down and holds it down.\n  - Non-posted requests heading downstream complete with UR or CA (DPC Completion Control). Posted writes are dropped. TLPs arriving from below are discarded.\n  - Optionally raises an interrupt and an ERR_COR message.\n- **Why it matters:** the fatal error is confined to one subtree. Other drives and the rest of the system keep running, instead of a platform-wide fatal event.\n- **Software recovery:**\n  1. Interrupt or notification, read DPC Status and the source.\n  2. Wait for the Root Port to become idle (the RP Busy bit) if applicable.\n  3. Run driver error callbacks and prepare to reset the subtree.\n  4. Clear the DPC trigger status (write 1). The link retrains.\n  5. Wait for the link to come back (Data Link Layer Link Active), restore config space and re-initialize the drivers. Otherwise remove the device.\n- **Enhanced DPC (eDPC):** adds Root Port PIO error logging (UR, CA or Completion Timeout on requests a Root Port initiated), PIO header log, and the software trigger.\n- **Related:** Poisoned TLP Egress Blocking, and hot-plug interplay. A DPC link-down looks like a surprise removal to hot-plug logic, so the OS has to coordinate the two.","pitfall":"Assuming that DPC clears the error. It contains the damage. The device is still in an unknown state and must be reset and re-initialized.","verify":"DPC Control and Status field names and encodings (Trigger Enable, Trigger Reason, Completion Control), the exact link state entered on trigger, RP PIO register names, and the extended capability ID.","follow":[{"q":"What does the SSD see during DPC?","a":"Its link goes down. A link-down alone does not necessarily reset the NVMe controller, so the driver's reset is what returns it to a known state."},{"q":"Why is DPC not enabled everywhere by default?","a":"The platform must support it, firmware may own it, and a link reset costs the outstanding I/O on that device. It suits storage backplanes well because the blast radius is one drive."}],"mod":12},{"id":"12.12","level":"Advanced","type":"Concept","fig":null,"tags":["linux","pci-error-handlers","aer-driver","windows","whea","recovery"],"q":"How does the OS recover from a PCIe error? Describe the Linux flow and the Windows overview.","short":"On Linux the AER driver at the Root Port finds the failing device, logs it, and for uncorrectable errors runs `pcie_do_recovery`, which calls each affected driver's `pci_error_handlers`: `error_detected`, then `mmio_enabled` or (after a link reset) `slot_reset`, then `resume`. On Windows the error goes through WHEA and Pci.sys, and the storage driver resets the device. An unrecoverable fatal error can bugcheck.","deep":"1. **AER driver:** it fields the Root Port interrupt, reads Root Error Status and Error Source Identification, finds the source function, reads the status and Header Log, prints the log and clears the status.\n2. **Correctable:** log (with rate limiting) and continue.\n3. **Uncorrectable:** `pcie_do_recovery` with channel state `pci_channel_io_normal` for non-fatal or `pci_channel_io_frozen` for fatal (I/O to the device is blocked).\n4. **`error_detected(pdev, state)`:** the driver returns `CAN_RECOVER`, `NEED_RESET` or `DISCONNECT`.\n5. **`mmio_enabled`:** called if the device can be recovered without a reset. The driver can inspect it.\n6. **`slot_reset`:** called after the link was reset (secondary bus reset or the DPC reset). The driver re-initializes the hardware and returns `RECOVERED`.\n7. **`resume`:** traffic restarts. If anything fails, the device is marked as permanently failed.\n\n- **NVMe's handlers:** `error_detected` on a frozen channel disables the controller and asks for a reset. `slot_reset` restarts controller initialization. `resume` lets the queues run again. If the controller does not become ready, the namespaces are removed.\n- **Windows:** Pci.sys handles PCIe AER natively when the OS owns it, and reports through WHEA error records and the WHEA-Logger events in the System log. A fatal hardware error can bugcheck with code 0x124. For storage, the NVMe miniport (stornvme) resets the controller on timeouts, and reset events are logged.\n- **What to read:** in Linux, `dmesg | grep -i -E \"aer|dpc|pcieport\"`, and in Windows Event Viewer the WHEA-Logger source.\n\n```\npcieport 0000:00:1c.4: AER: Uncorrected (Non-Fatal) error received: 0000:04:00.0\nnvme 0000:04:00.0: PCIe Bus Error: severity=Uncorrected (Non-Fatal), type=Transaction Layer, (Requester ID)\nnvme 0000:04:00.0:   device [xxxx:xxxx] error status/mask=00004000/00400000\nnvme 0000:04:00.0:    [14] CmpltTO                (First)\n```\n(Illustrative kernel output. Wording varies by version.)","pitfall":"Assuming the driver sees every error. Correctable and masked errors never reach the driver, and firmware-first errors may never reach the OS at all.","verify":"Callback names and return values for your kernel, whether Windows or firmware owns AER on your platform, the WHEA event IDs and bugcheck behaviour on your Windows version, and stornvme reset logging.","follow":[{"q":"What does `pci_channel_io_frozen` mean for MMIO?","a":"Reads may return all ones and writes are dropped, so the driver must not touch the hardware until after the reset."},{"q":"Who resets the link in the fatal path?","a":"The recovery code, using a hot reset (secondary bus reset) or the DPC recovery step, then calls `slot_reset`."}],"mod":12},{"id":"12.13","level":"Advanced","type":"Concept","fig":null,"tags":["firmware-first","osc","apei","ghes","hidden-errors","edr"],"q":"What is firmware-first error handling, and how can it hide errors from the OS?","short":"In firmware-first mode the platform firmware, not the OS, owns PCIe error handling. It receives the error through an SMI or similar, may log it, clear the status registers, mask or downgrade the error, and then optionally passes a record to the OS through APEI tables. The OS learns of the error only if firmware chooses to report it, so a validation setup can see nothing in dmesg while the hardware is logging errors.","deep":"- **Ownership:** decided by ACPI `_OSC`. If firmware does not grant \"PCI Express Advanced Error Reporting\" control, the OS AER driver stays out (Linux logs the outcome of `_OSC` at boot).\n- **Delivery:** firmware programs the Root Ports so that errors trap into it. It reads and clears the AER registers, then reports through APEI: the HEST table (with GHES error sources, including PCIe AER sources), and a notification such as SCI, NMI or GSIV, carrying a CPER record with a PCIe section.\n- **How errors get hidden:**\n  - Firmware clears the status before the OS reads it.\n  - It masks or downgrades errors that it considers noise.\n  - It handles the error and reports nothing.\n  - The record arrives later, or in a different format, or without a header log.\n- **Linux tools and options:** `pcie_ports=native` forces the OS to own the PCIe services regardless of `_OSC` (only safe if firmware cooperates), and `pci=noaer` turns the AER driver off. The kernel's GHES code can forward PCIe records into the same recovery path.\n- **DPC and firmware:** Error Disconnect Recover (EDR) lets firmware-owned DPC hand recovery to the OS through an ACPI notification.\n- **Validation implications:** establish for each platform who owns AER and DPC, whether the BIOS setup can hand it to the OS, and repeat injection tests in both modes. In firmware-first mode also read the BMC or system event log.","pitfall":"Concluding that an SSD is error free because the OS log is empty. Confirm who owns AER first.","verify":"`_OSC` bit names for AER and DPC, HEST source types for PCIe, the `pcie_ports` option values on your kernel, and how EDR is negotiated on your platform.","follow":[{"q":"Why would a vendor choose firmware-first?","a":"To collect uniform hardware error logs, to correct or retire memory and I/O errors without OS involvement, and to hide platform-specific quirks."},{"q":"How do you detect that errors are being hidden?","a":"Compare an injected error with what the OS saw. Read the AER registers directly with `setpci`/`lspci`: status bits stuck at zero after known stress suggest firmware cleared them."}],"mod":12},{"id":"12.14","level":"Advanced","type":"Cross-layer","fig":null,"tags":["nvme","csts-cfs","reset","timeout","namespace-offline"],"q":"How does an NVMe driver react to PCIe errors, and when does a namespace go offline?","short":"The driver learns about most PCIe faults indirectly. MMIO reads return all ones (CSTS reads 0xFFFFFFFF), commands time out, or the controller reports fatal status (CSTS.CFS). It then resets the controller, requeues commands that may be retried, and rebuilds the queues. If the controller does not become ready after the reset, the driver removes it and the namespaces go offline. Errors that the OS recovery path handles arrive earlier as PCIe error callbacks.","deep":"| PCIe event | What the host sees | Driver reaction |\n|---|---|---|\n| Correctable errors and replays | Latency tail only | None |\n| Link down (DPC, surprise removal) | MMIO reads all ones, doorbell writes lost, commands time out | Reset path through `error_detected` or timeout handling. Removal if the device is gone |\n| SSD's DMA read times out (Completion Timeout on the SSD) | Command completes with an error status such as Data Transfer Error, or the controller may set CFS | Retry commands without Do Not Retry, otherwise fail the I/O |\n| Poisoned data | AER log on the receiver, possible machine check | Device-specific. Usually fails the command |\n| Controller internal fault | CSTS.CFS = 1 | Reset controller (CC.EN 1 to 0, then 1) |\n\n- **Timeout path:** on a timeout the driver reads CSTS. If it shows CFS or all ones it goes straight to a reset. Otherwise it may first send an Abort, and a second timeout leads to a reset.\n- **Reset:** disable the controller, cancel outstanding requests (those without DNR are requeued and retried a limited number of times), then re-enable and recreate the admin and I/O queues.\n- **When the namespace goes offline:** the controller does not reach CSTS.RDY within the timeout from CAP.TO, or the link is gone, or the retry budget is exhausted. The block device is removed, upper layers see I/O errors, and a filesystem may go read-only. With multipath, I/O fails over to another path first.\n- **What to capture:** `dmesg`, `nvme error-log`, `nvme smart-log`, the controller's own logs, and AER counters, and note the sequence of \"timeout, abort, reset, controller not ready\".\n- **Windows:** stornvme resets the controller on timeouts and logs it (for example the \"Reset to device\" storage event).","pitfall":"Treating \"nvme reset\" as proof of a PCIe fault. Check LnkSta, AER and CSTS at the time of the reset to separate link loss from controller failure.","verify":"Driver timeout, abort and retry defaults on your kernel, the Do Not Retry semantics, and the Windows event IDs.","follow":[{"q":"Why can an SSD with a dead link look like a hung command?","a":"The doorbell write is posted and disappears, so the host only learns through the command timeout."},{"q":"Does CSTS.CFS mean a PCIe problem?","a":"No. It is the controller's own fatal status. A PCIe link problem shows as all ones, not CFS."}],"mod":12},{"id":"12.15","level":"Advanced","type":"Concept","fig":null,"tags":["error-injection","aer-inject","einj","dpc","exerciser","test-matrix"],"q":"How do you inject PCIe errors for validation, and what should a good injection test check?","short":"There are several levels. Linux `aer_inject` fabricates AER status so the OS recovery path runs but no real error happens. ACPI EINJ asks firmware to inject real PCIe errors on platforms that support it. A DPC software trigger gives a real containment event. Device-side hooks and protocol exercisers inject faults at the source. A good test checks containment, logging, recovery, data integrity and that nothing hangs.","deep":"| Method | What it exercises | Limits |\n|---|---|---|\n| Linux `aer_inject` (kernel `CONFIG_PCIEAER_INJECT`, tool `aer-inject`) | Root Port AER driver, log format, driver callbacks | Faked status. The SSD is not involved |\n| ACPI EINJ (`/sys/kernel/debug/apei/einj/`) | Real error and the firmware-first path | Needs BIOS support, mostly servers |\n| DPC software trigger | Real containment, link down, driver reset | Not an error condition inside the SSD |\n| Condition-based | UR by reading an unimplemented offset or absent function. Completion Timeout by MMIO to a device in D3hot, in reset or with the link disabled. Malformed TLP by an MPS mismatch | Risky, needs care and a recoverable platform |\n| Device-side injection | Poisoned completion, dropped or delayed TLPs, bad LCRC or ECRC from the SSD firmware or PHY | Vendor specific |\n| Protocol exerciser or analyzer | Exact TLP-level faults on a chosen packet | Costly equipment |\n\n- **What a good test checks:**\n  1. **Containment:** the error stays within the intended subtree. Other drives keep running.\n  2. **Logging:** correct status bit, First Error Pointer, Header Log, Error Source ID, and an OS log entry naming the right device.\n  3. **Recovery:** the driver's recovery path runs, the link comes back, and the device is usable again within a stated time.\n  4. **Data integrity:** no silent corruption. Acknowledged data is intact, and in-flight data is either fully old or fully new.\n  5. **No hang:** watchdogs on host and device. No deadlock, no endless DPC retrigger loop.\n- **Matrix dimensions:** error type x traffic state (idle, reads, writes, mixed) x location (endpoint, switch, Root Port) x reporting configuration (masked, unmasked, DPC on or off, firmware-first or native).","pitfall":"Counting a run as a pass because the log line appeared. The pass needs recovery and data integrity, not just detection.","verify":"`aer_inject` availability on current kernels and its input format, EINJ error type codes and BIOS support, the DPC software trigger register bit, and which fault-injection features your SSD or PCIe IP offers.","follow":[{"q":"Why is `aer_inject` not enough?","a":"It never touches the device or the link, so it cannot find a firmware bug in how the SSD survives a real error."},{"q":"How do you make injection repeatable?","a":"Trigger from a fixed event (for example the N-th TLP or a fixed LBA), and log the trigger time and state alongside the SSD, host and analyzer logs."}],"mod":12},{"id":"12.16","level":"Principal","type":"Scenario","fig":null,"tags":["dpc","fio","u2","timeline","blast-radius","recovery"],"q":"During a 4 KB random write test on four U.2 SSDs, one SSD causes a fatal error on a DPC-enabled slot. What happens, in what order, and what do you check?","short":"The port detects the fatal error, DPC triggers, and the link to that SSD goes down. Non-posted requests to it complete with UR or CA and posted writes are dropped. The DPC handler logs the event and calls the NVMe driver, which resets the controller once the link is back. The other three SSDs must be unaffected. Verify the timeline, the blast radius, recovery time and that acknowledged data is intact after the reset.","deep":"| Step | Event | What to check |\n|---|---|---|\n| 0 | fio with verification running on four SSDs | Baseline latency and throughput on each |\n| 1 | Fatal error (for example Data Link Protocol Error, or ERR_FATAL from the SSD) | AER status bit set on the SSD or port |\n| 2 | DPC triggers | DPC Status: trigger reason and source ID. Link no longer active |\n| 3 | Traffic to SSD A fails: reads complete UR or CA, writes dropped | CPU sees all ones on MMIO. Commands in flight will time out |\n| 4 | Kernel logs a containment event and calls `error_detected` (frozen) | dmesg order of AER, DPC and nvme lines |\n| 5 | Trigger status cleared, link retrains | Time to Link Active. LnkSta speed and width after recovery |\n| 6 | `slot_reset`: controller re-initialized | CSTS.RDY, queue rebuild, namespace back |\n| 7 | `resume`: I/O restarts | fio errors on SSD A, requeued and failed commands |\n\n- **Blast radius:** the other three SSDs should show no errors, no reset, and only a latency change inside a stated bound. A rise in their errors means the shared upstream path was affected.\n- **Data integrity:** run a full verify on SSD A after recovery. Every write acknowledged before the event must read back. Writes in flight at the event may be old or new but never a mix.\n- **Compare with DPC off:** the same error can escalate to a platform-level fatal event (NMI, machine check, bugcheck). That comparison is the value of DPC.\n- **Failure modes to look for:**\n  - DPC retriggers immediately after clearing (the SSD still faults), giving a loop.\n  - The link returns but at a lower speed or width.\n  - The SSD firmware hangs after the link reset and never sets RDY.\n  - Hot-plug logic removes the device because it treats the link drop as a surprise removal.\n- **Pass criteria:** recovery inside the target time, no data mismatch, siblings unaffected, logs complete, no hang, and the SSD's unsafe shutdown counter unchanged (the link event is not a power loss).","pitfall":"Only checking that the SSD comes back. The pass criteria include the neighbours and the data.","verify":"Linux behaviour on hot-plug interplay for DPC events on your kernel, and what your SSD does with its NVMe state on a link-down and link-up.","follow":[{"q":"How do you inject step 1 in the lab?","a":"With the DPC software trigger or an exerciser for the mechanics, and a device-side hook or `aer_inject` for the log and recovery path. Use several methods."},{"q":"What if the SSDs sit behind a shared switch?","a":"Containment is at the switch downstream port, so still one SSD, but an upstream port trigger would take all of them down. Test both ports."}],"mod":12},{"id":"12.17","level":"Principal","type":"Scenario","fig":null,"tags":["policy","masking","severity","dpc","ecrc","platform","design"],"q":"You are asked to define the PCIe error policy for a server with NVMe backplanes. Which errors do you unmask, which do you escalate, and how do you validate the policy?","short":"Log and rate-monitor every correctable error, keep non-fatal errors reported and handled by drivers, and treat fatal errors as contained events by enabling DPC on every downstream port facing an SSD. Set the Completion Timeout range from measured worst cases, consider raising severity for data-integrity errors like Poisoned TLP, enable ECRC only where validated, and mask nothing without a documented reason. Then validate every choice by injection.","deep":"| Area | Policy | Reason |\n|---|---|---|\n| Correctable | Unmasked, counted, rate-alerted. No escalation | Rising rate is the first sign of a bad link |\n| Non-fatal (UR, CA, CTO, Poisoned, ECRC) | Reported and handled | Each lost a transaction. Drivers need the chance to react |\n| Unsupported Request | Reporting on, log rate-limited | Global masking hides regressions |\n| Fatal | DPC on every SSD-facing downstream port, OS-native ownership or EDR | Confines the blast radius to one drive |\n| Poisoned TLP | Consider severity fatal, plus Poisoned TLP Egress Blocking | Keeps bad data from spreading. Trade-off is more resets |\n| Completion Timeout | Programmed from the measured worst case with margin (see the budget question), never disabled | False timeouts and slow detection are both costly |\n| ECRC | Enable generation and checking end to end if all devices on the path support it | Catches switch-internal faults. Validate first |\n| Firmware-first | Decide ownership per platform, document it | Otherwise tests cannot see errors |\n\n- **Decision criteria:**\n  - Blast radius: a dedicated port per drive makes DPC cheap. A shared upstream port raises the price.\n  - Redundancy: RAID or replication tolerates a drive reset. A single boot drive does not.\n  - Data integrity requirement and end-to-end protection in the NVMe layer.\n  - Platform support: does firmware allow OS-native DPC and AER?\n- **Validation:** for every row, an injection
