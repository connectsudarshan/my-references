Vendor ID read means CRS. FFFFh means UR or no response: no device, link down or a broken route.\n- **Three readiness levels for NVMe:** the link is up, then config space answers, then MMIO registers and CSTS.RDY come ready. CSTS.RDY has its own timeout (CAP.TO), independent of the PCIe rules.\n- **Why SSDs matter:** an SSD firmware boot after an unsafe power loss can rebuild metadata, taking much longer than a clean boot. Firmware that returns nothing instead of CRS, or a BIOS that gives up early, shows up as a missing drive that a later rescan finds.\n- **Measure it:** loop on Vendor ID reads from PERST# deassertion and log CRS count and time to the first valid read across temperature and power-loss states.","pitfall":"Declaring failure at the first FFFFh. The right test distinguishes CRS, UR and link-down using the completion status, the root port link status and a deadline.","verify":"The 100 ms and 1 s values, the Data Link Layer Link Active based timing for greater than 5 GT/s, the FLR timing and the CRS Software Visibility bits in the Base Specification.","follow":[{"q":"Does the endpoint have to return CRS?","a":"It is allowed to while not ready. A device that returns neither CRS nor completions within the limit is out of spec."},{"q":"Can you rescan later?","a":"Yes: `echo 1 > /sys/bus/pci/rescan`. If the device appears, the fault is readiness timing rather than link or hardware."}],"mod":9},{"id":"9.15","level":"Advanced","type":"Cross-layer","fig":null,"tags":["nvme","bar0","cmb","capabilities","doorbell","msix"],"q":"How do NVMe controller registers map onto PCIe BAR0, what capabilities does an NVMe SSD expose, and how does a CMB affect BAR sizing?","short":"NVMe controller registers (CAP, VS, INTMS, INTMC, CC, CSTS, AQA, ASQ, ACQ and more) are memory-mapped from the start of a 64-bit non-prefetchable BAR0, with doorbells at offset 1000h. Its size is the register block plus the doorbells, rounded up to a power of two and at least 16 KB. A CMB adds a separate memory region in a BAR named by its Base Indicator Register, which can force a large prefetchable BAR and Above 4G Decoding.","deep":"| BAR0 offset | Register |\n|---|---|\n| 00h | CAP (Controller Capabilities, 8 bytes) |\n| 08h | VS (Version) |\n| 0Ch, 10h | INTMS, INTMC |\n| 14h, 1Ch | CC, CSTS |\n| 24h, 28h, 30h | AQA, ASQ, ACQ |\n| 38h, 3Ch | CMBLOC, CMBSZ |\n| 1000h | Doorbells |\n\n- **Doorbell footprint:** one submission tail and one completion head doorbell per queue, each `4 << CAP.DSTRD` bytes. With DSTRD = 0 that is 8 bytes per queue pair.\n- **BAR0 size example:** admin plus 128 I/O queue pairs = 129 pairs x 8 B = 1032 B. 4096 + 1032 = 5128 B, so a 16 KB BAR. For 65,535 I/O queue pairs: 4096 + 65,536 x 8 = 528,384 B, which rounds up to 1 MB.\n- **Capabilities usually seen:** Power Management, MSI, PCI Express and MSI-X, plus AER in the extended list, and sometimes SR-IOV, DSN, L1 PM Substates and vendor structures.\n- **MSI-X table and PBA:** they may share BAR0 after the doorbells or live in another BAR (check lspci `Vector table: BAR=`). Doorbell pages and MSI-X tables should not share a 4 KB page.\n- **CMB:** the Controller Memory Buffer is on-SSD memory the host can use for queues or data, located by CMBLOC and sized by CMBSZ. A 256 MB CMB needs a 256 MB, naturally aligned BAR.\n- **Resource failure:** if firmware cannot place that BAR (window too small, or Above 4G Decoding disabled for a 64-bit prefetchable BAR), the kernel logs `BAR n: no space for [mem size ...]` and the controller may not probe at all.","pitfall":"Assuming the BAR0 size shows the number of queues. It only bounds the doorbell area, and the actual queue count comes from CAP, Set Features, and the interrupt vectors available.","verify":"CMBLOC and CMBSZ fields (the Base Indicator Register and whether a CMB may share BAR0), the doorbell stride formula, the 16 KB minimum, and the location of PCIe-specific requirements in the NVMe over PCIe Transport specification versus the Base Specification 2.x.","follow":[{"q":"Why do doorbells start at 1000h?","a":"The specification places the doorbell array right after the 4 KB controller register block, so it starts at 1000h and grows with the number of queues."},{"q":"Where do you see BAR0 in `lspci`?","a":"`Region 0: Memory at ... (64-bit, non-prefetchable) [size=16K]`."}],"mod":9},{"id":"9.16","level":"Advanced","type":"Debug","fig":null,"tags":["all-ones","ffffffff","bar","mmio","link-down","nvme"],"q":"An MMIO read of a BAR, or a config read, returns FFFFFFFFh. What can that mean and how do you narrow it down?","short":"All ones is what the platform returns when a read fails or is not answered. It can mean no device, link down or in Recovery, a read that timed out or was completed with UR or Completer Abort, MMIO with Memory Space Enable off or the BAR outside a bridge window, or a device in reset or a low power state. Check config space first: if Vendor ID also reads FFFFh, the function is gone from the bus. If config is fine, look at decode and the bridge path.","deep":"| Observation | Likely meaning |\n|---|---|\n| Vendor ID reads FFFFh | No answer: absent, link down, in reset, powered off, or bad bus routing |\n| Vendor ID valid, BAR0 MMIO reads FFFFFFFFh | Decode or path problem, or the device ignores MMIO |\n| Vendor ID reads 0001h | CRS: device not ready yet, retry |\n| Only some reads FFFFFFFFh | Intermittent link, retraining or a timeout |\n\nSteps for the second row:\n1. Read Command: is Memory Space Enable set? Read the BAR: is it programmed inside the parent's window?\n2. Read each bridge above: Memory Base/Limit covers the BAR, Memory Space Enable set, and no closed window.\n3. Read the parent's Link Status: Link Training, Data Link Layer Link Active and current speed. A link in Recovery gives timeouts.\n4. Read the PM Control/Status power state (D3hot disables memory decode).\n5. Check root port AER for Unsupported Request or Completion Timeout, and dmesg for `surprise down` or DPC events.\n6. Check FLR or reset in progress and controller state (CSTS.CFS).\n\n- **NVMe hint:** Linux logs `nvme nvme0: controller is down; will reset: CSTS=0xffffffff, PCI_STATUS=0xffff`. A PCI_STATUS of ffff means config is also gone (device removed or link dead). A valid PCI_STATUS with CSTS all ones points to decode, path or reset.\n- **Sizing trap:** a BAR sizing tool that reads FFFFFFFFh back should report \"no device\", not \"4 GB\".","pitfall":"Stopping at \"device gone\". A device with a valid Vendor ID and MMIO all ones is alive at the PCIe level, and the root cause is usually decode, reset or power state, not the link.","verify":"The exact Linux nvme driver message text on your kernel, and how your platform reports failed MMIO reads.","follow":[{"q":"Why does the CPU get all ones instead of an error?","a":"On x86 the host bridge completes a failed read with all ones and, unless configured to report, no exception is raised. Look at AER and platform error logs."},{"q":"How do you tell a link drop from a controller crash?","a":"Link down shows Data Link Layer Link Active clear and config reads fail. A controller crash leaves config alive with the NVMe controller fatal status set."}],"mod":9},{"id":"9.17","level":"Principal","type":"Scenario","fig":null,"tags":["cold-boot","missing-device","crs","perst","triage","reliability"],"q":"An SSD sometimes does not appear after a cold boot, about one boot in 200. How do you find the cause?","short":"Split the failure by how far the device got: power and reset sequencing, link training, configuration readiness (CRS or an early BIOS timeout), then resource assignment. On a failed boot, check whether a later `rescan` finds the device, what the root port link status says and what the BIOS and kernel logs show. Then reproduce with automated power cycling. At 1/200 you need about 600 boots for a 95 percent chance to see one failure.","deep":"1. **Statistics first:** P(at least one failure in n boots) = 1 - (1 - 1/200)^n. For 95 percent, n = ln(0.05) / ln(0.995) = about 598, so run roughly 600 cycles. A relay-controlled power cycler makes that a day's work.\n2. **Classify each failure:**\n\n| Evidence on failed boot | Points to |\n|---|---|\n| Rescan finds it, no link errors | Readiness timing (CRS, firmware boot time, BIOS wait) |\n| Link down, LTSSM stuck in Detect or Polling | Power, PERST# or REFCLK sequencing, connector, retimer |\n| Link up, config reads all ones | Reset timing, device stuck, wrong routing |\n| Config fine, BAR not assigned in dmesg | Resource allocation, Above 4G Decoding, window sizes |\n| Device in a lower speed or width | Link training or equalization (see the link modules) |\n\n3. **Capture:** scope or logic analyzer on power good, REFCLK and PERST#, an analyzer or on-chip LTSSM log, BIOS POST codes, early `dmesg`, and `lspci -vvv` before and after `rescan`.\n4. **Correlate:** temperature, time since previous power-off, unsafe power loss history, firmware and BIOS version.\n5. **Bracket the margin:** add delay between power good and PERST# deassert, or extend the BIOS wait, and see whether the rate moves. Log the device's time to first valid config read.\n6. **Fix owners:** firmware (respond with CRS, faster boot), BIOS (wait time, sequencing) or hardware (rails, reference clock).\n\n- **Decision rule:** if failure rate depends strongly on delay margin, it is a timing race, and fix ownership follows from which side is late.","pitfall":"Treating it as one bug. Missing on a cold boot has at least four distinct causes, and one rate hides all of them.","verify":"PERST# and power-good timing requirements in the CEM specification for your form factor.","follow":[{"q":"What if `rescan` never finds the drive?","a":"Then it is at link or hardware level. Read the root port link state and LTSSM and follow the link triage from the earlier modules."},{"q":"Is the 95 percent figure enough?","a":"It is for finding the failure. For qualifying a fix you need enough clean cycles to bound the failure rate, so several thousand."}],"mod":9},{"id":"9.18","level":"Principal","type":"Scenario","fig":null,"tags":["automation","regression","golden","masks","config-space","volatile","sticky"],"q":"How would you design an automated config-space regression tool that diffs against a golden image across resets and power states?","short":"Capture the full 4 KB of every function, decode it with the capability walk, and compare against a golden per-field, not per-byte. Each field gets a rule: exact match, masked, expected range or ignore. Volatile fields such as Status error bits, link status, AER status and BAR base addresses are masked or checked against expectations instead. Capture after cold boot, warm reset, hot reset, FLR, D3hot to D0 and link retrain, and flag any difference that is not an allowed one.","deep":"- **Capture:** read via sysfs `config` or `lspci -xxxx` as root, retry until Vendor ID is valid (CRS aware), read twice and require agreement, keyed by domain:bus:device.function. Store the raw bytes plus the decoded capability chain and BAR sizes.\n- **Golden creation:** capture the same unit many times with no change, XOR the runs, and mark bits that flip as candidate volatile. A human reviews them. Keep one golden per firmware version and platform.\n- **Field rules:**\n\n| Class | Examples | Rule |\n|---|---|---|\n| Must match exactly | Vendor, Device, Subsystem IDs, Revision, Class Code, Header Type, capability chain and versions, most capability registers, BAR type and size | Exact |\n| Depends on OS or BIOS | BAR base address, Command, Cache Line Size, Interrupt Line, MPS, MRRS, MSI address and data | Check validity (aligned, in window), not equality |\n| Volatile | Status flags, Device Status, Link Status bits (Link Training, sticky Link Bandwidth flags), AER status and header log, PM status | Mask |\n| Expected value | Current Link Speed and Width | Compare against the target, not the golden |\n| Reserved | Reserved bits | Must read zero |\n\n- **Reset expectations:** FLR, hot reset and D3hot to D0 (when it causes a soft reset) return non-sticky registers to defaults, so compare to the default golden and then to the post-driver golden. Sticky registers (AER status, some link and PM bits) survive resets but clear on fundamental reset without auxiliary power.\n- **Reporting:** decoded diff (field name, old, new, severity), and pass or fail per reset type. Store history to spot drift by firmware build.","pitfall":"Diffing raw hex. Status and sticky bits change on every run, and the tool cries wolf until people stop reading it.","verify":"Which registers are sticky and which reset on hot reset, FLR and fundamental reset (per register attribute definitions such as RW1CS) in the Base Specification.","follow":[{"q":"What is the risk of masking too much?","a":"Hiding real bugs. Masking the whole Link Status hides a downgrade, so use expected-value checks instead."},{"q":"How do you avoid false positives from the OS?","a":"Compare only fields the OS should not change, and capture before the driver loads for pure device-owned state."}],"mod":9},{"id":"10.01","level":"Basic","type":"Concept","fig":null,"tags":["interrupts","in-band","msi","intx","posted-write"],"q":"How does a PCIe device raise an interrupt, given that there are no interrupt pins?","short":"PCIe has no sideband interrupt wires, so interrupts travel in-band as TLPs. MSI and MSI-X interrupts are simply posted memory writes: the device writes a small data value to an address the host pre-programmed, and the interrupt controller decodes that write into a CPU interrupt. Legacy INTx is emulated with Assert_INTx and Deassert_INTx message TLPs that mimic a level-sensitive wire.","deep":"- **MSI and MSI-X:** the driver programs an address and data into the device. To interrupt, the device sends a one-dword memory write TLP to that address with that data. On x86 the address range 0xFEExxxxx is claimed by the interrupt controller, not by memory.\n- **INTx emulation:** the device sends Assert_INTA (or B, C, D) when its internal interrupt goes active and Deassert_INTx when it clears. Messages are consumed at the next port and re-issued upstream, and the root complex maps them onto a system interrupt.\n- **Why in-band is good:** the interrupt is ordered with the device's data writes in the same posted stream. If the completion queue entry was written first, the interrupt cannot pass it (subject to ordering rules, see below).\n- **Why it matters for SSDs:** a modern NVMe SSD uses MSI-X, with one vector per completion queue, so completions land on the CPU that issued the command.\n- **Who asks for what:** a device reports which mechanisms it supports through capabilities (MSI 05h, MSI-X 11h), and the OS chooses, normally MSI-X, then MSI, then INTx.","pitfall":"Imagining the interrupt as a signal separate from data. It is a memory write in the same stream, and the ordering of the two is the whole point.","verify":"Whether native PCIe endpoints are required to support INTx, and the Message code values for Assert_INTx and Deassert_INTx.","follow":[{"q":"Is a device required to support INTx?","a":"Native PCIe endpoints that generate interrupts must support MSI or MSI-X. INTx is legacy compatibility and is optional for many."},{"q":"What about PME and hot-plug events?","a":"They use the same in-band mechanisms, usually MSI or MSI-X, with the vector identified in the PCI Express Capabilities register."}],"mod":10},{"id":"10.02","level":"Basic","type":"Concept","fig":null,"tags":["intx","assert","deassert","swizzle","interrupt-pin"],"q":"How does INTx emulation work over PCIe, and how does the INTx-to-pin mapping change through bridges?","short":"The device sends Assert_INTx when its interrupt goes active and Deassert_INTx when it clears, so the message pair behaves as a level-sensitive wire. There are four virtual wires, A to D, and a device picks one by its Interrupt Pin register (3Dh). A bridge forwards them upstream after rotating the letter by the device number of the port, so several devices can share the same wire. The root complex maps wires to system interrupts.","deep":"- **Interrupt Pin (3Dh):** 00h means no INTx, 01h to 04h mean INTA to INTD. Most single-function devices use INTA. The Interrupt Line register (3Ch) is a scratch byte for firmware to record the IRQ.\n- **Per-wire state in bridges:** a bridge or switch tracks each virtual wire as if wired-OR. It sends Assert upstream when the first source asserts and Deassert only when the last source deasserts.\n- **Swizzling:** upstream wire = (child wire + device number of the downstream port) mod 4.\n\n| Port device number | Child INTA | INTB | INTC | INTD |\n|---|---|---|---|---|\n| 0 | A | B | C | D |\n| 1 | B | C | D | A |\n| 2 | C | D | A | B |\n| 3 | D | A | B | C |\n\n- **Purpose:** spreading devices that all use INTA across the four upstream wires.\n- **At the root:** ACPI (`_PRT`) or the device tree maps each device and pin to an IRQ line on the interrupt controller. Devices at different depths can end up sharing one IRQ.\n- **Ordering:** Assert and Deassert messages are posted and stay in order with the device's other posted writes.","pitfall":"Expecting each device to have its own interrupt line. INTx wires are shared by many functions, so the handler must find out who actually raised it.","verify":"The port device number rule and the mapping table in the Base Specification (INTx virtual wire mapping), and the Message code values.","follow":[{"q":"Are Assert and Deassert messages routed to a memory address?","a":"No. They are message requests routed to the local receiver only, consumed and regenerated at each bridge."},{"q":"Why swizzle at all?","a":"PCI had four shared lines, and rotating by slot number balanced the load. PCIe keeps the rule so old software and firmware maps still work."}],"mod":10},{"id":"10.03","level":"Basic","type":"Concept","fig":null,"tags":["intx","sharing","level","disable","interrupt-status","latency"],"q":"What are the problems with INTx, and what do the INTx Disable and Interrupt Status bits do?","short":"INTx is shared, level-sensitive and one wire per function. Shared wires mean every handler on that line runs and has to poll its device. Level semantics mean the source must be cleared before the interrupt is acknowledged, or it fires again. The message path adds latency, and there is no per-queue routing. Command bit 10 (Interrupt Disable) blocks the function's INTx, and Status bit 3 (Interrupt Status) shows whether its INTx is pending.","deep":"- **Sharing:** each handler on the line reads its device to see whether it was the source, and that read is a non-posted transaction across the link, roughly a microsecond in a real system.\n- **Level semantics:** the device holds the interrupt until software clears the cause. If the driver clears it with a posted write and signals end of interrupt at once, the Deassert may not have arrived yet, and the interrupt fires again.\n- **Latency:** an Assert message crosses the fabric, the root complex converts it, and only one CPU gets it. There is no way to target a CPU per queue.\n- **One wire per function:** a multi-queue device cannot say which queue has work.\n- **INTx Disable and Interrupt Status:**\n  - Interrupt Disable (Command bit 10) stops the function from asserting INTx. It has no effect on MSI or MSI-X.\n  - Interrupt Status (Status bit 3) reflects the function's INTx state, and an OS can read it to tell whether a shared line was this device without touching device registers.\n- **NVMe:** the controller supports pin-based interrupts, and uses INTMS/INTMC to mask them, but that path is single-vector and only a fallback.","pitfall":"Believing Interrupt Disable turns off all interrupts. It only affects INTx, and a device using MSI-X keeps interrupting.","verify":"Bit positions of Interrupt Disable (Command bit 10) and Interrupt Status (Status bit 3) in the Base Specification.","follow":[{"q":"Why do drivers read a register back after clearing the interrupt cause?","a":"The read forces the earlier posted write to reach the device before the CPU signals end of interrupt, so the level is really gone."},{"q":"When would you deliberately test INTx on an SSD?","a":"For legacy compatibility (boot environments, old BIOS, virtualized hosts without MSI), and to verify pin-based behavior with INTMS and INTMC."}],"mod":10},{"id":"10.04","level":"Intermediate","type":"Concept","fig":null,"tags":["msi","capability","multiple-message","per-vector-mask","64-bit"],"q":"How is the MSI capability structured, and how does a device generate up to 32 vectors from one address?","short":"The MSI capability (ID 05h) holds Message Control, a Message Address (32 or 64 bit), a 16-bit Message Data, and optionally per-vector Mask and Pending registers. Multiple Message Capable says how many vectors the device wants, as a power of two up to 32, and Multiple Message Enable says how many software granted. The device makes vector n by replacing the low bits of Message Data with n, so all vectors share one address.","deep":"- **Message Control bits:** MSI Enable (bit 0), Multiple Message Capable (3:1), Multiple Message Enable (6:4), 64-bit Address Capable (7), Per-Vector Masking Capable (8).\n- **Layout, 64-bit variant:** Message Address at +4, Upper Address at +8, Message Data at +0Ch, Mask Bits at +10h, Pending Bits at +14h. The 32-bit variant has Data at +8, then Mask at +0Ch and Pending at +10h.\n- **Vector encoding:** the field 2^(MMC) is the requested count: 000b is 1, 001b is 2, 010b is 4, 011b is 8, 100b is 16, 101b is 32. Software programs a base Message Data with the low log2(N) bits zero, and the device ORs vector number n into them.\n- **One address, one CPU:** on x86 the destination CPU is in the message address, so without interrupt remapping every vector of an MSI function lands on the same CPU. That, plus the 32-vector limit and contiguous allocation, is why MSI does not suit multi-queue devices.\n- **Masking:** with per-vector masking, a masked vector that fires sets its Pending bit and is delivered on unmask. Without it, the OS cannot mask at the device.\n- **Enable rule:** software enables MSI or MSI-X on a function, not both. Linux disables MSI before it enables MSI-X.","pitfall":"Assuming vectors in MSI can be steered to different CPUs independently. They share one address, so unless the interrupt controller remaps, they go to the same place.","verify":"Message Control bit positions and the Mask and Pending register offsets for 32-bit and 64-bit variants, what the specification says when MSI and MSI-X are both enabled, and any Extended Message Data bits added in recent revisions.","follow":[{"q":"Can an NVMe SSD use MSI with more than one vector?","a":"Yes, multi-message MSI is allowed, and the NVMe specification lists it as an option. In practice SSDs use MSI-X and MSI is a fallback."},{"q":"What does the OS do if it grants fewer vectors than requested?","a":"Multiple Message Enable is set lower, and the device must fold its interrupt sources onto the granted vectors."}],"mod":10},{"id":"10.05","level":"Intermediate","type":"Concept","fig":"msix","tags":["msi-x","table","pba","bir","vector-control","function-mask"],"q":"How is MSI-X structured, and how do the table, the PBA and the mask bits work?","short":"The MSI-X capability (ID 11h) points to two structures in device BARs. The MSI-X Table holds up to 2048 sixteen-byte entries of Message Address (low and high), Message Data and Vector Control, and the Pending Bit Array (PBA) holds one bit per vector. Each entry has its own address and data, so each vector can target a different CPU. Vector Control bit 0 masks one vector, and Function Mask in Message Control masks all of them.","deep":"- **Capability fields:** Message Control has Table Size (bits 10:0, N-1 encoded), Function Mask (bit 14) and MSI-X Enable (bit 15). The Table Offset/BIR register (at +4) and PBA Offset/BIR (at +8) each hold a BAR indicator in bits 2:0 (0 to 5 for BAR0 to BAR5) and a QWORD-aligned offset in bits 31:3.\n- **Table entry (16 bytes):** Message Address Lower (+0), Upper (+4), Message Data (+8), Vector Control (+0Ch, bit 0 is Mask).\n- **PBA:** one bit per vector packed into 64-bit words. It is read-only to software.\n- **Masking flow:**\n  1. A masked vector (or one under Function Mask) that wants to fire sets its PBA bit instead.\n  2. When software unmasks it, the device sends the message and clears the PBA bit.\n  3. Several events while masked collapse into one message.\n- **Rule for changes:** software must mask an entry before changing its address or data.\n- **Why it is better than MSI:** up to 2048 vectors, arbitrary per-vector address and data, and no contiguity requirement.\n- **Requirements:** the table and PBA live in memory space, so the BAR must be programmed and Memory Space Enable must be on, and Bus Master Enable must be on for the device to send the message.","pitfall":"Rewriting a live vector's address and data without masking it first. A message in flight can go to the old CPU with the new data, or the other way around.","verify":"Bit positions in Message Control, Table Size encoding, the QWORD alignment of table and PBA offsets, and the page-sharing rule in the MSI-X section of the Base Specification.","follow":[{"q":"Can the MSI-X table share a BAR with device registers?","a":"Yes, but the specification wants registers not to share a 4 KB page with the table or the PBA, so that a hypervisor can trap them separately."},{"q":"What does MSI-X Enable with Function Mask do?","a":"Nothing is sent, and events accumulate in the PBA until the function mask is cleared."}],"mod":10},{"id":"10.06","level":"Intermediate","type":"Numeric","fig":null,"tags":["msi-x","table-size","pba","bar-footprint","worked-example"],"q":"How big are the MSI-X table and PBA for N vectors, and what BAR footprint results?","short":"The table takes 16 bytes per vector and the PBA takes one bit per vector rounded up to whole 8-byte words. So 129 vectors need 2064 bytes of table and 24 bytes of PBA. The maximum of 2048 vectors needs 32 KB of table and 256 bytes of PBA. The Table Size field stores N minus 1 in 11 bits.","deep":"1. Table bytes = N x 16.\n2. PBA bytes = ceil(N / 64) x 8.\n3. Table Size field = N - 1.\n\n| N | Table | PBA | Table Size field |\n|---|---|---|---|\n| 1 | 16 B | 8 B | 0 |\n| 32 | 512 B | 8 B | 31 |\n| 65 | 1040 B | 16 B | 64 |\n| 129 | 2064 B | 24 B | 128 |\n| 2048 | 32768 B (32 KB) | 256 B | 2047 |\n\n- **Example, a 128-queue SSD:** one vector per I/O queue plus one for the admin queue makes 129. `lspci` prints `MSI-X: Enable+ Count=129`. Table at BAR0 offset 2000h occupies 2000h to 280Fh. PBA at 3000h.\n- **Register encoding:** Table Offset/BIR = 00002000h (offset 2000h, BIR 0), PBA Offset/BIR = 00003000h.\n- **BAR footprint:** if the maximum table sits alone in a BAR, the table needs 32 KB and the PBA a further 256 B. With both in one BAR that is 32 KB + 256 B, so the BAR is rounded up to 64 KB.\n- **Page rule:** table and PBA sit on their own 4 KB pages (2000h and 3000h above) so they do not share pages with doorbells or other registers.","pitfall":"Computing PBA as N / 8 bytes. For non-multiples of 64 vectors, the array is rounded up to whole 64-bit words.","verify":"The PBA rounding rule (QWORD units) and the maximum table size in the MSI-X section of the Base Specification.","follow":[{"q":"Why is the PBA measured in 64-bit words?","a":"Its offset and access are QWORD aligned, so it is an array of 8-byte words."},{"q":"Does the SSD need to use all vectors the table offers?","a":"No. Table Size is what the function can expose, and software enables as many as it allocates."}],"mod":10},{"id":"10.07","level":"Intermediate","type":"Concept","fig":null,"tags":["x86","apic","fee00000","interrupt-remapping","iommu"],"q":"What is the memory write of an MSI or MSI-X interrupt on x86, and where does interrupt remapping fit in?","short":"On x86 the write goes to an address in 0xFEExxxxx. The address carries the destination CPU (APIC ID) and the data carries the vector and delivery mode. The host bridge routes it to the local APIC, not to DRAM. With an IOMMU and interrupt remapping enabled, the address and data instead hold an index into an interrupt remapping table, whose entry supplies the real destination and vector, and is checked against the requester ID.","deep":"- **Compatibility format:** address bits 31:20 are FEEh, bits 19:12 are the destination APIC ID, and low bits hold redirection hint and destination mode. Data bits 7:0 are the vector and bits 10:8 the delivery mode.\n- **Remappable format:** an address bit marks the request as remappable, and a handle in the address (plus a subhandle in the data) indexes the interrupt remapping table. The entry holds destination, vector, mode and a source check.\n- **Why remap:** it allows destinations above 255 APIC IDs (x2APIC), lets the kernel retarget an interrupt by editing a table entry rather than reprogramming the device, and stops a device or VM from raising an interrupt it was not assigned.\n- **Faults:** a request that is invalid, not present or from the wrong requester is blocked and logged by the IOMMU, for example `DMAR: [INTR-REMAP] Request device [3b:00.0] fault index ...` on Intel.\n- **Other architectures:** on Arm the write goes to a translation register of the GIC ITS, and the data is an event ID that the ITS looks up with the device ID.\n- **Test trick:** in a test rig you can point the address at ordinary memory to capture the message, but on a system the address must be one the interrupt controller decodes.","pitfall":"Describing the interrupt write as memory traffic that lands in DRAM. It is decoded as an interrupt by the platform, and it is the reason for special address ranges.","verify":"Address and data field layouts for the compatibility and remappable formats in the Intel SDM and VT-d specification (and the AMD IOMMU and Arm GIC equivalents), and the exact fault message text on your kernel.","follow":[{"q":"Does the interrupt write go through the DMA address translation?","a":"Interrupt requests are recognized separately and handled by interrupt remapping, not by the DMA page tables."},{"q":"Why might a VM guest's interrupts fail after enabling passthrough?","a":"The remapping entry or requester ID check is wrong or missing, which shows up as an IOMMU interrupt fault."}],"mod":10},{"id":"10.08","level":"Intermediate","type":"Debug","fig":null,"tags":["proc-interrupts","lspci","sysfs","windows","perfmon","tools"],"q":"How do you inspect an NVMe SSD's interrupts on Linux and Windows?","short":"On Linux, `cat /proc/interrupts` shows per-CPU counts for each `nvme0qN` vector, `/proc/irq/<n>/effective_affinity_list` shows where each lands, and `lspci -vvv` shows the MSI-X count, enable state and table location. On Windows, Device Manager shows the resources (MSI interrupts have negative IRQ numbers), and Performance Monitor's Interrupts/sec and DPC counters show rates. Verify the queue count, spread and rate match what you expect.","deep":"```\n 168:  0  4211  0  0  IR-PCI-MSIX-0000:3b:00.0   1-edge   nvme0q1\n```\n- **Linux:**\n  - `grep nvme /proc/interrupts`: the name `nvme0q0` is the admin queue and `nvme0qN` are I/O queues. Each row's counts should climb on the CPU that submits to that queue.\n  - `cat /proc/irq/168/smp_affinity_list` and `effective_affinity_list`: the allowed and actual CPU. Kernel-managed NVMe vectors reject writes to `smp_affinity`.\n  - `ls /sys/bus/pci/devices/0000:3b:00.0/msi_irqs` lists the vector numbers, and `/sys/kernel/irq/168/` has `chip_name`, `hwirq`, `actions` and `per_cpu_count`.\n  - `lspci -vvv -s 3b:00.0` shows `MSI-X: Enable+ Count=129 Masked-` and the table and PBA BAR and offset. `MSI: Enable-` means MSI is off.\n  - `nvme list-subsys` maps the controller to its PCI address, and `/sys/block/nvme0n1/mq/*/cpu_list` shows which CPUs use each hardware queue.\n  - `mpstat -I SUM` and `sar -I` show interrupt rates per CPU.\n- **Windows:**\n  - Device Manager, View, Resources by type, Interrupt request: MSI/MSI-X entries show as negative numbers.\n  - Performance Monitor: `Processor Information\\Interrupts/sec`, `% Interrupt Time`, `% DPC Time`, `DPCs Queued/sec`. Windows Performance Analyzer (xperf) attributes ISR and DPC time to drivers.\n  - The MSI mode of a device is controlled by the `MSISupported` value under the device's `Interrupt Management\\MessageSignaledInterruptProperties` registry key, and `MessageNumberLimit` caps its vectors.\n- **What to check:** vectors granted versus queues created, even spread across CPUs, and rates that match the workload.","pitfall":"Reading a single snapshot. Interrupt counters are cumulative, so take two samples and compute a rate.","verify":"The sysfs and procfs paths on your kernel version, and the Windows counter names and registry key on your Windows version.","follow":[{"q":"How can you tell a queue is using an interrupt versus polling?","a":"An interrupt-driven queue's `/proc/interrupts` count rises under load. A poll queue has no vector, and its counter stays flat."},{"q":"Why does `/proc/interrupts` show fewer NVMe vectors than CPUs?","a":"The device or the driver capped the queue count, and CPUs share hardware queues."}],"mod":10},{"id":"10.09","level":"Advanced","type":"Cross-layer","fig":null,"tags":["nvme","multi-queue","affinity","blk-mq","scaling"],"q":"Why does MSI-X scale for multi-queue NVMe, and how are vectors, queues and CPUs paired?","short":"NVMe gives each CPU (or group of CPUs) its own submission and completion queue pair, and MSI-X gives each completion queue its own vector with its own CPU target. A command is submitted, completed and interrupted on the same CPU. That avoids locks on shared queues, cross-CPU wakeups and cache line bouncing. MSI cannot do this, since all its vectors share one address and so one CPU on x86.","deep":"- **Pairing:** with 64 CPUs, the driver creates up to 64 I/O queue pairs plus the admin queue, and requests 65 vectors. Vector 0 serves the admin CQ. I/O CQ n uses vector n and is pointed at the CPU that owns SQ n.\n- **Why it scales:** the submitting CPU writes only its own SQ tail doorbell, and the completion interrupt runs on that CPU, so the completion touches memory already cache-hot for that queue. No global lock is needed.\n- **Managed affinity:** Linux spreads vectors across CPUs automatically (managed IRQ affinity), so the kernel, not irqbalance, owns placement, and it retargets vectors when CPUs go offline.\n- **Fewer vectors than CPUs:** several CPUs share a queue, and the vector targets one of them. Fewer queues means more contention, but it still works.\n- **Fewer vectors than queues:** the driver reduces the number of I/O queues to what it got, or several CQs share a vector and the handler scans each of them.\n- **Cost of sharing:** a shared vector must check every CQ mapped to it and serve them one after another.","pitfall":"Testing scaling with fewer vectors than CPUs and blaming the SSD for the contention that sharing causes.","verify":"How the Linux nvme driver adjusts queue count when fewer vectors are allocated than requested, and the Windows NVMe driver's queue and vector assignment behavior.","follow":[{"q":"Why can you not spread MSI vectors like this?","a":"All vectors of one MSI function share the same message address, and on x86 that address names the destination CPU."},{"q":"What happens to the CQ of a CPU that goes offline?","a":"The managed vector is shut down and the queue is quiesced, and its commands are drained first."}],"mod":10},{"id":"10.10","level":"Advanced","type":"Cross-layer","fig":null,"tags":["nvme","iv","create-io-cq","coalescing","intms","intmc","fallback"],"q":"How do NVMe queues name their interrupt vectors, and how do coalescing and INTMS/INTMC work?","short":"The Admin CQ always uses vector 0. Each I/O CQ names a vector in the IV field of Create I/O Completion Queue, and the IEN bit says whether it interrupts at all. Interrupt Coalescing (Set Features FID 08h) sets an aggregation threshold and time, and Interrupt Vector Configuration (FID 09h) disables coalescing per vector. INTMS and INTMC mask vectors for pin-based and MSI interrupts only, not MSI-X.","deep":"- **Create I/O CQ:** CDW10 holds QID and queue size, CDW11 holds PC (bit 0, contiguous), IEN (bit 1, interrupts enabled) and IV (bits 31:16). An IV past the vectors available is rejected as an invalid interrupt vector.\n- **Sharing:** many CQs may name the same vector. With pin-based or single-message MSI, all CQs use vector 0.\n- **Coalescing (FID 08h):** THR in bits 7:0 (a 0's based count of completions) and TIME in bits 15:8 (in 100 microsecond units). A vector is signaled when the count reaches the threshold or the timer expires, whichever comes first. `nvme set-feature /dev/nvme0 -f 8 -v 0x0107` means 8 completions or 100 microseconds.\n- **Per-vector control (FID 09h):** the vector number and a Coalescing Disable bit, so a latency-sensitive vector can opt out.\n- **INTMS/INTMC (BAR0 0Ch and 10h):** write 1 to a bit in INTMS to mask that vector and in INTMC to unmask it. They apply to pin-based and multi-message MSI. For MSI-X you use the MSI-X mask bits.\n- **Fallback:** if the OS obtains fewer vectors than queues, queues share vectors. If it gets only MSI or INTx, the device still works, on vector 0.\n- **Queue count versus vector count:** Set Features Number of Queues (FID 07h) sets the number of queues and does not by itself allocate vectors.","pitfall":"Using INTMS/INTMC to mask an MSI-X vector. The registers are not defined for MSI-X, so the mask has no effect.","verify":"FID 08h and 09h field layout (THR, TIME, IV, CD), the Create I/O CQ CDW11 fields, coalescing behavior on the admin vector, and INTMS/INTMC applicability, in the NVMe Base Specification 2.x and the NVMe over PCIe Transport Specification.","follow":[{"q":"Does coalescing apply to the admin queue?","a":"Do not assume. Check the specification wording for vector 0 and test it on your controller."},{"q":"How do you read the current setting?","a":"`nvme get-feature /dev/nvme0 -f 8 -H` (and `-f 9 -c <vector>` for the per-vector setting)."}],"mod":10},{"id":"10.11","level":"Advanced","type":"Numeric","fig":null,"tags":["interrupt-rate","coalescing","iops","cpu-cost","latency"],"q":"At 1 million IOPS, how many interrupts per second result with and without coalescing, and what does it cost in latency?","short":"With one interrupt per completion, 1M IOPS is 1M interrupts per second. On 64 vectors that is 15.6K per vector, one every 64 microseconds. At an assumed 1.5 microseconds of CPU per interrupt that costs 1.5 cores. With aggregation threshold 8 and time 100 microseconds, 64 vectors drop to about 390K per second (2.6 times fewer), and 8 vectors drop to 125K per second (8 times fewer). The price is added completion latency.","deep":"Assumptions: 4 KB random IO, completions spread evenly, 1.5 microseconds of fixed CPU cost per interrupt (entry, handler, exit), and a controller that signals on threshold reached or time expired, starting the timer at the first pending completion.\n1. **No coalescing, 64 vectors:** 1,000,000 / 64 = 15,625 per vector per second, so one completion every 64 microseconds. Total 1M interrupts per second. CPU = 1,000,000 x 1.5 us = 1.5 cores of interrupt overhead.\n2. **THR = 8, TIME = 100 us, 64 vectors:** eight completions would take 8 x 64 = 512 us to accumulate, so the 100 us timer fires first. A cycle is about 100 us plus about 64 us of average wait for the next completion, so 164 us. That is 6,098 interrupts per vector, or about 390K per second. Each interrupt carries 100/64 + 1 = about 2.6 completions. CPU falls to about 0.59 core. Added latency is up to 100 us.\n3. **THR = 8, TIME = 100 us, 8 vectors:** each vector sees 125,000 per second, one every 8 us, so the threshold hits after 64 us. That is 15,625 per second per vector, 125K total. CPU is about 0.19 core, with added latency up to about 56 us for the first completion in a batch.\n4. **QD1:** with one command outstanding, the threshold is never reached, so every completion waits the full 100 us. An 80 us read becomes about 180 us.\n\n- **Lesson:** coalescing helps when each vector sees many completions in a short time, and hurts low queue depth latency.\n- **Not counted:** per-completion work (CQE processing, blk-mq completion) does not shrink, only the fixed per-interrupt cost.","pitfall":"Applying a coalescing setting to a test that runs QD1 and calling the extra latency a firmware regression.","verify":"Whether the controller starts the coalescing timer at the first pending completion, the units of TIME and the 0's based THR in the NVMe Base Specification.","follow":[{"q":"Why do most Linux systems leave coalescing off?","a":"Per-CPU queues with managed affinity, and a large enough queue count, keep the interrupt rate per vector modest, and added latency is unwelcome."},{"q":"What is the alternative for very high IOPS?","a":"Polling queues, or software adaptive schemes, which trade CPU for latency, covered next."}],"mod":10},{"id":"10.12","level":"Advanced","type":"Concept","fig":null,"tags":["polling","hybrid-polling","io-uring","poll-queues","latency"],"q":"When does polling beat interrupts for NVMe, and how do poll queues and hybrid polling work?","short":"Polling has the host spin on the completion queue phase bit instead of waiting for an interrupt. It saves the interrupt and wakeup cost, a few microseconds, which matters when the device latency is only tens of microseconds, and it costs a busy core. Linux uses dedicated poll queues, created without interrupts, driven by io_uring with `hipri` or the polling flag. Hybrid polling sleeps for part of the expected latency before spinning.","deep":"- **Mechanism:** the CQ head entry has a phase bit. The host checks it in a loop, and when it flips, the entry is new. No vector is needed, so the queue is created with interrupts disabled (IEN = 0).\n- **Linux setup:** `modprobe nvme poll_queues=4` (or `nvme.poll_queues=4` at boot) gives dedicated poll queues. Run fio with `--ioengine=io_uring --hipri=1 --direct=1`. Some kernels also expose `/sys/block/nvme0n1/queue/io_poll`.\n- **Hybrid polling:** rather than spin from submission, the kernel sleeps for an estimated fraction of the latency (`io_poll_delay`) and then polls, cutting CPU with a small latency penalty. Support for this differs by kernel version.\n- **When it wins:** low-latency devices (an assumed 10 us read), where 2 to 4 us of interrupt and wakeup overhead is 20 to 40 percent, at low queue depth.\n- **When it loses:** NAND devices at 80 us or more, where the same saving is a few percent, and any deep-queue throughput test that is CPU bound.\n- **Cost:** each poll queue burns 100 percent of a core while active.\n- **Validation:** poll queues exercise host paths that interrupt mode barely touches, such as CQ phase handling across wraparound, and they bypass the interrupt path entirely.","pitfall":"Benchmarking polling on a slow NAND SSD and concluding it is useless, or on a fast device and ignoring the CPU cost.","verify":"The nvme `poll_queues` module parameter, `io_poll` and `io_poll_delay` sysfs behavior, and whether hybrid polling exists in your kernel version.","follow":[{"q":"Why does polling help latency but not throughput?","a":"At high queue depth interrupt cost is amortized over many completions, and the CPU spins without new work to do."},{"q":"Do poll queues consume interrupt vectors?","a":"No, which also relieves vector pressure on devices with limited vectors."}],"mod":10},{"id":"10.13","level":"Advanced","type":"Trap","fig":null,"tags":["ordering","cqe","posted-write","relaxed-ordering","dma-rmb"],"q":"The host takes the MSI-X interrupt but reads a stale completion queue entry. How is that possible when posted writes are ordered?","short":"PCIe keeps posted writes in order, so the CQE and MSI-X writes stay in order if they share a traffic class and path and have Relaxed Ordering clear. If the CQE or MSI-X write had RO set, or the paths differ, or the host reads CQE fields without a memory barrier after seeing the phase bit, the CPU can see the interrupt first or read stale data. Ordering rules are in the Flow Control and Ordering module.","deep":"- **Normal case:** the device writes data, then the CQE, then the MSI-X message, all posted, all in one stream. A posted write may not pass a posted write, so the platform must make the earlier writes visible before it delivers the interrupt.\n- **How it breaks:**\n  - **Relaxed Ordering on the CQE or the MSI-X write:** RO (or IDO) on the later TLP is what lets it pass earlier posted writes, so the CQE can overtake the data, or the interrupt can overtake the CQE. Check that the NVMe controller does not set RO on CQE or MSI-X writes.\n  - **Different route or traffic class:** if the two writes take different paths or TCs, no ordering is guaranteed.\n  - **Host side:** the driver sees the phase bit of the CQE, then reads the other fields. Without a read barrier (Linux uses `dma_rmb()`) the CPU may reorder those loads.\n- **How to prove which:** an analyzer trace shows the order and attributes (TC, RO, IDO, No Snoop) of the three writes on the wire. If wire order is correct, the fault is host-side.\n- **Related note:** RO on the data writes alone does not let the CQE pass them, because the CQE write has RO clear. It only lets a data write pass earlier writes, which matters for overlapping writes to the same address.","pitfall":"Blaming the device first. With correct wire ordering, missing barriers in host software are just as likely a cause.","verify":"The ordering table in the Base Specification (posted versus posted with Relaxed Ordering and IDO), and the NVMe requirement for the ordering of CQE and interrupt writes.","follow":[{"q":"Can an ISR read of a device register act as a barrier?","a":"Yes. The read completion cannot pass the device's earlier posted writes, so it flushes them, at the cost of an MMIO read. NVMe drivers avoid it and rely on ordering plus barriers."},{"q":"Where should you check attributes first?","a":"The TLP header of the CQE write and the MSI-X write in a trace: TC, Relaxed Ordering, ID-Based Ordering and No Snoop."}],"mod":10},{"id":"10.14","level":"Advanced","type":"Debug","fig":null,"tags":["interrupt-storm","spurious","nobody-cared","level","stuck"],"q":"An interrupt storm or spurious interrupts appear on an NVMe SSD. How do you tell them apart and find the cause?","short":"A storm is far too many interrupts (the rate per vector far above the completion rate, often pinning a core), a spurious interrupt is one that finds no work. Compare the interrupt rate with the IOPS rate, then check for a level-triggered line that is never cleared (INTx or pin-based), a completion queue head doorbell that is not advancing, a broken phase bit, a masked or mis-coalesced vector, or a device that signals without a CQE.","deep":"1. **Measure:** two `/proc/interrupts` samples give interrupts per second per vector. Compare with IOPS from fio or `iostat`. Interrupts much larger than completions is a storm.\n2. **Level-triggered line (INTx or pin-based NVMe):** the source stays asserted until cleared. The kernel may print `irq N: nobody cared` and disable the line if nearly all of the last 100,000 interrupts were unhandled. Check Interrupt Status in Status (bit 3) and INTMS.\n3. **MSI-X, edge-like:** repeated messages usually mean the device keeps signaling because the CQ head doorbell was not written, or firmware signals without posting an entry. Read the CQ head and tail and compare with the phase.\n4. **Spurious cases that are benign:**\n   - A shared vector where another CQ's handler already consumed the entry.\n   - An interrupt that arrives after a polled completion.\n   - A late coalesced interrupt for entries already processed.\n5. **Harmful cases:**\n   - Coalescing settings that give a different interrupt rate than intended.\n   - A mask that is toggled repeatedly, re-sending the pending message each time.\n   - A firmware bug that signals on doorbell writes or repeatedly for one CQE.\n6. **Isolate:** stop the workload. If interrupts continue at a steady rate, the device signals without work. Compare INTx, MSI and MSI-X modes and firmware versions.\n- **Evidence:** the interrupt count versus completions, the CQ head, tail and phase, Interrupt Status, and a trace of the message writes if you have an analyzer.","pitfall":"Calling every handler that finds no CQE a bug. A few are normal, and only a high sustained rate is a defect.","verify":"The kernel's spurious interrupt threshold and message text for your version, and the NVMe rules for when a controller re-signals after a CQ head doorbell update in MSI and MSI-X mode.","follow":[{"q":"Why does the kernel disable an IRQ that fires too often?","a":"To stop one broken device from starving the CPU, it disables the line after too many interrupts are unhandled."},{"q":"Does a storm always mean a device bug?","a":"No. A driver that fails to update the CQ head doorbell, or misreads the phase bit, is the other main suspect."}],"mod":10},{"id":"10.15","level":"Principal","type":"Debug","fig":null,"tags":["lost-interrupt","pba","mask","rearm","timeout","nvme"],"q":"NVMe I/O times out although the controller posted the completion. How do you find out whether an interrupt was lost, and why?","short":"If the timeout handler finds the CQE already there (Linux logs `I/O ... timeout, completion polled`), the data path worked and the interrupt did not arrive. Then check the delivery chain in order: Bus Master Enable, MSI-X Enable and masks, the PBA pending bit, the table entry contents, interrupt remapping and the affinity path, and the driver's re-arm logic and CQ head doorbell handling.","deep":"1. **Confirm it is an interrupt problem:** the CQ entry with the right phase is in host memory but the ISR never ran. Compare the CQ contents with `/proc/interrupts` for that vector.\n2. **Device-side gating (`lspci -vvv`):**\n   - Bus Master Enable on the SSD and on every bridge above (upstream forwarding).\n   - MSI-X Enable set, Function Mask clear, Masked flag off.\n3. **PBA:** read the PBA bit of the vector from BAR memory. A pending bit stuck at 1 means the device wanted to signal but the vector is masked (or was masked and never unmasked). If it is 0 and no message was sent, the device did not try.\n4. **Mask and unmask race:** the driver masks a vector, handles work, unmasks. The device must then send exactly one message for anything pending. A device that clears the pending bit without sending, or software that unmasks before the completion path is ready, loses the wake-up.\n5. **Table entry:** address and data must be as programmed. After a reset or Function Level Reset, table contents may be lost, and drivers must restore them. If the table was written while Memory Space Enable was off or into the wrong BAR (wrong BIR), entries stay at reset defaults, and an address of 0 sends the interrupt to the wrong place.\n6. **Remapping and affinity:** an IOMMU interrupt remapping fault log (invalid entry, wrong requester) or a race during an affinity change can drop the interrupt.\n7. **Re-arm logic and coalescing:** the driver must consume all valid entries and write the CQ head doorbell. With coalescing, a low-rate vector waits for the timer, and a broken timer means it never fires.\n- **Evidence to save:** CQ head and tail, phase, PBA and mask state, `lspci` output, IOMMU log, and an analyzer trace showing whether an MWr to the vector address occurred.","pitfall":"Assuming the polled completion proves the device is healthy. It proves the data path worked once, and the cause can still be the device's decision to signal.","verify":"The Linux timeout log message text, the exact NVMe rule for re-signaling after a CQ head doorbell write, and whether MSI-X table contents survive Function Level Reset for your device.","follow":[{"q":"The trace shows the MWr was sent but the CPU did not run the ISR. What next?","a":"Follow the platform: interrupt remapping fault log, the effective affinity CPU (offline, isolated or busy with interrupts disabled), and the IRQ line disabled by the kernel."},{"q":"The trace shows no MWr and PBA is clear. What is the cause?","a":"The device did not decide to signal: coalescing state, an internal firmware event, or a CQE posted without generating the interrupt."}],"mod":10},{"id":"10.16","level":"Principal","type":"Scenario","fig":null,"tags":["numa","affinity","cross-socket","latency","irq-balance"],"q":"p99 latency of an SSD is 30 percent worse when the workload runs on socket 1 than on socket 0. How do you determine whether interrupt affinity is the cause?","short":"Find which NUMA node the SSD hangs off, then check where its vectors and their queues run. Interrupts, CQ memory and doorbells on the far socket cross the inter-socket link each time, adding latency and contention. Compare runs pinned near and far with fio, read the effective affinity of each vector, and check the queue-to-CPU map. Fix by pinning the workload and vectors to the SSD's socket, or by making managed affinity spread correctly.","deep":"1. **Topology:** `cat /sys/bus/pci/devices/0000:3b:00.0/numa_node`, `lscpu` and `numactl -H`. The device is local to one socket.\n2. **Where interrupts run:** `/proc/irq/<n>/effective_affinity_list` for each `nvme0qN`, and `/sys/block/nvme0n1/mq/*/cpu_list`. A vector serving CPUs on socket 1 may target a CPU on socket 0, or the opposite.\n3. **A/B test:** `fio` with `--cpus_allowed` on each socket, same block size and depth, and compare IOPS, average and p99 latency. Repeat with the vector affinity changed (for unmanaged IRQs, `smp_affinity_list`).\n4. **What crosses the socket:** the doorbell write, the interrupt, CQ and SQ memory accesses, and the data buffers. The device DMA to memory on the far node also crosses the link.\n5. **Estimate:** assume 100 ns per cross-socket access and about 5 such accesses per IO, so about 0.5 us on an 80 us read, under 1 percent unloaded. The bigger effect appears in tail latency under load when the inter-socket link is busy, and in IOPS at high queue depth.\n6. **Decide:** if pinning near removes the gap and moving only the interrupt changes it partly, affinity is a contributor. If not, look at memory placement, power management and IOMMU.\n- **Fix:** run the application on the SSD's node, use one queue per local CPU, and avoid `irqbalance` moving vectors across sockets. Windows offers interrupt affinity policy for the device.","pitfall":"Using unloaded numbers to dismiss NUMA. The penalty grows with link utilization, so measure under load.","verify":"The 100 ns cross-socket estimate for your platform (measure it), and whether your kernel's managed IRQ affinity respects NUMA locality for NVMe queues.","follow":[{"q":"Why is the effect bigger on p99 than on average?","a":"Cross-socket traffic is affected by queueing on the inter-socket link, which mostly hurts the tail."},{"q":"What if the SSD is dual-port and connected to both sockets?","a":"Then locality depends on the path, so check which port each queue and its vector use."}],"mod":10},{"id":"10.17","level":"Principal","type":"Scenario","fig":null,"tags":["validation","msi-x","boundary","pba","remapping","test-plan"],"q":"How would you design a validation plan for an SSD's MSI-X implementation?","short":"Test the table and PBA against the specification from the register level up: vector count boundaries, masking and pending semantics, enable and mask interactions, contents after resets, and the TLPs the device actually sends. Then test with real hardware paths: interrupt remapping faults, affinity changes under load, and error conditions such as a disabled BAR. Use a PCIe exerciser or analyzer to see the messages, and a scoreboard that counts expected against received interrupts per vector.","deep":"1. **Boundaries:** Table Size of 1, 2 and 2048 vectors if supported, and the largest the SSD claims. Confirm the N-1 encoding, table and PBA offsets on QWORD boundaries, BIR pointing to an implemented BAR, and the table inside the BAR size.\n2. **Delivery:** for each vector, program a unique address and data, trigger it (an admin or I/O completion), and check the message: length 1 DW, address and data as programmed, requester ID, 3DW header when the address is below 4 GB, TC0 and attributes.\n3. **Masking and PBA:**\n   - Mask, trigger, verify no message and PBA bit set. Trigger several times, unmask, verify exactly one message and PBA cleared.\n   - Function Mask on and off, with the same checks.\n   - MSI-X Enable off with MSI enabled, and the both-enabled case only if the specification defines it.\n   - PBA is read-only and a read has no side effect.\n4. **Update rules:** change address and data with the vector masked, and check the next message uses the new values.\n5. **Reset behavior:** table contents, mask bits (reset to masked) and PBA after Function Level Reset, controller reset (CC.EN 0 then 1), D3hot to D0, and hot reset.\n6. **Command bits:** Bus Master Enable off means no messages, and Memory Space Enable off means table writes are not decoded.\n7. **Platform and IOMMU:** enable interrupt remapping and check remapped delivery, an invalid index or wrong requester ID producing a logged fault, and no lost interrupt while the kernel changes affinity under load.\n8. **Stress:** all vectors firing concurrently, masking and unmasking during traffic, and interrupts at line rate. Verify no message is lost or duplicated beyond what masking allows.\n9. **Scoreboard:** per vector expected count versus received, latency histogram, and errors logged.\n- **Pass criteria:** every message matches its entry, no unexpected loss, one message per unmask.\n- **Automation:** a test driver or exerciser that owns the table (so the kernel does not rewrite it), with an analyzer capture on failure.","pitfall":"Validating only through a stock OS driver. The kernel hides table writes and masks, so many corner cases never occur. Use a driver or exerciser that controls them.","verify":"Reset values of MSI-X Enable, Function Mask and per-vector Mask bits after each reset type, and the TLP format rule for addresses below 4 GB, in the Base Specification.","follow":[{"q":"How do you inject the IOMMU faults?","a":"Program a table entry whose handle is outside the remapping table or not present, or send from a function whose requester ID does not match the source check."},{"q":"Which failures are most valuable to find?","a":"Lost wake-ups around unmask, wrong state after resets, and wrong message address or data bits (for example the upper address not sent), which only show up on real platforms."}],"mod":10},{"id":"11.01","level":"Basic","type":"Concept","fig":"pmstates","tags":["d-states","l-states","mapping","overview"],"q":"PCIe has D-states and L-states. What is the difference, and how do they map to each other?","short":"D-states (D0, D1, D2, D3hot, D3cold) belong to a function and are set by software through the Power Management capability. L-states (L0, L0s, L1, L2, L3) belong to a link and are run by the ports and the LTSSM. They are separate families tied by rules: D0 allows L0, L0s and L1, D3hot forces the link into L1, and D3cold means the link is in L2 or L3.","deep":"| Device state | Link states allowed | What it means |\n|---|---|---|\n| D0 | L0, L0s, L1 (with L1.1 and L1.2 substates) | Function fully on. The link may still dip into ASPM idle states on its own |\n| D1, D2 | L1 | Optional intermediate states. Few NVMe SSDs implement them |\n| D3hot | L1 | Main power and reference clock present, config space accessible, software-directed L1 |\n| D3cold | L2 (aux power) or L3 (off) | Main power removed. State is lost unless aux power keeps some of it |\n\n- **Who owns what:** the D-state is per function and lives in a config register. The L-state is per link and lives in the LTSSM of both ports. A device can be in D0 with its link in L1, but it cannot be in D3hot with the link in L0 (apart from the brief transition).\n- **Multi-function devices:** the link enters L1 by software direction only when every function has left D0.\n- **Where the mechanics are:** L0s, L1 and L2 entry and exit are in the LTSSM module, and the PM DLLP handshake is in the Data Link Layer module. This module covers policy, registers and the NVMe layer on top.\n- **A third ladder:** NVMe adds its own power states PS0 to PSn inside the controller. They are independent of both D-states and L-states, which is why validation needs a matrix (last question of this module).","pitfall":"Treating D-state and L-state as one ladder. Software moves the D-state, hardware moves the L-state (sometimes on its own), and the two must be checked separately.","verify":"The rule for multi-function devices entering L1 and any allowed exceptions in the Power Management chapter of the Base Specification.","follow":[{"q":"Can you read a link's L-state from config space?","a":"Not directly. You infer it from the D-state, the ASPM and substate enables, and counters or analyzer traces, because the LTSSM state is not a standard register."},{"q":"Where does Gen6 L0p fit?","a":"It is a partial-width low-power state inside L0, covered in the Gen5/6 module. It is not one of the classic L-states."}],"mod":11},{"id":"11.02","level":"Basic","type":"Concept","fig":null,"tags":["pci-pm","pmcsr","d3hot","no-soft-reset"],"q":"How does a function implement D-states, and what actually happens in D3hot?","short":"A function has a Power Management capability (ID 01h). Its PMCSR register has a 2-bit PowerState field: 00 is D0, 01 is D1, 10 is D2, 11 is D3hot. In D3hot the function still answers configuration requests but does not service memory or I/O requests, so an NVMe doorbell write would be lost. Going back to D0 needs a recovery delay and may include an internal soft reset.","deep":"- **PMC (capabilities):** Version, D1_Support, D2_Support, PME_Support (a 5-bit mask of which states can raise PME) and Aux_Current.\n- **PMCSR (control and status):** PowerState, No_Soft_Reset, PME_En, PME_Status (write 1 to clear), plus Data_Select and Data_Scale.\n- **D3hot behaviour:** configuration space stays reachable so software can bring the function back. Other request types are not serviced. Treat NVMe BAR0 as unreachable.\n- **D3hot to D0:** software waits a minimum recovery time (10 ms in the PCI-PM definition) before touching the function. If No_Soft_Reset is 0 the function resets its internal state on the transition, and the driver must reprogram it. NVMe drivers simply re-run controller initialization.\n- **D3cold to D0:** power, reference clock and PERST# sequencing, full link training, then the same restore (see the Resets module).\n\n```\nCapabilities: [80] Power Management version 3\n    Flags: PMEClk- DSI- D1- D2- AuxCurrent=0mA PME(D0-,D1-,D2-,D3hot-,D3cold-)\n    Status: D0 NoSoftRst+ PME-Enable- DSel=0 DScale=0 PME-\n```\nThis is typical of an NVMe SSD: no D1 or D2, no PME from any state (an SSD never needs to wake the host), and NoSoftRst+ meaning state survives D3hot.","pitfall":"Writing D3hot and then poking BAR0. The request is dropped or returns UR, and a posted doorbell write is lost silently.","verify":"The D3hot to D0 recovery time and the exact No_Soft_Reset semantics in the Power Management chapter, and how the NVMe Base Specification treats a D3hot to D0 transition (controller reset or not).","follow":[{"q":"What does NoSoftRst+ buy you?","a":"After D3hot the function keeps its state, so resume can be faster. The driver still must not assume it and usually re-initializes the controller anyway."},{"q":"Why do NVMe SSDs skip D1 and D2?","a":"They add little over D3hot and NVMe's own power states, and the platform gets its savings from L1.2 and APST."}],"mod":11},{"id":"11.03","level":"Basic","type":"Concept","fig":null,"tags":["aspm","software-directed","autonomous","apst"],"q":"What is the difference between software-directed and autonomous power management?","short":"In software-directed power management the OS or driver decides: it writes a D-state, the device goes to L1, and software brings it back. In autonomous power management the hardware decides without software in the loop: ASPM moves the link to L0s or L1 when it is idle, and NVMe APST moves the controller to a lower power state after an idle timer. Software only configures the policy and the limits.","deep":"| Mechanism | Who decides | Acts on | Entry trigger |\n|---|---|---|---|\n| D-state via PMCSR | OS and driver | Function, then the link (L1) | Config write, PM_Enter_L1 DLLP |\n| ASPM L0s and L1 | Hardware timers | Link only | Idle timer, PM_Active_State_Request_L1 DLLP |\n| L1 PM Substates | Hardware | Link (deeper L1) | L1 plus CLKREQ# and LTR conditions |\n| NVMe Set Features (Power Management) | Host driver | NVMe controller | Admin command |\n| NVMe APST | Controller | NVMe controller | Idle timers from a host-written table |\n\n- **Autonomous is only safe with latency information:** the OS must know each device's exit latency and how much latency the device tolerates (Link Capabilities, Device Capabilities, LTR). Otherwise a device can be put into a state that it cannot wake from fast enough.\n- **Software still owns the policy:** enabling ASPM, choosing APST tables and setting LTR limits are all software decisions. Only the moment of entry is autonomous.\n- **Why storage uses both:** D3 has a large resume cost (state reinit), so laptops rely on autonomous L1.2 plus APST for idle, and use software-directed states for system sleep.","pitfall":"Assuming autonomous means unconfigured. A wrong exit-latency field or a wrong APST table turns autonomous savings into random latency spikes.","verify":null,"follow":[{"q":"Is LTR a power-management mechanism?","a":"No. It is information that the device sends to the platform so that the platform can decide how deep it may go. It gates L1.2 and package C-states."},{"q":"Can the link enter ASPM L1 while the function is in D0 and busy?","a":"Yes, if the link is idle at that moment. ASPM looks at link activity, not at what the device is doing internally."}],"mod":11},{"id":"11.04","level":"Intermediate","type":"Concept","fig":null,"tags":["aspm","linkcap","linkctl","exit-latency","acceptable-latency"],"q":"Which registers configure ASPM, and how does the OS decide which states to enable?","short":"Link Capabilities says what the port supports (ASPM Support: none, L0s, L1 or both) and its worst-case L0s and L1 exit latencies. Link Control holds the ASPM Control field that enables L0s and L1 entry. Device Capabilities holds the endpoint's acceptable L0s and L1 latency. The OS enables a state only if both ends support it and the exit latency along the path fits within the endpoint's acceptable latency.","deep":"| Register | Field | Use |\n|---|---|---|\n| Link Capabilities | ASPM Support | 00 none, 01 L0s, 10 L1, 11 both |\n| Link Capabilities | L0s Exit Latency, L1 Exit Latency | 3-bit range codes (for example L1: 000 under 1 us up to 111 over 64 us) |\n| Link Capabilities | Clock Power Management | Port can remove the reference clock through CLKREQ# |\n| Device Capabilities | Endpoint L0s and L1 Acceptable Latency | Longest exit latency the endpoint can tolerate; 111 means no limit |\n| Link Control | ASPM Control | 00 off, 01 L0s, 10 L1, 11 both. Set on both ends of the link |\n| Link Control | Enable Clock Power Management | Lets the port use CLKREQ# to gate the clock |\n\n- **OS algorithm (Linux style):** walk from the endpoint toward the Root Port, take the exit latencies of the two ends of each link (and add about 1 us per switch for L1), and compare with the endpoint's acceptable latency. If it does not fit, that state stays off.\n- **Worked example:** SSD L1 exit under 32 us (range code), Root Port L1 exit under 8 us, no switch. The larger value, 32 us, is tested against the acceptable latency. If Device Capabilities says L1 acceptable is 16 to 32 us, it is borderline. If it says no limit (which many SSDs report), it always passes.\n- **Consequence:** an SSD that reports no limit shifts the risk to the SSD's real behaviour and to LTR. The OS gate does not protect you.\n- **lspci view:** `LnkCap: ... ASPM L1, Exit Latency L1 <64us` and `LnkCtl: ASPM L1 Enabled`.","pitfall":"Trusting a reported exit latency. The field is what the vendor declared, and a wrong value silently breaks the OS's latency arithmetic.","verify":"Exit latency code tables, the location of the Enable Clock Power Management bit, whether Endpoint Acceptable Latency fields are still defined in your Base Specification revision, and how your kernel version adds switch hops.","follow":[{"q":"Why must both ends be enabled?","a":"The downstream component (the SSD) initiates ASPM L1 and the upstream component (root or switch downstream port) must accept it, and the OS programs both ends so that the negotiation cannot be refused by configuration."},{"q":"Why is L0s off on almost every NVMe SSD?","a":"Devices rarely advertise it, its savings are small, and its failed exits show up as Recovery entries (see the LTSSM module)."}],"mod":11},{"id":"11.05","level":"Intermediate","type":"Concept","fig":null,"tags":["aspm","linux","windows","bios","policy","lspci"],"q":"What BIOS and OS knobs decide whether ASPM is on, and how do you find the effective setting on a machine?","short":"Several layers stack. The BIOS may program ASPM and decide whether the OS may control it (ACPI _OSC and the FADT flag). On Linux, `pcie_aspm.policy` (default, performance, powersave, powersupersave) and `pcie_aspm=off` or `force` set the policy. On Windows the power plan setting Link State Power Management is Off, Moderate or Maximum. The effective result is whatever `lspci -vv` shows in LnkCtl and L1SubCtl.","deep":"- **BIOS:** typical menus are ASPM support (disabled, L0s, L1, L0s and L1, auto), Native ASPM or Native PCIe control, and L1 substates or clock gating per root port. Names vary by vendor.\n- **Handoff to the OS:** if firmware does not grant ASPM control through _OSC (or the FADT says ASPM is unsupported), Linux leaves the BIOS setting alone and disables its own handling unless forced.\n- **Linux policy:**\n  - `default`: keep what firmware programmed.\n  - `performance`: turn ASPM off.\n  - `powersave`: enable what the capabilities and latency check allow.\n  - `powersupersave`: additionally enable L1 substates.\n  - Runtime: `/sys/module/pcie_aspm/parameters/policy`, and per link `/sys/bus/pci/devices/<BDF>/link/` (l0s_aspm, l1_aspm, l1_1_aspm, l1_2_aspm and PCI-PM variants).\n- **Windows:** Power Options, Advanced settings, PCI Express, Link State Power Management. It only applies if the platform grants ASPM control to the OS.\n- **Verify, do not assume:** after boot, read the real registers on both ends of the link:\n\n```\nlspci -vv -s 04:00.0 | grep -E \"LnkCap:|LnkCtl:|L1Sub\"\n```\n- **Validation habit:** record BIOS version, kernel command line and effective LnkCtl and L1SubCtl for every run, because the same SSD passes on one policy and fails on another.","pitfall":"Reading the kernel policy and stopping there. The BIOS may have set states the OS does not know about, and the device's LnkCtl is the ground truth.","verify":"Exact policy names on your kernel, the sysfs attribute names, the dmesg wording for the FADT case, and the Windows setting encodings (`powercfg` values 0, 1 and 2 map to Off, Moderate and Maximum).","follow":[{"q":"Why does an SSD pass on `performance` but fail on `powersave`?","a":"`powersave` enables L1 and L1.2, so the link now passes through low-power exits that `performance` never exercises."},{"q":"Does the OS setting change SSD firmware behaviour?","a":"Not directly. It changes when the link asks for L1, which changes what the SSD firmware sees at its PHY."}],"mod":11},{"id":"11.06","level":"Intermediate","type":"Trap","fig":null,"tags":["trap","d3hot","l1","l2","quiesce"],"q":"A colleague says \"the SSD is in D3hot, so its link is in L2\" and also \"L1 entry is instant because the device just asks for it\". What is wrong?","short":"D3hot puts the link in L1, not L2. L2 belongs to D3cold and only after the PME_Turn_Off handshake with main power removed. Also, L1 entry is not instant. The port must stop new TLPs, wait until everything it sent is acknowledged and credits settle, and only then exchange the DLLPs and go idle. With ASPM the upstream port can also refuse.","deep":"| | D3hot | D3cold |\n|---|---|---|\n| Main power and refclk | Present | Removed |\n| Link state | L1 | L2 (aux) or L3 |\n| Config space | Accessible | Not accessible |\n| Wake path | In-band: exit L1, send PM_PME | WAKE# or beacon, then retrain from Detect |\n| Exit path in the LTSSM | Recovery | Detect |\n\n- **Quiesce first:** the handshake (covered in the Data Link Layer module) does not start while TLPs are unacknowledged. Under heavy I/O the entry is delayed, and a link that never goes idle never enters ASPM L1. That is why a busy SSD shows low L1 residency.\n- **ASPM can be rejected:** the upstream component (root or switch downstream port) answers the SSD's PM_Active_State_Request_L1 with PM_Request_Ack, or refuses with a PM_Active_State_Nak message, and the link stays in L0.\n- **A traffic-arrival race:** a new TLP that arrives during entry typically has to wait until the link has entered L1 and exited again, so latency is entry time plus exit time.\n- **Validation angle:** count L1 entries and exits separately from D-state changes. Both should be exercised under load and at idle.","pitfall":"Mixing up \"the device is in a low D-state\" with \"the link is in a low L-state\". The first is a register value, the second is an observed LTSSM state.","verify":"Whether any implementation-specific entry timing (idle time before an ASPM L1 request) is specified and which conditions permit the upstream port to refuse.","follow":[{"q":"Can a function in D3hot still send PME?","a":"Yes, if PME_Support says so and PME is enabled. It first wakes the link out of L1 and then sends the PM_PME message."},{"q":"Which state has the higher wake cost, D3hot or D3cold?","a":"D3cold, because power, clock and reset sequencing plus full training come before any software restore."}],"mod":11},{"id":"11.07","level":"Intermediate","type":"Concept","fig":null,"tags":["pme","wake","beacon","d3cold","vaux"],"q":"How does a device wake the system: PME, WAKE# and beacon, and where does Vaux come in?","short":"PME is the wake request. If the link is in L1 with main power present, the device exits L1 and sends a PM_PME message upstream. If main power and clock are gone (D3cold, link L2), it uses the WAKE# sideband signal, or in principle an in-band beacon. Waking from D3cold needs auxiliary power (Vaux) so that the device can keep its PME logic alive. SSDs rarely use any of this because the host initiates all storage traffic.","deep":"1. Software enables PME (PME_En in PMCSR) for a function whose PME_Support bits include the current D-state.\n2. The event occurs (for example a network card sees a magic packet). The function sets PME_Status.\n3. In-band case (D3hot, link L1): the link exits L1, the function sends a PM_PME Message TLP addressed to the Root Complex with its Requester ID.\n4. Sideband case (D3cold, link L2): the device asserts WAKE# (or sends a beacon). The platform restores power and clock, the link trains from Detect, and then the PME message flows.\n5. The Root Port records it in the Root Status register (PME Status, PME Requester ID) and raises an interrupt, or the platform raises an ACPI event.\n6. The OS reads PME_Status in the device, services the event and clears it by writing 1.\n\n- **Vaux:** an auxiliary supply that stays on when main power is off. Aux_Current in PMC says how much the function needs. Without Vaux a function cannot signal PME from D3cold.\n- **Beacon:** an optional in-band signal used when there is no WAKE# pin. In practice platforms wire WAKE#.\n- **SSD view:** an NVMe SSD does not originate wake events. It is woken by host doorbell writes (L1 exit) or by power-up. PME_Support is usually zero, as in the PMCSR sample earlier.","pitfall":"Expecting PME to matter for SSD validation. For storage, the wake path that matters is the host-driven L1 exit and the D3 resume, not PME.","verify":"Beacon support and electrical rules in your Base Specification revision, and PME_Support and Aux_Current decoding.","follow":[{"q":"Which message asks the device to prepare for power removal?","a":"PME_Turn_Off from the Root Complex, answered by PME_TO_Ack and PM_Enter_L23 (see the LTSSM module)."},{"q":"What if the device sends PME while the link is in L2 and there is no WAKE# wiring?","a":"Nothing happens, because L2 has no clock and no link. Wake needs the sideband pin or a beacon path."}],"mod":11},{"id":"11.08","level":"Intermediate","type":"Concept","fig":null,"tags":["nvme","power-states","enlat","exlat","identify","set-features"],"q":"How are NVMe power states described, and how does the host use them?","short":"Identify Controller reports NPSS (the highest state index, zero-based) and a descriptor for each state PS0 to PSn. Each descriptor has maximum power (MP), a Non-Operational flag, entry latency ENLAT and exit latency EXLAT in microseconds, and relative throughput and latency hints. PS0 is the highest-power state. The host selects a state with Set Features, Power Management (Feature ID 02h) or lets the controller move on its own with APST.","deep":"```\n$ nvme id-ctrl /dev/nvme0 -H\nnpss      : 4\nps    0 : mp:8.25W operational enlat:0 exlat:0 rrt:0 rrl:0\n          rwt:0 rwl:0 idle_power:- active_power:-\nps    3 : mp:0.0400W non-operational enlat:210 exlat:1200 rrt:3 rrl:3\n          rwt:3 rwl:3 idle_power:- active_power:-\nps    4 : mp:0.0050W non-operational enlat:1000 exlat:9000 rrt:4 rrl:4\n          rwt:4 rwl:4 idle_power:- active_power:-\n```\n(Values are illustrative, in the style of nvme-cli.)\n\n- **Operational states** (Non-Operational flag clear): the controller processes I/O. Lower-power operational states cap power, for example under a thermal or system power limit, at reduced performance.\n- **Non-operational states:** the controller cannot process I/O until it returns to an operational state. These are the idle-savings states.\n- **ENLAT and EXLAT:** the maximum time to enter the state and to exit it, in microseconds. The host adds them (with link exit latency) to judge how long a wake can take.\n- **Set Features (Power Management):** the state number goes in the low bits of CDW11, with a Workload Hint above it. A host-selected non-operational state normally has to be undone by the host selecting an operational one. APST exits automatically on the next command.\n- **Thermal:** host-controlled thermal management (thresholds TMT1 and TMT2) and the composite temperature thresholds are a separate mechanism that throttles performance rather than changing the power state.","pitfall":"Reading NPSS as a count. It is zero-based, so npss 4 means five descriptors.","verify":"Bit layout of the power state descriptor and MXPS scaling, Feature ID 02h CDW11 layout, the exit behaviour after a host-selected non-operational state, and the thermal feature ID and field names in the NVMe Base Specification 2.x.","follow":[{"q":"Does a lower state number mean lower power?","a":"No. PS0 is the highest power, and the highest index is usually the deepest non-operational state."},{"q":"What do the relative read and write throughput fields mean?","a":"They rank operational states by performance (0 is best). They are hints for host policy, not guarantees."}],"mod":11},{"id":"11.09","level":"Intermediate","type":"Concept","f
