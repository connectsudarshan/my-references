on status comes back.\n4. **Poison:** poisoned MWr to a doorbell, poisoned CplD returned to an SSD read. The command should fail with an error, and poisoned data must never reach NAND as good.\n5. **ECRC:** enable it, inject a bad digest inbound, and confirm the device drops and logs.\n6. **Completion handling:** unknown tag (Unexpected Completion), duplicate and late completions, UR or CA completions to the SSD's reads, odd splits down to 1 DW, interleaving across tags, and withheld completions until timeout. The device must not hang.\n7. **Register access sizes:** 1, 2, 4 and 8 byte and unaligned accesses to BAR0. Expect defined behavior, not a hang.\n8. **Observe:** analyzer trace, AER status, NVMe controller status and Error Information log, and a full read-back compare of data written before and after each injected fault.\n9. **Automate:** seeded random generation, coverage counters per case, run per firmware build with saved traces.\n\n- **Decision criteria:** a defect is any hang, any use of poisoned data as good, a wrong error class, state leaking from an earlier TLP, or a missing log.\n- **Safety:** negative tests can trigger fatal errors and DPC on a normal platform, so run on an isolated rig with the exerciser as the root, and clear AER status between cases.","pitfall":"Testing only legal traffic. Real platforms produce odd but legal splits and rare errors, and the corner cases are where firmware bugs live.","verify":"Expected device behavior for each error in the Base Specification error handling tables, and the NVMe status codes and log page for failed transfers.","follow":[{"q":"Why not use a normal host and a fault injection tool?","a":"Host Root Ports and drivers emit only legal TLPs. Only an exerciser or modified fabric can build malformed, poisoned or oddly split ones."},{"q":"What proves no residual state after a fault?","a":"Register read-back, AER and NVMe status, and a data compare of I/O done before and after, plus a clean controller reset."}],"mod":7},{"id":"8.01","level":"Basic","type":"Concept","fig":null,"tags":["flow-control","credits","receiver-buffer","overview"],"q":"Why does PCIe need flow control, and what exactly does it protect?","short":"Flow control stops a transmitter from sending a TLP that the receiver has no buffer space for. The link-level ACK only says a TLP arrived intact, so a receiver that dropped it for lack of space would lose it with no recovery. Instead each receiver advertises its buffer space as credits, per virtual channel and per credit type, and a transmitter sends a TLP only when it holds enough credits.","deep":"- **Gap it fills:** ACK and NAK cover corruption, not congestion. Once a TLP is acknowledged the sender discards it from the replay buffer, so the receiver must never drop it later.\n- **Credit-based design:** the receiver owns the decision because it knows its buffers. The transmitter needs no round trip per TLP, and overflow is impossible if both sides follow the rules.\n- **Granularity:** separate credits for each virtual channel and for six types (PH, PD, NPH, NPD, CplH, CplD). Splitting posted, non-posted and completion traffic lets one class bypass another, which the ordering rules and deadlock avoidance need.\n- **What is exempt:** DLLPs and ordered sets do not use credits, so UpdateFC and Acks always get through.\n- **Scope:** per link, between two adjacent ports. In a switch each link has its own credits, so a stalled downstream link backs up buffers hop by hop.\n- **Cost:** receivers spend buffer memory, and the credit window has to cover the round trip or the link idles (sizing is in the Numeric question below).","pitfall":"Treating flow control as end to end. It is strictly per link, and the two directions have independent credits.","verify":"AER bit assignments and default severity for Receiver Overflow and Flow Control Protocol Error.","follow":[{"q":"Who decides how many credits a port advertises?","a":"The receiving port's designer, from its buffer sizes. Software cannot change it, though some switches expose buffer profiles."},{"q":"What happens if a transmitter sends without credits?","a":"The receiver may detect a Receiver Overflow, an uncorrectable and normally fatal error, and it can no longer trust the link."}],"mod":8},{"id":"8.02","level":"Basic","type":"Concept","fig":null,"tags":["credits","ph","pd","nph","npd","cplh","cpld","units"],"q":"What are the six credit types, and how many credits does a given TLP consume?","short":"Posted, Non-Posted and Completion traffic each have a header credit and a data credit: PH and PD, NPH and NPD, CplH and CplD. Every TLP takes one header credit of its type, whatever its header size, and data credits equal to its payload in DW divided by four, rounded up, since one data credit is 4 DW or 16 bytes. A read request has no payload, so it takes an NPH credit and no NPD.","deep":"| TLP | Header credit | Data credits |\n|---|---|---|\n| MWr | 1 PH | ceil(DW / 4) PD |\n| Msg | 1 PH | 0 |\n| MsgD | 1 PH | ceil(DW / 4) PD |\n| MRd | 1 NPH | 0 |\n| IORd, CfgRd | 1 NPH | 0 |\n| IOWr, CfgWr, AtomicOps | 1 NPH | ceil(DW / 4) NPD |\n| Cpl | 1 CplH | 0 |\n| CplD | 1 CplH | ceil(DW / 4) CplD |\n\nExamples:\n- 4-byte doorbell write: 1 PH and 1 PD, so a full 16-byte data credit for 4 bytes of data.\n- 256-byte write: 1 PH and 16 PD.\n- 512-byte read request: 1 NPH and nothing else. The 64-byte SQE completion that returns costs the requester's receiver 1 CplH and 4 CplD.\n- **Header unit:** one credit covers a TLP header of either size plus a digest, so a 3DW and a 4DW TLP cost the same.","pitfall":"Counting bytes instead of credits. Tiny TLPs such as doorbells and CQEs waste data credits and burn one header credit each.","verify":"How prefixes and the digest are counted in a header credit, and the exact credit cost of AtomicOps.","follow":[{"q":"Why is a read request cheap in credits but its completion is not?","a":"The MRd has no payload, so it uses one NPH credit. The returning data uses CplH and CplD credits at the requester's receiver."},{"q":"How many credits does a 4 KiB write as 16 TLPs of 256 B use in total?","a":"16 PH and 256 PD."}],"mod":8},{"id":"8.03","level":"Basic","type":"Concept","fig":"fc","tags":["credit-loop","credits-consumed","credit-limit","credits-allocated","updatefc"],"q":"How does the credit loop work: what are CREDITS_CONSUMED, CREDIT_LIMIT and CREDITS_ALLOCATED?","short":"The transmitter keeps CREDITS_CONSUMED, a running total of credits it has used, and CREDIT_LIMIT, the latest total the receiver has granted. It may send a TLP only if consumed plus that TLP's credits stays within the limit. The receiver keeps CREDITS_ALLOCATED, the initial amount plus every buffer it has freed, and reports it in UpdateFC DLLPs, which the transmitter loads as its new CREDIT_LIMIT. All counters are cumulative and wrap.","deep":"1. **Init:** InitFC sets CREDIT_LIMIT to the advertised amount. CREDITS_CONSUMED starts at 0 and CREDITS_ALLOCATED at the advertised amount.\n2. **Send:** a TLP needing C credits goes out only if the gating check passes (next question), and CREDITS_CONSUMED grows by C.\n3. **Receive and drain:** the TLP lands in the receiver's buffer. When the receiving Transaction Layer finishes with it (forwarded it, written it to memory, handed it to the device), the buffer is free and CREDITS_ALLOCATED grows.\n4. **Return:** the receiver sends CREDITS_ALLOCATED in an UpdateFC DLLP for P, NP or Cpl (header and data fields). The transmitter sets CREDIT_LIMIT to it.\n\n- **Credits return on drain, not on ACK:** an ACK means \"arrived intact\". A credit means \"space is free again\". A link can ACK at full rate and still be credit-starved when the receiver drains slowly.\n- **Cumulative totals are forgiving:** a lost UpdateFC costs nothing lasting, because the next one restates the total (Module 6).\n- **Replays are free:** a replayed TLP does not consume credits again, since it was counted when first sent.\n- **Overflow check:** the receiver may also count CREDITS_RECEIVED and flag an error if it exceeds the limit it granted.","pitfall":"Picturing CREDIT_LIMIT as a remaining balance. It is an absolute cumulative limit compared against a cumulative consumed count, which is why wraparound arithmetic matters.","verify":"Which counters are mandatory (CREDITS_RECEIVED is used for the optional overflow check) and the initial values in the Base Specification Flow Control chapter.","follow":[{"q":"Does an Ack return credits?","a":"No. Ack and Nak belong to the Data Link Layer's reliability, and credits belong to the Transaction Layer's buffer management."},{"q":"Why are the values totals rather than deltas?","a":"A delta lost with a corrupted DLLP would leak credits forever. A total is repaired by the next update."}],"mod":8},{"id":"8.04","level":"Intermediate","type":"Numeric","fig":null,"tags":["modulo","wraparound","gating","credit-check","counter-width"],"q":"How does the transmitter check credits with modulo counters? Work an example that wraps.","short":"Header credit counters are 8 bits wide and data credit counters 12 bits, so all arithmetic is modulo 256 or 4096. A TLP needing P credits may be sent if (CREDIT_LIMIT - (CREDITS_CONSUMED + P)) mod 2^N is at most 2^(N-1). A small result means the limit is still ahead of consumption, a big one means consumption passed it. With N = 8, limit 10, consumed 250, P = 1: (10 - 251) mod 256 = 15, so it is allowed even though the limit looks smaller than the consumed count.","deep":"Header counters (N = 8, half range 128):\n\n| CREDIT_LIMIT | CREDITS_CONSUMED | P | (CL - CC - P) mod 256 | Result |\n|---|---|---|---|---|\n| 10 | 250 | 1 | 15 | Send (counter wrapped, 15 credits of room remain) |\n| 250 | 249 | 1 | 0 | Send (uses the last credit) |\n| 250 | 250 | 1 | 255 | Blocked (no credit left, result is far above 128) |\n\nData counters (N = 12, half range 2048): CL = 32, CC = 4090, P = 16 (one 256 B write). CC + P = 4106, which wraps to 10. (32 - 4106) mod 4096 = 22, which is at most 2048, so it may send.\n\n- **Why \"at most half the range\":** same argument as the sequence number in Module 6. If the granted window is always below half the modulus, \"ahead\" and \"behind\" cannot alias. That limits the largest advertised value to 127 header credits and 2047 data credits (32 KB) per type and VC.\n- **Two checks per TLP:** header and data counters are checked separately, and the TLP needs both to pass. A TLP with 16 PD needed and only 15 left must wait, even with PH free.\n- **How fast counters wrap:** the header counter wraps after 256 header credits, which is 256 doorbell-size posted TLPs. The data counter wraps after 4096 credits, or 64 KiB of payload. Wraparound happens constantly in real traffic.\n- **Infinite types:** for a type advertised as infinite there is no check and no UpdateFC.","pitfall":"Writing the check as CL >= CC + P with unbounded integers in a model. The model passes and the hardware, with its narrow counters, does not.","verify":"The exact gating expression, the 8-bit and 12-bit field widths, and the maximum initial credit values in the Base Specification (Flow Control Rules).","follow":[{"q":"What breaks if hardware compares CC + P <= CL with plain integers?","a":"It works until the first wrap, then either stalls forever or sends without credit. It appears after 256 header credits or 64 KiB of posted data."},{"q":"Why do wrap bugs hide in testing?","a":"They show only when limit and consumed straddle the wrap point, which needs tight credits or a specific traffic amount. A test has to aim at that case."}],"mod":8},{"id":"8.05","level":"Intermediate","type":"Concept","fig":null,"tags":["initfc","updatefc","infinite-credit","timing","loop-time"],"q":"How do infinite credits and UpdateFC timing fit together, and why does a late UpdateFC cost throughput?","short":"InitFC (covered in the Data Link module) sets the starting credits, and a value of zero means infinite. In operation the receiver sends UpdateFC as it frees buffer, batched to save DLLP bandwidth, plus periodically as a safety net. The credit loop is transmit time plus link latency plus receiver drain plus UpdateFC delay plus return. If the credit window is smaller than bandwidth x loop time, the transmitter idles, so extra UpdateFC delay lowers throughput.","deep":"- **Infinite credit:** zero in both fields of an InitFC means infinite for that type and VC. Endpoints and Root Ports use it for completions, since they only receive completions for requests they issued and have reserved room. The transmitter skips the check and no UpdateFC is sent for that type.\n- **The promise:** advertising infinite completion credits means having buffer for every outstanding read. Otherwise the device overflows. That is why tag count times read size must fit the completion buffer (Module 7).\n- **UpdateFC policy:** receivers usually send when a threshold of freed credits accumulates or a timer expires. The spec bounds the maximum interval between UpdateFC DLLPs and gives recommended latency limits by link width and MPS.\n- **What lengthens the loop:** slow drain (a busy host write path, IOMMU misses, a congested switch), extra hops (each link is its own loop and backpressure propagates), retimers, and L1 exit.\n- **State persistence:** Recovery, speed change and L1 exit keep the credit state. Credits are re-initialized only after the Data Link Layer goes down and comes back (DL_Init).\n- **Analyzer view:** UpdateFC DLLPs show cumulative counts. The spacing and increments show how often and how much buffer the receiver returns.","pitfall":"Assuming a credit returns when the TLP is received. It returns when the receiving Transaction Layer has drained it.","verify":"The UpdateFC maximum interval (30 microseconds is the commonly cited value), the latency limit tables, and which types may be advertised as infinite.","follow":[{"q":"What does a receiver cost if it sends an UpdateFC for every freed credit?","a":"DLLP bandwidth and processing. Implementations batch, which stretches the loop slightly."},{"q":"Does the credit state survive a link retrain?","a":"Yes. Flow control state is kept through Recovery and low-power exits. Only a link down and a new InitFC exchange reset it."}],"mod":8},{"id":"8.06","level":"Intermediate","type":"Concept","fig":null,"tags":["scaled-flow-control","hdrscale","datascale","gen4","dl-feature"],"q":"What is Scaled Flow Control and why was it added?","short":"The original credit fields are 8 bits for headers and 12 bits for data, so the window per type is at most 127 header credits and 2047 data credits, which is 32 KB of data. That is too small for fast, wide links with long round trips. Scaled Flow Control, introduced with PCIe 4.0, adds HdrScale and DataScale fields to InitFC and UpdateFC that multiply the credit values, up to 16 times. Both link partners must support it and agree during Data Link Feature exchange.","deep":"- **Mechanism:** each InitFC and UpdateFC carries a scale field beside the header and data values. The advertised credit value is multiplied by the scale factor (1, 4 or 16), so the effective window grows.\n- **Negotiation:** the Data Link Feature exchange in DL_Feature (Module 6) reports support. If either side lacks it, the link uses unscaled flow control.\n- **Why needed:** the Numeric question below shows Gen5 x16 with a 1 microsecond loop needs about 3500 data credits, above the 2047 limit.\n- **Who needs it:** an M.2 Gen4 x4 SSD moving about 7.15 GB/s of payload with a 1 microsecond loop needs about 450 data credits (7.9 GB/s of raw link rate would need about 490), well inside the unscaled range. It matters for x16 Gen5 and Gen6 devices such as GPUs, NICs and CXL cards.\n- **Gen6:** FLIT mode changes how credits are advertised and updated (in shared credit pools carried in flits). That is outside this module.\n- **Validation:** test with scaling on and off, and against a partner that lacks it, and check counter wraparound at the larger windows.","pitfall":"Assuming a Gen4 or faster link always uses scaled flow control. Both ends must support and agree on it.","verify":"HdrScale and DataScale encodings and effective maxima, whether support is mandatory at 16 GT/s and above, and the Data Link Feature capability fields.","follow":[{"q":"Who chooses the scale factor?","a":"Each receiver chooses what it advertises, provided both ends support the feature."},{"q":"How would you see it on a trace?","a":"The InitFC DLLPs carry the scale fields, and analyzers decode HdrScale and DataScale."}],"mod":8},{"id":"8.07","level":"Intermediate","type":"Concept","fig":null,"tags":["virtual-channel","traffic-class","vc0","arbitration","tc-vc-mapping"],"q":"What are traffic classes and virtual channels, and why do most SSD systems use only VC0?","short":"The Traffic Class (TC0 to TC7) is a 3-bit label in every TLP. A Virtual Channel (VC) is an independent set of buffers and credits on each link. Software maps TCs to VCs, and VCs arbitrate for the link by priority, round robin or weighted schemes. TLPs in different VCs are not ordered against each other and cannot block each other. VC0 always exists and TC0 maps to it by default. NVMe SSDs use only TC0 and typically do not implement the optional VC capability.","deep":"- **Mapping:** the TC/VC map lives in each port's VC Resource Control register, and software must program the same map along the whole path. A TLP whose TC maps to no enabled VC is a malformed TLP.\n- **Per-VC resources:** each VC has its own six credit types and its own ordering domain. VC0 is initialized by hardware. Others are initialized when software enables them (Module 6).\n- **Arbitration:** VC arbitration decides which VC sends next on a port, and port arbitration (in switches) decides which ingress port gets an egress slot. Modes are optional and listed in the capability.\n- **Ordering:** rules apply within a VC. Different TCs mapped to the same VC keep ordering and share credits.\n- **Why SSDs stay on VC0:** one class of traffic, no isochronous demand, NVMe defines no TC usage, and extra VCs cost buffers in every device. VCs suit isochronous or QoS-separated traffic such as multimedia or some accelerators.\n- **Debug angle:** if an analyzer shows a non-zero TC, check that every port on the path maps it to an enabled VC.","pitfall":"Expecting extra VCs to raise SSD throughput. They separate traffic for QoS but share the same link bandwidth.","verify":"Names and layout of the VC capability registers, and the malformed rule for an unmapped TC.","follow":[{"q":"Can two TCs share a VC?","a":"Yes, the map is many to one. They then share credits and ordering."},{"q":"Does NVMe queue arbitration (round robin, weighted) relate to VC arbitration?","a":"No. NVMe arbitration is inside the controller and all its TLPs use TC0."}],"mod":8},{"id":"8.08","level":"Intermediate","type":"Concept","fig":null,"tags":["ordering","posted","non-posted","completion","producer-consumer","deadlock"],"q":"Describe the PCIe ordering rules for posted, non-posted and completion TLPs, and why some of them exist.","short":"Ordering says which TLPs on the same VC may pass others in a queue. The base rule is producer/consumer: a posted write must not pass an earlier posted write, so data arrives before its flag. To avoid deadlock, posted requests and completions must be able to pass non-posted requests. A non-posted request must not pass an earlier posted write, and a completion must not pass an earlier posted write, unless Relaxed Ordering or ID-Based Ordering is set.","deep":"May the later TLP (row) pass an earlier TLP (column)?\n\n| Later TLP | Earlier posted | Earlier non-posted | Earlier completion |\n|---|---|---|---|\n| Posted | No (unless RO or IDO) | Yes, required | Yes, must be able to (deadlock avoidance) |\n| Non-posted | No | No requirement | No requirement |\n| Completion | No (unless RO or IDO) | Yes, required | Yes, except completions with the same Transaction ID keep their order |\n\n- **Producer/consumer:** the producer writes data, then a flag. A consumer that sees the flag must see the data. That needs posted-after-posted order.\n- **Reads flush writes:** a non-posted request cannot pass an earlier posted write. That is why a read from a device forces its earlier writes to complete (Module 2).\n- **Completions after writes:** if a consumer reads a flag from a device, the completion carrying it must not pass earlier posted data from that device.\n- **Deadlock avoidance:** if a non-posted queue is blocked, posted writes and completions behind it must be allowed to bypass. Otherwise two devices, each waiting for the other to accept, can block forever.\n- **In practice:** switches keep separate posted, non-posted and completion queues per VC, in order within each, plus the mandatory bypasses.\n- **Different VCs:** no ordering relationship.","pitfall":"Remembering the table as \"everything stays in order\". The key rules are the \"must be able to pass\" exceptions, which exist to prevent deadlock.","verify":"Every cell of the Transaction Ordering table in the Base Specification, especially entries that depend on Relaxed Ordering and ID-Based Ordering, and the posted-passes-completion entry.","follow":[{"q":"Why do posted, non-posted and completion traffic have separate buffers and credits?","a":"The bypass rules need separate queues, and separate credits stop one class from consuming another's buffer."},{"q":"Which rule makes the flush read trick work?","a":"A non-posted request cannot pass earlier posted writes, so the read's completion implies those writes have been done."}],"mod":8},{"id":"8.09","level":"Advanced","type":"Numeric","fig":null,"tags":["credit-sizing","bdp","gen5","line-rate","scaled-fc"],"q":"How many credits does a Gen5 x4 link need to sustain line rate, and what happens with a longer loop or a wider link?","short":"Credits needed are the payload rate times the credit loop time. Gen5 x4 carries 15.75 GB/s raw, about 14.3 GB/s of payload at 256 B TLPs. With an assumed 1 microsecond loop that is 14.3 KB in flight, about 894 data credits (16 B each) and 56 header credits. Gen5 x16 needs about 3575 data credits, above the 2047 unscaled maximum, so it needs Scaled Flow Control or a shorter loop.","deep":"Assumptions: 128b/130b, per-TLP overhead 26 B (4DW header), loop time 1 microsecond (TLP transit, receiver drain, UpdateFC scheduling, return). Recompute with your loop time.\n\n1. Raw rate, Gen5 x4: 32 GT/s x 4 x 128/130 / 8 = 15.75 GB/s.\n2. Payload rate at 256 B TLPs: 15.75 x 256 / 282 = 14.30 GB/s.\n3. Bytes in flight = 14.30 GB/s x 1 microsecond = 14.3 KB.\n4. PD credits = 14.3 KB / 16 B = 894. PH credits = 14.3 KB / 256 B = 56.\n\n| Link | Payload rate (256 B) | Loop | PD credits | PH credits |\n|---|---|---|---|---|\n| Gen4 x4 | 7.15 GB/s | 1 us | 447 | 28 |\n| Gen5 x4 | 14.30 GB/s | 0.5 us | 447 | 28 |\n| Gen5 x4 | 14.30 GB/s | 1 us | 894 | 56 |\n| Gen5 x4, 128 B TLPs | 13.09 GB/s | 1 us | 818 | 102 |\n| Gen5 x16 | 57.2 GB/s | 1 us | 3575 | 223 |\n\n- **PH grows for small TLPs:** at 128 B the header need doubles to 102, close to the 127 maximum.\n- **Late updates:** window / loop is the throughput cap. A receiver with 256 PD (4 KB) and a 1 microsecond loop caps at 4.1 GB/s. If UpdateFC arrives 0.5 microsecond later, the cap falls to 2.7 GB/s.\n- **Scaled Flow Control:** it lifts the 2047 limit for x16 links.","pitfall":"Sizing to raw link rate instead of payload rate, or forgetting that every TLP costs at least one header credit.","verify":"The maximum advertised credit values, and the actual credits advertised by your Root Port and switch (read them from InitFC on a trace).","follow":[{"q":"Which binds first, PH or PD?","a":"The smaller of PH times TLP payload and PD x 16 B. Big TLPs burn data credits, small ones burn header credits."},{"q":"Why do real x4 endpoints reach line rate with modest credits?","a":"Their loops are short in direct-attach systems and receivers over-provision. Verify from InitFC values on a trace, do not assume."}],"mod":8},{"id":"8.10","level":"Advanced","type":"Concept","fig":null,"tags":["relaxed-ordering","ido","no-snoop","attributes","device-control"],"q":"What do Relaxed Ordering, ID-Based Ordering and No Snoop do, and who is allowed to set them?","short":"They are attribute bits in the TLP header. Relaxed Ordering (RO) lets that TLP pass earlier posted writes. ID-Based Ordering (IDO) lets TLPs from different requesters pass each other. No Snoop (NS) tells the Root Complex it need not snoop CPU caches for that access. RO and IDO relax ordering, NS relaxes cache coherency. A device sets them only if software enabled them and the traffic can tolerate it.","deep":"- **Direction matters:** the attribute on the later TLP grants that TLP permission to pass earlier ones. RO on a CQE write lets it overtake earlier data writes, which is dangerous. RO on a data write lets it pass earlier writes, but a later strongly ordered CQE still cannot pass it.\n- **RO in practice:** bulk data writes to memory where order among the pieces does not matter. A completion inherits RO from its request and can then pass posted writes.\n- **IDO:** producer/consumer ordering concerns a single producer, so TLPs from different Requester IDs need no order. It reduces head-of-line blocking between endpoints.\n- **NS:** it skips the coherency snoop. It is safe only if software handles cache state, and it has no effect on PCIe ordering.\n- **Enables:** Device Control has Enable Relaxed Ordering and Enable No Snoop. Device Control 2 has IDO Request Enable and IDO Completion Enable.\n- **Platform quirks:** Linux clears Enable Relaxed Ordering on devices below Root Ports on a quirk list, because those ports mishandled RO.\n- **Overlapping writes:** RO writes to overlapping addresses can swap. Do not set it where a later write must overwrite an earlier one.","pitfall":"Setting RO on the flag, CQE or interrupt write for speed. That write is the one that must stay behind the data.","verify":"Attribute bit positions, the Device Control and Device Control 2 enable bits, the RO and IDO entries in the ordering table, and which Root Ports Linux quirks.","follow":[{"q":"Is No Snoop about ordering?","a":"No. It concerns cache coherency at the Root Complex. RO and IDO concern ordering."},{"q":"Who chooses whether a TLP carries RO?","a":"The device, per TLP, once Enable Relaxed Ordering is set. Software cannot tag individual TLPs."}],"mod":8},{"id":"8.11","level":"Advanced","type":"Scenario","fig":null,"tags":["nvme","ordering","cqe","msix","producer-consumer","ro"],"q":"An NVMe controller writes read data, then the CQE, then an MSI-X, all posted on the same TC. Why does the interrupt imply the data is visible, and what breaks it?","short":"All three are posted memory writes with the same TC and Relaxed Ordering clear. On one VC each stays behind the previous one all the way to the Root Complex, which commits them to memory in order before it delivers the interrupt. So when the handler runs, the CQE and data are already visible. It breaks if the CQE or MSI-X write has Relaxed Ordering set, if the writes use different VCs, or if the platform does not preserve order.","deep":"1. 16 data MWr TLPs of 256 B, 2. the 16 B CQE MWr, 3. the 4 B MSI-X MWr. Same Requester ID, TC0, VC0.\n- **Fabric:** each switch queue for posted traffic is in order, so nothing overtakes anything.\n- **Consumer:** the ISR reads the CQE phase tag, then the data. Both were committed before the interrupt reached the CPU.\n- **Replay:** link replay resends in order, so it does not change this. A link ACK does not prove visibility (Module 2).\n\n| Failure mode | Effect |\n|---|---|\n| RO set on the CQE or MSI-X write | It may pass earlier data writes, so the host sees the CQE or interrupt before the data and reads stale data |\n| RO set on the data writes only | Data may pass earlier writes, but the RO=0 CQE still cannot pass them. Safe, except for overlapping writes to the same address |\n| Data and CQE on different TCs mapped to different VCs | No ordering between VCs |\n| CQE written along a different path, such as a CQ in peer memory | No order guarantee across paths |\n| Root Complex or memory system that does not preserve order (platform bug) | The CPU sees the CQE before the data |\n\n- **How to validate:** run heavy random I/O, have the host check data as soon as the CQE phase tag flips, and use the analyzer to confirm the order of data, CQE and MSI-X TLPs on the link. Repeat with RO enabled on each write class if the SSD lets you.\n- **Weakly ordered CPUs:** Arm hosts still need a read barrier between reading the CQE and reading the data, which is a CPU ordering issue and not a PCIe one.","pitfall":"Blaming RO on the data writes. RO on the data is designed to be safe. The risk is RO on the write that acts as the flag, plus overlapping writes.","verify":"The RO and IDO rules for posted writes in the Transaction Ordering table, and platform documentation on how the Root Complex orders MSI-X delivery after memory writes.","follow":[{"q":"Why does a host not need a flush read after an MSI-X?","a":"The MSI-X is a posted write ordered behind the data, so the rules already guarantee visibility. A flush read is for cases that lack such ordering."},{"q":"Does polling the CQ instead of taking interrupts change this?","a":"No. The consumer checks the phase tag, and CQE-after-data ordering gives the same guarantee."}],"mod":8},{"id":"8.12","level":"Advanced","type":"Trap","fig":null,"tags":["tags","credits","dllp","confusion","outstanding"],"q":"A colleague says the SSD stalled because it ran out of credits, so proposes enabling 10-bit tags. Why is that wrong, and do DLLPs need credits?","short":"Credits and tags are unrelated limits. A tag is end to end, allocated by the requester, one per outstanding non-posted request. A credit is per link, allocated by each receiver from its buffer, and applies to every TLP, posted, non-posted and completion. More tags do nothing for a credit stall. DLLPs and ordered sets use no credits at all, which is why UpdateFC still gets through when every credit is exhausted.","deep":"| | Tag | Flow control credit |\n|---|---|---|\n| Scope | End to end, requester to completer | One link hop |\n| Applies to | Non-posted requests only | Every TLP (P, NP, Cpl) |\n| Granted by | Requester's own pool | Receiver's buffer |\n| Freed when | The last completion arrives | Receiver drains the buffer |\n| Shortage looks like | Requester cannot issue new reads | Transmitter port holds TLPs though the link is idle |\n\n- **Independent:** a request can have a free tag and no NPH credit, or a credit and no tag. Throughput is bounded by the smaller of tag window / latency and credit window / loop time.\n- **Posted writes:** they need no tag but do need PH and PD, so a write-heavy load can stall on credits with tags irrelevant.\n- **Completions:** each also consumes CplH and CplD at the requester's receiver.\n- **DLLPs:** they have no Transaction Layer buffer and are consumed by the Data Link Layer, so they need no credits (Module 6).\n- **Three counters, not one:** the DLL sequence number, the tag and the credit counters are separate mechanisms.\n- **How to tell on a trace:** count MRds without completions. If they equal the tag pool, it is tags. If few reads are outstanding and the transmitter is idle with a credit tracker at zero, it is credits.","pitfall":"Fixing a credit stall by raising the tag limit, or the reverse. First find which limit is binding.","verify":"Whether tag values for posted requests have any uniqueness requirement with 10-bit tags.","follow":[{"q":"Can a completer be blocked by credits?","a":"Yes, by the requester's CplH and CplD credits. Requesters normally advertise infinite completion credits, so it is rare."},{"q":"Do posted writes use tags?","a":"The Tag field is present but nothing matches on it, and the write still needs PH and PD."}],"mod":8},{"id":"8.13","level":"Advanced","type":"Debug","fig":null,"tags":["credit-stall","analyzer","nph","idle-link","counters"],"q":"The link is up and clean but all I/O has stopped. How do you prove the transmitter is blocked on NPH credits, from an analyzer trace and from device counters?","short":"Look for the signature: TLPs stop in one direction while DLLPs keep flowing. The analyzer's flow control tracker shows NPH credits at zero for the blocked transmitter, and the peer's UpdateFC-NP carries the same cumulative value each time, so no buffer is being freed. On the device, read its flow control status or stall counters and its count of pending non-posted requests.","deep":"1. **Prove the link is healthy:** LTSSM in L0, no Recovery, Acks flowing, no Bad TLP or replay, DL_Active. A stall is not a link fault.\n2. **Find the quiet direction:** for example the SSD sends no more MRds (SQE fetches) while host doorbells still arrive. Posted traffic such as CQEs may continue, because P and NP have separate credits.\n3. **Read the credit tracker:** the analyzer computes available credits per type from InitFC, TLPs and UpdateFC. NPH at 0 while NP TLPs wait confirms it. The capture must include link-up so InitFC is seen.\n4. **Look at UpdateFC-NP:** if the value repeats unchanged for much longer than the periodic interval while NP TLPs wait, the receiver is not draining its NP queue.\n5. **Find why the receiver's NP queue is stuck:** in a Root Complex it may be a request waiting on an IOMMU walk, a memory path, or a peer device. An NP request cannot pass earlier posted writes, so a stuck posted write blocks it. Follow the chain link by link to the port whose credits are zero and whose peer is not returning them.\n6. **Device counters:** PCIe controller debug registers usually show credit availability per type, TX stall cycles, and outstanding tags. Names are vendor specific.\n7. **Opposite case:** if UpdateFC-NP carries new values and credits are available but the device stays silent, the transmitter mis-tracks credits. Suspect the wraparound arithmetic (Numeric question above) or a stuck queue inside the device.\n8. **Versus a dead endpoint:** with a dead endpoint, credits and Acks still flow but completions never come back. That is a different fault.\n\n- **Host view:** commands time out. The NVMe driver's default I/O timeout is 30 seconds, much longer than PCIe timeouts.","pitfall":"Starting from the assumption that endpoint firmware hung. First establish whose credits are exhausted and whether the peer is returning any.","verify":"Which analyzer models compute credit state, and the debug counter names in your controller IP.","follow":[{"q":"Why can posted traffic flow while NP is stalled?","a":"Credit types are independent and posted requests must be able to pass non-posted ones. It keeps one class from blocking the others."},{"q":"What will the requester see later?","a":"Completion timeouts for non-posted requests it sent before the stall, and host command timeouts."}],"mod":8},{"id":"8.14","level":"Principal","type":"Cross-layer","fig":null,"tags":["completion-timeout","credit-stall","nvme-timeout","dpc"],"q":"How does a flow control stall or a hung completer turn into a completion timeout, and what happens to the NVMe command?","short":"The requester runs a completion timer for each non-posted request. If no completion arrives in the programmed range, it logs a Completion Timeout, frees the tag, and reports the failure upward. A credit stall in a switch or Root Complex, or a hung completer, only becomes an error when it lasts longer than the timer. For an SSD reading host memory, the DMA fails, and the command either completes with an error or times out at the host, which resets the controller.","deep":"- **Timer:** the Completion Timeout Value in Device Control 2 selects a range, from 50 microseconds up to 64 seconds across the ranges. Default is 50 microseconds to 50 milliseconds. Register details are in Module 12.\n- **Where the wait counts:** time waiting to be transmitted for lack of credits at the requester's own port is before the request goes out. Time spent queued in a switch or Root Complex, or in the completer, is inside the timeout window.\n- **Stall types:**\n  - Requester's own port out of NPH: no request is sent, so no timeout, but the device makes no progress and the host eventually times out its command.\n  - Downstream credit stall in a switch or Root Complex: the request is sent, completion is late, timeout if longer than the timer.\n  - Completion path stuck: rare, since requesters advertise infinite completion credits, and suggests a hung receive path.\n- **After a timeout:** the completion may still arrive late. A robust requester must not let it match a reused tag, so it holds the tag out of use for a while or resets. Late arrivals are logged as Unexpected Completion.\n- **Escalation:** the error is reported as ERR_NONFATAL. Where DPC is enabled the downstream port contains the error and takes the link down, and the host sees the controller vanish and re-initializes it.\n- **Timeline correlation:** PCIe timeouts (milliseconds) come well before NVMe timeouts (30 seconds for I/O by default). If only the NVMe one shows, the PCIe layer produced no error.\n- **Firmware policy:** what the controller does when a host memory access fails, such as returning Data Transfer Error or raising fatal status, is a design choice that validation must probe.","pitfall":"Treating \"no timeout logged\" as \"no stall\". A stall shorter than the timer is invisible in AER but still a latency problem.","verify":"When the completion timer starts, the range and default values, late-completion and tag reuse rules, and NVMe behavior on failed host memory accesses.","follow":[{"q":"Should you shorten the timeout to catch stalls faster?","a":"Only carefully. Real paths with IOMMU walks, switches and L1 exits add delay and cause false positives. Disabling it hides hung paths."},{"q":"How does DPC relate?","a":"DPC contains an uncorrectable error at the downstream port by disabling the link, so the host recovers the device with a driver-level reset."}],"mod":8},{"id":"8.15","level":"Principal","type":"Scenario","fig":null,"tags":["credit-limited","switch","throughput","triage","quantify"],"q":"A Gen4 x4 SSD behind a switch tops out at 5.6 GB/s sequential read with a clean link. How do you show it is credit-limited, and what would you change?","short":"The SSD sends read data as posted writes, so its ceiling is credit window / loop time at the switch's downstream port. Capture the link from reset to get InitFC, read the posted credits the switch advertised, and measure the loop time between a TLP and the UpdateFC that returns its credits. If window / loop time matches the measured throughput, credits are the limit. The fix is on the switch side, or removing the hop.","deep":"Illustrative numbers (read your own from the trace):\n1. **Link is clean:** no replays, no Recovery, 256 B TLPs, link idle about 22% of the time (5.6 GB/s of payload is about 6.2 GB/s on the wire, against 7.88 GB/s).\n2. **InitFC from the switch downstream port:** PH = 32, PD = 256.\n3. **Windows:** PH: 32 x 256 B = 8192 B. PD: 256 x 16 B = 4096 B. PD binds.\n4. **Loop time:** on the trace, the time from a TLP to the UpdateFC covering it is about 0.73 microsecond.\n5. **Prediction:** 4096 B / 0.73 microsecond = 5.6 GB/s, which equals what was measured. That confirms it.\n6. **Steady-state signature:** the tracker shows PD credits dropping to about zero before each UpdateFC, a sawtooth.\n\n| Observation | Calculation | Conclusion |\n|---|---|---|\n| 5.6 GB/s measured | 4096 B / 0.73 us = 5.6 GB/s | Credit-limited on PD |\n| MPS 128 instead of 256 | Window is still 4096 B by PD | No help |\n| PH were the limit | Window = 32 x MPS | Larger MPS would help |\n\n- **Second hop:** backpressure propagates, so also check the switch's upstream port and the Root Complex credits. The slowest loop rules.\n- **Options:** change the switch buffer profile or firmware if it exposes one, improve the UpdateFC cadence, use another switch port or a direct-attach slot, or accept and document it.\n- **Confirming experiment:** connect the drive directly to the Root Port. If throughput returns near 7 GB/s, the switch is the difference.","pitfall":"Blaming the switch without checking the second hop, or confusing the UpdateFC spacing with the delay in returning credits.","verify":"Whether your switch exposes buffer or credit configuration, and its UpdateFC latency behavior. The credit numbers above are examples, not measurements.","follow":[{"q":"Would a larger MPS help here?","a":"Only if PH were the limit. With PD binding, the window in bytes is fixed by data credits, whatever the TLP size."},{"q":"How do you estimate loop time without special tooling?","a":"Use analyzer timestamps from a TLP to the first UpdateFC covering it, or infer it as window / measured throughput and compare."}],"mod":8},{"id":"8.16","level":"Principal","type":"Scenario","fig":null,"tags":["test-design","flow-control","wraparound","infinite-credit","exerciser"],"q":"How would you design a test that proves a device's flow control handling: credit exhaustion, counter wraparound and infinite credit?","short":"Use a protocol exerciser or a link-partner model that controls InitFC values and UpdateFC timing, plus an in-line analyzer with a credit tracker. Test minimal credits, exhaustion of each type with exact-count stops, independence of P, NP and Cpl, counter wrap at header and data widths, infinite completion credits, lost and delayed UpdateFC, and state across Recovery and link down. Pass means no TLP is ever sent without credit, no deadlock, no data loss and throughput matches the model.","deep":"1. **Minimal credits:** the partner advertises the smallest legal window. The device must work slowly and never exceed it.\n2. **Exhaustion, per type:** withhold UpdateFC for NP. Count NP TLPs sent: it must equal the credits granted exactly. Release one credit and expect exactly one more TLP. Repeat for all six types. Test the data check separately: with 15 PD left and a TLP needing 16, the device waits even with PH free.\n3. **Independence and deadlock:** with NP exhausted, posted writes and completions must still flow past the blocked non-posted requests. With P exhausted, a completion queued behind an earlier posted write may legitimately wait, so do not fail the device for that; the mandatory bypasses only run past non-posted requests.\n4. **Wraparound:** run enough traffic for the header counter (256 credits) and the data counter (4096 credits, 64 KiB) to wrap many times, with tiny and maximum windows (127 and 2047), and with random TLP sizes. Aim at cases where limit and consumed straddle the wrap.\n5. **Infinite credit:** the partner advertises infinite completion credits and the device sends thousands of completions ungated. Also make the device advertise infinite and hammer it with the maximum outstanding reads returning together.\n6. **UpdateFC behavior:** delay, coalesce, corrupt (Bad DLLP CRC) or drop them, and check the next cumulative value repairs it. Measure the device's own UpdateFC latency against the spec under load.\n7. **Violation handling (device as receiver):** the partner exceeds its credits on purpose. The device should flag Receiver Overflow if it implements the check.\n8. **State persistence:** credits are retained across Recovery, speed changes and L1 exit, and re-initialized after link down. Loop a thousand cycles.\n9. **Scaled flow control:** on, off, and against a partner without it.\n10. **Model check:** at several credit settings, measured throughput should match min(line rate, window / loop time).\n\n- **Pass criteria:** the tracker asserts no send without credit, no lost or duplicated TLP, data intact, AER clean, throughput within a few percent of the model.\n- **Automation:** parametrize credits and timing, seed randomness, log tracker assertions, run per build.","pitfall":"Testing only against a production Root Port. It advertises large credits and returns them fast, so the exhaustion and wrap corners never occur. And an analyzer tracker that missed InitFC is blind.","verify":"The minimum credits a receiver must advertise per type, and the exact error names and severities for credit violations.","follow":[{"q":"How do you make a wrap bug appear in minutes and not hours?","a":"Small windows and many tiny TLPs. 256 tiny posted writes wrap the header counter, and 64 KiB of data wraps the data counter, so it takes microseconds."},{"q":"What does a missing data-side check look like?","a":"The device sends a large TLP when PH is available but PD is short, and the partner reports Receiver Overflow on data credits."}],"mod":8},{"id":"9.01","level":"Basic","type":"Concept","fig":"cfgspace","tags":["config-space","type0","type1","header","layout"],"q":"How is PCIe configuration space laid out, and how do Type 0 and Type 1 headers differ?","short":"Every function has its own configuration space of up to 4 KB. The first 256 bytes are the legacy PCI-compatible region: a 64-byte header (Type 0 for endpoints, Type 1 for bridges and root or switch ports) followed by capability structures. Offsets 100h to FFFh hold the PCIe extended capabilities. It is the only thing software can reach before any BAR is assigned.","deep":"| Offset | Content |\n|---|---|\n| 00h-3Fh | Standard header, Type 0 or Type 1 (Header Type at 0Eh, bits 6:0) |\n| 40h-FFh | Capability structures, linked from the pointer at 34h |\n| 100h-FFFh | Extended capability structures, linked from 100h |\n\n- **Per function:** a multi-function device has one 4 KB space per function. Function 0 is mandatory.\n- **Access paths:** CfgRd/CfgWr TLPs generated by the root complex, the memory-mapped ECAM window that hides them behind ordinary loads and stores, and the legacy x86 ports CF8h/CFCh, which reach only the first 256 bytes.\n- **Where it lives:** in registers inside the device, with attributes such as read-only, read-write, write-1-to-clear and sticky. It is not stored in host memory.\n\n| Offset | Type 0 (endpoint) | Type 1 (bridge or port) |\n|---|---|---|\n| 00h-0Fh | IDs, Command, Status, Revision, Class Code, Header Type, BIST | Same |\n| 10h-17h | BAR0, BAR1 | BAR0, BAR1 |\n| 18h-27h | BAR2 to BAR5 | Primary, Secondary and Subordinate bus numbers, I/O, Memory and Prefetchable Base/Limit, Secondary Status |\n| 28h-33h | Subsystem IDs (2Ch), Expansion ROM BAR (30h) | Prefetchable and I/O upper address bits |\n| 34h-3Fh | Capabilities Pointer, Interrupt Line and Pin | Capabilities Pointer, Expansion ROM (38h), Interrupt Line and Pin, Bridge Control (3Eh) |","pitfall":"Treating the 4 KB as one space per device. It is per function, and each function can have a different capability chain.","verify":"Type 1 field offsets against the header figure in the PCIe Base Specification (or PCI-to-PCI Bridge Architecture Specification).","follow":[{"q":"Can the legacy CF8h/CFCh mechanism read an extended capability?","a":"No. It reaches only 256 bytes, so extended capabilities need ECAM or an equivalent memory-mapped mechanism."},{"q":"How does software know which header layout to parse?","a":"Read Header Type at 0Eh and mask bit 7 (the multi-function flag). 00h is Type 0, 01h is Type 1."}],"mod":9},{"id":"9.02","level":"Basic","type":"Concept","fig":null,"tags":["vendor-id","device-id","class-code","header-type","multifunction","nvme"],"q":"Which config space fields identify a function, and what is the Class Code of an NVMe SSD?","short":"Vendor ID (00h) and Device ID (02h) name the silicon, Revision ID (08h) the stepping, and the three-byte Class Code (09h to 0Bh) says what kind of function it is. For NVMe it is base class 01h (mass storage), sub-class 08h (non-volatile memory), programming interface 02h (NVM Express), so 010802h. Header Type (0Eh) holds the layout in bits 6:0 and the multi-function flag in bit 7. A Vendor ID of FFFFh means nothing answered.","deep":"- **Vendor ID:** assigned by the PCI-SIG. FFFFh is reserved as invalid, which is why an empty slot reads as all ones.\n- **Device ID and Revision ID:** vendor-assigned. Drivers and quirk tables key on the pair, and firmware validation keys on Revision to tell steppings apart.\n- **Subsystem Vendor ID and Subsystem ID (Type 0, at 2Ch and 2Eh):** identify the board or OEM that used the chip, so the same controller can have different quirks per SSD model.\n- **Class Code layout:** offset 0Bh base class, 0Ah sub-class, 09h programming interface. lspci prints `Non-Volatile memory controller (prog-if 02 [NVM Express])`.\n- **Header Type bit 7:** if set, the device has more than one function and the enumerator must probe the other function numbers. If clear, only function 0 exists.\n- **Driver binding:** Linux `nvme` matches on the class code 010802h with a wildcard entry, plus specific Vendor/Device entries for quirks. Windows lists `CC_010802` in the hardware ID and binds its in-box NVMe driver by that.","pitfall":"Matching on Device ID alone in a test script. The same Device ID can ship with different firmware and Subsystem IDs, and behavior can differ per OEM model.","verify":"Programming interface values for NVMe (02h NVM Express, 01h NVMHCI, and any newer value for administrative controllers) in the PCI-SIG class code list and the NVMe over PCIe Transport specification.","follow":[{"q":"What do SR-IOV virtual functions return for Vendor ID?","a":"FFFFh. Their identity comes from the physical function's SR-IOV capability (VF Device ID), and the OS treats them specially."},{"q":"Why is Vendor ID read first during enumeration?","a":"It is the cheapest presence test. Anything except a valid ID means no function there (or not ready yet, see Configuration Request Retry Status)."}],"mod":9},{"id":"9.03","level":"Basic","type":"Concept","fig":null,"tags":["command","status","mse","bme","intx","write-1-to-clear"],"q":"What do the Command and Status registers control, and which bits matter for an NVMe SSD?","short":"Command (04h) enables the function's behavior. Memory Space Enable turns on BAR decoding, Bus Master Enable lets the function issue memory requests (DMA and MSI/MSI-X writes), and Interrupt Disable blocks INTx. Status (06h) reports state: the Capabilities List bit says a capability chain exists, Interrupt Status shows pending INTx, and the error bits are write-1-to-clear. Both reset to disabled, so software must enable them.","deep":"| Register | Bit | Name | Meaning |\n|---|---|---|---|\n| Command | 0 | I/O Space Enable | Decode I/O BARs |\n| Command | 1 | Memory Space Enable | Decode memory BARs. Off means MMIO is not claimed |\n| Command | 2 | Bus Master Enable | Function may issue memory and I/O requests |\n| Command | 6, 8 | Parity Error Response, SERR# Enable | Error reporting controls |\n| Command | 10 | Interrupt Disable | Suppress INTx only. No effect on MSI/MSI-X |\n| Status | 3 | Interrupt Status | Reflects INTx state |\n| Status | 4 | Capabilities List | Pointer at 34h is valid |\n| Status | 8, 11-15 | Master Data Parity Error, Signaled and Received Target Abort, Received Master Abort, Signaled System Error, Detected Parity Error | Sticky error flags, write 1 to clear |\n\n- **Bus Master Enable on an SSD:** an NVMe controller fetches queue entries and moves data by DMA, and its MSI-X interrupts are memory writes too. With BME clear, nothing leaves the device, so the host sees a controller that looks fine on MMIO but never completes commands.\n- **Bridges:** on a Type 1 header, Memory Space Enable gates forwarding downstream and Bus Master Enable gates forwarding of upstream requests.\n- **Layout trap:** Command is the low half and Status the high half of the DWORD at 04h.","pitfall":"A 32-bit read-modify-write to offset 04h writes back the Status half. Any error bit that was read as 1 is written as 1 and cleared, so you lose evidence. Use 16-bit accesses (`setpci ... COMMAND=...`).","verify":"Bit positions against the Command and Status register figures in the Base Specification.","follow":[{"q":"Who sets Bus Master Enable, the BIOS or the OS driver?","a":"Usually the OS, via `pci_set_master()` in Linux, when the driver enables the device. Firmware sets it only when it uses the device, for example to boot from it."},{"q":"Does Interrupt Disable stop MSI-X?","a":"No. It only masks INTx. Drivers often set it anyway when they enable MSI-X."}],"mod":9},{"id":"9.04","level":"Intermediate","type":"Concept","fig":null,"tags":["bar","prefetchable","64-bit","io-space"],"q":"Explain Base Address Registers: memory versus I/O, 32-bit versus 64-bit, and the prefetchable bit.","short":"A BAR tells software how much address space the function needs, and receives the base address software assigns. Bit 0 says memory (0) or I/O (1). For memory BARs, bits 2:1 select 32-bit (00b) or 64-bit (10b, which consumes two consecutive BAR slots), and bit 3 is Prefetchable. Sizes are powers of two and the base must be naturally aligned. A Type 0 header has six slots, a Type 1 header two.","deep":"| Field | Memory BAR | I/O BAR |\n|---|---|---|\n| Bit 0 | 0 | 1 |\n| Bits 2:1 | Type: 00b 32-bit, 10b 64-bit | Bit 1 reserved |\n| Bit 3 | Prefetchable | part of address (bits 31:2) |\n| Address | Bits 31:4 | Bits 31:2 |\n\n- **64-bit BAR:** the low dword sits in slot N and the high dword in slot N+1. A Type 0 header holds at most three of them.\n- **Prefetchable:** reads have no side effects and the data can be merged, read ahead or write-combined. The host may map it write-combining, and bridges may place it in the prefetchable window, which is 64-bit capable.\n- **Non-prefetchable:** register spaces with side effects, like NVMe controller registers and doorbells. They must be uncached and unmerged, and behind a bridge they must sit in the non-prefetchable window, which is 32-bit only, so below 4 GB.\n- **I/O BARs:** legacy. PCIe endpoints such as NVMe SSDs do not need them, and lspci shows `I/O-` in Control.\n- **Address meaning:** the BAR holds a bus address. The CPU physical address of the same range can differ if the host bridge translates. `lspci` and `/proc/iomem` show the two views.","pitfall":"Treating prefetchable as a performance hint. It changes which bridge window the BAR lands in and how the CPU may map it, and mismatching it breaks ordering assumptions.","verify":null,"follow":[{"q":"Why do NVMe controller registers usually sit in a 64-bit non-prefetchable BAR?","a":"They are register space with side effects, so no prefetching or merging, and 64-bit lets firmware place them anywhere the bridge windows allow."},{"q":"What is the ROM BAR?","a":"A separate dword (30h in Type 0) for an option ROM, decoded only when its enable bit is set and Memory Space Enable is on."}],"mod":9},{"id":"9.05","level":"Intermediate","type":"Numeric","fig":null,"tags":["bar","sizing","probing","64-bit","worked-example"],"q":"How does software size a BAR? Work the numbers for a 16 KB 64-bit NVMe BAR0 and a 256 MB prefetchable BAR.","short":"Write all ones to the BAR, read it back, and mask off the low type bits (4 for memory, 2 for I/O). The bits the device hardwires to zero are the size bits. Invert what remains and add 1 to get the size. FFFFC000h reads back as 16 KB. A 64-bit BAR needs both dwords probed and 64-bit arithmetic. Do it with decoding disabled and restore the original value afterwards.","deep":"1. Save the original BAR value and clear Memory Space Enable (and I/O Space Enable) in Command.\n2. Write FFFFFFFFh. Read it back.\n3. The low bits tell the type. For memory, mask the low 4 bits (`& ~0xF`). For I/O, mask the low 2.\n4. Size = (~masked_value) + 1, computed in the BAR's width.\n5. Restore the original value and re-enable decoding.\n\n**Example 1, 32-bit memory:** read back FFFFC000h. Invert gives 00003FFFh, plus 1 is 4000h = 16 KB.\n\n**Example 2, NVMe BAR0 (64-bit, non-prefetchable):** write FFFFFFFFh to BAR0 and BAR1. BAR0 reads FFFFC004h (low nibble 4h: type 10b, prefetchable 0) and BAR1 reads FFFFFFFFh. Combined and masked it is FFFFFFFF_FFFFC000h. Inverted it is 3FFFh, plus 1 is 4000h = 16 KB.\n\n**Example 3, 256 MB prefetchable 64-bit (for example a CMB):** BAR2 reads F000000Ch (type 10b, prefetchable 1), BAR3 reads FFFFFFFFh. Masked: FFFFFFFF_F0000000h. Inverted: 0FFFFFFFh, plus 1 is 10000000h = 256 MB.\n\n- **Edge case:** for a BAR of 4 GB or more the low dword reads back as only the type bits (for example 0000000Ch). 32-bit arithmetic would overflow, so always use 64-bit math on 64-bit BARs.\n- **Alignment:** the lowest writable address bit equals the size, so the base must be a multiple of the size. A 256 MB BAR sits on a 256 MB boundary.","pitfall":"Sizing a live device without disabling decode. The temporary all-ones base can overlap other resources, and if the sequence is interrupted the BAR is left at a bogus address.","verify":"Minimum BAR sizes that the Base Specification allows for memory and I/O BARs.","follow":[{"q":"What does a BAR that reads back 0 after the all-ones write mean?","a":"It is not implemented (hardwired to zero), so skip it."},{"q":"What if the readback is FFFFFFFFh in full?","a":"That is not a 4 GB BAR. It means nothing answered (device gone or link down), so treat it as an error and re-read the Vendor ID."}],"mod":9},{"id":"9.06","level":"Intermediate","type":"Concept","fig":null,"tags":["bridge","bus-number","windows","routing","type1"],"q":"What do bus numbers and the memory, prefetchable and I/O windows in a Type 1 header do?","short":"Every bridge, root port and switch port describes what lies beneath it. Primary, Secondary and Subordinate Bus Number give the bus range that ID-routed TLPs, such as configuration requests and completions, are forwarded into. The I/O, Memory and Prefetchable Base/Limit pairs give the address ranges that address-routed TLPs are forwarded into. Anything else that arrives from below goes upstream.","deep":"- **Bus numbers (18h to 1Ah):** Primary is the bus on the upstream side, Secondary is the bus directly below, Subordinate is the highest bus number anywhere below. A request for bus B goes down if Secondary <= B <= Subordinate.\n- **Memory window (20h/22h):** 16-bit Base and Limit hold address bits 31:20, so granularity is 1 MB, 32-bit, non-prefetchable.\n- **Prefetchable window (24h/26h):** same 1 MB granularity, with upper 32 bits at 28h and 2Ch, so 64-bit capable.\n- **I/O window (1Ch/1Dh):** 4 KB granularity, upper 16 bits at 30h and 32h. Most PCIe endpoints need none.\n- **Closed window:** Base above Limit disables it.\n- **Direction:** a TLP whose address falls inside a window goes downstream. A TLP that does not, such as DMA to host memory or an MSI write, is forwarded upstream if the bridge's Bus Master Enable is set. Address ranges of sibling ports allow peer-to-peer inside a switch, unless ACS redirects it.\n\nDecoding example: Memory Base = E3B0h and Limit = E3B0h. Base address = E3B0h << 16 = E3B00000h, and the limit address = E3B00000h | FFFFFh = E3BFFFFFh, so a 1 MB window.","pitfall":"Forgetting that Bus Master Enable on a bridge controls upstream forwarding. An SSD can be perfectly configured while a bridge above it with BME clear silently blocks its DMA and MSI writes.","verify":"Granularity and register offsets for the I/O window and the reserved bits in the Base/Limit registers.","follow":[{"q":"Why is the smallest window 1 MB even for a 16 KB BAR?","a":"The Base/Limit registers only hold bits 31:20, so software rounds up, and bridge windows waste address space."},{"q":"What does Secondary Bus Reset (Bridge Control) do?","a":"It drives a hot reset on the link below, resetting everything downstream without a power cycle."}],"mod":9},{"id":"9.07","level":"Intermediate","type":"Concept","fig":null,"tags":["capabilities","linked-list","pm","msi","msix","pcie-cap"],"q":"How does the capability linked list work, and which capabilities does an NVMe SSD expose?","short":"If Status bit 4 is set, the byte at offset 34h points to the first capability. Each capability starts with a Capability ID byte and a Next Pointer byte, and the list ends with a next pointer of 00h. Well-known IDs are Power Management 01h, MSI 05h, PCI Express 10h and MSI-X 11h. An NVMe SSD typically shows PM, MSI, PCI Express and MSI-X, with AER in the extended list.","deep":"1. Check Status bit 4 (Capabilities List).\n2. Read the Capabilities Pointer at 34h. Mask the low two bits, since capabilities are dword aligned.\n3. At that offset, read byte 0 (ID) and byte 1 (Next Pointer).\n4. Move to Next Pointer and repeat until it is 00h.\n\n| ID | Capability |\n|---|---|\n| 01h | Power Management |\n| 05h | MSI |\n| 09h | Vendor Specific |\n| 10h | PCI Express |\n| 11h | MSI-X |\n\n- **Order is arbitrary:** capabilities may appear anywhere in 40h to FFh. A typical SSD chain is 40h, 50h, 70h, b0h, each pointing to the next.\n- **Loop guard:** a broken chain can loop. A robust tool bounds the walk (a 256-byte space can hold at most about 48 capabilities) and rejects pointers below 40h.\n- **PCI Express capability location:** it must live in the first 256 bytes, and everything about the PCIe link is reached through it (see the overview question later in this module).\n- **Register-level detail:** PM, MSI and MSI-X internals belong to the power management and interrupt modules.","pitfall":"Assuming a capability sits at a fixed offset. Offsets differ per vendor and per firmware version, so always walk the list.","verify":"Capability ID values (01h, 05h, 09h, 10h, 11h) and the bit position of Status.Capabilities List against the PCI Code and ID Assignment Specification and the Base Specification.","follow":[{"q":"Does the same list logic apply to the Type 1 header?","a":"Yes. The pointer is at 34h in both headers."},{"q":"What does `lspci` print for the chain?","a":"`Capabilities: [40] Power Management version 3`, `[50] MSI: ...`, `[70] Express ...`, `[b0] MSI-X: ...`. The number in brackets is the offset."}],"mod":9},{"id":"9.08","level":"Intermediate","type":"Concept","fig":null,"tags":["extended-capabilities","aer","sriov","ats","dsn","l1-substates"],"q":"How is the extended capability list organized, and which extended capabilities matter for SSD validation?","short":"Extended capabilities start at offset 100h. Each begins with a 32-bit header: a 16-bit Capability ID, a 4-bit Version and a 12-bit Next Capability Offset, which is dword aligned and 0 at the end of the chain. Common ones are AER, Device Serial Number, SR-IOV, ATS, Secondary PCI Express, L1 PM Substates, Latency Tolerance Reporting, and the Physical Layer and Lane Margining capabilities at Gen4 and above.","deep":"- **Header layout:** bits 15:0 ID, bits 19:16 Version, bits 31:20 Next offset. The first is always at 100h, next pointers are at least 100h, and 0 ends the chain.\n- **Version matters:** the same ID with a higher version has more registers, so read the version before you parse.\n- **No extended capabilities:** the dword at 100h reads as zero. If it reads all ones on a device that is otherwise alive, the platform is probably not reaching the extended space (ECAM problem).\n\n| ID | Capability | Why an SSD validator cares |\n|---|---|---|\n| 0001h | Advanced Error Reporting | Error status, masks, header log |\n| 0003h | Device Serial Number | Identify a unit across resets |\n| 000Eh | ARI | Function numbering above 7 |\n| 000Fh | ATS | Address translation for DMA |\n| 0010h | SR-IOV | Virtual functions on enterprise SSDs |\n| 0018h | Latency Tolerance Reporting | Power state gating |\n| 0019h | Secondary PCI Express | Gen3+ lane equalization status |\n| 001Eh | L1 PM Substates | L1.1 and L1.2 |\n| 0026h | Physical Layer 16.0 GT/s | Gen4 eq status |\n| 0027h | Lane Margining at the Receiver | Margin tests |\n\n- **Where they go:** register-level details for errors, power and virtualization are in later modules. Here the point is to find them.","pitfall":"Copying the ID table from memory into a tool. Verify against the spec revision and handle unknown IDs by skipping them, not by aborting the walk.","verify":"All extended capability ID values and versions in this table against the PCI Code and ID Assignment Specification and the Base Specification, including the IDs added after 5.0.","follow":[{"q":"How do you find a specific extended capability?","a":"Walk the chain from 100h comparing IDs, as `setpci ECAP_AER` and `lspci -vvv` do."},{"q":"What about the Vendor-Specific Extended Capability and DVSEC?","a":"Both give vendors their own structures with a standard header. The DVSEC carries a vendor ID and a DVSEC ID, and is how CXL exposes its structures."}],"mod":9},{"id":"9.09","level":"Intermediate","type":"Debug","fig":null,"tags":["lspci","setpci","linux","windows","tools","sysfs"],"q":"How do you read and interpret config space in practice on Linux and Windows? Interpret this `lspci` snippet.","short":"On Linux run `lspci -vvv -s <BDF>` as root for decoded output, `lspci -xxxx` for the raw 4 KB, and `setpci` to read or write single registers. Read the Control and Status lines for enables, the Region lines for BAR addresses and sizes, then LnkCap against LnkSta for link state. On Windows use Device Manager (Resources and Details tabs), WinDbg `!pci`, or vendor and third-party PCI dump utilities.","deep":"```\n3b:00.0 Non-Volatile memory controller (prog-if 02 [NVM Express])\n    Control: I/O- Mem+ BusMaster+ ... DisINTx+\n    Status: Cap+ ... INTx-\n    Region 0: Memory at e3b00000 (64-bit, non-prefetchable) [size=16K]\n    Capabilities: [70] Express Endpoint\n        LnkCap: Speed 16GT/s, Width x4\n        LnkSta: Speed 8GT/s (downgraded), Width x4\n    Capabilities: [b0] MSI-X: Enable+ Count=129 Masked-\n        Vector table: BAR=0 offset=00002000\n```\n- **Reading it:** the driver has enabled Mem and BusMaster. DisINTx+ means INTx is off and MSI-X is in use (Enable+, 129 vectors, table in BAR0 at 2000h). BAR0 is 16 KB.\n- **The problem:** LnkSta is 8 GT/s but LnkCap is 16 GT/s. Check the other end: read the root port's LnkCap first, because a Gen3 slot makes this normal. Then check the target speed in Link Control 2 and equalization status in Link Status 2 and the Secondary PCI Express capability (see the link modules).\n- **Commands:**\n  - `lspci -nn -tv` shows the tree with IDs, `-D` adds the domain.\n  - `lspci -xxx -s 3b:00.0` dumps 256 bytes, `-xxxx` dumps 4096.\n  - `setpci -s 3b:00.0 COMMAND` reads Command, `COMMAND=0004:0004` sets Bus Master, and `CAP_EXP+10.w` reads Link Control.\n  - `/sys/bus/pci/devices/0000:3b:00.0/config` is the raw file, and `resource0` is BAR0.\n- **Windows:** Device Manager, Details, \"Location paths\" and \"Hardware Ids\" (with `CC_010802`), Resources for memory range and IRQ, `!pci` in kernel debugging.","pitfall":"Reading LnkSta as if it described the whole path. Each end reports its own, and downgraded compares only against that device's own LnkCap.","verify":"`setpci` symbolic names such as `CAP_EXP` and `ECAP_AER` for your pciutils version, and the WinDbg `!pci` flags for your debugger version.","follow":[{"q":"Why does `lspci` show `<access denied>` for capability details?","a":"Non-root users can read only the first 64 bytes through sysfs. Run as root."},{"q":"Is it safe to run `setpci` writes on a live SSD?","a":"Only on registers you understand. Writing Command or Link Control while the driver runs can hang the device or the link."}],"mod":9},{"id":"9.10","level":"Advanced","type":"Concept","fig":null,"tags":["pcie-capability","mps","mrrs","device-control","link-control"],"q":"What is in the PCI Express capability structure, and which registers must enumeration software program?","short":"The PCI Express capability (ID 10h) holds the PCIe-specific controls: the device and port type, Device Capabilities and Control (Max Payload Size, Max Read Request Size, Relaxed Ordering Enable, Extended Tag Field Enable), Link Capabilities, Control and Status, and the second-generation Device, Link and Slot registers. Software programs MPS and MRRS to be consistent across the hierarchy and leaves Link Control mostly to link management.","deep":"| Offset in capability | Register |\n|---|---|\n| 02h | PCI Express Capabilities (version, device/port type) |\n| 04h, 08h, 0Ah | Device Capabilities, Control, Status |\n| 0Ch, 10h, 12h | Link Capabilities, Control, Status |\n| 24h, 28h, 2Ah | Device Capabilities 2, Control 2, Status 2 |\n| 2Ch, 30h, 32h | Link Capabilities 2, Control 2, Status 2 |\n\n- **Device Control:** Max Payload Size (bits 7:5), Enable Relaxed Ordering (bit 4), Extended Tag Field Enable (bit 8), Max Read Request Size (bits 14:12), error reporting enables, Initiate FLR.\n- **MPS encoding:** 000b is 128 B, 001b 256 B, then 512 B, 1024 B, 2048 B, 4096 B. A TLP payload above the receiver's MPS is a Malformed TLP.\n- **MRRS:** limits the size of read requests a device issues. An NVMe SSD reads host memory for commands, PRP lists and write data, so its MRRS affects write performance.\n- **Link registers:** Link Capabilities gives max speed and width and ASPM support, Link Control holds ASPM Control, Retrain Link and Common Clock Configuration, and Link Status holds Current Link Speed, Negotiated Link Width, Link Training and Data Link Layer Link Active. Details were covered in the LTSSM and equalization modules.\n- **Control 2:** Completion Timeout value, ARI Forwarding Enable, and Target Link Speed in Link Control 2.\n- **Port-only registers:** Slot and Root registers exist only for ports that need them.","pitfall":"Assuming a larger MPS on the SSD than on the root complex is harmless. Its writes exceed the receiver's limit and are dropped as Malformed TLPs, which can look like a data corruption bug.","verify":"Register offsets and bit positions within Device Capabilities, Control and Control 2 against the PCI Express Capability Structure figure in the Base Specification.","follow":[{"q":"Who decides the MPS for a path?","a":"Enumeration software, which sets each device's MPS to at most what every device it may talk to accepts, usually the minimum along the path."},{"q":"Where do you see Relaxed Ordering used?","a":"The device sets an attribute bit in memory write TLPs if Enable Relaxed Ordering is on. Its effect is covered in the ordering module."}],"mod":9},{"id":"9.11","level":"Advanced","type":"Numeric","fig":null,"tags":["ecam","mcfg","addressing","ari"],"q":"How does ECAM map bus, device, function and register into a memory address, and how large is it?","short":"The address is base + (bus << 20) + (device << 15) + (function << 12) + register offset. That gives 4 KB per function, 1 MB per bus (32 devices x 8 functions x 4 KB) and 256 MB for 256 buses in one segment. The base comes from the ACPI MCFG table. Example: 03:1C.2 register 10h with base C0000000h is C03E2010h. With ARI the device and function bits form one 8-bit function number.","deep":"1. Fields: bus is 8 bits (27:20), device is 5 bits (19:15), function is 3 bits (14:12), and the register is 12 bits (11:0).\n2. Example 1, bus 03h, device 1Ch, function 2, register 10h (BAR0), base C0000000h:\n   - 03h << 20 = 00300000h\n   - 1Ch << 15 = 000E0000h\n   - 2 << 12 = 00002000h\n   - Sum with 10h: 003E2010h, so address C03E2010h.\n3. Example 2, 3B:00.0 register 100h (first extended capability), base E0000000h: 3Bh << 20 = 03B00000h, so address E3B00100h.\n4. Sizes: 4 KB x 8 x 32 = 1 MB per bus. 1 MB x 256 buses = 256 MB per segment. If firmware limits the range to 64 buses, it reserves 64 MB.\n\n- **Segments:** MCFG has one entry per PCI segment (domain), each with a base, segment number and bus range. `lspci` shows the domain as the leading `0000:`.\n- **ARI:** bits 19:12 become an 8-bit function number. For example function 45h on bus 3Bh, register 10h gives E3B45010h.\n- **Access rules:** map it uncached, use naturally aligned 1, 2 or 4 byte accesses that do not cross a dword, and expect the root complex to turn each into one CfgRd or CfgWr TLP.\n- **Linux log:** `PCI: MMCONFIG for domain 0000 [bus 00-ff] at [mem 0xe0000000-0xefffffff]` shows the range.","pitfall":"Forgetting the segment. Two devices on different segments can have the same bus/device/function, so a tool must key on the full domain:bus:device.function.","verify":"MCFG table format and the requirement for the uncached mapping in the ACPI and PCI Firmware specifications.","follow":[{"q":"What does ECAM cost in address space?","a":"Up to 256 MB of address space for a full 256-bus segment (usually placed below 4 GB, though the MCFG base can be higher), which is why firmware trims the bus range on some platforms."},{"q":"What if the ECAM region is not mapped or wrong?","a":"Reads return all ones, extended capabilities vanish while the first 256 bytes may still work through CF8h/CFCh."}],"mod":9},{"id":"9.12","level":"Advanced","type":"Concept","fig":null,"tags":["cfgrd","cfgwr","type0","type1","ari","routing"],"q":"What are Type 0 and Type 1 configuration requests, how does a bridge convert one into the other, and what does ARI change?","short":"Configuration requests are single-dword non-posted TLPs routed by bus, device and function. A Type 0 request (CfgRd0 or CfgWr0) is for a function on the link it arrives on. A Type 1 request (CfgRd1 or CfgWr1) is for something below a bridge. A bridge receiving Type 1 for its Secondary bus converts it to Type 0, and forwards it unchanged if the bus is deeper. ARI turns device and function into one 8-bit function number.","deep":"- **TLP format:** 3 DW header, Fmt/Type CfgRd0 = 000 00100b, CfgWr0 = 010 00100b, CfgRd1 = 000 00101b, CfgWr1 = 010 00101b. The target is in DW2 (bus 31:24, device 23:19, function 18:16, register number in the low bits) with a length of 1 DW.\n- **Completions:** a read returns CplD, a write returns Cpl. Unsupported Request means nothing decoded it, and CRS means it is not ready (see the reset readiness question).\n- **Bridge decision on receiving Type 1 from upstream:**\n  1. Bus equals Secondary: convert to Type 0 and send down.\n  2. Bus in Secondary+1 to Subordinate: forward as Type 1.\n  3. Otherwise: not for this port, complete with UR (or ignore).\n- **Type 0 arriving at a bridge:** it is for the bridge's own config space.\n- **One device per link:** a PCIe downstream port forwards only device 0 to the link partner, so a non-ARI enumerator scanning devices 1 to 31 below a root or switch port gets UR. Bus 0 and the internal bus of a switch do hold several devices.\n- **ARI (Alternative Routing-ID Interpretation):** the 8 bits of device and function form a function number, so one device can have up to 256 functions. A downstream port needs ARI Forwarding Enabled in Device Control 2. Functions are found by following the ARI capability's Next Function Number chain. SR-IOV uses it for many virtual functions.","pitfall":"Assuming a Type 1 request changes at each hop. It stays Type 1 until the bridge whose Secondary bus is the target.","verify":"Fmt/Type encodings, the UR versus drop behavior for out-of-range Type 1 requests, and the device-number handling with ARI Forwarding in the Base Specification.","follow":[{"q":"Which config request does the root complex use for a device directly below a root port?","a":"Type 0 if the bus equals the root port's Secondary bus, Type 1 if the target is deeper."},{"q":"Why is ARI needed for SR-IOV SSDs?","a":"Eight functions are too few for many virtual functions, so ARI provides up to 256 per bus without extra bus numbers."}],"mod":9},{"id":"9.13","level":"Principal","type":"Scenario","fig":null,"tags":["enumeration","depth-first","bus-numbers","windows","mps","hotplug"],"q":"Walk through how software enumerates a root port, a switch and two NVMe SSDs, including the bus numbers and windows it programs.","short":"Enumeration is a depth-first scan. At each bridge software assigns a Secondary bus number, scans below it, and only then knows the Subordinate number to program. Endpoints get their BARs sized. On the way back up each bridge's memory window is set to cover its children. Finally software programs MPS across the hierarchy and enables Command bits. In this example the buses are numbered 1 to 4 and each SSD port gets a 1 MB window.","deep":"Topology: Root port RP (00:1C.0), a switch upstream port USP (bus 1), a switch internal bus 2 with downstream ports DSP-A (02:01.0) and DSP-B (02:02.0), and SSD1 and SSD2, each a 16 KB 64-bit non-prefetchable BAR0.\n1. RP: Primary 0, Secondary 1, Subordinate temporarily FFh. Scan bus 1.\n2. USP: Primary 1, Secondary 2, Subordinate FFh. Scan bus 2.\n3. DSP-A: Primary 2, Secondary 3, Subordinate FFh. SSD1 at 03:00.0: size BAR0 (16 KB). DSP-A Subordinate = 3.\n4. DSP-B: Primary 2, Secondary 4, SSD2 at 04:00.0. Subordinate = 4.\n5. Back up: USP Subordinate = 4, and RP Subordinate = 4. (A hot-plug reserve would raise them.)\n6. Windows: each SSD needs 16 KB, but a bridge window rounds to 1 MB, so DSP-A gets 1 MB, DSP-B 1 MB, USP 2 MB and RP 2 MB. For example the RP window E0000000h to E01FFFFFh, DSP-A E0000000h, DSP-B E0100000h, giving SSD1 BAR0 at E0000000h and SSD2 at E0100000h.\n7. Configure: MPS and MRRS across the tree, ARI Forwarding where devices support it, Interrupt Line, then Memory Space Enable and Bus Master Enable, starting from the endpoints and going up.\n\n- **Why depth-first:** the Subordinate number is only known after the scan below finishes.\n- **Packing:** allocate the largest BARs first, since each must be naturally aligned. 64-bit non-prefetchable BARs must sit below 4 GB, since bridge memory windows are 32-bit.\n- **Hot-plug:** firmware reserves extra bus numbers and window space on hot-plug bridges (Linux `pci=hpbussize=`, `hpmemsize=`), or a later hot-add has nowhere to go.\n- **Failure modes:** Above 4G Decoding off with large prefetchable BARs, or too few bus numbers in a deep switch tree.","pitfall":"Setting Subordinate to the current bus before scanning below. Type 1 requests to devices deeper in the tree are never forwarded, and downstream devices look missing.","verify":"Linux boot parameter names (`hpbussize`, `hpmemsize`, `realloc`, `pcie_bus_safe`, `pcie_bus_perf`) for your kernel version.","follow":[{"q":"Which MPS do you choose?","a":"The largest value every device on the path supports, so no receiver sees an oversize payload. Linux offers `pci=pcie_bus_safe` and `pcie_bus_perf`."},{"q":"Who does this, BIOS or OS?","a":"Usually both. The BIOS enumerates to boot, and the OS either trusts it or reassigns (`pci=realloc`)."}],"mod":9},{"id":"9.14","level":"Advanced","type":"Trap","fig":null,"tags":["crs","reset","readiness","100ms","vendor-id"],"q":"You read the Vendor ID 20 ms after reset and get FFFFh or 0001h. Is the SSD dead?","short":"Not necessarily. After a reset a device may not be ready, so it answers configuration requests with Configuration Request Retry Status (CRS). If CRS Software Visibility is enabled, the root complex returns 0001h for a Vendor ID read to say retry later. FFFFh means nobody answered, which can mean a dead link. Software should wait at least 100 ms after reset, then retry, and only after about 1 s of failure treat it as broken.","deep":"- **CRS:** a completion status a device returns for a configuration request while it is initializing. Without software visibility, the root complex retries in hardware. With CRS Software Visibility Enable in Root Control, a read of the 2-byte Vendor ID returns 0001h and software polls.\n- **Timing rules (spec-sensitive):**\n  - Software waits 100 ms after a reset before the first configuration request. For links above 5 GT/s it counts from link-up (Data Link Layer Link Active), not from the end of reset.\n  - A device must be able to finish a first configuration request with success or CRS within about 1 s.\n  - Functional Level Reset has a similar 100 ms budget.\n- **Read what came back:** 0001h from a
