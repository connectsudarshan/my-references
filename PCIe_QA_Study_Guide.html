test that shows the configured behaviour (contained, logged, recovered). Include negative tests, such as a masked error producing no signal, to prove the mask does what the policy says.\n- **Monitoring:** poll counters as rates (see the Data Link Layer module) and alert on any fatal event, any DPC trigger, and any CA.","pitfall":"Setting policy by copying another platform. The right answer depends on topology, redundancy and who owns the registers.","verify":"Whether severity of Poisoned TLP may be raised on your components, ECRC support across the whole path, and DPC support on every port.","follow":[{"q":"Would you ever mask a correctable error?","a":"Only a well-understood, benign class, with a ticket and a review date. A mask that outlives its reason becomes a blind spot."},{"q":"What if the SSD firmware cannot survive a link reset?","a":"Then DPC turns an error into a dead drive. Fix the firmware, since without recovery there is no way to keep it in service, and record the exclusion until it is fixed."}],"mod":12},{"id":"12.18","level":"Principal","type":"Cross-layer","fig":null,"tags":["validation","end-to-end","injection","integrity","oracle","automation"],"q":"How would you design end-to-end error-handling validation for an SSD, from injected error to data integrity verification?","short":"Treat each test as a chain with an oracle at every stage: injected error, device behaviour, host log, recovery, data integrity. Fix the expected result per stage first. Automate with deterministic injection, timestamps correlated across injector, analyzer, host and SSD logs, and a data model that separates acknowledged from in-flight writes. Cover error types, traffic states, locations and configurations, and gate on no corruption and no hang.","deep":"1. **Injection (input):** pick the method for each error class (see the injection question) and make it deterministic: trigger on a specific TLP count, LBA or time. Record the exact injected bits and time.\n2. **Device behaviour (oracle 1):** the SSD must react as specified. Examples: poison rather than send bad data, return UR for an unimplemented address, not hang after a link reset. Capture the SSD's own logs and error counters (SMART, NVMe error log page, vendor log).\n3. **Host log (oracle 2):** the AER registers and OS log show the right class, status bit, First Error Pointer, header log and source ID, in the right order with DPC and NVMe messages.\n4. **Recovery (oracle 3):** the driver callbacks run, the link returns at the expected speed and width, CSTS.RDY is reached and I/O resumes within the stated time.\n5. **Data integrity (oracle 4):**\n   - Every LBA carries a generation tag and checksum so the expected content is known.\n   - After recovery, each LBA must hold the last acknowledged generation or a later in-flight one, never a torn or unknown value.\n   - Reads after recovery are verified, and a full-range scan runs at the end.\n6. **No hang and no collateral damage:** watchdogs on the host and the SSD, sibling devices monitored, and a cap on retrigger loops.\n7. **Coverage:** error type x traffic state (idle, read, write, mixed, deep queue) x location x configuration (masked, unmasked, DPC on or off, native or firmware-first) x link speed and power state (an error in L1 exit is different).\n8. **Automation and reporting:** one scripted case per cell, timestamps aligned by a common clock (or NTP with offsets logged), the analyzer trace kept for failures, and a dashboard by error type, so a regression is seen per firmware build.\n\n- **Include negative controls:** with reporting masked, the OS should not see the error but the data path should still behave. With injection disabled, the same test must pass cleanly to prove the harness itself is sound.\n- **Failure triage:** the stage that fails first tells you where to look. Wrong log means platform or firmware-first. Bad recovery means driver or SSD reset behaviour. Bad data means the SSD data path and is the highest severity.","pitfall":"Treating \"the SSD came back\" as the result. The chain is only as strong as its weakest oracle, and the data check is the one that finds the expensive bugs.","verify":"Which injection methods and logs your platform and SSD support, and the expected behaviour for each error class in the NVMe and PCIe specifications you target.","follow":[{"q":"How many repetitions are enough?","a":"Enough for the failure rate you need to bound. For a rare hang, use the rule of three (about 3 / p clean runs for a bound p at 95 percent), and run many units."},{"q":"How do you handle injections that need special hardware?","a":"Prioritize by risk: use `aer_inject` and condition-based injection everywhere, the DPC trigger widely, and the exerciser on a few reference rigs for precision cases."}],"mod":12},{"id":"13.01","level":"Basic","type":"Concept","fig":"sriov","tags":["sriov","pf","vf","virtualization"],"q":"What is SR-IOV, and what is the difference between a Physical Function and a Virtual Function?","short":"SR-IOV (Single Root I/O Virtualization) lets one physical PCIe device present many lightweight Virtual Functions (VFs) that a hypervisor can hand to different VMs. The Physical Function (PF) is a full function that owns the SR-IOV capability and manages the VFs. Each VF has its own routing ID, BAR slice and interrupt vectors, so the IOMMU can isolate it, but the link and the device internals are shared.","deep":"- **PF:** a normal function with full config space plus the SR-IOV Extended Capability. The host driver uses it to create VFs, assign resources and do administration.\n- **VF:** a lightweight function. It has its own routing ID (so DMA it issues carries a unique requester ID), a slice of the memory window defined by the PF's VF BAR registers, its own MSI-X, and its own Bus Master Enable. Its Vendor ID reads as FFFFh, and software takes the IDs from the PF.\n- **Why routing IDs matter:** the IOMMU, ACS source validation and error reporting all key on the requester ID. A distinct ID per VF is what turns \"one device\" into \"many isolatable devices\".\n\n| Owned per VF | Shared with the PF and other VFs |\n|---|---|\n| Routing ID (requester ID on DMA) | The physical link: speed, width, LTSSM state, retimers |\n| Slice of the VF BAR (doorbells, registers) | Device internals: cores, DRAM, NAND, firmware |\n| MSI-X table and vectors | Most link and power controls, which live in the PF |\n| Own FLR and Bus Master Enable | Bandwidth and thermal envelope |\n\n- **Multi-function versus SR-IOV:** a multi-function device fixes its functions at design time, each with full config space and at most 8 (or 256 with ARI). VFs are created on demand, are cheap, and can number in the hundreds. MR-IOV (several root complexes sharing one device) was specified but is effectively obsolete; multi-host sharing is done with dual-port devices, NTB or CXL.\n- **FLR and migration:** each VF can be reset with its own FLR, while an FLR of the PF tears the VFs down. Moving a running VM with a VF attached needs device-specific state save and restore. The spec's own VF Migration feature is separate and rarely implemented.","pitfall":"Treating a VF as a small independent device. Bandwidth, firmware, thermals and much of the reset domain are shared with the PF.","verify":"Which config registers a VF implements itself versus inherits from the PF (Device Control MPS and MRRS, AER), and the effect of a PF FLR on its VFs.","follow":[{"q":"Can a VF exist without a PF driver?","a":"No. The PF must be enumerated and configured first. On Linux the PF driver has to implement the enable path behind `sriov_numvfs`."},{"q":"Do ten busy VFs get ten links?","a":"No. They share the PF's link and the device's internals, so ten VFs share one x4 pipe and one controller."}],"mod":13},{"id":"13.02","level":"Intermediate","type":"Concept","fig":null,"tags":["sriov","capability","totalvfs","numvfs","vf-bar","vf-mse"],"q":"Walk through the SR-IOV Extended Capability and the order software enables VFs in.","short":"The PF's SR-IOV capability holds TotalVFs (maximum), InitialVFs, NumVFs (how many software wants), First VF Offset and VF Stride (where VF routing IDs sit), Supported and System Page Size, and the VF BARs. SR-IOV Control has VF Enable, VF MSE and ARI Capable Hierarchy. Software writes NumVFs first, then sets VF Enable, then VF MSE so the VF BAR windows decode.","deep":"1. Read TotalVFs, First VF Offset and VF Stride, and the supported page sizes.\n2. Write System Page Size (usually 4 KB). VF BAR slices are aligned to it, which is what lets a hypervisor map one VF's registers with one page.\n3. Size the VF BARs with the usual write-ones-and-read-back method. The value is the size per VF. The window the PF must reserve is that size times the VF count, so firmware often reserves for TotalVFs.\n4. Write NumVFs, which must be at most TotalVFs and can only be changed while VF Enable is 0.\n5. Set VF Enable. The VFs now exist, but the device may need time before they answer config reads.\n6. Set VF MSE. It is one bit that gates memory decoding for every VF, because VFs have no memory-enable bit of their own. Each VF driver then sets its Bus Master Enable.\n\n```\nCapabilities: [1b8] Single Root I/O Virtualization (SR-IOV)\n  IOVCap: Migration-, Interrupt Message Number: 000\n  IOVCtl: Enable+ Migration- Interrupt- MSE+ ARIHierarchy+\n  IOVSta: Migration-\n  Initial VFs: 32, Total VFs: 32, Number of VFs: 8, Function Dependency Link: 00\n  VF offset: 1, stride: 1, Device ID: 0a54\n  Region 0: Memory at ... (64-bit, non-prefetchable)\n```\n\n- **InitialVFs versus TotalVFs:** many devices report the same value for both. Where they differ, InitialVFs is what is available at start-up and TotalVFs is the ceiling.\n- **Linux shortcut:** writing `sriov_numvfs` in sysfs does steps 4 to 6, and writing 0 disables and destroys the VFs.","pitfall":"Assuming VFs exist as soon as NumVFs is written. Only VF Enable creates them.","verify":"Capability ID (0010h), register names and bit positions, the wait time required after VF Enable, and exact `lspci` output formatting on your pciutils version.","follow":[{"q":"Why is VF MSE separate from the PF's Memory Space Enable?","a":"The PF's bit gates the PF's own BARs. VF MSE gates the VF BAR windows, since a VF's own Command register has no working memory-enable."},{"q":"Can you change NumVFs while VFs are enabled?","a":"No. Disable first, which destroys the VFs, then write the new number. On Linux, write 0 to `sriov_numvfs` before writing a new non-zero value."}],"mod":13},{"id":"13.03","level":"Advanced","type":"Numeric","fig":null,"tags":["sriov","routing-id","ari","bus-numbers","first-vf-offset","vf-stride"],"q":"A PF at 3B:00.0 reports First VF Offset 0x10 and VF Stride 2, and you enable 128 VFs. Compute the VF routing IDs and what it means for bus numbers.","short":"VF n has routing ID = PF routing ID + First VF Offset + (n - 1) x VF Stride, counting VFs from 1. Here the PF is 0x3B00, so VF1 is 0x3B10, VF2 is 0x3B12, VF120 is 0x3BFE, and VF121 wraps into 0x3C00 on the next bus. The 128 VFs therefore span two bus numbers, so the upstream bridge must forward buses 3B and 3C, and the hierarchy must use ARI.","deep":"Assumptions: PF routing ID 0x3B00 (bus 0x3B, function 0), ARI enabled so the low 8 bits of the ID are one function number, arithmetic modulo 2^16.\n\n1. VF1 = 0x3B00 + 0x10 + 0 x 2 = 0x3B10, bus 3B, function 0x10.\n2. VF2 = 0x3B00 + 0x10 + 1 x 2 = 0x3B12.\n3. VF64 = 0x3B00 + 0x10 + 63 x 2 = 0x3B00 + 142 = 0x3B8E.\n4. VF120 = 0x3B00 + 0x10 + 119 x 2 = 0x3B00 + 254 = 0x3BFE, the last VF on bus 3B.\n5. VF121 = 0x3B00 + 0x10 + 120 x 2 = 0x3B00 + 256 = 0x3C00, bus 3C function 0.\n6. VF128 = 0x3B00 + 0x10 + 127 x 2 = 0x3B00 + 270 = 0x3C0E.\n\n- **Bus range:** the last VF is on bus 3C, so the bridge above the SSD must have a subordinate bus number of at least 3C. Otherwise config requests to those VFs are not forwarded, and completions addressed to a VF on 3C cannot be routed back by ID through that bridge. Enumeration firmware or the OS must reserve the extra bus numbers.\n- **Why ARI:** without ARI the low 8 bits are split into a 5-bit device number and a 3-bit function number, and a downstream port only reaches device 0. VF1 at 0x3B10 would be device 2, function 0, which cannot be addressed. ARI Forwarding Enable on the downstream port above the device (Device Control 2), plus ARI Capable Hierarchy in SR-IOV Control, lets the whole 8 bits act as the function number.\n- **Bus cost in general:** buses used = (bus of last VF) minus (PF bus) plus 1. A PF with 256 VFs at offset 1 and stride 1 ends at 0x3C00, so it also needs two buses.\n- **IOMMU view:** each VF has a different requester ID, and the ones on bus 3C sit under a different root-table entry.","pitfall":"Forgetting that the VF count can push routing IDs onto a bus number the bridge above does not cover.","verify":"Modulo-2^16 wrap rules, what offset and stride a device reports when ARI Capable Hierarchy is clear, and whether the reported values can change with NumVFs.","follow":[{"q":"Is VF n always PF + n?","a":"No. That holds only for offset 1 and stride 1. Always compute from the two registers."},{"q":"How do you see the resulting IDs on Linux?","a":"`lspci -t` after enabling, or the `virtfn*` symlinks under the PF's sysfs directory, which point at the VF BDFs."}],"mod":13},{"id":"13.04","level":"Intermediate","type":"Debug","fig":null,"tags":["sriov","debug","vf-enable","bus-range","ari","mmio"],"q":"You write a number to sriov_numvfs and the VFs do not appear. How do you find out why?","short":"A write to NumVFs alone creates nothing, so first confirm VF Enable actually got set (the sysfs path does it and returns an error if it fails). Then check the usual blockers: the PF driver support, ARI Forwarding on the downstream port above the endpoint, enough bus numbers above the endpoint, enough MMIO space for the VF BARs, BIOS SR-IOV and Above 4G settings, and whether the device needs time or resources before VFs answer.","deep":"1. **Capability and limits:** `cat sriov_totalvfs`. Zero means no capability, a BIOS setting turning it off, or a driver that does not expose it. `lspci -vvv` shows Total VFs and the VF offset and stride.\n2. **The write itself:** an error from the write plus the matching `dmesg` line usually names the cause. Typical lines say a VF bus is out of range of the bridge's bus range, or that there are not enough MMIO resources for SR-IOV (wording varies by kernel).\n3. **Bus numbers:** compute the last VF's bus as in the previous question. If the bridge's subordinate bus is too small, firmware or the OS did not reserve enough. Fix with firmware settings or, on Linux, options such as `pci=realloc` and `pci=hpbussize=`.\n4. **ARI:** on the upstream bridge, DevCtl2 should show ARIFwd+, and the PF's IOVCtl should show ARIHierarchy+. If not, VFs land on device numbers that cannot be addressed.\n5. **MMIO:** VF BAR total is (per-VF size x NumVFs). Large NVMe VFs with big BARs can exhaust the 32-bit window, so check Above 4G Decoding is on and the parent window is large enough.\n6. **Readiness:** VFs may return all 1s until the device finishes setup. NVMe VFs may also enumerate but be unusable until resources are assigned (next question).\n7. **Confirm:** `lspci -t`, the `virtfn*` links, and a config read of each VF.","pitfall":"Debugging the PF driver first when dmesg already says a bus or MMIO range was exceeded.","verify":"Exact kernel message texts, BIOS option names, and the option syntax for bus reservation on your kernel.","follow":[{"q":"VFs appear in lspci but there are no NVMe block devices. Why?","a":"The VF probed as an NVMe controller but likely has no queues or interrupts assigned, or its secondary controller is offline. Read the driver's dmesg lines and the secondary controller list."},{"q":"Does creating VFs need the IOMMU?","a":"No. Assigning VFs to VMs does, so test creation with and without it."}],"mod":13},{"id":"13.05","level":"Advanced","type":"Cross-layer","fig":null,"tags":["nvme","sriov","primary-controller","secondary-controller","flexible-resources"],"q":"How does NVMe build on SR-IOV, and what are primary and secondary controllers?","short":"NVMe Virtualization Enhancements define a primary controller (the PF's controller) and secondary controllers, one per VF. The primary controller assigns flexible resources, queues and interrupt vectors, to secondary controllers and moves them Online or Offline with the Virtualization Management admin command. Each VF then looks like an ordinary NVMe controller with its own registers, and namespaces are attached to it.","deep":"- **Primary controller:** administers the virtualization. Identify Primary Controller Capabilities reports how many flexible queue and interrupt resources exist, how many secondary controllers, and the allocation granularity.\n- **Secondary controllers:** Identify Secondary Controller List reports each secondary's controller ID, its VF number, whether it is Online, and the queue and interrupt resources it currently has.\n- **Flexible resources:** the primary hands out a pool of queue resources and interrupt vector resources to secondaries before they are brought Online. With 128 queue pairs in the pool and 32 VFs, the average is 4 per VF, and how they are split is a configuration choice. The VF's MSI-X table size follows its interrupt allocation.\n- **Namespaces:** attached to a secondary controller with Namespace Attachment. Private namespaces give isolation, shared namespaces are visible to several controllers.\n- **Independent controller state:** each VF has its own CC, CSTS and admin queue. Disabling one VF controller (CC.EN to 0) or an FLR affects only its queues. PF reset or VF disable affects them all.\n- **Tools:** nvme-cli has `nvme primary-ctrl-caps`, `nvme list-secondary` and `nvme virt-mgmt` for these.\n- **Validation angle:** over-assignment and under-assignment, bring-up order (resources before Online), enabling a controller with fewer resources than its minimum, VF FLR under neighbor load, PF reset with active VFs, and firmware update while VFs are live.","pitfall":"Assuming each VF automatically gets a fair share of queues. The primary allocates explicitly, and an unassigned VF cannot run I/O.","verify":"Command opcode and action codes for Virtualization Management, Identify CNS values for the primary capabilities and secondary list, resource types (VQ and VI), and which NVMe revision defined migration commands.","follow":[{"q":"Is a secondary controller exactly a VF?","a":"It is associated with one. The Secondary Controller List ties each secondary to its VF number."},{"q":"Can an NVMe VF be live-migrated?","a":"Only with a mechanism to save and restore controller state, including in-flight commands and queue pointers. NVMe 2.x added controller-state migration commands, and the details are still device dependent."}],"mod":13},{"id":"13.06","level":"Basic","type":"Concept","fig":null,"tags":["iommu","dma-remapping","iova","vt-d","amd-vi","smmu"],"q":"What does an IOMMU do, and why is every address an NVMe SSD uses for DMA an IOVA?","short":"An IOMMU sits between DMA-capable devices and memory, translating device-visible addresses (IOVAs) to physical addresses and enforcing per-device permissions. Intel calls it VT-d, AMD calls it AMD-Vi, and Arm calls it the SMMU. With it on, the driver maps each buffer, and the SSD's PRPs, SGLs and queue base addresses are IOVAs, so the SSD never sees a physical address and cannot reach memory that was not mapped for it.","deep":"- **Identification:** the IOMMU looks up the requester ID (plus PASID, if present) to pick a translation domain. VF routing IDs are why each VF can have its own domain.\n- **What it protects:** a buggy or malicious device cannot read or corrupt memory outside its mappings. It also allows a device to be assigned to a VM, and lets scattered pages look contiguous to the device.\n- **NVMe path:** the driver calls the DMA API, gets an IOVA for each data page and for the SQ and CQ memory, and writes those into PRP1 and PRP2, the PRP lists and the Create I/O Queue commands. Interrupt writes go through a separate interrupt remapping table.\n- **The IOMMU is not in the PCIe spec:** it is a platform feature in the host bridge or root complex. PCIe supplies the interacting pieces: requester ID, the AT field, ATS, PASID and ACS.\n- **Validation consequences:**\n  - The device must only use addresses the host gave it. Over-fetching a PRP list beyond its end, prefetching queue entries past the queue end, or fetching more than the mapped length turns into a fault that is invisible without an IOMMU.\n  - Page boundaries matter. Mappings are usually 4 KB, and a read that crosses into an unmapped page faults.","pitfall":"Believing the SSD \"just uses physical addresses\". Under an IOMMU it never does, and a firmware bug that invents or reuses addresses shows up as a fault or as corruption.","verify":"Whether interrupt remapping is enabled together with DMA remapping on your platform, and how each vendor's IOMMU derives the domain from the requester ID.","follow":[{"q":"Where does the IOMMU sit relative to the switch and endpoints?","a":"In or beside the root complex, so P2P traffic that stays under a switch does not pass through it unless ACS redirects it upstream."},{"q":"Do the same rules apply on Arm?","a":"Conceptually yes. The SMMU uses a stream ID derived from the requester ID and a substream ID that corresponds to the PASID."}],"mod":13},{"id":"13.07","level":"Intermediate","type":"Concept","fig":null,"tags":["iommu","passthrough","iotlb","performance","strict","lazy"],"q":"What is the difference between IOMMU passthrough and translated mode, and what does translation cost SSD throughput?","short":"In translated mode each DMA goes through IOVA-to-physical page tables and the IOTLB, and every I/O pays for a map and an unmap in the driver. In passthrough (identity) mode, for example Linux iommu=pt, host-owned devices skip the mapping cost but also lose protection. The cost is IOTLB misses that add page-walk latency to DMA, and CPU time in map, unmap and invalidation. It shows up mostly with small random I/O at high IOPS.","deep":"- **Modes:** off, passthrough (identity domain, used for host devices while VFIO devices still get translated domains), and translated (strict, or lazy where invalidations are batched).\n- **Device-side cost:** an IOTLB miss makes the IOMMU walk multi-level tables in host memory. Each dependent read costs roughly a memory latency, so a miss can add on the order of hundreds of nanoseconds to that DMA. Nested translation for VMs adds more.\n- **Footprint effect:** with 4 KB pages, random 4 KB reads spread over a 1 GB buffer pool touch 262,144 distinct pages, far more than an IOTLB holds. Huge pages (2 MB mappings) cut the number of entries by 512 times.\n- **Software cost:** `dma_map_sg` and unmap per I/O, plus IOTLB invalidation on unmap in strict mode. At millions of IOPS across several SSDs this becomes CPU time and lock contention. Lazy mode batches invalidations but leaves a short window where a freed page is still reachable by the device.\n- **What to measure:** run the same fio job with IOMMU off, passthrough and translated, and compare IOPS, CPU utilization and p99 latency. Use the platform's IOMMU performance counters where they exist.\n- **Why both matter:** vendors often quote numbers with the IOMMU off or in passthrough, while cloud hosts run with it on. Validate both.","pitfall":"Benchmarking only with the IOMMU off and shipping into hosts where it is on.","verify":"Default IOMMU mode and option names (`iommu=pt`, `iommu.strict`, `intel_iommu`, `amd_iommu`) for your kernel version.","follow":[{"q":"Does passthrough hide DMA bugs?","a":"Yes. Out-of-range or stale addresses are accepted silently instead of faulting."},{"q":"Why does sequential large I/O barely notice translation?","a":"Large contiguous mappings have few distinct pages and stay in the IOTLB, and per-I/O software cost is amortized over more data."}],"mod":13},{"id":"13.08","level":"Intermediate","type":"Debug","fig":null,"tags":["iommu","fault","dmar","io-page-fault","completer-abort","unsupported-request"],"q":"dmesg is flooded with DMAR (or IO_PAGE_FAULT) messages naming your NVMe SSD. What happened, what does the SSD see, and how do you triage it?","short":"A DMA hit an IOVA that was unmapped or lacked permission. dmesg names the requester ID, direction, fault address and reason code. For a read the root complex typically returns a Completer Abort or Unsupported Request completion, and a posted write is dropped silently. NVMe shows this as command timeouts and controller resets. The address tells you which structure was touched: past a mapped page means an over-fetch, and a just-freed page means a late DMA after unmap.","deep":"```\nDMAR: DRHD: handling fault status reg 2\nDMAR: [DMA Read NO_PASID] Request device [3b:00.0] fault addr 0x7f2e3000 [fault reason 0x06] PTE Read access is not set\nAMD-Vi: Event logged [IO_PAGE_FAULT device=0000:3b:00.0 domain=0x0021 address=0x7f2e3000 flags=0x0020]\n```\n1. **Who:** the requester ID identifies the PF or the exact VF.\n2. **What:** compare the fault address with what the driver mapped. With `CONFIG_DMA_API_DEBUG` or trace events you can see map and unmap calls. An address just beyond a mapped range points to length or PRP list over-fetch. An address that was unmapped microseconds ago points to a late DMA, for instance after a timeout and abort, which is the dangerous case because the page may be reused.\n3. **When:** correlate with resets, aborts, FLR, hot-plug, ATS invalidation and firmware activation.\n4. **Device side:** a Completer Abort or UR completion received by the SSD can set Received Target Abort or Received Master Abort in its Status register (shown by `lspci -vv` as `<TAbort` and `<MAbort`), and the firmware may log its own error. A dropped write leaves no trace on the link.\n5. **Flood effects:** fault recording registers can overflow, the fault interrupt storm eats CPU, and repeated faults can look like a hang.\n6. **Isolation check:** booting with the IOMMU off makes the symptom go away. That only proves the IOMMU was reporting a real bad address.","pitfall":"Treating a DMAR fault as an OS bug. The address is the device's or driver's, and the IOMMU is only reporting it.","verify":"Exact dmesg formats, reason code numbering, whether your platform returns UR or CA for blocked reads, and whether the legacy Status bits are set on your device.","follow":[{"q":"The fault is on a write. What does the SSD see?","a":"Nothing on the link. It believes the write completed. For a host read command, that means the SSD posts a normal completion while the host buffer never received the data, so stale data can be accepted. Faults are found in dmesg, not in AER."},{"q":"Why is a fault right after a command abort suspicious?","a":"The abort and the device DMA raced. The driver unmapped the buffers while the firmware still had a transfer in flight."}],"mod":13},{"id":"13.09","level":"Advanced","type":"Concept","fig":null,"tags":["ats","atc","translation-request","invalidation","pri","at-field"],"q":"How does Address Translation Services work, and what are the Translation Request, ATC, Invalidation and PRI?","short":"ATS lets a device ask the IOMMU (the Translation Agent) to translate addresses ahead of time. It sends a Translation Request (a memory read with the AT field set), gets a Translation Completion with the physical address and permissions, caches it in its Address Translation Cache (ATC), and later issues DMA marked Translated. When a mapping changes, the IOMMU sends an Invalidation Request and waits for the device's Invalidation Completion. PRI lets the device ask the OS to page memory in.","deep":"- **AT field:** two bits in memory requests. Untranslated (IOVA, the IOMMU translates), Translation Request, and Translated (already physical). The value 11b is reserved.\n- **Flow:**\n  1. ATC miss: the device sends a Translation Request for an untranslated address.\n  2. The IOMMU walks the tables and returns a Translation Completion carrying the translated address, the range covered, and read and write permissions.\n  3. The device stores it in the ATC and later sends Translated requests using the physical address.\n  4. If the OS unmaps or changes the page, the IOMMU sends an Invalidate Request message. The device removes matching entries, makes sure earlier requests using them are done, and sends an Invalidate Completion message. The IOMMU may only reuse the page after that.\n- **Why:** it moves the translation work into the device, relieving the IOMMU's IOTLB, and it is the basis for shared virtual memory together with PASID.\n- **Trust:** a Translated request carries a physical address that the IOMMU does not walk again. It only checks that this device is allowed to send translated requests. So ATS is enabled for trusted devices only, and Linux offers `pci=noats`.\n- **PRI:** the device sends a Page Request message for a page that is not present, and the OS handles the fault and replies with a Page Response. This allows unpinned buffers. NVMe data buffers are normally pinned, so PRI is rare for SSDs.","pitfall":"Assuming Translated requests bypass the IOMMU entirely. They skip the page walk, not the permission decision.","verify":"AT encodings, Translation Completion data entry fields (size, permissions, untranslated-only and no-snoop bits), invalidate queue depth semantics, and PRI message names in the ATS and PRI sections of the Base Specification.","follow":[{"q":"What stops a device from forging a Translated address to any physical page?","a":"Nothing in the request itself. The IOMMU only accepts translated requests from devices with ATS enabled, so treat ATS-capable devices as trusted, and use ACS Translation Blocking where you do not."},{"q":"Where does the ATC live and who sizes it?","a":"In the endpoint, and it is an implementation choice. The ATS capability advertises properties such as the invalidate queue depth, and software programs the Smallest Translation Unit and ATS Enable in the ATS Control register."}],"mod":13},{"id":"13.10","level":"Intermediate","type":"Concept","fig":null,"tags":["pasid","svm","prefix","iommu"],"q":"What is PASID and how does it relate to shared virtual memory?","short":"PASID (Process Address Space ID) is a 20-bit value carried in an End-to-End TLP prefix. The IOMMU uses the requester ID plus the PASID to select a per-process address space, so a device can DMA using the same virtual addresses as a user process, which is shared virtual memory. It is usually combined with ATS and PRI. NVMe SSDs rarely use it, but accelerators and some future storage devices do.","deep":"- **Prefix:** the PASID prefix carries the ID and flag bits such as Execute Requested and Privileged Mode Requested.\n- **IOMMU side:** Intel scalable mode has PASID tables, AMD-Vi uses a guest CR3 table, and Arm uses a substream ID for the same job.\n- **SVA flow:** the driver binds a process to the device, obtaining a PASID. The device DMAs with process virtual addresses. Missing pages are faulted in through PRI, so nothing has to be pinned.\n- **Requirements:** the function needs the PASID capability and must have it enabled, and every switch and the root complex on the path must pass End-to-End TLP prefixes. If a component blocks prefixes, AER logs a TLP Prefix Blocked error.\n- **Flit mode:** the prefix encoding changes in FLIT mode.","pitfall":"Treating PASID as something the PCIe fabric interprets. Only the IOMMU gives it meaning, and switches just forward the prefix.","verify":"PASID prefix bit layout, capability fields (Max PASID Width), the E-E prefix limits, encoding in FLIT mode, and whether the NVMe Base Specification defines any PASID usage.","follow":[{"q":"How is PASID different from a requester ID?","a":"The requester ID says which function is asking. The PASID says which address space inside that function, so one function can serve many processes."},{"q":"Is PASID needed for ATS?","a":"No. ATS works with untranslated requests alone. PASID adds a per-process dimension."}],"mod":13},{"id":"13.11","level":"Advanced","type":"Debug","fig":null,"tags":["ats","invalidation","timeout","atc","stale-translation"],"q":"The IOMMU reports an ATS invalidation timeout for an SSD. What is going on, and how do you debug it?","short":"The IOMMU sent an Invalidate Request and did not get the Invalidate Completion in time, so it cannot know whether the device still holds a stale translation. Likely causes: the device is hung or resetting, the link is down, the upstream path is blocked so the completion message is stuck, or the ATC logic has a bug. The IOMMU logs an invalidation time-out (Intel: ITE), and the OS may stall or reset the device.","deep":"1. **Evidence:** dmesg lines from the IOMMU driver around the time of the timeout, whether the timeouts repeat, and whether the driver reset the device afterwards.\n2. **Is the device alive:** read Vendor ID and CSTS, and check link state. A hung controller or a link that went down cannot answer.\n3. **Is the response path blocked:** the completion is a message that travels upstream with posted-write ordering, and the device must not send it before earlier requests that used the entry have been sent. Any posted credit starvation, stuck upstream queue or heavy P2P congestion delays it. Check flow control state and upstream traffic.\n4. **Device firmware:** handling with a full invalidate queue, range decoding (the size field encodes how many pages), global versus non-global invalidates, and several outstanding invalidations at once.\n5. **The worse failure is silent:** the device answers but leaves a stale entry. Later Translated DMA goes to a freed and reused physical page, and no IOMMU fault appears. Test for it by unmapping and overwriting the page with a canary, then checking that no device write lands after the completion.\n6. **Isolate:** turn ATS off (`pci=noats` or the IOMMU option) and see whether the symptom vanishes. Then narrow to a command mix or a size pattern.\n- **Recovery rule:** while the device may still hold the translation, the page cannot safely be reused. The safe response is to reset the device so its ATC is cleared.","pitfall":"Chasing the timeout and missing the stale-translation case, which produces no error at all.","verify":"The invalidation completion time limit in the ATS section, the VT-d fault status bits for invalidation errors (ITE, ICE, IQE), and the Linux message text.","follow":[{"q":"Does a timeout imply the link is broken?","a":"No. It is often the device side. Rule out link-down and credit stalls first, then read the firmware state."},{"q":"Why can the IOMMU not just continue after the timeout?","a":"Because reuse of the page while the device may still write to it risks memory corruption. The system must isolate or reset the device."}],"mod":13},{"id":"13.12","level":"Advanced","type":"Concept","fig":null,"tags":["acs","isolation","p2p","redirect","iommu-groups"],"q":"What is ACS, what does each control do, and why does it matter for isolation and for peer-to-peer?","short":"Access Control Services sits in switch downstream ports, root ports and multi-function endpoints. Source Validation checks requester IDs, Translation Blocking blocks Translated requests, P2P Request and Completion Redirect send peer traffic upstream to the root complex, Upstream Forwarding and Egress Control tighten routing further, and Direct Translated P2P lets ATS-translated P2P go direct. Redirect forces DMA through the IOMMU, which isolates, but it blocks or slows P2P.","deep":"| ACS control | Effect |\n|---|---|\n| Source Validation | Drop requests whose requester ID is outside the bus range below that port (blocks spoofing) |\n| Translation Blocking | Block requests with the AT field set to Translated |\n| P2P Request Redirect | Route peer requests upstream instead of across the switch |\n| P2P Completion Redirect | Same for completions |\n| Upstream Forwarding | Forward eligible requests and completions upstream instead of routing them locally, used alongside the redirect bits |\n| P2P Egress Control | Per-port allow list for peer traffic |\n| Direct Translated P2P | Let Translated P2P bypass the redirect and go across directly |\n\n- **Why isolation needs it:** without ACS, two devices behind a switch can DMA to each other directly and the IOMMU never sees it. Linux therefore forms IOMMU groups from the ACS isolation of the path, and VFIO can only hand a whole group to a guest.\n- **Cost:** with redirect on, all P2P crosses the root port and root complex, sharing the uplink and depending on the platform's P2P support. Some root complexes drop or reject P2P requests, so P2P fails outright.\n- **Middle way:** ATS plus Direct Translated P2P. The IOMMU approves the translation, and the switch then forwards the translated request directly.\n- **On Linux:** `lspci -vvv | grep -E 'ACSCap|ACSCtl'` shows the state, for example `ACSCtl: SrcValid+ TransBlk- ReqRedir+ CmpltRedir+ UpstreamFwd+ EgressCtrl- DirectTrans-`. Kernel options such as `pci=disable_acs_redir=` can turn redirect off for chosen devices, at the cost of isolation.\n- **Multi-function devices:** ACS at function level controls whether functions of one device can reach each other. Without it, all functions land in one IOMMU group.","pitfall":"Turning ACS off for GPUDirect or P2P performance and forgetting that it removes isolation between the endpoints.","verify":"The full list and bit layout of ACS Capability and Control including the newer enhanced controls, and the kernel parameters for ACS handling.","follow":[{"q":"Which control alone breaks P2P through a switch?","a":"P2P Request Redirect on the downstream ports. Requests go upstream, and if the root complex does not forward them the transfer fails. Source Validation alone does not."},{"q":"Why do multi-PF or SR-IOV SSDs care?","a":"VFs need separate IOMMU groups to be assigned to separate VMs. If the device or path does not provide ACS, the group is bigger than the VF."}],"mod":13},{"id":"13.13","level":"Advanced","type":"Cross-layer","fig":null,"tags":["p2p","p2pdma","cmb","gpudirect","nvme","topology"],"q":"How does peer-to-peer DMA between an NVMe SSD and a GPU or NIC work, and what topology conditions make it work or fail?","short":"One endpoint reads or writes another endpoint's BAR directly. An SSD writes read data into GPU memory (GPUDirect Storage), or a NIC writes into an SSD's Controller Memory Buffer (CMB). Behind one switch the TLPs turn around in the switch and never touch the root complex. It needs a target memory in a BAR, bus addresses rather than host DRAM addresses, no ACS redirect on the path (or ATS with Direct Translated P2P), and a platform and driver that allow it.","deep":"- **CMB as target:** the NVMe Controller Memory Buffer exposes memory in a BAR, described by CMBLOC and CMBSZ. It can hold queues, PRP lists and data depending on the support bits. Linux registers a CMB that supports data as P2P memory when `CONFIG_PCI_P2PDMA` is on, and NVMe-oF targets can use it.\n- **GPUDirect Storage:** the NVIDIA cuFile path maps GPU memory so the SSD DMAs to it directly. If P2P is not possible it falls back to a bounce through host memory.\n- **Topology conditions:**\n  - Same switch is best. TLPs never leave it.\n  - Different root ports of one root complex works only if the platform forwards P2P between them. Linux keeps an allow list of known-good host bridges.\n  - Across sockets is usually slow or unsupported.\n  - ACS redirect on any switch port on the path forces traffic through the root complex. Check for it.\n  - The target BAR must be large enough and 64-bit, which is where Resizable BAR and Above 4G Decoding come in.\n  - The path runs at the slowest link, and the smallest MPS on it applies.\n- **Reads versus writes:** the SSD to GPU direction is posted writes that stream freely. The GPU to SSD direction needs non-posted reads to the GPU BAR, limited by outstanding tags and by how fast the GPU serves BAR reads, so it is often slower.\n- **With an IOMMU on:** the kernel maps peer BAR addresses for the initiator, or the traffic is redirected upstream and translated. Both need validating.","pitfall":"Assuming \"P2P enabled\" means the traffic stays under the switch. Check the routing before trusting a benchmark.","verify":"CMBSZ support bits, the Linux P2PDMA allow list and mapping behavior, and NVIDIA's GPUDirect Storage platform requirements.","follow":[{"q":"Why use a CMB as a P2P target?","a":"The NIC can write payload into SSD memory and the SSD can consume it with no host DRAM copy. CMB size and bandwidth limit it, and its contents are volatile unless backed by persistent memory."},{"q":"What errors appear if the target BAR is disabled or the address is wrong?","a":"The initiator gets UR or Completer Abort completions for reads, and posted writes are dropped, with any logging depending on the target."}],"mod":13},{"id":"13.14","level":"Principal","type":"Debug","fig":null,"tags":["p2p","acs","bounce","root-complex","throughput","triage"],"q":"A P2P transfer between an SSD and a GPU is correct but very slow. How do you prove it is bouncing through the root complex, and what do you do about it?","short":"A slow but correct P2P transfer is usually not staying local. ACS redirect or a common ancestor at the root complex pushes each TLP up to the root port and back. Prove it with the topology (lowest common ancestor of the two endpoints), the ACS state on each port between them, and traffic counters or an analyzer on the uplink. Then clear redirect (or use ATS with Direct Translated P2P), move the devices under one switch, or accept a host-memory bounce.","deep":"1. **Topology:** `lspci -tv` and identify the lowest common ancestor. If it is a root port or the root complex, the TLPs must cross it. Repeat for each candidate slot.\n2. **ACS state:** `lspci -vvv` on every port between the endpoints. Redirect bits set on a downstream port mean peer TLPs are sent upstream. On Linux, ACS is typically enabled when an IOMMU driver is active, so IOMMU on versus off can change P2P behavior.\n3. **Where the bytes go:** switch port counters or an analyzer on the uplink. If the transfer rate shows up on the uplink port in both directions, it bounces. If the uplink is quiet and the switch downstream ports carry the traffic, it is local.\n4. **Read versus write asymmetry:** if writes to the GPU are fast but reads from it are slow, look at outstanding non-posted reads (tags and MRRS at the SSD) and the read completion size the GPU returns. Bandwidth is roughly bytes in flight divided by round-trip time (see the outstanding-reads question in module 1).\n5. **The slowest link rule:** a Gen3 x8 leg or a downtrained link caps the path. Check the link state of every hop.\n6. **Fix options, cheapest first:** move the devices to slots under one switch; clear redirect bits for those ports only; ATS plus Direct Translated P2P; or accept the copy through DRAM and size the system for it.\n7. **Verify the fix:** repeat the measurement and show the uplink counters go quiet, and re-run the isolation tests because clearing redirect weakens them.","pitfall":"Tuning the endpoints when the routing is the problem. Look at the path before the devices.","verify":"Which switch vendor tools expose per-port byte counters on your hardware, and how your kernel handles ACS enablement with the IOMMU active.","follow":[{"q":"Would disabling the IOMMU fix it?","a":"Often yes, because the OS then leaves ACS redirect off. It removes DMA isolation, so it is a diagnostic step, not a fix for a multi-tenant host."},{"q":"Bandwidth is fine at large transfers but poor at small ones. Why?","a":"Per-TLP costs on a redirected path (IOMMU lookups, root complex handling) dominate small transfers, and fewer bytes are in flight per round trip."}],"mod":13},{"id":"13.15","level":"Intermediate","type":"Concept","fig":null,"tags":["resizable-bar","tph","atomicops","ptm","capabilities"],"q":"What do Resizable BAR, TPH, AtomicOps and PTM each do, and what must the path support?","short":"Resizable BAR lets software pick a BAR size from a menu the device advertises, so a large memory window such as a GPU frame buffer or CMB can be mapped whole. TPH adds processing hints and steering tags to TLPs so writes can be steered to a particular CPU cache. AtomicOps are non-posted read-modify-write TLPs (FetchAdd, Swap, CAS) that need a capable requester, a capable completer and a route through every hop. PTM lets devices synchronize their clocks to a PTM root.","deep":"- **Resizable BAR:** the capability lists supported sizes per BAR as a bitmap, and a control field holds the chosen size. Firmware or the OS sets it before assigning addresses, and it needs a 64-bit prefetchable BAR and Above 4G Decoding. Linux exposes `resource0_resize` in sysfs. For SSDs it matters for large CMB or PMR BARs.\n- **TPH:** a TH bit in the header, a 2-bit Processing Hint and an 8-bit Steering Tag (with an extended 16-bit form). Steering tags are looked up from a table in the TPH capability or in the MSI-X table. NVMe does not itself define how tags are chosen, so any use is vendor and platform specific.\n- **AtomicOps:** Device Capabilities 2 reports AtomicOp Routing Supported and the completer support for 32-bit, 64-bit and 128-bit CAS. Device Control 2 holds AtomicOp Requester Enable and AtomicOp Egress Blocking. Software should enable the requester only if the route supports it. A component that cannot handle it returns UR or blocks the TLP. NVMe's host interface does not use atomics, but GPUs and accelerators do.\n- **PTM:** Request and Response messages give a device the master time from a PTM root with nanosecond-scale resolution, useful for correlating traces and for time-sensitive systems. Every hop needs PTM support.","pitfall":"Enabling AtomicOp Requester because the endpoint supports it, without checking that the whole path can route and complete atomics.","verify":"ReBAR size encoding (a size code of 0 means 1 MB), TPH mode names and tag widths, AtomicOp operand sizes, and PTM role definitions.","follow":[{"q":"An AtomicOp requester behind a switch gets UR. What is the cause?","a":"A switch port lacks AtomicOp routing or has egress blocking set, or the completer does not support that operand size. Check Device Capabilities 2 and Device Control 2 at every hop."},{"q":"Does Resizable BAR give a device more memory?","a":"No. It changes how much the CPU can map at once. Without it, a driver may have to window into a large device memory through a small BAR."}],"mod":13},{"id":"13.16","level":"Principal","type":"Scenario","fig":null,"tags":["multi-tenant","isolation","sriov","nvme","qos","flr","validation"],"q":"You are validating a multi-VF NVMe SSD sold for multi-tenant hosts. How do you prove tenant isolation?","short":"Treat every VF as hostile and test five planes with negative tests, not just \"each VF works\": address isolation (per-VF IOMMU domain, no peer DMA, correct requester ID), resource isolation (private queues, interrupts and namespaces, admin commands PF-only), performance isolation (a noisy VF cannot wreck neighbors' tail latency), fault and reset isolation (a VF's FLR, errors and crashes stay local, and no data leaks on reuse), and management isolation. Define pass criteria for each.","deep":"1. **Address:** from a guest with a userspace driver on the VF, program PRPs and SGLs outside its mappings. Expect faults attributed to that VF's requester ID and neighbor canary buffers unchanged. Check on an analyzer that every DMA TLP carries the VF's own routing ID, never the PF's. Confirm ACS blocks VF to VF peer traffic and that each VF lands in its own IOMMU group.\n2. **Register and MMIO:** each VF BAR reaches only its own registers. Test doorbell offsets beyond the queue count, and writes across the VF BAR page boundary. Confirm MSI-X vectors cannot target another VF's addresses, with interrupt remapping on.\n3. **Resource:** namespaces attached to one VF must not appear in another's Identify. Format, firmware, security and other PF-only commands from a VF must be rejected. Over-allocation of queues and vectors must fail cleanly.\n4. **Performance:** run a noisy VF (large writes, garbage collection pressure) beside a latency-sensitive VF (4 KiB reads at low queue depth). Measure the victim's p99 and p99.9 against a solo baseline. Repeat with media partitioning features such as NVM Sets or Endurance Groups if the device offers them.\n5. **Fault and reset:** FLR one VF under neighbor load and record the neighbor's latency blip and the FLR time (the spec expects FLR to finish within a bounded time). After FLR or reassignment, check no old queue memory, CMB content or namespace data is visible. Malformed commands from one VF must not hang the controller. Disabling VFs or resetting the PF with VMs running must give defined behavior and no hangs.\n6. **Evidence and criteria:** zero cross-VF reads or writes, latency inflation under an agreed bound (for example p99 within 1.5x of solo), no controller resets, and every fault attributed to the offending VF.","pitfall":"Testing only that each VF works. Isolation is proved by negative tests, and the noisy neighbor case belongs in the plan from the start.","verify":"The FLR completion time bound in the Base Specification, which NVMe isolation features (NVM Sets, Endurance Groups, Predictable Latency) apply to VFs on the product, and IOMMU group behavior for your platform.","follow":[{"q":"How do you show a VF cannot DMA into another VF's memory?","a":"Fill the neighbor's buffers with a canary pattern, drive malicious PRPs from the first VF, and show dmesg faults with its requester ID and no canary changes."},{"q":"The firmware uses the PF's requester ID for VF DMA as a shortcut. What breaks?","a":"The IOMMU applies the PF's domain, so a VF's DMA can reach memory it should not, and per-VF faults and ACS checks become meaningless. Catch it by checking the requester ID on every DMA TLP."}],"mod":13},{"id":"13.17","level":"Principal","type":"Cross-layer","fig":null,"tags":["ats","iommu","validation","invalidation","race","pri","methodology"],"q":"How would you validate an SSD's behavior under IOMMU with ATS, including translated and untranslated mixes, invalidation races and page faults?","short":"Build a matrix over address mode (untranslated, translated, mixed), page size, invalidation timing and command type, then attack the races: invalidation during in-flight DMA, invalidation storms, and reset with translations outstanding. Use a controllable host mapper, a virtual IOMMU for coverage, real hardware for performance, and an analyzer for the AT field and message ordering. Pass means no faults, no writes to freed pages, bounded invalidation latency and no throughput loss.","deep":"- **Dimensions:**\n  - Address mode: untranslated only, translated only, mixed on the same queue.\n  - Page size: 4 KB, 2 MB and 1 GB mappings, and the size encoding of translated ranges.\n  - Commands: PRP and SGL, PRP lists crossing pages, metadata, read and write, and admin commands.\n  - Invalidation: idle, mid-command, storms, overlapping ranges, full invalidate queue, invalidation of a range partly in use.\n  - Page faults through PRI if the device supports it.\n  - Lifecycle: FLR, CC.EN reset, link retrain and hot removal with translations and invalidations pending.\n- **The key race:** the device must not use an entry after it has sent the Invalidate Completion, and must not send the completion before earlier requests using the entry have been issued. Test: unmap a page while DMAs to it are in flight, immediately overwrite or remap it with a canary, and detect any device write that lands after the completion.\n- **Harness:** a kernel module or userspace VFIO test that maps and unmaps at controlled instants, a virtual IOMMU with ATS for logic coverage, and hardware for timing. IOMMU trace events give the host view and an analyzer gives the wire view.\n- **Wire checks:** the AT field is correct on each request, Translated requests only follow a successful translation, writes are not sent when the translation lacks write permission, and the Invalidate Completion carries the right routing.\n- **Performance:** ATC hit rate, Translation Request latency, IOPS with ATS on versus off, and IOMMU counters.\n- **Criteria:** zero device-attributed faults, zero canary corruption, invalidation completion within the limit under storm, and IOPS at least equal to the untranslated case.","pitfall":"Testing ATS only in steady state. The bugs are in races and lifecycle events.","verify":"ATS and PRI message ordering rules and time limits, QEMU virtual IOMMU options for ATS, and the exact IOMMU trace events on your kernel.","follow":[{"q":"Which findings are typically device firmware bugs?","a":"Stale entries after a partial-range invalidate, completion sent before earlier requests drained, translation reuse across FLR, and misdecoded translation size."},{"q":"How would you cover the page fault path if the device has no PRI?","a":"You do not, but you cover the OS-side equivalent: pinned buffers and prove the device never touches a page outside them."}],"mod":13},{"id":"14.01","level":"Intermediate","type":"Concept","fig":null,"tags":["gen5","ssd","thermal","retimer","connector","margining"],"q":"What changes for an SSD design and validation team when moving from Gen4 to Gen5?","short":"The protocol is the same but the physics and the product are not. Gen5 runs 32 GT/s NRZ on a tighter loss budget, so many slots and backplanes need retimers. Controllers and NAND run hotter, so thermal throttling becomes a first-order performance limit. Connectors, cables and form factors are chosen for signal integrity, and equalization results and lane margin become ship gates rather than nice-to-haves.","deep":"The channel physics is covered in the electricals module (Nyquist 16 GHz, 36 dB budget). This question is about what it does to an SSD program.\n- **Ceiling:** a Gen5 x4 link carries about 15.75 GB/s after 128b/130b and about 14 GB/s of payload (see the numeric question later in this module). Enterprise Gen5 drives quote sequential reads near that, so link efficiency and platform overhead now matter as much as NAND and controller speed.\n- **Power and thermals:** a Gen5 controller pushing full rate dissipates noticeably more than a Gen4 one, and the drive throttles when the controller or NAND reaches its limit. Validate at thermal steady state with airflow representative of the chassis. Link error rates also climb with temperature, so run margining hot, not just at room temperature.\n- **Topology:** longer paths (riser, cable, backplane) usually add a retimer, which adds latency, a power cost, another LTSSM segment, and firmware and preset tuning. Every retimer becomes a new variable in the regression matrix.\n- **Connectors and form factors:** edge connectors, M.2 sockets and cable assemblies vary in loss, so the same drive can pass in one enclosure and fail in another. EDSFF E1.S and E3.S and cabled U.2/U.3 backplanes are common Gen5 choices.\n- **Validation shift:** per-lane margin and the equalization status bits move from a debug aid to a tracked metric, precoding negotiation is part of link bring-up, and the test matrix includes Gen5 devices in Gen4 and Gen3 slots.","pitfall":"Validating Gen5 only on a short evaluation board. System channels, retimers and thermals are where Gen5 fails.","verify":"Retimer latency and power figures, connector ratings, and thermal budgets against your platform and the current EDSFF and form-factor specifications.","follow":[{"q":"A Gen5 SSD in a Gen4-only slot?","a":"It trains at Gen4, capped near 7 GB/s. Test all speed pairs, not just the top one."},{"q":"Which new number should every Gen5 test record?","a":"Margin per lane at the trained speed, with temperature, not just link-up pass or fail."}],"mod":14},{"id":"14.02","level":"Basic","type":"Concept","fig":null,"tags":["gen6","pam4","fber","fec","gray","precoding"],"q":"Restate Gen6 PAM4 as system consequences: why is FEC mandatory, and what do Gray coding and precoding do?","short":"PAM4 gives four voltage levels at 32 GBaud, so the raw first-bit error rate (FBER) is targeted at about 1e-6 instead of NRZ's 1e-12. That is about a million times more raw errors, so Gen6 corrects most of them with forward error correction and catches the rest with a flit CRC and replay. Gray coding makes the likeliest slicer mistake a one-bit error, and precoding keeps DFE error bursts short so FEC can correct them.","deep":"- **Scale of the raw error rate:** a x4 link at 64 GT/s moves 256 Gb/s per direction. At FBER 1e-6 that is about 256,000 raw bit errors per second per direction, all being corrected without software noticing.\n- **Gray coding:** the four levels map to 00, 01, 11, 10, so adjacent levels differ by one bit. The most likely error, landing in a neighboring level, costs one bit instead of two.\n- **Precoding:** a DFE turns one wrong decision into a burst. Precoding (the previous electricals module covers the mechanism) shortens that burst so it fits within what a small FEC can correct.\n- **System consequences:**\n  - The link has no \"error-free\" state any more, so \"no replays\" is no longer a health signal by itself.\n  - Health has to be judged from FBER, corrected-error rates and flit retry rates, when the device or analyzer exposes them.\n  - The unit of error control becomes a fixed block (the flit), which is the reason FLIT mode exists.\n  - Electrical tests move to PAM4 metrics such as three separate eye heights, level mismatch and SNR-like measures.\n- **Same Nyquist, less SNR:** the electrical cost is the roughly 9.5 dB SNR loss described in the earlier Gen6 questions.","pitfall":"Comparing Gen6's FBER of about 1e-6 with Gen5's 1e-12 as if they were the same metric. Gen6's is a raw rate that FEC and CRC then clean up, while Gen5's is the rate the link has to live with.","verify":"The FBER target and how it is defined, the Gray mapping, and the precoder details in the Base Specification.","follow":[{"q":"Is FBER measured after equalization?","a":"It is the error rate at the receiver's decision point before FEC, after the receiver's equalization has done its work."},{"q":"Why still need a CRC after FEC?","a":"The lightweight FEC corrects a limited number of byte errors per group. Larger or unlucky bursts get past it, and the CRC detects them so the flit is replayed."}],"mod":14},{"id":"14.03","level":"Intermediate","type":"Concept","fig":"flit","tags":["flit","256-byte","fec","crc","dlp"],"q":"What does a 256-byte FLIT contain, and how does it compare with non-FLIT framing?","short":"In FLIT mode all traffic moves in fixed 256-byte flits: 236 bytes of TLP area, 6 bytes of Data Link Payload (DLP), 8 bytes of CRC and 6 bytes of FEC. The CRC covers the first 242 bytes, and the FEC is three interleaved groups that protect the whole flit including the CRC. Non-FLIT mode instead frames each TLP separately with a start token, a sequence number and an LCRC.","deep":"| Bytes | Field | Notes |\n|---|---|---|\n| 0 to 235 | TLP area (236 B) | TLP bytes packed back to back, or unused in a NOP flit |\n| 236 to 241 | DLP (6 B) | Flit sequence, ack/nak and replay command, and link-management content |\n| 242 to 249 | CRC (8 B) | Over the TLP area and the DLP |\n| 250 to 255 | FEC (6 B) | Three groups of 2 bytes, over everything before them |\n\n- **Overhead:** 20 of 256 bytes, or 7.8 percent. The FEC is 6 B (2.3 percent), the CRC 8 B (3.1 percent) and the DLP 6 B (2.3 percent), leaving 236 B, 92.2 percent, for TLPs.\n- **Interleave:** consecutive bytes belong to different FEC groups, so a burst of up to three consecutive bytes touches each group once and stays correctable. Each group can fix a single byte error.\n- **What the CRC and FEC do:** the FEC tries to correct first, then the CRC decides whether the (possibly corrected) flit is good. A bad CRC triggers a Nak and replay.\n- **NOP flits:** when there are no TLPs the link still sends flits with an empty TLP area, so the DLP information (acks, credits, power management) keeps flowing.\n- **Contrast with non-FLIT:** each TLP carries a framing token, a 12-bit sequence number and a 32-bit LCRC, and DLLPs are separate 6-byte packets with their own CRC-16.","pitfall":"Treating the 256 bytes as payload. Only 236 bytes hold TLPs, and headers come out of that budget.","verify":"The exact byte positions, the FEC group layout and interleave, which DLP bytes carry what, and whether TLPs may straddle flit boundaries, all in the Base Specification. The 236 + 6 + 8 + 6 split matches published PCI-SIG material, but confirm before quoting.","follow":[{"q":"Can a TLP span two flits?","a":"Yes. TLP bytes fill the 236-byte area back to back, so a TLP can start in one flit and finish in the next."},{"q":"Does the CRC cover the FEC bytes?","a":"No. The CRC covers the TLP area and the DLP, and the FEC covers those plus the CRC."}],"mod":14},{"id":"14.04","level":"Advanced","type":"Concept","fig":null,"tags":["flit","framing","lcrc","sequence-number","dllp","encoding"],"q":"Why does FLIT mode replace the 128b/130b framing and the per-TLP LCRC and sequence numbers?","short":"With FEC, errors are handled in fixed-size blocks, so the natural unit for detection and retry is the flit and not the TLP. FLIT mode therefore drops the per-TLP framing tokens (at 64 GT/s there is also no 128b/130b sync header), and replaces the per-TLP sequence number and LCRC with a flit sequence number and one CRC per flit. That saves about 10 bytes per TLP and makes the pipeline deterministic, at the price of a fixed 20 bytes of overhead per flit.","deep":"| Function | Non-FLIT (Gen3 to Gen5) | FLIT mode |\n|---|---|---|\n| Framing | 128b/130b sync header plus STP/SDP/EDS tokens (END belongs to 8b/10b) | Implied by the flit position |\n| Per-TLP integrity | 32-bit LCRC each TLP | 8-byte CRC per flit |\n| Ordering and replay | 12-bit sequence number per TLP | Flit sequence number, about 10 bits |\n| Acknowledgement | Ack and Nak DLLPs, cumulative | Ack and Nak carried in the DLP of each flit |\n| Link-management packets | 6-byte DLLPs with CRC-16 | Carried in DLP bytes and flit types |\n| Error correction | None | 6 bytes of FEC |\n\n- **Why a fixed block:** FEC needs a fixed codeword. Making the CRC and the retry unit the same block makes the decode pipeline simple and its latency constant.\n- **Why per-TLP overhead hurts at 64 GT/s:** a x16 link moves about 500 million flits per second, and TLPs of a few tens of bytes would need per-TLP framing, sequence numbers and CRC checks at that rate. One flit-level check is cheaper.\n- **What stays:** the Transaction Layer's TLPs, flow control (carried differently), and the enumeration and config model. NVMe over a flit-mode link needs no software change.\n- **Other consequences:** L0s is not supported in flit mode per current understanding (L0p covers its purpose; confirm in the spec), and the Bad TLP style counters change meaning because there is no per-TLP LCRC. A validator needs to learn the new logging capabilities.\n- **Debug consequence:** analyzers that decode TLPs from 128b/130b framing cannot decode flit-mode traffic. A flit-aware analyzer is needed.","pitfall":"Looking for Bad TLP and LCRC counters on a flit-mode link. They may not exist in the same form.","verify":"The flit sequence number width, L0s support in flit mode, the flow control mechanism in flit mode, and the error logging capabilities added for flit mode.","follow":[{"q":"Do lower speeds use flits too?","a":"Once flit mode is negotiated, the link stays in it, including at lower speeds, according to the negotiation rules. Confirm how the encoding at each rate works in the spec."},{"q":"Where did the LCRC's job go?","a":"Detection is the flit CRC, and correction or retry is FEC plus flit replay."}],"mod":14},{"id":"14.05","level":"Advanced","type":"Concept","fig":null,"tags":["flit","ack-nak","replay","selective-nak","retry-buffer"],"q":"How do ACK, NAK and replay work at the flit level?","short":"Flits are numbered (mostly implicitly, with explicit numbers in some flits such as the first replayed one) and each DLP carries acknowledgement information. The receiver applies FEC, checks the CRC and accepts good flits in order. A bad flit is dropped and a Nak names the last good one, so the transmitter replays from there (go-back-N). PCIe 6.x also defines a selective Nak. Replay is rare, with a retry probability around 5e-6 per flit at the FBER target.","deep":"1. The transmitter sends flits and keeps flits with payload in a retry buffer until they are acknowledged.\n2. The receiver runs FEC, then checks the CRC. Good: accept, advance the expected sequence, and later acknowledge via the DLP.\n3. Bad: discard, and send a Nak for the last good sequence number.\n4. On a Nak, the transmitter replays in order. The replayed flits are marked with a replay command in the DLP, and the first replayed flit carries its explicit sequence number.\n5. With selective Nak, the transmitter resends the damaged flit and the receiver keeps later good flits in a buffer, so less bandwidth is wasted on a single error.\n6. Timers (replay timer and replay count) cover a lost Nak or Ack, similar in spirit to the non-FLIT DLL.\n\n- **Retry buffer sizing:** the buffer must cover a round trip of flits. A x4 Gen6 link is 32 GB/s, so a 1 microsecond round trip is 32 KB, or 125 flits. Compare about 7.9 KB for Gen4 x4 in the Data Link module. Retimers and long channels add to this.\n- **How rare is replay:** a flit has 2048 bits, so at FBER 1e-6 about 2.05e-3 of flits contain at least one bit error, about 1 in 490. FEC corrects nearly all of them, leaving about 5e-6 needing replay, roughly 400 times fewer. At 125 million flits per second on x4, that is about 625 replays per second at the worst target and a bandwidth loss of about 5e-6 x 125 = 0.06 percent.\n- **Difference from non-FLIT:** the unit is the flit, not a TLP. A partially received TLP is discarded with its flit.","pitfall":"Assuming selective Nak means no go-back-N at all. Both exist, and behavior depends on what each side implements.","verify":"Sequence number width and where it sits in the DLP, the replay command encodings, selective Nak support requirements, the retry probability figure, and the timers.","follow":[{"q":"Why is replay probability so much lower than the raw flit error probability?","a":"FEC repairs most flits before the CRC check, so only uncorrectable patterns cause a Nak."},{"q":"What does a validator watch?","a":"Retry and Nak counts, FEC corrected counts when exposed, and replay timer events, converted to rates per flit."}],"mod":14},{"id":"14.06","level":"Advanced","type":"Numeric","fig":null,"tags":["bandwidth","gen5","gen6","flit","efficiency","x4"],"q":"Compare the effective payload bandwidth of a Gen5 x4 and a Gen6 x4 link with 256-byte payload TLPs.","short":"Gen5 x4 gives 15.75 GB/s after 128b/130b, and with 256 B payloads and 26 B of per-TLP overhead about 14.3 GB/s of payload. Gen6 x4 gives 32 GB/s raw, 29.5 GB/s of TLP area after flit overhead (236/256), and about 27.8 GB/s of payload. The ratio is about 1.94, not 2, and it moves with TLP size, being larger for small payloads.","deep":"Assumptions: x4, one direction, 256-byte payload, 16-byte TLP headers, no ECRC, no flow control or ack traffic counted, and flit-mode TLP headers the same size as non-FLIT ones.\n\n1. **Gen5 raw:** 32 GT/s x 4 lanes x 128/130 / 8 = 15.75 GB/s.\n2. **Gen5 per-TLP overhead:** 4 B framing token + 2 B sequence number + 16 B header + 4 B LCRC = 26 B. Efficiency = 256 / 282 = 90.8 percent.\n3. **Gen5 payload:** 15.75 x 0.908 = about 14.3 GB/s.\n4. **Gen6 raw:** 64 GT/s x 4 / 8 = 32 GB/s (no line-code overhead at the PHY).\n5. **Flit efficiency:** 236 / 256 = 92.2 percent, so 29.5 GB/s of TLP bytes.\n6. **Gen6 per-TLP overhead:** the 16 B header only, since framing, sequence number and LCRC are gone. Efficiency = 256 / 272 = 94.1 percent.\n7. **Gen6 payload:** 29.5 x 0.941 = about 27.8 GB/s. Ratio = 27.8 / 14.3 = 1.94.\n\n| Payload | Gen5 x4 GB/s | Gen6 x4 GB/s | Ratio |\n|---|---|---|---|\n| 64 B | 11.2 | 23.6 | 2.11 |\n| 128 B | 13.1 | 26.2 | 2.00 |\n| 256 B | 14.3 | 27.8 | 1.94 |\n| 512 B | 15.0 | 28.6 | 1.91 |\n\n- **Why the ratio moves:** flit overhead is a fixed 7.8 percent, while non-FLIT overhead is a per-TLP cost of 10 bytes that hurts small TLPs most. Gen6 wins more than 2x for small payloads and less than 2x for large ones.\n- **Replay cost:** about 0.06 percent at the target retry rate (see the previous question), negligible.\n- **Real SSDs:** a Gen5 x4 drive around 14 GB/s is at the link limit, so a Gen6 x4 drive can aim for roughly 27 to 28 GB/s, before NAND, controller and host limits.","pitfall":"Doubling the Gen5 payload number and calling it Gen6. Flit overhead costs 7.8 percent, and the per-TLP savings only partly offset it.","verify":"Flit-mode TLP header sizes and any optional header extensions, and the exact overhead in the current Base Specification.","follow":[{"q":"How does a read-heavy workload change this?","a":"The data flows as completions from the SSD to the host, plus a stream of small read request TLPs the other way. Each direction has its own budget, so compute the data direction and check that the request direction has headroom."},{"q":"What if the flit-mode header is bigger than assumed?","a":"Use the real header size in step 6. With 20 B the Gen6 payload efficiency drops to 92.8 percent, and the payload figure to about 27.4 GB/s."}],"mod":14},{"id":"14.07","level":"Advanced","type":"Concept","fig":null,"tags":["flit","latency","fec","accumulation","replay","cxl"],"q":"What latency does FLIT mode add, and when does replay hurt?","short":"FLIT mode adds a fixed FEC and CRC decode time of a couple of nanoseconds, plus a flit accumulation delay because the receiver needs the whole flit before it can act: 2 ns on x16, 8 ns on x4 and 32 ns on x1 at 64 GT/s. Replay adds about a round trip but happens roughly once per 200,000 flits at the target. For NVMe, whose latencies are tens of microseconds, this is noise. For memory-semantic devices it matters.","deep":"- **Accumulation delay:** a flit is 2048 bits. At 64 GT/s, that takes 2048 / (64 x lanes) ns: 2 ns on x16, 4 ns on x8, 8 ns on x4, 16 ns on x2, 32 ns on x1. It is a per-hop, store-and-forward style cost, so it also applies at each switch and retimer hop.\n- **FEC and CRC decode:** on the order of 2 ns for the lightweight FEC, by design, plus the CRC check.\n- **Replay:** costs about one round trip (about 1 microsecond in the earlier model, less on a short channel) plus the queueing behind it. With a retry probability near 5e-6, a typical flow sees it once in about 200,000 flits, so the effect is on the latency tail more than the mean.\n- **Compared with non-FLIT:** the Gen5 receiver could start a TLP as soon as its bytes and LCRC were in. Gen6 waits for the flit, but Gen5 also waited for the LCRC. In return, tail effects from replays are rarer.\n- **Where it matters:**\n  - NVMe SSD I/O: a 4 KiB read takes tens of microseconds in the NAND, and tens of nanoseconds of link latency change nothing.\n  - CXL.mem style loads: a CPU waits on each miss, and a few nanoseconds per hop are visible. Newer CXL revisions define latency-optimized flit variants for this reason (check the current CXL specification).\n  - Tail latency: rare replays and L0p transitions show up at p99.9 and beyond.","pitfall":"Quoting the FEC decode time as the total added latency. Accumulation and any retimer hops matter as much.","verify":"The FEC and CRC latency numbers and how flit latency is defined for retimers and switches.","follow":[{"q":"Does a wider link help latency?","a":"Yes for the accumulation part: x16 accumulates a flit four times faster than x4."},{"q":"What would a latency validation measure?","a":"Round trip for small reads with FEC and CRC in play, compared with a non-FLIT link at Gen5, and the p99.9 while error injection is active."}],"mod":14},{"id":"14.08","level":"Advanced","type":"Concept","fig":null,"tags":["flit","negotiation","training","fallback","non-flit"],"q":"How is FLIT mode negotiated, and what happens when one partner does not support it?","short":"Flit mode support is advertised in the training sequences, and the mode is decided once, during the initial link training from Detect. If both ports support it, the link runs in flit mode and stays there across speed changes and Recovery until the link goes down. If either port lacks support, the link runs in non-FLIT mode. A port at 64 GT/s must use flit mode, so a Gen5 SSD in a Gen6 slot trains non-FLIT at 32 GT/s or below.","deep":"- **Decision point:** made during the first training, not at each speed change. A link that trained in flit mode at 32 GT/s stays in flit mode if it later moves to 64 GT/s or drops to a lower rate.\n- **Reset of the decision:** anything that takes the LTSSM back through Detect (link down, PERST#, a fresh training) allows a new decision.\n- **What software sees:** newer pciutils and the kernel report a flit-mode indication in the Link Status 2 area. Read it alongside speed and width.\n- **Fallback:** a non-FLIT partner produces a non-FLIT link at any speed up to 32 GT/s. There is no non-FLIT 64 GT/s.\n- **Mixed hierarchies:** a switch may run flit mode on one link and non-FLIT on another. The Transaction Layer bridges them, since TLPs are still TLPs.\n- **Validation matrix:** every combination of {flit, non-flit} x {each speed} x {each partner type}, plus speed changes in both directions after flit mode is entered, plus retimers in the path (they must not disturb the negotiation).\n- **Typical failure modes:** the platform expects flit but the link trains non-FLIT because of a setting or an old partner; the training sequence field is misparsed by a retimer or device; behavior after hot reset or PERST# differs from a cold boot.","pitfall":"Assuming the mode is re-evaluated after every speed change. It is negotiated once and sticks until the link goes down.","verify":"The training sequence fields and the training state where flit mode is negotiated, the Link Capabilities 2 and Link Status 2 bit names, the behavior at speeds below 64 GT/s, and which resets return the LTSSM through Detect.","follow":[{"q":"Can software force a link to non-FLIT?","a":"Not through a standard OS control. Some platform firmware offers a setting, and the Base Specification is the reference for what is allowed."},{"q":"Is 64 GT/s possible without flit mode?","a":"No. Flit mode is required at 64 GT/s."}],"mod":14},{"id":"14.09","level":"Intermediate","type":"Concept","fig":null,"tags":["l0p","power","partial-width","flit","aspm"],"q":"What is L0p, and how does it differ from L0s and L1?","short":"L0p is a flit-mode power state, introduced with PCIe 6.0, in which a link stays in L0 but runs on fewer lanes, for example x4 down to x1, with the idle lanes in electrical idle. It does not pass through Recovery, so it can be entered and left while traffic continues. The two ports negotiate it and it applies to both directions. It replaces the role L0s played, cheaply trading bandwidth for power at light load.","deep":"| State | What idles | Traffic | Exit |\n|---|---|---|---|\n| L0s | One direction, all lanes | None in that direction | FTS sequences, fast but link specific |\n| L1 | Both directions, all lanes | None | Through Recovery, microseconds to milliseconds |\n| L0p | Some lanes, both directions | Continues on the active lanes | Lanes retrain in the background, no Recovery |\n\n- **Mechanism at concept level:** the ports agree to change width using flit-level messages. Active lanes keep carrying flits while others go idle. To widen the link, the idle lanes are brought back and re-aligned before flits are striped across them again.\n- **Policy:** hardware or firmware watches link utilization and applies hysteresis. Software controls are defined in config space.\n- **Why not just L1:** L1 needs an idle link and a Recovery on exit. L0p gives savings at low but nonzero load without a stall.\n- **Validation:**\n  - Correctness across transitions: no lost or duplicated flits, no false errors, replay works during the change.\n  - Behavior when a burst arrives while narrowed: latency until the link widens and the throughput in the meantime.\n  - Interaction with L1, speed change, reset and error recovery.\n  - Power measurement at each width, and NVMe tail latency with L0p enabled against disabled.","pitfall":"Treating L0p as a lower-latency L1. It saves less power than L1 but avoids the exit penalty, and it narrows bandwidth while active.","verify":"Which widths are allowed, whether L0p is symmetric or can be per direction, the control and status register names, and how the LTSSM shows L0p.","follow":[{"q":"Does L0p change the link speed?","a":"No, only the width. Speed changes still go through Recovery."},{"q":"Does L0p need flit mode?","a":"Yes. It relies on the flit-level negotiation."}],"mod":14},{"id":"14.10","level":"Basic","type":"Concept","fig":null,"tags":["gen7","pcie7","128gt","roadmap"],"q":"What is PCIe 7.0 (Gen7), and what stays the same as Gen6?","short":"PCIe 7.0 doubles the rate again to 128 GT/s per lane, still PAM4 and still FLIT mode with FEC. PCI-SIG released the specification in June 2025, and a x16 link reaches about 512 GB/s bidirectional raw. Because the symbol rate doubles to 64 GBaud, the Nyquist frequency rises to 32 GHz, so channel loss and reach become hard again in a way Gen6 avoided. PCIe 8.0 at 256 GT/s was announced for around 2028.","deep":"| Gen | Rate | Modulation | Symbol rate | Nyquist | x4 raw per direction |\n|---|---|---|---|---|---|\n| 5 | 32 GT/s | NRZ | 32 GBaud | 16 GHz | 16 GB/s |\n| 6 | 64 GT/s | PAM4 | 32 GBaud | 16 GHz | 32 GB/s |\n| 7 | 128 GT/s | PAM4 | 64 GBaud | 32 GHz | 64 GB/s |\n\n- **Arithmetic:** x16 at 128 GT/s is 128 x 16 / 8 = 256 GB/s per direction, so 512 GB/s in both directions.\n- **What carries over:** PAM4, FLIT mode, FEC, and a FBER target of the same order as Gen6, which keeps the Gen6 protocol machinery useful.\n- **What changes:** the channel. Twice the Nyquist frequency means much more loss per inch, so expect shorter reach, more retimers, cables and optical or other alternatives to copper, and much harder signal-integrity validation.\n- **CXL:** CXL 3.x is built on PCIe 6.0, and CXL 4.0 (released November 2025) is built on PCIe 7.0 at 128 GT/s.\n- **For an SSD engineer:** Gen7 is not a product concern for storage yet, but the same three ideas (PAM4, FLIT, FEC) will determine validation for years, so master them at Gen6.","pitfall":"Extrapolating Gen6 conclusions to Gen7 electrically. The Nyquist frequency doubles, so the channel story is new.","verify":"PCIe 7.0 feature list beyond rate and PAM4, its FEC and flit details, and current product availability.","follow":[{"q":"Why does Gen7 stress channels more than Gen6 did?","a":"Gen6 kept the symbol rate and paid with SNR. Gen7 doubles the symbol rate as well, so loss at Nyquist grows a lot."},{"q":"Is Gen6 hardware available?","a":"Check current vendor announcements and platform availability. Mainstream storage deployments are still largely Gen4 and Gen5."}],"mod":14},{"id":"14.11","level":"Basic","type":"Concept","fig":null,"tags":["cxl","flex-bus","cxl-io","cxl-cache","cxl-mem","device-types"],"q":"What is CXL in the PCIe context, and what are its three protocols and device types?","short":"CXL runs over the PCIe physical layer, the same lanes and connectors
