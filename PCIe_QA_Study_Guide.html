var DATA={"modules":[{"id":1,"title":"Fundamentals, Topology & Bandwidth","desc":"Why PCIe exists, lanes and links, the RC/switch/endpoint tree, generations, encoding, and bandwidth math you can do on a whiteboard."},{"id":2,"title":"Layered Architecture","desc":"Transaction, Data Link and Physical layers, what each owns, end-to-end versus per-hop fields, and where each kind of error is detected."},{"id":3,"title":"Physical Layer & Electricals","desc":"Differential signaling, embedded clocks, scrambling, electrical idle, reference clocking, jitter, eye diagrams, PAM4 and lane margining."},{"id":4,"title":"LTSSM & Link Training","desc":"Every LTSSM state and sub-state, TS1/TS2 contents, Recovery, speed and width changes, timeouts, and how to triage link-up failures."},{"id":5,"title":"Equalization & Retimers","desc":"Why equalization exists, presets and coefficients, the four Gen3+ phases, status bits for debug, retimers versus redrivers."},{"id":6,"title":"Data Link Layer","desc":"Sequence numbers, LCRC, ACK/NAK, replay buffer and timers, DLLP formats, DL states and reading correctable-error counters."},{"id":7,"title":"TLP Anatomy & Transaction Types","desc":"Header fields, formats and types, addressing and routing, MPS/MRRS/RCB, completions and status, prefixes, atomics."},{"id":8,"title":"Flow Control & Ordering","desc":"Credits, InitFC/UpdateFC, virtual channels, the ordering table, relaxed and ID-based ordering, deadlock avoidance."},{"id":9,"title":"Config Space & Enumeration","desc":"Type 0/1 headers, BAR sizing, capability lists, ECAM, the enumeration algorithm and bus numbering."},{"id":10,"title":"Interrupts (INTx / MSI / MSI-X)","desc":"Legacy INTx emulation, MSI and MSI-X structures, vector tables, PBA, masking and affinity."},{"id":11,"title":"Power Management","desc":"D-states, L-states, ASPM, L1 substates, LTR, PME, and how NVMe power states interact with the link."},{"id":12,"title":"Errors, AER & DPC","desc":"Error classes, AER registers and header logs, completion timeouts, poisoned TLPs, containment and recovery."},{"id":13,"title":"Virtualization & I/O Services","desc":"SR-IOV, ATS/PRI/PASID, ACS, IOMMU interaction, peer-to-peer, TPH and AtomicOps."},{"id":14,"title":"Gen5/6, FLIT, CXL & Security","desc":"Precoding, PAM4, FLIT mode and FEC, L0p, CXL on the PCIe PHY, IDE and DOE/SPDM."},{"id":15,"title":"Resets, Hot-Plug & Form Factors","desc":"PERST#, hot reset, FLR, surprise removal, sideband signals, M.2, U.2/U.3, E1.S/E3.S, OCuLink."},{"id":16,"title":"NVMe over PCIe (Cross-layer)","desc":"BAR0 registers, doorbells, queues and PRP/SGL as TLPs, MSI-X per queue, CC.EN resets, CMB/PMR and P2P."},{"id":17,"title":"Debug, Analyzers & Compliance","desc":"Reading protocol-analyzer traces, link-up triage, lspci/setpci and Windows tooling, compliance, loopback, stress and error injection."},{"id":18,"title":"Scenarios & System Design","desc":"Open-ended validation-plan and root-cause questions that cross every layer, the way a Principal loop tests them."}],"questions":[{"id":"1.01","level":"Basic","type":"Concept","fig":null,"tags":["pci","history","serial"],"q":"Why did PCIe replace PCI and PCI-X, and what did it keep?","short":"PCI was a shared, parallel, clocked bus, so every device competed for the same wires and skew between the parallel lines capped the clock rate. PCIe uses dedicated serial point-to-point links with an embedded clock, full duplex, and packets, so bandwidth scales with lane count. It kept PCI's software model (config space, enumeration, BARs) so existing drivers and operating systems still work.","deep":"The limits of PCI and PCI-X were physical:\n- **Shared bus:** bandwidth is divided among all devices and each transfer needs arbitration.\n- **Parallel skew:** 32 or 64 data lines must be sampled against one clock, so timing margin collapses as the clock rises (PCI at 33/66 MHz, PCI-X at 133 MHz).\n- **Half duplex and sideband wires:** interrupts and control used dedicated pins.\n\nPCIe changed the physical layer completely but left the software contract intact:\n- Differential serial lanes, one transmit pair and one receive pair, clock recovered from the data.\n- Packets with addresses, credit-based flow control, and ACK/NAK reliability.\n- The first 256 bytes of config space, the Type 0/1 headers, BDF addressing, and BAR sizing behave as in PCI, so a PCI-aware OS enumerates a PCIe device without knowing it is PCIe.","pitfall":"Saying PCIe \"is not a bus.\" It is not a shared electrical bus, but software still sees a bus/device/function tree and address map exactly as it did with PCI.","verify":null,"follow":[{"q":"Why can't you just clock parallel PCI faster?","a":"Skew between the data lines and the load of a shared bus shrink the sampling window faster than the clock period. Serial links with clock recovery do not have a skew budget between lines, so they keep scaling."},{"q":"What did PCIe keep from PCI?","a":"Config space and enumeration, the memory and I/O address-map model, BARs, and the producer/consumer ordering idea, so drivers written for PCI mostly work."}],"mod":1},{"id":"1.02","level":"Basic","type":"Concept","fig":"lane","tags":["lane","link","width"],"q":"What is the difference between a lane, a link, and a port?","short":"A lane is one transmit differential pair plus one receive differential pair (four wires), so it moves data both ways at once. A link is 1, 2, 4, 8, or 16 lanes bonded between two ports, and a port is the interface at one end of a link. Link width is negotiated during link training.","deep":"- Defined widths are x1, x2, x4, x8, x12, x16 and x32; x12 and x32 are rarely built.\n- Data is byte-striped across the lanes at the Physical Layer and the receiver de-skews the lanes before reassembly. Each lane trains and can fail independently.\n- Slot size and link width are different things: an x4 card in an x16 slot runs x4, and an x16 slot wired for x8 only ever trains x8.\n- A port is an upstream port (facing the Root Complex) or a downstream port (facing away from it). Root ports and switch downstream ports are downstream ports.","pitfall":"Assuming the physical slot size tells you the electrical link width.","verify":null,"follow":[{"q":"How is a data stream spread across lanes?","a":"Consecutive bytes go to consecutive lanes (byte striping), and the receiver de-skews the lanes and reassembles the stream."},{"q":"What does an x2 SSD lose compared to x4?","a":"Half the peak sequential bandwidth. Latency is unchanged, so low-queue-depth random reads barely move."}],"mod":1},{"id":"1.03","level":"Basic","type":"Concept","fig":"topology","tags":["topology","rc","switch","endpoint"],"q":"Name the components of a PCIe system and draw the topology.","short":"The Root Complex connects the CPU and memory to the fabric through root ports. Switches fan one upstream port out to several downstream ports, endpoints are the leaf devices (SSD, NIC, GPU), and bridges connect to legacy PCI. The whole system is a tree, so every device has exactly one path to the Root Complex and routing is deterministic.","deep":"- **Root Complex:** logic that turns CPU loads and stores into TLPs and turns device DMA into memory accesses. It usually lives inside the CPU or SoC.\n- **Switch:** internally a set of virtual PCI-to-PCI bridges (one for the upstream port, one per downstream port), so software sees Type 1 headers.\n- **Endpoint:** a Type 0 function. PCIe endpoints versus legacy endpoints differ mainly in I/O space use and in required features.\n- **Bridge:** PCIe-to-PCI/PCI-X, or PCI-to-PCIe.\n- Multi-root sharing and non-transparent bridges deliberately break the single-tree assumption and are out of scope here.","pitfall":"Drawing endpoints on a shared bus. Every downstream port is its own point-to-point link.","verify":null,"follow":[{"q":"How does software see a switch?","a":"As a bridge tree: one Type 1 bridge for the upstream port and one for each downstream port."},{"q":"Can two endpoints talk directly?","a":"Yes, peer-to-peer through a switch if ACS allows it. Through the Root Complex only if the RC supports peer-to-peer routing."}],"mod":1},{"id":"1.04","level":"Basic","type":"Numeric","fig":"gens","tags":["generations","encoding","gts"],"q":"List the per-lane rate and encoding for each PCIe generation.","short":"Gen1 2.5, Gen2 5, Gen3 8, Gen4 16, Gen5 32, Gen6 64 GT/s per lane. Gen1 and Gen2 use 8b/10b (20% overhead), Gen3 to Gen5 use 128b/130b (about 1.5%), and Gen6 uses PAM4 signaling with FLIT framing and FEC. Each generation doubles the rate; Gen3 doubled usable bandwidth over Gen2 even though 8 GT/s is only 1.6 times 5 GT/s, because the encoding got cheaper.","deep":"| Gen | Rate (GT/s) | Encoding | Usable per lane, one direction |\n|---|---|---|---|\n| 1 | 2.5 | 8b/10b | 250 MB/s |\n| 2 | 5 | 8b/10b | 500 MB/s |\n| 3 | 8 | 128b/130b | 985 MB/s |\n| 4 | 16 | 128b/130b | 1.97 GB/s |\n| 5 | 32 | 128b/130b | 3.94 GB/s |\n| 6 | 64 | PAM4 + FLIT + FEC | about 7.4 GB/s (8 GB/s raw) |\n\nGen3 arithmetic: 5 GT/s x 0.8 = 4 Gb/s usable at Gen2, and 8 GT/s x 128/130 = 7.88 Gb/s usable at Gen3, which is 1.97 times as much. A Gen7 specification at 128 GT/s (PAM4) has also been published.","pitfall":"Treating GT/s as Gb/s of payload. GT/s counts raw line bits including encoding.","verify":"Confirm Gen6/Gen7 details and release status against the current PCI-SIG Base Specification revision.","follow":[{"q":"Why did Gen3 pick 8 GT/s instead of 10?","a":"With the cheaper 128b/130b encoding, 8 GT/s already doubled usable bandwidth and stayed within what mainstream board materials and connectors could support."},{"q":"Which generation first required receiver equalization?","a":"Gen3. Gen1 and Gen2 use fixed de-emphasis only."}],"mod":1},{"id":"1.05","level":"Basic","type":"Numeric","fig":null,"tags":["bandwidth","math"],"q":"How do you calculate the bandwidth of a Gen4 x4 link?","short":"Usable one-direction bandwidth is the per-lane rate times the lane count times the encoding efficiency, divided by 8. Gen4 x4 is 16 x 4 x (128/130) / 8 = 7.88 GB/s per direction. Gen3 x4 is 3.94 GB/s and Gen5 x4 is 15.75 GB/s. Double it only if you want to quote both directions combined.","deep":"| Link | Calculation | GB/s per direction |\n|---|---|---|\n| Gen1 x1 | 2.5 x 0.8 / 8 | 0.25 |\n| Gen2 x1 | 5 x 0.8 / 8 | 0.5 |\n| Gen3 x4 | 8 x 4 x 0.9846 / 8 | 3.94 |\n| Gen4 x4 | 16 x 4 x 0.9846 / 8 | 7.88 |\n| Gen4 x8 | 16 x 8 x 0.9846 / 8 | 15.75 |\n| Gen5 x4 | 32 x 4 x 0.9846 / 8 | 15.75 |\n\nThis is the ceiling before protocol overhead. The next questions cover why real SSDs land near 7 GB/s on a Gen4 x4 link.","pitfall":"Quoting the bidirectional total (for example \"16 GB/s for Gen4 x4\") next to an SSD's one-direction read spec.","verify":null,"follow":[{"q":"Gen5 x2 versus Gen4 x4?","a":"Identical: 32 x 2 = 16 x 4 = 64 GT/s aggregate, so 7.88 GB/s per direction."},{"q":"Gen2 x4 versus Gen3 x2?","a":"Gen2 x4 is 2.0 GB/s and Gen3 x2 is 1.97 GB/s, so they are effectively equal."}],"mod":1},{"id":"1.06","level":"Intermediate","type":"Trap","fig":null,"tags":["gts","throughput","overhead"],"q":"What is the difference between GT/s and GB/s, and why is your measured SSD throughput lower than the link math?","short":"A transfer is one raw bit on one lane, including encoding bits. Payload throughput is lower by the encoding overhead (20% for 8b/10b, 1.5% for 128b/130b) and lower again by TLP and DLLP overhead. A Gen4 x4 link is 64 Gb/s on the wire, 7.88 GB/s after encoding, and roughly 7.0 GB/s of real data.","deep":"Three separate losses stack on top of each other:\n1. **Encoding:** 20% at Gen1/2, 1.5% at Gen3 to Gen5.\n2. **Packet overhead:** every TLP carries framing, a sequence number, a header and an LCRC (see the TLP efficiency question), and DLLPs (ACK, UpdateFC) use link time as well.\n3. **Protocol dynamics:** reads need request TLPs one way and completions the other way, completions can be split at the read completion boundary, and outstanding-request limits (tags, credits) cap throughput when round-trip latency is high.\n\nMarketing numbers add a fourth confusion: \"PCIe 4.0 x4 = 8 GB/s\" is a rounded one-direction figure, and \"16 GB/s\" is the two directions added together.","pitfall":"Comparing a benchmark's GB/s to the raw link number and calling the difference \"SSD inefficiency.\"","verify":null,"follow":[{"q":"Why do the specs say GT/s and not Gbps?","a":"The physical layer bit rate includes encoding bits. Only after removing them do you get data bits, so the spec quotes the raw transfer rate."},{"q":"Is \"PCIe 4.0 x4 is 8 GB/s\" correct?","a":"Approximately, per direction (7.88 GB/s exactly). Some sources add both directions to reach 16 GB/s."}],"mod":1},{"id":"1.07","level":"Intermediate","type":"Concept","fig":null,"tags":["negotiation","training","width","speed"],"q":"How do two devices decide on link width and speed?","short":"During training they negotiate the widest width and highest speed that both support. Every link first comes up at Gen1 (2.5 GT/s), then moves to the highest mutually supported rate through Recovery. Width can end up narrower than either device supports if lanes fail detection or training, which is called down-training.","deep":"- **Width:** decided in the LTSSM Configuration state (Linkwidth.Start and Accept), where the downstream port proposes a link number and lane numbers and the partner accepts. A failed lane can shrink an x4 link to x2 or x1.\n- **Speed:** each side advertises supported rates in the data rate identifier field of TS1/TS2 ordered sets. After reaching L0 at Gen1 the link enters Recovery and switches to the highest common rate; Gen3 and above also run equalization on the first trip to each new rate.\n- **Directed changes:** software can cap or request speed with Target Link Speed in Link Control 2 and trigger a retrain with Retrain Link in Link Control.\n- **Where to read the result:** `LnkCap` shows what the device can do, `LnkSta` shows what was negotiated (current speed, negotiated width).","pitfall":"Assuming a slow link is a device defect. Compare `LnkSta` with `LnkCap` first.","verify":null,"follow":[{"q":"A Gen4 SSD in a Gen3 slot?","a":"It trains at Gen3. The link runs at the highest speed both sides advertise."},{"q":"Who wins if both rates work?","a":"The highest mutually advertised rate is used, unless software lowered the Target Link Speed."}],"mod":1},{"id":"1.08","level":"Intermediate","type":"Concept","fig":null,"tags":["compatibility","interop"],"q":"How does PCIe stay compatible across generations and widths?","short":"Any generation talks to any other by training at the highest common speed and width, and a smaller card works in a larger slot. Software compatibility comes from the unchanged config-space and enumeration model. A speed mismatch costs performance but does not break enumeration.","deep":"- **Mechanical:** x1, x4 and x8 cards fit an x16 slot (open-ended slots also accept longer cards).\n- **Electrical:** a link is only as wide as the lanes that both sides wire and train.\n- **Generation mix:** a Gen5 endpoint in a Gen3 slot runs at Gen3. Equalization and other features are negotiated per speed.\n- **Gen6:** FLIT mode is required at 64 GT/s. It is negotiated once during initial link training and then stays in force across speed changes until the link goes down. A link runs non-FLIT only if the two ends never negotiated FLIT mode, for example with a Gen5 partner.\n- **Reality check:** \"should be compatible\" is where interop bugs live, mostly in link-training corner cases, power-state exit timing, and BIOS enumeration quirks. Plug-fests and compliance workshops exist for that reason.","pitfall":"Assuming backward compatibility removes the need to test each generation combination.","verify":"Check the FLIT-mode negotiation rules for speeds below 64 GT/s in the current Base Specification.","follow":[{"q":"Can a Gen3 root port train a Gen5 SSD?","a":"Yes, at Gen3, provided the SSD's link training logic handles the lower rate correctly."},{"q":"Where do compatibility bugs cluster?","a":"Speed changes and equalization, power-state transitions, and enumeration/resource allocation."}],"mod":1},{"id":"1.09","level":"Intermediate","type":"Numeric","fig":null,"tags":["efficiency","mps","overhead"],"q":"Estimate TLP efficiency for a 256-byte payload.","short":"Each TLP adds about 22 to 26 bytes: framing, a 2-byte sequence number, a 12- or 16-byte header, and a 4-byte LCRC (plus 4 bytes if ECRC is used). With a 256-byte payload that is about 91% efficient, 128 bytes about 84%, 64 bytes about 73%. DLLPs and read requests cost a bit more, so 85 to 90% of the encoded rate is realistic.","deep":"Using about 24 bytes of overhead per TLP:\n\n| Payload | Efficiency |\n|---|---|\n| 64 B | 64 / 88 = 72.7% |\n| 128 B | 128 / 152 = 84.2% |\n| 256 B | 256 / 280 = 91.4% |\n| 512 B | 512 / 536 = 95.5% |\n\nPut it together for a Gen4 x4 SSD: 7.88 GB/s x 0.914 is about 7.2 GB/s at MPS 256, which matches the roughly 7.0 GB/s sequential numbers you see on real drives.\n\nReads pay twice: a small request TLP goes one way, and completions carrying the data return the other way, split at the read completion boundary. Small-payload traffic such as 4 KiB random I/O also carries doorbell writes, queue-entry fetches, completion writes, and interrupt messages.","pitfall":"Forgetting that DLLPs and the request TLPs for reads also consume link time.","verify":"Framing overhead differs between 8b/10b, 128b/130b, and FLIT mode. Recompute from the spec for the generation you care about.","follow":[{"q":"Why does raising MPS from 256 to 512 help only a little?","a":"Efficiency moves from about 91% to about 95%, while larger MPS needs bigger buffers and is limited by the smallest MPS on the path."},{"q":"How does MRRS interact?","a":"A read request bigger than MPS returns as several completions. A small MRRS with too few tags limits the amount of data in flight."}],"mod":1},{"id":"1.10","level":"Intermediate","type":"Concept","fig":null,"tags":["rc","rciep","rcec","root-port"],"q":"What is a Root Complex, and how do root ports, RCiEPs and RCECs fit in?","short":"The Root Complex is the logic that bridges the host (CPU, memory controller, IOMMU) to the PCIe fabric. It exposes one or more root ports, each a Type 1 bridge with a downstream link. Devices that live inside the RC with no link are Root Complex Integrated Endpoints (RCiEPs), and their errors are collected by a Root Complex Event Collector (RCEC).","deep":"- The RC converts CPU accesses to BAR windows into MRd/MWr TLPs and receives DMA TLPs from devices, applying the IOMMU on the way to memory.\n- Each root port starts its own downstream bus range and has its own link, capabilities and AER registers.\n- RCiEPs (an integrated NIC or chipset controller, for example) have no PCIe link, so they cannot be hot-plugged and some link-related registers do not apply.\n- An RCEC gathers AER errors from the RCiEPs so that error reporting still works for devices with no link to send messages on.","pitfall":"Equating \"Root Complex\" with \"the CPU.\" The RC is bridge logic that is usually integrated into the CPU or SoC.","verify":null,"follow":[{"q":"Does a root port use a Type 0 or Type 1 header?","a":"Type 1, because it is a bridge to its secondary bus."},{"q":"How does a CPU load reach a device?","a":"The RC matches the address against the root port bridge windows and BARs, and issues a memory read TLP on the matching root port."}],"mod":1},{"id":"1.11","level":"Intermediate","type":"Concept","fig":null,"tags":["switch","bridge","routing"],"q":"How is a PCIe switch built internally, and what does it mean for software and performance?","short":"A switch is a set of virtual PCI-to-PCI bridges: one for the upstream port and one for each downstream port, tied together by an internal bus. Software enumerates it as a bridge tree with Type 1 headers, TLPs are routed by address or ID, and peer-to-peer traffic between downstream ports can stay inside the switch. Every hop adds latency and shares its upstream bandwidth.","deep":"- Each downstream port has base/limit windows (memory, prefetchable memory, I/O) for address routing, and secondary/subordinate bus numbers for ID routing.\n- Ingress and egress buffers exist per port and per virtual channel, with arbitration between ports. Cut-through versus store-and-forward is an implementation choice.\n- Latency per hop is typically tens to a few hundred nanoseconds depending on the part and the mode. This matters for latency-sensitive NVMe workloads and for retimer and tag budgeting.\n- Backplane switches multiplex many x4 drives onto one x16 or x8 upstream link, so aggregate bandwidth is limited by the upstream port, not by the drives.","pitfall":"Forgetting oversubscription: eight x4 drives behind an x16 upstream port cannot all run at full speed at once.","verify":null,"follow":[{"q":"How does a switch route a memory TLP?","a":"It compares the address with each downstream port's base and limit windows. If none matches, it forwards the TLP upstream."},{"q":"Transparent versus non-transparent?","a":"A transparent switch presents one hierarchy. A non-transparent bridge joins two separate address domains and translates between them."}],"mod":1},{"id":"1.12","level":"Advanced","type":"Concept","fig":null,"tags":["cdr","clocking","refclk"],"q":"PCIe does not send a data clock. How does the receiver sample correctly?","short":"A clock and data recovery (CDR) circuit in the receiver derives sampling timing from the data transitions, so the line code has to guarantee enough transitions: 8b/10b through its code table, 128b/130b through scrambling. The shared 100 MHz reference clock only anchors PLLs, and is not the sampling clock.","deep":"- **Why embed the clock:** a forward clock reintroduces skew between clock and data. Recovering it from the data removes that limit.\n- **8b/10b:** guarantees a maximum run length of five identical bits and DC balance through running disparity.\n- **128b/130b:** relies on the scrambler for transitions, so long runs are statistically possible and the receiver must tolerate them. There is no running-disparity DC balance.\n- **Consequences for training:** the CDR has to acquire lock, which is why Polling starts by sending TS1 ordered sets and why exiting electrical idle needs training sequences (FTS in L0s, TS1/TS2 through Recovery).\n- **Reference clock:** the 100 MHz REFCLK gives both ends' PLLs a common frequency reference, within the allowed ppm and spread-spectrum tolerance.","pitfall":"Mixing up the reference clock (PLL input) with the recovered data clock.","verify":null,"follow":[{"q":"What sets L0s exit time?","a":"The number of fast training sequences (N_FTS) the receiver needs to re-acquire bit and symbol lock."},{"q":"What does a link give up without DC balance?","a":"Baseline wander tolerance moves into the receiver and the AC-coupling design, and the scrambler must be in sync at both ends."}],"mod":1},{"id":"1.13","level":"Advanced","type":"Concept","fig":null,"tags":["8b10b","128b130b","encoding"],"q":"Compare 8b/10b and 128b/130b encoding.","short":"8b/10b maps each byte to a 10-bit symbol (20% overhead) and provides DC balance, guaranteed transitions, and K-codes for framing. 128b/130b sends 128 payload bits per 130-bit block behind a 2-bit sync header (10b for a data block, 01b for an ordered-set block) with a scrambler, cutting overhead to about 1.5%. The trade is that block alignment, scrambler synchronization, and receiver equalization become mandatory.","deep":"- **Gen3 framing:** no K-codes. Ordered-set blocks are marked by the 01b sync header (data blocks by 10b), and TLP/DLLP framing uses tokens inside data blocks (for example STP and SDP), with an end-of-data-stream token to leave the data stream.\n- **Block alignment:** learned from a unique pattern (the electrical idle exit ordered set) during training, then tracked with the sync headers.\n- **Cost:** a single bit error corrupts a whole block, which the LCRC then catches. The link also depends much more on equalization because there is no code-level guarantee of transition density.\n- **Benefit:** at the same signaling rate, usable throughput improves by about 23% over 8b/10b (0.985 versus 0.8).","pitfall":"Quoting the overhead as 25% or 30%. It is 2 bits in 130, about 1.5%.","verify":"Token names and the exact framing rules are in the Base Specification chapter on the Physical Layer. Check them before quoting in an interview.","follow":[{"q":"How does the receiver find block boundaries?","a":"It detects the unique electrical-idle-exit ordered set during training to align, and then tracks sync headers."},{"q":"What does 128b/130b give up?","a":"Guaranteed transition density and DC balance from the code itself. The design depends on the scrambler and on receiver equalization instead."}],"mod":1},{"id":"1.14","level":"Advanced","type":"Cross-layer","fig":null,"tags":["nvme","x4","x2","iops"],"q":"Why are most NVMe SSDs x4, and when does x2 or a narrower link matter?","short":"x4 at Gen4 or Gen5 (7.88 or 15.75 GB/s) roughly matches what NAND arrays and controllers can deliver, while x8 would cost pins and board layers for little gain. x2 is used for dual-port operation or for cost- and thermal-limited designs. A narrower link caps sequential bandwidth but barely affects low-queue-depth random latency.","deep":"- **Sequential:** link-limited. A Gen4 x2 drive tops out near 3.9 GB/s minus overhead.\n- **Random 4 KiB:** at low queue depth it is latency-bound, not link-bound. At high IOPS the ceiling is roughly link bandwidth divided by 4 KiB plus per-command overhead: 3.94 GB/s / 4096 B is about 960K IOPS raw, so plan on roughly 0.85 to 0.9M for Gen4 x2.\n- **Per-command TLP traffic:** command fetch (64 B), completion write (16 B), doorbell writes, and interrupt messages add a few percent on top of the data.\n- **Form factors:** U.2/U.3, E1.S and E3.S are normally x4, with dual-port drives running as 2 + 2 lanes.\n- **Validation angle:** a silent down-train (x4 to x2, or Gen4 to Gen3) after a reset or power cycle often appears only as a bandwidth regression, so log `LnkSta` after every reset.","pitfall":"Assuming a link down-train always shows up as errors. Often it is only a silent bandwidth cap.","verify":null,"follow":[{"q":"Does x2 hurt 4K random reads?","a":"Little at low queue depth. At very high IOPS, x2 can become the limit near 0.9M IOPS of 4 KiB at Gen4."},{"q":"Why do dual-port SSDs exist?","a":"For high availability: two hosts or two paths can reach the same namespaces, so a controller or path failure does not take the storage offline."}],"mod":1},{"id":"1.15","level":"Advanced","type":"Concept","fig":"pam4","tags":["gen6","pam4","flit","fec"],"q":"How does Gen6 double the data rate, and what does it cost?","short":"Gen6 keeps the Gen5 symbol rate of 32 GBaud but uses PAM4, which carries 2 bits per symbol, to reach 64 GT/s. The Nyquist frequency and channel loss budget stay near Gen5's. The price is three eyes each a third as tall, about 9.5 dB less SNR, so Gen6 mandates FEC and moves to fixed 256-byte FLITs with flit-level CRC and replay.","deep":"- **PAM4 penalty:** the same voltage swing is divided into three eyes, so each has one third of the amplitude, a loss of 20 x log10(3) = 9.5 dB of SNR.\n- **Error rates:** raw pre-FEC bit error rates are far worse than the 1e-12 NRZ targets, so a lightweight forward error correction stage is required.\n- **FLIT:** a fixed 256-byte unit carrying TLP data, a small DLP field, CRC, and FEC parity. There is no 128b/130b sync header and no per-TLP LCRC or sequence number in FLIT mode; reliability moves to flit-level ACK/NAK and replay.\n- **Budget:** roughly 236 bytes of TLP payload area per 256-byte flit, so about 92% efficiency before other overheads.\n- **Power:** L0p lets a link shed lanes without going through Recovery.","pitfall":"Saying PAM4 makes the signal faster. The symbol rate is unchanged; only the bits per symbol doubled.","verify":"Flit byte budget (about 236 payload, 6 DLP, 8 CRC, 6 FEC) and the pre-FEC error rate target. Confirm in the current Base Specification.","follow":[{"q":"Why FLIT?","a":"Fixed size makes FEC and CRC deterministic, removes sync-header framing, and simplifies TLP packing at very high rates."},{"q":"What does mandatory FEC cost?","a":"A few nanoseconds of latency and about 2% of bandwidth for parity, designed so that most errors are corrected and not replayed."}],"mod":1},{"id":"1.16","level":"Principal","type":"Scenario","fig":null,"tags":["triage","downtrain","lnksta","nvme"],"q":"A Gen4 x4 SSD delivers only 3.9 GB/s sequential read. What do you check, in what order?","short":"3.9 GB/s equals the Gen3 x4 ceiling (and Gen4 x2), so read LnkSta first for a down-trained speed and width. Then check slot wiring and retimer or BIOS settings, correctable-error counters, and equalization status. Only after the link is proven healthy do you look up-stack at MPS, MRRS, ASPM, queue depth, and thermals.","deep":"1. **Link state:** compare `LnkCap` with `LnkSta` (speed and width). 3.94 GB/s matches Gen3 x4, Gen4 x2, and Gen5 x1, so read both fields.\n2. **Where the slot comes from:** CPU-direct lanes versus a chipset slot sharing an uplink, plus bifurcation settings and lane sharing with other slots.\n3. **Why it down-trained:** error counters, equalization phase status bits in `LnkSta2`, retrain counts, retimer or clock settings, a forced Target Link Speed, and marginal lanes.\n4. **Configuration:** MPS and MRRS, ASPM and L1 substate latency settings, IOMMU mode, and completion timeouts.\n5. **Device and workload:** thermal throttling, queue depth and block size, namespace state and over-provisioning, and firmware behavior.\n\n```\n$ lspci -s 01:00.0 -vv | grep -E \"LnkCap|LnkSta\"\nLnkCap: Port #0, Speed 16GT/s, Width x4 ...\nLnkSta: Speed 8GT/s (downgraded), Width x4 (ok)\n```\n\nOn Windows the same data is available through the device's PCI link-speed and link-width properties (for example via `Get-PnpDeviceProperty`).","pitfall":"Blaming SSD firmware before reading two registers.","verify":"Property names for link speed and width in Windows (the PCI device property keys) and whether your driver stack exposes them.","follow":[{"q":"`LnkSta` says 16 GT/s x4 but you still see 5 GB/s. Now what?","a":"The link is fine. Look at the workload (queue depth, block size), thermal throttling, chipset uplink sharing, MPS and MRRS, IOMMU overhead, and controller-internal limits."},{"q":"Why can't one throughput number tell you which of speed or width fell?","a":"Several combinations produce the same total, so 3.94 GB/s could be Gen3 x4, Gen4 x2, or Gen5 x1."}],"mod":1},{"id":"1.17","level":"Principal","type":"Numeric","fig":null,"tags":["oversubscription","switch","backplane"],"q":"Eight Gen4 x4 SSDs sit behind a switch with a Gen4 x16 uplink. What aggregate read throughput can the host see?","short":"The uplink limits it: about 31.5 GB/s before protocol overhead, so roughly 28 GB/s in practice, against roughly 56 GB/s that the eight drives could deliver. The array is about 2:1 oversubscribed. Reads flow upstream and writes flow downstream, so they do not compete for the same direction. A pure-read workload is capped at the uplink's one-way bandwidth, while a mixed workload can use both directions.","deep":"- **Drive capability:** 8 x 7.0 GB/s of real read bandwidth is about 56 GB/s.\n- **Uplink:** Gen4 x16 is 16 x 16 x 0.9846 / 8 = 31.5 GB/s per direction. At about 91% TLP efficiency this leaves roughly 28.7 GB/s.\n- **Direction matters:** reads return data upstream, so all eight drives compete for the same upstream lanes. Writes use the downstream direction, so a 50/50 mixed workload can use both directions and approach twice the one-way number.\n- **Other limits to check:** switch internal bandwidth and arbitration, the host's memory bandwidth and IOMMU throughput, credit and tag limits with the added switch latency, and per-port fairness.\n- **Design consequence:** a Gen5 x16 uplink or fewer drives per switch removes the ceiling. For validation, test one drive at a time and then all drives together, and expect the aggregate to plateau.","pitfall":"Summing drive specs without checking the shared upstream path.","verify":null,"follow":[{"q":"How could a mixed workload exceed 31.5 GB/s?","a":"Reads and writes travel in opposite directions, so a mixed workload can use both directions of the uplink simultaneously."},{"q":"How would you prove the uplink is the bottleneck?","a":"Add drives one at a time and watch the aggregate plateau, check that each drive's individual throughput drops evenly, and confirm the uplink link state and error counters are clean."}],"mod":1},{"id":"2.01","level":"Basic","type":"Concept","fig":"stack","tags":["layers","tlp","dllp"],"q":"Describe the three PCIe layers and what each one owns.","short":"The Transaction Layer builds and consumes TLPs (requests and completions) and owns flow control accounting and ordering. The Data Link Layer makes each hop reliable with sequence numbers, LCRC, ACK/NAK and replay, and carries flow-control and power-management DLLPs. The Physical Layer frames, scrambles, encodes and serializes the data and runs link training (the LTSSM).","deep":"| Layer | Unit it handles | Main jobs |\n|---|---|---|\n| Transaction | TLP | request/completion semantics, addressing and routing, flow-control credits, ordering, virtual channels, ECRC |\n| Data Link | DLLP, and TLPs with seq# and LCRC | ACK/NAK, replay buffer, flow-control initialization and updates, power-management handshakes, link up/down status |\n| Physical | symbols, blocks, ordered sets | framing, byte striping, scrambling, 8b/10b or 128b/130b encoding, SerDes, LTSSM, equalization |\n\nEach layer talks to its peer through the layers below it. Sending goes down the stack and receiving goes up.","pitfall":"Placing flow control in the Data Link Layer. Credits are accounted in the Transaction Layer; the Data Link Layer only transports the initialization and update DLLPs.","verify":null,"follow":[{"q":"Which layer owns link training?","a":"The Physical Layer, through the LTSSM."},{"q":"Which layer numbers TLPs?","a":"The Data Link Layer."}],"mod":2},{"id":"2.02","level":"Basic","type":"Concept","fig":"encap","tags":["memory-write","walkthrough"],"q":"Walk a memory write from Device A down its stack and up Device B's stack.","short":"A's Transaction Layer builds a memory write TLP (header, data, optional ECRC) once it has flow-control credits. The Data Link Layer adds a sequence number and LCRC and keeps a copy in the replay buffer. The Physical Layer frames, scrambles, encodes and serializes it. B reverses the steps: the LCRC and sequence number are checked and an ACK DLLP returns, then B's Transaction Layer checks the header and delivers the write. Nothing is returned to the requester because the write is posted.","deep":"1. A's TL checks it holds enough posted-header and posted-data credits for the TLP, then builds header, payload and optional ECRC.\n2. A's DLL assigns the next sequence number, computes the LCRC, stores the TLP in the replay buffer, and hands it down.\n3. A's PL adds framing, stripes bytes across lanes, scrambles, encodes, and transmits.\n4. B's PL recovers symbols or blocks, removes framing, and passes the TLP up.\n5. B's DLL verifies LCRC and sequence number. Good: it schedules an ACK DLLP. Bad: it schedules a NAK.\n6. B's TL checks the header (routing, type, malformed checks), consumes the data, and later returns the credits to A through an UpdateFC DLLP.\n7. A's DLL frees the replay-buffer copy when the ACK arrives.","pitfall":"Treating the ACK as proof the write reached its destination. An ACK only says the next link received the TLP intact.","verify":null,"follow":[{"q":"When does A discard its replay copy?","a":"When an ACK covering that sequence number arrives."},{"q":"When does B return credits?","a":"After its Transaction Layer drains the write from its receive buffer, through an UpdateFC DLLP."}],"mod":2},{"id":"2.03","level":"Basic","type":"Concept","fig":"dllp","tags":["tlp","dllp","ordered-set"],"q":"What is the difference between a TLP, a DLLP and an ordered set?","short":"TLPs carry transactions: they are variable length, sequence-numbered, LCRC-protected, replayable, and routed across switches. DLLPs are small link-local control packets (ACK/NAK, credits, power management) with their own 16-bit CRC that are not sequenced or replayed. Ordered sets are Physical Layer patterns (TS1/TS2, SKP, electrical idle) for training, clock compensation and idle entry.","deep":"| | TLP | DLLP | Ordered set |\n|---|---|---|---|\n| Created by | Transaction Layer | Data Link Layer | Physical Layer |\n| Crosses switches | Yes (header and payload unchanged) | No, one link only | No, one link only |\n| Protection | LCRC per hop, optional ECRC end to end | 16-bit CRC | Pattern match, repetition |\n| Recovery | ACK/NAK and replay | Periodic repetition and timers | Repetition and LTSSM timeouts |\n| Examples | MRd, MWr, CfgRd, Cpl | Ack, Nak, InitFC, UpdateFC, PM_* | TS1, TS2, SKP, EIOS, EIEOS, FTS |","pitfall":"Calling ACK and NAK \"TLPs.\" They are DLLPs.","verify":null,"follow":[{"q":"Are DLLPs acknowledged?","a":"No. Credit updates repeat periodically, and other DLLP loss is handled by protocol timers such as the replay timer."},{"q":"Can a switch forward a DLLP?","a":"No. DLLPs terminate at the port that receives them."}],"mod":2},{"id":"2.04","level":"Basic","type":"Concept","fig":null,"tags":["posted","non-posted","completion","requester"],"q":"Which PCIe requests are posted, which are non-posted, and which need completions?","short":"Memory writes and messages are posted: the requester expects no completion. Memory reads, I/O reads and writes, configuration reads and writes, and AtomicOps are non-posted: the completer must answer with a completion (with data for reads, without data for writes and errors). The requester is who issues a request and the completer is who executes it.","deep":"- **Posted:** MWr, Msg/MsgD. Fire and forget, so they cost no round trip and can stream at full link rate.\n- **Non-posted:** MRd, IORd, IOWr, CfgRd0/1, CfgWr0/1, FetchAdd, Swap, CAS. I/O and configuration writes are non-posted, so they return a completion without data.\n- **Completions:** Cpl (no data) and CplD (with data), with a completion status of Successful, Unsupported Request, Configuration Request Retry Status, or Completer Abort.\n- **Why it matters:** reads pay a round-trip latency and consume a tag, while writes are limited only by flow-control credits. That difference shapes performance and ordering rules.","pitfall":"Assuming a memory write is acknowledged end to end. Only link-level ACK exists.","verify":null,"follow":[{"q":"Is a configuration write posted?","a":"No. It is non-posted and returns a Cpl without data."},{"q":"Who tracks an outstanding read?","a":"The requester, using a tag that identifies the request until its completion (or completions) return."}],"mod":2},{"id":"2.05","level":"Intermediate","type":"Concept","fig":null,"tags":["lcrc","ecrc","end-to-end"],"q":"What is end to end and what is per hop in a TLP? Compare LCRC and ECRC.","short":"The header, payload and optional ECRC belong to the TLP and are forwarded by switches unchanged. The sequence number, LCRC, framing and DLLPs belong to one link and are rebuilt at every hop. LCRC therefore catches corruption on a single link, and ECRC can catch corruption inside a switch or bridge that the regenerated LCRC would hide.","deep":"- A switch checks the incoming LCRC, moves the TLP through its internal buffers and logic, then computes a new LCRC on the way out. Corruption inside the switch happens after the check and before the recompute, so LCRC covers the corrupted data and the error goes unnoticed.\n- ECRC is generated by the requester's Transaction Layer and checked by the final receiver (and optionally by switches), so it covers the path.\n- ECRC is optional: it costs 4 bytes per TLP and generation and checking logic, and is enabled through the AER capability (ECRC Generation and Check enables).\n- ECRC covers fields that stay constant along the path. Variant bits (such as the EP bit and the type bit that changes when a Type 1 configuration request converts to Type 0) are treated as fixed values in the calculation.\n- An ECRC error is reported as an uncorrectable, normally non-fatal error.","pitfall":"Believing LCRC gives end-to-end data integrity through switches.","verify":"The exact list of variant bits excluded from ECRC and the default severity of an ECRC error in the AER Uncorrectable Error Severity register.","follow":[{"q":"Why is ECRC off on many platforms?","a":"It is optional, adds 4 bytes and some latency, and many designs rely on internal parity and ECC in switches and controllers instead."},{"q":"Which error can only ECRC catch?","a":"Data corruption that occurs inside a switch or bridge after the LCRC check and before the LCRC is regenerated."}],"mod":2},{"id":"2.06","level":"Intermediate","type":"Concept","fig":null,"tags":["dll","dlcmsm","initfc","dl-up"],"q":"Besides ACK/NAK, what else does the Data Link Layer do?","short":"It runs the Data Link Control and Management State Machine (DL_Inactive, DL_Init, DL_Active) that tells the Transaction Layer when the link is usable. It initializes flow control with InitFC1 and InitFC2 DLLPs, carries UpdateFC credit updates, transports the power-management handshakes (for example PM_Enter_L1 and PM_Request_Ack), and reports link up or down for hot plug and status registers.","deep":"- **Bring-up:** the LTSSM reaching L0 is not enough. The DLL must exchange InitFC1 then InitFC2 DLLPs for the virtual channel (at least VC0) before it reports DL_Active and lets TLPs flow.\n- **Feature exchange:** newer revisions add a Data Link Feature state for exchanging optional features before flow-control initialization.\n- **Down handling:** if the link goes down (DL_Inactive), the Transaction Layer discards outstanding TLPs and the replay buffer is cleared. Completion timeouts are what eventually clean up non-posted requests.\n- **Status:** the Data Link Layer Link Active bit in Link Status, and the Data Link Layer State Changed bit in Slot Status, are driven from this layer. Hot plug and surprise-down handling depend on them.","pitfall":"Assuming an LTSSM in L0 means the Data Link Layer is up. Both must be up before TLPs move.","verify":"DL_Feature state details (added in newer revisions) in the Data Link Layer chapter of the Base Specification.","follow":[{"q":"What must finish before DL_Active?","a":"Flow-control initialization (InitFC1 and InitFC2 exchange) for VC0."},{"q":"What happens to in-flight TLPs when the link drops?","a":"They are discarded, so higher layers rely on completion timeouts and software recovery."}],"mod":2},{"id":"2.07","level":"Intermediate","type":"Concept","fig":null,"tags":["pipe","phy","mac"],"q":"How is the Physical Layer split in real silicon, and what is PIPE?","short":"The Physical Layer has a logical sublayer (framing, byte striping, scrambling, encoding, LTSSM) and an electrical sublayer (SerDes, TX drivers, RX equalization, CDR, detection circuits). Chips usually implement this as a digital MAC/PCS and an analog PHY/PMA connected by the PIPE interface, so the same controller can be paired with different PHYs.","deep":"- **PIPE** (PHY Interface for PCI Express) defines the signals between MAC and PHY: transmit and receive data, receiver detection, power state control, data rate selection, polarity, equalization requests and results, and the parallel clock.\n- **Ownership:** the LTSSM and equalization protocol (which presets and coefficients to request) live in the MAC. RX adaptation (CTLE, DFE gain and tap tuning) lives in the PHY.\n- **Why validation cares:** PIPE-level monitors and simulation models make LTSSM behavior visible before silicon, and many bring-up failures are MAC-to-PHY assumptions such as power-state timing or rate-change sequencing.\n- **Naming trap:** PIPE power-down states (P0, P0s, P1, P2 and their newer sub-states) describe the PHY. They are not the same as link L-states.","pitfall":"Mapping PIPE P-states one to one onto link L-states.","verify":"PIPE revision specifics (signal names and P-state sub-states vary by version).","follow":[{"q":"Who owns the LTSSM?","a":"The MAC side, which drives the PHY through PIPE."},{"q":"Where does receiver adaptation run?","a":"Inside the PHY, as analog and DSP adaptation loops for CTLE and DFE."}],"mod":2},{"id":"2.08","level":"Intermediate","type":"Concept","fig":null,"tags":["switch","cut-through","nullified"],"q":"How does a switch treat a TLP as it passes through? What is a nullified TLP?","short":"Each switch port has a full Physical and Data Link Layer. The ingress DLL checks and ACKs the TLP, the switch's Transaction Layer routes it by address or ID and arbitrates virtual channels, and the egress DLL assigns a new sequence number and LCRC. A switch may forward cut-through before the LCRC is verified. If the LCRC then fails, the switch nullifies the outgoing TLP so the downstream receiver discards it, and the upstream link replays the good copy.","deep":"- **Store-and-forward versus cut-through:** cut-through cuts latency but forwards data before it is known to be good.\n- **Nullifying:** the switch ends the packet with the EDB (end bad) symbol or token and an inverted LCRC. The receiver drops it without treating it as a normal link error.\n- **Recovery:** the ingress link still NAKs the corrupted TLP and the sender replays it, so the corrected copy follows later.\n- **Credits:** the switch consumes credits at the egress port from the next device and returns credits upstream as its buffers drain. Each link has independent credits.","pitfall":"Assuming every dropped TLP means a link error. Nullified TLPs are expected switch behavior.","verify":"Sequence-number and error-reporting treatment of nullified TLPs in the Base Specification.","follow":[{"q":"Why not always store-and-forward?","a":"It adds about a packet time of latency per hop, which matters at high speed and for latency-sensitive traffic."},{"q":"Does a nullified TLP consume a sequence number?","a":"The receiver discards it without treating it as a normal bad TLP, and it should not advance NEXT_RCV_SEQ. The exact sequence accounting on the sending side is in the Data Link Layer rules (verify in spec)."}],"mod":2},{"id":"2.09","level":"Advanced","type":"Concept","fig":null,"tags":["errors","aer","layers"],"q":"Which errors are detected at each layer, and how do they map to AER?","short":"The Physical Layer detects receiver errors (bad decode, framing, alignment) and training or link-down problems. The Data Link Layer detects bad TLPs (LCRC or sequence errors), bad DLLPs, replay timeouts and replay rollover, and protocol errors. The Transaction Layer detects poisoned TLPs, completion timeouts, unexpected or aborted completions, unsupported requests, flow-control violations, malformed TLPs and ECRC errors.","deep":"| Layer | Detects | AER class |\n|---|---|---|\n| Physical | Receiver Error | Correctable |\n| Data Link | Bad TLP, Bad DLLP, REPLAY_NUM Rollover, Replay Timer Timeout | Correctable |\n| Data Link | Data Link Protocol Error, Surprise Down Error | Uncorrectable (usually fatal) |\n| Transaction | Poisoned TLP, Completion Timeout, Completer Abort, Unexpected Completion, Unsupported Request, ECRC Error, ACS Violation | Uncorrectable non-fatal by default (severity is programmable) |\n| Transaction | Receiver Overflow, Flow Control Protocol Error, Malformed TLP | Uncorrectable (usually fatal) |\n\nCorrectable errors are recovered by hardware (replay, retrain). Their counts are still the earliest sign of a marginal link. Uncorrectable errors mean a transaction or the link failed and software must decide how to recover.","pitfall":"Ignoring correctable errors because \"they are corrected.\" A rising rate is a leading indicator of link marginality.","verify":null,"follow":[{"q":"Which correctable errors usually indicate signal-integrity trouble?","a":"Receiver Error, Bad TLP and Bad DLLP first, then Replay Timer Timeout and REPLAY_NUM Rollover when it gets worse."},{"q":"Can severity be changed?","a":"Yes. The Uncorrectable Error Severity register selects fatal or non-fatal for each uncorrectable error type."}],"mod":2},{"id":"2.10","level":"Advanced","type":"Cross-layer","fig":null,"tags":["nvme","dma","read","tags","credits"],"q":"Trace an NVMe SSD fetching a submission queue entry from host memory across PCIe.","short":"The SSD is the requester. Its Transaction Layer builds a memory read request for 64 bytes (no payload) with a tag, using a non-posted header credit. The TLP goes through any switch to the Root Complex, which reads memory (through the IOMMU) and returns a completion with data. The completion is matched to the tag, its payload is consumed, and the credits go back to the sender through UpdateFC DLLPs.","deep":"1. The controller decides to fetch entry N of the submission queue (after the host rings the doorbell with a posted MMIO write to the SSD's BAR).\n2. TL builds MRd with 64-bit address, length 16 DW, requester ID, and a tag. It needs one non-posted header credit at the upstream link.\n3. Each hop adds sequence number and LCRC and ACKs the previous hop. A switch routes by address (no downstream window matches, so it forwards upstream).\n4. The RC translates the address if an IOMMU is in use, reads memory and returns CplD with the 64 bytes, routed by ID back to the SSD.\n5. The SSD matches the tag, then treats the command as received. Reads larger than MPS return as several completions, split on read completion boundaries.\n6. Posted writes from the SSD (data to host, completion queue entries, MSI-X messages) travel the other way without completions.","pitfall":"Forgetting the IOMMU and switch hops when explaining a latency number for host-memory access.","verify":null,"follow":[{"q":"What must the SSD guarantee about completion credits?","a":"Endpoints that issue reads normally advertise infinite completion credits and must be able to consume every completion, which avoids a deadlock class."},{"q":"Why do read-heavy SSD workloads care about MRRS and tags?","a":"A read request larger than MPS returns as multiple completions, and the number of tags bounds how many reads are in flight across the round trip."}],"mod":2},{"id":"2.11","level":"Advanced","type":"Trap","fig":null,"tags":["posted","ordering","flush","ack"],"q":"A posted write was ACKed at the link level. Is the data visible at the target? How do you make sure?","short":"Not necessarily. The ACK says only that the next port received the TLP without errors, and the write may still sit in a switch buffer or a host write queue. The ordering rules say a non-posted read may not pass an earlier posted write on the same path, so software follows a write with a read from the same device (a \"flush read\") to force earlier writes to become visible.","deep":"- **Link ACK versus visibility:** ACK is per link and protects delivery. It says nothing about the write being applied to the final device or memory.\n- **Ordering guarantees:** a posted write may always pass a non-posted request (required for deadlock avoidance), but a non-posted request cannot pass an earlier posted write. So a read to the same device is ordered behind every earlier posted write on that path.\n- **Errors are asynchronous:** a posted write to a bad address produces no completion. The receiver reports it through error messages (for example ERR_NONFATAL) and AER logs, long after the writing instruction retired.\n- **Where this shows up:** doorbell writes to an SSD (posted MMIO writes) followed by a status read; and drivers that use a read of a benign register to flush the write buffer.","pitfall":"Assuming a link ACK equals target visibility, or that a posted write failure will be reported to the store instruction that issued it.","verify":null,"follow":[{"q":"What does the \"producer/consumer\" ordering rule protect?","a":"A consumer that sees the flag or completion must also see the data written before it, so data writes cannot be passed by the later flag write."},{"q":"What if the write was to a device that has gone away?","a":"No completion returns. The error is logged, and only later reads or timeouts reveal it."}],"mod":2},{"id":"2.12","level":"Advanced","type":"Numeric","fig":null,"tags":["tags","latency","bdp","10-bit-tags"],"q":"How many outstanding reads do you need to saturate a link with a 1 microsecond round trip?","short":"Multiply the link bandwidth by the round-trip time to get bytes in flight, then divide by the read size. Gen4 x4 (7.88 GB/s) at 1 microsecond needs about 7.9 KB in flight, or roughly 31 reads of 256 bytes. Gen5 x16 (about 63 GB/s) needs about 63 KB, or 246 reads, which is why extended and 10-bit tags exist.","deep":"Bytes in flight = bandwidth x round-trip time (the bandwidth-delay product).\n\n| Link | Bandwidth | In flight at 1 us | 256 B reads outstanding |\n|---|---|---|---|\n| Gen4 x4 | 7.88 GB/s | 7.9 KB | 31 |\n| Gen5 x4 | 15.75 GB/s | 15.8 KB | 62 |\n| Gen5 x16 | 63 GB/s | 63 KB | 246 |\n| Gen6 x16 | about 118 GB/s | about 118 KB | about 460 |\n\n- The original tag field is 5 bits (32 outstanding), the extended tag field is 8 bits (256), and 10-bit tags extend this further.\n- Latency is not fixed: each switch hop, retimer, IOMMU miss or host memory queue adds to the round trip, so the required tag count rises with topology depth.\n- Undersized tag pools show up as a plateau below the link rate that improves when you add queue depth or fewer hops.","pitfall":"Sizing tags for the unloaded latency. Under load, queueing raises the round trip.","verify":"Maximum outstanding requests with 10-bit tags and the requester and completer capability bits required to use them.","follow":[{"q":"Why did 10-bit tags appear?","a":"Faster links and longer paths (switches, retimers) increase the bandwidth-delay product beyond what 256 tags can cover with small reads."},{"q":"How does a larger read size help?","a":"Fewer requests are needed for the same bytes in flight, but the split into completions and MRRS limits still apply."}],"mod":2},{"id":"2.13","level":"Advanced","type":"Debug","fig":null,"tags":["replay","correctable","marginal"],"q":"You see thousands of replays but no uncorrectable errors. Which layer is at fault and what is the likely cause?","short":"The Data Link Layer is doing its job by recovering from errors that originate in the Physical Layer or the channel: a marginal link with elevated bit errors. Bad TLP counts point to corrupted TLPs, Bad DLLP to corrupted ACK/NAK or credit packets, Replay Timer Timeout to lost ACKs, and Receiver Error to symbol-level errors. Look at signal integrity, equalization, reference clock, temperature and margins, not at the Transaction Layer.","deep":"1. **Read the counters:** `lspci -vv` shows CESta (correctable status) bits such as RxErr, BadTLP, BadDLLP, Rollover and Timeout. Log them with timestamps.\n2. **Correlate:** does the rate change with temperature, link speed, traffic pattern, or specific lanes?\n3. **Check the training history:** count Recovery entries and speed downshifts, and the equalization phase status bits in Link Status 2.\n4. **Compare speeds:** if errors disappear at the next lower speed, the channel or equalization margin is the problem.\n5. **Measure margin:** run per-lane margining (Gen4 and above) or an eye scan on the bench.\n6. **Suspects:** connector or cable, retimer configuration, reference clock (SSC or SRIS settings), power noise, and PCB via or trace defects on specific lanes.","pitfall":"Filing this as a firmware bug. The Transaction Layer is fine; the fault is below it.","verify":null,"follow":[{"q":"Why is Replay Timer Timeout worse than Bad TLP?","a":"A NAK triggers a fast replay, but a timeout means the ACK or NAK itself was lost, so the sender waited a full timer period before replaying."},{"q":"When does this become an uncorrectable problem?","a":"When REPLAY_NUM rolls over repeatedly and forces retrains, or when the link drops, showing up as surprise-down or completion timeouts."}],"mod":2},{"id":"2.14","level":"Principal","type":"Scenario","fig":null,"tags":["triage","timeout","drop","layers"],"q":"A request disappears: no completion comes back and nothing is logged. Walk down the stack to find where it could have been dropped.","short":"Start at the top with routing and access control (the address matches no window, or ACS blocked it), then flow control (the credits never freed), then the Data Link Layer (DL_Down discards TLPs), then the Physical Layer (link in Recovery or gone). Finally check the completer, which may have dropped the request or never sent the completion. The completion timeout on the requester is what turns silence into an error.","deep":"1. **Transaction Layer, routing:** the address falls outside every window, so the request is a master abort or Unsupported Request. Check BAR programming, bridge windows, and IOMMU mappings.\n2. **Transaction Layer, access control:** ACS redirect or block, or a DPC-contained downstream port silently drops TLPs.\n3. **Flow control:** one credit type stopped returning (a stuck receiver or a switch buffer full of something else), so the request sits behind a credit stall.\n4. **Data Link Layer:** the link went DL_Down, discarding TLPs, and completion timeouts follow.\n5. **Physical Layer:** LTSSM stuck in Recovery or retraining repeatedly.\n6. **Completer:** the endpoint firmware hung, the function is in a reset or low-power state, or the completion was generated but blocked by an ordering or credit stall.\n7. **Observation:** the completion timeout (default range 50 microseconds to 50 milliseconds, programmable) and the associated AER logs are what let you see any of this.","pitfall":"Assuming the endpoint is at fault before proving the request left the requester and reached it.","verify":"Completion timeout ranges and default value from the Device Control 2 register description in the Base Specification.","follow":[{"q":"How would an analyzer trace narrow this down?","a":"Look for the request TLP leaving the requester, at each hop if you can tap several, and for the matching completion. The last hop that saw the request tells you where it stopped."},{"q":"How do you tell a credit stall from a dead endpoint?","a":"Credit stall: UpdateFC DLLPs stop and new TLPs are not transmitted at the stalled port. Dead endpoint: credits and ACKs still flow but no completion returns."}],"mod":2},{"id":"2.15","level":"Principal","type":"Cross-layer","fig":null,"tags":["nvme","timeout","mapping","triage"],"q":"An NVMe command times out on the host. How do you decide whether the cause is PCIe or NVMe/firmware?","short":"Separate what the host can prove about the link from what it cannot. If the link state, AER counters and completion timeouts show a PCIe problem (down-training, replays, link retrain, surprise-down, DPC), fix it at the PCIe layer. If the link is clean and the controller reads back normally (CSTS ready, no fatal status), the fault is in NVMe processing or firmware.","deep":"| Symptom | Likely layer | Evidence |\n|---|---|---|\n| MMIO reads return all ones | Link or device gone | LnkSta not Active, DL Link Active clear, surprise-down in AER |\n| Doorbell write posted, no fetch seen | Routing or endpoint | analyzer: no MRd for the queue entry, BAR or ACS state |\n| Fetch seen, no completion entry or interrupt | Firmware or MSI-X | analyzer: MWr for CQE or MSI-X message missing, MSI-X table and mask state |\n| Interrupt seen, host misses it | MSI-X or OS | vector and affinity, masked vector in the table |\n| Sporadic latency spikes with replay counts | Physical or DLL | correctable-error rates, Recovery entries, L1 exit latency |\n| Controller reports fatal status (CSTS.CFS) | NVMe or firmware | log pages, controller reset behavior |\n\nMethod: read link state and AER, read controller status, then capture a trace across the doorbell, fetch, data, completion and interrupt chain and note where it stops.","pitfall":"Treating an NVMe timeout as a firmware defect before reading link state and AER.","verify":null,"follow":[{"q":"What single read tells you fastest whether the device is reachable?","a":"A read of the controller capability or status register: all ones means the link or device is gone."},{"q":"Where do ASPM and L1 exit latency fit?","a":"They add latency spikes on wake, so intermittent timeouts under low load and low power settings are worth testing with ASPM disabled."}],"mod":2},{"id":"3.01","level":"Basic","type":"Concept","fig":null,"tags":["differential","ac-coupling"],"q":"Why does PCIe use differential signaling, and why are the lanes AC coupled?","short":"Each direction is a pair of complementary signals, and the receiver reads the difference. Noise that hits both wires equally is rejected, swings can be small, and EMI is low. AC-coupling capacitors in series block DC, so the two ends can sit at different common-mode voltages and power domains, which also makes hot plug safe.","deep":"- **Common-mode rejection:** crosstalk, ground bounce and power noise appear on both wires and cancel in the receiver.\n- **Small swing:** less voltage swing means less power, less EMI, and faster edges for the same power.\n- **AC coupling:** a series capacitor (typically in the 75 to 200 nF range on the transmit pair of a card) blocks the DC level. Each end sets its own common-mode bias.\n- **Consequence for coding:** the AC-coupled channel high-pass filters the signal, so the line code must not contain long low-frequency content. 8b/10b guarantees DC balance. 128b/130b relies on scrambling and a receiver that tolerates baseline wander.","pitfall":"Calling the two wires \"TX and RX.\" A pair is one direction; a lane has one pair each way.","verify":"The capacitor value range and placement rules in the CEM specification (they depend on form factor).","follow":[{"q":"What does AC coupling let you do at the connector?","a":"Connect two devices with different supply voltages or a card that powers up later, without a DC path or a large surge."},{"q":"What breaks if DC balance is poor?","a":"The coupling capacitor charges, the baseline drifts, and the eye closes for long runs of ones or zeros."}],"mod":3},{"id":"3.02","level":"Basic","type":"Concept","fig":null,"tags":["refclk","pll"],"q":"What is REFCLK and what does it do if the data clock is recovered from the data?","short":"REFCLK is a 100 MHz differential reference clock, normally supplied by the host on the connector. Each device's PLL multiplies it to the bit rate for its transmitter, and the receiver's CDR recovers the data timing on its own. REFCLK does not sample data; it sets each side's transmit frequency within a small tolerance and keeps both ends close in frequency.","deep":"- **Tolerance:** transmit frequency must stay within about plus or minus 300 ppm of nominal, so two ends can differ by up to 600 ppm.\n- **Spread spectrum:** an optional downspread (about 0.5%) at 30 to 33 kHz reduces peak EMI. Both ends must be able to track it.\n- **Why not a clock per lane:** the CDR recovers timing per lane from the data, so lanes do not need to share timing, only frequency.\n- **Where it can hide failures:** poor reference clock jitter, spread-spectrum settings that disagree with the configured clocking mode, and a missing or late refclk during power-up all look like link training failures or intermittent errors.","pitfall":"Treating REFCLK as the sampling clock. The receiver samples on the recovered clock.","verify":"ppm and spread-spectrum figures against the Base Specification and the CEM specification for your form factor.","follow":[{"q":"Is REFCLK required at the device?","a":"Normally yes on the slot, with a defined power-up order. Designs that generate their own reference must use an independent-reference clocking mode."},{"q":"Why 100 MHz?","a":"It is a convenient, low-jitter frequency for PLLs to multiply to multi-GHz bit rates, and it is common across all generations."}],"mod":3},{"id":"3.03","level":"Basic","type":"Concept","fig":null,"tags":["scrambling","lfsr","emi"],"q":"Why does PCIe scramble data, and what is not scrambled?","short":"A scrambler XORs the data with a pseudo-random sequence from an LFSR that both ends run in lockstep. It spreads spectral energy of repeating patterns (lower EMI), breaks up long runs so the CDR keeps seeing transitions, and improves statistical DC balance. It is not encryption. Training ordered sets and other defined symbols are exempt so the receiver can lock before the scrambler is synchronized.","deep":"- **Generations:** Gen1 and Gen2 use a 16-bit LFSR; Gen3 and above use a 23-bit LFSR with per-lane seeds so neighboring lanes do not carry identical patterns (which would add crosstalk and EMI).\n- **Synchronization:** the LFSR is reset at defined points (for example a COM symbol in Gen1/Gen2), and it does not advance for symbols that are not scrambled.\n- **Exempt symbols:** training sequences and a few other ordered-set symbols are not scrambled so a receiver can decode them before its scrambler is aligned.\n- **Test and debug:** scrambling can be disabled (through a training control bit) only at the 8b/10b speeds, for analyzers and bench work.\n- **Not a security feature:** the sequence is fixed and public.","pitfall":"Calling scrambling security or encryption.","verify":"LFSR widths, polynomials, reset points, and which rates permit disabling scrambling (Base Specification, Physical Layer chapter).","follow":[{"q":"Why do lanes use different scrambler seeds?","a":"Identical scrambled patterns on adjacent lanes would correlate, creating crosstalk and EMI peaks. Different seeds decorrelate them."},{"q":"Can you disable scrambling at Gen4?","a":"Not for normal operation. The disable option applies to the 8b/10b rates."}],"mod":3},{"id":"3.04","level":"Intermediate","type":"Concept","fig":null,"tags":["electrical-idle","detect","eios"],"q":"What is electrical idle, and how does a transmitter detect that a receiver is present?","short":"Electrical idle means the transmitter drives a common-mode voltage with no differential signal, used in Detect, in low-power states and on disabled links. Entry is signaled with an electrical idle ordered set and confirmed by analog squelch detection. Receiver detection is analog: the transmitter steps its common-mode voltage and checks the charge time, because a present receiver puts a large AC-coupling capacitor on the line, so the voltage rises slowly, while an open circuit charges quickly.","deep":"- **Receiver detect:** in Detect.Quiet then Detect.Active the transmitter pulses each lane and measures the time constant. A lane with a receiver termination reads as present. Populated lanes then define the potential link width.\n- **Entering idle:** a transmitter sends an EIOS (electrical idle ordered set) so the receiver knows the silence is intentional and not a fault.\n- **Leaving idle:** the receiver's analog detector sees activity, then the CDR must re-lock using training patterns (FTS in L0s exit, TS1 and TS2 in Recovery). That relock time is the main component of low-power exit latency.\n- **Why it matters:** wake latency, L0s/L1 exit failures, and hot-plug detection all depend on these mechanisms.","pitfall":"Treating electrical idle as an error condition. It is a normal, signaled state.","verify":null,"follow":[{"q":"Is receiver detect a protocol handshake?","a":"No. It is an analog measurement and needs no cooperating packets."},{"q":"Why can a link appear absent when a card is inserted but unpowered?","a":"The unpowered receiver's termination may not be present, so the detect measurement finds no receiver."}],"mod":3},{"id":"3.05","level":"Intermediate","type":"Concept","fig":null,"tags":["refclk","srns","sris","ssc","common-clock"],"q":"Compare Common Clock, SRNS and SRIS reference clock architectures.","short":"Common Clock shares one REFCLK between both ends, so their frequency offset is nearly zero and spread spectrum works easily. SRNS uses separate reference clocks without spread spectrum, so the ends can differ by up to 600 ppm. SRIS uses separate clocks that may each spread independently, so the receiver must absorb much larger frequency variation and SKP ordered sets are sent more often.","deep":"| Mode | Reference | SSC | Typical use |\n|---|---|---|---|\n| Common Clock | One REFCLK to both ends | Allowed | Motherboard slots, most add-in cards |\n| SRNS | Separate clocks | Off | Cables or backplanes where clocks are independent |\n| SRIS | Separate clocks | On, independent | Cables, backplanes, some SSD and storage systems |\n\n- **Elastic buffers:** the receiver must absorb the frequency difference between its recovered clock and its local clock, so SRIS needs deeper buffers and more frequent SKP ordered sets.\n- **Software view:** Link Status reports Slot Clock Configuration (`SlotClk+` in `lspci`), and Link Control has a Common Clock Configuration bit that software sets so both ends use matching SKP timing.\n- **Failure signature:** a mismatch in configured mode gives correctable errors that grow with traffic and spread-spectrum activity, sometimes only in specific systems.","pitfall":"Configuring SSC differently on the two ends with separate clocks. The ppm budget can be exceeded.","verify":"SKP ordered set intervals for SRIS and the specific clocking mode support bits (Base Specification, Physical Layer and Link Capabilities).","follow":[{"q":"Which mode sends SKP ordered sets most often?","a":"SRIS, roughly an order of magnitude more often than common clock."},{"q":"What is SSC for?","a":"It spreads clock energy across a band to lower peak EMI. It complicates frequency tracking, which is why independent SSC needs its own architecture."}],"mod":3},{"id":"3.06","level":"Intermediate","type":"Numeric","fig":null,"tags":["skp","elastic-buffer","ppm"],"q":"What is a SKP ordered set, and how do you know how often it must be sent?","short":"A SKP ordered set is a padding pattern that the receiver may delete or insert to keep its elastic buffer centered, compensating for the small frequency difference between transmit and receive clocks. With plus or minus 300 ppm on each end, the worst-case difference is 600 ppm, so one symbol of drift accumulates every 1 / 600e-6, about 1,667 symbol times. SKP ordered sets are therefore scheduled at intervals shorter than that.","deep":"- **Interval (8b/10b):** a SKP ordered set is scheduled every 1180 to 1538 symbol times, so the receiver always has an opportunity to adjust before a slip.\n- **Interval (128b/130b):** the equivalent interval is about 370 to 375 blocks.\n- **Mechanism:** if the receive clock is faster, the buffer drains and the receiver inserts a SKP symbol. If it is slower, the buffer fills and the receiver removes one. Data is never dropped because SKP symbols carry no information.\n- **SRIS and SSC:** independent spread-spectrum modulation can make the difference much larger over short periods, so SRIS intervals are far shorter.\n- **Bandwidth cost:** SKP ordered sets consume a fraction of a percent of link bandwidth, and SRIS makes that cost visible.","pitfall":"Assuming SKP ordered sets carry payload. They are pure padding.","verify":"SKP interval limits and SKP ordered set structure per encoding (Base Specification, Physical Layer chapter).","follow":[{"q":"What happens if the SKP interval is too long?","a":"The elastic buffer overflows or underflows and symbols are lost, causing decode or CRC errors."},{"q":"Do SKP ordered sets pass through switches?","a":"No. They are link-local and are regenerated on each link."}],"mod":3},{"id":"3.07","level":"Intermediate","type":"Concept","fig":null,"tags":["polarity","lane-reversal","deskew"],"q":"What are polarity inversion, lane reversal and lane-to-lane skew, and who handles them?","short":"Polarity inversion (D+ and D- swapped on a lane) is detected and corrected automatically by the receiver during Polling, and support is mandatory. Lane reversal (lane 0 wired to the partner's highest lane) is negotiated in the Configuration state through lane numbers and support is optional. Lane-to-lane skew is removed by the receiver's de-skew logic using ordered-set alignment across lanes.","deep":"- **Polarity:** the receiver recognizes an inverted TS1 or TS2 identifier pattern and flips that lane internally. This lets board designers route differential pairs without worrying about D+/D- order.\n- **Lane reversal:** the downstream port assigns lane numbers in Configuration. If the partner sees them in reverse order it maps them back, provided it supports reversal. It simplifies routing of connectors and mezzanine boards.\n- **De-skew:** trace length differences and electrical variation mean lanes arrive at different times. Skew is removed at the receiver using the SKP and other ordered sets that are sent simultaneously on all lanes.\n- **Failure signature:** a design that needs reversal but does not support it usually trains at x1 or fails to train.","pitfall":"Assuming any x16 device supports reversal. It is optional and some devices only support the mapping they were designed for.","verify":"Maximum tolerated lane-to-lane skew per generation and which link widths must support reversal.","follow":[{"q":"Is polarity inversion optional?","a":"No. Receivers must support it."},{"q":"Does lane reversal affect lane-to-lane numbering seen by software?","a":"Software sees logical lane numbers. Reversal is handled below the software-visible link registers."}],"mod":3},{"id":"3.08","level":"Intermediate","type":"Numeric","fig":null,"tags":["ui","nyquist","loss"],"q":"What are the unit interval and Nyquist frequency for each generation, and why do they matter?","short":"The unit interval (bit time) is 1 / rate: 400 ps at Gen1, 200 ps at Gen2, 125 ps at Gen3, 62.5 ps at Gen4, 31.25 ps at Gen5, and 31.25 ps per symbol at Gen6. Nyquist is half the symbol rate: 1.25, 2.5, 4, 8, 16 GHz, and 16 GHz for Gen6. Channel loss at the Nyquist frequency sets how much equalization is needed, and the UI sets the jitter budget.","deep":"| Gen | Symbol rate | UI | Nyquist |\n|---|---|---|---|\n| 1 | 2.5 GBaud | 400 ps | 1.25 GHz |\n| 2 | 5 GBaud | 200 ps | 2.5 GHz |\n| 3 | 8 GBaud | 125 ps | 4 GHz |\n| 4 | 16 GBaud | 62.5 ps | 8 GHz |\n| 5 | 32 GBaud | 31.25 ps | 16 GHz |\n| 6 | 32 GBaud (PAM4) | 31.25 ps | 16 GHz |\n\n- **Loss budget:** the end-to-end channel insertion loss budget grows with each generation, from roughly 22 dB at 4 GHz for Gen3, to 28 dB at 8 GHz for Gen4, to 36 dB at 16 GHz for Gen5, including package and connector contributions.\n- **Jitter budget:** a few picoseconds of jitter is a large fraction of a 31 ps UI at Gen5, which is why reference clock jitter, power noise and connector quality matter more each generation.","pitfall":"Comparing channel losses at different frequencies. Always compare at the generation's Nyquist frequency.","verify":"The channel insertion loss figures; confirm them in the Base Specification and CEM for your form factor.","follow":[{"q":"Why is Nyquist half the rate?","a":"The fastest pattern (1010...) toggles once per bit and completes a cycle every two bits, so its fundamental frequency is half the bit rate."},{"q":"Why does Gen6 not need a higher Nyquist than Gen5?","a":"PAM4 packs two bits per symbol at the same 32 GBaud symbol rate."}],"mod":3},{"id":"3.09","level":"Intermediate","type":"Concept","fig":null,"tags":["eye","jitter","ber"],"q":"What does an eye diagram show, and how do jitter and BER relate?","short":"An eye diagram overlays many bit periods so the open region shows timing margin (eye width) and voltage margin (eye height) at the sampling point. Total jitter is deterministic jitter (bounded: ISI, duty-cycle distortion, periodic) plus random jitter (Gaussian). The bit error rate target for the NRZ generations is 1e-12, which requires the eye to be open at that BER, not just on average.","deep":"- **Deterministic jitter (DJ):** bounded. Adds linearly. Caused by ISI, reflections, duty-cycle distortion, and periodic sources such as supply ripple.\n- **Random jitter (RJ):** unbounded Gaussian. To be open at BER 1e-12, total jitter is DJ plus about 14.07 times the RJ standard deviation (a 7.03 sigma one-sided margin on each side).\n- **At Gen3 and above:** the receiver cannot see an open eye before equalization, so compliance measures a behavioral eye after a reference receiver equalizer is applied in software.\n- **Practical meaning:** an eye that looks acceptable on a scope may still fail 1e-12 if its tails are wide, so BER contour or margining measurements matter.","pitfall":"Reading eye opening as a pass/fail without the BER contour or margin it was measured at.","verify":"BER targets (1e-12 for the NRZ generations) and how the Gen6 pre-FEC target is specified.","follow":[{"q":"Why 14.07 sigma?","a":"For BER 1e-12 the one-sided Gaussian tail is about 7.03 sigma, and it applies at both eye edges, so peak-to-peak random jitter is about 14.07 sigma."},{"q":"Can a good eye still give errors?","a":"Yes. Crosstalk bursts, supply noise, and non-Gaussian effects create errors the average eye does not show."}],"mod":3},{"id":"3.10","level":"Advanced","type":"Concept","fig":null,"tags":["channel","reflection","crosstalk","vias","gen5"],"q":"What makes a Gen5 channel hard to build, and what do you do about it?","short":"At 16 GHz Nyquist the channel loses much of the signal to dielectric and skin-effect loss, and every discontinuity adds reflections. Via stubs, connectors, AC-coupling capacitors and crosstalk from neighboring lanes become first-order problems. The usual answers are low-loss laminates, back-drilled vias, short routes, better connectors, and retimers when the loss budget cannot be met.","deep":"- **Loss:** dielectric loss and skin effect grow with frequency, so the insertion-loss budget is consumed quickly by long traces.\n- **Reflections:** impedance discontinuities at vias, connectors, and pads cause ISI that DFE must remove.\n- **Via stubs:** an unused stub acts as a resonator that notches out a frequency band near the signal. Back-drilling removes the stub.\n- **Crosstalk:** near-end and far-end crosstalk from adjacent lanes adds noise that equalization cannot remove.\n- **System-level:** connectors, risers, cables and backplane traces each add loss. Retimers reset the budget by regenerating the signal, splitting the channel into two shorter segments.\n- **Validation angle:** the same silicon behaves differently in every platform, so link margin has to be measured per platform rather than assumed from a compliance result.","pitfall":"Assuming a channel that met the budget in simulation will meet it in the system. Real vias, connectors and assembly variation add loss and crosstalk.","verify":null,"follow":[{"q":"Why does a via stub matter more at higher speed?","a":"Its resonant frequency falls inside the signal band, causing a deep loss notch and strong reflections."},{"q":"Retimer versus lower-loss board material?","a":"Material is cheaper and adds no latency, but retimers are the fix when reach or connectors exceed the loss budget."}],"mod":3},{"id":"3.11","level":"Advanced","type":"Concept","fig":null,"tags":["margining","gen4","validation"],"q":"How does lane margining work, and what do you read from it?","short":"Lane margining lets a receiver measure its own timing and voltage margin while the link is in L0 and carrying traffic. Software uses the Lane Margining at the Receiver extended capability to command a lane to shift its sampling point left or right (timing
