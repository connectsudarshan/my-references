<title>Python Principal Engineer Interview Guide</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>

:root{
  color-scheme:dark;
  --bg:#0e2036; --bg-panel:#123049; --bg-sidebar:#0a1a2c;
  --line:#2f5578; --line-soft:#1c3852;
  --accent:#ffd43b; --accent-dim:#c9a93a; --py-blue:#6aa7de;
  --text:#e7eef6; --text-dim:#8fa9c2; --text-faint:#6a86a3;
  --code-bg:#081422; --good:#9fdf9f; --bad:#ff9d9d; --violet:#c3a6ff;
  --t-concept:#6aa7de; --t-design:#c3a6ff; --t-scenario:#6fd6c6; --t-debug:#ff9d9d; --t-trap:#ffb454; --t-review:#9fdf9f;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;}
body{background-color:var(--bg);background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed;min-height:100vh;}
::selection{background:var(--accent);color:#0e2036;}
code{font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;}
.app{display:flex;min-height:100vh;}

.sidebar{width:330px;flex-shrink:0;background:var(--bg-sidebar);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;}
.sidebar-header{padding:20px 20px 14px;border-bottom:1px solid var(--line);}
.kicker{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.08em;color:var(--accent);margin:0 0 6px;}
.sidebar-header h1{font-size:17px;margin:0 0 10px;font-weight:600;line-height:1.3;cursor:pointer;}
.stat-row{display:flex;gap:12px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);}
.stat-row b{color:var(--accent);font-variant-numeric:tabular-nums;}
.search-box{padding:12px 16px;border-bottom:1px solid var(--line);}
.search-box input{width:100%;background:var(--bg-panel);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:5px;font-family:inherit;font-size:13.5px;outline:none;}
.search-box input:focus{border-color:var(--accent);}
.search-box input::placeholder{color:var(--text-faint);}
.filter-row{padding:10px 16px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);}
.chip{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:4px 9px;border-radius:12px;border:1px solid var(--line);color:var(--text-dim);cursor:pointer;user-select:none;background:none;display:inline-flex;align-items:center;gap:6px;}
.chip .d{width:7px;height:7px;border-radius:50%;}
.chip.active{background:var(--bg-panel);color:var(--text);border-color:var(--accent);}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.nav-groups{flex:1;overflow-y:auto;padding-bottom:30px;}
.nav-group-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.05em;padding:14px 18px 6px;color:var(--text-faint);cursor:pointer;display:flex;justify-content:space-between;gap:8px;line-height:1.4;}
.nav-group-label:hover{color:var(--text);}
.nav-item{display:flex;align-items:baseline;gap:8px;padding:6px 16px 6px 22px;cursor:pointer;font-size:13px;color:var(--text-dim);border-left:2px solid transparent;line-height:1.4;}
.nav-item:hover{background:rgba(255,255,255,0.03);color:var(--text);}
.nav-item.active{background:rgba(255,212,59,0.08);color:var(--accent);border-left-color:var(--accent);}
.nav-item .qnum{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-faint);min-width:28px;flex-shrink:0;}
.nav-item .tdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;align-self:flex-start;margin-top:6px;}
.nav-item .known{margin-left:auto;color:var(--good);font-size:11px;}
.empty{color:var(--text-faint);font-size:13px;padding:14px 18px;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{padding:14px 40px;border-bottom:1px solid var(--line);background:rgba(14,32,54,0.9);backdrop-filter:blur(6px);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.crumb{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-faint);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.crumb .current{color:var(--accent);}
.tb-actions{display:flex;gap:8px;align-items:center;flex-shrink:0;}
.btn{background:var(--bg-panel);border:1px solid var(--line);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:7px 12px;border-radius:5px;cursor:pointer;transition:border-color .15s,color .15s;}
.btn:hover,.btn:focus-visible{border-color:var(--accent);color:var(--accent);outline:none;}
.btn:disabled{opacity:.35;cursor:default;border-color:var(--line);color:var(--text);}
.btn.on{border-color:var(--accent);color:var(--accent);}
.btn.done{border-color:var(--good);color:var(--good);}
.menu-btn{display:none;}

.content{padding:40px 56px 100px;max-width:960px;}
.qcard{animation:fadein .2s ease;}
@keyframes fadein{from{opacity:.4;transform:translateY(4px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.qcard{animation:none;}}
.q-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.badge{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.06em;padding:3px 8px;border-radius:3px;color:#0e2036;}
.badge.Principal{background:var(--violet);} .badge.Advanced{background:var(--py-blue);}
.badge.type{background:none;border:1px solid var(--line);color:var(--text-dim);font-weight:600;display:inline-flex;gap:6px;align-items:center;}
.badge.type .d{width:7px;height:7px;border-radius:50%;}
.q-num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-faint);}
.q-title{font-size:25px;line-height:1.35;margin:0 0 22px;font-weight:650;text-wrap:balance;}
.q-title code,.md code{background:rgba(255,255,255,0.07);padding:1px 6px;border-radius:3px;font-size:0.86em;color:#ffe58a;}
.md p{margin:0 0 10px;} .md p:last-child{margin:0;}
.md ul,.md ol{margin:4px 0 12px;padding-left:22px;} .md li{margin:4px 0;}
.md strong{color:#fff;}
.short{font-size:16px;line-height:1.7;padding:16px 20px;background:var(--bg-panel);border-left:3px solid var(--accent);border-radius:0 4px 4px 0;}
.deep{font-size:15px;line-height:1.75;color:#d5e1ed;}
.section-label{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.1em;color:var(--accent-dim);margin:32px 0 14px;display:flex;align-items:center;gap:10px;}
.section-label::after{content:'';flex:1;height:1px;background:var(--line);}
.reveal{display:flex;justify-content:center;padding:26px;border:1px dashed var(--line);border-radius:6px;background:rgba(18,48,73,0.5);}
.code-stack{display:flex;flex-direction:column;gap:22px;margin-top:6px;}
.code-wrap{position:relative;}
.code-label{position:absolute;top:-11px;left:16px;background:var(--accent);color:#0e2036;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.05em;padding:2px 8px;border-radius:3px;}
.code-label.out{background:var(--good);}
pre{background:var(--code-bg);border:1px solid var(--line-soft);border-radius:6px;padding:20px 22px;overflow-x:auto;margin:0;}
pre code{font-size:13px;line-height:1.65;}
.out-wrap pre{background:#06101b;border-style:dashed;color:#cfe8cf;}
.out-wrap pre code{font-size:12.5px;}
.follow{display:flex;flex-direction:column;gap:8px;}
.follow details{background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:6px;}
.follow summary{cursor:pointer;padding:11px 14px;font-size:14.5px;font-weight:600;list-style:none;display:flex;gap:10px;}
.follow summary::-webkit-details-marker{display:none;}
.follow summary::before{content:'›';color:var(--text-faint);font-family:'IBM Plex Mono',monospace;transition:transform .15s;}
.follow details[open] summary::before{transform:rotate(90deg);}
.follow summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
.follow .fa{padding:0 14px 12px 32px;font-size:14px;line-height:1.65;color:var(--text-dim);}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px;}
.box{padding:14px 16px;border-radius:6px;font-size:14px;line-height:1.65;}
.box h4{margin:0 0 6px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.08em;}
.box.pit{border:1px solid rgba(255,157,157,0.35);background:rgba(255,157,157,0.06);} .box.pit h4{color:var(--bad);}
.box.sig{border:1px solid rgba(195,166,255,0.35);background:rgba(195,166,255,0.06);} .box.sig h4{color:var(--violet);}
.q-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px;}
.footer-nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px;padding-top:22px;border-top:1px solid var(--line-soft);}
.footer-nav .btn{padding:10px 16px;font-size:12.5px;text-align:left;}
.footer-nav .dir{color:var(--text-faint);font-size:10px;display:block;}
.kbd-hint{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-faint);margin-top:14px;}

.home-hero h2{font-size:34px;margin:0 0 10px;line-height:1.15;text-wrap:balance;}
.home-hero p{font-size:16px;line-height:1.7;color:var(--text-dim);max-width:72ch;margin:0;}
.home-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:22px 0 8px;}
.stat-box{background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:6px;padding:12px 14px;}
.stat-box .n{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;}
.stat-box .l{font-size:12px;color:var(--text-dim);margin-top:2px;}
.framework{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;}
.framework div{background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:6px;padding:12px 14px;}
.framework b{display:flex;gap:8px;align-items:baseline;font-size:14px;margin-bottom:4px;}
.framework b span{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#0e2036;background:var(--accent);border-radius:3px;padding:1px 6px;}
.framework p{margin:0;font-size:13px;color:var(--text-dim);line-height:1.55;}
.levels{margin:0;padding-left:18px;color:var(--text-dim);font-size:14.5px;line-height:1.75;max-width:78ch;}
.levels b{color:var(--text);}
.section-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;}
.section-card{background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:6px;padding:13px 15px;cursor:pointer;text-align:left;color:var(--text);font:inherit;transition:border-color .15s,transform .15s;}
.section-card:hover,.section-card:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none;}
.sc-title{font-weight:600;font-size:14px;margin-bottom:5px;}
.sc-desc{font-size:12.5px;color:var(--text-dim);line-height:1.5;margin-bottom:8px;}
.sc-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-faint);}
.bar{height:3px;background:var(--line-soft);border-radius:2px;margin-top:8px;overflow:hidden;}
.bar span{display:block;height:100%;background:var(--good);}

@media(max-width:900px){
  .sidebar{position:fixed;left:-340px;z-index:20;transition:left .2s;box-shadow:8px 0 24px rgba(0,0,0,0.4);height:100%;padding-top:env(safe-area-inset-top,0px);}
  .sidebar.open{left:0;}
  .content{padding:28px 16px 80px;}
  .topbar{padding:10px 16px;}
  .menu-btn{display:inline-block;}
  .q-title{font-size:21px;}
  .boxes{grid-template-columns:1fr;}
  .tb-actions .hide-sm{display:none;}
}

<script>
const DATA = {"modules": [{"id": 1, "title": "CPython Internals & Execution Model", "desc": "What really happens between source and result: compilation, the eval loop, the specializing interpreter, the GIL, free-threading and subinterpreters."}, {"id": 2, "title": "Memory & the Object Model", "desc": "Object layout, reference counting and cycles, allocator behaviour, leak hunting in long-running services, and choosing the right data representation for millions of records."}, {"id": 3, "title": "Concurrency Architecture", "desc": "Choosing and combining asyncio, threads and processes for real systems: orchestration of many devices, cancellation, backpressure, deadlock diagnosis and rate-limited I/O."}, {"id": 4, "title": "Performance Engineering", "desc": "A measurement-first method: profiling, algorithmic fixes, pushing work into C, caching correctly, benchmarking without fooling yourself, startup time and zero-copy binary processing."}, {"id": 5, "title": "Designing Large Python Codebases", "desc": "Structure, boundaries and contracts for code many teams share: layering and enforced dependencies, typing strategy, library API design and deprecation, version migrations, configuration, plugins and code review."}, {"id": 6, "title": "Test Framework Architecture", "desc": "Designing pytest-based validation frameworks for hardware: fixtures and device lifecycle, plugins and hooks, parallel runs across device pools, flaky-test management, reproducibility and testing the framework itself."}, {"id": 7, "title": "Hardware, Binary Data & System Interfaces", "desc": "Python at the boundary with devices: parsing binary log pages, decoding registers, building ioctl structures with ctypes, driving CLI tools safely, verifying data integrity at speed and capturing serial consoles."}, {"id": 8, "title": "Reliability, Errors & Observability", "desc": "Error-handling strategy for long-running systems, context-rich structured logging, deadlines, graceful shutdown, crash forensics, metrics, and resumable campaigns with atomic writes."}, {"id": 9, "title": "Security, Packaging & Delivery", "desc": "Unsafe deserialization, injection and path traversal, secrets in logs, supply-chain security, distributing tools to lab machines, and CI/CD quality gates for Python."}, {"id": 10, "title": "Technical Leadership & System Design", "desc": "How a Principal engineer decides and influences: rewrite requests, risky pull requests, org-wide standards, end-to-end results pipelines, silent-failure postmortems, mentoring and language choices."}], "questions": [{"type": "Concept", "level": "Principal", "question": "Walk me through what CPython does when you run `python app.py`.", "short": "The source is tokenized and parsed (PEG parser) into an AST, a symbol table decides which names are local, global or closure cells, and the compiler emits **bytecode** in code objects. The interpreter's eval loop then executes that bytecode frame by frame. Imported modules go through the same steps once, and their bytecode is cached as `.pyc` in `__pycache__`.", "deep": "The pipeline has five stages, and knowing them explains many everyday behaviours:\n\n1. **Tokenize and parse**: the PEG parser (3.9+) builds an AST. Syntax errors come from here, which is why they are raised before any code runs.\n2. **Symbol table**: for each scope the compiler decides whether a name is local, global, free (closure) or cell. That is why assigning to a name *anywhere* in a function makes it local everywhere in that function (the classic `UnboundLocalError`).\n3. **Compile**: the AST becomes code objects (`co_code`, `co_consts`, `co_varnames`, ...). Constant folding happens here (`24 * 60 * 60` becomes `86400`).\n4. **Execute**: the eval loop (`_PyEval_EvalFrameDefault`) runs instructions on a per-call **frame**. Since 3.11 frames are lightweight and allocated on a per-thread data stack; full frame objects are only materialized when something (a traceback, `sys._getframe`) needs them.\n5. **Import caching**: `import x` compiles `x.py` once, writes `__pycache__/x.cpython-314.pyc`, and later runs reuse it when the source timestamp or hash still matches. The main script itself is never cached.\n\nAt Principal level, connect this to consequences: startup time is dominated by imports; per-call overhead is frame setup; and CPython 3.11+ got 10-60% faster largely by making frames cheaper and specializing bytecode.", "code": "import ast, dis\n\nsrc = \"def area(r):\\n    seconds = 24 * 60 * 60\\n    return 3.14159 * r * r\\n\"\ntree = ast.parse(src)\nprint(\"AST root:\", type(tree).__name__, \"->\", type(tree.body[0]).__name__)\n\ncode = compile(tree, \"<demo>\", \"exec\")\nfn_code = code.co_consts[0]\nprint(\"function code object:\", fn_code.co_name, \"| locals:\", fn_code.co_varnames)\nprint(\"constants (note folding of 24*60*60):\", fn_code.co_consts)\ndis.dis(fn_code)", "follow": ["Why is a syntax error in one branch of a function reported even if that branch never runs? => Because parsing and compilation happen for the whole module before execution starts; the eval loop never sees invalid code.", "What invalidates a `.pyc`? => By default the source file's mtime and size recorded in the `.pyc` header; with hash-based pycs (PEP 552, used for reproducible builds) the source hash. Different Python versions use different file names (`cpython-314`), so they never collide.", "Where does time go when a CLI takes 2 seconds to print `--help`? => Almost always imports: module execution at import time plus disk I/O. Measure with `python -X importtime` before optimizing anything else."], "pitfall": "Saying Python is \"interpreted, not compiled\". CPython compiles to bytecode every time; the distinction that matters is ahead-of-time machine code (no) versus bytecode run by a VM (yes), with an experimental JIT since 3.13.", "signals": "You describe the stages in order, tie at least one of them to a practical consequence (UnboundLocalError, import-time cost, constant folding), and know which version introduced the relevant change.", "module": 1, "output": "AST root: Module -> FunctionDef\nfunction code object: area | locals: ('r', 'seconds')\nconstants (note folding of 24*60*60): (24, 3.14159, 86400)\n  1           RESUME                   0\n\n  2           LOAD_CONST               2 (86400)\n              STORE_FAST               1 (seconds)\n\n  3           LOAD_CONST               1 (3.14159)\n              LOAD_FAST_BORROW         0 (r)\n              BINARY_OP                5 (*)\n              LOAD_FAST_BORROW         0 (r)\n              BINARY_OP                5 (*)\n              RETURN_VALUE", "num": 1}, {"type": "Concept", "level": "Principal", "question": "What is the specializing adaptive interpreter (PEP 659), and how can code make it faster or slower?", "short": "Since 3.11, CPython rewrites hot bytecode instructions in place into **specialized** versions for the types it actually observes (e.g. `BINARY_OP` becomes `BINARY_OP_ADD_INT`, `LOAD_ATTR` becomes `LOAD_ATTR_INSTANCE_VALUE`), using inline caches. If the assumption breaks, the instruction de-optimizes. Type-stable (\"monomorphic\") code benefits most.", "deep": "After an instruction runs a few times (\"warm-up\"), the interpreter replaces it with a specialized variant that skips generic dispatch: integer addition without the full number protocol, attribute loads that jump straight to a known slot, global loads guarded by a dict version, calls to Python functions without building a new C frame.\n\nEach specialized instruction has **guards**. When a guard fails repeatedly (a different type shows up), the instruction goes back to the adaptive form and may re-specialize later.\n\nWhat this means in practice:\n\n- Keep hot loops **type-stable**: mixing `int` and `float`, or passing many different classes through the same line, reduces specialization.\n- Avoid changing class attributes or module globals inside hot paths; version tags invalidate caches.\n- Consistent object shapes (set all attributes in `__init__`, or use `__slots__`) help attribute specialization.\n- This is also the foundation the experimental JIT (3.13+, `PYTHON_JIT=1` builds) compiles from.\n\nTooling: `dis.dis(fn, adaptive=True)` shows the specialized instructions after warm-up.", "code": "import dis\n\ndef total(values):\n    s = 0\n    for v in values:\n        s = s + v\n    return s\n\nfor _ in range(50):                    # warm up with ints only\n    total(list(range(100)))\n\nops = [i.opname for i in dis.get_instructions(total, adaptive=True)]\nprint(\"specialized:\", sorted({o for o in ops if \"_\" in o and o.startswith((\"BINARY_OP\", \"FOR_ITER\", \"LOAD_FAST\", \"STORE_FAST\"))}))", "follow": ["Why might a function slow down after refactoring to accept both `int` and `Decimal`? => The same `BINARY_OP` now sees two types; specialization for `int` fails its guard and the instruction de-optimizes to the generic path.", "Does this make Python as fast as a JIT-compiled language? => No. It removes dispatch overhead per instruction (roughly 1.25x average on pyperformance for 3.11), but values are still boxed objects. For numeric hot loops, vectorize (NumPy) or move to compiled code."], "pitfall": "Micro-optimizing by hand (caching methods in locals, etc.) based on advice written for Python 3.7. Many of those tricks matter much less now; always measure on the version you run.", "signals": "You can name concrete specialized instructions, explain guards and de-optimization, and translate that into coding guidance (type stability, consistent object shapes) rather than folklore.", "module": 1, "output": "specialized: ['BINARY_OP_ADD_INT', 'FOR_ITER_LIST', 'LOAD_FAST_BORROW', 'LOAD_FAST_BORROW_LOAD_FAST_BORROW', 'STORE_FAST']", "num": 2}, {"type": "Concept", "level": "Principal", "question": "How does the GIL actually hand control between threads, and which work truly runs in parallel?", "short": "A thread holding the GIL runs until it blocks on I/O or until another thread has waited for the **switch interval** (5 ms by default, `sys.getswitchinterval()`); the waiting thread sets an \"eval breaker\" flag and the running thread drops the GIL at the next check. C code that releases the GIL (I/O, `hashlib` on large buffers, `zlib`, NumPy kernels) runs truly in parallel.", "deep": "Mechanics (since the \"new GIL\" in 3.2):\n\n- A thread that wants the GIL waits on a condition variable with a timeout equal to the switch interval.\n- On timeout it sets a **drop request**; the running thread checks the eval breaker between bytecode instructions (at specific points like backward jumps and calls) and releases the GIL.\n- The OS decides which waiting thread wins next, so fairness is not guaranteed.\n\nConsequences you should mention:\n\n- Pure-Python CPU work gets no speed-up from threads, and can even slow down because of lock hand-offs (the \"convoy effect\" when an I/O thread must reacquire the GIL behind a CPU thread).\n- Blocking I/O releases the GIL, so threads are fine for sockets, files and subprocess waits.\n- C extensions that wrap long computations in `Py_BEGIN_ALLOW_THREADS` run in parallel: `hashlib` releases the GIL for data larger than about 2 KiB, `zlib` for compression, and NumPy for most kernels. Many \"Python is slow at X\" arguments disappear when the heavy lifting is in such code.\n- `sys.setswitchinterval()` trades latency for throughput, but it's rarely the right knob.", "code": "import hashlib, os, sys, time\nfrom concurrent.futures import ThreadPoolExecutor\n\nprint(\"switch interval:\", sys.getswitchinterval(), \"s\")\nblocks = [os.urandom(40 * 1024 * 1024) for _ in range(4)]          # 4 x 40 MB\n\ndef digest(b): return hashlib.sha256(b).hexdigest()[:8]\ndef py_work(b): return sum(i * i for i in range(1_500_000))       # pure Python loop, holds the GIL\n\nfor name, fn in ((\"hashlib (releases GIL)\", digest), (\"pure Python\", py_work)):\n    t = time.perf_counter(); [fn(b) for b in blocks]; serial = time.perf_counter() - t\n    t = time.perf_counter()\n    with ThreadPoolExecutor(4) as ex: list(ex.map(fn, blocks))\n    par = time.perf_counter() - t\n    print(f\"{name:24} serial {serial:.2f}s  4 threads {par:.2f}s  speed-up x{serial / par:.1f}\")", "follow": ["A service has one CPU-heavy thread and many I/O threads, and I/O latency is terrible. Why? => Convoy effect: every time an I/O thread wakes it must wait up to a switch interval for the CPU thread to drop the GIL. Move the CPU work to a process pool or a GIL-releasing library.", "How would you check whether a C extension releases the GIL? => Read its source for `Py_BEGIN_ALLOW_THREADS`, or measure: run the call in N threads and compare wall time with serial, as in the example."], "pitfall": "Claiming \"threads are useless in Python\". They are the right tool for blocking I/O and for C-level work that releases the GIL; they are only useless for pure-Python CPU loops.", "signals": "You explain the drop-request mechanism, give examples of GIL-releasing libraries, and back the claim with a measurement instead of an assertion.", "module": 1, "output": "switch interval: 0.005 s\nhashlib (releases GIL)   serial 0.08s  4 threads 0.03s  speed-up x2.7\npure Python              serial 0.30s  4 threads 0.29s  speed-up x1.0", "num": 3}, {"type": "Design", "level": "Principal", "question": "Python 3.14 officially supports the free-threaded (no-GIL) build. Would you move your organization's test infrastructure to it? How?", "short": "Not wholesale. I'd adopt it where there's a measured benefit: CPU-bound work that is currently forced into multiprocessing because of the GIL. First verify that every C extension we use supports free-threading, accept about 5-10% single-thread overhead, fix code that relied on the GIL for correctness, and roll out behind a separate interpreter build in CI before production.", "deep": "**Why it could help**: tasks like verifying data patterns, parsing large logs or computing statistics across devices could use threads instead of processes, avoiding pickling costs and memory duplication.\n\n**Costs and risks to evaluate:**\n\n- **Single-thread performance**: the free-threaded build is slower for single-threaded code (the 3.14 target is roughly 5-10% overhead) because of biased reference counting and per-object locks.\n- **C extensions**: a module must declare support (`Py_mod_gil`); importing one that doesn't **re-enables the GIL** for the process (with a warning), silently removing the benefit. Check `sys._is_gil_enabled()` at startup.\n- **Hidden races**: built-in containers stay internally consistent (per-object locks), but compound operations like `d[k] = d.get(k, 0) + 1` or check-then-act were never atomic; the GIL just made races rare. Expect latent bugs to surface.\n- **Tooling**: profilers, debuggers and some pip wheels (`cp314t` tags) may lag.\n\n**Rollout plan:**\n\n1. Inventory dependencies and their free-threading status; build a compatibility matrix.\n2. Add a CI job on `python3.14t` running the framework's unit tests with thread-sanitizing stress tests.\n3. Pick one CPU-bound workload, benchmark GIL vs no-GIL vs multiprocessing on real data.\n4. Ship it for that workload only, with `sys._is_gil_enabled()` asserted and metrics on throughput.\n5. Expand based on data; keep the default build for everything else.", "code": "import sys, sysconfig\n\nfree_threaded_build = bool(sysconfig.get_config_var(\"Py_GIL_DISABLED\"))\ngil_active = sys._is_gil_enabled() if hasattr(sys, \"_is_gil_enabled\") else True\nprint(f\"free-threaded build: {free_threaded_build} | GIL currently enabled: {gil_active}\")\n\n# A check-then-act that is NOT atomic even though dict operations are thread-safe:\ncounts = {}\ndef record(key):\n    counts[key] = counts.get(key, 0) + 1      # read + write: two operations, can race\n# Safe alternatives: a threading.Lock around it, collections.Counter per thread merged later,\n# or queue-based aggregation in a single consumer thread.\nprint(\"record() is only safe under a lock or single-writer design\")", "follow": ["How do you guarantee the GIL didn't silently come back in production? => Log and assert `sys._is_gil_enabled()` after all imports at startup, and export it as a metric; also run with `-X gil=0` / `PYTHON_GIL=0` only after confirming extensions are compatible.", "Wouldn't subinterpreters be a safer route to parallelism? => For isolated tasks, yes: `concurrent.interpreters` (3.14) gives each interpreter its own GIL with no shared objects, so existing code has fewer race risks, at the cost of explicit data passing."], "pitfall": "Assuming code is thread-safe because \"it worked under the GIL\". The GIL protected interpreter internals, never your application's invariants.", "signals": "You balance benefit against measured costs, mention extension compatibility and the silent GIL re-enable, and give a staged rollout with a success metric.", "module": 1, "output": "free-threaded build: False | GIL currently enabled: True\nrecord() is only safe under a lock or single-writer design", "num": 4}, {"type": "Trap", "level": "Principal", "question": "Is `counter += 1` thread-safe in CPython? Is `list.append`? Prove it.", "short": "`list.append(x)` is a single C-level operation, so it's atomic with the GIL (and protected by a per-object lock in free-threaded builds). `counter += 1` compiles to separate load, add and store instructions, so a thread switch between them loses updates. Never rely on it; use a `Lock` or a single-writer design.", "deep": "`dis` makes the difference visible: `counter += 1` on a global is `LOAD_GLOBAL`, `LOAD_SMALL_INT`/`LOAD_CONST`, `BINARY_OP (+=)`, `STORE_GLOBAL`. The GIL can be dropped between any two of those.\n\nOperations that are effectively atomic today (single bytecode calling one C function on a built-in type): `list.append`, `list.pop`, `dict[k] = v`, `dict.setdefault`, `deque.append/popleft`. Operations that are not: `+=` on anything shared, `if k not in d: d[k] = ...`, `lst[i] = lst[i] + 1`, iterating a dict while another thread mutates it.\n\nEven the \"atomic\" list is only a documented implementation property of CPython, not a language guarantee. A Principal answer: design so correctness doesn't depend on it (locks, `queue.Queue`, per-thread accumulation then merge).", "code": "import dis, threading, time\n\ncounter = 0\ndef unsafe_inc():\n    global counter\n    counter += 1\n\nprint([i.opname for i in dis.get_instructions(unsafe_inc) if i.opname not in (\"RESUME\", \"RETURN_CONST\", \"RETURN_VALUE\", \"LOAD_CONST\")])\n\n# Force the race to show up by yielding between read and write\ncounter = 0\ndef worker():\n    global counter\n    for _ in range(2000):\n        tmp = counter\n        time.sleep(0)            # a thread switch here is always possible\n        counter = tmp + 1\nts = [threading.Thread(target=worker) for _ in range(4)]\n[t.start() for t in ts]; [t.join() for t in ts]\nprint(\"counter:\", counter, \"expected 8000\")\n\nitems = []\ndef appender():\n    for i in range(20000): items.append(i)\nts = [threading.Thread(target=appender) for _ in range(4)]\n[t.start() for t in ts]; [t.join() for t in ts]\nprint(\"list.append items:\", len(items), \"expected 80000\")", "follow": ["Is `x = y` (a simple assignment) atomic? => Rebinding a name is a single store, so readers see either the old or new object, never a torn value. But the combination read-modify-write still isn't.", "How do you aggregate counters from many threads without a lock per increment? => Give each thread its own `Counter` and merge at the end, or send events through a `queue.Queue` to a single aggregator thread."], "pitfall": "Answering \"yes, because of the GIL\". The GIL makes individual bytecodes atomic, not Python statements.", "signals": "You show the bytecode, distinguish single C calls from compound statements, and propose designs that don't depend on implementation details.", "module": 1, "output": "['LOAD_GLOBAL', 'LOAD_SMALL_INT', 'BINARY_OP', 'STORE_GLOBAL']\ncounter: 2256 expected 8000\nlist.append items: 80000 expected 80000", "num": 5}, {"type": "Concept", "level": "Principal", "question": "Why is local variable access faster than global access, and does that still matter?", "short": "Locals live in a fixed array in the frame and are read with `LOAD_FAST` (an index). Globals and builtins need dictionary lookups (`LOAD_GLOBAL`), although 3.11+ caches them with dict version guards. In modern CPython the gap is small; it only matters in very hot loops, and algorithmic changes matter far more.", "deep": "The compiler knows every local name at compile time, so it assigns each a slot index (`co_varnames`). `LOAD_FAST 3` is one array read. Names not local are resolved at runtime: first the module globals dict, then builtins. Since 3.11 the specializing interpreter turns `LOAD_GLOBAL` into `LOAD_GLOBAL_MODULE`/`LOAD_GLOBAL_BUILTIN`, which checks a dict **version tag** and reads a cached index, so repeated global access is much cheaper than it used to be.\n\nClosures use **cell** objects: `co_cellvars` in the outer function and `co_freevars` in the inner one, accessed with `LOAD_DEREF`, which adds one indirection.\n\nPractical guidance: aliasing a global function to a local (`append = out.append`) used to give 10-30% in tight loops; on 3.12+ it's often in the single digits. Mention it only as a last-mile optimization after profiling.", "code": "import math, timeit\n\ndef use_global(n=200_000):\n    s = 0.0\n    for i in range(n):\n        s += math.sqrt(i)\n    return s\n\ndef use_local(n=200_000):\n    s, sqrt = 0.0, math.sqrt\n    for i in range(n):\n        s += sqrt(i)\n    return s\n\nfor f in (use_global, use_local):\n    print(f\"{f.__name__:10} {min(timeit.repeat(f, number=5, repeat=5)) / 5 * 1000:.1f} ms\")\nprint(\"locals:\", use_local.__code__.co_varnames)", "follow": ["What does `LOAD_DEREF` indicate in `dis` output? => A read of a closure variable through a cell object: the variable is shared between an outer function and an inner function.", "Why can't you add a local variable with `locals()['x'] = 1` inside a function? => Locals are array slots fixed at compile time; `locals()` returns a snapshot (3.13's PEP 667 made its semantics well-defined), so writes don't create new fast locals."], "pitfall": "Presenting local-aliasing as a key optimization. On current CPython the benefit is small; profiling usually points to I/O, algorithms or data structures instead.", "signals": "You explain slots vs dict lookups, know that 3.11+ specialization narrowed the gap, and quantify with a measurement.", "module": 1, "output": "use_global 9.8 ms\nuse_local  8.5 ms\nlocals: ('n', 's', 'sqrt', 'i')", "num": 6}, {"type": "Concept", "level": "Principal", "question": "Compare threads, processes and subinterpreters (PEP 734) for parallel work in Python 3.14.", "short": "Threads share everything and are limited by the GIL for Python code. Processes have separate memory and GILs, true parallelism, but pay for pickling and memory duplication. **Subinterpreters** (`concurrent.interpreters`, `InterpreterPoolExecutor` in 3.14) run in one process, each with its own GIL and isolated objects: parallel like processes, cheaper to start, but data must be passed explicitly and extension modules must support them.", "deep": "Comparison:\n\n- **Isolation**: threads share all objects (races possible); processes and subinterpreters share nothing by default.\n- **Parallel Python bytecode**: threads no (unless free-threaded build); processes yes; subinterpreters yes (per-interpreter GIL since 3.12).\n- **Startup and memory**: threads cheapest; subinterpreters much cheaper than spawning processes; processes most expensive (a whole interpreter plus imports per worker).\n- **Data exchange**: threads by reference; processes by pickling over pipes; subinterpreters by pickling or through shareable types and `concurrent.interpreters` queues.\n- **Compatibility**: subinterpreters need extension modules that support multi-phase init and per-interpreter state; many popular C extensions are still catching up.\n\nRule of thumb for a Principal answer: I/O-bound, use threads or asyncio; CPU-bound with heavy dependencies, use processes; CPU-bound pure-Python or stdlib work with strict isolation, consider subinterpreters and benchmark.", "code": "from concurrent.futures import InterpreterPoolExecutor, ProcessPoolExecutor, ThreadPoolExecutor\nimport time\n\nJOBS = [range(40_000_000)] * 8          # sum(range) runs in C but HOLDS the GIL\n\ndef bench(executor_cls):\n    t = time.perf_counter()\n    with executor_cls(max_workers=4) as ex:\n        results = list(ex.map(sum, JOBS))\n    return time.perf_counter() - t\n\nif __name__ == \"__main__\":\n    t = time.perf_counter(); [sum(r) for r in JOBS]\n    print(f\"{'serial':24} {(time.perf_counter() - t) * 1000:5.0f} ms\")\n    for cls in (ThreadPoolExecutor, InterpreterPoolExecutor, ProcessPoolExecutor):\n        print(f\"{cls.__name__:24} {bench(cls) * 1000:5.0f} ms  (4 workers, includes startup)\")", "follow": ["When would subinterpreters beat processes? => Many short-lived isolated tasks where process startup and memory per worker dominate, and the libraries involved support subinterpreters.", "Why can't you just pass a live database connection to another interpreter? => Objects are not shared between interpreters; you pass data (pickled or shareable types) and each interpreter opens its own resources."], "pitfall": "Treating subinterpreters as a drop-in replacement for threads. They isolate state, so code that relies on shared module-level objects must be redesigned.", "signals": "You compare isolation, parallelism, startup cost, data passing and compatibility, and end with a clear decision rule plus \"benchmark it\".", "module": 1, "output": "serial                    2020 ms\nThreadPoolExecutor        2001 ms  (4 workers, includes startup)\nInterpreterPoolExecutor    723 ms  (4 workers, includes startup)\nProcessPoolExecutor        798 ms  (4 workers, includes startup)", "num": 7}, {"type": "Debug", "level": "Principal", "question": "A long-running Python service (or test orchestrator) grows from 300 MB to 6 GB over three days. How do you find the cause?", "short": "First decide whether it's a **leak** (live objects accumulating) or **fragmentation/allocator retention** (freed memory not returned to the OS). Compare RSS with the Python heap from `tracemalloc`; if the traced heap grows, take periodic snapshots and diff them by traceback to find the allocation site; if it doesn't, suspect C extensions or fragmentation, and use memray or native tools. Then fix the root cause and add a memory metric with an alert.", "deep": "A structured approach an interviewer wants to hear:\n\n1. **Characterize**: steady linear growth suggests an unbounded cache or list; step growth suggests specific requests or test types; sawtooth that never returns to baseline suggests fragmentation. Correlate with workload metrics.\n2. **Python heap vs process**: `tracemalloc.get_traced_memory()` shows memory allocated through Python's allocators. If RSS grows but traced memory is flat, the growth is in C extensions, native libraries or allocator retention.\n3. **Snapshot diffing**: enable `tracemalloc.start(25)` (frames of traceback), take a snapshot at t0 and t1, and use `snapshot.compare_to(old, \"traceback\")`. The top entries show which lines keep allocating memory that stays alive.\n4. **Who holds the objects?**: `gc.get_referrers(obj)`, `objgraph.show_backrefs`, or memray's flame graphs. Typical culprits: module-level dicts used as caches, `lru_cache` on methods (keeps `self` alive), listeners never unsubscribed, exceptions stored with tracebacks (keeping frames and locals), growing `logging` handlers, per-request data stored on long-lived objects.\n5. **Fix and guard**: bound caches (`maxsize`, TTL), weak references, explicit cleanup; add an RSS and heap metric; for fragmentation, recycle workers (`max_requests` in gunicorn, `maxtasksperchild` in multiprocessing).\n\nIn production, tracemalloc has overhead (roughly 2x memory for tracking and noticeable CPU), so enable it on one canary instance or on demand via a signal/endpoint.", "code": "import tracemalloc, gc\n\nclass ResultCache:                                  # the \"leak\": unbounded, never evicted\n    _store = {}\n    @classmethod\n    def remember(cls, run_id, payload): cls._store[run_id] = payload\n\ndef handle_test_run(run_id):\n    log_lines = [f\"{run_id}: step {i} OK\" for i in range(200)]\n    ResultCache.remember(run_id, log_lines)         # keeps every run's logs forever\n\ntracemalloc.start(10)\nfor i in range(200): handle_test_run(f\"warmup-{i}\")\nbefore = tracemalloc.take_snapshot()\nfor i in range(2000): handle_test_run(f\"run-{i}\")\nafter = tracemalloc.take_snapshot()\n\ntop = after.compare_to(before, \"lineno\")\nfor stat in top[:2]:\n    frame = stat.traceback[0]\n    print(f\"+{stat.size_diff / 1024:8.0f} KiB  +{stat.count_diff:6} blocks  line {frame.lineno}\")\ncur, peak = tracemalloc.get_traced_memory()\nprint(f\"traced now {cur / 1e6:.1f} MB, peak {peak / 1e6:.1f} MB, cached runs: {len(ResultCache._store)}\")", "follow": ["RSS keeps growing but `tracemalloc` shows a flat heap. What next? => The growth is outside Python's allocators: a C extension leak, native library buffers, or allocator fragmentation. Use memray with native tracking, compare `malloc` stats, test with a different allocator (jemalloc), and consider worker recycling as mitigation.", "How would you enable this safely in production? => Only on one canary instance or behind an admin trigger that starts tracemalloc for a limited window, dumps snapshots to storage, and stops it; never globally, because of the overhead.", "Why can storing exceptions leak memory? => `exc.__traceback__` references frames, which reference every local variable in them. Keep formatted strings, or call `traceback.clear_frames(tb)`."], "pitfall": "Adding `gc.collect()` calls or raising memory limits without identifying who holds the objects. That hides the symptom and the service still dies, only later.", "signals": "You separate leak from fragmentation, name the exact tools and their overhead, show how to find the allocation site and the holder, and finish with a guardrail (metric, alert, bounded cache).", "module": 2, "output": "+   27022 KiB  +404001 blocks  line 9\n+      95 KiB  +  2001 blocks  line 15\ntraced now 30.7 MB, peak 30.7 MB, cached runs: 2200", "num": 8}, {"type": "Concept", "level": "Principal", "question": "How big is a Python object really? Estimate the memory for a list of 10 million integers.", "short": "Each object carries a header (reference count and type pointer, 16 bytes on 64-bit) plus its payload: a small `int` is 28 bytes, a float 24, an empty dict about 64 plus more. A list stores 8-byte pointers. So 10 million distinct ints cost roughly 80 MB of pointers plus about 320 MB of int objects (28 bytes, rounded up to 32 by the allocator): around 400 MB, versus 80 MB in an `array('q')` or NumPy int64 array.", "deep": "Every CPython object starts with `ob_refcnt` and `ob_type` (16 bytes). On top of that:\n\n- `int`: variable-length digits; values below 2**30 need one digit, so 28 bytes.\n- `float`: 24 bytes. `str`: roughly 40-50 bytes of header (version dependent) plus one byte per ASCII character; non-Latin text uses 2 or 4 bytes per character.\n- `tuple`: about 40-48 bytes + 8 per item. `list`: 56 bytes + 8 per slot, over-allocated for growth.\n- Instances of plain classes: the object plus a `__dict__` (or, since 3.11/3.12, inline values that avoid a separate dict until needed); `__slots__` objects are much smaller.\n\nAllocation rounding: pymalloc rounds requests up to multiples of 16 bytes, so real usage is slightly higher than `sys.getsizeof`.\n\nThe Principal-level point: \"one Python object per record\" is often the wrong representation for large numeric data. Columnar storage (`array`, NumPy, Arrow) stores raw values contiguously, uses 5-10x less memory and enables vectorized processing.", "code": "import array, sys, tracemalloc\n\nfor v in (0, 2**30, 2**100, 1.5, \"a\", \"é\", (), [], {}):\n    print(f\"{v!r:>35}  {sys.getsizeof(v):4} bytes\")\n\ndef measure(make):\n    tracemalloc.start(); obj = make(); cur = tracemalloc.get_traced_memory()[0]; tracemalloc.stop()\n    return cur / 1e6\n\nn = 1_000_000\nprint(f\"list of {n:,} ints : {measure(lambda: [i * 7 for i in range(n)]):6.1f} MB\")\nprint(f\"array('q')         : {measure(lambda: array.array('q', (i * 7 for i in range(n)))):6.1f} MB\")", "follow": ["Why does `sys.getsizeof([big_object])` look tiny? => It reports only the list's own memory (header and pointer array), not the objects it references.", "Why do small ints in the list above cost nothing extra for values below 257? => CPython caches ints from -5 to 256 as shared immortal objects; multiplying by 7 was used to avoid that."], "pitfall": "Quoting `sys.getsizeof` of a container as its total memory. Use `tracemalloc` or recursive measurement for real footprints.", "signals": "You know the per-object overhead numbers roughly, do the arithmetic out loud, and propose a columnar representation with the expected saving.", "module": 2, "output": "                                  0    28 bytes\n                         1073741824    32 bytes\n    1267650600228229401496703205376    40 bytes\n                                1.5    24 bytes\n                                'a'    42 bytes\n                                'é'    61 bytes\n                                 ()    48 bytes\n                                 []    56 bytes\n                                 {}    64 bytes\nlist of 1,000,000 ints :   40.4 MB\narray('q')         :    8.2 MB", "num": 9}, {"type": "Trap", "level": "Principal", "question": "You delete a 2 GB list, `tracemalloc` shows it freed, but the process RSS barely drops. Is that a leak?", "short": "Not necessarily. CPython's small-object allocator (pymalloc) keeps memory in 1 MiB arenas (256 KiB before 3.10) and can return an arena to the OS only when every block in it is free, and the C `malloc` may also keep freed memory for reuse. Freed memory is usually reused by the same process later. It's a leak only if memory keeps growing across repeated identical workloads.", "deep": "Layers involved:\n\n- **pymalloc** handles objects up to 512 bytes, carving arenas into pools of fixed-size blocks. A single surviving object in an arena pins the whole arena.\n- **Free lists** for some types (floats, tuples, frames) keep recently freed objects for fast reuse.\n- **libc malloc** (glibc, the Windows heap) may not return freed pages to the OS immediately; glibc's `malloc_trim(0)` can sometimes release them.\n\nHow to reason about it in an interview:\n\n1. Run the workload twice. If RSS returns to the same plateau (not higher), the memory is being reused: not a leak.\n2. If RSS ratchets up each cycle while traced heap is flat, it's fragmentation or native memory.\n3. Mitigations: process large batches in a **child process** that exits (memory fully returned), recycle workers periodically, reduce long-lived small objects mixed with short-lived ones, or try a different allocator (jemalloc/mimalloc; the free-threaded build uses mimalloc).", "code": "import tracemalloc, gc\ntracemalloc.start()\ndef peak_cycle():\n    data = [str(i) * 3 for i in range(300_000)]     # many small objects -> pymalloc arenas\n    size = tracemalloc.get_traced_memory()[0]\n    del data; gc.collect()\n    return size\nfor cycle in range(3):\n    in_use = peak_cycle()\n    print(f\"cycle {cycle}: traced while alive {in_use / 1e6:5.1f} MB -> after del {tracemalloc.get_traced_memory()[0] / 1e6:4.1f} MB\")\nprint(\"traced heap returns to ~0 each cycle: memory is freed and reusable, even if RSS stays higher\")", "follow": ["How do you make sure a memory-hungry batch step gives memory back to the OS? => Run it in a separate process (`multiprocessing` or a subprocess) that exits when done; the OS reclaims everything.", "What does `gc.collect()` do for this problem? => Nothing unless there are reference cycles; plain reference counting already freed the objects. It doesn't defragment arenas."], "pitfall": "Reporting a \"leak\" from a single RSS reading after `del`. Leak detection needs repeated identical cycles and a trend.", "signals": "You explain arenas, free lists and libc behaviour, propose the repeated-cycle test, and give practical mitigations like child processes and worker recycling.", "module": 2, "output": "cycle 0: traced while alive  20.0 MB -> after del  0.0 MB\ncycle 1: traced while alive  20.0 MB -> after del  0.0 MB\ncycle 2: traced while alive  20.0 MB -> after del  0.0 MB\ntraced heap returns to ~0 each cycle: memory is freed and reusable, even if RSS stays higher", "num": 10}, {"type": "Design", "level": "Principal", "question": "You must analyse 50 GB of device test logs on a machine with 16 GB of RAM, daily. Design the approach.", "short": "Never load it all. Stream line by line (or use `mmap` for random access) through a generator pipeline, keep only aggregates in memory, and parallelize by file or shard with a process pool, merging partial results. If the analysis is columnar and repeated, convert logs once to a compact format (Parquet with Arrow/Polars, or SQLite) and query that instead.", "deep": "Clarify first: is it one pass for aggregate stats, or ad-hoc queries? Do we need exact counts or percentiles? How fresh must results be?\n\nDesign options:\n\n1. **Streaming aggregation** (default): read files with buffered iteration, parse only needed fields (regex compiled once, or `str.split` with maxsplit), update counters/histograms. Memory is O(number of distinct keys), not O(data).\n2. **Parallel by shard**: logs are usually many files; a `ProcessPoolExecutor` per file returns small partial aggregates (`Counter`s) that are merged. Avoid sending lines between processes: send file paths.\n3. **mmap for binary or indexed access**: `mmap` + `re.finditer` or `memoryview` lets you scan or jump to offsets without copying the file into Python objects.\n4. **Convert once, query many**: if engineers keep asking new questions, ingest into Parquet/DuckDB/SQLite with a schema; queries then run in seconds using columnar engines.\n5. **Percentiles without storing everything**: use t-digest/HDR histograms or fixed buckets.\n\nOperational concerns: make the job resumable (checkpoint processed files), validate malformed lines (count and sample them instead of crashing), and record input manifest and code version for reproducibility.", "code": "import mmap, os, re, tempfile, collections, itertools\nfrom concurrent.futures import ProcessPoolExecutor\n\nLINE = re.compile(rb\"dev=(?P<dev>\\w+) .*?status=(?P<st>\\w+) lat_us=(?P<lat>\\d+)\")\n\ndef make_log(path, n, seed):\n    with open(path, \"wb\") as f:\n        for i in range(n):\n            st = b\"FAIL\" if (i * seed) % 97 == 0 else b\"PASS\"\n            f.write(b\"2026-09-28T10:00:%02d dev=nvme%d op=write status=%s lat_us=%d\\n\" % (i % 60, i % 4, st, 80 + i % 900))\n\ndef summarize(path):\n    counts, slow = collections.Counter(), 0\n    with open(path, \"rb\") as f, mmap.mmap(f.fileno(), 0, access=mmap.ACCESS_READ) as mm:\n        for m in LINE.finditer(mm):                  # scans the mapped file, no full read()\n            counts[(m[\"dev\"].decode(), m[\"st\"].decode())] += 1\n            slow += int(m[\"lat\"]) > 900\n    return counts, slow\n\nif __name__ == \"__main__\":\n    d = tempfile.mkdtemp()\n    paths = [os.path.join(d, f\"run{i}.log\") for i in range(4)]\n    for i, p in enumerate(paths): make_log(p, 50_000, i + 3)\n    total, slow_total = collections.Counter(), 0\n    with ProcessPoolExecutor(4) as ex:\n        for counts, slow in ex.map(summarize, paths):   # send paths, receive small aggregates\n            total.update(counts); slow_total += slow\n    fails = {dev: n for (dev, st), n in sorted(total.items()) if st == \"FAIL\"}\n    print(\"lines:\", sum(total.values()), \"| FAIL per device:\", fails, \"| slow ops:\", slow_total)", "follow": ["Why send file paths to workers instead of lines? => Pickling millions of lines through pipes costs more than the parsing itself; workers should read their own input and return small results.", "How would you compute the p99 latency across 50 GB without storing every value? => Mergeable sketches (t-digest, HDR histogram) or fixed log-scale buckets per worker, merged at the end; exact p99 would need an external sort or a columnar engine."], "pitfall": "Calling `f.read()` or `readlines()` \"because it's faster\", or building a pandas DataFrame of the whole dataset. Both blow past RAM long before 50 GB.", "signals": "You clarify requirements, choose streaming plus sharded parallelism with small partial results, mention sketches for percentiles, and cover resumability and bad-input handling.", "module": 2, "output": "lines: 200000 | FAIL per device: {'nvme0': 516, 'nvme1': 516, 'nvme2': 516, 'nvme3': 516} | slow ops: 17380", "num": 11}, {"type": "Concept", "level": "Principal", "question": "When is \"one Python object per record\" the wrong model, and what do you use instead?", "short": "When you have millions of homogeneous records processed in bulk. Per-object overhead (headers, dicts, pointers) dominates and every operation runs through the interpreter. Switch to `__slots__`/tuples for moderate counts, and to columnar storage (`array`, NumPy, Arrow/Polars) or a database for large ones.", "deep": "Options in increasing efficiency:\n\n- **dict per record**: flexible but the heaviest (hash table per record).\n- **class with `__dict__`**: slightly better since 3.11+ (inline values), still heavy.\n- **`__slots__` class / `dataclass(slots=True)`**: fixed fields, no per-instance dict; good middle ground with methods and type hints.\n- **tuple / NamedTuple**: compact, immutable.\n- **struct-of-arrays (columnar)**: one `array('d')` per field or a NumPy/Arrow table. Values are unboxed; memory drops 5-10x and aggregations run in C.\n\nChoose based on access pattern: object-oriented access to a few records at a time favours classes; analytics over all records favours columns. A good design often uses both: columnar storage for the bulk, with a small view class that wraps one row on demand.", "code": "import tracemalloc, array\nfrom dataclasses import dataclass\nfrom typing import NamedTuple\n\nN = 200_000\n@dataclass\nclass Plain: lba: int; latency: float; ok: bool\n@dataclass(slots=True)\nclass Slotted: lba: int; latency: float; ok: bool\nclass Row(NamedTuple): lba: int; latency: float; ok: bool\n\ndef mem(build):\n    tracemalloc.start(); keep = build(); used = tracemalloc.get_traced_memory()[0]; tracemalloc.stop()\n    return used / 1e6\n\nprint(f\"dict per record   {mem(lambda: [{'lba': i, 'latency': i * 0.5, 'ok': True} for i in range(N)]):6.1f} MB\")\nprint(f\"dataclass         {mem(lambda: [Plain(i, i * 0.5, True) for i in range(N)]):6.1f} MB\")\nprint(f\"dataclass(slots)  {mem(lambda: [Slotted(i, i * 0.5, True) for i in range(N)]):6.1f} MB\")\nprint(f\"NamedTuple        {mem(lambda: [Row(i, i * 0.5, True) for i in range(N)]):6.1f} MB\")\nprint(f\"columnar arrays   {mem(lambda: (array.array('q', range(N)), array.array('d', (i * 0.5 for i in range(N))), bytearray(b'\\x01') * N)):6.1f} MB\")", "follow": ["How do you keep an object-oriented API over columnar storage? => A lightweight view class (or a `NamedTuple` built on demand) that indexes into the columns for one row, while bulk operations work on whole columns.", "What changed in 3.11-3.13 that made plain classes cheaper? => Instance attribute values can be stored inline in the object (no separate dict until you touch `__dict__` or add unusual attributes), which cuts per-instance memory."], "pitfall": "Optimizing with `__slots__` for 5,000 objects. The saving is irrelevant there; pick representations based on record counts and access patterns.", "signals": "You list the representation ladder with rough numbers, tie the choice to access patterns, and suggest hybrid designs.", "module": 2, "output": "dict per record     49.6 MB\ndataclass           32.0 MB\ndataclass(slots)    24.0 MB\nNamedTuple          28.8 MB\ncolumnar arrays      3.6 MB", "num": 12}, {"type": "Trap", "level": "Principal", "question": "Your event bus keeps a list of callbacks. Why does registering `self.on_event` cause a memory leak, and how do you fix it?", "short": "A bound method holds a strong reference to its instance (`method.__self__`). A long-lived bus holding bound methods keeps every subscriber object alive forever, even after the rest of the program dropped it. Fix with explicit unsubscribe (returning a handle, or a context manager) or store `weakref.WeakMethod` references that die with the object.", "deep": "This leak pattern appears in GUI frameworks, test harnesses (per-test listeners registered on a session-wide bus), and plugin systems.\n\nFix options:\n\n- **Explicit lifecycle**: `subscribe()` returns an unsubscribe callable; wrap in a context manager so tests always clean up.\n- **Weak references**: `weakref.WeakMethod(obj.method)` for bound methods, `weakref.ref` for functions; the bus skips and prunes dead references. `weakref.WeakSet` works for objects implementing a known method.\n- **Frameworks**: Django signals store receivers weakly by default (`weak=True`); Blinker supports weak references too.\n\nAlso watch for closures and lambdas capturing `self`: `bus.subscribe(lambda e: self.handle(e))` creates a strong reference via the closure and can't be made weak (the lambda itself would be collected immediately).", "code": "import gc, weakref\n\nclass Bus:\n    def __init__(self, weak): self.weak, self.subs = weak, []\n    def subscribe(self, cb):\n        self.subs.append(weakref.WeakMethod(cb) if self.weak else cb)\n    def publish(self, event):\n        alive = []\n        for s in self.subs:\n            fn = s() if self.weak else s\n            if fn is None: continue            # subscriber is gone: prune it\n            fn(event); alive.append(s)\n        self.subs = alive\n\nclass TestMonitor:\n    def __init__(self, bus): self.seen = []; bus.subscribe(self.on_event)\n    def on_event(self, e): self.seen.append(e)\n\nfor weak in (False, True):\n    bus = Bus(weak)\n    for _ in range(1000):\n        TestMonitor(bus)                     # created per test, then dropped by the test\n    gc.collect()\n    alive = sum(isinstance(o, TestMonitor) for o in gc.get_objects())\n    bus.publish(\"tick\")\n    print(f\"weak={weak!s:5} TestMonitor objects still alive: {alive:4} | subscribers after publish: {len(bus.subs)}\")", "follow": ["Why can't you store a lambda with `weakref.ref`? => The only strong reference to the lambda is the one you're about to make weak, so it would be collected immediately; store the owner object weakly instead, or require explicit unsubscribe.", "How do you catch this class of leak in CI? => A test that creates and drops N subscribers, runs `gc.collect()`, and asserts the count of those objects returns to baseline (or uses `weakref.ref` probes)."], "pitfall": "Using `WeakMethod` but forgetting to prune dead references, so the list itself grows with dead weakrefs and publish gets slower over time.", "signals": "You explain `__self__` holding the instance, give both lifecycle and weakref fixes, mention the lambda trap, and propose a regression test.", "module": 2, "output": "weak=False TestMonitor objects still alive: 1000 | subscribers after publish: 1000\nweak=True  TestMonitor objects still alive:    0 | subscribers after publish: 0", "num": 13}, {"type": "Concept", "level": "Principal", "question": "Why do pre-fork servers and forked test workers lose copy-on-write memory sharing in Python, and what helps?", "short": "After `fork`, parent and child share memory pages until either writes to them. In CPython, merely **reading** an object updates its reference count, and the garbage collector writes to object headers, so shared pages get copied. Immortal objects (3.12+) help for core singletons, and `gc.freeze()` after preloading moves existing objects out of GC scans, reducing copies.", "deep": "Pattern: a server (gunicorn with `--preload`, uWSGI) or a test runner loads a large model or dataset once, then forks workers expecting them to share that memory. In practice worker RSS climbs towards the full size because:\n\n- Reference count increments/decrements touch every object that is used.\n- The cyclic GC walks tracked objects and writes to their headers (the GC links).\n\nMitigations:\n\n- `gc.freeze()` right before forking (and `gc.disable()` in the parent during preload) so the collector ignores those objects; Instagram reported large memory savings with this approach.\n- Immortalization (PEP 683) makes objects like `None`, small ints and interned strings never change refcount.\n- Store big read-only data outside Python objects: `mmap`-ed files, NumPy arrays, Arrow buffers, or shared memory; their pages aren't touched by refcounting.\n- On Windows and macOS, `spawn` is the default, so there is no copy-on-write sharing at all; each worker loads its own copy.", "code": "import gc\ngc.disable()                                   # preload phase: avoid GC touching everything\nmodel = {f\"feature_{i}\": [i] * 8 for i in range(50_000)}   # big read-only structure\ngc.freeze()                                    # move all current objects to the permanent generation\nprint(\"objects frozen:\", gc.get_freeze_count() > 50_000)\ngc.enable()\n# ... here a pre-fork server would os.fork() workers that only READ `model` ...\nprint(\"gen counts after freeze:\", gc.get_count())", "follow": ["Does `gc.freeze()` stop reference counting writes? => No; it only stops the cyclic collector from traversing those objects. Refcount writes on objects you actually use still copy pages.", "What's the most robust way to share a 2 GB read-only lookup table between 16 workers? => Put it in a memory-mapped file or shared-memory array (NumPy/Arrow) so pages are shared by the OS and never modified by Python's bookkeeping."], "pitfall": "Assuming `--preload` automatically shares memory across workers. Without GC freezing or out-of-object storage, much of it gets copied within minutes.", "signals": "You identify refcount and GC writes as the cause, cite `gc.freeze()` and immortal objects, and propose storing bulk data outside Python objects.", "module": 2, "output": "objects frozen: True\ngen counts after freeze: (2, 0, 0)", "num": 14}, {"type": "Design", "level": "Principal", "question": "Design the concurrency model for an orchestrator that runs tests on 64 SSDs at once. Each test mostly waits on CLI tools and serial consoles, then verifies data (CPU heavy).", "short": "Use **asyncio** as the orchestrator: one task per device, `asyncio.create_subprocess_exec` for CLI tools, stream readers for consoles, a semaphore for shared resources and `asyncio.timeout` on every step. Push the CPU-heavy verification to a `ProcessPoolExecutor` via `loop.run_in_executor` so it doesn't block the event loop. Wrap each device in its own error boundary so one bad drive can't take down the run.", "deep": "Clarify: How long do tests run (minutes or days)? Do devices share hosts, power supplies or buses? Must results stream to a database live?\n\n**Why asyncio for orchestration**: 64 devices x several concurrent waits (CLI, console, power relay) is hundreds of mostly idle operations. Coroutines are cheap, cancellation and timeouts are first-class, and there's one thread to reason about.\n\n**Structure:**\n\n- `asyncio.TaskGroup` (or a supervisor that collects results) with one `run_device(dev)` task per device. Use a per-device try/except so one failure is recorded, not propagated to all.\n- Subprocesses: `create_subprocess_exec` (never shell), read stdout/stderr concurrently, kill on timeout.\n- Shared resources (a power controller that accepts one command at a time, a lab network with bandwidth limits): `asyncio.Semaphore` / `Lock`.\n- CPU work (CRC checks on gigabytes): `await loop.run_in_executor(process_pool, verify, path)`. Pass file paths, not data.\n- Blocking libraries without async support (vendor SDKs): `asyncio.to_thread`.\n- Observability: per-device structured logs with a device ID in `contextvars`, heartbeat metrics, and a watchdog task that flags devices with no progress.\n\n**Alternatives**: a thread per device works for smaller counts and blocking SDKs, but timeouts and cancellation are harder. A process per device gives strong isolation (useful if drivers can crash the interpreter) at higher memory cost.", "code": "import asyncio, sys, time\n\nCLI = [sys.executable, \"-c\", \"import sys, time, random; random.seed(int(sys.argv[1])); time.sleep(random.uniform(0.05, 0.3)); print('{\\\"temp_c\\\": %d}' % (35 + int(sys.argv[1]) % 20))\"]\n\nasync def run_cli(dev_id, timeout):\n    proc = await asyncio.create_subprocess_exec(*CLI, str(dev_id), stdout=asyncio.subprocess.PIPE)\n    try:\n        async with asyncio.timeout(timeout):\n            out, _ = await proc.communicate()\n        return out.decode().strip()\n    except TimeoutError:\n        proc.kill(); await proc.wait()\n        raise\n\ndef verify(dev_id):                      # CPU-heavy step: runs in a process pool in the real design\n    return sum(i * dev_id for i in range(200_000)) % 97\n\nasync def run_device(dev_id, power_lock, pool):\n    try:\n        async with power_lock:           # shared power controller: one command at a time\n            await asyncio.sleep(0.005)\n        health = await run_cli(dev_id, timeout=0.25)\n        crc = await asyncio.get_running_loop().run_in_executor(pool, verify, dev_id)\n        return dev_id, \"PASS\", health, crc\n    except TimeoutError:\n        return dev_id, \"TIMEOUT\", None, None\n\nasync def main():\n    from concurrent.futures import ThreadPoolExecutor   # ProcessPoolExecutor in production\n    power_lock = asyncio.Lock()\n    t = time.perf_counter()\n    with ThreadPoolExecutor(4) as pool:\n        results = await asyncio.gather(*(run_device(d, power_lock, pool) for d in range(16)))\n    passed = sum(r[1] == \"PASS\" for r in results)\n    print(f\"{len(results)} devices in {time.perf_counter() - t:.2f}s: {passed} PASS, {len(results) - passed} TIMEOUT\")\n    print(\"sample:\", results[:2])\n\nasyncio.run(main())", "follow": ["One vendor SDK is blocking and not thread-safe. How do you integrate it? => Give it a dedicated single-thread executor (`ThreadPoolExecutor(max_workers=1)`) and call it with `run_in_executor`, so calls are serialized but the loop stays responsive; or isolate it in a helper process.", "How do you stop a hung device test without killing the whole run? => Per-device timeouts with cancellation, kill the child process group, mark the device TIMEOUT, collect logs, and optionally power-cycle it via the relay before continuing.", "How do you know the orchestrator itself is healthy during a 48-hour run? => A heartbeat task updating a metric/file every N seconds, per-device last-progress timestamps, and an external watchdog alert when heartbeats stop."], "pitfall": "Running the CPU-bound verification directly inside a coroutine. It blocks the event loop, so console readers miss data and every timeout fires late.", "signals": "You pick asyncio for orchestration and explain why, isolate CPU and blocking work in executors, add per-device error boundaries, timeouts and shared-resource limits, and cover observability.", "module": 3, "output": "16 devices in 0.53s: 12 PASS, 4 TIMEOUT\nsample: [(0, 'TIMEOUT', None, None), (1, 'PASS', '{\"temp_c\": 36}', 8)]", "num": 15}, {"type": "Concept", "level": "Principal", "question": "How does cancellation work in asyncio, and what are the rules for writing cancellation-safe code?", "short": "`task.cancel()` raises `CancelledError` inside the task at its current `await`. Since 3.8 it subclasses `BaseException`, so `except Exception` doesn't swallow it. Rules: clean up in `finally` or `async with`, re-raise `CancelledError` if you catch it, don't `await` long operations during cleanup without a timeout, and use `asyncio.shield` only for work that must finish (like committing a result).", "deep": "Cancellation is **cooperative**: a task is only interrupted at `await` points. CPU loops without awaits can't be cancelled.\n\nSources of cancellation: explicit `task.cancel()`, `asyncio.timeout()`/`wait_for`, a failing sibling in a `TaskGroup`, and `asyncio.run` shutting down.\n\nRules:\n\n- Put cleanup in `finally` / context managers so it runs on cancel.\n- If you catch `CancelledError` (for logging), **re-raise** it. Swallowing it makes timeouts and TaskGroups hang or misbehave. (3.11 added `Task.uncancel()` for the rare cases where a library must suppress it deliberately.)\n- `asyncio.shield(coro)` protects an inner operation from the outer cancellation, but the outer `await` still raises; use it for short, must-complete work like writing a final result.\n- Beware of cleanup that itself awaits a hung resource; wrap it in a timeout.\n- Blocking calls in threads (`to_thread`) cannot be interrupted; cancellation abandons the await, but the thread keeps running.", "code": "import asyncio\n\nasync def save_result(name):\n    await asyncio.sleep(0.05)\n    print(f\"  result for {name} committed\")\n\nasync def device_test(name):\n    try:\n        print(f\"  {name}: running\")\n        await asyncio.sleep(10)                  # long I/O wait\n    except asyncio.CancelledError:\n        print(f\"  {name}: cancelled, cleaning up\")\n        await asyncio.shield(save_result(name))  # must-complete step\n        raise                                    # ALWAYS re-raise\n    finally:\n        print(f\"  {name}: finally ran\")\n\nasync def main():\n    try:\n        async with asyncio.timeout(0.1):\n            await device_test(\"nvme3\")\n    except TimeoutError:\n        print(\"timeout surfaced to caller as TimeoutError\")\n    print(\"CancelledError is an Exception subclass?\", issubclass(asyncio.CancelledError, Exception))\n\nasyncio.run(main())", "follow": ["Why did Python 3.8 move `CancelledError` under `BaseException`? => Because code with `except Exception:` (logging and retry wrappers) was accidentally swallowing cancellations, breaking timeouts and shutdown.", "A task doing `while True: compute()` ignores cancel. Why, and how do you fix it? => There's no `await` to deliver the exception. Add `await asyncio.sleep(0)` periodically, or better, move the CPU work to an executor."], "pitfall": "`except Exception: pass` style wrappers written before 3.8 still exist in libraries; and `except BaseException` or bare `except:` in your own retry helpers will swallow cancellation.", "signals": "You state cooperative semantics, the BaseException change, the re-raise rule, correct use of shield, and the limitation with threads.", "module": 3, "output": "  nvme3: running\n  nvme3: cancelled, cleaning up\n  result for nvme3 committed\n  nvme3: finally ran\ntimeout surfaced to caller as TimeoutError\nCancelledError is an Exception subclass? False", "num": 16}, {"type": "Design", "level": "Principal", "question": "A producer generates work faster than consumers can process it. How do you design backpressure in Python?", "short": "Bound every queue. With `asyncio.Queue(maxsize=N)` or `queue.Queue(maxsize=N)`, `put()` blocks when full, which naturally slows the producer to the consumers' speed. Decide the overflow policy explicitly (block, drop oldest, drop newest, reject with an error or 429), size N from latency targets, and expose queue depth as a metric.", "deep": "Unbounded queues turn a throughput problem into a memory and latency problem: the queue grows until the process dies, and every item waits longer.\n\nOptions:\n\n- **Block** the producer (default for bounded queues). Correct when the producer can slow down (a log reader, a crawler).\n- **Shed load**: when full, drop or reject new work (`put_nowait` + `QueueFull`), returning 429 or recording a skip. Correct for live telemetry where old data is worthless.\n- **Drop oldest**: `collections.deque(maxlen=N)` as a ring buffer for \"latest N samples\".\n- **Scale consumers** dynamically based on queue depth, within limits of downstream capacity.\n\nSizing: queue length ~ (acceptable delay) x (consumer throughput). Monitor depth and wait time; alert on sustained saturation. Propagate backpressure end to end: a bounded queue in front of a database writer is useless if an unbounded one sits upstream.", "code": "import asyncio, time\n\nasync def producer(q, n, stats):\n    for i in range(n):\n        t = time.perf_counter()\n        await q.put(i)                               # blocks while the queue is full\n        stats[\"blocked\"] += time.perf_counter() - t\n    for _ in range(2): await q.put(None)\n\nasync def consumer(q, name, done):\n    while (item := await q.get()) is not None:\n        await asyncio.sleep(0.01)                     # slow downstream, e.g. DB insert\n        done.append(item)\n\nasync def main():\n    stats, done = {\"blocked\": 0.0}, []\n    q = asyncio.Queue(maxsize=5)\n    t = time.perf_counter()\n    await asyncio.gather(producer(q, 60, stats), consumer(q, \"c1\", done), consumer(q, \"c2\", done))\n    print(f\"processed {len(done)} items in {time.perf_counter() - t:.2f}s\")\n    print(f\"producer spent {stats['blocked']:.2f}s waiting: that is backpressure working\")\n    print(f\"max memory held: {q.maxsize} queued items, not 60\")\n\nasyncio.run(main())", "follow": ["What do you do if the producer can't be slowed down (for example, telemetry arriving from hardware)? => Shed load deliberately: sample, aggregate at the source, or drop oldest from a ring buffer, and count what was dropped so it's visible.", "How do you pick `maxsize`? => From the latency budget: if consumers process 200 items/s and 2 seconds of queueing is acceptable, about 400. Then validate with load tests and watch queue-depth metrics."], "pitfall": "Using `asyncio.Queue()` or `queue.Queue()` without `maxsize` (the default is unbounded) in any pipeline that reads from a faster source.", "signals": "You bound queues, choose an explicit overflow policy for the use case, size from latency, and make depth observable.", "module": 3, "output": "processed 60 items in 0.47s\nproducer spent 0.42s waiting: that is backpressure working\nmax memory held: 5 queued items, not 60", "num": 17}, {"type": "Debug", "level": "Principal", "question": "A threaded test harness hangs randomly once a night. How do you diagnose and prevent deadlocks?", "short": "Capture every thread's stack while it's hung: `py-spy dump --pid`, `faulthandler.dump_traceback_later(timeout)` or `sys._current_frames()`. Look for threads waiting on locks acquired in different orders, or waiting on a queue/event that nobody will set. Prevent with a global lock order, lock timeouts that log and fail loudly, smaller critical sections, and message passing instead of shared locks.", "deep": "Diagnosis steps:\n\n1. **Get stacks without stopping the process**: `py-spy dump --pid <pid>` (works on hung processes, shows all threads). In-process: `faulthandler.dump_traceback_later(3600, exit=False)` as a watchdog, or an admin signal/endpoint that prints `sys._current_frames()`.\n2. **Match the signature** (see the list below).\n3. **Reproduce**: stress the suspected section with many threads and `sys.setswitchinterval(1e-6)` to force interleavings.\n\nClassic hang signatures:\n\n- Two threads each in `lock.acquire()` for a lock the other holds: lock-order inversion.\n- A thread in `queue.get()` with no producers left: a lost sentinel or a crashed producer.\n- `thread.join()` on a thread that waits for the joiner: circular wait.\n- Holding a lock while calling out (callbacks, logging handlers, I/O) that re-enters the same code.\n\nPrevention: define lock hierarchy (always acquire `device_lock` before `results_lock`), use `lock.acquire(timeout=...)` with an error that includes the owner, avoid calling unknown code while holding a lock, prefer `queue.Queue` ownership handoff, and add a watchdog that dumps stacks when progress stops.", "code": "import sys, threading, time, traceback\n\ndevice_lock, results_lock = threading.Lock(), threading.Lock()\n\ndef run_test():                                  # acquires device -> results\n    with device_lock:\n        time.sleep(0.05)\n        if results_lock.acquire(timeout=0.5): results_lock.release()\n        else: print(\"run_test: gave up waiting for results_lock\")\n\ndef flush_results():                              # acquires results -> device (inverted order!)\n    with results_lock:\n        time.sleep(0.05)\n        if device_lock.acquire(timeout=0.5): device_lock.release()\n        else: print(\"flush_results: gave up waiting for device_lock\")\n\nthreads = [threading.Thread(target=run_test, name=\"runner\"), threading.Thread(target=flush_results, name=\"flusher\")]\nfor t in threads: t.start()\ntime.sleep(0.2)                                   # both are now stuck: dump their stacks\nnames = {t.ident: t.name for t in threads}\nfor tid, frame in sys._current_frames().items():\n    if tid in names:\n        where = traceback.extract_stack(frame)[-1]      # innermost Python frame\n        print(f\"[{names[tid]}] waiting at line {where.lineno}: {where.line}\")\nfor t in threads: t.join()", "follow": ["How do you add a permanent safety net in CI? => `faulthandler.dump_traceback_later(timeout, repeat=False)` per test (pytest-timeout does this with its `thread` method) so a hang produces stack traces and fails instead of blocking the pipeline for hours.", "What does `RLock` fix and what doesn't it fix? => It lets the same thread re-acquire a lock it holds (re-entrancy), fixing self-deadlock; it doesn't fix lock-order inversion between two threads."], "pitfall": "Adding `time.sleep()` or retries around the hang. That changes timing so the deadlock happens less often, and it becomes harder to catch.", "signals": "You get evidence first (stack dumps of all threads), recognise common deadlock signatures, and prevent them structurally with lock ordering, timeouts, message passing and watchdogs.", "module": 3, "output": "[flusher] waiting at line 14: if device_lock.acquire(timeout=0.5): device_lock.release()\n[runner] waiting at line 8: if results_lock.acquire(timeout=0.5): results_lock.release()\nrun_test: gave up waiting for results_lock\nflush_results: gave up waiting for device_lock", "num": 18}, {"type": "Trap", "level": "Principal", "question": "How do you safely call asyncio code from a regular thread (and the reverse)?", "short": "From another thread, never call loop methods or `await` directly: use `asyncio.run_coroutine_threadsafe(coro, loop)` (returns a `concurrent.futures.Future`) or `loop.call_soon_threadsafe(fn)`. From async code, run blocking functions with `await asyncio.to_thread(fn)` or `loop.run_in_executor`. asyncio objects (Queues, Events, Futures) are not thread-safe.", "deep": "Common real-world case: a hardware callback or vendor SDK invokes your function on its own thread, and you want to push an event into an asyncio-based orchestrator.\n\n- `asyncio.run_coroutine_threadsafe(queue.put(item), loop)` schedules the put on the loop's thread and returns a future you can wait on (with a timeout) from the calling thread.\n- `loop.call_soon_threadsafe(queue.put_nowait, item)` is cheaper for fire-and-forget; it also wakes the loop immediately.\n- Keep a reference to the running loop captured at startup (`asyncio.get_running_loop()`), because `get_event_loop()` in a non-loop thread won't give you the right one.\n- The reverse: blocking code inside coroutines must go through `to_thread`/executors. The default executor has a limited number of workers (`m
