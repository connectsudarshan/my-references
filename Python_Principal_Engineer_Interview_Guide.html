es() + b\"# injected\")          # tampered mirror or compromised upload\nprint(\"tampered artifact:\", verify(wheel, locked_hash))", "follow": ["What is dependency confusion and how do you prevent it? => An installer resolves your internal package name from the public index because a public package with that name (and higher version) exists. Prevent with a single proxy index that serves internal names only from the internal repo, and by registering placeholder names publicly.", "A critical CVE lands in a transitive dependency on Friday evening. What's the process? => Check exposure (is the vulnerable code path used?), bump via the lock file, run CI, roll out through the normal pipeline quickly, and document; the ability to do this fast is why automated update PRs and good tests matter."], "pitfall": "`pip install -r requirements.txt` with unpinned or range-pinned versions on every lab machine: each machine gets a different, untested set of packages.", "signals": "You identify concrete threats, and answer with hashes, a single controlled index, scanning, review, provenance and SBOMs, plus an update process.", "module": 9, "output": "requirements.txt line:\n  acme-hal==2.4.1 --hash=sha256:160389351bd21a3e...\nclean artifact   : OK\ntampered artifact: HASH MISMATCH: install refused", "num": 60}, {"type": "Scenario", "level": "Principal", "question": "How do you distribute a Python test tool to 300 lab machines with different OS images, reliably?", "short": "Build once, deploy the same artifact everywhere: package as a wheel with pinned dependencies and install into an isolated environment (`uv tool install`/`pipx`, or a venv provisioned by config management), or ship a self-contained artifact (a container image, a PEX/shiv/`zipapp` bundle plus a pinned interpreter) where machines differ. Version it, roll out in rings (canary machines first), make rollback one command, and have the tool report its version in every result.", "deep": "Options and trade-offs:\n\n- **Wheel + lock file into a venv** (via Ansible/Salt or `uv`): clean, small, fast updates; requires a compatible Python on every machine.\n- **Container image**: the most reproducible (interpreter, libs, tools like nvme-cli pinned); needs device access configuration (`--device /dev/nvme0`, privileges) and a container runtime on lab hosts.\n- **Self-contained zip app** (`zipapp`, shiv, PEX): one file that runs with any compatible interpreter; good for pure-Python tools; native dependencies complicate it.\n- **Frozen executables** (PyInstaller): no Python needed on the target, but larger artifacts and more antivirus/debugging friction.\n\nRollout practice: semantic versions; a canary ring (5 machines) runs the new version on real workloads before the fleet; compare verdict distributions; keep the previous version installed for instant rollback; the tool logs its version, commit and dependency hash into every result so any result can be traced to exact code.", "code": "import pathlib, subprocess, sys, tempfile, zipapp\n\nsrc = pathlib.Path(tempfile.mkdtemp()) / \"labtool\"\n(src / \"labtool\").mkdir(parents=True)\n(src / \"labtool\" / \"__init__.py\").write_text('__version__ = \"3.2.0\"\\n')\n(src / \"labtool\" / \"cli.py\").write_text(\n    \"import sys, platform\\nfrom labtool import __version__\\n\"\n    \"def main():\\n    print(f'labtool {__version__} on Python {platform.python_version()} args={sys.argv[1:]}')\\n\")\n(src / \"__main__.py\").write_text(\"from labtool.cli import main\\nmain()\\n\")\n\ntarget = src.parent / \"labtool-3.2.0.pyz\"\nzipapp.create_archive(src, target, interpreter=\"/usr/bin/env python3\")   # one-file artifact\nprint(\"built:\", target.name, f\"({target.stat().st_size} bytes)\")\nout = subprocess.run([sys.executable, str(target), \"--device\", \"nvme0\"], capture_output=True, text=True).stdout\nprint(\"run  :\", out.strip())", "follow": ["When would you choose containers over venvs for lab tools? => When machines differ a lot, when the tool depends on native binaries (nvme-cli, vendor utilities) that must be version-pinned together, or when many tools with conflicting dependencies share a host.", "How do you make sure old results can be reproduced with the exact tool version? => Keep every released artifact in the internal registry indefinitely, record version plus lock hash in results, and never overwrite a published version."], "pitfall": "`git pull` on each lab machine followed by `pip install -r requirements.txt`: machines drift apart, network hiccups leave half-updated installs, and rollback is guesswork.", "signals": "You compare distribution options with trade-offs, insist on build-once immutable artifacts, staged rollout with rollback, and traceability of results to tool versions.", "module": 9, "output": "built: labtool-3.2.0.pyz (677 bytes)\nrun  : labtool 3.2.0 on Python 3.14.7 args=['--device', 'nvme0']", "num": 61}, {"type": "Design", "level": "Principal", "question": "What quality gates would you put in CI for a large Python codebase, and how do you keep CI fast?", "short": "Fast, automated, blocking gates on every PR: formatter and linter (Ruff), type checking (mypy/pyright) with a ratchet, unit tests with coverage on changed code, dependency and security scans (pip-audit, Bandit rules), and build/packaging checks; slower integration and hardware-in-the-loop suites on merge or nightly. Keep it fast with caching, test selection by impact, parallelism (`pytest -n auto`), and a time budget per stage.", "deep": "Stage design:\n\n1. **Pre-commit (seconds)**: Ruff format + lint (replaces flake8, isort, pyupgrade and many plugins, very fast), secrets scan.\n2. **PR gate (target under 10 minutes)**: type check, unit tests with simulated devices, coverage threshold on changed lines (diff coverage), `pip-audit`, build wheels, import-linter architecture contracts.\n3. **Merge/nightly**: integration tests, HIL suite on a canary rack, performance benchmarks with regression detection, full matrix of Python versions.\n\nKeeping it fast:\n\n- Cache dependency installs (uv is dramatically faster than pip) and tool caches (mypy, Ruff).\n- Run independent jobs in parallel; `pytest-xdist` inside test jobs.\n- Test impact analysis: run tests related to changed packages first (or only, with a full run nightly).\n- Watch CI duration as a metric; flaky tests are quarantined, not retried silently.\n\nGovernance: gates are defined centrally (shared CI templates) so 50 repos don't drift; exceptions are explicit and time-limited.", "code": "# pyproject.toml excerpt (shown as data) -- the configuration most gates hang off\nPYPROJECT = \"\"\"\n[tool.ruff]\nline-length = 100\ntarget-version = \"py312\"\n[tool.ruff.lint]\nselect = [\"E\", \"F\", \"B\", \"UP\", \"S\", \"PERF\", \"SIM\", \"I\"]   # bugs, upgrades, security, perf\n[tool.mypy]\npython_version = \"3.12\"\nwarn_unused_ignores = true\n[[tool.mypy.overrides]]\nmodule = [\"acme.core.*\", \"acme.hal.*\"]\nstrict = true\n[tool.pytest.ini_options]\naddopts = \"-q -n auto --strict-markers --cov=acme --cov-fail-under=80\"\nmarkers = [\"hil: needs real hardware\", \"slow: > 60 s\"]\n\"\"\"\nimport tomllib\ncfg = tomllib.loads(PYPROJECT)\nprint(\"ruff rule families:\", cfg[\"tool\"][\"ruff\"][\"lint\"][\"select\"])\nprint(\"strict typing for :\", cfg[\"tool\"][\"mypy\"][\"overrides\"][0][\"module\"])\nprint(\"pytest defaults   :\", cfg[\"tool\"][\"pytest\"][\"ini_options\"][\"addopts\"])", "follow": ["Developers complain CI takes 45 minutes. What do you do first? => Measure where the time goes per stage, then cache installs, parallelize, move slow suites off the PR path to merge/nightly, and fix or quarantine the slowest and flakiest tests.", "How do you roll out a new strict lint rule to a large codebase? => Enable it with a baseline of existing violations (or per-file ignores), fail only on new violations, and fix the backlog gradually or with autofix where safe."], "pitfall": "Making every check blocking on day one across 50 repositories. Teams add blanket ignores to get unblocked and the gates lose credibility.", "signals": "You layer gates by speed and cost, name concrete tools, keep CI fast with caching, parallelism and impact analysis, and introduce new rules with baselines.", "module": 9, "output": "ruff rule families: ['E', 'F', 'B', 'UP', 'S', 'PERF', 'SIM', 'I']\nstrict typing for : ['acme.core.*', 'acme.hal.*']\npytest defaults   : -q -n auto --strict-markers --cov=acme --cov-fail-under=80", "num": 62}, {"type": "Scenario", "level": "Principal", "question": "The team wants to rewrite the 8-year-old Python test framework from scratch. How do you respond?", "short": "Start from the problems, not the proposal: list the concrete pains (slow runs, flaky infra, hard to add devices, no typing), measure them, and check which are architectural and which are fixable locally. Usually I'd recommend an incremental \"strangler\" migration: define the target architecture, build new pieces behind stable interfaces, and move suites over in waves with measurable milestones. A full rewrite is justified only when the core model is wrong and incremental change costs more.", "deep": "Why rewrites fail: the old system encodes years of hardware quirks and edge cases nobody documented; the rewrite takes 2-3x longer than planned; feature work freezes; and the new system ships with fewer capabilities and new bugs, while validation of product firmware can't pause.\n\nHow I'd run the decision:\n\n1. **Problem inventory** with data: runtime per suite, flake rate, time to onboard a new device type, bug counts by framework area, developer survey.\n2. **Options**: (a) targeted fixes, (b) incremental re-architecture (strangler), (c) rewrite. Estimate cost, risk and time-to-value for each.\n3. **Recommendation** in a short design doc/ADR, reviewed by stakeholders (test engineers, firmware teams, lab ops).\n4. **Execution for (b)**: new HAL and results layer first, adapters so old tests run on the new core, migrate one product line as a pilot, track \"percent of tests on new core\" and the pain metrics, keep a fixed end date for the old system.\n\nLeadership aspects: acknowledge the team's frustration (it's valid data), make the trade-offs visible, and keep ownership with the team: they should own the migration plan, not receive it.", "code": "", "follow": ["The team insists and management supports a rewrite anyway. What do you do? => Disagree and commit, but de-risk: insist on a parity test suite (the old framework's verdicts on the same builds as acceptance criteria), a pilot scope, shipping in slices, and a checkpoint where the plan is re-evaluated with data.", "How do you measure whether the migration is succeeding? => Share of tests on the new core, flake rate and runtime per suite, time to add a device type, and developer satisfaction, reviewed monthly."], "pitfall": "Approving or rejecting the rewrite on taste or seniority. Both the team's pain and the rewrite risk need evidence, and the decision should be written down with its reasoning.", "signals": "You separate problems from the proposed solution, gather data, compare options including incremental migration, write the decision down, and handle the people side (buy-in, disagree-and-commit).", "module": 10, "output": "", "num": 63}, {"type": "Code review", "level": "Principal", "question": "A PR adds threads to speed up a test suite by running 8 device tests in parallel inside one process. What do you look for?", "short": "Correctness under concurrency before speed: shared mutable state (module globals, class attributes, caches, the results list), thread safety of the device SDK and logging context, per-device isolation of fixtures, error propagation from threads (exceptions in `Thread` targets are silently printed, not raised), timeouts and cancellation, and how results and logs are attributed to each device. Then check the speed claim with measurements and whether asyncio or processes fit better.", "deep": "Concrete review checklist:\n\n- **Error propagation**: `threading.Thread(target=...)` swallows exceptions into stderr; the test run may report success. Prefer `ThreadPoolExecutor` and call `future.result()` (re-raises), or `concurrent.futures.wait` with explicit error handling.\n- **Shared state**: `results.append` is fine but `counter += 1`, dict check-then-set, and shared config mutation aren't; look for module-level state in helpers.\n- **Library thread safety**: vendor SDK handles, serial ports and some CLI wrappers are not thread-safe; one handle per device, or serialize access.\n- **Context**: logs must carry the device ID (contextvars), otherwise interleaved lines are useless.\n- **Timeouts**: a hung device thread can't be killed; every blocking call needs a timeout; the pool shutdown must not wait forever.\n- **Resource limits**: 8 parallel tests may exceed host limits (PCIe bandwidth, CPU for verification, power supply).\n- **Measurement**: before/after wall-clock on the real rack, and whether the work is I/O-bound (threads fine) or CPU-bound (processes needed).\n\nTone: acknowledge the valuable goal, mark the silent-exception issue as blocking with a small reproducer, suggest the executor pattern.", "code": "import threading, concurrent.futures as cf\n\ndef device_test(sn):\n    if sn == \"SN003\":\n        raise RuntimeError(f\"{sn}: read-back mismatch at LBA 0x7f00\")\n    return f\"{sn}: PASS\"\n\n# As submitted: exceptions in Thread targets never reach the caller\nresults = []\ndef target(sn): results.append(device_test(sn))\nthreading.excepthook = lambda args: None             # (hide the default stderr print for this demo)\nts = [threading.Thread(target=target, args=(f\"SN00{i}\",)) for i in range(1, 5)]\n[t.start() for t in ts]; [t.join() for t in ts]\nprint(\"threads version: suite looks green ->\", len(results), \"results, no error raised\")\n\n# Suggested: executor + future.result() re-raises and attributes failures\nwith cf.ThreadPoolExecutor(max_workers=8, thread_name_prefix=\"dev\") as ex:\n    futures = {ex.submit(device_test, f\"SN00{i}\"): f\"SN00{i}\" for i in range(1, 5)}\n    for fut in cf.as_completed(futures):\n        try:\n            print(\"  \", fut.result(timeout=60))\n        except Exception as e:\n            print(\"   FAIL\", futures[fut], \"->\", e)", "follow": ["The author says the SDK is thread-safe because it didn't crash in their test run. Is that enough? => No; races are probabilistic. Check vendor documentation, look for shared global state in the SDK, and stress test with many iterations; if unsure, isolate one SDK handle per device or use processes.", "When would you suggest asyncio or processes instead? => asyncio if the work is mainly waiting on subprocesses/sockets and you want clean timeouts; processes if verification is CPU-heavy or the SDK isn't thread-safe."], "pitfall": "Approving because the suite got faster and stayed green, when in fact failures in worker threads were silently dropped.", "signals": "You prioritize silent-failure and shared-state risks, check library thread safety, context and timeouts, demand measurements, and give a concrete safer pattern.", "module": 10, "output": "threads version: suite looks green -> 3 results, no error raised\n   FAIL SN003 -> SN003: read-back mismatch at LBA 0x7f00\n   SN001: PASS\n   SN002: PASS\n   SN004: PASS", "num": 64}, {"type": "Scenario", "level": "Principal", "question": "How would you establish Python engineering standards across 8 teams without becoming a bottleneck?", "short": "Automate what can be automated, and write down the few decisions that can't. Provide shared tooling (a project template, pre-commit config, Ruff/mypy/pytest settings, CI templates) so the standard is the default; keep a short living guideline for design decisions; record significant choices as ADRs; build a small guild of champions from each team who own the standards with you; and measure adoption instead of policing individual PRs.", "deep": "Principles:\n\n- **Paved road over rulebook**: a `cookiecutter`/`copier` template with packaging, lint, typing, tests and CI already wired; teams adopting it get compliance for free. Updates propagate via template updates or shared CI configs.\n- **Automate style**: formatting and most lint rules are enforced by tools, so human review focuses on design. No debates about quotes or line length.\n- **Decide once, document why**: ADRs for things like \"asyncio for orchestration\", \"Pydantic at boundaries\", \"no pickle for interchange\". Link them from the guideline.\n- **Guild/champions**: one engineer per team in a monthly forum proposing and reviewing changes; standards become shared ownership, not a Principal's decree.\n- **Adoption metrics**: repos on the template, CI gate coverage, typing ratchet progress, dependency freshness.\n- **Escape hatches**: documented, time-limited exceptions, so teams aren't blocked by edge cases.\n- **Teach**: short internal talks and examples of real bugs the standards would have prevented; that persuades better than rules.", "code": "", "follow": ["A senior engineer on another team refuses to adopt the type checker. How do you handle it? => Understand the objection (noise, slow tooling, legacy code), offer a lower-friction start (only new modules, relaxed config), show concrete value from their own bug history, and involve their team's champion; escalate only if it blocks shared work.", "How do you keep standards from going stale? => Review them twice a year in the guild, retire rules nobody values, and let tool upgrades (new Ruff rules, Python versions) drive incremental updates through the template."], "pitfall": "Publishing a 40-page style guide and personally reviewing every PR for compliance. It doesn't scale and creates resentment.", "signals": "You rely on automation and templates, record decisions with reasons, share ownership through champions, measure adoption, and plan for exceptions and evolution.", "module": 10, "output": "", "num": 65}, {"type": "Design", "level": "Principal", "question": "Design an end-to-end system for collecting, storing and analysing results from thousands of test runs per day across labs.", "short": "Tests emit versioned, structured result events (run, device, firmware, test, verdict, metrics, artifact links) to a durable ingestion path (message queue or HTTP collector with local spooling), a consumer validates and writes them to a relational store for queries (PostgreSQL) plus object storage for large artifacts (logs, traces, dumps), and dashboards and triage tools read from there. Design for schema evolution, idempotent ingestion, and traceability to exact code and firmware.", "deep": "Clarify: volume (runs/day, artifact sizes), latency needs (live dashboards vs next-morning reports), retention, and consumers (firmware devs, managers, lab ops).\n\nComponents:\n\n- **Event schema**: a versioned JSON (or Protobuf) document with a `schema_version`, a stable unique `result_id` (for idempotency), and context: framework commit, firmware build, device serial and model, host, config hash, seed.\n- **Producer side**: the framework writes events to a local spool first (durable if the network is down), then ships them. Never lose results because the collector was unavailable.\n- **Ingestion**: a collector service or queue (Kafka/RabbitMQ/SQS). Consumers validate against the schema, upsert by `result_id`, and send invalid events to a dead-letter queue with alerts.\n- **Storage**: PostgreSQL (or a warehouse) for structured results and trends; object storage for artifacts, referenced by URL and checksum; retention policies by artifact type.\n- **Analysis**: dashboards (pass rate by firmware build, new failures, flake rates), automatic triage (group failures by signature: error message hash + test + firmware area), and links from each failure to logs.\n- **Evolution**: additive schema changes are backward compatible; breaking changes bump the version and consumers support N and N-1.", "code": "import json, uuid, hashlib\n\nSCHEMA_VERSION = 2\ndef result_event(run_id, device, fw, test, verdict, metrics, error=None):\n    signature = hashlib.sha1(f\"{test}|{(error or '').split(' at ')[0]}\".encode()).hexdigest()[:10] if error else None\n    return {\"schema_version\": SCHEMA_VERSION, \"result_id\": str(uuid.uuid5(uuid.NAMESPACE_URL, f\"{run_id}/{device}/{test}\")),\n            \"run_id\": run_id, \"device\": device, \"firmware\": fw, \"test\": test, \"verdict\": verdict,\n            \"metrics\": metrics, \"error\": error, \"failure_signature\": signature}\n\nREQUIRED = {\"schema_version\", \"result_id\", \"run_id\", \"device\", \"firmware\", \"test\", \"verdict\"}\ndef ingest(store, event):\n    missing = REQUIRED - event.keys()\n    if missing: return f\"dead-letter: missing {sorted(missing)}\"\n    if event[\"schema_version\"] not in (1, 2): return \"dead-letter: unknown schema\"\n    store[event[\"result_id\"]] = event                         # upsert: re-sent events don't duplicate\n    return \"stored\"\n\nstore = {}\nevents = [result_event(\"n-0928\", \"SN001\", \"2.1.7\", \"trim_basic\", \"PASS\", {\"iops\": 612000}),\n          result_event(\"n-0928\", \"SN002\", \"2.1.7\", \"pwr_loss\", \"FAIL\", {}, \"stale data at LBA 0x1f40\"),\n          result_event(\"n-0928\", \"SN009\", \"2.1.7\", \"pwr_loss\", \"FAIL\", {}, \"stale data at LBA 0x88a0\")]\nfor e in events + [events[0], {\"device\": \"SN003\"}]:\n    print(ingest(store, e))\nsigs = {e[\"failure_signature\"] for e in store.values() if e[\"failure_signature\"]}\nprint(len(store), \"unique results |\", len(sigs), \"failure signature(s) -> one triage ticket for both drives\")\nprint(json.dumps(events[1])[:120] + \"...\")", "follow": ["How do you avoid losing results when the collector is down during a 3-day run? => Local durable spool (append-only file or SQLite) on the test host, background shipper with retries, and idempotent `result_id`s so re-sending is safe.", "How would you automatically group thousands of failures into a few triage items? => Normalize error messages (strip addresses, LBAs, timestamps), hash with test name and firmware component into a signature, and group by signature across devices and runs."], "pitfall": "Parsing JUnit XML or console logs after the fact as the only results source: context (firmware, device, config) gets lost and every consumer writes its own fragile parser.", "signals": "You clarify requirements, design a versioned schema with idempotency and traceability, handle offline producers, validation and dead letters, split structured data from artifacts, and add automated triage.", "module": 10, "output": "stored\nstored\nstored\nstored\ndead-letter: missing ['firmware', 'result_id', 'run_id', 'schema_version', 'test', 'verdict']\n3 unique results | 1 failure signature(s) -> one triage ticket for both drives\n{\"schema_version\": 2, \"result_id\": \"fe00b602-22ee-5b63-bb5c-feb20faa9986\", \"run_id\": \"n-0928\", \"device\": \"SN002\", \"firmw...", "num": 66}, {"type": "Scenario", "level": "Principal", "question": "The nightly regression silently stopped running for a week before anyone noticed. You lead the postmortem. What happens?", "short": "Run a blameless postmortem: build the timeline from logs and scheduler history, find the root cause and the contributing factors (why it broke, and why nobody noticed for a week), assess impact (which firmware builds shipped without regression coverage), and agree on actions with owners and dates. The most important fix is usually **detection**: a dead-man's-switch alert that fires when expected results don't arrive, plus making failures loud instead of silent.", "deep": "Structure of the postmortem:\n\n1. **Timeline**: last successful run, the change or event that broke it (expired credential, scheduler config change, full disk, a Python dependency update), the moment it was noticed and how.\n2. **Root cause and contributing factors**: e.g. \"the cron job ran but the orchestrator exited 0 after failing to reserve devices\", \"results dashboard showed the last successful run without a date warning\", \"alerts only fired on test failures, not on absence of runs\".\n3. **Impact**: which builds were not regression-tested; decide whether to re-run the missed coverage on those builds now.\n4. **Actions**, each with an owner and due date (typical list below).\n5. **Blameless culture**: focus on system gaps; the person who made the config change helps design the safeguard.\n\nTypical actions:\n\n- dead-man's switch: alert if no completed nightly results within 26 hours\n- non-zero exit codes for infrastructure failures and an explicit BLOCKED status\n- dashboard shows \"last run: N hours ago\" in red when stale\n- credential expiry monitoring\n- a synthetic canary test that must always run and pass", "code": "from datetime import datetime, timedelta, timezone\n\ndef dead_mans_switch(last_completed: datetime, now: datetime, max_age=timedelta(hours=26)):\n    age = now - last_completed\n    status = \"ALERT: nightly results missing\" if age > max_age else \"ok\"\n    return f\"last nightly completed {age.total_seconds() / 3600:5.1f} h ago -> {status}\"\n\nnow = datetime(2026, 9, 28, 9, 0, tzinfo=timezone.utc)\nprint(dead_mans_switch(datetime(2026, 9, 28, 3, 40, tzinfo=timezone.utc), now))\nprint(dead_mans_switch(datetime(2026, 9, 21, 3, 40, tzinfo=timezone.utc), now))\n\ndef orchestrator_exit_code(reserved_devices, results):\n    if reserved_devices == 0: return 3          # infrastructure failure must NOT look like success\n    if any(r == \"FAIL\" for r in results): return 1\n    return 0\nprint(\"exit code when no devices could be reserved:\", orchestrator_exit_code(0, []))", "follow": ["How do you decide whether to re-run the missed week of coverage? => Check which firmware builds were released or promoted during the gap, prioritize those, and run the regression on them now; document the residual risk for builds you can't cover.", "How do you make sure postmortem actions actually get done? => Track them as tickets with owners and dates, review them in a recurring meeting, and close the postmortem only when detection actions are verified (e.g. by deliberately triggering the alert)."], "pitfall": "Stopping at the immediate cause (\"the credential expired, renewed it\") without fixing why a week passed before anyone noticed.", "signals": "You run it blameless, separate root cause from detection gaps, assess product impact, and produce owned actions centred on monitoring for absence of success.", "module": 10, "output": "last nightly completed   5.3 h ago -> ok\nlast nightly completed 173.3 h ago -> ALERT: nightly results missing\nexit code when no devices could be reserved: 3", "num": 67}, {"type": "Scenario", "level": "Principal", "question": "A talented engineer keeps writing very clever Python (metaclasses, dynamic attribute magic) that others struggle to maintain. How do you handle it?", "short": "Address it through shared standards and specific examples, not personal criticism. In review, ask what problem the cleverness solves and show a simpler alternative (a dataclass, a plain function, `__init_subclass__`, explicit registration); agree on a team principle like \"optimize for the reader, magic needs a design note\"; and channel their talent into the places where abstractions pay off, such as core framework APIs with tests and documentation.", "deep": "Approach:\n\n- **Private conversation first**: acknowledge their skill; explain the team cost (onboarding, debugging, bus factor) with concrete incidents (a bug that took two days because attribute access was dynamic).\n- **Criteria, not taste**: agree with the team on when advanced features are justified: they must remove significant duplication, have tests, type hints that still work (metaclass magic often defeats type checkers and IDEs), and a short design note.\n- **Offer simpler equivalents**: `__init_subclass__` instead of a metaclass for registration; `dataclasses`/`attrs` instead of generated `__init__`; explicit dispatch tables instead of `getattr(self, f\"handle_{x}\")`; descriptors only for repeated field validation.\n- **Growth path**: ask them to lead the core framework's extension API, where careful abstraction design is the job, pairing with others and writing docs, which makes their work maintainable by design.\n- **Review culture**: \"Could a new team member debug this at 2 a.m.?\" becomes a standard review question for everyone, not a rule aimed at one person.", "code": "# Clever: metaclass + dynamic attributes (hard to read, invisible to type checkers and IDEs)\nclass AutoRegister(type):\n    registry = {}\n    def __new__(m, name, bases, ns):\n        cls = super().__new__(m, name, bases, ns)\n        m.registry[name.lower().removesuffix(\"test\")] = cls\n        return cls\nclass Base(metaclass=AutoRegister):\n    def __getattr__(self, item):                     # silently invents attributes\n        return lambda *a: f\"{item}{a}\"\nclass TrimTest(Base): pass\nprint(\"clever:\", AutoRegister.registry, TrimTest().anything(1))   # typos never fail!\n\n# Simple: explicit, typed, same capability\nREGISTRY: dict[str, type] = {}\nclass Test:\n    def __init_subclass__(cls, *, name: str, **kw):\n        super().__init_subclass__(**kw); REGISTRY[name] = cls\nclass Trim(Test, name=\"trim\"):\n    def run(self, lba: int) -> str: return f\"trim at {lba}\"\nprint(\"simple:\", REGISTRY, Trim().run(8))\ntry:\n    Trim().rn(8)\nexcept AttributeError as e:\n    print(\"typo caught:\", e)", "follow": ["What if the clever code is genuinely the best technical solution? => Then keep it, but make it maintainable: isolate it in one well-named module, add thorough tests, type stubs or `Protocol`s for users, and a design note explaining how it works.", "How do you measure whether this improved? => Review turnaround and back-and-forth on that area, bugs traced to it, and how quickly other engineers can make changes there."], "pitfall": "Publicly criticizing the engineer's style, or banning features outright; both push away strong engineers and don't create shared judgment.", "signals": "You keep it constructive and specific, use team-agreed criteria rather than taste, offer simpler equivalents, and redirect the engineer's strengths to where they add value.", "module": 10, "output": "clever: {'base': <class '__main__.Base'>, 'trim': <class '__main__.TrimTest'>} anything(1,)\nsimple: {'trim': <class '__main__.Trim'>} trim at 8\ntypo caught: 'Trim' object has no attribute 'rn'", "num": 68}, {"type": "Design", "level": "Principal", "question": "When would you choose a language other than Python for part of the test infrastructure, and how do you integrate it?", "short": "Keep Python for orchestration, test logic and analysis (fast to write, huge ecosystem, readable by validation engineers). Move a component to Go, Rust or C/C++ when measurements show Python can't meet a hard requirement: microsecond-level I/O timing, very high command rates, memory-safe native device access, or a small static binary for constrained targets. Integrate through narrow boundaries: an extension module (PyO3/pybind11), a CLI with JSON output, or a service with a typed API.", "deep": "Decision criteria:\n\n- **Requirement, not preference**: latency jitter (Python's GC and interpreter overhead matter at microsecond scales), throughput (millions of small operations per second), memory footprint, deployment constraints (no interpreter on the target), or an existing library only available natively.\n- **Team skills and ownership**: who maintains the Rust component in two years? Is there a second person who knows it?\n- **Integration cost**: extension modules give the lowest overhead but need wheels per platform and careful API design (batch calls, release the GIL); a CLI or service boundary is simpler to deploy and debug but costs serialization and process overhead.\n- **Examples**: a high-rate I/O workload generator in Rust or C (like `fio`), driven by Python which configures runs and analyses results; a Go daemon for device pool leasing across labs, called over HTTP from Python.\n\nReversibility: keep the boundary small and well-tested (contract tests from the Python side) so the native part can be replaced or retired.", "code": "", "follow": ["Why is `fio` driven from Python a good pattern? => The tight I/O loop runs natively with precise timing, while Python handles configuration, orchestration, result parsing (`--output-format=json`) and analysis: each language does what it's good at.", "How do you keep the native component from becoming a single point of knowledge? => Pairing, documentation, a narrow API with contract tests from Python, and hiring or training at least two maintainers before it becomes critical."], "pitfall": "Rewriting in Rust/Go because it's \"faster\" without measuring, or keeping a pure-Python hot loop that can never meet a hard timing requirement.", "signals": "You tie language choice to measured requirements and team capacity, pick an integration boundary with its trade-offs, and keep the decision reversible.", "module": 10, "output": "", "num": 69}]};
const MODULES = DATA.modules || [], QUESTIONS = DATA.questions || [];
const TYPE_COLOR = {"Concept":"var(--t-concept)","Design":"var(--t-design)","Scenario":"var(--t-scenario)","Debug":"var(--t-debug)","Trap":"var(--t-trap)","Code review":"var(--t-review)"};
const modById = Object.fromEntries(MODULES.map(m=>[m.id,m]));

let activeTypes = new Set(Object.keys(TYPE_COLOR));
let query = '', current = null, quiz = false, revealed = false;
const collapsed = new Set();
const KEY = 'pyprin-ready';
let known = new Set();
try { known = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch(e) {}
try { quiz = localStorage.getItem('pyprin-quiz') === '1'; } catch(e) {}
function saveKnown(){ try { localStorage.setItem(KEY, JSON.stringify([...known])); } catch(e) {} }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inline(s){ return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); }
function md(text){
  return String(text).split(/\n\s*\n/).map(block=>{
    const lines = block.split('\n').filter(l=>l.trim());
    if (lines.length && lines.every(l=>/^\s*- /.test(l))) return '<ul>'+lines.map(l=>'<li>'+inline(l.replace(/^\s*- /,''))+'</li>').join('')+'</ul>';
    if (lines.length && lines.every(l=>/^\s*\d+\. /.test(l))) return '<ol>'+lines.map(l=>'<li>'+inline(l.replace(/^\s*\d+\. /,''))+'</li>').join('')+'</ol>';
    return '<p>'+inline(lines.join(' '))+'</p>';
  }).join('');
}
function matches(q){
  if (!activeTypes.has(q.type)) return false;
  if (query){
    const h = (q.question+' '+q.short+' '+q.deep+' '+q.code+' '+q.follow.join(' ')).toLowerCase();
    if (!query.toLowerCase().split(/\s+/).every(w=>h.includes(w))) return false;
  }
  return true;
}
function filtered(){ return QUESTIONS.filter(matches); }

function buildFilters(){
  const box = document.getElementById('typeFilters');
  Object.keys(TYPE_COLOR).forEach(t=>{
    const c = document.createElement('button');
    c.className='chip active'; c.innerHTML='<span class="d" style="background:'+TYPE_COLOR[t]+'"></span>'+t;
    c.onclick=()=>{ activeTypes.has(t)?activeTypes.delete(t):activeTypes.add(t); c.classList.toggle('active'); buildSidebar(); };
    box.appendChild(c);
  });
}
function buildSidebar(){
  const box = document.getElementById('navGroups'); box.innerHTML='';
  let shown = 0;
  MODULES.forEach(m=>{
    const items = QUESTIONS.filter(q=>q.module===m.id && matches(q));
    if (!items.length) return;
    shown += items.length;
    const label = document.createElement('div');
    label.className='nav-group-label';
    label.innerHTML='<span>'+m.id+'. '+esc(m.title).toUpperCase()+'</span><span>'+(collapsed.has(m.id)?'+':'−')+'&nbsp;'+items.length+'</span>';
    label.onclick=()=>{ collapsed.has(m.id)?collapsed.delete(m.id):collapsed.add(m.id); buildSidebar(); };
    box.appendChild(label);
    if (collapsed.has(m.id)) return;
    items.forEach(q=>{
      const el = document.createElement('div');
      el.className='nav-item'+(current&&current.num===q.num?' active':''); el.id='nav-'+q.num; el.tabIndex=0;
      el.innerHTML='<span class="tdot" style="background:'+TYPE_COLOR[q.type]+'" title="'+q.type+'"></span><span class="qnum">'+q.num+'</span><span>'+inline(q.question.length>78?q.question.slice(0,76)+'…':q.question)+'</span>'+(known.has(q.num)?'<span class="known">✓</span>':'');
      el.onclick=()=>go(q.num);
      el.onkeydown=e=>{ if(e.key==='Enter') go(q.num); };
      box.appendChild(el);
    });
  });
  if (!shown) box.innerHTML='<div class="empty">No questions match these filters.</div>';
  document.getElementById('statShown').textContent = shown;
  document.getElementById('statKnown').textContent = known.size;
}

function renderHome(){
  const withOut = QUESTIONS.filter(q=>q.output).length;
  const nFollow = QUESTIONS.reduce((a,q)=>a+q.follow.length,0);
  let h = '<div class="home-hero"><p class="kicker">OVERVIEW</p><h2>Python for Principal Engineers</h2>'+
    '<p>'+QUESTIONS.length+' deep questions across '+MODULES.length+' modules: CPython internals, concurrency and performance, large-codebase design, test-framework architecture, hardware and binary interfaces, reliability, security and technical leadership. Every question has a 30-second answer, a deep dive, and follow-ups. The code was executed with Python 3.14 when this page was built, and the output shown is real.</p>'+
    '<div class="home-stats">'+
      '<div class="stat-box"><div class="n">'+QUESTIONS.length+'</div><div class="l">Deep questions</div></div>'+
      '<div class="stat-box"><div class="n">'+withOut+'</div><div class="l">With executed code</div></div>'+
      '<div class="stat-box"><div class="n">'+nFollow+'</div><div class="l">Follow-up questions</div></div>'+
      '<div class="stat-box"><div class="n">'+known.size+'</div><div class="l">Marked ready</div></div>'+
    '</div></div>'+
    '<div class="section-label">WHAT CHANGES AT PRINCIPAL LEVEL</div><ul class="levels">'+
      '<li><b>Senior</b> answers "how does X work and how do I use it". <b>Principal</b> answers "which option, why, what does it cost, how do we roll it out safely, and how will we know it worked".</li>'+
      '<li>Expect scenarios with no single right answer: a flaky 10,000-test suite, a service leaking memory, a team debating asyncio vs threads. Interviewers score your reasoning and trade-offs, not the final choice.</li>'+
      '<li>Depth on internals is still tested (GIL, memory, bytecode), but always tied to a consequence: latency, cost, reliability, developer velocity.</li>'+
      '<li>You will be asked about influence: code-review standards, migrations across many teams, mentoring, and saying no.</li></ul>'+
    '<div class="section-label">A FRAMEWORK FOR DESIGN AND SCENARIO ANSWERS</div><div class="framework">'+
      '<div><b><span>1</span>Clarify</b><p>Scale, constraints, what "done" means, who is affected. Ask before designing.</p></div>'+
      '<div><b><span>2</span>Options</b><p>Two or three real alternatives, including "do nothing" or "buy, don\'t build".</p></div>'+
      '<div><b><span>3</span>Decide</b><p>Pick one and give the deciding trade-off in one sentence.</p></div>'+
      '<div><b><span>4</span>Risks & rollout</b><p>Failure modes, migration path, feature flags, rollback.</p></div>'+
      '<div><b><span>5</span>Measure</b><p>The metric that proves it worked, and the alert that says it broke.</p></div>'+
    '</div>'+
    '<div class="section-label">MODULES</div><div class="section-list">';
  MODULES.forEach(m=>{
    const qs = QUESTIONS.filter(q=>q.module===m.id);
    if (!qs.length) return;
    const k = qs.filter(q=>known.has(q.num)).length;
    h += '<button class="section-card" onclick="go('+qs[0].num+')"><div class="sc-title">'+m.id+'. '+esc(m.title)+'</div><div class="sc-desc">'+esc(m.desc)+'</div>'+
      '<div class="sc-meta">'+qs.length+' questions · '+k+' ready</div><div class="bar"><span style="width:'+(100*k/qs.length)+'%"></span></div></button>';
  });
  return h+'</div><p class="kbd-hint">Keys: ← / → previous and next · R random · Space reveal (quiz mode) · K mark ready</p>';
}

function renderQuestion(q){
  const list = filtered(), i = list.findIndex(x=>x.num===q.num);
  const prev = i>0?list[i-1]:null, next = i>=0&&i<list.length-1?list[i+1]:null;
  const m = modById[q.module];
  let body;
  if (quiz && !revealed){
    body = '<div class="reveal"><button class="btn on" onclick="reveal()">Think it through, then show the answer (Space)</button></div>';
  } else {
    body = '<div class="section-label">30-SECOND ANSWER</div><div class="short md">'+md(q.short)+'</div>'+
      '<div class="section-label">DEEP DIVE</div><div class="deep md">'+md(q.deep)+'</div>';
    if (q.code){
      body += '<div class="section-label">EXAMPLE</div><div class="code-stack"><div class="code-wrap"><span class="code-label">PYTHON</span><pre><code class="language-python">'+esc(q.code)+'</code></pre></div>'+
        (q.output?'<div class="code-wrap out-wrap"><span class="code-label out">OUTPUT</span><pre><code class="nohighlight">'+esc(q.output)+'</code></pre></div>':'')+'</div>';
    }
    body += '<div class="section-label">LIKELY FOLLOW-UPS</div><div class="follow">'+q.follow.map(f=>{
      const [fq, fa] = f.split('=>'); return '<details><summary>'+inline(fq.trim())+'</summary><div class="fa md">'+md(fa.trim())+'</div></details>';
    }).join('')+'</div>'+
    '<div class="boxes"><div class="box pit"><h4>COMMON PITFALL</h4><div class="md">'+md(q.pitfall)+'</div></div>'+
    '<div class="box sig"><h4>WHAT A STRONG ANSWER SHOWS</h4><div class="md">'+md(q.signals)+'</div></div></div>';
  }
  const k = known.has(q.num);
  return '<div class="qcard"><div class="q-meta"><span class="badge '+q.level+'">'+q.level.toUpperCase()+'</span>'+
    '<span class="badge type"><span class="d" style="background:'+TYPE_COLOR[q.type]+'"></span>'+q.type.toUpperCase()+'</span>'+
    '<span class="q-num">Q'+q.num+' · Module '+q.module+': '+esc(m.title)+'</span></div>'+
    '<h2 class="q-title">'+inline(q.question)+'</h2>'+body+
    '<div class="q-actions"><button class="btn'+(k?' done':'')+'" onclick="toggleKnown('+q.num+')">'+(k?'✓ Ready':'Mark as ready (K)')+'</button></div>'+
    '<div class="footer-nav"><button class="btn" '+(prev?'onclick="go('+prev.num+')"':'disabled')+'><span class="dir">← PREV</span>'+(prev?'Q'+prev.num:'')+'</button>'+
    '<button class="btn" '+(next?'onclick="go('+next.num+')"':'disabled')+' style="text-align:right"><span class="dir">NEXT →</span>'+(next?'Q'+next.num:'')+'</button></div>'+
    '<p class="kbd-hint">'+(i+1)+' of '+list.length+' in current filter</p></div>';
}

function paint(){
  const c = document.getElementById('content');
  if (!current){ c.innerHTML = renderHome(); document.getElementById('crumbCurrent').textContent='Overview'; }
  else {
    c.innerHTML = renderQuestion(current);
    document.getElementById('crumbCurrent').textContent = 'Q'+current.num+' · '+modById[current.module].title;
    if (window.hljs) c.querySelectorAll('pre code.language-python').forEach(el=>hljs.highlightElement(el));
  }
}
function go(num){
  current = num ? QUESTIONS.find(q=>q.num===Number(num)) || null : null;
  revealed = false;
  document.querySelectorAll('.nav-item.active').forEach(e=>e.classList.remove('active'));
  if (current){
    const el = document.getElementById('nav-'+current.num);
    if (el){ el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
    if (location.hash !== '#q'+current.num) history.replaceState(null,'','#q'+current.num);
  } else if (location.hash) history.replaceState(null,'',location.pathname+location.search);
  paint(); document.getElementById('sidebar').classList.remove('open'); window.scrollTo(0,0);
}
function reveal(){ revealed = true; paint(); }
function toggleKnown(n){ known.has(n)?known.delete(n):known.add(n); saveKnown(); buildSidebar(); paint(); }
function step(d){
  const l = filtered(); if (!l.length) return;
  if (!current){ go(l[0].num); return; }
  const i = l.findIndex(x=>x.num===current.num), t = l[i+d]; if (t) go(t.num);
}
function random(){ const l = filtered(); if (l.length) go(l[Math.floor(Math.random()*l.length)].num); }
function setQuiz(v){
  quiz = v; try { localStorage.setItem('pyprin-quiz', v?'1':'0'); } catch(e) {}
  const b = document.getElementById('quizBtn'); b.textContent='Quiz mode: '+(v?'on':'off'); b.classList.toggle('on', v);
  revealed = false; paint();
}
document.getElementById('search').addEventListener('input', e=>{ query = e.target.value.trim(); buildSidebar(); });
document.getElementById('quizBtn').onclick = ()=>setQuiz(!quiz);
document.getElementById('randBtn').onclick = random;
document.addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key==='ArrowRight') step(1); else if (e.key==='ArrowLeft') step(-1);
  else if (e.key==='r'||e.key==='R') random();
  else if ((e.key==='k'||e.key==='K') && current) toggleKnown(current.num);
  else if (e.key===' ' && current && quiz && !revealed){ e.preventDefault(); reveal(); }
});
window.addEventListener('hashchange', ()=>{ const m = location.hash.match(/^#q(\d+)$/); go(m?m[1]:null); });
buildFilters(); setQuiz(quiz); buildSidebar();
const m0 = location.hash.match(/^#q(\d+)$/); go(m0?m0[1]:null);
</script>
