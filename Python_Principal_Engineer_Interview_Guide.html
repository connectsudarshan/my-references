or the HAL interface, integration tests on a small real hardware pool before release, and staged rollout of framework versions (canary rack first). Also test that failures are detected: inject faults and confirm tests fail.", "deep": "Layers:\n\n- **Unit tests** of scheduling, result parsing, config handling and fixtures, using an in-memory simulator implementing the HAL protocol. Seconds, on every PR.\n- **Contract tests**: one test suite parameterized over implementations (simulator, real driver). If the simulator drifts from reality, the contract suite catches it on hardware nightly.\n- **Fault injection**: the simulator can corrupt data, time out, drop commands or report critical warnings. The framework must turn each into the correct verdict. This tests the test (\"does it detect the bug it exists for?\").\n- **Mutation-style checks**: deliberately break a verifier and confirm tests fail (a verifier that always passes is the most dangerous bug in validation).\n- **Release process**: version the framework, run the canary rack on the new version alongside the old, compare verdict distributions, then roll out.\n- **Metrics**: framework-caused failures (\"infrastructure\" category) tracked separately from product failures.", "code": "import zlib\n\nclass SimulatedDrive:\n    def __init__(self, fault=None): self.blocks, self.fault = {}, fault\n    def write(self, lba, data): self.blocks[lba] = data\n    def read(self, lba):\n        data = self.blocks[lba]\n        if self.fault == \"bitflip\" and lba == 7:\n            data = bytes([data[0] ^ 0x01]) + data[1:]           # injected corruption\n        if self.fault == \"stale\" and lba == 3:\n            return b\"\\0\" * len(data)                              # injected lost write\n        return data\n\ndef verify_test(drive, lbas=range(10)):\n    for lba in lbas:\n        drive.write(lba, lba.to_bytes(4, \"little\") * 128)\n    bad = [lba for lba in lbas if zlib.crc32(drive.read(lba)) != zlib.crc32(lba.to_bytes(4, \"little\") * 128)]\n    return (\"FAIL\", bad) if bad else (\"PASS\", [])\n\nfor fault in (None, \"bitflip\", \"stale\"):\n    print(f\"fault={fault!s:8} -> verdict {verify_test(SimulatedDrive(fault))}\")", "follow": ["How do you keep the simulator honest? => Run the same contract suite against the simulator and real devices; any divergence is a simulator bug. Record real device traces and replay them into the simulator.", "What's the risk of relying on a simulator? => It encodes your assumptions; timing, error recovery and firmware quirks may be missing. Use it for framework logic and fast feedback, never as a substitute for hardware validation of the product."], "pitfall": "A verifier that silently passes (for example comparing a buffer with itself). Without fault injection, nobody notices until a customer finds the data corruption.", "signals": "You test the framework with simulators, contract tests and fault injection, prove verifiers can fail, and release framework changes gradually with verdict comparisons.", "module": 6, "output": "fault=None     -> verdict ('PASS', [])\nfault=bitflip  -> verdict ('FAIL', [7])\nfault=stale    -> verdict ('FAIL', [3])", "num": 41}, {"type": "Concept", "level": "Principal", "question": "How do pytest fixtures, scopes and finalization work under the hood, and what goes wrong at scale?", "short": "pytest builds a dependency graph from fixture names in test signatures, instantiates each fixture once per scope (function, class, module, package, session), and caches it for that scope. Generator fixtures run setup before `yield` and teardown after, in reverse dependency order, even when tests fail. At scale, problems come from too-broad scopes sharing mutated state, expensive autouse fixtures, and teardown that can itself fail or hang.", "deep": "Mechanics:\n\n- Resolution by **name**: `def test_x(device, tmp_path)` requests fixtures; fixtures can request other fixtures. `conftest.py` files provide fixtures to their directory tree; closer definitions override farther ones.\n- **Caching per scope**: a module-scoped fixture is created once per test module and shared by its tests. Parametrized fixtures create one instance per parameter.\n- **Teardown order**: last set up, first torn down. If setup fails, teardown of already-created fixtures still runs; the test is reported as an error, not a failure.\n- `request.addfinalizer` registers extra cleanup; `yield` fixtures are the modern form.\n\nPitfalls at scale:\n\n- **Scope creep**: making `device` session-scoped for speed means tests share device state; pair broad scopes with explicit reset fixtures.\n- **autouse** fixtures run for every test, often invisibly; keep them cheap.\n- **Teardown failures** mask original failures or leave hardware reserved; make teardown idempotent, time-limited and logged.\n- **xdist**: each worker has its own session, so \"session\" fixtures run once per worker, not once globally; use locks or an external service for truly global setup.", "code": "# Equivalent semantics demonstrated without pytest: scoped caching + reverse-order teardown\nfrom contextlib import ExitStack, contextmanager\n\n@contextmanager\ndef lab():\n    print(\"setup lab (session)\"); yield \"lab\"; print(\"teardown lab\")\n@contextmanager\ndef device(lab):\n    print(f\"  setup device on {lab} (module)\"); yield \"nvme0\"; print(\"  teardown device\")\n@contextmanager\ndef namespace(dev):\n    print(f\"    setup namespace on {dev} (function)\"); yield \"ns1\"; print(\"    teardown namespace\")\n\ntests = {\"test_write\": lambda ns: None, \"test_trim\": lambda ns: 1 / 0}\nwith ExitStack() as session:\n    lab_obj = session.enter_context(lab())\n    with ExitStack() as module:\n        dev = module.enter_context(device(lab_obj))\n        for name, body in tests.items():\n            with ExitStack() as fn:\n                ns = fn.enter_context(namespace(dev))\n                try:\n                    body(ns); print(f\"    {name}: PASS\")\n                except Exception as e:\n                    print(f\"    {name}: FAIL ({type(e).__name__}) -> teardown still runs\")", "follow": ["How do you do one-time global setup (e.g. flash firmware on all devices) when running with pytest-xdist? => Use a file lock or an external coordination service inside the session fixture so only the first worker performs it and others wait, or do it in a separate pipeline step before pytest starts.", "A session fixture's teardown hangs. What happens and how do you protect against it? => The run never finishes and hardware stays reserved; wrap teardown steps in timeouts, log each step, and rely on pool leases that expire."], "pitfall": "Widening fixture scope to save setup time without adding state reset, then chasing order-dependent failures for weeks.", "signals": "You explain name-based resolution, per-scope caching and teardown order, and connect them to scaling problems: shared state, autouse cost, xdist semantics and robust teardown.", "module": 6, "output": "setup lab (session)\n  setup device on lab (module)\n    setup namespace on nvme0 (function)\n    test_write: PASS\n    teardown namespace\n    setup namespace on nvme0 (function)\n    test_trim: FAIL (ZeroDivisionError) -> teardown still runs\n    teardown namespace\n  teardown device\nteardown lab", "num": 42}, {"type": "Concept", "level": "Principal", "question": "Parse an NVMe SMART / Health Information log page (log ID 02h, 512 bytes) in Python. What must you get right?", "short": "Use `struct` with an explicit little-endian format (`<`) at the documented byte offsets: critical warning (byte 0, a bit field), composite temperature (bytes 1-2, Kelvin), available spare, threshold and percentage used (bytes 3-5), then 16-byte (128-bit) counters from byte 32 onward, which need `int.from_bytes(..., \"little\")` because `struct` has no 128-bit type. Convert units (data units are thousands of 512-byte units) and decode warning bits by name.", "deep": "Key details:\n\n- **Endianness**: NVMe structures are little-endian. Always use `<` in struct formats; native `@` alignment and byte order can differ by platform.\n- **Offsets from the spec** (NVMe base spec, SMART / Health log): byte 0 critical warning; bytes 1-2 composite temperature in Kelvin; 3 available spare (%); 4 spare threshold (%); 5 percentage used; bytes 32-47 data units read; 48-63 data units written; 64-79 host read commands; 80-95 host write commands; 96-111 controller busy time; 112-127 power cycles; 128-143 power-on hours; 144-159 unsafe shutdowns; 160-175 media and data integrity errors; 176-191 error log entries.\n- **128-bit counters**: `int.from_bytes(buf[32:48], \"little\")`; Python ints are unbounded, so no overflow.\n- **Units**: one data unit = 1000 x 512 bytes, so bytes = units x 512,000.\n- **Critical warning bits**: 0 spare below threshold, 1 temperature threshold, 2 reliability degraded, 3 media read-only, 4 volatile memory backup failed, 5 persistent memory region read-only.\n- **Validation**: check the buffer length before parsing, and keep the raw bytes in the result bundle so parsing bugs can be fixed retroactively.\n\nDesign point: put this in a typed, tested parser (a dataclass with `from_bytes`) inside the HAL, with golden-file tests from real devices.", "code": "import struct\nfrom dataclasses import dataclass\n\nWARN_BITS = [\"spare_below_threshold\", \"temperature\", \"reliability_degraded\", \"read_only\", \"volatile_backup_failed\", \"pmr_read_only\"]\n\ndef u128(buf, off): return int.from_bytes(buf[off:off + 16], \"little\")\n\n@dataclass(frozen=True)\nclass SmartLog:\n    critical_warning: list; temperature_c: int; available_spare: int; spare_threshold: int\n    percent_used: int; data_written_tb: float; power_on_hours: int; unsafe_shutdowns: int; media_errors: int\n\n    @classmethod\n    def from_bytes(cls, buf: bytes) -> \"SmartLog\":\n        if len(buf) != 512: raise ValueError(f\"SMART log must be 512 bytes, got {len(buf)}\")\n        warn, temp_k, spare, thresh, used = struct.unpack_from(\"<BHBBB\", buf, 0)\n        return cls([n for i, n in enumerate(WARN_BITS) if warn >> i & 1], temp_k - 273, spare, thresh, used,\n                   round(u128(buf, 48) * 512_000 / 1e12, 2), u128(buf, 128), u128(buf, 144), u128(buf, 160))\n\n# build a fake page the way a device would return it\npage = bytearray(512)\nstruct.pack_into(\"<BHBBB\", page, 0, 0b00000101, 318, 7, 10, 91)     # warnings: spare + reliability; 45 C\npage[48:64] = (123_456_789).to_bytes(16, \"little\")                    # data units written\npage[128:144] = (41_230).to_bytes(16, \"little\")                       # power-on hours\npage[144:160] = (17).to_bytes(16, \"little\")                           # unsafe shutdowns\npage[160:176] = (2).to_bytes(16, \"little\")                            # media errors\nlog = SmartLog.from_bytes(bytes(page))\nprint(log)\nprint(\"health gate:\", \"FAIL\" if log.critical_warning or log.available_spare < log.spare_threshold else \"PASS\")", "follow": ["Why not read the counters as two 64-bit values with `<QQ`? => You can (low, high = ...; value = low | high << 64), but `int.from_bytes` over 16 bytes is clearer and handles the full 128-bit range directly.", "How do you test the parser without hardware? => Golden files: capture raw 512-byte pages from real devices (including a failing one), store them in the repo, and assert parsed fields; add hand-built edge cases like maximum counters and all warning bits set."], "pitfall": "Using native format characters (`struct.unpack('HBB', ...)`) without `<`: native mode inserts alignment padding and uses host byte order, so offsets silently shift.", "signals": "You insist on explicit endianness and spec offsets, handle 128-bit counters and units correctly, decode bit fields by name, validate length, and keep raw data for re-parsing.", "module": 7, "output": "SmartLog(critical_warning=['spare_below_threshold', 'reliability_degraded'], temperature_c=45, available_spare=7, spare_threshold=10, percent_used=91, data_written_tb=63.21, power_on_hours=41230, unsafe_shutdowns=17, media_errors=2)\nhealth gate: FAIL", "num": 43}, {"type": "Concept", "level": "Principal", "question": "How do you decode hardware register values in Python, and when would you use `ctypes` bit-fields instead of shifts and masks?", "short": "Shifts and masks (`(value >> shift) & ((1 << width) - 1)`) driven by a field table are portable, explicit and easy to test; they're my default. `ctypes.Structure` with bit-field declarations is convenient for mirroring a C header, but bit-field layout is compiler/ABI-defined, so verify it against known values. Python ints are arbitrary precision, so mask results explicitly and convert two's-complement fields yourself.", "deep": "Example: the NVMe Controller Capabilities (CAP) register is 64 bits: MQES bits 15:0 (maximum queue entries, zero-based), CQR bit 16, AMS bits 18:17, TO bits 31:24 (timeout in 500 ms units), DSTRD bits 35:32, NSSRS bit 36, CSS bits 44:37, BPS bit 45, MPSMIN bits 51:48, MPSMAX bits 55:52.\n\nA **field table** approach (`{\"MQES\": (0, 16), \"TO\": (24, 8), ...}`) gives one generic decoder, pretty printing and round-trip encoding, and the table can be generated from the spec or a register description file.\n\n**Signed fields**: if the top bit of a `width`-bit field is set, subtract `1 << width`.\n\n**ctypes**: `class CAP(ctypes.LittleEndianStructure): _fields_ = [(\"MQES\", c_uint64, 16), ...]` mirrors C bit-fields. Use `LittleEndianStructure` to fix byte order, `_pack_` to control padding, and `from_buffer_copy(raw)` to parse. Always cross-check against the shift/mask decoder in a unit test.\n\nAlso useful: `int.bit_count()` (3.10+) for population counts, `format(v, \"#018x\")` for fixed-width hex display.", "code": "import ctypes\n\nCAP_FIELDS = {\"MQES\": (0, 16), \"CQR\": (16, 1), \"AMS\": (17, 2), \"TO\": (24, 8), \"DSTRD\": (32, 4),\n              \"NSSRS\": (36, 1), \"CSS\": (37, 8), \"BPS\": (45, 1), \"MPSMIN\": (48, 4), \"MPSMAX\": (52, 4)}\n\ndef decode(value, fields):\n    return {name: (value >> shift) & ((1 << width) - 1) for name, (shift, width) in fields.items()}\n\ndef encode(values, fields):\n    out = 0\n    for name, v in values.items():\n        shift, width = fields[name]\n        if v >> width: raise ValueError(f\"{name}={v} does not fit in {width} bits\")\n        out |= v << shift\n    return out\n\ncap = encode({\"MQES\": 1023, \"CQR\": 1, \"TO\": 40, \"DSTRD\": 0, \"CSS\": 0b1, \"MPSMIN\": 0, \"MPSMAX\": 4}, CAP_FIELDS)\nf = decode(cap, CAP_FIELDS)\nprint(f\"CAP = {cap:#018x}\")\nprint(f\"max queue entries {f['MQES'] + 1}, ready timeout {f['TO'] * 0.5:.0f} s, page size {4096 << f['MPSMIN']}..{4096 << f['MPSMAX']} bytes\")\n\nclass CAPBits(ctypes.LittleEndianStructure):\n    _fields_ = [(\"MQES\", ctypes.c_uint64, 16), (\"CQR\", ctypes.c_uint64, 1), (\"AMS\", ctypes.c_uint64, 2),\n                (\"rsvd\", ctypes.c_uint64, 5), (\"TO\", ctypes.c_uint64, 8), (\"DSTRD\", ctypes.c_uint64, 4)]\nbits = CAPBits.from_buffer_copy(cap.to_bytes(8, \"little\"))\nprint(\"ctypes agrees:\", (bits.MQES, bits.TO) == (f[\"MQES\"], f[\"TO\"]))\n\ndef to_signed(v, width): return v - (1 << width) if v >> (width - 1) & 1 else v\nprint(\"12-bit 0xFF6 as signed:\", to_signed(0xFF6, 12), \"| popcount of 0xF0F0:\", (0xF0F0).bit_count())", "follow": ["Why is Python's `~x` surprising for register math? => Python ints are infinite two's complement, so `~0x0F` is `-16`, not `0xF0`; mask it: `~x & 0xFF` for 8-bit registers.", "How would you keep register definitions in sync with firmware? => Generate the field tables (and C headers) from one source of truth, such as a register description file (SystemRDL/IP-XACT or a YAML spec), in the build."], "pitfall": "Assuming `ctypes` bit-field layout matches the hardware without testing it, or forgetting to mask after `~` and left shifts.", "signals": "You use a table-driven decoder with encode/decode round-trip, handle signedness and masking, know ctypes bit-field caveats, and propose a single source of truth for register maps.", "module": 7, "output": "CAP = 0x00400020280103ff\nmax queue entries 1024, ready timeout 20 s, page size 4096..65536 bytes\nctypes agrees: True\n12-bit 0xFF6 as signed: -10 | popcount of 0xF0F0: 8", "num": 44}, {"type": "Concept", "level": "Principal", "question": "How would you issue an NVMe admin command from Python on Linux without a CLI tool?", "short": "Open the controller character device (`/dev/nvme0`), build a `struct nvme_admin_cmd` (the 72-byte `nvme_passthru_cmd`) with `ctypes`, point its `addr` at a buffer you own (a `ctypes` array), and call `fcntl.ioctl(fd, NVME_IOCTL_ADMIN_CMD, cmd)`, where the request code is `_IOWR('N', 0x41, struct)` = `0xC0484E41`. Check the ioctl return value and the command's result/status, and run with the needed privileges.", "deep": "Structure (from `linux/nvme_ioctl.h`): `opcode u8, flags u8, rsvd1 u16, nsid u32, cdw2 u32, cdw3 u32, metadata u64, addr u64, metadata_len u32, data_len u32, cdw10..cdw15 u32, timeout_ms u32, result u32`: 72 bytes.\n\nExample: Identify Controller is opcode `0x06` with `cdw10 = 1` (CNS 01h) and a 4096-byte data buffer.\n\nWhy do this instead of calling `nvme-cli`? Lower overhead per command (no process spawn), direct access to status and result fields, and precise control of timeouts, which matters in stress tests issuing thousands of commands. Why not? It's Linux-specific, needs root or capabilities, and a mistake can harm the device; many teams keep `nvme-cli` for readability and use ioctl only in performance-critical paths or through a vetted library.\n\nSafety: keep a reference to the buffer while the ioctl runs, validate buffer sizes, restrict destructive opcodes (format, sanitize, firmware commit) behind explicit flags, and log every command for reproducibility.", "code": "import ctypes, sys\n\nclass NvmePassthruCmd(ctypes.Structure):\n    _fields_ = [(\"opcode\", ctypes.c_uint8), (\"flags\", ctypes.c_uint8), (\"rsvd1\", ctypes.c_uint16),\n                (\"nsid\", ctypes.c_uint32), (\"cdw2\", ctypes.c_uint32), (\"cdw3\", ctypes.c_uint32),\n                (\"metadata\", ctypes.c_uint64), (\"addr\", ctypes.c_uint64),\n                (\"metadata_len\", ctypes.c_uint32), (\"data_len\", ctypes.c_uint32),\n                (\"cdw10\", ctypes.c_uint32), (\"cdw11\", ctypes.c_uint32), (\"cdw12\", ctypes.c_uint32),\n                (\"cdw13\", ctypes.c_uint32), (\"cdw14\", ctypes.c_uint32), (\"cdw15\", ctypes.c_uint32),\n                (\"timeout_ms\", ctypes.c_uint32), (\"result\", ctypes.c_uint32)]\n\ndef _IOWR(type_char, nr, size):                      # Linux ioctl request encoding\n    return (3 << 30) | (size << 16) | (ord(type_char) << 8) | nr\n\nNVME_IOCTL_ADMIN_CMD = _IOWR(\"N\", 0x41, ctypes.sizeof(NvmePassthruCmd))\nprint(\"sizeof(nvme_passthru_cmd) =\", ctypes.sizeof(NvmePassthruCmd), \"| ioctl =\", hex(NVME_IOCTL_ADMIN_CMD))\n\nbuf = (ctypes.c_uint8 * 4096)()                      # keep a reference while the ioctl runs\ncmd = NvmePassthruCmd(opcode=0x06, cdw10=1, addr=ctypes.addressof(buf), data_len=4096, timeout_ms=5000)\n\nif sys.platform.startswith(\"linux\"):\n    import fcntl, os\n    try:\n        fd = os.open(\"/dev/nvme0\", os.O_RDONLY)\n        fcntl.ioctl(fd, NVME_IOCTL_ADMIN_CMD, cmd)\n        print(\"model:\", bytes(buf[24:64]).decode().strip())      # Identify Controller MN field\n    except OSError as e:\n        print(\"ioctl not possible here:\", e.strerror)\nelse:\n    print(\"not Linux: command built but not sent (opcode 0x06, CNS=1, 4096-byte buffer)\")", "follow": ["How do you tell a transport error from an NVMe command error? => A negative ioctl return / `OSError` means the kernel couldn't submit it; a positive return value is the NVMe status field (status code type and code) meaning the controller rejected it; `result` holds DW0 of the completion.", "How do you prevent a test from accidentally issuing a Format NVM on the wrong drive? => A HAL that requires an explicit destructive-operation flag, verifies the target serial number matches the reservation, and refuses devices marked as system/boot disks."], "pitfall": "Passing a Python `bytes` object's address or letting the buffer be garbage-collected during the call. Use a `ctypes` array (or `bytearray` via `from_buffer`) and keep a reference.", "signals": "You know the passthrough structure and ioctl encoding, compute the request code correctly, handle buffers safely, distinguish error layers, and discuss when ioctl is worth it versus CLI tools.", "module": 7, "output": "sizeof(nvme_passthru_cmd) = 72 | ioctl = 0xc0484e41\nnot Linux: command built but not sent (opcode 0x06, CNS=1, 4096-byte buffer)", "num": 45}, {"type": "Scenario", "level": "Principal", "question": "Your framework shells out to `nvme-cli` and `smartctl` thousands of times. How do you make these calls robust?", "short": "Use `subprocess.run` with an argument **list** (never `shell=True`), a timeout on every call, captured stdout/stderr, `check` semantics mapped to your own exception with the command, exit code and stderr, and machine-readable output (`-o json`, `--json`) parsed and validated instead of scraping text. On timeout kill the whole process group, log every command with duration, and retry only commands known to be safe to repeat.", "deep": "Checklist:\n\n- **No shell**: `[\"nvme\", \"smart-log\", dev, \"-o\", \"json\"]`; device paths or names from inventories can't inject commands.\n- **Timeouts**: hung tools are common with misbehaving devices. On timeout, `subprocess.run` kills the child, but grandchildren (tools that spawn helpers) survive; start with `start_new_session=True` (POSIX) and kill the process group, or `CREATE_NEW_PROCESS_GROUP` on Windows.\n- **Structured output**: JSON output is stable across versions compared to text; validate required fields and types.\n- **Errors**: raise a domain exception (`DeviceCommandError(cmd, rc, stderr)`), never return `None`; classify errors (device vs tool vs environment).\n- **Encoding**: `text=True, encoding=\"utf-8\", errors=\"replace\"` so odd bytes in model strings don't crash parsing.\n- **Environment**: pin tool versions in lab images; record `nvme version` in results.\n- **Performance**: for high-frequency polling, reduce process spawns (batch queries, longer intervals) or switch that path to ioctl.", "code": "import json, subprocess, sys, time\n\nclass DeviceCommandError(RuntimeError):\n    def __init__(self, tool, rc, stderr): super().__init__(f\"{tool} exited {rc}: {stderr.strip()[:80]}\"); self.rc = rc\n\ndef run_tool(tool, args, timeout=5.0):\n    t = time.perf_counter()\n    try:\n        r = subprocess.run(args, capture_output=True, text=True, encoding=\"utf-8\", errors=\"replace\", timeout=timeout)\n    except subprocess.TimeoutExpired:\n        raise TimeoutError(f\"{tool} timed out after {timeout}s\") from None\n    if r.returncode != 0:\n        raise DeviceCommandError(tool, r.returncode, r.stderr)\n    data = json.loads(r.stdout)\n    for field in (\"critical_warning\", \"temperature\"):\n        if field not in data: raise ValueError(f\"missing field {field!r} in tool output\")\n    print(f\"  ok in {(time.perf_counter() - t) * 1000:.0f} ms\")\n    return data\n\nPY = sys.executable\nfake_ok   = [PY, \"-c\", \"import json; print(json.dumps({'critical_warning': 0, 'temperature': 318}))\", \"/dev/nvme0\"]\nfake_err  = [PY, \"-c\", \"import sys; sys.stderr.write('NVMe status: INVALID_FIELD(0x2)'); sys.exit(22)\"]\nfake_hang = [PY, \"-c\", \"import time; time.sleep(30)\"]\nfor label, args in ((\"healthy\", fake_ok), (\"rejected\", fake_err), (\"hung\", fake_hang)):\n    try:\n        print(label, \"->\", run_tool(\"nvme smart-log\", args, timeout=1.0))\n    except (DeviceCommandError, TimeoutError, ValueError) as e:\n        print(label, \"->\", type(e).__name__, e)", "follow": ["Why might a timeout still leave processes running? => `subprocess.run` kills only the direct child; tools that fork helpers leave orphans. Start the child in a new session/process group and kill the group on timeout.", "How do you make these calls testable without hardware? => Put them behind the HAL interface and inject a fake runner that returns recorded JSON outputs and error cases."], "pitfall": "`subprocess.run(f\"nvme smart-log {dev}\", shell=True)` with text scraping via regex: injection risk, locale- and version-dependent parsing, and no timeout.", "signals": "You cover argument lists, timeouts with process-group cleanup, structured output validation, typed errors, encoding, version pinning, and testability via injection.", "module": 7, "output": "  ok in 35 ms\nhealthy -> {'critical_warning': 0, 'temperature': 318}\nrejected -> DeviceCommandError nvme smart-log exited 22: NVMe status: INVALID_FIELD(0x2)\nhung -> TimeoutError nvme smart-log timed out after 1.0s", "num": 46}, {"type": "Design", "level": "Principal", "question": "How do you verify data integrity for terabytes written to a drive during a stress test, efficiently?", "short": "Write **self-describing blocks**: each block embeds its LBA, a write sequence number or generation, and a seed-derived payload plus a checksum, so the verifier can regenerate the expected content without storing it and can tell a corrupted block from a misdirected or stale write. Verify with CRC32 (`zlib`, runs in C and releases the GIL on large buffers) or BLAKE2 for stronger detection, stream in large aligned chunks, and parallelize across regions.", "deep": "Failure modes to detect:\n\n- **Bit flips / corruption**: checksum mismatch.\n- **Misdirected write** (data landed at the wrong LBA): the embedded LBA doesn't match the location read.\n- **Lost or stale write** (old data returned): the embedded generation is older than the last one written.\n- **Torn write** (partial sector update after power loss): checksum mismatch within a block, or mixed generations inside one transfer.\n\nDesign:\n\n- Block header: magic, LBA (u64), generation (u32), seed ID, CRC of payload; payload from `hash(seed, lba, generation)` or a fast PRNG.\n- The verifier recomputes expected data, so no expected-data database is needed, only the per-region generation map (small).\n- Throughput: large sequential I/O (1 MiB+), `readinto` into preallocated buffers, `memoryview` slices, checksum calls on big buffers. Multiple threads work because `zlib.crc32` and `hashlib` release the GIL for large inputs.\n- Report the first bad LBA with the expected vs actual header, and save the raw sector for firmware engineers.", "code": "import struct, zlib, hashlib\n\nSECTOR, MAGIC = 512, 0x5AFE\nHDR = struct.Struct(\"<HQIH\")                     # magic, lba, generation, reserved\ndef make_block(lba, gen, seed=7):\n    payload = hashlib.blake2b(f\"{seed}:{lba}:{gen}\".encode(), digest_size=64).digest() * 7   # 448 bytes\n    body = HDR.pack(MAGIC, lba, gen, 0) + payload\n    body = body.ljust(SECTOR - 4, b\"\\0\")\n    return body + struct.pack(\"<I\", zlib.crc32(body))\n\ndef check(lba, data, expected_gen):\n    if struct.unpack_from(\"<I\", data, SECTOR - 4)[0] != zlib.crc32(data[:SECTOR - 4]):\n        return \"CORRUPT (checksum)\"\n    magic, found_lba, gen, _ = HDR.unpack_from(data)\n    if found_lba != lba: return f\"MISDIRECTED (block for LBA {found_lba})\"\n    if gen < expected_gen: return f\"STALE (gen {gen}, expected {expected_gen})\"\n    return \"OK\"\n\ndisk = {lba: make_block(lba, 1) for lba in range(8)}      # generation 1 everywhere\nfor lba in range(8): disk[lba] = make_block(lba, 2)       # overwrite with generation 2\ndisk[2] = make_block(2, 1)                                 # device returned old data\ndisk[5] = make_block(6, 2)                                 # data landed at the wrong LBA\nflip = bytearray(disk[7]); flip[100] ^= 0x10; disk[7] = bytes(flip)\nfor lba in range(8):\n    print(lba, check(lba, disk[lba], expected_gen=2))", "follow": ["Why not just compare against a copy of what you wrote? => At terabyte scale you can't store it; a deterministic generator makes expected data recomputable from (seed, LBA, generation) with a tiny state map.", "CRC32 or SHA-256? => CRC32 is very fast and catches random corruption well but is not collision-resistant; for adversarial or very large-scale guarantees use BLAKE2/SHA-256, accepting more CPU. Many tools use CRC32C (hardware accelerated) in practice."], "pitfall": "Using a constant pattern (all 0xA5) for every block. It can't detect misdirected or stale writes because every block looks the same.", "signals": "You enumerate failure modes (corruption, misdirected, stale, torn), design self-describing blocks that make them distinguishable, and address throughput and useful failure reporting.", "module": 7, "output": "0 OK\n1 OK\n2 STALE (gen 1, expected 2)\n3 OK\n4 OK\n5 MISDIRECTED (block for LBA 6)\n6 OK\n7 CORRUPT (checksum)", "num": 47}, {"type": "Scenario", "level": "Principal", "question": "Capture a device's serial (UART) console during long tests without losing data or blocking the test. How?", "short": "Read the port in a dedicated background thread (pyserial with a short read timeout, or `asyncio` streams), timestamp each line on arrival, push lines into a bounded ring buffer (`collections.deque(maxlen=N)`) and a log file, and match trigger patterns (panics, asserts, \"watchdog reset\") that set an event the test can wait on. Keep the reader independent of test logic, stop it cleanly with an event, and attach the last N lines to failures.", "deep": "Requirements: consoles produce bursts (boot logs, crash dumps) and silence for hours; losing the lines just before a crash is the worst outcome.\n\nDesign:\n\n- **Reader thread**: blocking reads with a small timeout so it can notice the stop event; never do heavy processing in it, just decode, timestamp, store and match cheap patterns.\n- **Storage**: a ring buffer for \"tail on failure\", plus an append-only file for full history (rotate by size). The deque with `maxlen` is thread-safe for appends and pops.\n- **Triggers**: precompiled regex table (`re.compile(\"panic|ASSERT|WDT reset\")`); on match, record the line and set a `threading.Event` or put into a queue for the orchestrator.\n- **Encoding**: consoles emit garbage bytes during resets; decode with `errors=\"replace\"`.\n- **Timestamps**: host monotonic time plus wall-clock, so console lines can be correlated with test commands and power events.\n- **Robustness**: reconnect if the USB-serial adapter disappears (device reset), and surface \"console silent for N minutes\" as a warning.", "code": "import collections, io, re, threading, time\n\nclass ConsoleCapture:\n    TRIGGERS = re.compile(r\"(PANIC|ASSERT|WDT reset)\")\n    def __init__(self, stream, tail=5):\n        self.stream, self.tail = stream, collections.deque(maxlen=tail)\n        self.stop, self.fatal, self.hits = threading.Event(), threading.Event(), []\n        self.thread = threading.Thread(target=self._run, name=\"uart-reader\", daemon=True)\n    def _run(self):\n        t0 = time.monotonic()\n        while not self.stop.is_set():\n            raw = self.stream.readline()                    # pyserial: port.readline() with timeout\n            if not raw:\n                time.sleep(0.005); continue\n            line = f\"[{time.monotonic() - t0:7.3f}] {raw.decode('utf-8', 'replace').rstrip()}\"\n            self.tail.append(line)\n            if self.TRIGGERS.search(line):\n                self.hits.append(line); self.fatal.set()\n    def __enter__(self): self.thread.start(); return self\n    def __exit__(self, *exc): self.stop.set(); self.thread.join(timeout=2)\n\nfake_port = io.BytesIO(b\"boot: FW 2.1.7\\nFTL: rebuild 100%\\nio: qd32 ok\\nio: qd32 ok\\n\"\n                       b\"\\xff\\xfeASSERT ftl_gc.c:812 free_blocks > 0\\nWDT reset\\nboot: FW 2.1.7\\n\")\nwith ConsoleCapture(fake_port, tail=4) as cap:\n    crashed = cap.fatal.wait(timeout=1.0)           # the test waits on the event, not on the port\n    time.sleep(0.05)\nprint(\"fatal event seen:\", crashed)\nprint(\"first trigger   :\", cap.hits[0])\nprint(\"tail for report :\"); print(\"\\n\".join(cap.tail))", "follow": ["Why not read the serial port inside the test's main thread between commands? => Data arrives while the test is blocked on I/O; the OS buffer can overflow and you lose exactly the lines before a hang or crash.", "How would you do this with asyncio instead of threads? => `pyserial-asyncio` or `asyncio.open_connection` to a serial-over-network bridge, reading lines in a task that feeds an `asyncio.Queue`, with the same ring buffer and trigger logic."], "pitfall": "Unbounded in-memory log lists during a 72-hour run, or decoding with strict UTF-8 so one garbage byte during a reset kills the reader thread and silently stops capture.", "signals": "You separate capture from processing, bound memory, timestamp for correlation, handle bad bytes and reconnects, and expose triggers and tails to the test and reports.", "module": 7, "output": "fatal event seen: True\nfirst trigger   : [  0.000] \ufffd\ufffdASSERT ftl_gc.c:812 free_blocks > 0\ntail for report :\n[  0.000] io: qd32 ok\n[  0.000] \ufffd\ufffdASSERT ftl_gc.c:812 free_blocks > 0\n[  0.000] WDT reset\n[  0.000] boot: FW 2.1.7", "num": 48}, {"type": "Concept", "level": "Principal", "question": "How do you parse a multi-gigabyte binary trace file of fixed-size records efficiently?", "short": "Memory-map the file (`mmap`), wrap it in a `memoryview`, and decode records with a precompiled `struct.Struct`: `iter_unpack` for full scans, `unpack_from(mm, offset)` for random access by index (offset = header + index x record size). Filter early and aggregate as you go instead of building a list of all records. For heavy analytics, convert once to a columnar format.", "deep": "Why `mmap`: the OS pages data in on demand and caches it; you avoid reading the whole file into a Python `bytes` object, and random access to record N is O(1).\n\nTechniques:\n\n- `rec = struct.Struct(\"<QIIHH...\")`; `rec.size` gives the record length; validate `(file_size - header) % rec.size == 0` to detect truncation.\n- `rec.iter_unpack(view[start:end])` decodes a region in C; process in chunks to keep memory flat.\n- Binary search on a sorted field (timestamps) with `unpack_from` at computed offsets finds a time window without scanning.\n- Read the header first (magic, version, record size) and dispatch to the right format version.\n- On Windows, close the mmap before deleting or rewriting the file.", "code": "import mmap, os, struct, tempfile, collections\n\nHEADER = struct.Struct(\"<4sHHI\")                 # magic, version, record_size, count\nREC = struct.Struct(\"<QIBBH\")                    # timestamp_us, lba_lo, opcode, status, latency_us\n\npath = os.path.join(tempfile.mkdtemp(), \"trace.bin\")\nN = 500_000\nwith open(path, \"wb\") as f:\n    f.write(HEADER.pack(b\"TRCE\", 1, REC.size, N))\n    f.write(b\"\".join(REC.pack(1_000 * i, i * 8, (1, 2, 9)[i % 3], 0 if i % 997 else 4, 50 + i % 400) for i in range(N)))\n\nwith open(path, \"rb\") as f, mmap.mmap(f.fileno(), 0, access=mmap.ACCESS_READ) as mm:\n    magic, ver, rsize, count = HEADER.unpack_from(mm, 0)\n    assert magic == b\"TRCE\" and rsize == REC.size and len(mm) == HEADER.size + count * rsize, \"truncated or wrong format\"\n    view = memoryview(mm)[HEADER.size:]\n    errors, slow = collections.Counter(), 0\n    for ts, lba, op, status, lat in REC.iter_unpack(view):          # C-level decode, no list of all records\n        if status: errors[op] += 1\n        slow += lat > 440\n    lo, hi = 0, count                                                  # binary search: first record at t >= 250 ms\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if REC.unpack_from(mm, HEADER.size + mid * REC.size)[0] < 250_000_000: lo = mid + 1\n        else: hi = mid\n    view.release()\nprint(f\"{count:,} records, {os.path.getsize(path) / 1e6:.1f} MB | errors by opcode {dict(errors)} | slow ops {slow}\")\nprint(\"first record at t>=250 s is index\", lo)", "follow": ["How do you handle multiple format versions in the same parser? => Read the header version and select a `Struct` and field mapping per version; keep golden sample files of each version in tests.", "The analysis team wants to run ad-hoc queries on these traces. What do you do? => Convert once to Parquet/Arrow (or DuckDB) with typed columns; queries then run vectorized and far faster than re-parsing binary each time."], "pitfall": "`data = open(path, 'rb').read()` followed by slicing each record into new `bytes` objects: double memory and millions of copies.", "signals": "You use mmap plus Struct for zero-copy decoding, validate headers and sizes, aggregate while streaming, and use offset arithmetic for random access and binary search.", "module": 7, "output": "500,000 records, 8.0 MB | errors by opcode {1: 168, 2: 167, 9: 167} | slow ops 11250\nfirst record at t>=250 s is index 250000", "num": 49}, {"type": "Design", "level": "Principal", "question": "Define an error-handling strategy for a long-running test orchestrator that runs for days.", "short": "Classify errors, don't just catch them: **product failures** (the device misbehaved: record FAIL with evidence), **infrastructure errors** (tool crash, lab network, device unreachable: mark BLOCKED, retry or quarantine), and **framework bugs** (our code is wrong: fail loudly, alert the team). Use a small exception hierarchy that encodes this, catch at clear boundaries (per test, per device), attach context to exceptions, retry only transient infrastructure errors, and never swallow exceptions silently.", "deep": "Why classification matters: the verdict must be trustworthy. Reporting an infrastructure hiccup as a firmware FAIL wastes developer time; reporting a firmware bug as BLOCKED hides it.\n\nDesign:\n\n- **Hierarchy**: `FrameworkError` (base); `ProductFailure(FrameworkError)`, `InfraError(FrameworkError)` with `TransientInfraError`; unexpected exceptions (`KeyError`, `TypeError`) are framework bugs by definition.\n- **Boundaries**: the per-test runner catches everything, converts it to a verdict, collects evidence, and continues with the next test; the orchestrator catches per device; only the top level decides to abort the campaign (for example when more than 20% of devices are BLOCKED, which signals a lab problem).\n- **Context**: `raise InfraError(\"smart-log failed\") from exc` keeps the cause; `exc.add_note(f\"device={sn} test={name}\")` (3.11+) adds context without new types.\n- **Retries**: bounded, with backoff, only for transient infrastructure errors; log each attempt; never retry product failures.\n- **No silent swallowing**: every broad `except` logs with traceback and converts to a verdict or re-raises.\n- **Fail-fast config**: validate configuration and environment at startup, not after 10 hours.", "code": "import time, traceback\n\nclass FrameworkError(Exception): \"\"\"Base for expected, classified failures.\"\"\"\nclass ProductFailure(FrameworkError): \"\"\"Device behaved incorrectly -> FAIL.\"\"\"\nclass InfraError(FrameworkError): \"\"\"Lab/tooling problem -> BLOCKED.\"\"\"\nclass TransientInfraError(InfraError): \"\"\"Worth retrying.\"\"\"\n\ndef with_retry(fn, attempts=3, delay=0.01):\n    for i in range(1, attempts + 1):\n        try:\n            return fn()\n        except TransientInfraError as e:\n            if i == attempts: raise\n            e.add_note(f\"attempt {i} failed\"); time.sleep(delay * 2 ** i)\n\ndef run_test(name, body, device):\n    try:\n        with_retry(body)\n        return \"PASS\", \"\"\n    except ProductFailure as e:\n        return \"FAIL\", f\"{e} (evidence collected from {device})\"\n    except InfraError as e:\n        return \"BLOCKED\", f\"{e}; notes={getattr(e, '__notes__', [])}\"\n    except Exception as e:                                   # a bug in OUR code\n        return \"FRAMEWORK_ERROR\", traceback.format_exception_only(e)[0].strip()\n\nflaky = iter([TransientInfraError(\"ssh timeout\"), None])\ndef t_ok(): pass\ndef t_fw(): raise ProductFailure(\"read returned stale data at LBA 0x1f40\")\ndef t_lab(): raise InfraError(\"power relay unreachable\")\ndef t_retry():\n    err = next(flaky)\n    if err: raise err\ndef t_bug(): return {\"a\": 1}[\"b\"]\nfor name, fn in [(\"wrv\", t_ok), (\"trim\", t_fw), (\"pwr_cycle\", t_lab), (\"smart\", t_retry), (\"report\", t_bug)]:\n    verdict, detail = run_test(name, fn, \"SN001\")\n    print(f\"{name:10} {verdict:16} {detail}\")", "follow": ["When should the whole campaign abort instead of continuing? => When failures indicate a shared cause (most devices BLOCKED at once, the results database down, disk full), because continuing only produces garbage; define explicit abort thresholds.", "How do you stop engineers from writing `except Exception: pass`? => Linters (Ruff `S110`, `BLE001`), review guidelines, and making the framework's per-test boundary the only place broad catches are allowed."], "pitfall": "Treating every exception the same way: either retrying product failures (hiding bugs) or failing the product on lab issues (wasting firmware engineers' time).", "signals": "You classify failures by who must act, encode that in an exception hierarchy, define catch boundaries and retry policy, preserve context, and set campaign-level abort rules.", "module": 8, "output": "wrv        PASS             \ntrim       FAIL             read returned stale data at LBA 0x1f40 (evidence collected from SN001)\npwr_cycle  BLOCKED          power relay unreachable; notes=[]\nsmart      PASS             \nreport     FRAMEWORK_ERROR  KeyError: 'b'", "num": 50}, {"type": "Concept", "level": "Principal", "question": "How do you add correlation context (run ID, device serial, test name) to every log line across threads and asyncio tasks?", "short": "Store the context in `contextvars.ContextVar`s and inject it with a `logging.Filter` (or a custom `LogRecord` factory), and emit structured logs (JSON). Context variables are per-thread and per-asyncio-task automatically (each task copies the context when created), so concurrent device tasks don't mix up their IDs. Avoid passing IDs manually through every function or using thread-local storage with asyncio.", "deep": "Why `contextvars`: asyncio runs many tasks on one thread, so `threading.local` would share one value across all tasks. `ContextVar` values are captured when a task is created (and `asyncio.to_thread` copies the context into the worker thread), so each device task keeps its own values.\n\nImplementation:\n\n- `run_id = ContextVar(\"run_id\", default=\"-\")`, set at the top of each task: `token = device.set(sn)` ... `device.reset(token)`.\n- A `logging.Filter` subclass reads the vars and sets attributes on the record; the formatter includes them. Filters on handlers apply to all loggers, including libraries.\n- JSON logs (one object per line) make searching in ELK/Loki trivial: `device=\"SN007\" AND level=ERROR`.\n- Also stamp results, metrics and artifacts with the same IDs so logs, dashboards and raw data join up.\n\nThreads created with `threading.Thread` do **not** inherit the context by default; use `contextvars.copy_context().run(...)` or executors that copy it (asyncio's `to_thread` does).", "code": "import asyncio, contextvars, json, logging, sys\n\nrun_id = contextvars.ContextVar(\"run_id\", default=\"-\")\ndevice = contextvars.ContextVar(\"device\", default=\"-\")\n\nclass ContextFilter(logging.Filter):\n    def filter(self, record):\n        record.run_id, record.device = run_id.get(), device.get()\n        return True\n\nclass JsonFormatter(logging.Formatter):\n    def format(self, r):\n        return json.dumps({\"lvl\": r.levelname, \"run\": r.run_id, \"dev\": r.device, \"msg\": r.getMessage()})\n\nh = logging.StreamHandler(sys.stdout); h.addFilter(ContextFilter()); h.setFormatter(JsonFormatter())\nlog = logging.getLogger(\"orchestrator\"); log.addHandler(h); log.setLevel(logging.INFO)\n\nasync def test_device(sn, delay):\n    device.set(sn)                                  # visible only inside this task\n    log.info(\"start write-read-verify\")\n    await asyncio.sleep(delay)                      # tasks interleave here\n    await asyncio.to_thread(lambda: log.info(\"CRC check in worker thread\"))\n    log.info(\"done\")\n\nasync def main():\n    run_id.set(\"nightly-2026-09-28\")\n    await asyncio.gather(test_device(\"SN001\", 0.02), test_device(\"SN002\", 0.01))\nasyncio.run(main())", "follow": ["Why not add the device serial to every log message by hand? => It's forgotten in some calls, isn't applied to library logs, and makes messages inconsistent; context injection guarantees every record is tagged.", "How do you propagate the run ID to a subprocess or another service? => Pass it explicitly (environment variable, CLI flag, HTTP header such as W3C `traceparent`), and have the other side set its own context variable from it."], "pitfall": "Using `threading.local()` for request/device context in asyncio code: all tasks on the loop thread share and overwrite it.", "signals": "You pick contextvars and explain why thread-locals fail with asyncio, inject via filters, use structured logs, and extend correlation to results, metrics and subprocesses.", "module": 8, "output": "{\"lvl\": \"INFO\", \"run\": \"nightly-2026-09-28\", \"dev\": \"SN001\", \"msg\": \"start write-read-verify\"}\n{\"lvl\": \"INFO\", \"run\": \"nightly-2026-09-28\", \"dev\": \"SN002\", \"msg\": \"start write-read-verify\"}\n{\"lvl\": \"INFO\", \"run\": \"nightly-2026-09-28\", \"dev\": \"SN002\", \"msg\": \"CRC check in worker thread\"}\n{\"lvl\": \"INFO\", \"run\": \"nightly-2026-09-28\", \"dev\": \"SN001\", \"msg\": \"CRC check in worker thread\"}\n{\"lvl\": \"INFO\", \"run\": \"nightly-2026-09-28\", \"dev\": \"SN002\", \"msg\": \"done\"}\n{\"lvl\": \"INFO\", \"run\": \"nightly-2026-09-28\", \"dev\": \"SN001\", \"msg\": \"done\"}", "num": 51}, {"type": "Design", "level": "Principal", "question": "How do you implement timeouts correctly across nested operations (deadline propagation)?", "short": "Give each top-level operation a **deadline** (an absolute monotonic time), pass it down, and let each nested call use `min(its own default, time remaining)`. That guarantees the whole operation finishes on time, avoids nested timeouts that add up beyond the budget, and lets deep code fail fast when there's no time left. In asyncio, `asyncio.timeout()` blocks nest naturally; in threads and subprocess calls, compute remaining time explicitly.", "deep": "The problem with independent timeouts: a test step allows 60 s, calls three operations each with its own 30 s timeout, and each retries twice: worst case 3 x 3 x 30 s = 270 s, far over the 60 s budget. Hung tests then block racks for hours.\n\nDeadline pattern:\n\n- `Deadline(seconds)` stores `time.monotonic() + seconds` (never wall-clock time, which can jump).\n- `remaining()` returns seconds left; `check()` raises if expired.\n- Every blocking call takes `timeout=deadline.remaining()`: `subprocess.run`, `queue.get`, `lock.acquire`, socket operations, HTTP clients.\n- Retries loop `while deadline.remaining() > backoff`.\n- Report which step exhausted the budget.\n\nasyncio: `async with asyncio.timeout(60):` at the top; inner `asyncio.timeout(10)` blocks can only shorten it; the innermost expiring timeout raises. `asyncio.timeout_at(loop.time() + x)` expresses absolute deadlines.", "code": "import subprocess, sys, time\n\nclass Deadline:\n    def __init__(self, seconds): self.end = time.monotonic() + seconds\n    def remaining(self): return max(0.0, self.end - time.monotonic())\n    def budget(self, default): return min(default, self.remaining())\n    def check(self, step):\n        if self.remaining() <= 0: raise TimeoutError(f\"deadline exceeded before {step}\")\n\ndef cli(seconds_it_takes, dl, step):\n    dl.check(step)\n    t = dl.budget(default=2.0)\n    try:\n        subprocess.run([sys.executable, \"-c\", f\"import time; time.sleep({seconds_it_takes})\"], timeout=t, check=True)\n        print(f\"  {step:12} ok   (budget {t:.2f}s)\")\n    except subprocess.TimeoutExpired:\n        raise TimeoutError(f\"{step} exceeded its budget of {t:.2f}s\") from None\n\ndef test_step(total_budget):\n    dl = Deadline(total_budget)\n    for step, secs in [(\"identify\", 0.2), (\"smart-log\", 0.3), (\"self-test\", 0.9), (\"error-log\", 0.1)]:\n        cli(secs, dl, step)\n\nfor budget in (3.0, 1.0):\n    print(f\"step budget {budget}s:\")\n    t = time.monotonic()\n    try:\n        test_step(budget)\n    except TimeoutError as e:\n        print(\"  TIMEOUT:\", e)\n    print(f\"  finished after {time.monotonic() - t:.2f}s (never more than the budget)\")", "follow": ["Why `time.monotonic()` instead of `time.time()`? => Wall-clock time can jump (NTP corrections, DST, manual changes); monotonic time only moves forward, so timeouts stay correct.", "How do deadlines cross service boundaries? => Send the remaining time with the request (gRPC deadlines do this automatically; for HTTP use a header), and have the callee set its own deadline from it minus a safety margin."], "pitfall": "Setting generous independent timeouts at every layer \"to be safe\"; they multiply, and a hung device blocks a rack for hours.", "signals": "You explain why nested timeouts compound, implement deadline propagation with monotonic time, apply it to every blocking call and retry loop, and know the asyncio equivalent.", "module": 8, "output": "step budget 3.0s:\n  identify     ok   (budget 2.00s)\n  smart-log    ok   (budget 2.00s)\n  self-test    ok   (budget 2.00s)\n  error-log    ok   (budget 1.52s)\n  finished after 1.61s (never more than the budget)\nstep budget 1.0s:\n  identify     ok   (budget 1.00s)\n  smart-log    ok   (budget 0.77s)\n  TIMEOUT: self-test exceeded its budget of 0.45s\n  finished after 1.02s (never more than the budget)", "num": 52}, {"type": "Scenario", "level": "Principal", "question": "How do you shut down a long-running Python service or test orchestrator gracefully?", "short": "On a stop signal (SIGTERM/SIGINT, or Ctrl+C / a stop API), stop accepting new work, let in-flight work finish or reach a safe checkpoint within a drain timeout, flush results and logs, release hardware reservations, close resources in reverse order, and exit with a meaningful code. Implement it with a stop `Event` checked by workers, `try/finally` and context managers for cleanup, and a hard deadline after which you exit anyway.", "deep": "Steps:\n\n1. **Signal handling**: `signal.signal(SIGTERM, handler)` in the main thread (POSIX); in asyncio, `loop.add_signal_handler` (not supported on Windows, where you rely on `KeyboardInterrupt` or a control API). The handler only sets a stop event; no heavy work in signal handlers.\n2. **Stop intake**: the scheduler stops dispatching new tests.\n3. **Drain**: running tests either finish or reach a checkpoint; cancel them after a drain timeout (Kubernetes gives 30 s by default before SIGKILL, so size accordingly).\n4. **Cleanup in reverse order**: release device leases, power devices to a safe state, flush results to the database, close log handlers (`logging.shutdown()` runs at exit), close connection pools.\n5. **Exit code**: distinguish clean shutdown, interrupted run and crash so CI and supervisors react correctly.\n6. **Resumability**: persist progress so a restarted orchestrator continues instead of starting over.\n\n`atexit` handlers run on normal interpreter exit and `sys.exit`, but not on `os._exit`, SIGKILL or hard crashes, so don't rely on them for critical state; persist incrementally.", "code": "import threading, time, queue, contextlib\n\nstop = threading.Event()\nresults, released = [], []\n\n@contextlib.contextmanager\ndef device_lease(sn):\n    try: yield sn\n    finally: released.append(sn)                 # always released, even when interrupted\n\ndef worker(sn, tasks):\n    with device_lease(sn):\n        while not stop.is_set():\n            try:\n                test = tasks.get(timeout=0.05)\n            except queue.Empty:\n                continue\n            for step in range(5):                # long test with safe checkpoints\n                if stop.is_set():\n                    results.append((sn, test, f\"INTERRUPTED at step {step}\")); return\n                time.sleep(0.02)\n            results.append((sn, test, \"PASS\"))\n\ntasks = queue.Queue()\nfor i in range(20): tasks.put(f\"test{i}\")\nworkers = [threading.Thread(target=worker, args=(f\"SN00{i}\", tasks)) for i in range(3)]\n[w.start() for w in workers]\ntime.sleep(0.35)\nprint(\"SIGTERM received -> stop intake, drain in-flight work\")\nstop.set()                                         # in production: set from the signal handler\nfor w in workers: w.join(timeout=2.0)              # drain deadline\nprint(\"completed:\", sum(r[2] == \"PASS\" for r in results), \"| interrupted:\", [r[:2] for r in results if r[2] != \"PASS\"])\nprint(\"leases released:\", sorted(released), \"| not started (resume later):\", tasks.qsize())", "follow": ["Why must the signal handler only set a flag? => Signal handlers run between bytecodes in the main thread and can interrupt anything (including logging or lock-holding code); doing real work there risks deadlocks and inconsistent state.", "How do you guarantee devices end in a safe state if the orchestrator is SIGKILLed? => You can't from inside the process; use lease expiry in the device pool and a separate reaper/watchdog service that resets devices whose leases expired."], "pitfall": "Relying on `atexit` or `__del__` to release hardware and save results. Neither runs on SIGKILL, OOM kills or hard crashes.", "signals": "You cover signal handling correctly, drain with a deadline, cleanup ordering, exit codes, resumability, and an external safety net for hard kills.", "module": 8, "output": "SIGTERM received -> stop intake, drain in-flight work\ncompleted: 9 | interrupted: [('SN002', 'test9'), ('SN000', 'test10'), ('SN001', 'test11')]\nleases released: ['SN000', 'SN001', 'SN002'] | not started (resume later): 8", "num": 53}, {"type": "Debug", "level": "Principal", "question": "A Python process running native libraries crashes with no Python traceback (segfault or access violation). How do you investigate?", "short": "Enable `faulthandler` (`python -X faulthandler` or `PYTHONFAULTHANDLER=1`) so Python prints the traceback of every thread on fatal signals; that usually points at the call into the native library. Then reproduce with `python -X dev`, collect a core dump and inspect it with gdb (CPython's `py-bt` extension) or WinDbg, check native library versions and ABI compatibility, and isolate the risky library in a subprocess so a crash can't take down the orchestrator.", "deep": "Typical causes: bugs in C extensions or vendor SDKs, ctypes misuse (wrong argtypes/restype, buffers freed too early, wrong struct layout), using a library across threads that isn't thread-safe, mismatched ABI (extension built for a different Python or dependency version), and stack overflows from deep recursion in C.\n\nInvestigation steps:\n\n1. **faulthandler** on by default in lab runs: it's cheap and prints Python-level stacks for all threads on SIGSEGV/SIGABRT (or access violations on Windows).\n2. **Core dumps**: enable (`ulimit -c unlimited` / systemd-coredump / Windows Error Reporting LocalDumps), then `gdb python core` with `py-bt` to see Python frames next to C frames.\n3. **Narrow down**: reproduce with minimal inputs; run the suspicious call in a subprocess with the same arguments; try `PYTHONMALLOC=debug` and `-X dev` to catch memory misuse earlier.\n4. **ctypes review**: every foreign function needs `argtypes` and `restype`; 64-bit pointers returned as default `c_int` get truncated and crash later. On Windows, ctypes wraps calls in structured exception handling, so some access violations surface as `OSError: exception: access violation` instead of killing the process; don't mistake that for a recoverable error, since memory may already be corrupted.\n5. **Containment**: run vendor SDK calls in a helper process (multiprocessing or a small RPC server) so a crash becomes a recoverable `BrokenProcessPool`/exit code with the device marked BLOCKED.", "code": "import subprocess, sys\n\n# faulthandler._sigsegv() is CPython's test helper that triggers a real native crash,\n# standing in for a buggy C extension or vendor SDK call.\ncrash_code = \"import faulthandler\\ndef read_register():\\n    faulthandler._sigsegv()\\nread_register()\\n\"\nfor flags in ([], [\"-X\", \"faulthandler\"]):\n    r = subprocess.run([sys.executable, *flags, \"-c\", crash_code], capture_output=True, text=True)\n    lines = [l for l in r.stderr.splitlines() if l.strip()]\n    print(f\"flags={flags or 'none'}: exit code {r.returncode}, stderr lines: {len(lines)}\")\n    for l in lines[:6]:\n        print(\"   \", l.strip()[:90])", "follow": ["Why isolate a crashing vendor SDK in a subprocess instead of fixing it? => You often can't fix vendor code quickly; isolation turns a process-wide crash into a handled error for one device while you work with the vendor.", "What is the most common ctypes crash you have seen? => Missing `restype` on functions returning pointers: ctypes assumes `int`, truncates a 64-bit pointer, and a later access crashes far from the real bug."], "pitfall": "Wrapping the native call in `try/except`. A segfault is not a Python exception; nothing is caught and the process dies.", "signals": "You enable faulthandler proactively, know core-dump workflows, list typical native causes including ctypes mistakes, and contain risky native code with process isolation.", "module": 8, "output": "flags=none: exit code 3, stderr lines: 0\nflags=['-X', 'faulthandler']: exit code 3, stderr lines: 6\n    Fatal Python error: Segmentation fault\n    Current thread 0x000028a4 (most recent call first):\n    File \"<string>\", line 3 in read_register\n    File \"<string>\", line 4 in <module>\n    Current thread's C stack trace (most recent call first):\n    <cannot get C stack on this system>", "num": 54}, {"type": "Design", "level": "Principal", "question": "How do you make a multi-day test campaign resumable and its results trustworthy after crashes?", "short": "Persist progress incrementally and atomically: record each completed unit (test x device x iteration) as it finishes, in a transactional store (SQLite/Postgres) or with **atomic file writes** (write to a temp file in the same directory, `flush` + `os.fsync`, then `os.replace`). Make units idempotent, keyed by a stable ID, so a restart skips completed work and re-runs only in-flight units. Record the campaign manifest (config, versions, seeds) at start.", "deep": "Failure scenarios: orchestrator crash, host reboot, power loss in the lab, disk full.\n\nPrinciples:\n\n- **Unit of work** with a stable key, e.g. `(campaign_id, device_sn, test, iteration)`. State machine per unit: PENDING, RUNNING (with lease/heartbeat), DONE, FAILED.\n- **Atomic writes**: `os.replace()` is atomic on POSIX and Windows when source and target are on the same filesystem. Without it, a crash mid-write leaves a truncated JSON file that breaks the next run. `fsync` makes it durable across power loss.\n- **Transactions**: SQLite in WAL mode handles concurrent readers and crash safety well for single-host orchestrators.\n- **Idempotency**: a unit that ran twice must not double-count; upserts keyed by unit ID.\n- **Resume logic**: on start, units in RUNNING whose lease expired become PENDING again (the device may need re-preconditioning).\n- **Integrity**: store the manifest (framework commit, firmware versions, config hash, seeds) so resumed results are provably from the same campaign.", "code": "import json, os, tempfile, pathlib\n\ndef atomic_write_json(path: pathlib.Path, data) -> None:\n    fd, tmp = tempfile.mkstemp(dir=path.parent, prefix=path.name, suffix=\".tmp\")\n    try:\n        with os.fdopen(fd, \"w\", encoding=\"utf-8\") as f:\n            json.dump(data, f); f.flush(); os.fsync(f.fileno())\n        os.replace(tmp, path)                          # atomic swap on the same filesystem\n    except BaseException:\n        os.unlink(tmp); raise\n\nclass Campaign:\n    def __init__(self, state_file, units):\n        self.path = state_file\n        self.state = json.loads(state_file.read_text()) if state_file.exists() else {\"done\": {}}\n        self.units = units\n    def run(self, execute, crash_after=None):\n        for n, unit in enumerate(u for u in self.units if u not in self.state[\"done\"]):\n            if crash_after is not None and n == crash_after:\n                raise SystemExit(\"host rebooted!\")\n            self.state[\"done\"][unit] = execute(unit)\n            atomic_write_json(self.path, self.state)    # progress persisted per unit\n\nstate = pathlib.Path(tempfile.mkdtemp()) / \"campaign.json\"\nunits = [f\"SN{d}:wrv:iter{i}\" for d in range(2) for i in range(4)]\nexecuted = []\ndef execute(u): executed.append(u); return \"PASS\"\ntry:\n    Campaign(state, units).run(execute, crash_after=5)\nexcept SystemExit as e:\n    print(\"crash:\", e, \"| units done before crash:\", len(executed))\nCampaign(state, units).run(execute)\nprint(\"after resume:\", len(json.loads(state.read_text())[\"done\"]), \"of\", len(units), \"done | total executions:\", len(executed), \"(no unit ran twice)\")", "follow": ["Why write the temp file in the same directory as the target? => `os.replace` is only atomic within one filesystem; a temp file in `/tmp` may be on a different mount, turning the rename into a non-atomic copy.", "SQLite or files for campaign state? => SQLite for anything beyond a small JSON state: transactions, concurrent readers, queries for dashboards, and crash safety with WAL; files are fine for tiny single-writer state."], "pitfall": "`json.dump(state, open(path, 'w'))` after each test: a crash during the write leaves a truncated file, and the campaign can't even restart.", "signals": "You define stable idempotent work units, persist atomically and durably, handle in-flight units on restart, and record a manifest for trustworthy results.", "module": 8, "output": "crash: host rebooted! | units done before crash: 5\nafter resume: 8 of 8 done | total executions: 8 (no unit ran twice)", "num": 55}, {"type": "Concept", "level": "Principal", "question": "What would you measure and alert on for a fleet of lab test machines running Python orchestrators?", "short": "Use the RED/USE ideas adapted to test infrastructure: **throughput** (tests completed per hour), **errors** split by class (FAIL vs BLOCKED vs framework error), **durations** (p50/p95 per test type, queue wait for devices), and **saturation** (device pool utilization, CPU, memory, disk of hosts). Alert on symptoms that need a human (BLOCKED rate spike, no heartbeat, pool exhausted, disk nearly full), not on every failing test. Use histograms, and keep label cardinality low.", "deep": "Metric design:\n\n- **Counters**: `tests_total{result, test_suite}`; `commands_total{tool, outcome}`.\n- **Histograms**: test duration and device command latency; percentiles from histogram buckets (Prometheus) rather than averages.\n- **Gauges**: devices free/leased/quarantined, orchestrator heartbeat timestamp, queue depth.\n- **Cardinality**: labels like `suite` and `result` are fine; `device_serial` for 5,000 devices times many metrics can explode storage; put per-device detail in logs and results DB instead.\n\nAlerts (actionable only):\n\n- No heartbeat from an orchestrator for 10 minutes (dead-man's switch).\n- BLOCKED ratio over 10% for 30 minutes (lab problem).\n- Device pool wait p95 over 1 hour (capacity).\n- Host disk over 90%, or memory growth trend (leak).\n- Nightly run didn't start or didn't publish results (the silent failure that is otherwise noticed a week later).\n\nDashboards per audience: firmware teams see failure trends by build; lab ops see pool health and infrastructure errors.", "code": "import random, statistics, collections\n\nrandom.seed(4)\ndurations = [random.lognormvariate(4.0, 0.6) for _ in range(2000)]     # seconds per test\noutcomes = collections.Counter(random.choices([\"PASS\", \"FAIL\", \"BLOCKED\"], weights=[90, 3, 7], k=2000))\n\nq = statistics.quantiles(durations, n=100)\nprint(f\"tests: {sum(outcomes.values())} | {dict(outcomes)}\")\nprint(f\"duration p50 {q[49]:.0f}s  p95 {q[94]:.0f}s  p99 {q[98]:.0f}s  mean {statistics.fmean(durations):.0f}s\")\nblocked_ratio = outcomes[\"BLOCKED\"] / sum(outcomes.values())\nprint(f\"BLOCKED ratio {blocked_ratio:.1%} ->\", \"ALERT lab ops\" if blocked_ratio > 0.05 else \"ok\")\nbuckets = [30, 60, 120, 300, 600, float(\"inf\")]                          # Prometheus-style histogram\ncounts = [sum(d <= b for d in durations) for b in buckets]\nprint(\"cumulative histogram:\", dict(zip([str(b) for b in buckets], counts)))", "follow": ["Why are averages misleading for test durations? => Durations are skewed (lognormal-like); a few very long or hung tests move the mean a lot while telling you nothing about the typical case; use p50/p95/p99.", "How do you detect a nightly run that silently didn't happen? => A dead-man's switch: the run pushes a \"completed\" timestamp metric, and an alert fires if it's older than 26 hours."], "pitfall": "Alerting on every FAIL (alert fatigue) while having no alert for \"the nightly run never started\".", "signals": "You separate product failures from infrastructure health, choose metric types and percentiles, manage cardinality, and define a few actionable alerts including a dead-man's switch.", "module": 8, "output": "tests: 2000 | {'FAIL': 49, 'PASS': 1817, 'BLOCKED': 134}\nduration p50 54s  p95 147s  p99 231s  mean 66s\nBLOCKED ratio 6.7% -> ALERT lab ops\ncumulative histogram: {'30': 318, '60': 1144, '120': 1800, '300': 1995, '600': 2000, 'inf': 2000}", "num": 56}, {"type": "Trap", "level": "Principal", "question": "Is it safe to load test results or configs that other machines saved with `pickle`?", "short": "Only if you fully trust whoever could have written the file. Unpickling can execute arbitrary code: an object's `__reduce__` tells pickle to call any function (like `os.system`) with any arguments during load. For data exchanged between machines, teams or over networks, use data-only formats (JSON, TOML, Protocol Buffers, Parquet/Arrow) and validate them; if you must use pickle between your own processes, sign the payload with HMAC and verify before loading.", "deep": "Same class of risk: `yaml.load` without `SafeLoader`, `eval`/`exec` on config text, `torch.load` of untrusted checkpoints (older versions without `weights_only=True`), `marshal`, `shelve` (pickle-based), and `numpy.load(allow_pickle=True)`.\n\nGuidance:\n\n- Data interchange: JSON (with schema validation), TOML for config, Protobuf/Avro for typed messages, Parquet/Arrow for bulk data.\n- Internal caches between trusted processes: pickle is acceptable, but add HMAC-SHA256 signing with a secret key and compare with `hmac.compare_digest` before unpickling, so a tampered file is rejected.\n- Treat shared lab file systems as untrusted: many people and scripts can write there.\n- Static analysis flags these (Bandit `B301`, Ruff `S301`).", "code": "import pickle, hmac, hashlib, json\n\nclass Malicious:\n    def __reduce__(self):                              # called during pickling; replayed on load\n        return (print, (\"!!! arbitrary code ran during pickle.loads() -- this could be os.system(...)\",))\n\npayload = pickle.dumps(Malicious())\npickle.loads(payload)                                  # just loading the \"result file\" executes code\n\nKEY = b\"lab-shared-secret\"\ndef dump_signed(obj):\n    data = pickle.dumps(obj)\n    return hmac.new(KEY, data, hashlib.sha256).digest() + data\ndef load_signed(blob):\n    sig, data = blob[:32], blob[32:]\n    if not hmac.compare_digest(sig, hmac.new(KEY, data, hashlib.sha256).digest()):\n        raise ValueError(\"signature mismatch: refusing to unpickle\")\n    return pickle.loads(data)\n\ngood = dump_signed({\"device\": \"SN001\", \"verdict\": \"PASS\"})\nprint(\"signed load:\", load_signed(good))\ntry:\n    load_signed(good[:32] + payload)                   # attacker swaps the body\nexcept ValueError as e:\n    print(\"tampered:\", e)\nprint(\"preferred for interchange:\", json.dumps({\"device\": \"SN001\", \"verdict\": \"PASS\"}))", "follow": ["How is `yaml.load` dangerous and what's the fix? => The full loader can construct arbitrary Python objects; use `yaml.safe_load` (or `yaml.load(..., Loader=yaml.SafeLoader)`), which only builds plain data types.", "Why `hmac.compare_digest` instead of `==`? => It compares in constant time, avoiding timing side channels that could leak how many leading bytes of a signature matched."], "pitfall": "Pickling test artifacts to a shared NFS directory and loading them in a CI job with elevated credentials: anyone who can write that directory can run code in CI.", "signals": "You explain the `__reduce__` mechanism, list similar risky loaders, choose data-only formats for interchange, and know HMAC signing plus constant-time comparison for trusted-but-verified cases.", "module": 9, "output": "!!! arbitrary code ran during pickle.loads() -- this could be os.system(...)\nsigned load: {'device': 'SN001', 'verdict': 'PASS'}\ntampered: signature mismatch: refusing to unpickle\npreferred for interchange: {\"device\": \"SN001\", \"verdict\": \"PASS\"}", "num": 57}, {"type": "Concept", "level": "Principal", "question": "How do you prevent command injection and path traversal in lab tooling that takes user or config input?", "short": "Never build shell commands from strings: call `subprocess.run([...])` with an argument list and no `shell=True`; validate inputs against allow-lists (device names matching `^nvme\\d+n?\\d*$`, known test names). For file paths from users or configs, resolve them (`Path.resolve()`) and verify they stay inside the allowed base directory (`is_relative_to`), rejecting absolute paths and `..` escapes. Run tools with least privilege.", "deep": "Injection examples in test infrastructure: a device name from a web form like `nvme0; rm -rf /`, a report name used in a shell `tar` command, a log path `../../etc/passwd` requested from an artifact server.\n\nDefences:\n\n- **Argument lists**: the OS receives each argument as-is; shell metacharacters have no meaning. If you truly need a shell pipeline, use `shlex.quote` for every piece, but prefer chaining `subprocess` calls in Python.\n- **Allow-list validation**: regex or set membership for identifiers; reject rather than sanitize.\n- **Path containment**: `(base / user_path).resolve()` then `resolved.is_relative_to(base.resolve())`. Resolve follows symlinks, so a symlink pointing outside is caught too.\n- **Archives**: extracting tarballs from devices or vendors: use `tarfile` extraction filters (`filter=\"data\"`, default since 3.14) to block absolute paths, `..` and dangerous links; for zip, check each member path.\n- **Least privilege**: most tools don't need root; wrap the few privileged operations in a small audited helper.", "code": "import pathlib, re, subprocess, sys, tempfile\n\nDEVICE_RE = re.compile(r\"^nvme\\d+(n\\d+)?$\")\ndef smart_log(device: str):\n    if not DEVICE_RE.fullmatch(device):\n        raise ValueError(f\"invalid device name {device!r}\")\n    # list form: even if validation were missing, ';' would be a literal character, not a command separator\n    return subprocess.run([sys.executable, \"-c\", \"import sys; print('would run: nvme smart-log', sys.argv[1])\", f\"/dev/{device}\"],\n                          capture_output=True, text=True, check=True).stdout.strip()\n\nfor dev in (\"nvme0\", \"nvme0; rm -rf /\"):\n    try: print(smart_log(dev))\n    except ValueError as e: print(\"rejected:\", e)\n\nARTIFACTS = pathlib.Path(tempfile.mkdtemp()) / \"artifacts\"\n(ARTIFACTS / \"run42\").mkdir(parents=True); (ARTIFACTS / \"run42\" / \"smart.json\").write_text(\"{}\")\ndef safe_artifact(rel: str) -> pathlib.Path:\n    p = (ARTIFACTS / rel).resolve()\n    if not p.is_relative_to(ARTIFACTS.resolve()):\n        raise PermissionError(f\"path escapes artifact root: {rel!r}\")\n    return p\nfor rel in (\"run42/smart.json\", \"../../../etc/passwd\", \"/etc/passwd\"):\n    try: print(\"serve\", safe_artifact(rel).name)\n    except PermissionError as e: print(\"blocked:\", e)", "follow": ["Is `shlex.quote` enough to make `shell=True` safe? => It correctly quotes for POSIX shells if applied to every interpolated value, but it's easy to miss one, and it doesn't apply to Windows `cmd.exe`; argument lists remove the whole class of bug.", "Why check containment after `resolve()` rather than looking for `..` in the string? => Encodings, absolute paths, symlinks and platform-specific separators bypass string checks; resolving gives the real target to compare."], "pitfall": "Validating with a deny-list (\"reject if it contains ';'\"). Attackers use `&&`, `|`, backticks, `$()` or newlines; allow-lists and argument lists are robust.", "signals": "You use argument lists, allow-list validation, resolve-and-contain for paths including symlinks and archives, and least privilege.", "module": 9, "output": "would run: nvme smart-log /dev/nvme0\nrejected: invalid device name 'nvme0; rm -rf /'\nserve smart.json\nblocked: path escapes artifact root: '../../../etc/passwd'\nblocked: path escapes artifact root: '/etc/passwd'", "num": 58}, {"type": "Concept", "level": "Principal", "question": "How do you keep secrets (API tokens, BMC passwords) out of code, logs and test reports?", "short": "Load secrets at runtime from a secret manager or environment injected by CI/orchestration, never from the repository; keep them in objects that don't print their value (a `Secret` wrapper whose `repr` is `***`); add a logging filter that redacts known secret patterns and values; scrub artifacts before upload; scan repositories and CI logs for leaked secrets; and rotate anything that leaks.", "deep": "Where secrets leak in practice:\n\n- Tracebacks and debug logs printing function arguments or HTTP headers.\n- Test reports that dump the full config or environment.\n- Command lines: `tool --password xyz` is visible in `ps` output and in process logs; prefer environment variables, files with restricted permissions, or stdin.\n- Committed `.env` files and notebooks.\n\nControls:\n\n- **Source**: HashiCorp Vault, cloud secret managers, or CI secret variables; short-lived credentials where possible.\n- **Type**: a `Secret` class (or Pydantic `SecretStr`) with `__repr__`/`__str__` masking and an explicit `.reveal()`.\n- **Logging**: a filter replacing registered secret values and patterns (`Bearer [A-Za-z0-9._-]+`, `password=...`) in messages and arguments.\n- **Detection**: gitleaks/trufflehog in pre-commit and CI; GitHub secret scanning.\n- **Response**: revoke and rotate immediately; deleting the commit doesn't help once pushed.", "code": "import logging, re, sys\n\nclass Secret:\n    def __init__(self, value): self._v = value\n    def reveal(self): return self._v\n    def __repr__(self): return \"Secret('***')\"\n    __str__ = __repr__\n\nclass RedactFilter(logging.Filter):\n    PATTERNS = [re.compile(r\"(Bearer\\s+)[A-Za-z0-9._\\-]+\"), re.compile(r\"(password=)\\S+\", re.I)]\n    def __init__(self, secrets): super().__init__(); self.secrets = [s.reveal() for s in secrets]\n    def filter(self, record):\n        msg = record.getMessage()\n        for s in self.secrets: msg = msg.replace(s, \"***\")\n        for p in self.PATTERNS: msg = p.sub(r\"\\1***\", msg)\n        record.msg, record.args = msg, ()\n        return True\n\nbmc_pw = Secret(\"Sup3r-S3cret!\")\nh = logging.StreamHandler(sys.stdout); h.addFilter(RedactFilter([bmc_pw]))\nh.setFormatter(logging.Formatter(\"%(levelname)s %(message)s\"))\nlog = logging.getLogger(\"lab\"); log.addHandler(h); log.setLevel(logging.INFO)\n\nconfig = {\"bmc_host\": \"10.0.4.17\", \"bmc_password\": bmc_pw}\nlog.info(\"connecting with config %s\", config)                          # repr hides it\nlog.info(\"raw request headers: Authorization: Bearer eyJhbGciOiJIUzI1NiJ9.abc.def\")\nlog.info(\"legacy tool args: ipmitool -H 10.0.4.17 password=%s\", bmc_pw.reveal())   # accidental reveal still redacted", "follow": ["A token was committed to a public repo and removed in the next commit. Are you safe? => No. It's in history and may already be harvested within minutes; revoke and rotate it immediately, then clean history if needed.", "How do you pass a password to a CLI tool without exposing it in the process list? => Environment variable, a file readable only by the user, or stdin, depending on what the tool supports; never a command-line argument."], "pitfall": "Logging the full configuration or `os.environ` at startup \"for debugging\", which ships every credential into log aggregation where many people can read it.", "signals": "You cover sources, masking types, log redaction, process-list exposure, detection tooling and the rotate-on-leak response.", "module": 9, "output": "INFO connecting with config {'bmc_host': '10.0.4.17', 'bmc_password': Secret('***')}\nINFO raw request headers: Authorization: Bearer ***\nINFO legacy tool args: ipmitool -H 10.0.4.17 password=***", "num": 59}, {"type": "Design", "level": "Principal", "question": "How do you secure the Python dependency supply chain for internal tools?", "short": "Pin everything with a lock file that includes **hashes** (`uv lock`, `pip-compile --generate-hashes`, Poetry), install with hash checking, pull from an internal mirror/proxy index, protect against dependency confusion by reserving or namespacing internal package names, scan for known vulnerabilities (`pip-audit`, OSV), review new dependencies, generate an SBOM, and update regularly via automated PRs (Renovate/Dependabot) that run the full test suite.", "deep": "Threats: typosquatting (`reqeusts`), dependency confusion (a public package with the same name as your internal one and a higher version), compromised maintainer accounts, malicious install-time code in `setup.py`, and known CVEs in transitive dependencies.\n\nControls:\n\n- **Lock and hash**: every transitive dependency pinned to an exact version and artifact hash; `pip install --require-hashes`. Reproducible across lab machines.\n- **Index configuration**: a single internal index (Artifactory, Nexus, devpi) that proxies PyPI; never combine `--extra-index-url` with public PyPI for internal names, which enables dependency confusion.\n- **Prefer wheels**: `--only-binary :all:` where possible avoids executing sdist build scripts.\n- **Vulnerability scanning** in CI with `pip-audit`; policy for severity and time to fix.\n- **Review**: new dependencies need justification (maintenance, license, size); fewer dependencies are a security feature.\n- **Provenance**: prefer packages with trusted publishing and attestations (PEP 740); publish internal packages the same way.\n- **SBOM** (CycloneDX/SPDX) per release for audits.", "code": "import hashlib, pathlib, tempfile\n\n# What a hashed lock entry protects: the exact artifact you tested is the one you install.\nwheel = pathlib.Path(tempfile.mkdtemp()) / \"acme_hal-2.4.1-py3-none-any.whl\"\nwheel.write_bytes(b\"PK\\x03\\x04 ...pretend wheel contents...\")\nlocked_hash = \"sha256:\" + hashlib.sha256(wheel.read_bytes()).hexdigest()\nprint(\"requirements.txt line:\")\nprint(f\"  acme-hal==2.4.1 --hash={locked_hash[:23]}...\")\n\ndef verify(path, expected):\n    actual = \"sha256:\" + hashlib.sha256(path.read_bytes()).hexdigest()\n    return \"OK\" if actual == expected else \"HASH MISMATCH: install refused\"\nprint(\"clean artifact   :\", verify(wheel, locked_hash))\nwheel.write_bytes(wheel.read_byt
