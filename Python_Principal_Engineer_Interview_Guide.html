in(32, cpu_count + 4)`), so many long blocking calls can queue up; give heavy users their own executor.", "code": "import asyncio, threading, time\n\ndef hardware_callback_thread(loop, queue):\n    \"\"\"Simulates a vendor SDK firing events on its own thread.\"\"\"\n    for i in range(3):\n        time.sleep(0.02)\n        fut = asyncio.run_coroutine_threadsafe(queue.put(f\"interrupt-{i}\"), loop)\n        fut.result(timeout=1)                     # wait until the loop accepted it\n    loop.call_soon_threadsafe(queue.put_nowait, None)\n\ndef blocking_sdk_call():\n    time.sleep(0.05); return \"firmware version 2.1.7\"\n\nasync def main():\n    loop, queue = asyncio.get_running_loop(), asyncio.Queue()\n    threading.Thread(target=hardware_callback_thread, args=(loop, queue), daemon=True).start()\n    version = await asyncio.to_thread(blocking_sdk_call)        # loop stays responsive\n    print(\"from blocking SDK:\", version)\n    while (event := await queue.get()) is not None:\n        print(\"event from SDK thread:\", event)\n\nasyncio.run(main())", "follow": ["What goes wrong if the SDK thread calls `queue.put_nowait(item)` directly? => It touches loop-owned state from the wrong thread: it may appear to work, but the loop isn't woken, waiters can stall, and internal state can be corrupted.", "How do you run an asyncio orchestrator from synchronous code (like a pytest test without plugins)? => `asyncio.run(main())` once at the top level; for long-lived integration, run the loop in a dedicated thread and submit work with `run_coroutine_threadsafe`."], "pitfall": "Calling `asyncio.run()` inside a function that is already running on an event loop (it raises `RuntimeError`), or creating a new loop per call, which breaks shared resources like connection pools.", "signals": "You know the thread-safe entry points, explain why asyncio objects aren't thread-safe, and mention default executor limits.", "module": 3, "output": "from blocking SDK: firmware version 2.1.7\nevent from SDK thread: interrupt-0\nevent from SDK thread: interrupt-1\nevent from SDK thread: interrupt-2", "num": 19}, {"type": "Concept", "level": "Principal", "question": "What are the performance pitfalls of `multiprocessing` at scale, and how do you tune it?", "short": "The main costs are **process startup** (spawn re-imports your modules), **pickling** arguments and results through pipes, and **per-task overhead** for tiny tasks. Tune with `chunksize` in `map`, an `initializer` to load expensive state once per worker, sending references (paths, IDs) instead of data, `max_tasks_per_child` to bound memory growth, and shared memory for large read-only arrays.", "deep": "Checklist:\n\n- **Task granularity**: each task costs a pickle round-trip (tens of microseconds or more). With 100,000 tiny tasks, set `chunksize` (e.g. 500) so workers receive batches.\n- **Worker initialization**: loading a model, opening a DB connection or compiling regexes per task is wasteful; do it once with `initializer=`/`initargs=`, storing state in a module global of the worker.\n- **Data transfer**: pass file paths or DB keys; results should be small aggregates. For large numeric buffers, use `multiprocessing.shared_memory` or memory-mapped files.\n- **Start method**: `spawn` (Windows/macOS default, and `forkserver` on Linux in 3.14) re-imports the main module, so keep top-level code import-safe and guarded by `if __name__ == \"__main__\"`.\n- **Memory growth and leaky libraries**: `max_tasks_per_child` (3.11+ for `ProcessPoolExecutor`) recycles workers.\n- **Failure handling**: a worker crash raises `BrokenProcessPool`; make tasks idempotent and resubmit.", "code": "import time, re\nfrom concurrent.futures import ProcessPoolExecutor\n\n_PATTERN = None\ndef init_worker():\n    global _PATTERN\n    _PATTERN = re.compile(r\"ERR(\\d+)\")           # expensive setup done ONCE per worker\n\ndef parse(line):\n    m = _PATTERN.search(line)\n    return int(m.group(1)) if m else 0\n\nif __name__ == \"__main__\":\n    lines = [f\"2026-09-28 dev{i % 8} ERR{i % 50} lba={i}\" for i in range(10_000)]\n    with ProcessPoolExecutor(4, initializer=init_worker) as ex:\n        for chunk in (1, 1000):\n            t = time.perf_counter()\n            total = sum(ex.map(parse, lines, chunksize=chunk))\n            print(f\"chunksize={chunk:5}: {time.perf_counter() - t:.2f}s (sum={total})\")\n    t = time.perf_counter(); init_worker(); total = sum(map(parse, lines))\n    print(f\"single process   : {time.perf_counter() - t:.2f}s  <- tiny tasks may not be worth parallelizing at all\")", "follow": ["Why is the single-process version competitive here? => Each task is microseconds of work; pickling and IPC dominate. Parallelize coarser units (whole files or big chunks) instead.", "A worker process segfaults inside a C library. What happens and how do you recover? => The pool raises `BrokenProcessPool` for pending futures; recreate the pool, resubmit idempotent tasks, and quarantine inputs that reproducibly crash."], "pitfall": "Parallelizing at the wrong granularity (per line or per record) and concluding \"multiprocessing is slow\". Measure against the single-process baseline and batch the work.", "signals": "You name the cost components, tune granularity, initialization and data movement, and always compare with a serial baseline.", "module": 3, "output": "chunksize=    1: 1.36s (sum=245000)\nchunksize= 1000: 0.01s (sum=245000)\nsingle process   : 0.00s  <- tiny tasks may not be worth parallelizing at all", "num": 20}, {"type": "Scenario", "level": "Principal", "question": "You must make 10,000 calls to a lab management API limited to 20 requests per second and 10 concurrent connections. How do you implement it?", "short": "Use asyncio with two limits: a `Semaphore(10)` for concurrency and a token bucket (or leaky bucket) for 20 req/s. Add timeouts, retries with exponential backoff and jitter on 429/5xx (respecting `Retry-After`), idempotency for writes, and progress checkpointing so a crash resumes instead of repeating 10,000 calls.", "deep": "Concurrency limit and rate limit are different constraints: 10 slow requests can respect the concurrency cap and still exceed the rate cap if they're fast, or the reverse. Enforce both.\n\nComponents:\n\n- **Token bucket**: refills at 20 tokens/s up to a burst capacity; each request awaits a token. With asyncio, a single lock-protected bucket works because there's one thread.\n- **Semaphore(10)** around the HTTP call.\n- **Session reuse**: one `httpx.AsyncClient`/`aiohttp.ClientSession` with connection pooling.\n- **Retries**: only on retryable statuses (429, 502-504, timeouts), exponential backoff with full jitter, cap attempts, honour `Retry-After`.\n- **Idempotency**: GETs are safe; for POSTs, use idempotency keys or check-before-create.\n- **Checkpointing**: record completed IDs (file or DB) so reruns skip them.\n- **Observability**: rate achieved, error counts by status, and latency percentiles.\n\nAt 20 req/s the run takes about 500 s minimum, which is worth stating: parallelism can't beat the provider's limit.", "code": "import asyncio, time\n\nclass TokenBucket:\n    def __init__(self, rate, burst):\n        self.rate, self.capacity, self.tokens, self.t = rate, burst, burst, time.monotonic()\n        self.lock = asyncio.Lock()\n    async def acquire(self):\n        async with self.lock:\n            while True:\n                now = time.monotonic()\n                self.tokens = min(self.capacity, self.tokens + (now - self.t) * self.rate); self.t = now\n                if self.tokens >= 1:\n                    self.tokens -= 1; return\n                await asyncio.sleep((1 - self.tokens) / self.rate)\n\nasync def call_api(i, bucket, sem, stats):\n    await bucket.acquire()\n    async with sem:\n        stats[\"inflight\"] += 1; stats[\"peak\"] = max(stats[\"peak\"], stats[\"inflight\"])\n        await asyncio.sleep(0.03)                 # network latency\n        stats[\"inflight\"] -= 1\n        return i\n\nasync def main():\n    # rate scaled up 10x (200/s) so the demo finishes quickly; production value would be 20\n    bucket, sem, stats = TokenBucket(rate=200, burst=5), asyncio.Semaphore(10), {\"inflight\": 0, \"peak\": 0}\n    n, t = 300, time.perf_counter()\n    await asyncio.gather(*(call_api(i, bucket, sem, stats) for i in range(n)))\n    dt = time.perf_counter() - t\n    print(f\"{n} calls in {dt:.2f}s -> {n / dt:.0f} req/s (limit 200), peak concurrency {stats['peak']} (limit 10)\")\n\nasyncio.run(main())", "follow": ["How would you enforce the limit across 5 worker machines? => A shared limiter (Redis with an atomic Lua token bucket, or the API gateway's quota), or split the budget statically (4 req/s each) with some safety margin.", "The API starts returning 429 even though you're under 20 req/s. What do you do? => Honour `Retry-After`, back off adaptively (reduce the rate, AIMD-style), and confirm how the provider counts (per token, per IP, sliding window)."], "pitfall": "Using only a semaphore and assuming it limits requests per second, or retrying immediately on 429, which makes the throttling worse.", "signals": "You separate concurrency from rate, implement both, include retry policy with jitter and Retry-After, idempotency and resumability, and do the back-of-envelope runtime estimate.", "module": 3, "output": "300 calls in 1.53s -> 196 req/s (limit 200), peak concurrency 10 (limit 10)", "num": 21}, {"type": "Scenario", "level": "Principal", "question": "Your test-result parser takes 40 minutes per nightly run and the team wants it under 5. How do you approach it?", "short": "Measure before changing anything: set the target, build a reproducible benchmark on real data, and profile (`cProfile` for call counts, `py-spy`/Scalene for sampling in production-like runs). Fix the biggest hotspot first, usually an algorithmic or I/O issue, re-measure, and stop when the target is met. Only then consider parallelism or compiled code.", "deep": "A method interviewers look for:\n\n1. **Define success**: 40 to under 5 minutes on the nightly dataset, same output. Save a golden output to guarantee correctness.\n2. **Reproduce and time**: a benchmark script with a representative input (a real night's logs, or a scaled sample).\n3. **Profile**: `python -m cProfile -o prof.out parser.py` then `pstats` sorted by cumulative time; or `py-spy record -o flame.svg -- python parser.py` for a flame graph with low overhead. Check whether the time is CPU, I/O or waiting.\n4. **Fix in this order**, largest wins first: algorithm and data structures (O(n²) membership tests, repeated work); I/O patterns (reading files many times, per-line DB inserts instead of batches); avoiding Python-level loops (use `str` methods, `re`, `collections.Counter`, `sorted` with keys, which run in C); caching repeated computations; parallelism across files; compiled code (Cython, Rust/PyO3) or vectorized libraries for the true hot core.\n5. **Re-measure after every change**, keep the benchmark in CI to catch regressions.\n\nIn practice, 40 minutes to under 5 is usually one or two quadratic loops or per-row database round trips, not \"Python is slow\".", "code": "import cProfile, pstats, io, random\n\nrandom.seed(1)\nknown_failures = [f\"TC-{i}\" for i in range(4000)]\nresults = [f\"TC-{random.randint(0, 20000)}\" for _ in range(20000)]\n\ndef classify_slow():\n    return sum(1 for r in results if r in known_failures)      # list membership: O(n*m)\n\ndef classify_fast():\n    known = set(known_failures)                                 # O(1) lookups\n    return sum(1 for r in results if r in known)\n\nfor fn in (classify_slow, classify_fast):\n    prof = cProfile.Profile(); prof.enable(); n = fn(); prof.disable()\n    buf = io.StringIO()\n    stats = pstats.Stats(prof, stream=buf)\n    print(f\"{fn.__name__}: {n} known failures, total {stats.total_tt:.3f}s\")", "follow": ["cProfile says 70% of time is in `json.loads`. Now what? => Check whether you parse the same data multiple times, parse only needed fields, switch to a faster parser (orjson), or change the log format; and check it's not dominated by one huge file you could stream.", "Why use `py-spy` rather than `cProfile` in production? => It samples from outside the process with low overhead and needs no code changes; cProfile instruments every call and can distort timings of call-heavy code."], "pitfall": "Rewriting the parser in another language or adding multiprocessing before profiling. That multiplies complexity and often misses the actual quadratic loop.", "signals": "You set a target and correctness check first, profile to find evidence, fix algorithmic and I/O issues before micro-optimizing, and lock in the gain with a benchmark.", "module": 4, "output": "classify_slow: 3950 known failures, total 0.432s\nclassify_fast: 3950 known failures, total 0.002s", "num": 22}, {"type": "Concept", "level": "Principal", "question": "Which innocent-looking Python idioms are secretly quadratic or slow?", "short": "`x in list` inside a loop (use a set), building strings with `+=` in a loop (use `''.join`), `list.pop(0)` or `insert(0, x)` in a loop (use `deque`), repeated `sorted()` or `max()` inside a loop, `sum(lists, [])` for flattening, re-compiling or re-reading inside a loop, and per-row database round trips. Each turns O(n) work into O(n²) or adds huge constant costs.", "deep": "These show up constantly in code reviews of automation and data scripts:\n\n- **Membership in a list**: O(n) per test. Converting once to `set`/`dict` makes it O(1).\n- **String accumulation**: `s += part` can copy the string each time; `''.join(parts)` is linear.\n- **Queue from a list**: `pop(0)` shifts all elements; `collections.deque.popleft()` is O(1).\n- **Flattening with `sum(list_of_lists, [])`**: creates a new list per addition, quadratic; use `itertools.chain.from_iterable`.\n- **Sorting inside loops**: keep a heap (`heapq`) or `bisect.insort`, or sort once.\n- **N+1 I/O**: one DB query or HTTP call per item; batch them (`executemany`, bulk APIs, `IN (...)` queries).\n- **Exceptions as control flow in hot loops**: raising is relatively expensive when failures are common.", "code": "import timeit, itertools\nfrom collections import deque\n\nn = 20_000\nlists = [[i] * 3 for i in range(3000)]\ncases = {\n    \"sum(lists, [])        \": lambda: sum(lists, []),\n    \"chain.from_iterable   \": lambda: list(itertools.chain.from_iterable(lists)),\n    \"list.pop(0) drain     \": lambda: (lambda q: [q.pop(0) for _ in range(len(q))])(list(range(n))),\n    \"deque.popleft() drain \": lambda: (lambda q: [q.popleft() for _ in range(len(q))])(deque(range(n))),\n}\nfor name, fn in cases.items():\n    print(f\"{name} {min(timeit.repeat(fn, number=3, repeat=3)) / 3 * 1000:8.1f} ms\")", "follow": ["How would you catch these automatically? => Code review checklists, Ruff rules (e.g. PERF rules), benchmarks in CI on realistic input sizes, and profiling tests that fail if runtime exceeds a budget.", "When is a list membership test fine? => When the list is tiny (a handful of items) or the test runs once; building a set has its own cost."], "pitfall": "Testing with 100 records during development, where quadratic code is instant, then shipping it to data with a million records.", "signals": "You list several concrete patterns with the complexity involved and the fix, and mention batching I/O, not just in-memory tricks.", "module": 4, "output": "sum(lists, [])             16.7 ms\nchain.from_iterable         0.1 ms\nlist.pop(0) drain          21.9 ms\ndeque.popleft() drain       0.6 ms", "num": 23}, {"type": "Design", "level": "Principal", "question": "When would you move a hot path out of pure Python, and what are the options?", "short": "Only after profiling shows a CPU-bound core that algorithmic fixes can't solve. Options, from cheapest: use C-implemented stdlib/builtins; vectorize with NumPy/Polars/Arrow; JIT with Numba for numeric loops; compile with Cython or mypyc; write an extension in Rust (PyO3/maturin) or C/C++ (pybind11, nanobind); or run it in a separate native service. Weigh speed-up against build complexity, packaging, debugging and team skills.", "deep": "Decision factors a Principal should discuss:\n\n- **Shape of the work**: array math (vectorize or Numba); string/byte parsing and state machines (Rust or Cython); calling an existing C/C++ library (bindings via pybind11/nanobind, or `ctypes`/`cffi` for simple C APIs).\n- **Boundary cost**: crossing Python/native per element is expensive. Design the API to hand over whole buffers or batches (`bytes`, `memoryview`, NumPy arrays) and do the loop natively.\n- **GIL**: native code can release the GIL for true parallelism across threads.\n- **Distribution**: native code needs wheels for every platform and Python version (cibuildwheel), which is significant CI work for an internal tool.\n- **Maintainability**: who can debug a segfault in the extension at 2 a.m.? Rust reduces memory-safety risks compared to C.\n- **Stepping stone**: first make sure you're using C-backed builtins well; a surprising amount of speed comes from `bytes.translate`, `re`, `struct.iter_unpack`, `collections.Counter` and `sorted` with keys.", "code": "import struct, time, os\n\n# 1 million 16-byte records: (lba: u64, crc: u32, flags: u32), little-endian\nraw = os.urandom(16 * 1_000_000)\n# Question: how many records have the \"error\" bit (bit 0 of flags) set?\n\nt = time.perf_counter()\nslow = sum(1 for off in range(0, len(raw), 16) if struct.unpack_from(\"<QII\", raw, off)[2] & 1)\nt1 = time.perf_counter() - t\n\nt = time.perf_counter()\nlow_flag_bytes = raw[12::16]                          # strided slice: done in C\nodd = bytes(i & 1 for i in range(256))                # lookup table: byte -> 0/1\nfast = low_flag_bytes.translate(odd).count(1)         # translate + count: done in C\nt2 = time.perf_counter() - t\n\nprint(f\"per-record Python loop: {t1:.3f}s | C-level slice+translate: {t2:.4f}s | x{t1 / t2:.0f} faster | equal: {slow == fast}\")", "follow": ["Why might a Rust extension be slower than expected? => Converting Python objects element by element across the boundary; pass a buffer or batch instead and return compact results.", "How do you ship a native extension to 40 lab machines with mixed OSes? => Build wheels for each platform/Python combination in CI (cibuildwheel, maturin), publish to an internal package index, pin versions in the framework's lock file."], "pitfall": "Wrapping a per-item native function and calling it a million times from a Python loop. The call overhead eats most of the gain.", "signals": "You start from profiling, pick the option by workload shape, design coarse-grained boundaries, and weigh packaging and maintenance cost.", "module": 4, "output": "per-record Python loop: 0.152s | C-level slice+translate: 0.0020s | x75 faster | equal: True", "num": 24}, {"type": "Trap", "level": "Principal", "question": "What can go wrong with `functools.lru_cache`, especially on methods?", "short": "On a method, the cache keys include `self`, so the cache keeps **every instance alive** for the cache's lifetime (a memory leak) and is shared across all instances. Also: arguments must be hashable, cached mutable return values can be modified by callers, `maxsize=None` grows forever, and the cache ignores changes to external state it depends on.", "deep": "Details:\n\n- **Method caching leak**: `@lru_cache` on `def get(self, x)` stores `(self, x)` keys in a function-level cache. Instances never get garbage-collected until evicted. Fix: `functools.cached_property` for zero-argument computed attributes, a per-instance cache dict, or `lru_cache` on a module-level function taking only hashable, lightweight arguments.\n- **Mutable results**: returning a list from a cached function and letting callers `.append` to it corrupts the cache for everyone. Return tuples/frozen objects or copies.\n- **Staleness**: the cache has no notion of time or invalidation beyond `cache_clear()`. For data that changes, use a TTL cache and design explicit invalidation.\n- **Unbounded growth**: `@cache` / `maxsize=None` on functions called with many distinct arguments (like per-request IDs) grows forever.\n- **Thread safety**: the cache itself is thread-safe, but two threads may compute the same value concurrently on a miss (no single-flight).", "code": "import gc, functools, weakref\n\nclass Device:\n    def __init__(self, serial): self.serial = serial\n    @functools.lru_cache(maxsize=None)\n    def firmware_info(self, field):             # BAD: cache holds `self`\n        return f\"{self.serial}:{field}\"\n\nprobes = []\nfor i in range(1000):\n    d = Device(f\"SN{i}\")\n    d.firmware_info(\"version\")\n    probes.append(weakref.ref(d))\ndel d; gc.collect()\nprint(\"Device objects still alive:\", sum(p() is not None for p in probes), \"/ 1000\")\n\n@functools.lru_cache\ndef default_config():\n    return {\"retries\": 3}                       # mutable return value\ncfg = default_config(); cfg[\"retries\"] = 99     # a caller mutates it...\nprint(\"next caller sees:\", default_config())    # ...and poisons everyone else", "follow": ["How would you cache an expensive per-instance computation correctly? => `functools.cached_property` for zero-argument values (stored in the instance, freed with it), or a per-instance dict or `WeakKeyDictionary` keyed by instance.", "How do you cache results that expire? => A TTL cache (`cachetools.TTLCache` or a small dict of timestamps) with an explicit invalidation path when the source data changes."], "pitfall": "Adding `@lru_cache` to a method to speed up a test framework and later discovering thousands of device/session objects kept alive for the whole run.", "signals": "You explain the `self`-in-key leak and the mutable-return hazard, offer correct alternatives, and consider staleness and growth.", "module": 4, "output": "Device objects still alive: 1000 / 1000\nnext caller sees: {'retries': 99}", "num": 25}, {"type": "Trap", "level": "Principal", "question": "How do people fool themselves with micro-benchmarks in Python, and how do you benchmark properly?", "short": "Common mistakes: timing a single run, benchmarking unrealistic input sizes, including setup or I/O in the measurement, ignoring warm-up, CPU frequency scaling and noisy machines, comparing results across Python versions, and reporting means instead of minimums/distributions. Use `timeit`/`pyperf` with repeats, realistic data, isolated runs, and confirm with a profile of the real workload.", "deep": "Guidelines:\n\n- Use `timeit.repeat` (or `pyperf`, which spawns worker processes, calibrates loops and reports mean plus standard deviation). Look at the **minimum** for \"how fast can this code be\" and the distribution for variance.\n- Separate setup from the measured statement (`timeit` `setup=` argument).\n- Use realistic sizes: algorithmic differences only show at scale.\n- Warm up: the specializing interpreter and CPU caches change timings after the first iterations.\n- Control the environment: plugged-in laptop, no other heavy processes, fixed CPU frequency on benchmark machines, same Python build.\n- Beware of dead-code effects: if the result is never used, confirm the work actually happens.\n- Micro-benchmarks answer narrow questions; always validate with the end-to-end benchmark, since a 3x faster function that is 1% of runtime doesn't matter (Amdahl's law).", "code": "import timeit, statistics\n\nsetup = \"data = list(range(10_000))\"\nstmts = {\"loop append\": \"out = []\\nfor x in data: out.append(x * 2)\",\n         \"comprehension\": \"[x * 2 for x in data]\",\n         \"map + lambda\": \"list(map(lambda x: x * 2, data))\"}\nfor name, stmt in stmts.items():\n    runs = timeit.repeat(stmt, setup=setup, number=200, repeat=7)\n    per = [r / 200 * 1e6 for r in runs]\n    print(f\"{name:14} min {min(per):7.1f} us | median {statistics.median(per):7.1f} us | stdev {statistics.stdev(per):5.1f}\")", "follow": ["The comprehension is 20% faster in your benchmark. Should you rewrite 300 loops? => Only in measured hot paths; elsewhere readability wins and the end-to-end gain would be negligible.", "How do you prevent performance regressions over time? => Keep macro benchmarks on realistic data in CI (pyperf or pytest-benchmark), store results, and alert on significant regressions rather than on noise."], "pitfall": "Posting a single `time.time()` difference from a laptop in a design discussion as proof one approach is faster.", "signals": "You list the traps, use repeats and distributions, separate setup, and connect micro results to end-to-end impact.", "module": 4, "output": "loop append    min   271.6 us | median   273.5 us | stdev   1.2\ncomprehension  min   213.3 us | median   215.2 us | stdev   3.1\nmap + lambda   min   417.9 us | median   420.2 us | stdev  10.0", "num": 26}, {"type": "Design", "level": "Principal", "question": "A Python CLI in your test framework is invoked 20,000 times per CI run and each invocation takes 1.2 s to start. How do you fix it?", "short": "Measure imports with `python -X importtime`, then remove import-time work: lazy-import heavy modules inside the commands that need them, avoid work at module top level (config loading, network calls, regex compiles of huge tables), and trim dependencies. Structurally, avoid 20,000 processes: run the tool once as a long-lived service or batch mode, or call it as a library from the test process.", "deep": "Steps:\n\n1. **Measure**: `python -X importtime -c \"import mytool.cli\" 2> imports.log` shows self and cumulative microseconds per module. Tuna can visualize it.\n2. **Common culprits**: importing pandas/NumPy/requests or a large SDK at the top of a CLI that only needs them for one sub-command; plugin discovery scanning all entry points; reading and validating big config files at import; `pkg_resources` (slow, deprecated).\n3. **Fixes**: move imports into functions; module-level `__getattr__` (PEP 562) for lazy attributes; cache discovered plugins; use `importlib.metadata` instead of `pkg_resources`; precompile `.pyc` (`compileall`) on read-only installs.\n4. **Architecture**: the real win is often not starting Python 20,000 times. Offer a `--batch` mode reading many commands from stdin, a persistent daemon, or a library API the test framework calls directly.\n\nQuantify: 20,000 x 1.2 s = 6.7 hours of CPU per CI run; reducing to 0.15 s saves more than 5.8 hours.", "code": "import subprocess, sys\n\ndef import_cost(module):\n    r = subprocess.run([sys.executable, \"-X\", \"importtime\", \"-c\", f\"import {module}\"],\n                       capture_output=True, text=True)\n    rows = [l.split(\"|\") for l in r.stderr.splitlines() if l.startswith(\"import time:\") and \"|\" in l]\n    top = [r for r in rows if r[2].strip() == module]\n    return int(top[-1][1]) if top else None                     # cumulative microseconds\n\nfor m in (\"json\", \"asyncio\", \"email.mime.multipart\", \"unittest.mock\"):\n    print(f\"{m:22} {import_cost(m) / 1000:6.1f} ms cumulative import time\")\nprint(f\"x 20,000 invocations of asyncio import alone = {import_cost('asyncio') * 20_000 / 1e6 / 60:.1f} CPU-minutes\")", "follow": ["How do you stop regressions after you fix it? => A CI check that runs `python -X importtime` on the CLI entry point and fails if cumulative import time exceeds a budget, or a test asserting heavy modules aren't in `sys.modules` after importing the CLI.", "Is lazy importing always good? => It moves cost to first use and can hide import errors until runtime; keep it for heavy optional dependencies and test those code paths explicitly."], "pitfall": "Micro-optimizing the CLI's logic when 95% of its runtime is interpreter startup plus imports.", "signals": "You measure imports, name typical culprits and fixes, and step back to the architectural fix of not spawning thousands of processes, with a quantified saving.", "module": 4, "output": "json                     10.2 ms cumulative import time\nasyncio                  67.4 ms cumulative import time\nemail.mime.multipart     25.4 ms cumulative import time\nunittest.mock            80.4 ms cumulative import time\nx 20,000 invocations of asyncio import alone = 22.1 CPU-minutes", "num": 27}, {"type": "Concept", "level": "Principal", "question": "How do you process large binary buffers without copying them? Explain `memoryview` and the buffer protocol.", "short": "The buffer protocol lets objects like `bytes`, `bytearray`, `array`, `mmap` and NumPy arrays expose their raw memory. A `memoryview` is a view over that memory: slicing it creates another view, not a copy, and APIs such as `struct.unpack_from`, `socket.recv_into`, `file.readinto` and `hashlib.update` accept it. This avoids megabytes of copies when parsing or checksumming device data.", "deep": "Why it matters: slicing `bytes` (`data[4096:8192]`) allocates and copies. In a loop over a 1 GB capture that's a gigabyte of extra copying.\n\nTools:\n\n- `memoryview(buf)[a:b]`: zero-copy slice; `.cast(\"I\")` reinterprets as unsigned ints; `.release()` or a `with` block frees the export so the underlying `bytearray` can be resized again.\n- Read directly into preallocated buffers: `f.readinto(buf)`, `sock.recv_into(view)`.\n- `struct.unpack_from(fmt, buf, offset)` reads at an offset without slicing.\n- `mmap` gives a buffer backed by the file; combine with `memoryview` for random access to huge files.\n\nCaveats: a `bytearray` with active exports can't be resized; views keep the underlying object alive; endianness and alignment are your responsibility.", "code": "import os, time, zlib\n\nsector = 4096\nbuf = bytearray(os.urandom(sector * 16_384))      # 64 MiB \"disk image\"\n\nt = time.perf_counter()\ncrc_copy = [zlib.crc32(buf[i:i + sector]) for i in range(0, len(buf), sector)]   # copies each slice\nt_copy = time.perf_counter() - t\n\nview = memoryview(buf)\nt = time.perf_counter()\ncrc_view = [zlib.crc32(view[i:i + sector]) for i in range(0, len(buf), sector)]  # zero-copy slices\nt_view = time.perf_counter() - t\n\nprint(f\"slicing bytearray: {t_copy:.3f}s | memoryview: {t_view:.3f}s | identical CRCs: {crc_copy == crc_view}\")\nints = view[:16].cast(\"I\")\nprint(\"first 4 little/native u32 words:\", [hex(x) for x in ints])\nview.release()", "follow": ["Why might `buf.extend(...)` raise `BufferError` after creating a memoryview? => The bytearray can't be resized while a view exports its memory; release the view first (`view.release()` or `with memoryview(buf) as v:`).", "How do you read a 1 GB file in 1 MiB blocks without allocating a new bytes object per read? => Preallocate a `bytearray(1 << 20)` and loop with `n = f.readinto(buf)`, processing `memoryview(buf)[:n]`."], "pitfall": "Assuming `bytes` slicing is free because it \"looks like indexing\". Each slice is a new object and a memory copy.", "signals": "You explain the buffer protocol, show zero-copy slicing with measured benefit, and mention readinto/recv_into and the resize caveat.", "module": 4, "output": "slicing bytearray: 0.012s | memoryview: 0.008s | identical CRCs: True\nfirst 4 little/native u32 words: ['0x87345d2', '0x65d38ffc', '0x78cbaa1', '0x83674408']", "num": 28}, {"type": "Design", "level": "Principal", "question": "You own a 200,000-line Python test-automation codebase used by 10 teams. How do you structure it so it stays maintainable?", "short": "Split it into layers with one-way dependencies: a small **core** (runner integration, logging, config, results), a **hardware abstraction layer** (device drivers behind interfaces), reusable **test libraries** (workloads, verifiers), and **tests** that use only the libraries. Package layers separately or as a monorepo with enforced import rules, give each area an owner (CODEOWNERS), and gate changes with typing, linting and fast unit tests of the framework itself.", "deep": "Principles:\n\n- **Dependency direction**: tests -> test libraries -> HAL interfaces <- drivers; core is used by all and depends on nothing above it. Tests never import a vendor SDK directly, so swapping hardware or simulating it doesn't touch thousands of tests.\n- **Enforce, don't document**: `import-linter` contracts (layers, forbidden imports) or a small AST checker in CI. Architecture that isn't enforced erodes within months.\n- **Packaging**: separate installable packages (`acme-core`, `acme-hal`, `acme-nvme`) with semantic versions if teams release independently; a monorepo with a single lock file if they deploy together. Either way, one build and CI definition.\n- **Ownership**: CODEOWNERS per package, a small platform team owning core APIs, an RFC/ADR process for breaking changes.\n- **Quality gates**: Ruff + formatter, mypy/pyright strict on core and HAL, unit tests with simulated devices (seconds, on every PR), HIL tests nightly.\n- **Discoverability**: typed public APIs with docstrings, generated docs, examples, and a \"golden path\" template for writing new tests.\n\nMigration strategy for an existing tangle: measure the current import graph, define target layers, add the linter in \"report only\" mode, then ratchet (no new violations; fix existing ones team by team).", "code": "import ast, pathlib, tempfile, textwrap\n\nRULES = {\"tests\": {\"forbidden\": (\"vendor_sdk\", \"acme.drivers\")}}       # tests must use acme.hal only\n\ndef violations(root):\n    found = []\n    for path in root.rglob(\"*.py\"):\n        layer = path.relative_to(root).parts[0]\n        forbidden = RULES.get(layer, {}).get(\"forbidden\", ())\n        for node in ast.walk(ast.parse(path.read_text())):\n            names = [a.name for a in node.names] if isinstance(node, ast.Import) else \\\n                    [node.module] if isinstance(node, ast.ImportFrom) and node.module else []\n            for n in names:\n                if n.startswith(forbidden):\n                    found.append(f\"{path.relative_to(root).as_posix()}:{node.lineno} imports {n}\")\n    return found\n\nroot = pathlib.Path(tempfile.mkdtemp())\n(root / \"tests\").mkdir()\n(root / \"tests\" / \"test_trim.py\").write_text(textwrap.dedent(\"\"\"\n    from acme.hal import Device            # allowed: interface layer\n    import vendor_sdk                      # forbidden: bypasses the HAL\n    from acme.drivers.nvme import raw_cmd  # forbidden\n\"\"\"))\nfor v in violations(root): print(\"VIOLATION\", v)", "follow": ["Monorepo or many repositories? => Monorepo when teams change shared code together often and want atomic changes and one CI; multi-repo when components have independent release cycles and owners. For a test framework shared by 10 teams, a monorepo with per-package ownership usually wins.", "How do you introduce layering into a codebase that already violates it everywhere? => Snapshot current violations as an allowlist, fail CI only on new ones, and burn down the allowlist with owners and deadlines."], "pitfall": "A shared `utils.py` that everything imports and that imports everything: it creates cycles and makes every change risky. Split by domain and keep the core small.", "signals": "You define layers with dependency direction, enforce them automatically, cover packaging, ownership and quality gates, and give a migration path for an existing codebase.", "module": 5, "output": "VIOLATION tests/test_trim.py:3 imports vendor_sdk\nVIOLATION tests/test_trim.py:4 imports acme.drivers.nvme", "num": 29}, {"type": "Design", "level": "Principal", "question": "What is your typing strategy for a large Python codebase?", "short": "Gradual and ratcheted: type public APIs and new code first, run mypy or pyright in CI with strict settings on core packages and looser settings elsewhere, and never let coverage go backwards. Use `Protocol`s at boundaries for flexibility, precise types (`TypedDict`, `Literal`, `NewType`) for data, and runtime validation (Pydantic/attrs validators) only where untrusted data enters the system.", "deep": "Why it pays off at scale: types document contracts between teams, let IDEs navigate 200k lines, and catch whole classes of bugs (None handling, wrong argument order, renamed fields) before hardware time is wasted.\n\nPractices:\n\n- **Per-module strictness**: `[[tool.mypy.overrides]]` with `strict = true` for core/HAL; `check_untyped_defs` elsewhere to start.\n- **Ratchet**: track the number of errors or untyped functions; CI fails if it increases.\n- **Boundaries**: accept `Protocol`s (structural typing) so tests can pass fakes without inheritance; return concrete types.\n- **Data**: `TypedDict` for JSON payloads, frozen dataclasses for internal value objects, `Literal`/`Enum` for states, `NewType` for IDs that must not be mixed (`SerialNumber` vs `Lba`).\n- **Avoid `Any` leaks**: `disallow_any_generics`, wrap untyped third-party libraries in typed adapters, add stubs.\n- **Runtime validation at the edges only**: config files, API responses, CLI input. Inside the system trust the types.", "code": "from typing import Protocol, NewType, Literal, TypedDict\n\nSerialNumber = NewType(\"SerialNumber\", str)\nLba = NewType(\"Lba\", int)\nVerdict = Literal[\"PASS\", \"FAIL\", \"BLOCKED\"]\n\nclass BlockDevice(Protocol):                       # any driver or fake with these methods fits\n    serial: SerialNumber\n    def write(self, lba: Lba, data: bytes) -> None: ...\n    def read(self, lba: Lba, length: int) -> bytes: ...\n\nclass ResultRecord(TypedDict):\n    serial: SerialNumber\n    test: str\n    verdict: Verdict\n\nclass FakeDrive:                                   # no inheritance needed\n    def __init__(self, sn: str): self.serial, self._blocks = SerialNumber(sn), {}\n    def write(self, lba: Lba, data: bytes) -> None: self._blocks[lba] = data\n    def read(self, lba: Lba, length: int) -> bytes: return self._blocks.get(lba, b\"\\0\" * length)[:length]\n\ndef write_read_verify(dev: BlockDevice, lba: Lba) -> ResultRecord:\n    pattern = lba.to_bytes(8, \"little\") * 64\n    dev.write(lba, pattern)\n    ok = dev.read(lba, len(pattern)) == pattern\n    return {\"serial\": dev.serial, \"test\": \"wrv\", \"verdict\": \"PASS\" if ok else \"FAIL\"}\n\nprint(write_read_verify(FakeDrive(\"S3EVNX0K\"), Lba(2048)))", "follow": ["A team says typing slows them down. How do you respond? => Agree to start with public APIs and core packages, show bugs types caught (e.g. a `None` crash that cost a night of hardware time), keep strictness lower in exploratory test code, and invest in good stubs so the friction is low.", "mypy or pyright? => Either works; pyright is faster and powers VS Code's Pylance, mypy has more plugins (e.g. for Django/SQLAlchemy). Pick one for CI to avoid conflicting results, and let developers use whatever IDE integration they like."], "pitfall": "Annotating everything as `Any` or `dict` to silence errors. It gives false confidence while providing none of the benefit.", "signals": "You describe gradual adoption with a ratchet, Protocols at boundaries, precise data types, runtime validation only at edges, and handle the human side of adoption.", "module": 5, "output": "{'serial': 'S3EVNX0K', 'test': 'wrv', 'verdict': 'PASS'}", "num": 30}, {"type": "Concept", "level": "Principal", "question": "How do you design and evolve the public API of an internal Python library that 10 teams depend on?", "short": "Keep the public surface small and explicit (`__all__`, underscore-prefixed internals), make optional parameters **keyword-only**, return stable types, version with semantic versioning, and change things through a **deprecation cycle**: warn with `DeprecationWarning` (correct `stacklevel`), document the replacement, keep both for at least one release, and remove it in a major version. Contract tests protect consumers.", "deep": "Design rules that reduce future breaking changes:\n\n- `def run_workload(device, *, pattern=\"random\", qd=32, duration_s=60)`: keyword-only options can be added or reordered without breaking callers.\n- Accept broad input types (Protocols, `Iterable`), return specific ones.\n- Don't expose internal data structures (return copies or frozen objects).\n- Avoid module-level mutable state and import-time side effects.\n- Raise documented exception types from a library-specific hierarchy.\n\nEvolution:\n\n- **Deprecation**: `warnings.warn(msg, DeprecationWarning, stacklevel=2)` so the warning points to the caller's line; `@warnings.deprecated` (3.13+, PEP 702) also informs type checkers.\n- Make CI of consumer teams run with `-W error::DeprecationWarning` for your package so they notice early.\n- Maintain a changelog and a migration guide; offer a codemod (LibCST) for mechanical renames across repositories.", "code": "import warnings, functools\n\ndef renamed_kwarg(old, new, remove_in):\n    def deco(fn):\n        @functools.wraps(fn)\n        def wrapper(*args, **kwargs):\n            if old in kwargs:\n                warnings.warn(f\"{fn.__name__}({old}=...) is deprecated; use {new}=... \"\n                              f\"(removal in {remove_in})\", DeprecationWarning, stacklevel=2)\n                kwargs[new] = kwargs.pop(old)\n            return fn(*args, **kwargs)\n        return wrapper\n    return deco\n\n@renamed_kwarg(\"queue_depth\", \"qd\", remove_in=\"v5.0\")\ndef run_workload(device, *, pattern=\"random\", qd=32, duration_s=60):\n    return f\"{device}: {pattern} QD{qd} for {duration_s}s\"\n\nwarnings.simplefilter(\"always\")\nwith warnings.catch_warnings(record=True) as w:\n    print(run_workload(\"nvme0\", queue_depth=64))           # old caller still works\n    print(\"warning:\", w[0].message, \"| points at line\", w[0].lineno)\ntry:\n    run_workload(\"nvme0\", \"sequential\")                    # positional option: rejected\nexcept TypeError as e:\n    print(\"TypeError:\", e)", "follow": ["Why does `stacklevel=2` matter? => With the default of 1 the warning points at the library line that called `warn`, which is useless to the consumer; 2 points at the caller's code that needs changing.", "How do you find all callers across 30 repositories before removing an API? => Code search (Sourcegraph/GitHub search), usage telemetry from the deprecation warning path, and failing consumer CI when warnings are escalated to errors."], "pitfall": "Removing or renaming a function in a minor release because \"nobody uses it\", breaking another team's nightly run on hardware.", "signals": "You design for evolution (keyword-only, small surface), know the deprecation mechanics including stacklevel, and give a process for finding and migrating consumers.", "module": 5, "output": "nvme0: random QD64 for 60s\nwarning: run_workload(queue_depth=...) is deprecated; use qd=... (removal in v5.0) | points at line 21\nTypeError: run_workload() takes 1 positional argument but 2 were given", "num": 31}, {"type": "Scenario", "level": "Principal", "question": "Plan the migration of 50 internal repositories from Python 3.8 to 3.13.", "short": "Inventory first (repos, owners, dependencies, C extensions, removed stdlib modules like `distutils`, `imp`, `asynchat`), then add the new version to every CI matrix in report-only mode, fix dependencies and code with automated tools (`pyupgrade`/Ruff rules, codemods), migrate the shared libraries first, then consumers in waves with canaries, and finally drop 3.8. Track progress on a dashboard and time-box it.", "deep": "Phases:\n\n1. **Discovery**: script over all repos to collect Python versions, lock files, dependencies without wheels for 3.13, uses of removed modules (`distutils`, `imp`, `asyncore`, `asynchat`, `smtpd` removed in 3.12; `cgi`, `crypt`, `telnetlib`, `pipes` and other \"dead batteries\" removed in 3.13), and deprecated behaviours.\n2. **Foundation**: upgrade base images and CI runners; publish internal packages as multi-version wheels; update shared framework code first because everyone depends on it.\n3. **CI matrix**: add 3.13 as a non-blocking job everywhere; fix failures; make it blocking.\n4. **Automated fixes**: Ruff `UP` rules (pyupgrade), `setuptools`/`packaging` in place of `distutils`, codemods for API changes; run with `-W error::DeprecationWarning` to surface upcoming breaks.\n5. **Rollout**: migrate low-risk repos first, then critical ones with canary runs (e.g. one lab rack) and a rollback plan (keep 3.8 images for a limited time).\n6. **Close out**: remove 3.8 from CI and base images; document the next upgrade cadence (e.g. yearly, N-1 policy) so it never becomes a big bang again.", "code": "import ast, sys, pathlib, tempfile, importlib.util\n\nREMOVED = {\"distutils\": \"3.12\", \"imp\": \"3.12\", \"asynchat\": \"3.12\", \"asyncore\": \"3.12\", \"smtpd\": \"3.12\",\n           \"cgi\": \"3.13\", \"crypt\": \"3.13\", \"telnetlib\": \"3.13\", \"pipes\": \"3.13\", \"nntplib\": \"3.13\"}\n\ndef scan(repo):\n    hits = []\n    for f in repo.rglob(\"*.py\"):\n        for node in ast.walk(ast.parse(f.read_text(), filename=str(f))):\n            mods = [a.name for a in node.names] if isinstance(node, ast.Import) else \\\n                   [node.module] if isinstance(node, ast.ImportFrom) and node.module else []\n            for m in mods:\n                top = m.split(\".\")[0]\n                if top in REMOVED:\n                    hits.append(f\"{f.name}:{node.lineno} uses {top} (removed in {REMOVED[top]})\")\n    return hits\n\nrepo = pathlib.Path(tempfile.mkdtemp())\n(repo / \"setup_tools.py\").write_text(\"from distutils.version import LooseVersion\\nimport pipes, json\\n\")\n(repo / \"lab.py\").write_text(\"import telnetlib\\nimport asyncio\\n\")\nfor h in sorted(scan(repo)): print(h)\nprint(\"running on\", sys.version.split()[0], \"| telnetlib importable:\", importlib.util.find_spec(\"telnetlib\") is not None)", "follow": ["A critical dependency has no 3.13 wheel. What are your options? => Upgrade to a newer version, find a maintained fork or alternative, build and host the wheel internally, contribute the fix upstream, or isolate that component on the old interpreter behind a process/API boundary temporarily.", "How do you avoid the next migration being this painful? => An explicit support policy (e.g. support the latest two Python versions), CI testing against the next release candidate each autumn, and Renovate/Dependabot keeping dependencies current."], "pitfall": "Upgrading everything at once in one weekend, or migrating consumers before the shared framework supports the new version.", "signals": "You start with automated discovery, sequence shared code first, use CI matrices and waves with canaries and rollback, and set a policy to prevent future big-bang upgrades.", "module": 5, "output": "lab.py:1 uses telnetlib (removed in 3.13)\nsetup_tools.py:1 uses distutils (removed in 3.12)\nsetup_tools.py:2 uses pipes (removed in 3.13)\nrunning on 3.14.7 | telnetlib importable: False", "num": 32}, {"type": "Code review", "level": "Principal", "question": "Review this code from a pull request. What do you flag, in what order, and how do you phrase it?", "short": "Priority order: correctness and safety first (SQL injection, resource leak, swallowed exceptions, mutable default argument), then reliability (no timeout, no retry policy), then design (hidden global state, mixing I/O and logic), then style. Phrase comments as specific, explained suggestions with the fix, and separate blocking issues from optional nits.", "deep": "The snippet under review (shown commented out in the example):\n\n- `def save_results(results, cache={}):` mutable default: `cache` is shared across all calls.\n- `conn = sqlite3.connect(DB)` without closing, and without a transaction boundary.\n- `f\"INSERT ... VALUES ('{r['name']}', ...)\"`: SQL injection and quoting bugs (a test name with an apostrophe breaks it).\n- `except Exception: pass`: failures disappear; the nightly report silently misses results.\n- Per-row inserts instead of `executemany` in one transaction: slow.\n\nHow a Principal reviews:\n\n- Lead with a short summary (\"Two blocking issues: SQL injection and swallowed errors; the rest are suggestions\").\n- Explain why each matters with a concrete failure scenario, and propose the fix.\n- Label comments: **blocking**, **suggestion**, **nit**. Automate nits with a formatter and linter instead of commenting on them.\n- If the same issue recurs across the team, fix the system: a Ruff rule (`B006` for mutable defaults, `S608` for SQL string building, `S110`/`BLE001` for broad or silent excepts), a helper API, or a guideline.", "code": "import sqlite3, tempfile, os, logging\n\nDB = os.path.join(tempfile.mkdtemp(), \"results.db\")\nlog = logging.getLogger(\"results\")\n\n# --- BEFORE (as submitted) -------------------------------------------------\n# def save_results(results, cache={}):\n#     conn = sqlite3.connect(DB)\n#     for r in results:\n#         try:\n#             conn.execute(f\"INSERT INTO runs VALUES ('{r['name']}', '{r['verdict']}')\")\n#         except Exception:\n#             pass\n#     conn.commit()\n\n# --- AFTER -----------------------------------------------------------------\ndef save_results(results: list[dict], db_path: str = DB) -> int:\n    rows = [(r[\"name\"], r[\"verdict\"]) for r in results]\n    conn = sqlite3.connect(db_path)\n    try:\n        with conn:                                          # transaction: commit or rollback\n            conn.execute(\"CREATE TABLE IF NOT EXISTS runs (name TEXT, verdict TEXT)\")\n            conn.executemany(\"INSERT INTO runs VALUES (?, ?)\", rows)   # parameterized + batched\n    finally:\n        conn.close()                                        # sqlite3's `with` does NOT close\n    log.info(\"saved %d results\", len(rows))\n    return len(rows)\n\nn = save_results([{\"name\": \"trim_o'neil_case\", \"verdict\": \"PASS\"}, {\"name\": \"fw_update\", \"verdict\": \"FAIL\"}])\nconn = sqlite3.connect(DB)\nprint(n, \"rows saved:\", conn.execute(\"SELECT * FROM runs\").fetchall()); conn.close()", "follow": ["The author pushes back that `except Exception: pass` is needed because some results are malformed. What do you suggest? => Validate explicitly, count and log malformed records with enough context, store them in a rejects table, and fail the run if the reject rate exceeds a threshold.", "How do you keep reviews from becoming a bottleneck with 10 teams? => Automate style and common bugs in CI, keep PRs small, have clear ownership (CODEOWNERS), and use a shared checklist so reviewers focus on design and correctness."], "pitfall": "Leaving 25 comments of equal weight, mostly formatting, and missing the SQL injection. Or approving because \"it works on my machine\".", "signals": "You prioritize by impact, explain failure scenarios, propose concrete fixes (including the subtle `sqlite3` context manager not closing the connection), label severity, and turn recurring findings into automation.", "module": 5, "output": "2 rows saved: [(\"trim_o'neil_case\", 'PASS'), ('fw_update', 'FAIL')]", "num": 33}, {"type": "Design", "level": "Principal", "question": "How do you design configuration for a framework that runs in labs, CI and on developer laptops?", "short": "Layered, typed and validated: defaults in code, overridden by a config file per environment, then environment variables, then CLI flags. Load once at startup into an immutable, validated object (dataclass or Pydantic), fail fast with clear errors, keep secrets out of files (vault/env injection), and log the effective configuration (with secrets redacted) for reproducibility.", "deep": "Requirements to clarify: How many environments? Who edits config (engineers, lab admins)? Must a test run be reproducible months later?\n\nDesign:\n\n- **Precedence**: defaults < file (`lab.toml`, `ci.toml`) < environment variables (`ACME_...`) < CLI arguments. `collections.ChainMap` expresses this naturally.\n- **Schema and validation**: one typed schema (frozen dataclasses with `__post_init__` checks, or Pydantic settings). Validate types, ranges and cross-field rules at startup, reporting all errors at once.\n- **Immutability**: pass the config object down (dependency injection); no global mutable settings module that tests patch.\n- **Secrets**: from environment/secret manager, never committed; redact when logging.\n- **Reproducibility**: write the resolved config and its source for each key into the run's result bundle.\n- **Formats**: TOML (`tomllib` in stdlib) for humans; avoid executing Python files as config.", "code": "import os, tomllib\nfrom collections import ChainMap\nfrom dataclasses import dataclass, fields\n\n@dataclass(frozen=True)\nclass RunConfig:\n    lab: str\n    queue_depth: int\n    duration_s: int\n    api_token: str = \"\"\n    def __post_init__(self):\n        errors = []\n        if not 1 <= self.queue_depth <= 1024: errors.append(\"queue_depth must be 1..1024\")\n        if self.duration_s <= 0: errors.append(\"duration_s must be > 0\")\n        if errors: raise ValueError(\"; \".join(errors))\n    def redacted(self):\n        return {f.name: (\"***\" if \"token\" in f.name and getattr(self, f.name) else getattr(self, f.name)) for f in fields(self)}\n\nDEFAULTS = {\"lab\": \"local\", \"queue_depth\": 32, \"duration_s\": 60}\nfile_cfg = tomllib.loads('lab = \"bangalore-rack-7\"\\nduration_s = 3600\\n')\nos.environ[\"ACME_QUEUE_DEPTH\"] = \"128\"; os.environ[\"ACME_API_TOKEN\"] = \"s3cr3t\"\nenv_cfg = {k[5:].lower(): v for k, v in os.environ.items() if k.startswith(\"ACME_\")}\ncli_cfg = {\"duration_s\": 600}\n\nmerged = ChainMap(cli_cfg, env_cfg, file_cfg, DEFAULTS)\ntypes = {f.name: f.type for f in fields(RunConfig)}\ncfg = RunConfig(**{k: (int(v) if types[k] is int else v) for k, v in merged.items() if k in types})\nprint(\"effective:\", cfg.redacted())\nprint(\"source of duration_s:\", next(n for n, m in zip([\"cli\", \"env\", \"file\", \"defaults\"], merged.maps) if \"duration_s\" in m))\ntry:\n    RunConfig(lab=\"x\", queue_depth=0, duration_s=-1)\nexcept ValueError as e:\n    print(\"ValueError:\", e)", "follow": ["Why not just use a global `settings.py` module? => Global mutable config makes tests order-dependent (they patch it), hides dependencies, and can't represent two configurations at once (e.g. two labs in one process).", "How do you handle config for 200 devices with per-device overrides? => A device inventory (file or database) with defaults per model and per-device overrides, validated with the same schema, referenced by ID from run configs."], "pitfall": "Reading `os.environ` deep inside library functions. Configuration then becomes invisible, untestable and different on every machine.", "signals": "You define precedence, validation, immutability, secret handling and reproducibility, and relate it to testability.", "module": 5, "output": "effective: {'lab': 'bangalore-rack-7', 'queue_depth': 128, 'duration_s': 600, 'api_token': '***'}\nsource of duration_s: cli\nValueError: queue_depth must be 1..1024; duration_s must be > 0", "num": 34}, {"type": "Design", "level": "Principal", "question": "How would you build an extensible plugin system so teams can add device types and reports without editing core code?", "short": "Define a small interface (an ABC or `Protocol`) per extension point, and discover implementations through a registry: `__init_subclass__` or a decorator for in-repo plugins, and packaging **entry points** (`importlib.metadata.entry_points(group=...)`) for separately installed packages. Validate plugins at load time, version the plugin API, and isolate plugin failures so one bad plugin can't break the run.", "deep": "Design points:\n\n- **Extension points**: e.g. `acme.devices` (device drivers), `acme.reporters` (report writers), `acme.checks` (post-test validators). Each has a documented interface and API version.\n- **Discovery**: entry points declared in each plugin's `pyproject.toml`: `[project.entry-points.\"acme.reporters\"] junit = \"acme_junit:JUnitReporter\"`. The core loads them lazily by name. This is how pytest (`pytest11`) and many CLIs work.\n- **Validation**: check the class implements the interface and supports the core's plugin API version; fail with a clear message naming the plugin package.\n- **Isolation**: wrap plugin calls with error handling and timeouts; mark the plugin failed and continue; optionally run untrusted plugins in a subprocess.\n- **Configuration**: enable/disable plugins per environment; don't load everything installed blindly.\n- **Testing**: a plugin test kit (fixtures and a contract test suite) that plugin authors run in their CI.", "code": "from importlib.metadata import entry_points\n\nPLUGIN_API = 2\nREGISTRY: dict[str, type] = {}\n\ndef reporter(name):\n    def deco(cls):\n        if getattr(cls, \"api_version\", None) != PLUGIN_API:\n            raise TypeError(f\"reporter {name!r} targets API {getattr(cls, 'api_version', '?')}, core is {PLUGIN_API}\")\n        REGISTRY[name] = cls; return cls\n    return deco\n\n@reporter(\"summary\")\nclass SummaryReporter:\n    api_version = 2\n    def write(self, results): return f\"{sum(r['ok'] for r in results)}/{len(results)} passed\"\n\n@reporter(\"flaky\")\nclass BrokenReporter:\n    api_version = 2\n    def write(self, results): raise RuntimeError(\"bug in plugin\")\n\ntry:\n    @reporter(\"legacy\")\n    class OldReporter:\n        api_version = 1\nexcept TypeError as e:\n    print(\"rejected at load:\", e)\n\nfor ep in entry_points(group=\"acme.reporters\"):       # separately installed packages\n    REGISTRY.setdefault(ep.name, ep.load())\n\nresults = [{\"ok\": True}, {\"ok\": False}, {\"ok\": True}]\nfor name, cls in REGISTRY.items():\n    try:\n        print(f\"{name}: {cls().write(results)}\")\n    except Exception as e:                              # isolate plugin failures\n        print(f\"{name}: FAILED ({e}) - run continues\")", "follow": ["How do you evolve the plugin interface without breaking every plugin at once? => Version the API, support N and N-1 simultaneously via adapters, emit deprecation warnings for old plugins, and publish the contract test suite for the new version early.", "Security concern with entry points? => Loading a plugin executes its code with full privileges; only install plugins from your internal index, pin them, and review them like any dependency."], "pitfall": "Discovering plugins by importing every module in a directory at startup: slow, fragile, and one import error breaks the whole framework.", "signals": "You define extension points with versioned interfaces, use entry points for discovery, validate and isolate plugins, and provide a way for plugin authors to test against the contract.", "module": 5, "output": "rejected at load: reporter 'legacy' targets API 1, core is 2\nsummary: 2/3 passed\nflaky: FAILED (bug in plugin) - run continues", "num": 35}, {"type": "Design", "level": "Principal", "question": "Design a pytest-based validation framework for SSD firmware that runs on lab racks and in CI with simulated devices.", "short": "Build on pytest rather than inventing a runner. Model the device lifecycle as **fixtures** with the right scope (session: lab connection; module: device reserved and preconditioned; function: clean namespace), select hardware via **markers** and CLI options, parametrize over firmware/configuration matrices, collect logs on failure with a **plugin hook**, and publish structured results to a database. A HAL interface lets the same tests run against a simulator in CI.", "deep": "Architecture:\n\n- **HAL**: a `BlockDevice`/`NvmeController` protocol with a real implementation (nvme-cli, ioctl or vendor SDK) and a simulated one. Tests only see the protocol.\n- **Fixtures**: `lab` (session), `device` (module scope: reserve from a pool, format, check health, release in teardown), `namespace` (function scope). Fixture finalizers must always release hardware, even on failures.\n- **Selection**: markers such as `@pytest.mark.requires(feature=\"zns\", min_fw=\"2.1\")`; a `pytest_collection_modifyitems` hook deselects or skips tests the attached device can't run, with a clear reason.\n- **Matrices**: `pytest.mark.parametrize` or `pytest_generate_tests` for queue depths, block sizes and power-loss points; keep IDs readable (`ids=`).\n- **Evidence on failure**: a `pytest_runtest_makereport` hookwrapper that, on failure, grabs SMART logs, firmware logs, the serial console buffer and the command history, and attaches them to the result.\n- **Results**: every test emits a structured record (run ID, device serial, firmware, config, verdict, duration, artifacts) to a results service, not only JUnit XML.\n- **Timeouts and watchdogs**: per-test timeout with stack dumps, device health checks between tests, automatic quarantine of devices that fail health checks.\n- **Reproducibility**: record seeds, firmware versions, framework commit and resolved config per run.", "code": "# conftest.py (sketch of the key extension points; requires pytest)\nimport pytest\n\ndef pytest_addoption(parser):\n    parser.addoption(\"--device\", default=\"sim\", help=\"device pool name or 'sim'\")\n\n@pytest.fixture(scope=\"session\")\ndef lab(request):\n    pool = connect_pool(request.config.getoption(\"--device\"))   # real rack or simulator\n    yield pool\n    pool.close()\n\n@pytest.fixture(scope=\"module\")\ndef device(lab):\n    dev = lab.reserve(timeout_s=600)\n    dev.format(); assert dev.health().critical_warning == 0\n    yield dev\n    lab.release(dev)                                         # always runs, even on failure\n\ndef pytest_collection_modifyitems(config, items):\n    caps = current_device_capabilities(config)\n    for item in items:\n        for m in item.iter_markers(\"requires\"):\n            if not caps.supports(**m.kwargs):\n                item.add_marker(pytest.mark.skip(reason=f\"device lacks {m.kwargs}\"))\n\n@pytest.hookimpl(hookwrapper=True)\ndef pytest_runtest_makereport(item, call):\n    outcome = yield\n    report = outcome.get_result()\n    if report.when == \"call\" and report.failed and \"device\" in item.funcargs:\n        dev = item.funcargs[\"device\"]\n        report.sections.append((\"smart-log\", dev.smart_log_text()))\n        report.sections.append((\"console\", dev.console_tail(200)))", "follow": ["Why not write your own test runner? => pytest already solves discovery, fixtures, parametrization, reporting, parallelism (xdist) and has a large plugin ecosystem; a custom runner becomes a second product to maintain. Extend pytest through hooks instead.", "How do you keep hardware fixtures from leaking devices when a test crashes the process? => Reservations with leases/heartbeats in the pool service, so a dead runner's devices expire and are reclaimed; plus finalizers for normal failures."], "pitfall": "Putting device setup inside each test body. It duplicates code, is skipped on early failures, and makes cleanup unreliable. Use fixtures with finalizers.", "signals": "You separate HAL from tests, use fixture scopes deliberately, select tests by capability, collect evidence automatically on failure, and store structured results with reproducibility metadata.", "module": 6, "output": "", "num": 36}, {"type": "Scenario", "level": "Principal", "question": "Your 10,000-test nightly suite has a 4% flaky failure rate and engineers have stopped trusting it. What do you do?", "short": "Treat flakiness as a measurable defect: record every result with its history, compute a per-test flake rate (fails, then passes on unchanged code and firmware), quarantine the worst offenders out of the gating set (visible, owned, with deadlines), fix root causes by category (timing assumptions, order dependence, shared state, environment and hardware issues), and only allow automatic retries if every retry is recorded.", "deep": "Steps:\n\n1. **Measure**: store results per (test, commit, firmware, device). A test is flaky if it both passed and failed for the same inputs. Rank by flake rate x runtime x number of teams affected.\n2. **Restore trust quickly**: move the top flaky tests to a non-gating \"quarantine\" job. Each quarantined test gets an owner and a ticket; quarantine is time-limited.\n3. **Fix root causes** by category (listed below).\n4. **Tooling**: run tests in random order (`pytest-randomly`), re-run the same test many times (`pytest --count` / a stress job), capture complete evidence on first failure.\n5. **Policy**: retries are allowed only when the retry and first failure are both reported, so intermittent product bugs remain visible.\n6. **Track the trend** weekly: flake rate, quarantine size, mean time to fix.\n\nRoot-cause categories in hardware validation:\n\n- fixed `sleep()` instead of polling for a condition with a timeout\n- order dependence and shared state (global caches, a device left in a non-default state)\n- resource contention (two tests on one device, thermal throttling, lab network)\n- nondeterministic data (unseeded random workloads)\n- real intermittent firmware bugs, which must not be hidden by retries", "code": "from collections import defaultdict\n\n# (test, firmware, commit, verdict) history from the results database\nhistory = [\n    (\"test_trim_basic\", \"2.1.7\", \"a1f\", \"PASS\"), (\"test_trim_basic\", \"2.1.7\", \"a1f\", \"FAIL\"),\n    (\"test_trim_basic\", \"2.1.7\", \"a1f\", \"PASS\"), (\"test_pwr_loss_qd32\", \"2.1.7\", \"a1f\", \"FAIL\"),\n    (\"test_pwr_loss_qd32\", \"2.1.7\", \"a1f\", \"FAIL\"), (\"test_smart_temp\", \"2.1.7\", \"a1f\", \"PASS\"),\n    (\"test_smart_temp\", \"2.1.7\", \"b22\", \"PASS\"), (\"test_fw_download\", \"2.1.7\", \"a1f\", \"PASS\"),\n    (\"test_fw_download\", \"2.1.7\", \"a1f\", \"FAIL\"), (\"test_fw_download\", \"2.1.7\", \"a1f\", \"PASS\"),\n    (\"test_fw_download\", \"2.1.7\", \"a1f\", \"PASS\"),\n]\ngroups = defaultdict(list)\nfor test, fw, commit, verdict in history:\n    groups[(test, fw, commit)].append(verdict)\n\nreport = defaultdict(lambda: [0, 0])                  # test -> [flaky groups, total runs]\nfor (test, *_), verdicts in groups.items():\n    report[test][1] += len(verdicts)\n    if len(set(verdicts)) > 1:                        # same inputs, different outcomes\n        report[test][0] += 1\nfor test, (flaky, runs) in sorted(report.items(), key=lambda kv: -kv[1][0]):\n    label = \"FLAKY -> quarantine + owner\" if flaky else (\"consistent\" if runs else \"\")\n    print(f\"{test:22} runs={runs}  {label}\")\nprint(\"note: test_pwr_loss_qd32 fails consistently: a real bug, not flakiness\")", "follow": ["A team wants `--reruns 3` on everything to make the dashboard green. How do you respond? => Reruns hide intermittent firmware bugs, which are exactly what validation exists to find. Allow reruns only with full reporting of first failures and a flake budget, and never on tests whose failures could be product defects without triage.", "How do you replace `time.sleep(5)` waits for the device? => Poll the actual condition (controller ready bit, namespace visible, log entry present) with a timeout and backoff, and report what was observed when the timeout expires."], "pitfall": "Blanket automatic retries. They turn a 4% flake rate into a green dashboard that hides real intermittent firmware defects.", "signals": "You quantify flakiness with history, restore trust with an owned quarantine, fix by root-cause category, distinguish flaky tests from intermittent product bugs, and set a retry policy that preserves evidence.", "module": 6, "output": "test_trim_basic        runs=3  FLAKY -> quarantine + owner\ntest_fw_download       runs=4  FLAKY -> quarantine + owner\ntest_pwr_loss_qd32     runs=2  consistent\ntest_smart_temp        runs=2  consistent\nnote: test_pwr_loss_qd32 fails consistently: a real bug, not flakiness", "num": 37}, {"type": "Design", "level": "Principal", "question": "How do you run a hardware test suite in parallel across a pool of 64 devices?", "short": "Use a scheduler that treats devices as leased resources: workers (pytest-xdist or a custom dispatcher) acquire a device matching the test's requirements from a pool service with leases and heartbeats, run the test, return the device after health checks, and quarantine devices that fail them. Group tests by required capability and duration to keep devices busy, and make results traceable to the exact device serial.", "deep": "Considerations:\n\n- **Allocation**: a central pool (a small service or DB table with atomic reservation) rather than each worker guessing. Leases expire if a worker dies, so devices never stay locked forever. Locally, file locks (`O_CREAT|O_EXCL`) work for a single host.\n- **Worker model**: `pytest -n 64 --dist loadgroup` with an `xdist_group` per device class, or a dispatcher that sends test IDs to per-device workers. Each worker's session fixture binds to one device (`worker_id` from xdist).\n- **Scheduling**: longest tests first reduces the tail; tests with rare capability requirements shouldn't wait behind common ones; don't co-schedule tests that share a host bus if they interfere.\n- **Isolation**: reset state between tests (format, reset controller, verify default feature settings); health check before handing to the next test.\n- **Failure handling**: a device that fails health checks is quarantined, not retried endlessly; the test is marked \"BLOCKED: infrastructure\", not FAIL.\n- **Observability**: pool utilization, queue wait per capability, device health trends.", "code": "import os, tempfile, threading, time, random, contextlib\n\nclass DevicePool:\n    \"\"\"Single-host pool using atomic lock files (O_EXCL) as leases.\"\"\"\n    def __init__(self, serials, lock_dir):\n        self.serials, self.lock_dir = serials, lock_dir\n    @contextlib.contextmanager\n    def lease(self, timeout=5.0):\n        deadline = time.monotonic() + timeout\n        while time.monotonic() < deadline:\n            for sn in self.serials:\n                path = os.path.join(self.lock_dir, sn + \".lock\")\n                try:\n                    fd = os.open(path, os.O_CREAT | os.O_EXCL | os.O_WRONLY)   # atomic claim\n                except FileExistsError:\n                    continue\n                os.write(fd, str(os.getpid()).encode()); os.close(fd)\n                try:\n                    yield sn\n                finally:\n                    os.remove(path)                                            # release\n                return\n            time.sleep(0.005)\n        raise TimeoutError(\"no device available\")\n\npool = DevicePool([f\"SN{i:03}\" for i in range(4)], tempfile.mkdtemp())\nusage, lock, active, peak = {}, threading.Lock(), [0], [0]\ndef run_test(name):\n    with pool.lease() as sn:\n        with lock: active[0] += 1; peak[0] = max(peak[0], active[0]); usage.setdefault(sn, []).append(name)\n        time.sleep(random.uniform(0.01, 0.03))\n        with lock: active[0] -= 1\n\nrandom.seed(0)\nthreads = [threading.Thread(target=run_test, args=(f\"t{i}\",)) for i in range(20)]\n[t.start() for t in threads]; [t.join() for t in threads]\nprint(\"tests per device:\", {sn: len(v) for sn, v in sorted(usage.items())}, \"| peak concurrent:\", peak[0], \"(4 devices)\")", "follow": ["How do you make the pool work across 10 lab hosts? => Move reservation to a shared service or database with an atomic `UPDATE ... WHERE state='free'` or Redis `SET NX PX`, leases with expiry, and heartbeats from the worker.", "How do you reduce total wall time when test durations vary from 1 minute to 6 hours? => Schedule longest-first, split very long tests into checkpointed phases if possible, and track historical durations to predict the critical path."], "pitfall": "Letting each test pick a device by index (`devices[worker_id]`). One dead device then fails every test assigned to that worker, and nothing is rebalanced.", "signals": "You treat devices as leased resources with expiry, match capabilities, schedule for utilization, isolate state between tests, and distinguish infrastructure failures from test failures.", "module": 6, "output": "tests per device: {'SN000': 5, 'SN001': 5, 'SN002': 5, 'SN003': 5} | peak concurrent: 4 (4 devices)", "num": 38}, {"type": "Debug", "level": "Principal", "question": "A test passes when run alone but fails when run as part of the full suite. How do you find the cause?", "short": "It's test pollution: some earlier test leaves state behind. Find the polluter by bisection (run the victim with halves of the preceding tests until one culprit remains; tools like `detect-test-pollution` automate it), then look for shared state: module-level caches, globals patched and not restored, environment variables, current directory, singletons, leftover device configuration, or fixtures with too-wide scope.", "deep": "Procedure:\n\n1. Reproduce deterministically: note the exact order (`pytest -p no:randomly` or the seed used), then confirm the victim passes alone.\n2. **Bisect** the tests that ran before it: run `[first half] + victim`; if it fails, the polluter is in that half; repeat. That's log2(N) runs.\n3. Inspect the polluter for shared state (list below).\n4. Fix at the source: use `monkeypatch`, context managers, fresh objects per test, and teardown that restores device defaults. Then run the suite in random order in CI to prevent regressions.\n\nTypical polluters:\n\n- mutation of module globals or class attributes (`Config.retries = 0`)\n- `unittest.mock.patch` started with `.start()` but never stopped\n- `os.environ` / `os.chdir` / `sys.path` changes\n- caches (`lru_cache`) holding state across tests\n- fixtures with `scope=\"module\"`/`\"session\"` whose object is mutated by a test\n- on hardware: device features (write cache, power state, namespace layout) left non-default", "code": "import unittest, functools\n\nclass DeviceSettings:                    # module-level shared state (the hazard)\n    write_cache = True\n\n@functools.lru_cache\ndef default_timeout(): return 30\n\nclass TestA(unittest.TestCase):\n    def test_disable_cache(self):\n        DeviceSettings.write_cache = False           # polluter: never restored\n        self.assertFalse(DeviceSettings.write_cache)\n\nclass TestB(unittest.TestCase):\n    def test_perf_expects_cache_on(self):\n        self.assertTrue(DeviceSettings.write_cache, \"write cache unexpectedly disabled\")\n\ndef run(*cases):\n    suite = unittest.TestSuite(cases)\n    r = unittest.TestResult(); suite.run(r)\n    return \"PASS\" if r.wasSuccessful() else \"FAIL\"\n\nvictim = TestB(\"test_perf_expects_cache_on\")\nprint(\"victim alone     :\", run(TestB(\"test_perf_expects_cache_on\")))\nDeviceSettings.write_cache = True\nprint(\"after TestA      :\", run(TestA(\"test_disable_cache\"), victim))\nDeviceSettings.write_cache = True\n\nclass TestAFixed(unittest.TestCase):\n    def test_disable_cache(self):\n        self.addCleanup(setattr, DeviceSettings, \"write_cache\", DeviceSettings.write_cache)   # restore\n        DeviceSettings.write_cache = False\nprint(\"after fixed TestA:\", run(TestAFixed(\"test_disable_cache\"), TestB(\"test_perf_expects_cache_on\")))", "follow": ["How do you prevent this class of bug across a big suite? => Random test ordering in CI, a fixture that snapshots and verifies global state (env, cwd, key module attributes) before and after each test, and banning module-level mutable state in test code via review and linters.", "What's the hardware equivalent? => A post-test fixture that checks and restores device defaults (features, power state, namespaces) and fails loudly naming the test that changed them."], "pitfall": "Marking the victim test as flaky or reordering tests so it runs first. The polluter keeps corrupting other tests silently.", "signals": "You recognise pollution, bisect systematically, list concrete shared-state sources including hardware state, and prevent recurrence with random ordering and state guards.", "module": 6, "output": "victim alone     : PASS\nafter TestA      : FAIL\nafter fixed TestA: PASS", "num": 39}, {"type": "Concept", "level": "Principal", "question": "How do you make randomized stress tests reproducible?", "short": "Generate all randomness from an explicit seed that is recorded with the result: use a dedicated `random.Random(seed)` instance (not the global module state), derive per-device or per-thread seeds deterministically from a master seed, log the seed on failure, and provide a replay command. For data patterns, make them a pure function of (seed, LBA) so any block can be regenerated and verified independently.", "deep": "Why a dedicated instance: the global `random` module is shared by every library in the process; any extra call shifts the sequence and breaks replay. `random.Random(seed)` isolates it.\n\nDeriving seeds: `master_seed` for the run, then `hash((master_seed, device_serial, iteration))` via a stable hash (e.g. `hashlib.blake2b`), because Python's built-in `hash()` of strings is randomized per process (PYTHONHASHSEED).\n\nData patterns: a pattern function `block(seed, lba)` lets the verifier recompute expected data without storing what was written, which scales to terabytes. Embedding the LBA and a write sequence number in each block also detects misdirected or stale writes.\n\nWorkflow: every failure report shows `--seed=...` and the exact configuration, so an engineer can replay the same sequence on the bench. Property-based testing (Hypothesis) complements this by shrinking failing inputs to minimal cases.", "code": "import hashlib, random\n\ndef derive_seed(master, *parts):\n    h = hashlib.blake2b(repr((master,) + parts).encode(), digest_size=8)\n    return int.from_bytes(h.digest(), \"little\")          # stable across processes and machines\n\ndef workload(master, serial, n=5):\n    rng = random.Random(derive_seed(master, serial))       # isolated generator\n    return [(rng.choice([\"read\", \"write\", \"trim\"]), rng.randrange(0, 1 << 20), rng.choice([4096, 131072])) for _ in range(n)]\n\ndef block(seed, lba, size=16):                            # data = pure function of (seed, lba)\n    return hashlib.blake2b(f\"{seed}:{lba}\".encode(), digest_size=size).digest()\n\nMASTER = 20260928\nfirst = workload(MASTER, \"SN001\")\nreplay = workload(MASTER, \"SN001\")\nprint(\"replay identical:\", first == replay)\nprint(\"per-device streams differ:\", workload(MASTER, \"SN001\") != workload(MASTER, \"SN002\"))\nprint(first[:2])\nwritten = block(MASTER, 4096)\nprint(\"verify without storing expected data:\", block(MASTER, 4096) == written)\nprint(f\"on failure print: pytest tests/stress --seed={MASTER} --device=SN001\")", "follow": ["Why not use `hash((seed, serial))` to derive seeds? => String hashing is randomized per process (PYTHONHASHSEED), so the derived seed changes between runs; use a stable hash like BLAKE2 or SHA-256.", "How do you reproduce a failure that depends on thread timing, not just random data? => Record the operation log with timestamps and ordering, replay it deterministically in a single thread first, and use stress runs with many seeds to reproduce timing issues statistically."], "pitfall": "Calling `random.seed(42)` at the top of a test and assuming reproducibility, while other code (libraries, fixtures) also consumes the global generator.", "signals": "You isolate generators, derive seeds stably, record them for replay, and use seed-derived data patterns for scalable verification.", "module": 6, "output": "replay identical: True\nper-device streams differ: True\n[('trim', 58568, 131072), ('write', 519029, 131072)]\nverify without storing expected data: True\non failure print: pytest tests/stress --seed=20260928 --device=SN001", "num": 40}, {"type": "Scenario", "level": "Principal", "question": "How do you test the test framework itself?", "short": "Treat it as production software: unit tests for framework logic with **simulated devices** (fast, run on every PR), contract tests proving the simulator and real drivers behave the same f
